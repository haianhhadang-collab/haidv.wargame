ân', chứ không phải 'quan nhân dân để đè đầu cưỡi cổ nhân dân'\". Cụm từ \"Quan cách mạng\" là cụm từ tương ứng trong danh sách gợi ý.","oTrong":2},{"loai":"dien","dang":"Điền khuyết: chọn từ cho từng chỗ trống","q":"Hồ Chí Minh nhấn mạnh rằng, \"Hiểu chủ nghĩa Mác - Lênin là phải '(1)'. Nếu thuộc bao nhiêu sách mà sống không có tình có nghĩa thì sao gọi là hiểu chủ nghĩa Mác - Lênin được\".","goiy":"Đoạn nói về mối liên hệ giữa việc hiểu chủ nghĩa Mác-Lênin và đạo lý làm người. Chọn từ phù hợp từ Danh sách từ gợi ý.","pa":[{"k":"A","t":"Đầy tớ"},{"k":"B","t":"Chủ nhân"},{"k":"C","t":"Sống có tình có nghĩa"},{"k":"D","t":"Quan cách mạng"},{"k":"E","t":"Chí công vô tư"},{"k":"F","t":"Tiết kiệm"},{"k":"G","t":"Bủn xỉn"},{"k":"H","t":"Độc lập dân tộc"},{"k":"I","t":"Yêu nước"},{"k":"J","t":"Kế thừa"}],"dung":["C"],"gt":"Tài liệu ghi rõ: \"Theo Hồ Chí Minh, 'hiểu chủ nghĩa Mác - Lênin là phải sống với nhau có tình có nghĩa. Nếu thuộc bao nhiêu sách mà sống không có tình có nghĩa thì sao gọi là hiểu chủ nghĩa Mác - Lênin được'\".","oTrong":1},{"loai":"dien","dang":"Điền khuyết: chọn từ cho từng chỗ trống","q":"Hồ Chí Minh phân biệt rõ ràng giữa \"Kiệm\" và \"(1)\". Người cho rằng, việc đáng tiêu mà không tiêu, vì lợi ích chung, thì không phải là kiệm mà là hành động của một người \"(2)\".","goiy":"Đoạn văn làm rõ sự khác biệt giữa tiết kiệm và một thái độ tiêu cực tương tự. Chọn từ phù hợp từ Danh sách từ gợi ý.","pa":[{"k":"A","t":"Đầy tớ"},{"k":"B","t":"Chủ nhân"},{"k":"C","t":"Sống có tình có nghĩa"},{"k":"D","t":"Quan cách mạng"},{"k":"E","t":"Chí công vô tư"},{"k":"F","t":"Tiết kiệm"},{"k":"G","t":"Bủn xỉn"},{"k":"H","t":"Độc lập dân tộc"},{"k":"I","t":"Yêu nước"},{"k":"J","t":"Kế thừa"}],"dung":["G","G"],"gt":"Tài liệu giải thích: \"Tiết kiệm không phải là bủn xỉn... Việc đáng tiêu mà không tiêu, là bủn xỉn, chứ không phải là kiệm.\"","oTrong":2},{"loai":"dien","dang":"Điền khuyết: chọn từ cho từng chỗ trống","q":"Tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh không những \"(1)\" giá trị yêu nước truyền thống của dân tộc, mà còn vượt qua những hạn chế của truyền thống đó, tạo nên một cuộc cách mạng sâu sắc.","goiy":"Đoạn văn nói về cách Hồ Chí Minh xử lý các giá trị truyền thống. Chọn từ phù hợp từ Danh sách từ gợi ý.","pa":[{"k":"A","t":"Đầy tớ"},{"k":"B","t":"Chủ nhân"},{"k":"C","t":"Sống có tình có nghĩa"},{"k":"D","t":"Quan cách mạng"},{"k":"E","t":"Chí công vô tư"},{"k":"F","t":"Tiết kiệm"},{"k":"G","t":"Bủn xỉn"},{"k":"H","t":"Độc lập dân tộc"},{"k":"I","t":"Yêu nước"},{"k":"J","t":"Kế thừa"}],"dung":["J"],"gt":"Tài liệu viết: \"Tư tưởng 'trung với nước, hiếu với dân' của Hồ Chí Minh không những kế thừa giá trị yêu nước truyền thống của dân tộc, mà còn vượt qua những hạn chế của truyền thống đó...\".","oTrong":1}]},{"ma":"14","ten":"Vai trò và nguyên tắc xây dựng đạo đức cách mạng","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Theo Hồ Chí Minh, đạo đức là tiêu chuẩn duy nhất và tuyệt đối để đánh giá sự thành công của một người cách mạng, vì \"không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\".","goiy":"Tập trung vào cách Hồ Chí Minh đặt mối quan hệ giữa đạo đức và tài năng. Có phải đạo đức là yếu tố \"duy nhất\" và \"tuyệt đối\" không, hay còn có sự kết hợp nào khác được Người nhắc đến?","pa":[{"k":"A","t":"Đúng — Tuyên bố trên phản ánh đúng quan điểm tuyệt đối"},{"k":"B","t":"Sai — Đạo đức là gốc nhưng cần phải kết hợp với tài năng"}],"dung":["B"],"gt":"Tài liệu khẳng định đạo đức là \"tiêu chuẩn hàng đầu\", \"gốc\", \"nền tảng\" và \"rất quan trọng\" của người cách mạng, thậm chí \"không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\". Tuy nhiên, Người cũng nhấn mạnh rằng \"Đức và tài phải là những phẩm chất thống nhất của con người\" và \"nếu thiếu tài thì làm việc gì cũng khó\". Do đó, việc nói đạo đức là \"duy nhất và tuyệt đối\" là sai, vì bỏ qua vai trò quan trọng của tài năng khi gắn liền với đạo đức."},{"loai":"mot","dang":"Đúng hay sai","q":"Nguyên tắc \"nói đi đôi với làm\" được Hồ Chí Minh coi là đặc trưng bản chất của tư tưởng đạo đức và chủ yếu áp dụng cho cán bộ, đảng viên để làm gương cho quần chúng, không phải là yêu cầu phổ quát cho mọi người.","goiy":"Đọc kỹ phần giải thích về \"Nói đi đôi với làm\" và đối tượng mà Hồ Chí Minh hướng tới khi đề cập nguyên tắc này. Có sự giới hạn đối tượng chính yếu nào không?","pa":[{"k":"A","t":"Đúng — Nguyên tắc này chủ yếu áp dụng riêng cho cán bộ"},{"k":"B","t":"Sai — Nguyên tắc này mang tính phổ quát chung cho mọi người"}],"dung":["B"],"gt":"Tài liệu khẳng định \"Nói đi đôi với làm\" là \"đặc trưng bản chất của tư tưởng đạo đức Hồ Chí Minh\". Người đã \"giáo dục mọi người và chính Người đã thực hiện điều đó một cách nghiêm túc và đầy đủ nhất\". Mặc dù Người có nhấn mạnh \"đảng viên đi trước, làng nước theo sau\" và cán bộ, đảng viên cần \"làm gương\", nhưng việc coi nó \"chủ yếu áp dụng\" cho cán bộ, đảng viên là chưa chính xác vì nó là một đặc trưng tổng thể, một nguyên tắc chung cho \"mọi người\"."},{"loai":"mot","dang":"Đúng hay sai","q":"Trong nguyên tắc \"xây đi đôi với chống\", Hồ Chí Minh chủ trương phải tập trung loại bỏ hoàn toàn các hành vi vô đạo đức trước, sau đó mới tiến hành xây dựng các giá trị đạo đức mới để đảm bảo sự trong sạch.","goiy":"Phân tích mối quan hệ giữa \"xây\" và \"chống\" được Hồ Chí Minh đề cập, đặc biệt là mục đích và tính ưu tiên của từng vế.","pa":[{"k":"A","t":"Đúng — Tập trung chống cái xấu trước rồi mới tiến hành xây"},{"k":"B","t":"Sai — Xây dựng luôn đi đôi với chống và lấy xây làm chính"}],"dung":["B"],"gt":"Tài liệu chỉ rõ: \"Xây phải đi đôi với chống, muốn xây phải chống, chống nhằm mục đích xây, lấy xây làm chính\". Điều này có nghĩa là xây dựng các giá trị đạo đức mới là mục tiêu hàng đầu, và việc chống lại cái xấu là để phục vụ cho mục tiêu xây. Việc tập trung loại bỏ \"hoàn toàn trước\" và \"sau đó mới tiến hành xây dựng\" là không phản ánh đúng tinh thần \"xây đi đôi với chống\" và nguyên tắc \"lấy xây làm chính\" của Hồ Chí Minh."},{"loai":"mot","dang":"Đúng hay sai","q":"Mặc dù tu dưỡng đạo đức là một quá trình liên tục, nhưng Hồ Chí Minh đặc biệt nhấn mạnh tầm quan trọng của việc tu dưỡng trong tuổi trẻ, coi đó là giai đoạn quyết định và cần ưu tiên hàng đầu, trong khi các giai đoạn sau có thể giảm bớt sự khắt khe.","goiy":"Đọc kỹ phần \"Tu dưỡng đạo đức suốt đời\", đặc biệt là những cảnh báo của Người về sự thoái hóa nếu không kiên trì.","pa":[{"k":"A","t":"Đúng — Tuổi trẻ là quyết định, về sau có thể giảm bớt"},{"k":"B","t":"Sai — Rèn luyện tu dưỡng phải là quá trình liên tục suốt đời"}],"dung":["B"],"gt":"Tài liệu nêu rõ \"phải kiên trì rèn luyện liên tục, tu dưỡng suốt đời, trong đó, thời tuổi trẻ đặc biệt quan trọng\". Tuy nhiên, Người cũng cảnh báo \"Nếu không kiên trì rèn luyện, thì ở thời kỳ trước là người có công, nhưng thời kỳ sau có thể lại là người có tội, lúc trẻ giữ được đạo đức, nhưng lúc già lại thoái hóa biến chất, hư hỏng\". Điều này khẳng định sự tu dưỡng phải liên tục, không có giai đoạn nào có thể giảm bớt sự khắt khe, mà là một quá trình \"trường kỳ, gian khổ\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Luận điểm \"Nếu không có đạo đức cách mạng thì có tài cũng vô dụng\" của Hồ Chí Minh hàm ý sâu sắc nhất điều gì về mối quan hệ giữa đạo đức và tài năng của người cách mạng?","goiy":"Tập trung vào ý nghĩa của từ \"vô dụng\" và \"có hại\" khi thiếu đạo đức, và sự cần thiết của sự thống nhất giữa đức và tài được Hồ Chí Minh nhấn mạnh.","pa":[{"k":"A","t":"Đạo đức là yếu tố duy nhất quyết định và có thể thay thế tài năng ở mọi lĩnh vực."},{"k":"B","t":"Người có tài năng nhưng thiếu đạo đức thì chỉ có thể hoàn thành những công việc nhỏ."},{"k":"C","t":"Người cách mạng cần tập trung ưu tiên rèn tài năng trước rồi mới trau dồi đạo đức."},{"k":"D","t":"Đạo đức và tài năng là hai yếu tố hoàn toàn tách biệt, không hề tác động lẫn nhau."},{"k":"E","t":"Tài năng chỉ phát huy giá trị tích cực khi có đạo đức cách mạng làm nền tảng định hướng."}],"dung":["E"],"gt":"Tài liệu khẳng định \"Nếu không có đạo đức cách mạng thì có tài cũng vô dụng\" và \"thiếu đạo đức thì vô dụng, thậm chí có hại\". Đồng thời, \"đạo đức là gốc, là nền tảng của người cách mạng\", \"tài năng phải gắn chặt và đặt vững trên nền tảng đạo đức\". Điều này cho thấy tài năng cần đạo đức để có mục đích, định hướng đúng đắn và phát huy giá trị tích cực, tránh gây hại, chứ không phải tách biệt hay thay thế."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Khi Hồ Chí Minh ví \"Đạo đức là gốc\" của cây, điều này có ý nghĩa sâu xa nhất là gì đối với người cách mạng?","goiy":"Liên hệ hình ảnh \"gốc của cây\" với những hệ quả được mô tả khi người cách mạng có hoặc không có đạo đức trong các tác phẩm của Người.","pa":[{"k":"A","t":"Đạo đức là yếu tố duy nhất quyết định mọi thành công của người cán bộ cách mạng."},{"k":"B","t":"Đạo đức chỉ cần tập trung quan tâm trong giai đoạn đầu của sự nghiệp cách mạng."},{"k":"C","t":"Đạo đức là nền tảng vững chắc quyết định sự tồn tại và năng lực lãnh đạo quần chúng."},{"k":"D","t":"Người cách mạng chỉ cần có phẩm chất đạo đức mà không cần phải có tài năng xuất chúng."},{"k":"E","t":"Đạo đức là phẩm chất tự nhiên tự hình thành ở mỗi người mà không cần trải qua rèn luyện."}],"dung":["C"],"gt":"Tài liệu ví \"Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\". Điều này cho thấy đạo đức không chỉ là nền tảng cho sự tồn tại (\"không có gốc thì cây héo\") mà còn quyết định khả năng lãnh đạo, tức là sự phát triển và ảnh hưởng của người cách mạng. Các phương án khác không phản ánh đúng hoặc làm sai lệch ý nghĩa này."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Luận điểm \"Đấu tranh chống chủ nghĩa cá nhân không phải là “giày xéo lên lợi ích cá nhân”\" của Hồ Chí Minh hàm ý điều gì?","goiy":"Phân tích ý nghĩa của \"không phải là giày xéo lên lợi ích cá nhân\" trong ngữ cảnh đấu tranh chống chủ nghĩa cá nhân và nguyên nhân của tệ nạn được Người chỉ ra.","pa":[{"k":"A","t":"Chủ nghĩa cá nhân hoàn toàn không chứa đựng bất kỳ quyền lợi nào đáng được bảo vệ."},{"k":"B","t":"Việc chống chủ nghĩa cá nhân nhằm phủ nhận triệt để tất cả quyền lợi của cá nhân."},{"k":"C","t":"Chủ nghĩa cá nhân chỉ gây hại khi phát triển quá mức và chỉ cần kiểm soát nhẹ nhàng."},{"k":"D","t":"Lợi ích cá nhân là vấn đề không liên quan đến đạo đức và không cần cân nhắc đến."},{"k":"E","t":"Chống chủ nghĩa cá nhân là loại bỏ tư lợi ích kỷ, nhưng vẫn tôn trọng lợi ích chính đáng."}],"dung":["E"],"gt":"Tài liệu khẳng định \"Tài liệu gốc của mọi thứ tệ nạn là chủ nghĩa cá nhân\" và \"Phải kiên quyết quét sạch chủ nghĩa cá nhân, nâng cao đạo đức cách mạng\". Tuy nhiên, Người cũng lưu ý: \"Đấu tranh chống chủ nghĩa cá nhân không phải là 'giày xéo lên lợi ích cá nhân'\". Điều này cho thấy mục đích của việc chống chủ nghĩa cá nhân là loại bỏ những hành vi tiêu cực, ích kỷ, tư lợi gây hại cho tập thể, chứ không phải phủ nhận hay bác bỏ những lợi ích hợp pháp, chính đáng của cá nhân."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, ý nghĩa sâu sắc nhất của việc cán bộ, đảng viên \"làm gương\" về đạo đức là gì?","goiy":"Tập trung vào câu \"một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền\" và các mục đích của việc nêu gương được Hồ Chí Minh chỉ ra.","pa":[{"k":"A","t":"Đơn thuần là tuân thủ các quy định của Đảng và Nhà nước về đạo đức để tránh bị kỷ luật."},{"k":"B","t":"Chứng minh quyền lực và uy tín của Đảng trước quần chúng nhân dân bằng sự uy nghi."},{"k":"C","t":"Chỉ cần làm gương trong những sự kiện lớn hoặc các hoàn cảnh có tầm quan trọng đặc biệt."},{"k":"D","t":"Mục đích cốt lõi nhất là để giữ gìn hình ảnh và danh dự cá nhân cho người cán bộ."},{"k":"E","t":"Là phương pháp giáo dục đạo đức hiệu quả nhất cho nhân dân và để tự giáo dục bản thân."}],"dung":["E"],"gt":"Tài liệu nhấn mạnh \"Sự gương mẫu của cán bộ, đảng viên trong lời nói và việc làm không chỉ là cách thức để giáo dục đạo đức cho quần chúng, mà còn là một phương pháp để tự giáo dục bản thân mình\". Đặc biệt, Người nói \"Đối với họ một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền\". Điều này cho thấy nêu gương là một phương pháp giáo dục mạnh mẽ, cả cho người khác và cho chính mình."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG phản ánh đúng quan điểm của Hồ Chí Minh về bản chất và quá trình rèn luyện đạo đức cách mạng?","goiy":"Đọc kỹ quan điểm của Hồ Chí Minh về sự tồn tại của \"thiện và ác\" trong lòng mỗi con người và quá trình rèn luyện đạo đức.","pa":[{"k":"A","t":"Đạo đức cách mạng là chỗ dựa giúp con người đứng vững trong mọi gian nan thử thách."},{"k":"B","t":"Đạo đức cách mạng thể hiện tính nhân đạo chiến đấu vì mục tiêu sự nghiệp cách mạng."},{"k":"C","t":"Đạo đức cách mạng không phải tự nhiên có sẵn mà phải thông qua đấu tranh rèn luyện."},{"k":"D","t":"Đạo đức cách mạng đòi hỏi người cách mạng phải loại bỏ hoàn toàn mọi ý nghĩ thiện và ác."},{"k":"E","t":"Đạo đức cách mạng là đạo đức trong hành động, lấy hiệu quả thực tế làm thước đo."}],"dung":["D"],"gt":"Tài liệu rõ ràng nêu: \"Mỗi con người đều có thiện và ác ở trong lòng. Ta phải biết làm cho phần tốt ở trong mỗi con người nảy nở như hoa mùa Xuân và phần xấu bị mất dần đi, đó là thái độ của người cách mạng\". Điều này chứng tỏ Hồ Chí Minh không đòi hỏi sự loại bỏ \"hoàn toàn mọi ý nghĩ thiện và ác\" mà là quá trình đấu tranh nội tâm để phát huy cái tốt, loại bỏ cái xấu. Do đó, nhận định D là sai."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phát biểu nào sau đây KHÔNG phản ánh đúng quan điểm của Hồ Chí Minh về việc giáo dục \"đức\" và \"tài\" trong sự nghiệp cách mạng?","goiy":"So sánh mức độ ưu tiên giữa \"đức\" và \"tài\" được Hồ Chí Minh nhấn mạnh trong việc giáo dục và thực hành.","pa":[{"k":"A","t":"Cần chú trọng giáo dục toàn diện cả Đức, Trí, Thể, Mỹ, trong đó đạo đức là gốc."},{"k":"B","t":"Đức và tài, hồng và chuyên, phẩm chất và năng lực phải được thống nhất làm một."},{"k":"C","t":"Nếu không có đạo đức cách mạng thì dù có tài giỏi đến đâu cũng trở nên vô dụng."},{"k":"D","t":"Giáo dục tài năng cần ưu tiên hàng đầu trong mọi giai đoạn vì tài là phương tiện quan trọng nhất."},{"k":"E","t":"Thiếu tài thì làm việc gì cũng khó, nhưng thiếu đạo đức thì vô dụng, thậm chí có hại."}],"dung":["D"],"gt":"Tài liệu khẳng định \"đạo đức là gốc, là nền tảng của người cách mạng\", \"đức là gốc, là trước hết\", và \"Đó là cái gốc, rất quan trọng. Nếu không có đạo đức cách mạng thì có tài cũng vô dụng\". Điều này cho thấy \"đức\" được ưu tiên là \"gốc\", \"nền tảng\" hàng đầu. Việc nói \"giáo dục tài năng cần ưu tiên hàng đầu trong mọi giai đoạn\" là sai vì nó đi ngược lại quan điểm \"đức là gốc, là trước hết\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo Hồ Chí Minh, những hành vi nào sau đây KHÔNG phải là biểu hiện của \"thói đạo đức giả\", \"bệnh quan liêu\" hoặc \"chủ nghĩa cá nhân\" tiêu cực?","goiy":"Tập trung vào định nghĩa \"thói đạo đức giả\" và các ví dụ cụ thể của nó, cũng như điều mà Người lưu ý về ranh giới trong đấu tranh chống chủ nghĩa cá nhân.","pa":[{"k":"A","t":"Các biểu hiện nói một đằng làm một nẻo, nói nhiều làm ít, hứa hẹn mà không thực hiện."},{"k":"B","t":"Thói vác mặt làm quan cách mạng, miệng nói dân chủ nhưng làm việc theo lối quan chủ."},{"k":"C","t":"Hành động làm trái ngược với lợi ích quần chúng, trái với chính sách của Đảng."},{"k":"D","t":"Kiên quyết đấu tranh chống chủ nghĩa cá nhân kể cả phủ nhận lợi ích chính đáng cá nhân."},{"k":"E","t":"Các hành vi vi phạm đạo đức nghiêm trọng như bệnh quan liêu, tham ô và lãng phí."}],"dung":["D"],"gt":"Tài liệu nêu rõ \"Đấu tranh chống chủ nghĩa cá nhân không phải là 'giày xéo lên lợi ích cá nhân'\". Do đó, việc \"phủ nhận những lợi ích hợp pháp, chính đáng của cá nhân\" trong đấu tranh chống chủ nghĩa cá nhân là một hành vi không đúng đắn theo tư tưởng của Người, chứ không phải là biểu hiện của \"thói đạo đức giả\" hay \"bệnh quan liêu\" theo định nghĩa trong tài liệu."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Để xây dựng một nền đạo đức mới, Hồ Chí Minh đã chỉ ra những yêu cầu nào sau đây, ngoại trừ một điều KHÔNG đúng?","goiy":"Xem xét phạm vi và cách thức giáo dục đạo đức được Hồ Chí Minh đề cập. Có sự phân chia theo trình tự như vậy không, hay là một quá trình đồng thời, toàn diện?","pa":[{"k":"A","t":"Chuẩn mực đạo đức phải trở thành hành vi đạo đức hằng ngày của mỗi người và xã hội."},{"k":"B","t":"Phải kết hợp chặt chẽ giữa hai mặt \"xây\" và \"chống\", trong đó \"lấy xây làm chính\"."},{"k":"C","t":"Khơi dậy ý thức đạo đức lành mạnh, khuyến khích sự tự giáo dục, tự trau dồi đạo đức."},{"k":"D","t":"Phải tiến hành giáo dục đạo đức phù hợp với từng giai đoạn cách mạng, lứa tuổi, ngành nghề."},{"k":"E","t":"Tập trung giáo dục cán bộ trước tiên, sau đó mới phổ biến cho dân khi đủ trình độ."}],"dung":["E"],"gt":"Mặc dù Hồ Chí Minh rất chú trọng việc cán bộ, đảng viên phải \"làm gương\" và \"thấm nhuần đạo đức cách mạng\", nhưng việc xây dựng đạo đức mới không chỉ dành riêng cho một nhóm người rồi mới phổ biến. Tài liệu chỉ rõ \"xây dựng đạo đức mới cho cán bộ, đảng viên và hàng triệu, hàng triệu con người, trước tiên phải chăm lo bồi dưỡng những phẩm chất, chuẩn mực đạo đức mới ngay từ trong gia đình, đến nhà trường và xã hội\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, những nguyên tắc cơ bản nào sau đây phải được thực hiện để xây dựng một nền đạo đức cách mạng mới? (Chọn tất cả phương án đúng)","goiy":"Liệt kê các tiểu mục chính trong phần \"Quan điểm của Hồ Chí Minh về những nguyên tắc xây dựng đạo đức cách mạng\" trong tài liệu.","pa":[{"k":"A","t":"Nói đi đôi với làm, luôn nêu cao tinh thần gương mẫu về đạo đức cách mạng."},{"k":"B","t":"Ưu tiên đặt lợi ích cá nhân lên trên lợi ích tập thể để tạo động lực cạnh tranh."},{"k":"C","t":"Thực hiện xây đi đôi với chống, trong đó xác định nguyên tắc lấy xây làm chính."},{"k":"D","t":"Kiên trì rèn luyện, tu dưỡng đạo đức liên tục và bền bỉ trong suốt cuộc đời."},{"k":"E","t":"Coi trọng tài năng hơn đạo đức trong mọi trường hợp vì tài năng là động lực."}],"dung":["A","C","D"],"gt":"Tài liệu chia rõ ba nguyên tắc xây dựng đạo đức cách mạng: \"a) Nói đi đôi với làm, nêu gương về đạo đức\"; \"b) Xây đi đôi với chống\" (với tinh thần \"lấy xây làm chính\"); và \"c) Tu dưỡng đạo đức suốt đời\". Phương án B đi ngược lại với việc \"chống chủ nghĩa cá nhân\", và phương án E đi ngược lại quan điểm \"đạo đức là gốc\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, nếu người cách mạng không có đạo đức, có thể dẫn đến những hệ quả tiêu cực nào sau đây? (Chọn tất cả phương án đúng)","goiy":"Xem xét các đoạn văn mô tả tầm quan trọng của đạo đức và những lời cảnh báo của Hồ Chí Minh khi người cách mạng thiếu đạo đức.","pa":[{"k":"A","t":"Dù bản thân tài giỏi đến đâu cũng không thể lãnh đạo được quần chúng nhân dân."},{"k":"B","t":"Tự mình bị hủ hóa, xấu xa và không còn khả năng làm nổi những công việc to tát."},{"k":"C","t":"Quần chúng nhân dân sẽ không yêu mến, không tin phục và không làm theo lời nói."},{"k":"D","t":"Vẫn hoàn thành xuất sắc nhiệm vụ cách mạng một cách trọn vẹn nhưng không nổi bật."},{"k":"E","t":"Trở nên hoàn toàn vô dụng, thậm chí gây hại nghiêm trọng cho sự nghiệp cách mạng."}],"dung":["A","B","C","E"],"gt":"Tài liệu khẳng định: A (\"không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\"), B (\"tự mình không có đạo đức... tự mình đã hủ hóa, xấu xa thì còn làm nổi việc gì?\"), C (\"Quần chúng chỉ quý mến những người có tư cách, đạo đức\"), E (\"thiếu đạo đức thì vô dụng, thậm chí có hại\"). Phương án D sai vì tài liệu nhấn mạnh nếu thiếu đạo đức thì không thể hoàn thành nhiệm vụ vẻ vang."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những hành vi nào sau đây được Hồ Chí Minh lên án là biểu hiện của \"thói đạo đức giả\", \"bệnh quan liêu\" hoặc \"chủ nghĩa cá nhân\" tiêu cực gây tổn hại? (Chọn tất cả phương án đúng)","goiy":"Tập trung vào các thuật ngữ tiêu cực mà Hồ Chí Minh sử dụng để mô tả hành vi của cán bộ và đảng viên cần phải chống lại.","pa":[{"k":"A","t":"Bệnh nói suông, thói phô trương hình thức, lối làm việc không nâng cao sản xuất."},{"k":"B","t":"Nói một đằng làm một nẻo, nói nhiều làm ít, thậm chí hứa mà không bao giờ làm."},{"k":"C","t":"Hành vi vác mặt làm quan cách mạng, làm việc quan chủ, đi ngược lợi ích nhân dân."},{"k":"D","t":"Thực hiện nếp sống tích cực cần kiệm liêm chính, luôn giữ tinh thần chí công vô tư."},{"k":"E","t":"Các hành vi tiêu cực như quan liêu, tham ô, lãng phí mà Người coi là tội ác."}],"dung":["A","B","C","E"],"gt":"Tài liệu chỉ rõ A, B, C, E đều là những biểu hiện tiêu cực cần kiên quyết chống lại. Riêng D (\"Cần kiệm liêm chính, chí công vô tư\") là những phẩm chất đạo đức tích cực được Người yêu cầu thực hiện."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, việc tu dưỡng đạo đức suốt đời đòi hỏi những điều gì để người cách mạng có thể giữ vững phẩm chất của mình? (Chọn tất cả phương án đúng)","goiy":"Đọc kỹ phần \"Tu dưỡng đạo đức suốt đời\" và các yêu cầu cụ thể của Người về quá trình này.","pa":[{"k":"A","t":"Kiên trì, thường xuyên, liên tục rèn luyện phẩm chất trong mọi hoàn cảnh thực tế."},{"k":"B","t":"Tự cải tạo bản thân, bồi dưỡng tư tưởng mới để đoạn tuyệt triệt để với con người cũ."},{"k":"C","t":"Rèn luyện thông qua các hoạt động thực tiễn, trong công việc và mối quan hệ hằng ngày."},{"k":"D","t":"Nhìn thẳng vào bản thân, thấy cái hay để phát huy và thấy cái dở để dũng cảm khắc phục."},{"k":"E","t":"Đạo đức là phẩm chất bất biến, chỉ cần chú trọng rèn luyện khi còn trẻ là đủ."}],"dung":["A","B","C","D"],"gt":"A, B, C, D đều là các yêu cầu cốt lõi được trích dẫn trực tiếp trong tài liệu. E là nhận định sai vì tài liệu khẳng định \"Đạo đức không phải là cái gì đó có tính nhất thành bất biến\" và cảnh báo nguy cơ thoái hóa lúc già nếu dừng rèn luyện."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh ví \"Cũng như sông thì có nguồn mới có }
function veChonDoi() {

function veDT() {

  else than = veKq();

}
function veRay() {
  const a = tim(S.atk), kq = S.man === 'kq', song = S.doi.filter(t => t.song).length;

function veHangDoi() {
  return `<div class="hang-doi">${S.doi.map(t => {
    const tc = t.id === S.atk, mt = t.id === S.tgt, duoc = S.man === 'muc' && t.song && !tc;

}
const xoe = (i, n) => { const l = i - (n - 1) / 2; return `--r:${(l * DO_XOE).toFixed(2)}deg;--y:${(l * l * .12).toFixed(2)}em;--i:${i}`; };
function veMuc() {
  const ds = S.doi.filter(t => t.song && t.id !== S.atk);
  return `<div class="khoi">
    <div class="o up"><div class="lung" aria-hidden="true">${anhSao}</div><div class="chu">

function theBai(c, o, i) {

const chonChoDien = k => S.chon.map((x, i) => x === k ? '(' + (i + 1) + ')' : '').filter(Boolean).join(' ');

function veChoTrong(c) {
  return `<div class="cho-trong">${c.dung.map((_, i) => {
    const k = S.chon[i], o = k && c.pa.find(p => p.k === k);

  }).join('')}</div>`;

function veChong() {
  const con = Math.max(0, S.kho.length - S.luot);

}
function veHoi() {
  const c = cauHienTai(), tong = S.kho.length, stt = (S.luot - 1) % tong + 1;
  return `<div class="khoi" style="gap:1em;margin-top:.4em">
    <div class="de">

app.addEventListener('click', ev => {
  const n = ev.target.closest('button');
  if (!n || n.disabled) return;
  const d = n.dataset;
  if (d.so) { S.soDoi = +d.so; ve(); return; }
  if (d.socau) { S.soCau = +d.socau; ve(); return; }
  if (d.doi) { PH.loi = ''; PH.doi = +d.doi; guiMay(); ve(); return; }
  if (d.muc) { S.tgt = +d.muc; ve(); return; }
  if (d.xoa !== undefined) { S.chon.splice(+d.xoa, 1, undefined); ve(); return; }
  if (d.chon) {
    const c = cauHienTai();
    if (c.loai === 'mot') S.chon = [d.chon];
    else if (c.loai === 'nhieu') S.chon = S.chon.includes(d.chon) ? S.chon.filter(k => k !== d.chon) : [...S.chon, d.chon];
    else { let o = c.dung.findIndex((_, i) => !S.chon[i]); if (o < 0) o = c.dung.length - 1; S.chon[o] = d.chon; }
    ve(); return;
  }
  ({ batdau:batDau, mocau(){ if (!S.tgt) return; if (PH.vai === 'dt') guiTL({muc:S.tgt}); else moCau(); },
     goiy(){ S.goiY = !S.goiY; ve(); }, chot(){ if (PH.vai === 'dt') { if (duDe(S.c)) guiTL({chon:S.chon}); } else chot(); },
     tiep:luotSau, ketthuc:tongKet,
     lai(){ if (PH.vai === 'chu') { datSanh(); return; } Object.assign(S, {man:'mo', doi:[], moi:true}); ve(); },
     taophong:taoPhong, batdauphong:batDauPhong, dongphong:dongPhong, molai:moLaiPhong, vaophong:thuVaoPhong,
     luisanh(){ const so = Object.keys(PH.may).length; if (!so || confirm('Quay lại sẽ đóng phòng ' + PH.ma + '. ' + so + ' máy đang trong phòng sẽ phải vào lại bằng mã mới.')) dongPhong(); },
     roiphong:roiPhong, doidoi(){ PH.doi = 0; guiMay(); ve(); }, vetrang(){ location.replace(location.pathname); } }[d.lam] || (() => {}))();
});
function thuVaoPhong() {
  const ma = PH.nhapMa.trim();
  if (!/^\d{4}$/.test(ma)) { PH.loiVao = 'Mã phòng gồm 4 chữ số.'; ve(); return; }
  vaoPhong(ma, null);
}
app.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.dataset.ma !== undefined) thuVaoPhong(); });
app.addEventListener('input', ev => {
  if (ev.target.dataset.ten !== undefined) S.ten[+ev.target.dataset.ten] = ev.target.value;
  if (ev.target.dataset.ma !== undefined) PH.nhapMa = ev.target.value;

app.addEventListener('change', ev => {
  const id = ev.target.id, v = +ev.target.value;
  if (id === 'cd') S.cd = v;

  else return;
  ve();
  document.getElementById(id).focus();
});
/* quét QR thì vào thẳng phòng; tải lại trang thì về đúng phòng, đúng đội */
{
  const cu = docNho('dthb-dt'), ma = THAM_SO.get('ma');
  ve();
  if (ma) { PH.nhapMa = ma; vaoPhong(ma, cu && cu.ma === ma ? cu : null); }
  else if (cu && Date.now() - cu.luc < HAN_PHONG_MS) { PH.nhapMa = cu.ma; vaoPhong(cu.ma, cu); }
