<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu trường hiểu bài</title>
<!-- Tệp này do tao-game.py dựng từ _khuon.html + cau-hoi.json. Sửa ở hai tệp đó rồi chạy lại. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Be+Vietnam+Pro:wght@500;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --ban:#15100D; --tam:#2A1D16; --vien:#4D392B; --son:#C8321F; --son-dam:#7D1C10;
  --vang:#E3B23C; --vang-dam:#9A7420; --kem:#F3EAD7; --kem-toi:#D8C9AC; --kem-bong:#9C8A6E;
  --ngoc:#1F7A70; --ngoc-dam:#14564F; --muc:#231812; --mo:#D9CBB6;
  --chu-to:'Alfa Slab One','Palatino Linotype',serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ban)}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:.14em solid #7FD0FF;outline-offset:.12em}
.khung{container-type:inline-size;position:relative;min-height:100vh;overflow:hidden;background:var(--ban);color:var(--kem);font-family:'Be Vietnam Pro',system-ui,sans-serif}
.trong_{position:absolute;left:58%;top:50vh;width:82cqi;height:82cqi;transform:translate(-50%,-50%);pointer-events:none}
#app{position:relative;min-height:100vh;padding:1em;font-size:clamp(16px,1.3cqi,34px);line-height:1.32}
h1,h2,p{margin:0}
.to{font-family:var(--chu-to);font-weight:400}

/* nút dày */
.nut{min-height:44px;padding:.55em 1.2em;border:0;border-radius:.5em;font-family:var(--chu-to);transition:transform .1s ease,box-shadow .1s ease}
.nut:not(:disabled):hover{transform:translateY(-.08em)}
.nut:not(:disabled):active{transform:translateY(.14em)}
.nut.son{background:var(--son);color:#fff;box-shadow:0 .2em 0 var(--son-dam)}
.nut.son:not(:disabled):active{box-shadow:0 .06em 0 var(--son-dam)}
.nut.vang{background:var(--vang);color:var(--muc);box-shadow:0 .2em 0 var(--vang-dam)}
.nut.kem{background:var(--kem);color:var(--muc);box-shadow:0 .2em 0 var(--kem-bong);font-family:inherit;font-weight:800}
.nut:disabled{background:var(--vien);color:var(--mo);box-shadow:0 .2em 0 var(--tam)}
.nut.lui{align-self:flex-start}

/* màn mở ván */
.mo-van{display:flex;flex-wrap:wrap;gap:1.2em;align-items:stretch;max-width:78em;margin:0 auto;min-height:calc(100vh - 2.6em)}
.mo-trai{flex:1 1 21em;min-width:0;display:flex;flex-direction:column;gap:.8em;justify-content:center}
.bien{background:var(--son);border-radius:.6em;padding:1.3em 1.2em;box-shadow:0 .35em 0 var(--son-dam)}
.bien .nho{font-size:.85em;font-weight:800;color:#FFE9C2}
.bien h1{margin-top:.25em;font-size:3em;line-height:1.16;color:#FFF3D6}
.bien .chi{display:inline-block;margin-top:.8em;padding:.25em .7em;border-radius:.4em;background:var(--vang);color:var(--muc);font-weight:800}
.luat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em}
.luat>div{border-radius:.5em;padding:.7em .8em}
.luat .so{font-family:var(--chu-to);font-size:2em;line-height:1.15}
.luat .chu{font-weight:700}
.toi{background:var(--tam);border:.1em solid var(--vien)}
.toi .chu{color:var(--mo)}
.vang-o{background:var(--vang);color:var(--muc);box-shadow:0 .22em 0 var(--vang-dam)}
.son-o{background:var(--son);color:#fff;box-shadow:0 .22em 0 var(--son-dam)}
.cau-ket{font-weight:700;color:var(--mo)}
.mo-phai{flex:999 1 560px;min-width:0;background:var(--tam);border:.1em solid var(--vien);border-radius:.6em;padding:1.1em;display:flex;flex-direction:column;gap:1em;align-self:center}
.mo-phai h2{margin:0 0 .5em;font-size:1.15em;font-weight:800}
.chon-cd{width:100%;min-height:44px;padding:.5em .6em;border:0;border-radius:.45em;background:var(--kem);color:var(--muc);font-weight:800;box-shadow:0 .16em 0 var(--kem-bong)}
.so-doi{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.45em}
.so-doi button{min-height:44px;padding:.35em 0;border:0;border-radius:.45em;font-family:var(--chu-to);font-size:1.5em;background:var(--kem);color:var(--muc);box-shadow:0 .16em 0 var(--kem-bong)}
.so-doi button.bat{background:var(--vang);box-shadow:0 .16em 0 var(--vang-dam);transform:translateY(-.12em)}
.so-doi button:disabled{opacity:.35;cursor:not-allowed}
.so-doi.ba{grid-template-columns:repeat(3,minmax(0,1fr))}
.pham-vi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:1em}
.ten-doi{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr));gap:.5em}
.ten-doi label{display:flex;align-items:center;gap:.55em;background:var(--kem);color:var(--muc);border-radius:.45em;padding:.2em .55em;box-shadow:0 .16em 0 var(--kem-bong)}
.ten-doi input{flex:1;min-width:0;min-height:44px;border:0;background:transparent;color:var(--muc);font-size:1.02em;font-weight:700}
.dau{flex:none;display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:50%;font-family:var(--chu-to)}

/* màn chơi */
.choi{display:flex;flex-wrap:wrap;gap:1em;align-items:stretch;min-height:calc(100vh - 2.6em)}
.ray{flex:1 1 15.5em;min-width:0;display:flex;flex-direction:column;gap:.65em}
.ban{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:.85em;padding-top:.55em}
.r-ten{background:var(--son);border-radius:.55em;padding:.7em .85em;box-shadow:0 .25em 0 var(--son-dam)}
.r-ten .a{font-family:var(--chu-to);font-size:1.5em;line-height:1.18;color:#FFF3D6}
.r-ten .b{margin-top:.2em;font-size:.85em;font-weight:800;color:#FFE9C2}
.o{background:var(--tam);border:.1em solid var(--vien);border-radius:.55em}
.r-doi{padding:.6em .75em;display:flex;align-items:center;gap:.6em}
.r-doi .dau{width:2.4em;height:2.4em;font-size:1.1em}
.r-doi .nhan{font-size:.8em;font-weight:800;color:var(--vang)}
.r-doi .ten{font-weight:800;font-size:1.08em;line-height:1.2}
.r-tinh{display:flex;align-items:stretch;gap:.3em}
.r-tinh>div:not(.gach){flex:1 1 0;min-width:0;text-align:center;border-radius:.5em;padding:.45em .25em;transition:opacity .25s}
.r-tinh .so{font-family:var(--chu-to);font-size:2.3em;line-height:1.15}
.r-tinh .chu{font-size:.8em;font-weight:800;line-height:1.2}
.r-tinh .gach{align-self:center;font-family:var(--chu-to);font-size:1.1em;color:var(--mo)}
.r-tinh .mo-di{opacity:.32}
.r-gio{padding:.5em .75em .7em}
.r-gio .ngang{display:flex;align-items:baseline;justify-content:space-between;gap:.5em}
.r-gio .nhan{font-weight:800;color:var(--mo)}
#so-gio{font-family:var(--chu-to);font-size:2.6em;line-height:1.1;color:var(--kem)}
.vach{height:.55em;margin-top:.2em;border-radius:.3em;background:var(--ban);overflow:hidden}
#vach-gio{height:100%;background:var(--kem);transition:width 1s linear}
.gap #so-gio{color:#FF7A5C}
.gap #vach-gio{background:#FF7A5C}
.r-so{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45em}
.r-so>div{padding:.35em .6em;border-radius:.5em}
.r-so .nhan{font-size:.8em;font-weight:800;color:var(--mo)}
.r-so .gt{font-family:var(--chu-to);font-size:1.45em;color:var(--vang)}
.r-ket{margin-top:auto;font-size:1em}

/* hàng đội */
.hang-doi{display:flex;flex-wrap:wrap;gap:.5em .5em;align-items:flex-start}
.doi{position:relative;flex:1 1 5.6em;max-width:12em;min-width:0;min-height:5.6em;padding:.45em .5em .5em;border:0;border-radius:.45em;text-align:left;color:var(--muc);background:var(--kem);box-shadow:0 .2em 0 var(--kem-bong);transition:transform .16s ease}
.doi.chon-duoc:hover{transform:translateY(-.25em)}
.doi.tc,.doi.mt{transform:translateY(-.3em)}
.doi.tc{box-shadow:0 0 0 .18em var(--vang),0 .2em 0 var(--kem-bong)}
.doi.mt{box-shadow:0 0 0 .18em #FF7A5C,0 .2em 0 var(--kem-bong)}
.doi.loai{background:var(--tam);color:var(--mo);box-shadow:0 .2em 0 var(--ban)}
.doi .tren{display:flex;align-items:center;gap:.35em}
.doi .dau{width:1.7em;height:1.7em;font-size:.9em}
.doi .pt{margin-left:auto;font-family:var(--chu-to);font-size:1.12em}
.doi .ten{display:block;margin-top:.22em;font-size:.86em;font-weight:800;line-height:1.18}
.mau{display:block;height:.4em;margin-top:.3em;border-radius:.2em;overflow:hidden;background:var(--kem-toi)}
.doi.loai .mau{background:var(--ban)}
.mau i{display:block;height:100%;transition:width .5s ease}
.the{position:absolute;left:50%;bottom:-.72em;transform:translateX(-50%);padding:.05em .55em;border-radius:.3em;white-space:nowrap;font-size:.76em;font-weight:800}
.trung{animation:trung .5s ease}
@keyframes trung{0%,100%{translate:0}20%{translate:-.3em}40%{translate:.3em}60%{translate:-.18em}80%{translate:.18em}}

/* chọn mục tiêu */
.khoi{flex:1;display:flex;flex-direction:column;gap:1.1em;margin-top:.5em}
.up{display:flex;flex-wrap:wrap;align-items:center;gap:1.1em;padding:.85em 1.1em;border-radius:.6em}
.lung{flex:none;width:5.4em;height:7.4em;border-radius:.45em;background:var(--son);box-shadow:0 .24em 0 var(--son-dam);display:flex;align-items:center;justify-content:center;transform:rotate(-3deg)}
.lung svg{width:4.2em;height:4.2em}
.up .chu{flex:1 1 18em;min-width:0}
.up h2{font-size:1.85em;line-height:1.2}
.up p{margin-top:.35em;font-size:1.08em;font-weight:700;color:var(--mo)}
.tay{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.9em;padding-top:1em}
.bai-doi{position:relative;flex:0 1 11.5em;min-width:8.5em;min-height:13em;padding:.8em;border-radius:.6em;border:.16em solid var(--kem-toi);background:var(--kem);color:var(--muc);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;box-shadow:0 .32em 0 var(--kem-bong);
  transform:translateY(calc(var(--y,0em) - var(--n,0em))) rotate(var(--r,0deg));transform-origin:50% 110%;transition:transform .16s ease}
.bai-doi:hover{--n:.4em}
.bai-doi.bat{--n:1em;border-color:var(--son);background:#FFF6DF;box-shadow:0 .32em 0 var(--son-dam)}
.bai-doi .dau{width:2.5em;height:2.5em;font-size:1.3em}
.bai-doi .ten{font-size:1.12em;font-weight:800;line-height:1.2}
.bai-doi .pt{font-family:var(--chu-to);font-size:2em;line-height:1.15}
.bai-doi .sau{font-size:.88em;font-weight:700;color:#5A4636}
.nhan-tren{position:absolute;top:-.9em;left:50%;transform:translateX(-50%);padding:.08em .6em;border-radius:.3em;font-size:.86em;font-weight:800;white-space:nowrap}
.hang-nut{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1em;position:relative;min-height:4.2em}
.hang-nut .nut{font-size:1.4em}

/* câu hỏi */
.de{background:var(--kem);color:var(--muc);border-radius:.6em;padding:.8em 1.1em;box-shadow:0 .28em 0 var(--kem-bong)}
.de .dau-de{display:flex;flex-wrap:wrap;align-items:center;gap:.5em .9em}
.de .dang{padding:.05em .55em;border-radius:.3em;background:var(--muc);color:var(--kem);font-size:.88em;font-weight:800}
.de .stt{font-size:.88em;font-weight:800;color:#5A4636}
.de .an{margin-left:auto;min-height:44px;padding:0 .8em;border:.1em solid var(--kem-bong);border-radius:.4em;background:transparent;color:var(--muc);font-size:.88em;font-weight:800}
.de h2{margin-top:.15em;font-size:1.58em;font-weight:800;line-height:1.3}
.de .goi{margin-top:.4em;font-weight:700;color:#6B4A12}
.de .goi b{font-weight:800}
.cho-trong{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.55em}
.cho-trong button{min-height:44px;padding:.15em .8em;border:.12em dashed var(--kem-bong);border-radius:.4em;background:#FFF6DF;color:var(--muc);font-weight:800}
.cho-trong button.day{border-style:solid;border-color:var(--vang-dam)}
.tay-bai{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.55em;padding-top:1.3em}
.bai{position:relative;flex:1 1 9.5em;max-width:16em;min-width:0;min-height:13.5em;padding:.5em .7em 1.7em;border-radius:.6em;border:.16em solid var(--kem-toi);background:var(--kem);color:var(--muc);text-align:left;box-shadow:0 .32em 0 var(--kem-bong);
  transform:translateY(calc(var(--y,0em) - var(--n,0em))) rotate(var(--r,0deg));transform-origin:50% 110%;transition:transform .16s ease}
.bai:not(:disabled):hover{--n:.4em}
.bai.nho-bai{flex:1 1 8em;max-width:12em;min-height:7em;padding-bottom:.5em}
.bai .ky{display:block;font-family:var(--chu-to);font-size:1.9em;line-height:1.15}
.bai.nho-bai .ky{font-size:1.3em}
.bai .nd{display:block;margin-top:.15em;font-size:1.1em;font-weight:700;line-height:1.28}
.bai .ky-duoi{position:absolute;right:.55em;bottom:.25em;font-family:var(--chu-to);font-size:1.15em;transform:rotate(180deg)}
.bai.nho-bai .ky-duoi{display:none}
.bai.bat{--n:1em;background:#FFF6DF;border-color:var(--vang);box-shadow:0 .32em 0 var(--vang-dam)}
.bai.dung{--n:.6em;background:#D6EDE3;border-color:var(--ngoc);box-shadow:0 .32em 0 var(--ngoc-dam)}
.bai.sai{background:#F6D5CD;border-color:var(--son);box-shadow:0 .32em 0 var(--son-dam)}
.bai.xam{background:#BFB29B;border-color:#BFB29B;color:#3A2D22;box-shadow:0 .32em 0 #7E7059}
.chia{animation:chia .32s ease backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes chia{from{opacity:0;translate:0 2em}}

/* kết quả */
.kq{display:flex;flex-wrap:wrap;gap:.75em;align-items:stretch}
.kq-bien{flex:1 1 15em;min-width:0;border-radius:.6em;padding:.75em 1em;display:flex;flex-direction:column;justify-content:center}
.kq-bien .a{font-family:var(--chu-to);font-size:1.95em;line-height:1.15}
.kq-bien .b{font-size:1.05em;font-weight:800;margin-top:.15em}
.kq-bien .c{font-family:var(--chu-to);font-size:1.45em;margin-top:.3em}
.kq-gt{flex:999 1 24em;min-width:0;background:var(--kem);color:var(--muc);border-radius:.6em;padding:.7em 1em;box-shadow:0 .26em 0 var(--kem-bong)}
.kq-gt .n{font-weight:800;color:#A52617}
.kq-gt p{margin-top:.15em;font-size:1.04em;font-weight:500;line-height:1.38}

/* chồng bài */
.chong{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:.55em}
.chong .dem{text-align:right;font-size:.86em;font-weight:800;color:var(--mo);line-height:1.15}
.chong .dem b{display:block;font-family:var(--chu-to);font-weight:400;font-size:1.5em;color:var(--kem)}
.chong .x{width:2.9em;height:4em;border-radius:.3em;background:var(--son);box-shadow:.12em .12em 0 var(--son-dam),.24em .24em 0 #5C140B;display:flex;align-items:center;justify-content:center}
.chong svg{width:2.2em;height:2.2em}

/* xếp hạng */
.xh{display:flex;flex-wrap:wrap;gap:1.2em;align-items:stretch;min-height:calc(100vh - 2.6em)}
.xh-trai{flex:1 1 22em;min-width:0;display:flex;flex-direction:column;gap:.8em}
.vo-dich{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.5em;background:var(--vang);color:var(--muc);border-radius:.7em;padding:1.4em 1.2em;box-shadow:0 .4em 0 var(--vang-dam)}
.vo-dich .dau{width:2.4em;height:2.4em;font-size:2.4em}
.vo-dich h1{font-size:2.5em;line-height:1.18}
.vo-dich .pt{font-family:var(--chu-to);font-size:3.2em;line-height:1.1;color:var(--son-dam)}
.vo-dich p{font-weight:800}
.xh-trai .nut{font-size:1.45em}
.xh-phai{flex:999 1 560px;min-width:0;padding:1em;border-radius:.6em;display:flex;flex-direction:column;gap:.5em}
.xh-phai h2{margin-bottom:.15em;font-size:1.7em}
.dong{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:.4em .8em;padding:.45em .8em;border-radius:.45em;background:var(--kem);color:var(--muc);box-shadow:0 .16em 0 var(--kem-bong)}
.dong.nhat{background:var(--vang);box-shadow:0 .16em 0 var(--vang-dam)}
.dong.ra{background:#3A2A20;color:var(--kem);box-shadow:0 .16em 0 var(--ban)}
.dong .hang{flex:none;width:1.5em;font-family:var(--chu-to);font-size:1.7em;text-align:center}
.dong .ten-d{flex:1 1 11em;min-width:0}
.dong .ten-d b{display:block;font-size:1.12em;font-weight:800;line-height:1.2}
.dong .ten-d span{font-size:.9em;font-weight:700}
.dong .tk{display:flex;gap:1em;font-size:.95em;font-weight:800}

/* phòng chơi */
.vao-phong{background:var(--tam);border:.1em solid var(--vien);border-radius:.55em;padding:.6em .8em}
.vao-phong label{display:block;margin-bottom:.35em;font-weight:800}
.vao-phong .hang{display:flex;gap:.5em}
.vao-phong input{flex:1;min-width:0;min-height:44px;padding:0 .6em;border:0;border-radius:.45em;background:var(--kem);color:var(--muc);font-family:var(--chu-to);font-size:1.2em;letter-spacing:.12em}
.loi{margin-top:.4em;font-weight:800;color:#FF9C84}
.hang-2nut{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13em),1fr));gap:.6em}
.hang-2nut .nut{font-size:1.4em}
.net{display:inline-flex;align-items:center;gap:.4em;font-size:.82em;font-weight:800;color:var(--mo)}
.net i{width:.6em;height:.6em;border-radius:50%;background:#FF7A5C}
.net i.on{background:#5FD0A0}
.cham{display:inline-flex;gap:.22em;vertical-align:middle}
.cham i{width:.62em;height:.62em;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 .09em currentColor;opacity:.45}
.cham i.on{background:#2FA57F;box-shadow:none;opacity:1}
.cham i.mat{background:#C8321F;box-shadow:none;opacity:1}
.sanh{display:flex;flex-wrap:wrap;gap:1.2em;align-items:stretch;max-width:78em;margin:0 auto;min-height:calc(100vh - 2.6em)}
.sanh-trai{flex:1 1 20em;min-width:0;display:flex;flex-direction:column;gap:.8em;justify-content:center}
.sanh-trai .bien h1{font-size:2.4em}
.ma-phong{padding:.9em 1em;text-align:center}
.ma-phong .nhan{font-weight:800;color:var(--mo)}
.so-ma{font-size:4.4em;line-height:1.05;letter-spacing:.08em;color:var(--vang)}
.qr-phong svg{display:block;width:13em;height:13em;margin:.45em auto;background:#fff;border-radius:.4em}
.sanh-phai{flex:999 1 560px;min-width:0;padding:1em;border-radius:.6em;display:flex;flex-direction:column;gap:.5em}
.sanh-phai h2{margin-bottom:.15em;font-size:1.7em}
.dong .may{font-weight:800;white-space:nowrap}
.choi.phong .ray{flex-basis:13.5em}
.choi.phong .r-so{grid-template-columns:repeat(3,minmax(0,1fr))}
.choi.phong .r-so .gt{font-size:1.2em}
.choi.phong .r-tinh .so{font-size:1.8em}
.choi.phong .ban{padding-top:0}
.choi.phong .bai{flex-basis:7em;min-height:11em}
.choi.phong .khoi{margin-top:0}
.tk-phong{flex:1 1 21em;min-width:0;padding:.7em;display:flex;flex-direction:column;gap:.4em}
.tk-phong h2{font-size:1.25em}
.tk-dong{flex:0 1 auto;display:flex;align-items:center;gap:.5em;padding:.2em .55em;border-radius:.45em;background:var(--kem);color:var(--muc);box-shadow:0 .14em 0 var(--kem-bong)}
.tk-dong.tc{box-shadow:0 0 0 .16em var(--vang)}
.tk-dong.mt{box-shadow:0 0 0 .16em #FF7A5C}
.tk-dong.ra{background:#3A2A20;color:var(--kem);box-shadow:none}
.tk-dong .hang{flex:none;width:1.1em;font-family:var(--chu-to);font-size:1.25em;text-align:center}
.tk-dong .dau{width:1.7em;height:1.7em;font-size:.9em}
.tk-dong .giua{flex:1;min-width:0}
.tk-dong b{display:block;font-size:.95em;font-weight:800;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tk-dong .mau{margin-top:.18em}
.tk-dong .so-tk{display:block;margin-top:.12em;font-size:.78em;font-weight:800;white-space:nowrap}
.tk-dong .phai{flex:none;text-align:right}
.tk-dong .pt{display:block;font-family:var(--chu-to);font-size:1.25em;line-height:1.1}
.binh{display:flex;flex-direction:column;gap:.2em}
.binh p{font-size:.86em;font-weight:700;line-height:1.28;color:var(--mo)}
.binh p.moi{padding:.3em .55em;border-radius:.4em;background:var(--vang);color:var(--muc);font-size:1em;font-weight:800}
.binh p.vao{animation:chia .32s ease}
.cho-doi{font-size:1.15em;font-weight:800;color:var(--vang);text-align:center}
.ghi-nhan{margin-top:.3em;font-size:.9em;font-weight:800}
.dt{display:flex;flex-direction:column;gap:.75em;max-width:44em;margin:0 auto}
.dt .bien h1{font-size:2.1em}
.dt h2.tieu{font-size:1.25em;font-weight:800}
.dt-dau{display:flex;align-items:center;gap:.6em;padding:.5em .7em}
.dt-dau .giua{flex:1;min-width:0}
.dt-dau b{display:block;font-weight:800;line-height:1.2}
.dt-dau .pt{font-family:var(--chu-to);font-size:1.5em;color:var(--vang)}
.dt-chon{flex:none;width:100%;min-height:3.4em;border:0;text-align:left;font:inherit}
.dt-chon .ten-d{flex:1;min-width:0;font-weight:800}
.dt-chon:disabled{opacity:.5}

/* điện thoại */
@container (max-width: 760px){
  .r-ten,.r-tinh,.r-ket{display:none}
  .ray{flex-basis:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45em}
  .r-doi{grid-column:1/-1}
  .r-so{grid-column:auto}
  .bien h1{font-size:2.3em}
  .so-doi{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tay-bai .bai{flex:1 1 100%;max-width:none;min-height:0;padding:.45em .7em;--r:0deg!important;--y:0em!important}
  .bai .ky{display:inline;font-size:1.3em;margin-right:.3em}
  .bai .nd{display:inline;font-size:1.05em}
  .bai .ky-duoi{display:none}
  .bai.bat,.bai.dung{--n:0em}
  .bai-doi{flex:1 1 40%;min-height:9em;--r:0deg!important;--y:0em!important}
  .hang-nut{flex-direction:column}
  .chong{display:none}
  .up .lung{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

'use strict';
const CHU_DE = [{"ma":"01","ten":"Khái niệm và ý nghĩa","cau":[{"loai":"mot","dang":"Chọn 1 đáp án","q":"Khái niệm Tư tưởng Hồ Chí Minh được Đại hội XI của Đảng đưa ra nhấn mạnh điều gì là giá trị cơ bản nhất của tư tưởng này?","goiy":"Hãy xem xét yếu tố nào tạo nên tính độc đáo và đóng góp nền tảng, cốt lõi nhất của Hồ Chí Minh trong bối cảnh cách mạng Việt Nam theo định nghĩa.","pa":[{"k":"A","t":"Sự kế thừa truyền thống tốt đẹp dân tộc"},{"k":"B","t":"Tài sản tinh thần vô cùng quý giá của Đảng"},{"k":"C","t":"Vận dụng sáng tạo chủ nghĩa Mác - Lênin"},{"k":"D","t":"Hệ thống quan điểm sâu sắc và toàn diện"},{"k":"E","t":"Kim chỉ nam cho hành động của cách mạng"}],"dung":["C"],"gt":"Theo định nghĩa của Đại hội XI, Tư tưởng Hồ Chí Minh \"là một hệ thống quan điểm toàn diện và sâu sắc... kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta\". Mặc dù các phương án khác đều đúng về tư tưởng Hồ Chí Minh, nhưng yếu tố \"vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin\" thể hiện bản chất khoa học, cách mạng và là cốt lõi nhất."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Yếu tố nào sau đây thể hiện rõ nhất tính \"toàn diện và sâu sắc\" của Tư tưởng Hồ Chí Minh trong việc định hướng cách mạng Việt Nam?","goiy":"Tính \"toàn diện\" hàm ý bao quát nhiều khía cạnh, không chỉ một hay hai vấn đề riêng lẻ.","pa":[{"k":"A","t":"Mục tiêu độc lập dân tộc và giàu mạnh"},{"k":"B","t":"Con đường độc lập gắn liền chủ nghĩa xã hội"},{"k":"C","t":"Khẳng định vai trò lãnh đạo của Đảng ta"},{"k":"D","t":"Lực lượng cách mạng là toàn thể nhân dân"},{"k":"E","t":"Bao gồm tất cả các yếu tố được nêu trên"}],"dung":["E"],"gt":"Tài liệu mô tả tính \"toàn diện và sâu sắc\" của Tư tưởng Hồ Chí Minh bằng cách liệt kê nhiều khía cạnh khác nhau: mục tiêu quốc gia, con đường phát triển, vai trò của Đảng và Nhà nước, lực lượng cách mạng, xây dựng con người, kết hợp sức mạnh dân tộc và thời đại, cùng phương pháp cách mạng phù hợp."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Mục đích cuối cùng mà Hồ Chí Minh và nhân dân Việt Nam hướng tới khi xây dựng đất nước là gì, theo tài liệu?","goiy":"Hãy tìm cụm từ đầy đủ nhất thể hiện cả mục tiêu nội tại của đất nước và đóng góp quốc tế.","pa":[{"k":"A","t":"Xây dựng nước Việt Nam độc lập dân chủ"},{"k":"B","t":"Góp phần vào sự nghiệp cách mạng thế giới"},{"k":"C","t":"Xây dựng nước Việt Nam hòa bình thống nhất"},{"k":"D","t":"Xây dựng Việt Nam giàu mạnh và đóng góp thế giới"},{"k":"E","t":"Thực hiện thành công chủ nghĩa xã hội"}],"dung":["D"],"gt":"Tài liệu dẫn lời Hồ Chí Minh nêu rõ mong muốn cuối cùng: “Toàn Đảng toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh, và góp phần xứng đáng vào sự nghiệp cách mạng thế giới”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Sự kiện nào đánh dấu bước ngoặt quan trọng nhất trong nhận thức của Đảng về vai trò nền tảng của Tư tưởng Hồ Chí Minh, đặt ngang hàng với chủ nghĩa Mác - Lênin?","goiy":"Câu hỏi tìm kiếm \"bước ngoặt quan trọng nhất\" trong việc đặt Tư tưởng Hồ Chí Minh làm \"nền tảng tư tưởng, kim chỉ nam cho hành động\" cùng với chủ nghĩa Mác - Lênin.","pa":[{"k":"A","t":"Đại hội II của Đảng (vào tháng 2/1951)"},{"k":"B","t":"Đại hội IV của Đảng (vào tháng 12/1976)"},{"k":"C","t":"Đại hội VI của Đảng (vào tháng 12/1986)"},{"k":"D","t":"Đại hội VII của Đảng (vào giữa năm 1991)"},{"k":"E","t":"Đại hội IX của Đảng (vào tháng 4/2001)"}],"dung":["D"],"gt":"Đại hội VII của Đảng (năm 1991) khẳng định: “Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động”. Đây là lần đầu tiên chính thức đặt Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng và kim chỉ nam cùng với chủ nghĩa Mác - Lênin."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Ý nghĩa toàn diện nhất của việc học tập môn học Tư tưởng Hồ Chí Minh đối với sinh viên, theo tài liệu, là gì?","goiy":"Hãy tìm câu trả lời bao quát đầy đủ các khía cạnh đã được trình bày trong phần \"Ý NGHĨA CỦA VIỆC HỌC TẬP MÔN HỌC TƯ TƯỞNG HỒ CHÍ MINH\".","pa":[{"k":"A","t":"Nâng cao năng lực tư duy lý luận thực tiễn"},{"k":"B","t":"Giáo dục và định hướng đạo đức cách mạng"},{"k":"C","t":"Rèn luyện phương pháp phong cách làm việc"},{"k":"D","t":"Trang bị tri thức kiên định mục tiêu cách mạng"},{"k":"E","t":"Toàn diện bao gồm tất cả các nội dung trên"}],"dung":["E"],"gt":"Cả 3 mục trong phần II \"Ý NGHĨA CỦA VIỆC HỌC TẬP MÔN HỌC TƯ TƯỞNG HỒ CHÍ MINH\" đều nêu rõ các ý nghĩa: nâng cao năng lực tư duy lý luận, giáo dục đạo đức, củng cố niềm tin, bồi dưỡng lòng yêu nước, và xây dựng phương pháp/phong cách công tác."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Tư tưởng Hồ Chí Minh được xác định là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc Việt Nam, mãi mãi soi đường cho sự nghiệp cách mạng. Nhận định này được nêu lên lần đầu tiên trong khái niệm Tư tưởng Hồ Chí Minh tại Đại hội nào của Đảng?","goiy":"Hãy nhớ số thứ tự của Đại hội Đảng đã định nghĩa khái niệm này vào năm 2011.","pa":[{"k":"A","t":"Đại hội đại biểu toàn quốc VII (1991)"},{"k":"B","t":"Đại hội đại biểu toàn quốc IX (2001)"},{"k":"C","t":"Đại hội đại biểu toàn quốc X (2006)"},{"k":"D","t":"Đại hội đại biểu toàn quốc XI (2011)"},{"k":"E","t":"Đại hội đại biểu toàn quốc XIII (2021)"}],"dung":["D"],"gt":"Theo tài liệu môn học: Đại hội đại biểu toàn quốc lần thứ XI của Đảng Cộng sản Việt Nam (năm 2011) nêu khái niệm: “Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc... là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta, mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Một trong những cơ sở hình thành Tư tưởng Hồ Chí Minh, mà tài liệu nhấn mạnh là \"giá trị cơ bản nhất trong quá trình hình thành và phát triển\", là gì?","goiy":"Tìm yếu tố được xác định là \"cơ bản nhất\" trong tài liệu.","pa":[{"k":"A","t":"Tiếp thu tinh hoa văn hóa của nhân loại"},{"k":"B","t":"Kế thừa các giá trị truy  Minh mà người học có thể vận dụng sau khi nghiên cứu môn học Tư tưởng Hồ Chí Minh?","goiy":"Phương châm này liên quan đến khả năng thích ứng linh hoạt trong nhiều tình huống khác nhau.","pa":[{"k":"A","t":"Xây dựng phương châm phong cách tư duy"},{"k":"B","t":"Xây dựng phương châm phong cách diễn đạt"},{"k":"C","t":"Xây dựng phương châm phong cách làm việc"},{"k":"D","t":"Xây dựng phương châm phong cách ứng xử"},{"k":"E","t":"Tất cả phương châm phong cách đã nêu"}],"dung":["E"],"gt":"Tài liệu cho biết người học \"có thể vận dụng xây dựng phong cách tư duy, phong cách diễn đạt, phong cách làm việc, phong cách ứng xử, phong cách sinh hoạt, v.v. phù hợp với hoàn cảnh như phương châm của Hồ Chí Minh: Dĩ bất biến, ứng vạn biến.\""},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phát biểu nào sau đây KHÔNG phản ánh đúng ý nghĩa của Tư tưởng Hồ Chí Minh theo tài liệu?","goiy":"Hãy tìm câu không được nhắc đến hoặc không phải là vai trò trực tiếp được định nghĩa trong các tài liệu về ý nghĩa của Tư tưởng Hồ Chí Minh.","pa":[{"k":"A","t":"Cùng chủ nghĩa Mác - Lênin làm nền tảng"},{"k":"B","t":"Là kim chỉ nam cho hành động của Đảng"},{"k":"C","t":"Là tài sản tinh thần vô cùng quý giá"},{"k":"D","t":"Chỉ đạo trực tiếp kinh tế thị trường XHCN"},{"k":"E","t":"Mãi mãi soi đường cho nhân dân thắng lợi"}],"dung":["D"],"gt":"Phương án D \"là hệ thống quan điểm chỉ đạo trực tiếp cho việc phát triển kinh tế thị trường định hướng xã hội chủ nghĩa trong giai đoạn hiện nay\" không được đề cập trực tiếp hoặc là ý nghĩa được định nghĩa trong tài liệu."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo tài liệu, khi nghiên cứu môn học Tư tưởng Hồ Chí Minh, sinh viên sẽ KHÔNG đạt được mục tiêu nào sau đây?","goiy":"Xem xét các ý nghĩa của môn học được liệt kê trong phần II của tài liệu để xác định mục tiêu nào không liên quan.","pa":[{"k":"A","t":"Nâng cao năng lực tư duy lý luận"},{"k":"B","t":"Củng cố lập trường cách mạng vững chắc"},{"k":"C","t":"Vận dụng tư tưởng giải quyết thực tiễn"}, D","E"],"gt":"Các phương án này đều được trình bày trong phần \"Khái niệm trên là sự ghi nhận quá trình nhận thức của Đảng Cộng sản Việt Nam về tư tưởng Hồ Chí Minh\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo tài liệu, các sinh viên nghiên cứu môn học Tư tưởng Hồ Chí Minh có thể vận dụng phương châm \"Dĩ bất biến, ứng vạn biến\" của Hồ Chí Minh vào việc xây dựng những phong cách nào? (Chọn nhiều đáp án đúng)","goiy":"Phần \"Xây dựng, rèn luyện phương pháp và phong cách công tác\" liệt kê các phong cách có thể vận dụng.","pa":[{"k":"A","t":"Xây dựng phong cách tư duy linh hoạt"},{"k":"B","t":"Xây dựng phong cách diễn đạt truyền cảm"},{"k":"C","t":"Xây dựng phong cách làm việc khoa học"},{"k":"D","t":"Xây dựng phong cách ứng xử văn minh"},{"k":"E","t":"Xây dựng phong cách sinh hoạt lành mạnh"}],"dung":["A","B","C","D","E"],"gt":"Tài liệu liệt kê rõ ràng: \"Người học có thể vận dụng xây dựng phong cách tư duy, phong cách diễn đạt, phong cách làm việc, phong cách ứng xử, phong cách sinh hoạt, v.v. phù hợp với hoàn cảnh như phương châm của Hồ Chí Minh: Dĩ bất biến, ứng vạn biến.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"“Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam...” là khái niệm được nêu ra tại Đại hội đại biểu toàn quốc lần thứ ____ của Đảng Cộng sản Việt Nam (năm 2011).","goiy":"Hãy nhớ số thứ tự của Đại hội Đảng đã định nghĩa khái niệm này vào năm 2011.","pa":[{"k":"A","t":"Đại hội đại biểu toàn quốc lần IX"},{"k":"B","t":"Đại hội đại biểu toàn quốc lần X"},{"k":"C","t":"Đại hội đại biểu toàn quốc lần XI"},{"k":"D","t":"Đại hội đại biểu toàn quốc lần XII"},{"k":"E","t":"Đại hội đại biểu toàn quốc lần XIII"}],"dung":["C"],"gt":"Khái niệm Tư tưởng Hồ Chí Minh hoàn chỉnh nêu trên được chính thức ghi nhận tại Đại hội đại biểu toàn quốc lần thứ XI của Đảng Cộng sản Việt Nam (năm 2011)."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Tư tưởng Hồ Chí Minh được xác định là nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam cùng với ____.","goiy":"Tài liệu thường xuyên nhắc đến hai trụ cột tạo nên nền tảng tư tưởng của Đảng.","pa":[{"k":"A","t":"Tinh thần của chủ nghĩa yêu nước"},{"k":"B","t":"Lý luận của chủ nghĩa xã hội khoa học"},{"k":"C","t":"Hệ tư tưởng Chủ nghĩa Mác - Lênin"},{"k":"D","t":"Truyền thống của chủ nghĩa nhân văn"},{"k":"E","t":"Tinh thần của chủ nghĩa tập thể"}],"dung":["C"],"gt":"Tài liệu đều khẳng định: \"Cùng với chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh là một bộ phận cấu thành làm nên nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Con đường phát triển của dân tộc Việt Nam theo Tư tưởng Hồ Chí Minh là độc lập dân tộc gắn liền với ____.","goiy":"Hãy tìm mục tiêu cụ thể mà Người đã lựa chọn cho con đường cách mạng Việt Nam.","pa":[{"k":"A","t":"Mục tiêu xây dựng nền Dân chủ"},{"k":"B","t":"Mục tiêu Phát triển bền vững"},{"k":"C","t":"Con đường Chủ nghĩa xã hội"},{"k":"D","t":"Đẩy mạnh sự nghiệp Đổi mới"},{"k":"E","t":"Đẩy mạnh Công nghiệp hóa đất nước"}],"dung":["C"],"gt":"Theo tài liệu môn học: \"Để đạt mục tiêu đó, con đường phát triển của dân tộc Việt Nam là độc lập dân tộc gắn liền với chủ nghĩa xã hội.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Tổ chức quốc tế nào đã ra Nghị quyết về kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh, tôn vinh Người là \"Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam\"?","goiy":"Hãy nhớ tên tổ chức văn hóa, khoa học, giáo dục của Liên Hợp Quốc đã đưa ra nghị quyết này.","pa":[{"k":"A","t":"Tổ chức Liên Hợp Quốc (Liên Hiệp Quốc)"},{"k":"B","t":"Tổ chức Giáo dục, Khoa học & Văn hóa UNESCO"},{"k":"C","t":"Tổ chức Y tế Thế giới (WHO)"},{"k":"D","t":"Quỹ Nhi đồng Liên Hợp Quốc (UNICEF)"},{"k":"E","t":"Quỹ Tiền tệ Quốc tế (IMF)"}],"dung":["B"],"gt":"Tài liệu ghi rõ: \"Tổ chức Giáo dục, Khoa học và Văn hóa của Liên hợp quốc (UNESCO)... đã ra Nghị quyết số 240/18.6.5 về kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh, trong đó xác nhận... “Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam”\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo tài liệu, việc nghiên cứu môn học Tư tưởng Hồ Chí Minh giúp sinh viên tích cực, chủ động đấu tranh phê phán những quan điểm sai trái để bảo vệ sự trong sáng của chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, đường lối, chủ trương của Đảng, chính sách, pháp luật của ____.","goiy":"Trong hệ thống chính trị Việt Nam, ai là chủ thể ban hành chính sách, pháp luật được nhắc đến cùng với Đảng?","pa":[{"k":"A","t":"Cơ quan Quản lý Chính phủ"},{"k":"B","t":"Nhà nước Cộng hòa XHCN Việt Nam"},{"k":"C","t":"Cơ quan Lập pháp Quốc hội"},{"k":"D","t":"Mặt trận Tổ quốc Việt Nam"},{"k":"E","t":"Đoàn Thanh niên Cộng sản Hồ Chí Minh"}],"dung":["B"],"gt":"Trích từ tài liệu: \"tích cực, chủ động đấu tranh phê phán những quan điểm sai trái để bảo vệ sự trong sáng của chủ nghĩa Mác Lênin, tư tưởng Hồ Chí Minh, đường lối, chủ trương của Đảng, chính sách, pháp luật của Nhà nước\"."}]},{"ma":"02","ten":"Cơ sở hình thành","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Phong trào Cần Vương cuối thế kỷ XIX thất bại chứng tỏ rằng tư tưởng phong kiến đã lỗi thời và không thể đáp ứng được các nhiệm vụ lịch sử của dân tộc.","goiy":"Hãy xem xét nguyên nhân thất bại của các phong trào yêu nước dưới ngọn cờ \"Cần Vương\" được nhắc đến trong tài liệu.","pa":[{"k":"A","t":"Khẳng định trên là hoàn toàn đúng đắn"},{"k":"B","t":"Khẳng định trên là hoàn toàn sai lầm"}],"dung":["A"],"gt":"Tài liệu môn học nêu rõ: \"Các cuộc khởi nghĩa vũ trang dưới ngọn cờ “Cần Vương” do các sĩ phu, văn thần lãnh đạo cuối cùng đều thất bại. Điều đó chứng tỏ tư tưởng phong kiến tỏ ra lỗi thời trước các nhiệm vụ lịch sử.\""},{"loai":"mot","dang":"Đúng hay sai","q":"Mặc dù chịu ba tầng áp bức bóc lột là thực dân, tư bản và phong kiến, nhưng giai cấp công nhân Việt Nam cuối thế kỷ XIX đầu thế kỷ XX vẫn chưa thể vươn lên thành lực lượng lãnh đạo cách mạng do số lượng còn ít ỏi và sự thiếu ổn định.","goiy":"Tập trung vào vai trò và phẩm chất của giai cấp công nhân Việt Nam được miêu tả trong tài liệu môn học, đặc biệt là nhận định của Hồ Chí Minh.","pa":[{"k":"A","t":"Nhận định nêu trên là hoàn toàn đúng"},{"k":"B","t":"Nhận định nêu trên là hoàn toàn sai"}],"dung":["B"],"gt":"Mặc dù lúc đầu công nhân là lực lượng ít ỏi, không ổn định, nhưng đến đầu thế kỷ XX, họ đã phát triển và trở thành một giai cấp ngay trước Chiến tranh thế giới thứ nhất (1914 - 1918). Tài liệu môn học khẳng định: \"Chỉ có giai cấp công nhân là dũng cảm nhất, cách mạng nhất, luôn luôn gan góc đương đầu với bọn đế quốc thực dân\" và chính phong trào công nhân đã tạo điều kiện thuận lợi để chủ nghĩa Mác - Lênin xâm nhập, truyền bá vào Việt Nam, chấm dứt sự khủng hoảng về đường lối cách mạng."},{"loai":"mot","dang":"Đúng hay sai","q":"Cách mạng Tháng Mười Nga năm 1917 chỉ có ý nghĩa cục bộ đối với nước Nga mà không tạo ra bước ngoặt quyết định cho phong trào giải phóng dân tộc trên thế giới.","goiy":"Hãy đọc kỹ phần miêu tả về ý nghĩa và ảnh hưởng của Cách mạng Tháng Mười Nga đối với tình hình thế giới.","pa":[{"k":"A","t":"Đánh giá nêu trên là hoàn toàn đúng"},{"k":"B","t":"Đánh giá nêu trên là hoàn toàn sai"}],"dung":["B"],"gt":"Tài liệu môn học khẳng định Cách mạng Tháng Mười Nga \"là thắng lợi đầu tiên của chủ nghĩa Mác - Lênin ở một nước lớn\" và \"mở ra một thời đại mới trong lịch sử loài người – thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới, mở ra con đường giải phóng cho các dân tộc bị áp bức trên thế giới\". Rõ ràng, nó có ý nghĩa toàn cầu, không chỉ cục bộ."},{"loai":"mot","dang":"Đúng hay sai","q":"Chủ nghĩa yêu nước là giá trị truyền thống tốt đẹp của dân tộc Việt Nam, nhưng nó chỉ là một trong nhiều động lực để Hồ Chí Minh ra đi tìm đường cứu nước, không phải là yếu tố khởi phát then chốt.","goiy":"Tìm hiểu vị trí và vai trò của chủ nghĩa yêu nước trong các giá trị truyền thống dân tộc đối với hành trình tìm đường cứu nước của Hồ Chí Minh.","pa":[{"k":"A","t":"Quan điểm nêu trên hoàn toàn đúng"},{"k":"B","t":"Quan điểm nêu trên hoàn toàn sai"}],"dung":["B"],"gt":"Tài liệu môn học khẳng định: \"Chính chủ nghĩa yêu nước là nền tảng tư tưởng, điểm xuất phát và động lực thúc đẩy Hồ Chí Minh ra đi tìm đường cứu nước, và tìm thấy ở chủ nghĩa Mác - Lênin con đường cứu nước, cứu dân.\" Điều này cho thấy chủ nghĩa yêu nước là yếu tố khởi phát then chốt, không phải chỉ \"một trong nhiều động lực\"."},{"loai":"mot","dang":"Đúng hay sai","q":"Hồ Chí Minh là người kế thừa một cách máy móc tư tưởng \"nhân trị, đức trị\" của Nho giáo trong quản lý xã hội, không có sự đổi mới sáng tạo nào.","goiy":"Đọc phần về sự kế thừa Nho giáo của Hồ Chí Minh, chú ý đến các từ khóa như \"kế thừa và đổi mới\", \"kế thừa và phát triển\".","pa":[{"k":"A","t":"Nhận định nêu trên hoàn toàn đúng"},{"k":"B","t":"Nhận định nêu trên hoàn toàn sai"}],"dung":["B"],"gt":"Tài liệu môn học chỉ ra rằng Hồ Chí Minh \"chú ý kế thừa và đổi mới tư tưởng dùng nhân trị, đức trị để quản lý xã hội\" và \"chú ý kế thừa, đổi mới, phát triển tinh thần trọng đạo đức của Nho giáo\". Điều này bác bỏ nhận định Người kế thừa một cách máy móc."},{"loai":"mot","dang":"Đúng hay sai","q":"Tài năng hoạt động và tổng kết thực tiễn của Hồ Chí Minh chủ yếu được hình thành qua việc nghiên cứu sách vở và tài liệu lý luận, chứ không phải từ vốn sống và hoạt động thực tiễn phong phú ở nhiều quốc gia.","goiy":"Hãy xem xét kỹ các yếu tố hình thành nhân tố chủ quan Hồ Chí Minh, đặc biệt là \"Tài năng hoạt động, tổng kết thực tiễn phát triển lý luận\".","pa":[{"k":"A","t":"Khẳng định trên hoàn toàn đúng đắn"},{"k":"B","t":"Khẳng định trên hoàn toàn sai lầm"}],"dung":["B"],"gt":"Tài liệu môn học nhấn mạnh: \"Hồ Chí Minh là người có vốn sống và thực tiễn cách mạng phong phú, phi thường. Trước khi trở thành Chủ tịch nước, Hồ Chí Minh đã sống, học tập và hoạt động cách mạng ở gần 30 nước trên thế giới.\" Điều này cho thấy vai trò vượt trội của thực tiễn so với chỉ nghiên cứu sách vở."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Đâu là nguyên nhân sâu xa nhất dẫn đến sự thất bại của các phong trào yêu nước theo khuynh hướng dân chủ tư sản ở Việt Nam đầu thế kỷ XX?","goiy":"Tài liệu môn học đã chỉ rõ nguyên nhân sâu xa và trực tiếp của sự thất bại này.","pa":[{"k":"A","t":"Thiếu vũ khí hiện đại và sự đoàn kết trong toàn dân"},{"k":"B","t":"Sự đàn áp vô cùng tàn bạo của chính quyền Pháp"},{"k":"C","t":"Giai cấp tư sản Việt Nam còn rất non yếu tổ chức"},{"k":"D","t":"Sự thiếu vắng một nhà lãnh đạo kiệt xuất tài ba"},{"k":"E","t":"Sự lỗi thời lạc hậu của hệ tư tưởng phong kiến"}],"dung":["C"],"gt":"Tài liệu môn học chỉ rõ: \"Các phong trào yêu nước theo khuynh hướng dân chủ tư sản nói trên đều thất bại. Nguyên nhân sâu xa là giai cấp tư sản Việt Nam còn non yếu. Nguyên nhân trực tiếp là các tổ chức và người lãnh đạo của các phong trào chưa có đường lối và phương pháp cách mạng đúng đắn.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Nhận định nào sau đây của Hồ Chí Minh về giai cấp công nhân Việt Nam thể hiện rõ nhất vai trò tiên phong của họ trong cuộc đấu tranh giải phóng dân tộc?","goiy":"Tìm kiếm một trích dẫn trực tiếp của Hồ Chí Minh trong đoạn văn về phẩm chất của giai cấp công nhân.","pa":[{"k":"A","t":"Công nhân Việt Nam chịu ba tầng áp bức bóc lột"},{"k":"B","t":"Họ đã nhanh chóng tiến tới đình công bãi công"},{"k":"C","t":"Chỉ có giai cấp công nhân dũng cảm nhất cách mạng"},{"k":"D","t":"Lực lượng công nhân lúc đó mới chỉ là lực lượng"},{"k":"E","t":"Công nhân phát triển hơn và trở thành giai cấp"}],"dung":["C"],"gt":"Tài liệu môn học trích lời Hồ Chí Minh: \"“Chỉ có giai cấp công nhân là dũng cảm nhất, cách mạng nhất, luôn luôn gan góc đương đầu với bọn đế quốc thực dân”\". Nhận định này trực tiếp khẳng định vai trò tiên phong và tính cách mạng của giai cấp công nhân."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Tài liệu môn học, yếu tố lý luận nào được xem là tiền đề quan trọng nhất, có vai trò quyết định trong việc hình thành tư tưởng Hồ Chí Minh?","goiy":"Tài liệu môn học đã nêu rõ vai trò của từng yếu tố lý luận, và có một yếu tố được đánh giá là \"quan trọng nhất\" và \"quyết định\".","pa":[{"k":"A","t":"Giá trị truyền thống tốt đẹp của dân tộc Việt Nam"},{"k":"B","t":"Tinh hoa văn hóa phương Đông qua các thời kỳ lịch sử"},{"k":"C","t":"Tinh hoa văn hóa phương Tây với tư tưởng tiến bộ"},{"k":"D","t":"Chủ nghĩa Mác – Lênin khoa học và cách mạng thế giới"},{"k":"E","t":"Toàn bộ cơ sở thực tiễn phong phú Việt Nam thế giới"}],"dung":["D"],"gt":"Tài liệu môn học khẳng định: \"Chủ nghĩa Mác – Lênin là tiền đề lý luận quan trọng nhất, có vai trò quyết định trong việc hình thành tư tưởng Hồ Chí Minh.\" Các yếu tố khác cũng quan trọng nhưng không được đánh giá là \"quan trọng nhất\" và \"quyết định\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh đã tiếp thu và phát triển sáng tạo quan điểm nào của Tôn Trung Sơn theo con đường cách mạng vô sản?","goiy":"Tìm phần đề cập đến ảnh hưởng của Tôn Trung Sơn và cách Hồ Chí Minh vận dụng.","pa":[{"k":"A","t":"Tư tưởng về Tự do - Bình đẳng - Bác ái của Pháp"},{"k":"B","t":"Các quan điểm nhân quyền dân quyền Tuyên ngôn Mỹ"},{"k":"C","t":"Các quan điểm dân tộc, dân quyền, dân sinh Tam dân"},{"k":"D","t":"Tư tưởng dùng nhân trị đức trị quản lý Nho giáo"},{"k":"E","t":"Triết lý từ bi vị tha yêu thương người Phật giáo"}],"dung":["C"],"gt":"Tài liệu môn học nêu rõ: \"Hồ Chí Minh đã phát triển sáng tạo các quan điểm về dân tộc, dân quyền, dân sinh của Tôn Trung Sơn trong cách mạng dân chủ tư sản thành tư tưởng đấu tranh cho Độc lập - Tự do - Hạnh phúc của con người và dân tộc Việt Nam theo con đường cách mạng vô sản.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, điểm chung giữa Khổng Tử, Giêsu, Mác và Tôn Dật Tiên là gì, thể hiện tầm nhìn tổng hợp của Người về các hệ tư tưởng?","goiy":"Xem xét nhận định của Hồ Chí Minh về các học thuyết lớn.","pa":[{"k":"A","t":"Đều ủng hộ con đường cách mạng xã hội chủ nghĩa"},{"k":"B","t":"Đều mưu hạnh phúc cho loài người, phúc lợi xã hội"},{"k":"C","t":"Đều đề cao vai trò lịch sử của giai cấp vô sản"},{"k":"D","t":"Đều khuyến khích con người sống gắn bó thiên nhiên"},{"k":"E","t":"Đều là những nhà cách mạng chân chính tiêu biểu"}],"dung":["B"],"gt":"Tài liệu môn học trích lời Hồ Chí Minh nhận định: \"Học thuyết Khổng Tử có ưu điểm là sự tu dưỡng đạo đức cá nhân. Tôn giáo Giêsu có ưu điểm là lòng nhân ái cao cả. Chủ nghĩa Mác có ưu điểm là phương pháp làm việc biện chứng. Chủ nghĩa Tôn Dật Tiên có ưu điểm là chính sách của nó phù hợp với điều kiện nước ta... Họ đều muốn “mưu hạnh phúc cho loài người, mưu phúc lợi cho xã hội”.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Điều nào sau đây thể hiện rõ nhất năng lực tư duy độc lập, tự chủ, sáng tạo của Hồ Chí Minh trong quá trình hình thành tư tưởng của Người?","goiy":"Tập trung vào các phẩm chất trí tuệ và phương pháp luận của Hồ Chí Minh được nêu trong phần \"Phẩm chất Hồ Chí Minh\".","pa":[{"k":"A","t":"Khả năng biết nhiều ngoại ngữ làm nhiều nghề sống"},{"k":"B","t":"Sự tận trung với nước tận hiếu với dân cả cuộc đời"},{"k":"C","t":"Vận dụng quy luật chung vào hoàn cảnh riêng Việt Nam"},{"k":"D","t":"Việc tham gia sáng lập Đảng Pháp và Quốc tế CS"},{"k":"E","t":"Khả năng đọc nhiều tác phẩm văn học lớn thế giới"}],"dung":["C"],"gt":"Tài liệu môn học mô tả phẩm chất của Người: \"Hồ Chí Minh còn là người có bản lĩnh tư duy độc lập, tự chủ, sáng tạo, giàu tính phê phán, đổi mới và cách mạng; đã vận dụng đúng quy luật chung của xã hội loài người, của cách mạng thế giới vào hoàn cảnh riêng, cụ thể của Việt Nam, đề xuất tư tưởng, đường lối cách mạng mới đáp ứng đúng đòi hỏi thực tiễn\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG phản ánh đúng tình hình xã hội Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX dưới tác động của thực dân Pháp?","goiy":"Đọc kỹ phần mô tả về sự thay đổi kinh tế - xã hội và cơ cấu giai cấp Việt Nam sau khi Pháp hoàn thành bình định quân sự.","pa":[{"k":"A","t":"Nền kinh tế nông nghiệp lạc hậu vẫn tiếp tục duy trì"},{"k":"B","t":"Cơ cấu giai cấp tầng lớp xã hội có chuyển biến sâu"},{"k":"C","t":"Giai cấp địa chủ bị suy yếu trầm trọng do Pháp"},{"k":"D","t":"Xuất hiện các tầng lớp mới như công nhân tiểu tư sản"},{"k":"E","t":"Phát sinh mâu thuẫn mới giữa nhân dân ta với Pháp"}],"dung":["C"],"gt":"Tài liệu môn học cho biết: \"Thực dân Pháp vẫn duy trì nền kinh tế nông nghiệp lạc hậu... giai cấp địa chủ được bổ sung, củng cố, tăng cường thêm các điền chủ người Pháp và người nước ngoài.\" Như vậy, giai cấp địa chủ không bị suy yếu mà ngược lại, còn được củng cố."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Điều nào sau đây KHÔNG phải là một trong những mâu thuẫn cơ bản của xã hội Việt Nam được hình thành hoặc phát triển gay gắt vào đầu thế kỷ XX?","goiy":"Phân biệt các mâu thuẫn nội tại của xã hội Việt Nam với các mâu thuẫn trên phạm vi thế giới.","pa":[{"k":"A","t":"Mâu thuẫn giữa nông dân với địa chủ phong kiến"},{"k":"B","t":"Mâu thuẫn giữa giai cấp công nhân với tư sản"},{"k":"C","t":"Mâu thuẫn giữa toàn thể nhân dân Việt Nam với Pháp"},{"k":"D","t":"Mâu thuẫn giữa vô sản và tư sản ở các nước TB"},{"k":"E","t":"Mâu thuẫn giữa các dân tộc thuộc địa với đế quốc"}],"dung":["D"],"gt":"Các mâu thuẫn A, B, C được nêu rõ là mâu thuẫn trong xã hội Việt Nam. Mâu thuẫn D và E là các mâu thuẫn trên phạm vi thế giới (trong lòng chủ nghĩa tư bản và giữa các dân tộc thuộc địa với chủ nghĩa đế quốc), không phải là mâu thuẫn trực tiếp của xã hội Việt Nam."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Yếu tố nào sau đây KHÔNG được xem là một trong những giá trị truyền thống tốt đẹp của dân tộc Việt Nam được Hồ Chí Minh kế thừa và phát triển?","goiy":"Đọc kỹ phần về các giá trị truyền thống dân tộc mà Hồ Chí Minh đã kế thừa.","pa":[{"k":"A","t":"Chủ nghĩa yêu nước nồng nàn gắn liền yêu dân"},{"k":"B","t":"Tinh thần đoàn kết nhân ái khoan dung cộng đồng"},{"k":"C","t":"Tinh thần cần cù dũng cảm sáng tạo luôn lạc quan"},{"k":"D","t":"Đặt lợi ích cá nhân lên trên lợi ích tập thể"},{"k":"E","t":"Niềm tự hào lịch sử trân trọng văn hóa dân tộc"}],"dung":["D"],"gt":"Các lựa chọn A, B, C, E đều là những giá trị truyền thống tốt đẹp của dân tộc Việt Nam. Lựa chọn D, \"đặt lợi ích cá nhân lên trên lợi ích tập thể\", hoàn toàn trái ngược với tinh thần yêu nước, đoàn kết và cộng đồng của dân tộc Việt Nam."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Đặc điểm nào sau đây KHÔNG phản ánh đúng sự kế thừa và phát triển tinh hoa văn hóa phương Tây của Hồ Chí Minh?","goiy":"Chú ý đến cách thức và phạm vi Hồ Chí Minh tiếp cận và nghiên cứu văn hóa phương Tây.","pa":[{"k":"A","t":"Quan tâm tới khẩu hiệu Tự do - Bình đẳng - Bác ái"},{"k":"B","t":"Kế thừa phát triển quan điểm nhân quyền dân quyền"},{"k":"C","t":"Nghiên cứu trực tiếp tư tưởng nhân văn nhà khai sáng"},{"k":"D","t":"Chỉ đọc tác phẩm phương Tây qua bản dịch tiếng Việt"},{"k":"E","t":"Đề xuất quan điểm về quyền mưu cầu độc lập dân tộc"}],"dung":["D"],"gt":"Tài liệu môn học nêu rõ: \"Người trực tiếp nghiên cứu tư tưởng nhân văn... thích đọc sách văn học của Shakespeare bằng tiếng Anh, Lỗ Tấn bằng tiếng Trung Hoa, Hugo, Zola bằng tiếng Pháp\". Điều này cho thấy Người đọc bằng ngôn ngữ gốc, không chỉ bản dịch tiếng Việt."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Điều nào sau đây KHÔNG phải là một trong những đóng góp sáng tạo của Hồ Chí Minh vào chủ nghĩa Mác - Lênin trong thời đại mới?","goiy":"Phân biệt việc vận dụng và khẳng định giá trị của chủ nghĩa Mác - Lênin với việc bổ sung, phát triển nó.","pa":[{"k":"A","t":"Phát triển vấn đề dân tộc cách mạng giải phóng"},{"k":"B","t":"Bổ sung các luận điểm chủ nghĩa xã hội Việt Nam"},{"k":"C","t":"Đưa ra quan điểm mới về xây dựng Đảng Nhà nước"},{"k":"D","t":"Khẳng định Mác - Lênin là vũ khí không thay thế"},{"k":"E","t":"Phát triển các vấn đề đạo đức cách mạng Việt Nam"}],"dung":["D"],"gt":"Việc khẳng định \"chủ nghĩa Mác - Lênin là vũ khí không gì thay thế được\" là sự thừa nhận giá trị và tầm quan trọng của chủ nghĩa Mác - Lênin, nhưng bản thân nó không phải là sự bổ sung hay phát triển về mặt lý luận, mà là kết quả của việc vận dụng thành công."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG thuộc về những phẩm chất cá nhân đã góp phần quyết định thành công của Hồ Chí Minh trong hoạt động lý luận và thực tiễn?","goiy":"Đọc kỹ phần mô tả về \"Phẩm chất Hồ Chí Minh\".","pa":[{"k":"A","t":"Có lý tưởng cao cả và hoài bão cứu dân cứu nước"},{"k":"B","t":"Có bản lĩnh tư duy độc lập tự chủ sáng tạo phê phán"},{"k":"C","t":"Suốt đời tận trung với nước tận hiếu với nhân dân"},{"k":"D","t":"Tập trung một chuyên môn sâu tránh đa dạng hóa"},{"k":"E","t":"Tầm nhìn chiến lược bao quát năng lực dự báo đúng"}],"dung":["D"],"gt":"Các lựa chọn A, B, C, E đều là những phẩm chất tiêu biểu của Hồ Chí Minh. Lựa chọn D, \"Năng lực tập trung vào một lĩnh vực chuyên môn sâu, tránh đa dạng hóa kiến thức\", trái ngược với việc Hồ Chí Minh có vốn học thức văn hoá sâu rộng Đông Tây kim cổ."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Các phong trào yêu nước ở Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX (trước khi Hồ Chí Minh tìm thấy con đường cứu nước) thất bại do nguyên nhân chủ yếu nào?","goiy":"Xem xét các nguyên nhân được nêu cho sự thất bại của cả phong trào Cần Vương và phong trào dân chủ tư sản.","pa":[{"k":"A","t":"Tư tưởng phong kiến lỗi thời, tư sản non yếu, thiếu đường lối đúng"},{"k":"B","t":"Nhân dân thiếu tinh thần yêu nước và không muốn tham gia đấu tranh"},{"k":"C","t":"Thiếu hoàn toàn sự hợp tác quốc tế từ các quốc gia trên thế giới"},{"k":"D","t":"Chính quyền thực dân Pháp hoàn toàn không đàn áp các phong trào"},{"k":"E","t":"Các sĩ phu phong kiến chủ động đầu hàng và không hề phản kháng"}],"dung":["A"],"gt":"Tài liệu môn học chỉ rõ: Phong trào Cần Vương thất bại chứng tỏ tư tưởng phong kiến đã lỗi thời. Các phong trào dân chủ tư sản thất bại do giai cấp tư sản Việt Nam còn non yếu và các tổ chức, người lãnh đạo chưa có đường lối, phương pháp cách mạng đúng đắn."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Các mâu thuẫn chính nào đã trở nên sâu sắc và gay gắt trong lòng chủ nghĩa tư bản thế giới cuối thế kỷ XIX - đầu thế kỷ XX khi chuyển sang giai đoạn đế quốc chủ nghĩa?","goiy":"Đọc phần về thực tiễn thế giới cuối thế kỷ XIX - đầu thế kỷ XX, đặc biệt là các mâu thuẫn phát sinh trong giai đoạn chủ nghĩa đế quốc.","pa":[{"k":"A","t":"Mâu thuẫn giữa tư sản - vô sản, giữa các đế quốc, thuộc địa - đế quốc"},{"k":"B","t":"Mâu thuẫn giữa tư sản Việt Nam và thực dân Pháp cùng phong kiến"},{"k":"C","t":"Mâu thuẫn giữa nông dân Việt Nam và giai cấp địa chủ phong kiến"},{"k":"D","t":"Mâu thuẫn giữa các quốc gia phong kiến phương Đông với phương Tây"},{"k":"E","t":"Mâu thuẫn nội bộ giữa các tầng lớp nông dân nghèo tại Việt Nam"}],"dung":["A"],"gt":"Tài liệu môn học nêu rõ 3 mâu thuẫn cơ bản trong lòng chủ nghĩa tư bản thế giới: Mâu thuẫn giữa tư sản và vô sản ở các nước tư bản; mâu thuẫn giữa các nước đế quốc với nhau; mâu thuẫn giữa các dân tộc thuộc địa, phụ thuộc với chủ nghĩa đế quốc."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Những đặc điểm nào của Hồ Chí Minh đã cho phép Người tiếp thu sâu sắc \"kho tàng tri thức mà nhân loại đã tạo ra\" và trở thành người cộng sản với tầm vóc trí tuệ lớn?","goiy":"Xem xét các yếu tố về phẩm chất và tài năng của Hồ Chí Minh liên quan đến việc thu nạp tri thức và hoạt động cách mạng.","pa":[{"k":"A","t":"Chỉ nghiên cứu duy nhất tài liệu lý luận Mác - Lênin trong thư viện"},{"k":"B","t":"Ý chí lớn, biết nhiều ngoại ngữ, học rộng Đông Tây và tổng kết thực tiễn"},{"k":"C","t":"Tránh tham gia thực tiễn để tập trung vào việc đọc sách nghiên cứu"},{"k":"D","t":"Chỉ kế thừa tư tưởng phương Đông mà bỏ qua tri thức phương Tây"},{"k":"E","t":"Hoàn toàn phụ thuộc vào sự giúp đỡ hướng dẫn của các học giả khác"}],"dung":["B"],"gt":"Người có ý chí nghị lực to lớn, bạt thiệp nhiều ngoại ngữ, làm nhiều nghề để kiếm sống, kết hợp học ở nhà trường, sách vở, thực tế và nhân dân khắp nơi, tích lũy vốn học thức sâu rộng Đông Tây kim cổ và có năng lực tổng kết thực tiễn xuất sắc."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong hành trình tìm đường cứu nước, Hồ Chí Minh đã tiếp thu những tư tưởng tiến bộ nào từ phương Tây?","goiy":"Chú ý đến phần về \"Tinh hoa văn hóa phương Tây\" trong tài liệu môn học.","pa":[{"k":"A","t":"Khẩu hiệu Tự do-Bình đẳng-Bác ái, nhân quyền dân quyền, tư tưởng khai sáng"},{"k":"B","t":"Tư tưởng triết học Phật giáo và chủ nghĩa Găng-đi Ấn Độ phương Đông"},{"k":"C","t":"Chủ nghĩa Tam dân của Tôn Trung Sơn và tư tưởng Nho giáo Trung Hoa"},{"k":"D","t":"Các học thuyết bảo thủ duy tâm của giai cấp phong kiến phong kiến"},{"k":"E","t":"Các tư tưởng vô chính phủ và tư tưởng bạo lực cực đoan vô căn cứ"}],"dung":["A"],"gt":"Hồ Chí Minh đã quan tâm tới khẩu hiệu \"Tự do - Bình đẳng - Bác ái\" của Đại Cách mạng Pháp 1789, kế thừa quan điểm nhân quyền, dân quyền trong Tuyên ngôn độc lập Mỹ 1776, Tuyên ngôn nhân quyền Pháp 1791 và nghiên cứu tư tưởng nhân văn, dân chủ của các nhà khai sáng (Vonte, Rútxô, Môngtétxkiơ)."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Những giá trị tích cực nào của Phật giáo đã được Hồ Chí Minh chú ý kế thừa và phát triển để phục vụ sự nghiệp cách mạng Việt Nam?","goiy":"Đọc kỹ phần về sự kế thừa Phật giáo của Hồ Chí Minh, phân biệt với các học thuyết khác.","pa":[{"k":"A","t":"Tư tưởng từ bi vị tha, chống điều ác, bình đẳng, hòa đồng với đất nước"},{"k":"B","t":"Tư tưởng thoát mọi ràng buộc của vòng danh lợi theo Lão giáo Trung Quốc"},{"k":"C","t":"Tư tưởng dùng nhân trị đức trị để quản lý xã hội của Nho giáo Khổng Tử"},{"k":"D","t":"Quan điểm chủ xướng chiến tranh để mở rộng lãnh thổ quốc gia dân tộc"},{"k":"E","t":"Quan điểm coi thường thế sự và xa rời mọi hoạt động thực tiễn cứu nước"}],"dung":["A"],"gt":"Đối với Phật giáo, Hồ Chí Minh chú ý kế thừa, phát triển tư tưởng từ bi, vị tha, yêu thương con người, khuyến khích làm việc thiện, chống lại điều ác, đề cao quyền bình đẳng của con người và khuyên con người sống hòa đồng, gắn bó với đất nước."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Thực tiễn Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX đã tạo ra những tiền đề quan trọng nào cho sự hình thành tư tưởng Hồ Chí Minh về cách mạng Việt Nam?","goiy":"Xem xét các biến động và tình hình xã hội Việt Nam từ năm 1858 đến đầu thế kỷ XX.","pa":[{"k":"A","t":"Thất bại phong trào yêu nước, ra đời giai cấp công nhân, xã hội thuộc địa"},{"k":"B","t":"Sự thành công rực rỡ của các cuộc vận động cải cách dân chủ tư sản"},{"k":"C","t":"Việt Nam đã trở thành một quốc gia hoàn toàn độc lập và phát triển mạnh"},{"k":"D","t":"Giai cấp tư sản Việt Nam đã lãnh đạo thành công cách mạng giải phóng"},{"k":"E","t":"Các mâu thuẫn xã hội ở Việt Nam hoàn toàn được giải quyết êm đẹp"}],"dung":["A"],"gt":"Tiền đề thực tiễn bao gồm: Sự thất bại liên tục của các phong trào yêu nước dẫn đến khủng hoảng đường lối cứu nước; sự ra đời và phát triển của giai cấp công nhân Việt Nam với phong trào đấu tranh mạnh mẽ; việc Pháp biến Việt Nam thành nước thuộc địa nửa phong kiến làm sâu sắc mâu thuẫn xã hội."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo tư tưởng Hồ Chí Minh, con người là vốn quý nhất là nhân tố quyết định thành công của cách mạng, dân là gốc của nước; nước lấy dân làm gốc; gốc có vững cây mới bền; xây lầu thắng lợi trên nền _______.","goiy":"Đọc phần về sự kế thừa các giá trị truyền thống dân tộc, đặc biệt là quan điểm về vai trò của nhân dân.","pa":[{"k":"A","t":"Nhân dân"},{"k":"B","t":"Văn hóa"},{"k":"C","t":"Lý luận"},{"k":"D","t":"Kỷ nguyên"}],"dung":["A"],"gt":"Tài liệu môn học nêu: \"Trong tư tưởng Hồ Chí Minh, con người là vốn quý nhất là nhân tố quyết định thành công của cách mạng, dân là gốc của nước; nước lấy dân làm gốc; gốc có vững cây mới bền; xây lầu thắng lợi trên nền nhân dân\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc ở Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX đã đặt ra câu hỏi thực tiễn là: Cứu nước bằng con đường nào để có thể đi đến ______?","goiy":"Xem xét kết cục của các phong trào yêu nước và câu hỏi được đặt ra từ thực tiễn.","pa":[{"k":"A","t":"Thắng lợi"},{"k":"B","t":"Độc lập"},{"k":"C","t":"Văn minh"},{"k":"D","t":"Hội nhập"}],"dung":["A"],"gt":"Tài liệu môn học nêu: \"Song, cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc. Xuất hiện câu hỏi từ thực tiễn đặt ra là: Cứu nước bằng con đường nào để có thể đi đến thắng lợi?\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Cách mạng Tháng Mười Nga năm 1917 thành công đã mở ra một ______ mới trong lịch sử loài người – thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới.","goiy":"Đọc phần về ý nghĩa lịch sử của Cách mạng Tháng Mười Nga.","pa":[{"k":"A","t":"Thời đại"},{"k":"B","t":"Kỷ nguyên"},{"k":"C","t":"Chân lý"},{"k":"D","t":"Lý luận"}],"dung":["A"],"gt":"Tài liệu môn học nêu: \"Cách mạng Tháng Mười Nga mở ra một thời đại mới trong lịch sử loài người – thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh là một biểu tượng cao đẹp của sự tích hợp tinh hoa văn hóa phương Đông và phương Tây, với chủ trương văn hóa là mục tiêu, động lực của cách mạng; cần giữ gìn cốt cách văn hóa dân tộc, đồng thời tiếp thu tinh hoa văn hóa _______, xây dựng nền văn hóa mới của Việt Nam.","goiy":"Tìm phần đề cập đến quan điểm của Hồ Chí Minh về việc xây dựng nền văn hóa mới.","pa":[{"k":"A","t":"Nhân loại"},{"k":"B","t":"Thế giới"},{"k":"C","t":"Tiến bộ"},{"k":"D","t":"Hiện đại"}],"dung":["A"],"gt":"Tài liệu môn học nêu: \"Hồ Chí Minh chính là một biểu tượng cao đẹp của sự tích hợp tinh hoa văn hóa phương Đông và phương Tây... cần giữ gìn cốt cách văn hóa dân tộc, đồng thời tiếp thu tinh hoa văn hóa nhân loại, xây dựng nền văn hóa mới của Việt Nam.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh khẳng định: “Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mạng nhất là chủ nghĩa ______”.","goiy":"Tìm trích dẫn của Hồ Chí Minh về chủ nghĩa mà Người cho là ưu việt nhất.","pa":[{"k":"A","t":"Lênin"},{"k":"B","t":"Yêu nước"},{"k":"C","t":"Dân tộc"},{"k":"D","t":"Xã hội"}],"dung":["A"],"gt":"Tài liệu môn học trích lời Hồ Chí Minh: \"Ngay từ cuối những năm 20 của thế kỷ XX, Hồ Chí Minh đã khẳng định rằng: “Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mạng nhất là chủ nghĩa Lênin”\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh là nhà tổ chức vĩ đại của cách mạng Việt Nam, Người đã hiện thực hóa tư tưởng, lý luận cách mạng thành hiện thực sinh động; đồng thời tổng kết thực tiễn cách mạng, bổ sung, phát triển ______ cách mạng.","goiy":"Đọc phần về tài năng hoạt động và tổng kết thực tiễn của Hồ Chí Minh.","pa":[{"k":"A","t":"Lý luận"},{"k":"B","t":"Phong trào"},{"k":"C","t":"Mục tiêu"},{"k":"D","t":"Đường lối"}],"dung":["A"],"gt":"Tài liệu môn học nêu: \"Hồ Chí Minh là nhà tổ chức vĩ đại của cách mạng Việt Nam. Người đã hiện thực hóa tư tưởng, lý luận cách mạng thành hiện thực sinh động; đồng thời tổng kết thực tiễn cách mạng, bổ sung, phát triển lý luận, tư tưởng cách mạng.\""}]},{"ma":"03","ten":"Quá trình hình thành","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Việc Hồ Chí Minh tham gia phong trào chống thuế ở Trung Kỳ năm 1908 đã cho thấy Người đã hoàn toàn đoạn tuyệt với mọi tư tưởng cải cách và chấp nhận con đường bạo động cách mạng ngay từ thời điểm đó.","goiy":"Xem xét bối cảnh \"thời kỳ trước năm 1911\" và chí hướng chính của Hồ Chí Minh trong giai đoạn này, cũng như cách Người nhìn nhận các phương pháp cứu nước của tiền bối.","pa":[{"k":"A","t":"Nhận định Chính xác"},{"k":"B","t":"Nhận định Chưa đúng"}],"dung":["B"],"gt":"Trong thời kỳ trước năm 1911, Hồ Chí Minh hình thành tư tưởng yêu nước và chí hướng tìm đường cứu nước mới. Mặc dù Người đã tham gia phong trào chống thuế ở Trung Kỳ năm 1908, thể hiện rõ tư tưởng yêu nước trong hành động, nhưng Người vẫn đang trong quá trình \"suy ngẫm sâu sắc về Tổ quốc và thời cuộc\" và \"phê phán, không tán thành, không đi theo các phương pháp, khuynh hướng cứu nước của các vị khi đó\". Hành động này chưa phải là sự đoạn tuyệt hoàn toàn với mọi tư tưởng cải cách hay việc chấp nhận con đường bạo động cách mạng một cách dứt khoát."},{"loai":"mot","dang":"Đúng hay sai","q":"Quan điểm \"Nhân dân lao động các nước, trong đó có giai cấp công nhân, đều bị bóc lột có thể là bạn của nhau; còn chủ nghĩa đế quốc, bọn thực dân ở đâu cũng là kẻ bóc lột, là kẻ thù của nhân dân lao động\" của Hồ Chí Minh hình thành ngay lập tức sau khi Người đặt chân đến Pháp vào năm 1911.","goiy":"Chú ý đến khoảng thời gian và quá trình Người đi nhiều nước trước khi hình thành nhận thức này.","pa":[{"k":"A","t":"Nhận định Chính xác"},{"k":"B","t":"Nhận định Chưa đúng"}],"dung":["B"],"gt":"Nhận thức này không hình thành ngay lập tức khi Người đến Pháp năm 1911. Các tài liệu môn học nêu rõ rằng \"Từ năm 1911 đến năm 1917, từ Pháp, Hồ Chí Minh đến nhiều nước trên thế giới. Qua cuộc hành trình này, ở Người hình thành một nhận thức mới\". Điều này cho thấy đây là kết quả của một quá trình trải nghiệm, quan sát và suy ngẫm lâu dài trong nhiều năm, qua nhiều quốc gia."},{"loai":"mot","dang":"Đúng hay sai","q":"Việc Hồ Chí Minh gia nhập Đảng Xã hội Pháp vào năm 1919 chủ yếu vì Người đã nhận thức sâu sắc về chủ nghĩa Mác – Lênin và quyết tâm đi theo con đường cách mạng vô sản.","goiy":"Xem xét lý do ban đầu Người gia nhập Đảng Xã hội Pháp được nêu trong Tài liệu môn học.","pa":[{"k":"A","t":"Nhận định Chính xác"},{"k":"B","t":"Nhận định Chưa đúng"}],"dung":["B"],"gt":"Tài liệu môn học cho biết năm 1919, Người gia nhập Đảng Xã hội giai cấp công nhân Pháp \"bởi theo Người, đây là tổ chức theo đuổi lý tưởng cao quý Đại Cách mạng Pháp: Tự do, bình đẳng, bác ái\". Việc Hồ Chí Minh tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc theo con đường cách mạng vô sản qua nghiên cứu Luận cương của Lênin diễn ra sau đó, vào tháng 7/1920."},{"loai":"mot","dang":"Đúng hay sai","q":"Tác phẩm \"Bản án chế độ thực dân Pháp\" và báo \"Le Paria\" của Hồ Chí Minh chỉ tập trung tố cáo tội ác của thực dân Pháp mà không có mục đích nào khác đối với nhân dân các nước thuộc địa.","goiy":"Suy luận về mục đích sâu xa hơn của các hoạt động báo chí và lý luận chính trị của Hồ Chí Minh trong giai đoạn 1920-1930.","pa":[{"k":"A","t":"Nhận định Chính xác"},{"k":"B","t":"Nhận định Chưa đúng"}],"dung":["B"],"gt":"Mặc dù các tác phẩm như \"Bản án chế độ thực dân Pháp\" và báo \"Le Paria\" có mục đích lên án chủ nghĩa thực dân Pháp, nhưng mục tiêu sâu xa hơn của Hồ Chí Minh là \"thức tỉnh lương tri nhân dân Pháp và nhân loại tiến bộ, khơi dậy lòng yêu nước của nhân dân các dân tộc thuộc địa và của dân tộc Việt Nam\", cũng như \"thức tỉnh tinh thần giải phóng dân tộc của nhân dân các nước thuộc địa\"."},{"loai":"mot","dang":"Đúng hay sai","q":"Hội nghị Trung ương Đảng tháng 10/1930 đã khẳng định và phát triển thêm Cương lĩnh chính trị đầu tiên do Nguyễn Ái Quốc khởi thảo, đặc biệt là trong việc đặt nặng vấn đề dân tộc hơn vấn đề giai cấp.","goiy":"Nhớ lại những thách thức và sự hiểu lầm mà tư tưởng Hồ Chí Minh phải đối mặt trong giai đoạn 1920-1941, đặc biệt là nội dung của Nghị quyết Hội nghị Trung ương Đảng tháng 10/1930.","pa":[{"k":"A","t":"Nhận định Chính xác"},{"k":"B","t":"Nhận định Chưa đúng"}],"dung":["B"],"gt":"Ngược lại, Hội nghị Trung ương Đảng tháng 10/1930 đã ra nghị quyết cho rằng \"Hội nghị hợp nhất Đảng do Nguyễn Ái Quốc chủ trì có nhiều sai lầm, 'chỉ lo đến việc phản đế, mà quên mất lợi ích giai cấp tranh đấu ấy là một sự rất nguy hiểm'\" và \"thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\". Điều này cho thấy hội nghị đã phê phán, phủ nhận những quan điểm của Cương lĩnh chính trị đầu tiên."},{"loai":"mot","dang":"Đúng hay sai","q":"Khẩu hiệu \"Không có gì quý hơn độc lập, tự do\" của Hồ Chí Minh chỉ được nêu ra trong bối cảnh cuộc kháng chiến chống Mỹ cứu nước và không có giá trị xuyên suốt cho toàn bộ sự nghiệp cách mạng Việt Nam.","goiy":"Xem xét ý nghĩa của câu nói và bối cảnh được nhắc đến trong Tài liệu môn học, nhưng cũng suy luận về tinh thần chung trong tư tưởng của Người.","pa":[{"k":"A","t":"Nhận định Chính xác"},{"k":"B","t":"Nhận định Chưa đúng"}],"dung":["B"],"gt":"Mặc dù câu nói \"Không có gì quý hơn độc lập, tự do\" được Hồ Chí Minh nêu ra trong Lời kêu gọi đồng bào và chiến sĩ cả nước vào ngày 17/7/1966, nhưng nó được mô tả là \"một chân lý của thời đại\". Tinh thần độc lập, tự do là mục tiêu xuyên suốt trong toàn bộ quá trình tìm đường cứu nước, giải phóng dân tộc và xây dựng đất nước của Hồ Chí Minh."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Đâu là nguyên nhân sâu xa nhất khiến Hồ Chí Minh, dù khâm phục tinh thần yêu nước của các vị tiền bối như Phan Bội Châu, Phan Châu Trinh, Hoàng Hoa Thám, nhưng lại \"sáng suốt phê phán, không tán thành, không đi theo\" các phương pháp cứu nước của họ?","goiy":"Tập trung vào động lực và mục tiêu cao nhất của Hồ Chí Minh là tìm ra \"con đường cứu nước, cứu dân\" hiệu quả nhất, không chỉ là sự khác biệt cá nhân.","pa":[{"k":"A","t":"Người muốn chứng tỏ bản thân có con đường riêng độc đáo hơn hẳn."},{"k":"B","t":"Người nhận thấy các phương pháp đó chưa thể giải quyết tận gốc rễ."},{"k":"C","t":"Người không đặt niềm tin hoàn toàn vào khả năng lãnh đạo tiền bối."},{"k":"D","t":"Người cho rằng các phong trào cũ thất bại hoàn toàn không giá trị."},{"k":"E","t":"Người muốn tìm kiếm hỗ trợ từ phương Tây mà không thông qua phong trào."}],"dung":["B"],"gt":"Tài liệu môn học nêu rõ Hồ Chí Minh \"suy ngẫm sâu sắc về Tổ quốc và thời cuộc\" và \"không tán thành, không đi theo các phương pháp, khuynh hướng cứu nước của các vị khi đó\". Điều này ngụ ý rằng Người đã nhận ra những hạn chế cố hữu của các con đường đó, không đáp ứng được yêu cầu về một sự nghiệp giải phóng dân tộc triệt để, nên Người \"muốn tìm hiểu những gì ẩn giấu sau sức mạnh của kẻ thù và học hỏi kinh nghiệm cách mạng thế giới\" để tìm một con đường mới."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Đâu là dấu mốc quan trọng nhất đánh dấu sự \"kết hợp chặt chẽ chủ nghĩa yêu nước với lập trường cách mạng vô sản\" trong tư tưởng Hồ Chí Minh?","goiy":"Chú ý đến \"bước ngoặt quan trọng\" được Tài liệu môn học trực tiếp nhắc đến và ý nghĩa của nó.","pa":[{"k":"A","t":"Gửi Yêu sách nhân dân An Nam tới Hội nghị Vécxây ở Pháp năm 1919."},{"k":"B","t":"Gia nhập hàng ngũ của Đảng Xã hội giai cấp công nhân Pháp năm 1919."},{"k":"C","t":"Nghiên cứu Luận cương thứ nhất về dân tộc của Lênin tháng 7 năm 1920."},{"k":"D","t":"Bỏ phiếu tán thành Quốc tế III và sáng lập Đảng Cộng sản Pháp 12/1920."},{"k":"E","t":"Sáng lập tờ báo Le Paria truyền bá lý luận cách mạng thuộc địa năm 1922."}],"dung":["D"],"gt":"Tài liệu môn học khẳng định rõ ràng: \"Với những nhận thức cách mạng mới, Hồ Chí Minh cùng những người phái tả trong Đảng Xã hội Pháp tại Đại hội ở thành phố Tua (từ ngày 25 đến ngày 30/12/1920), bỏ phiếu tán thành Quốc tế Cộng sản, tham gia sáng lập Đảng Cộng sản Pháp, trở thành người cộng sản Việt Nam đầu tiên. Đây là bước ngoặt quan trọng trong cuộc đời của Hồ Chí Minh, bước ngoặt chủ nghĩa yêu nước kết hợp chặt chẽ với lập trường cách mạng vô sản\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam do Hồ Chí Minh khởi thảo đã giải quyết triệt để cuộc khủng hoảng đường lối cứu nước bằng cách đề ra mục tiêu chiến lược nào?","goiy":"Nhớ lại mục tiêu cụ thể được nêu trong Cương lĩnh chính trị đầu tiên và tác động của nó.","pa":[{"k":"A","t":"Chỉ tập trung đánh đổ thực dân Pháp nhằm nhanh chóng dành độc lập."},{"k":"B","t":"Làm tư sản dân quyền cách mạng và thổ địa cách mạng đi tới cộng sản."},{"k":"C","t":"Thành lập chính phủ dân chủ cộng hòa và bỏ qua giai đoạn dân tộc."},{"k":"D","t":"Đặt ưu tiên đấu tranh giai cấp lên cao hơn vấn đề giải phóng dân tộc."},{"k":"E","t":"Kêu gọi sự giúp đỡ từ các nước tư bản phương Tây thoát ách đô hộ."}],"dung":["B"],"gt":"Tài liệu môn học nêu rõ Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam nêu mục tiêu và con đường cách mạng là \"làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản\". Chính đường lối này đã chấm dứt cuộc khủng hoảng về đường lối cứu nước."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Điều gì đã thể hiện rõ nhất sự vận dụng sáng tạo và phát triển chủ nghĩa Mác – Lênin trong Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam do Hồ Chí Minh khởi thảo?","goiy":"Tập trung vào điểm nổi bật nhất của Cương lĩnh được Tài liệu môn học nhấn mạnh về sự \"vận dụng sáng tạo\".","pa":[{"k":"A","t":"Hoàn toàn tuân thủ mọi chỉ thị Quốc tế Cộng sản mà không điều chỉnh."},{"k":"B","t":"Phủ nhận hoàn toàn vai trò giai cấp công nhân trong lãnh đạo cách mạng."},{"k":"C","t":"Giải quyết hài hòa mối quan hệ giữa giai cấp - dân tộc - quốc tế."},{"k":"D","t":"Đặt ưu tiên nhiệm vụ xã hội chủ nghĩa lên trước nhiệm vụ dân tộc."},{"k":"E","t":"Đề cao vai trò tầng lớp địa chủ và tư sản dân tộc trong liên minh."}],"dung":["C"],"gt":"Tài liệu môn học khẳng định: \"Bản Cương lĩnh chính trị đầu tiên này đã thể hiện rõ sự vận dụng sáng tạo và phát triển chủ nghĩa Mác- Lênin trong việc giải quyết mối quan hệ giai cấp - dân tộc - quốc tế trong đường lối cách mạng Việt Nam\". Đây chính là điểm sáng tạo cốt lõi của Cương lĩnh."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hội nghị Trung ương Đảng tháng 5/1941 tại Pác Bó đã đưa ra quyết sách mang tính đột phá, phù hợp với tư tưởng Hồ Chí Minh, đó là:","goiy":"Nhớ lại những điều chỉnh chiến lược quan trọng của Đảng trong bối cảnh mới và vai trò của Hồ Chí Minh trong Hội nghị này.","pa":[{"k":"A","t":"Tiếp tục duy trì và nhấn mạnh khẩu hiệu cách mạng điền địa trọng tâm."},{"k":"B","t":"Đặt nhiệm vụ đấu tranh giai cấp lên hàng đầu, cao hơn lợi ích dân tộc."},{"k":"C","t":"Tạm gác khẩu hiệu điền địa và đặt giải phóng dân tộc lên hàng đầu."},{"k":"D","t":"Quyết định thành lập ngay Chính phủ Liên bang Cộng hòa Đông Dương."},{"k":"E","t":"Phê phán và bác bỏ việc thành lập Mặt trận Việt Minh rộng rãi toàn dân."}],"dung":["C"],"gt":"Hội nghị Trung ương Đảng tháng 5/1941 do Hồ Chí Minh chủ trì đã \"đặt nhiệm vụ giải phóng dân tộc lên hàng đầu\" và \"tạm thời gác lại khẩu hiệu cách mạng điền địa\". Nghị quyết khẳng định \"Trong lúc này quyền lợi dân tộc giải phóng cao hơn hết thảy\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Chiến lược \"Dĩ bất biến, ứng vạn biến\" mà Hồ Chí Minh chỉ đạo trong giai đoạn 1945-1946 nhằm mục tiêu cốt lõi nào?","goiy":"Suy luận về ý nghĩa của cụm từ \"bất biến\" và \"vạn biến\" trong bối cảnh tình hình \"ngàn cân treo sợi tóc\" của chính quyền cách mạng non trẻ.","pa":[{"k":"A","t":"Kéo dài thời gian để thụ động chờ đợi sự hỗ trợ từ các nước đồng minh."},{"k":"B","t":"Giữ vững mục tiêu độc lập dân tộc, tự do, ấm no, hạnh phúc nhân dân."},{"k":"C","t":"Chỉ tập trung chia rẽ thế lực đế quốc mà bỏ qua xây dựng lực lượng."},{"k":"D","t":"Từ bỏ mọi nguyên tắc cốt lõi để đạt được hòa bình bằng mọi giá."},{"k":"E","t":"Tránh mọi xung đột vũ trang dù phải hy sinh một phần chủ quyền quốc gia."}],"dung":["B"],"gt":"Tài liệu môn học nêu rõ, với phương châm \"Dĩ bất biến, ứng vạn biến\", Hồ Chí Minh đã \"giữ vững mục tiêu đấu tranh cho chủ quyền độc lập dân tộc, tự do, ấm no, hạnh phúc cho nhân dân bằng các sách lược cách mạng linh hoạt mềm dẻo\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phát biểu nào sau đây KHÔNG đúng về ảnh hưởng của gia đình và quê hương đến Hồ Chí Minh trong thời kỳ trước năm 1911?","goiy":"Tập trung vào thông tin về Tài liệu môn học gốc gia đình và tầng lớp xã hội được nhắc đến.","pa":[{"k":"A","t":"Cụ Nguyễn Sinh Sắc đỗ Phó bảng, yêu nước và thương dân sâu sắc."},{"k":"B","t":"Cụ Hoàng Thị Loan là phụ nữ điển hình nhân hậu, tần tảo, đảm đang."},{"k":"C","t":"Quê hương Nghệ An là vùng đất giàu truyền thống yêu nước chống giặc."},{"k":"D","t":"Gia đình Hồ Chí Minh thuộc tầng lớp địa chủ phong kiến vô cùng giàu có."},{"k":"E","t":"Cụ Nguyễn Sinh Sắc dạy các con không lấy phong cách nhà quan làm nhà ta."}],"dung":["D"],"gt":"Tài liệu môn học nêu rõ Hồ Chí Minh sinh ra trong một gia đình \"khoa bảng\" thanh liêm, yêu nước. Cụ Nguyễn Sinh Sắc dạy các con \"Đừng lấy phong cách nhà quan làm phong cách nhà ta\". Gia đình Người không hề thuộc tầng lớp địa chủ phong kiến giàu có, do đó phương án D là phát biểu SAI (đáp án đúng của câu hỏi)."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Đặc điểm nào dưới đây KHÔNG thuộc quá trình Hồ Chí Minh hình thành tư tưởng cứu nước, giải phóng dân tộc theo con đường cách mạng vô sản trong giai đoạn 1911 – 1920?","goiy":"Xem xét cẩn thận các hoạt động và nhận thức của Hồ Chí Minh trong khoảng thời gian này.","pa":[{"k":"A","t":"Đi nhiều nước trên thế giới để tìm hiểu bản chất chủ nghĩa thực dân."},{"k":"B","t":"Hình thành nhận thức về sự đoàn kết giữa nhân dân lao động các nước."},{"k":"C","t":"Trở thành người chiến sĩ cộng sản Việt Nam đầu tiên tại Pháp năm 1920."},{"k":"D","t":"Chủ trương thành lập ngay một đảng cộng sản lãnh đạo bạo động vũ trang."},{"k":"E","t":"Đưa ra Yêu sách của nhân dân An Nam tại Hội nghị Vécxây năm 1919."}],"dung":["D"],"gt":"Trong giai đoạn 1911-1920, Hồ Chí Minh chưa đề cập đến việc chủ trương \"thành lập ngay một đảng cộng sản để lãnh đạo bạo động vũ trang ở Việt Nam\". Việc thành lập Đảng diễn ra năm 1930 qua quá trình chuẩn bị lâu dài, không phải chủ trương \"ngay lập tức\" trong giai đoạn 1911-1920. Do đó D là phát biểu SAI."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Hoạt động nào sau đây KHÔNG thuộc giai đoạn 1920 – 1930, thời kỳ hình thành những nội dung cơ bản tư tưởng về cách mạng Việt Nam?","goiy":"Chú ý kỹ mốc thời gian của từng sự kiện được nhắc đến trong Tài liệu môn học.","pa":[{"k":"A","t":"Sáng lập tờ báo tiếng Pháp Le Paria phục vụ đấu tranh cách mạng."},{"k":"B","t":"Xuất bản tác phẩm Bản án chế độ thực dân Pháp ở thủ đô Paris."},{"k":"C","t":"Sáng lập Hội Việt Nam Cách mạng Thanh niên đào tạo cán bộ nòng cốt."},{"k":"D","t":"Chủ trì thành công Hội nghị hợp nhất các tổ chức cộng sản Việt Nam."},{"k":"E","t":"Sáng lập Đội Việt Nam Tuyên truyền Giải phóng quân tại Cao Bằng."}],"dung":["E"],"gt":"Đội Việt Nam Tuyên truyền Giải phóng quân được thành lập vào ngày 22/12/1944 (thuộc giai đoạn 1941-1969). Các sự kiện A, B, C, D đều thuộc giai đoạn 1920-1930. Do đó phương án E là phát biểu SAI."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Tuyên bố nào dưới đây KHÔNG phản ánh đúng những thách thức mà tư tưởng Hồ Chí Minh phải đối mặt trong giai đoạn 1920 – 1941?","goiy":"Nhớ lại quá trình Hồ Chí Minh vượt qua thử thách và sự trở lại của đường lối của Người.","pa":[{"k":"A","t":"Bị kẻ thù thực dân đàn áp, theo dõi và bắt bớ bỏ tù khắc nghiệt."},{"k":"B","t":"Bị một số người trong Quốc tế Cộng sản và Đảng ta hiểu lầm phê phán."},{"k":"C","t":"Cương lĩnh chính trị đầu tiên bị coi là hữu khuynh, dân tộc chủ nghĩa."},{"k":"D","t":"Hội nghị TƯ tháng 10/1930 ra nghị quyết thủ tiêu Chánh cương, Sách lược."},{"k":"E","t":"Toàn bộ đường lối của Người bị Quốc tế Cộng sản bác bỏ vĩnh viễn không dùng."}],"dung":["E"],"gt":"Đường lối của Hồ Chí Minh không bị bác bỏ vĩnh viễn. Ngược lại, đường lối của Người đã được Đảng khẳng định và trở thành yếu tố chỉ đạo cách mạng Việt Nam từ Hội nghị Trung ương Đảng tháng 5/1941 (\"sự trở về với quan điểm của Hồ Chí Minh\"). Khẳng định \"bác bỏ hoàn toàn và không bao giờ được chấp nhận trở lại\" là SAI."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Mục tiêu nào sau đây KHÔNG phải là một trong hai nhiệm vụ chiến lược được Hồ Chí Minh xác định và lãnh đạo thực hiện trong giai đoạn 1954 – 1969?","goiy":"Tập trung vào những nhiệm vụ chiến lược cụ thể được Người đề ra cho hai miền trong giai đoạn này và bản chất của cuộc đấu tranh.","pa":[{"k":"A","t":"Xây dựng chủ nghĩa xã hội trở thành hậu phương vững chắc ở miền Bắc."},{"k":"B","t":"Tiếp tục cuộc cách mạng dân tộc dân chủ nhân dân giải phóng miền Nam."},{"k":"C","t":"Đạt mục tiêu độc lập, thống nhất toàn vẹn nước nhà cho nhân dân."},{"k":"D","t":"Tăng cường hợp tác quân sự với thực dân Pháp để bảo vệ miền Nam."},{"k":"E","t":"Bổ sung hoàn thiện hệ thống quan điểm cơ bản của cách mạng Việt Nam."}],"dung":["D"],"gt":"Trong giai đoạn 1954-1969, Pháp đã rút khỏi Việt Nam sau chiến thắng Điện Biên Phủ năm 1954. Việc \"tăng cường hợp tác quân sự với Pháp\" hoàn toàn trái ngược với đường lối cách mạng. Do đó phương án D là phát biểu SAI."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Luận điểm nào dưới đây KHÔNG phản ánh đúng nội dung cốt lõi của Lời kêu gọi toàn quốc kháng chiến (19/12/1946) do Hồ Chí Minh đề ra?","goiy":"Nhớ lại bản chất của Lời kêu gọi và đối tượng được kêu gọi.","pa":[{"k":"A","t":"Thể hiện ý chí quyết tâm thà hy sinh tất cả chứ nhất định không mất nước."},{"k":"B","t":"Vạch rõ đường lối kháng chiến lâu dài, toàn dân, toàn diện, tự lực cánh sinh."},{"k":"C","t":"Kêu gọi quân đội Pháp quay trở lại Đông Dương để hỗ trợ chính quyền."},{"k":"D","t":"Là lời thề thiêng liêng bảo vệ Tổ quốc của toàn thể dân tộc Việt Nam."},{"k":"E","t":"Là sự tổng kết khái quát đường lối kháng chiến chống thực dân Pháp."}],"dung":["C"],"gt":"Lời kêu gọi toàn quốc kháng chiến thể hiện ý chí quyết tâm đứng lên chống thực dân Pháp xâm lược. Việc \"kêu gọi quân đội Pháp quay trở lại Đông Dương\" là hoàn toàn phi lý và trái ngược với thực tế. Do đó C là phát biểu SAI."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những yếu tố nào sau đây đã góp phần hình thành nên tư tưởng yêu nước và chí hướng tìm đường cứu nước mới của Hồ Chí Minh trong thời kỳ trước năm 1911? (Chọn tất cả các phương án đúng)","goiy":"Tập trung vào giai đoạn \"trước năm 1911\" và các yếu tố được nêu cụ thể trong Tài liệu môn học cho giai đoạn này.","pa":[{"k":"A","t":"Truyền thống yêu nước nồng nàn sâu sắc của quê hương Nghệ An."},{"k":"B","t":"Tinh thần yêu nước và nhân cách thanh liêm của Cụ Nguyễn Sinh Sắc."},{"k":"C","t":"Tiếp xúc với sách báo tiến bộ và theo học các vị túc nho
