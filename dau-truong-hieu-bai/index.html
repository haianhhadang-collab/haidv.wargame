 yêu nước."},{"k":"D","t":"Ảnh hưởng trực tiếp từ việc tham gia hoạt động ở Đảng Xã hội Pháp."},{"k":"E","t":"Việc tìm hiểu và nghiên cứu Luận cương của Lênin về dân tộc thuộc địa."}],"dung":["A","B","C"],"gt":"Trong thời kỳ trước năm 1911, Hồ Chí Minh tiếp thu truyền thống tốt đẹp của quê hương Nghệ An, gia đình (cha là cụ Nguyễn Sinh Sắc, mẹ là cụ Hoàng Thị Loan) và được theo học các vị túc nho, tiếp xúc sách báo tiến bộ. Các phương án D và E thuộc giai đoạn sau năm 1911."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Trong giai đoạn 1911 – 1920, những hoạt động nào của Hồ Chí Minh đã thể hiện sự trưởng thành về nhận thức và sự kiên định trong việc tìm con đường cứu nước theo hướng cách mạng vô sản? (Chọn tất cả các phương án đúng)","goiy":"Giới hạn trong khoảng thời gian 1911-1920 và tìm các hoạt động liên quan đến sự hình thành tư tưởng cách mạng vô sản.","pa":[{"k":"A","t":"Gửi Yêu sách nhân dân An Nam tới Hội nghị Vécxây ở Pháp năm 1919."},{"k":"B","t":"Tích cực tham gia vào các hoạt động phong trào công nhân Pháp."},{"k":"C","t":"Nghiên cứu sâu sắc Luận cương của Lênin về vấn đề dân tộc năm 1920."},{"k":"D","t":"Sáng lập ra tổ chức Hội Việt Nam Cách mạng Thanh niên tại Quảng Châu."},{"k":"E","t":"Chủ trì thành công Hội nghị Trung ương Đảng tháng 5/1941 ở Pác Bó."}],"dung":["A","B","C"],"gt":"Trong giai đoạn 1911-1920, Hồ Chí Minh tham gia phong trào công nhân Pháp, gửi Yêu sách của nhân dân An Nam (1919) và tìm thấy phương hướng giải phóng dân tộc qua Luận cương Lênin (7/1920). D thuộc năm 1925, E thuộc năm 1941."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Tác phẩm \"Đường cách mệnh\" của Hồ Chí Minh (1927) có ý nghĩa như thế nào đối với sự chuẩn bị cho sự ra đời của Đảng Cộng sản Việt Nam? (Chọn tất cả các phương án đúng)","goiy":"Đọc kỹ đoạn về tác phẩm \"Đường cách mệnh\" và vai trò của nó. Phân biệt với Cương lĩnh chính trị đầu tiên.","pa":[{"k":"A","t":"Là sự tổng kết kinh nghiệm các cuộc cách mạng lớn trên thế giới."},{"k":"B","t":"Vạch rõ cách mạng Việt Nam phải có Đảng Cộng sản Mác-Lênin lãnh đạo."},{"k":"C","t":"Xác định lực lượng cách mạng là toàn dân, nòng cốt liên minh công nông."},{"k":"D","t":"Chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời Đảng."},{"k":"E","t":"Là Cương lĩnh chính trị đầu tiên do Hội nghị hợp nhất Đảng thông qua."}],"dung":["A","B","C","D"],"gt":"Tác phẩm Đường cách mệnh tổng kết kinh nghiệm các cuộc cách mạng, vạch rõ vai trò lãnh đạo của Đảng, xác định lực lượng cách mạng là toàn dân (nòng cốt công nông) và chuẩn bị mọi mặt cho sự ra đời của Đảng. Cương lĩnh chính trị đầu tiên là các văn kiện được thông qua tại Hội nghị thành lập Đảng đầu năm 1930, không phải bản thân tác phẩm Đường cách mệnh (E sai)."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những nội dung nào đã được khẳng định trong Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam (đầu năm 1930)? (Chọn tất cả các phương án đúng)","goiy":"Tập trung vào các điểm chính yếu của Cương lĩnh chính trị đầu tiên được liệt kê trong Tài liệu môn học.","pa":[{"k":"A","t":"Mục tiêu làm tư sản dân quyền và thổ địa cách mạng đi tới cộng sản."},{"k":"B","t":"Khẳng định sự lãnh đạo duy nhất của Đảng Cộng sản Việt Nam."},{"k":"C","t":"Khẳng định liên minh công nông là lực lượng nòng cốt cách mạng."},{"k":"D","t":"Khẳng định cách mạng Việt Nam là một bộ phận của cách mạng thế giới."},{"k":"E","t":"Quyết định tạm gác lại khẩu hiệu cách mạng điền địa chia ruộng đất."}],"dung":["A","B","C","D"],"gt":"Cương lĩnh chính trị đầu tiên nêu rõ các mục tiêu A, B, C, D. Việc \"tạm gác khẩu hiệu cách mạng điền địa\" (E) là quyết sách của Hội nghị Trung ương Đảng tháng 5/1941, không phải nội dung của Cương lĩnh đầu tiên năm 1930."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những điều chỉnh chiến lược và sách lược quan trọng nào của cách mạng Việt Nam đã được hoàn chỉnh thêm một bước tại Hội nghị Trung ương Đảng tháng 5/1941 tại Pác Bó? (Chọn tất cả các phương án đúng)","goiy":"Nhớ lại các quyết sách cụ thể của Hội nghị tháng 5/1941 và tầm quan trọng của nó trong việc chuyển hướng chiến lược.","pa":[{"k":"A","t":"Quyết định đặt nhiệm vụ giải phóng dân tộc lên vị trí hàng đầu."},{"k":"B","t":"Tạm thời gác lại hoàn toàn khẩu hiệu cách mạng điền địa chia ruộng."},{"k":"C","t":"Bỏ vấn đề thành lập Chính phủ Liên bang Cộng hòa Dân chủ Đông Dương."},{"k":"D","t":"Chủ trương thành lập Chính phủ nhân dân Việt Nam Dân chủ Cộng hòa."},{"k":"E","t":"Xác định liên minh công nông là lực lượng duy nhất tham gia cách mạng."}],"dung":["A","B","C","D"],"gt":"Hội nghị Trung ương 5/1941 quyết định A, B, C, D. E sai vì Hội nghị chủ trương đại đoàn kết toàn dân tộc trong Mặt trận Việt Minh (liên minh công nông là nòng cốt, không phải duy nhất)."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những thành công nào của cách mạng Việt Nam trong giai đoạn 1941 – 1969 được coi là thắng lợi to lớn đầu tiên của chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh ở Việt Nam? (Chọn tất cả các phương án đúng)","goiy":"Tìm cụm từ \"thắng lợi to lớn đầu tiên của chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh ở Việt Nam\" trong Tài liệu môn học và các sự kiện đi kèm.","pa":[{"k":"A","t":"Sự ra đời và phát triển rộng khắp của Mặt trận Việt Minh."},{"k":"B","t":"Thành lập Đội Việt Nam Tuyên truyền Giải phóng quân tại Cao Bằng."},{"k":"C","t":"Thắng lợi rực rỡ của cuộc Cách mạng Tháng Tám năm 1945."},{"k":"D","t":"Bác đọc Tuyên ngôn Độc lập khai sinh Việt Nam Dân chủ Cộng hòa."},{"k":"E","t":"Quyết sách chuyển hướng chiến lược tại Hội nghị Pác Bó tháng 5/1941."}],"dung":["C","D"],"gt":"Tài liệu môn học nêu rõ: \"Cách mạng Tháng Tám năm 1945 thành công... Đây là thắng lợi to lớn đầu tiên của chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh ở Việt Nam\". Tiếp theo đó, ngày 2/9/1945 Hồ Chí Minh đọc bản Tuyên ngôn Độc lập khai sinh nước Việt Nam Dân chủ Cộng hòa. Các phương án A, B, E là hoạt động chuẩn bị."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Sau khi Hồ Chí Minh nghiên cứu \"Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa\" của V.I.Lênin vào tháng 7/1920, Người đã tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc Việt Nam theo con đường _______.","goiy":"Nhớ lại tầm quan trọng của Luận cương Lênin đối với quá trình hình thành tư tưởng của Hồ Chí Minh.","pa":[{"k":"A","t":"con đường cách mạng tư sản"},{"k":"B","t":"con đường cải cách ôn hòa"},{"k":"C","t":"con đường cách mạng vô sản"},{"k":"D","t":"chủ nghĩa dân tộc thuần túy"},{"k":"E","t":"con đường chủ nghĩa đế quốc"}],"dung":["C"],"gt":"Tài liệu môn học cho biết: \"Hồ Chí Minh đã tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc Việt Nam theo con đường cách mạng vô sản qua nghiên cứu Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa... vào tháng 7/1920\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Để chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam, Hồ Chí Minh đã biên soạn và xuất bản tác phẩm _______ vào năm 1927 tại Quảng Châu, Trung Quốc.","goiy":"Nhớ lại tên tác phẩm quan trọng được xuất bản trong giai đoạn chuẩn bị thành lập Đảng.","pa":[{"k":"A","t":"Bản án chế độ thực dân Pháp"},{"k":"B","t":"Con đường giải phóng dân tộc"},{"k":"C","t":"Tuyên ngôn Độc lập khai sinh"},{"k":"D","t":"Tác phẩm Đường cách mệnh"},{"k":"E","t":"Lời kêu gọi kháng chiến"}],"dung":["D"],"gt":"Tài liệu môn học nêu rõ: \"Những nội dung cốt lõi đó và nhiều vấn đề trong đường lối, phương pháp cách mạng Việt Nam được thể hiện trong tác phẩm Đường cách mệnh của Người xuất bản năm 1927 ở Quảng Châu, Trung Quốc. Tác phẩm là sự chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hội nghị Trung ương Đảng tháng 10/1930 đã ra Án nghị quyết \"Thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\" và đổi tên Đảng Cộng sản Việt Nam thành _______.","goiy":"Nhớ lại sự thay đổi tên Đảng trong bối cảnh những hiểu lầm về Cương lĩnh chính trị đầu tiên.","pa":[{"k":"A","t":"Đảng Lao động Việt Nam quang vinh"},{"k":"B","t":"Đảng Cộng sản Đông Dương vững mạnh"},{"k":"C","t":"Đảng Dân chủ Việt Nam tiến bộ"},{"k":"D","t":"Đảng Xã hội Việt Nam Dân chủ"},{"k":"E","t":"Mặt trận Việt Minh Đại đoàn kết"}],"dung":["B"],"gt":"Tài liệu môn học cho biết Hội nghị Trung ương Đảng họp tháng 10/1930 đã \"bỏ tên Đảng Cộng sản Việt Nam do Hồ Chí Minh và những người tham gia Hội nghị thành lập Đảng xác định, lấy tên là Đảng Cộng sản Đông Dương\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Tư tưởng Hồ Chí Minh đã trở thành yếu tố chỉ đạo cách mạng Việt Nam từ Hội nghị Trung ương Đảng tháng 5/1941, tại đây, Người đã khẳng định: \"Trong lúc này quyền lợi _______ cao hơn hết thảy.\"","goiy":"Nhớ lại lời khẳng định trọng tâm của Hồ Chí Minh tại Hội nghị Pác Bó, nhấn mạnh nhiệm vụ hàng đầu.","pa":[{"k":"A","t":"giai cấp công nhân nhân dân"},{"k":"B","t":"khối liên minh công nông rộng"},{"k":"C","t":"dân tộc giải phóng cao nhất"},{"k":"D","t":"phong trào quốc tế vô sản"},{"k":"E","t":"sự phát triển vững mạnh Đảng"}],"dung":["C"],"gt":"Tại Hội nghị Ban Chấp hành Trung ương Đảng tháng 5/1941, Hồ Chí Minh đã khẳng định rõ: \"Trong lúc này quyền lợi dân tộc giải phóng cao hơn hết thảy. Chúng ta phải đoàn kết lại đánh đổ bọn đế quốc và bọn Việt gian đặng cứu giống nòi ra khỏi nước sôi lửa nóng\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Để đối phó với tình thế \"ngàn cân treo sợi tóc\" sau Cách mạng Tháng Tám, Hồ Chí Minh đã chỉ đạo thành công sách lược cách mạng linh hoạt, mềm dẻo với phương châm nổi tiếng: \"_______\".","goiy":"Nhớ lại triết lý chỉ đạo sách lược của Hồ Chí Minh trong giai đoạn chính quyền non trẻ phải đối phó với nhiều thế lực thù địch.","pa":[{"k":"A","t":"Độc lập, tự do cho nhân dân"},{"k":"B","t":"Dĩ bất biến, ứng vạn biến"},{"k":"C","t":"Thêm bạn, bớt thù trong nước"},{"k":"D","t":"Tự lực cánh sinh xây dựng"},{"k":"E","t":"Không có gì quý hơn độc lập"}],"dung":["B"],"gt":"Tài liệu môn học nêu rõ: \"Với phương châm 'Dĩ bất biến, ứng vạn biến', giữ vững mục tiêu đấu tranh cho chủ quyền độc lập dân tộc, tự do, ấm no, hạnh phúc cho nhân dân bằng các sách lược cách mạng linh hoạt mềm dẻo, Người đã chỉ đạo thành công sách lược...\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Điều mong muốn cuối cùng của Hồ Chí Minh trước khi đi xa là \"Toàn Đảng, toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh và góp phần xứng đáng và sự nghiệp _______ thế giới\".","goiy":"Nhớ lại nội dung Di chúc và tầm nhìn của Hồ Chí Minh về tương lai của Việt Nam và vai trò của Việt Nam trong bối cảnh rộng lớn hơn.","pa":[{"k":"A","t":"công nghiệp hóa đất nước ta"},{"k":"B","t":"hiện đại hóa xã hội loài người"},{"k":"C","t":"cách mạng cao cả của toàn"},{"k":"D","t":"hội nhập quốc tế sâu rộng"},{"k":"E","t":"phát triển kinh tế toàn cầu"}],"dung":["C"],"gt":"Trong Di chúc của mình, Hồ Chí Minh đã mong muốn: \"Toàn Đảng, toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh và góp phần xứng đáng và sự nghiệp cách mạng thế giới\"."}]},{"ma":"04","ten":"Độc lập dân tộc","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Tư tưởng Hồ Chí Minh về quyền dân tộc tự quyết chỉ hình thành rõ nét sau Cách mạng Tháng Tám năm 1945.","goiy":"Xem xét sự kiện nào đánh dấu sự hình thành tư tưởng này lần đầu tiên theo Tài liệu môn học.","pa":[{"k":"A","t":"Nhận định nêu trên hoàn toàn ĐÚNG"},{"k":"B","t":"Nhận định nêu trên hoàn toàn SAI"}],"dung":["B"],"gt":"Tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa, trước hết là quyền bình đẳng và tự do, đã hình thành lần đầu tiên từ sự kiện Người gửi bản Yêu sách của nhân dân An Nam tới Hội nghị Vécxây năm 1919. Điều này cho thấy tư tưởng đã có từ rất sớm, trước Cách mạng Tháng Tám 1945."},{"loai":"mot","dang":"Đúng hay sai","q":"Khi khẳng định \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\", Hồ Chí Minh đã bác bỏ hoàn toàn học thuyết \"Tam dân\" của Tôn Trung Sơn.","goiy":"Kiểm tra thái độ của Hồ Chí Minh đối với học thuyết \"Tam dân\" trong Tài liệu môn học.","pa":[{"k":"A","t":"Nhận định nêu trên hoàn toàn ĐÚNG"},{"k":"B","t":"Nhận định nêu trên hoàn toàn SAI"}],"dung":["B"],"gt":"Tài liệu môn học cho biết Hồ Chí Minh đã \"đánh giá cao học thuyết “Tam dân” của Tôn Trung Sơn về độc lập và tự do: dân tộc độc lập, dân quyền tự do và dân sinh hạnh phúc\". Câu nói trên chỉ nhấn mạnh rằng độc lập phải đi đôi với tự do, hạnh phúc của nhân dân, chứ không phải bác bỏ học thuyết Tam dân mà Người đánh giá cao."},{"loai":"mot","dang":"Đúng hay sai","q":"Tư tưởng độc lập dân tộc gắn liền với thống nhất Tổ quốc, toàn vẹn lãnh thổ chỉ xuất hiện rõ nét trong tư tưởng Hồ Chí Minh sau khi Hiệp định Giơnevơ năm 1954 được ký kết.","goiy":"Tìm hiểu bối cảnh lịch sử và các tuyên bố của Hồ Chí Minh về thống nhất lãnh thổ trước và sau năm 1954 được đề cập trong Tài liệu môn học.","pa":[{"k":"A","t":"Nhận định nêu trên hoàn toàn ĐÚNG"},{"k":"B","t":"Nhận định nêu trên hoàn toàn SAI"}],"dung":["B"],"gt":"Mặc dù Người tiếp tục kiên trì đấu tranh để thống nhất Tổ quốc sau Hiệp định Giơnevơ năm 1954, tư tưởng này đã được thể hiện từ rất sớm. Cụ thể, trong Thư gửi đồng bào Nam Bộ (năm 1946), Hồ Chí Minh đã khẳng định: \"Đồng bào Nam Bộ là dân nước Việt Nam. Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\", nhằm chống lại âm mưu chia cắt của thực dân Pháp với \"Nam Kỳ tự trị\". Điều này chứng tỏ tư tưởng đã có trước năm 1954 và là tư tưởng xuyên suốt."},{"loai":"mot","dang":"Đúng hay sai","q":"Mục tiêu \"Làm cho nước Nam được hoàn toàn độc lập\" trong Chánh cương vắn tắt của Đảng (năm 1930) đã thể hiện tư tưởng Hồ Chí Minh về một nền độc lập dân tộc phải thật sự, hoàn toàn và triệt để.","goiy":"Xem xét mục tiêu này dưới góc độ toàn diện của độc lập dân tộc theo tư tưởng Hồ Chí Minh được phát triển sau này trong Tài liệu môn học.","pa":[{"k":"A","t":"Nhận định nêu trên hoàn toàn ĐÚNG"},{"k":"B","t":"Nhận định nêu trên hoàn toàn SAI"}],"dung":["A"],"gt":"Mục tiêu \"Làm cho nước Nam được hoàn toàn độc lập\" là nền tảng cho việc xây dựng một nền độc lập không chỉ về danh nghĩa mà còn trên tất cả các lĩnh vực (ngoại giao, quân sự, tài chính), như Người đã nhấn mạnh về một nền độc lập thật sự, hoàn toàn và triệt để. Đây là bước đầu quan trọng để đạt được nền độc lập toàn diện."},{"loai":"mot","dang":"Đúng hay sai","q":"Khẩu hiệu \"Không có gì quý hơn độc lập, tự do\" (1965) được Hồ Chí Minh đưa ra trong bối cảnh đế quốc Mỹ mở rộng chiến tranh phá hoại miền Bắc và tiến hành chiến lược \"Chiến tranh cục bộ\" ở miền Nam.","goiy":"Xác định bối cảnh lịch sử cụ thể khi Hồ Chí Minh nêu lên chân lý này được đề cập trong Tài liệu môn học.","pa":[{"k":"A","t":"Nhận định nêu trên hoàn toàn ĐÚNG"},{"k":"B","t":"Nhận định nêu trên hoàn toàn SAI"}],"dung":["A"],"gt":"Tài liệu môn học nêu rõ: \"Năm 1965, đế quốc Mỹ tăng cường mở rộng chiến tranh ở Việt Nam: Ồ ạt đưa quân viễn chinh Mỹ, chư hầu vào miền Nam tiến hành chiến lược “Chiến tranh cục bộ” và gây chiến tranh phá hoại miền Bắc. Trong hoàn cảnh khó khăn, chiến tranh ác liệt đó, Hồ Chí Minh đã nêu lên một chân lý thời đại... “Không có gì quý hơn độc lập, tự do”\"."},{"loai":"mot","dang":"Đúng hay sai","q":"Trong lời kêu gọi Liên hợp quốc năm 1946, Hồ Chí Minh chỉ nhấn mạnh đến mong muốn hòa bình của nhân dân Việt Nam mà không đề cập đến quyết tâm bảo vệ độc lập.","goiy":"Đọc kỹ nội dung lời kêu gọi Liên hợp quốc năm 1946 trong Tài liệu môn học.","pa":[{"k":"A","t":"Nhận định nêu trên hoàn toàn ĐÚNG"},{"k":"B","t":"Nhận định nêu trên hoàn toàn SAI"}],"dung":["B"],"gt":"Tài liệu môn học ghi rõ: \"Trong lời kêu gọi Liên hợp quốc năm 1946, một lần nữa Hồ Chí Minh khẳng định: “Nhân dân chúng tôi thành thật mong muốn hòa bình. Nhưng nhân dân chúng tôi cũng kiên quyết chiến đấu đến cùng để bảo vệ những quyền thiêng liêng nhất: Toàn vẹn lãnh thổ cho Tổ quốc và độc lập cho đất nước”\". Điều này cho thấy Người nhấn mạnh cả mong muốn hòa bình và quyết tâm chiến đấu bảo vệ độc lập."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Sự kiện nào sau đây thể hiện rõ nhất lần đầu tiên tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa, đặc biệt là quyền bình đẳng và tự do, đã hình thành?","goiy":"Tìm đoạn văn đề cập đến sự hình thành lần đầu tiên của tư tưởng này trong Tài liệu môn học.","pa":[{"k":"A","t":"Sự kiện Nguyễn Ái Quốc tham gia sáng lập Đảng Cộng sản Pháp vào năm 1920"},{"k":"B","t":"Việc Nguyễn Ái Quốc gửi bản Yêu sách của nhân dân An Nam tới Vécxây năm 1919"},{"k":"C","t":"Sự ra đời chính thức của văn kiện Chánh cương vắn tắt của Đảng năm 1930"},{"k":"D","t":"Sự kiện đọc Tuyên ngôn độc lập khai sinh nước Việt Nam Dân chủ Cộng hòa"},{"k":"E","t":"Sự kiện Người sang Liên Xô tìm hiểu và nghiên cứu về chủ nghĩa Mác - Lênin"}],"dung":["B"],"gt":"Tài liệu môn học chỉ rõ: \"Năm 1919... thay mặt những người Việt Nam yêu nước, Hồ Chí Minh đã gửi tới Hội nghị bản Yêu sách của nhân dân An Nam... Bản yêu sách không được Hội nghị chấp nhận nhưng qua sự kiện trên cho thấy lần đầu tiên, tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa mà trước hết là quyền bình đẳng và tự do đã hình thành\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Tư tưởng Hồ Chí Minh về sự gắn liền giữa độc lập dân tộc với tự do, hạnh phúc của nhân dân được thể hiện xuyên suốt qua các mục tiêu nào trong Chánh cương vắn tắt của Đảng (năm 1930)?","goiy":"Đọc kỹ các mục tiêu được nêu trong Chánh cương vắn tắt trong Tài liệu môn học.","pa":[{"k":"A","t":"Chỉ tập trung toàn lực vào việc đánh đuổi lực lượng thực dân Pháp xâm lược"},{"k":"B","t":"Kết hợp cả các mục tiêu chính trị với các mục tiêu xã hội cải thiện đời sống"},{"k":"C","t":"Chỉ dừng lại ở việc tuyên bố các quyền tự do độc lập về mặt pháp lý quốc tế"},{"k":"D","t":"Ưu tiên giải quyết quyền tự quyết về ngoại giao và quân sự trước chính sách"},{"k":"E","t":"Tập trung vào việc xây dựng và phát triển nền kinh tế tư bản chủ nghĩa mới"}],"dung":["B"],"gt":"Trong Chánh cương vắn tắt của Đảng (1930), Hồ Chí Minh không chỉ xác định mục tiêu chính trị là \"Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến. Làm cho nước Nam được hoàn toàn độc lập\", mà còn đề ra các mục tiêu xã hội như \"Thủ tiêu hết các thứ quốc trái… Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo. Bỏ sưu thuế cho dân cày nghèo… Thi hành luật ngày làm 8 giờ\". Điều này cho thấy sự gắn kết chặt chẽ giữa độc lập dân tộc với tự do, hạnh phúc và quyền lợi của nhân dân ngay từ đầu."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Câu nói \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\" của Hồ Chí Minh sau Cách mạng Tháng Tám năm 1945 chủ yếu khẳng định điều gì?","goiy":"Liên hệ câu nói với chủ đề chính của phần b) trong Tài liệu môn học.","pa":[{"k":"A","t":"Độc lập dân tộc luôn luôn phải gắn liền với sự hỗ trợ từ các nước đồng minh"},{"k":"B","t":"Tầm quan trọng hàng đầu của việc tập trung xây dựng lực lượng quân đội mạnh"},{"k":"C","t":"Độc lập dân tộc phải gắn liền với quyền tự do và hạnh phúc thực sự của dân"},{"k":"D","t":"Độc lập dân tộc chỉ có ý nghĩa thiết thực khi giữ vững toàn vẹn lãnh thổ"},{"k":"E","t":"Sự cần thiết của việc tiến hành ngay cuộc cách mạng xã hội chủ nghĩa toàn diện"}],"dung":["C"],"gt":"Câu nói này được trích dẫn trong phần \"Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân\". Người nhấn mạnh rằng mục đích cuối cùng của độc lập là mang lại cuộc sống tốt đẹp cho nhân dân, chứ không phải chỉ là một danh xưng chính trị."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Khi Hồ Chí Minh khẳng định \"Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\" trong Thư gửi đồng bào Nam Bộ năm 1946, Người muốn nhấn mạnh điều gì?","goiy":"Đọc bối cảnh của bức thư này trong Tài liệu môn học và âm mưu của thực dân Pháp.","pa":[{"k":"A","t":"Vẻ đẹp vĩnh cửu và hùng vĩ của phong cảnh thiên nhiên địa lý Việt Nam"},{"k":"B","t":"Tinh thần đoàn kết kiên cường của toàn thể nhân dân Việt Nam trong chiến tranh"},{"k":"C","t":"Chân lý Nam Bộ là một phần không thể tách rời của lãnh thổ Việt Nam"},{"k":"D","t":"Quyết tâm chiến đấu đến cùng để bảo vệ nền độc lập dân tộc vừa giành được"},{"k":"E","t":"Tầm quan trọng đặc biệt của vai trò lãnh đạo tuyệt đối từ Đảng Cộng sản"}],"dung":["C"],"gt":"Bức thư này được viết trong bối cảnh thực dân Pháp bày ra cái gọi là \"Nam Kỳ tự trị\" nhằm chia cắt nước ta. Hồ Chí Minh đã khẳng định \"Đồng bào Nam Bộ là dân nước Việt Nam. Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\" để bác bỏ âm mưu chia cắt và khẳng định tính thống nhất, toàn vẹn lãnh thổ của Việt Nam."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Yếu tố nào sau đây là tiêu chí quan trọng nhất để phân biệt một \"nền độc lập thật sự\" với một \"nền độc lập giả hiệu\" theo tư tưởng Hồ Chí Minh?","goiy":"Xem xét nội dung phần c) về độc lập thật sự, hoàn toàn và triệt để trong Tài liệu môn học.","pa":[{"k":"A","t":"Khả năng chủ động thiết lập mối quan hệ ngoại giao đa phương với các quốc gia"},{"k":"B","t":"Việc tổ chức thành công một chính phủ bản xứ do người dân trực tiếp bầu ra"},{"k":"C","t":"Quyền tự quyết triệt để về các lĩnh vực ngoại giao, quân sự và tài chính"},{"k":"D","t":"Sự công nhận chính thức từ phía cộng đồng quốc tế và các tổ chức lớn"},{"k":"E","t":"Việc cấm chỉ hoàn toàn mọi hoạt động của các thế lực tư bản trên toàn quốc"}],"dung":["C"],"gt":"Tài liệu môn học nhấn mạnh: \"độc lập mà người dân tộc không có quyền tự quyết về ngoại giao, không có quân đội riêng, không có nền tài chính riêng…, thì độc lập đó chẳng có nghĩa lý gì\". Đây chính là những yếu tố cốt lõi để phân biệt độc lập thật sự với độc lập giả hiệu do bọn thực dân, đế quốc mị dân."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Tuyên ngôn độc lập năm 1945 của Hồ Chí Minh, bên cạnh việc trịnh trọng tuyên bố nền độc lập, còn thể hiện ý chí và quyết tâm mạnh mẽ của dân tộc Việt Nam thông qua nội dung nào?","goiy":"Đọc kỹ đoạn trích Tuyên ngôn độc lập năm 1945 trong Tài liệu môn học.","pa":[{"k":"A","t":"Kêu gọi sự hỗ trợ trực tiếp từ các quốc gia trong khối đồng minh quốc tế"},{"k":"B","t":"Trình bày chi tiết bản kế hoạch phát triển kinh tế xã hội sau chiến tranh"},{"k":"C","t":"Khẳng định quyền hưởng tự do độc lập và quyết tâm bảo vệ bằng mọi giá"},{"k":"D","t":"Nêu rõ các điều khoản chi tiết chấm dứt sự cai trị của thực dân Pháp"},{"k":"E","t":"Phân tích sâu sắc bối cảnh quốc tế thuận lợi cho cách mạng tại Việt Nam"}],"dung":["C"],"gt":"Tài liệu môn học ghi rõ, trong Tuyên ngôn độc lập năm 1945, Hồ Chí Minh tuyên bố \"Nước Việt Nam có quyền hưởng tự do và độc lập, và sự thực đã thành một nước tự do và độc lập. Toàn thể dân Việt Nam quyết đem tất cả tinh thần và lực lượng, tính mệnh và của cải để giữ vững quyền tự do và độc lập ấy\". Điều này thể hiện ý chí và quyết tâm bảo vệ độc lập."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Trong các tuyên bố và hành động của Hồ Chí Minh, điều nào sau đây KHÔNG phản ánh tư tưởng độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân?","goiy":"So sánh các phương án với nội dung phần b) của tư tưởng Hồ Chí Minh trong Tài liệu môn học.","pa":[{"k":"A","t":"Gửi bản Yêu sách của nhân dân An Nam đòi các quyền tự do dân chủ cơ bản"},{"k":"B","t":"Xác định mục tiêu bỏ sưu thuế cho dân cày nghèo và làm việc 8 giờ mỗi ngày"},{"k":"C","t":"Khẳng định nước độc lập mà dân không hưởng hạnh phúc thì không nghĩa lý"},{"k":"D","t":"Kêu gọi các cường quốc viện trợ phát triển kinh tế đảm bảo cho dân sinh"},{"k":"E","t":"Đặt ra các yêu cầu cấp bách làm cho dân có ăn, có mặc, có chỗ ở, học hành"}],"dung":["D"],"gt":"Các phương án A, B, C, E đều trực tiếp hoặc gián tiếp phản ánh sự gắn kết giữa độc lập dân tộc với tự do, hạnh phúc của nhân dân. Phương án D - \"Kêu gọi các cường quốc viện trợ\" - không được đề cập trong Tài liệu môn học như một phần của tư tưởng này, và việc Người chủ động đưa ra các giải pháp tự lực để đảm bảo quyền dân sinh là chính."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Những lý lẽ và căn cứ mà Hồ Chí Minh sử dụng để khẳng định quyền thiêng liêng, bất biến về độc lập, tự do của các dân tộc KHÔNG bao gồm yếu tố nào sau đây?","goiy":"Xem xét các căn cứ mà Hồ Chí Minh viện dẫn trong phần a) của Tài liệu môn học.","pa":[{"k":"A","t":"Lịch sử dựng nước và giữ nước lâu đời của dân tộc với truyền thống yêu nước"},{"k":"B","t":"Những quyền tự do bình đẳng được ghi trong Tuyên ngôn Độc lập Mỹ năm 1776"},{"k":"C","t":"Tuyên ngôn nhân quyền và dân quyền của Cách mạng Pháp được ban hành 1791"},{"k":"D","t":"Các điều ước quốc tế về quyền con người do Liên hợp quốc công bố sau này"},{"k":"E","t":"Khát khao to lớn của toàn thể dân tộc Việt Nam về nền độc lập và tự do"}],"dung":["D"],"gt":"Hồ Chí Minh đã căn cứ vào truyền thống lịch sử của Việt Nam, Tuyên ngôn độc lập của cách mạng Mỹ năm 1776, Tuyên ngôn nhân quyền và dân quyền của Cách mạng Pháp năm 1791 để khẳng định quyền dân tộc. Các điều ước quốc tế của Liên hợp quốc (được thành lập sau Thế chiến II) không được nhắc đến trong Tài liệu môn học là căn cứ Người sử dụng để hình thành tư tưởng này."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Trong các sự kiện lịch sử sau, sự kiện nào KHÔNG thể hiện trực tiếp quyết tâm bảo vệ độc lập dân tộc của Hồ Chí Minh và nhân dân Việt Nam sau năm 1945?","goiy":"Chú ý đến mốc thời gian \"sau năm 1945\" trong câu hỏi.","pa":[{"k":"A","t":"Lời kêu gọi Liên hợp quốc năm 1946 về việc bảo vệ toàn vẹn lãnh thổ quốc gia"},{"k":"B","t":"Lời kêu gọi toàn quốc kháng chiến ngày 19/12/1946 với quyết tâm thà hy sinh"},{"k":"C","t":"Tuyên bố \"Nước Việt Nam là một, dân tộc Việt Nam là một\" vào tháng 2/1958"},{"k":"D","t":"Việc Hồ Chí Minh gửi bản Yêu sách nhân dân An Nam tới Vécxây năm 1919"},{"k":"E","t":"Khẩu hiệu lịch sử \"Không có gì quý hơn độc lập, tự do\" đưa ra năm 1965"}],"dung":["D"],"gt":"Phương án A, B, C, E đều là các sự kiện và tuyên bố diễn ra sau năm 1945, thể hiện quyết tâm bảo vệ độc lập dân tộc và thống nhất đất nước. Phương án D là sự kiện năm 1919, trước khi Việt Nam giành được độc lập năm 1945, thuộc giai đoạn hình thành tư tưởng chứ không phải bảo vệ độc lập đã giành được."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo tư tưởng Hồ Chí Minh về nền độc lập thật sự, hoàn toàn và triệt để, yếu tố nào sau đây KHÔNG phải là dấu hiệu của một quốc gia độc lập giả hiệu?","goiy":"Đọc kỹ định nghĩa về độc lập thật sự và độc lập giả hiệu trong Tài liệu môn học.","pa":[{"k":"A","t":"Quốc gia không hề có quyền tự quyết định hoàn toàn về đường lối ngoại giao"},{"k":"B","t":"Sự xuất hiện của chính phủ bù nhìn bản xứ do chính quyền thực dân dựng lên"},{"k":"C","t":"Quốc gia hoàn toàn không có lực lượng quân đội riêng biệt để tự bảo vệ"},{"k":"D","t":"Quốc gia không có được một hệ thống nền tài chính độc lập cho riêng mình"},{"k":"E","t":"Quốc gia có quan hệ ngoại giao bình đẳng và hợp tác với các nước lớn"}],"dung":["E"],"gt":"Tài liệu môn học mô tả độc lập giả hiệu là tình trạng mà \"bọn thực dân, đế quốc hay dùng chiêu bài mị dân, thành lập các chính phủ bù nhìn bản xứ, tuyên truyền cái gọi là 'độc lập tự do' giả hiệu\". Người cũng nhấn mạnh rằng độc lập thật sự phải có quyền tự quyết về ngoại giao, quân đội riêng, nền tài chính riêng. Do đó, việc không có các quyền này là dấu hiệu của độc lập giả hiệu (A, C, D). Có chính phủ bù nhìn (B) cũng là một dấu hiệu. Ngược lại, \"có quan hệ ngoại giao bình đẳng với các nước lớn\" là một biểu hiện của quyền tự quyết về ngoại giao, thuộc về độc lập thật sự, không phải độc lập giả hiệu."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Các biện pháp sau đây, theo Hồ Chí Minh, đều góp phần thực hiện mục tiêu \"Làm cho dân có ăn, có mặc, có chỗ ở, có học hành\" sau Cách mạng Tháng Tám năm 1945, NGOẠI TRỪ:","goiy":"Phân biệt các mục tiêu chính trị với các mục tiêu xã hội trực tiếp cải thiện đời sống được nêu trong Tài liệu môn học.","pa":[{"k":"A","t":"Thực hiện giải pháp chính sách thủ tiêu toàn bộ tất cả các thứ quốc trái"},{"k":"B","t":"Thâu hết diện tích ruộng đất của đế quốc chủ nghĩa chia cho dân cày nghèo"},{"k":"C","t":"Thi hành chính sách quy định luật lao động ngày làm việc đúng đủ 8 giờ"},{"k":"D","t":"Đánh đổ hoàn toàn đế quốc chủ nghĩa Pháp và giai cấp phong kiến tay sai"},{"k":"E","t":"Thực hiện chính sách bãi bỏ các loại sưu thuế nặng nề cho dân cày nghèo"}],"dung":["D"],"gt":"Các phương án A, B, C, E đều là các biện pháp cụ thể liên quan đến dân sinh được Hồ Chí Minh đề ra trong Chánh cương vắn tắt của Đảng năm 1930, nhằm cải thiện trực tiếp đời sống của nhân dân, qua đó góp phần thực hiện mục tiêu \"có ăn, có mặc, có chỗ ở, có học hành\" sau Cách mạng Tháng Tám. Phương án D \"Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến\" là mục tiêu chính trị cơ bản để giành độc lập, là tiền đề, nhưng không phải là biện pháp trực tiếp để \"làm cho dân có ăn, có mặc...\" như các phương án còn lại."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG phản ánh đúng nội dung tư tưởng Hồ Chí Minh về độc lập dân tộc như được trình bày trong Tài liệu môn học?","goiy":"Đọc tổng thể bốn luận điểm chính về tư tưởng Hồ Chí Minh trong Tài liệu môn học.","pa":[{"k":"A","t":"Độc lập dân tộc là quyền thiêng liêng, bất khả xâm phạm của mọi dân tộc"},{"k":"B","t":"Độc lập dân tộc phải luôn luôn gắn liền với tự do, hạnh phúc của nhân dân"},{"k":"C","t":"Độc lập dân tộc phải là nền độc lập thật sự, hoàn toàn và triệt để toàn diện"},{"k":"D","t":"Độc lập dân tộc gắn liền với sự thống nhất và toàn vẹn lãnh thổ Tổ quốc"},{"k":"E","t":"Độc lập dân tộc là mục tiêu duy nhất, tuyệt đối ưu tiên vượt lên mọi quyền lợi"}],"dung":["E"],"gt":"Tài liệu môn học trình bày bốn luận điểm chính trong tư tưởng Hồ Chí Minh về vấn đề độc lập dân tộc: a) Độc lập, tự do là quyền thiêng liêng, b) Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân, c) Độc lập dân tộc phải là nền độc lập thật sự, hoàn toàn và triệt để, d) Độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ. Phương án E sai vì Người luôn nhấn mạnh sự gắn liền của độc lập với tự do, hạnh phúc của nhân dân, thậm chí khẳng định \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\", cho thấy độc lập không phải là mục tiêu duy nhất, tuyệt đối tách rời khỏi quyền lợi của nhân dân."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Trong Bản Yêu sách của nhân dân An Nam (1919), Hồ Chí Minh đã đòi hỏi những quyền cơ bản nào cho người dân Đông Dương? (Chọn các phương án đúng)","goiy":"Xem xét hai nội dung chính của Bản Yêu sách được đề cập trong Tài liệu môn học.","pa":[{"k":"A","t":"Đòi quyền bình đẳng hoàn toàn về mặt pháp lý cho người dân thuộc địa"},{"k":"B","t":"Đòi các quyền tự do, dân chủ thiết thực của người dân vùng Đông Dương"},{"k":"C","t":"Đòi quyền được trực tiếp tham gia bầu cử vào chính phủ đương thời Pháp"},{"k":"D","t":"Đòi quyền được thành lập ngay lập tức một nhà nước độc lập tại chỗ"},{"k":"E","t":"Đòi quyền tự chủ quyết định hoàn toàn đường lối phát triển kinh tế vùng"}],"dung":["A","B"],"gt":"Tài liệu môn học nêu rõ Bản Yêu sách của nhân dân An Nam bao gồm 8 điểm với \"hai nội dung chính là đòi quyền bình đẳng về mặt pháp lý và đòi các quyền tự do, dân chủ của người dân Đông Dương\". Các phương án C, D, E không được nhắc đến là nội dung của bản yêu sách."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Hồ Chí Minh đã viện dẫn những tuyên ngôn nào để khẳng định các giá trị thiêng liêng, bất biến về quyền dân tộc \"sinh ra bình đẳng, có quyền sống, quyền sung sướng và quyền tự do\"? (Chọn các phương án đúng)","goiy":"Tìm các tài liệu lịch sử mà Hồ Chí Minh đã căn cứ vào để đưa ra tuyên bố này trong Tài liệu môn học.","pa":[{"k":"A","t":"Bản Tuyên ngôn Độc lập của cuộc cách mạng Mỹ được ban hành năm 1776"},{"k":"B","t":"Tuyên ngôn Nhân quyền và Dân quyền của Cách mạng Pháp ban hành năm 1791"},{"k":"C","t":"Bản Hiến chương chính thức thành lập tổ chức Liên hợp quốc sau này"},{"k":"D","t":"Bản Tuyên ngôn của Đảng Cộng sản do Mác soạn thảo ban hành năm 1848"},{"k":"E","t":"Học thuyết Tam dân nổi tiếng về độc lập tự do của nhà cách mạng Tôn Trung Sơn"}],"dung":["A","B"],"gt":"Tài liệu môn học ghi rõ: \"Căn cứ vào những quyền tự do, bình đẳng và quyền con người - “những quyền mà không ai có thể xâm phạm được” đã được ghi trong bản Tuyên ngôn độc lập của cách mạng Mỹ năm 1776, Tuyên ngôn nhân quyền và dân quyền của Cách mạng Pháp năm 1791, Hồ Chí Minh tiếp tục khẳng định những giá trị thiêng liêng, bất biến về quyền dân tộc\". Học thuyết \"Tam dân\" được Người đánh giá cao, nhưng không phải là tuyên ngôn Người viện dẫn để khẳng định các giá trị này theo cách trích dẫn."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Sau thắng lợi của Cách mạng Tháng Tám năm 1945, Hồ Chí Minh đã yêu cầu thực hiện ngay những việc cấp bách nào để đảm bảo tự do, hạnh phúc cho nhân dân? (Chọn các phương án đúng)","goiy":"Đọc danh sách các việc cấp bách Người yêu cầu sau Cách mạng Tháng Tám trong Tài liệu môn học.","pa":[{"k":"A","t":"Thực hiện nhiệm vụ cấp bách đầu tiên: Đảm bảo làm cho dân có ăn"},{"k":"B","t":"Thực hiện nhiệm vụ cấp bách tiếp theo: Đảm bảo làm cho dân có mặc"},{"k":"C","t":"Thực hiện nhiệm vụ cấp bách thiết thực: Đảm bảo làm cho dân có chỗ ở"},{"k":"D","t":"Thực hiện nhiệm vụ cấp bách quan trọng: Đảm bảo làm cho dân có học hành"},{"k":"E","t":"Tập trung xây dựng ngay một hệ thống quân đội chính quy hiện đại ngay"}],"dung":["A","B","C","D"],"gt":"Tài liệu môn học nêu rõ, sau Cách mạng Tháng Tám năm 1945, trong hoàn cảnh nhân dân đói rét, mù chữ…, Hồ Chí Minh yêu cầu: \"1. Làm cho dân có ăn. 2. Làm cho dân có mặc. 3. Làm cho dân có chỗ ở. 4. Làm cho dân có học hành\". Xây dựng quân đội chính quy hiện đại là một nhiệm vụ quan trọng khác nhưng không nằm trong 4 yêu cầu cấp bách này được liệt kê trong Tài liệu môn học."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Tư tưởng độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ của Hồ Chí Minh được thể hiện rõ qua những tuyên bố và hành động nào? (Chọn các phương án đúng)","goiy":"Xem xét các sự kiện và tuyên bố liên quan đến thống nhất và toàn vẹn lãnh thổ trong phần d) và các phần khác của Tài liệu môn học.","pa":[{"k":"A","t":"Khẳng định \"Đồng bào Nam Bộ là dân nước Việt Nam\" trong thư năm 1946"},{"k":"B","t":"Tuyên bố \"Nước Việt Nam là một, dân tộc Việt Nam là một\" vào tháng 2/1958"},{"k":"C","t":"Bày tỏ niềm tin tuyệt đối vào sự thống nhất nước nhà trong bản Di chúc"},{"k":"D","t":"Lời kêu gọi Liên hợp quốc năm 1946 bảo vệ toàn vẹn lãnh thổ cho Tổ quốc"},{"k":"E","t":"Ký kết thành công Hiệp định Pari năm 1973 buộc quân Mỹ rút khỏi Việt Nam"}],"dung":["A","B","C","D"],"gt":"Các phương án A, B, C trực tiếp thể hiện tư tưởng độc lập gắn liền với thống nhất và toàn vẹn lãnh thổ. Phương án D cũng nêu rõ \"bảo vệ những quyền thiêng liêng nhất: Toàn vẹn lãnh thổ cho Tổ quốc và độc lập cho đất nước\" trong lời kêu gọi Liên hợp quốc năm 1946. Phương án E là một sự kiện lịch sử quan trọng, là kết quả của cuộc đấu tranh mà Hồ Chí Minh đã lãnh đạo nhưng Người đã qua đời vào năm 1969, trước khi Hiệp định Paris được ký kết năm 1973. Do đó, đây không phải là một tuyên bố hay hành động trực tiếp của Hồ Chí Minh thể hiện tư tưởng này."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những phát biểu nào sau đây của Hồ Chí Minh nhấn mạnh ý chí và quyết tâm sắt đá bảo vệ độc lập dân tộc sau khi đã giành được độc lập? (Chọn các phương án đúng)","goiy":"Chú ý mốc thời gian \"sau khi đã giành được độc lập\" (tức sau 1945) và tính chất \"ý chí, quyết tâm sắt đá bảo vệ\" trong các Tài liệu môn học.","pa":[{"k":"A","t":"\"Cái mà tôi cần nhất trên đời là đồng bào tôi được tự do\" (năm 1919)"},{"k":"B","t":"\"Toàn thể dân Việt Nam quyết đem tất cả tinh thần giữ tự do\" (năm 1945)"},{"k":"C","t":"\"Nhân dân chúng tôi kiên quyết chiến đấu đến cùng bảo vệ quyền\" (năm 1946)"},{"k":"D","t":"\"Không! Chúng ta thà hy sinh tất cả chứ nhất định không mất nước\" (1946)"},{"k":"E","t":"\"Không có gì quý hơn độc lập, tự do\" nêu lên bối cảnh chống Mỹ (năm 1965)"}],"dung":["B","C","D","E"],"gt":"Phương án A là câu nói năm 1919, thể hiện khát khao cá nhân trước khi giành được độc lập. Các phương án còn lại đều là những tuyên bố mạnh mẽ sau năm 1945, thể hiện quyết tâm giữ vững và bảo vệ nền độc lập đã giành được, đặc biệt là trong bối cảnh bị xâm lược lần thứ hai và chiến tranh ác liệt."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo quan điểm của Hồ Chí Minh, một nền độc lập dân tộc được coi là \"thật sự, hoàn toàn và triệt để\" (phần c) khi có những đặc điểm nào? (Chọn các phương án đúng)","goiy":"Đọc kỹ phần c) của Tài liệu môn học về các tiêu chí của độc lập thật sự.","pa":[{"k":"A","t":"Có đầy đủ quyền tự quyết triệt để và hoàn toàn về chính sách ngoại giao"},{"k":"B","t":"Có lực lượng quân đội riêng biệt độc lập bảo vệ chủ quyền quốc gia"},{"k":"C","t":"Có một hệ thống nền tài chính riêng không phụ thuộc can thiệp bên ngoài"},{"k":"D","t":"Có một chính phủ do dân bầu lên không chịu sự can thiệp từ bên ngoài"},{"k":"E","t":"Được công nhận chính thức từ tất cả các quốc gia cường quốc thế giới"}],"dung":["A","B","C"],"gt":"Tài liệu môn học nhấn mạnh: \"độc lập mà người dân tộc không có quyền tự quyết về ngoại giao, không có quân đội riêng, không có nền tài chính riêng…, thì độc lập đó chẳng có nghĩa lý gì\". Điều này trực tiếp liệt kê ba đặc điểm A, B, C. Phương án D là một phần của chủ quyền quốc gia và dân chủ nhưng không được liệt kê cụ thể như 3 yếu tố kia trong định nghĩa độc lập thật sự trong Tài liệu môn học. Phương án E là yếu tố bên ngoài, không phải là đặc điểm nội tại của nền độc lập thật sự theo Người."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Năm 1919, nhân dịp các nước Đồng minh thắng trận họp Hội nghị Vécxây, Hồ Chí Minh đã gửi tới Hội nghị bản _______ của nhân dân An Nam, bao gồm 8 điểm với hai nội dung chính là đòi quyền _______ về mặt pháp lý và đòi các quyền tự do, dân chủ của người dân Đông Dương.","goiy":"Nhớ tên văn kiện lịch sử và quyền cơ bản được đòi hỏi trong Tài liệu môn học.","pa":[{"k":"A","t":"Báo cáo / hòa bình tự do"},{"k":"B","t":"Hiến pháp / thống nhất"},{"k":"C","t":"Tuyên ngôn / tự quyết"},{"k":"D","t":"Yêu sách / bình đẳng"},{"k":"E","t":"Đơn từ / độc lập hoàn toàn"}],"dung":["D"],"gt":"Tài liệu môn học ghi: \"Năm 1919... Hồ Chí Minh đã gửi tới Hội nghị bản Yêu sách của nhân dân An Nam, bao gồm 8 điểm với hai nội dung chính là đòi quyền bình đẳng về mặt pháp lý và đòi các quyền tự do, dân chủ của người dân Đông Dương\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong Chánh cương vắn tắt của Đảng (năm 1930), Hồ Chí Minh đã xác định mục tiêu chính trị của Đảng là: \"a) Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến. b) Làm cho nước Nam được hoàn toàn _______\", đồng thời đề ra các mục tiêu xã hội như \"Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo. Bỏ sưu thuế cho dân cày nghèo… Thi hành luật ngày làm _______ giờ\".","goiy":"Nhớ mục tiêu chính trị và chính sách xã hội cụ thể trong Chánh cương được nêu trong Tài liệu môn học.","pa":[{"k":"A","t":"thống nhất / 10"},{"k":"B","t":"hòa bình / 12"},{"k":"C","t":"độc lập / 8"},{"k":"D","t":"tự do / 6"},{"k":"E","t":"giải phóng / 8"}],"dung":["C"],"gt":"Tài liệu môn học nêu rõ mục tiêu chính trị là \"Làm cho nước Nam được hoàn toàn độc lập\" và chính sách xã hội là \"Thi hành luật ngày làm 8 giờ\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong bối cảnh khó khăn, chiến tranh ác liệt năm 1965, Hồ Chí Minh đã nêu lên một chân lý thời đại, một tuyên ngôn bất hủ của các dân tộc khao khát nền độc lập, tự do trên thế giới: \"Không có gì quý hơn _______, _______\".","goiy":"Đây là câu nói nổi tiếng của Người, thường được trích dẫn trong giai đoạn kháng chiến chống Mỹ trong Tài liệu môn học.","pa":[{"k":"A","t":"hạnh phúc / dân chủ"},{"k":"B","t":"tự do / hạnh phúc"},{"k":"C","t":"độc lập / tự do"},{"k":"D","t":"hòa bình / tự do"},{"k":"E","t":"độc lập / thống nhất"}],"dung":["C"],"gt":"Tài liệu môn học trích dẫn nguyên văn câu nói này của Hồ Chí Minh từ năm 1965 là: “Không có gì quý hơn độc lập, tự do”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Nối tiếp các giá trị của Tuyên ngôn độc lập cách mạng Mỹ và Tuyên ngôn nhân quyền và dân quyền cách mạng Pháp, Hồ Chí Minh khẳng định: \"Tất cả các dân tộc trên thế giới đều sinh ra _______; dân tộc nào cũng có quyền sống, quyền sung sướng và quyền _______... Đó là những lẽ phải không ai chối cãi được\".","goiy":"Nhớ các quyền cơ bản mà Người đã khẳng định dựa trên các tuyên ngôn quốc tế trong Tài liệu môn học.","pa":[{"k":"A","t":"bình đẳng / tự do"},{"k":"B","t":"thống nhất / tự chủ"},{"k":"C","t":"tự do / độc lập"},{"k":"D","t":"tự do / phát triển"},{"k":"E","t":"bình đẳng / hạnh phúc"}],"dung":["A"],"gt":"Tài liệu môn học trích lời Hồ Chí Minh: \"Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng; dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do... Đó là những lẽ phải không ai chối cãi được\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Để bảo vệ nền độc lập thật sự mới giành được sau Cách mạng Tháng Tám, đặc biệt trong hoàn cảnh \"thù trong giặc ngoài\", Hồ Chí Minh và Chính phủ Việt Nam Dân chủ Cộng hòa đã sử dụng nhiều biện pháp, trong đó có biện pháp _______, nhằm bảo vệ nền độc lập _______ của đất nước.","goiy":"Tìm hiểu các biện pháp bảo vệ độc lập được nêu và tính chất của nền độc lập cần bảo vệ trong Tài liệu môn học.","pa":[{"k":"A","t":"ngoại giao / thật sự"},{"k":"B","t":"ngoại giao / thống nhất"},{"k":"C","t":"quân sự / giả hiệu"},{"k":"D","t":"kinh tế / hoàn toàn"},{"k":"E","t":"chính trị / hòa bình"}],"dung":["A"],"gt":"Tài liệu môn học nêu rõ: \"để bảo vệ nền độc lập thật sự mới giành được, Người đã cùng Chính phủ Việt Nam Dân chủ Cộng hòa sử dụng nhiều biện pháp, trong đó có biện pháp ngoại giao, để bảo vệ nền độc lập thật sự của đất nước\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong Di chúc, Hồ Chí Minh đã thể hiện niềm tin tuyệt đối vào sự thắng lợi của cách mạng, vào sự _______ nước nhà: \"Dù khó khăn gian khổ đến mấy, nhân dân ta nhất định sẽ hoàn toàn thắng lợi. Đế quốc Mỹ nhất định phải cút khỏi nước ta. Tổ quốc ta nhất định sẽ _______. Đồng bào Nam, Bắc nhất định sẽ sum họp một nhà\".","goiy":"Nhớ nội dung chính của Di chúc liên quan đến tương lai đất nước trong Tài liệu môn học.","pa":[{"k":"A","t":"thống nhất / độc lập"},{"k":"B","t":"phồn vinh / phát triển"},{"k":"C","t":"thống nhất / thống nhất"},{"k":"D","t":"độc lập / tự do"},{"k":"E","t":"phát triển / phồn vinh"}],"dung":["C"],"gt":"Tài liệu môn học trích Di chúc của Hồ Chí Minh: \"Dù khó khăn gian khổ đến mấy, nhân dân ta nhất định sẽ hoàn toàn thắng lợi. Đế quốc Mỹ nhất định phải cút khỏi nước ta. Tổ quốc ta nhất định sẽ thống nhất. Đồng bào Nam, Bắc nhất định sẽ sum họp một nhà\"."}]},{"ma":"05","ten":"Cách mạng giải phóng dân tộc","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Theo Hồ Chí Minh, cách mạng tư sản không thể giải phóng dân tộc đến nơi vì bản chất của nó là tước đoạt công nông ở trong nước và áp bức thuộc địa ở bên ngoài, đồng thời chỉ mang lại tự do, bình đẳng giả dối cho nhân dân.","goiy":"Xem xét nhận định của Hồ Chí Minh về các cuộc cách mạng tư sản Pháp và Mỹ trong Tài liệu môn học.","pa":[{"k":"A","t":"Đúng (Nhận định hoàn toàn chính xác)"},{"k":"B","t":"Sai (Nhận định không đúng thực tế)"}],"dung":["A"],"gt":"Tài liệu môn học ghi rõ: \"Người quyết định không chọn con đường cách mạng tư sản vì cho rằng: “Cách mệnh Pháp cũng như cách mệnh Mỹ, nghĩa là cách mệnh tư bản, cách mệnh không đến nơi, tiếng là cộng hòa và dân chủ, kỳ thực trong thì nó tước lục công nông, ngoài thì nó áp bức thuộc địa.”. Nhận định trong câu hỏi hoàn toàn phù hợp."},{"loai":"mot","dang":"Đúng hay sai","q":"Trong quan điểm của Hồ Chí Minh về mối quan hệ giữa giải phóng dân tộc và giải phóng giai cấp, giải phóng giai cấp phải được đặt lên hàng đầu và thực hiện trước để tạo tiền đề cho giải phóng dân tộc ở các nước thuộc địa.","goiy":"So sánh thứ tự các bước giải phóng theo Hồ Chí Minh với C. Mác và Ph. Ăngghen trong Tài liệu môn học.","pa":[{"k":"A","t":"Đúng (Nhận định hoàn toàn chính xác)"},{"k":"B","t":"Sai (Nhận định không đúng thực tế)"}],"dung":["B"],"gt":"Tài liệu môn học nêu rõ: \"Còn theo Hồ Chí Minh, ở Việt Nam và các nước thuộc địa do hoàn cảnh lịch sử - chính trị khác với châu Âu nên phải là: giải phóng dân tộc - giải phóng xã hội - giải phóng giai cấp giải phóng con người.\". Như vậy, giải phóng dân tộc là trước hết, trên hết."},{"loai":"mot","dang":"Đúng hay sai","q":"Luận điểm của Hồ Chí Minh về khả năng giành thắng lợi của cách mạng thuộc địa trước cách mạng vô sản ở chính quốc hoàn toàn trái ngược với mọi quan điểm của Quốc tế Cộng sản vào thời điểm đó.","goiy":"Đánh giá mức độ đối lập giữa quan điểm của Hồ Chí Minh và Quốc tế Cộng sản, đặc biệt là sự quán triệt tư tưởng V.I. Lênin của Người trong Tài liệu môn học.","pa":[{"k":"A","t":"Đúng (Nhận định hoàn toàn chính xác)"},{"k":"B","t":"Sai (Nhận định không đúng thực tế)"}],"dung":["B"],"gt":"Tài liệu môn học chỉ ra rằng Người quán triệt tư tưởng V.I. Lênin về mối quan hệ bình đẳng giữa hai cuộc cách mạng, chứ không \"hoàn toàn trái ngược với mọi quan điểm\", mà là sự phát triển sáng tạo dựa trên nền tảng Lênin."},{"loai":"mot","dang":"Đúng hay sai","q":"Theo Hồ Chí Minh, trong điều kiện Việt Nam là một nước thuộc địa – phong kiến, Đảng Cộng sản chỉ là đội tiên phong của giai cấp công nhân để hoàn thành sứ mệnh lịch sử của mình, giống như lý luận của chủ nghĩa Mác – Lênin.","goiy":"Xem xét định nghĩa về Đảng Cộng sản Việt Nam của Hồ Chí Minh trong Tài liệu môn học và so sánh với lý luận Mác - Lênin.","pa":[{"k":"A","t":"Đúng (Nhận định hoàn toàn chính xác)"},{"k":"B","t":"Sai (Nhận định không đúng thực tế)"}],"dung":["B"],"gt":"Hồ Chí Minh khẳng định: Đảng Cộng sản vừa là đội tiên phong của giai cấp công nhân, vừa là đội tiên phong của nhân dân lao động và của cả dân tộc Việt Nam. Nhận định \"chỉ là đội tiên phong của giai cấp công nhân\" là không đầy đủ."},{"loai":"mot","dang":"Đúng hay sai","q":"Hồ Chí Minh chủ trương rằng việc đánh đổ đế quốc và bọn phong kiến, làm cho nước Nam được hoàn toàn độc lập phải được thực hiện đồng thời, khăng khít với nhau, nương tựa vào nhau, theo đúng quan điểm của Quốc tế Cộng sản.","goiy":"So sánh quan điểm của Hồ Chí Minh và Quốc tế Cộng sản về hai nhiệm vụ chống đế quốc và chống phong kiến trong Tài liệu môn học.","pa":[{"k":"A","t":"Đúng (Nhận định hoàn toàn chính xác)"},{"k":"B","t":"Sai (Nhận định không đúng thực tế)"}],"dung":["B"],"gt":"Hồ Chí Minh đặt lên hàng đầu nhiệm vụ chống đế quốc, giải phóng dân tộc; còn nhiệm vụ chống phong kiến sẽ từng bước thực hiện, không coi hai nhiệm vụ nhất loại phải thực hiện đồng thời ngang nhau."},{"loai":"mot","dang":"Đúng hay sai","q":"Luận điểm của Hồ Chí Minh về \"chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở thuộc địa\" hàm ý rằng cách mạng ở chính quốc và cách mạng ở thuộc địa cần phải phối hợp đồng bộ, cùng lúc để tiêu diệt chủ nghĩa đế quốc một cách triệt để.","goiy":"Đọc kỹ ví von \"con đỉa\" và ý nghĩa của việc \"cắt cả hai vòi\" trong Tài liệu môn học.","pa":[{"k":"A","t":"Đúng (Nhận định hoàn toàn chính xác)"},{"k":"B","t":"Sai (Nhận định không đúng thực tế)"}],"dung":["A"],"gt":"Tài liệu môn học trích lời Người: \"Nếu muốn giết con vật ấy, người ta phải đồng thời cắt cả hai vòi.\". Điều này rõ ràng thể hiện sự cần thiết của sự phối hợp đồng bộ, cùng lúc để đạt hiệu quả triệt để."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo tư tưởng Hồ Chí Minh, đặc điểm nào sau đây là yếu tố cốt lõi dẫn đến thất bại của các phong trào yêu nước Việt Nam trước khi Người tìm thấy con đường cứu nước mới?","goiy":"Tìm kiếm nguyên nhân thất bại của các phong trào yêu nước đầu thế kỷ XX trong Tài liệu môn học.","pa":[{"k":"A","t":"Thiếu hỗ trợ từ phong trào quốc tế"},{"k":"B","t":"Chưa thấy bản chất áp bức tư bản"},{"k":"C","t":"Khủng hoảng bế tắc đường lối lãnh đạo"},{"k":"D","t":"Quá phụ thuộc sự giúp đỡ từ bên ngoài"},{"k":"E","t":"Không đủ sức mạnh quân sự kháng Pháp"}],"dung":["C"],"gt":"Tài liệu môn học chỉ rõ: \"sự thất bại của những phong trào yêu nước trong thời kỳ này thể hiện sự khủng hoảng bế tắc về giai cấp lãnh đạo và đường lối cách mạng.\". Các yếu tố khác chỉ là phụ."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Luận điểm nào sau đây thể hiện rõ nhất nét độc đáo, sáng tạo của Hồ Chí Minh khi giải quyết mối quan hệ giữa nhiệm vụ chống đế quốc và chống phong kiến trong \"Chánh cương vắn tắt của Đảng\"?","goiy":"So sánh cách Hồ Chí Minh xử lý hai nhiệm vụ này với quan điểm của Quốc tế Cộng sản trong Tài liệu môn học.","pa":[{"k":"A","t":"Thúc đẩy song song hai nhiệm vụ cùng lúc"},{"k":"B","t":"Tạm gác chống đế quốc để tập trung đất đai"},{"k":"C","t":"Đặt giải phóng dân tộc lên hàng đầu trước"},{"k":"D","t":"Nêu chủ trương người cày có ruộng trước hết"},{"k":"E","t":"Ưu tiên giải quyết phong kiến để tăng lực"}],"dung":["C"],"gt":"Hồ Chí Minh không coi hai nhiệm vụ nhất loại phải thực hiện ngang nhau, mà đặt lên hàng đầu nhiệm vụ chống đế quốc, giải phóng dân tộc, còn nhiệm vụ chống phong kiến sẽ từng bước thực hiện."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, tại sao cách mạng ở thuộc địa có vai trò rất lớn trong việc cùng với cách mạng vô sản ở chính quốc tiêu diệt chủ nghĩa đế quốc?","goiy":"Xem xét lý do Hồ Chí Minh nhấn mạnh vai trò của thuộc địa đối với chủ nghĩa đế quốc và cách mạng trong Tài liệu môn học.","pa":[{"k":"A","t":"Nơi tập trung phần lớn lực lượng quân sự"},{"k":"B","t":"Nơi tập trung nọc độc và sức sống tư bản"},{"k":"C","t":"Phong trào đấu tranh bị đàn áp ít hơn"},{"k":"D","t":"Khả năng phát triển nhanh nhờ hỗ trợ ngoài"},{"k":"E","t":"Cắt đứt hoàn toàn nguồn tài nguyên thiên nhiên"}],"dung":["B"],"gt":"Người cho rằng: \"nọc độc và sức sống của con rắn độc tư bản chủ nghĩa đang tập trung ở các thuộc địa hơn là ở chính quốc\"; nếu thờ ơ về thuộc địa thì như \"đánh chết rắn đằng đuôi\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Nhận định nào sau đây không phản ánh đúng tầm quan trọng của Đảng Cộng sản theo tư tưởng Hồ Chí Minh trong cách mạng giải phóng dân tộc ở Việt Nam?","goiy":"Tìm hiểu vai trò của Đảng theo Mác-Lênin và sự phát triển trong tư tưởng Hồ Chí Minh trong Tài liệu môn học.","pa":[{"k":"A","t":"Đảng là nhân tố chủ quan quyết định thắng lợi"},{"k":"B","t":"Đảng phải vận động tổ chức nhân dân lao động"},{"k":"C","t":"Đảng phải liên lạc với các dân tộc áp bức"},{"k":"D","t":"Đảng chỉ cần vững mạnh về lực lượng quân sự"},{"k":"E","t":"Đảng là đội tiên phong của cả dân tộc Việt Nam"}],"dung":["D"],"gt":"Nhận định \"Đảng chỉ cần vững mạnh về quân sự\" là thiếu sót. Sự vững mạnh của Đảng bao hàm cả chính trị, tư tưởng, tổ chức và đạo đức."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Khi kêu gọi toàn quốc kháng chiến (tháng 12/1946), Hồ Chí Minh đã nhấn mạnh yếu tố nào là nền tảng cốt lõi để tập hợp lực lượng đấu tranh chống kẻ thù chung của dân tộc?","goiy":"Xem xét Lời kêu gọi toàn quốc kháng chiến trong Tài liệu môn học.","pa":[{"k":"A","t":"Phân chia rõ giai cấp công nhân và nông dân"},{"k":"B","t":"Tập trung xây dựng lực lượng vũ trang hiện đại"},{"k":"C","t":"Đại đoàn kết toàn dân không phân biệt giai tầng"},{"k":"D","t":"Kêu gọi trợ giúp từ các nước xã hội chủ nghĩa"},{"k":"E","t":"Tạm gác các mâu thuẫn nội bộ duy trì ổn định"}],"dung":["C"],"gt":"Lời kêu gọi toàn quốc kháng chiến nêu rõ: \"Bất kỳ đàn ông, đàn bà, bất kỳ người già, người trẻ, không chia tôn giáo, đảng phái, dân tộc. Hễ là người Việt Nam thì phải đứng lên đánh thực dân Pháp để cứu Tổ quốc\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, vì sao giai cấp công nhân và nông dân được xem là \"gốc cách mệnh\" và \"lòng cách mệnh càng bền, chí cách mệnh càng quyết\"?","goiy":"Tìm hiểu lý do Hồ Chí Minh nhấn mạnh vai trò của công nông trong Tài liệu môn học.","pa":[{"k":"A","t":"Trình độ học vấn cao nhất dễ tiếp thu lý luận"},{"k":"B","t":"Đông đảo nhất và bị bóc lột nặng nề nhất"},{"k":"C","t":"Tự tổ chức cách mạng mà không cần hỗ trợ"},{"k":"D","t":"Đại diện sản xuất tiên tiến nhất ở thuộc địa"},{"k":"E","t":"Mối liên hệ mật thiết và sự ủng hộ quốc tế"}],"dung":["B"],"gt":"Tài liệu giải thích: công nông là hai giai cấp đông đảo nhất và bị bóc lột nặng nề nhất, \"công nông là tay không chân rồi, nếu thua thì chỉ mất một cái kiếp khổ, nếu được thì được cả thế giới, cho nên họ gan góc\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo tư tưởng Hồ Chí Minh, con đường cách mạng giải phóng dân tộc ở Việt Nam cần tuân thủ những nguyên tắc cơ bản nào sau đây, ngoại trừ:","goiy":"Tổng hợp các nguyên tắc cách mạng giải phóng dân tộc theo Hồ Chí Minh và đối chiếu với mối quan hệ thuộc địa - chính quốc.","pa":[{"k":"A","t":"Đi theo con đường cách mạng vô sản đúng đắn"},{"k":"B","t":"Giải phóng dân tộc được đặt lên trước hết"},{"k":"C","t":"Độc lập dân tộc gắn liền chủ nghĩa xã hội"},{"k":"D","t":"Tiến hành bằng phương pháp bạo lực cách mạng"},{"k":"E","t":"Hoàn toàn phụ thuộc cách mạng chính quốc"}],"dung":["E"],"gt":"Hồ Chí Minh khẳng định cách mạng thuộc địa không phụ thuộc vào cách mạng vô sản ở chính quốc và có thể giành thắng lợi trước. Do đó, \"Hoàn toàn phụ thuộc\" là phát biểu SAI."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Luận điểm sáng tạo của Hồ Chí Minh về khả năng giành thắng lợi của cách mạng thuộc địa trước cách mạng vô sản ở chính quốc được xây dựng dựa trên các cơ sở nào sau đây, ngoại trừ:","goiy":"Xem xét các cơ sở của luận điểm sáng tạo này trong Tài liệu môn học.","pa":[{"k":"A","t":"Thuộc địa có vị trí đặc biệt với đế quốc"},{"k":"B","t":"Tinh thần đấu tranh quyết liệt của thuộc địa"},{"k":"C","t":"Thuộc địa phải chờ đợi sự hỗ trợ từ chính quốc"},{"k":"D","t":"Luận điểm Mác về khả năng tự giải phóng"},{"k":"E","t":"Thực tiễn Cách mạng tháng Tám 1945 thành công"}],"dung":["C"],"gt":"Tài liệu khẳng định thuộc địa có tính chủ động cao, tự giải phóng chứ không phải \"phải chờ đợi sự hỗ trợ từ chính quốc\". Do đó lựa chọn C là phương án SAI."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây không phải là nội dung cốt lõi của tư tưởng Hồ Chí Minh về bạo lực cách mạng?","goiy":"Xem xét các khía cạnh của bạo lực cách mạng trong tư tưởng Hồ Chí Minh trong Tài liệu môn học.","pa":[{"k":"A","t":"Dùng bạo lực cách mạng chống lại phản cách mạng"},{"k":"B","t":"Bạo lực cách mạng phải là bạo lực của quần chúng"},{"k":"C","t":"Ưu tiên vũ trang tuyệt đối coi chính trị thứ yếu"},{"k":"D","t":"Kết hợp khéo léo giữa vũ trang và chính trị"},{"k":"E","t":"Thực hiện với cả lực lượng chính trị và quân sự"}],"dung":["C"],"gt":"Đấu tranh chính trị của quần chúng là cơ sở, nền tảng cho đấu tranh vũ trang. Do đó nhận định \"xem đấu tranh chính trị là thứ yếu\" là phát biểu SAI."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Trong Sách lược vắn tắt của Đảng, Hồ Chí Minh đã xác định lực lượng cách mạng bao gồm toàn dân, với các thành phần nào sau đây được coi là mục tiêu thu phục hoặc lợi dụng, ngoại trừ:","goiy":"Xem xét thành phần lực lượng cách mạng và cách đối xử với từng nhóm trong Sách lược vắn tắt.","pa":[{"k":"A","t":"Đại bộ phận thuộc giai cấp công nhân Việt Nam"},{"k":"B","t":"Đại bộ phận dân cày và nông dân nghèo khổ"},{"k":"C","t":"Tầng lớp tiểu tư sản, trí thức và trung nông"},{"k":"D","t":"Phú nông, địa chủ, tư sản đã rõ phản cách mạng"},{"k":"E","t":"Phú nông, địa chủ, tư sản chưa rõ phản cách mạng"}],"dung":["D"],"gt":"Đối với những người đã rõ mặt phản cách mạng thì phải đánh đổ, không phải là đối tượng thu phục hay lợi dụng. Do đó D là đáp án cần chọn."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phát biểu nào sau đây thể hiện quan điểm KHÔNG đúng với tư tưởng nhất quán của Hồ Chí Minh về độc lập dân tộc gắn liền với chủ nghĩa xã hội?","goiy":"Tìm phát biểu trái ngược với mối quan hệ biện chứng giữa độc lập dân tộc và chủ nghĩa xã hội.","pa":[{"k":"A","t":"Muốn cứu nước chỉ có con đường vô sản"},{"k":"B","t":"Trên thế giới chỉ có cách mạng Nga thành công"},{"k":"C","t":"Làm thổ địa cách mạng đi tới xã hội cộng sản"},{"k":"D","t":"Giải phóng dân tộc duy nhất không cần xã hội"},{"k":"E","t":"Tin theo Lênin và tin theo Quốc tế thứ ba"}],"dung":["D"],"gt":"Lựa chọn D (\"không cần gắn với mục tiêu xã hội chủ nghĩa\") là phát biểu hoàn toàn trái ngược với tư tưởng Hồ Chí Minh."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Lý do nào sau đây không được Hồ Chí Minh sử dụng để giải thích vì sao cách mạng tư sản không phải là con đường giải phóng dân tộc triệt để?","goiy":"Xem xét các lý do Hồ Chí Minh từ chối con đường cách mạng tư sản trong Tài liệu môn học.","pa":[{"k":"A","t":"Cách mạng tư sản vẫn tước đoạt công nông"},{"k":"B","t":"Cách mạng tư sản vẫn áp bức các thuộc địa"},{"k":"C","t":"Cách mạng tư sản chỉ mang tự do giả dối"},{"k":"D","t":"Cách mạng tư sản thường bị phong kiến đàn áp"},{"k":"E","t":"Cách mạng tư sản là loại cách mạng chưa đến nơi"}],"dung":["D"],"gt":"Lý do \"bị phong kiến đàn áp\" không được đề cập là nguyên nhân khiến Hồ Chí Minh từ chối cách mạng tư sản. Lý do chính là bản chất áp bức bóc lột của nó."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những nhận định nào sau đây của Hồ Chí Minh thể hiện sự quán triệt và phát triển sáng tạo lý luận của chủ nghĩa Mác – Lênin về Đảng Cộng sản trong điều kiện Việt Nam? (Chọn tất cả đáp án đúng)","goiy":"Tập trung vào các điểm mà Hồ Chí Minh bổ sung hoặc làm rõ so với lý luận kinh điển.","pa":[{"k":"A","t":"Đảng là nhân tố chủ quan để công nhân hoàn thành"},{"k":"B","t":"Đảng vừa là tiên phong công nhân vừa tiên phong dân"},{"k":"C","t":"Đảng phải kiên quyết hăng hái nhất phụng sự Tổ quốc"},{"k":"D","t":"Đảng Cộng sản phải là Đảng của cả dân tộc Việt Nam"},{"k":"E","t":"Đảng có vững vàng thì cách mạng mới có thể thành công"}],"dung":["B","C","D"],"gt":"A và E là nguyên tắc chung Mác-Lênin. B, C, D là những sáng tạo độc đáo của Hồ Chí Minh về bản chất của Đảng Cộng sản Việt Nam trong hoàn cảnh cụ thể."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những điểm nào sau đây thể hiện sự độc đáo, sáng tạo của Hồ Chí Minh trong tư tưởng về cách mạng giải phóng dân tộc so với quan điểm truyền thống của Quốc tế Cộng sản? (Chọn tất cả đáp án đúng)","goiy":"Tìm các luận điểm được Tài liệu môn học nhấn mạnh là \"độc đáo, sáng tạo\" hoặc \"bổ sung, phát triển\".","pa":[{"k":"A","t":"Đặt giải phóng dân tộc lên trước hết rồi mới giai cấp"},{"k":"B","t":"Đặt chống đế quốc hàng đầu rồi mới tới chống phong kiến"},{"k":"C","t":"Khẳng định thuộc địa có khả năng thắng trước chính quốc"},{"k":"D","t":"Coi Đảng Cộng sản là tiên phong của cả dân tộc Việt Nam"},{"k":"E","t":"Nhấn mạnh tầm quan trọng bạo lực cách mạng giành quyền"}],"dung":["A","B","C","D"],"gt":"A, B, C, D là 4 điểm sáng tạo độc đáo cốt lõi của Hồ Chí Minh. E là quan điểm chung Mác-Lênin kế thừa."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, những hình thức đấu tranh nào sau đây cần được \"sử dụng đúng và khéo kết hợp\" để giành thắng lợi cho cách mạng giải phóng dân tộc? (Chọn tất cả đáp án đúng)","goiy":"Xem xét các hình thức bạo lực cách mạng và đấu tranh được Hồ Chí Minh nêu trong Tài liệu môn học.","pa":[{"k":"A","t":"Đấu tranh chính trị của đông đảo quần chúng"},{"k":"B","t":"Đấu tranh vũ trang cách mạng của lực lượng"},{"k":"C","t":"Đấu tranh ngoại giao trên trường quốc tế"},{"k":"D","t":"Đấu tranh kinh tế trong thị trường tự do"},{"k":"E","t":"Đấu tranh văn hóa tư tưởng trên báo chí"}],"dung":["A","B"],"gt":"Tài liệu ghi rõ: \"bạo lực cách mạng ở đây là bạo lực của quần chúng... hai hình thức đấu tranh: đấu tranh chính trị và đấu tranh vũ trang\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những yếu tố nào sau đây thể hiện sự khác biệt cốt lõi giữa quan điểm của Hồ Chí Minh và quan điểm của Quốc tế Cộng sản về phong trào cách mạng ở các nước thuộc địa? (Chọn tất cả đáp án đúng)","goiy":"Tìm kiếm các điểm đối lập hoặc bổ sung giữa quan điểm của Hồ Chí Minh và Quốc tế Cộng sản.","pa":[{"k":"A","t":"Hồ Chí Minh ví thuộc địa như nọc độc của con rắn"},{"k":"B","t":"Quốc tế Cộng sản có lúc xem nhẹ cách mạng thuộc địa"},{"k":"C","t":"Hồ Chí Minh khẳng định thuộc địa có thể thắng trước"},{"k":"D","t":"Quốc tế Cộng sản cho rằng thuộc địa phụ thuộc chính quốc"},{"k":"E","t":"Hồ Chí Minh nêu ví von con đỉa hai vòi của tư bản"}],"dung":["B","C","D"],"gt":"B, C, D phản ánh chính xác sự khác biệt về quan điểm chiến lược giữa Hồ Chí Minh và Quốc tế Cộng sản. A và E là cách ví von giải thích."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, lực lượng nào được xem là \"gốc cách mệnh\" và \"là người chủ cách mệnh\" trong cách mạng giải phóng dân tộc? (Chọn tất cả đáp án đúng)","goiy":"Xem xét định nghĩa về \"gốc cách mệnh\" và \"người chủ cách mệnh\" trong Tài liệu môn học.","pa":[{"k":"A","t":"Giai cấp công nhân Việt Nam"},{"k":"B","t":"Giai cấp nông dân Việt Nam"},{"k":"C","t":"Tầng lớp trí thức tiến bộ"},{"k":"D","t":"Giai cấp tiểu tư sản thành thị"},{"k":"E","t":"Giai cấp tư sản dân tộc yêu nước"}],"dung":["A","B"],"gt":"Tài liệu môn học trích lời Người: \"công nông là người chủ cách mệnh... là gốc cách mệnh\". Do đó A (công nhân) và B (nông dân) là đáp án đúng."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những yếu tố nào sau đây là đặc trưng của cách mạng vô sản theo Hồ Chí Minh, khác biệt với cách mạng tư sản? (Chọn tất cả đáp án đúng)","goiy":"So sánh cách mạng vô sản (Cách mạng Tháng Mười) với cách mạng tư sản (Pháp, Mỹ) trong Tài liệu môn học.","pa":[{"k":"A","t":"Giải phóng nhân dân khỏi áp bức bóc lột triệt để"},{"k":"B","t":"Đem lại tự do bình đẳng thực sự cho nhân dân"},{"k":"C","t":"Vẫn tiếp tục tước đoạt công nông ở trong nước"},{"k":"D","t":"Vẫn duy trì chính sách áp bức các nước thuộc địa"},{"k":"E","t":"Dẫn đến xã hội cộng sản văn minh giải phóng con người"}],"dung":["A","B","E"],"gt":"A, B, E là đặc trưng tiến bộ vượt trội của cách mạng vô sản. C và D là bản chất bóc lột của cách mạng tư sản."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, \"Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường _______\".","goiy":"Nhớ lại con đường cứu nước mà Hồ Chí Minh đã lựa chọn sau khi đọc Luận cương của Lênin.","pa":[{"k":"A","t":"cách mạng dân chủ"},{"k":"B","t":"cách mạng tư sản"},{"k":"C","t":"cách mạng vô sản"},{"k":"D","t":"cách mạng giải phóng"},{"k":"E","t":"cách mạng ruộng đất"}],"dung":["C"],"gt":"Tài liệu môn học khẳng định câu nói nổi tiếng của Bác: “Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường cách mạng vô sản”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong tư tưởng Hồ Chí Minh, \"Dân tộc cách mệnh thì _______, nghĩa là sĩ, nông, công, thương đều nhất trí chống lại cường quyền\".","goiy":"Câu này nói về bản chất của cách mạng dân tộc, đặc biệt là về vấn đề giai cấp.","pa":[{"k":"A","t":"cần phân biệt giai cấp"},{"k":"B","t":"chưa phân giai cấp"},{"k":"C","t":"đã thống nhất giai cấp"},{"k":"D","t":"không liên quan giai cấp"},{"k":"E","t":"chỉ dựa vào một giai cấp"}],"dung":["B"],"gt":"Người lý giải rằng: “dân tộc cách mệnh thì chưa phân giai cấp, nghĩa là sĩ, nông, công, thương đều nhất trí chống lại cường quyền”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh nhận định: \"Chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở _______\".","goiy":"Đây là hình ảnh so sánh về sự liên kết giữa hai phần của chủ nghĩa tư bản.","pa":[{"k":"A","t":"các nước xã hội chủ nghĩa"},{"k":"B","t":"các nước láng giềng"},{"k":"C","t":"các thuộc địa"},{"k":"D","t":"các quốc gia độc lập"},{"k":"E","t":"các nước phát triển"}],"dung":["C"],"gt":"Câu nói đầy đủ: “Chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở thuộc địa.”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo V.I. Lênin, \"_______ không thể thực hiện được\" nếu không có sự đồng tình ủng hộ của đại đa số nhân dân lao động đối với đội tiên phong của mình.","goiy":"Lênin nói về điều kiện để một loại cách mạng cụ thể thành công.","pa":[{"k":"A","t":"cách mạng dân chủ"},{"k":"B","t":"cách mạng tư sản"},{"k":"C","t":"cách mạng công nghiệp"},{"k":"D","t":"cách mạng vô sản"},{"k":"E","t":"cách mạng khoa học"}],"dung":["D"],"gt":"Lênin viết: “Không có sự đồng tình ủng hộ của đại đa số nhân dân lao động đối với đội tiên phong của mình, tức đối với giai cấp vô sản, thì cách mạng vô sản không thể thực hiện được.”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh cho rằng, \"Trong cuộc đấu tranh gian khổ chống kẻ thù của giai cấp và dân tộc, cần dùng bạo lực cách mạng chống lại _______, giành lấy chính quyền và bảo vệ chính quyền\".","goiy":"Khía cạnh đối kháng trực tiếp của bạo lực cách mạng.","pa":[{"k":"A","t":"bạo lực chính quốc"},{"k":"B","t":"bạo lực phong kiến"},{"k":"C","t":"bạo lực đế quốc"},{"k":"D","t":"bạo lực phản cách mạng"},{"k":"E","t":"bạo lực thực dân"}],"dung":["D"],"gt":"Tài liệu viết: “Trong cuộc đấu tranh gian khổ chống kẻ thù của giai cấp và dân tộc, cần dùng bạo lực cách mạng chống lại bạo lực phản cách mạng, giành lấy chính quyền và bảo vệ chính quyền”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh đã chỉ rõ: \"Tuỳ tình hình cụ thể mà quyết định những hình thức đấu tranh cách mạng thích hợp, sử dụng đúng và khéo kết hợp các hình thức _______ và đấu tranh chính trị để giành thắng lợi cho cách mạng\".","goiy":"Hai hình thức đấu tranh cơ bản được Người nhấn mạnh.","pa":[{"k":"A","t":"đối ngoại"},{"k":"B","t":"kinh tế"},{"k":"C","t":"vũ trang"},{"k":"D","t":"văn hóa"},{"k":"E","t":"tư tưởng"}],"dung":["C"],"gt":"Tài liệu viết: “Tùy tình hình cụ thể mà quyết định những hình thức đấu tranh cách mạng thích hợp, sử dụng đúng và khéo kết hợp các hình thức vũ trang và đấu tranh chính trị để giành thắng lợi cho cách mạng”."}]},{"ma":"06","ten":"Xây dựng chủ nghĩa xã hội ở Việt Nam","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Theo tư tưởng Hồ Chí Minh, mục tiêu về kinh tế của chủ nghĩa xã hội ở Việt Nam nhấn mạnh sự phát triển công nghiệp và nông nghiệp hiện đại, khoa học kỹ thuật tiên tiến, đồng thời yêu cầu nền kinh tế phải hoàn toàn dựa trên chế độ sở hữu toàn dân để đảm bảo tính thuần nhất.","goiy":"Xem xét khái niệm \"nền kinh tế thuần nhất\" và các hình thức sở hữu được Hồ Chí Minh đề cập trong mục tiêu kinh tế.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Mặc dù Hồ Chí Minh xác định nền kinh tế phải phát triển cao với công nghiệp, nông nghiệp hiện đại, khoa học kỹ thuật tiên tiến, nhưng Người chỉ rõ đó là \"một nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu tập thể\". Như vậy, không phải chỉ hoàn toàn dựa trên sở hữu toàn dân mà còn có sở hữu tập thể (kinh tế hợp tác xã)."},{"loai":"mot","dang":"Đúng hay sai","q":"Hồ Chí Minh khẳng định mối quan hệ giữa văn hóa với chính trị và kinh tế là mối quan hệ một chiều, trong đó chính trị và kinh tế quyết định hoàn toàn tính chất của văn hóa mà không có sự tác động ngược lại của văn hóa đối với chính trị và kinh tế.","goiy":"Chú ý đến từ khóa \"mối quan hệ biện chứng\" và vai trò của văn hóa được Người nhấn mạnh.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Hồ Chí Minh cho rằng mối quan hệ giữa văn hóa với chính trị và kinh tế là \"mối quan hệ biện chứng\". Chế độ chính trị và kinh tế quyết định tính chất của văn hóa, nhưng \"văn hóa góp phần thực hiện mục tiêu của chính trị và kinh tế\". Người còn khẳng định \"Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển dân chủ\", chứng tỏ có sự tác động ngược lại."},{"loai":"mot","dang":"Đúng hay sai","q":"Trong tư tưởng Hồ Chí Minh về động lực xây dựng chủ nghĩa xã hội, Người xem xét các động lực một cách riêng lẻ, độc lập, không có mối quan hệ qua lại giữa chúng.","goiy":"Tập trung vào cách Hồ Chí Minh mô tả \"hệ thống động lực\" và mối liên hệ giữa chúng.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Hồ Chí Minh cho rằng \"Tất cả các động lực đều rất quan trọng và có mối quan hệ biện chứng với nhau\". Đặc biệt, ba động lực hàng đầu là lợi ích của dân, dân chủ của dân, đoàn kết toàn dân \"gắn bó hữu cơ với nhau, là cơ sở, tiền đề của nhau, tạo nên những động lực mạnh mẽ nhất\". Điều này cho thấy sự gắn kết, không riêng lẻ."},{"loai":"mot","dang":"Đúng hay sai","q":"Theo Hồ Chí Minh, lợi ích của dân và dân chủ của dân là hai động lực độc lập, có thể phát huy riêng rẽ trong tiến trình cách mạng xã hội chủ nghĩa.","goiy":"Tìm hiểu mối quan hệ giữa lợi ích của dân và dân chủ của dân trong hệ thống động lực.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Với tư cách là những động lực thúc đẩy tiến trình cách mạng xã hội chủ nghĩa, \"lợi ích của dân và dân chủ của dân không thể tách rời nhau\". Chúng gắn bó hữu cơ với nhau."},{"loai":"mot","dang":"Đúng hay sai","q":"Quan điểm \"xây\" đi đôi với \"chống\" trong tư tưởng Hồ Chí Minh chỉ áp dụng cho việc đối phó với kẻ địch bên ngoài, không liên quan đến việc ngăn chặn những lực cản bên trong.","goiy":"Xem xét phạm vi áp dụng của quan điểm \"xây\" đi đôi với \"chống\" và các loại \"kẻ địch\" được Người nhắc đến.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Hồ Chí Minh luôn nhắc nhở \"phải không ngừng nêu cao cảnh giác, phải chống cả kẻ địch bên ngoài tìm cách phá hoại thành quả của cách mạng và phải chống cả kẻ địch bên trong là chủ nghĩa cá nhân; chống Tư tưởng “làm quan cách mạng”\". Quan điểm \"xây\" đi đôi với \"chống\" là \"một trong những quan điểm xuyên suốt tư tưởng Hồ Chí Minh\" và bao hàm việc ngăn chặn, loại trừ những lực cản bên trong."},{"loai":"mot","dang":"Đúng hay sai","q":"Trong mục tiêu xây dựng nền văn hóa xã hội chủ nghĩa, Hồ Chí Minh đặc biệt nhấn mạnh việc triệt để tẩy trừ mọi ảnh hưởng nô dịch của văn hóa đế quốc mà không cho phép hấp thụ bất kỳ yếu tố nào từ văn hóa tiến bộ thế giới.","goiy":"Đọc kỹ định hướng xây dựng nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Hồ Chí Minh yêu cầu \"Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc. Đồng thời, phát triển những truyền thống tốt đẹp của văn hóa dân tộc và hấp thụ những cái mới của văn hóa tiến bộ thế giới, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng\". Điều này cho thấy Người chủ trương chọn lọc hấp thụ tinh hoa văn hóa tiến bộ thế giới chứ không phải phủ nhận hoàn toàn."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Luận điểm nào sau đây thể hiện rõ nhất mục tiêu về chế độ chính trị của chủ nghĩa xã hội ở Việt Nam theo tư tưởng Hồ Chí Minh?","goiy":"Nhớ lại định nghĩa \"chế độ dân chủ\" và vai trò của nhân dân trong tư tưởng Hồ Chí Minh.","pa":[{"k":"A","t":"Xây dựng chế độ tập trung quyền lực vào Nhà nước nhằm giữ ổn định."},{"k":"B","t":"Xây dựng chế độ dân chủ, nơi quyền hành và lực lượng đều ở nơi dân."},{"k":"C","t":"Xây dựng chế độ chính trị dựa trên sự lãnh đạo của giai cấp cầm quyền."},{"k":"D","t":"Xây dựng hệ thống chính trị ưu tiên kinh tế hơn mọi mục tiêu khác."},{"k":"E","t":"Xây dựng chế độ chính trị mà dân làm chủ nhưng không mang trách nhiệm."}],"dung":["B"],"gt":"Hồ Chí Minh khẳng định mục tiêu về chế độ chính trị là \"Phải xây dựng được chế độ dân chủ\". Người giải thích: “Chế độ ta là chế độ dân chủ. Tức là nhân dân làm chủ”, “Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ”. Người chỉ rõ: \"quyền hành và lực lượng đều ở nơi dân\". Các phương án khác đều không phản ánh đúng hoặc không đầy đủ tinh thần này."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Khi bàn về mối quan hệ giữa kinh tế và văn hóa trong xây dựng chủ nghĩa xã hội, Hồ Chí Minh có luận điểm mang tính suy luận nào sau đây?","goiy":"Xem xét mối quan hệ biện chứng giữa văn hóa, chính trị và kinh tế, đặc biệt là thứ tự ưu tiên được Người đề cập.","pa":[{"k":"A","t":"Văn hóa luôn phải đi trước kinh tế để tạo tiền đề phát triển vật chất."},{"k":"B","t":"Kinh tế phát triển là điều kiện tiên quyết thúc đẩy văn hóa (\"Có thực mới vực được đạo\")."},{"k":"C","t":"Kinh tế và văn hóa là hai lĩnh vực độc lập không có mối quan hệ qua lại."},{"k":"D","t":"Văn hóa quyết định tính chất kinh tế, còn kinh tế chỉ đóng vai trò thứ yếu."},{"k":"E","t":"Việc phát triển văn hóa là không cần thiết trong giai đoạn đầu xây dựng đất nước."}],"dung":["B"],"gt":"Hồ Chí Minh cho rằng mối quan hệ giữa văn hóa với chính trị và kinh tế là \"mối quan hệ biện chứng\". Người đã giải thích rõ thứ tự ưu tiên: \"Muốn tiến lên chủ nghĩa xã hội phải phát triển kinh tế và văn hóa. Vì sao không nói phát triển văn hóa và kinh tế? Tục ngữ ta có câu: Có thực mới vực được đạo; vì thế kinh tế phải đi trước\". Điều này khẳng định kinh tế là nền tảng."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Điểm khác biệt cơ bản về lợi ích giữa chủ nghĩa xã hội với những chế độ xã hội trước đó, theo Hồ Chí Minh, là gì?","goiy":"Tập trung vào cách Hồ Chí Minh định nghĩa \"lợi ích của dân\" và sự khác biệt mà Người chỉ ra.","pa":[{"k":"A","t":"Chủ nghĩa xã hội chỉ quan tâm lợi ích cộng đồng, bỏ qua cá nhân."},{"k":"B","t":"Chủ nghĩa xã hội chỉ chú trọng đến lợi ích của một giai cấp cầm quyền."},{"k":"C","t":"Chủ nghĩa xã hội quan tâm đến lợi ích cả cộng đồng lẫn con người cụ thể."},{"k":"D","t":"Chủ nghĩa xã hội nhấn mạnh lợi ích kinh tế hơn lợi ích tinh thần cá nhân."},{"k":"E","t":"Chủ nghĩa xã hội phủ nhận hoàn toàn mọi khái niệm về lợi ích cá nhân."}],"dung":["C"],"gt":"Hồ Chí Minh quan tâm đến \"lợi ích của cả cộng đồng người và lợi ích của những con người cụ thể\" vì Người cho rằng \"đây là một trong những điểm khác nhau cơ bản giữa chủ nghĩa xã hội với những chế độ xã hội trước nó\". Điều này cho thấy sự cân bằng giữa lợi ích tập thể và cá nhân."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Động lực nào được Hồ Chí Minh đánh giá là có vai trò quyết định trong hệ thống động lực thúc đẩy tiến trình cách mạng xã hội chủ nghĩa?","goiy":"Xem xét phần động lực và yếu tố nào được Người nhấn mạnh là \"quyết định\".","pa":[{"k":"A","t":"Ngoại lực cùng sự hỗ trợ giúp đỡ từ các quốc gia anh em."},{"k":"B","t":"Sức mạnh tổng hợp đến từ nền khoa học và giáo dục tiên tiến."},{"k":"C","t":"Nội lực của dân tộc, trong đó hạt nhân cốt lõi là nhân dân."},{"k":"D","t":"Sự phát triển nhanh chóng vượt trội của nền công nghiệp hiện đại."},{"k":"E","t":"Vai trò lãnh đạo tuyệt đối độc tôn của tổ chức Đảng Cộng sản."}],"dung":["C"],"gt":"Trong tư tưởng của Người, \"Tất cả các động lực đều rất quan trọng và có mối quan hệ biện chứng với nhau nhưng giữ vai trò quyết định là nội lực dân tộc, là nhân dân\". Mặc dù Đảng lãnh đạo đóng vai trò quyết định trong hoạt động của tổ chức, nhưng đối với hệ thống động lực nói chung thì nội lực dân tộc, nhân dân là quyết định."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, phẩm chất \"có ý thức làm chủ nhà nước\" của con người xã hội chủ nghĩa được hiểu như thế nào?","goiy":"Liên hệ \"ý thức làm chủ nhà nước\" với \"dân làm chủ\" và \"trách nhiệm của dân\" trong mục tiêu chính trị, cũng như các tư tưởng và tác phong cần bồi dưỡng.","pa":[{"k":"A","t":"Quyền tham gia trực tiếp quyết định mọi công việc không qua đại diện."},{"k":"B","t":"Tinh thần trách nhiệm và nghĩa vụ của người dân xây dựng, bảo vệ Tổ quốc."},{"k":"C","t":"Khả năng tự quản lý kinh tế mà không chịu sự điều hành của Nhà nước."},{"k":"D","t":"Quyền lợi cá nhân được đặt lên cao hơn quyền lợi Nhà nước và tập thể."},{"k":"E","t":"Đơn thuần là quyền thực hiện bầu cử và ứng cử theo chu kỳ định kỳ."}],"dung":["B"],"gt":"\"Ý thức làm chủ nhà nước\" là một trong những tư tưởng và tác phong mới mà mỗi người cần bồi dưỡng. Người đã khẳng định \"dân làm chủ\" không chỉ là quyền lợi mà còn là \"trách nhiệm của dân, sự nghiệp bảo vệ và xây dựng đất nước là công việc của dân\". Do đó, \"có ý thức làm chủ\" mang hàm ý về trách nhiệm và nghĩa vụ tham gia vào công cuộc chung, không chỉ là quyền lợi đơn thuần hay việc tham gia trực tiếp vào mọi quyết định."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh nhấn mạnh rằng Nhà nước xã hội chủ nghĩa phải đảm bảo quyền tự do dân chủ cho công dân, nhưng đồng thời cũng nghiêm cấm điều gì?","goiy":"Đọc kỹ phần mục tiêu về quan hệ xã hội và giới hạn của quyền tự do dân chủ.","pa":[{"k":"A","t":"Bày tỏ quan điểm cá nhân một cách thiếu căn cứ và bừa bãi."},{"k":"B","t":"Lợi dụng các quyền tự do dân chủ để xâm phạm lợi ích Nhà nước, nhân dân."},{"k":"C","t":"Tham gia vào các đoàn thể tổ chức xã hội gây ảnh hưởng tới quốc gia."},{"k":"D","t":"Phê bình góp ý đối với chính quyền các cấp không phân biệt đúng sai."},{"k":"E","t":"Thực hiện quyền bầu cử và ứng cử khi chưa đủ tiêu chuẩn công dân."}],"dung":["B"],"gt":"Mặc dù Nhà nước \"đảm bảo quyền tự do dân chủ cho công dân\", nhưng Người cũng chỉ rõ \"nghiêm cấm lợi dụng các quyền tự do dân chủ để xâm phạm đến lợi ích của Nhà nước, của nhân dân\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Mục tiêu về kinh tế của chủ nghĩa xã hội ở Việt Nam theo tư tưởng Hồ Chí Minh bao gồm nhiều đặc điểm. Phương án nào sau đây KHÔNG phải là một đặc điểm của mục tiêu kinh tế đó?","goiy":"Xem xét mối quan hệ giữa mục tiêu kinh tế và chính trị.","pa":[{"k":"A","t":"Nền kinh tế phát triển cao gắn liền công nghiệp nông nghiệp hiện đại."},{"k":"B","t":"Nền kinh tế ứng dụng tiến bộ khoa học và công nghệ kỹ thuật tiên tiến."},{"k":"C","t":"Nền kinh tế thuần nhất dựa trên sở hữu toàn dân và sở hữu tập thể."},{"k":"D","t":"Nền kinh tế hoàn toàn tách rời mục tiêu chính trị, hoạt động độc lập."},{"k":"E","t":"Kinh tế quốc doanh giữ vai trò chủ đạo lãnh đạo nền kinh tế quốc dân."}],"dung":["D"],"gt":"Mục tiêu kinh tế phải \"gắn bó mật thiết với mục tiêu về chính trị\". Người khẳng định: “Chế độ kinh tế và xã hội của chúng ta nhằm thực hiện đầy đủ quyền dân chủ của nhân dân, trên cơ sở kinh tế xã hội chủ nghĩa ngày càng phát triển\". Do đó, việc tách rời mục tiêu kinh tế khỏi chính trị là sai."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo Hồ Chí Minh, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng, cần thực hiện nhiều nhiệm vụ. Nhiệm vụ nào sau đây KHÔNG phù hợp với tư tưởng của Người?","goiy":"Đọc kỹ các yêu cầu để xây dựng nền văn hóa Việt Nam được nêu trong tài liệu.","pa":[{"k":"A","t":"Triệt để loại bỏ mọi di tích thuộc địa và ảnh hưởng nô dịch đế quốc."},{"k":"B","t":"Kế thừa và phát triển truyền thống tốt đẹp của văn hóa dân tộc."},{"k":"C","t":"Tiếp thu có chọn lọc những giá trị văn hóa tiến bộ trên thế giới."},{"k":"D","t":"Tạo dựng nền văn hóa hoàn toàn mới không dựa vào nền tảng quá khứ."},{"k":"E","t":"Xây dựng văn hóa xã hội chủ nghĩa về nội dung và dân tộc về hình thức."}],"dung":["D"],"gt":"Người rõ ràng chủ trương \"phát triển những truyền thống tốt đẹp của văn hóa dân tộc\", điều này mâu thuẫn với việc \"tạo ra một nền văn hóa hoàn toàn mới, không dựa trên bất kỳ nền tảng nào của quá khứ\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Các quyền tự do dân chủ cơ bản của nhân dân được Nhà nước bảo đảm trong chủ nghĩa xã hội, theo tư tưởng Hồ Chí Minh, bao gồm nhiều khía cạnh. Khía cạnh nào sau đây KHÔNG được Người trực tiếp đề cập trong tài liệu?","goiy":"Xem xét các quyền của nhân dân được liệt kê trong mục tiêu về quan hệ xã hội.","pa":[{"k":"A","t":"Công dân có quyền làm việc, nghỉ ngơi cũng như học tập nâng cao trình độ."},{"k":"B","t":"Công dân có quyền tự do thân thể, tự do ngôn luận và tự do báo chí."},{"k":"C","t":"Công dân có quyền tự do hội họp, lập hội và tham gia biểu tình hợp pháp."},{"k":"D","t":"Công dân có quyền tự do tín ngưỡng, theo hoặc không theo một tôn giáo nào."},{"k":"E","t":"Công dân có quyền hưởng phúc lợi xã hội tối thiểu mà không cần lao động."}],"dung":["E"],"gt":"Tài liệu chỉ rõ nhân dân \"có quyền làm việc; có quyền nghỉ ngơi; có quyền học tập; có quyền tự do thân thể; có quyền tự do ngôn luận, báo chí, hội họp, lập hội, biểu tình; có quyền tự do tín ngưỡng, theo hoặc không theo một tôn giáo nào; có quyền bầu cử, ứng cử\". Không
