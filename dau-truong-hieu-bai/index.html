có đề cập đến quyền được hưởng phúc lợi xã hội tối thiểu không cần lao động, mà nhấn mạnh quyền làm việc và trách nhiệm xây dựng đất nước."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Để thúc đẩy tiến trình cách mạng xã hội chủ nghĩa, Hồ Chí Minh đã chỉ ra nhiều động lực quan trọng. Động lực nào sau đây KHÔNG được Người xếp vào nhóm những động lực hàng đầu của chủ nghĩa xã hội?","goiy":"Nhớ lại các động lực hàng đầu được Người nhấn mạnh.","pa":[{"k":"A","t":"Lợi ích thiết thực của nhân dân."},{"k":"B","t":"Quyền làm chủ dân chủ của nhân dân."},{"k":"C","t":"Sức mạnh khối đại đoàn kết toàn dân."},{"k":"D","t":"Sự viện trợ kinh tế từ quốc tế."},{"k":"E","t":"Cả ba yếu tố A, B và C hợp thành."}],"dung":["D"],"gt":"Hồ Chí Minh khẳng định \"để thúc đẩy tiến trình cách mạng xã hội chủ nghĩa phải bảo đảm lợi ích của dân, dân chủ của dân, sức mạnh đoàn kết toàn dân. Trong tư tưởng Hồ Chí Minh, đây là những động lực hàng đầu của chủ nghĩa xã hội\". Sự hỗ trợ kinh tế từ bên ngoài có thể thuộc \"ngoại lực\" nhưng không được Người xếp vào nhóm \"động lực hàng đầu\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo tư tưởng Hồ Chí Minh, các tổ chức như Đảng Cộng sản, Nhà nước, và các tổ chức chính trị - xã hội trong hệ thống động lực của chủ nghĩa xã hội có những vai trò và đặc điểm nhất định. Đặc điểm nào sau đây KHÔNG đúng với tư tưởng của Người?","goiy":"Xem xét mối quan hệ giữa Đảng, Nhà nước và các tổ chức quần chúng.","pa":[{"k":"A","t":"Đảng Cộng sản giữ vai trò quyết định lãnh đạo toàn bộ hệ thống."},{"k":"B","t":"Nhà nước quản lý xã hội, hiện thực hóa đường lối lối đi của Đảng."},{"k":"C","t":"Các tổ chức chính trị xã hội hoạt động hoàn toàn độc lập với Đảng."},{"k":"D","t":"Các tổ chức chính trị xã hội thống nhất về tư tưởng dưới sự lãnh đạo."},{"k":"E","t":"Các tổ chức hoạt động vì hội viên nhưng phải phù hợp lợi ích dân tộc."}],"dung":["C"],"gt":"Các tổ chức chính trị - xã hội \"tuy có những nội dung và phương thức hoạt động khác nhau nhưng đều nhất quán về chính trị và tư tưởng dưới sự lãnh đạo của Đảng, quản lý của Nhà nước\". Do đó, việc hoạt động hoàn toàn độc lập là sai."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Tư tưởng và tác phong xấu cần phải chống lại ở con người xã hội chủ nghĩa, theo Hồ Chí Minh, bao gồm nhiều biểu hiện. Biểu hiện nào sau đây KHÔNG được Người trực tiếp đề cập trong tài liệu?","goiy":"Nhớ lại danh sách các tư tưởng và tác phong xấu cần chống.","pa":[{"k":"A","t":"Tác phong chủ nghĩa cá nhân ích kỷ."},{"k":"B","t":"Bệnh quan liêu, hách dịch, mệnh lệnh."},{"k":"C","t":"Thói tham ô, lãng phí tài sản chung."},{"k":"D","t":"Tư tưởng bảo thủ, rụt rè, ngại đổi mới."},{"k":"E","t":"Sáng tạo cá nhân vượt quá khuôn khổ."}],"dung":["E"],"gt":"Hồ Chí Minh đã liệt kê các tư tưởng và tác phong xấu cần chống lại là: \"Chủ nghĩa cá nhân; quan liêu, mệnh lệnh; tham ô, lãng phí; bảo thủ, rụt rè\". Người không đề cập đến việc chống lại \"tính sáng tạo cá nhân vượt quá khuôn khổ tập thể\"; ngược lại, Người nhấn mạnh sự lao động sáng tạo của quần chúng."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Mục tiêu về chế độ chính trị của chủ nghĩa xã hội ở Việt Nam theo tư tưởng Hồ Chí Minh bao gồm những nội dung nào sau đây?","goiy":"Đọc kỹ mô tả mục tiêu về chế độ chính trị trong tài liệu.","pa":[{"k":"A","t":"Xây dựng một chế độ dân chủ."},{"k":"B","t":"Khẳng định nhân dân làm chủ và là chủ."},{"k":"C","t":"Tất cả quyền lợi vì dân, tất cả quyền hạn của dân."},{"k":"D","t":"Các cấp chính quyền do dân bầu, đoàn thể do dân lập."},{"k":"E","t":"Quyền hành và sức mạnh lực lượng đều ở nơi dân."}],"dung":["A","B","C","D","E"],"gt":"Tài liệu nêu rõ: \"Phải xây dựng được chế độ dân chủ\". \"Chế độ ta là chế độ dân chủ. Tức là nhân dân làm chủ”, “Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ”. \"Tất cả lợi ích đều vì dân, tất cả quyền hạn đều của dân, công cuộc đổi mới là trách nhiệm của dân, sự nghiệp bảo vệ và xây dựng đất nước là công việc của dân, các cấp chính quyền do dân cử ra, các tổ chức đoàn thể do dân tổ chức nên. Nói tóm lại, quyền hành và lực lượng đều ở nơi dân\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng, cần chú trọng đến những khía cạnh nào?","goiy":"Tập trung vào các yêu cầu về nội dung và hình thức của văn hóa, cũng như các hành động cụ thể để xây dựng nền văn hóa.","pa":[{"k":"A","t":"Nền văn hóa phải xã hội chủ nghĩa về nội dung."},{"k":"B","t":"Nền văn hóa phải mang tính dân tộc về hình thức."},{"k":"C","t":"Triệt để tẩy trừ di tích thuộc địa và nô dịch đế quốc."},{"k":"D","t":"Phát triển kế thừa truyền thống tốt đẹp của dân tộc."},{"k":"E","t":"Tiếp thu hấp thụ những cái mới của văn hóa tiến bộ."}],"dung":["A","B","C","D","E"],"gt":"Người nêu rõ: \"để phục vụ sự nghiệp cách mạng xã hội chủ nghĩa thì văn hóa phải xã hội chủ nghĩa về nội dung và dân tộc về hình thức”. \"Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc. Đồng thời, phát triển những truyền thống tốt đẹp của văn hóa dân tộc và hấp thụ những cái mới của văn hóa tiến bộ thế giới, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng, theo tư tưởng Hồ Chí Minh, có những đặc điểm về quan hệ xã hội nào?","goiy":"Đọc kỹ mô tả về xã hội xã hội chủ nghĩa trong mục tiêu về quan hệ xã hội.","pa":[{"k":"A","t":"Xã hội dân chủ, công bằng, văn minh."},{"k":"B","t":"Tôn trọng con người và giá trị con người."},{"k":"C","t":"Tỏa mãn lợi ích cá nhân chính đáng của người dân."},{"k":"D","t":"Tạo điều kiện phát huy tính cách sở trường riêng."},{"k":"E","t":"Hài hòa giữa đời sống riêng và lợi ích tập thể."}],"dung":["A","B","C","D","E"],"gt":"\"Như vậy, xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng là xã hội dân chủ, công bằng, văn minh, tôn trọng con người, chú ý xem xét những lợi ích cá nhân đúng đắn và bảo đảm cho nó được thỏa mãn để mỗi người có điều kiện cải thiện đời sống riêng của mình, phát huy tính cách riêng và sở trường riêng trong sự hài hòa với đời sống chung, lợi ích chung của tập thể\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Các tư tưởng và tác phong xã hội chủ nghĩa mà mỗi con người Việt Nam cần bồi dưỡng để xây dựng chủ nghĩa xã hội, theo Hồ Chí Minh, bao gồm những gì?","goiy":"Đọc kỹ các phẩm chất của con người xã hội chủ nghĩa.","pa":[{"k":"A","t":"Có ý thức trách nhiệm làm chủ nhà nước."},{"k":"B","t":"Tinh thần tập thể \"mình vì mọi người, mọi người vì mình\"."},{"k":"C","t":"Quán xuyến quan điểm \"tất cả phục vụ sản xuất\"."},{"k":"D","t":"Nêu cao ý thức cần kiệm để xây dựng nước nhà."},{"k":"E","t":"Tinh thần tiến nhanh, tiến mạnh, tiến vững chắc."}],"dung":["A","B","C","D","E"],"gt":"Hồ Chí Minh khái quát: \"Những tư tưởng và tác phong mới mà mỗi người cần bồi dưỡng cho mình là: Có ý thức làm chủ nhà nước, có tinh thần tập thể xã hội chủ nghĩa và tư tưởng “mình vì mọi người, mọi người vì mình”; có quan điểm “tất cả phục vụ sản xuất”; có ý thức cần kiệm xây dựng nước nhà; có tinh thần tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Trong hệ thống động lực xây dựng chủ nghĩa xã hội, những yếu tố nào gắn bó hữu cơ với nhau, tạo nên sức mạnh tổng hợp theo tư tưởng Hồ Chí Minh?","goiy":"Tập trung vào nhóm \"động lực hàng đầu\" và mối quan hệ giữa chúng.","pa":[{"k":"A","t":"Lợi ích thiết thực của dân."},{"k":"B","t":"Quyền làm chủ dân chủ của dân."},{"k":"C","t":"Sức mạnh đại đoàn kết toàn dân."},{"k":"D","t":"Sự lãnh đạo duy nhất của Đảng."},{"k":"E","t":"Hoạt động quản lý của Nhà nước."}],"dung":["A","B","C"],"gt":"\"Trong tư tưởng Hồ Chí Minh, lợi ích của dân, dân chủ của dân, đoàn kết toàn dân gắn bó hữu cơ với nhau, là cơ sở, tiền đề của nhau, tạo nên những động lực mạnh mẽ nhất trong hệ thống những động lực của chủ nghĩa xã hội\". Sự lãnh đạo của Đảng và quản lý của Nhà nước là thông qua hoạt động của các tổ chức để phát huy các động lực này."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Để chủ nghĩa xã hội có thể xây dựng được, Hồ Chí Minh cho rằng cần có sự tham gia tích cực của nhân dân thông qua những biểu hiện nào?","goiy":"Xem xét yếu tố \"sức mạnh đoàn kết toàn dân\" và vai trò của nhân dân trong việc xây dựng XHCN.","pa":[{"k":"A","t":"Sự giác ngộ đầy đủ về quyền lợi và quyền hạn."},{"k":"B","t":"Sự giác ngộ về trách nhiệm và địa vị làm chủ."},{"k":"C","t":"Sự lao động sáng tạo của hàng chục triệu người."},{"k":"D","t":"Tự do biểu tình và lập hội không giới hạn."},{"k":"E","t":"Phụ thuộc hoàn toàn vào chỉ đạo mà không cần sáng tạo."}],"dung":["A","B","C"],"gt":"Hồ Chí Minh cho rằng \"chủ nghĩa xã hội chỉ có thể xây dựng được với sự giác ngộ đầy đủ của nhân dân về quyền lợi và quyền hạn, trách nhiệm và địa vị dân chủ của mình; với sự lao động sáng tạo của hàng chục triệu quần chúng nhân dân\". Quyền biểu tình có nhưng đi kèm với nghiêm cấm lợi dụng. Phương án E mâu thuẫn với \"lao động sáng tạo\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh khẳng định mục tiêu về chế độ chính trị của chủ nghĩa xã hội ở Việt Nam là \"Chế độ ta là chế độ dân chủ. Tức là nhân dân ______\".","goiy":"Nhớ lại câu nói trực tiếp của Hồ Chí Minh về bản chất của chế độ dân chủ.","pa":[{"k":"A","t":"là chủ"},{"k":"B","t":"làm chủ"},{"k":"C","t":"quản lý"},{"k":"D","t":"tự quyết"},{"k":"E","t":"lãnh đạo"}],"dung":["B"],"gt":"Trích dẫn trực tiếp từ tài liệu: \"Chế độ ta là chế độ dân chủ. Tức là nhân dân làm chủ”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Mục tiêu về kinh tế của chủ nghĩa xã hội ở Việt Nam được Hồ Chí Minh xác định là \"một nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu ______\".","goiy":"Nhớ lại các hình thức sở hữu được đề cập trong mục tiêu kinh tế XHCN.","pa":[{"k":"A","t":"cá nhân"},{"k":"B","t":"tập thể"},{"k":"C","t":"hỗn hợp"},{"k":"D","t":"Nhà nước"},{"k":"E","t":"tư nhân"}],"dung":["B"],"gt":"Trích dẫn trực tiếp từ tài liệu: \"một nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu tập thể”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Về vai trò của văn hóa, Hồ Chí Minh khẳng định: \"Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển ______. Nâng cao trình độ văn hóa của nhân dân cũng là một việc làm cần thiết để xây dựng nước ta thành một nước hòa bình, thống nhất độc lập, dân chủ và giàu mạnh”.","goiy":"Chú ý đến mục tiêu chính trị và các mặt phát triển đồng bộ.","pa":[{"k":"A","t":"khoa học"},{"k":"B","t":"công nghệ"},{"k":"C","t":"dân chủ"},{"k":"D","t":"xã hội"},{"k":"E","t":"sản xuất"}],"dung":["C"],"gt":"Trích dẫn trực tiếp từ tài liệu: \"Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển dân chủ\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, để thúc đẩy tiến trình cách mạng xã hội chủ nghĩa, \"phải bảo đảm lợi ích của dân, dân chủ của dân, sức mạnh ______ toàn dân\".","goiy":"Nhớ lại ba động lực hàng đầu của chủ nghĩa xã hội.","pa":[{"k":"A","t":"hợp tác"},{"k":"B","t":"thống nhất"},{"k":"C","t":"đoàn kết"},{"k":"D","t":"phát triển"},{"k":"E","t":"sáng tạo"}],"dung":["C"],"gt":"Trích dẫn trực tiếp từ tài liệu: \"phải bảo đảm lợi ích của dân, dân chủ của dân, sức mạnh đoàn kết toàn dân\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh nhận thấy trong xã hội xã hội chủ nghĩa mỗi người giữ một vị trí nhất định, đóng góp một phần công lao nhất định vì nhân dân lao động đã thoát khỏi bần cùng, có công ăn việc làm, có cuộc sống ấm no, hạnh phúc, nên ngay từ những ngày đầu xây dựng chế độ xã hội mới, Người đã dạy: “việc gì có lợi cho dân phải hết sức làm, việc gì có hại cho dân phải hết sức ______”.","goiy":"Nhớ lại lời dặn của Bác về việc làm và tránh cho dân.","pa":[{"k":"A","t":"loại bỏ"},{"k":"B","t":"ngăn cản"},{"k":"C","t":"tránh"},{"k":"D","t":"phê phán"},{"k":"E","t":"hạn chế"}],"dung":["C"],"gt":"Trích dẫn trực tiếp từ tài liệu: “việc gì có lợi cho dân phải hết sức làm, việc gì có hại cho dân phải hết sức tránh”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong tư tưởng Hồ Chí Minh, quan điểm “xây” đi đôi với “chống” cũng là một trong những quan điểm ______ tư tưởng Hồ Chí Minh, là một trong những nét đặc sắc của tư tưởng Hồ Chí Minh.","goiy":"Chú ý đến tính chất lâu dài và bao trùm của quan điểm này.","pa":[{"k":"A","t":"cơ bản"},{"k":"B","t":"cốt lõi"},{"k":"C","t":"xuyên suốt"},{"k":"D","t":"mới mẻ"},{"k":"E","t":"chủ yếu"}],"dung":["C"],"gt":"Trích dẫn trực tiếp từ tài liệu: \"quan điểm “xây” đi đôi với “chống” cũng là một trong những quan điểm xuyên suốt tư tưởng Hồ Chí Minh\"."}]},{"ma":"07–08","ten":"Đảng Cộng sản Việt Nam","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Theo tư tưởng Hồ Chí Minh, vai trò lãnh đạo của Đảng Cộng sản Việt Nam chỉ là một yếu tố hỗ trợ, không mang tính quyết định đến thành công của cách mạng Việt Nam.","goiy":"Hãy xem xét hình ảnh \"người cầm lái\" và tính \"tất yếu\" của sự lãnh đạo Đảng được Hồ Chí Minh khẳng định trong các tài liệu.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu khẳng định Hồ Chí Minh ví Đảng cộng sản \"như người cầm lái\" và nhấn mạnh \"Đảng có vững, cách mệnh mới thành công\", thể hiện vai trò quyết định. Tài liệu cũng khẳng định sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu. Do đó, việc cho rằng vai trò này chỉ là yếu tố hỗ trợ là không chính xác."},{"loai":"mot","dang":"Đúng hay sai","q":"Lý luận về sự ra đời của đảng cộng sản kiểu mới theo V.I. Lênin chỉ áp dụng nguyên bản, không cần vận dụng sáng tạo vào điều kiện cụ thể của Việt Nam để hình thành Đảng Cộng sản Việt Nam.","goiy":"Hãy chú ý đến cách Hồ Chí Minh tiếp thu và phát triển học thuyết Mác - Lênin trong bối cảnh Việt Nam.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu nêu rõ Hồ Chí Minh \"trung thành với học thuyết Mác - Lênin... đồng thời vận dụng sáng tạo và phát triển lý luận đó vào điều kiện cụ thể của Việt Nam\". Điều này phủ nhận quan điểm chỉ áp dụng nguyên bản mà không có sự vận dụng sáng tạo."},{"loai":"mot","dang":"Đúng hay sai","q":"Mâu thuẫn cơ bản nhất trong xã hội thuộc địa và phong kiến Việt Nam, tạo tiền đề cho sự ra đời của Đảng Cộng sản Việt Nam, chủ yếu là mâu thuẫn giữa giai cấp vô sản và giai cấp tư sản.","goiy":"Xem xét bản chất xã hội Việt Nam thời kỳ đó và đối tượng mà nhân dân Việt Nam phải đấu tranh được các tài liệu đề cập.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu chỉ rõ \"mâu thuẫn cơ bản giữa toàn thể nhân dân Việt Nam với các thế lực đế quốc và tay sai\". Mặc dù có đấu tranh giai cấp, nhưng mâu thuẫn dân tộc là bao trùm và cơ bản nhất trong bối cảnh xã hội thuộc địa và phong kiến Việt Nam."},{"loai":"mot","dang":"Đúng hay sai","q":"Tổ chức Hội Việt Nam Cách mệnh Thanh niên do Hồ Chí Minh lập ra đã góp phần vào sự chuyển biến xu hướng của một số người yêu nước từ dân chủ tư sản sang cộng sản rõ nhất từ năm 1925.","goiy":"Xem xét vai trò của Hội Việt Nam Cách mệnh Thanh niên và thời điểm chuyển biến các xu hướng yêu nước được nhắc đến trong tài liệu.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["A"],"gt":"Tài liệu chỉ rõ \"Một số người Việt Nam yêu nước lúc đầu đi theo xu hướng dân chủ tư sản, nhưng qua thực tế, dưới sự ảnh hưởng của chủ nghĩa Mác – Lênin, đã dần dần chuyển sang xu hướng cộng sản, rõ nhất là từ năm 1925 trở đi. Hàng loạt tổ chức yêu nước ra đời, trong đó tiêu biểu nhất là tổ chức Hội Việt Nam Cách mệnh Thanh niên do Hồ Chí Minh lập ra.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo các tài liệu, đâu là yếu tố cốt lõi nhất giải thích tính tất yếu của sự lãnh đạo Đảng Cộng sản Việt Nam trong quá trình phát triển của đất nước theo mục tiêu chủ nghĩa xã hội?","goiy":"Tìm lý do sâu xa nhất, mang tính bản chất được tài liệu đề cập cho \"tính tất yếu\" này.","pa":[{"k":"A","t":"Khả năng tập hợp quần chúng nhân dân của Hồ Chí Minh."},{"k":"B","t":"Sự tiên phong gương mẫu của giai cấp công nhân Việt Nam."},{"k":"C","t":"Yêu cầu phát triển nội tại của toàn dân tộc Việt Nam."},{"k":"D","t":"Sự can thiệp hỗ trợ từ các nước xã hội chủ nghĩa khác."},{"k":"E","t":"Tính ưu việt của mô hình đảng kiểu mới theo V.I. Lênin."}],"dung":["C"],"gt":"Tài liệu nêu rõ \"sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu, vai trò lãnh đạo của Đảng cũng là một tất yếu – điều đó xuất phát từ yêu cầu phát triển của dân tộc Việt Nam\". Các lựa chọn khác có thể là yếu tố góp phần hoặc hệ quả, nhưng \"yêu cầu phát triển của dân tộc Việt Nam\" là lý do cốt lõi nhất được đề cập trực tiếp."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Điểm khác biệt cơ bản trong sự ra đời của Đảng Cộng sản Việt Nam so với lý luận chung của Mác - Lênin về đảng cộng sản được các tài liệu nhấn mạnh là gì?","goiy":"So sánh công thức chung của Mác - Lênin với công thức đặc thù của Việt Nam được trình bày trong các tài liệu.","pa":[{"k":"A","t":"Sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân."},{"k":"B","t":"Sự lãnh đạo của một nhà cách mạng kiệt xuất Hồ Chí Minh."},{"k":"C","t":"Sự kết hợp thêm yếu tố phong trào yêu nước ở Việt Nam."},{"k":"D","t":"Việc vận dụng sáng tạo các nguyên tắc đảng kiểu mới."},{"k":"E","t":"Mục tiêu đấu tranh hàng đầu giành độc lập cho dân tộc."}],"dung":["C"],"gt":"Tài liệu chỉ ra: học thuyết Mác - Lênin cho rằng đảng cộng sản là sản phẩm của \"chủ nghĩa xã hội khoa học với phong trào công nhân\". Trong khi đó, sự ra đời của Đảng Cộng sản Việt Nam là \"kết quả của sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước\". Yếu tố \"phong trào yêu nước\" là điểm khác biệt được nhấn mạnh trong bối cảnh Việt Nam."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Điều nào sau đây phản ánh chính xác nhất nhận định của Hồ Chí Minh về vai trò của Đảng đối với cách mạng trong tác phẩm Đường cách mệnh?","goiy":"Hãy tìm cụm từ ví von đặc trưng mà Hồ Chí Minh dùng để mô tả vai trò của Đảng được trích dẫn trong tài liệu.","pa":[{"k":"A","t":"Đảng là người tổ chức các cuộc đàm phán ngoại giao quốc tế."},{"k":"B","t":"Đảng là trung tâm đào tạo các cán bộ chính trị cấp cao."},{"k":"C","t":"Đảng là \"người cầm lái\" vững chắc cho con thuyền cách mạng."},{"k":"D","t":"Đảng đóng vai trò là cơ quan lập pháp tối cao đất nước."},{"k":"E","t":"Đảng chủ yếu tập trung vào phát triển tiềm lực kinh tế."}],"dung":["C"],"gt":"Tài liệu trích dẫn Hồ Chí Minh khẳng định đảng cộng sản \"như người cầm lái\" cho con thuyền cách mạng và khẳng định đây là quan điểm nhất quán của Người. Các lựa chọn khác không phản ánh cụm từ đặc trưng và ý nghĩa cốt lõi này."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo các tài liệu, sự chuyển biến tư tưởng từ xu hướng dân chủ tư sản sang xu hướng cộng sản trong các phong trào yêu nước ở Việt Nam từ năm 1925 chủ yếu chịu ảnh hưởng bởi yếu tố nào?","goiy":"Tìm nguyên nhân trực tiếp dẫn đến sự thay đổi xu hướng tư tưởng trong các phong trào yêu nước được đề cập trong tài liệu.","pa":[{"k":"A","t":"Sự thất bại nhanh chóng của các phong trào nông dân."},{"k":"B","t":"Ảnh hưởng trực tiếp từ các cuộc cách mạng tư sản Tây."},{"k":"C","t":"Sự ra đời của các phong trào công nhân độc lập hoàn toàn."},{"k":"D","t":"Tác động của chủ nghĩa Mác – Lênin và thực tiễn đấu tranh."},{"k":"E","t":"Sự hỗ trợ về quân sự trực tiếp đến từ Liên Xô."}],"dung":["D"],"gt":"Tài liệu cho biết \"Một số người Việt Nam yêu nước lúc đầu đi theo xu hướng dân chủ tư sản, nhưng qua thực tế, dưới sự ảnh hưởng của chủ nghĩa Mác – Lênin, đã dần dần chuyển sang xu hướng cộng sản, rõ nhất là từ năm 1925 trở đi.\" Điều này nhấn mạnh vai trò của chủ nghĩa Mác – Lênin kết hợp với thực tiễn đấu tranh."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phát biểu nào sau đây KHÔNG ĐÚNG về bối cảnh xã hội Việt Nam tạo tiền đề cho sự ra đời của Đảng Cộng sản Việt Nam?","goiy":"Hãy đọc kỹ phần mô tả về các giai cấp và mâu thuẫn dân tộc trong xã hội Việt Nam thời bấy giờ.","pa":[{"k":"A","t":"Là một xã hội thuộc địa và phong kiến chịu áp bức."},{"k":"B","t":"Tồn tại mâu thuẫn cơ bản giữa nhân dân với đế quốc."},{"k":"C","t":"Giai cấp tư sản mại bản và đại địa chủ tham gia đấu tranh."},{"k":"D","t":"Các phong trào công nhân kết hợp nhuần nhuyễn yêu nước."},{"k":"E","t":"Các tổ chức yêu nước ra đời và phát triển mạnh mẽ."}],"dung":["C"],"gt":"Tài liệu khẳng định trong xã hội thuộc địa và phong kiến Việt Nam, \"mọi giai cấp, tầng lớp, trừ tư sản mại bản và đại địa chủ, đều có mâu thuẫn dân tộc\". Điều này ngụ ý rằng tư sản mại bản và đại địa chủ không có mâu thuẫn dân tộc và do đó không tham gia vào phong trào đấu tranh dân tộc, làm cho phát biểu C không đúng."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Điều nào sau đây KHÔNG PHẢN ÁNH quan điểm của Hồ Chí Minh về Đảng Cộng sản Việt Nam dựa trên các tài liệu đã cho?","goiy":"Đọc kỹ về sự hòa quyện giữa đấu tranh giai cấp và dân tộc trong bối cảnh Việt Nam được tài liệu đề cập.","pa":[{"k":"A","t":"Đảng được sáng lập và rèn luyện trực tiếp bởi Hồ Chí Minh."},{"k":"B","t":"Đảng tồn tại phát triển theo quan điểm Lênin về đảng kiểu mới."},{"k":"C","t":"Đảng chỉ tập trung đấu tranh giai cấp, tách rời đấu tranh dân tộc."},{"k":"D","t":"Đảng có vai trò \"người cầm lái\" cho con thuyền cách mạng."},{"k":"E","t":"Đảng đảm bảo phát huy vai trò lãnh đạo theo mục tiêu CNXH."}],"dung":["C"],"gt":"Tài liệu chỉ rõ \"Đấu tranh giai cấp hòa quyện với đấu tranh dân tộc.\" Quan điểm này cho thấy Đảng không tách rời hai loại đấu tranh này, mà ngược lại, kết hợp chúng. Do đó, phát biểu C không phản ánh đúng quan điểm của Hồ Chí Minh."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo các tài liệu, sự ra đời của Đảng Cộng sản Việt Nam KHÔNG PHẢI là hệ quả trực tiếp từ yếu tố nào sau đây?","goiy":"Xem xét các yếu tố được liệt kê là nguyên nhân trực tiếp dẫn đến sự ra đời của Đảng và những giai cấp được đề cập trong tài liệu.","pa":[{"k":"A","t":"Nhu cầu tất yếu của xã hội Việt Nam từ đầu năm 1930."},{"k":"B","t":"Sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân."},{"k":"C","t":"Việc toàn dân tộc trao cho sứ mệnh lãnh đạo đất nước."},{"k":"D","t":"Sự kết hợp chủ nghĩa Mác - Lênin với phong trào yêu nước."},{"k":"E","t":"Sự xuất hiện của lực lượng tư sản dân tộc đủ mạnh mẽ."}],"dung":["E"],"gt":"Tài liệu cho thấy giai cấp tư sản mại bản và đại địa chủ không có mâu thuẫn dân tộc, và các phong trào yêu nước ban đầu theo xu hướng dân chủ tư sản đã dần chuyển sang cộng sản. Tài liệu không hề đề cập đến việc xuất hiện một lực lượng tư sản dân tộc đủ mạnh để lãnh đạo cách mạng, mà ngược lại, sự chuyển hướng sang cộng sản chứng tỏ điều ngược lại."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phát biểu nào dưới đây KHÔNG ĐÚNG khi nói về quá trình vận dụng và phát triển tư tưởng Hồ Chí Minh về vai trò lãnh đạo của Đảng Cộng sản Việt Nam?","goiy":"Chú ý đến phạm vi áp dụng của vai trò lãnh đạo Đảng theo Hồ Chí Minh được các tài liệu diễn giải.","pa":[{"k":"A","t":"Quá trình vận dụng chỉ ra sự lãnh đạo là nguyên tắc vận hành."},{"k":"B","t":"Vai trò lãnh đạo của Đảng chỉ mới được khẳng định trong CNXH."},{"k":"C","t":"Quan điểm về \"người cầm lái\" là nhất quán trong cách mạng."},{"k":"D","t":"Mục tiêu phát triển đất nước theo CNXH là trọng tâm."},{"k":"E","t":"Đảm bảo và phát huy vai trò lãnh đạo Đảng là tất yếu."}],"dung":["B"],"gt":"Tài liệu khẳng định quan điểm về vai trò lãnh đạo của Đảng là \"nhất quán của Hồ Chí Minh... trong suốt quá trình cách mạng, cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\" Điều này mâu thuẫn với phát biểu B rằng vai trò này chỉ mới được khẳng định trong cách mạng xã hội chủ nghĩa."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo các tài liệu, những yếu tố nào sau đây đã góp phần vào sự ra đời của Đảng Cộng sản Việt Nam? (Chọn TẤT CẢ đáp án đúng)","goiy":"Xem xét các thành tố cấu thành Đảng được đề cập rõ trong tài liệu và bối cảnh xã hội Việt Nam.","pa":[{"k":"A","t":"Chủ nghĩa Mác - Lênin tiếp thu sáng tạo."},{"k":"B","t":"Phong trào công nhân Việt Nam phát triển."},{"k":"C","t":"Phong trào yêu nước Việt Nam mạnh mẽ."},{"k":"D","t":"Sự ủng hộ của giai cấp đại địa chủ."},{"k":"E","t":"Nhu cầu tất yếu của xã hội Việt Nam."}],"dung":["A","B","C"],"gt":"Tài liệu nêu rõ \"Sự ra đời của Đảng Cộng sản Việt Nam là kết quả của sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước.\""},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Phát biểu nào sau đây thể hiện đúng vai trò của Đảng Cộng sản Việt Nam theo tư tưởng Hồ Chí Minh và thực tiễn được các tài liệu đề cập? (Chọn TẤT CẢ đáp án đúng)","goiy":"Tổng hợp các vai trò và tính chất của Đảng được mô tả xuyên suốt các tài liệu.","pa":[{"k":"A","t":"Đảng là \"người cầm lái\" cho con thuyền cách mạng."},{"k":"B","t":"Sự lãnh đạo của Đảng là nguyên tắc vận hành xã hội."},{"k":"C","t":"Đảng có sứ mệnh lãnh đạo giải phóng dân tộc."},{"k":"D","t":"Đảng chỉ vận động và tổ chức dân chúng trong nước."},{"k":"E","t":"Đảng đại diện cho lợi ích bộ phận tư sản."}],"dung":["A","B","C"],"gt":"Tài liệu khẳng định Đảng là \"người cầm lái\". Sự lãnh đạo của Đảng là \"một nguyên tắc vận hành của xã hội Việt Nam\". Đảng được trao \"sứ mệnh lãnh đạo đất nước trong sự nghiệp giải phóng dân tộc và đi lên chủ nghĩa xã hội\". D sai vì Đảng liên lạc với vô sản và dân tộc bị áp bức toàn thế giới, E sai vì Đảng là của giai cấp công nhân và dân tộc."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo các tài liệu, đâu là những đặc điểm đúng về quá trình hình thành tư tưởng cộng sản ở Việt Nam trước năm 1930? (Chọn TẤT CẢ đáp án đúng)","goiy":"Chú ý đến quá trình chuyển hóa tư tưởng và các lực lượng tham gia đấu tranh được mô tả trong tài liệu.","pa":[{"k":"A","t":"Một số người yêu nước lúc đầu đi theo dân chủ tư sản."},{"k":"B","t":"Phong trào chuyển sang xu hướng cộng sản nhờ Mác-Lênin."},{"k":"C","t":"Hội Việt Nam Cách mệnh Thanh niên góp phần quan trọng."},{"k":"D","t":"Mâu thuẫn dân tộc là động lực chính của phong trào."},{"k":"E","t":"Chỉ có giai cấp công nhân mới có mâu thuẫn dân tộc."}],"dung":["A","B","C","D"],"gt":"Tài liệu mô tả người yêu nước lúc đầu theo xu hướng tư sản, sau chuyển sang cộng sản nhờ Mác - Lênin. Hội VN Cách mệnh Thanh niên đóng vai trò tiêu biểu. Mọi giai cấp ngoại trừ tư sản mại bản và đại địa chủ đều có mâu thuẫn dân tộc, nên D đúng và E sai."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những nhận định nào sau đây là đúng về mối quan hệ giữa đấu tranh giai cấp và đấu tranh dân tộc trong bối cảnh ra đời của Đảng Cộng sản Việt Nam? (Chọn TẤT CẢ đáp án đúng)","goiy":"Tìm hiểu cách các tài liệu mô tả sự tương tác giữa các loại hình đấu tranh và mục tiêu chung của chúng.","pa":[{"k":"A","t":"Đấu tranh giai cấp và đấu tranh dân tộc diễn ra độc lập."},{"k":"B","t":"Đấu tranh giai cấp hòa quyện với đấu tranh dân tộc."},{"k":"C","t":"Các phong trào cùng chung mục tiêu giành độc lập dân tộc."},{"k":"D","t":"Mâu thuẫn dân tộc là mâu thuẫn cơ bản chi phối xã hội."},{"k":"E","t":"Đấu tranh giai cấp chủ yếu do tư sản mại bản lãnh đạo."}],"dung":["B","C","D"],"gt":"Tài liệu khẳng định \"Đấu tranh giai cấp hòa quyện với đấu tranh dân tộc\" và các phong trào tuy khác nhau nhưng cùng chung mục tiêu độc lập. Mâu thuẫn dân tộc là mâu thuẫn cơ bản nhất. Do đó A và E là sai."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh khẳng định: Cách mạng \"Trước hết phải có đảng cách mệnh, để trong thì vận động và tổ chức dân chúng, ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp mọi nơi. Đảng có vững, cách mệnh mới thành công, cũng như người ________ có vững thuyền mới chạy”.","goiy":"Hãy tìm từ ngữ so sánh trực tiếp mà Hồ Chí Minh sử dụng trong câu gốc được trích dẫn.","pa":[{"k":"A","t":"kiến trúc sư"},{"k":"B","t":"chỉ huy"},{"k":"C","t":"cầm lái"},{"k":"D","t":"tiên phong"},{"k":"E","t":"dẫn đường"}],"dung":["C"],"gt":"Tài liệu trực tiếp trích dẫn Hồ Chí Minh: \"Đảng có vững, cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu, vai trò lãnh đạo của Đảng cũng là một tất yếu – điều đó xuất phát từ ________ của dân tộc Việt Nam.","goiy":"Tìm cụm từ chính xác được dùng để mô tả tài liệu gốc của tính tất yếu này trong tài liệu.","pa":[{"k":"A","t":"truyền thống lịch sử"},{"k":"B","t":"ý chí chính trị"},{"k":"C","t":"yêu cầu phát triển"},{"k":"D","t":"khát vọng cường thịnh"},{"k":"E","t":"nền tảng văn hóa"}],"dung":["C"],"gt":"Tài liệu nêu rõ \"sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu... điều đó xuất phát từ yêu cầu phát triển của dân tộc Việt Nam.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Quan điểm của Hồ Chí Minh về sự ra đời của Đảng hoàn toàn phù hợp với xã hội ________ và phong kiến như Việt Nam, khi mọi giai cấp, tầng lớp, trừ tư sản mại bản và đại địa chủ, đều có mâu thuẫn dân tộc.","goiy":"Nhớ lại đặc điểm chính của xã hội Việt Nam dưới ách thống trị thời điểm đó được tài liệu mô tả.","pa":[{"k":"A","t":"phong kiến"},{"k":"B","t":"thuộc địa"},{"k":"C","t":"công nghiệp"},{"k":"D","t":"dân chủ"},{"k":"E","t":"tư bản"}],"dung":["B"],"gt":"Tài liệu khẳng định \"Quan điểm của Hồ Chí Minh hoàn toàn phù hợp với xã hội thuộc địa và phong kiến như Việt Nam\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập và rèn luyện là một đảng chính trị tồn tại và phát triển theo những quan điểm của V.I. Lênin về đảng ________ của giai cấp vô sản.","goiy":"Ghi nhớ cụm từ đặc trưng mà V.I. Lênin sử dụng để mô tả đảng của giai cấp vô sản được đề cập trong tài liệu.","pa":[{"k":"A","t":"kiểu mẫu"},{"k":"B","t":"kiểu mới"},{"k":"C","t":"tiền phong"},{"k":"D","t":"trung tâm"},{"k":"E","t":"cách mạng"}],"dung":["B"],"gt":"Tài liệu nêu rõ Đảng Cộng sản Việt Nam \"tồn tại và phát triển theo những quan điểm của V.I. Lênin về đảng kiểu mới của giai cấp vô sản.\""},{"loai":"mot","dang":"Đúng hay sai","q":"Tư tưởng Hồ Chí Minh khẳng định Đảng Cộng sản Việt Nam ra đời là một tất yếu lịch sử, phù hợp với quy luật phát triển văn minh, tiến bộ của dân tộc và nhân loại, nhưng không nhất thiết mọi hoạt động của Đảng đều phải xuất phát từ yêu cầu phát triển của dân tộc.","goiy":"Xem xét quan điểm của Hồ Chí Minh về sự ra đời và mục đích hoạt động của Đảng văn minh, đặc biệt là mối quan hệ giữa lợi ích Đảng và lợi ích dân tộc.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Theo Tài liệu môn học, \"Mọi hoạt động của Đảng đều xuất phát từ yêu cầu phát triển của dân tộc, lấy lợi ích tối cao của dân tộc làm trọng, mọi lợi ích giai cấp đều phải đặt dưới sự phát triển của dân tộc\". Do đó, nhận định trên là không chính xác."},{"loai":"mot","dang":"Đúng hay sai","q":"Hồ Chí Minh xem tự phê bình và phê bình là \"thang thuốc\" tốt nhất để củng cố sự đoàn kết và thống nhất trong Đảng, nhưng không phải lúc nào cũng cần phải trung thực, kiên quyết vì có thể ảnh hưởng đến tình đồng chí.","goiy":"Đọc kỹ quan điểm của Hồ Chí Minh về phương pháp và mục đích của tự phê bình và phê bình.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu môn học nêu rõ: \"tự phê bình và phê bình phải trung thực, kiên quyết, đúng người, đúng việc, phải có văn hoá…\". Tính trung thực, kiên quyết không mâu thuẫn mà là điều kiện củng cố đoàn kết trên nền tảng tình đồng chí thương yêu lẫn nhau."},{"loai":"mot","dang":"Đúng hay sai","q":"Theo Hồ Chí Minh, Đảng Cộng sản Việt Nam là đội tiên phong của giai cấp công nhân và nhân dân lao động, nhưng không nhất thiết phải là hiện thân của văn hóa dân tộc.","goiy":"Xem xét vai trò và sứ mệnh toàn diện của Đảng trong tư tưởng Hồ Chí Minh, đặc biệt là mối liên hệ với văn hóa dân tộc.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu môn học khẳng định: \"Hồ Chí Minh ý thức được rằng, Đảng Cộng sản Việt Nam nhất thiết phải là hiện thân của văn hóa dân tộc vì Đảng là đội tiên phong không những của giai cấp công nhân mà còn của nhân dân lao động và của dân tộc\"."},{"loai":"mot","dang":"Đúng hay sai","q":"Kỷ luật của Đảng theo tư tưởng Hồ Chí Minh chỉ thực sự nghiêm minh và bền vững khi nó được xây dựng trên lòng tự giác của đảng viên về nhiệm vụ của họ đối với Đảng, chứ không đơn thuần là sự áp đặt từ trên xuống dưới.","goiy":"Tập trung vào bản chất và sức mạnh của kỷ luật Đảng theo Hồ Chí Minh.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["A"],"gt":"Tài liệu môn học chỉ rõ: \"Kỷ luật này là do lòng tự giác của đảng viên về nhiệm vụ của họ đối với Đảng; khi đã tự giác thì kỷ luật của Đảng mới nghiêm và mới bền lâu, thực sự tạo sức mạnh cho Đảng\"."},{"loai":"mot","dang":"Đúng hay sai","q":"Khi lợi ích chung của Đảng mâu thuẫn với lợi ích riêng của cá nhân, đảng viên và cán bộ theo Hồ Chí Minh được phép cân nhắc, đàm phán để dung hòa nhằm đảm bảo quyền lợi chính đáng của bản thân.","goiy":"Nhớ lại nguyên tắc về sự trung thành tuyệt đối và việc đặt lợi ích của Đảng lên trên hết.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu môn học nhấn mạnh: \"Nếu gặp khi lợi ích chung của Đảng mâu thuẫn với lợi ích riêng của cá nhân, thì phải kiên quyết hy sinh lợi ích của cá nhân cho lợi ích của Đảng\". Không có sự cân nhắc hay đàm phán khi mâu thuẫn."},{"loai":"mot","dang":"Đúng hay sai","q":"Hồ Chí Minh cảnh báo rằng \"giặc nội xâm\" (tham ô, lãng phí, quan liêu) đáng sợ hơn \"địch bên ngoài\", nhưng vai trò của cán bộ, đảng viên trong việc phòng, chống các tiêu cực này chỉ dừng lại ở việc gương mẫu, không cần trực tiếp đối mặt và xử lý các hành vi đó.","goiy":"Xem xét quan điểm của Hồ Chí Minh về \"giặc nội xâm\" và trách nhiệm của cán bộ, đảng viên.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu môn học khẳng định cán bộ, đảng viên phải \"chịu trách nhiệm, năng động, sáng tạo\", \"dám chịu trách nhiệm trước Đảng, trước nhân dân\". Trách nhiệm không chỉ là gương mẫu mà phải trực tiếp đối mặt và xử lý các tiêu cực."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, yếu tố nào được coi là \"cái gốc\" của mọi công việc, quyết định sự thành công hay thất bại?","goiy":"Đọc kỹ phần nói về công tác cán bộ trong tư tưởng Hồ Chí Minh.","pa":[{"k":"A","t":"Đường lối, chủ trương đúng đắn của Đảng."},{"k":"B","t":"Sự lãnh đạo tài tình của cấp ủy các cấp."},{"k":"C","t":"Chất lượng của đội ngũ cán bộ đảng viên."},{"k":"D","t":"Tinh thần đoàn kết, thống nhất toàn Đảng."},{"k":"E","t":"Sự ủng hộ, tin tưởng của quần chúng nhân dân."}],"dung":["C"],"gt":"Tài liệu môn học nêu rõ: \"cán bộ là gốc của mọi công việc, “muôn việc thành công hoặc thất bại, đều do cán bộ tốt hoặc kém”\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Mục đích hoạt động của Đảng Cộng sản Việt Nam, theo tư tưởng Hồ Chí Minh, là gì để Đảng không có mục đích riêng?","goiy":"Xem xét kỹ mục đích hoạt động cốt lõi của Đảng được Hồ Chí Minh nêu ra.","pa":[{"k":"A","t":"Xây dựng xã hội công bằng dựa trên giá trị truyền thống."},{"k":"B","t":"Lãnh đạo đấu tranh giải phóng dân tộc, xã hội, ấm no."},{"k":"C","t":"Củng cố quyền lực của giai cấp công nhân và lao động."},{"k":"D","t":"Thiết lập mối quan hệ hữu nghị bền vững quốc tế."},{"k":"E","t":"Đảm bảo phát triển kinh tế nâng cao vị thế quốc gia."}],"dung":["B"],"gt":"Tài liệu chỉ rõ mục đích duy nhất của Đảng là: \"lãnh đạo đấu tranh giải phóng dân tộc, giải phóng xã hội, giải phóng giai cấp, giải phóng con người... làm cho dân tộc được độc lập, nhân dân có cuộc sống ấm no, tự do, hạnh phúc thực sự\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong các nguyên tắc xây dựng Đảng, Hồ Chí Minh nhấn mạnh điều kiện tiên quyết để thực hiện nguyên tắc tập trung dân chủ hiệu quả là gì?","goiy":"Đọc lại phần về nguyên tắc tập trung dân chủ và điều kiện để thực hiện nó.","pa":[{"k":"A","t":"Phải có sự lãnh đạo tập trung tuyệt đối của Trung ương."},{"k":"B","t":"Toàn thể đảng viên phải phục tùng chân lý và nghị quyết."},{"k":"C","t":"Tổ chức Đảng phải thật sự trong sạch và vững mạnh."},{"k":"D","t":"Phải có sự giám sát chặt chẽ từ quần chúng nhân dân."},{"k":"E","t":"Cần thiết lập cơ chế kiểm soát quyền lực độc lập."}],"dung":["C"],"gt":"Tài liệu môn học nêu rõ: \"Điều kiện tiên quyết khi thực hiện nguyên tắc này [tập trung dân chủ] là tổ chức Đảng phải trong sạch, vững mạnh\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Quan điểm \"Đảng mà không có chủ nghĩa cũng như người không có trí khôn, tàu không có bàn chỉ nam\" của Hồ Chí Minh muốn nói lên tầm quan trọng cốt lõi của nguyên tắc nào?","goiy":"Từ khóa \"chủ nghĩa làm cốt\", \"trí khôn\", \"bàn chỉ nam\" gợi nhắc đến vai trò của học thuyết định hướng.","pa":[{"k":"A","t":"Nguyên tắc tập trung dân chủ trong sinh hoạt."},{"k":"B","t":"Tự phê bình và phê bình thường xuyên nghiêm túc."},{"k":"C","t":"Kỷ luật nghiêm minh, tự giác của mọi đảng viên."},{"k":"D","t":"Lấy chủ nghĩa Mác - Lênin làm nền tảng tư tưởng."},{"k":"E","t":"Đoàn kết, thống nhất chặt chẽ trong nội bộ Đảng."}],"dung":["D"],"gt":"Trong tác phẩm Đường cách mệnh, Hồ Chí Minh khẳng định: “Đảng muốn vững thì phải có chủ nghĩa làm cốt... Đảng mà không có chủ nghĩa cũng như người không có trí khôn, tàu không có bàn chỉ nam”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh chỉ ra rằng một Đảng \"mất lòng tin là mất tất cả\". Yêu cầu cốt lõi nào đối với Đảng Cộng sản Việt Nam được suy ra từ nhận định này?","goiy":"\"Mất lòng tin\" trực tiếp liên quan đến mối quan hệ giữa Đảng và quần chúng nhân dân.","pa":[{"k":"A","t":"Tuyệt đối tuân thủ Hiến pháp và pháp luật Nhà nước."},{"k":"B","t":"Giữ gìn sự trong sạch và liên hệ mật thiết với dân."},{"k":"C","t":"Không ngừng đổi mới phương thức lãnh đạo xã hội."},{"k":"D","t":"Đảm bảo sự đoàn kết quốc tế bền vững và trong sáng."},{"k":"E","t":"Phát triển kinh tế vượt bậc để nâng cao đời sống."}],"dung":["B"],"gt":"Tài liệu nhấn mạnh việc giữ gìn Đảng trong sạch, vững mạnh và đặc biệt là liên hệ mật thiết với nhân dân (\"học dân, làm cho dân tin\") là cốt lõi để duy trì lòng tin."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, \"Đảng không phải là một tổ chức để làm quan phát tài\" mà phải làm tròn nhiệm vụ giải phóng dân tộc, làm cho Tổ quốc giàu mạnh. Điều này thể hiện rõ nhất nguyên tắc nào?","goiy":"Quan điểm về mục đích không tự thân gợi nhắc đến việc liên tục hoàn thiện bản thân.","pa":[{"k":"A","t":"Đảng lấy chủ nghĩa Mác - Lênin làm nền tảng."},{"k":"B","t":"Đảng phải thường xuyên tự chỉnh đốn bản thân."},{"k":"C","t":"Thực hiện nguyên tắc tập trung dân chủ thống nhất."},{"k":"D","t":"Đoàn kết, thống nhất chặt chẽ trong toàn Đảng."},{"k":"E","t":"Kỷ luật nghiêm minh, tự giác của mọi cán bộ."}],"dung":["B"],"gt":"Tài liệu nêu rõ: \"Đảng không có mục đích tự thân, Đảng không phải là tổ chức để làm quan phát tài... Do đó, thường xuyên tự chỉnh đốn trở thành một nhiệm vụ cực kỳ quan trọng trong xây dựng Đảng\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo tư tưởng Hồ Chí Minh về Đảng là đạo đức, là văn minh, điểm nào dưới đây KHÔNG PHẢI là biểu hiện của đạo đức Đảng?","goiy":"Nhớ lại định nghĩa về đạo đức của Đảng, đặc biệt là quan điểm về \"mục đích riêng\".","pa":[{"k":"A","t":"Mục đích hoạt động là giải phóng dân tộc, xã hội."},{"k":"B","t":"Cương lĩnh luôn trung thành với lợi ích toàn dân tộc."},{"k":"C","t":"Đảng có mục đích riêng là xây dựng nhà nước hùng cường."},{"k":"D","t":"Cán bộ thấm nhuần đạo đức, phấn đấu vì nhân dân."},{"k":"E","t":"Đảng là tiên phong của giai cấp công nhân và nhân dân."}],"dung":["C"],"gt":"Tài liệu khẳng định: \"Đảng không có mục đích riêng; sự ra đời và phát triển của Đảng chỉ có mục đích duy nhất là làm cho đất nước hùng cường, đi lên chủ nghĩa xã hội, đưa lại quyền lợi cho dân\". Do đó C sai."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Trong các yêu cầu đối với đội ngũ cán bộ, đảng viên được Hồ Chí Minh đề cập, yêu cầu nào dưới đây KHÔNG ĐÚNG?","goiy":"Xem xét các yêu cầu về phẩm chất \"đức\" và \"tài\" đối với cán bộ, đảng viên.","pa":[{"k":"A","t":"Phải tuyệt đối trung thành, sẵn sàng hy sinh lợi ích cá nhân."},{"k":"B","t":"Luôn nâng cao trình độ nhưng không cần rèn đạo đức."},{"k":"C","t":"Có mối liên hệ mật thiết, là đầy tớ trung thành của dân."},{"k":"D","t":"Phải luôn chịu trách nhiệm, năng động sáng tạo công việc."},{"k":"E","t":"Phải luôn phòng và chống các tiêu cực tham ô lãng phí."}],"dung":["B"],"gt":"Yêu cầu xây dựng đội ngũ cán bộ \"vừa có đức vừa có tài\". Tu dưỡng đạo đức cách mạng là yêu cầu thường xuyên và bắt buộc với mọi đảng viên. Nhận định B không cần chú trọng đạo đức là sai."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Hồ Chí Minh cảnh báo về sự thoái hóa, biến chất của cán bộ, đảng viên. Trong các biểu hiện dưới đây, biểu hiện nào KHÔNG ĐƯỢC Người xem là dấu hiệu của thoái hóa, biến chất?","goiy":"Tập trung vào các biểu hiện tiêu cực mà Hồ Chí Minh đã liệt kê.","pa":[{"k":"A","t":"Mang nặng chủ nghĩa cá nhân, nghĩ lợi ích riêng."},{"k":"B","t":"Thích địa vị quyền hành, coi thường tập thể nhân dân."},{"k":"C","t":"Năng động, sáng tạo, dám chịu trách nhiệm khó khăn."},{"k":"D","t":"Ngại gian khổ, sa vào tham ô, lãng phí, xa hoa."},{"k":"E","t":"Mắc bệnh quan liêu, không chấp hành đúng đường lối."}],"dung":["C"],"gt":"Năng động, sáng tạo trong công việc, dám chịu trách nhiệm trước những khó khăn mới là một phẩm chất tích cực, không phải là biểu hiện thoái hóa biến chất."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Để Đảng thực sự là một Đảng văn minh, Hồ Chí Minh đã nêu ra nhiều nội dung chủ yếu. Nội dung nào sau đây KHÔNG PHÙ HỢP với tư tưởng của Người về Đảng văn minh?","goiy":"Xem xét mối quan hệ giữa lợi ích giai cấp và lợi ích dân tộc trong tư tưởng Hồ Chí Minh.","pa":[{"k":"A","t":"Đảng tiêu biểu cho lương tâm, trí tuệ và danh dự."},{"k":"B","t":"Đảng hoạt động trong khuôn khổ Hiến pháp và pháp luật."},{"k":"C","t":"Đảng phải luôn trong sạch, hoàn thành sứ mệnh lịch sử."},{"k":"D","t":"Mọi lợi ích giai cấp phải đặt lên trên lợi ích dân tộc."},{"k":"E","t":"Đảng có quan hệ quốc tế trong sáng, tôn trọng các nước."}],"dung":["D"],"gt":"Tài liệu nêu rõ: \"Mọi hoạt động của Đảng đều xuất phát từ yêu cầu phát triển của dân tộc, lấy lợi ích tối cao của dân tộc làm trọng, mọi lợi ích giai cấp đều phải đặt dưới sự phát triển của dân tộc\". D ghi \"đặt lên trên\" là hoàn toàn sai."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nguyên tắc \"Tập trung dân chủ\" được Hồ Chí Minh nhấn mạnh hai điều cần tránh trong hoạt động của Đảng. Điều nào dưới đây KHÔNG THUỘC hai điều cần tránh đó?","goiy":"Đọc kỹ hai điều cần tránh được nêu trực tiếp trong phần giải thích về tập trung dân chủ.","pa":[{"k":"A","t":"Độc đoán, chuyên quyền, coi thường tập thể."},{"k":"B","t":"Dựa dẫm tập thể, không dám quyết đoán công việc."},{"k":"C","t":"Trì hoãn, chậm trễ ra quyết định do thảo luận kéo dài."},{"k":"D","t":"Thiếu sự kết hợp hài hòa tập thể và cá nhân."},{"k":"E","t":"Cá nhân phụ trách mà không có sự lãnh đạo tập thể."}],"dung":["C"],"gt":"Tài liệu chỉ ra hai điều cần tránh cụ thể: \"một là, độc đoán, chuyên quyền, coi thường tập thể; hai là, dựa dẫm tập thể, không dám quyết đoán\". Phương án C không được nêu trực tiếp như hai điều cần tránh chính."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Hồ Chí Minh chỉ rõ những điểm thoái hóa, biến chất của cán bộ, đảng viên. Theo Người, điều nào sau đây KHÔNG ĐƯỢC coi là biểu hiện của \"chủ nghĩa cá nhân\"?","goiy":"Nhớ lại định nghĩa và các biểu hiện của chủ nghĩa cá nhân mà Hồ Chí Minh chỉ ra.","pa":[{"k":"A","t":"Coi thường tập thể, xem khinh quần chúng nhân dân."},{"k":"B","t":"Độc đoán, chuyên quyền trong lãnh đạo quản lý."},{"k":"C","t":"Luôn đặt lợi ích của Đảng lên trên lợi ích cá nhân."},{"k":"D","t":"Ngại gian khổ, sa vào tham ô, hủ hóa, lãng phí."},{"k":"E","t":"Thiếu tinh thần trách nhiệm, không chấp hành đường lối."}],"dung":["C"],"gt":"Việc \"luôn đặt lợi ích của Đảng lên trên lợi ích cá nhân\" là một phẩm chất đạo đức cách mạng cao đẹp, hoàn toàn đối lập với chủ nghĩa cá nhân."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo tư tưởng Hồ Chí Minh, để xây dựng Đảng Cộng sản Việt Nam thành một Đảng văn minh, cần phải đảm bảo những nội dung chủ yếu nào? (Chọn TẤT CẢ đáp án đúng)","goiy":"Đọc kỹ các nội dung chủ yếu của Đảng văn minh.","pa":[{"k":"A","t":"Đảng tiêu biểu cho lương tâm, trí tuệ và danh dự."},{"k":"B","t":"Đảng hoạt động trong khuôn khổ Hiến pháp pháp luật."},{"k":"C","t":"Mọi lợi ích giai cấp phải đặt dưới sự phát triển dân tộc."},{"k":"D","t":"Cán bộ chủ chốt phải là chiến sĩ tiên phong gương mẫu."},{"k":"E","t":"Đảng có mục đích riêng là duy trì quyền lực lãnh đạo."}],"dung":["A","B","C","D"],"gt":"Tài liệu nêu rõ Đảng văn minh tiêu biểu cho lương tâm, trí tuệ; mọi lợi ích giai cấp đặt dưới sự phát triển dân tộc; hoạt động trong khuôn khổ Hiến pháp; đảng viên gương mẫu. E sai vì Đảng không có mục đích riêng."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những phẩm chất đạo đức cách mạng nào mà Hồ Chí Minh đặc biệt chú trọng \"rèn\" cho cán bộ, đảng viên để Đảng là đạo đức, là văn minh? (Chọn TẤT CẢ đáp án đúng)","goiy":"Nhớ lại những đức tính cụ thể được Người đề cập khi nói về đạo đức của đảng viên.","pa":[{"k":"A","t":"Cần, kiệm, liêm, chính, chí công vô tư."},{"k":"B","t":"Có lòng nhân ái, tình đồng chí thương yêu lẫn nhau."},{"k":"C","t":"Trung với Đảng, trung với nước, hiếu với dân."},{"k":"D","t":"Tinh thần quốc tế trong sáng và cao cả."},{"k":"E","t":"Khả năng lãnh đạo, quản lý và điều hành xuất sắc."}],"dung":["A","B","C","D"],"gt":"Tài liệu nêu rõ các phẩm chất: Cần kiệm liêm chính; tình đồng chí thương yêu lẫn nhau; trung với Đảng nước, hiếu với dân; tinh thần quốc tế trong sáng. E là thuộc về năng lực, tài năng chứ không phải phẩm chất đạo đức được nhấn mạnh."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, những yếu tố nào tạo nên sức mạnh của một đảng cộng sản, giúp Đảng \"tuy đông người, nhưng khi tiến đánh chỉ như một người\"? (Chọn TẤT CẢ đáp án đúng)","goiy":"Tập trung vào các nguyên tắc tạo nên sức mạnh thống nhất của Đảng.","pa":[{"k":"A","t":"Kỷ luật nghiêm minh, tự giác của mọi đảng viên."},{"k":"B","t":"Tư tưởng và hành động nhất trí cao trong Đảng."},{"k":"C","t":"Sự đoàn kết chặt chẽ, một lòng một dạ phục vụ."},{"k":"D","t":"Nền tảng chủ nghĩa Mác - Lênin làm kim chỉ nam."},{"k":"E","t":"Quyền tự do cá nhân được phát huy tối đa không gò ép."}],"dung":["A","B","C","D"],"gt":"Sức mạnh bắt nguồn từ kỷ luật nghiêm minh tự giác, tư tưởng hành động nhất trí, đoàn kết chặt chẽ và nền tảng chủ nghĩa Mác - Lênin. E không đúng vì tự do cá nhân phải phục tùng tập trung."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Trong công tác cán bộ, Hồ Chí Minh yêu cầu phải thực hiện những nội dung nào để đảm bảo hiệu quả và sự trong sạch của đội ngũ? (Chọn TẤT CẢ đáp án đúng)","goiy":"Nhớ lại các yêu cầu cụ thể trong công tác cán bộ.","pa":[{"k":"A","t":"Phải hiểu và đánh giá đúng cán bộ đảng viên."},{"k":"B","t":"Phải chú trọng huấn luyện cán bộ một cách thiết thực."},{"k":"C","t":"Phải kết hợp cán bộ trẻ với cán bộ cũ kinh nghiệm."},{"k":"D","t":"Phải phòng và chống các tiêu cực trong công tác cán bộ."},{"k":"E","t":"Tuyệt đối tin tưởng, không cần kiểm tra thường xuyên."}],"dung":["A","B","C","D"],"gt":"Tài liệu liệt kê: đánh giá đúng cán bộ; huấn luyện thiết thực; kết hợp cán bộ trẻ và cũ; phòng chống tiêu cực; kiểm tra thường xuyên giúp đỡ cán bộ. Do đó E là sai."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, khi nói về mối quan hệ giữa Đảng Cộng sản Việt Nam và nhân dân, những điểm nào sau đây được Người đặc biệt nhấn mạnh? (Chọn TẤT CẢ đáp án đúng)","goiy":"Tập trung vào các quan điểm về mối quan hệ \"máu thịt\" giữa Đảng và nhân dân.","pa":[{"k":"A","t":"Đảng phải là người lãnh đạo, đầy tớ trung thành."},{"k":"B","t":"Đảng không có lợi ích gì khác ngoài lợi ích dân tộc."},{"k":"C","t":"Dân chỉ biết giá trị tự do độc lập khi ăn no mặc đủ."},{"k":"D","t":"Đảng học hỏi quần chúng nhưng không theo đuôi quần chúng."},{"k":"E","t":"Đảng nên giữ khoảng cách để duy trì sự tôn trọng."}],"dung":["A","B","C","D"],"gt":"Tài liệu trích dẫn đầy đủ A, B, C, D. E hoàn toàn sai vì Hồ Chí Minh cảnh báo \"cách xa dân chúng, đứng lơ lửng giữa trời nhất định thất bại\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những biểu hiện nào dưới đây được Hồ Chí Minh nhận diện là dấu hiệu của chủ nghĩa cá nhân trong một số cán bộ, đảng viên có \"đạo đức, phẩm chất thấp kém\"? (Chọn TẤT CẢ đáp án đúng)","goiy":"Nhớ lại danh sách các biểu hiện tiêu cực được nêu trong bài báo \"Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân\".","pa":[{"k":"A","t":"Tham danh, trục lợi, thích địa vị, quyền hành."},{"k":"B","t":"Thiếu tính tổ chức, kỷ luật, mất đoàn kết."},{"k":"C","t":"Luôn thể hiện tinh thần \"thắng không kiêu bại không nản\"."},{"k":"D","t":"Coi thường tập thể, xem khinh quần chúng nhân dân."},{"k":"E","t":"Kém tinh thần trách nhiệm, không chấp hành đường lối."}],"dung":["A","B","D","E"],"gt":"Liệt kê các biểu hiện chủ nghĩa cá nhân gồm: tham danh trục lợi; thiếu tổ chức kỷ luật; coi thường tập thể; kém trách nhiệm. C (\"thắng không kiêu, bại không nản\") là phẩm chất tích cực."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh khẳng định: \"Đảng ta là đạo đức, là __________\". Đây là một trong những tư tưởng cốt lõi của Người về xây dựng Đảng trong sạch, vững mạnh.","goiy":"Nhớ lại câu nói nổi tiếng của Hồ Chí Minh về bản chất của Đảng.","pa":[{"k":"A","t":"cách mạng"},{"k":"B","t":"văn minh"},{"k":"C","t":"công lý"},{"k":"D","t":"trí tuệ"},{"k":"E","t":"nhân dân"}],"dung":["B"],"gt":"Hồ Chí Minh khẳng định tại Lễ kỷ niệm 30 năm thành lập Đảng: “Đảng ta là đạo đức, là văn minh”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, Đảng \"phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người _________ thật trung thành của nhân dân\".","goiy":"Nhớ lại vai trò mà Hồ Chí Minh đặt ra cho Đảng trong mối quan hệ với nhân dân.","pa":[{"k":"A","t":"thủ lĩnh"},{"k":"B","t":"đại diện"},{"k":"C","t":"đầy tớ"},{"k":"D","t":"chiến sĩ"},{"k":"E","t":"công bộc"}],"dung":["C"],"gt":"Tài liệu môn học viết: \"Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong Di chúc, Hồ Chí Minh nhấn mạnh: \"Phải có tình đồng chí __________ lẫn nhau\" để củng cố sự đoàn kết và thống nhất trong Đảng, đặc biệt trong quá trình tự phê bình và phê bình.","goiy":"Cụm từ nói về tình cảm giữa các đảng viên.","pa":[{"k":"A","t":"tôn trọng"},{"k":"B","t":"hỗ trợ"},{"k":"C","t":"tin cậy"},{"k":"D","t":"thương yêu"},{"k":"E","t":"thấu hiểu"}],"dung":["D"],"gt":"Trong Di chúc, Hồ Chí Minh viết: \"Trong Đảng thực hành dân chủ rộng rãi, thường xuyên và nghiêm chỉnh tự phê bình và phê bình... Phải có tình đồng chí thương yêu lẫn nhau”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh cho rằng, \"Đảng không có mục đích tự thân, Đảng không phải là tổ chức để làm quan phát tài mà Đảng từ trong xã hội mà ra, hoạt động vì Tổ quốc giàu mạnh, đồng bào __________\".","goiy":"Từ ngữ diễn tả mong muốn của Hồ Chí Minh về cuộc sống của đồng bào.","pa":[{"k":"A","t":"tiến bộ"},{"k":"B","t":"hạnh phúc"},{"k":"C","t":"sung sướng"},{"k":"D","t":"văn minh"},{"k":"E","t":"độc lập"}],"dung":["C"],"gt":"Tài liệu nêu rõ câu nói của Hồ Chí Minh: \"...hoạt động vì Tổ quốc giàu mạnh, đồng bào sung sướng\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong \"Sửa đổi lối làm việc\", Hồ Chí Minh nêu lên 12 điều về tư cách của đảng chân chính cách mạng, trong đó có Điều số 10: \"Đảng phải luôn luôn __________ những phần tử hủ hóa ra ngoài\".","goiy":"Hành động mạnh mẽ để loại bỏ những yếu tố tiêu cực.","pa":[{"k":"A","t":"loại trừ"},{"k":"B","t":"thanh lọc"},{"k":"C","t":"tẩy bỏ"},{"k":"D","t":"giáo dục"},{"k":"E","t":"cô lập"}],"dung":["C"],"gt":"Điều số 10 trong tác phẩm \"Sửa đổi lối làm việc\": \"Đảng phải luôn luôn tẩy bỏ những phần tử hủ hóa ra ngoài\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh cảnh báo: \"cách xa dân chúng, không liên hệ chặt chẽ với dân chúng, cũng như đứng lơ lửng giữa trời, nhất định __________\". Mất lòng tin là mất tất cả.","goiy":"Từ ngữ diễn tả hậu quả của việc mất liên hệ với dân.","pa":[{"k":"A","t":"suy yếu"},{"k":"B","t":"lạc hậu"},{"k":"C","t":"cô lập"},{"k":"D","t":"thất bại"},{"k":"E","t":"thoái hóa"}],"dung":["D"],"gt":"Tài liệu môn học khẳng định: “cách xa dân chúng, không liên hệ chặt chẽ với dân chúng, cũng như đứng lơ lửng giữa trời, nhất định thất bại”."}]},{"ma":"09","ten":"Nhà nước dân chủ","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Theo tư tưởng Hồ Chí Minh, Nhà nước Việt Nam mới được thành lập mang bản chất của một nhà nước \"phi giai cấp\" để đoàn kết toàn dân tộc.","goiy":"Xem lại phần \"Bản chất giai cấp của Nhà nước\", đặc biệt đoạn mở đầu.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu khẳng định: \"Nhà nước Việt Nam là nhà nước dân chủ, nhưng tuyệt nhiên nó không phải là “nhà nước toàn dân”, hiểu theo nghĩa là nhà nước phi giai cấp. Nhà nước ở đâu và bao giờ cũng mang bản chất của một giai cấp nhất định. Nhà nước Việt Nam mới... là một nhà nước mang bản chất giai cấp công nhân.\""},{"loai":"mot","dang":"Đúng hay sai","q":"Nguyên tắc \"tập trung dân chủ\" trong tổ chức và hoạt động của Nhà nước Việt Nam theo tư tưởng Hồ Chí Minh chỉ nhấn mạnh sự cần thiết của việc phát huy cao độ tập trung quyền lực để đảm bảo tính thống nhất.","goiy":"Đọc kỹ phần giải thích về nguyên tắc tập trung dân chủ.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu nêu rõ: \"Hồ Chí Minh rất chú ý đến cả hai mặt dân chủ và tập trung trong tổ chức và hoạt động của tất cả bộ máy, cơ quan nhà nước. Người nhấn mạnh đến sự cần thiết phải phát huy cao độ dân chủ, đồng thời cũng nhấn mạnh phải phát huy cao độ tập trung\". Do đó, việc chỉ nhấn mạnh tập trung mà bỏ qua dân chủ là không đúng với tư tưởng của Người."},{"loai":"mot","dang":"Đúng hay sai","q":"Hồ Chí Minh cho rằng, hình thức dân chủ gián tiếp là hình thức hoàn bị nhất để nhân dân thực thi quyền lực, vì nó cho phép lựa chọn những đại diện ưu tú nhất.","goiy":"So sánh quan điểm của Hồ Chí Minh về dân chủ trực tiếp và gián tiếp.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu chỉ rõ: \"Hồ Chí Minh luôn coi trọng hình thức dân chủ trực tiếp và tạo mọi điều kiện thuận lợi để thực hành dân chủ trực tiếp, bởi đây là hình thức dân chủ hoàn bị nhất.\" Như vậy, dân chủ trực tiếp mới là hình thức hoàn bị nhất, không phải dân chủ gián tiếp."},{"loai":"mot","dang":"Đúng hay sai","q":"Trong tư tưởng Hồ Chí Minh về nhà nước của nhân dân, luật pháp chỉ có vai trò phản ánh ý nguyện của dân chúng mà không phải là công cụ để kiểm soát quyền lực nhà nước.","goiy":"Đọc phần vai trò của luật pháp trong nhà nước của nhân dân.","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu khẳng định: \"Luật pháp đó là của nhân dân, là công cụ thực thi quyền lực của nhân dân, là phương tiện để kiểm soát quyền lực nhà nước.\" Do đó, luật pháp vừa phản ánh ý nguyện, bảo vệ quyền lợi, vừa là phương tiện kiểm soát quyền lực nhà nước."},{"loai":"mot","dang":"Đúng hay sai","q":"Quan điểm \"Dân là chủ\" trong tư tưởng Hồ Chí Minh xác định vị thế chủ thể tối cao của nhân dân đối với quyền lực nhà nước, trong khi \"Dân làm chủ\" nhấn mạnh quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ.","goiy":"Phân biệt ý nghĩa của hai cụm từ \"Dân là chủ\" và \"Dân làm chủ\".","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["A"],"gt":"Tài liệu ghi rõ: \"Nguyên lý “dân là chủ” khẳng định địa vị chủ thể tối cao của mọi quyền lực là nhân dân.\" Tài liệu cũng nêu: \"“Dân là chủ” xác định vị thế của nhân dân đối với quyền lực nhà nước, còn “dân làm chủ” nhấn mạnh quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ.\""},{"loai":"mot","dang":"Đúng hay sai","q":"Để một cán bộ nhà nước thật sự \"vì dân\", Hồ Chí Minh chỉ yêu cầu họ có tinh thần chí công vô tư và tận tụy, không đòi hỏi về năng lực trí tuệ hay tầm nhìn xa trông rộng.","goiy":"Xem xét các phẩm chất cần có của cán bộ trong nhà nước \"vì nhân dân\".","pa":[{"k":"A","t":"Đúng"},{"k":"B","t":"Sai"}],"dung":["B"],"gt":"Tài liệu và mô tả phẩm chất của cán bộ \"vì dân\" bao gồm cả \"là người đầy tớ\" (trung thành, tận tụy, cần, kiệm, liêm, chính, chí công vô tư, lo trước thiên hạ, vui sau thiên hạ) và \"là người lãnh đạo\" (trí tuệ hơn người, minh mẫn, sáng suốt, nhìn xa trông rộng, gần gũi nhân dân, trọng dụng hiền tài). Điều này cho thấy yêu cầu về cả đức và tài."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, bản chất giai cấp công nhân của Nhà nước Việt Nam Dân chủ Cộng hòa không chỉ thể hiện ở vai trò lãnh đạo của Đảng Cộng sản, mà còn ở một khía cạnh cơ bản nào sau đây?","goiy":"Nhớ lại các phương diện thể hiện bản chất giai cấp công nhân của Nhà nước.","pa":[{"k":"A","t":"Sự phân chia rõ rệt giữa ba nhánh lập pháp, hành pháp và tư pháp."},{"k":"B","t":"Việc đảm bảo quyền tự quyết tuyệt đối cho mọi giai cấp trong xã hội."},{"k":"C","t":"Tính định hướng xã hội chủ nghĩa trong sự phát triển của đất nước."},{"k":"D","t":"Sự loại trừ hoàn toàn mọi ảnh hưởng giai cấp khác khỏi bộ máy nhà nước."},{"k":"E","t":"Việc tập trung tối đa nguồn lực và quyền lực nhà nước vào tay Chính phủ."}],"dung":["C"],"gt":"Tài liệu nêu rõ: \"Hai là, bản chất giai cấp của Nhà nước Việt Nam thể hiện ở tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước. Đưa đất nước đi lên chủ nghĩa xã hội và chủ nghĩa cộng sản là mục tiêu cách mạng nhất quán của Hồ Chí Minh.\" Các phương án A, B, D, E không phản ánh đúng tư tưởng của Người."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh đã giải quyết mối quan hệ giữa vấn đề dân tộc và vấn đề giai cấp trong cách mạng Việt Nam như thế nào trong tư tưởng về Nhà nước mới?","goiy":"Xem phần \"Trong Nhà nước Việt Nam, bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc\".","pa":[{"k":"A","t":"Đặt vấn đề giai cấp lên trên dân tộc, coi trọng công nhân hơn nhân dân."},{"k":"B","t":"Tách biệt hoàn toàn vấn đề dân tộc khỏi vấn đề giai cấp trong cách mạng."},{"k":"C","t":"Coi bản chất giai cấp công nhân thống nhất với tính nhân dân và dân tộc."},{"k":"D","t":"Tập trung củng cố bản chất giai cấp công nhân, ít chú trọng đến dân tộc."},{"k":"E","t":"Xác định lợi ích dân tộc chỉ là yếu tố phụ trợ cho giai cấp công nhân."}],"dung":["C"],"gt":"Tài liệu khẳng định: \"Trong Nhà nước Việt Nam, bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc. Hồ Chí Minh là người giải quyết rất thành công mối quan hệ giữa vấn đề dân tộc với vấn đề giai cấp trong cách mạng Việt Nam.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo tư tưởng Hồ Chí Minh, khi nói về hình thức dân chủ gián tiếp, vị thế và mối quan hệ giữa nhân dân với cán bộ nhà nước được xác định như thế nào?","goiy":"Đọc kỹ các đoạn văn mô tả mối quan hệ giữa nhân dân và cán bộ nhà nước trong hình thức dân chủ gián tiếp.","pa":[{"k":"A","t":"Cán bộ nhà nước là người đại diện tối cao, nắm giữ quyền lực tự thân có."},{"k":"B","t":"Nhân dân là chủ thể nắm giữ mọi quyền lực, cán bộ là công bộc của dân."},{"k":"C","t":"Cán bộ nhà nước và nhân dân có vị thế hoàn toàn bình đẳng về quyền lực."},{"k":"D","t":"Nhân dân chỉ có quyền bầu cử, không có quyền kiểm soát công việc cán bộ."},{"k":"E","t":"Quyền lực nhà nước tồn tại độc lập hoàn toàn với sự ủy thác của nhân dân."}],"dung":["B"],"gt":"Tài liệu nêu: \"Quyền lực nhà nước là “thừa ủy quyền” của nhân dân. Tự bản thân nhà nước không có quyền lực. Quyền lực của nhà nước là do nhân dân ủy thác. Do vậy, các cơ quan quyền lực nhà nước cùng với đội ngũ cán bộ “đều là công bộc của dân...” nhấn mạnh: “Ở đây, Hồ Chí Minh đã xác định rõ vị thế và mối quan hệ giữa nhân dân với cán bộ nhà nước trên cơ sở nhân dân là chủ thể nắm giữ mọi quyền lực.”\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong quan điểm về \"nhà nước do nhân dân\", Hồ Chí Minh nhấn mạnh điều gì là cần thiết để nhân dân có thể thực hiện tốt vai trò làm chủ của mình?","goiy":"Tìm đoạn nói về năng lực làm chủ của nhân dân.","pa":[{"k":"A","t":"Nhân dân cần tuân thủ mọi mệnh lệnh nhà nước ban hành mà không cần hiểu rõ."},{"k":"B","t":"Nhà nước phải tuyên bố mọi quyền làm chủ của dân mà không chuẩn bị năng lực."},{"k":"C","t":"Nhà nước cần coi trọng giáo dục nhân dân và nhân dân tự giác nâng cao năng lực."},{"k":"D","t":"Chỉ những người có trình độ học vấn rất cao mới có thể tham gia bộ máy nhà nước."},{"k":"E","t":"Nhà nước cần tập trung mọi quyền lực để thay mặt nhân dân tự đưa ra quyết định."}],"dung":["C"],"gt":"Tài liệu và nêu rõ: \"Nhà nước do nhân dân cần coi trọng việc giáo dục nhân dân, đồng thời nhân dân cũng phải tự giác phấn đấu để có đủ năng lực thực hiện quyền dân chủ của mình. Hồ Chí Minh nói: “Chúng ta là những người lao động làm chủ nước nhà. Muốn làm chủ được tốt, phải có năng lực làm chủ”.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Thước đo cơ bản nhất để đánh giá một Nhà nước thật sự \"vì dân\" theo Hồ Chí Minh là gì?","goiy":"Xem phần \"Nhà nước vì nhân dân\", đặc biệt là cách Hồ Chí Minh đặt vấn đề với cán bộ.","pa":[{"k":"A","t":"Mức độ tăng trưởng và sự giàu mạnh về tiềm lực kinh tế của đất nước."},{"k":"B","t":"Số lượng các văn bản luật pháp được ban hành để quản lý toàn xã hội."},{"k":"C","t":"Sự ủng hộ, niềm tin tưởng chân thành của nhân dân (được lòng dân chúng)."},{"k":"D","t":"Khả năng kiểm soát nghiêm ngặt và hạn chế quyền lực cá nhân của cán bộ."},{"k":"E","t":"Việc thực hiện đầy đủ mọi nghi thức dân chủ hình thức trong quản lý."}],"dung":["C"],"gt":"Tài liệu chỉ rõ: \"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải được lòng dân. Hồ Chí Minh đặt vấn đề với cán bộ Nhà nước phải làm sao cho được lòng dân, dân tin, dân mến, dân yêu.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh phê phán gay gắt những cán bộ nhà nước nào?","goiy":"Xem đoạn Hồ Chí Minh phê phán cán bộ trong nhà nước của nhân dân.","pa":[{"k":"A","t":"Cán bộ làm việc quá tận tụy với công việc, quên đi lợi ích cá nhân mình."},{"k":"B","t":"Cán bộ không dám đưa ra quyết định đổi mới táo bạo vì lo sợ xảy ra sai lầm."},{"k":"C","t":"Cán bộ thoái hóa, biến chất, từ công bộc thành \"quan cách mạng\" đè đầu dân."},{"k":"D","t":"Cán bộ chỉ tập trung giải quyết những công việc trực tiếp mang lợi cho dân."},{"k":"E","t":"Cán bộ có trí tuệ vượt trội xuất sắc nhưng ít khi chủ động gần gũi nhân dân."}],"dung":["C"],"gt":"Tài liệu nêu: \"Chính vì vậy, Hồ Chí Minh kịch liệt phê phán những cán bộ nhà nước thoái hóa, biến chất, từ chỗ là công bộc của dân đã trở thành “quan cách mạng”, đứng trên nhân dân, coi khinh nhân dân, “cậy thế” với dân, “quên rằng dân bầu mình ra là để làm việc cho dân”.\""},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Trong các nhận định sau về bản chất giai cấp của Nhà nước Việt Nam theo tư tưởng Hồ Chí Minh, nhận định nào là SAI?","goiy":"Đọc kỹ các đặc điểm của bản chất giai cấp công nhân và mối quan hệ với tính nhân dân, tính dân tộc.","pa":[{"k":"A","t":"Nhà nước Việt Nam Dân chủ Cộng hòa không phải nhà nước phi giai cấp."},{"k":"B","t":"Đảng Cộng sản Việt Nam giữ vai trò cầm quyền thể hiện bản chất công nhân."},{"k":"C","t":"Tính định hướng xã hội chủ nghĩa là mục tiêu nhất quán của Nhà nước mới."},{"k":"D","t":"Bản chất giai cấp công nhân của Nhà nước hoàn toàn tách rời với nhân dân."},{"k":"E","t":"Nguyên tắc tập trung dân chủ là nguyên tắc tổ chức hoạt động của Nhà nước."}],"dung":["D"],"gt":"Tài liệu khẳng định: \"Trong Nhà nước Việt Nam, bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc.\" Điều này trực tiếp phủ nhận nhận định D."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG phản ánh đúng cách thức mà Đảng Cộng sản Việt Nam cầm quyền theo tư tưởng Hồ Chí Minh?","goiy":"Xem các phương thức cầm quyền của Đảng được liệt kê.","pa":[{"k":"A","t":"Bằng việc thể chế hóa đường lối, quan điểm của Đảng thành luật pháp."},{"k":"B","t":"Bằng hoạt động của các tổ chức đảng và đảng viên trong bộ máy nhà nước."},{"k":"C","t":"Bằng việc tăng cường thực hiện công tác kiểm tra và giám sát nhà nước."},{"k":"D","t":"Bằng việc trực tiếp chỉ định mọi vị trí cán bộ cấp cao của nhà nước."},{"k":"E","t":"Bằng việc lãnh đạo khối liên minh nòng cốt công - nông - trí thức."}],"dung":["D"],"gt":"Tài liệu liệt kê ba phương thức Đảng cầm quyền: \"(1) Bằng đường lối, quan điểm, chủ trương để Nhà nước thể chế hóa thành pháp luật, chính sách, kế hoạch; (2) Bằng hoạt động của các tổ chức đảng và đảng viên của mình trong bộ máy, cơ quan nhà nước; (3) Bằng công tác kiểm tra.\" Việc \"chỉ định trực tiếp mọi cán bộ cấp cao của nhà nước\" không được đề cập là một trong các phương thức cầm quyền chính thức, và mâu thuẫn với nguyên tắc dân chủ."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo tư tưởng Hồ Chí Minh về nhà nước của nhân dân, nhận định nào sau đây là KHÔNG chính xác về quyền lực nhà nước?","goiy":"Xem lại các đặc điểm của nhà nước của nhân dân, đặc biệt là quyền lực và mối quan hệ giữa dân và nhà nước.","pa":[{"k":"A","t":"Quyền lực nhà nước là do nhân dân ủy thác, không phải tự thân có."},{"k":"B","t":"Nhân dân là chủ thể tối cao nắm giữ toàn bộ mọi quyền lực nhà nước."},{"k":"C","t":"Cán bộ nhà nước là công bộc của dân, gánh vác việc chung cho dân."},{"k":"D","t":"Nhà nước có quyền giải tán các thiết chế quyền lực nếu mất tín nhiệm."},{"k":"E","t":"Luật pháp dân chủ là công cụ để nhân dân kiểm soát quyền lực nhà nước."}],"dung":["D"],"gt":"Tài liệu và nêu rõ: \"Nhân dân có quyền kiểm soát, phê bình nhà nước, có quyền bãi miễn những đại biểu mà họ đã lựa chọn, bầu ra và có quyền giải tán những thiết chế quyền lực mà họ đã lập nên.\" Như vậy, quyền giải tán thiết chế quyền lực thuộc về nhân dân, không phải nhà nước."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Khi bàn về nhà nước do nhân dân, Hồ Chí Minh đã khẳng định những nghĩa vụ nào của nhân dân với tư cách người chủ, NGOẠI TRỪ nghĩa vụ nào sau đây?","goiy":"Đọc kỹ các nghĩa vụ của nhân dân trong phần \"dân làm chủ\".","pa":[{"k":"A","t":"Gương mẫu nghiêm chỉnh tuân theo pháp luật hiện hành của Nhà nước."},{"k":"B","t":"Giữ đúng kỷ luật lao động và duy trì trật tự an toàn công cộng chung."},{"k":"C","t":"Hăng hái tham gia công việc chung và bảo vệ tích cực tài sản công."},{"k":"D","t":"Luôn ưu tiên lợi ích cá nhân mình hơn lợi ích chung của Nhà nước."},{"k":"E","t":"Đóng góp nộp thuế đúng kỳ, đúng số để xây dựng lợi ích toàn dân."}],"dung":["D"],"gt":"Tài liệu liệt kê các nghĩa vụ của nhân dân như tuân theo pháp luật, kỷ luật lao động, giữ trật tự chung, đóng góp (nộp thuế), tham gia công việc chung, bảo vệ tài sản công cộng và Tổ quốc. Việc \"ưu tiên lợi ích cá nhân hơn lợi ích chung của Nhà nước\" rõ ràng mâu thuẫn với tinh thần chung của một công dân làm chủ và không được nhắc đến."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo quan điểm Hồ Chí Minh về nhà nước vì nhân dân, nhận định nào sau đây về cán bộ nhà nước là SAI?","goiy":"Xem xét các yêu cầu đối với cán bộ trong nhà nước \"vì nhân dân\", đặc biệt là đoạn cuối về việc \"chẳng những làm những việc trực tiếp lợi cho dân\".","pa":[{"k":"A","t":"Cán bộ vừa là đày tớ trung thành, vừa là người lãnh đạo của nhân dân."},{"k":"B","t":"Cán bộ phải có đầy đủ cả đức lẫn tài, vừa hiền lành lại vừa minh mẫn."},{"k":"C","t":"Cán bộ chỉ làm những việc trực tiếp lợi cho dân, tránh việc gây khó."},{"k":"D","t":"Cán bộ phải trung thành, tận tụy, cần kiệm liêm chính chí công vô tư."},{"k":"E","t":"Cán bộ phải có trí tuệ hơn người, minh mẫn sáng suốt nhìn xa trông rộng."}],"dung":["C"],"gt":"Tài liệu có đoạn: \"Phải như thế thì mới có thể “chẳng những làm những việc trực tiếp lợi cho dân, mà cũng có khi làm những việc mới xem qua như là hại đến dân”, nhưng thực chất là vì lợi ích toàn cục, vì lợi ích lâu dài của nhân dân.\" Điều này cho thấy cán bộ không chỉ giới hạn ở việc làm những gì trực tiếp có lợi."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG phải là một đặc điểm của Nhà nước Việt Nam mới được nêu trong tư tưởng Hồ Chí Minh?","goiy":"Nhớ lại các đặc điểm khi bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc.","pa":[{"k":"A","t":"Nhà nước ra đời là kết quả cuộc đấu tranh lâu dài của toàn dân tộc."},{"k":"B","t":"Nhà nước kiên trì mục tiêu vì quyền lợi nhân dân và nền tảng dân tộc."},{"k":"C","t":"Nhà nước đảm đương nhiệm vụ tổ chức kháng chiến bảo vệ độc lập."},{"k":"D","t":"Nhà nước thành lập dựa trên ưu tiên một giai cấp bỏ qua toàn dân."},{"k":"E","t":"Con đường quá độ lên chủ nghĩa xã hội là sự nghiệp của Nhà nước."}],"dung":["D"],"gt":"Tài liệu khẳng định \"bản chất giai cấp công nhân của Nhà nước thống nhất với tính nhân dân và tính dân tộc\" và \"Nhà nước Việt Nam mới, do vậy, không phải của riêng giai cấp, tầng lớp nào, mà là thuộc về nhân dân.\" Nhận định D mâu thuẫn trực tiếp với điều này."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo tư tưởng Hồ Chí Minh, những điểm nào sau đây thể hiện sự thống nhất giữa bản chất giai cấp công nhân với tính nhân dân và tính dân tộc của Nhà nước Việt Nam?","goiy":"Đọc kỹ phần giải thích về sự thống nhất giữa bản chất giai cấp công nhân, tính nhân dân và tính dân tộc.","pa":[{"k":"A","t":"Nhà nước ra đời là kết quả của cuộc đấu tranh lâu dài của toàn thể dân tộc."},{"k":"B","t":"Nhà nước kiên trì, nhất quán mục tiêu vì quyền lợi nhân dân và nền tảng dân tộc."},{"k":"C","t":"Lợi ích cơ bản của giai cấp công nhân thống nhất với lợi ích của nhân dân."},{"k":"D","t":"Nhà nước đảm đương nhiệm vụ tổ chức nhân dân tiến hành kháng chiến bảo vệ."},{"k":"E","t":"Nhà nước chỉ tập trung phục vụ riêng cho lợi ích của giai cấp công nhân."}],"dung":["A","B","C","D"],"gt":"Các điểm A, B, C, D đều được nêu rõ trong tài liệu. Cụ thể, tài liệu nói về kết quả đấu tranh của toàn dân tộc, mục tiêu vì quyền lợi nhân dân, sự thống nhất lợi ích và nhiệm vụ đảm đương. Đáp án E là sai vì mâu thuẫn với tư tưởng Bác."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những phát biểu nào sau đây của Hồ Chí Minh thể hiện rõ nét tư tưởng về cán bộ nhà nước là \"công bộc của dân\"?","goiy":"Tập trung vào những câu nói hoặc ý nghĩa trực tiếp về vai trò \"đày tớ\" hoặc \"công bộc\" của cán bộ.","pa":[{"k":"A","t":"\"Chủ tịch, bộ trưởng, thứ trưởng... là làm đày tớ cho nhân dân.\""},{"k":"B","t":"\"Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ.\""},{"k":"C","t":"\"Từ người quét nhà... đến Chủ tịch... đều phân công làm đày tớ.\""},{"k":"D","t":"\"Quyền lực nhà nước là “thừa ủy quyền” chính thức từ nhân dân.\""},{"k":"E","t":"\"Nhân dân có quyền bãi miễn đại biểu Quốc hội nếu không xứng đáng.\""}],"dung":["A","C"],"gt":"Các câu A và C được trích dẫn trực tiếp trong tài liệu để minh họa cho tư tưởng cán bộ là \"đày tớ\" của dân. Câu B nêu địa vị của dân, câu D nêu nguồn gốc quyền lực nhà nước, câu E nêu quyền kiểm soát của dân, tất cả đều liên quan nhưng A và C trực tiếp thể hiện vai trò \"công bộc của dân\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo tư tưởng Hồ Chí Minh, những hành vi nào của cán bộ nhà nước sẽ bị kịch liệt phê phán vì đi ngược lại nguyên tắc \"công bộc của dân\"?","goiy":"Xem đoạn Hồ Chí Minh phê phán cán bộ.","pa":[{"k":"A","t":"Đứng trên nhân dân, coi khinh nhân dân trong mọi công việc."},{"k":"B","t":"\"Cậy thế\" với dân, lợi dụng chức vụ và quyền hạn để hách dịch."},{"k":"C","t":"Quên rằng dân bầu mình ra là để gánh vác làm việc cho dân."},{"k":"D","t":"Thoái hóa, biến chất, biến bản thân thành \"quan cách mạng\"."},{"k":"E","t":"Luôn nỗ lực làm công việc trực tiếp có lợi trước mắt cho dân."}],"dung":["A","B","C","D"],"gt":"Tài liệu liệt kê các hành vi bị phê phán: \"thoái hóa, biến chất, từ chỗ là công bộc của dân đã trở thành “quan cách mạng”, đứng trên nhân dân, coi khinh nhân dân, “cậy thế” với dân, “quên rằng dân bầu mình ra là để làm việc cho dân”.\" Đáp án E không phải là hành vi bị phê phán."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những điểm nào sau đây thể hiện \"tư tưởng dân chủ triệt để của Hồ Chí Minh khi nói về nhà nước do nhân dân\"?","goiy":"Đọc kỹ đoạn cuối phần \"Nhà nước do nhân dân\".","pa":[{"k":"A","t":"Chỉ tuyên bố quyền làm chủ của nhân dân trên giấy tờ văn bản."},{"k":"B","t":"Đưa nhân dân tham gia tích cực vào các công việc nhà nước."},{"k":"C","t":"Chuẩn bị chu đáo năng lực thực hành làm chủ cho nhân dân."},{"k":"D","t":"Động viên nhân dân tự giác rèn luyện tốt năng lực làm chủ."},{"k":"E","t":"Xem quyền làm chủ là bẩm sinh nên hoàn toàn không cần giáo dục."}],"dung":["B","C","D"],"gt":"Tài liệu nêu: \"Nhà nước do nhân dân không chỉ tuyên bố quyền làm chủ của nhân dân, cũng không chỉ đưa nhân dân tham gia công việc nhà nước, mà còn chuẩn bị và động viên nhân dân chuẩn bị tốt năng lực làm chủ, quan điểm đó thể hiện tư tưởng dân chủ triệt để của Hồ Chí Minh khi nói về nhà nước do nhân dân.\" Do đó, A không đủ, E là sai."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo tư tưởng Hồ Chí Minh, để một cán bộ nhà nước thực sự \"vì dân\", họ cần phải có những phẩm chất nào sau đây?","goiy":"Xem xét các phẩm chất của cán bộ trong nhà nước \"vì dân\".","pa":[{"k":"A","t":"Trung thành, tận tụy, cần kiệm liêm chính chí công vô tư."},{"k":"B","t":"Tinh thần sẵn sàng lo trước thiên hạ và vui sau thiên hạ."},{"k":"C","t":"Trí tuệ hơn người, minh mẫn sáng suốt nhìn xa trông rộng."},{"k":"D","t":"Luôn gần gũi với nhân dân và biết trọng dụng các hiền tài."},{"k":"E","t":"Độc lập hoàn toàn với ý chí nhân dân để ra quyết định riêng."}],"dung":["A","B","C","D"],"gt":"Tài liệu liệt kê các phẩm chất cần có của cán bộ, bao gồm trung thành, tận tụy, cần, kiệm, liêm, chính, chí công vô tư, lo trước thiên hạ, vui sau thiên hạ (tính \"đày tớ\") và trí tuệ, minh mẫn, sáng suốt, nhìn xa trông rộng, gần gũi nhân dân, trọng dụng hiền tài (tính \"lãnh đạo\"). Đáp án E mâu thuẫn với nguyên tắc quyền lực nhà nước là \"thừa ủy quyền\" của nhân dân."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Luật pháp trong Nhà nước Việt Nam mới theo Hồ Chí Minh có những đặc điểm cơ bản nào?","goiy":"Xem phần về luật pháp dân chủ trong nhà nước của nhân dân.","pa":[{"k":"A","t":"Phản ánh đúng đắn và chân thực ý nguyện của nhân dân."},{"k":"B","t":"Bảo vệ tối đa mọi quyền lợi chính đáng của dân chúng."},{"k":"C","t":"Bản chất luật pháp đó là sản phẩm thuộc về nhân dân."},{"k":"D","t":"Là công cụ đắc lực để thực thi quyền lực của nhân dân."},{"k":"E","t":"Là phương tiện hiệu quả kiểm soát quyền lực nhà nước."}],"dung":["A","B","C","D","E"],"gt":"Tài liệu nêu rõ: \"sự khác biệt căn bản của luật pháp trong Nhà nước Việt Nam mới với luật pháp của nhà nước theo các chế độ tư sản, phong kiến là ở chỗ nó phản ánh được ý nguyện và bảo vệ quyền lợi của dân chúng. Luật pháp đó là của nhân dân, là công cụ thực thi quyền lực của nhân dân, là phương tiện để kiểm soát quyền lực nhà nước.\" Tất cả 5 phương án đều đúng."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Nhà nước Việt Nam mới – Nhà nước Việt Nam Dân chủ Cộng hòa, theo quan điểm của Hồ Chí Minh, là một nhà nước mang bản chất giai cấp (1) _______, nhưng tuyệt nhiên không phải là “nhà nước (2) _______”, hiểu theo nghĩa là nhà nước (3) _______.","goiy":"Đọc lại đoạn mở đầu của phần \"Bản chất giai cấp của Nhà nước\". [Từ gợi ý: công nhân, nhân dân, toàn dân, phi giai cấp, ủy thác...]","pa":[{"k":"A","t":"(1) công nhân — (2) toàn dân — (3) phi giai cấp"},{"k":"B","t":"(1) nhân dân — (2) công nhân — (3) phi giai cấp"},{"k":"C","t":"(1) công nhân — (2) phi giai cấp — (3) toàn dân"},{"k":"D","t":"(1) toàn dân — (2) công nhân — (3) ủy thác"},{"k":"E","t":"(1) công nhân — (2) đày tớ — (3) phi giai cấp"}],"dung":["A"],"gt":"Tài liệu ghi: \"Nhà nước Việt Nam là nhà nước dân chủ, nhưng tuyệt nhiên nó không phải là “nhà nước toàn dân”, hiểu theo nghĩa là nhà nước phi giai cấp. Nhà nước ở đâu và bao giờ cũng mang bản chất của một giai cấp nhất định. Nhà nước Việt Nam mới... là một nhà nước mang bản chất giai cấp công nhân.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Một trong những phương diện thể hiện bản chất giai cấp công nhân của Nhà nước Việt Nam là tính (1) _______ trong sự phát triển đất nước, với mục tiêu nhất quán là đưa đất nước đi lên chủ nghĩa xã hội và chủ nghĩa cộng sản.","goiy":"Tìm ý về mục tiêu phát triển đất nước trong phần bản chất giai cấp.","pa":[{"k":"A","t":"(1) định hướng xã hội chủ nghĩa"},{"k":"B","t":"(1) dân chủ gián tiếp thực thi"},{"k":"C","t":"(1) chí công vô tư tận tụy"},{"k":"D","t":"(1) năng lực làm chủ nhân dân"},{"k":"E","t":"(1) kiểm soát và bãi miễn dân"}],"dung":["A"],"gt":"Tài liệu nêu: \"Hai là, bản chất giai cấp của Nhà nước Việt Nam thể hiện ở tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước. Đưa đất nước đi lên chủ nghĩa xã hội và chủ nghĩa cộng sản là mục tiêu cách mạng nhất quán của Hồ Chí Minh.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong hình thức dân chủ gián tiếp, quyền lực nhà nước là “thừa (1) _______” của nhân dân, do đó các cơ quan quyền lực nhà nước cùng với đội ngũ cán bộ “đều là công bộc của dân, nghĩa là để gánh vác việc chung cho dân, chứ không phải để đè đầu dân” và làm (2) _______.","goiy":"Xem xét mối quan hệ giữa nhân dân và quyền lực nhà nước trong dân chủ gián tiếp.","pa":[{"k":"A","t":"(1) ủy thác — (2) đày tớ"},{"k":"B","t":"(1) đày tớ — (2) ủy thác"},{"k":"C","t":"(1) kiểm soát — (2) quan cách mạng"},{"k":"D","t":"(1) quyền lợi — (2) nghĩa vụ"},{"k":"E","t":"(1) ủy thác — (2) quan cách mạng"}],"dung":["A"],"gt":"Tài liệu nêu: \"Quyền lực nhà nước là “thừa ủy quyền” của nhân dân. Tự bản thân nhà nước không có quyền lực. Quyền lực của nhà nước là do nhân dân ủy thác.\" Tài liệu bổ sung: \"Dân làm chủ thì Chủ tịch, bộ trưởng, thứ trưởng, ủy viên này ủy viên khác là làm gì? Làm đày tớ.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Để bảo đảm mọi quyền lực luôn nằm trong tay dân chúng, Hồ Chí Minh khẳng định nhân dân có quyền (1) _______, phê bình nhà nước, có quyền (2) _______ những đại biểu mà họ đã lựa chọn, bầu ra và có quyền giải tán những thiết chế quyền lực mà họ đã lập nên.","goiy":"Nhớ lại các quyền của nhân dân đối với nhà nước trong phần \"nhà nước của nhân dân\".","pa":[{"k":"A","t":"(1) kiểm soát — (2) bãi miễn"},{"k":"B","t":"(1) bãi miễn — (2) kiểm soát"},{"k":"C","t":"(1) ủy thác — (2) đày tớ"},{"k":"D","t":"(1) kiểm tra — (2) chỉ định"},{"k":"E","t":"(1) kiểm soát — (2) ủy thác"}],"dung":["A"],"gt":"Tài liệu ghi: \"Nhân dân có quyền kiểm soát, phê bình nhà nước, có quyền bãi miễn những đại biểu mà họ đã lựa chọn, bầu ra và có quyền giải tán những thiết chế quyền lực mà họ đã lập nên.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong quan điểm về \"nhà nước do nhân dân\", Hồ Chí Minh đã chỉ rõ \"Dân là chủ\" xác định vị thế của nhân dân đối với quyền lực nhà nước, còn \"Dân làm chủ\" nhấn mạnh (1) _______ và (2) _______ của nhân dân với tư cách là người chủ.","goiy":"Phân biệt ý nghĩa của \"Dân là chủ\" và \"Dân làm chủ\".","pa":[{"k":"A","t":"(1) quyền lợi — (2) nghĩa vụ"},{"k":"B","t":"(1) nghĩa vụ — (2) quyền lực"},{"k":"C","t":"(1) ủy thác — (2) đày tớ"},{"k":"D","t":"(1) trí tuệ — (2) chí công vô tư"},{"k":"E","t":"(1) quyền lợi — (2) năng lực"}],"dung":["A"],"gt":"Tài liệu nêu: \"“Dân là chủ” xác định vị thế của nhân dân đối với quyền lực nhà nước, còn “dân làm chủ” nhấn mạnh quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải (1) _______, và Người yêu cầu cán bộ phải làm sao cho được lòng dân, dân tin, dân mến, dân yêu. Để đạt được điều đó, trước hết phải yêu dân, phải đặt quyền lợi của dân trên hết thảy, phải có một tinh thần (2) _______.","goiy":"Tìm hiểu về thước đo của nhà nước \"vì dân\" và phẩm chất cần có của cán bộ.","pa":[{"k":"A","t":"(1) được lòng dân — (2) chí công vô tư"},{"k":"B","t":"(1) chí công vô tư — (2) được lòng dân"},{"k":"C","t":"(1) năng lực làm chủ — (2) mưu tự do"},{"k":"D","t":"(1) được lòng dân — (2) định hướng XHCN"},{"k":"E","t":"(1) kiểm soát — (2) chí công vô tư"}],"dung":["A"],"gt":"Tài liệu g
