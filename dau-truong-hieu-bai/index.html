hi: \"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải được lòng dân.\" Tài liệu bổ sung: \"muốn được dân yêu, muốn được lòng dân, trước hết phải yêu dân, phải đặt quyền lợi của dân trên hết thảy, phải có một tinh thần chí công vô tư.\""}]},{"ma":"10","ten":"Nhà nước pháp quyền, trong sạch, vững mạnh","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Hồ Chí Minh nhận định \"chủ nghĩa cá nhân\" là \"bệnh gốc\" sinh ra các bệnh tham ô, lãng phí trong bộ máy nhà nước.","goiy":"Xem xét các nguyên nhân tiêu cực và mối quan hệ giữa chúng trong tư tưởng Hồ Chí Minh, đặc biệt là phân tích về các \"bệnh\" liên quan.","pa":[{"k":"A","t":"Đúng - Nhận định trên hoàn toàn chính xác"},{"k":"B","t":"Sai - Nhận định trên là chưa đúng thực tế"}],"dung":["B"],"gt":"Tài liệu khẳng định bệnh quan liêu là \"bệnh gốc sinh ra các bệnh tham ô, lãng phí\". Trong khi đó, tài liệu chỉ ra \"chủ nghĩa cá nhân\" là \"bệnh mẹ\" dẫn đến các tiêu cực. Có sự phân biệt rõ ràng giữa \"bệnh mẹ\" và \"bệnh gốc\" trong tư tưởng của Người về các nguyên nhân sâu xa của tiêu cực."},{"loai":"mot","dang":"Đúng hay sai","q":"Một trong những điều kiện tiên quyết để công tác kiểm soát quyền lực nhà nước của Đảng Cộng sản Việt Nam đạt kết quả tốt là người đi kiểm soát phải có chức vụ cao để đảm bảo sự răn đe.","goiy":"Tài liệu nêu rõ hai điều kiện để công tác kiểm soát đạt kết quả tốt.","pa":[{"k":"A","t":"Đúng - Khẳng định nêu trên là chính xác"},{"k":"B","t":"Sai - Khẳng định nêu trên là chưa đúng"}],"dung":["B"],"gt":"Theo tài liệu, Hồ Chí Minh chỉ rõ hai điều kiện để kiểm soát có kết quả tốt là \"việc kiểm soát phải có hệ thống và người đi kiểm soát phải là những người rất có uy tín\", không đề cập đến việc người đó phải có chức vụ cao. Uy tín là một phẩm chất cá nhân, không đồng nhất với cấp bậc chức vụ."},{"loai":"mot","dang":"Đúng hay sai","q":"Tư tưởng Hồ Chí Minh về Nhà nước pháp quyền đã sớm thể hiện sự chú trọng việc thay thế chế độ ra các sắc lệnh bằng chế độ ra các đạo luật, được nêu rõ trong bản Yêu sách của nhân dân An Nam năm 1919.","goiy":"Tài liệu mô tả nội dung bản Yêu sách của nhân dân An Nam năm 1919 và ý nghĩa của nó trong tư tưởng Hồ Chí Minh.","pa":[{"k":"A","t":"Đúng - Khẳng định nêu trên là chính xác"},{"k":"B","t":"Sai - Khẳng định nêu trên là chưa đúng"}],"dung":["A"],"gt":"Tài liệu ghi rõ trong bản Yêu sách của nhân dân An Nam năm 1919, một trong những yêu cầu là \"Thay thế chế độ ra các sắc lệnh bằng chế độ ra các đạo luật\". Điều này thể hiện sự nhất quán trong tư tưởng Hồ Chí Minh về việc xây dựng một Nhà nước hợp hiến, hợp pháp với nền tảng pháp lý vững chắc ngay từ rất sớm."},{"loai":"mot","dang":"Đúng hay sai","q":"Hồ Chí Minh cho rằng, việc giáo dục pháp luật cần tập trung chủ yếu vào thế hệ trẻ để xây dựng ý thức pháp quyền vững chắc cho tương lai.","goiy":"Tài liệu đề cập đến đối tượng và tầm quan trọng của công tác giáo dục pháp luật.","pa":[{"k":"A","t":"Đúng - Khẳng định nêu trên là chính xác"},{"k":"B","t":"Sai - Khẳng định nêu trên là chưa đúng"}],"dung":["B"],"gt":"Tài liệu chỉ rõ \"công tác giáo dục pháp luật cho mọi người, đặc biệt cho thế hệ trẻ trở nên cực kỳ quan trọng\". Điều này có nghĩa là công tác giáo dục pháp luật phải được thực hiện cho tất cả mọi người, không chỉ riêng thế hệ trẻ, mặc dù Người nhấn mạnh tầm quan trọng đặc biệt của việc giáo dục cho thế hệ trẻ để xây dựng Nhà nước pháp quyền."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo tư tưởng Hồ Chí Minh, yếu tố nào được Người xem là quan trọng nhất trong việc Nhà nước quản lý bộ máy và điều hành xã hội?","goiy":"Tài liệu chỉ ra biện pháp quản lý được Hồ Chí Minh đánh giá cao nhất.","pa":[{"k":"A","t":"Quản lý bằng bộ máy hành chính cồng kềnh"},{"k":"B","t":"Quản lý bằng các biện pháp kinh tế xã hội"},{"k":"C","t":"Quản lý bằng Hiến pháp và pháp luật chung"},{"k":"D","t":"Quản lý bằng ban hành sắc lệnh khẩn cấp"},{"k":"E","t":"Quản lý bằng sự ảnh hưởng uy tín cá nhân"}],"dung":["C"],"gt":"Tài liệu nêu rõ: \"Trong tư tưởng Hồ Chí Minh, Nhà nước quản lý bằng bộ máy và bằng nhiều biện pháp khác nhau, nhưng quan trọng nhất là quản lý bằng Hiến pháp và bằng pháp luật nói chung.\" Đây là nguyên tắc cốt lõi của Nhà nước pháp quyền."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo quan điểm \"Pháp quyền nhân nghĩa\" của Hồ Chí Minh, mục tiêu cao nhất mà sự nghiệp cách mạng của dân tộc Việt Nam hướng tới là gì?","goiy":"Tài liệu trực tiếp đề cập đến mục tiêu cao nhất của sự nghiệp cách mạng.","pa":[{"k":"A","t":"Đấu tranh giành độc lập hoàn toàn chủ quyền quốc gia"},{"k":"B","t":"Xây dựng Nhà nước có kỷ luật chặt chẽ bộ máy tốt"},{"k":"C","t":"Giải phóng con người làm cho mọi người tự do hạnh phúc"},{"k":"D","t":"Xóa bỏ luật pháp hà khắc cũ thiết lập trật tự mới"},{"k":"E","t":"Nâng cao dân trí và ý thức chấp hành luật pháp toàn dân"}],"dung":["C"],"gt":"Tài liệu khẳng định: \"mục tiêu giải phóng con người, làm cho mọi người có được cuộc sống hạnh phúc, tự do, xứng với phẩm giá con người, được hưởng dụng các quyền con người một cách đầy đủ nhất đã hòa quyện một cách hữu cơ và trở thành mục tiêu cao nhất của sự nghiệp cách mạng của dân tộc Việt Nam.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Cuộc Tổng tuyển cử ngày 6-1-1946, một sự kiện lịch sử trọng đại, đã được tiến hành với các đặc điểm nào để đảm bảo tính dân chủ và thể hiện quyền lực tối cao của nhân dân?","goiy":"Tài liệu cung cấp thông tin chi tiết về thể thức của cuộc Tổng tuyển cử.","pa":[{"k":"A","t":"Thực hiện Bỏ phiếu công khai trực tiếp có Đồng minh giám sát"},{"k":"B","t":"Thực hiện Phổ thông đầu phiếu gián tiếp và bỏ phiếu công khai"},{"k":"C","t":"Thực hiện Phổ thông đầu phiếu trực tiếp cùng bỏ phiếu kín"},{"k":"D","t":"Thực hiện Bỏ phiếu theo đại diện của các giai cấp tôn giáo"},{"k":"E","t":"Thực hiện Bỏ phiếu theo sự chỉ định của Chính phủ lâm thời"}],"dung":["C"],"gt":"Tài liệu mô tả rõ: \"Cuộc Tổng tuyển cử được tiến hành thắng lợi ngày 6-1-1946 với chế độ phổ thông đầu phiếu, trực tiếp và bỏ phiếu kín.\" Đây là những đặc điểm cơ bản làm nên tính dân chủ, tiến bộ của cuộc bầu cử này, lần đầu tiên trong lịch sử Việt Nam và Đông Nam châu Á."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, \"bệnh gốc\" mà từ đó sinh ra các bệnh tham ô, lãng phí trong bộ máy nhà nước là gì?","goiy":"Tài liệu phân tích mối quan hệ giữa các loại tiêu cực trong bộ máy nhà nước.","pa":[{"k":"A","t":"Tư tưởng Bệnh chủ nghĩa cá nhân"},{"k":"B","t":"Tư tưởng Bệnh đặc quyền đặc lợi"},{"k":"C","t":"Tư tưởng Bệnh quan liêu hách dịch"},{"k":"D","t":"Tư tưởng Bệnh tư túng chia rẽ"},{"k":"E","t":"Trình độ dân trí chưa thật sự cao"}],"dung":["C"],"gt":"Tài liệu chỉ rõ: \"Thế là bệnh quan liêu đã ấp ủ, dung túng, che chở cho nạn tham ô, lãng phí. Vì vậy, đây là bệnh gốc sinh ra các bệnh tham ô lãng phí; muốn trừ sạch bệnh tham ô, lãng phí thì trước hết phải tẩy sạch bệnh quan liêu.\" Điều này nhấn mạnh vai trò trung tâm của bệnh quan liêu trong việc tạo điều kiện cho các tiêu cực khác phát triển."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG ĐÚNG với quan điểm của Hồ Chí Minh về tính nhân văn của pháp luật trong Nhà nước pháp quyền nhân nghĩa?","goiy":"Tài liệu mô tả sâu sắc các đặc điểm của pháp luật nhân văn và khuyến thiện.","pa":[{"k":"A","t":"Pháp luật có tính khuyến thiện lấy mục đích giáo dục làm căn bản"},{"k":"B","t":"Pháp luật phải ghi nhận đầy đủ bảo vệ quyền con người triệt để"},{"k":"C","t":"Pháp luật có tính nghiêm minh nhưng khách quan chống xử dã man"},{"k":"D","t":"Pháp luật dựa trên nền tảng đạo đức các giá trị thấm sâu quy định"},{"k":"E","t":"Pháp luật cho phép áp dụng hình phạt tàn sát với kẻ phản bội dân"}],"dung":["E"],"gt":"Tài liệu nêu rõ rằng tính nhân văn của hệ thống luật pháp thể hiện ở việc \"tuyệt đối chống đối xử với con người một cách dã man.\" Thậm chí đối với những kẻ phản bội Tổ quốc, Hồ Chí Minh tuyên bố rõ: \"Chính phủ Việt Nam sẽ tha thứ hay trừng trị họ theo luật pháp tùy theo thái độ của họ hiện nay và về sau. Nhưng sẽ không có ai bị tàn sát\". Do đó, phương án E là sai hoàn toàn với tư tưởng Hồ Chí Minh."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Trong các biện pháp phòng, chống tiêu cực trong bộ máy nhà nước theo tư tưởng Hồ Chí Minh, biện pháp nào sau đây KHÔNG được coi là giải pháp căn bản và có ý nghĩa lâu dài?","goiy":"Tài liệu liệt kê và nhấn mạnh tầm quan trọng của các biện pháp phòng chống tiêu cực.","pa":[{"k":"A","t":"Nâng cao trình độ dân chủ xã hội và thực hành dân chủ rộng rãi"},{"k":"B","t":"Phát huy quyền làm chủ nhân dân một cách vô cùng triệt để tự giác"},{"k":"C","t":"Chỉ tập trung xử phạt thật nặng tiêu cực không chú trọng giáo dục"},{"k":"D","t":"Pháp luật Nhà nước và kỷ luật của Đảng phải hết sức nghiêm minh"},{"k":"E","t":"Giáo dục đạo đức xây dựng hệ chuẩn mực đạo đức khơi dậy lương tâm"}],"dung":["C"],"gt":"Tài liệu khẳng định \"nâng cao trình độ dân chủ trong xã hội, thực hành dân chủ rộng rãi, phát huy quyền làm chủ của nhân dân là giải pháp căn bản và có ý nghĩa lâu dài.\" Tài liệu cũng chỉ rõ: \"phạt nghiêm minh, nghiêm khắc, đúng người đúng tội là cần thiết, song việc gì cũng xử phạt thì lại không đúng. Cần coi trọng giáo dục, lấy giáo dục, cảm hóa làm chủ yếu.\" Do đó, phương án C với sự nhấn mạnh chỉ xử phạt nặng mà không chú trọng giáo dục là không phù hợp với tư tưởng của Người."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Điều nào sau đây KHÔNG phải là một biểu hiện của bệnh quan liêu theo nhận định của Hồ Chí Minh?","goiy":"Tài liệu mô tả các biểu hiện của bệnh quan liêu.","pa":[{"k":"A","t":"Cán bộ lãnh đạo không sát việc thực tế không giáo dục cấp dưới"},{"k":"B","t":"Cơ quan lãnh đạo trọng hình thức không xem xét khắp mọi mặt"},{"k":"C","t":"Chỉ biết họp hành viết chỉ thị xem báo cáo trên giấy không kiểm tra"},{"k":"D","t":"Cố ý vơ vét tiền của công lợi dụng chức quyền làm lợi riêng tư"},{"k":"E","t":"Cán bộ không gần gũi quần chúng không nắm bắt tâm tư nguyện vọng"}],"dung":["D"],"gt":"Tài liệu mô tả các biểu hiện của bệnh quan liêu bao gồm các ý A, B, C, E. Phương án D \"Cố ý vơ vét tiền của công, lợi dụng chức quyền để làm lợi riêng cho cá nhân\" là biểu hiện của \"đặc quyền, đặc lợi\" hoặc \"tham ô\" được đề cập ở tài liệu, không phải là biểu hiện trực tiếp của bệnh quan liêu, mặc dù bệnh quan liêu có thể tạo điều kiện cho tham ô, lãng phí phát triển."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nội dung nào sau đây KHÔNG phản ánh đúng một trong những đóng góp của Hồ Chí Minh trong công tác lập pháp của Nhà nước Việt Nam Dân chủ Cộng hòa?","goiy":"Tài liệu liệt kê các hoạt động lập pháp và các sắc lệnh hình sự của Hồ Chí Minh.","pa":[{"k":"A","t":"Hai lần tham gia lãnh đạo soạn thảo Hiến pháp năm 1946 và năm 1959"},{"k":"B","t":"Ký lệnh công bố 16 đạo luật trong bối cảnh vừa kháng chiến kiến quốc"},{"k":"C","t":"Ký lệnh công bố 613 sắc lệnh trong đó có 243 sắc lệnh tổ chức bộ máy"},{"k":"D","t":"Ban hành ngay Sắc lệnh án tử hình tội tham ô chỉ vài ngày sau Tuyên ngôn"},{"k":"E","t":"Chú trọng xây dựng hệ thống luật pháp dân chủ hiện đại ngay từ đầu"}],"dung":["D"],"gt":"Tài liệu xác nhận các hoạt động lập pháp của Hồ Chí Minh như A, B, C, E. Tuy nhiên, Sắc lệnh ấn định hình phạt tội đưa và nhận hối lộ được ký vào ngày 27/11/1946, và Lệnh nói rõ tội tham ô, trộm cắp đến mức cao nhất là tử hình được ký vào ngày 26/1/1946. Việc này diễn ra sau Tuyên ngôn Độc lập một khoảng thời gian đáng kể, không phải \"chỉ vài ngày sau\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo tư tưởng Hồ Chí Minh, những quyền nào sau đây được xem là thuộc phạm vi \"quyền con người\" mà Nhà nước pháp quyền nhân nghĩa cần tôn trọng và bảo đảm thực hiện một cách toàn diện?","goiy":"Tài liệu liệt kê các khía cạnh tiếp cận quyền con người của Hồ Chí Minh (Lưu ý: Có thể chọn nhiều phương án đúng).","pa":[{"k":"A","t":"Quyền tự nhiên của con người bao gồm quyền sống tối cao"},{"k":"B","t":"Các quyền chính trị và dân sự cơ bản của mỗi người dân"},{"k":"C","t":"Các quyền kinh tế và văn hóa xã hội thiết thực toàn dân"},{"k":"D","t":"Quyền của nhóm cụ thể như phụ nữ trẻ em dân tộc thiểu số"},{"k":"E","t":"Quyền được hưởng đặc lợi miễn trừ trách nhiệm nhà nước"}],"dung":["A","B","C","D"],"gt":"Tài liệu nêu rõ Hồ Chí Minh tiếp cận quyền con người một cách toàn diện, bao gồm \"các quyền tự nhiên của con người, trong đó quyền cao nhất là quyền sống cũng như các quyền chính trị - dân sự, quyền kinh tế, văn hóa, xã hội con người. Người chú trọng quyền của công dân nói chung, đồng thời cũng chú trọng đến quyền của những nhóm người cụ thể như phụ nữ, trẻ em, người dân tộc thiểu số\". Phương án E là trái ngược với tinh thần pháp quyền và phòng chống tiêu cực."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Để phòng ngừa và khắc phục tiêu cực trong bộ máy nhà nước, Hồ Chí Minh đã đề xuất những biện pháp cơ bản nào sau đây mang tính chiến lược và lâu dài?","goiy":"Tài liệu tổng hợp các biện pháp cơ bản để phòng, chống tiêu cực (Lưu ý: Có thể chọn nhiều phương án đúng).","pa":[{"k":"A","t":"Nâng cao trình độ dân chủ xã hội và thực hành dân chủ rộng rãi"},{"k":"B","t":"Đảm bảo pháp luật Nhà nước và kỷ luật Đảng phải hết sức nghiêm minh"},{"k":"C","t":"Coi trọng giáo dục cảm hóa thức tỉnh con người làm giải pháp chính"},{"k":"D","t":"Cán bộ giữ chức vụ càng cao càng phải đi trước làm gương đạo đức"},{"k":"E","t":"Chỉ dựa duy nhất vào sức mạnh bộ máy kiểm tra giám sát nội bộ"}],"dung":["A","B","C","D"],"gt":"Các tài liệu liệt kê các biện pháp: \"nâng cao trình độ dân chủ trong xã hội, thực hành dân chủ rộng rãi, phát huy quyền làm chủ của nhân dân là giải pháp căn bản và có ý nghĩa lâu dài\"; \"pháp luật của Nhà nước, kỷ luật của Đảng phải nghiêm minh\", \"thẳng tay trừng trị\", \"không có bất cứ vùng cấm nào\"; \"Cần coi trọng giáo dục, lấy giáo dục, cảm hóa làm chủ yếu\"; và \"cán bộ phải đi trước làm gương, cán bộ giữ chức vụ càng cao, trách nhiệm nêu gương càng lớn\". Phương án E là chưa đủ, vì tài liệu cũng nhấn mạnh vai trò kiểm soát của nhân dân."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Trong tư tưởng Hồ Chí Minh về kiểm soát quyền lực nhà nước, những chủ thể nào sau đây được xác định có vai trò và trách nhiệm trong việc kiểm soát quyền lực nhà nước?","goiy":"Tài liệu đề cập đến các hình thức và chủ thể kiểm soát quyền lực (Lưu ý: Có thể chọn nhiều phương án đúng).","pa":[{"k":"A","t":"Đảng Cộng sản Việt Nam với tư cách là Đảng cầm quyền lãnh đạo"},{"k":"B","t":"Nhân dân Việt Nam với tư cách chủ thể tối cao của quyền lực"},{"k":"C","t":"Nghị viện nhân dân với quyền kiểm soát và phê bình Chính phủ"},{"k":"D","t":"Các cơ quan hành pháp của Nhà nước tự kiểm soát lẫn nhau"},{"k":"E","t":"Các tổ chức quốc tế và các cơ quan ngoại giao nước ngoài"}],"dung":["A","B","C"],"gt":"Tài liệu nêu rõ vai trò kiểm soát của Đảng Cộng sản Việt Nam. Tài liệu khẳng định nhân dân là chủ thể tối cao của quyền lực nhà nước và có quyền kiểm soát. Tài liệu cũng đề cập đến kiểm soát của Nghị viện nhân dân đối với Chính phủ, như quyền \"Kiểm soát và phê bình Chính phủ\". Các cơ quan hành pháp chủ yếu là đối tượng của kiểm soát quyền lực hơn là chủ thể kiểm soát quyền lực tổng thể, và các tổ chức quốc tế không được đề cập trong tài liệu."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, những nguyên nhân khách quan nào sau đây có thể dẫn đến sự nảy sinh và phát triển của các tiêu cực trong bộ máy nhà nước?","goiy":"Tài liệu phân loại và liệt kê các nguyên nhân khách quan và chủ quan của tiêu cực (Lưu ý: Có thể chọn nhiều phương án đúng).","pa":[{"k":"A","t":"Sự thiếu tu dưỡng rèn luyện đạo đức của bản thân mỗi cán bộ"},{"k":"B","t":"Công tác cán bộ của Đảng và Nhà nước chưa được thực hiện tốt"},{"k":"C","t":"Tàn dư của các chính sách phản động từ chế độ thực dân phong kiến"},{"k":"D","t":"Âm mưu chống phá và hoạt động phá hoại của các thế lực thù địch"},{"k":"E","t":"Cách tổ chức vận hành trong Đảng và Nhà nước chưa thực sự khoa học"}],"dung":["B","C","D","E"],"gt":"Tài liệu liệt kê các nguyên nhân khách quan bao gồm \"công tác cán bộ của Đảng và Nhà nước chưa tốt; do cách tổ chức, vận hành trong Đảng, trong Nhà nước, sự phối hợp giữa Đảng với Nhà nước chưa thật sự khoa học, hiệu quả; do trình độ phát triển còn thấp của đời sống xã hội; do tàn dư của những chính sách phản động của chế độ thực dân, phong kiến; do âm mưu chống phá của các lực lượng phản động\". Phương án A \"Sự thiếu tu dưỡng, rèn luyện của bản thân cán bộ\" được xác định là nguyên nhân chủ quan, bắt tài liệu từ \"bệnh mẹ\" chủ nghĩa cá nhân."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh luôn nêu cao tính nghiêm minh của pháp luật. Người tuyên bố: “Pháp luật Việt Nam tuy khoan hồng với những người biết cải tà quy chính, nhưng sẽ thẳng tay trừng trị những tên Việt gian đầu sỏ đã ______.”","goiy":"Tài liệu là đoạn trích dẫn trực tiếp từ lời của Hồ Chí Minh.","pa":[{"k":"A","t":"lạm quyền gây mất đoàn kết nội bộ"},{"k":"B","t":"bán nước buôn dân gây hại nhân dân"},{"k":"C","t":"tham ô lãng phí nghiêm trọng công quỹ"},{"k":"D","t":"cậy thế cậy quyền hách dịch với nhân"},{"k":"E","t":"kiêu ngạo quan cách mạng với quần chúng"}],"dung":["B"],"gt":"Tài liệu trích lời Hồ Chí Minh: \"Pháp luật Việt Nam tuy khoan hồng với những người biết cải tà quy chính, nhưng sẽ thẳng tay trừng trị những tên Việt gian đầu sỏ đã bán nước buôn dân\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Để đảm bảo tất cả mọi quyền lực thuộc về nhân dân, Hồ Chí Minh chỉ rõ: “dân ghét các ông chủ tịch, các ông ủy viên vì cái tật ngông nghênh, cậy thế, cậy quyền. Những ông này không hiểu nhiệm vụ và chính sách của Việt Minh, nên khi nắm được chút quyền trong tay vẫn hay ______.”","goiy":"Tài liệu là đoạn trích dẫn trực tiếp từ lời của Hồ Chí Minh.","pa":[{"k":"A","t":"vi phạm kỷ luật khắt khe của Đảng"},{"k":"B","t":"làm việc kém hiệu quả trong công tác"},{"k":"C","t":"lãng phí công quỹ tài sản nhà nước"},{"k":"D","t":"lạm dụng quyền lực nhân dân giao cho"},{"k":"E","t":"tư túng bè phái cục bộ địa phương"}],"dung":["D"],"gt":"Tài liệu trích lời Hồ Chí Minh: \"dân ghét các ông chủ tịch, các ông ủy viên vì cái tật ngông nghênh, cậy thế, cậy quyền. Những ông này không hiểu nhiệm vụ và chính sách của Việt Minh, nên khi nắm được chút quyền trong tay vẫn hay lạm dụng\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh khẳng định, Nhà nước là công bộc của dân, “mọi công tác phải dựa hẳn vào quần chúng, hoan nghênh quần chúng _______.”","goiy":"Tài liệu là đoạn trích dẫn trực tiếp từ lời của Hồ Chí Minh.","pa":[{"k":"A","t":"góp ý xây dựng chính sách pháp luật"},{"k":"B","t":"làm chủ các cấp chính quyền nhà nước"},{"k":"C","t":"đôn đốc và kiểm tra công tác bộ máy"},{"k":"D","t":"phê bình và biểu quyết các quyết định"},{"k":"E","t":"tham gia vào quản lý nhà nước xã hội"}],"dung":["C"],"gt":"Tài liệu trích lời Hồ Chí Minh: \"mọi công tác phải dựa hẳn vào quần chúng, hoan nghênh quần chúng đôn đốc và kiểm tra\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, cán bộ các cơ quan, các đoàn thể, cấp cao thì quyền to, cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu ______ là có dịp đục khoét, có dịp ăn của đút, có dịp “dĩ công vi tư’’ (lấy của công làm của tư).","goiy":"Tài liệu là đoạn trích dẫn trực tiếp từ lời của Hồ Chí Minh.","pa":[{"k":"A","t":"kinh nghiệm thực tế trong công tác"},{"k":"B","t":"trình độ chuyên môn nghiệp vụ sâu"},{"k":"C","t":"lương tâm đạo đức của con người"},{"k":"D","t":"sự giám sát chặt chẽ từ phía dân"},{"k":"E","t":"lòng trung thành tuyệt đối với Đảng"}],"dung":["C"],"gt":"Tài liệu trích lời Hồ Chí Minh: \"cán bộ các cơ quan, các đoàn thể, cấp cao thì quyền to, cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu lương tâm là có dịp đục khoét, có dịp ăn của đút, có dịp “dĩ công vi tư’’\"."}]},{"ma":"11","ten":"Vai trò và lực lượng đại đoàn kết","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Chính sách và phương pháp tập hợp đại đoàn kết luôn phải được giữ nguyên không thay đổi trong mọi giai đoạn cách mạng để đảm bảo tính nhất quán của chiến lược đại đoàn kết toàn dân tộc.","goiy":"Xem xét sự linh hoạt của chính sách và phương pháp trong các giai đoạn cách mạng khác nhau được đề cập trong tài liệu.","pa":[{"k":"A","t":"Khẳng định trên là ĐÚNG"},{"k":"B","t":"Khẳng định trên là SAI"}],"dung":["B"],"gt":"Tài liệu chỉ rõ: \"Trong mỗi giai đoạn cách mạng, trước những yêu cầu và nhiệm vụ khác nhau, chính sách và phương pháp tập hợp đại đoàn kết có thể và cần thiết phải điều chỉnh cho phù hợp với từng đối tượng khác nhau song không bao giờ được thay đổi chủ trương đại đoàn kết toàn dân tộc\". Điều này khẳng định chính sách và phương pháp có thể điều chỉnh, trái ngược với nhận định trong câu hỏi."},{"loai":"mot","dang":"Đúng hay sai","q":"Khái niệm \"Nhân dân\" trong tư tưởng Hồ Chí Minh chỉ đề cập đến tập hợp đông đảo quần chúng nhân dân mà không bao gồm những con người Việt Nam cụ thể.","goiy":"Tài liệu định nghĩa \"Nhân dân\" trong tư tưởng Hồ Chí Minh.","pa":[{"k":"A","t":"Khẳng định trên là ĐÚNG"},{"k":"B","t":"Khẳng định trên là SAI"}],"dung":["B"],"gt":"Tài liệu ghi rõ: \"“Nhân dân” trong tư tưởng Hồ Chí Minh được hiểu với nghĩa vừa là con người Việt Nam cụ thể, vừa là một tập hợp đông đảo quần chúng nhân dân, cả hai đều là chủ thể của khối đại đoàn kết toàn dân tộc\"."},{"loai":"mot","dang":"Đúng hay sai","q":"Theo Hồ Chí Minh, nền tảng của khối đại đoàn kết toàn dân tộc chỉ bao gồm công nhân và nông dân, bởi đây là lực lượng đại đa số và là gốc rễ của cách mạng.","goiy":"Tài liệu liệt kê cụ thể các lực lượng cấu thành nền tảng của đại đoàn kết.","pa":[{"k":"A","t":"Khẳng định trên là ĐÚNG"},{"k":"B","t":"Khẳng định trên là SAI"}],"dung":["B"],"gt":"Tài liệu chỉ rõ: \"lực lượng làm nền tảng cho khối đại đoàn kết dân tộc theo quan điểm của Hồ Chí Minh là công nhân, nông dân và trí thức.\""},{"loai":"mot","dang":"Đúng hay sai","q":"Việc xác định đại đoàn kết toàn dân tộc là nhiệm vụ hàng đầu của Đảng chỉ cần quán triệt trong các đường lối, chủ trương chiến lược mà không nhất thiết phải trong hoạt động thực tiễn của Đảng.","goiy":"Tài liệu nói về sự quán triệt nhiệm vụ hàng đầu trong các lĩnh vực của Đảng.","pa":[{"k":"A","t":"Khẳng định trên là ĐÚNG"},{"k":"B","t":"Khẳng định trên là SAI"}],"dung":["B"],"gt":"Tài liệu khẳng định: \"Đại đoàn kết toàn dân tộc phải được xác định là nhiệm vụ hàng đầu của Đảng và nhiệm vụ này phải được quán triệt trong tất cả mọi lĩnh vực, từ đường lối, chủ trương, chính sách, tới hoạt động thực tiễn của Đảng.\""},{"loai":"mot","dang":"Đúng hay sai","q":"Các luận điểm của Hồ Chí Minh như \"Đoàn kết là sức mạnh của chúng ta\" chủ yếu nhằm kêu gọi tinh thần đoàn kết mà không mang tính chân lý khái quát từ thực tiễn.","goiy":"Tài liệu mô tả bản chất của các luận điểm về đại đoàn kết của Hồ Chí Minh.","pa":[{"k":"A","t":"Khẳng định trên là ĐÚNG"},{"k":"B","t":"Khẳng định trên là SAI"}],"dung":["B"],"gt":"Tài liệu nêu: \"Từ thực tiễn xây dựng khối đại đoàn kết toàn dân tộc, Hồ Chí Minh đã khái quát thành nhiều luận điểm mang tính chân lý về vai trò và sức mạnh của khối đại đoàn kết toàn dân tộc\"."},{"loai":"mot","dang":"Đúng hay sai","q":"Sự đoàn kết và thống nhất trong Đảng là yếu tố quan trọng nhưng không phải là điều kiện tiên quyết cho sự đoàn kết ngoài xã hội.","goiy":"Tài liệu nhấn mạnh vai trò của sự đoàn kết trong Đảng đối với đại đoàn kết toàn dân tộc.","pa":[{"k":"A","t":"Khẳng định trên là ĐÚNG"},{"k":"B","t":"Khẳng định trên là SAI"}],"dung":["B"],"gt":"Tài liệu nhấn mạnh: \"Trong khối đại đoàn kết toàn dân tộc, phải đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong Đảng vì đó là điều kiện cho sự đoàn kết ngoài xã hội.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Điểm nào sau đây thể hiện rõ nhất tính linh hoạt nhưng kiên định trong chiến lược đại đoàn kết toàn dân tộc của Hồ Chí Minh?","goiy":"Tài liệu phân tích về sự điều chỉnh và bất biến trong chiến lược đại đoàn kết toàn dân tộc.","pa":[{"k":"A","t":"Chính sách và phương pháp tập hợp luôn giữ nguyên cố định để bảo đảm tính nhất quán."},{"k":"B","t":"Chủ trương đại đoàn kết có thể tự do điều chỉnh linh hoạt theo từng đối tượng và giai đoạn."},{"k":"C","t":"Chỉ điều chỉnh chính sách và phương pháp khi có sự thay đổi lớn về mục tiêu cách mạng."},{"k":"D","t":"Chính sách và phương pháp có thể điều chỉnh linh hoạt, nhưng chủ trương đại đoàn kết không thay đổi."},{"k":"E","t":"Tính linh hoạt vốn dĩ không phải là đặc điểm cốt lõi quan trọng của chiến lược đại đoàn kết."}],"dung":["D"],"gt":"Tài liệu chỉ rõ: \"Trong mỗi giai đoạn cách mạng, trước những yêu cầu và nhiệm vụ khác nhau, chính sách và phương pháp tập hợp đại đoàn kết có thể và cần thiết phải điều chỉnh cho phù hợp với từng đối tượng khác nhau song không bao giờ được thay đổi chủ trương đại đoàn kết toàn dân tộc\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Luận điểm nào sau đây được Hồ Chí Minh đúc kết mang tính chân lý về vai trò của đại đoàn kết toàn dân tộc, được coi là kết luận tối cao của Người?","goiy":"Tài liệu liệt kê các luận điểm mang tính chân lý và kết luận cuối cùng của Hồ Chí Minh.","pa":[{"k":"A","t":"Luận điểm \"Đoàn kết chính là điểm khởi đầu quan trọng cho mọi thành công cách mạng\""},{"k":"B","t":"Luận điểm \"Đoàn kết, đoàn kết, đại đoàn kết. Thành công, thành công, đại thành công\""},{"k":"C","t":"Luận điểm \"Đoàn kết chính là cơ sở hạ tầng vững chắc nhất để phát triển đất nước\""},{"k":"D","t":"Luận điểm \"Đoàn kết dân tộc là nền tảng cốt lõi của sự tự do nhân dân Việt Nam\""},{"k":"E","t":"Luận điểm \"Đoàn kết chính là con đường duy nhất đúng đắn dẫn đến thắng lợi lớn\""}],"dung":["B"],"gt":"Tài liệu kết luận: “Đoàn kết, đoàn kết, đại đoàn kết. Thành công, thành công, đại thành công”. Các phương án khác không phải là nguyên văn hoặc đúc kết trực tiếp từ tài liệu."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Từ \"ta\" trong câu nói của Hồ Chí Minh: \"ai có tài, có đức, có sức, có lòng phụng sự Tổ quốc và phục vụ nhân dân thì ta đoàn kết với họ\" được hiểu theo nghĩa rộng nhất là:","goiy":"Tài liệu giải thích về chủ thể của \"ta\" trong tư tưởng Hồ Chí Minh.","pa":[{"k":"A","t":"Chỉ đại diện duy nhất cho tổ chức Đảng Cộng sản Việt Nam lãnh đạo."},{"k":"B","t":"Chỉ đại diện chung cho toàn thể các tầng lớp nhân dân lao động Việt Nam."},{"k":"C","t":"Chỉ đại diện cho những người dân Việt Nam hiện đang sống ở trong nước."},{"k":"D","t":"Đảng Cộng sản Việt Nam nói riêng và mọi người dân Việt Nam nói chung."},{"k":"E","t":"Chỉ đại diện cho những cá nhân giữ vai trò lãnh đạo quản lý then chốt."}],"dung":["D"],"gt":"Tài liệu giải thích: \"Từ “ta” ở đây là chủ thể, vừa là Đảng Cộng sản Việt Nam nói riêng, vừa là mọi người dân Việt Nam nói chung.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Nhiệm vụ cốt lõi của Đảng Cộng sản Việt Nam trong việc xây dựng khối đại đoàn kết toàn dân tộc, xuất phát từ yêu cầu khách quan của quần chúng, là gì?","goiy":"Tài liệu nói về sứ mệnh của Đảng trong mối quan hệ với quần chúng và đại đoàn kết.","pa":[{"k":"A","t":"Đơn thuần ban hành các chủ trương, chính sách rồi để nhân dân tự thực hiện."},{"k":"B","t":"Bị động đợi chờ quần chúng nhân dân tự giác tập hợp thành khối thống nhất."},{"k":"C","t":"Thức tỉnh, tập hợp, hướng dẫn quần chúng, chuyển đòi hỏi tự giác thành hiện thực."},{"k":"D","t":"Tách rời nhu cầu cá nhân của quần chúng ra khỏi mục tiêu chung của cách mạng."},{"k":"E","t":"Chỉ tập trung vào công tác củng cố sự đoàn kết nội bộ trong bộ máy lãnh đạo."}],"dung":["C"],"gt":"Tài liệu chỉ rõ: \"Đảng Cộng sản phải có sứ mệnh thức tỉnh, tập hợp, hướng dẫn quần chúng, chuyển những nhu cầu, những đòi hỏi tự giác, thành hiện thực có tổ chức trong khối đại đoàn kết, tạo thành sức mạnh tổng hợp trong cuộc đấu tranh\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Bài học lịch sử nào được Hồ Chí Minh rút ra để khẳng định vai trò sống còn của đại đoàn kết toàn dân tộc đối với độc lập, tự do của đất nước?","goiy":"Tài liệu trích dẫn nguyên văn lời của Hồ Chí Minh về bài học lịch sử.","pa":[{"k":"A","t":"Trích câu nói \"Dân ta anh hùng, bất khuất thì nước ta nhất định sẽ vô cùng hùng cường.\""},{"k":"B","t":"Trích câu nói \"Lúc nào dân ta đoàn kết muôn đời như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn.\""},{"k":"C","t":"Trích câu nói \"Ý chí thống nhất của toàn thể nhân dân chính là sức mạnh của đất nước.\""},{"k":"D","t":"Trích câu nói \"Độc lập, tự do chính là mục tiêu tối thượng cao nhất của sự đoàn kết.\""},{"k":"E","t":"Trích câu nói \"Lịch sử chứng minh rằng không có đoàn kết thì không có cách mạng thành công.\""}],"dung":["B"],"gt":"Tài liệu trích lời Hồ Chí Minh: “Sử dạy cho ta bài học này: Lúc nào dân ta đoàn kết muôn đời như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Mối quan hệ giữa sự đoàn kết trong Đảng và sự đoàn kết toàn dân tộc được Hồ Chí Minh lý giải như thế nào?","goiy":"Tài liệu nói về yếu tố \"hạt nhân\" và điều kiện của đại đoàn kết.","pa":[{"k":"A","t":"Sự đoàn kết trong Đảng là điều kiện cần nhưng chưa đủ cho sự đoàn kết ngoài xã hội."},{"k":"B","t":"Sự đoàn kết trong Đảng chỉ là một trong nhiều yếu tố thúc đẩy đoàn kết toàn dân."},{"k":"C","t":"Sự đoàn kết trong Đảng là yếu tố \"hạt nhân\", là điều kiện cho sự đoàn kết ngoài xã hội."},{"k":"D","t":"Sự đoàn kết toàn dân sẽ tự hình thành nếu có đường lối đúng, không phụ thuộc nội bộ."},{"k":"E","t":"Hai yếu tố này song song tồn tại độc lập mà không có mối liên hệ nhân quả trực tiếp."}],"dung":["C"],"gt":"Tài liệu khẳng định: \"Trong khối đại đoàn kết toàn dân tộc, phải đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong Đảng vì đó là điều kiện cho sự đoàn kết ngoài xã hội.\""},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phát biểu nào sau đây KHÔNG ĐÚNG về chiến lược đại đoàn kết toàn dân tộc trong tư tưởng Hồ Chí Minh?","goiy":"Tài liệu mô tả các đặc điểm của chiến lược đại đoàn kết.","pa":[{"k":"A","t":"Là chiến lược lâu dài, nhất quán xuyên suốt toàn bộ quá trình cách mạng Việt Nam."},{"k":"B","t":"Mang tính chất quyết định sự sống còn của dân tộc Việt Nam qua mọi thời kỳ."},{"k":"C","t":"Chỉ được duy trì trong cách mạng dân tộc dân chủ nhân dân, không áp dụng cho XHCN."},{"k":"D","t":"Là nhân tố có ý nghĩa quyết định trực tiếp tới sự thành bại của sự nghiệp cách mạng."},{"k":"E","t":"Chính sách và phương pháp có thể điều chỉnh linh hoạt phù hợp với từng đối tượng."}],"dung":["C"],"gt":"Tài liệu khẳng định: \"chiến lược này được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\" Do đó, nhận định chỉ duy trì trong một giai đoạn là sai."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Theo tư tưởng Hồ Chí Minh, chủ thể của khối đại đoàn kết toàn dân tộc KHÔNG BAO GỒM nhóm đối tượng nào sau đây?","goiy":"Tài liệu mô tả tiêu chí tập hợp lực lượng của khối đại đoàn kết.","pa":[{"k":"A","t":"Tất cả những người Việt Nam yêu nước ở các giai cấp, các tầng lớp trong xã hội."},{"k":"B","t":"Đồng bào các tôn giáo, các đảng phái yêu nước chân chính trong khối đoàn kết."},{"k":"C","t":"Những người Việt Nam có lòng trung thành với Tổ quốc nhưng KHÔNG sẵn sàng phục vụ nhân dân."},{"k":"D","t":"Mọi người dân vào một khối thống nhất, không phân biệt dân tộc, tầng lớp, giới tính."},{"k":"E","t":"Cả những người Việt Nam ở trong nước hay ở ngoài nước cùng hướng vào mục tiêu chung."}],"dung":["C"],"gt":"Tài liệu nêu tiêu chí \"ai có tài, có đức, có sức, có lòng phụng sự Tổ quốc và phục vụ nhân dân thì ta đoàn kết với họ\". Tài liệu bổ sung \"miễn là họ có lòng trung thành và sẵn sàng phục vụ Tổ quốc, không phản bội lại quyền lợi của nhân dân\". Do đó, \"không sẵn sàng phục vụ nhân dân\" là không phù hợp với tiêu chí đoàn kết."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG ĐÚNG khi nói về đại đoàn kết toàn dân tộc là một mục tiêu, nhiệm vụ hàng đầu của cách mạng Việt Nam?","goiy":"Tài liệu nói về đại đoàn kết là mục tiêu, nhiệm vụ và vai trò của Đảng.","pa":[{"k":"A","t":"Đại đoàn kết không chỉ là khẩu hiệu chiến lược mà còn là mục tiêu lâu dài của cách mạng."},{"k":"B","t":"Là nhiệm vụ hàng đầu của Đảng, quán triệt trong đường lối, chủ trương và thực tiễn."},{"k":"C","t":"Mục đích của Đảng Lao động Việt Nam tóm gọn 8 chữ: \"ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC\"."},{"k":"D","t":"Đại đoàn kết là yêu cầu tự phát từ quần chúng mà không cần vai trò thức tỉnh của Đảng."},{"k":"E","t":"Đại đoàn kết là đòi hỏi khách quan của quần chúng nhân dân trong cuộc đấu tranh tự giải phóng."}],"dung":["D"],"gt":"Tài liệu nêu rõ: \"Đại đoàn kết là yêu cầu khách quan của sự nghiệp cách mạng và là đòi hỏi khách quan của quần chúng nhân dân trong cuộc đấu tranh tự giải phóng... Đảng Cộng sản phải có sứ mệnh thức tỉnh, tập hợp, hướng dẫn quần chúng\". Điều này bác bỏ ý \"không cần vai trò thức tỉnh, tập hợp của Đảng\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Câu nói nào dưới đây KHÔNG PHẢI là luận điểm mang tính chân lý của Hồ Chí Minh về vai trò và sức mạnh của khối đại đoàn kết toàn dân tộc được trích dẫn trong tài liệu?","goiy":"Tài liệu liệt kê chính xác các câu nói của Hồ Chí Minh.","pa":[{"k":"A","t":"Trích nguyên văn câu: \"Đoàn kết là sức mạnh của chúng ta\"."},{"k":"B","t":"Trích nguyên văn câu: \"Đoàn kết là một lực lượng vô địch của chúng ta để khắc phục khó khăn, giành lấy thắng lợi\"."},{"k":"C","t":"Trích nguyên văn câu: \"Đoàn kết là sức mạnh, đoàn kết là thắng lợi\"."},{"k":"D","t":"Trích nguyên văn câu: \"Đoàn kết là then chốt của thành công, là ngọn cờ dẫn lối thắng lợi.\""},{"k":"E","t":"Trích nguyên văn câu: \"Bây giờ còn một điểm rất quan trọng, cũng là điểm mẹ... Đó là đoàn kết\"."}],"dung":["D"],"gt":"Tài liệu liệt kê các câu: \"Đoàn kết là sức mạnh của chúng ta\", \"Đoàn kết là một lực lượng vô địch của chúng ta để khắc phục khó khăn, giành lấy thắng lợi\", \"Đoàn kết là sức mạnh, đoàn kết là thắng lợi\", \"Đoàn kết là sức mạnh, là then chốt của thành công\", \"Bây giờ còn một điểm rất quan trọng, cũng là điểm mẹ... Đó là đoàn kết\". Phương án D có thêm cụm \"là ngọn cờ dẫn lối thắng lợi\" không có trong tài liệu."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Để xây dựng khối đại đoàn kết toàn dân tộc vững chắc, cần phải thực hiện điều nào sau đây là KHÔNG PHÙ HỢP với tư tưởng Hồ Chí Minh?","goiy":"Tài liệu nói về nền tảng và cách thức xây dựng nền tảng của đại đoàn kết.","pa":[{"k":"A","t":"Xác định rõ nền tảng của khối đoàn kết là công nhân, nông dân và trí thức."},{"k":"B","t":"Trước hết phải ưu tiên đoàn kết đại đa số quần chúng nhân dân lao động."},{"k":"C","t":"Củng cố vững chắc nền tảng công nhân, nông dân và trí thức để mở rộng khối đại đoàn kết."},{"k":"D","t":"Ưu tiên đoàn kết các tầng lớp trí thức và đảng phái trước khi tập hợp quần chúng lao động."},{"k":"E","t":"Xem công nhân, nông dân và các tầng lớp nhân dân lao động khác là nền gốc của đại đoàn kết."}],"dung":["D"],"gt":"Tài liệu nhấn mạnh: \"Đại đoàn kết tức là trước hết phải đoàn kết đại đa số nhân dân, mà đại đa số nhân dân là công nhân, nông dân và các tầng lớp nhân dân lao động khác. Đó là nền gốc của đại đoàn kết\". Việc \"ưu tiên đoàn kết các tầng lớp trí thức và đảng phái trước\" là đi ngược lại nguyên tắc \"trước hết phải đoàn kết đại đa số nhân dân\"."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Khi xây dựng khối đại đoàn kết toàn dân tộc, Hồ Chí Minh chỉ rõ Đảng Cộng sản Việt Nam cần đứng vững trên lập trường nào để tập hợp lực lượng một cách toàn diện?","goiy":"Tài liệu nói về lập trường cần đứng vững khi xây dựng đại đoàn kết.","pa":[{"k":"A","t":"Lập trường dân tộc thuần túy, chỉ ưu tiên lợi ích dân tộc trên hết mà bỏ qua giai cấp."},{"k":"B","t":"Lập trường giai cấp công nhân, giải quyết hài hòa mối quan hệ giữa giai cấp và dân tộc."},{"k":"C","t":"Lập trường quốc tế vô sản thuần túy, bỏ qua các yếu tố giai cấp đặc thù trong nước."},{"k":"D","t":"Lập trường tôn giáo thuần túy, nhằm tập trung thu hút sự ủng hộ của các tín đồ."},{"k":"E","t":"Lập trường trung lập hoàn toàn, không đứng về phía bất kỳ giai cấp tầng lớp nào."}],"dung":["B"],"gt":"Tài liệu ghi rõ: \"Hồ Chí Minh còn chỉ rõ, trong quá trình xây dựng khối đại đoàn kết toàn dân tộc, phải đứng vững trên lập trường giai cấp công nhân, giải quyết hài hòa mối quan hệ giữa giai cấp, dân tộc để tập hợp lực lượng\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo tư tưởng Hồ Chí Minh, những nhận định nào sau đây là ĐÚNG về đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược? (Chọn tất cả các phương án đúng)","goiy":"Tài liệu mô tả ý nghĩa chiến lược của đại đoàn kết toàn dân tộc.","pa":[{"k":"A","t":"Là chiến lược lâu dài, nhất quán xuyên suốt của cách mạng Việt Nam."},{"k":"B","t":"Là nhân tố có ý nghĩa quyết định trực tiếp tới sự thành bại của cách mạng."},{"k":"C","t":"Được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng XHCN."},{"k":"D","t":"Chính sách và phương pháp tập hợp lực lượng tuyệt đối không bao giờ được điều chỉnh."},{"k":"E","t":"Chỉ có ý nghĩa chiến lược duy nhất trong giai đoạn đấu tranh giành độc lập dân tộc."}],"dung":["A","B","C"],"gt":"Tài liệu khẳng định A, B, C. D bị phủ nhận bởi \"có thể và cần thiết phải điều chỉnh\". E bị phủ nhận bởi \"được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, những điều nào sau đây là kết quả trực tiếp của khối đại đoàn kết toàn dân tộc? (Chọn tất cả các phương án đúng)","goiy":"Tài liệu nêu các vai trò và sức mạnh của đại đoàn kết.","pa":[{"k":"A","t":"Là sức mạnh vô địch của chúng ta để khắc phục khó khăn, giành lấy thắng lợi."},{"k":"B","t":"Quyết định đến sự độc lập, tự do chủ quyền của toàn thể đất nước."},{"k":"C","t":"Là nhân tố then chốt bảo đảm cho mọi sự thành công của cách mạng."},{"k":"D","t":"Luôn tự động dẫn đến sự phát triển kinh tế nhanh chóng trong mọi hoàn cảnh."},{"k":"E","t":"Luôn tự động loại trừ mọi mâu thuẫn xã hội phát sinh trong đời sống."}],"dung":["A","B","C"],"gt":"Tài liệu nêu A, C. Tài liệu nêu B: \"Lúc nào dân ta đoàn kết muôn đời như một thì nước ta độc lập, tự do.\" Các phương án D và E không được nhắc đến trong tài liệu và có tính tuyệt đối không phù hợp với thực tiễn."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo tư tưởng Hồ Chí Minh, \"Nhân dân\" trong chủ thể của khối đại đoàn kết toàn dân tộc bao gồm những đối tượng nào? (Chọn tất cả các phương án đúng)","goiy":"Tài liệu định nghĩa \"Nhân dân\" và liệt kê các thành phần của chủ thể đại đoàn kết.","pa":[{"k":"A","t":"Toàn thể nhân dân, tất cả những người Việt Nam yêu nước chân chính."},{"k":"B","t":"Các giai cấp, các tầng lớp trong xã hội, các ngành, các giới, các lứa tuổi, dân tộc, tôn giáo, đảng phái."},{"k":"C","t":"Những con người Việt Nam cụ thể sống trong cộng đồng dân tộc."},{"k":"D","t":"Tập hợp đông đảo quần chúng nhân dân rộng rãi."},{"k":"E","t":"Chỉ bao gồm những người có trình độ văn hóa cao và có địa vị trong xã hội."}],"dung":["A","B","C","D"],"gt":"Tài liệu giải thích: \"Chủ thể của khối đại đoàn kết toàn dân tộc, theo Hồ Chí Minh, bao gồm toàn thể nhân dân, tất cả những người Việt Nam yêu nước ở các giai cấp, các tầng lớp trong xã hội, các ngành, các giới, các lứa tuổi, các dân tộc, đồng bào các tôn giáo, các đảng phái, v.v… “Nhân dân” trong tư tưởng Hồ Chí Minh được hiểu với nghĩa vừa là con người Việt Nam cụ thể, vừa là một tập hợp đông đảo quần chúng nhân dân\". Phương án E là một hạn chế không có trong tư tưởng Hồ Chí Minh."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Việc xác định đại đoàn kết toàn dân tộc là mục tiêu, nhiệm vụ hàng đầu của cách mạng Việt Nam theo Hồ Chí Minh có ý nghĩa và yêu cầu gì? (Chọn tất cả các phương án đúng)","goiy":"Tài liệu nói về đại đoàn kết là mục tiêu và nhiệm vụ của cách mạng.","pa":[{"k":"A","t":"Phải được quán triệt trong tất cả mọi lĩnh vực hoạt động của Đảng."},{"k":"B","t":"Phải được quán triệt từ đường lối, chủ trương, chính sách."},{"k":"C","t":"Phải được quán triệt tới hoạt động thực tiễn hàng ngày của Đảng."},{"k":"D","t":"Là yêu cầu khách quan của sự nghiệp cách mạng dân tộc."},{"k":"E","t":"Chỉ là một khẩu hiệu chiến lược ngắn hạn chứ không phải mục tiêu lâu dài."}],"dung":["A","B","C","D"],"gt":"Tài liệu khẳng định A, B, C. Tài liệu khẳng định D. Tài liệu cũng nói \"đại đoàn kết không chỉ là khẩu hiệu chiến lược mà còn là mục tiêu lâu dài của cách mạng\", vậy E là sai."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, sứ mệnh của Đảng Cộng sản trong việc xây dựng khối đại đoàn kết là gì? (Chọn tất cả các phương án đúng)","goiy":"Tài liệu nói về sứ mệnh của Đảng Cộng sản trong việc xây dựng khối đại đoàn kết.","pa":[{"k":"A","t":"Thức tỉnh tinh thần cách mạng và lòng yêu nước của quần chúng."},{"k":"B","t":"Tập hợp quần chúng nhân dân thành khối thống nhất rộng lớn."},{"k":"C","t":"Hướng dẫn quần chúng nhân dân trong cuộc đấu tranh tự giải phóng."},{"k":"D","t":"Chuyển những nhu cầu, đòi hỏi tự giác thành hiện thực có tổ chức."},{"k":"E","t":"Loại bỏ hẳn những tầng lớp không trực tiếp thuộc khối công nông."}],"dung":["A","B","C","D"],"gt":"Tài liệu nêu rõ: \"Đảng Cộng sản phải có sứ mệnh thức tỉnh, tập hợp, hướng dẫn quần chúng, chuyển những nhu cầu, những đòi hỏi tự giác, thành hiện thực có tổ chức trong khối đại đoàn kết\". Phương án E đi ngược lại nguyên tắc tập hợp rộng rãi \"không bỏ sót một lực lượng nào\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Trong quá trình xây dựng khối đại đoàn kết toàn dân tộc, những tiêu chí nào sau đây cần được Đảng Cộng sản Việt Nam tuân thủ để tập hợp lực lượng một cách hiệu quả? (Chọn tất cả các phương án đúng)","goiy":"Tài liệu nêu các nguyên tắc và tiêu chí trong quá trình tập hợp lực lượng.","pa":[{"k":"A","t":"Đứng vững trên lập trường giai cấp công nhân Việt Nam."},{"k":"B","t":"Giải quyết hài hòa mối quan hệ giữa giai cấp và dân tộc."},{"k":"C","t":"Không bỏ sót một lực lượng nào miễn là họ có lòng trung thành và sẵn sàng phục vụ Tổ quốc."},{"k":"D","t":"Chấp nhận những lực lượng phản bội quyền lợi của nhân dân nếu họ có tài năng đặc biệt."},{"k":"E","t":"Chỉ tập trung vào các tầng lớp nhân dân ưu tú nhất của xã hội."}],"dung":["A","B","C"],"gt":"Tài liệu nêu A, B, C. Phương án D bị phủ nhận bởi yêu cầu \"không phản bội lại quyền lợi của nhân dân\". Phương án E đi ngược lại tinh thần tập hợp \"toàn thể nhân dân\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh khẳng định: \"Sử dạy cho ta bài học này: Lúc nào dân ta ______ muôn đời như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn\".","goiy":"Tài liệu trích dẫn bài học lịch sử của Hồ Chí Minh.","pa":[{"k":"A","t":"thương yêu"},{"k":"B","t":"tin tưởng"},{"k":"C","t":"đoàn kết"},{"k":"D","t":"giúp đỡ"},{"k":"E","t":"đồng lòng"}],"dung":["C"],"gt":"Tài liệu ghi rõ: “Sử dạy cho ta bài học này: Lúc nào dân ta đoàn kết muôn đời như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn”."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"\"Đại đoàn kết toàn dân tộc là vấn đề mang tính ______ của dân tộc Việt Nam nên chiến lược này được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\"","goiy":"Tài liệu nói về tầm quan trọng của chiến lược đại đoàn kết.","pa":[{"k":"A","t":"chiến lược"},{"k":"B","t":"cốt lõi"},{"k":"C","t":"sống còn"},{"k":"D","t":"cấp thiết"},{"k":"E","t":"cơ bản"}],"dung":["C"],"gt":"Tài liệu nêu: \"Đại đoàn kết toàn dân tộc là vấn đề mang tính sống còn của dân tộc Việt Nam nên chiến lược này được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Mục đích của Đảng Lao động Việt Nam, theo tuyên bố của Hồ Chí Minh vào ngày 3/3/1951, có thể gồm trong 8 chữ là: \"ĐOÀN KẾT TOÀN DÂN, ______ TỔ QUỐC\".","goiy":"Tài liệu trích dẫn tuyên bố của Hồ Chí Minh về mục đích của Đảng.","pa":[{"k":"A","t":"XÂY DỰNG"},{"k":"B","t":"PHỤNG SỰ"},{"k":"C","t":"BẢO VỆ"},{"k":"D","t":"KIẾN THIẾT"},{"k":"E","t":"CỨU NƯỚC"}],"dung":["B"],"gt":"Tài liệu trích lời Hồ Chí Minh: “Mục đích của Đảng lao động Việt Nam có thể gồm trong 8 chữ là: “ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC””."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"\"Đại đoàn kết tức là trước hết phải đoàn kết đại đa số nhân dân, mà đại đa số nhân dân là công nhân, nông dân và các tầng lớp nhân dân lao động khác. Đó là ______ của đại đoàn kết.\"","goiy":"Tài liệu xác định nền tảng của khối đại đoàn kết.","pa":[{"k":"A","t":"mục tiêu"},{"k":"B","t":"phương hướng"},{"k":"C","t":"nguyên tắc"},{"k":"D","t":"nền gốc"},{"k":"E","t":"then chốt"}],"dung":["D"],"gt":"Tài liệu khẳng định: \"Đó là nền gốc của đại đoàn kết. Nó cũng như cái nền của nhà, gốc của cây.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Lực lượng làm nền tảng cho khối đại đoàn kết dân tộc theo quan điểm của Hồ Chí Minh bao gồm công nhân, nông dân và ______ .","goiy":"Tài liệu liệt kê các thành phần của nền tảng đại đoàn kết.","pa":[{"k":"A","t":"tiểu thương"},{"k":"B","t":"trí thức"},{"k":"C","t":"binh lính"},{"k":"D","t":"phú nông"},{"k":"E","t":"địa chủ"}],"dung":["B"],"gt":"Tài liệu nêu: \"lực lượng làm nền tảng cho khối đại đoàn kết dân tộc theo quan điểm của Hồ Chí Minh là công nhân, nông dân và trí thức.\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong khối đại đoàn kết toàn dân tộc, cần đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong ______ vì đó là điều kiện cho sự đoàn kết ngoài xã hội.","goiy":"Tài liệu nhấn mạnh yếu tố hạt nhân của đại đoàn kết.","pa":[{"k":"A","t":"Chính phủ"},{"k":"B","t":"Mặt trận"},{"k":"C","t":"Quân đội"},{"k":"D","t":"Đảng"},{"k":"E","t":"Quốc hội"}],"dung":["D"],"gt":"Tài liệu khẳng định: \"Trong khối đại đoàn kết toàn dân tộc, phải đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong Đảng vì đó là điều kiện cho sự đoàn kết ngoài xã hội.\""}]},{"ma":"12","ten":"Điều kiện, hình thức, phương thức đại đoàn kết","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Nguyên tắc \"Đoàn kết thực sự nghĩa là vừa đoàn kết, vừa đấu tranh, học những cái tốt của nhau, phê bình những cái sai của nhau\" được Hồ Chí Minh nhấn mạnh chỉ áp dụng trong phạm vi các tổ chức có lợi ích tương đồng cao, không dành cho những thành phần còn tồn tại sự khác biệt lớn về quan điểm hoặc lợi ích.","goiy":"Xem xét toàn diện ý nghĩa của \"đoàn kết thực sự\" và nguyên tắc \"cầu đồng tồn dị\" trong bối cảnh xây dựng Mặt trận dân tộc thống nhất.","pa":[{"k":"A","t":"Khẳng định trên là Đúng"},{"k":"B","t":"Khẳng định trên là Sai"}],"dung":["B"],"gt":"Theo Hồ Chí Minh, đoàn kết thực sự không chỉ là sự đồng thuận mà còn bao hàm cả \"đấu tranh, học những cái tốt của nhau, phê bình những cái sai của nhau\" và \"phê bình trên lập trường thân ái, vì nước, vì dân\". Nguyên tắc \"cầu đồng tồn dị\" cũng khẳng định sự cần thiết phải tìm điểm chung để hạn chế cái riêng, cho thấy sự đoàn kết này áp dụng rộng rãi ngay cả khi có điểm khác biệt."},{"loai":"mot","dang":"Đúng hay sai","q":"Theo tư tưởng Hồ Chí Minh, niềm tin vào nhân dân là một điều kiện độc lập để xây dựng khối đại đoàn kết, không liên quan trực tiếp đến truyền thống dân tộc \"Nước lấy dân làm gốc\" hay nguyên lý Mácxít \"Cách mạng là sự nghiệp của quần chúng\".","goiy":"Đọc kỹ phần trình bày về điều kiện \"niềm tin vào nhân dân\" để hiểu rõ tài liệu gốc và ý nghĩa của nguyên tắc này.","pa":[{"k":"A","t":"Khẳng định trên là Đúng"},{"k":"B","t":"Khẳng định trên là Sai"}],"dung":["B"],"gt":"Văn bản chỉ rõ: \"Nguyên tắc này [niềm tin vào nhân dân] vừa là sự tiếp nối truyền thống dân tộc “Nước lấy dân làm gốc”. “Chở thuyền và lật thuyền cũng là dân”, đồng thời là sự quán triệt sâu sắc nguyên lý mácxít \"Cách mạng là sự nghiệp của quần chúng\"\". Do đó, niềm tin vào nhân dân là sự kết hợp và tiếp nối của cả hai truyền thống."},{"loai":"mot","dang":"Đúng hay sai","q":"Mục đích chung của Mặt trận dân tộc thống nhất, dù tên gọi có khác nhau qua các thời kỳ, luôn chỉ tập trung vào độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân, không bao gồm mục tiêu giải phóng giai cấp.","goiy":"Xem xét mục tiêu chung của Mặt trận dưới sự lãnh đạo của Đảng và sự phát triển của mục tiêu cách mạng.","pa":[{"k":"A","t":"Khẳng định trên là Đúng"},{"k":"B","t":"Khẳng định trên là Sai"}],"dung":["B"],"gt":"Mặc dù mục tiêu chung được xác định là \"độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân\", nhưng văn bản cũng khẳng định Đảng lãnh đạo Mặt trận hoàn thành nhiệm vụ \"đấu tranh giải phóng dân tộc và giải phóng giai cấp, kết hợp độc lập dân tộc với chủ nghĩa xã hội\"."},{"loai":"mot","dang":"Đúng hay sai","q":"Mặc dù liên minh công nhân - nông dân được xác định là nền tảng cốt lõi của Mặt trận dân tộc thống nhất, Hồ Chí Minh chủ trương chỉ nên nhấn mạnh vai trò của hai giai cấp này để đảm bảo tính tiên phong tuyệt đối của khối đại đoàn kết.","goiy":"Chú ý đến lời căn dặn của Hồ Chí Minh về việc mở rộng khối đại đoàn kết.","pa":[{"k":"A","t":"Khẳng định trên là Đúng"},{"k":"B","t":"Khẳng định trên là Sai"}],"dung":["B"],"gt":"Hồ Chí Minh chỉ rõ: \"Người căn dặn, không nên chỉ nhấn mạnh vai trò của công nông, mà còn phải thấy vai trò và sự cần thiết phải liên minh với các giai cấp khác, nhất là với đội ngũ trí thức\". Điều này thể hiện quan điểm rộng mở trong việc xây dựng khối đại đoàn kết."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong các điều kiện để xây dựng khối đại đoàn kết toàn dân tộc, điều kiện nào được Hồ Chí Minh xác định là \"nguyên tắc bất di bất dịch, là ngọn cờ đoàn kết và là mẫu số chung để quy tụ các tầng lớp, giai cấp, đảng phái, dân tộc và tôn giáo vào trong Mặt trận\"?","goiy":"Tập trung vào đoạn văn mô tả các điều kiện xây dựng khối đại đoàn kết và tìm kiếm cụm từ khóa chính xác.","pa":[{"k":"A","t":"Kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết dân tộc."},{"k":"B","t":"Có lòng khoan dung, độ lượng vị tha đối với mọi con người."},{"k":"C","t":"Có niềm tin vững chắc tuyệt đối vào sức mạnh của nhân dân."},{"k":"D","t":"Lấy lợi ích tối cao dân tộc, lợi ích căn bản nhân dân làm mục tiêu."},{"k":"E","t":"Xử lý tốt các mối quan hệ lợi ích rất đa dạng trong xã hội."}],"dung":["D"],"gt":"Văn bản nêu rõ: \"Vì vậy đoàn kết phải lấy lợi ích tối cao của dân tộc, lợi ích căn bản của nhân dân lao động làm mục tiêu phấn đấu; đây là nguyên tắc bất di bất dịch, là ngọn cờ đoàn kết và là mẫu số chung...\""},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Luận điểm \"Chở thuyền và lật thuyền cũng là dân\" trong tư tưởng Hồ Chí Minh về đại đoàn kết toàn dân tộc chủ yếu khẳng định điều gì?","goiy":"Liên hệ luận điểm này với điều kiện xây dựng khối đại đoàn kết mà nó minh họa.","pa":[{"k":"A","t":"Sự cần thiết của lòng khoan dung độ lượng với con người."},{"k":"B","t":"Vai trò tối cao của liên minh giai cấp công nông trí thức."},{"k":"C","t":"Niềm tin vững chắc vào sức mạnh quyết định của nhân dân."},{"k":"D","t":"Tầm quan trọng việc kế thừa truyền thống yêu nước dân tộc."},{"k":"E","t":"Nguyên tắc hiệp thương dân chủ trong mọi hoạt động Mặt trận."}],"dung":["C"],"gt":"Luận điểm \"Chở thuyền và lật thuyền cũng là dân\" được nêu trong bối cảnh giải thích điều kiện \"niềm tin vào nhân dân\". Văn bản khẳng định: \"Dân là chỗ dựa vững chắc đồng thời cũng là tài liệu sức mạnh vô địch của khối đại đoàn kết toàn dân tộc\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Nguyên tắc \"cầu đồng tồn dị\" trong xây dựng Mặt trận dân tộc thống nhất có ý nghĩa then chốt nào sau đây?","goiy":"Phân tích ý nghĩa của \"cầu đồng tồn dị\" trong bối cảnh có nhiều điểm tương đồng và khác biệt giữa các thành viên.","pa":[{"k":"A","t":"Đòi hỏi mọi thành viên phải hoàn toàn đồng nhất về lợi ích."},{"k":"B","t":"Nhấn mạnh việc loại bỏ sự khác biệt để thống nhất tuyệt đối."},{"k":"C","t":"Tìm điểm chung để hạn chế khác biệt, đồng thời tôn trọng chúng."},{"k":"D","t":"Đề cao sự áp đặt ý chí từ một số thành viên chủ chốt Mặt trận."},{"k":"E","t":"Chỉ áp dụng cho các tổ chức lớn, không áp dụng cho cá nhân."}],"dung":["C"],"gt":"Hồ Chí Minh nhấn mạnh phương châm \"cầu đồng tồn dị\", \"lấy cái chung để hạn chế cái riêng, cái khác biệt\". Điều này có nghĩa Mặt trận chấp nhận sự tồn tại của những điểm khác biệt chính đáng và tôn trọng chúng."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, lý do cốt yếu nào khiến liên minh công nhân - nông dân được xem là nền tảng của Mặt trận dân tộc thống nhất?","goiy":"Đọc kỹ phần giải thích của Hồ Chí Minh về tầm quan trọng của liên minh công nông.","pa":[{"k":"A","t":"Vì họ là lực lượng duy nhất có khả năng lãnh đạo cách mạng."},{"k":"B","t":"Vì họ đông đảo nhất, trực tiếp sản xuất, bị bóc lột nặng nhất."},{"k":"C","t":"Vì họ đại diện cho trí thức có trình độ cao và tầm nhìn xa."},{"k":"D","t":"Vì họ có truyền thống yêu nước triệt để hơn các giai tầng."},{"k":"E","t":"Vì họ có tài sản và ảnh hưởng xã hội lớn nhất để tập hợp."}],"dung":["B"],"gt":"Hồ Chí Minh chỉ rõ: sở dĩ phải lấy liên minh công nông làm nền tảng \"vì họ là người trực tiếp sản xuất tất cả mọi tài phú làm cho xã hội sống. Vì họ đông hơn hết, mà cũng bị áp bức bóc lột nặng nề hơn hết.\""},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG ĐÚNG khi nói về vai trò của Đảng Cộng sản Việt Nam trong Mặt trận dân tộc thống nhất?","goiy":"Chú ý đến mối quan hệ giữa Đảng và lợi ích chung của xã hội, dân tộc.","pa":[{"k":"A","t":"Đảng là một thành viên bình đẳng nằm trong Mặt trận dân tộc."},{"k":"B","t":"Đảng là lực lượng lãnh đạo toàn diện của Mặt trận dân tộc."},{"k":"C","t":"Đảng có lợi ích riêng, tách biệt hoàn toàn với lợi ích xã hội."},{"k":"D","t":"Đảng lãnh đạo Mặt trận thông qua đường lối cách mạng đúng."},{"k":"E","t":"Đảng có nhiệm vụ dẫn dắt Mặt trận giải phóng dân tộc giai cấp."}],"dung":["C"],"gt":"Văn bản khẳng định rõ: \"Đảng Cộng sản Việt Nam vừa là thành viên, vừa là lực lượng lãnh đạo, Đảng không có lợi ích riêng, mà gắn liền với lợi ích toàn xã hội, toàn dân tộc\". Do đó, nhận định C là KHÔNG ĐÚNG."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Điều kiện nào dưới đây KHÔNG PHẢI là một trong những điều kiện quan trọng để xây dựng khối đại đoàn kết toàn dân tộc theo văn bản?","goiy":"Rà soát lại mục \"Điều kiện để xây dựng khối đại đoàn kết toàn dân tộc\" để xác định những yếu tố được liệt kê.","pa":[{"k":"A","t":"Lấy lợi ích chung làm điểm quy tụ, tôn trọng khác biệt chính đáng."},{"k":"B","t":"Kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc."},{"k":"C","t":"Có lòng khoan dung, độ lượng rộng mở với tất cả mọi con người."},{"k":"D","t":"Xây dựng nền kinh tế độc lập, tự chủ hoàn toàn không phụ thuộc."},{"k":"E","t":"Có niềm tin vững chắc tuyệt đối vào sức mạnh quyết định của dân."}],"dung":["D"],"gt":"Các điều kiện được nêu trong văn bản gồm: Lấy lợi ích chung làm điểm quy tụ, kế thừa truyền thống yêu nước, có lòng khoan dung độ lượng, và có niềm tin vào nhân dân. Điều kiện \"Xây dựng nền kinh tế độc lập\" không thuộc danh mục này."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phương thức nào sau đây KHÔNG được đề cập là một trong những phương thức xây dựng khối đại đoàn kết dân tộc theo Hồ Chí Minh?","goiy":"Kiểm tra ba phương thức chính được trình bày trong mục \"Phương thức xây dựng khối đại đoàn kết dân tộc\".","pa":[{"k":"A","t":"Làm tốt công tác vận động quần chúng (thực hiện công tác dân vận)."},{"k":"B","t":"Thành lập đoàn thể, tổ chức quần chúng phù hợp từng đối tượng."},{"k":"C","t":"Tập hợp các đoàn thể quần chúng vào Mặt trận dân tộc thống nhất."},{"k":"D","t":"Cưỡng chế các tổ chức không tự nguyện tham gia vào trong Mặt trận."},{"k":"E","t":"Giáo dục, tuyên truyền, giúp đỡ nhân dân thực hiện đường lối."}],"dung":["D"],"gt":"Ba phương thức gồm: Dân vận; Thành lập đoàn thể phù hợp; Tập hợp đoàn thể trong Mặt trận. Phương thức \"Cưỡng chế các tổ chức...\" đi ngược lại với nguyên tắc hiệp thương dân chủ và tự nguyện."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG chính xác về nguyên tắc hoạt động hiệp thương dân chủ của Mặt trận dân tộc thống nhất?","goiy":"Đọc kỹ cách thức giải quyết các lợi ích riêng biệt trong nguyên tắc hiệp thương dân chủ.","pa":[{"k":"A","t":"Mọi vấn đề của Mặt trận đều được đem ra bàn bạc công khai."},{"k":"B","t":"Loại trừ mọi sự áp đặt hoặc dân chủ hình thức khi quyết định."},{"k":"C","t":"Tôn trọng các lợi ích riêng chính đáng phù hợp lợi ích chung."},{"k":"D","t":"Giải quyết lợi ích không phù hợp bằng sự áp chế và loại bỏ."},{"k":"E","t":"Quy tụ các tầng lớp, giai cấp, tôn giáo vào trong Mặt trận."}],"dung":["D"],"gt":"Văn bản nêu rõ lợi ích riêng không phù hợp sẽ dần được giải quyết bằng lợi ích chung của dân tộc, bằng sự nhận thức ngày càng đúng đắn hơn, dựa trên sự nhận thức và cảm hóa, không phải bằng áp chế và loại bỏ."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo văn bản, những tên gọi nào sau đây đã từng được sử dụng để chỉ Mặt trận dân tộc thống nhất trong các giai đoạn lịch sử khác nhau?","goiy":"Liệt kê các tên gọi cụ thể của Mặt trận dân tộc thống nhất trong lịch sử.","pa":[{"k":"A","t":"Hội Phản đế đồng minh (được thành lập từ năm 1930)"},{"k":"B","t":"Mặt trận Dân chủ Đông Dương (thành lập từ năm 1936)"},{"k":"C","t":"Mặt trận Đại đoàn kết Việt Nam (tên gọi giả định thêm)"},{"k":"D","t":"Mặt trận Việt Minh (được thành lập từ năm 1941)"},{"k":"E","t":"Mặt trận Tổ quốc Việt Nam (thành lập năm 1955, 1976)"}],"dung":["A","B","D","E"],"gt":"Văn bản liệt kê các tên gọi đã được sử dụng gồm: Hội Phản đế đồng minh (1930), Mặt trận Dân chủ Đông Dương (1936), Mặt trận Việt Minh (1941), Mặt trận Tổ quốc Việt Nam (1955, 1976)... \"Mặt trận Đại đoàn kết Việt Nam\" không có trong danh sách này."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Những yếu tố nào sau đây góp phần tạo nên \"sức mạnh vô địch\" và \"giá trị bền vững\" của truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc Việt Nam theo văn bản?","goiy":"Xem xét các khía cạnh về sự hình thành, phát triển và tác động của truyền thống này.","pa":[{"k":"A","t":"Được hình thành, củng cố suốt quá trình dựng nước giữ nước."},{"k":"B","t":"Thấm sâu vào tư tưởng, tình cảm, tâm hồn người Việt Nam."},{"k":"C","t":"Là cội nguồn sức mạnh chiến thắng thiên tai và địch họa."},{"k":"D","t":"Được lưu truyền qua nhiều thế hệ, trở thành giá trị bền vững."},{"k":"E","t":"Chỉ phát huy tác dụng rõ nhất trong chiến tranh quy mô lớn."}],"dung":["A","B","C","D"],"gt":"Văn bản chỉ rõ truyền thống này được hình thành trong suốt quá trình dựng nước và giữ nước, thấm sâu vào tâm hồn, lưu truyền qua nhiều thế hệ và là cội nguồn sức mạnh chiến thắng thiên tai địch họa. Lựa chọn E không chính xác."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, những khía cạnh nào sau đây cần được chú trọng khi thực hiện công tác vận động quần chúng để xây dựng khối đại đoàn kết dân tộc?","goiy":"Đọc kỹ các hướng dẫn của Hồ Chí Minh về cách tiếp cận và thực hiện công tác dân vận.","pa":[{"k":"A","t":"Giải thích cho quần chúng hiểu việc làm là vì lợi ích họ."},{"k":"B","t":"Phương pháp vận động phải phù hợp tâm tư, nguyện vọng dân."},{"k":"C","t":"Phải xuất phát từ trình độ dân trí, phong tục địa phương."},{"k":"D","t":"Giúp nhân dân hiểu đầy đủ về quyền lợi và nghĩa vụ công dân."},{"k":"E","t":"Chỉ tập trung vận động người có trình độ học vấn cao nhất."}],"dung":["A","B","C","D"],"gt":"Văn bản nêu rõ các khía cạnh: giải thích vì ích lợi của nhân dân, phương pháp phù hợp tâm tư nguyện vọng, xuất phát từ trình độ dân trí phong tục, giúp nhân dân hiểu đầy đủ quyền lợi trách nhiệm nghĩa vụ công dân. Lựa chọn E là sai."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Để Mặt trận dân tộc thống nhất thực sự quy tụ được cả dân tộc thành một khối vững chắc dưới sự lãnh đạo của Đảng, cần phải đảm bảo những nguyên tắc cốt lõi nào trong xây dựng và hoạt động?","goiy":"Liệt kê các nguyên tắc xây dựng và hoạt động của Mặt trận dân tộc thống nhất.","pa":[{"k":"A","t":"Xây dựng trên nền tảng liên minh công - nông - trí thức."},{"k":"B","t":"Hoạt động theo nguyên tắc hiệp thương dân chủ công khai."},{"k":"C","t":"Đoàn kết lâu dài, chặt chẽ, chân thành, giúp nhau tiến bộ."},{"k":"D","t":"Tuân thủ phương châm \"cầu đồng tồn dị\" giải quyết khác biệt."},{"k":"E","t":"Tập trung quyền lực cho một số đại diện ra quyết định."}],"dung":["A","B","C","D"],"gt":"Các nguyên tắc cốt lõi gồm: nền tảng liên minh công-nông-trí dưới sự lãnh đạo của Đảng, hiệp thương dân chủ, đoàn kết lâu dài chân thành giúp đỡ nhau, và phương châm \"cầu đồng tồn dị\". Lựa chọn E mâu thuẫn với nguyên tắc hiệp thương dân chủ."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, nếu nước được độc lập mà dân không được hưởng hạnh phúc, tự do thì độc lập cũng chẳng có ý nghĩa gì. Vì vậy, đoàn kết phải lấy _______ của dân tộc, lợi ích căn bản của nhân dân lao động làm mục tiêu phấn đấu.","goiy":"Chú ý đến từ ngữ được dùng để nhấn mạnh tầm quan trọng của lợi ích dân tộc và nhân dân.","pa":[{"k":"A","t":"lợi ích riêng của cá nhân"},{"k":"B","t":"lợi ích tối cao toàn dân"},{"k":"C","t":"lợi ích kinh tế ngắn hạn"},{"k":"D","t":"lợi ích chính đáng cục bộ"},{"k":"E","t":"lợi ích ban đầu giai cấp"}],"dung":["B"],"gt":"Văn bản nêu rõ: \"Vì vậy đoàn kết phải lấy lợi ích tối cao của dân tộc, lợi ích căn bản của nhân dân lao động làm mục tiêu phấn đấu\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Hồ Chí Minh căn dặn đồng bào: “Năm ngón tay cũng có ngón vắn ngón dài. Nhưng vắn dài đều hợp nhau lại nơi bàn tay. Trong mấy triệu người cũng có người thế này hay thế khác, nhưng thế này hay thế khác đều dòng dõi của tổ tiên ta. Vậy nên ta phải khoan hồng đại độ.” Người dùng hình ảnh này để minh họa cho sự cần thiết phải có _______ với con người trong xây dựng đại đoàn kết.","goiy":"Liên hệ câu nói của Hồ Chí Minh với điều kiện về thái độ đối với con người.","pa":[{"k":"A","t":"lòng trung thành tuyệt đối"},{"k":"B","t":"lòng kiên nhẫn bền bỉ"},{"k":"C","t":"lòng dũng cảm kiên cường"},{"k":"D","t":"lòng khoan dung, độ lượng"},{"k":"E","t":"lòng quyết tâm sắt đá"}],"dung":["D"],"gt":"Đoạn văn được trích dẫn trong phần \"Ba là, phải có lòng khoan dung, độ lượng với con người\". Cụm từ \"khoan hồng đại độ\" đồng nghĩa với lòng khoan dung, độ lượng."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Đảng Cộng sản Việt Nam vừa là thành viên, vừa là lực lượng lãnh đạo của Mặt trận. Đảng không có lợi ích riêng, mà gắn liền với _______, toàn dân tộc.","goiy":"Xem xét mối quan hệ hữu cơ giữa Đảng và xã hội được trình bày trong văn bản.","pa":[{"k":"A","t":"lợi ích một giai cấp"},{"k":"B","t":"lợi ích toàn xã hội"},{"k":"C","t":"lợi ích một nhóm người"},{"k":"D","t":"lợi ích một đảng phái"},{"k":"E","t":"lợi ích một tầng lớp"}],"dung":["B"],"gt":"Văn bản khẳng định: \"Đảng không có lợi ích riêng, mà gắn liền với lợi ích toàn xã hội, toàn dân tộc\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Các đoàn thể, tổ chức quần chúng ra đời, dưới sự lãnh đạo của Đảng, có nhiệm vụ tuyên truyền, giáo dục, giác ngộ, vận động, tập hợp các tầng lớp nhân dân tham gia cách mạng, đấu tranh bảo vệ _______ của mình.","goiy":"Nhớ lại chức năng cơ bản của các đoàn thể quần chúng đối với hội viên của mình.","pa":[{"k":"A","t":"danh dự và uy tín"},{"k":"B","t":"truyền thống lâu đời"},{"k":"C","t":"phong tục tập quán"},{"k":"D","t":"quyền và lợi ích"},{"k":"E","t":"văn hóa dân tộc"}],"dung":["D"],"gt":"Văn bản nêu rõ rằng các đoàn thể, tổ chức quần chúng có nhiệm vụ \"đấu tranh bảo vệ quyền và lợi ích của mình\" và \"bênh vực quyền của dân\"."}]},{"ma":"13","ten":"Chuẩn mực đạo đức cách mạng","cau":[{"loai":"mot","dang":"Đúng hay sai","q":"Theo quan điểm của Hồ Chí Minh, việc cán bộ thực hiện \"cần, kiệm, liêm, chính\" không chỉ là gương mẫu cho nhân dân mà còn là biện pháp duy nhất để chống lại sự hủ bại và biến chất trong bộ máy nhà nước.","goiy":"Tập trung vào vai trò của \"cần, kiệm, liêm, chính\" đối với cán bộ và những hậu quả nếu thiếu chúng. Có phải là \"biện pháp duy nhất\" được đề cập trong tài liệu không?","pa":[{"k":"A","t":"Khẳng định phát biểu trên là Đúng"},{"k":"B","t":"Khẳng định phát biểu trên là Sai"}],"dung":["B"],"gt":"Tài liệu chỉ ra rằng cán bộ, đảng viên phải là người thực hành \"cần, kiệm, liêm, chính\" trước để làm kiểu mẫu cho dân và nếu không giữ đúng thì \"dễ trở nên hủ bại, biến thành sâu mọt của dân\". Tuy nhiên, tài liệu không khẳng định đây là \"biện pháp duy nhất\" để chống hủ bại, mà là một điều kiện tiên quyết. Có thể có nhiều biện pháp khác."},{"loai":"mot","dang":"Đúng hay sai","q":"Tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh, mặc dù kế thừa giá trị yêu nước truyền thống, nhưng hoàn toàn loại bỏ mọi yếu tố đạo đức truyền thống trong quan niệm về nước và dân để tạo nên một cuộc cách mạng sâu sắc.","goiy":"Chú ý cụm từ \"hoàn toàn loại bỏ mọi yếu tố\" và sự \"kế thừa\" được nhắc đến. Có sự kế thừa và phát triển hay chỉ là loại bỏ tuyệt đối?","pa":[{"k":"A","t":"Khẳng định phát biểu trên là Đúng"},{"k":"B","t":"Khẳng định phát biểu trên là Sai"}],"dung":["B"],"gt":"Tài liệu chỉ rõ tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh \"kế thừa giá trị yêu nước truyền thống của dân tộc, mà còn vượt qua những hạn chế của truyền thống đó\", đồng thời đưa ra những nội dung mới, rộng lớn và tạo nên cuộc cách mạng sâu sắc. Việc sử dụng từ \"kế thừa\" cho thấy Người không hoàn toàn loại bỏ mọi yếu tố đạo đức truyền thống mà chọn lọc, phát triển."},{"loai":"mot","dang":"Đúng hay sai","q":"Theo Hồ Chí Minh, tình yêu thương con người phải được xây dựng trên lập trường của giai cấp công nhân và chỉ được thể hiện thông qua các hành động cụ thể, thiết thực trong các mối quan hệ hằng ngày.","goiy":"Xem xét các yếu tố cấu thành tình yêu thương con người theo Hồ Chí Minh. Có phải chỉ \"thông qua\" hành động cụ thể hay còn có các yếu tố khác như thái độ, sự tôn trọng?","pa":[{"k":"A","t":"Khẳng định phát biểu trên là Đúng"},{"k":"B","t":"Khẳng định phát biểu trên là Sai"}],"dung":["B"],"gt":"Tài liệu nêu rõ tình yêu thương con người phải được xây dựng trên lập trường giai cấp công nhân, thể hiện ở hành động cụ thể. Tuy nhiên, tài liệu cũng đề cập đến thái độ tôn trọng quyền con người, sự rộng rãi, độ lượng, giàu lòng vị tha... Từ \"chỉ\" làm cho mệnh đề bị thu hẹp phạm vi biểu hiện của tình yêu thương con người."},{"loai":"mot","dang":"Đúng hay sai","q":"Chủ nghĩa quốc tế theo Hồ Chí Minh đòi hỏi sự tôn trọng và đoàn kết với giai cấp vô sản và các dân tộc bị áp bức trên toàn thế giới, đồng thời loại bỏ hoàn toàn chủ nghĩa dân tộc hẹp hòi để đạt được hòa bình vĩnh cửu.","goiy":"Phân tích nội dung chủ nghĩa quốc tế và mối quan hệ với chủ nghĩa dân tộc. Có sự loại bỏ \"hoàn toàn\" không?","pa":[{"k":"A","t":"Khẳng định phát biểu trên là Đúng"},{"k":"B","t":"Khẳng định phát biểu trên là Sai"}],"dung":["B"],"gt":"Tài liệu khẳng định Hồ Chí Minh là biểu tượng của \"chủ nghĩa yêu nước chân chính kết hợp nhuần nhuyễn với chủ nghĩa quốc tế vô sản\". Việc chống lại \"chủ nghĩa dân tộc hẹp hòi\" không có nghĩa là loại bỏ hoàn toàn chủ nghĩa yêu nước chân chính. Hơn nữa, việc loại bỏ này không được khẳng định là sẽ trực tiếp đạt được \"hòa bình vĩnh cửu\" trong văn bản."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Luận điểm \"Bao nhiêu lợi ích đều vì dân. Bao nhiêu quyền hạn đều của dân… Quyền hành và lực lượng đều ở nơi dân\" thể hiện rõ nhất khía cạnh nào trong quan niệm đạo đức Hồ Chí Minh về \"Trung với nước, hiếu với dân\"?","goiy":"Đọc kỹ đoạn văn chứa luận điểm đó và phân tích ngữ cảnh, đặc biệt là sự so sánh với quan niệm cũ và vai trò của \"dân\" được nhấn mạnh.","pa":[{"k":"A","t":"Sự kế thừa triệt để và nguyên vẹn quan niệm trung với vua trong đạo đức truyền thống."},{"k":"B","t":"Vai trò tối cao định đoạt mọi lợi ích và quyền hạn của tổ chức Đảng và Chính phủ."},{"k":"C","t":"Cuộc cách mạng sâu sắc trong quan niệm về nước và dân, đặt dân lên vị trí chủ thể."},{"k":"D","t":"Mục tiêu duy nhất là làm cho dân giàu, nước mạnh bằng mọi giá trong thời gian ngắn."},{"k":"E","t":"Sự phân chia rõ ràng và biệt lập giữa lợi ích của quốc gia và lợi ích của nhân dân."}],"dung":["C"],"gt":"Tài liệu khẳng định khi Hồ Chí Minh đặt vấn đề \"Bao nhiêu lợi ích đều vì dân. Bao nhiêu quyền hạn đều của dân...\", quan niệm về nước và dân đã hoàn toàn đảo lộn so với trước; điều này làm cho tư tưởng đạo đức Hồ Chí Minh vượt xa lên phía trước, thể hiện một cuộc cách mạng sâu sắc đặt dân vào vị trí trung tâm, làm chủ thể quyền lực."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Theo Hồ Chí Minh, phẩm chất \"Chí công vô tư\" được hiểu một cách sâu sắc nhất là gì?","goiy":"Xem xét định nghĩa và mối quan hệ của \"chí công vô tư\" với các phẩm chất khác, cũng như đối tượng áp dụng và ý nghĩa của nó trong việc chống lại một tư tưởng cụ thể.","pa":[{"k":"A","t":"Hoàn toàn không nghĩ đến các quyền lợi cá nhân dưới bất kỳ hình thức hoàn cảnh nào."},{"k":"B","t":"Luôn đặt lợi ích của Đảng, nhân dân và dân tộc lên trên hết, đối lập chủ nghĩa cá nhân."},{"k":"C","t":"Là đức tính độc lập hoàn toàn, không có sự liên quan nào đến cần, kiệm, liêm, chính."},{"k":"D","t":"Việc hưởng thụ lợi ích của bản thân phải luôn luôn đi sau người khác không ngoại lệ."},{"k":"E","t":"Là chuẩn mực chỉ áp dụng cho nhóm cán bộ cấp cao nắm giữ quyền lực và vị trí lớn."}],"dung":["B"],"gt":"Tài liệu định nghĩa \"Chí công vô tư là hoàn toàn vì lợi ích chung, không vì tư lợi; hết sức công bằng, không chút thiên tư, thiên vị, công tâm, luôn đặt lợi ích của Đảng, của nhân dân, của dân tộc lên trên hết, trước hết\" và là \"chống chủ nghĩa cá nhân\"."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Trong các nhận định sau về phẩm chất \"Liêm\" theo Hồ Chí Minh, nhận định nào thể hiện sự tinh túy nhất, vượt trội so với quan niệm truyền thống?","goiy":"Đọc kỹ định nghĩa về \"Liêm\" và tìm điểm khác biệt so với quan niệm thông thường hoặc truyền thống, đặc biệt chú ý đến điều mà Người cho là \"chỉ có một thứ ham\".","pa":[{"k":"A","t":"Liêm là giữ mình trong sạch, không tham lam của cải vật chất hay tiền tài xã hội."},{"k":"B","t":"Chữ LIÊM phải luôn đi đôi với chữ KIỆM, cũng như chữ KIỆM phải đi đôi với chữ CẦN."},{"k":"C","t":"Liêm là không tham gia địa vị, không tham tiền tài và không ham muốn sự sung sướng."},{"k":"D","t":"Không ham người tâng bốc khen ngợi mình, giữ mình quang minh chính đại không hủ hóa."},{"k":"E","t":"Nhận định vượt trội: Chỉ có một thứ ham duy nhất là ham học, ham làm, ham tiến bộ."}],"dung":["E"],"gt":"Thay vì chỉ tập trung vào việc không tham lam (điều đã có trong truyền thống), Hồ Chí Minh bổ sung một nội dung tích cực, tiến bộ: \"Chỉ có một thứ ham là ham học, ham làm, ham tiến bộ\", định hướng con người có ham muốn lành mạnh vì sự phát triển."},{"loai":"mot","dang":"Chọn 1 đáp án","q":"Luận điểm \"Đem lòng chí công vô tư mà đối với người, đối với việc\" và \"Khi làm bất cứ việc gì cũng đừng nghĩ đến mình trước... khi hưởng thụ thì mình nên đi sau\" thể hiện mối liên hệ sâu sắc nhất với phẩm chất đạo đức nào khác của Hồ Chí Minh?","goiy":"Luận điểm này nói về \"chí công vô tư\". Tài liệu có chỉ ra mối liên hệ của \"chí công vô tư\" với các phẩm chất khác không?","pa":[{"k":"A","t":"Thể hiện nội dung cốt lõi của tinh thần quốc tế vô sản trong sáng và thủy chung."},{"k":"B","t":"Thể hiện biểu hiện trực tiếp của tình yêu thương con người sâu sắc, sống có tình nghĩa."},{"k":"C","t":"Thể hiện sự tiếp nối sâu sắc với hệ thống phẩm chất Cần, kiệm, liêm, chính."},{"k":"D","t":"Thể hiện nội dung bao trùm của phẩm chất Trung với nước, hiếu với dân của cán bộ."},{"k":"E","t":"Thể hiện tinh thần tự lực cánh sinh, tự cường trong lao động sản xuất công việc."}],"dung":["C"],"gt":"Tài liệu giải thích rõ ràng: \"Chí công vô tư về thực chất là sự tiếp nối cần, kiệm, liêm, chính.\" Việc đem lòng chí công vô tư là biểu hiện cụ thể của sự liêm chính và cốt lõi của cần, kiệm, liêm, chính."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG phản ánh đúng ý nghĩa của \"Kiệm\" theo tư tưởng Hồ Chí Minh?","goiy":"Đọc kỹ định nghĩa và các ví dụ về \"Kiệm\", đặc biệt là sự phân biệt giữa \"kiệm\" và \"bủn xỉn\", và các trường hợp ngoại lệ liên quan đến lợi ích chung.","pa":[{"k":"A","t":"Tiết kiệm không có nghĩa là bủn xỉn, mà là chi tiêu có kế hoạch và mục đích rõ ràng."},{"k":"B","t":"Tiết kiệm sức lao động, thời gian và tiền của của cá nhân, tập thể và quốc gia."},{"k":"C","t":"Khi có việc đáng làm vì lợi ích đồng bào, Tổ quốc thì không cần tiết kiệm công của."},{"k":"D","t":"Phô trương hình thức, liên hoan chè chén lu bù là hành vi trái với tinh thần Kiệm."},{"k":"E","t":"Tiết kiệm đòi hỏi sự kiên quyết không xa xỉ trong mọi hoàn cảnh kể cả việc chung."}],"dung":["E"],"gt":"Phương án E khẳng định \"Tiết kiệm đòi hỏi sự kiên quyết không xa xỉ trong mọi hoàn cảnh, bao gồm cả các hoạt động vì lợi ích chung\" là sai. Tài liệu rõ ràng cho phép (thậm chí khuyến khích) chi tiêu \"bao nhiêu công, tốn bao nhiêu của\" cho việc lợi ích cho đồng bào, Tổ quốc."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phát biểu nào sau đây KHÔNG phản ánh đúng về tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh?","goiy":"Kiểm tra từng yếu tố của \"trung với nước, hiếu với dân\" trong tài liệu, đặc biệt là các khía cạnh liên quan đến \"dân\".","pa":[{"k":"A","t":"Là phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác."},{"k":"B","t":"Đánh dấu sự thay đổi cơ bản từ quan niệm trung với vua sang nội dung cách mạng."},{"k":"C","t":"Không những kế thừa giá trị yêu nước truyền thống mà còn vượt qua hạn chế của nó."},{"k":"D","t":"Được cụ thể hóa bằng việc làm cho dân giàu, nước mạnh và hết lòng phục vụ dân."},{"k":"E","t":"Yêu cầu tuyệt đối trung thành với Tổ quốc nhưng không bao gồm việc tin dân, học dân."}],"dung":["E"],"gt":"Phương án E là sai vì tài liệu nêu rõ \"Hiếu với dân là phải thương dân, tin dân, thân dân, học hỏi dân, lấy dân làm gốc, hết lòng hết sức phục vụ nhân dân\". Do đó \"tin dân, học hỏi dân\" là nội dung cốt lõi của hiếu với dân."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Phát biểu nào sau đây là KHÔNG đúng về sự vận dụng và phát triển khái niệm đạo đức truyền thống của Hồ Chí Minh?","goiy":"Tập trung vào cách Hồ Chí Minh xử lý các khái niệm đạo đức truyền thống. Có phải chỉ là \"hình thức\" hay có sự thay đổi \"cốt lõi\" và \"cách mạng sâu sắc\"?","pa":[{"k":"A","t":"Sử dụng các khái niệm cũ nhưng gán cho chúng nội dung mới, rộng lớn và cách mạng."},{"k":"B","t":"Lọc bỏ những nội dung không phù hợp và đưa vào những nội dung mới đáp ứng nhu cầu."},{"k":"C","t":"Sự kế thừa này chỉ mang tính hình thức, cốt lõi vẫn giữ nguyên các giá trị truyền thống."},{"k":"D","t":"Quan điểm đạo đức mới như người hai chân đứng vững dưới đất thể hiện sự đảo lộn."},{"k":"E","t":"Khẳng định cán bộ phải thực hiện trước làm gương, khác với phong kiến bắt dân tuân theo."}],"dung":["C"],"gt":"Tài liệu chỉ ra đây không phải là sự kế thừa mang tính hình thức mà là một sự thay đổi sâu sắc về nội dung và bản chất, tạo ra một nền đạo đức mới cách mạng."},{"loai":"mot","dang":"Chọn 1 đáp án SAI","q":"Nhận định nào sau đây KHÔNG thể hiện đúng tinh thần \"Chính\" của Hồ Chí Minh trong mối quan hệ \"đối với việc\"?","goiy":"Đọc kỹ phần định nghĩa \"Chính\" và các mối quan hệ được liệt kê, đặc biệt là \"đối với việc\".","pa":[{"k":"A","t":"Phải đặt công việc của nước lên trên, trước mọi việc tư và việc gia đình cá nhân."},{"k":"B","t":"Việc thiện dù nhỏ mấy cũng phải hết sức cố gắng tìm mọi cách làm bằng được."},{"k":"C","t":"Việc ác dù nhỏ mấy cũng phải tìm mọi cách chủ động tránh xa một cách tuyệt đối."},{"k":"D","t":"Luôn phải tuân thủ mọi quy định và luật pháp, không được linh hoạt trong mọi trường hợp."},{"k":"E","t":"Thể hiện sự thẳng thắn, đứng đắn, không tà vạy trong mọi hành động đối với công việc."}],"dung":["D"],"gt":"Tài liệu không hề đề cập đến việc \"Luôn phải tuân thủ mọi quy định và luật pháp, không được linh hoạt trong mọi trường hợp\". Đây là suy diễn cứng nhắc, không có trong văn bản."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Các đặc điểm nào sau đây được Hồ Chí Minh nhấn mạnh trong việc thực hành phẩm chất \"Cần\"? (Chọn tất cả các đáp án đúng)","goiy":"Liệt kê tất cả các đặc điểm của \"Cần\" được nêu trong tài liệu.","pa":[{"k":"A","t":"Lao động có kế hoạch, sáng tạo và đạt năng suất cao trong công việc."},{"k":"B","t":"Tinh thần tự lực cánh sinh, không lười biếng và không ỷ lại người khác."},{"k":"C","t":"Coi lao động là nghĩa vụ thiêng liêng, là nguồn sống và nguồn hạnh phúc."},{"k":"D","t":"Luôn tìm tòi, sáng tạo và phát kiến đổi mới trong mọi công tác nhiệm vụ."},{"k":"E","t":"Siêng năng, chăm chỉ, cố gắng bền bỉ, dẻo dai trong mọi điều kiện."}],"dung":["A","B","C","D","E"],"gt":"Tài liệu liệt kê đầy đủ tất cả các đặc điểm của \"Cần\": siêng năng, chăm chỉ, có kế hoạch, sáng tạo, năng suất cao, tự lực cánh sinh, coi lao động là nghĩa vụ thiêng liêng."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, \"Thương yêu con người\" thể hiện những khía cạnh nào sau đây? (Chọn tất cả các đáp án đúng)","goiy":"Xem xét toàn bộ phần \"Thương yêu con người, sống có tình có nghĩa\" và các đặc điểm được mô tả.","pa":[{"k":"A","t":"Là tình cảm nhân ái sâu sắc dành cho người nghèo khổ, bị áp bức, bị bóc lột."},{"k":"B","t":"Tình yêu thương không phân biệt màu da, dân tộc, giới tính trong nhân loại."},{"k":"C","t":"Thúc đẩy người cách mạng chấp nhận gian khổ, hy sinh vì độc lập và hạnh phúc."},{"k":"D","t":"Thái độ tôn trọng quyền con người, tạo điều kiện phát triển, nâng đỡ người lầm lạc."},{"k":"E","t":"Đòi hỏi mỗi người trước hết phải thật sự chặt chẽ và nghiêm khắc với bản thân."}],"dung":["A","C","D","E"],"gt":"Tài liệu nêu A, C, D, E. Phương án B không hoàn toàn chính xác theo tài liệu vì tài liệu chỉ ghi \"...không phân biệt màu da, dân tộc\", việc thêm \"giới tính\" làm phương án B sai so với văn bản chính gốc."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Các phẩm chất nào sau đây được Hồ Chí Minh coi là nền tảng của đời sống mới, của các phong trào thi đua yêu nước và là những đức tính cơ bản của con người, mà \"thiếu một đức, thì không thành người\"?","goiy":"Đọc kỹ đoạn văn nói về \"nền tảng của đời sống mới\" và \"thiếu một đức, thì không thành người\".","pa":[{"k":"A","t":"Trung"},{"k":"B","t":"Hiếu"},{"k":"C","t":"Cần"},{"k":"D","t":"Kiệm"},{"k":"E","t":"Liêm"},{"k":"F","t":"Chính"}],"dung":["C","D","E","F"],"gt":"Tài liệu khẳng định: \"Cần, kiệm, liêm, chính còn là nền tảng của đời sống mới... Hồ Chí Minh coi cần, kiệm, liêm, chính là bốn đức tính cơ bản của con người, giống như bốn mùa của trời, bốn phương của đất; Thiếu một đức, thì không thành người\"."},{"loai":"nhieu","dang":"Chọn nhiều đáp án đúng","q":"Theo Hồ Chí Minh, nội dung của chủ nghĩa quốc tế trong sáng bao gồm những khía cạnh nào sau đây? (Chọn tất cả các đáp án đúng)","goiy":"Xem xét phần \"Tinh thần quốc tế trong sáng\" và các nội dung cụ thể được liệt kê.","pa":[{"k":"A","t":"Tôn trọng, hiểu biết, thương yêu và đoàn kết với giai cấp vô sản toàn thế giới."},{"k":"B","t":"Ủng hộ và giúp đỡ các cuộc đấu tranh vì hòa bình, độc lập dân tộc của các nước."},{"k":"C","t":"Chống lại mọi sự chia rẽ, hằn thù, bất bình đẳng và phân biệt chủng tộc."},{"k":"D","t":"Phản đối chủ nghĩa dân tộc hẹp hòi, sôvanh và chủ nghĩa bành trướng bá quyền."},{"k":"E","t":"Ưu tiên tuyệt đối lợi ích quốc gia lên trên lợi ích quốc tế khi xảy ra xung đột."}],"dung":["A","B","C","D"],"gt":"Tài liệu nêu rõ các nội dung A, B, C, D. Phương án E không đúng vì tư tưởng Hồ Chí Minh là kết hợp nhuần nhuyễn giữa chủ nghĩa yêu nước chân chính và chủ nghĩa quốc tế vô sản."},{"loai":"dien","dang":"Điền khuyết: chọn từ cho từng chỗ trống","q":"Hồ Chí Minh khẳng định Đảng và Chính phủ là \"(1)\", chứ không phải \"(2)\" để đè đầu cưỡi cổ nhân dân, điều này thể hiện sự đảo lộn hoàn toàn quan niệm về nước và dân so với trước.","goiy":"Đoạn văn mô tả rõ vai trò của Đảng và Chính phủ. Chọn từ phù hợp nhất từ Danh sách từ gợi ý bên dưới.","pa":[{"k":"A","t":"Đầy tớ"},{"k":"B","t":"Chủ nhân"},{"k":"C","t":"Sống có tình có nghĩa"},{"k":"D","t":"Quan cách mạng"},{"k":"E","t":"Chí công vô tư"},{"k":"F","t":"Tiết kiệm"},{"k":"G","t":"Bủn xỉn"},{"k":"H","t":"Độc lập dân tộc"},{"k":"I","t":"Yêu nước"},{"k":"J","t":"Kế thừa"}],"dung":["A","D"],"gt":"Tài liệu viết: \"Đảng và Chính phủ là 'đầy tớ nhân d
