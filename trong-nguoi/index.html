<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trăm năm trồng người – Tư tưởng Hồ Chí Minh về văn hóa, đạo đức, con người</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
/* Trăm năm trồng người — game Bài 8 (Chương 6). Khuôn giao diện; nội dung ở noi-dung.json.
   Dựng index.html: python _KHO-DU-LIEU/cong-cu/tao-game-trong-nguoi.py */
:root{--nau:#3b2414;--nau2:#5a3418;--nau3:#7a4a24;--nau4:#8e5426;--giay:#fbe9c3;--giay2:#f6e2b6;--giay3:#e6c98f;--vang:#f0b545;--vang2:#ffd77e;--vang3:#c07d1c;--kem:#fff3d6;--xanh:#dff3c8;--xanh2:#bfe8a0;--do:#e9a48f;--do2:#f6d2c4;--chu2:#6b3d18}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#6fb24a}
body{font-family:'Literata',Georgia,'Palatino Linotype',serif;color:var(--nau)}
#nen{position:fixed;inset:0;z-index:0;pointer-events:none}
#nen svg{width:100%;height:100%;display:block}
#app{position:relative;z-index:1;container-type:inline-size;min-height:100vh}
/* chữ co giãn theo bề rộng khung: gốc 16–30px; câu hỏi 1.4em (sàn 22px), phương án 1.2em (sàn 19px) */
.man{font-size:clamp(16px,1.25cqi,30px);min-height:100vh;display:flex;flex-direction:column}
.px{font-family:'VT323',monospace;font-weight:400;line-height:1}
button{font:inherit;color:inherit}
.an{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:4px solid var(--vang);outline-offset:2px}

/* nút gỗ */
.pbtn{font-family:'VT323',monospace;font-size:1.75em;line-height:1;color:var(--nau);background:var(--vang);border:4px solid var(--nau);box-shadow:inset -4px -4px 0 var(--vang3),inset 4px 4px 0 var(--vang2),4px 4px 0 rgba(40,20,8,.45);padding:.28em .75em;display:inline-flex;align-items:center;gap:.35em;cursor:pointer;min-height:44px;text-decoration:none}
.pbtn:hover{background:#ffc75a}
.pbtn:active{transform:translate(2px,2px);box-shadow:inset -4px -4px 0 var(--vang3),inset 4px 4px 0 var(--vang2),2px 2px 0 rgba(40,20,8,.45)}
.pbtn.nhat{background:var(--giay2);box-shadow:inset -4px -4px 0 #d8b57a,inset 4px 4px 0 #fff4d8,4px 4px 0 rgba(40,20,8,.45)}
.pbtn.nhat:hover{background:#fff0cc}
.pbtn svg{width:.8em;height:.8em;flex:none}
.giay{background:var(--giay);border:4px solid var(--nau);box-shadow:inset 0 -5px 0 var(--giay3),6px 6px 0 rgba(40,20,8,.35)}

/* thanh đầu */
.dau{position:sticky;top:0;z-index:5;background:var(--nau2);border-bottom:6px solid var(--nau);box-shadow:inset 0 -4px 0 var(--nau3);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5em 1em;padding:.5em 1.2em;color:var(--kem)}
.dau-trai,.dau-phai{display:flex;flex-wrap:wrap;align-items:center;gap:.5em .9em}
.ve{width:2.7em;height:2.7em;min-width:44px;min-height:44px;display:grid;place-items:center;background:var(--nau3);border:3px solid var(--nau);color:var(--vang2);cursor:pointer;padding:0}
.ve svg{width:1.3em;height:1.3em}
.dau-ten{font-size:2.3em;color:var(--vang2);text-shadow:3px 3px 0 var(--nau)}
.dau-phu{font-size:1.65em}
.chip{font-family:'VT323',monospace;font-size:1.45em;line-height:1.1;background:var(--nau);border:3px solid var(--nau4);padding:.1em .55em;color:var(--kem)}
.chip b{font-weight:400;color:var(--vang2)}
.chip.cay b{color:#9be07a}
button.chip{cursor:pointer;min-height:40px}
button.chip:hover{border-color:var(--vang)}
.than{flex:1;width:100%;max-width:84em;margin:0 auto;padding:1.3em 1.2em 1.6em}

/* ---------- màn chào ---------- */
.chao{flex:1;display:flex;flex-direction:column;align-items:center;gap:1.4em;padding:2.4em 1em 1.4em}
.bien{background:#b9773f;border:6px solid var(--nau);box-shadow:inset 0 0 0 6px #d9995a,inset 0 0 0 10px var(--nau4),6px 6px 0 rgba(40,20,8,.35);padding:1.6em 2.2em 1.5em;display:flex;flex-direction:column;align-items:center;gap:.35em;text-align:center;max-width:100%}
.bien-tren{font-size:1.75em;letter-spacing:.12em;color:var(--kem);text-shadow:3px 3px 0 var(--nau)}
.bien-ten{margin:0;font-size:min(7.2em,15cqi);line-height:.9;color:var(--kem);text-shadow:6px 6px 0 var(--nau),-2px -2px 0 #7a3a12}
.bien-duoi{margin-top:.3em;font-size:2.1em;background:var(--giay2);border:4px solid var(--nau);padding:.05em .6em}
.cot{display:flex;justify-content:space-between;width:min(37em,80%);margin-top:-1.4em}
.cot i{display:block;width:12px;height:3.6em;background:var(--nau3);border:4px solid var(--nau);border-top:none}
.trich{max-width:40em;padding:1em 1.6em;text-align:center}
.trich p{margin:0;font-size:1.3em;line-height:1.45;font-style:italic}
.trich .px{margin-top:.3em;font-size:1.55em;color:var(--chu2);font-style:normal}
.chao-nut{display:flex;flex-wrap:wrap;justify-content:center;gap:1.1em}
.chao-nut .pbtn{font-size:2.05em}
.chao-duoi{width:100%;max-width:84em;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1.2em;margin-top:auto}
.cach-choi{max-width:33em;background:rgba(59,36,20,.9);border:4px solid var(--nau);box-shadow:inset 0 0 0 3px var(--nau4);color:var(--kem);padding:.9em 1.15em;line-height:1.5}
.cach-choi p{margin:.25em 0 0}
.cach-choi .px{margin:0 0 .2em;font-size:1.6em;color:var(--vang2)}
.cach-choi.nhay{animation:nhay 1s 2}
@keyframes nhay{50%{box-shadow:inset 0 0 0 3px var(--vang),0 0 0 6px var(--vang)}}
.may-nhac{display:flex;align-items:center;gap:.75em;background:var(--giay2);border:4px solid var(--nau);box-shadow:4px 4px 0 rgba(40,20,8,.35);padding:.5em .8em .5em .5em}
.may-nhac button{width:3em;height:3em;min-width:44px;min-height:44px;background:var(--nau2);border:3px solid var(--nau);color:var(--vang2);display:grid;place-items:center;cursor:pointer;padding:0}
.may-nhac button svg{width:1.6em;height:1.6em}
.may-nhac div{text-align:center}
.may-nhac .px{display:block;font-size:1.4em;color:var(--chu2)}
.may-nhac b{font-size:.95em}

/* ---------- bản đồ ---------- */
.bando{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.8em}
.mua{border:6px solid var(--nau);box-shadow:inset 0 0 0 4px var(--vien),6px 6px 0 rgba(40,20,8,.35);background:var(--nen);padding:.9em 1em 1em;display:flex;flex-direction:column;gap:.8em}
.mua-dau{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5em}
.mua-ten{margin:0;font-size:2.1em;background:var(--vien);border:3px solid var(--nau);padding:0 .35em;line-height:1.1}
.mua-phan{font-size:1.5em;background:var(--giay);border:3px solid var(--nau);padding:0 .4em}
.thua-ds{display:flex;flex-wrap:wrap;gap:.9em;flex:1}
.thua{flex:1 1 8.4em;max-width:13em;display:flex;flex-direction:column;align-items:center;gap:.35em;background:var(--giay);border:4px solid var(--nau);box-shadow:inset 0 -4px 0 var(--giay3),4px 4px 0 rgba(40,20,8,.35);padding:.6em .6em .7em;cursor:pointer;text-align:center;min-height:44px}
.thua:hover{background:#fff4d8;transform:translate(-2px,-2px);box-shadow:inset 0 -4px 0 var(--giay3),6px 6px 0 rgba(40,20,8,.35)}
.thua svg{width:6em;height:4.5em}
.thua .px.ma{font-size:1.4em;color:var(--chu2)}
.thua .ten{font-size:1.02em;font-weight:600;line-height:1.25}
.thua .the{margin-top:auto;font-size:1.35em;padding:.05em .45em;border:2px solid var(--nau)}
.mua-thu{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:.6em}
.mua-thu .px.ghi{font-size:1.5em;background:var(--giay);border:3px solid var(--nau);padding:.05em .45em}
.mua-thu .pbtn{font-size:1.5em}

/* ---------- gieo hạt ---------- */
.gieo{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.5em;align-items:start}
.the-ds{display:flex;gap:6px;padding-left:8px}
.tab{font-family:'VT323',monospace;font-size:1.6em;line-height:1;padding:.3em .7em;border:4px solid var(--nau);border-bottom:none;cursor:pointer;min-height:44px;background:#c99a62}
.tab[aria-selected="true"]{background:var(--giay)}
.sach{max-height:calc(100vh - 11em);overflow-y:auto;padding:1.1em 1.4em;font-size:1.08em;line-height:1.62}
.sach p{margin:0 0 .65em}
.sach h3{margin:.9em 0 .35em;font-size:1.1em;line-height:1.35}
.sach .nhan{font-size:1.35em;color:var(--chu2);margin-bottom:.2em}
.sach h2{margin:0 0 .5em;font-size:1.35em;line-height:1.3}
.sach::-webkit-scrollbar{width:12px}.sach::-webkit-scrollbar-thumb{background:#b9773f;border:3px solid var(--giay)}
.so{background:var(--giay2);border:4px solid var(--nau);box-shadow:inset 0 0 0 4px var(--giay3),6px 6px 0 rgba(40,20,8,.35);padding:1em 1.2em;display:flex;flex-direction:column;gap:.65em}
.so-dau{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.4em}
.so-dau h2{margin:0;font-size:2.1em}
.so-dau .px{font-size:1.5em;color:var(--chu2)}
.so label{line-height:1.45}
.so textarea{width:100%;min-height:9.5em;resize:vertical;font-family:'Literata',Georgia,serif;font-size:1.02em;line-height:1.55;color:var(--nau);background:#fffaf0;border:4px solid var(--nau);padding:.6em .75em}
.so textarea:focus{outline:4px solid var(--vang);outline-offset:0}
.so-hang{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6em}
.so-hang .px{font-size:1.5em;color:var(--chu2)}
.so-hang .px.qua{color:#a8321f}
.y-ds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6em}
.y{border:3px solid var(--nau);padding:.4em .5em .5em;display:flex;flex-direction:column;gap:.3em;min-height:7.2em;background:var(--giay)}
.y.co{background:var(--xanh)}
.y.thieu{background:#efd9ae}
.y svg{width:100%;height:2.5em}
.y span{font-size:.88em;line-height:1.35}
.y.co span{font-weight:600}
.bao{background:var(--nau);color:var(--kem);padding:.5em .75em;font-size:.95em;line-height:1.45;border:3px solid var(--nau4)}
.so-cuoi{display:flex;justify-content:flex-end}

/* ---------- thu hoạch ---------- */
.thu{display:grid;grid-template-columns:11em minmax(0,1fr);gap:1.4em;align-items:start}
.cu-ds{display:flex;flex-direction:column;gap:.6em}
.cu{background:var(--giay2);border:4px solid var(--nau);box-shadow:4px 4px 0 rgba(40,20,8,.35);padding:.5em .6em;display:flex;flex-direction:column;gap:.1em;opacity:.8}
.cu.dang{background:var(--vang);opacity:1}
.cu div{display:flex;align-items:center;gap:.45em}
.cu svg{width:1.75em;height:1.75em;flex:none}
.cu .px{font-size:1.6em}
.cu small{font-size:.8em;line-height:1.3}
.cau{padding:1.1em 1.5em;display:flex;flex-direction:column;gap:.75em;min-height:31em}
.gio{display:flex;align-items:center;gap:.75em}
.gio svg{width:1.9em;height:1.9em;flex:none}
.gio .thanh{flex:1;height:1.15em;background:var(--giay3);border:3px solid var(--nau);position:relative}
.gio .thanh i{position:absolute;left:0;top:0;bottom:0;background:var(--vang);transition:width .9s linear}
.gio .thanh i.chieu{background:#d9622b}
.gio .px{font-size:1.6em;min-width:8.5em;text-align:right}
.dong-cu{font-size:1.5em;color:var(--chu2)}
.cau h2{margin:0;font-size:1.4em;line-height:1.42;font-weight:600}
.pa-ds{display:flex;flex-direction:column;gap:.5em}
.pa{display:flex;align-items:center;gap:.7em;width:100%;text-align:left;font-size:1.2em;line-height:1.35;border:4px solid var(--nau);padding:.45em .7em;cursor:pointer;min-height:48px;background:#fffaf0}
.pa:hover:not([disabled]){filter:brightness(1.05)}
.pa[disabled]{cursor:default}
.pa .px.chu{font-size:1.4em;width:1.3em;height:1.3em;display:grid;place-items:center;background:var(--nau);color:var(--kem);flex:none}
.pa .noi{flex:1}
.pa .px.ghi{font-size:1.15em;flex:none}
.pa.chon{background:var(--vang2)}
.pa.dung{background:var(--xanh2)}
.pa.sai{background:var(--do)}
.pa.mo{background:#f3e6c8}
.tu-ds{display:flex;flex-wrap:wrap;gap:.75em;margin-top:.3em}
.tu{font-size:1.2em;border:4px solid var(--nau);padding:.35em 1em;cursor:pointer;min-height:48px;box-shadow:3px 3px 0 rgba(40,20,8,.35);background:#fffaf0}
.tu.dung{background:var(--xanh2)}.tu.sai{background:var(--do)}.tu.mo{background:#f3e6c8}
.cau-cuoi{display:flex;flex-wrap:wrap;align-items:flex-end;gap:1em;margin-top:auto}
.phan-hoi{flex:1 1 20em;border:3px solid var(--nau);padding:.5em .75em;font-size:.98em;line-height:1.5}
.phan-hoi .px{font-size:1.6em;margin-right:.3em}
.phan-hoi.dung{background:var(--xanh)}.phan-hoi.sai{background:var(--do2)}.phan-hoi.lan{background:#efd9ae}
.nhieu-ghi{flex:1;font-size:.95em}
.o-ds{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.2em,1fr));gap:.6em;margin-top:1.2em}
.o{border:4px solid var(--nau);background:#8a5a33;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;padding:.3em .2em;box-shadow:4px 4px 0 rgba(40,20,8,.35)}
.o svg{width:3.2em;height:2.8em}
.o .px{font-size:1.2em;color:var(--kem)}
.o.dang{outline:4px solid var(--vang);outline-offset:-4px}

/* ---------- kết mùa ---------- */
.ket-ten{align-self:center;background:#b9773f;border:6px solid var(--nau);box-shadow:inset 0 0 0 6px #d9995a,inset 0 0 0 10px var(--nau4),6px 6px 0 rgba(40,20,8,.35);padding:.5em 1.6em;margin:0 auto 1.4em;text-align:center}
.ket-ten h1{margin:0;font-size:min(4.3em,10cqi);color:var(--kem);text-shadow:5px 5px 0 var(--nau)}
.ket{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6em;align-items:start}
.ket section{padding:1em 1.3em;display:flex;flex-direction:column;gap:.6em}
.ket-dau{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.4em}
.ket-dau h2{margin:0;font-size:2em}
.ket-dau .px{font-size:1.85em}
.ket .dong{display:flex;justify-content:space-between;gap:.8em;border-bottom:2px dashed #d8b57a;padding-bottom:.25em}
.ket .px.nho{margin:.3em 0 0;font-size:1.5em;color:var(--chu2)}
.ket ul{margin:0;padding-left:1.2em;line-height:1.5}
.ket li{margin:.2em 0}
.cu-diem{display:grid;grid-template-columns:repeat(auto-fit,minmax(6em,1fr));gap:.5em}
.cu-diem div{background:var(--giay2);border:3px solid var(--nau);padding:.35em;text-align:center}
.cu-diem .px{display:block;font-size:1.35em}
.cu-diem .px.diem{font-size:1.85em}
.ket-cuoi{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:1em;margin-top:1.4em}
.hoan-thanh{grid-column:1/-1;background:var(--vang2);border:4px solid var(--nau);padding:.6em 1em;text-align:center;font-size:1.7em}

/* ---------- âm nhạc ---------- */
.bang-nhac{padding:1.1em 1.4em;display:flex;flex-direction:column;gap:.9em}
.bang-nhac h1{margin:0;font-size:3.3em}
.bang-nhac .loai{display:flex;gap:.6em;font-size:1.45em}
.bang-nhac .loai span{border:3px solid var(--nau);padding:.05em .6em}
.cuon{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.98em;line-height:1.38;min-width:44em}
th{font-family:'VT323',monospace;font-weight:400;font-size:1.45em;text-align:left;background:var(--nau2);color:var(--kem);padding:.3em .6em}
td{padding:.45em .6em;border-bottom:2px dashed #d8b57a;vertical-align:top}
td .px{font-size:1.3em;border:2px solid var(--nau);padding:0 .4em;white-space:nowrap}
td small{display:block;color:var(--chu2);font-size:.85em;margin-top:.2em}
td small a{color:var(--chu2)}
.hai-hop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1em}
.hai-hop div{background:var(--giay2);border:3px solid var(--nau);padding:.6em .9em;font-size:.95em;line-height:1.5}
.hai-hop .px{margin:0 0 .2em;font-size:1.5em}
.hai-hop p{margin:0}

@container (max-width:900px){
  .bando,.gieo,.ket,.hai-hop{grid-template-columns:minmax(0,1fr)}
  .thu{grid-template-columns:minmax(0,1fr)}
  .cu-ds{flex-direction:row;flex-wrap:wrap}
  .cu{flex:1 1 7em}
  .cu small{display:none}
  .sach{max-height:62vh}
  .y-ds{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cau{min-height:0;padding:1em}
}
@container (max-width:520px){
  .dau{padding:.45em .7em}
  .than{padding:1em .7em 1.4em}
  .chao-duoi{flex-direction:column;align-items:stretch}
  .gio .px{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chế độ sửa (?sua=1) — chỉ giảng viên mở ---------- */
#sua-khung{position:fixed;left:.6rem;bottom:.6rem;z-index:80;max-width:min(46rem,calc(100vw - 1.2rem));font:500 15px/1.4 'Segoe UI',system-ui,sans-serif;color:#3b2414}
#sua-khung .sua-thanh,#sua-khung .sua-hop{background:#fbe9c3;border:4px solid #3b2414;box-shadow:4px 4px 0 rgba(40,20,8,.45);padding:.5rem .65rem;margin-top:.4rem}
#sua-khung .sua-thanh{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;background:#3b2414;color:#fff3d6;border-color:#8e5426}
#sua-khung .sua-thanh b{font:400 26px/1 'VT323',monospace;color:#ffd77e}
#sua-khung button{font:600 14px 'Segoe UI',system-ui,sans-serif;border:3px solid #3b2414;background:#f6e2b6;color:#3b2414;padding:.3rem .6rem;cursor:pointer;min-height:36px}
#sua-khung button.bat,#sua-khung button.chinh{background:#f0b545}
#sua-khung.gon .sua-thanh > :not(#sua-gon),#sua-khung.gon .sua-hop{display:none!important}
#sua-dem{font-weight:700;color:#ffd77e}
#sua-ds{max-height:45vh;overflow:auto}
#sua-ds ol{margin:0 0 .5rem;padding-left:1.3rem} #sua-ds li{margin:.4rem 0} #sua-ds s{color:#7a5a3a}
#sua-o textarea{width:100%;font:600 16px 'Segoe UI',system-ui,sans-serif;border:3px solid #3b2414;padding:.5rem;margin:.35rem 0;resize:vertical;color:#3b2414;background:#fffaf0}
#sua-o .sua-nut{display:flex;gap:.4rem;flex-wrap:wrap}
.sua-nho{color:#6b3d18;font-size:13px}
body.co-sua .man{padding-bottom:76px}
#sua-ch{max-height:60vh;overflow:auto;min-width:min(42rem,calc(100vw - 1.2rem))}
#sua-ch .sua-ch-dong{display:grid;grid-template-columns:minmax(10rem,1fr) minmax(12rem,1.6fr);gap:.6rem;align-items:center;margin:.25rem 0;font-size:13px}

<script>
const DB = {"mua":[{"ma":"xuan","ten":"MÙA XUÂN","phan":"I. Văn hóa","thua":[{"ma":"I.1","ten":"Quan niệm về văn hóa","baiGiang":["- Năm 1943, trong Mục đọc sách ở phần cuối của tập Nhật ký trong tù, lần đầu tiên Hồ Chí Minh đưa ra quan niệm về văn hóa: “Vì lẽ sinh tồn cũng như mục đích của cuộc sống, loài người mới sáng tạo và phát minh ra ngôn ngữ, chữ viết, đạo đức, pháp luật, khoa học, tôn giáo, văn học, nghệ thuật, những công cụ cho sinh hoạt hàng ngày về mặc, ăn, ở và các phương thức sử dụng. Toàn bộ những sáng tạo và phát minh đó tức là văn hóa. Văn hóa là sự tổng hợp của mọi phương thức sinh hoạt cùng với biểu hiện của nó mà loài người đã sản sinh ra nhằm thích ứng những nhu cầu đời sống và đòi hỏi của sự sinh tồn”.","Đây là lần đầu tiên, cũng là lần duy nhất Hồ Chí Minh đưa ra định nghĩa về văn hóa theo nghĩa rộng; sau cách mạng tháng Tám, văn hóa được Người xác định là đời sống tinh thần của xã hội.","Hồ Chí Minh đặt văn hóa ngang hàng với chính trị, kinh tế, xã hội.","- Quan hệ giữa văn hóa với chính trị: Hồ Chí Minh cho rằng chính trị, xã hội có được giải phóng thì văn hóa mới được giải phóng: “Xã hội thế nào, văn nghệ thế ấy. Văn nghệ của dân tộc ta vốn rất phong phú, nhưng dưới chế độ thực dân và phong kiến, nhân dân ta bị nô lệ, thì văn nghệ cũng bị nô lệ, bị tồi tàn, không thể phát triển được. Trong kháng chiến, nhân dân ta vùng dậy phá ách nô lệ, giành lại tự do, nhờ vậy văn nghệ ta cũng được vươn mình giải phóng”. Theo quan điểm của Người, giải phóng chính trị là để mở đường cho văn hóa phát triển. Tuy nhiên, văn hóa không thể đứng ngoài mà phải ở trong chính trị, văn hóa phải phục vụ nhiệm vụ chính trị; đồng thời mọi hoạt động của tổ chức và nhà chính trị phải có hàm lượng văn hóa.","- Quan hệ giữa văn hóa với kinh tế. Trong mối quan hệ này, Hồ Chí Minh cho rằng, xây dựng kinh tế để tạo điều kiện cho việc xây dựng và phát triển văn hóa. Tuy nhiên, văn hóa cũng không thể đứng ngoài mà phải đứng trong kinh tế, nghĩa là văn hóa không hoàn toàn phụ thuộc vào kinh tế, mà có vai trò tác động tích cực trở lại kinh tế.","- Quan hệ giữa văn hóa với xã hội. Hồ Chí Minh cho rằng giải phóng chính trị đồng nghĩa với giải phóng xã hội, từ đó văn hóa mới có điều kiện phát triển; xã hội thế nào, văn hóa thế ấy.","+ Bản sắc văn hóa dân tộc là những giá trị văn hóa bền vững của cộng đồng dân tộc Việt Nam; là thành quả của quá trình lao động, sản xuất, chiến đấu và giao lưu của con người Việt Nam. Hồ Chí Minh cho rằng, bản sắc văn hóa dân tộc có ý nghĩa quan trọng đối với sự nghiệp xây dựng và bảo vệ Tổ quốc, do vậy trách nhiệm của các thế hệ người Việt là phải biết trân trọng, giữ gìn và phát huy, phát triển những giá trị của văn hóa dân tộc, đáp ứng yêu cầu, nhiệm vụ của cách mạng theo từng giai đoạn lịch sử. Theo Người: “Dân ta phải biết sử ta. Cho tường gốc tích nước nhà Việt Nam”.","+ Trong vấn đề giữ gìn bản sắc văn hóa dân tộc, Hồ Chí Minh nhấn mạnh yêu cầu lấy văn hóa dân tộc làm gốc, đó là điều kiện, cơ sở để tiếp thu văn hóa nhân loại. Tiếp thu văn hóa nhân loại là để làm giàu cho văn hóa Việt Nam, xây dựng văn hóa Việt Nam hợp với tinh thần dân chủ."],"giaoTrinh":["Hồ Chí Minh có bốn cách tiếp cận chủ yếu về văn hóa: (1) Tiếp cận theo nghĩa rộng, tổng hợp mọi phương thức sinh hoạt của con người; (2) Tiếp cận theo nghĩa hẹp là đời sống tinh thần của xã hội, thuộc kiến trúc thượng tầng; (3) Tiếp cận theo nghĩa hẹp hơn là bàn đến các trường học, số người đi học, xóa nạn mù chữ, biết đọc, biết viết (thường xuất hiện trong các bài nói với đồng bào miền núi); (4) Tiếp cận theo “phương thức sử dụng công cụ sinh hoạt”.","Tháng 8/1943, khi còn ở trong nhà tù của Tưởng Giới Thạch, Hồ Chí Minh đã đưa ra quan niệm nhấn mạnh ý nghĩa của văn hóa. Người viết: “Vì lẽ sinh tồn cũng như mục đích của cuộc sống, loài người mới sáng tạo và phát minh ra ngôn ngữ, chữ viết, đạo đức, pháp luật, khoa học, tôn giáo, văn học, nghệ thuật, những công cụ cho sinh hoạt hằng ngày về mặc, ăn, ở và các phương thức sử dụng. Toàn bộ những sáng tạo và phát minh đó tức là văn hóa. Văn hóa là sự tổng hợp của mọi phương thức sinh hoạt cùng với biểu hiện của nó mà loài người đã sản sinh ra nhằm thích ứng những nhu cầu đời sống và đòi hỏi của sự sinh tồn”.","Từ sau Cách mạng Tháng Tám, Hồ Chí Minh có bàn đến văn hóa nhưng theo nghĩa hẹp, với ý nghĩa là kiến trúc thượng tầng, là toàn bộ đời sống tinh thần của xã hội.","- Quan hệ giữa văn hóa với chính trị. Hồ Chí Minh cho rằng, trong đời sống có bốn vấn đề phải được coi là quan trọng ngang nhau và có sự tác động qua lại lẫn nhau, đó là chính trị, kinh tế, văn hóa, xã hội. Tuy nhiên, văn hóa không thể đứng ngoài mà phải ở trong chính trị, tức là văn hóa phải phục vụ nhiệm vụ chính trị; đồng thời mọi hoạt động của tổ chức và nhà chính trị phải có hàm lượng văn hóa.","- Quan hệ giữa văn hóa với kinh tế. Trong mối quan hệ với kinh tế, Hồ Chí Minh giải thích rằng, văn hóa thuộc kiến trúc thượng tầng. Tuy nhiên, văn hóa cũng không thể đứng ngoài mà phải đứng trong kinh tế, nghĩa là văn hóa không hoàn toàn phụ thuộc vào kinh tế, mà có vai trò tác động tích cực trở lại kinh tế.","- Quan hệ giữa văn hóa với xã hội. Giải phóng chính trị đồng nghĩa với giải phóng xã hội, từ đó văn hóa mới có điều kiện phát triển. Xã hội thế nào văn hóa thế ấy.","- Về giữ gìn bản sắc văn hóa dân tộc, tiếp thu văn hóa nhân loại. Bản sắc văn hóa dân tộc là những giá trị văn hóa bền vững của cộng đồng các dân tộc Việt Nam; là thành quả của quá trình lao động, sản xuất, chiến đấu và giao lưu của con người Việt Nam. Về hình thức, cốt cách văn hóa dân tộc biểu hiện ở ngôn ngữ, phong tục, tập quán, lễ hội, truyền thống, cách cảm và nghĩ... Bản sắc văn hóa dân tộc chứa đựng giá trị lớn và có một ý nghĩa quan trọng đối với sự nghiệp xây dựng và bảo vệ Tổ quốc. Nó phản ánh những nét độc đáo, đặc tính dân tộc. Nó là ngọn nguồn đi tới chủ nghĩa Mác - Lênin. Theo Người: “Dân ta phải biết sử ta. Cho tường gốc tích nước nhà Việt Nam”.","Hồ Chí Minh chỉ rõ mục đích của việc tiếp thu văn hóa nhân loại là để làm giàu cho văn hóa Việt Nam, xây dựng văn hóa Việt Nam hợp với tinh thần dân chủ. Nội dung tiếp thu là toàn diện bao gồm Đông, Tây, kim, cổ, tất cả các mặt, các khía cạnh. Tiêu chí tiếp thu là có cái gì hay, cái gì tốt là ta học lấy. Mối quan hệ giữa giữ gìn cốt cách văn hóa dân tộc và tiếp thu văn hóa nhân loại là phải lấy văn hóa dân tộc làm gốc, đó là điều kiện, cơ sở để tiếp thu văn hóa nhân loại."],"y":[{"ten":"Hồ Chí Minh có bốn cách tiếp cận chủ yếu về văn hóa: theo nghĩa rộng, nghĩa hẹp, nghĩa hẹp hơn và theo phương thức sử dụng công cụ sinh hoạt","goiY":"Đọc lại đoạn mở đầu mục: Người tiếp cận văn hóa theo mấy cách?","khoa":[["bon cach tiep can"],["nghia rong","nghia hep"]]},{"ten":"Tháng 8/1943, Người đưa ra quan niệm văn hóa duy nhất theo nghĩa rộng: văn hóa là sự tổng hợp của mọi phương thức sinh hoạt cùng với biểu hiện của nó","goiY":"Đọc lại định nghĩa Người viết khi còn ở trong nhà tù năm 1943: văn hóa là sự tổng hợp của cái gì?","khoa":[["phuong thuc sinh hoat"],["sang tao","phat minh"]]},{"ten":"Chính trị, kinh tế, văn hóa, xã hội quan trọng ngang nhau và có sự tác động qua lại lẫn nhau","goiY":"Đọc lại câu mở đầu phần quan hệ giữa văn hóa với chính trị: bốn vấn đề của đời sống đứng ở vị trí thế nào?","khoa":[["ngang nhau"],["ngang hang"],["quan trong ngang"],["tac dong qua lai"]]},{"ten":"Giải phóng chính trị, giải phóng xã hội để mở đường cho văn hóa phát triển; văn hóa phải ở trong chính trị, phục vụ nhiệm vụ chính trị","goiY":"Đọc lại phần quan hệ giữa văn hóa với chính trị và với xã hội: điều gì phải đi trước để văn hóa phát triển?","khoa":[["mo duong"],["o trong chinh tri"],["phuc vu nhiem vu chinh tri"],["phuc vu chinh tri"],["xa hoi the nao"]]},{"ten":"Văn hóa không hoàn toàn phụ thuộc vào kinh tế mà có vai trò tác động tích cực trở lại kinh tế","goiY":"Đọc lại phần quan hệ giữa văn hóa với kinh tế, chú ý chữ \"Tuy nhiên\".","khoa":[["tro lai kinh te"],["tac dong tich cuc"],["khong hoan toan phu thuoc"],["dung trong kinh te"]]},{"ten":"Giữ gìn bản sắc văn hóa dân tộc, lấy văn hóa dân tộc làm gốc để tiếp thu tinh hoa văn hóa nhân loại","goiY":"Đọc lại phần cuối về bản sắc văn hóa dân tộc và tiếp thu văn hóa nhân loại: cái gì là gốc?","khoa":[["ban sac"],["lam goc"]]}]},{"ma":"I.2","ten":"Vai trò của văn hóa","baiGiang":["- Văn hóa là mục tiêu:","+ Mục tiêu của cách mạng Việt Nam là độc lập dân tộc và chủ nghĩa xã hội. Do vậy, cùng với chính trị, kinh tế, xã hội, văn hóa nằm trong mục tiêu chung của toàn bộ tiến trình cách mạng của đất nước.","+ Theo Hồ Chí Minh, văn hóa là mục tiêu được hiểu là quyền sống, quyền tự do, quyền mưu cầu hạnh phúc; là khát vọng của nhân dân về các giá trị chân, thiện, mỹ. Đó là một xã hội dân chủ (dân là chủ, dân làm chủ), công bằng, văn minh, ai cũng có cơm ăn áo mặc, ai cũng được học hành; một xã hội mà đời sống vật chất và tinh thần của nhân dân luôn được quan tâm và không ngừng nâng cao; con người có điều kiện phát triển toàn diện.","- Văn hóa là động lực:","Động lực là yếu tố thúc đẩy sự phát triển xã hội. Trong quan điểm của Hồ Chí Minh, động lực phát triển đất nước được phân chia bao gồm động lực vật chất và động lực tinh thần; động lực cộng đồng và cá nhân; nội lực và ngoại lực… Tất cả những động lực này chỉ có thể được phát huy thông qua nhân tố con người với tư cách là sản phẩm văn hóa. Người nhấn mạnh: “Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển dân chủ… cũng là một việc cần thiết để xây dựng nước ta thành một nước hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh”.","Tiếp cận vai trò động lực của văn hóa đối với các lĩnh vực cụ thể, Hồ Chí Minh cho rằng:","+ Văn hóa chính trị là động lực lớn, có ý nghĩa “soi đường cho quốc dân đi”. Văn hóa chính trị mang lại sự đúng đắn, sáng suốt trong việc lựa chọn đường lối và các biện pháp thực hiện, giữ vững độc lập, tự chủ.","+ Văn hóa văn nghệ góp phần nâng cao lòng yêu nước, tinh thần tự cường, tự tôn dân tộc; lý tưởng, tình cảm cách mạng, sự lạc quan, ý chí, quyết tâm và niềm tin vào thắng lợi cuối cùng của cách mạng.","+ Văn hóa giáo dục giúp diệt giặc dốt, nâng cao dân trí, đào tạo nhân lực chất lượng cao, thúc đẩy sự tăng trưởng kinh tế.","+ Văn hóa đạo đức, lối sống nâng cao sức mạnh cho con người cách mạng, hướng con người tới chân, thiện, mỹ.","+ Văn hóa pháp luật giúp đảm bảo dân chủ, trật tự, kỷ cương, phép nước.","- Hồ Chí Minh khẳng định: Văn hóa cũng là mặt trận, người làm văn hóa là chiến sĩ trên mặt trận tiên phong ấy.","- Khẳng định “văn hóa cũng là mặt trận” mang các hàm ý sau:","+ Văn hóa như là một lĩnh vực hoạt động có tính độc lập và có tầm quan trọng như các mặt trận khác như quân sự, chính trị, kinh tế.","- Khẳng định “văn nghệ sỹ là chiến sĩ” mang hàm ý:","+ Các văn - nghệ sĩ có nhiệm vụ phụng sự Tổ quốc, phục vụ nhân dân; ngòi bút của họ là công cụ trong sự nghiệp “phò chính, trừ tà”","- Hồ Chí Minh cho rằng mọi hoạt động văn hóa phải trở về với thực tại của quần chúng, phản ánh được tư tưởng và khát vọng của quần chúng, định hướng giá trị cho quần chúng.","- Người khẳng định nhân dân phải là những người được hưởng thụ các giá trị văn hóa.","- Viết cho nhân dân nên nội dung phải thiết thực, cách diễn đạt phải ngắn gọn, dễ hiểu, chân phương.","- Văn nghệ sỹ phải đi sâu vào quần chúng để có tư liệu sinh động về cuộc sống và quần chúng chính là người thẩm định các giá trị văn hóa."],"giaoTrinh":["- Văn hóa là mục tiêu. Mục tiêu của cách mạng Việt Nam là độc lập dân tộc và chủ nghĩa xã hội, độc lập dân tộc gắn liền với chủ nghĩa xã hội. Như vậy, cùng với chính trị, kinh tế, xã hội, văn hóa nằm trong mục tiêu chung của toàn bộ tiến trình cách mạng.","Theo quan điểm Hồ Chí Minh, văn hóa là mục tiêu - nhìn một cách tổng quát - là quyền sống, quyền sung sướng, quyền tự do, quyền mưu cầu hạnh phúc; là khát vọng của nhân dân về các giá trị chân, thiện, mỹ. Đó là một xã hội dân chủ - dân là chủ và dân làm chủ - công bằng, văn minh, ai cũng có cơm ăn áo mặc, ai cũng được học hành; một xã hội mà đời sống vật chất và tinh thần của nhân dân luôn luôn được quan tâm và không ngừng nâng cao, con người có điều kiện phát triển toàn diện.","Hồ Chí Minh đã đặt cơ sở cho một xã hội phát triển bền vững với ba trụ cột là bền vững về kinh tế, xã hội và môi trường.","- Văn hóa là động lực. Động lực là cái thúc đẩy cho sự phát triển. Di sản Hồ Chí Minh cho thấy, động lực phát triển đất nước bao gồm động lực vật chất và tinh thần; động lực cộng đồng và cá nhân; nội lực và ngoại lực. Tất cả quy tụ ở con người và đều có thể được xem xét dưới góc độ văn hóa. Tuy nhiên, nếu tiếp cận các lĩnh vực văn hóa cụ thể trong tư tưởng Hồ Chí Minh, động lực có thể nhận thức ở các phương diện chủ yếu sau:","Văn hóa chính trị là một trong những động lực có ý nghĩa soi đường cho quốc dân đi, lãnh đạo quốc dân để thực hiện độc lập, tự cường, tự chủ.","Văn hóa văn nghệ góp phần nâng cao lòng yêu nước, lý tưởng, tình cảm cách mạng, sự lạc quan, ý chí, quyết tâm và niềm tin vào thắng lợi cuối cùng của cách mạng.","Văn hóa giáo dục diệt giặc dốt, xóa mù chữ, giúp con người hiểu biết quy luật phát triển của xã hội. Với sứ mệnh “trồng người”, văn hóa giáo dục đào tạo con người mới, cán bộ mới, nguồn nhân lực chất lượng cao cho sự nghiệp cách mạng.","Văn hóa đạo đức, lối sống nâng cao phẩm giá, phong cách lành mạnh cho con người, hướng con người tới các giá trị chân, thiện, mỹ.","Văn hóa pháp luật bảo đảm dân chủ, trật tự, kỷ cương, phép nước.","Văn hóa là một trong bốn nội dung chính của đời sống kinh tế - xã hội, quan trọng ngang các vấn đề kinh tế, chính trị và xã hội. Mặt trận văn hóa là cuộc đấu tranh cách mạng trên lĩnh vực văn hóa - tư tưởng. Mặt trận văn hóa là cuộc chiến đấu trên lĩnh vực văn hóa; vì vậy anh chị em văn nghệ sĩ là chiến sĩ trên mặt trận ấy; cũng như các chiến sĩ khác, chiến sĩ nghệ thuật có nhiệm vụ phụng sự Tổ quốc, phục vụ nhân dân.","Để làm tròn nhiệm vụ, chiến sĩ nghệ thuật phải có lập trường tư tưởng vững vàng; ngòi bút là vũ khí sắc bén trong sự nghiệp “phò chính trừ tà”. Phải bám sát cuộc sống thực tiễn, đi sâu vào quần chúng, để phê bình nghiêm khắc những thói xấu như tham ô, lười biếng, lãng phí, quan liêu, và ca tụng chân thật những người tốt việc tốt để làm gương mẫu cho chúng ta ngày nay và giáo dục con cháu đời sau.","Tư tưởng Hồ Chí Minh phản ánh khát vọng hạnh phúc của nhân dân. Tư tưởng văn hóa của Người cũng vì nhân dân, phục vụ nhân dân. Theo Người, mọi hoạt động văn hóa phải trở về với cuộc sống thực tại của quần chúng, phản ánh được tư tưởng và khát vọng của quần chúng.","Nhân dân phải là những người được hưởng thụ các giá trị văn hóa."],"y":[{"ten":"Văn hóa là mục tiêu của cách mạng","goiY":"Đọc lại đoạn \"Văn hóa là mục tiêu\": văn hóa nằm ở đâu trong mục tiêu chung của cách mạng?","khoa":[["muc tieu"]]},{"ten":"Văn hóa là mục tiêu, nhìn tổng quát là quyền sống, quyền sung sướng, quyền tự do, quyền mưu cầu hạnh phúc; là khát vọng của nhân dân về các giá trị chân, thiện, mỹ","goiY":"Đọc tiếp đoạn ấy: nhìn một cách tổng quát, văn hóa là mục tiêu gồm những quyền và khát vọng nào?","khoa":[["hanh phuc"],["chan thien my"],["quyen song"],["tu do"]]},{"ten":"Văn hóa là động lực của sự nghiệp cách mạng","goiY":"Đọc lại đoạn \"Văn hóa là động lực\": động lực là gì, tất cả quy tụ ở đâu?","khoa":[["dong luc"]]},{"ten":"Động lực ấy thể hiện ở văn hóa chính trị, văn hóa văn nghệ, văn hóa giáo dục, văn hóa đạo đức, văn hóa pháp luật","goiY":"Đọc các dòng nói văn hóa là động lực trên từng lĩnh vực cụ thể; kể ít nhất ba lĩnh vực.","khoa":[],"nhom":{"tu":["chinh tri","van nghe","giao duc","dao duc","phap luat"],"toiThieu":3}},{"ten":"Văn hóa là một mặt trận; anh chị em văn nghệ sĩ là chiến sĩ trên mặt trận ấy","goiY":"Đọc lại mục \"Văn hóa là một mặt trận\": người làm văn nghệ được gọi là gì?","khoa":[["mat tran"]]},{"ten":"Văn hóa phục vụ quần chúng nhân dân","goiY":"Đọc lại mục cuối: mọi hoạt động văn hóa phải trở về với ai?","khoa":[["quan chung"],["phuc vu","nhan dan"]]}]},{"ma":"I.3","ten":"Xây dựng nền văn hóa mới","baiGiang":["Tại kỳ họp 24 của Đại Hội đồng Tổ chức Giáo dục, Khoa học và Văn hóa của Liên Hợp Quốc (UNESCO) từ ngày 20/10 đến ngày 20/11/1987 tại Paris đã thông qua Nghị quyết 24C/18.6.5 ghi nhận Hồ Chí Minh là Anh hùng giải phóng dân tộc, Nhà văn hóa kiệt xuất Việt Nam.","Với tư cách là Nhà văn hóa kiệt xuất, Hồ Chí Minh đã xác lập hệ thống quan điểm về văn hóa và xây dựng nền văn hóa mới Việt Nam. Người cũng dành cả cuộc đời mình cho sự nghiệp chống giặc dốt, phát triển văn hóa, nâng cao dân trí.","Nền văn hóa mà Hồ Chí Minh xây dựng là sự kết hợp những giá trị văn hóa truyền thống tốt đẹp của dân tộc, kết hợp với tinh hoa văn hóa nhân loại; thấm nhuần chủ nghĩa yêu nước và chủ nghĩa quốc tế chân chính.","Ở mỗi chặng đường lịch sử, Hồ Chí Minh lại xác định nền văn hóa cần xây dựng với các đặc tính khác nhau.","Ở giai đoạn này, cùng với việc đưa ra quan niệm về ý nghĩa của văn hóa, Hồ Chí Minh đưa ra quan niệm về xây dựng nền văn hóa dân tộc với năm nội dung:","Một là, Xây dựng tâm lý: tinh thần độc lập tự cường.","Hai là, Xây dựng luân lý: biết hi sinh mình, làm lợi cho quần chúng","Ba là, Xây dựng xã hội: mọi sự nghiệp có liên quan đến phúc lợi của nhân dân trong xã hội.","Bốn là, Xây dựng chính trị: đảm bảo dân quyền","Năm là, Xây dựng kinh tế.","Với năm nội dung này, văn hóa đóng vai trò toàn diện trong đời sống xã hội","Hồ Chí Minh khẳng định lại quan điểm của Đảng ta trong Đề cương văn hóa Việt Nam về nền văn hóa mang tính dân tộc, khoa học, đại chúng","- Tính dân tộc: khẳng định và phát huy giá trị văn hóa dân tộc, “đặc tính dân tộc”, “cốt cách dân tộc”, đồng thời biết tiếp thu tinh hoa văn hóa nhân loại.","- Tính khoa học: tiến kịp xu thế phát triển của nhân loại.","- Tính đại chúng: “Văn hóa phải thiết thực phục vụ cho nhân dân”, do nhân dân xây dựng nên, và phải dễ hiểu, dễ nhớ, phù hợp với nhân dân lao động.","Trong thời kỳ cách mạng xã hội chủ nghĩa, Hồ Chí Minh xác định tính chất của nền văn hóa mới phải xã hội chủ nghĩa về nội dung và dân tộc về hình thức.","- Nội dung xã hội chủ nghĩa tức là: (1) Văn hóa phải phản ánh và phục vụ cho công cuộc xây dựng chủ nghĩa xã hội ở nước ta; (2) Đồng thời, văn hóa phải cổ vũ con người mới, đấu tranh chống lại các tư tưởng đi ngược lại xu thế phát triển của đất nước.","- Tính dân tộc về hình thức thể hiện ở việc giữ gìn, kế thừa, phát huy những giá trị truyền thống tốt đẹp của dân tộc, phát huy những truyền thống tốt đẹp ấy cho phù hợp với những điều kiện lịch sử mới của dân tộc."],"giaoTrinh":["Hồ Chí Minh được Tổ chức Giáo dục, Khoa học và Văn hóa Liên hợp quốc (UNESCO) ghi nhận là Anh hùng giải phóng dân tộc, Nhà văn hóa kiệt xuất Việt Nam trong Nghị quyết 24C/18.6.5 của Khóa họp 24 Đại hội đồng UNESCO từ ngày 20/10 đến ngày 20/11/1987.","Cống hiến của Nhà văn hóa kiệt xuất Hồ Chí Minh còn thể hiện ở việc sáng tạo văn hóa, văn nghệ, xác lập hệ thống quan điểm về văn hóa và xây dựng nền văn hóa mới Việt Nam. Cả cuộc đời Người chú trọng chống giặc dốt, phát triển văn hóa, nâng cao dân trí.","Nền văn hóa mà Hồ Chí Minh chủ trương kết hợp những truyền thống tốt đẹp của văn hóa dân tộc được phát triển và nâng cao với tinh hoa văn hóa của nhân loại, thấm nhuần sâu sắc chủ nghĩa yêu nước và chủ nghĩa quốc tế chân chính. Người cho rằng, phải làm cho văn hóa đi sâu vào tâm lý quốc dân, đi vào cuộc sống mới; văn hóa phải sửa đổi tham nhũng, lười biếng, phù hoa, xa xỉ; văn hóa phải làm thế nào cho mọi người dân Việt Nam, từ già đến trẻ, cả đàn ông và đàn bà, ai cũng hiểu nhiệm vụ của mình và biết hưởng hạnh phúc mà mình nên được hưởng.","- Giai đoạn trước Cách mạng Tháng Tám năm 1945: Tháng 8/1943, cùng với việc đưa ra quan niệm về ý nghĩa của văn hóa, Hồ Chí Minh quan tâm đến việc xây dựng nền văn hóa dân tộc với năm nội dung: xây dựng tâm lý (Tinh thần độc lập tự cường); xây dựng luân lý (Biết hy sinh mình, làm lợi cho quần chúng); xây dựng xã hội (Mọi sự nghiệp liên quan đến phúc lợi của nhân dân); xây dựng chính trị (dân quyền); xây dựng kinh tế.","- Trong kháng chiến chống thực dân Pháp: Khi cả dân tộc bước vào cuộc kháng chiến trường kỳ, gian khổ, Hồ Chí Minh khẳng định lại quan điểm của Đảng từ năm 1943 trong Đề cương văn hóa Việt Nam về phương châm xây dựng nền văn hóa mới. Đó là một nền văn hóa có tính chất dân tộc, khoa học, đại chúng.","- Trong thời kỳ xây dựng chủ nghĩa xã hội: Trong thời kỳ nhân dân miền Bắc quá độ lên chủ nghĩa xã hội, Hồ Chí Minh chủ trương xây dựng nền văn hóa có nội dung xã hội chủ nghĩa và tính chất dân tộc.","Tóm lại, quan điểm của Hồ Chí Minh về xây dựng nền văn hóa mới Việt Nam, đó là một nền văn hóa toàn diện, giữ gìn được cốt cách văn hóa dân tộc, bảo đảm tính khoa học, tiến bộ và nhân văn."],"y":[{"ten":"UNESCO ghi nhận Hồ Chí Minh là Anh hùng giải phóng dân tộc, Nhà văn hóa kiệt xuất Việt Nam","goiY":"Đọc lại đoạn mở đầu về Nghị quyết của UNESCO năm 1987.","khoa":[["unesco"],["kiet xuat"],["nha van hoa"]]},{"ten":"Nền văn hóa Hồ Chí Minh chủ trương kết hợp truyền thống tốt đẹp của văn hóa dân tộc với tinh hoa văn hóa nhân loại, thấm nhuần chủ nghĩa yêu nước và chủ nghĩa quốc tế chân chính","goiY":"Đọc lại đoạn nói nền văn hóa Người chủ trương kết hợp những yếu tố nào.","khoa":[["tinh hoa"],["quoc te chan chinh"],["yeu nuoc","quoc te"]]},{"ten":"Trước Cách mạng Tháng Tám, Người nêu năm nội dung xây dựng nền văn hóa dân tộc: tâm lý, luân lý, xã hội, chính trị, kinh tế","goiY":"Đọc lại giai đoạn trước Cách mạng Tháng Tám năm 1945: nền văn hóa dân tộc gồm mấy nội dung xây dựng?","khoa":[["nam noi dung"],["tam ly","luan ly"]]},{"ten":"Trong kháng chiến chống thực dân Pháp, nền văn hóa mới có tính chất dân tộc, khoa học, đại chúng","goiY":"Đọc lại giai đoạn kháng chiến chống thực dân Pháp và Đề cương văn hóa Việt Nam.","khoa":[["khoa hoc","dai chung"]]},{"ten":"Trong thời kỳ xây dựng chủ nghĩa xã hội, nền văn hóa có nội dung xã hội chủ nghĩa và tính chất dân tộc","goiY":"Đọc lại giai đoạn xây dựng chủ nghĩa xã hội: nội dung và tính chất của nền văn hóa là gì?","khoa":[["noi dung xa hoi chu nghia"],["xa hoi chu nghia","dan toc"]]},{"ten":"Nền văn hóa mới là nền văn hóa toàn diện, giữ gìn cốt cách văn hóa dân tộc, bảo đảm tính khoa học, tiến bộ và nhân văn","goiY":"Đọc lại câu \"Tóm lại\" ở cuối mục.","khoa":[["toan dien"],["cot cach"],["nhan van"]]}]}]},{"ma":"ha","ten":"MÙA HẠ","phan":"II. Đạo đức","thua":[{"ma":"II.1","ten":"Đạo đức là gốc, là nền tảng","baiGiang":["Đánh giá về vai trò của đạo đức cách mạng, Hồ Chí Minh coi đạo đức là gốc, là nền tảng của người cách mạng: “Cũng như sông thì có nguồn mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân. Vì muốn giải phóng cho dân tộc, giải phóng cho loài người là một công việc to tát, mà tự mình không có đạo đức, không có căn bản, tự mình đã hủ hóa, xấu xa thì còn làm nổi việc gì?”.","Hồ Chí Minh cho rằng: “Làm cách mạng để cải tạo xã hội cũ thành xã hội mới là một sự nghiệp rất vẻ vang, nhưng nó cũng là một nhiệm vụ rất nặng nề, một cuộc đấu tranh rất phức tạp, lâu dài, gian khổ. Sức có mạnh mới gánh được nặng và đi được xa. Người cách mạng phải có đạo đức cách mạng làm nền tảng, mới hoàn thành được nhiệm vụ cách mạng vẻ vang”.","Trong điều kiện cụ thể của nước ta, Đảng Cộng sản Việt Nam là một đảng cầm quyền, mặt trái của quyền lực có thể làm tha hóa con người, Hồ Chí Minh nhiều lần căn dặn: “Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân”.","Tư tưởng đạo đức Hồ Chí Minh là đạo đức trong hành động, lấy hiệu quả thực tế làm thước đo. Chính vì vậy Hồ Chí Minh luôn đặt đạo đức bên cạnh tài năng, gắn đức với tài, lời nói đi đôi với hành động và hiệu quả thực tế, Người khẳng định: “Có tài phải có đức. Có tài không có đức, tham ô hủ hoá có hại cho nước. Có đức không có tài như ông bụt ngồi trong chùa, không giúp ích gì được ai”.","Vai trò của Đạo đức còn là thước đo lòng cao thượng của con người. Trong tác phẩm Đạo đức cách mạng (1955), Hồ Chí Minh viết: “Tuy năng lực và công việc của mỗi người khác nhau, người làm việc to, người làm việc nhỏ; nhưng ai giữ được đạo đức đều là người cao thượng”. Giá trị đạo đức tinh thần một khi được con người tiếp nhận sẽ biến thành sức mạnh vật chất. Có đạo đức cách mạng thì khi gặp khó khăn, gian khổ, thất bại cũng không lùi bước, chán nản; khi gặp thuận lợi cũng không tự kiêu, tự đại. Rèn luyện đạo đức cách mạng, theo Hồ Chí Minh là để trở thành những con người “Giàu sang không thể quyến rũ; nghèo khó không thể chuyển lay; Uy lực không thể khuất phục”."],"giaoTrinh":["Khi đánh giá vai trò của đạo đức trong đời sống, từ rất sớm, Hồ Chí Minh đã nêu rõ: đạo đức là nguồn nuôi dưỡng và phát triển con người. Hồ Chí Minh nhiều lần khẳng định đạo đức là gốc, là nền tảng, là sức mạnh, là tiêu chuẩn hàng đầu của người cách mạng. Người coi đạo đức rất quan trọng như gốc của cây, như ngọn nguồn của sông, suối. Trong tác phẩm Sửa đổi lối làm việc (1947), Người viết: “Cũng như sông thì có nguồn mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân. Vì muốn giải phóng cho dân tộc, giải phóng cho loài người là một công việc to tát, mà tự mình không có đạo đức, không có căn bản, tự mình đã hủ hóa, xấu xa thì còn làm nổi việc gì?”.","Trong tác phẩm Đạo đức cách mạng (1958), Hồ Chí Minh viết: “Làm cách mạng để cải tạo xã hội cũ thành xã hội mới là một sự nghiệp rất vẻ vang, nhưng nó cũng là một nhiệm vụ rất nặng nề, một cuộc đấu tranh rất phức tạp, lâu dài, gian khổ. Sức có mạnh mới gánh được nặng và đi được xa. Người cách mạng phải có đạo đức cách mạng làm nền tảng, mới hoàn thành được nhiệm vụ cách mạng vẻ vang”.","Đạo đức trở thành nhân tố quyết định của sự thành bại của mọi công việc, phẩm chất mỗi con người. Trong bài Người cán bộ cách mạng (1955), Hồ Chí Minh yêu cầu: “Người cán bộ cách mạng phải có đạo đức cách mạng... Mọi việc thành hay là bại, chủ chốt là do cán bộ có thấm nhuần đạo đức cách mạng, hay là không”.","Theo Hồ Chí Minh, “Đại đa số chiến sĩ cách mạng là người có đạo đức: Cả đời hết lòng hết sức phục vụ nhân dân, sinh hoạt ngày thường thì làm gương mẫu; gian khổ, chất phác, kính trọng của công... Đạo đức ấy có ảnh hưởng lớn đến sự nghiệp đổi xã hội cũ thành xã hội mới và xây dựng mỹ tục thuần phong”. Theo Hồ Chí Minh, đạo đức cách mạng là chỗ dựa giúp cho con người vững vàng trong mọi thử thách. “Có đạo đức cách mạng thì khi gặp khó khăn, gian khổ, thất bại, cũng không sợ sệt, rụt rè, lùi bước... khi gặp thuận lợi và thành công vẫn giữ vững tinh thần gian khổ, chất phác, khiêm tốn”.","Trong Di chúc, Người viết: “Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân...”.","Đức và tài phải là những phẩm chất thống nhất của con người. Vì vậy, con người cần có cả đức và tài, nếu thiếu tài thì làm việc gì cũng khó, nhưng thiếu đạo đức thì vô dụng, thậm chí có hại. Trong đó, đạo đức là gốc, là nền tảng của người cách mạng. Hồ Chí Minh thường khuyên: “Dạy cũng như học phải biết chú trọng cả tài lẫn đức. Đức là đạo đức cách mạng. Đó là cái gốc, rất quan trọng. Nếu không có đạo đức cách mạng thì có tài cũng vô dụng”.","Vai trò của đạo đức còn thể hiện là thước đo lòng cao thượng của con người. Trong bài Đạo đức cách mạng (1955), Hồ Chí Minh viết: “Tuy năng lực và công việc của mỗi người khác nhau, người làm việc to, người làm việc nhỏ; nhưng ai giữ được đạo đức đều là người cao thượng”."],"y":[{"ten":"Đạo đức là gốc, là nền tảng, là sức mạnh, là tiêu chuẩn hàng đầu của người cách mạng","goiY":"Đọc lại đoạn đầu: Hồ Chí Minh nhiều lần khẳng định đạo đức là gì của người cách mạng?","khoa":[["la goc"],["nen tang"],["tieu chuan hang dau"]]},{"ten":"Như sông có nguồn, cây có gốc; người cách mạng không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân","goiY":"Đọc lại câu trích trong Sửa đổi lối làm việc có hình ảnh sông và cây.","khoa":[["co nguon"],["tai gioi"],["khong lanh dao"]]},{"ten":"Đạo đức là nhân tố quyết định sự thành bại của mọi công việc","goiY":"Đọc lại đoạn trích bài Người cán bộ cách mạng (1955): mọi việc thành hay bại là do đâu?","khoa":[["thanh bai"],["thanh hay la bai"],["thanh hay bai"]]},{"ten":"Đức và tài thống nhất, đức là gốc; nếu không có đạo đức cách mạng thì có tài cũng vô dụng","goiY":"Đọc lại đoạn bàn về quan hệ giữa đức và tài, hồng và chuyên.","khoa":[["duc va tai"],["duc voi tai"],["vo dung"],["hong","chuyen"]]},{"ten":"Đạo đức là thước đo lòng cao thượng của con người","goiY":"Đọc lại đoạn trích bài Đạo đức cách mạng: ai giữ được đạo đức thì là người thế nào?","khoa":[["cao thuong"],["thuoc do"]]},{"ten":"Đảng ta là một Đảng cầm quyền; mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân","goiY":"Đọc lại lời dặn trong Di chúc về Đảng cầm quyền.","khoa":[["cam quyen"],["day to"]]}]},{"ma":"II.2","ten":"Bốn chuẩn mực đạo đức cách mạng","baiGiang":["- Trung với nước, hiếu với dân là phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác.","- Trung và Hiếu là những khái niệm đã có trong tư tưởng đạo đức truyền thống Việt Nam và phương Đông được Hồ Chí Minh sử dụng và đưa vào nội dung mới.","Hồ Chí Minh đưa vào trong khái niệm cũ một nội dung mới: Trung với nước, hiếu với dân. Đầu năm 1946, Người chỉ rõ: “Đạo đức, ngày trước thì chỉ trung với vua, hiếu với cha mẹ. Ngày nay, thời đại mới, đạo đức cũng phải mới. Phải trung với nước, phải hiếu với toàn dân, với đồng bào”.","- Nội dung chủ yếu của trung với nước là:","+ Trong quan hệ với cá nhân, cộng đồng và xã hội phải biết đặt lợi ích của Đảng, Tổ quốc, cách mạng lên trên hết, trước hết.","+ Quyết tâm phấn đấu thực hiện mục tiêu cách mạng.","+ Thực hiện tốt mọi chủ trương, chính sách của Đảng và Nhà nước.","- Nội dung chủ yếu của hiếu với dân là:","+ Khẳng định vai trò sức mạnh thật sự của nhân dân.","+ Tin dân, học dân, lắng nghe ý kiến của nhân dân, tôn trọng quyền làm chủ của nhân dân, gắn bó mật thiết với nhân dân.","+ Chăm lo đời sống vật chất và tinh thần của nhân dân.","Cần, kiệm, liêm, chính, chí công vô tư là nội dung cốt lõi của đạo đức cách mạng; đây là những phẩm chất gắn với sinh hoạt và hoạt động hàng ngày nên được Hồ Chí Minh đề cập tới nhiều nhất và thường xuyên nhất, từ những tác phẩm đầu tiên Đường cách mệnh cho đến bản Di chúc.","- Cần là siêng năng, chăm chỉ, cố gắng, dẻo dai.","- Kiệm là tiết kiệm vật tư, tiền bạc, của cải, thời gian, không xa xỉ, không hoang phí, không bừa bãi.","- Liêm là trong sạch, không tham lam.","- Chính là không tà, thẳng thắn, đứng đắn.","Cần, kiệm, liêm, chính trước hết có ý nghĩa quan trọng đối với mỗi cá nhân, là thước đo tính người:","“Trời có bốn mùa: Xuân, Hạ, Thu, Đông / Đất có bốn phương: Đông, Tây, Nam, Bắc / Người có bốn đức: Cần, Kiệm, Liêm, Chính / Thiếu một mùa thì không thành trời / Thiếu một phương thì không thành đất / Thiếu một đức thì không thành người”","Chí công vô tư, về thực chất, là sự tiếp nối của cần kiệm liêm chính. Chí công vô tư nghĩa là phải là đặt lợi ích chung lên trên hết, trước hết; kiên quyết chống chủ nghĩa cá nhân.","Tuy nhiên, Người cũng nhấn mạnh, đấu tranh chống chủ nghĩa cá nhân không có nghĩa là giày xéo lên lợi ích cá nhân, mà phải quan tâm, bảo vệ lợi ích cá nhân chính đáng của con người.","Theo Hồ Chí Minh, người cách mạng là người giàu tình cảm, có tình cảm mới đi làm cách mạng. Có lẽ, vì yêu thương đồng bào của mình mà Hồ Chí Minh sẵn sàng chấp nhận mọi gian khổ, hy sinh, để đem lại độc lập, tự do, hạnh phúc cho nhân dân.","+ Tình yêu thương con người là một tình cảm rộng lớn, trước hết dành cho những người cùng khổ, những người bị áp bức, bóc lột không phân biệt màu da, dân tộc.","Chủ nghĩa quốc tế là một trong những phẩm chất quan trọng nhất của đạo đức cộng sản chủ nghĩa. Điều này bắt nguồn từ bản chất giai cấp công nhân, nhằm vào mối quan hệ rộng lớn vượt ra khỏi giới hạn quốc gia - dân tộc.","Hồ Chí Minh nêu cao tinh thần độc lập, tự chủ, tự cường, nhưng luôn kêu gọi phải tăng cường đoàn kết, hợp tác quốc tế, đồng thời ủng hộ và giúp đỡ đối với các cuộc đấu tranh của nhân dân các nước vì hòa bình, độc lập dân tộc, dân chủ và tiến bộ xã hội."],"giaoTrinh":["Trung với nước, hiếu với dân là phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác.","Trung và hiếu là những khái niệm đạo đức cũ đã có từ lâu trong tư tưởng đạo đức truyền thống Việt Nam và phương Đông, phản ánh mối quan hệ lớn nhất và cũng là phẩm chất bao trùm nhất: “Trung với vua, hiếu với cha mẹ”. Phẩm chất này được Hồ Chí Minh sử dụng với những nội dung mới, rộng lớn: “Trung với nước, hiếu với dân”, đã tạo nên một cuộc cách mạng sâu sắc trong lĩnh vực đạo đức. Đầu năm 1946, Người chỉ rõ: “Đạo đức, ngày trước thì chỉ trung với vua, hiếu với cha mẹ. Ngày nay, thời đại mới, đạo đức cũng phải mới. Phải trung với nước. Phải hiếu với toàn dân, với đồng bào”.","Hồ Chí Minh cho rằng, trung với nước phải gắn liền hiếu với dân. Trung với nước, là phải yêu nước, tuyệt đối trung thành với Tổ quốc, suốt đời phấn đấu cho Đảng, cho cách mạng, phải làm cho “dân giàu, nước mạnh”. Hiếu với dân là phải thương dân, tin dân, thân dân, học hỏi dân, lấy trí tuệ ở dân, kính trọng dân, lấy dân làm gốc, “hết lòng hết sức phục vụ nhân dân. Phải yêu kính nhân dân. Phải thật sự tôn trọng quyền làm chủ của nhân dân. Tuyệt đối không được lên mặt “quan cách mạng” ra lệnh ra oai”.","Cần, kiệm, liêm, chính, chí công vô tư là nội dung cốt lõi của đạo đức cách mạng, đó là phẩm chất đạo đức gắn liền với hoạt động hằng ngày của mỗi người. Vì vậy, Hồ Chí Minh đề cập về phẩm chất này nhiều nhất, thường xuyên nhất, phản ánh ngay từ cuốn sách Đường cách mệnh cho đến bản Di chúc.","“Cần tức là siêng năng, chăm chỉ, cố gắng dẻo dai... Muốn cho chữ Cần có nhiều kết quả hơn, thì phải có kế hoạch cho mọi công việc”. Cần tức là lao động cần cù, siêng năng; lao động có kế hoạch, sáng tạo, có năng suất cao; lao động với tinh thần tự lực cánh sinh, không lười biếng. Phải thấy rõ, “Lao động là nghĩa vụ thiêng liêng, là nguồn sống, nguồn hạnh phúc của chúng ta”.","“Kiệm là thế nào? Là tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi. CẦN với KIỆM phải đi đôi với nhau, như hai chân của con người”.","Liêm “là trong sạch, không tham lam... Chữ LIÊM phải đi đôi với chữ KIỆM. Cũng như chữ KIỆM phải đi với chữ CẦN. Có KIỆM mới LIÊM được”; “Liêm là không tham địa vị. Không tham tiền tài. Không tham sung sướng. Không ham người tâng bốc mình. Vì vậy mà quang minh chính đại, không bao giờ hủ hóa. Chỉ có một thứ ham là ham học, ham làm, ham tiến bộ”.","“Chính nghĩa là không tà, nghĩa là thẳng thắn, đứng đắn. Điều gì không đứng đắn, thẳng thắn, tức là tà”.","Chí công vô tư là hoàn toàn vì lợi ích chung, không vì tư lợi; là hết sức công bằng, không chút thiên tư, thiên vị, công tâm, luôn đặt lợi ích của Đảng, của nhân dân, của dân tộc lên trên hết, trước hết; chỉ biết vì Đảng, vì dân tộc, “lo trước thiên hạ, vui sau thiên hạ”. Chí công vô tư là chống chủ nghĩa cá nhân.","Hồ Chí Minh coi cần, kiệm, liêm, chính là bốn đức tính cơ bản của con người, giống như bốn mùa của trời, bốn phương của đất; “Thiếu một đức, thì không thành người”.","Theo Hồ Chí Minh, người cách mạng là người giàu tình cảm, có tình cảm cách mạng mới đi làm cách mạng. Vì yêu thương nhân dân, yêu thương con người mà Hồ Chí Minh sẵn sàng chấp nhận mọi gian khổ, hy sinh để đem lại độc lập cho dân tộc, tự do, hạnh phúc cho con người.","Chủ nghĩa quốc tế là một trong những phẩm chất quan trọng nhất của đạo đức cộng sản chủ nghĩa. Điều này được bắt nguồn từ bản chất của giai cấp công nhân, nhằm vào mối quan hệ rộng lớn vượt ra khỏi giới hạn quốc gia - dân tộc."],"y":[{"ten":"Trung với nước, hiếu với dân là phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác","goiY":"Đọc lại câu mở đầu mục: phẩm chất nào bao trùm, quan trọng nhất?","khoa":[["trung voi nuoc"],["hieu voi dan"],["bao trum"]]},{"ten":"Người đưa nội dung mới vào khái niệm cũ: ngày trước trung với vua, hiếu với cha mẹ; ngày nay phải trung với nước, hiếu với toàn dân","goiY":"Đọc lại lời Người nói đầu năm 1946 về đạo đức ngày trước và ngày nay.","khoa":[["noi dung moi"],["trung voi vua"],["cha me"]]},{"ten":"Cần, kiệm, liêm, chính, chí công vô tư là nội dung cốt lõi của đạo đức cách mạng","goiY":"Đọc lại câu mở đầu phần b: nội dung cốt lõi của đạo đức cách mạng là gì?","khoa":[["chi cong vo tu"],["can","kiem","liem","chinh"],["cot loi"]]},{"ten":"Cần, kiệm, liêm, chính là bốn đức tính cơ bản của con người; thiếu một đức thì không thành người","goiY":"Đọc lại câu so sánh với bốn mùa của trời, bốn phương của đất.","khoa":[["thieu mot duc"],["khong thanh nguoi"],["bon duc"]]},{"ten":"Thương yêu con người, sống có tình có nghĩa","goiY":"Đọc lại phần c: người cách mạng là người thế nào về tình cảm?","khoa":[["thuong yeu"],["yeu thuong"],["tinh co nghia"],["thuong nguoi"]]},{"ten":"Tinh thần quốc tế trong sáng","goiY":"Đọc lại phần d: chủ nghĩa yêu nước kết hợp với tinh thần gì?","khoa":[["quoc te"]]}]},{"ma":"II.3","ten":"Ba nguyên tắc xây dựng đạo đức","baiGiang":["- Nói đi đôi với làm là nét đẹp của truyền thống văn hóa phương Đông. Hồ Chí Minh khẳng định: “Nói chung thì các dân tộc phương Đông đều giàu tình cảm, và đối với họ một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền”.","Nói đi đôi với làm là nguyên tắc quan trọng bậc nhất trong xây dựng nền đạo đức mới; là sự thống nhất giữa lý luận và thực tiễn, trở thành phương pháp luận trong cuộc sống và là nền tảng triết lý sống hết sức bình dị và sâu sắc của Hồ Chí Minh. Bản thân Hồ Chí Minh cũng là một tấm gương đạo đức mẫu mực.","Đạo đức mới, đạo đức cách mạng thì nói phải đi đôi với làm, chống lại tư tưởng và hành động: nói nhiều làm ít, nói mà không làm, thậm chí nói một đằng làm một nẻo. Nói đi đôi với làm còn nhằm chống thói đạo đức giả.","- Sự nêu gương về đạo đức giữ vai trò rất quan trọng trong hình thành đạo đức xã hội, đặc biệt với người phương Đông. Vì thế:","+ Phải thực hành nêu gương ở mọi cấp độ, mọi nơi, mọi lúc: (1) Cán bộ lãnh đạo phải nêu gương cho cán bộ thường. (2) Cán bộ phải nêu gương cho nhân dân, phải “làm mực thước cho nhân dân bắt chước”. (3) Người trên phải nêu gương cho người dưới.","+ Phải phát động phong trào người tốt việc tốt và nhân rộng các điển hình tiên tiến.","- Nêu gương về đạo đức: Là nét đẹp của truyền thống văn hóa phương Đông. Lời nói đi đôi với việc làm phải gắn liền với nêu gương về đạo đức.","Xây dựng đạo đức là quá trình kết hợp chặt chẽ giữa xây và chống. Xây tức là xây dựng các giá trị, các chuẩn mực đạo đức mới; chống là chống cái ác, các biểu hiện, các hành vi vô đạo đức, những biểu hiện suy thoái về đạo đức.","Theo Hồ Chí Minh: “Mỗi con người đều có thiện và ác ở trong lòng. Ta phải biết làm cho phần tốt ở trong mỗi con người nảy nở như hoa mùa Xuân và phần xấu bị mất dần đi, đó là thái độ của người cách mạng”.","Về mối quan hệ giữa “Xây” và “Chống”: (1) xây phải đi đôi với chống, chống nhằm mục đích xây, lấy xây làm chính; (2) phải phát hiện sớm những cái xấu, cái sai để có hướng ngăn chặn.","- Tu dưỡng đạo đức suốt đời là một truyền thống tốt đẹp của dân tộc Việt Nam và của văn hóa phương Đông.","Đạo đức cách mạng, đạo đức mới khác với đạo đức cũ ở chỗ nó gắn với thực tiễn cách mạng và phục vụ cách mạng, phục vụ nhân dân, vì vậy tu dưỡng đạo đức là một trong những yêu cầu có ý nghĩa quan trọng hàng đầu. Người cho rằng: “Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hàng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong”.","- Vì sao phải tu dưỡng:","+ Bởi vì ai cũng có chỗ hay, chỗ dở, chỗ xấu, chỗ tốt. “Phải đánh thắng lòng tà là kẻ thù trong mình”.","+ Bởi cách mạng là không ngừng, người cán bộ giữ nhiều địa vị khác nhau, thực hiện các nhiệm vụ khác nhau nên phải không ngừng điều chỉnh hành vi để hoàn thành nhiệm vụ được giao.","⇒ Đây là cuộc cách mạng trường kỳ mà mỗi người phải tự giác tiến hành.","- Vậy tu dưỡng bằng cách nào?","+ Phải thường xuyên thực hiện công tác tự phê bình","+ Việc tu dưỡng phải được thực hiện trên tinh thần tự giác.","+ Các tổ chức, đoàn thể phải thường xuyên giúp đỡ, tạo điều kiện cho mỗi con người phấn đấu rèn luyện."],"giaoTrinh":["Nói đi đôi với làm là nét đẹp trong đạo đức truyền thống của dân tộc được Hồ Chí Minh nâng lên một tầm cao mới.","Người coi đây là nguyên tắc quan trọng bậc nhất trong xây dựng nền đạo đức mới. Trong tác phẩm Đường cách mệnh, khi đề cập tư cách một người cách mệnh, Hồ Chí Minh yêu cầu: “Nói thì phải làm”.","Nêu gương về đạo đức là một nét đẹp của truyền thống văn hóa phương Đông. Lời nói đi đôi với việc làm phải gắn liền với nêu gương về đạo đức. Hồ Chí Minh đã viết: “Nói chung thì các dân tộc phương Đông đều giàu tình cảm, và đối với họ một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền”.","Hồ Chí Minh cho rằng, nguyên tắc xây đi đôi với chống là đòi hỏi của nền đạo đức mới, thể hiện tính nhân đạo chiến đấu vì mục tiêu của sự nghiệp cách mạng; xây tức là xây dựng các giá trị, các chuẩn mực đạo đức mới; chống là chống các biểu hiện, các hành vi vô đạo đức, suy thoái đạo đức.","Xây phải đi đôi với chống, muốn xây phải chống, chống nhằm mục đích xây, lấy xây làm chính.","Hồ Chí Minh cho rằng, trên con đường đi tới tiến bộ và cách mạng, đạo đức mới chỉ có thể được xây dựng thành công trên cơ sở kiên trì mục tiêu chống chủ nghĩa đế quốc, chống những thói quen và tập tục lạc hậu, phải loại trừ chủ nghĩa cá nhân.","Trong bài Chống quan liêu, tham ô, lãng phí (năm 1952), Hồ Chí Minh chỉ rõ: “Quan liêu, tham ô, lãng phí là tội ác. Phải tẩy sạch nó để thực hiện cần kiệm liêm chính”. Nguồn gốc của mọi thứ tệ nạn là chủ nghĩa cá nhân. Tuy nhiên, Người lưu ý: “Đấu tranh chống chủ nghĩa cá nhân không phải là “giày xéo lên lợi ích cá nhân””.","Theo Hồ Chí Minh, tu dưỡng đạo đức như một cuộc cách mạng trường kỳ, gian khổ. Một nền đạo đức mới chỉ có thể được xây dựng trên cơ sở tự giác tu dưỡng đạo đức của mỗi người. Hồ Chí Minh quan tâm phải làm thế nào để mỗi người tự nhận thấy sâu sắc việc trau dồi đạo đức cách mạng là một việc phải kiên trì, thường xuyên, liên tục. Người nhắc lại luận điểm của Khổng Tử “chính tâm, tu thân”; “tề gia, trị quốc, bình thiên hạ”, và nêu rõ: “Chính tâm tu thân tức là cải tạo. Cải tạo cũng phải trường kỳ gian khổ, vì đó là một cuộc cách mạng trong bản thân của mỗi người. Bồi dưỡng tư tưởng mới để đánh thắng tư tưởng cũ, đoạn tuyệt với con người cũ để trở thành con người mới không phải là một việc dễ dàng... Dù khó khăn gian khổ, nhưng muốn cải tạo thì nhất định thành công”.","Đạo đức cách mạng thể hiện trong hành động của người Việt Nam yêu nước vì độc lập, tự do của dân tộc, hạnh phúc của nhân dân. Chỉ có trong hành động, đạo đức cách mạng mới bộc lộ rõ những giá trị của nó. Do vậy, đạo đức cách mạng đòi hỏi mỗi người phải tự giác rèn luyện thông qua các hoạt động thực tiễn, trong công việc, trong các mối quan hệ của mình, phải nhìn thẳng vào mình, không tự lừa dối, huyễn hoặc; phải thấy rõ cái hay, cái tốt, cái thiện của mình để phát huy và thấy rõ cái dở, cái xấu, cái ác của mình để khắc phục; phải kiên trì rèn luyện liên tục, tu dưỡng suốt đời, trong đó, thời tuổi trẻ đặc biệt quan trọng. Đạo đức không phải là cái gì đó có tính “nhất thành bất biến”, mà nó được hình thành, phát triển do môi trường giáo dục, do sự rèn luyện, phấn đấu và tu dưỡng bản thân của mỗi người. Từ thực tiễn, Người tổng kết sâu sắc: “Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong”."],"y":[{"ten":"Nói đi đôi với làm, nêu gương về đạo đức là nguyên tắc quan trọng bậc nhất trong xây dựng nền đạo đức mới","goiY":"Đọc lại phần a: nguyên tắc nào được coi là quan trọng bậc nhất, và vì sao một tấm gương sống có giá trị hơn một trăm bài diễn văn?","khoa":[["di doi voi lam"],["noi thi phai lam"],["neu guong"],["lam guong"]]},{"ten":"Xây đi đôi với chống, muốn xây phải chống, chống nhằm mục đích xây, lấy xây làm chính","goiY":"Đọc lại phần b: xây là gì, chống là gì, cái nào làm chính?","khoa":[["xay di doi voi chong"],["xay","chong"]]},{"ten":"Phải kiên quyết quét sạch chủ nghĩa cá nhân, nguồn gốc của mọi thứ tệ nạn","goiY":"Đọc lại đoạn về quan liêu, tham ô, lãng phí: nguồn gốc của mọi thứ tệ nạn là gì?","khoa":[["chu nghia ca nhan"],["ca nhan chu nghia"]]},{"ten":"Tu dưỡng đạo đức như một cuộc cách mạng trường kỳ, gian khổ; nền đạo đức mới chỉ có thể được xây dựng trên cơ sở tự giác tu dưỡng đạo đức của mỗi người","goiY":"Đọc lại câu mở đầu phần c và lời Người giải thích \"chính tâm tu thân tức là cải tạo\".","khoa":[["truong ky"],["tu giac tu duong"],["chinh tam tu than"],["cai tao"]]},{"ten":"Đạo đức cách mạng thể hiện trong hành động; mỗi người phải tự giác rèn luyện thông qua hoạt động thực tiễn, kiên trì tu dưỡng suốt đời, trong đó thời tuổi trẻ đặc biệt quan trọng","goiY":"Đọc lại đoạn nói đạo đức cách mạng chỉ bộc lộ giá trị ở đâu, và thời nào của đời người đặc biệt quan trọng.","khoa":[["suot doi"],["tuoi tre"],["hoat dong thuc tien"],["trong hanh dong"]]},{"ten":"Đạo đức cách mạng không phải trên trời sa xuống, mà do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố","goiY":"Đọc lại câu Người tổng kết có hình ảnh ngọc và vàng.","khoa":[["tren troi"],["ren luyen ben bi"],["ngoc cang mai"]]}]}]},{"ma":"thu","ten":"MÙA THU","phan":"III. Con người","thua":[{"ma":"III.1","ten":"Quan niệm về con người","baiGiang":["Tiếp thu quan niệm về con người của chủ nghĩa Mác - Lênin về bản chất xã hội của con người: “Trong tính hiện thực của nó, bản chất con người là tổng hòa của các mối quan hệ xã hội”, Hồ Chí Minh nhìn nhận con người như một chỉnh thể có sự thống nhất giữa yếu tố sinh học và yếu tố xã hội. Hồ Chí Minh cho rằng: “Chữ người, nghĩa hẹp là gia đình, anh em, họ hàng, bầu bạn. Nghĩa rộng là đồng bào cả nước. Rộng nữa là cả loài người”.","Hồ Chí Minh ít dùng khái niệm con người một cách chung chung, trừu tượng. Con người trong Tư tưởng Hồ Chí Minh thường mang tính lịch sử - cụ thể gắn liền với từng thời kỳ cách mạng. Người dùng khái niệm này hay khái niệm khác để chỉ “con người” và xem xét nó trong những bình diện, chiều cạnh khác nhau.","Thời kỳ trước cách mạng tháng Tám, Người thường nói đến các cụm từ “người nô lệ”, “người bóc lột”, “người cùng khổ”, “người mất nước”…","Từ sau cách mạng tháng Tám, Người thường dùng các khái niệm “đồng bào”, “quốc dân”, nhân dân lao động, “người lao động”, dân…","Thời kỳ từ sau năm 1954, khi miền Bắc hoàn thành công cuộc cải cách ruộng đất và cải tạo xã hội chủ nghĩa, Hồ Chí Minh thường dùng những khái niệm phù hợp với những quan hệ xã hội mới: “người chủ xã hội”, “lao động trí óc”, “lao động chân tay”, “người chủ tập thể”…","Người thường xem con người trong các mối quan hệ xã hội, trong các quan hệ giai cấp; theo giới tính, lứa tuổi, nghề nghiệp; trong khối thống nhất của cộng đồng dân tộc và quan hệ quốc tế.","Con người là cốt lõi của tư tưởng nhân văn Hồ Chí Minh được thể hiện ở ba phương diện:","+ Sự cảm nhận, cảm thông hết sức sâu sắc với mọi niềm đau nỗi khổ của con người nô lệ và con người cùng khổ.","+ Quyết tâm chiến đấu để giải phóng con người và đem lại cuộc sống tự do, hạnh phúc cho con người.","+ Tin tưởng tuyệt đối ở khả năng tự giải phóng của con người."],"giaoTrinh":["Theo Hồ Chí Minh, con người là một chỉnh thể, thống nhất về trí lực, tâm lực, thể lực, đa dạng bởi mối quan hệ giữa cá nhân và xã hội (quan hệ gia đình, dòng tộc, làng xã, quan hệ giai cấp, dân tộc...) và các mối quan hệ xã hội (quan hệ chính trị, văn hóa, đạo đức, tôn giáo...). Trong mỗi con người đều có tính tốt và tính xấu. Người giải thích, “chữ người, nghĩa hẹp là gia đình, anh em, họ hàng, bè bạn; nghĩa rộng là đồng bào cả nước; rộng hơn nữa là cả loài người”. Con người có tính xã hội, là con người xã hội, thành viên của một cộng đồng xã hội.","Hồ Chí Minh cũng chỉ ra yếu tố sinh vật của con người. Theo Người, “dân dĩ thực vi thiên”; “dân chỉ biết rõ giá trị của tự do, của độc lập khi mà dân được ăn no, mặc đủ”. Theo Người, trong mọi đường lối, chủ trương, chính sách, nhiệm vụ phải thực hiện ngay làm cho dân có ăn, có mặc, có chỗ ở, có học hành.","Trong thực tiễn, con người có nhiều chiều quan hệ: quan hệ với cộng đồng xã hội (là một thành viên); quan hệ với một chế độ xã hội (làm chủ hay bị áp bức); quan hệ với tự nhiên (một bộ phận không tách rời).","Xa lạ với con người trừu tượng, phi nguồn gốc lịch sử, Hồ Chí Minh nhìn nhận con người lịch sử - cụ thể về giới tính, lứa tuổi, nghề nghiệp, chức vụ, vị trí, đảng viên, công dân..., trong từng giai đoạn lịch sử cụ thể.","Nét đặc sắc trong quan niệm của Hồ Chí Minh về con người là nhìn nhận đặc điểm con người Việt Nam với những điều kiện lịch sử cụ thể, với những cấu trúc kinh tế, xã hội cụ thể. Cách tiếp cận này đi đến việc giải quyết mối quan hệ dân tộc và giai cấp rất sáng tạo, không chỉ về mặt đường lối cách mạng mà cả về mặt con người."],"y":[{"ten":"Con người là một chỉnh thể, thống nhất về trí lực, tâm lực, thể lực","goiY":"Đọc lại câu đầu của phần giáo trình: con người là một chỉnh thể thống nhất về những gì?","khoa":[["chinh the"],["tri luc"],["tam luc"],["the luc"]]},{"ten":"Con người đa dạng bởi mối quan hệ giữa cá nhân và xã hội và các mối quan hệ xã hội","goiY":"Đọc tiếp câu ấy: con người đa dạng bởi những mối quan hệ nào?","khoa":[["ca nhan va xa hoi"],["quan he xa hoi"]]},{"ten":"Trong mỗi con người đều có tính tốt và tính xấu","goiY":"Tìm câu nói trong mỗi con người đều có những tính gì.","khoa":[["tinh tot"],["tinh xau"],["thien va ac"]]},{"ten":"Chữ người, nghĩa hẹp là gia đình, anh em, họ hàng, bè bạn; nghĩa rộng là đồng bào cả nước; rộng hơn nữa là cả loài người","goiY":"Đọc lại lời Người giải thích chữ \"người\" theo nghĩa hẹp và nghĩa rộng.","khoa":[["nghia hep"],["nghia rong"],["dong bao ca nuoc"],["loai nguoi"]]},{"ten":"Con người có tính xã hội và có yếu tố sinh vật: dân dĩ thực vi thiên","goiY":"Đọc lại đoạn Hồ Chí Minh chỉ ra yếu tố sinh vật của con người.","khoa":[["sinh vat"],["sinh hoc"],["di thuc vi thien"],["an no"]]},{"ten":"Hồ Chí Minh nhìn nhận con người lịch sử - cụ thể, xa lạ với con người trừu tượng","goiY":"Đọc lại đoạn Người xem xét con người trong từng giai đoạn lịch sử.","khoa":[["lich su cu the"],["truu tuong"]]}]},{"ma":"III.2","ten":"Vai trò của con người","baiGiang":["- Chủ nghĩa Mác - Lênin khẳng định: “Quần chúng nhân dân là người sáng tạo ra lịch sử”.","- Hồ Chí Minh chỉ ra:","+ Vai trò của con người trong xã hội: “Vô luận việc gì, đều do người làm ra, và từ nhỏ đến to, từ gần đến xa, đều thế cả”.","+ Vai trò của nhân dân trong sự nghiệp cách mạng: “Gốc có vững, cây mới bền/ Xây lầu thắng lợi trên nền nhân dân”.","- Mục tiêu cách mạng của Hồ Chí Minh là giải phóng dân tộc, giải phóng xã hội, giải phóng con người. Giải phóng con người, đem lại tự do, hạnh phúc cho con người là mục tiêu triệt để nhất của mọi cuộc cách mạng: “Nếu nước độc lập mà dân không hưởng hạnh phúc, tự do, thì độc lập cũng chẳng có nghĩa lý gì”.","Khi xác định con người là mục tiêu thì mọi đường lối, chủ trương của Đảng và nhà nước đều phải xuất phát từ nhu cầu, lợi ích chính đáng của con người, nhằm phát huy mọi năng lực của con người.","- Con người là động lực của cách mạng: Theo Hồ Chí Minh, con người là vốn quý nhất, là động lực quyết định thành công của sự nghiệp cách mạng. Người nhấn mạnh: “mọi việc đều do người làm ra”; “Trong bầu trời không gì quý bằng nhân dân. Trong thế giới không gì mạnh bằng lực lượng đoàn kết của nhân dân”; “Ý dân là ý trời”, “Dễ trăm lần không dân cũng chịu, khó vạn lần dân liệu cũng xong”… Người nhiều lần khẳng định “cách mạng là sự nghiệp của quần chúng”. Nhân dân là những người sáng tạo chân chính ra lịch sử thông qua các hoạt động thực tiễn cơ bản như lao động sản xuất, đấu tranh chính trị - xã hội, sáng tạo ra các giá trị văn hóa.","Hồ Chí Minh cũng nhấn mạnh con người là động lực chỉ khi được giác ngộ, được giáo dục, được tổ chức."],"giaoTrinh":["- Con người là mục tiêu của cách mạng. Con người là chiến lược đầu tiên trong tư tưởng và hành động của Hồ Chí Minh. Mục tiêu này được cụ thể hóa trong ba giai đoạn cách mạng (giải phóng dân tộc - xây dựng chế độ dân chủ nhân dân - tiến dần lên xã hội chủ nghĩa) nhằm giải phóng dân tộc, giải phóng xã hội, giải phóng giai cấp, giải phóng con người.","Giải phóng dân tộc là xóa bỏ ách thống trị của chủ nghĩa đế quốc, giành lại độc lập cho dân tộc. Con người trong giải phóng dân tộc là cả cộng đồng dân tộc Việt Nam. Phạm vi thế giới là giải phóng các dân tộc thuộc địa.","Giải phóng xã hội là đưa xã hội phát triển thành một xã hội không có chế độ người bóc lột người, một xã hội có nền sản xuất phát triển cao và bền vững, văn hóa tiên tiến, mọi người là chủ và làm chủ xã hội, có cuộc sống ấm no, tự do, hạnh phúc, một xã hội văn minh, tiến bộ. Xã hội đó phát triển cao nhất là xã hội cộng sản, giai đoạn đầu là xã hội xã hội chủ nghĩa.","Giải phóng giai cấp là xóa bỏ sự áp bức, bóc lột của giai cấp này đối với giai cấp khác; xóa bỏ sự bất công, bất bình đẳng xã hội; xóa bỏ nền tảng kinh tế - xã hội đẻ ra sự bóc lột giai cấp; dần dần thủ tiêu sự khác biệt giai cấp, các điều kiện dẫn đến sự phân chia xã hội thành giai cấp và xác lập một xã hội không có giai cấp. Con người trong giải phóng xã hội là các giai cấp cần lao, trước hết là giai cấp công nhân và giai cấp nông dân. Phạm vi thế giới là giải phóng giai cấp vô sản và nhân dân lao động các nước.","Giải phóng con người là xóa bỏ tình trạng áp bức, bóc lột, nô dịch con người; xóa bỏ các điều kiện xã hội làm tha hóa con người, làm cho mọi người được hưởng tự do, hạnh phúc, có điều kiện phát huy khả năng sáng tạo, làm chủ xã hội, làm chủ tự nhiên và làm chủ bản thân, phát triển toàn diện theo đúng bản chất tốt đẹp của con người. Con người trong giải phóng con người là cá nhân mỗi con người. Phạm vi thế giới là giải phóng loài người.","Các “giải phóng” đó kết hợp chặt chẽ với nhau, giải phóng dân tộc đã có một phần giải phóng xã hội và giải phóng con người; đồng thời nối tiếp nhau, giải phóng dân tộc mở đường cho giải phóng xã hội, giải phóng giai cấp và giải phóng con người.","- Con người là động lực của cách mạng. Theo Hồ Chí Minh, con người là vốn quý nhất, động lực, nhân tố quyết định thành công của sự nghiệp cách mạng. Người nhấn mạnh: “mọi việc đều do người làm ra”; “trong bầu trời không gì quý bằng nhân dân. Trong thế giới không gì mạnh bằng sức mạnh đoàn kết của nhân dân”.","Cách mạng là sự nghiệp của quần chúng. Nhân dân là những người sáng tạo chân chính ra lịch sử thông qua các hoạt động thực tiễn cơ bản nhất như lao động sản xuất, đấu tranh chính trị - xã hội, sáng tạo ra các giá trị văn hóa. Nói đến nhân dân là nói đến lực lượng, trí tuệ, quyền hành, lòng tốt, niềm tin, đó chính là gốc, động lực cách mạng."],"y":[{"ten":"Con người là mục tiêu của cách mạng","goiY":"Đọc lại câu mở đầu: con người là gì của cách mạng?","khoa":[["muc tieu"]]},{"ten":"Mục tiêu ấy là giải phóng dân tộc, giải phóng xã hội, giải phóng giai cấp, giải phóng con người","goiY":"Đọc lại câu nói mục tiêu được cụ thể hóa trong ba giai đoạn cách mạng nhằm những sự giải phóng nào.","khoa":[["giai phong","giai cap"]],"nhom":{"tu":["giai phong dan toc","giai phong xa hoi","giai phong giai cap","giai phong con nguoi"],"toiThieu":3}},{"ten":"Giải phóng con người là xóa bỏ tình trạng áp bức, bóc lột, nô dịch con người, làm cho mọi người được hưởng tự do, hạnh phúc, phát triển toàn diện","goiY":"Đọc lại định nghĩa \"giải phóng con người\".","khoa":[["ap buc"],["boc lot"],["tu do","hanh phuc"],["toan dien"]]},{"ten":"Con người là động lực của cách mạng","goiY":"Đọc lại phần thứ hai: ngoài mục tiêu, con người còn là gì của cách mạng?","khoa":[["dong luc"]]},{"ten":"Con người là vốn quý nhất, nhân tố quyết định thành công của sự nghiệp cách mạng","goiY":"Đọc lại câu \"mọi việc đều do người làm ra\" và câu đứng trước nó.","khoa":[["von quy"],["nhan to quyet dinh"],["quyet dinh thanh cong"]]},{"ten":"Cách mạng là sự nghiệp của quần chúng; nhân dân là những người sáng tạo chân chính ra lịch sử","goiY":"Đọc lại đoạn cuối về vai trò của nhân dân đối với lịch sử.","khoa":[["su nghiep cua quan chung"],["sang tao","lich su"],["quan chung"]]}]},{"ma":"III.3","ten":"Xây dựng con người","baiGiang":["Xây dựng con người là yêu cầu khách quan của sự nghiệp cách mạng, vừa cấp bách, vừa lâu dài, có ý nghĩa chiến lược. Xây dựng con người là một trọng tâm, bộ phận hợp thành của chiến lược phát triển đất nước, có mối quan hệ chặt chẽ với nhiệm vụ xây dựng chính trị, kinh tế, văn hóa, xã hội.","Hồ Chí Minh quan niệm: “Vì lợi ích mười năm thì phải trồng cây, vì lợi ích trăm năm thì phải trồng người”. Theo Người, “trồng người” là một công việc lâu dài, gian khổ, vừa vì lợi ích trước mắt, vừa vì lợi ích lâu dài; công việc “trồng người” là trách nhiệm của Đảng, Nhà nước, các đoàn thể chính trị - xã hội, kết hợp với tính tích cực, chủ động của từng người.","Hồ Chí Minh quan tâm xây dựng con người toàn diện vừa “hồng” vừa “chuyên”. Đó là những con người có mục đích và lối sống cao đẹp, có bản lĩnh chính trị vững vàng, những con người của chủ nghĩa xã hội, có tư tưởng, tác phong và đạo đức xã hội chủ nghĩa và năng lực làm chủ.","Hồ Chí Minh nêu lên quan điểm về xây dựng con người một cách toàn diện với những khía cạnh chủ yếu sau:","+ Có ý thức làm chủ, tinh thần tập thể, có tư tưởng “mình vì mọi người, mọi người vì mình”.","+ Cần kiệm xây dựng đất nước, hăng hái bảo vệ Tổ quốc.","+ Có lòng yêu nước nồng nàn, tinh thần quốc tế trong sáng.","+ Có phương pháp làm việc khoa học, phong cách quần chúng, dân chủ, nêu gương…","Hồ Chí Minh đặc biệt quan tâm đến việc nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân; bồi dưỡng về năng lực trí tuệ, trình độ lý luận chính trị, văn hóa, khoa học - kỹ thuật, chuyên môn, nghiệp vụ, ngoại ngữ, nâng cao sức khỏe.","Mỗi người tự rèn luyện, tu dưỡng ý thức, kết hợp chặt chẽ với xây dựng cơ chế, tính khoa học của bộ máy và tạo dựng nền dân chủ. Việc nêu gương, nhất là người đứng đầu, có ý nghĩa rất quan trọng. Biện pháp giáo dục có một vị trí quan trọng. Chú trọng vai trò của tổ chức Đảng, chính quyền, đoàn thể quần chúng. Các phương pháp cụ thể: Học đi đôi với hành, Lý luận gắn với thực tiễn, nói đi đôi với làm, học và chơi, bồi dưỡng và thi đua; giáo dục thông qua tổ chức, đoàn thể, kết hợp giáo dục nhà trường- gia đình- xã hội, phát huy ý thức tự giáo dục, tự rèn luyện, nêu gương."],"giaoTrinh":["Xây dựng con người là yêu cầu khách quan của sự nghiệp cách mạng, vừa cấp bách vừa lâu dài, có ý nghĩa chiến lược. Xây dựng con người là một trọng tâm, bộ phận hợp thành của chiến lược phát triển đất nước, có mối quan hệ chặt chẽ với nhiệm vụ xây dựng chính trị, kinh tế, văn hóa, xã hội. Hồ Chí Minh nêu hai quan điểm nổi bật làm sáng tỏ sự cần thiết xây dựng con người.","“Vì lợi ích trăm năm thì phải “trồng người””. “Trồng người” là công việc lâu dài, gian khổ, vừa vì lợi ích trước mắt vừa vì lợi ích lâu dài, là công việc của văn hóa giáo dục. Công việc “trồng người” là trách nhiệm của Đảng, Nhà nước, các đoàn thể chính trị - xã hội kết hợp với tính tích cực, chủ động của từng người.","“Muốn xây dựng chủ nghĩa xã hội, trước hết cần phải có những con người xã hội chủ nghĩa”. Việc xây dựng con người xã hội chủ nghĩa được đặt ra ngay từ đầu và phải được quan tâm trong suốt tiến trình xây dựng chủ nghĩa xã hội.","Hồ Chí Minh quan tâm xây dựng con người toàn diện vừa “hồng” vừa “chuyên”. Đó là những con người có mục đích và lối sống cao đẹp, có bản lĩnh chính trị vững vàng, những con người của chủ nghĩa xã hội, có tư tưởng, tác phong và đạo đức xã hội chủ nghĩa và năng lực làm chủ. Xây dựng con người toàn diện với những khía cạnh chủ yếu sau:","- Có ý thức làm chủ, tinh thần tập thể xã hội chủ nghĩa và tư tưởng “mình vì mọi người, mọi người vì mình”.","- Cần kiệm xây dựng đất nước, hăng hái bảo vệ Tổ quốc.","- Có lòng yêu nước nồng nàn, tinh thần quốc tế trong sáng.","- Có phương pháp làm việc khoa học, phong cách quần chúng, dân chủ, nêu gương.","Hồ Chí Minh đặc biệt quan tâm đến việc nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân; bồi dưỡng về năng lực trí tuệ, trình độ lý luận chính trị, văn hóa, khoa học - kỹ thuật, chuyên môn, nghiệp vụ, ngoại ngữ, sức khỏe.","Mỗi người tự rèn luyện, tu dưỡng ý thức, kết hợp chặt chẽ với xây dựng cơ chế, tính khoa học và bộ máy và tạo dựng nền dân chủ. Việc nêu gương, nhất là người đứng đầu, có ý nghĩa rất quan trọng.","Biện pháp giáo dục có một vị trí quan trọng. Hồ Chí Minh nhắc nhở rằng: “Hiền, dữ phải đâu là tính sẵn. Phần nhiều do giáo dục mà nên”. Theo Người, các cháu mẫu giáo, tiểu học như tờ giấy trắng. Chúng ta vẽ xanh thì xanh, vẽ đỏ thì đỏ. Nói như vậy để thấy giáo dục rất quan trọng trong việc xây dựng con người.","Chú trọng vai trò của tổ chức Đảng, chính quyền, đoàn thể quần chúng. Thông qua các phong trào cách mạng như “Thi đua yêu nước”, “Người tốt việc tốt”. Đặc biệt phải dựa vào quần chúng theo quan điểm “dựa vào ý kiến của dân chúng mà sửa chữa cán bộ và tổ chức của ta”."],"y":[{"ten":"Xây dựng con người là yêu cầu khách quan của sự nghiệp cách mạng, vừa cấp bách vừa lâu dài, có ý nghĩa chiến lược","goiY":"Đọc lại câu đầu phần a: xây dựng con người là yêu cầu thế nào?","khoa":[["cap bach"],["chien luoc"],["khach quan"]]},{"ten":"Vì lợi ích trăm năm thì phải trồng người","goiY":"Đọc lại câu nói nổi tiếng so sánh trồng cây với một việc lâu dài hơn.","khoa":[["trong nguoi"],["tram nam"]]},{"ten":"Muốn xây dựng chủ nghĩa xã hội, trước hết cần phải có những con người xã hội chủ nghĩa","goiY":"Đọc lại quan điểm thứ hai: muốn xây dựng chủ nghĩa xã hội thì trước hết cần gì?","khoa":[["con nguoi xa hoi chu
