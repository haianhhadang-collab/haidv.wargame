nghia"]]},{"ten":"Xây dựng con người toàn diện vừa hồng vừa chuyên","goiY":"Đọc lại phần b: Người quan tâm xây dựng con người như thế nào?","khoa":[["hong","chuyen"],["toan dien"]]},{"ten":"Mỗi người tự rèn luyện, tu dưỡng; việc nêu gương, nhất là người đứng đầu, có ý nghĩa rất quan trọng","goiY":"Đọc lại phần c: phương pháp xây dựng con người bắt đầu từ đâu, ai cần nêu gương?","khoa":[["neu guong"],["tu ren luyen"],["tu duong"],["nguoi dung dau"]]},{"ten":"Biện pháp giáo dục có một vị trí quan trọng","goiY":"Đọc lại câu \"Hiền, dữ phải đâu là tính sẵn\".","khoa":[["giao duc"]]}]}]},{"ma":"dong","ten":"MÙA ĐÔNG","phan":"IV. Vận dụng hiện nay","thua":[{"ma":"IV.1","ten":"Xây dựng và phát triển văn hóa, con người","baiGiang":["- Tình hình thế giới và đất nước đặt ra nhiều yêu cầu mới trong chiến lược xây dựng văn hóa và con người. Tiến trình xây dựng, phát triển văn hóa và con người ở nước ta hiện có nhiều khó khăn.","- Một số chủ trương, đường lối của Đảng về phát triển văn hóa, con người:","+ Nghị quyết Hội nghị lần thứ 5 Ban Chấp hành Trung ương khóa VIII về xây dựng và phát triển văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc ( Tháng 7-1998)","+ Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011)","+ Nghị quyết Hội nghị Trung ương 9 khóa XI về xây dựng và phát triển văn hóa, con người Việt Nam đáp ứng yêu cầu phát triển bền vững đất nước (Nghị quyết số 33- NQ/TW ngày 9-6-2014) và Nghị quyết Đại hội đại biểu toàn quốc lần thứ XII (1-2016)","- Nhiệm vụ hàng đầu trong quá trình “xây dựng và phát triển nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc” là xây dựng con người Việt Nam trong thời đại mới với những nội dung sau:","+ Có lòng yêu thương con người.","+ Có ý thức tập thể, đoàn kết, phấn đấu vì lợi ích chung.","+ Có lối sống lành mạnh, nếp sống văn minh, cần, kiệm, trung thực, nhân nghĩa, tôn trọng kỷ cương phép nước, quy ước của cộng đồng; có ý thức bảo vệ và cải thiện môi trường sinh thái.","+ Lao động chăm chỉ với lương tâm nghề nghiệp, có kỹ thuật, sáng tạo, năng suất cao vì lợi ích của bản thân, gia đình, tập thể và xã hội.","+ Thường xuyên học tập, nâng cao hiểu biết, trình độ chuyên môn, thẩm mỹ và thể lực.","Bên cạnh đó, giữ gìn và phát huy bản sắc văn hóa dân tộc, tiếp thu văn hóa nhân loại trong quá trình giao lưu, hội nhập quốc tế.","Thu hẹp dần khoảng cách đời sống văn hóa giữa các vùng miền, giữa trung tâm đô thị và nông thôn.","Đấu tranh chống sự xâm nhập của những yếu tố phản văn hóa."],"giaoTrinh":["Nghị quyết Hội nghị lần thứ năm Ban Chấp hành Trung ương khóa VIII về xây dựng và phát triển nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc (tháng 7/1998) nêu những quan điểm chỉ đạo cơ bản: Văn hóa là nền tảng tinh thần của xã hội, vừa là mục tiêu vừa là động lực thúc đẩy sự phát triển kinh tế - xã hội; nền văn hóa mà chúng ta xây dựng là nền văn hóa tiên tiến, đậm đà bản sắc dân tộc; thống nhất mà đa dạng trong cộng đồng các dân tộc Việt Nam; xây dựng và phát triển văn hóa là sự nghiệp của toàn dân do Đảng lãnh đạo, trong đó đội ngũ trí thức giữ vai trò quan trọng; văn hóa là một mặt trận; xây dựng và phát triển văn hóa là một sự nghiệp cách mạng lâu dài, đòi hỏi phải có ý chí cách mạng và sự kiên trì thận trọng.","Trong công cuộc đổi mới, nhận thức của Đảng về vai trò của văn hóa, mục tiêu xây dựng nền văn hóa không ngừng được bổ sung, hoàn thiện. Văn hóa “là nguồn lực nội sinh quan trọng hun đúc trí tuệ, tâm hồn, khí phách và bản lĩnh người Việt Nam”; là nền tảng tinh thần để duy trì và phát triển giá trị tinh thần tốt đẹp của dân tộc, vừa là mục tiêu, là động lực để phát triển kinh tế - xã hội. Yêu cầu đặt ra là “Văn hóa phải đi trước soi đường, thấm sâu vào từng quyết sách phát triển”.","Văn hóa là nền tảng tinh thần của xã hội.","Phát huy vai trò trung tâm của con người với tư cách là trung tâm của chiến lược phát triển, đồng thời là chủ thể phát triển. Đổi mới căn bản và toàn diện giáo dục và đào tạo. Trọng dụng trí thức, nhân tài. Thực hiện chính sách xã hội đúng đắn, công bằng vì con người, tạo động lực mạnh mẽ phát huy mọi năng lực sáng tạo của nhân dân trong sự nghiệp xây dựng và bảo vệ Tổ quốc.","Nghị quyết Hội nghị Trung ương 9 khóa XI về xây dựng và phát triển văn hóa, con người Việt Nam đáp ứng yêu cầu phát triển bền vững đất nước (Nghị quyết số 33-NQ/TW ngày 9/6/2014) nêu rõ: “Chăm lo xây dựng con người Việt Nam phát triển toàn diện, trọng tâm là bồi dưỡng tinh thần yêu nước, lòng tự hào dân tộc, đạo đức, lối sống và nhân cách. Tạo chuyển biến mạnh mẽ về nhận thức, ý thức tôn trọng pháp luật, mọi người Việt Nam đều hiểu biết sâu sắc, tự hào, tôn vinh lịch sử, văn hóa dân tộc”, cụ thể: 1) Xây dựng con người Việt Nam phát triển toàn diện là mục tiêu của chiến lược phát triển. 2) Xây dựng môi trường văn hóa lành mạnh, phù hợp với bối cảnh phát triển kinh tế thị trường định hướng xã hội chủ nghĩa và hội nhập quốc tế. 7) Chủ động hội nhập quốc tế về văn hóa, tiếp thu tinh hoa văn hóa nhân loại.","Nghị quyết Đại hội đại biểu toàn quốc lần thứ XIII của Đảng xác định: “Phát triển con người toàn diện và xây dựng nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc để văn hóa, con người Việt Nam thực sự trở thành sức mạnh nội sinh, động lực phát triển đất nước và bảo vệ Tổ quốc.”","Đại hội đại biểu toàn quốc lần thứ XIV của Đảng xác định: “Phát triển toàn diện con người Việt Nam về đạo đức, trí tuệ, ý thức dân tộc, trách nhiệm công dân, thượng tôn pháp luật, năng lực sáng tạo, thẩm mỹ, thể lực, kỹ năng sống, kỹ năng nghề nghiệp, kỹ năng số. Xây dựng môi trường văn hóa lành mạnh, văn minh gắn với xây dựng, hoàn thiện con người mới Việt Nam xã hội chủ nghĩa”."],"y":[{"ten":"Văn hóa là nền tảng tinh thần của xã hội, vừa là mục tiêu vừa là động lực thúc đẩy sự phát triển kinh tế - xã hội","goiY":"Đọc lại các quan điểm chỉ đạo của Nghị quyết Trung ương 5 khóa VIII.","khoa":[["nen tang tinh than"],["muc tieu","dong luc"]]},{"ten":"Xây dựng nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc","goiY":"Tìm tính chất của nền văn hóa mà các nghị quyết của Đảng xác định.","khoa":[["tien tien"],["dam da"]]},{"ten":"Văn hóa, con người Việt Nam trở thành sức mạnh nội sinh của sự phát triển","goiY":"Đọc lại định hướng của Đại hội XIII: văn hóa, con người trở thành sức mạnh gì?","khoa":[["noi sinh"]]},{"ten":"Con người là trung tâm của chiến lược phát triển, đồng thời là chủ thể phát triển","goiY":"Đọc lại đoạn nói vai trò trung tâm của con người.","khoa":[["trung tam"],["chu the"]]},{"ten":"Xây dựng con người Việt Nam phát triển toàn diện và môi trường văn hóa lành mạnh","goiY":"Đọc lại các nhiệm vụ cụ thể của Nghị quyết Trung ương 9 khóa XI.","khoa":[["toan dien"],["moi truong van hoa"]]},{"ten":"Chủ động hội nhập quốc tế về văn hóa, tiếp thu tinh hoa văn hóa nhân loại","goiY":"Tìm nhiệm vụ nói về quan hệ với văn hóa thế giới.","khoa":[["hoi nhap"],["tinh hoa"]]}]},{"ma":"IV.2","ten":"Xây dựng đạo đức cách mạng","baiGiang":["Hồ Chí Minh “là tấm gương sáng, là hiện thân của nền đạo đức cách mạng Việt Nam, mãi là ngọn đèn pha chiếu rọi con đường rèn luyện, phấn đấu để trở nên tốt hơn, đạt đến “chân thiện mỹ” của con người Việt Nam ngày nay và mai sau”.","Hồ Chí Minh luôn khẳng định tầm quan trọng của việc tu dưỡng, rèn luyện đạo đức, Đạo đức là yếu tố cơ bản tạo nên giá trị con người. Chính vì vậy, Người thường xuyên chú trọng quan tâm giáo dục đạo đức, chăm lo rèn luyện đạo đức cho các đối tượng.","Việc tu dưỡng đạo đức rất quan trọng đối với con người Việt Nam trong sự nghiệp cách mạng, nhất là đối với thế hệ trẻ. Thế hệ trẻ là “người chủ tương lai của nước nhà… nước nhà thịnh hay suy, yếu hay mạnh một phần lớn là do các thanh niên”. Do vậy, cần phải chú trọng chăm lo, giáo dục lý tưởng cách mạng, đạo đức, lối sống, văn hóa cho sinh viên, hình thành thế hệ thanh niên có những phẩm chất tốt đẹp, có khí phách và quyết tâm hành động, có trách nhiệm với Tổ quốc, với nhân dân."],"giaoTrinh":["Hồ Chí Minh “là tấm gương sáng, là hiện thân của nền đạo đức cách mạng Việt Nam, mãi mãi là ngọn đèn pha chiếu rọi con đường rèn luyện, phấn đấu để trở nên “tốt” hơn, đạt đến “chân thiện mỹ” của con người Việt Nam ngày nay và mai sau”.","Đạo đức là yếu tố cơ bản của nhân cách tạo nên giá trị con người, vì vậy ai cũng phải tu dưỡng hoàn thiện mình về đạo đức.","Thế hệ trẻ là “người chủ tương lai của nước nhà... nước nhà thịnh hay suy, yếu hay mạnh một phần lớn là do các thanh niên”. Vì vậy, cần phải chú trọng chăm lo giáo dục lý tưởng cách mạng, đạo đức, lối sống, văn hóa cho sinh viên, hình thành thế hệ thanh niên mới có những phẩm chất tốt đẹp, có khí phách và quyết tâm hành động, có trách nhiệm với Tổ quốc, với nhân dân, với chế độ xã hội chủ nghĩa.","Học tập đạo đức cách mạng Hồ Chí Minh là phải trung với nước, hiếu với dân, suốt đời đấu tranh cho sự nghiệp cách mạng. Học tập đạo đức cách mạng Hồ Chí Minh là học phẩm chất con người trọn đời vì nước, vì dân, là học tập khí phách anh hùng, ý chí độc lập tự cường, kiên trì mục tiêu lý tưởng, sáng tạo và quyết thắng, không chịu khuất phục trước mọi kẻ thù. Hồ Chí Minh đã cống hiến trọn đời mình cho sự nghiệp giải phóng dân tộc và thống nhất Tổ quốc, giải phóng giai cấp công nhân và dân tộc bị áp bức, cho sự thắng lợi của chủ nghĩa xã hội, cho sự hợp tác anh em và hòa bình giữa các dân tộc.","Học tập đạo đức cách mạng của Hồ Chí Minh là phải tu dưỡng, rèn luyện theo tấm gương cần, kiệm, liêm, chính, chí công vô tư; đức khiêm tốn, trung thực. Trung thực là phẩm chất hàng đầu của cán bộ, đảng viên và của mỗi người. Hồ Chí Minh coi trách nhiệm là việc phải làm, phải gánh vác, không thể thoái thác.","Học tập đạo đức Hồ Chí Minh là phải có đức tin tuyệt đối vào sức mạnh của nhân dân, kính trọng nhân dân và hết lòng, hết sức phục vụ nhân dân; luôn nhân ái, vị tha, khoan dung và nhân hậu với con người.","Học tập đạo đức cách mạng của Hồ Chí Minh còn là học tập và làm theo tấm gương về ý chí và nghị lực tinh thần to lớn, quyết tâm vượt qua mọi thử thách, gian nguy để đạt được mục đích cuộc sống. Học tập tư tưởng, đạo đức Hồ Chí Minh là học tấm gương về chủ nghĩa yêu nước kết hợp với chủ nghĩa quốc tế vô sản trong sáng."],"y":[{"ten":"Hồ Chí Minh là tấm gương sáng, là hiện thân của nền đạo đức cách mạng Việt Nam","goiY":"Đọc lại câu so sánh Người với ngọn đèn pha.","khoa":[["tam guong sang"],["hien than"],["ngon den pha"]]},{"ten":"Học tập đạo đức cách mạng Hồ Chí Minh là phải trung với nước, hiếu với dân, suốt đời đấu tranh cho sự nghiệp cách mạng","goiY":"Đọc lại câu đầu tiên nói học tập đạo đức Hồ Chí Minh là phải làm gì.","khoa":[["trung voi nuoc"],["hieu voi dan"]]},{"ten":"Tu dưỡng, rèn luyện theo tấm gương cần, kiệm, liêm, chính, chí công vô tư; đức khiêm tốn, trung thực","goiY":"Đọc lại câu về tu dưỡng theo tấm gương những đức tính hằng ngày của Người.","khoa":[["chi cong vo tu"],["khiem ton"],["trung thuc"],["can","kiem","liem","chinh"]]},{"ten":"Có đức tin tuyệt đối vào sức mạnh của nhân dân, hết lòng, hết sức phục vụ nhân dân; nhân ái, vị tha, khoan dung","goiY":"Đọc lại câu nói học tập đạo đức Hồ Chí Minh là phải có đức tin vào ai.","khoa":[["duc tin"],["phuc vu nhan dan"],["nhan ai"],["khoan dung"],["vi tha"]]},{"ten":"Học tập ý chí và nghị lực tinh thần to lớn, quyết tâm vượt qua mọi thử thách, gian nguy","goiY":"Đọc lại câu về tấm gương ý chí của Người.","khoa":[["nghi luc"],["y chi"],["thu thach"]]},{"ten":"Thế hệ trẻ là người chủ tương lai của nước nhà; cần chăm lo giáo dục lý tưởng cách mạng, đạo đức, lối sống, văn hóa cho sinh viên","goiY":"Đọc lại đoạn nói về thế hệ trẻ và sinh viên.","khoa":[["the he tre"],["thanh nien"],["sinh vien"],["chu tuong lai"]]}]}]}],"cau":[{"id":"c01","goc":1,"mua":"xuan","muc":"I.2","dang":"tf","hoi":"Theo Hồ Chí Minh, văn hóa là mục tiêu duy nhất của cách mạng Việt Nam.","pa":["Đúng","Sai"],"dung":[1],"giaiThich":"Sai. Mục tiêu của cách mạng Việt Nam là độc lập dân tộc và chủ nghĩa xã hội. Cùng với chính trị, kinh tế, xã hội, văn hóa nằm trong mục tiêu chung của toàn bộ tiến trình cách mạng; văn hóa không phải là mục tiêu duy nhất."},{"id":"c02","goc":2,"mua":"xuan","muc":"I.3","dang":"tf","hoi":"UNESCO đã ghi nhận Chủ tịch Hồ Chí Minh là Anh hùng giải phóng dân tộc, Nhà văn hóa kiệt xuất Việt Nam vào năm 1987.","pa":["Đúng","Sai"],"dung":[0],"giaiThich":"Đúng. Hồ Chí Minh được UNESCO ghi nhận là Anh hùng giải phóng dân tộc, Nhà văn hóa kiệt xuất Việt Nam trong Nghị quyết 24C/18.6.5 của Khóa họp 24 Đại hội đồng UNESCO từ ngày 20/10 đến ngày 20/11/1987."},{"id":"c03","goc":3,"mua":"ha","muc":"II.3","dang":"tf","hoi":"Câu nói của Hồ Chí Minh “Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong” thể hiện nguyên tắc tu dưỡng đạo đức suốt đời.","pa":["Đúng","Sai"],"dung":[0],"giaiThich":"Đúng. Theo Hồ Chí Minh, tu dưỡng đạo đức như một cuộc cách mạng trường kỳ, gian khổ; mỗi người phải kiên trì rèn luyện liên tục, tu dưỡng suốt đời. Đạo đức không phải là cái gì đó có tính “nhất thành bất biến”, mà được hình thành, phát triển do môi trường giáo dục, do sự rèn luyện, phấn đấu và tu dưỡng bản thân của mỗi người."},{"id":"c04","goc":4,"mua":"xuan","muc":"I.1","dang":"tf","hoi":"Quan niệm văn hóa theo nghĩa rộng của Hồ Chí Minh xuất hiện sau Cách mạng Tháng Tám năm 1945, khi cả nước tập trung xây dựng đất nước.","pa":["Đúng","Sai"],"dung":[1],"giaiThich":"Sai. Quan niệm văn hóa theo nghĩa rộng được Hồ Chí Minh đưa ra vào tháng 8/1943, khi còn ở trong nhà tù của Tưởng Giới Thạch. Đây là quan niệm văn hóa duy nhất theo nghĩa rộng. Từ sau Cách mạng Tháng Tám, Hồ Chí Minh có bàn đến văn hóa nhưng theo nghĩa hẹp, với ý nghĩa là kiến trúc thượng tầng, là toàn bộ đời sống tinh thần của xã hội."},{"id":"c05","goc":5,"mua":"thu","muc":"III.3","dang":"tf","hoi":"Trong quan điểm của Hồ Chí Minh về xây dựng con người, “trồng người” chỉ là công việc trước mắt, không mang ý nghĩa lâu dài.","pa":["Đúng","Sai"],"dung":[1],"giaiThich":"Sai. “Vì lợi ích trăm năm thì phải “trồng người””. “Trồng người” là công việc lâu dài, gian khổ, vừa vì lợi ích trước mắt vừa vì lợi ích lâu dài, là công việc của văn hóa giáo dục."},{"id":"c06","goc":6,"mua":"ha","muc":"II.1","dang":"tf","hoi":"Theo tư tưởng Hồ Chí Minh, nếu cán bộ có tài nhưng thiếu đạo đức cách mạng thì vẫn có thể lãnh đạo nhân dân thành công.","pa":["Đúng","Sai"],"dung":[1],"giaiThich":"Sai. Hồ Chí Minh khẳng định: “Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân” và “Nếu không có đạo đức cách mạng thì có tài cũng vô dụng”."},{"id":"c07","goc":7,"mua":"xuan","muc":"I.1","dang":"one","hoi":"Theo Hồ Chí Minh, trong đời sống có bốn vấn đề phải được coi là quan trọng ngang nhau và có sự tác động qua lại lẫn nhau, đó là:","pa":["Chính trị, kinh tế, giáo dục, văn hóa.","Chính trị, kinh tế, xã hội, quốc phòng.","Chính trị, kinh tế, văn hóa, xã hội.","Kinh tế, văn hóa, giáo dục, y tế.","Chính trị, quân sự, văn hóa, xã hội."],"dung":[2],"giaiThich":"Hồ Chí Minh cho rằng, trong đời sống có bốn vấn đề phải được coi là quan trọng ngang nhau và có sự tác động qua lại lẫn nhau, đó là chính trị, kinh tế, văn hóa, xã hội."},{"id":"c08","goc":8,"mua":"ha","muc":"II.2","dang":"one","hoi":"Theo quan điểm của Hồ Chí Minh về đạo đức cách mạng, đâu là phẩm chất bao trùm và quan trọng nhất?","pa":["Cần, kiệm, liêm, chính.","Thương yêu con người, sống có tình có nghĩa.","Trung với nước, hiếu với dân.","Tinh thần quốc tế trong sáng.","Nói đi đôi với làm, nêu gương về đạo đức."],"dung":[2],"giaiThich":"Trung với nước, hiếu với dân là phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác. Nói đi đôi với làm, nêu gương về đạo đức là một nguyên tắc xây dựng đạo đức, không phải một chuẩn mực."},{"id":"c09","goc":9,"mua":"xuan","muc":"I.1","dang":"one","hoi":"Trong các cách tiếp cận văn hóa của Hồ Chí Minh, cách tiếp cận nào thường xuất hiện trong các bài nói với đồng bào miền núi?","pa":["Tiếp cận theo nghĩa rộng, tổng hợp mọi phương thức sinh hoạt của con người.","Tiếp cận theo nghĩa hẹp là đời sống tinh thần của xã hội, thuộc kiến trúc thượng tầng.","Tiếp cận theo nghĩa hẹp hơn là bàn đến các trường học, số người đi học, xóa nạn mù chữ, biết đọc, biết viết.","Tiếp cận theo “phương thức sử dụng công cụ sinh hoạt”.","Tiếp cận văn hóa như một mặt trận."],"dung":[2],"giaiThich":"Hồ Chí Minh có bốn cách tiếp cận chủ yếu về văn hóa. Trong đó, cách tiếp cận theo nghĩa hẹp hơn là bàn đến các trường học, số người đi học, xóa nạn mù chữ, biết đọc, biết viết thường xuất hiện trong các bài nói với đồng bào miền núi."},{"id":"c10","goc":10,"mua":"xuan","muc":"I.1","dang":"one","hoi":"“Dân ta phải biết sử ta. Cho tường gốc tích nước nhà Việt Nam” là lời nhắc nhở của Hồ Chí Minh về việc:","pa":["Học tập văn hóa các nước phương Đông.","Giữ gìn bản sắc văn hóa dân tộc.","Tiếp thu tinh hoa văn hóa nhân loại.","Xây dựng nền văn hóa mới xã hội chủ nghĩa.","Chống giặc dốt và nâng cao dân trí."],"dung":[1],"giaiThich":"Câu này nằm trong phần giữ gìn bản sắc văn hóa dân tộc: trách nhiệm của con người Việt Nam là phải trân trọng, khai thác, giữ gìn, phát huy, phát triển những giá trị của văn hóa dân tộc, đáp ứng yêu cầu, nhiệm vụ cách mạng của từng giai đoạn lịch sử."},{"id":"c11","goc":11,"mua":"ha","muc":"II.3","dang":"one","hoi":"Theo Hồ Chí Minh, nguồn gốc của mọi thứ tệ nạn như quan liêu, tham ô, lãng phí là gì?","pa":["Sự thiếu hiểu biết về pháp luật.","Chủ nghĩa cá nhân.","Thiếu kinh nghiệm lãnh đạo.","Ảnh hưởng của văn hóa ngoại lai.","Sự kém phát triển về kinh tế."],"dung":[1],"giaiThich":"Hồ Chí Minh chỉ rõ: “Quan liêu, tham ô, lãng phí là tội ác. Phải tẩy sạch nó để thực hiện cần kiệm liêm chính”. Nguồn gốc của mọi thứ tệ nạn là chủ nghĩa cá nhân: “do cá nhân chủ nghĩa mà phạm nhiều sai lầm... Phải kiên quyết quét sạch chủ nghĩa cá nhân”."},{"id":"c12","goc":12,"mua":"xuan","muc":"I.3","dang":"one","hoi":"Trong thời kỳ kháng chiến chống thực dân Pháp, Hồ Chí Minh chủ trương xây dựng nền văn hóa mới với tính chất nào?","pa":["Tiên tiến, đậm đà bản sắc dân tộc.","Toàn diện, hiện đại, hội nhập.","Dân tộc, khoa học, đại chúng.","Xã hội chủ nghĩa và dân tộc.","Truyền thống và tiến bộ."],"dung":[2],"giaiThich":"Trong kháng chiến chống thực dân Pháp, Hồ Chí Minh khẳng định lại quan điểm của Đảng từ năm 1943 trong Đề cương văn hóa Việt Nam về phương châm xây dựng nền văn hóa mới: một nền văn hóa có tính chất dân tộc, khoa học, đại chúng."},{"id":"c13","goc":13,"mua":"xuan","muc":"I.2","dang":"wrong","hoi":"Theo Hồ Chí Minh, để làm tròn nhiệm vụ của một chiến sĩ nghệ thuật trên mặt trận văn hóa, điều nào sau đây không phải là yêu cầu?","pa":["Có lập trường tư tưởng vững vàng.","Coi ngòi bút là vũ khí sắc bén trong sự nghiệp “phò chính trừ tà”.","Chỉ ca ngợi cái tốt, tránh phê bình cái xấu.","Bám sát cuộc sống thực tiễn, đi sâu vào quần chúng.","Phụng sự Tổ quốc, phục vụ nhân dân."],"dung":[2],"giaiThich":"Để làm tròn nhiệm vụ, chiến sĩ nghệ thuật phải có lập trường tư tưởng vững vàng; ngòi bút là vũ khí sắc bén trong sự nghiệp “phò chính trừ tà”. Phải bám sát cuộc sống thực tiễn, đi sâu vào quần chúng, để phê bình nghiêm khắc những thói xấu như tham ô, lười biếng, lãng phí, quan liêu, và ca tụng chân thật những người tốt việc tốt. Vì vậy, “chỉ ca ngợi cái tốt, tránh phê bình cái xấu” là sai."},{"id":"c14","goc":14,"mua":"xuan","muc":"I.1","dang":"wrong","hoi":"Trong tư tưởng Hồ Chí Minh về quan hệ giữa văn hóa với các lĩnh vực khác, nhận định nào sau đây là không đúng?","pa":["Văn hóa phải phục vụ nhiệm vụ chính trị.","Văn hóa thuộc kiến trúc thượng tầng và hoàn toàn phụ thuộc vào kinh tế.","Giải phóng chính trị để mở đường cho văn hóa phát triển.","Văn hóa có vai trò tác động tích cực trở lại kinh tế.","Xã hội thế nào văn hóa thế ấy, nên phải giải phóng xã hội để văn hóa phát triển."],"dung":[1],"giaiThich":"Hồ Chí Minh giải thích rằng văn hóa thuộc kiến trúc thượng tầng. Tuy nhiên, văn hóa cũng không thể đứng ngoài mà phải đứng trong kinh tế, nghĩa là văn hóa không hoàn toàn phụ thuộc vào kinh tế, mà có vai trò tác động tích cực trở lại kinh tế. Vì vậy, nhận định “hoàn toàn phụ thuộc vào kinh tế” là sai."},{"id":"c15","goc":15,"mua":"ha","muc":"II.3","dang":"wrong","hoi":"Theo Hồ Chí Minh, để xây dựng nền đạo đức mới, đạo đức cách mạng, điều nào sau đây không phải là đối tượng cần chống?","pa":["Chủ nghĩa đế quốc.","Những thói quen và tập tục lạc hậu.","Chủ nghĩa cá nhân.","Lợi ích cá nhân chính đáng của con người.","Những biểu hiện, hành vi vô đạo đức, suy thoái đạo đức."],"dung":[3],"giaiThich":"Trên con đường đi tới tiến bộ và cách mạng, đạo đức mới chỉ có thể được xây dựng thành công trên cơ sở kiên trì mục tiêu chống chủ nghĩa đế quốc, chống những thói quen và tập tục lạc hậu, phải loại trừ chủ nghĩa cá nhân; chống là chống các biểu hiện, các hành vi vô đạo đức, suy thoái đạo đức. Tuy nhiên, Người lưu ý: “Đấu tranh chống chủ nghĩa cá nhân không phải là “giày xéo lên lợi ích cá nhân””."},{"id":"c16","goc":16,"mua":"thu","muc":"III.3","dang":"wrong","hoi":"Đâu không phải là nội dung xây dựng con người toàn diện “vừa hồng vừa chuyên” theo quan điểm của Hồ Chí Minh?","pa":["Có ý thức làm chủ, tinh thần tập thể xã hội chủ nghĩa.","Chỉ chú trọng phát triển trí tuệ, không cần đạo đức.","Cần kiệm xây dựng đất nước, hăng hái bảo vệ Tổ quốc.","Có lòng yêu nước nồng nàn, tinh thần quốc tế trong sáng.","Có phương pháp làm việc khoa học, phong cách quần chúng, dân chủ, nêu gương."],"dung":[1],"giaiThich":"Hồ Chí Minh quan tâm xây dựng con người toàn diện vừa “hồng” vừa “chuyên”, đặc biệt quan tâm đến việc nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân, đồng thời bồi dưỡng năng lực trí tuệ. Người khuyên: “Đức là đạo đức cách mạng. Đó là cái gốc, rất quan trọng. Nếu không có đạo đức cách mạng thì có tài cũng vô dụng”. Vì vậy, “chỉ chú trọng phát triển trí tuệ, không cần đạo đức” là sai."},{"id":"c17","goc":17,"mua":"ha","muc":"II.2","dang":"wrong","hoi":"Theo Hồ Chí Minh, phẩm chất “Liêm” trong “Cần, kiệm, liêm, chính” không bao gồm điều nào sau đây?","pa":["Trong sạch, không tham lam.","Không tham địa vị, tiền tài, sung sướng.","Ham người tâng bốc mình.","Chỉ ham học, ham làm, ham tiến bộ.","Đi đôi với chữ Kiệm."],"dung":[2],"giaiThich":"Liêm “là trong sạch, không tham lam... Chữ LIÊM phải đi đôi với chữ KIỆM”; “Liêm là không tham địa vị. Không tham tiền tài. Không tham sung sướng. Không ham người tâng bốc mình... Chỉ có một thứ ham là ham học, ham làm, ham tiến bộ”. Vì vậy, “ham người tâng bốc mình” là sai."},{"id":"c18","goc":18,"mua":"xuan","muc":"I.1","dang":"wrong","hoi":"Phát biểu nào sau đây không phản ánh quan điểm của Hồ Chí Minh về việc tiếp thu tinh hoa văn hóa nhân loại?","pa":["Tiếp thu cái gì tốt của văn hóa xưa và nay.","Tránh nguy cơ trở thành kẻ bắt chước.","Chỉ nên học hỏi văn hóa phương Đông.","Mục đích là làm giàu cho văn hóa Việt Nam.","Phải lấy văn hóa dân tộc làm gốc khi tiếp thu."],"dung":[2],"giaiThich":"Hồ Chí Minh chỉ rõ: “Tây phương hay Đông phương có cái gì tốt ta học lấy để tạo ra một nền văn hóa Việt Nam”. Nội dung tiếp thu là toàn diện, bao gồm Đông, Tây, kim, cổ; tiêu chí tiếp thu là có cái gì hay, cái gì tốt là ta học lấy; đồng thời tránh nguy cơ trở thành kẻ bắt chước. Vì vậy, “chỉ nên học hỏi văn hóa phương Đông” là sai."},{"id":"c19","goc":19,"mua":"xuan","muc":"I.3","dang":"multi","hoi":"Theo Hồ Chí Minh, nền văn hóa mới Việt Nam được xây dựng trên cơ sở kết hợp những yếu tố nào? (Chọn tất cả đáp án đúng)","pa":["Những truyền thống tốt đẹp của văn hóa dân tộc được phát triển và nâng cao.","Tinh hoa văn hóa của nhân loại.","Thấm nhuần sâu sắc chủ nghĩa yêu nước.","Thấm nhuần sâu sắc chủ nghĩa quốc tế chân chính.","Duy trì hoàn toàn các phong tục tập quán cũ."],"dung":[0,1,2,3],"giaiThich":"Nền văn hóa mà Hồ Chí Minh chủ trương kết hợp những truyền thống tốt đẹp của văn hóa dân tộc được phát triển và nâng cao với tinh hoa văn hóa của nhân loại, thấm nhuần sâu sắc chủ nghĩa yêu nước và chủ nghĩa quốc tế chân chính. Người không chủ trương duy trì hoàn toàn phong tục tập quán cũ."},{"id":"c20","goc":20,"mua":"xuan","muc":"I.1","dang":"multi","hoi":"Theo quan điểm Hồ Chí Minh, những nhận định nào sau đây đúng về bản sắc văn hóa dân tộc? (Chọn tất cả đáp án đúng)","pa":["Phản ánh những nét độc đáo, đặc tính dân tộc.","Là ngọn nguồn đi tới chủ nghĩa Mác - Lênin.","Có ý nghĩa quan trọng đối với sự nghiệp xây dựng và bảo vệ Tổ quốc.","Là những giá trị văn hóa nhất thời, dễ mất đi trong quá trình giao lưu với bên ngoài.","Về hình thức, biểu hiện ở ngôn ngữ, phong tục, tập quán, lễ hội, truyền thống, cách cảm và nghĩ."],"dung":[0,1,2,4],"giaiThich":"Bản sắc văn hóa dân tộc là những giá trị văn hóa bền vững của cộng đồng các dân tộc Việt Nam, chứa đựng giá trị lớn và có một ý nghĩa quan trọng đối với sự nghiệp xây dựng và bảo vệ Tổ quốc. Nó phản ánh những nét độc đáo, đặc tính dân tộc; nó là ngọn nguồn đi tới chủ nghĩa Mác - Lênin. Về hình thức, cốt cách văn hóa dân tộc biểu hiện ở ngôn ngữ, phong tục, tập quán, lễ hội, truyền thống, cách cảm và nghĩ. Vì vậy, coi bản sắc là “những giá trị nhất thời” là sai."},{"id":"c21","goc":21,"mua":"ha","muc":"II.1","dang":"multi","hoi":"Theo tư tưởng Hồ Chí Minh, những biểu hiện nào sau đây thuộc về đạo đức cách mạng của người chiến sĩ cách mạng? (Chọn tất cả đáp án đúng)","pa":["Cả đời hết lòng hết sức phục vụ nhân dân.","Sinh hoạt ngày thường thì làm gương mẫu: gian khổ, chất phác, kính trọng của công.","Gặp khó khăn, gian khổ, thất bại cũng không sợ sệt, rụt rè, lùi bước.","Khi gặp thuận lợi và thành công vẫn giữ vững tinh thần gian khổ, chất phác, khiêm tốn.","Ưu tiên lợi ích cá nhân trước lợi ích tập thể."],"dung":[0,1,2,3],"giaiThich":"Theo Hồ Chí Minh, “Đại đa số chiến sĩ cách mạng là người có đạo đức: Cả đời hết lòng hết sức phục vụ nhân dân, sinh hoạt ngày thường thì làm gương mẫu; gian khổ, chất phác, kính trọng của công...”. “Có đạo đức cách mạng thì khi gặp khó khăn, gian khổ, thất bại, cũng không sợ sệt, rụt rè, lùi bước... khi gặp thuận lợi và thành công vẫn giữ vững tinh thần gian khổ, chất phác, khiêm tốn”. Đặt lợi ích cá nhân lên trước là biểu hiện của chủ nghĩa cá nhân, trái với đạo đức cách mạng."},{"id":"c22","goc":22,"mua":"dong","muc":"IV.2","dang":"multi","hoi":"Học tập đạo đức cách mạng Hồ Chí Minh là học tập và làm theo những phẩm chất nào sau đây? (Chọn tất cả đáp án đúng)","pa":["Trung với nước, hiếu với dân, suốt đời đấu tranh cho sự nghiệp cách mạng.","Cần, kiệm, liêm, chính, chí công vô tư; đức khiêm tốn, trung thực.","Đức tin tuyệt đối vào sức mạnh của nhân dân; nhân ái, vị tha, khoan dung và nhân hậu với con người.","Ý chí và nghị lực tinh thần to lớn, quyết tâm vượt qua mọi thử thách, gian nguy.","Đề cao chủ nghĩa yêu nước, tách rời tinh thần quốc tế để giữ vững độc lập dân tộc."],"dung":[0,1,2,3],"giaiThich":"Học tập đạo đức cách mạng Hồ Chí Minh là phải trung với nước, hiếu với dân, suốt đời đấu tranh cho sự nghiệp cách mạng; tu dưỡng, rèn luyện theo tấm gương cần, kiệm, liêm, chính, chí công vô tư, đức khiêm tốn, trung thực; có đức tin tuyệt đối vào sức mạnh của nhân dân, luôn nhân ái, vị tha, khoan dung và nhân hậu với con người; học tấm gương về ý chí và nghị lực tinh thần to lớn. Đồng thời, đó là học tấm gương về chủ nghĩa yêu nước kết hợp với chủ nghĩa quốc tế vô sản trong sáng, không tách rời hai mặt ấy."},{"id":"c23","goc":23,"mua":"thu","muc":"III.2","dang":"multi","hoi":"Theo Hồ Chí Minh, những nội dung nào sau đây thuộc về “giải phóng con người”? (Chọn tất cả đáp án đúng)","pa":["Xóa bỏ tình trạng áp bức, bóc lột, nô dịch con người.","Xóa bỏ các điều kiện xã hội làm tha hóa con người.","Làm cho mọi người được hưởng tự do, hạnh phúc, có điều kiện phát huy khả năng sáng tạo, làm chủ xã hội, làm chủ tự nhiên và làm chủ bản thân.","Phát triển toàn diện theo đúng bản chất tốt đẹp của con người.","Xóa bỏ ách thống trị của chủ nghĩa đế quốc, giành lại độc lập cho dân tộc."],"dung":[0,1,2,3],"giaiThich":"Giải phóng con người là xóa bỏ tình trạng áp bức, bóc lột, nô dịch con người; xóa bỏ các điều kiện xã hội làm tha hóa con người, làm cho mọi người được hưởng tự do, hạnh phúc, có điều kiện phát huy khả năng sáng tạo, làm chủ xã hội, làm chủ tự nhiên và làm chủ bản thân, phát triển toàn diện theo đúng bản chất tốt đẹp của con người. “Xóa bỏ ách thống trị của chủ nghĩa đế quốc, giành lại độc lập cho dân tộc” là nội dung của giải phóng dân tộc."},{"id":"c24","goc":24,"mua":"dong","muc":"IV.1","dang":"multi","hoi":"Theo Nghị quyết Hội nghị Trung ương 9 khóa XI và Nghị quyết Đại hội XIII của Đảng, những định hướng nào sau đây về xây dựng văn hóa, con người Việt Nam là đúng? (Chọn tất cả đáp án đúng)","pa":["Phát triển con người toàn diện và xây dựng nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc.","Văn hóa, con người Việt Nam thực sự trở thành sức mạnh nội sinh, động lực phát triển đất nước và bảo vệ Tổ quốc.","Chăm lo xây dựng con người Việt Nam phát triển toàn diện, trọng tâm là bồi dưỡng tinh thần yêu nước, lòng tự hào dân tộc, đạo đức, lối sống và nhân cách.","Xây dựng môi trường văn hóa lành mạnh, phù hợp với bối cảnh phát triển kinh tế thị trường định hướng xã hội chủ nghĩa và hội nhập quốc tế.","Hạn chế hội nhập quốc tế về văn hóa để giữ nguyên bản sắc dân tộc."],"dung":[0,1,2,3],"giaiThich":"Nghị quyết Đại hội XIII xác định: “Phát triển con người toàn diện và xây dựng nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc để văn hóa, con người Việt Nam thực sự trở thành sức mạnh nội sinh, động lực phát triển đất nước và bảo vệ Tổ quốc”. Nghị quyết số 33-NQ/TW (Hội nghị Trung ương 9 khóa XI) nêu: “Chăm lo xây dựng con người Việt Nam phát triển toàn diện, trọng tâm là bồi dưỡng tinh thần yêu nước, lòng tự hào dân tộc, đạo đức, lối sống và nhân cách”, cùng các nhiệm vụ như xây dựng môi trường văn hóa lành mạnh và chủ động hội nhập quốc tế về văn hóa, tiếp thu tinh hoa văn hóa nhân loại. Vì vậy, “hạn chế hội nhập quốc tế về văn hóa” là sai."},{"id":"c25","goc":25,"mua":"ha","muc":"II.1","dang":"fill","hoi":"Trong Di chúc, Hồ Chí Minh viết: “Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người ____ thật trung thành của nhân dân”.","pa":["đồng chí","đầy tớ","chiến sĩ","bạn bè","đại diện"],"dung":[1],"giaiThich":"Trong Di chúc, Hồ Chí Minh viết: “Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân”."},{"id":"c26","goc":26,"mua":"ha","muc":"II.2","dang":"fill","hoi":"Theo Hồ Chí Minh: “Cần tức là siêng năng, chăm chỉ, cố gắng dẻo dai... Muốn cho chữ Cần có nhiều kết quả hơn, thì phải có ____ cho mọi công việc”.","pa":["mục tiêu","kế hoạch","sáng kiến","kinh nghiệm","quy trình"],"dung":[1],"giaiThich":"“Cần tức là siêng năng, chăm chỉ, cố gắng dẻo dai... Muốn cho chữ Cần có nhiều kết quả hơn, thì phải có kế hoạch cho mọi công việc”. Cần tức là lao động cần cù, siêng năng; lao động có kế hoạch, sáng tạo, có năng suất cao."},{"id":"c27","goc":27,"mua":"xuan","muc":"I.2","dang":"fill","hoi":"Hồ Chí Minh đã đặt cơ sở cho một xã hội phát triển bền vững với ba trụ cột là bền vững về kinh tế, xã hội và ____.","pa":["chính trị","văn hóa","môi trường","quốc phòng","giáo dục"],"dung":[2],"giaiThich":"Hồ Chí Minh đã đặt cơ sở cho một xã hội phát triển bền vững với ba trụ cột là bền vững về kinh tế, xã hội và môi trường."},{"id":"c28","goc":28,"mua":"thu","muc":"III.3","dang":"fill","hoi":"Về phương pháp xây dựng con người, Hồ Chí Minh nhắc nhở rằng: “Hiền, dữ phải đâu là tính sẵn. Phần nhiều do ____ mà nên”.","pa":["di truyền","giáo dục","hoàn cảnh","tài năng","rèn luyện"],"dung":[1],"giaiThich":"Biện pháp giáo dục có một vị trí quan trọng. Hồ Chí Minh nhắc nhở rằng: “Hiền, dữ phải đâu là tính sẵn. Phần nhiều do giáo dục mà nên”."},{"id":"c29","goc":29,"mua":"dong","muc":"IV.2","dang":"fill","hoi":"Hồ Chí Minh đã cống hiến trọn đời mình cho sự nghiệp giải phóng dân tộc và thống nhất Tổ quốc, giải phóng giai cấp công nhân và dân tộc bị áp bức, cho sự thắng lợi của chủ nghĩa xã hội, cho sự hợp tác anh em và ____ giữa các dân tộc.","pa":["cạnh tranh","hòa bình","hội nhập","đối đầu","đấu tranh"],"dung":[1],"giaiThich":"Hồ Chí Minh đã cống hiến trọn đời mình cho sự nghiệp giải phóng dân tộc và thống nhất Tổ quốc, giải phóng giai cấp công nhân và dân tộc bị áp bức, cho sự thắng lợi của chủ nghĩa xã hội, cho sự hợp tác anh em và hòa bình giữa các dân tộc."},{"id":"c30","goc":30,"mua":"thu","muc":"III.1","dang":"fill","hoi":"Theo Hồ Chí Minh, con người là một chỉnh thể, thống nhất về trí lực, tâm lực, thể lực, đa dạng bởi mối quan hệ giữa cá nhân và xã hội (quan hệ gia đình, dòng tộc, làng xã, quan hệ giai cấp, dân tộc...) và các mối quan hệ xã hội (quan hệ chính trị, văn hóa, đạo đức, ____...).","pa":["khoa học","tôn giáo","quân sự","công nghệ","kinh tế"],"dung":[1],"giaiThich":"Theo Hồ Chí Minh, con người là một chỉnh thể, thống nhất về trí lực, tâm lực, thể lực, đa dạng bởi mối quan hệ giữa cá nhân và xã hội (quan hệ gia đình, dòng tộc, làng xã, quan hệ giai cấp, dân tộc...) và các mối quan hệ xã hội (quan hệ chính trị, văn hóa, đạo đức, tôn giáo...)."}]};

function chuan(s) { return ' ' + String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' '; }

/* ---------- MÁY PHÁT NHẠC ----------
   Hai bộ phát để chuyển cảnh nhỏ dần – lên dần 1,5 giây. Trình duyệt chặn tự phát nên chờ lần bấm đầu. */
const AM = {on: st.nhac !== false, mo: false, canh: null, el: [new Audio(), new Audio()], i: 0, ban: null, k: 0, keo: null};
AM.el.forEach(a => { a.preload = 'none'; a.addEventListener('ended', () => { if (a === AM.el[AM.i]) hetBan(); }); a.addEventListener('error', () => { if (a === AM.el[AM.i]) capNhatNhac(); }); });
function hetBan() {
  const c = CANH_NHAC[AM.canh]; if (!c) return;
  if (c.mot) { phatCanh(c.sau); return; }
  AM.k = (AM.k + 1) % c.ds.length; chuyen(c.ds[AM.k], c.am);
}
function chuyen(maBan, am) {
  const b = BAN[maBan]; if (!b) return;
  const cu = AM.el[AM.i], moiA = AM.el[1 - AM.i];
  AM.i = 1 - AM.i; AM.ban = maBan;
  moiA.src = b.src; moiA.loop = false; moiA.volume = 0;
  const p = moiA.play(); if (p && p.catch) p.catch(() => {});
  clearInterval(AM.keo);
  const t0 = performance.now(), v0 = cu.volume;
  AM.keo = setInterval(() => {
    const x = Math.min(1, (performance.now() - t0) / 1500);
    moiA.volume = am * x; cu.volume = v0 * (1 - x);
    if (x >= 1) { clearInterval(AM.keo); cu.pause(); }
  }, 50);
  capNhatNhac();
}
function phatCanh(k) {
  if (!k || !CANH_NHAC[k]) return;
  const doi = AM.canh !== k; AM.canh = k;
  if (!AM.on || !AM.mo) { capNhatNhac(); return; }
  const c = CANH_NHAC[k];
  if (!doi && AM.ban && c.ds.includes(AM.ban) && !AM.el[AM.i].paused) return;
  if (c.ds.includes(AM.ban) && !AM.el[AM.i].paused) { capNhatNhac(); return; }
  AM.k = 0; chuyen(c.ds[0], c.am);
}
function tatBatNhac() {
  AM.on = !AM.on; st.nhac = AM.on; luu(); AM.mo = true;
  if (AM.on) { AM.ban = null; phatCanh(AM.canh); }
  else { clearInterval(AM.keo); AM.el.forEach(a => a.pause()); capNhatNhac(); }
}
document.addEventListener('pointerdown', () => { if (!AM.mo) { AM.mo = true; if (AM.on) phatCanh(AM.canh); } }, true);
document.addEventListener('keydown', () => { if (!AM.mo) { AM.mo = true; if (AM.on) phatCanh(AM.canh); } }, true);
function tenBan(gon) {
  const c = CANH_NHAC[AM.canh]; const ma = (AM.ban && c && c.ds.includes(AM.ban)) ? AM.ban : (c ? c.ds[0] : null);
  const b = BAN[ma]; if (!b) return '';
  return gon ? b.ten : b.tg + ' – ' + b.ten;
}
/* nút nhạc trên thanh đầu: tên bản đang phát; bấm để bật/tắt */
function chipNhac(gon) {
  const nhan = AM.on ? '♪ ' + tenBan(gon) : '♪ ' + t('nhac_tat');
  return '<button type="button" class="chip" data-nhac="1" data-gon="' + (gon ? 1 : 0) + '" aria-label="' + h(AM.on ? t('nhac_tatNut') : t('nhac_bat')) + '">' + h(nhan) + '</button>';
}
function capNhatNhac() {

    sach.scrollTop = 0;
  };
  document.getElementById('tab-bg').onclick = () => { tab = 'bg'; veSach(); };
  document.getElementById('tab-gt').onclick = () => { tab = 'gt'; veSach(); };
  veSach();
  const dem = () => { const n = demChu(o.value), e = document.getElementById('dem'); e.textContent = t('g_dem', {n}); e.classList.toggle('qua', n > TOI_DA); };
  const veY = (ketQua, thongBao) => {
    const daGieo = !!(st.thua[th.ma] && st.thua[th.ma].gieo);
    const y = ketQua || yCo(th.ma);
    document.getElementById('y-ds').innerHTML = th.y.map((x, i) => {
      if (!daGieo) return '<div class="y">' + veMam(false) + '<span>' + h(t('g_oTrong', {n: i + 1})) + '</span></div>';
      return y[i] ? '<div class="y co">' + veMam(true) + '<span>' + h(x.ten) + '</span></div>'
        : '<div class="y thieu">' + veMam(false) + '<span>' + h(x.goiY) + '</span></div>';
    }).join('');
    const a = y.filter(Boolean).length;
    document.getElementById('bao').textContent = thongBao || (!daGieo ? t('g_dau') : a === th.y.length ? t('g_du', {n: a}) : t('g_thieu', {a, b: th.y.length}));
  };
  o.value = nhap; dem(); veY();
  let hoan = null;
  o.addEventListener('input', () => { dem(); clearTimeout(hoan); hoan = setTimeout(() => { st.nhap[th.ma] = o.value; luu(); }, 400); });
  document.getElementById('gieo').onclick = () => {
    const n = demChu(o.value);
    if (n < TOI_THIEU) { veY(null, t('g_ngan')); return; }
    if (n > TOI_DA) { veY(null, t('g_dai')); return; }
    const c = chuan(o.value);
    const kq = th.y.map(x => coY(c, x));
    const cu = yCo(th.ma);
    /* ý đã nảy mầm ở lần gieo trước được giữ lại */
    const y = kq.map((v, i) => v || !!cu[i]);
    st.thua[th.ma] = {text: o.value, gieo: ((st.thua[th.ma] || {}).gieo || 0) + 1, y};
    st.nhap[th.ma] = o.value; luu();
    veY(y);
  };
  document.getElementById('sang').onclick = () => manThu(m.ma);
}

/* ---------- THU HOẠCH: TRẢ LỜI CÂU HỎI ---------- */
let gio = null;
function dungGio() { clearInterval(gio); gio = null; }
function xao(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
let tam = null;   /* phiên thu hoạch: {ma, ds, i, sel, xong, lan, con, thuTu} */
function manThu(maMua) {
  const ds = cauMua(maMua);
  if (!ds.length) return manBanDo();
  const i = ds.findIndex(c => st.kq[c.id] == null);
  if (i < 0) return manKet(maMua);
  tam = {ma: maMua, ds, i, sel: [], xong: false, lan: false, con: GIAY, thuTu: null};
  veCau();
}
function veCau() {
  const m = MUA.find(x => x.ma === tam.ma), c = tam.ds[tam.i];
  if (!tam.thuTu) tam.thuTu = (c.dang === 'tf') ? c.pa.map((x, k) => k) : xao(c.pa.map((x, k) => k));
  const pct = Math.max(0, Math.round(tam.con / GIAY * 100)), chieu = pct <= 30;
  const chu = ['A', 'B', 'C', 'D', 'E', 'G'];
  const ketThuc = tam.xong;
  const dungHet = ketThuc && st.kq[c.id] === true;
  let pa;
  if (c.dang === 'fill') {
    pa = '<div class="tu-ds">' + tam.thuTu.map(k => {
      let cls = 'tu';
      if (ketThuc) cls += c.dung.includes(k) ? ' dung' : (tam.sel.includes(k) ? ' sai' : ' mo');
      return '<button type="button" class="' + cls + '" data-pa="' + k + '"' + (ketThuc ? ' disabled' : '') + '>' + h(c.pa[k]) + '</button>';
    }).join('') + '</div>';
  } else {
    pa = '<div class="pa-ds">' + tam.thuTu.map((k, vt) => {
      const chon = tam.sel.includes(k), dung = c.dung.includes(k);
      let cls = 'pa', ghi = '';
      if (ketThuc) {
        if (dung) { cls += ' dung'; ghi = c.dang === 'wrong' ? t('tag_paSai') : t('tag_dung'); }
        else if (chon) { cls += ' sai'; ghi = t('tag_chuaDung'); }
        else cls += ' mo';
      } else if (chon) cls += ' chon';
      const nhan = c.dang === 'tf' ? (k === 0 ? t('tf_d') : t('tf_s')) : chu[vt];
      return '<button type="button" class="' + cls + '" data-pa="' + k + '" aria-pressed="' + chon + '"' + (ketThuc ? ' disabled' : '') + '>' +
        '<span class="px chu">' + h(nhan) + '</span><span class="noi">' + h(c.pa[k]) + '</span><span class="px ghi">' + h(ghi) + '</span></button>';
    }).join('') + '</div>';
  }
  let hoi = c.hoi;
  if (c.dang === 'fill' && tam.sel.length) hoi = c.hoi.replace('____', '[ ' + c.pa[tam.sel[0]] + ' ]');
  let cuoi = '';
  if (ketThuc) {
    const lop = tam.lan ? 'lan' : (dungHet ? 'dung' : 'sai');
    cuoi = '<div class="phan-hoi ' + lop + '" role="status"><span class="px">' + tk(tam.lan ? 'fb_lan' : (dungHet ? 'fb_dung' : 'fb_sai')) + '</span> ' + h(c.giaiThich) + '</div>' +
      (tam.i < tam.ds.length - 1 ? '<button type="button" class="pbtn" id="tiep">' + tk('th_tiep') + '</button>' : '<button type="button" class="pbtn" id="ket">' + tk('th_ket') + '</button>');
  } else if (c.dang === 'multi') {
    cuoi = '<span class="nhieu-ghi">' + tk('th_nhieu') + '</span><button type="button" class="pbtn" id="gat">' + tk('th_gat') + '</button>';
  }
  const html = dauTrang('bando', tk('th_tieuDe'), tk('th_dong', {mua: tenMua(m), n: tam.i + 1, tong: tam.ds.length}),
    '<span class="chip">' + tk('bd_lua') + ' <b>' + dungMua(tam.ma) + '</b></span>' + chipNhac(true)) +
    '<main class="than"><div class="thu">' +
    '<nav class="cu-ds" aria-label="Nông cụ theo dạng câu hỏi">' + ['tf', 'one', 'wrong', 'multi', 'fill'].map(d =>
      '<div class="cu' + (d === c.dang ? ' dang' : '') + '"><div>' + iconCu(d) + '<span class="px">' + tk('cu_' + d) + '</span></div><small>' + tk('kd_' + d) + '</small></div>').join('') + '</nav>' +
    '<div><section class="giay cau" aria-label="Câu hỏi">' +
      '<div class="gio"><svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="1" width="6" height="10" fill="#ffd65a"/><rect x="1" y="3" width="10" height="6" fill="#ffd65a"/><rect x="4" y="2" width="2" height="2" fill="#fff1a8"/></svg>' +
      '<div class="thanh"><i id="gio-thanh" class="' + (chieu ? 'chieu' : '') + '" style="width:' + pct + '%"></i></div><span class="px" id="gio-chu">' + h(tam.con > 0 ? t('th_gio', {s: tam.con}) : t('th_lan')) + '</span></div>' +
      '<p class="px dong-cu">' + tk('ln_' + c.dang) + '</p>' +
      '<h2>' + h(hoi) + '</h2>' + pa +
      '<div class="cau-cuoi">' + cuoi + '</div></section>' +
    '<section class="o-ds" aria-label="Ruộng thu hoạch">' + tam.ds.map((x, k) => {
      const kq = st.kq[x.id];
      const nhan = kq === true ? t('o_gat') : kq === false ? t('o_heo') : (k === tam.i ? t('o_dang') : t('o_cho'));
      return '<div class="o' + (k === tam.i ? ' dang' : '') + '">' + veO(kq) + '<span class="px">' + h(nhan) + '</span></div>';
    }).join('') + '</section></div></div></main>';
  ve(html, 'Thu hoạch · ' + tenMua(m) + ' · câu ' + (tam.i + 1), 'thu', chieu, 'thu_' + tam.ma);
  app.querySelectorAll('[data-pa]').forEach(b => b.onclick = () => chonPa(+b.dataset.pa));
  const g = document.getElementById('gat'); if (g) g.onclick = () => chot(false);
  const tp = document.getElementById('tiep'); if (tp) tp.onclick = () => { tam.i++; tam.sel = []; tam.xong = false; tam.lan = false; tam.con = GIAY; tam.thuTu = null; veCau(); };
  const kt = document.getElementById('ket'); if (kt) kt.onclick = () => manKet(tam.ma);
  if (!ketThuc) chayGio();
}
function chayGio() {
  dungGio();
  gio = setInterval(() => {
    if (SUA && SUA.bat) return;   /* đang sửa chữ thì đồng hồ đứng */
    if (!tam || tam.xong) { dungGio(); return; }
    tam.con--;
    if (tam.con <= 0) { tam.con = 0; chot(true); return; }
    const pct = Math.round(tam.con / GIAY * 100), th = document.getElementById('gio-thanh'), ch = document.getElementById('gio-chu');
    if (th) { th.style.width = pct + '%'; th.classList.toggle('chieu', pct <= 30); }
    if (ch) ch.textContent = t('th_gio', {s: tam.con});
    if (pct <= 30) datNen('thu', true);
  }, 1000);
}
function chonPa(k) {
  if (!tam || tam.xong) return;
  const c = tam.ds[tam.i];
  if (c.dang === 'multi') {
    tam.sel = tam.sel.includes(k) ? tam.sel.filter(x => x !== k) : tam.sel.concat([k]);
    app.querySelectorAll('[data-pa]').forEach(b => { const on = tam.sel.includes(+b.dataset.pa); b.classList.toggle('chon', on); b.setAttribute('aria-pressed', on); });
    return;
  }
  tam.sel = [k]; chot(false);
}
function chot(hetGio) {
  if (!tam || tam.xong) return;
  dungGio();
  const c = tam.ds[tam.i];
  const sel = tam.sel.slice().sort((a, b) => a - b), d = c.dung.slice().sort((a, b) => a - b);
  const dung = !hetGio && sel.length === d.length && d.every((x, k) => sel[k] === x);
  tam.xong = true; tam.lan = hetGio;
  st.kq[c.id] = dung; luu();
  veCau();
}

/* ---------- KẾT MÙA ---------- */
function manKet(maMua) {
  const i = MUA.findIndex(x => x.ma === maMua), m = MUA[i], sau = MUA[i + 1];
  const ds = cauMua(maMua), dung = dungMua(maMua);
  const yTong = m.thua.reduce((s, th) => s + th.y.length, 0), yDa = m.thua.reduce((s, th) => s + soYCo(th.ma), 0);
  const thieu = [];
  /* chỉ nêu ý còn thiếu của thửa đã gieo; thửa chưa gieo ghi "chưa gieo" */
  m.thua.forEach(th => { if (!(st.thua[th.ma] && st.thua[th.ma].gieo)) return; const y = yCo(th.ma); th.y.forEach((x, k) => { if (!y[k]) thieu.push(x.ten + ' (mục ' + th.ma + ')'); }); });
  const chuaXong = m.thua.find(th => soYCo(th.ma) < th.y.length);
  const theoCu = ['tf', 'one', 'wrong', 'multi', 'fill'].map(d => { const c = ds.filter(x => x.dang === d); return c.length ? {d, a: c.filter(x => st.kq[x.id] === true).length, b: c.length} : null; }).filter(Boolean);
  const sai = ds.filter(x => st.kq[x.id] === false);
  const xongBon = MUA.every(x => cauMua(x.ma).every(c => st.kq[c.id] != null));
  const ttY = MUA.reduce((s, x) => s + x.thua.reduce((a, th) => a + th.y.length, 0), 0);
  const html = '<main class="than"><div class="ket-ten"><h1 class="px">' + tk('k_tieuDe', {mua: tenMua(m).toUpperCase()}) + '</h1></div>' +
    '<div class="ket">' +
    (xongBon ? '<p class="px hoan-thanh">' + tk('k_hoanThanh', {a: tongLua(), b: CAU.length, c: tongCay(), d: ttY}) + '</p>' : '') +
    '<section class="giay" aria-label="Gieo hạt"><div class="ket-dau"><h2 class="px">' + tk('k_gieo') + '</h2><span class="px" style="color:#3f8a2a">' + h(t('k_y', {a: yDa, b: yTong})) + '</span></div>' +
      m.thua.map(th => '<div class="dong"><span>' + h(th.ma + ' · ' + th.ten) + '</span><b>' + h(st.thua[th.ma] && st.thua[th.ma].gieo ? t('k_y', {a: soYCo(th.ma), b: th.y.length}) : t('k_chuaGieo')) + '</b></div>').join('') +
      '<p class="px nho">' + tk('k_docLai') + '</p>' +
      (thieu.length ? '<ul>' + thieu.map(x => '<li>' + h(x) + '</li>').join('') + '</ul>' : '<p>' + tk('k_docLaiKhong') + '</p>') +
      (chuaXong ? '<div class="ket-cuoi" style="margin-top:.4em"><button type="button" class="pbtn nhat" data-gieo="' + h(chuaXong.ma) + '">' + tk('k_gieoLai', {ma: chuaXong.ma}) + '</button></div>' : '') +
    '</section>' +
    '<section class="giay" aria-label="Thu hoạch"><div class="ket-dau"><h2 class="px">' + tk('k_thu') + '</h2><span class="px" style="color:#a8751a">' + h(t('k_lua', {a: dung, b: ds.length})) + '</span></div>' +
      '<div class="cu-diem">' + theoCu.map(x => '<div><span class="px">' + tk('cu_' + x.d) + '</span><span class="px diem">' + x.a + '/' + x.b + '</span></div>').join('') + '</div>' +
      '<p class="px nho">' + tk('k_chuaDung') + '</p>' +
      (sai.length ? '<ul>' + sai.map(x => '<li>' + h(x.giaiThich) + ' <span class="sua-nho">(mục ' + h(x.muc) + ')</span></li>').join('') + '</ul>' : '<p>' + tk('k_khongSai') + '</p>') +
    '</section></div>' +
    '<div class="ket-cuoi">' + chipNhac(false) +
      (sau ? '<button type="button" class="pbtn" id="sang">' + tk('k_sang', {mua: tenMua(sau), phan: sau.phan.replace(/^[IVX]+\.\s*/, '')}) + ICON.toi + '</button>'
           : '<button type="button" class="pbtn" id="sang">' + tk('k_veBanDo') + ICON.toi + '</button>') +
    '</div></main>';
  ve(html, 'Kết mùa · ' + tenMua(m), 'ket', false, null);
  phatCanh(xongBon && !st.daHoanThanh ? 'hoanThanh' : 'ket');
  if (xongBon && !st.daHoanThanh) { st.daHoanThanh = true; luu(); }
  document.getElementById('sang').onclick = manBanDo;
  app.querySelectorAll('[data-gieo]').forEach(b => b.onclick = () => manGieo(b.dataset.gieo));
}

/* =====================================================================
   CHẾ ĐỘ SỬA (?sua=1) — theo khuôn game Quy tụ, chỉ sửa chữ (không sửa giao diện).
   Sửa chữ: bấm vào chữ để sửa tại chỗ; chuyển sang "chơi thử" để đi tới màn khác.
   Lưu trên máy (localStorage "trong-nguoi-sua"); "Tải tệp sửa" xuất sua-chu-trong-nguoi.json,
   cong-cu/ap-sua-chu.py đưa vào noi-dung.json / _khuon.html rồi dựng lại game.
   Trang không có ?sua=1 (trang sinh viên) không có chế độ này.
   ===================================================================== */
if (SUA) {
  const $ = s => document.querySelector(s);
  const luuSua = () => { try { localStorage.setItem(KHOA_SUA, JSON.stringify({bat: SUA.bat, chu: SUA.chu, chuGD: SUA.chuGD})); } catch (e) {} };
  const bao = (tx, ms) => { const e = $('#sua-bao'); e.textContent = tx; e.hidden = false; clearTimeout(bao.t); bao.t = setTimeout(() => { e.hidden = true; }, ms || 3000); };
  /* chữ đã sửa hiện ngay cả khi game vẽ lại màn */
  const apSua = goc => {
    if (!SUA.chu.length) return;
    const doi = new Map(SUA.chu.map(x => [x.cu, x.moi]));
    const thay = n => { const tx = n.data.trim(); if (tx && doi.has(tx)) n.data = n.data.replace(tx, doi.get(tx)); };
    if (goc.nodeType === 3) { thay(goc); return; }
    if (goc.nodeType !== 1 || goc.closest('#sua-khung')) return;
    const w = document.createTreeWalker(goc, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) thay(n);
  };
  new MutationObserver(ds => ds.forEach(m => m.addedNodes.forEach(apSua))).observe(app, {childList: true, subtree: true});
  const khung = document.createElement('div'); khung.id = 'sua-khung';
  khung.innerHTML = '<div class="sua-thanh"><b>✎ Chế độ sửa</b><button type="button" id="sua-bat"></button><span id="sua-dem"></span>' +
    '<button type="button" id="sua-ch-nut">Chữ hiển thị</button><button type="button" id="sua-xem">Danh sách</button><button type="button" id="sua-tai" class="chinh">Tải tệp sửa</button><button type="button" id="sua-gon" title="Thu gọn thanh sửa">–</button></div>' +
    '<div id="sua-bao" class="sua-hop" hidden></div>' +
    '<div id="sua-ds" class="sua-hop" hidden></div>' +
    '<div id="sua-ch" class="sua-hop" hidden><p class="sua-nho" style="margin:0 0 .4rem">Mọi chữ giao diện của game. Gõ là đổi ngay trên trang. Giữ nguyên các chỗ trong ngoặc nhọn như {n}, {tong}, {a}, {b}, {s}, {mua}, {ma}: máy điền số, chữ vào đó. Ô có viền vàng là chữ đã sửa.</p><div id="sua-ch-ds"></div><button type="button" id="sua-ch-goc">Trả mọi chữ hiển thị về gốc</button></div>' +
    '<div id="sua-o" class="sua-hop" hidden><div class="sua-nho" id="sua-goc"></div><textarea id="sua-chu" rows="3"></textarea>' +
      '<div class="sua-nut"><button type="button" id="sua-xong" class="chinh">Xong (Enter)</button><button type="button" id="sua-tra">Trả chữ gốc</button><button type="button" id="sua-huy">Hủy (Esc)</button></div></div>';
  document.body.appendChild(khung);
  document.body.classList.add('co-sua');
  let dang = null, xoaLan = 0;
  const chuGocCua = k => (DB.chuGiaoDien && DB.chuGiaoDien[k] != null) ? DB.chuGiaoDien[k] : CHU_GOC[k];
  /* vẽ lại màn đang mở để chữ hiển thị mới hiện ngay */
  const veLai = () => {
    if (manHienTai === 'Màn chào') manChao(); else if (manHienTai === 'Bản đồ') manBanDo(); else if (manHienTai === 'Âm nhạc') manNhac();
    else if (manHienTai.indexOf('Thu hoạch') === 0 && tam) veCau(); else if (manHienTai.indexOf('Kết mùa') === 0 && tam) manKet(tam.ma);
    else if (manHienTai.indexOf('Gieo hạt · thửa ') === 0) manGieo(manHienTai.slice(16));
  };
  const ghiMa = (k, moi, tuBang) => {
    if (moi === chuGocCua(k)) delete SUA.chuGD[k]; else SUA.chuGD[k] = moi;
    luuSua();
    if (!tuBang) veThanh(); else $('#sua-dem').textContent = (SUA.chu.length + Object.keys(SUA.chuGD).length) + ' chỗ sửa chữ';
    veLai();
    if (tuBang) { const o = khung.querySelector('[data-ck="' + k + '"]'); if (o) o.classList.toggle('da-sua', SUA.chuGD[k] != null); }
  };
  const veBangChu = () => {
    $('#sua-ch-ds').innerHTML = Object.keys(CHU_GOC).map(k =>
      '<label class="sua-ch-dong"><span>' + h(NHAN_CHU[k] || k) + '</span><input type="text" data-ck="' + k + '" value="' + h(t(k)) + '"' + (SUA.chuGD[k] != null ? ' class="da-sua"' : '') + '></label>').join('');
  };
  const veThanh = () => {
    $('#sua-bat').textContent = SUA.bat ? 'Đang sửa chữ — bấm vào chữ' : 'Đang chơi thử — bấm để sửa tiếp';
    $('#sua-bat').classList.toggle('bat', SUA.bat); document.body.classList.toggle('dang-sua', SUA.bat);
    const soCh = Object.keys(SUA.chuGD).length;
    $('#sua-dem').textContent = (SUA.chu.length + soCh) + ' chỗ sửa chữ';
    $('#sua-ds').innerHTML = (SUA.chu.length || soCh)
      ? '<ol>' + SUA.chu.map((x, i) => '<li><span class="sua-nho">' + h(x.man) + '</span><br><s>' + h(x.cu) + '</s><br><b>' + h(x.moi) + '</b> <button type="button" data-bo="' + i + '" title="Bỏ chỗ sửa này">↩ bỏ</button></li>').join('') +
        Object.keys(SUA.chuGD).map(k => '<li><span class="sua-nho">Chữ hiển thị · ' + h(NHAN_CHU[k] || k) + '</span><br><s>' + h(chuGocCua(k)) + '</s><br><b>' + h(SUA.chuGD[k]) + '</b> <button type="button" data-bok="' + k + '" title="Bỏ chỗ sửa này">↩ bỏ</button></li>').join('') +
        '</ol><button type="button" id="sua-xoa">Xóa hết danh sách</button>'
      : '<p>Chưa sửa chỗ nào.</p>';
    veBangChu();
  };
  const ghiSua = (cu, moi) => {
    const i = SUA.chu.findIndex(x => x.cu === cu);
    if (moi === cu) { if (i >= 0) SUA.chu.splice(i, 1); }
    else if (i >= 0) SUA.chu[i].moi = moi;
    else SUA.chu.push({man: manHienTai, cu, moi});
    luuSua(); veThanh();
  };
  const moSuaMa = k => {
    dang = {k};
    $('#sua-goc').textContent = 'Chữ hiển thị · ' + (NHAN_CHU[k] || k) + ' · chữ gốc: “' + chuGocCua(k) + '”' + (/\{\w+\}/.test(chuGocCua(k)) ? ' — giữ nguyên chỗ {…}' : '');
    $('#sua-chu').value = t(k); $('#sua-o').hidden = false; $('#sua-chu').focus(); $('#sua-chu').select();
  };
  const moSua = n => {
    const tx = n.data.trim(), r = SUA.chu.find(x => x.moi === tx), cu = r ? r.cu : tx;
    dang = {n, cu};
    $('#sua-goc').textContent = manHienTai + ' · chữ gốc: “' + cu + '”';
    $('#sua-chu').value = tx; $('#sua-o').hidden = false; $('#sua-chu').focus(); $('#sua-chu').select();
  };
  const dong = () => { $('#sua-o').hidden = true; dang = null; };
  const xong = moiChu => {
    if (!dang) return; moiChu = moiChu.replace(/\s+/g, ' ').trim();
    if (dang.k) { if (moiChu) ghiMa(dang.k, moiChu); dong(); return; }
    if (moiChu) { const tx = dang.n.data.trim(); dang.n.data = dang.n.data.replace(tx, moiChu); ghiSua(dang.cu, moiChu); }
    dong();
  };
  /* chữ nằm dưới con trỏ: nút chữ chứa điểm bấm; không lấy được thì lấy chữ duy nhất của phần tử bấm vào */
  const chuTai = e => {
    let n = null;
    if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(e.clientX, e.clientY); n = p && p.offsetNode; }
    else if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(e.clientX, e.clientY); n = r && r.startContainer; }
    if (n && n.nodeType === 3) { const r = document.createRange(); r.selectNodeContents(n);
      if (![...r.getClientRects()].some(b => e.clientX >= b.left - 2 && e.clientX <= b.right + 2 && e.clientY >= b.top - 2 && e.clientY <= b.bottom + 2)) n = null; }
    if (!n || n.nodeType !== 3 || !n.data.trim()) { const ts = [...e.target.childNodes].filter(x => x.nodeType === 3 && x.data.trim()); n = ts.length === 1 ? ts[0] : null; }
    return n;
  };
  document.addEventListener('click', e => {
    if (!SUA.bat || e.target.closest('#sua-khung') || !e.target.closest('#app')) return;
    if (e.target.closest('textarea')) return;
    e.preventDefault(); e.stopPropagation();
    const ma = e.target.closest('[data-k]');
    if (ma) { moSuaMa(ma.dataset.k); return; }
    const n = chuTai(e);
    if (n) moSua(n);
  }, true);
  let tro = null;
  document.addEventListener('mouseover', e => { if (tro) tro.classList.remove('sua-tro'); tro = null;
    if (SUA.bat && !e.target.closest('#sua-khung') && e.target.closest('#app') && e.target !== app && !e.target.classList.contains('man')) { tro = e.target; tro.classList.add('sua-tro'); } });
  $('#sua-bat').onclick = () => { SUA.bat = !SUA.bat; dong(); luuSua(); veThanh(); };
  $('#sua-xem').onclick = () => { $('#sua-ds').hidden = !$('#sua-ds').hidden; };
  $('#sua-ch-nut').onclick = () => { $('#sua-ch').hidden = !$('#sua-ch').hidden; };
  $('#sua-ch-ds').addEventListener('input', e => { const o = e.target.closest('[data-ck]'); if (!o) return; ghiMa(o.dataset.ck, o.value, true); });
  $('#sua-ch-goc').onclick = () => { SUA.chuGD = {}; luuSua(); veThanh(); veLai(); };
  $('#sua-gon').onclick = () => { const gon = khung.classList.toggle('gon'); $('#sua-gon').textContent = gon ? '✎' : '–'; $('#sua-gon').title = gon ? 'Mở thanh sửa' : 'Thu gọn thanh sửa'; };
  $('#sua-ds').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'sua-xoa') {
      if (Date.now() - xoaLan > 4000) { xoaLan = Date.now(); bao('Bấm “Xóa hết danh sách” lần nữa để xóa mọi chỗ sửa chữ trên máy này.', 4000); return; }
      SUA.chu = []; SUA.chuGD = {}; luuSua(); location.reload(); return; }
    if (b.dataset.bok) { ghiMa(b.dataset.bok, chuGocCua(b.dataset.bok)); return; }
    if (b.dataset.bo) { SUA.chu.splice(+b.dataset.bo, 1); luuSua(); location.reload(); } };
  $('#sua-tai').onclick = () => {
    const coCh = Object.keys(SUA.chuGD).length > 0;
    if (!SUA.chu.length && !coCh) { bao('Chưa sửa chỗ nào.'); return; }
    const a = document.createElement('a');
    /* chữ hiển thị xuất trọn bộ đang dùng (bản trong noi-dung.json + chỗ mới sửa), để đưa vào không mất chỗ sửa lần trước */
    const chuGiaoDien = coCh ? Object.assign({}, DB.chuGiaoDien || {}, SUA.chuGD) : null;
    a.href = URL.createObjectURL(new Blob([JSON.stringify({game: 'trong-nguoi', luc: new Date().toISOString(), sua: SUA.chu, chuGiaoDien}, null, 2)], {type: 'application/json'}));
    a.download = 'sua-chu-trong-nguoi.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    bao('Đã tải sua-chu-trong-nguoi.json — gửi tệp này để đưa chữ đã sửa vào game.', 5000);
  };
  $('#sua-xong').onclick = () => xong($('#sua-chu').value);
  $('#sua-tra').onclick = () => { if (dang && dang.k) { ghiMa(dang.k, chuGocCua(dang.k)); dong(); } else if (dang) xong(dang.cu); };
  $('#sua-huy').onclick = dong;
  $('#sua-chu').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); xong(e.target.value); } else if (e.key === 'Escape') dong(); });
  veThanh();
}
manChao();
</script>
</body>
</html>
