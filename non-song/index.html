<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Non sông một dải</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,500;1,700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Giao diện: tranh phong cảnh vẽ tay — trời xanh, trăng lớn mờ, mây kem, núi xa, biển, vách đá, tán lá.
   Chữ nằm trên "giấy" màu kem hoặc lớp sương mờ; không đặt chữ trực tiếp lên cảnh. */
:root{
  --troi:#5DB3DD; --troi-dam:#2E8FCB;
  --giay:#FBF7EC; --giay2:#EFE8D3; --vien-giay:#DCD2B4;
  --suong:rgba(251,248,238,.84);
  --muc:#1F2D30; --muc2:#56676B;
  --rung:#2F6B3A; --rung2:#438C4C; --rung-dam:#1D4A2B; --la-non:#E3EFD9;
  --bien:#2A7FA6; --bien-dam:#1C5D78;
  --nang:#F2C75C; --nang2:#FFF0C4;
  --do:#C8443A; --do2:#E0574B; --toi:#0D2127;
  --dat:#D5DCCB; --dat-vien:#4F6B5E; --sang:#D2493A;
  --dung:#2F7D4A; --sai:#C8443A; --r:16px;
  --tieu:"Lora","Palatino Linotype",Cambria,serif;
  --than:"Be Vietnam Pro",system-ui,sans-serif;
  --bong:0 10px 28px rgba(13,33,39,.20), 0 2px 0 rgba(13,33,39,.06);
  font-size:clamp(16px, .4vw + 13px, 19px);
}
*{ box-sizing:border-box; }
html{ background:#6DB9DF; }
html,body{ margin:0; }
body{ min-height:100vh; color:var(--muc); font-family:var(--than); line-height:1.5; -webkit-text-size-adjust:100%; }
h1,h2,h3{ font-family:var(--tieu); font-weight:700; line-height:1.2; margin:.2em 0 .4em; }
h1{ font-size:2.2rem; } h2{ font-size:1.45rem; } h3{ font-size:1.15rem; }
main{ position:relative; z-index:1; max-width:46rem; margin:0 auto; padding:1rem 1rem 6rem; }
body[data-man="s-chieu"] main{ max-width:none; padding:0; }
[hidden]{ display:none !important; }
.nho{ font-size:.85rem; } .mo{ opacity:.85; }
.suong{ background:var(--suong); -webkit-backdrop-filter:blur(10px) saturate(1.15); backdrop-filter:blur(10px) saturate(1.15);
  border-radius:999px; padding:.35rem .9rem; color:var(--muc); box-shadow:0 4px 14px rgba(13,33,39,.12); }
.giay{ background:rgba(251,247,236,.96); color:var(--muc); border-radius:var(--r); padding:1rem 1.1rem; margin:.8rem 0;
  border:1px solid rgba(255,255,255,.7); box-shadow:var(--bong); }
.giay h2,.giay h3{ color:var(--rung-dam); }

/* cảnh nền: ba lớp vẽ bằng canvas (trời – mây – đất), lớp mây trôi rất chậm */
#canh{ position:fixed; left:0; top:0; width:100%; height:100vh; height:100lvh; z-index:0; overflow:hidden; pointer-events:none;
  background:linear-gradient(#2E8FCB, #6DB9DF 40%, #CBE6EC 66%, #3C9CC4 70%, #1F6F96); }
#canh canvas{ position:absolute; top:0; left:0; width:100%; height:100%; display:block; }
#canh #cn-may{ left:-6%; width:112%; animation:may-troi 120s ease-in-out infinite alternate; will-change:transform; }
@keyframes may-troi{ from{ transform:translateX(-2.5%); } to{ transform:translateX(2.5%); } }
@media (prefers-reduced-motion:reduce){ #canh #cn-may{ animation:none; } }

.nut{ font:700 1rem var(--than); border:0; border-radius:14px; padding:.7rem 1.15rem; cursor:pointer; min-height:46px;
  background:linear-gradient(var(--rung2), var(--rung)); color:var(--giay); box-shadow:0 4px 0 var(--rung-dam), 0 8px 18px rgba(13,33,39,.22);
  transition:transform .08s, box-shadow .08s, filter .15s; }
.nut:hover{ filter:brightness(1.06); }
.nut:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--rung-dam), 0 4px 10px rgba(13,33,39,.2); }
.nut:disabled{ opacity:.45; cursor:default; }
.nut.phu{ background:var(--giay); color:var(--rung-dam); box-shadow:0 4px 0 #C9BE9C, 0 8px 18px rgba(13,33,39,.16); }
.nut.phu:active{ box-shadow:0 2px 0 #C9BE9C; }
.nut.do{ background:linear-gradient(var(--do2), var(--do)); color:#fff; box-shadow:0 4px 0 #842A22, 0 8px 18px rgba(13,33,39,.22); }
.nut.lon{ width:100%; font:700 1.15rem var(--tieu); padding:.8rem 1rem; }
.hang-nut{ display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.8rem; }
label.o{ display:block; font-weight:700; margin:.8rem 0 .3rem; color:var(--rung-dam); }
input,select{ font:inherit; color:var(--muc); background:#fff; border:2px solid var(--vien-giay); border-radius:12px; padding:.6rem .7rem; width:100%; }
input:focus,select:focus{ outline:none; border-color:var(--bien); box-shadow:0 0 0 3px rgba(42,127,166,.2); }
.loi{ color:var(--do); font-weight:700; }
#bao{ position:fixed; left:50%; top:1rem; transform:translateX(-50%); background:var(--giay); color:var(--muc); padding:.6rem 1rem; border-radius:14px;
  box-shadow:0 8px 24px rgba(13,33,39,.3); z-index:60; font-weight:600; max-width:90vw; }
#phu{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; text-align:center; padding:1rem; cursor:pointer;
  background:radial-gradient(ellipse at 50% 45%, rgba(246,250,248,.93), rgba(214,236,242,.9) 70%);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); color:var(--muc); }
#phu .vao{ max-width:30rem; animation:hien-ra .5s ease-out; }
@keyframes hien-ra{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
#phu .ban-do{ width:min(56vw, 15rem); margin:0 auto; }
#phu h2{ font-size:clamp(1.8rem, 7vmin, 3.6rem); color:var(--rung-dam); margin:.3em 0 .1em; }
#phu p{ font-size:1.1rem; margin:.3em auto; }

/* trang đầu */
.dau{ text-align:center; padding-top:1.4rem; }
.dau .ban-do{ width:min(44vw, 13rem); display:block; }
.dau h1{ font-size:clamp(2rem, 8vw, 3.8rem); color:#FFFDF6; margin:.4rem 0 .1rem; letter-spacing:.01em;
  text-shadow:0 2px 0 rgba(13,45,60,.45), 0 0 18px rgba(13,45,60,.55), 0 0 40px rgba(13,45,60,.35); }
.dau .phu-de{ display:inline-block; font-weight:600; margin:.3rem 0 1rem; }
.cua{ display:grid; gap:.7rem; text-align:left; margin-top:1rem; }
.cua button{ display:block; width:100%; text-align:left; font:inherit; color:var(--muc); background:rgba(251,247,236,.95); border:1px solid rgba(255,255,255,.7);
  border-left:6px solid var(--rung2); border-radius:var(--r); padding:.85rem 1.1rem; cursor:pointer; box-shadow:var(--bong); transition:transform .12s, box-shadow .12s; }
.cua button:nth-child(2){ border-left-color:var(--bien); }
.cua button:nth-child(3){ border-left-color:var(--nang); }
.cua button:nth-child(4){ border-left-color:#9AA79F; }
.cua button:hover{ transform:translateY(-2px); box-shadow:0 14px 32px rgba(13,33,39,.24); }
.cua button b{ display:block; font:700 1.22rem var(--tieu); color:var(--rung-dam); }
.cua button span{ font-size:.88rem; color:var(--muc2); }
.ve{ background:var(--suong); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:0; border-radius:999px; color:var(--rung-dam);
  font:600 .95rem var(--than); cursor:pointer; padding:.4rem .9rem; box-shadow:0 4px 14px rgba(13,33,39,.12); }
#d-nguon{ display:inline-block; border-radius:12px; }
table.bd{ border-collapse:collapse; width:100%; font-size:.92rem; }
table.bd td,table.bd th{ border-bottom:1px solid var(--vien-giay); padding:.4rem .3rem; text-align:left; vertical-align:top; }
table.bd th{ color:var(--rung-dam); }

/* bản đồ */
.ban-do{ display:block; height:auto; }
.ban-do .bien{ fill:none; }
.ban-do .mien{ fill:var(--dat); transition:fill .6s; }
.ban-do .mien.sang{ fill:var(--sang); }
.ban-do .vien-dat{ fill:none; stroke:var(--dat-vien); stroke-width:1.6; stroke-linejoin:round; }
.ban-do .duong-cat{ fill:none; stroke:#20332A; stroke-width:2.4; stroke-dasharray:7 5; }
.ban-do .dao{ fill:var(--dat); stroke:var(--dat-vien); stroke-width:1; }
.ban-do .dao.sang{ fill:var(--sang); }
.ban-do text{ font:600 15px var(--than); fill:var(--muc); opacity:.75; }
.ban-do text.bien-dong{ font-style:italic; fill:var(--bien-dam); opacity:.7; }
.ban-do .sao{ fill:#FFD54A; }
#d-ban-do{ display:inline-block; padding:.6rem 1.2rem .4rem; border-radius:44px; background:rgba(28,93,120,.3);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(13,33,39,.2); }
.dau .ban-do text{ fill:#FFFDF6; opacity:.95; }

/* điện thoại */
.dau-dt{ display:grid; grid-template-columns:4.2rem 1fr auto; gap:.8rem; align-items:center; position:sticky; top:0; z-index:5;
  margin:-1rem -1rem 0; padding:.6rem 1rem .55rem; background:var(--suong); -webkit-backdrop-filter:blur(12px) saturate(1.15); backdrop-filter:blur(12px) saturate(1.15);
  border-bottom:1px solid rgba(255,255,255,.7); box-shadow:0 6px 20px rgba(13,33,39,.14); }
.dau-dt .ban-do{ width:4.2rem; }
.dau-dt h2{ margin:0; color:var(--rung-dam); font-size:1.3rem; }
.vong-so{ font-size:.78rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--bien-dam); }
.dh{ font:700 1.5rem/1 var(--than); font-variant-numeric:tabular-nums; background:var(--rung-dam); color:var(--giay); border-radius:12px; padding:.4rem .6rem; min-width:4.6ch; text-align:center; }
.dh.cuoi{ background:var(--do); color:#fff; }
.dh:empty{ display:none; }
.huong{ font-size:.92rem; background:var(--suong); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-left:4px solid var(--bien);
  padding:.55rem .8rem; border-radius:10px; margin:.9rem 0; box-shadow:0 4px 14px rgba(13,33,39,.1); }
.ld{ background:rgba(251,247,236,.96); color:var(--muc); border-radius:var(--r); padding:.7rem .9rem; margin:.6rem 0; box-shadow:var(--bong); }
.ld .nhan{ font:700 .82rem var(--than); color:var(--rung); text-transform:uppercase; letter-spacing:.05em; }
.ld p{ margin:.2rem 0 0; font-size:1.05rem; line-height:1.9; }
.o-trong{ font:700 1rem var(--than); border:2px dashed var(--muc2); background:#fff; color:var(--muc2); border-radius:10px;
  padding:.15rem .7rem; min-height:40px; cursor:pointer; vertical-align:middle; text-align:left; }
.o-trong.chon{ border:3px solid var(--nang); background:var(--nang2); color:var(--muc); }
.o-trong.day{ border:2px solid var(--rung2); background:var(--la-non); color:var(--rung-dam); }
.o-trong.day.chon{ border-color:var(--nang); }
.khay{ background:linear-gradient(var(--bien), var(--bien-dam)); color:var(--giay); border-radius:var(--r); padding:.6rem .6rem .7rem; margin:.6rem 0 0; }
.ld.dang{ outline:3px solid var(--nang); outline-offset:1px; }
.khay .tieu{ font-size:.8rem; font-weight:700; opacity:.9; margin-bottom:.4rem; }
.chips{ display:flex; flex-wrap:wrap; gap:.5rem; }
.chip{ font:600 .98rem var(--than); background:var(--giay); color:var(--muc); border:0; border-radius:10px; padding:.5rem .75rem;
  cursor:pointer; text-align:left; box-shadow:0 3px 0 rgba(10,40,55,.35); min-height:44px; }
.ro-hai{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin:.6rem 0; }
.ro{ background:rgba(251,247,236,.96); color:var(--muc); border-radius:var(--r); padding:.6rem .7rem; box-shadow:var(--bong); border-top:5px solid var(--rung2); }
.ro + .ro{ border-top-color:var(--bien); }
.ro .nhan{ font:700 .78rem var(--than); color:var(--rung); text-transform:uppercase; letter-spacing:.04em; }
.ro .o-trong{ width:100%; margin:.3rem 0; font-size:.92rem; }
.ro .dem{ font-size:.82rem; color:var(--muc2); font-weight:700; }
.the{ background:rgba(251,247,236,.96); color:var(--muc); border-radius:var(--r); padding:.6rem .8rem; margin:.55rem 0; box-shadow:var(--bong); }
.the p{ margin:0 0 .45rem; font-weight:600; }
.ba-nut{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:.4rem; }
.ba-nut button{ font:700 .9rem var(--than); border:2px solid var(--vien-giay); background:#fff; color:var(--muc); border-radius:10px; padding:.45rem .3rem; min-height:42px; cursor:pointer; }
.ba-nut button.on{ background:var(--rung); color:#fff; border-color:var(--rung); }
.ba-nut button:nth-child(2).on{ background:var(--bien); border-color:var(--bien); }
.ba-nut button.on.rieng{ background:var(--muc2); border-color:var(--muc2); }
.cau-noi{ background:rgba(251,247,236,.96); color:var(--muc); border-radius:var(--r); padding:.8rem .9rem; margin:.7rem 0; box-shadow:var(--bong); }
.cau-noi blockquote{ margin:0 0 .6rem; padding-left:.8rem; border-left:3px solid var(--nang); font:italic 500 1.08rem/1.6 var(--tieu); }
.cau-noi .trong-chu{ font:normal 700 1rem var(--than); color:var(--rung-dam); background:var(--nang2); border-radius:6px; padding:0 .3rem; }
.hoi{ margin:.5rem 0 0; }
.hoi .nhan{ font-size:.8rem; font-weight:700; color:var(--rung); text-transform:uppercase; letter-spacing:.04em; margin-bottom:.25rem; }
.pa{ display:grid; gap:.35rem; }
.pa button{ font:600 .95rem var(--than); text-align:left; border:2px solid var(--vien-giay); background:#fff; color:var(--muc); border-radius:10px; padding:.45rem .7rem; min-height:42px; cursor:pointer; }
.pa button.on{ background:var(--rung); color:#fff; border-color:var(--rung); }
.chan{ position:sticky; bottom:0; z-index:6; margin:0 -1rem; padding:1.6rem 1rem .7rem; background:linear-gradient(rgba(13,33,39,0), rgba(13,33,39,.78) 42%, rgba(13,33,39,.88)); }
.chan .nho{ text-align:center; margin-top:.35rem; color:var(--giay); }
.kq-dau{ text-align:center; }
.kq-dau .ban-do{ width:min(46vw, 11rem); margin:0 auto; }
.kq-dau .diem{ font:700 3rem/1 var(--tieu); color:var(--rung-dam); }
.loi-bac{ font:italic 700 1.2rem/1.4 var(--tieu); color:var(--do); text-align:center; margin:.6rem 0 .1rem; }
.loi-bac + .nho{ text-align:center; color:var(--muc2); }
.xem-lai h3{ margin-top:1rem; }
.xem-lai li{ margin:.45rem 0; list-style:none; padding:.5rem .7rem; border-radius:10px; background:#fff; border-left:5px solid var(--dung); }
.xem-lai li.sai{ border-left-color:var(--sai); }
.xem-lai ul{ padding:0; margin:0; }
.xem-lai .dau-muc{ font-weight:700; }
.xem-lai .chon{ font-size:.88rem; color:var(--muc2); }
.xem-lai .dung{ font-size:.9rem; color:var(--dung); font-weight:700; }
.xem-lai .giai{ font-size:.85rem; color:var(--muc2); font-style:italic; }
.mang{ font-size:.78rem; display:inline-flex; align-items:center; gap:.35rem; opacity:.85; }
.dot{ width:.6rem; height:.6rem; border-radius:50%; background:var(--do2); display:inline-block; }
.dot.on{ background:#4DBF6B; } .dot.dang{ background:var(--nang); }

/* máy chiếu — chữ co giãn theo bề rộng khung */
.chieu{ container-type:inline-size; min-height:100vh; display:flex; flex-direction:column; }
.chieu .khung{ font-size:clamp(19px, 1.25cqi, 42px); padding:1.2cqi 2.2cqi 1.4cqi; display:flex; flex-direction:column; min-height:100vh; }
.thanh{ display:flex; align-items:center; gap:1em; flex-wrap:wrap; background:var(--suong); -webkit-backdrop-filter:blur(12px) saturate(1.15); backdrop-filter:blur(12px) saturate(1.15);
  border-radius:1em; padding:.5em 1em; box-shadow:0 8px 24px rgba(13,33,39,.16); }
.thanh .ten{ font:700 1.8em/1 var(--tieu); color:var(--rung-dam); }
.thanh .pha{ font-weight:700; color:var(--bien-dam); background:rgba(42,127,166,.12); padding:.2em .8em; border-radius:999px; }
.thanh .sp{ flex:1; }
.thanh .ma{ text-align:right; font-weight:700; font-size:.8em; line-height:1.1; color:var(--muc2); }
.thanh .ma b{ display:block; font:700 2.2em/1 var(--tieu); color:var(--rung-dam); letter-spacing:.06em; }
.dh-lon{ font:700 2.5em/1 var(--than); font-variant-numeric:tabular-nums; background:var(--rung-dam); color:var(--giay); border-radius:.3em; padding:.12em .45em; }
.dh-lon.cuoi{ background:var(--do); color:#fff; }
.dh-lon:empty{ display:none; }
.than{ flex:1; margin-top:1em; }
.than > .nho{ display:inline-block; background:var(--suong); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-radius:999px; padding:.3em .9em; }
.chan-chieu{ display:flex; gap:.8em; flex-wrap:wrap; align-items:center; margin-top:1em; }
.chan-chieu .nut{ font-size:.95em; }
.sanh{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 2fr); gap:2em; align-items:start; }
.sanh > div:first-child{ background:rgba(251,247,236,.95); border-radius:.8em; padding:1em 1.2em; box-shadow:var(--bong); }
.sanh .qr{ background:#fff; border-radius:.5em; padding:.5em; width:min(100%, 14em); }
.sanh .qr svg{ width:100%; height:auto; display:block; }
.sanh .ma-lon{ font:700 4em/1 var(--tieu); color:var(--rung-dam); letter-spacing:.08em; }
.lop{ display:grid; grid-template-columns:repeat(auto-fill, minmax(11em, 1fr)); gap:.8em; }
.nhom{ background:rgba(251,247,236,.95); color:var(--muc); border-radius:.7em; padding:.6em .8em; box-shadow:var(--bong); }
.nhom b{ font:700 1.2em var(--tieu); color:var(--rung-dam); }
.nhom .stt{ display:flex; flex-wrap:wrap; gap:.3em; margin-top:.3em; }
.nhom .stt span{ font-weight:700; font-size:.8em; background:var(--la-non); color:var(--rung-dam); border-radius:.3em; padding:0 .4em; }
.lop-choi{ display:grid; grid-template-columns:repeat(auto-fit, minmax(13em, 1fr)); gap:1em; }
.nhom-choi{ background:rgba(251,247,236,.95); color:var(--muc); border-radius:.7em; padding:.7em .9em; display:grid; grid-template-columns:5.5em 1fr; gap:.8em; align-items:center; box-shadow:var(--bong); }
.nhom-choi .ban-do{ width:5.5em; }
.nhom-choi b{ font:700 1.25em var(--tieu); color:var(--rung-dam); display:block; }
.thanh-tien{ display:grid; grid-template-columns:4.6em 1fr 2.6em; gap:.4em; align-items:center; font-size:.8em; font-weight:700; margin:.15em 0; }
.thanh-tien i{ display:block; height:.6em; background:var(--giay2); border-radius:.3em; overflow:hidden; }
.thanh-tien i u{ display:block; height:100%; background:var(--sang); transition:width .6s; }
.kq-chieu{ display:grid; grid-template-columns:minmax(0, 1.05fr) minmax(0, 1fr); gap:1.4em; align-items:start; }
.ket-chieu{ display:flex; gap:1em; align-items:center; margin-top:.8em; }
.ket-chieu .ban-do{ width:5em; flex:none; }
table.xh th,table.xh td{ white-space:nowrap; }
table.xh{ border-collapse:collapse; width:100%; }
table.xh td,table.xh th{ padding:.35em .4em; border-bottom:1px solid var(--vien-giay); text-align:left; }
table.xh th{ color:var(--rung-dam); }
table.xh .so{ text-align:right; font-variant-numeric:tabular-nums; }
table.xh tr.dau1 td{ font-weight:800; background:var(--nang2); }
.sai-nhieu li{ margin:.3em 0; }
.sai-nhieu .ty{ font:700 1em var(--tieu); color:var(--do); margin-right:.3em; }
.dap-an{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:1em; margin-top:1.2em; }
.dap-an .giay{ margin:0; font-size:.82em; }
.dap-an ol,.dap-an ul{ margin:.2em 0; padding-left:1.2em; }
.dap-an li{ margin:.2em 0; }
.dap-an .khong{ color:var(--muc2); font-size:.92em; }
/* chế độ sửa chữ (?sua=1) */
#sua-khung{ position:fixed; left:.8rem; bottom:.8rem; z-index:80; max-width:min(36rem, calc(100vw - 1.6rem)); font:500 .9rem var(--than); color:var(--muc); }
#sua-khung > div{ background:rgba(251,247,236,.97); border-radius:14px; box-shadow:0 10px 30px rgba(13,33,39,.3); padding:.55rem .7rem; margin-top:.4rem; }
#sua-khung .sua-thanh{ display:flex; flex-wrap:wrap; align-items:center; gap:.45rem; border:2px solid var(--nang); }
#sua-khung .sua-thanh b{ color:var(--rung-dam); }

  SYNC.doc(M.D.kq).onSnapshot(s => { M.kq = s.exists ? s.data() : null; if(M.cfg && M.cfg.tt === "cong-bo") vePhone(); });
}

    if(dich){ v1[dich] = d.chip; const sau = V1.o.slice(V1.o.findIndex(o => o.id === dich) + 1).concat(V1.o).find(o => !v1[o.id]); M.sel = sau ? sau.id : null; } }
  else if(d.ro){ const ro = M.bai.v2.ro; if(ro[d.ro]) delete ro[d.ro]; M.sel = d.ro; }
  else if(d.td){ const ro = M.bai.v2.ro; if(M.sel){ ro[M.sel] = d.td; M.sel = V2.ro.find(r => !ro[r.id]) ? V2.ro.find(r => !ro[r.id]).id : null; } }
  else if(d.the){ const the = M.bai.v2.the; if(the[d.the] === d.dat) delete the[d.the]; else the[d.the] = d.dat; }
  else if(d.h){ M.bai.v3[d.h] = +d.pa; }
  else if(b.hasAttribute("data-nop")){
    if(soTrong(M.vong, M.bai) && !(M.xacNhan && Date.now() - M.xacNhan < CH.baoNop)){ M.xacNhan = Date.now(); vePhone(); setTimeout(() => { if(M && M.xacNhan && Date.now() - M.xacNhan >= CH.baoNop){ M.xacNhan = 0; vePhone(); } }, CH.baoNop + 50); return; }
    nopVong(); return;
  }
  M.xacNhan = 0; luuM(); vePhone();
  const dg = $(".ld.dang"); if(dg && d.chip) dg.scrollIntoView({block: "center", behavior: "smooth"});
});

/* ============================================================
   CHẾ ĐỘ SỬA CHỮ (?sua=1) — giảng viên bấm vào chữ để sửa tại chỗ,
   tắt chế độ sửa để chơi thử sang màn khác, rồi tải tệp các chỗ đã sửa
   ({cu, moi}); cong-cu/ap-sua-chu.py đưa vào noi-dung.json / _khuon.html.
   Trang không có ?sua=1 (trang sinh viên) không có chế độ này.
   ============================================================ */
if(SUA){
  const luuSua = () => luu("non-song-sua", SUA.ds);
  const tenMan = () => {
    if(!$("#phu").hidden) return "Lớp phủ giữa màn";
    const m = document.body.dataset.man;
    if(m === "s-chieu") return "Máy chiếu · " + ({cho: "chờ vào phòng", choi: "đang chơi", het: "hết giờ", "cong-bo": "công bố"}[H && H.tt] || "");
    if(m === "s-choi"){ if(!M || !M.cfg) return "Điện thoại"; const tt = M.cfg.tt;
      return "Điện thoại · " + (tt === "cho" ? "chờ bắt đầu" : tt === "cong-bo" || (M.solo && M.vong >= 3) ? "kết quả" : M.vong < 3 ? `vòng ${M.vong + 1}` : tt === "het" ? "hết giờ" : "đã nộp đủ"); }
    return {"s-dau": "Trang đầu", "s-luat": "Luật chơi", "s-tao": "Mở phòng", "s-vao": "Vào phòng"}[m] || m;
  };
  /* chữ đã sửa hiện ngay cả khi game vẽ lại màn */
  const apSua = goc => {
    if(!SUA.ds.length) return;
    const doi = new Map(SUA.ds.map(x => [x.cu, x.moi]));
    const thay = n => { const t = n.data.trim(); if(t && doi.has(t)) n.data = n.data.replace(t, doi.get(t)); };
    if(goc.nodeType === 3){ thay(goc); return; }
    if(goc.nodeType !== 1 || goc.closest("#sua-khung")) return;
    const w = document.createTreeWalker(goc, NodeFilter.SHOW_TEXT); let n; while((n = w.nextNode())) thay(n);
  };
  new MutationObserver(ds => ds.forEach(m => m.addedNodes.forEach(apSua))).observe(document.body, {childList: true, subtree: true});

  const khung = document.createElement("div"); khung.id = "sua-khung";
  khung.innerHTML = `<div class="sua-thanh"><b>✎ Sửa chữ</b><button id="sua-bat"></button><span id="sua-dem"></span>
      <button id="sua-xem">Danh sách</button><button id="sua-tai">Tải tệp sửa</button></div>
    <div id="sua-ds" hidden></div>
    <div id="sua-o" hidden><div class="nho" id="sua-goc"></div><textarea id="sua-chu" rows="3"></textarea>
      <div class="sua-nut"><button id="sua-xong" class="chinh">Xong (Enter)</button><button id="sua-tra">Trả chữ gốc</button><button id="sua-huy">Hủy (Esc)</button></div></div>`;
  document.body.appendChild(khung);
  let dang = null;   /* {n: nút chữ đang sửa, cu: chữ gốc} */
  const veThanh = () => {
    $("#sua-bat").textContent = SUA.bat ? "Đang sửa — bấm vào chữ" : "Đang chơi thử — bấm để sửa tiếp";
    $("#sua-bat").classList.toggle("bat", SUA.bat); document.body.classList.toggle("dang-sua", SUA.bat);
    $("#sua-dem").textContent = `${SUA.ds.length} chỗ đã sửa`;
    $("#sua-ds").innerHTML = SUA.ds.length ? `<ol>${SUA.ds.map((x, i) => `<li><span class="nho">${esc(x.man)}</span><br><s>${esc(x.cu)}</s><br><b>${esc(x.moi)}</b> <button data-bo="${i}" title="Bỏ chỗ sửa này">↩ bỏ</button></li>`).join("")}</ol>
      <button id="sua-xoa">Xóa hết danh sách</button>` : "<p>Chưa sửa chỗ nào.</p>";
  };
  const ghiSua = (cu, moi) => {
    const i = SUA.ds.findIndex(x => x.cu === cu);
    if(moi === cu){ if(i >= 0) SUA.ds.splice(i, 1); }
    else if(i >= 0) SUA.ds[i].moi = moi;
    else SUA.ds.push({man: tenMan(), cu, moi});
    luuSua(); veThanh();
  };
  const moSua = n => {
    const t = n.data.trim(), r = SUA.ds.find(x => x.moi === t), cu = r ? r.cu : t;
    dang = {n, cu};
    $("#sua-goc").textContent = `${tenMan()} · chữ gốc: “${cu}”`;
    $("#sua-chu").value = t; $("#sua-o").hidden = false; $("#sua-chu").focus(); $("#sua-chu").select();
  };
  const dong = () => { $("#sua-o").hidden = true; dang = null; };
  const xong = moi => {
    if(!dang) return; moi = moi.replace(/\s+/g, " ").trim();
    if(moi){ const t = dang.n.data.trim(); dang.n.data = dang.n.data.replace(t, moi); ghiSua(dang.cu, moi); }
    dong();
  };
  /* chữ nằm dưới con trỏ: nút chữ chứa điểm bấm; nếu không lấy được thì lấy chữ duy nhất của phần tử bấm vào */
  const chuTai = e => {
    let n = null;
    if(document.caretPositionFromPoint){ const p = document.caretPositionFromPoint(e.clientX, e.clientY); n = p && p.offsetNode; }
    else if(document.caretRangeFromPoint){ const r = document.caretRangeFromPoint(e.clientX, e.clientY); n = r && r.startContainer; }
    if(n && n.nodeType === 3){ const r = document.createRange(); r.selectNodeContents(n);
      if(![...r.getClientRects()].some(b => e.clientX >= b.left - 2 && e.clientX <= b.right + 2 && e.clientY >= b.top - 2 && e.clientY <= b.bottom + 2)) n = null; }
    if(!n || n.nodeType !== 3 || !n.data.trim()){ const ts = [...e.target.childNodes].filter(x => x.nodeType === 3 && x.data.trim()); n = ts.length === 1 ? ts[0] : null; }
    return n;
  };
  document.addEventListener("click", e => {
    if(!SUA.bat || e.target.closest("#sua-khung")) return;
    e.preventDefault(); e.stopPropagation();
    const n = chuTai(e);
    if(n) moSua(n); else if(e.target.closest("#phu")) $("#phu").hidden = true;
  }, true);
  let tro = null;
  document.addEventListener("mouseover", e => { if(tro) tro.classList.remove("sua-tro"); tro = null;
    if(SUA.bat && !e.target.closest("#sua-khung") && e.target !== document.body && e.target.closest("main, #phu")){ tro = e.target; tro.classList.add("sua-tro"); } });
  $("#sua-bat").onclick = () => { SUA.bat = !SUA.bat; dong(); veThanh(); };
  $("#sua-xem").onclick = () => { $("#sua-ds").hidden = !$("#sua-ds").hidden; };
  $("#sua-ds").onclick = e => { const b = e.target.closest("button"); if(!b) return;
    if(b.id === "sua-xoa"){ if(confirm("Xóa hết danh sách chỗ đã sửa trên máy này? (Chữ đã đưa vào game không bị ảnh hưởng.)")){ SUA.ds = []; luuSua(); location.reload(); } return; }
    if(b.dataset.bo){ SUA.ds.splice(+b.dataset.bo, 1); luuSua(); location.reload(); } };
  $("#sua-tai").onclick = () => {
    if(!SUA.ds.length){ bao("Chưa sửa chỗ nào."); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify({game: "non-song", luc: new Date().toISOString(), sua: SUA.ds}, null, 2)], {type: "application/json"}));
    a.download = "sua-chu-non-song.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    bao("Đã tải sua-chu-non-song.json — gửi tệp này để đưa chữ vào game.", 5000);
  };
  $("#sua-xong").onclick = () => xong($("#sua-chu").value);
  $("#sua-tra").onclick = () => { if(dang) xong(dang.cu); };
  $("#sua-huy").onclick = dong;
  $("#sua-chu").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); xong(e.target.value); } else if(e.key === "Escape") dong(); });
  veThanh(); apSua(document.body);
}

/* khởi động — vẽ cảnh sau khung hình đầu: vẽ sớm hơn thì có máy không hiện tranh */
requestAnimationFrame(() => requestAnimationFrame(veCanh));
veDau();
if(QS.get("ma")){ $("#v-ma").value = QS.get("ma").replace(/\D/g, "").slice(0, 4); hien("s-vao"); }
</script>
</body>
