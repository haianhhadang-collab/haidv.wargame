"ABC","g":"Trong giai đoạn 1911-1920, Hồ Chí Minh đã tham gia phong trào công nhân Pháp, gửi Yêu sách của nhân dân An Nam tới Hội nghị Vécxây, và tìm thấy phương hướng đấu tranh giải phóng dân tộc theo con đường cách mạng vô sản qua nghiên cứu Luận cương của Lênin. Phương án D (sáng lập Hội Việt Nam Cách mạng Thanh niên) thuộc năm 1925, và phương án E (Hội nghị Trung ương Đảng tháng 5/1941) thuộc năm 1941."},{"id":"vn03-21","cd":"03","l":"NH","q":"Tác phẩm \"Đường cách mệnh\" của Hồ Chí Minh (1927) có ý nghĩa như thế nào đối với sự chuẩn bị cho sự ra đời của Đảng Cộng sản Việt Nam?","o":[["A","Là sự tổng kết kinh nghiệm các cuộc cách mạng tư sản Anh, Pháp, Mỹ."],["B","Vạch rõ cách mạng Việt Nam phải có Đảng Cộng sản với chủ nghĩa Mác – Lênin làm cốt để lãnh đạo."],["C","Xác định lực lượng cách mạng giải phóng dân tộc là toàn thể nhân dân Việt Nam, nòng cốt là liên minh công nông."],["D","Chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam."],["E","Là Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam."]],"a":"ABCD","g":"Tài liệu môn học nêu rõ tác phẩm \"Đường cách mệnh\" là \"tổng kết kinh nghiệm các cuộc cách mạng tư sản Anh, Pháp, Mỹ, và nhất là từ kinh nghiệm Cách mạng Tháng Mười Nga\". Người đã vạch rõ \"cách mạng Việt Nam phải có Đảng Cộng sản với chủ nghĩa Mác – Lênin làm cốt để lãnh đạo; lực lượng cách mạng giải phóng dân tộc là toàn thể nhân dân Việt Nam, trong đó nòng cốt là liên minh công nông\". Tác phẩm này được coi là \"sự chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam\". Tuy nhiên, Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam là các văn kiện được thông qua tại Hội nghị hợp nhất Đảng vào đầu năm 1930, do Hồ Chí Minh khởi thảo, chứ không phải là tá"},{"id":"vn03-22","cd":"03","l":"NH","q":"Những nội dung nào đã được khẳng định trong Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam (đầu năm 1930)?","o":[["A","Mục tiêu \"làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản\"."],["B","Khẳng định sự lãnh đạo của Đảng Cộng sản Việt Nam."],["C","Liên minh công nông là lực lượng nòng cốt."],["D","Cách mạng Việt Nam là một bộ phận của cách mạng thế giới."],["E","Tạm gác khẩu hiệu cách mạng điền địa."]],"a":"ABCD","g":"Tài liệu môn học cho biết Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam nêu mục tiêu \"làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản\", \"đánh đổ đế quốc Pháp, phong kiến An Nam và giai cấp tư sản phản cách mạng\", giương cao ngọn cờ độc lập dân tộc và chủ nghĩa xã hội; khẳng định sự lãnh đạo của Đảng Cộng sản Việt Nam; liên minh công nông là lực lượng nòng cốt; cách mạng Việt Nam là một bộ phận cách mạng thế giới. Việc \"tạm gác khẩu hiệu cách mạng điền địa\" là quyết sách của Hội nghị Trung ương Đảng tháng 5/1941, không phải nội dung của Cương lĩnh đầu tiên."},{"id":"vn03-23","cd":"03","l":"NH","q":"Những điều chỉnh chiến lược và sách lược quan trọng nào của cách mạng Việt Nam đã được hoàn chỉnh thêm một bước tại Hội nghị Trung ương Đảng tháng 5/1941 tại Pác Bó?","o":[["A","Đặt nhiệm vụ giải phóng dân tộc lên hàng đầu."],["B","Tạm thời gác lại khẩu hiệu cách mạng điền địa."],["C","Bỏ vấn đề lập Chính phủ Liên bang Cộng hòa dân chủ Đông Dương."],["D","Chủ trương thành lập Chính phủ nhân dân của nước Việt Nam Dân chủ Cộng hòa."],["E","Xác định liên minh công nông là lực lượng duy nhất của cách mạng."]],"a":"ABCD","g":"Hội nghị Trung ương Đảng tháng 5/1941 đã \"đặt nhiệm vụ giải phóng dân tộc lên hàng đầu\". Nghị quyết của Hội nghị đã \"tạm thời gác lại khẩu hiệu cách mạng điền địa, xóa bỏ vấn đề lập Chính phủ Liên bang Cộng hòa dân chủ Đông Dương, thay vào đó là chủ trương sẽ thành lập Chính phủ nhân dân của nước Việt Nam Dân chủ Cộng hòa\". Đồng thời, hội nghị cũng \"nêu chủ trương lập Mặt trận Việt Minh, thực hiện đại đoàn kết dân tộc trên cơ sở nòng cốt liên minh công nông\". Phương án E sai vì liên minh công nông là nòng cốt, nhưng là \"thực hiện đại đoàn kết dân tộc\", tức là bao gồm toàn dân tộc."},{"id":"vn03-24","cd":"03","l":"NH","q":"Những thành công nào của cách mạng Việt Nam trong giai đoạn 1941 – 1969 được coi là thắng lợi to lớn đầu tiên của chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh ở Việt Nam?","o":[["A","Sự ra đời của Mặt trận Việt Minh."],["B","Thành lập Đội Việt Nam Tuyên truyền Giải phóng quân."],["C","Thắng lợi của Cách mạng Tháng Tám năm 1945."],["D","Hồ Chí Minh đọc bản Tuyên ngôn Độc lập khai sinh nước Việt Nam Dân chủ Cộng hòa."],["E","Hội nghị Trung ương Đảng tháng 5/1941 đặt nhiệm vụ giải phóng dân tộc lên hàng đầu."]],"a":"CD","g":"Tài liệu môn học nêu rõ: \"Cách mạng Tháng Tám năm 1945 thành công đã lật đổ chế độ phong kiến hơn nghìn năm, lật đổ ách thống trị của thực dân Pháp hơn 80 năm và giành lại độc lập dân tộc trực tiếp từ tay phát xít Nhật. Đây là thắng lợi to lớn đầu tiên của chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh ở Việt Nam\". Tiếp theo đó, \"Ngày 2/9/1945, tại Quảng trường Ba Đình, Hà Nội, thay mặt Chính phủ lâm thời, Hồ Chí Minh đọc bản Tuyên ngôn độc lập khai sinh ra nước Việt Nam Dân chủ Cộng hòa\", là hệ quả trực tiếp của Cách mạng Tháng Tám. Các phương án A, B, E là những sự kiện quan trọng, nhưng là các hoạt động chuẩn bị hoặc quyết sách, không phải là \"thắng lợi to lớn đầu tiên\" theo cách diễn đạt "},{"id":"vn03-25","cd":"03","l":"DK","q":"Sau khi Hồ Chí Minh nghiên cứu \"Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa\" của V.I.Lênin vào tháng 7/1920, Người đã tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc Việt Nam theo con đường _______.","o":[["A","cách mạng tư sản"],["B","cải cách ôn hòa"],["C","cách mạng vô sản"],["D","chủ nghĩa dân tộc thuần túy"],["E","chủ nghĩa đế quốc"]],"a":"C","g":"Tài liệu môn học cho biết: \"Hồ Chí Minh đã tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc Việt Nam theo con đường cách mạng vô sản qua nghiên cứu Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa (để trình bày tại Đại hội II Quốc tế Cộng sản) của V.I.Lênin... vào tháng 7/1920\"."},{"id":"vn03-26","cd":"03","l":"DK","q":"Để chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam, Hồ Chí Minh đã biên soạn và xuất bản tác phẩm _______ vào năm 1927 tại Quảng Châu, Trung Quốc.","o":[["A","Bản án chế độ thực dân Pháp"],["B","Con đường giải phóng"],["C","Tuyên ngôn độc lập"],["D","Đường cách mệnh"],["E","Lời kêu gọi toàn quốc kháng chiến"]],"a":"D","g":"Tài liệu môn học nêu rõ: \"Những nội dung cốt lõi đó và nhiều vấn đề trong đường lối, phương pháp cách mạng Việt Nam được thể hiện trong tác phẩm Đường cách mệnh của Người xuất bản năm 1927 ở Quảng Châu, Trung Quốc. Tác phẩm là sự chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam\"."},{"id":"vn03-27","cd":"03","l":"DK","q":"Hội nghị Trung ương Đảng tháng 10/1930 đã ra Án nghị quyết \"Thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\" và đổi tên Đảng Cộng sản Việt Nam thành _______.","o":[["A","Đảng Lao động Việt Nam"],["B","Đảng Cộng sản Đông Dương"],["C","Đảng Dân chủ Việt Nam"],["D","Đảng Xã hội Việt Nam"],["E","Mặt trận Việt Minh"]],"a":"B","g":"Tài liệu môn học cho biết Hội nghị Trung ương Đảng họp tháng 10/1930 đã \"bỏ tên Đảng Cộng sản Việt Nam do Hồ Chí Minh và những người tham gia Hội nghị thành lập Đảng xác định, lấy tên là Đảng Cộng sản Đông Dương\"."},{"id":"vn03-28","cd":"03","l":"DK","q":"Tư tưởng Hồ Chí Minh đã trở thành yếu tố chỉ đạo cách mạng Việt Nam từ Hội nghị Trung ương Đảng tháng 5/1941, tại đây, Người đã khẳng định: \"Trong lúc này quyền lợi _______ cao hơn hết thảy.\"","o":[["A","giai cấp công nhân"],["B","liên minh công nông"],["C","dân tộc giải phóng"],["D","quốc tế vô sản"],["E","của Đảng"]],"a":"C","g":"Tại Hội nghị Ban Chấp hành Trung ương Đảng tháng 5/1941, Hồ Chí Minh đã \"khẳng định rõ: “Trong lúc này quyền lợi dân tộc giải phóng cao hơn hết thảy. Chúng ta phải đoàn kết lại đánh đổ bọn đế quốc và bọn Việt gian đặng cứu giống nòi ra khỏi nước sôi lửa nóng”\"."},{"id":"vn03-29","cd":"03","l":"DK","q":"Để đối phó với tình thế \"ngàn cân treo sợi tóc\" sau Cách mạng Tháng Tám, Hồ Chí Minh đã chỉ đạo thành công sách lược cách mạng linh hoạt, mềm dẻo với phương châm nổi tiếng: \"_______\".","o":[["A","Độc lập, tự do"],["B","Dĩ bất biến, ứng vạn biến"],["C","Thêm bạn, bớt thù"],["D","Tự lực cánh sinh"],["E","Không có gì quý hơn độc lập, tự do"]],"a":"B","g":"Tài liệu môn học nêu rõ: \"Với phương châm “Dĩ bất biến, ứng vạn biến”, giữ vững mục tiêu đấu tranh cho chủ quyền độc lập dân tộc, tự do, ấm no, hạnh phúc cho nhân dân bằng các sách lược cách mạng linh hoạt mềm dẻo, Người đã chỉ đạo thành công sách lược...\"."},{"id":"vn03-30","cd":"03","l":"DK","q":"Điều mong muốn cuối cùng của Hồ Chí Minh trước khi đi xa là \"Toàn Đảng, toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh và góp phần xứng đáng và sự nghiệp _______ thế giới\".","o":[["A","công nghiệp hóa"],["B","hiện đại hóa"],["C","cách mạng"],["D","hội nhập"],["E","phát triển kinh tế"]],"a":"C","g":"Trong Di chúc của mình, Hồ Chí Minh đã mong muốn: \"Toàn Đảng, toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh và góp phần xứng đáng và sự nghiệp cách mạng thế giới\"."},{"id":"vn04-1","cd":"04","l":"DS","q":"Tư tưởng Hồ Chí Minh về quyền dân tộc tự quyết chỉ hình thành rõ nét sau Cách mạng Tháng Tám năm 1945.","o":[],"a":"S","g":"Tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa, trước hết là quyền bình đẳng và tự do, đã hình thành lần đầu tiên từ sự kiện Người gửi bản Yêu sách của nhân dân An Nam tới Hội nghị Vécxây năm 1919. Điều này cho thấy tư tưởng đã có từ rất sớm, trước Cách mạng Tháng Tám 1945."},{"id":"vn04-2","cd":"04","l":"DS","q":"Khi khẳng định \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\", Hồ Chí Minh đã bác bỏ hoàn toàn học thuyết \"Tam dân\" của Tôn Trung Sơn.","o":[],"a":"S","g":"Tài liệu môn học cho biết Hồ Chí Minh đã \"đánh giá cao học thuyết “Tam dân” của Tôn Trung Sơn về độc lập và tự do: dân tộc độc lập, dân quyền tự do và dân sinh hạnh phúc\". Câu nói trên chỉ nhấn mạnh rằng độc lập phải đi đôi với tự do, hạnh phúc của nhân dân, chứ không phải bác bỏ học thuyết Tam dân mà Người đánh giá cao."},{"id":"vn04-3","cd":"04","l":"DS","q":"Tư tưởng độc lập dân tộc gắn liền với thống nhất Tổ quốc, toàn vẹn lãnh thổ chỉ xuất hiện rõ nét trong tư tưởng Hồ Chí Minh sau khi Hiệp định Giơnevơ năm 1954 được ký kết.","o":[],"a":"S","g":"Mặc dù Người tiếp tục kiên trì đấu tranh để thống nhất Tổ quốc sau Hiệp định Giơnevơ năm 1954, tư tưởng này đã được thể hiện từ rất sớm. Cụ thể, trong Thư gửi đồng bào Nam Bộ (năm 1946), Hồ Chí Minh đã khẳng định: \"Đồng bào Nam Bộ là dân nước Việt Nam. Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\", nhằm chống lại âm mưu chia cắt của thực dân Pháp với \"Nam Kỳ tự trị\". Điều này chứng tỏ tư tưởng đã có trước năm 1954 và là tư tưởng xuyên suốt."},{"id":"vn04-4","cd":"04","l":"DS","q":"Mục tiêu \"Làm cho nước Nam được hoàn toàn độc lập\" trong Chánh cương vắn tắt của Đảng (năm 1930) đã thể hiện tư tưởng Hồ Chí Minh về một nền độc lập dân tộc phải thật sự, hoàn toàn và triệt để.","o":[],"a":"D","g":"Mục tiêu \"Làm cho nước Nam được hoàn toàn độc lập\" là nền tảng cho việc xây dựng một nền độc lập không chỉ về danh nghĩa mà còn trên tất cả các lĩnh vực (ngoại giao, quân sự, tài chính), như Người đã nhấn mạnh về một nền độc lập thật sự, hoàn toàn và triệt để. Đây là bước đầu quan trọng để đạt được nền độc lập toàn diện."},{"id":"vn04-5","cd":"04","l":"DS","q":"Khẩu hiệu \"Không có gì quý hơn độc lập, tự do\" (17/7/1966) được Hồ Chí Minh đưa ra trong bối cảnh đế quốc Mỹ mở rộng chiến tranh phá hoại miền Bắc và tiến hành chiến lược \"Chiến tranh cục bộ\" ở miền Nam.","o":[],"a":"D","g":"Tài liệu môn học nêu rõ: \"Năm 1965, đế quốc Mỹ tăng cường mở rộng chiến tranh ở Việt Nam: Ồ ạt đưa quân viễn chinh Mỹ, chư hầu vào miền Nam tiến hành chiến lược “Chiến tranh cục bộ” và gây chiến tranh phá hoại miền Bắc. Trong hoàn cảnh khó khăn, chiến tranh ác liệt đó, Hồ Chí Minh đã nêu lên một chân lý thời đại... “Không có gì quý hơn độc lập, tự do”\". Năm 1965 là bối cảnh Mỹ mở rộng chiến tranh; câu nói được Hồ Chí Minh nêu ngày 17/7/1966, trong Lời kêu gọi đồng bào và chiến sĩ cả nước."},{"id":"vn04-6","cd":"04","l":"DS","q":"Trong lời kêu gọi Liên hợp quốc năm 1946, Hồ Chí Minh chỉ nhấn mạnh đến mong muốn hòa bình của nhân dân Việt Nam mà không đề cập đến quyết tâm bảo vệ độc lập.","o":[],"a":"S","g":"Tài liệu môn học ghi rõ: \"Trong lời kêu gọi Liên hợp quốc năm 1946, một lần nữa Hồ Chí Minh khẳng định: “Nhân dân chúng tôi thành thật mong muốn hòa bình. Nhưng nhân dân chúng tôi cũng kiên quyết chiến đấu đến cùng để bảo vệ những quyền thiêng liêng nhất: Toàn vẹn lãnh thổ cho Tổ quốc và độc lập cho đất nước”\". Điều này cho thấy Người nhấn mạnh cả mong muốn hòa bình và quyết tâm chiến đấu bảo vệ độc lập."},{"id":"vn04-7","cd":"04","l":"D1","q":"Sự kiện nào sau đây thể hiện rõ nhất lần đầu tiên tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa, đặc biệt là quyền bình đẳng và tự do, đã hình thành?","o":[["A","Việc Người tham gia sáng lập Đảng Cộng sản Pháp năm 1920."],["B","Việc Người gửi bản Yêu sách của nhân dân An Nam tới Hội nghị Vécxây năm 1919."],["C","Sự ra đời của Chánh cương vắn tắt của Đảng năm 1930."],["D","Tuyên bố độc lập của Việt Nam Dân chủ Cộng hòa năm 1945."],["E","Sự kiện Người sang Liên Xô tìm hiểu về chủ nghĩa Mác - Lênin."]],"a":"B","g":"Tài liệu môn học chỉ rõ: \"Năm 1919... thay mặt những người Việt Nam yêu nước, Hồ Chí Minh đã gửi tới Hội nghị bản Yêu sách của nhân dân An Nam... Bản yêu sách không được Hội nghị chấp nhận nhưng qua sự kiện trên cho thấy lần đầu tiên, tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa mà trước hết là quyền bình đẳng và tự do đã hình thành\"."},{"id":"vn04-8","cd":"04","l":"D1","q":"Tư tưởng Hồ Chí Minh về sự gắn liền giữa độc lập dân tộc với tự do, hạnh phúc của nhân dân được thể hiện xuyên suốt qua các mục tiêu nào trong Chánh cương vắn tắt của Đảng (năm 1930)?","o":[["A","Chỉ tập trung vào việc đánh đổ đế quốc thực dân."],["B","Bao gồm các mục tiêu chính trị và mục tiêu xã hội cụ thể nhằm cải thiện đời sống nhân dân."],["C","Chỉ dừng lại ở việc tuyên bố quyền độc lập về mặt pháp lý."],["D","Ưu tiên quyền tự quyết về ngoại giao và quân sự."],["E","Tập trung vào việc xây dựng nền kinh tế tư bản độc lập."]],"a":"B","g":"Trong Chánh cương vắn tắt của Đảng (1930), Hồ Chí Minh không chỉ xác định mục tiêu chính trị là \"Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến. Làm cho nước Nam được hoàn toàn độc lập\", mà còn đề ra các mục tiêu xã hội như \"Thủ tiêu hết các thứ quốc trái… Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo. Bỏ sưu thuế cho dân cày nghèo… Thi hành luật ngày làm 8 giờ\". Điều này cho thấy sự gắn kết chặt chẽ giữa độc lập dân tộc với tự do, hạnh phúc và quyền lợi của nhân dân ngay từ đầu."},{"id":"vn04-9","cd":"04","l":"D1","q":"Câu nói \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\" của Hồ Chí Minh sau Cách mạng Tháng Tám năm 1945 chủ yếu khẳng định điều gì?","o":[["A","Độc lập dân tộc phải gắn liền với sự hỗ trợ từ các nước xã hội chủ nghĩa."],["B","Sự quan trọng của việc xây dựng một quân đội mạnh."],["C","Độc lập dân tộc phải gắn liền với quyền tự do và hạnh phúc thực sự của nhân dân."],["D","Độc lập dân tộc chỉ có ý nghĩa khi có toàn vẹn lãnh thổ."],["E","Sự cần thiết của việc nhanh chóng tiến hành cách mạng xã hội chủ nghĩa."]],"a":"C","g":"Câu nói này được trích dẫn trong phần \"Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân\". Người nhấn mạnh rằng mục đích cuối cùng của độc lập là mang lại cuộc sống tốt đẹp cho nhân dân, chứ không phải chỉ là một danh xưng chính trị."},{"id":"vn04-10","cd":"04","l":"D1","q":"Khi Hồ Chí Minh khẳng định \"Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\" trong Thư gửi đồng bào Nam Bộ năm 1946, Người muốn nhấn mạnh điều gì?","o":[["A","Vẻ đẹp vĩnh cửu của thiên nhiên Việt Nam."],["B","Tinh thần đoàn kết của toàn dân tộc trong mọi hoàn cảnh."],["C","Sự bất biến của chân lý Nam Bộ là một phần không thể tách rời của Việt Nam."],["D","Quyết tâm chiến đấu đến cùng để bảo vệ độc lập dân tộc."],["E","Vai trò lãnh đạo của Đảng Cộng sản Việt Nam."]],"a":"C","g":"Bức thư này được viết trong bối cảnh thực dân Pháp bày ra cái gọi là \"Nam Kỳ tự trị\" nhằm chia cắt nước ta. Hồ Chí Minh đã khẳng định \"Đồng bào Nam Bộ là dân nước Việt Nam. Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\" để bác bỏ âm mưu chia cắt và khẳng định tính thống nhất, toàn vẹn lãnh thổ của Việt Nam."},{"id":"vn04-11","cd":"04","l":"D1","q":"Yếu tố nào sau đây là tiêu chí quan trọng nhất để phân biệt một \"nền độc lập thật sự\" với một \"nền độc lập giả hiệu\" theo tư tưởng Hồ Chí Minh?","o":[["A","Khả năng thiết lập quan hệ ngoại giao với các nước lớn."],["B","Việc có một chính phủ bản xứ do người dân bầu ra."],["C","Quyền tự quyết triệt để về ngoại giao, quân sự và tài chính của dân tộc."],["D","Sự công nhận của cộng đồng quốc tế."],["E","Việc cấm chỉ mọi hoạt động của các thế lực đế quốc trên lãnh thổ."]],"a":"C","g":"Tài liệu môn học nhấn mạnh: \"độc lập mà người dân tộc không có quyền tự quyết về ngoại giao, không có quân đội riêng, không có nền tài chính riêng…, thì độc lập đó chẳng có ý nghĩa gì\". Đây chính là những yếu tố cốt lõi để phân biệt độc lập thật sự với độc lập giả hiệu do bọn thực dân, đế quốc mị dân."},{"id":"vn04-12","cd":"04","l":"D1","q":"Tuyên ngôn độc lập năm 1945 của Hồ Chí Minh, bên cạnh việc trịnh trọng tuyên bố nền độc lập, còn thể hiện ý chí và quyết tâm mạnh mẽ của dân tộc Việt Nam thông qua nội dung nào?","o":[["A","Kêu gọi sự hỗ trợ từ các cường quốc đồng minh."],["B","Trình bày chi tiết kế hoạch phát triển kinh tế sau độc lập."],["C","Khẳng định quyền hưởng tự do và độc lập, đồng thời quyết tâm bảo vệ quyền ấy bằng mọi giá."],["D","Nêu rõ các điều khoản chấm dứt sự cai trị của thực dân Pháp."],["E","Phân tích bối cảnh quốc tế thuận lợi cho Việt Nam."]],"a":"C","g":"Tài liệu môn học ghi rõ, trong Tuyên ngôn độc lập năm 1945, Hồ Chí Minh tuyên bố \"Nước Việt Nam có quyền hưởng tự do và độc lập, và sự thực đã thành một nước tự do và độc lập. Toàn thể dân Việt Nam quyết đem tất cả tinh thần và lực lượng, tính mệnh và của cải để giữ vững quyền tự do và độc lập ấy\". Điều này thể hiện ý chí và quyết tâm bảo vệ độc lập."},{"id":"vn04-13","cd":"04","l":"SAI","q":"Trong các tuyên bố và hành động của Hồ Chí Minh, điều nào sau đây KHÔNG phản ánh tư tưởng độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân?","o":[["A","Gửi bản Yêu sách của nhân dân An Nam đòi các quyền tự do, dân chủ cho người dân Đông Dương."],["B","Xác định trong Chánh cương vắn tắt của Đảng các mục tiêu như bỏ sưu thuế cho dân cày nghèo, thi hành luật ngày làm 8 giờ."],["C","Khẳng định \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\"."],["D","Kêu gọi các cường quốc viện trợ để phát triển kinh tế và đảm bảo cuộc sống cho người dân."],["E","Đặt ra yêu cầu \"Làm cho dân có ăn. Làm cho dân có mặc. Làm cho dân có chỗ ở. Làm cho dân có học hành\" sau Cách mạng Tháng Tám."]],"a":"D","g":"Các phương án A, B, C, E đều trực tiếp hoặc gián tiếp phản ánh sự gắn kết giữa độc lập dân tộc với tự do, hạnh phúc của nhân dân. Phương án D - \"Kêu gọi các cường quốc viện trợ\" - không được đề cập trong Tài liệu môn học như một phần của tư tưởng này, và việc Người chủ động đưa ra các giải pháp tự lực để đảm bảo quyền dân sinh là chính."},{"id":"vn04-14","cd":"04","l":"SAI","q":"Những lý lẽ và căn cứ mà Hồ Chí Minh sử dụng để khẳng định quyền thiêng liêng, bất biến về độc lập, tự do của các dân tộc KHÔNG bao gồm yếu tố nào sau đây?","o":[["A","Lịch sử dựng nước và giữ nước của dân tộc Việt Nam với truyền thống yêu nước."],["B","Những quyền tự do, bình đẳng và quyền con người được ghi trong Tuyên ngôn độc lập của cách mạng Mỹ năm 1776."],["C","Tuyên ngôn nhân quyền và dân quyền của Cách mạng Pháp năm 1791."],["D","Các điều ước quốc tế về quyền con người được Liên hợp quốc công bố sau này."],["E","Khát khao to lớn của dân tộc Việt Nam về một nền độc lập cho dân tộc, tự do cho nhân dân."]],"a":"D","g":"Hồ Chí Minh đã căn cứ vào truyền thống lịch sử của Việt Nam, Tuyên ngôn độc lập của cách mạng Mỹ năm 1776, Tuyên ngôn nhân quyền và dân quyền của Cách mạng Pháp năm 1791 để khẳng định quyền dân tộc. Các điều ước quốc tế của Liên hợp quốc (được thành lập sau Thế chiến II) không được nhắc đến trong Tài liệu môn học là căn cứ Người sử dụng để hình thành tư tưởng này."},{"id":"vn04-15","cd":"04","l":"SAI","q":"Trong các sự kiện lịch sử sau, sự kiện nào KHÔNG thể hiện trực tiếp quyết tâm bảo vệ độc lập dân tộc của Hồ Chí Minh và nhân dân Việt Nam sau năm 1945?","o":[["A","Lời kêu gọi Liên hợp quốc năm 1946 về việc bảo vệ toàn vẹn lãnh thổ và độc lập."],["B","Lời kêu gọi toàn quốc kháng chiến ngày 19/12/1946 với quyết tâm \"thà hy sinh tất cả, chứ nhất định không chịu mất nước\"."],["C","Tuyên bố \"Nước Việt Nam là một, dân tộc Việt Nam là một\" vào tháng 2 năm 1958."],["D","Việc Hồ Chí Minh gửi bản Yêu sách của nhân dân An Nam tới Hội nghị Vécxây năm 1919."],["E","Khẩu hiệu \"Không có gì quý hơn độc lập, tự do\" ngày 17/7/1966."]],"a":"D","g":"Phương án A, B, C, E đều là các sự kiện và tuyên bố diễn ra sau năm 1945, thể hiện quyết tâm bảo vệ độc lập dân tộc và thống nhất đất nước. Phương án D là sự kiện năm 1919, trước khi Việt Nam giành được độc lập năm 1945, thuộc giai đoạn hình thành tư tưởng chứ không phải bảo vệ độc lập đã giành được."},{"id":"vn04-16","cd":"04","l":"SAI","q":"Theo tư tưởng Hồ Chí Minh về nền độc lập thật sự, hoàn toàn và triệt để, yếu tố nào sau đây KHÔNG phải là dấu hiệu của một quốc gia độc lập giả hiệu?","o":[["A","Không có quyền tự quyết về ngoại giao."],["B","Có chính phủ bù nhìn bản xứ do thực dân thành lập."],["C","Không có quân đội riêng."],["D","Không có nền tài chính riêng."],["E","Có quan hệ ngoại giao bình đẳng với các nước lớn."]],"a":"E","g":"Tài liệu môn học mô tả độc lập giả hiệu là tình trạng mà \"bọn thực dân, đế quốc hay dùng chiêu bài mị dân, thành lập các chính phủ bù nhìn bản xứ, tuyên truyền cái gọi là 'độc lập tự do' giả hiệu\". Người cũng nhấn mạnh rằng độc lập thật sự phải có quyền tự quyết về ngoại giao, quân đội riêng, nền tài chính riêng. Do đó, việc không có các quyền này là dấu hiệu của độc lập giả hiệu (A, C, D). Có chính phủ bù nhìn (B) cũng là một dấu hiệu. Ngược lại, \"có quan hệ ngoại giao bình đẳng với các nước lớn\" là một biểu hiện của quyền tự quyết về ngoại giao, thuộc về độc lập thật sự, không phải độc lập giả hiệu."},{"id":"vn04-17","cd":"04","l":"SAI","q":"Các biện pháp sau đây, theo Hồ Chí Minh, đều góp phần thực hiện mục tiêu \"Làm cho dân có ăn, có mặc, có chỗ ở, có học hành\" sau Cách mạng Tháng Tám năm 1945, NGOẠI TRỪ:","o":[["A","Thủ tiêu hết các thứ quốc trái."],["B","Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo."],["C","Thi hành luật ngày làm 8 giờ."],["D","Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến."],["E","Bỏ sưu thuế cho dân cày nghèo."]],"a":"D","g":"Các phương án A, B, C, E đều là các biện pháp cụ thể liên quan đến dân sinh được Hồ Chí Minh đề ra trong Chánh cương vắn tắt của Đảng năm 1930, nhằm cải thiện trực tiếp đời sống của nhân dân, qua đó góp phần thực hiện mục tiêu \"có ăn, có mặc, có chỗ ở, có học hành\" sau Cách mạng Tháng Tám. Phương án D \"Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến\" là mục tiêu chính trị cơ bản để giành độc lập dân tộc, là tiền đề, nhưng không phải là biện pháp trực tiếp để \"làm cho dân có ăn, có mặc...\" như các phương án còn lại."},{"id":"vn04-18","cd":"04","l":"SAI","q":"Nhận định nào sau đây KHÔNG phản ánh đúng nội dung tư tưởng Hồ Chí Minh về độc lập dân tộc như được trình bày trong Tài liệu môn học?","o":[["A","Độc lập dân tộc là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc."],["B","Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân."],["C","Độc lập dân tộc phải là nền độc lập thật sự, hoàn toàn và triệt để."],["D","Độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ."],["E","Độc lập dân tộc là mục tiêu duy nhất, tuyệt đối ưu tiên, vượt lên mọi quyền lợi khác của nhân dân."]],"a":"E","g":"Tài liệu môn học trình bày bốn luận điểm chính trong tư tưởng Hồ Chí Minh về vấn đề độc lập dân tộc: a) Độc lập, tự do là quyền thiêng liêng, b) Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân, c) Độc lập dân tộc phải là nền độc lập thật sự, hoàn toàn và triệt để, d) Độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ. Phương án E sai vì Người luôn nhấn mạnh sự gắn liền của độc lập với tự do, hạnh phúc của nhân dân, thậm chí khẳng định \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\", cho thấy độc lập không phải là mục tiêu duy nhất, tuyệt đối tách rời khỏi quyền lợi của nhân dân."},{"id":"vn04-19","cd":"04","l":"NH","q":"Trong Bản Yêu sách của nhân dân An Nam (1919), Hồ Chí Minh đã đòi hỏi những quyền cơ bản nào cho người dân Đông Dương?","o":[["A","Quyền bình đẳng về mặt pháp lý."],["B","Các quyền tự do, dân chủ."],["C","Quyền được tham gia vào chính phủ Pháp."],["D","Quyền được thành lập nhà nước độc lập ngay lập tức."],["E","Quyền tự quyết định về kinh tế."]],"a":"AB","g":"Tài liệu môn học nêu rõ Bản Yêu sách của nhân dân An Nam bao gồm 8 điểm với \"hai nội dung chính là đòi quyền bình đẳng về mặt pháp lý và đòi các quyền tự do, dân chủ của người dân Đông Dương\". Các phương án C, D, E không được nhắc đến là nội dung của bản yêu sách."},{"id":"vn04-20","cd":"04","l":"NH","q":"Hồ Chí Minh đã viện dẫn những tuyên ngôn nào để khẳng định các giá trị thiêng liêng, bất biến về quyền dân tộc \"sinh ra bình đẳng, có quyền sống, quyền sung sướng và quyền tự do\"?","o":[["A","Tuyên ngôn Độc lập của cách mạng Mỹ năm 1776."],["B","Tuyên ngôn Nhân quyền và Dân quyền của Cách mạng Pháp năm 1791."],["C","Hiến chương Liên hợp quốc."],["D","Tuyên ngôn của Đảng Cộng sản năm 1848."],["E","Học thuyết \"Tam dân\" của Tôn Trung Sơn."]],"a":"AB","g":"Tài liệu môn học ghi rõ: \"Căn cứ vào những quyền tự do, bình đẳng và quyền con người - “những quyền mà không ai có thể xâm phạm được” đã được ghi trong bản Tuyên ngôn độc lập của cách mạng Mỹ năm 1776, Tuyên ngôn nhân quyền và dân quyền của Cách mạng Pháp năm 1791, Hồ Chí Minh tiếp tục khẳng định những giá trị thiêng liêng, bất biến về quyền dân tộc\". Học thuyết \"Tam dân\" được Người đánh giá cao, nhưng không phải là tuyên ngôn Người viện dẫn để khẳng định các giá trị này theo cách trích dẫn."},{"id":"vn04-21","cd":"04","l":"NH","q":"Sau thắng lợi của Cách mạng Tháng Tám năm 1945, Hồ Chí Minh đã yêu cầu thực hiện ngay những việc cấp bách nào để đảm bảo tự do, hạnh phúc cho nhân dân?","o":[["A","Làm cho dân có ăn."],["B","Làm cho dân có mặc."],["C","Làm cho dân có chỗ ở."],["D","Làm cho dân có học hành."],["E","Xây dựng quân đội chính quy hiện đại."]],"a":"ABCD","g":"Tài liệu môn học nêu rõ, sau Cách mạng Tháng Tám năm 1945, trong hoàn cảnh nhân dân đói rét, mù chữ…, Hồ Chí Minh yêu cầu: \"1. Làm cho dân có ăn. 2. Làm cho dân có mặc. 3. Làm cho dân có chỗ ở. 4. Làm cho dân có học hành\". Xây dựng quân đội chính quy hiện đại là một nhiệm vụ quan trọng khác nhưng không nằm trong 4 yêu cầu cấp bách này được liệt kê trong Tài liệu môn học."},{"id":"vn04-22","cd":"04","l":"NH","q":"Tư tưởng độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ của Hồ Chí Minh được thể hiện rõ qua những tuyên bố và hành động nào?","o":[["A","Khẳng định \"Đồng bào Nam Bộ là dân nước Việt Nam\" trong Thư gửi đồng bào Nam Bộ năm 1946."],["B","Tuyên bố \"Nước Việt Nam là một, dân tộc Việt Nam là một\" vào tháng 2 năm 1958."],["C","Niềm tin tuyệt đối vào sự thống nhất nước nhà trong Di chúc."],["D","Kêu gọi Liên hợp quốc năm 1946 bảo vệ \"Toàn vẹn lãnh thổ cho Tổ quốc\"."],["E","Ký kết Hiệp định Pari năm 1973 buộc Mỹ rút quân."]],"a":"ABCD","g":"Các phương án A, B, C trực tiếp thể hiện tư tưởng độc lập gắn liền với thống nhất và toàn vẹn lãnh thổ. Phương án D cũng nêu rõ \"bảo vệ những quyền thiêng liêng nhất: Toàn vẹn lãnh thổ cho Tổ quốc và độc lập cho đất nước\" trong lời kêu gọi Liên hợp quốc năm 1946. Phương án E là một sự kiện lịch sử quan trọng, là kết quả của cuộc đấu tranh mà Hồ Chí Minh đã lãnh đạo nhưng Người đã qua đời vào năm 1969, trước khi Hiệp định Paris được ký kết năm 1973. Do đó, đây không phải là một tuyên bố hay hành động trực tiếp của Hồ Chí Minh thể hiện tư tưởng này."},{"id":"vn04-23","cd":"04","l":"NH","q":"Những phát biểu nào sau đây của Hồ Chí Minh nhấn mạnh ý chí và quyết tâm sắt đá bảo vệ độc lập dân tộc sau khi đã giành được độc lập?","o":[["A","\"Cái mà tôi cần nhất trên đời là đồng bào tôi được tự do, Tổ quốc tôi được độc lập\" (1919)."],["B","\"Toàn thể dân Việt Nam quyết đem tất cả tinh thần và lực lượng, tính mệnh và của cải để giữ vững quyền tự do và độc lập ấy\" (Tuyên ngôn độc lập 1945)."],["C","\"Nhân dân chúng tôi cũng kiên quyết chiến đấu đến cùng để bảo vệ những quyền thiêng liêng nhất: Toàn vẹn lãnh thổ cho Tổ quốc và độc lập cho đất nước\" (Lời kêu gọi Liên hợp quốc 1946)."],["D","\"Không! Chúng ta thà hy sinh tất cả, chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ\" (Lời kêu gọi toàn quốc kháng chiến 1946)."],["E","\"Không có gì quý hơn độc lập, tự do\" (17/7/1966)."]],"a":"BCDE","g":"Phương án A là câu nói năm 1919, thể hiện khát khao cá nhân trước khi giành được độc lập. Các phương án còn lại đều là những tuyên bố mạnh mẽ sau năm 1945, thể hiện quyết tâm giữ vững và bảo vệ nền độc lập đã giành được, đặc biệt là trong bối cảnh bị xâm lược lần thứ hai và chiến tranh ác liệt."},{"id":"vn04-24","cd":"04","l":"NH","q":"Theo quan điểm của Hồ Chí Minh, một nền độc lập dân tộc được coi là \"thật sự, hoàn toàn và triệt để\" (phần c) khi có những đặc điểm nào?","o":[["A","Quyền tự quyết về ngoại giao."],["B","Có quân đội riêng."],["C","Có nền tài chính riêng."],["D","Có chính phủ do dân bầu lên, không chịu sự can thiệp từ bên ngoài."],["E","Được công nhận bởi các cường quốc trên thế giới."]],"a":"ABC","g":"Tài liệu môn học nhấn mạnh: \"độc lập mà người dân tộc không có quyền tự quyết về ngoại giao, không có quân đội riêng, không có nền tài chính riêng…, thì độc lập đó chẳng có ý nghĩa gì\". Điều này trực tiếp liệt kê ba đặc điểm A, B, C. Phương án D là một phần của chủ quyền quốc gia và dân chủ nhưng không được liệt kê cụ thể như 3 yếu tố kia trong định nghĩa độc lập thật sự trong Tài liệu môn học. Phương án E là yếu tố bên ngoài, không phải là đặc điểm nội tại của nền độc lập thật sự theo Người."},{"id":"vn04-25","cd":"04","l":"DK","q":"Năm 1919, nhân dịp các nước Đồng minh thắng trận họp Hội nghị Vécxây, Hồ Chí Minh đã gửi tới Hội nghị bản (1) _______ của nhân dân An Nam, bao gồm 8 điểm với hai nội dung chính là đòi quyền (2) _______ về mặt pháp lý và đòi các quyền tự do, dân chủ của người dân Đông Dương.","o":[["A","(1) Tuyên ngôn; (2) bình đẳng"],["B","(1) Yêu sách; (2) bình đẳng"],["C","(1) Yêu sách; (2) tự quyết"],["D","(1) Hiến pháp; (2) thống nhất"],["E","(1) Tuyên ngôn; (2) tự quyết"]],"a":"B","g":"Tài liệu môn học ghi: \"Năm 1919... Hồ Chí Minh đã gửi tới Hội nghị bản Yêu sách của nhân dân An Nam, bao gồm 8 điểm với hai nội dung chính là đòi quyền bình đẳng về mặt pháp lý và đòi các quyền tự do, dân chủ của người dân Đông Dương\"."},{"id":"vn04-26","cd":"04","l":"DK","q":"Trong Chánh cương vắn tắt của Đảng (năm 1930), Hồ Chí Minh đã xác định mục tiêu chính trị của Đảng là: \"a) Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến. b) Làm cho nước Nam được hoàn toàn (1) _______\", đồng thời đề ra các mục tiêu xã hội như \"Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo. Bỏ sưu thuế cho dân cày nghèo… Thi hành luật ngày làm (2) _______ giờ\".","o":[["A","(1) tự do; (2) 8"],["B","(1) độc lập; (2) 10"],["C","(1) thống nhất; (2) 6"],["D","(1) độc lập; (2) 8"],["E","(1) tự do; (2) 10"]],"a":"D","g":"Tài liệu môn học nêu rõ mục tiêu chính trị là \"Làm cho nước Nam được hoàn toàn độc lập\" và chính sách xã hội là \"Thi hành luật ngày làm 8 giờ\"."},{"id":"vn04-27","cd":"04","l":"DK","q":"Ngày 17/7/1966, trong bối cảnh khó khăn, chiến tranh ác liệt, Hồ Chí Minh đã nêu lên một chân lý thời đại, một tuyên ngôn bất hủ của các dân tộc khao khát nền độc lập, tự do trên thế giới: \"Không có gì quý hơn (1) _______, (2) _______\".","o":[["A","(1) độc lập; (2) tự do"],["B","(1) hòa bình; (2) tự do"],["C","(1) độc lập; (2) hạnh phúc"],["D","(1) tự do; (2) dân chủ"],["E","(1) hòa bình; (2) hạnh phúc"]],"a":"A","g":"Tài liệu môn học trích dẫn nguyên văn câu nói này của Hồ Chí Minh (Lời kêu gọi đồng bào và chiến sĩ cả nước, ngày 17/7/1966) là: “Không có gì quý hơn độc lập, tự do”."},{"id":"vn04-28","cd":"04","l":"DK","q":"Nối tiếp các giá trị của Tuyên ngôn độc lập cách mạng Mỹ và Tuyên ngôn nhân quyền và dân quyền cách mạng Pháp, Hồ Chí Minh khẳng định: \"Tất cả các dân tộc trên thế giới đều sinh ra (1) _______; dân tộc nào cũng có quyền sống, quyền sung sướng và quyền (2) _______... Đó là những lẽ phải không ai chối cãi được\".","o":[["A","(1) thống nhất; (2) tự do"],["B","(1) bình đẳng; (2) phát triển"],["C","(1) bình đẳng; (2) tự do"],["D","(1) tự chủ; (2) phát triển"],["E","(1) bình đẳng; (2) tự chủ"]],"a":"C","g":"Tài liệu môn học trích lời Hồ Chí Minh: \"Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng; dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do... Đó là những lẽ phải không ai chối cãi được\"."},{"id":"vn04-29","cd":"04","l":"DK","q":"Để bảo vệ nền độc lập thật sự mới giành được sau Cách mạng Tháng Tám, đặc biệt trong hoàn cảnh \"thù trong giặc ngoài\", Hồ Chí Minh và Chính phủ Việt Nam Dân chủ Cộng hòa đã sử dụng nhiều biện pháp, trong đó có biện pháp (1) _______, nhằm bảo vệ nền độc lập (2) _______ của đất nước.","o":[["A","(1) quân sự; (2) thật sự"],["B","(1) kinh tế; (2) thật sự"],["C","(1) ngoại giao; (2) giả hiệu"],["D","(1) quân sự; (2) giả hiệu"],["E","(1) ngoại giao; (2) thật sự"]],"a":"E","g":"Tài liệu môn học nêu rõ: \"để bảo vệ nền độc lập thật sự mới giành được, Người đã cùng Chính phủ Việt Nam Dân chủ Cộng hòa sử dụng nhiều biện pháp, trong đó có biện pháp ngoại giao, để bảo vệ nền độc lập thật sự của đất nước\"."},{"id":"vn04-30","cd":"04","l":"DK","q":"Trong Di chúc, Hồ Chí Minh đã thể hiện niềm tin tuyệt đối vào sự thắng lợi của cách mạng, vào sự (1) _______ nước nhà: \"Dù khó khăn gian khổ đến mấy, nhân dân ta nhất định sẽ hoàn toàn thắng lợi. Đế quốc Mỹ nhất định phải cút khỏi nước ta. Tổ quốc ta nhất định sẽ (2) _______. Đồng bào Nam, Bắc nhất định sẽ sum họp một nhà”.","o":[["A","(1) độc lập; (2) thống nhất"],["B","(1) thống nhất; (2) thống nhất"],["C","(1) thống nhất; (2) độc lập"],["D","(1) phát triển; (2) phồn vinh"],["E","(1) tự chủ; (2) độc lập"]],"a":"B","g":"Tài liệu môn học trích Di chúc của Hồ Chí Minh: \"Dù khó khăn gian khổ đến mấy, nhân dân ta nhất định sẽ hoàn toàn thắng lợi. Đế quốc Mỹ nhất định phải cút khỏi nước ta. Tổ quốc ta nhất định sẽ thống nhất. Đồng bào Nam, Bắc nhất định sẽ sum họp một nhà\"."},{"id":"vn05-1","cd":"05","l":"DS","q":"Theo Hồ Chí Minh, cách mạng tư sản không thể giải phóng dân tộc đến nơi vì bản chất của nó là tước đoạt công nông ở trong nước và áp bức thuộc địa ở bên ngoài, đồng thời chỉ mang lại tự do, bình đẳng giả dối cho nhân dân.","o":[],"a":"D","g":"Tài liệu môn học ghi rõ: \"Người quyết định không chọn con đường cách mạng tư sản vì cho rằng: “Cách mệnh Pháp cũng như cách mệnh Mỹ, nghĩa là cách mệnh tư bản, cách mệnh không đến nơi, tiếng là cộng hòa và dân chủ, kỳ thực trong thì nó tước lục công nông, ngoài thì nó áp bức thuộc địa.”. Tài liệu môn học bổ sung \"không phải tự do và bình đẳng giả dối như đế quốc chủ nghĩa Pháp khoe khoang bên An Nam...\". Điều này hoàn toàn phù hợp với câu hỏi."},{"id":"vn05-2","cd":"05","l":"DS","q":"Trong quan điểm của Hồ Chí Minh về mối quan hệ giữa giải phóng dân tộc và giải phóng giai cấp, giải phóng giai cấp phải được đặt lên hàng đầu và thực hiện trước để tạo tiền đề cho giải phóng dân tộc ở các nước thuộc địa.","o":[],"a":"S","g":"Tài liệu môn học nêu rõ: \"Còn theo Hồ Chí Minh, ở Việt Nam và các nước thuộc địa do hoàn cảnh lịch sử - chính trị khác với châu Âu nên phải là: giải phóng dân tộc - giải phóng xã hội - giải phóng giai cấp giải phóng con người.\". Như vậy, giải phóng dân tộc là trước hết, trên hết, không phải giải phóng giai cấp."},{"id":"vn05-3","cd":"05","l":"DS","q":"Luận điểm của Hồ Chí Minh về khả năng giành thắng lợi của cách mạng thuộc địa trước cách mạng vô sản ở chính quốc hoàn toàn trái ngược với mọi quan điểm của Quốc tế Cộng sản vào thời điểm đó.","o":[],"a":"S","g":"Tài liệu môn học chỉ ra rằng Đại hội VI Quốc tế Cộng sản (1928) có quan điểm cho rằng cách mạng thuộc địa phụ thuộc vào cách mạng vô sản ở chính quốc, làm giảm tính chủ động của cách mạng thuộc địa. Tuy nhiên, Tài liệu môn học cũng nói Hồ Chí Minh \"Quán triệt tư tưởng của V.I. Lênin về mối quan hệ chặt chẽ giữa cách mạng vô sản ở chính quốc với phong trào giải phóng dân tộc thuộc địa\" và Người chỉ rõ mối quan hệ bình đẳng, không lệ thuộc. Do đó, Người không hoàn toàn trái ngược với mọi quan điểm, mà có sự phát triển sáng tạo dựa trên nền tảng Lênin, nhưng vượt qua hạn chế của Quốc tế Cộng sản ở một số thời điểm. Từ khóa \"hoàn toàn trái ngược với mọi quan điểm\" làm câu này sai."},{"id":"vn05-4","cd":"05","l":"DS","q":"Theo Hồ Chí Minh, trong điều kiện Việt Nam là một nước thuộc địa – phong kiến, Đảng Cộng sản chỉ là đội tiên phong của giai cấp công nhân để hoàn thành sứ mệnh lịch sử của mình, giống như lý luận của chủ nghĩa Mác – Lênin.","o":[],"a":"S","g":"Tài liệu môn học nêu rõ: \"Trong hoàn cảnh Việt Nam là một nước thuộc địa – phong kiến, Hồ Chí Minh cho rằng, Đảng Cộng sản vừa là đội tiên phong của giai cấp công nhân vừa là đội tiên phong của nhân dân lao động... Đó còn là Đảng của cả dân tộc Việt Nam.\". Đây là luận điểm bổ sung, phát triển lý luận mác xít về đảng cộng sản. Do đó, nhận định rằng Đảng chỉ là đội tiên phong của giai cấp công nhân là không đầy đủ và sai."},{"id":"vn05-5","cd":"05","l":"DS","q":"Hồ Chí Minh chủ trương rằng việc đánh đổ đế quốc và bọn phong kiến, làm cho nước Nam được hoàn toàn độc lập phải được thực hiện đồng thời, khăng khít với nhau, nương tựa vào nhau, theo đúng quan điểm của Quốc tế Cộng sản.","o":[],"a":"S","g":"Tài liệu môn học chỉ ra rằng \"Cũng theo Quốc tế Cộng sản, hai nhiệm vụ chống đế quốc và chống phong kiến phải được thực hiện đồng thời, khăng khít với nhau, nương tựa vào nhau.\". Tuy nhiên, \"Nhưng xuất phát từ một nước thuộc địa, Hồ Chí Minh không coi hai nhiệm vụ đó nhất loại phải thực hiện ngang nhau, mà đặt lên hàng đầu nhiệm vụ chống đế quốc, giải phóng dân tộc, còn nhiệm vụ chống phong kiến... thì sẽ từng bước thực hiện.\". Do đó, câu hỏi này là sai vì Hồ Chí Minh không cho là \"nhất loại phải thực hiện ngang nhau\" mà có sự ưu tiên."},{"id":"vn05-6","cd":"05","l":"DS","q":"Luận điểm của Hồ Chí Minh về \"chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở thuộc địa\" hàm ý rằng cách mạng ở chính quốc và cách mạng ở thuộc địa cần phải phối hợp đồng bộ, cùng lúc để tiêu diệt chủ nghĩa đế quốc một cách triệt để.","o":[],"a":"D","g":"Tài liệu môn học dùng hình ảnh con đỉa để minh họa sự liên kết giữa chính quốc và thuộc địa trong việc duy trì chủ nghĩa tư bản. Người viết: \"Nếu muốn giết con vật ấy, người ta phải đồng thời cắt cả hai vòi.\". Điều này rõ ràng thể hiện sự cần thiết của sự phối hợp đồng bộ, cùng lúc giữa hai cách mạng để đạt hiệu quả triệt để."},{"id":"vn05-7","cd":"05","l":"D1","q":"Theo tư tưởng Hồ Chí Minh, đặc điểm nào sau đây là yếu tố cốt lõi dẫn đến thất bại của các phong trào yêu nước Việt Nam trước khi Người tìm thấy con đường cứu nước mới?","o":[["A","Thiếu sự hỗ trợ từ các phong trào quốc tế."],["B","Chưa nhận diện được bản chất áp bức của chủ nghĩa tư bản."],["C","Khủng hoảng, bế tắc về giai cấp lãnh đạo và đường lối cách mạng."],["D","Quá phụ thuộc vào sự giúp đỡ từ các nước láng giềng."],["E","Không đủ sức mạnh quân sự để chống lại thực dân Pháp."]],"a":"C","g":"Tài liệu môn học chỉ rõ: \"sự thất bại của những phong trào yêu nước trong thời kỳ này thể hiện sự khủng hoảng bế tắc về giai cấp lãnh đạo và đường lối cách mạng.\". Các phương án khác có thể là yếu tố phụ nhưng không phải là \"yếu tố cốt lõi\" được Tài liệu môn học trực tiếp nhắc đến."},{"id":"vn05-8","cd":"05","l":"D1","q":"Luận điểm nào sau đây thể hiện rõ nhất nét độc đáo, sáng tạo của Hồ Chí Minh khi giải quyết mối quan hệ giữa nhiệm vụ chống đế quốc và chống phong kiến trong \"Chánh cương vắn tắt của Đảng\"?","o":[["A","Thúc đẩy song song hai nhiệm vụ, coi chúng có vai trò ngang nhau."],["B","Tạm gác nhiệm vụ chống đế quốc để tập trung vào cải cách ruộng đất."],["C","Đặt nhiệm vụ chống đế quốc, giải phóng dân tộc lên hàng đầu, còn chống phong kiến sẽ thực hiện từng bước."],["D","Chỉ nêu chủ trương \"người cày có ruộng\" mà không đề cập đến việc thâu hồi ruộng đất của đế quốc."],["E","Ưu tiên giải quyết vấn đề phong kiến trước để củng cố nội lực, sau đó mới chống đế quốc."]],"a":"C","g":"Tài liệu môn học khẳng định: \"xuất phát từ một nước thuộc địa, Hồ Chí Minh không coi hai nhiệm vụ đó nhất loại phải thực hiện ngang nhau, mà đặt lên hàng đầu nhiệm vụ chống đế quốc, giải phóng dân tộc, còn nhiệm vụ chống phong kiến, mang lại ruộng đất cho nông dân thì sẽ từng bước thực hiện.\". Đây chính là nét độc đáo, sáng tạo của Người. Phương án A là quan điểm của Quốc tế Cộng sản mà Hồ Chí Minh không theo hoàn toàn. Phương án D sai vì Hồ Chí Minh nêu \"thâu hết ruộng đất của đế quốc chủ nghĩa...\" nhưng chưa nêu \"người cày có ruộng\"."},{"id":"vn05-9","cd":"05","l":"D1","q":"Theo Hồ Chí Minh, tại sao cách mạng ở thuộc địa có vai trò rất lớn trong việc cùng với cách mạng vô sản ở chính quốc tiêu diệt chủ nghĩa đế quốc?","o":[["A","Vì thuộc địa là nơi tập trung phần lớn lực lượng quân sự của đế quốc."],["B","Vì nọc độc và sức sống của con rắn độc tư bản chủ nghĩa đang tập trung ở các thuộc địa hơn là ở chính quốc."],["C","Vì phong trào đấu tranh ở thuộc địa thường ít bị đàn áp hơn ở chính quốc."],["D","Vì cách mạng thuộc địa có khả năng phát triển nhanh hơn do sự hỗ trợ từ bên ngoài."],["E","Vì chỉ có cách mạng thuộc địa mới có thể cắt đứt hoàn toàn Tài liệu môn học tài nguyên cho chính quốc."]],"a":"B","g":"Tài liệu môn học giải thích: \"Người cho rằng: “nọc độc và sức sống của con rắn độc tư bản chủ nghĩa đang tập trung ở các thuộc địa hơn là ở chính quốc”18; nếu thờ ơ về vấn đề cách mạng ở thuộc địa thì như “đánh chết rắn đằng đuôi”19. Cho nên, cách mạng ở thuộc địa có vai trò rất lớn trong việc cùng với cách mạng vô sản ở chính quốc tiêu diệt chủ nghĩa đế quốc.\"."},{"id":"vn05-10","cd":"05","l":"D1","q":"Nhận định nào sau đây không phản ánh đúng tầm quan trọng của Đảng Cộng sản theo tư tưởng Hồ Chí Minh trong cách mạng giải phóng dân tộc ở Việt Nam?","o":[["A","Đảng là nhân tố chủ quan để giai cấp công nhân hoàn thành sứ mệnh lịch sử của mình."],["B","Đảng phải vận động và tổ chức dân chúng trong nước."],["C","Đảng phải liên lạc với các dân tộc bị áp bức và vô sản giai cấp mọi nơi."],["D","Đảng chỉ cần vững mạnh về quân sự là cách mạng có thể thành công."],["E","Đảng là đội tiên phong của nhân dân lao động và của cả dân tộc Việt Nam."]],"a":"D","g":"Tài liệu môn học và nhấn mạnh vai trò của Đảng Cộng sản trong việc \"thuyết phục, giác ngộ và tập hợp đông đảo quần chúng, huấn luyện quần chúng và đưa quần chúng ra đấu tranh\", \"vận động và tổ chức dân chúng, ngoài thì liên lạc với các dân tộc bị áp bức và vô sản giai cấp mọi nơi. Đảng có vững cách mệnh mới thành công\". Tài liệu môn học cũng nói Đảng là đội tiên phong của nhân dân lao động và của cả dân tộc Việt Nam. Nhận định \"Đảng chỉ cần vững mạnh về quân sự\" là thiếu sót, không phản ánh đầy đủ vai trò của Đảng như đã nêu. \"Vững\" ở đây bao hàm nhiều yếu tố, không chỉ quân sự."},{"id":"vn05-11","cd":"05","l":"D1","q":"Khi kêu gọi toàn quốc kháng chiến (tháng 12/1946), Hồ Chí Minh đã nhấn mạnh yếu tố nào là nền tảng cốt lõi để tập hợp lực lượng đấu tranh chống kẻ thù chung của dân tộc?","o":[["A","Phân chia rõ ràng giai cấp để phát huy vai trò tiên phong của công nhân và nông dân."],["B","Tập trung vào việc xây dựng lực lượng vũ trang chuyên nghiệp và hiện đại."],["C","Đoàn kết mọi người Việt Nam không phân biệt giai tầng, dân tộc, tôn giáo, đảng phái."],["D","Kêu gọi sự giúp đỡ từ các nước xã hội chủ nghĩa anh em."],["E","Tạm gác lại các mâu thuẫn nội bộ để duy trì ổn định."]],"a":"C","g":"Tài liệu môn học trích dẫn Lời kêu gọi toàn quốc kháng chiến: “Bất kỳ đàn ông, đàn bà, bất kỳ người già, người trẻ, không chia tôn giáo, đảng phái, dân tộc. Hễ là người Việt Nam thì phải đứng lên ánh thực dân Pháp để cứu Tổ quốc”. Điều này thể hiện rõ tư tưởng đại đoàn kết toàn dân tộc, không phân biệt các yếu tố khác."},{"id":"vn05-12","cd":"05","l":"D1","q":"Theo Hồ Chí Minh, vì sao giai cấp công nhân và nông dân được xem là \"gốc cách mệnh\" và \"lòng cách mệnh càng bền, chí cách mệnh càng quyết\"?","o":[["A","Vì họ là những người có trình độ học vấn cao nhất, dễ tiếp thu lý luận cách mạng."],["B","Vì họ là hai giai cấp đông đảo nhất và bị bóc lột nặng nề nhất, không còn gì để mất ngoài xiềng xích."],["C","Vì họ có khả năng tự tổ chức và lãnh đạo cách mạng mà không cần sự can thiệp từ bên ngoài."],["D","Vì họ đại diện cho nền sản xuất tiên tiến nhất của xã hội thuộc địa."],["E","Vì họ có mối liên hệ mật thiết với chính quốc và có thể tranh thủ sự ủng hộ quốc tế."]],"a":"B","g":"Tài liệu môn học giải thích: \"giai cấp công nhân và nông dân là hai giai cấp đông đảo và cách mạng nhất, bị bóc lột nặng nề nhất, vì thế “lòng cách mệnh càng bền, chí cách mệnh càng quyết... công nông là tay không chân rồi, nếu thua thì chỉ mất một cái kiếp khổ, nếu được thì được cả thế giới, cho nên họ gan góc”\"."},{"id":"vn05-13","cd":"05","l":"SAI","q":"Theo tư tưởng Hồ Chí Minh, con đường cách mạng giải phóng dân tộc ở Việt Nam cần tuân thủ những nguyên tắc cơ bản nào sau đây, ngoại trừ:","o":[["A","Đi theo con đường cách mạng vô sản."],["B","Gắn giải phóng dân tộc với giải phóng giai cấp, trong đó giải phóng dân tộc là trước hết."],["C","Độc lập dân tộc phải gắn liền với chủ nghĩa xã hội."],["D","Phải được tiến hành bằng phương pháp bạo lực cách mạng và vũ trang."],["E","Hoàn toàn phụ thuộc vào thắng lợi của cách mạng vô sản ở chính quốc."]],"a":"E","g":"Các lựa chọn A, B, C, D đều là những nguyên tắc cốt lõi trong tư tưởng Hồ Chí Minh về cách mạng giải phóng dân tộc. Riêng lựa chọn E, Hồ Chí Minh khẳng định cách mạng thuộc địa không phụ thuộc vào cách mạng vô sản ở chính quốc và có thể giành thắng lợi trước. Do đó, \"hoàn toàn phụ thuộc\" là sai."},{"id":"vn05-14","cd":"05","l":"SAI","q":"Luận điểm sáng tạo của Hồ Chí Minh về khả năng giành thắng lợi của cách mạng thuộc địa trước cách mạng vô sản ở chính quốc được xây dựng dựa trên các cơ sở nào sau đây, ngoại trừ:","o":[["A","Thuộc địa có vị trí, vai trò, tầm quan trọng đặc biệt đối với chủ nghĩa đế quốc."],["B","Tinh thần đấu tranh cách mạng hết sức quyết liệt của các dân tộc thuộc địa."],["C","Nhấn mạnh sự cần thiết của việc các nước thuộc địa phải chờ đợi sự hỗ trợ từ chính quốc."],["D","Luận điểm của C. Mác về khả năng tự giải phóng của giai cấp công nhân."],["E","Thực tiễn thắng lợi của Cách mạng tháng Tám 1945 ở Việt Nam và phong trào giải phóng dân tộc trên thế giới."]],"a":"C","g":"Tài liệu môn học liệt kê các cơ sở cho luận điểm sáng tạo của Hồ Chí Minh. Các lựa chọn A, B, D đều được nêu rõ trong. Lựa chọn E là bằng chứng thực tiễn sau này càng chứng minh luận điểm đúng. Lựa chọn C (\"nhấn mạnh sự cần thiết của việc các nước thuộc địa phải chờ đợi sự hỗ trợ từ chính quốc\") lại đi ngược lại tinh thần chủ động, tự giải phóng và có khả năng thắng lợi trước của cách mạng thuộc địa theo Hồ Chí Minh."},{"id":"vn05-15","cd":"05","l":"SAI","q":"Nhận định nào sau đây không phải là nội dung cốt lõi của tư tưởng Hồ Chí Minh về bạo lực cách mạng?","o":[["A","Dùng bạo lực cách mạng để chống lại bạo lực phản cách mạng."],["B","Bạo lực cách mạng phải là bạo lực của quần chúng."],["C","Luôn ưu tiên đấu tranh vũ trang tuyệt đối, coi đấu tranh chính trị là thứ yếu."],["D","Cần sử dụng khéo léo kết hợp các hình thức đấu tranh vũ trang và đấu tranh chính trị."],["E","Bạo lực cách mạng được thực hiện với hai lực lượng chính trị và quân sự."]],"a":"C","g":"Tài liệu môn học khẳng định sự cần thiết của bạo lực cách mạng chống bạo lực phản cách mạng. Tài liệu môn học nói bạo lực cách mạng là bạo lực của quần chúng, với hai lực lượng chính trị và quân sự, hai hình thức đấu tranh chính trị và vũ trang. Đặc biệt, \"đấu tranh chính trị của quần chúng là cơ sở, nền tảng cho việc xây dựng lực lượng vũ trang và đấu tranh vũ trang; đấu tranh vũ trang có ý nghĩa quyết định đối với việc tiêu diệt lực lượng quân sự...\". Đồng thời, cần \"sử dụng đúng và khéo kết hợp các hình thức đấu tranh vũ trang và đấu tranh chính trị\". Do đó, nhận định \"luôn ưu tiên đấu tranh vũ trang tuyệt đối, coi đấu tranh chính trị là thứ yếu\" là sai, vì đấu tranh chính trị là cơ sở, v"},{"id":"vn05-16","cd":"05","l":"SAI","q":"Trong Sách lược vắn tắt của Đảng, Hồ Chí Minh đã xác định lực lượng cách mạng bao gồm toàn dân, với các thành phần nào sau đây được coi là mục tiêu thu phục hoặc lợi dụng, ngoại trừ:","o":[["A","Đại bộ phận giai cấp công nhân."],["B","Đại bộ phận dân cày và dân cày nghèo."],["C","Tiểu tư sản, trí thức, trung nông."],["D","Phú nông, trung, tiểu địa chủ và tư sản Việt Nam đã rõ mặt phản cách mạng."],["E","Phú nông, trung, tiểu địa chủ và tư sản Việt Nam mà chưa rõ mặt phản cách mạng."]],"a":"D","g":"Tài liệu môn học khẳng định \"cách mệnh là việc chung cả dân chúng\". Tài liệu môn học nêu rõ Đảng phải thu phục công nhân, tập hợp đại bộ phận dân cày, dựa vào dân cày nghèo, liên lạc với tiểu tư sản, trí thức, trung nông. Đối với \"phú nông, trung, tiểu địa chủ và tư sản Việt Nam mà chưa rõ mặt phản cách mạng thì phải lợi dụng, ít ra cũng làm cho họ trung lập\". Đối với những người đã rõ mặt phản cách mạng, Hồ Chí Minh không chủ trương lợi dụng hay trung lập hóa mà phải đấu tranh. Do đó, lựa chọn D là thành phần không được coi là mục tiêu thu phục hoặc lợi dụng."},{"id":"vn05-17","cd":"05","l":"SAI","q":"Phát biểu nào sau đây của Hồ Chí Minh thể hiện quan điểm nhất quán về độc lập dân tộc gắn liền với chủ nghĩa xã hội?","o":[["A","\"Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường cách mạng vô sản\"."],["B","\"Trong thế giới bây giờ chỉ có cách mệnh Nga là đã thành công, và thành công đến nơi...\"."],["C","Trong Chánh cương vắn tắt của Đảng (1930), khẳng định phương hướng chiến lược \"làm từ sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản\"."],["D","Coi giải phóng dân tộc là mục tiêu duy nhất, không cần gắn với mục tiêu xã hội chủ nghĩa để tránh phức tạp hóa cách mạng."],["E","\"Từ đó tôi hoàn toàn tin theo Lênin, tin theo Quốc tế thứ ba\"."]],"a":"D","g":"Các lựa chọn A, B, C, E đều trực tiếp hoặc gián tiếp thể hiện sự gắn kết giữa con đường cách mạng vô sản, Chủ nghĩa Mác-Lênin, và mục tiêu xã hội cộng sản sau khi giành độc lập dân tộc. Cụ thể, C là phát biểu rõ ràng nhất về độc lập dân tộc gắn liền với chủ nghĩa xã hội. Lựa chọn D (\"Coi giải phóng dân tộc là mục tiêu duy nhất, không cần gắn với mục tiêu xã hội chủ nghĩa\") là hoàn toàn sai với tư tưởng Hồ Chí Minh, người luôn đặt độc lập dân tộc trong mối quan hệ biện chứng với chủ nghĩa xã hội."},{"id":"vn05-18","cd":"05","l":"SAI","q":"Lý do nào sau đây không được Hồ Chí Minh sử dụng để giải thích vì sao cách mạng tư sản không phải là con đường giải phóng dân tộc triệt để?","o":[["A","Cách mạng tư sản tước đoạt công nông ở trong nước."],["B","Cách mạng tư sản áp bức thuộc địa ở bên ngoài."],["C","Cách mạng tư sản chỉ mang lại tự do và bình đẳng giả dối."],["D","Cách mạng tư sản thường bị các thế lực phong kiến đàn áp mạnh mẽ."],["E","Cách mạng tư sản \"không đến nơi\", đòi hỏi phải có cách mạng khác tiếp theo."]],"a":"D","g":"Tài liệu môn học nêu rõ các lý do Hồ Chí Minh từ chối cách mạng tư sản: \"cách mạng không đến nơi, tiếng là cộng hòa và dân chủ, kỳ thực trong thì nó tước lục công nông, ngoài thì nó áp bức thuộc địa.\". Người cũng nói \"tự do và bình đẳng giả dối như đế quốc chủ nghĩa Pháp khoe khoang bên An Nam\". Lựa chọn D (\"Cách mạng tư sản thường bị các thế lực phong kiến đàn áp mạnh mẽ\") không được đề cập trong Tài liệu môn học như một lý do Hồ Chí Minh từ chối con đường này."},{"id":"vn05-19","cd":"05","l":"NH","q":"Những nhận định nào sau đây của Hồ Chí Minh thể hiện sự quán triệt và phát triển sáng tạo lý luận của chủ nghĩa Mác – Lênin về Đảng Cộng sản trong điều kiện Việt Nam?","o":[["A","Đảng Cộng sản là nhân tố chủ quan để giai cấp công nhân hoàn thành sứ mệnh lịch sử của mình."],["B","Đảng Cộng sản vừa là đội tiên phong của giai cấp công nhân vừa là đội tiên phong của nhân dân lao động."],["C","Đảng Cộng sản phải kiên quyết nhất, hăng hái nhất, trong sạch nhất, tận tâm tận lực phụng sự Tổ quốc."],["D","Đảng Cộng sản phải là Đảng của cả dân tộc Việt Nam."],["E","Đảng có vững cách mệnh mới thành công."]],"a":"BCD","g":"A là quan điểm chung của chủ nghĩa Mác – Lênin. B, C, D là những phát triển sáng tạo của Hồ Chí Minh về bản chất Đảng Cộng sản Việt Nam trong hoàn cảnh cụ thể. Tài liệu môn học nêu rõ \"Đảng Cộng sản vừa là đội tiên phong của giai cấp công nhân vừa là đội tiên phong của nhân dân lao động, kiên quyết nhất, hăng hái nhất, trong sạch nhất, tận tâm tận lực phụng sự Tổ quốc. Đó còn là Đảng của cả dân tộc Việt Nam.\". Tài liệu môn học khẳng định đây là \"một luận điểm quan trọng của Hồ Chí Minh có ý nghĩa bổ sung, phát triển lý luận mác xít về đảng cộng sản.\" E là nguyên tắc chung về vai trò của Đảng được Mác-Lênin và Hồ Chí Minh đều thừa nhận. Câu hỏi 20"},{"id":"vn05-20","cd":"05","l":"NH","q":"Những điểm nào sau đây thể hiện sự độc đáo, sáng tạo của Hồ Chí Minh trong tư tưởng về cách mạng giải phóng dân tộc so với quan điểm truyền thống của Quốc tế Cộng sản hoặc lý luận Mác-Lênin ở thời điểm đó?","o":[["A","Đặt giải phóng dân tộc là trước hết, trên hết, sau đó mới đến giải phóng giai cấp."],["B","Đặt nhiệm vụ chống đế quốc lên hàng đầu, còn chống phong kiến sẽ từng bước thực hiện."],["C","Khẳng định cách mạng thuộc địa có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc."],["D","Coi Đảng Cộng sản là đội tiên phong của cả dân tộc Việt Nam, không chỉ của giai cấp công nhân."],["E","Nhấn mạnh tầm quan trọng của bạo lực cách mạng trong việc giành và giữ chính quyền."]],"a":"ABCD","g":"A: \"Còn theo Hồ Chí Minh... phải là: giải phóng dân tộc - giải phóng xã hội - giải phóng giai cấp giải phóng con người.\". Khác với thứ tự của Mác và Ăngghen. B: \"Hồ Chí Minh không coi hai nhiệm vụ đó nhất loại phải thực hiện ngang nhau, mà đặt lên hàng đầu nhiệm vụ chống đế quốc, giải phóng dân tộc, còn nhiệm vụ chống phong kiến... thì sẽ từng bước thực hiện. Cho nên trong Chánh cương vắn tắt của Đảng, Người chỉ nêu “thâu hết ruộng đất của đế quốc chủ nghĩa làm cho công, chia cho dân cày nghèo”... Đây là nét độc đáo, sáng tạo của Hồ Chí Minh.\". C: \"Hồ Chí Minh cho rằng: cách mạng thuộc địa không những không phụ thuộc vào cách mạng vô sản ở chính quốc mà có thể giành thắng lợi trước. ... Luận"},{"id":"vn05-21","cd":"05","l":"NH","q":"Theo Hồ Chí Minh, những hình thức đấu tranh nào sau đây cần được \"sử dụng đúng và khéo kết hợp\" để giành thắng lợi cho cách mạng giải phóng dân tộc?","o":[["A","Đấu tranh chính trị của quần chúng."],["B","Đấu tranh vũ trang."],["C","Đấu tranh ngoại giao."],["D","Đấu tranh kinh tế."],["E","Đấu tranh văn hóa."]],"a":"AB","g":"Tài liệu môn học nêu rõ \"bạo lực cách mạng ở đây là bạo lực của quần chúng, được thực hiện với hai lực lượng chính trị và quân sự, hai hình thức đấu tranh: đấu tranh chính trị và đấu tranh vũ trang\". Tài liệu môn học khẳng định \"sử dụng đúng và khéo kết hợp các hình thức đấu tranh vũ trang và đấu tranh chính trị để giành thắng lợi cho cách mạng\". Các lựa chọn C, D, E không được đề cập trực tiếp trong ngữ cảnh bạo lực cách mạng trong đoạn văn này."},{"id":"vn05-22","cd":"05","l":"NH","q":"Những yếu tố nào sau đây thể hiện sự khác biệt cốt lõi giữa quan điểm của Hồ Chí Minh và quan điểm của Quốc tế Cộng sản về phong trào cách mạng ở các nước thuộc địa?","o":[["A","Hồ Chí Minh nhấn mạnh vai trò của cách mạng thuộc địa là \"đánh chết rắn đằng đuôi\" chủ nghĩa đế quốc."],["B","Quốc tế Cộng sản có lúc xem nhẹ vai trò của cách mạng thuộc địa, cho rằng nó phải phụ thuộc vào cách mạng vô sản ở chính quốc."],["C","Hồ Chí Minh khẳng định cách mạng thuộc địa có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc."],["D","Quốc tế Cộng sản cho rằng giải phóng các nước thuộc địa chỉ có thể thực hiện khi giai cấp vô sản giành thắng lợi ở chính quốc."],["E","Hồ Chí Minh cho rằng \"nọc độc và sức sống của con rắn độc tư bản chủ nghĩa đang tập trung ở các thuộc địa hơn là ở chính quốc\"."]],"a":"BCD","g":"A và E là những phát biểu của Hồ Chí Minh thể hiện sự nhìn nhận sâu sắc về vai trò của thuộc địa, nhưng không phải là điểm khác biệt về quan điểm so với Quốc tế Cộng sản mà là cách Người lý giải vai trò đó. B và D là quan điểm của Quốc tế Cộng sản mà Hồ Chí Minh đã vượt qua. Tài liệu môn học chỉ rõ \"Quốc tế Cộng sản có lúc xem nhẹ vai trò của cách mạng thuộc địa, cho rằng cách mạng thuộc địa phải phụ thuộc vào cách mạng vô sản ở chính quốc. Đại hội VI Quốc tế Cộng sản (năm 1928) đã thông qua Những luận cương... trong đó có đoạn viết: chỉ có thể thực hiện hoàn toàn công cuộc giải phóng các nước thuộc địa khi giai cấp vô sản giành được thắng lợi ở các nước tư bản tiên tiến.\". C là luận điểm sá"},{"id":"vn05-23","cd":"05","l":"NH","q":"Theo Hồ Chí Minh, lực lượng nào được xem là \"gốc cách mệnh\" và \"là người chủ cách mệnh\" trong cách mạng giải phóng dân tộc?","o":[["A","Giai cấp công nhân."],["B","Giai cấp nông dân."],["C","Tầng lớp trí thức."],["D","Giai cấp tiểu tư sản."],["E","Giai cấp tư sản dân tộc."]],"a":"AB","g":"Tài liệu môn học nêu rõ: \"Trong khi xác định lực lượng cách mạng là toàn dân, Hồ Chí Minh lưu ý rằng, không được quên “công nông là người chủ cách mệnh... là gốc cách mệnh”12. Trong tác phẩm Đường cách mệnh, Người giải thích: giai cấp công nhân và nông dân là hai giai cấp đông đảo và cách mạng nhất, bị bóc lột nặng nề nhất...\"."},{"id":"vn05-24","cd":"05","l":"NH","q":"Những yếu tố nào sau đây là đặc trưng của cách mạng vô sản theo Hồ Chí Minh, khác biệt với cách mạng tư sản?","o":[["A","Giải phóng dân chúng khỏi áp bức, bóc lột triệt để."],["B","Đem lại tự do, bình đẳng thật sự cho nhân dân."],["C","Vẫn duy trì việc tước đoạt công nông ở trong nước."],["D","Vẫn tiếp tục áp bức các thuộc địa ở bên ngoài."],["E","Dẫn đến xã hội cộng sản."]],"a":"ABE","g":"Tài liệu môn học khẳng định về Cách mạng Tháng Mười Nga: \"dân chúng được hưởng cái hạnh phúc tự do, bình đẳng thật, không phải tự do và bình đẳng giả dối như đế quốc chủ nghĩa Pháp khoe khoang bên An Nam\". Điều này cho thấy A và B là đặc trưng của cách mạng vô sản. Tài liệu môn học cũng nêu mục tiêu cuối cùng là \"đi tới xã hội cộng sản\", gắn với con đường cách mạng vô sản. Các lựa chọn C và D là đặc điểm của cách mạng tư sản, không phải cách mạng vô sản. ----------------------------------------------------------------------- E. Dạng Điền Khuyết Chọn Từ Danh Sách (6 câu) Câu hỏi 25"},{"id":"vn05-25","cd":"05","l":"DK","q":"Theo Hồ Chí Minh, \"Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường _______\".","o":[["A","cách mạng dân chủ"],["B","cách mạng tư sản"],["C","cách mạng vô sản"],["D","cách mạng giải phóng dân tộc"],["E","cách mạng ruộng đất"]],"a":"C","g":"Tài liệu môn học khẳng định: “Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường cách mạng vô sản\"."},{"id":"vn05-26","cd":"05","l":"DK","q":"Trong tư tưởng Hồ Chí Minh, \"Dân tộc cách mệnh thì _______, nghĩa là sĩ, nông, công, thương đều nhất trí chống lại cường quyền\".","o":[["A","cần phân biệt giai cấp"],["B","chưa phân giai cấp"],["C","đã thống nhất giai cấp"],["D","không liên quan đến giai cấp"],["E","chỉ dựa vào một giai cấp"]],"a":"B","g":"Tài liệu môn học ghi rõ: Người lý giải rằng, “dân tộc cách mệnh thì chưa phân giai cấp, nghĩa là sĩ, nông, công, thương đều nhất trí chống lại cường quyền”."},{"id":"vn05-27","cd":"05","l":"DK","q":"Hồ Chí Minh nhận định: \"Chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở _______\".","o":[["A","các nước xã hội chủ nghĩa"],["B","các nước láng giềng"],["C","các thuộc địa"],["D","các quốc gia độc lập"],["E","các nước phát triển"]],"a":"C","g":"Tài liệu môn học viết: “Chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở thuộc địa.”."},{"id":"vn05-28","cd":"05","l":"DK","q":"Theo V.I. Lênin, \"_______ không thể thực hiện được\" nếu không có sự đồng tình ủng hộ của đại đa số nhân dân lao động đối với đội tiên phong của mình.","o":[["A","cách mạng dân chủ"],["B","cách mạng tư sản"],["C","cách mạng công nghiệp"],["D","cách mạng vô sản"],["E","cách mạng khoa học kỹ thuật"]],"a":"D","g":"Tài liệu môn học trích lời Lênin: “Không có sự đồng tình ủng hộ của đại đa số nhân dân lao động đối với đội tiên phong của mình, tức đối với giai cấp vô sản, thì cách mạng vô sản không thể thực hiện được.”."},{"id":"vn05-29","cd":"05","l":"DK","q":"Hồ Chí Minh cho rằng, \"Trong cuộc đấu tranh gian khổ chống kẻ thù của giai cấp và dân tộc, cần dùng bạo lực cách mạng chống lại _______, giành lấy chính quyền và bảo vệ chính quyền\".","o":[["A","bạo lực chính quốc"],["B","bạo lực phong kiến"],["C","bạo lực đế quốc"],["D","bạo lực phản cách mạng"],["E","bạo lực thực dân"]],"a":"D","g":"Tài liệu môn học viết: “Trong cuộc đấu tranh gian khổ chống kẻ thù của giai cấp và dân tộc, cần dùng bạo lực cách mạng chống lại bạo lực phản cách mạng, giành lấy chính quyền và bảo vệ chính quyền”."},{"id":"vn05-30","cd":"05","l":"DK","q":"Hồ Chí Minh đã chỉ rõ: \"Tuỳ tình hình cụ thể mà quyết định những hình thức đấu tranh cách mạng thích hợp, sử dụng đúng và khéo kết hợp các hình thức _______ và đấu tranh chính trị để giành thắng lợi cho cách mạng\".","o":[["A","đối ngoại"],["B","kinh tế"],["C","vũ trang"],["D","văn hóa"],["E","tư tưởng"]],"a":"C","g":"Tài liệu môn học viết: “Tùy tình hình cụ thể mà quyết định những hình thức đấu tranh cách mạng thích hợp, sử dụng đúng và khéo kết hợp các hình thức đấu tranh vũ trang và đấu tranh chính trị để giành thắng lợi cho cách mạng”."},{"id":"vn06-1","cd":"06","l":"DS","q":"Theo tư tưởng Hồ Chí Minh, mục tiêu về kinh tế của chủ nghĩa xã hội ở Việt Nam nhấn mạnh sự phát triển công nghiệp và nông nghiệp hiện đại, khoa học kỹ thuật tiên tiến, đồng thời yêu cầu nền kinh tế phải hoàn toàn dựa trên chế độ sở hữu toàn dân để đảm bảo tính thuần nhất.","o":[],"a":"S","g":"Mặc dù Hồ Chí Minh xác định nền kinh tế phải phát triển cao với công nghiệp, nông nghiệp hiện đại, khoa học kỹ thuật tiên tiến, nhưng Người chỉ rõ đó là \"một nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu tập thể\". Như vậy, không phải chỉ hoàn toàn dựa trên sở hữu toàn dân mà còn có sở hữu tập thể (kinh tế hợp tác xã)."},{"id":"vn06-2","cd":"06","l":"DS","q":"Hồ Chí Minh khẳng định mối quan hệ giữa văn hóa với chính trị và kinh tế là mối quan hệ một chiều, trong đó chính trị và kinh tế quyết định hoàn toàn tính chất của văn hóa mà không có sự tác động ngược lại của văn hóa đối với chính trị và kinh tế.","o":[],"a":"S","g":"Hồ Chí Minh cho rằng mối quan hệ giữa văn hóa với chính trị và kinh tế là \"mối quan hệ biện chứng\". Chế độ chính trị và kinh tế quyết định tính chất của văn hóa, nhưng \"văn hóa góp phần thực hiện mục tiêu của chính trị và kinh tế\". Người còn khẳng định \"Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển dân chủ\", chứng tỏ có sự tác động ngược lại."},{"id":"vn06-3","cd":"06","l":"DS","q":"Trong tư tưởng Hồ Chí Minh về động lực xây dựng chủ nghĩa xã hội, Người xem xét các động lực một cách riêng lẻ, độc lập, không có mối quan hệ qua lại giữa chúng.","o":[],"a":"S","g":"Hồ Chí Minh cho rằng \"Tất cả các động lực đều rất quan trọng và có mối quan hệ biện chứng với nhau\". Đặc biệt, ba động lực hàng đầu là lợi ích của dân, dân chủ của dân, đoàn kết toàn dân \"gắn bó hữu cơ với nhau, là cơ sở, tiền đề của nhau, tạo nên những động lực mạnh mẽ nhất\". Điều này cho thấy sự gắn kết, không riêng lẻ."},{"id":"vn06-4","cd":"06","l":"DS","q":"Theo Hồ Chí Minh, lợi ích của dân và dân chủ của dân là hai động lực độc lập, có thể phát huy riêng rẽ trong tiến trình cách mạng xã hội chủ nghĩa.","o":[],"a":"S","g":"Với tư cách là những động lực thúc đẩy tiến trình cách mạng xã hội chủ nghĩa, \"lợi ích của dân và dân chủ của dân không thể tách rời nhau\". Chúng gắn bó hữu cơ với nhau."},{"id":"vn06-5","cd":"06","l":"DS","q":"Quan điểm \"xây\" đi đôi với \"chống\" trong tư tưởng Hồ Chí Minh chỉ áp dụng cho việc đối phó với kẻ địch bên ngoài, không liên quan đến việc ngăn chặn những lực cản bên trong.","o":[],"a":"S","g":"Hồ Chí Minh luôn nhắc nhở \"phải không ngừng nêu cao cảnh giác, phải chống cả kẻ địch bên ngoài tìm cách phá hoại thành quả của cách mạng và phải chống cả kẻ địch bên trong là chủ nghĩa cá nhân; chống Tư tưởng “làm quan cách mạng”\". Quan điểm \"xây\" đi đôi với \"chống\" là \"một trong những quan điểm xuyên suốt tư tưởng Hồ Chí Minh\" và bao hàm việc ngăn chặn, loại trừ những lực cản bên trong."},{"id":"vn06-6","cd":"06","l":"DS","q":"Trong mục tiêu xây dựng nền văn hóa xã hội chủ nghĩa, Hồ Chí Minh đặc biệt nhấn mạnh việc triệt để tẩy trừ mọi ảnh hưởng nô dịch của văn hóa đế quốc mà không cho phép hấp thụ bất kỳ yếu tố nào từ văn hóa tiến bộ thế giới.","o":[],"a":"S","g":"Hồ Chí Minh yêu cầu \"Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc. Đồng thời, phát triển những truyền thống tốt đẹp của văn hóa dân tộc và hấp thụ những cái mới của văn hóa tiến bộ thế giới, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng\". Điều này cho thấy Người chủ trương chọn lọc hấp thụ tinh hoa văn hóa tiến bộ thế giới chứ không phải phủ nhận hoàn toàn."},{"id":"vn06-7","cd":"06","l":"D1","q":"Luận điểm nào sau đây thể hiện rõ nhất mục tiêu về chế độ chính trị của chủ nghĩa xã hội ở Việt Nam theo tư tưởng Hồ Chí Minh?","o":[["A","Xây dựng một chế độ chỉ tập trung quyền lực vào Nhà nước để đảm bảo sự ổn định."],["B","Xây dựng chế độ dân chủ, nơi quyền hành và lực lượng đều ở nơi dân."],["C","Xây dựng chế độ chính trị dựa trên sự lãnh đạo tuyệt đối của một giai cấp duy nhất."],["D","Xây dựng một hệ thống chính trị ưu tiên phát triển kinh tế trước mọi mục tiêu khác."],["E","Xây dựng một chế độ chính trị mà trong đó nhân dân là chủ nhưng không có quyền lợi gắn liền với trách nhiệm."]],"a":"B","g":"Hồ Chí Minh khẳng định mục tiêu về chế độ chính trị là \"Phải xây dựng được chế độ dân chủ\". Người giải thích: “Chế độ ta là chế độ dân chủ. Tức là nhân dân làm chủ”, “Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ”. Người chỉ rõ: \"quyền hành và lực lượng đều ở nơi dân\". Các phương án khác đều không phản ánh đúng hoặc không đầy đủ tinh thần này."},{"id":"vn06-8","cd":"06","l":"D1","q":"Khi bàn về mối quan hệ giữa kinh tế và văn hóa trong xây dựng chủ nghĩa xã hội, Hồ Chí Minh có luận điểm mang tính suy luận nào sau đây?","o":[["A","Văn hóa phải luôn đi trước kinh tế để tạo tiền đề cho sự phát triển vật chất."],["B","Kinh tế phát triển là điều kiện tiên quyết để thúc đẩy văn hóa, phản ánh qua câu tục ngữ \"Có thực mới vực được đạo\"."],["C","Kinh tế và văn hóa là hai lĩnh vực hoàn toàn độc lập, không có mối quan hệ biện chứng."],["D","Văn hóa quyết định tính chất của kinh tế, trong khi kinh tế chỉ có vai trò thứ yếu."],["E","Việc phát triển văn hóa là không cần thiết trong giai đoạn đầu xây dựng kinh tế."]],"a":"B","g":"Hồ Chí Minh cho rằng mối quan hệ giữa văn hóa với chính trị và kinh tế là \"mối quan hệ biện chứng\". Người đã giải thích rõ thứ tự ưu tiên: \"Muốn tiến lên chủ nghĩa xã hội phải phát triển kinh tế và văn hóa. Vì sao không nói phát triển văn hóa và kinh tế? Tục ngữ ta có câu: Có thực mới vực được đạo; vì thế kinh tế phải đi trước\". Điều này khẳng định kinh tế là nền tảng."},{"id":"vn06-9","cd":"06","l":"D1","q":"Điểm khác biệt cơ bản về lợi ích giữa chủ nghĩa xã hội với những chế độ xã hội trước đó, theo Hồ Chí Minh, là gì?","o":[["A","Chủ nghĩa xã hội chỉ quan tâm đến lợi ích của cộng đồng, bỏ qua lợi ích cá nhân."],["B","Chủ nghĩa xã hội chỉ chú trọng đến lợi ích của một giai cấp cầm quyền duy nhất."],["C","Chủ nghĩa xã hội quan tâm đến lợi ích của cả cộng đồng và lợi ích của những con người cụ thể."],["D","Chủ nghĩa xã hội nhấn mạnh lợi ích kinh tế hơn lợi ích tinh thần cho cá nhân."],["E","Chủ nghĩa xã hội phủ nhận hoàn toàn khái niệm lợi ích cá nhân."]],"a":"C","g":"Hồ Chí Minh quan tâm đến \"lợi ích của cả cộng đồng người và lợi ích của những con người cụ thể\" vì Người cho rằng \"đây là một trong những điểm khác nhau cơ bản giữa chủ nghĩa xã hội với những chế độ xã hội trước nó\". Điều này cho thấy sự cân bằng giữa lợi ích tập thể và cá nhân."},{"id":"vn06-10","cd":"06","l":"D1","q":"Động lực nào được Hồ Chí Minh đánh giá là có vai trò quyết định trong hệ thống động lực thúc đẩy tiến trình cách mạng xã hội chủ nghĩa?","o":[["A","Ngoại lực và sự giúp đỡ từ các nước anh em."],["B","Sức mạnh của khoa học và giáo dục tiên tiến."],["C","Nội lực dân tộc, mà hạt nhân là nhân dân."],["D","Sự phát triển vượt trội của công nghiệp hiện đại."],["E","Vai trò lãnh đạo của Đảng Cộng sản là duy nhất và không phụ thuộc vào các yếu tố khác."]],"a":"C","g":"Trong tư tưởng của Người, \"Tất cả các động lực đều rất quan trọng và có mối quan hệ biện chứng với nhau nhưng giữ vai trò quyết định là nội lực dân tộc, là nhân dân\". Mặc dù Đảng lãnh đạo đóng vai trò quyết định trong hoạt động của tổ chức, nhưng đối với hệ thống động lực nói chung thì nội lực dân tộc, nhân dân là quyết định."},{"id":"vn06-11","cd":"06","l":"D1","q":"Theo Hồ Chí Minh, phẩm chất \"có ý thức làm chủ nhà nước\" của con người xã hội chủ nghĩa được hiểu như thế nào?","o":[["A","Quyền được tham gia trực tiếp vào mọi quyết định của Nhà nước mà không cần thông qua đại diện."],["B","Tinh thần trách nhiệm và nghĩa vụ của người dân đối với sự nghiệp xây dựng và bảo vệ đất nước."],["C","Khả năng tự quản lý mọi hoạt động kinh tế mà không cần sự can thiệp của Nhà nước."],["D","Quyền lực cá nhân được đặt cao hơn quyền lực của Nhà nước và tập thể."],["E","Chỉ đơn thuần là việc bầu cử và ứng cử định kỳ."]],"a":"B","g":"\"Ý thức làm chủ nhà nước\" là một trong những tư tưởng và tác phong mới mà mỗi người cần bồi dưỡng. Người đã khẳng định \"dân làm chủ\" không chỉ là quyền lợi mà còn là \"trách nhiệm của dân, sự nghiệp bảo vệ và xây dựng đất nước là công việc của dân\". Do đó, \"có ý thức làm chủ\" mang hàm ý về trách nhiệm và nghĩa vụ tham gia vào công cuộc chung, không chỉ là quyền lợi đơn thuần hay việc tham gia trực tiếp vào mọi quyết định."},{"id":"vn06-12","cd":"06","l":"D1","q":"Hồ Chí Minh nhấn mạnh rằng Nhà nước xã hội chủ nghĩa phải đảm bảo quyền tự do dân chủ cho công dân, nhưng đồng thời cũng nghiêm cấm điều gì?","o":[["A","Việc bày tỏ quan điểm cá nhân sai trái, bừa bãi."],["B","Lợi dụng các quyền tự do dân chủ để xâm phạm đến lợi ích của Nhà nước, của nhân dân."],["C","Việc tham gia vào các tổ chức chính trị - xã hội có hại cho quốc gia."],["D","Luôn phê bình đối với các cấp chính quyền bất kể đúng sai."],["E","Thực hiện quyền bầu cử và ứng cử nếu không đủ điều kiện công dân."]],"a":"B","g":"Mặc dù Nhà nước \"đảm bảo quyền tự do dân chủ cho công dân\", nhưng Người cũng chỉ rõ \"nghiêm cấm lợi dụng các quyền tự do dân chủ để xâm phạm đến lợi ích của Nhà nước, của nhân dân\"."},{"id":"vn06-13","cd":"06","l":"SAI","q":"Mục tiêu về kinh tế của chủ nghĩa xã hội ở Việt Nam theo tư tưởng Hồ Chí Minh bao gồm nhiều đặc điểm. Phương án nào sau đây KHÔNG phải là một đặc điểm của mục tiêu kinh tế đó?","o":[["A","Nền kinh tế phát triển cao với công nghiệp và nông nghiệp hiện đại."],["B","Khoa học và kỹ thuật tiên tiến."],["C","Nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu tập thể."],["D","Hoàn toàn tách rời mục tiêu về chính trị, hoạt động độc lập."],["E","Kinh tế quốc doanh lãnh đạo nền kinh tế quốc dân và được Nhà nước bảo đảm phát triển ưu tiên."]],"a":"D","g":"Mục tiêu kinh tế phải \"gắn bó mật thiết với mục tiêu về chính trị\". Người khẳng định: “Chế độ kinh tế và xã hội của chúng ta nhằm thực hiện đầy đủ quyền dân chủ của nhân dân, trên cơ sở kinh tế xã hội chủ nghĩa ngày càng phát triển\". Do đó, việc tách rời mục tiêu kinh tế khỏi chính trị là sai."},{"id":"vn06-14","cd":"06","l":"SAI","q":"Theo Hồ Chí Minh, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng, cần thực hiện nhiều nhiệm vụ. Nhiệm vụ nào sau đây KHÔNG phù hợp với tư tưởng của Người?","o":[["A","Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc."],["B","Phát triển những truyền thống tốt đẹp của văn hóa dân tộc."],["C","Hấp thụ những cái mới của văn hóa tiến bộ thế giới."],["D","Tạo ra một nền văn hóa hoàn toàn mới, không dựa trên bất kỳ nền tảng nào của quá khứ."],["E","Văn hóa phải xã hội chủ nghĩa về nội dung và dân tộc về hình thức."]],"a":"D","g":"Người rõ ràng chủ trương \"phát triển những truyền thống tốt đẹp của văn hóa dân tộc\", điều này mâu thuẫn với việc \"tạo ra một nền văn hóa hoàn toàn mới, không dựa trên bất kỳ nền tảng nào của quá khứ\"."},{"id":"vn06-15","cd":"06","l":"SAI","q":"Các quyền tự do dân chủ cơ bản của nhân dân được Nhà nước bảo đảm trong chủ nghĩa xã hội, theo tư tưởng Hồ Chí Minh, bao gồm nhiều khía cạnh. Khía cạnh nào sau đây KHÔNG được Người trực tiếp đề cập trong tài liệu?","o":[["A","Có quyền làm việc, nghỉ ngơi, học tập."],["B","Có quyền tự do thân thể, tự do ngôn luận, báo chí."],["C","Có quyền tự do hội họp, lập hội, biểu tình."],["D","Có quyền tự do tín ngưỡng, theo hoặc không theo một tôn giáo nào."],["E","Có quyền được hưởng phúc lợi xã hội tối thiểu không cần phải lao động."]],"a":"E","g":"Tài liệu chỉ rõ nhân dân \"có quyền làm việc; có quyền nghỉ ngơi; có quyền học tập; có quyền tự do thân thể; có quyền tự do ngôn luận, báo chí, hội họp, lập hội, biểu tình; có quyền tự do tín ngưỡng, theo hoặc không theo một tôn giáo nào; có quyền bầu cử, ứng cử\". Không có đề cập đến quyền được hưởng phúc lợi xã hội tối thiểu không cần lao động, mà nhấn mạnh quyền làm việc và trách nhiệm xây dựng đất nước."},{"id":"vn06-16","cd":"06","l":"SAI","q":"Để thúc đẩy tiến trình cách mạng xã hội chủ nghĩa, Hồ Chí Minh đã chỉ ra nhiều động lực quan trọng. Động lực nào sau đây KHÔNG được Người xếp vào nhóm những động lực hàng đầu của chủ nghĩa xã hội?","o":[["A","Lợi ích của dân."],["B","Dân chủ của dân."],["C","Sức mạnh đoàn kết toàn dân."],["D","Sự hỗ trợ kinh tế từ các nước bạn bè quốc tế."],["E","Cả A, B, C đều là động lực hàng đầu."]],"a":"D","g":"Hồ Chí Minh khẳng định \"để thúc đẩy tiến trình cách mạng xã hội chủ nghĩa phải bảo đảm lợi ích của dân, dân chủ của dân, sức mạnh đoàn kết toàn dân. Trong tư tưởng Hồ Chí Minh, đây là những động lực hàng đầu của chủ nghĩa xã hội\". Sự hỗ trợ kinh tế từ bên ngoài có thể thuộc \"ngoại lực\" nhưng không được Người xếp vào nhóm \"động lực hàng đầu\"."},{"id":"vn06-17","cd":"06","l":"SAI","q":"Theo tư tưởng Hồ Chí Minh, các tổ chức như Đảng Cộng sản, Nhà nước, và các tổ chức chính trị - xã hội trong hệ thống động lực của chủ nghĩa xã hội có những vai trò và đặc điểm nhất định. Đặc điểm nào sau đây KHÔNG đúng với tư tưởng của Người?","o":[["A","Đảng Cộng sản giữ vai trò quyết định trong sự lãnh đạo."],["B","Nhà nước thực hiện chức năng quản lý xã hội, biến đường lối của Đảng thành hiện thực."],["C","Các tổ chức chính trị - xã hội hoạt động hoàn toàn độc lập với sự lãnh đạo của Đảng và quản lý của Nhà nước."],["D","Các tổ chức chính trị - xã hội nhất quán về chính trị và tư tưởng dưới sự lãnh đạo của Đảng, quản lý của Nhà nước."],["E","Các tổ chức này hoạt động vì lợi ích của các thành viên nhưng phải thống nhất với lợi ích của dân tộc."]],"a":"C","g":"Các tổ chức chính trị - xã hội \"tuy có những nội dung và phương thức hoạt động khác nhau nhưng đều nhất quán về chính trị và tư tưởng dưới sự lãnh đạo của Đảng, quản lý của Nhà nước\". Do đó, việc hoạt động hoàn toàn độc lập là sai."},{"id":"vn06-18","cd":"06","l":"SAI","q":"Tư tưởng và tác phong xấu cần phải chống lại ở con người xã hội chủ nghĩa, theo Hồ Chí Minh, bao gồm nhiều biểu hiện. Biểu hiện nào sau đây KHÔNG được Người trực tiếp đề cập trong tài liệu?","o":[["A","Chủ nghĩa cá nhân."],["B","Quan liêu, mệnh lệnh."],["C","Tham ô, lãng phí."],["D","Bảo thủ, rụt rè."],["E","Tính sáng tạo cá nhân vượt quá khuôn khổ tập thể."]],"a":"E","g":"Hồ Chí Minh đã liệt kê các tư tưởng và tác phong xấu cần chống lại là: \"Chủ nghĩa cá nhân; quan liêu, mệnh lệnh; tham ô, lãng phí; bảo thủ, rụt rè\". Người không đề cập đến việc chống lại \"tính sáng tạo cá nhân vượt quá khuôn khổ tập thể\"; ngược lại, Người nhấn mạnh sự lao động sáng tạo của quần chúng."},{"id":"vn06-19","cd":"06","l":"NH","q":"Mục tiêu về chế độ chính trị của chủ nghĩa xã hội ở Việt Nam theo tư tưởng Hồ Chí Minh bao gồm những nội dung nào sau đây?","o":[["A","Xây dựng chế độ dân chủ."],["B","Khẳng định nhân dân làm chủ và là chủ."],["C","Tất cả quyền lợi đều vì dân, tất cả quyền hạn đều của dân."],["D","Các cấp chính quyền do dân cử ra, các tổ chức đoàn thể do dân tổ chức nên."],["E","Quyền hành và lực lượng đều ở nơi dân."]],"a":"ABCDE","g":"Tài liệu nêu rõ: \"Phải xây dựng được chế độ dân chủ\". \"Chế độ ta là chế độ dân chủ. Tức là nhân dân làm chủ”1, “Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ”. \"Tất cả lợi ích đều vì dân, tất cả quyền hạn đều của dân, công cuộc đổi mới là trách nhiệm của dân, sự nghiệp bảo vệ và xây dựng đất nước là công việc của dân, các cấp chính quyền do dân cử ra, các tổ chức đoàn thể do dân tổ chức nên. Nói tóm lại, quyền hành và lực lượng đều ở nơi dân\"."},{"id":"vn06-20","cd":"06","l":"NH","q":"Theo Hồ Chí Minh, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng, cần chú trọng đến những khía cạnh nào?","o":[["A","Phải xã hội chủ nghĩa về nội dung."],["B","Phải dân tộc về hình thức."],["C","Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc."],["D","Phát triển những truyền thống tốt đẹp của văn hóa dân tộc."],["E","Hấp thụ những cái mới của văn hóa tiến bộ thế giới."]],"a":"ABCDE","g":"Người nêu rõ: \"để phục vụ sự nghiệp cách mạng xã hội chủ nghĩa thì văn hóa phải xã hội chủ nghĩa về nội dung và dân tộc về hình thức”. \"Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc. Đồng thời, phát triển những truyền thống tốt đẹp của văn hóa dân tộc và hấp thụ những cái mới của văn hóa tiến bộ thế giới, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng\"."},{"id":"vn06-21","cd":"06","l":"NH","q":"Xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng, theo tư tưởng Hồ Chí Minh, có những đặc điểm về quan hệ xã hội nào?","o":[["A","Xã hội dân chủ, công bằng, văn minh."],["B","Tôn trọng con người."],["C","Chú ý xem xét những lợi ích cá nhân đúng đắn và bảo đảm cho nó được thỏa mãn."],["D","Mỗi người có điều kiện cải thiện đời sống riêng, phát huy tính cách riêng và sở trường riêng."],["E","Sự hài hòa với đời sống chung, lợi ích chung của tập thể."]],"a":"ABCDE","g":"\"Như vậy, xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng là xã hội dân chủ, công bằng, văn minh, tôn trọng con người, chú ý xem
