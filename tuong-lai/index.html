này thể hiện sự nhất quán trong tư tưởng Hồ Chí Minh về việc xây dựng một Nhà nước hợp hiến, hợp pháp với nền tảng pháp lý vững chắc ngay từ rất sớm."},{"id":"vn10-4","cd":"10","l":"DS","q":"Hồ Chí Minh cho rằng, việc giáo dục pháp luật cần tập trung chủ yếu vào thế hệ trẻ để xây dựng ý thức pháp quyền vững chắc cho tương lai.","o":[],"a":"S","g":"Tài liệu chỉ rõ \"công tác giáo dục pháp luật cho mọi người, đặc biệt cho thế hệ trẻ trở nên cực kỳ quan trọng\". Điều này có nghĩa là công tác giáo dục pháp luật phải được thực hiện cho tất cả mọi người, không chỉ riêng thế hệ trẻ, mặc dù Người nhấn mạnh tầm quan trọng đặc biệt của việc giáo dục cho thế hệ trẻ để xây dựng Nhà nước pháp quyền."},{"id":"vn10-5","cd":"10","l":"D1","q":"Theo tư tưởng Hồ Chí Minh, yếu tố nào được Người xem là quan trọng nhất trong việc Nhà nước quản lý bộ máy và điều hành xã hội?","o":[["A","Quản lý bằng bộ máy hành chính cồng kềnh."],["B","Quản lý bằng các biện pháp kinh tế và xã hội."],["C","Quản lý bằng Hiến pháp và pháp luật nói chung."],["D","Quản lý bằng các sắc lệnh ban hành khẩn cấp."],["E","Quản lý bằng sự ảnh hưởng và uy tín cá nhân của người lãnh đạo."]],"a":"C","g":"Tài liệu nêu rõ: \"Trong tư tưởng Hồ Chí Minh, Nhà nước quản lý bằng bộ máy và bằng nhiều biện pháp khác nhau, nhưng quan trọng nhất là quản lý bằng Hiến pháp và bằng pháp luật nói chung.\" Đây là nguyên tắc cốt lõi của Nhà nước pháp quyền."},{"id":"vn10-6","cd":"10","l":"D1","q":"Theo quan điểm \"Pháp quyền nhân nghĩa\" của Hồ Chí Minh, mục tiêu cao nhất mà sự nghiệp cách mạng của dân tộc Việt Nam hướng tới là gì?","o":[["A","Đấu tranh giành độc lập hoàn toàn và chủ quyền quốc gia."],["B","Xây dựng một Nhà nước có kỷ luật chặt chẽ và bộ máy hiệu quả."],["C","Giải phóng con người, làm cho mọi người có cuộc sống hạnh phúc, tự do, xứng với phẩm giá."],["D","Xóa bỏ mọi luật pháp hà khắc của chế độ cũ và thiết lập trật tự mới."],["E","Nâng cao dân trí và ý thức chấp hành pháp luật của toàn thể nhân dân."]],"a":"C","g":"Tài liệu khẳng định: \"mục tiêu giải phóng con người, làm cho mọi người có được cuộc sống hạnh phúc, tự do, xứng với phẩm giá con người, được hưởng dụng các quyền con người một cách đầy đủ nhất đã hòa quyện một cách hữu cơ và trở thành mục tiêu cao nhất của sự nghiệp cách mạng của dân tộc Việt Nam.\" Các phương án khác đều là những khía cạnh quan trọng nhưng không phải là mục tiêu tối thượng được nêu rõ."},{"id":"vn10-7","cd":"10","l":"D1","q":"Cuộc Tổng tuyển cử ngày 6-1-1946, một sự kiện lịch sử trọng đại, đã được tiến hành với các đặc điểm nào để đảm bảo tính dân chủ và thể hiện quyền lực tối cao của nhân dân?","o":[["A","Bỏ phiếu công khai, trực tiếp, có sự giám sát của quân Đồng minh."],["B","Phổ thông đầu phiếu, gián tiếp và bỏ phiếu công khai."],["C","Phổ thông đầu phiếu, trực tiếp và bỏ phiếu kín."],["D","Bỏ phiếu theo đại diện của các giai cấp và tôn giáo lớn."],["E","Bỏ phiếu theo sự chỉ định của Chính phủ lâm thời."]],"a":"C","g":"Tài liệu mô tả rõ: \"Cuộc Tổng tuyển cử được tiến hành thắng lợi ngày 6-1-1946 với chế độ phổ thông đầu phiếu, trực tiếp và bỏ phiếu kín.\" Đây là những đặc điểm cơ bản làm nên tính dân chủ, tiến bộ của cuộc bầu cử này, lần đầu tiên trong lịch sử Việt Nam và Đông Nam châu Á."},{"id":"vn10-8","cd":"10","l":"D1","q":"Theo Hồ Chí Minh, \"bệnh gốc\" mà từ đó sinh ra các bệnh tham ô, lãng phí trong bộ máy nhà nước là gì?","o":[["A","Chủ nghĩa cá nhân."],["B","Đặc quyền, đặc lợi."],["C","Quan liêu."],["D","Tư túng, chia rẽ, kiêu ngạo."],["E","Trình độ dân trí chưa cao của người dân."]],"a":"C","g":"Tài liệu chỉ rõ: \"Thế là bệnh quan liêu đã ấp ủ, dung túng, che chở cho nạn tham ô, lãng phí. Vì vậy, đây là bệnh gốc sinh ra các bệnh tham ô lãng phí; muốn trừ sạch bệnh tham ô, lãng phí thì trước hết phải tẩy sạch bệnh quan liêu.\" Điều này nhấn mạnh vai trò trung tâm của bệnh quan liêu trong việc tạo điều kiện cho các tiêu cực khác phát triển."},{"id":"vn10-9","cd":"10","l":"SAI","q":"Nhận định nào sau đây KHÔNG ĐÚNG với quan điểm của Hồ Chí Minh về tính nhân văn của pháp luật trong Nhà nước pháp quyền nhân nghĩa?","o":[["A","Pháp luật có tính khuyến thiện, lấy mục đích giáo dục, cảm hóa, thức tỉnh con người làm căn bản."],["B","Pháp luật phải ghi nhận đầy đủ và bảo vệ các quyền con người một cách triệt để."],["C","Pháp luật phải có tính nghiêm minh nhưng đồng thời khách quan và công bằng, chống đối xử dã man với con người."],["D","Pháp luật dựa trên nền tảng đạo đức của xã hội và các giá trị đạo đức phải thấm sâu vào mọi quy định."],["E","Pháp luật cho phép áp dụng hình phạt tàn sát đối với những kẻ phản bội Tổ quốc để răn đe."]],"a":"E","g":"Tài liệu nêu rõ rằng tính nhân văn của hệ thống luật pháp thể hiện ở việc \"tuyệt đối chống đối xử với con người một cách dã man.\" Thậm chí đối với những kẻ phản bội Tổ quốc, Hồ Chí Minh tuyên bố rõ: \"Chính phủ Việt Nam sẽ tha thứ hay trừng trị họ theo luật pháp tùy theo thái độ của họ hiện nay và về sau. Nhưng sẽ không có ai bị tàn sát\". Do đó, phương án E là sai hoàn toàn với tư tưởng Hồ Chí Minh."},{"id":"vn10-10","cd":"10","l":"SAI","q":"Trong các biện pháp phòng, chống tiêu cực trong bộ máy nhà nước theo tư tưởng Hồ Chí Minh, biện pháp nào sau đây KHÔNG được coi là giải pháp căn bản và có ý nghĩa lâu dài?","o":[["A","Nâng cao trình độ dân chủ trong xã hội và thực hành dân chủ rộng rãi."],["B","Phát huy quyền làm chủ của nhân dân một cách triệt để."],["C","Chỉ tập trung xử phạt thật nặng, nghiêm minh mọi hành vi tiêu cực mà không cần chú trọng giáo dục."],["D","Pháp luật của Nhà nước và kỷ luật của Đảng phải hết sức nghiêm minh."],["E","Giáo dục đạo đức, xây dựng hệ chuẩn mực đạo đức cho người cầm quyền và khơi dậy lương tâm."]],"a":"C","g":"Tài liệu khẳng định \"nâng cao trình độ dân chủ trong xã hội, thực hành dân chủ rộng rãi, phát huy quyền làm chủ của nhân dân là giải pháp căn bản và có ý nghĩa lâu dài.\" Tài liệu cũng chỉ rõ: \"phạt nghiêm minh, nghiêm khắc, đúng người đúng tội là cần thiết, song việc gì cũng xử phạt thì lại không đúng. Cần coi trọng giáo dục, lấy giáo dục, cảm hóa làm chủ yếu.\" Do đó, phương án C với sự nhấn mạnh chỉ xử phạt nặng mà không chú trọng giáo dục là không phù hợp với tư tưởng của Người."},{"id":"vn10-11","cd":"10","l":"SAI","q":"Điều nào sau đây KHÔNG phải là một biểu hiện của bệnh quan liêu theo nhận định của Hồ Chí Minh?","o":[["A","Cán bộ lãnh đạo không sát công việc thực tế, không theo dõi và giáo dục cán bộ cấp dưới."],["B","Cơ quan lãnh đạo trọng hình thức, không xem xét khắp mọi mặt, không đi sâu từng vấn đề."],["C","Chỉ biết khai hội, viết chỉ thị, xem báo cáo trên giấy mà không kiểm tra đến nơi đến chốn."],["D","Cố ý vơ vét tiền của công, lợi dụng chức quyền để làm lợi riêng cho cá nhân."],["E","Cán bộ không gần gũi quần chúng, không nắm bắt được tâm tư, nguyện vọng của dân."]],"a":"D","g":"Tài liệu mô tả các biểu hiện của bệnh quan liêu bao gồm các ý A, B, C, E. Phương án D \"Cố ý vơ vét tiền của công, lợi dụng chức quyền để làm lợi riêng cho cá nhân\" là biểu hiện của \"đặc quyền, đặc lợi\" hoặc \"tham ô\" được đề cập ở tài liệu, không phải là biểu hiện trực tiếp của bệnh quan liêu, mặc dù bệnh quan liêu có thể tạo điều kiện cho tham ô, lãng phí phát triển."},{"id":"vn10-12","cd":"10","l":"SAI","q":"Nội dung nào sau đây KHÔNG phản ánh đúng một trong những đóng góp của Hồ Chí Minh trong công tác lập pháp của Nhà nước Việt Nam Dân chủ Cộng hòa?","o":[["A","Hai lần tham gia lãnh đạo soạn thảo Hiến pháp (Hiến pháp năm 1946 và Hiến pháp năm 1959)."],["B","Ký lệnh công bố 16 đạo luật trong bối cảnh đất nước vừa kháng chiến vừa kiến quốc."],["C","Ký lệnh công bố 613 sắc lệnh, trong đó có 243 sắc lệnh quy định về tổ chức Nhà nước và pháp luật."],["D","Ban hành ngay Sắc lệnh ấn định mức án tử hình cho tội tham ô, trộm cắp chỉ vài ngày sau Tuyên ngôn độc lập (2-9-1945)."],["E","Chú trọng xây dựng hệ thống luật pháp dân chủ, hiện đại từ những ngày đầu lập nước."]],"a":"D","g":"Tài liệu xác nhận các hoạt động lập pháp của Hồ Chí Minh như A, B, C, E. Tuy nhiên, Sắc lệnh ấn định hình phạt tội đưa và nhận hối lộ được ký vào ngày 27/11/1946, và Lệnh nói rõ tội tham ô, trộm cắp đến mức cao nhất là tử hình được ký vào ngày 26/1/1946. Việc này diễn ra sau Tuyên ngôn Độc lập một khoảng thời gian đáng kể, không phải \"chỉ vài ngày sau\"."},{"id":"vn10-13","cd":"10","l":"NH","q":"Theo tư tưởng Hồ Chí Minh, những quyền nào sau đây được xem là thuộc phạm vi \"quyền con người\" mà Nhà nước pháp quyền nhân nghĩa cần tôn trọng và bảo đảm thực hiện một cách toàn diện?","o":[["A","Quyền tự nhiên của con người, bao gồm quyền sống."],["B","Các quyền chính trị - dân sự."],["C","Các quyền kinh tế, văn hóa, xã hội."],["D","Quyền của các nhóm người cụ thể như phụ nữ, trẻ em, người dân tộc thiểu số."],["E","Quyền được hưởng đặc lợi và miễn trừ trách nhiệm pháp lý khi phục vụ Nhà nước."]],"a":"ABCD","g":"Tài liệu nêu rõ Hồ Chí Minh tiếp cận quyền con người một cách toàn diện, bao gồm \"các quyền tự nhiên của con người, trong đó quyền cao nhất là quyền sống cũng như các quyền chính trị - dân sự, quyền kinh tế, văn hóa, xã hội con người. Người chú trọng quyền của công dân nói chung, đồng thời cũng chú trọng đến quyền của những nhóm người cụ thể như phụ nữ, trẻ em, người dân tộc thiểu số\". Phương án E là trái ngược với tinh thần pháp quyền và phòng chống tiêu cực."},{"id":"vn10-14","cd":"10","l":"NH","q":"Để phòng ngừa và khắc phục tiêu cực trong bộ máy nhà nước, Hồ Chí Minh đã đề xuất những biện pháp cơ bản nào sau đây mang tính chiến lược và lâu dài?","o":[["A","Nâng cao trình độ dân chủ trong xã hội và thực hành dân chủ rộng rãi."],["B","Đảm bảo pháp luật của Nhà nước và kỷ luật của Đảng phải hết sức nghiêm minh, không có vùng cấm."],["C","Coi trọng việc giáo dục, cảm hóa, thức tỉnh con người làm chủ yếu bên cạnh xử phạt nghiêm minh."],["D","Cán bộ, đặc biệt là người giữ chức vụ càng cao, càng phải đi trước làm gương về tu dưỡng đạo đức."],["E","Chỉ dựa vào sức mạnh của bộ máy kiểm tra, giám sát nội bộ của Đảng và Nhà nước."]],"a":"ABCD","g":"Các tài liệu liệt kê các biện pháp: \"nâng cao trình độ dân chủ trong xã hội, thực hành dân chủ rộng rãi, phát huy quyền làm chủ của nhân dân là giải pháp căn bản và có ý nghĩa lâu dài\"; \"pháp luật của Nhà nước, kỷ luật của Đảng phải nghiêm minh\", \"thẳng tay trừng trị\", \"không có bất cứ vùng cấm nào\"; \"Cần coi trọng giáo dục, lấy giáo dục, cảm hóa làm chủ yếu\"; và \"cán bộ phải đi trước làm gương, cán bộ giữ chức vụ càng cao, trách nhiệm nêu gương càng lớn\". Phương án E là chưa đủ, vì tài liệu cũng nhấn mạnh vai trò kiểm soát của nhân dân."},{"id":"vn10-15","cd":"10","l":"NH","q":"Trong tư tưởng Hồ Chí Minh về kiểm soát quyền lực nhà nước, những chủ thể nào sau đây được xác định có vai trò và trách nhiệm trong việc kiểm soát quyền lực nhà nước?","o":[["A","Đảng Cộng sản Việt Nam, với tư cách là Đảng cầm quyền."],["B","Nhân dân, với tư cách là chủ thể tối cao của quyền lực."],["C","Nghị viện nhân dân, với quyền \"Kiểm soát và phê bình Chính phủ\" theo Hiến pháp 1946."],["D","Các cơ quan hành pháp của Nhà nước để tự kiểm soát lẫn nhau."],["E","Các tổ chức quốc tế và ngoại giao."]],"a":"ABC","g":"Tài liệu nêu rõ vai trò kiểm soát của Đảng Cộng sản Việt Nam. Tài liệu khẳng định nhân dân là chủ thể tối cao của quyền lực nhà nước và có quyền kiểm soát. Tài liệu cũng đề cập đến kiểm soát của Nghị viện nhân dân đối với Chính phủ, như quyền \"Kiểm soát và phê bình Chính phủ\". Các cơ quan hành pháp chủ yếu là đối tượng của kiểm soát quyền lực hơn là chủ thể kiểm soát quyền lực tổng thể, và các tổ chức quốc tế không được đề cập trong tài liệu."},{"id":"vn10-16","cd":"10","l":"NH","q":"Theo Hồ Chí Minh, những nguyên nhân khách quan nào sau đây có thể dẫn đến sự nảy sinh và phát triển của các tiêu cực trong bộ máy nhà nước?","o":[["A","Sự thiếu tu dưỡng, rèn luyện đạo đức của bản thân cán bộ."],["B","Công tác cán bộ của Đảng và Nhà nước chưa được thực hiện tốt."],["C","Tàn dư của những chính sách phản động từ chế độ thực dân, phong kiến còn tồn tại."],["D","Âm mưu chống phá và các hoạt động phá hoại của các thế lực thù địch."],["E","Cách tổ chức, vận hành trong Đảng và Nhà nước chưa thực sự khoa học và hiệu quả."]],"a":"BCDE","g":"Tài liệu liệt kê các nguyên nhân khách quan bao gồm \"công tác cán bộ của Đảng và Nhà nước chưa tốt; do cách tổ chức, vận hành trong Đảng, trong Nhà nước, sự phối hợp giữa Đảng với Nhà nước chưa thật sự khoa học, hiệu quả; do trình độ phát triển còn thấp của đời sống xã hội; do tàn dư của những chính sách phản động của chế độ thực dân, phong kiến; do âm mưu chống phá của các lực lượng phản động\". Phương án A \"Sự thiếu tu dưỡng, rèn luyện của bản thân cán bộ\" được xác định là nguyên nhân chủ quan, bắt tài liệu từ \"bệnh mẹ\" chủ nghĩa cá nhân."},{"id":"vn10-17","cd":"10","l":"DK","q":"Hồ Chí Minh luôn nêu cao tính nghiêm minh của pháp luật. Người tuyên bố: “Pháp luật Việt Nam tuy khoan hồng với những người biết cải tà quy chính, nhưng sẽ thẳng tay trừng trị những tên Việt gian đầu sỏ đã ______.”","o":[["A","lạm quyền gây mất đoàn kết"],["B","bán nước buôn dân"],["C","tham ô lãng phí nghiêm trọng"],["D","cậy thế cậy quyền hách dịch"],["E","kiêu ngạo, quan cách mạng"]],"a":"B","g":"Tài liệu trích lời Hồ Chí Minh: \"Pháp luật Việt Nam tuy khoan hồng với những người biết cải tà quy chính, nhưng sẽ thẳng tay trừng trị những tên Việt gian đầu sỏ đã bán nước buôn dân\"."},{"id":"vn10-18","cd":"10","l":"DK","q":"Để đảm bảo tất cả mọi quyền lực thuộc về nhân dân, Hồ Chí Minh chỉ rõ: “dân ghét các ông chủ tịch, các ông ủy viên vì cái tật ngông nghênh, cậy thế, cậy quyền. Những ông này không hiểu nhiệm vụ và chính sách của Việt Minh, nên khi nắm được chút quyền trong tay vẫn hay ______.”","o":[["A","vi phạm kỷ luật của Đảng"],["B","làm việc kém hiệu quả"],["C","lãng phí công quỹ"],["D","lạm dụng"],["E","tư túng bè phái"]],"a":"D","g":"Tài liệu trích lời Hồ Chí Minh: \"dân ghét các ông chủ tịch, các ông ủy viên vì cái tật ngông nghênh, cậy thế, cậy quyền. Những ông này không hiểu nhiệm vụ và chính sách của Việt Minh, nên khi nắm được chút quyền trong tay vẫn hay lạm dụng\"."},{"id":"vn10-19","cd":"10","l":"DK","q":"Hồ Chí Minh khẳng định, Nhà nước là công bộc của dân, “mọi công tác phải dựa hẳn vào quần chúng, hoan nghênh quần chúng _______.”","o":[["A","góp ý xây dựng chính sách"],["B","làm chủ các cấp chính quyền"],["C","đôn đốc và kiểm tra"],["D","phê bình và biểu quyết"],["E","tham gia vào quản lý nhà nước"]],"a":"C","g":"Tài liệu trích lời Hồ Chí Minh: \"mọi công tác phải dựa hẳn vào quần chúng, hoan nghênh quần chúng đôn đốc và kiểm tra\"."},{"id":"vn10-20","cd":"10","l":"DK","q":"Theo Hồ Chí Minh, cán bộ các cơ quan, các đoàn thể, cấp cao thì quyền to, cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu ______ là có dịp đục khoét, có dịp ăn của đút, có dịp “dĩ công vi tư’’ (lấy của công làm của tư).","o":[["A","kinh nghiệm công tác"],["B","trình độ chuyên môn"],["C","lương tâm"],["D","sự giám sát chặt chẽ"],["E","lòng trung thành tuyệt đối"]],"a":"C","g":"Tài liệu trích lời Hồ Chí Minh: \"cán bộ các cơ quan, các oàn thế, cấp cao thì quyền to, cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu lương tâm là có dịp đục khoét, có dịp ăn của đút, có dịp “dĩ công vi tư’’\"."},{"id":"vn10-21","cd":"10","l":"DS","q":"Theo Tài liệu môn học, Hồ Chí Minh xác định lãng phí chỉ là lãng phí tiền của do nhân dân đóng góp cho hoạt động của bộ máy nhà nước.","o":[],"a":"S","g":"Tài liệu môn học ghi: “Lãng phí ở đây được Hồ Chí Minh xác định là lãng phí sức lao động, lãng phí thời gian, lãng phí tiền của.” Lãng phí bao gồm cả sức lao động và thời gian chứ không chỉ tiền của, nên nhận định trên là sai."},{"id":"vn10-22","cd":"10","l":"DS","q":"Hồ Chí Minh coi tham ô, lãng phí, quan liêu là “giặc nội xâm”, “giặc ở trong lòng”, thứ giặc nguy hiểm hơn giặc ngoại xâm.","o":[],"a":"D","g":"Tài liệu môn học ghi: “Hồ Chí Minh coi tham ô, lãng phí, quan liêu là ‘giặc nội xâm’, ‘giặc ở trong lòng’, thứ giặc nguy hiểm hơn giặc ngoại xâm.” Nhận định trên đúng với Tài liệu môn học."},{"id":"vn10-23","cd":"10","l":"D1","q":"Theo Tài liệu môn học, Hồ Chí Minh nêu rõ hai cách kiểm soát nào?","o":[["A","Từ trên xuống và từ dưới lên."],["B","Kiểm soát định kỳ và kiểm soát đột xuất."],["C","Kiểm soát trong Đảng và kiểm soát ngoài Đảng."],["D","Kiểm soát bằng văn bản và kiểm soát tại chỗ."],["E","Kiểm soát nội bộ và kiểm soát của các tổ chức quốc tế."]],"a":"A","g":"Tài liệu môn học ghi: “Người còn nêu rõ hai cách kiểm soát là từ trên xuống và từ dưới lên. Người nhấn mạnh, phải ‘khéo kiểm soát’.” Các phương án còn lại không được Tài liệu môn học nêu là hai cách kiểm soát."},{"id":"vn10-24","cd":"10","l":"D1","q":"Theo Tài liệu môn học, Sắc lệnh do Hồ Chí Minh ký ngày 27/11/1946 ấn định hình phạt đối với tội đưa và nhận hối lộ như thế nào?","o":[["A","Tử hình và tịch thu toàn bộ tài sản."],["B","Từ 1 năm đến 5 năm tù và hoàn trả số tiền nhận hối lộ."],["C","Cải tạo không giam giữ và bồi thường thiệt hại cho Nhà nước."],["D","Từ 10 năm đến 30 năm tù và nộp phạt gấp ba số tiền nhận hối lộ."],["E","Từ 5 năm đến 20 năm tù khổ sai và phải nộp phạt gấp đôi số tiền nhận hối lộ."]],"a":"E","g":"Tài liệu môn học ghi: “Ngày 27/11/1946, Hồ Chí Minh đã ký Sắc lệnh ấn định hình phạt tội đưa và nhận hối lộ với mức từ 5 năm đến 20 năm tù khổ sai và phải nộp phạt gấp đôi số tiền nhận hối lộ.” Mức cao nhất là tử hình thuộc lệnh ngày 26/1/1946 về tội tham ô, trộm cắp, không phải Sắc lệnh về tội hối lộ."},{"id":"vn10-25","cd":"10","l":"SAI","q":"Nhận định nào sau đây KHÔNG ĐÚNG với Tài liệu môn học về quá trình xây dựng Nhà nước hợp hiến, hợp pháp dưới sự lãnh đạo của Hồ Chí Minh?","o":[["A","Ngày 3/9/1945, trong phiên họp đầu tiên của Chính phủ lâm thời, Hồ Chí Minh đề nghị tổ chức càng sớm càng hay cuộc Tổng tuyển cử với chế độ phổ thông đầu phiếu."],["B","Tại phiên họp đầu tiên của Quốc hội khóa I (ngày 2/3/1946), Hồ Chí Minh được bầu làm Chủ tịch Quốc hội."],["C","Việc lập nên Quốc hội, Chính phủ và các cơ quan, bộ máy hợp hiến giúp nước ta có cơ sở pháp lý vững chắc để làm việc với quân Đồng minh và có quan hệ quốc tế bình đẳng."],["D","Trong cuộc Tổng tuyển cử, mọi người dân từ 18 tuổi trở lên, không phân biệt nam nữ, giàu nghèo, dân tộc, đảng phái, tôn giáo đều có quyền bỏ phiếu."],["E","Chính phủ liên hiệp đầu tiên có đầy đủ tư cách pháp lý để giải quyết một cách có hiệu quả những vấn đề đối nội và đối ngoại."]],"a":"B","g":"Tài liệu môn học ghi: “Ngày 2/3/1946, Quốc hội khóa I nước Việt Nam Dân chủ Cộng hòa đã họp phiên đầu tiên, lập ra các tổ chức, bộ máy và các chức vụ chính thức của Nhà nước. Hồ Chí Minh được bầu làm Chủ tịch Chính phủ liên hiệp đầu tiên.” Hồ Chí Minh được bầu làm Chủ tịch Chính phủ liên hiệp, không phải Chủ tịch Quốc hội, nên phương án B không đúng."},{"id":"vn10-26","cd":"10","l":"SAI","q":"Nhận định nào sau đây KHÔNG ĐÚNG với quan điểm của Hồ Chí Minh về kiểm soát quyền lực nhà nước được trình bày trong Tài liệu môn học?","o":[["A","Chỉ cán bộ giữ chức vụ cao mới có thể lạm quyền, vì vậy chỉ cần kiểm soát quyền lực ở cấp cao."],["B","Kiểm soát quyền lực nhà nước là tất yếu."],["C","Quyền lực mà cơ quan nhà nước, cán bộ nhà nước nắm giữ là do nhân dân ủy thác cho."],["D","Đảng cầm quyền cần chú ý phát huy vai trò kiểm soát quyền lực của nhân dân, bởi so với số nhân dân thì số đảng viên chỉ là tối thiểu."],["E","Hiến pháp năm 1946 quy định: “Bộ trưởng nào không được Nghị viện tín nhiệm thì phải từ chức”."]],"a":"A","g":"Tài liệu môn học ghi: “Các cơ quan nhà nước, cán bộ nhà nước, dù ít hay nhiều đều nắm giữ quyền lực trong tay. Quyền lực này là do nhân dân ủy thác cho. Tuy nhiên, một khi đã nắm giữ quyền lực, cơ quan nhà nước hay cán bộ nhà nước đều có thể trở nên lạm quyền.” Vì vậy, không thể chỉ kiểm soát cán bộ cấp cao; phương án A không đúng."},{"id":"vn10-27","cd":"10","l":"NH","q":"Theo Tài liệu môn học, tính nghiêm minh của pháp luật mà Hồ Chí Minh luôn nêu cao đòi hỏi những điều nào sau đây?","o":[["A","Pháp luật phải đúng và phải đủ."],["B","Thưởng thật rộng rãi, còn phạt thì nhẹ nhàng để giữ hòa khí."],["C","Tăng cường tuyên truyền, giáo dục pháp luật cho mọi người dân."],["D","Thay chế độ ra các đạo luật bằng chế độ ra các sắc lệnh."],["E","Người thực thi pháp luật phải thật sự công tâm và nghiêm minh."]],"a":"ACE","g":"Tài liệu môn học ghi: “Điều đó đòi hỏi pháp luật phải đúng và phải đủ; tăng cường tuyên truyền, giáo dục pháp luật cho mọi người dân; người thực thi pháp luật phải thật sự công tâm và nghiêm minh”. Phương án B trái với lời Hồ Chí Minh phê phán “thưởng có khi quá rộng, mà phạt thì không nghiêm”; phương án D đảo ngược yêu cầu “Thay chế độ ra các sắc lệnh bằng chế độ ra các đạo luật” trong bản Yêu sách năm 1919."},{"id":"vn10-28","cd":"10","l":"NH","q":"Theo Tài liệu môn học, trong quá trình lãnh đạo xây dựng Nhà nước Việt Nam, Hồ Chí Minh thường nói đến những tiêu cực nào sau đây để nhắc nhở mọi người đề phòng và khắc phục?","o":[["A","Thực hành dân chủ rộng rãi trong xã hội."],["B","Đặc quyền, đặc lợi."],["C","Khuyến khích nhân dân phê bình, giám sát công việc của Nhà nước."],["D","Tham ô, lãng phí, quan liêu."],["E","Tư túng, chia rẽ, kiêu ngạo."]],"a":"BDE","g":"Tài liệu môn học ghi: “Một là, đặc quyền, đặc lợi.”, “Hai là, tham ô, lãng phí, quan liêu.” và “‘Tư túng’, ‘chia rẽ’, ‘kiêu ngạo’ là những căn bệnh gây mất đoàn kết, gây rối cho công tác.” Phương án A và C là những việc Hồ Chí Minh khuyến khích, là biện pháp chứ không phải tiêu cực."},{"id":"vn10-29","cd":"10","l":"DK","q":"Trong thư gửi Hội nghị Tư pháp toàn quốc, Hồ Chí Minh viết: “Các bạn là những người phụ trách thi hành pháp luật. Lẽ tất nhiên các bạn cần phải nêu cao cái gương _______ cho nhân dân noi theo”.","o":[["A","cần, kiệm, liêm, chính"],["B","trung với nước, hiếu với dân"],["C","dám nói, dám làm"],["D","nói đi đôi với làm"],["E","phụng công, thủ pháp, chí công vô tư"]],"a":"E","g":"Tài liệu môn học ghi: “Các bạn là những người phụ trách thi hành pháp luật. Lẽ tất nhiên các bạn cần phải nêu cao cái gương ‘phụng công, thủ pháp, chí công vô tư’ cho nhân dân noi theo”."},{"id":"vn10-30","cd":"10","l":"DK","q":"Theo Tài liệu môn học, một trong những biện pháp cơ bản phòng, chống tiêu cực trong Nhà nước theo tư tưởng Hồ Chí Minh là phải huy động sức mạnh của _______ vào cuộc chiến chống lại tiêu cực trong con người, trong xã hội và trong bộ máy nhà nước.","o":[["A","chủ nghĩa yêu nước"],["B","các lực lượng vũ trang"],["C","dư luận quốc tế"],["D","chủ nghĩa quốc tế vô sản"],["E","hệ thống thanh tra chuyên trách"]],"a":"A","g":"Tài liệu môn học ghi: “Năm là, phải huy động sức mạnh của chủ nghĩa yêu nước vào cuộc chiến chống lại tiêu cực trong con người, trong xã hội và trong bộ máy nhà nước.”"},{"id":"vn11-1","cd":"11","l":"DS","q":"Chính sách và phương pháp tập hợp đại đoàn kết luôn phải được giữ nguyên không thay đổi trong mọi giai đoạn cách mạng để đảm bảo tính nhất quán của chiến lược đại đoàn kết toàn dân tộc.","o":[],"a":"S","g":"Tài liệu chỉ rõ: \"Trong mỗi giai đoạn cách mạng, trước những yêu cầu và nhiệm vụ khác nhau, chính sách và phương pháp tập hợp đại đoàn kết có thể và cần thiết phải điều chỉnh cho phù hợp với từng đối tượng khác nhau song không bao giờ được thay đổi chủ trương đại đoàn kết toàn dân tộc\". Điều này khẳng định chính sách và phương pháp có thể điều chỉnh, trái ngược với nhận định trong câu hỏi."},{"id":"vn11-2","cd":"11","l":"DS","q":"Khái niệm \"Nhân dân\" trong tư tưởng Hồ Chí Minh chỉ đề cập đến tập hợp đông đảo quần chúng nhân dân mà không bao gồm những con người Việt Nam cụ thể.","o":[],"a":"S","g":"Tài liệu ghi rõ: \"“Nhân dân” trong tư tưởng Hồ Chí Minh được hiểu với nghĩa vừa là con người Việt Nam cụ thể, vừa là một tập hợp đông đảo quần chúng nhân dân, cả hai đều là chủ thể của khối đại đoàn kết toàn dân tộc\"."},{"id":"vn11-3","cd":"11","l":"DS","q":"Theo Hồ Chí Minh, nền tảng của khối đại đoàn kết toàn dân tộc chỉ bao gồm công nhân và nông dân, bởi đây là lực lượng đại đa số và là gốc rễ của cách mạng.","o":[],"a":"S","g":"Tài liệu chỉ rõ: \"lực lượng làm nền tảng cho khối đại đoàn kết dân tộc theo quan điểm của Hồ Chí Minh là công nhân, nông dân và trí thức.\""},{"id":"vn11-4","cd":"11","l":"DS","q":"Việc xác định đại đoàn kết toàn dân tộc là nhiệm vụ hàng đầu của Đảng chỉ cần quán triệt trong các đường lối, chủ trương chiến lược mà không nhất thiết phải trong hoạt động thực tiễn của Đảng.","o":[],"a":"S","g":"Tài liệu khẳng định: \"Đại đoàn kết toàn dân tộc phải được xác định là nhiệm vụ hàng đầu của Đảng và nhiệm vụ này phải được quán triệt trong tất cả mọi lĩnh vực, từ đường lối, chủ trương, chính sách, tới hoạt động thực tiễn của Đảng.\""},{"id":"vn11-5","cd":"11","l":"DS","q":"Các luận điểm của Hồ Chí Minh như \"Đoàn kết là sức mạnh của chúng ta\" chủ yếu nhằm kêu gọi tinh thần đoàn kết mà không mang tính chân lý khái quát từ thực tiễn.","o":[],"a":"S","g":"Tài liệu nêu: \"Từ thực tiễn xây dựng khối đại đoàn kết toàn dân tộc, Hồ Chí Minh đã khái quát thành nhiều luận điểm mang tính chân lý về vai trò và sức mạnh của khối đại đoàn kết toàn dân tộc\"."},{"id":"vn11-6","cd":"11","l":"DS","q":"Sự đoàn kết và thống nhất trong Đảng là yếu tố quan trọng nhưng không phải là điều kiện tiên quyết cho sự đoàn kết ngoài xã hội.","o":[],"a":"S","g":"Tài liệu nhấn mạnh: \"Trong khối đại đoàn kết toàn dân tộc, phải đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong Đảng vì đó là điều kiện cho sự đoàn kết ngoài xã hội.\""},{"id":"vn11-7","cd":"11","l":"D1","q":"Điểm nào sau đây thể hiện rõ nhất tính linh hoạt nhưng kiên định trong chiến lược đại đoàn kết toàn dân tộc của Hồ Chí Minh?","o":[["A","Chính sách và phương pháp tập hợp luôn giữ nguyên để đảm bảo tính nhất quán."],["B","Chủ trương đại đoàn kết có thể điều chỉnh theo từng đối tượng và giai đoạn."],["C","Chỉ điều chỉnh chính sách và phương pháp khi có sự thay đổi lớn về mục tiêu cách mạng."],["D","Chính sách và phương pháp có thể điều chỉnh phù hợp với từng đối tượng và giai đoạn, nhưng chủ trương đại đoàn kết không thay đổi."],["E","Tính linh hoạt không phải là đặc điểm cốt lõi của chiến lược đại đoàn kết."]],"a":"D","g":"Tài liệu chỉ rõ: \"Trong mỗi giai đoạn cách mạng, trước những yêu cầu và nhiệm vụ khác nhau, chính sách và phương pháp tập hợp đại đoàn kết có thể và cần thiết phải điều chỉnh cho phù hợp với từng đối tượng khác nhau song không bao giờ được thay đổi chủ trương đại đoàn kết toàn dân tộc\"."},{"id":"vn11-8","cd":"11","l":"D1","q":"Luận điểm nào sau đây được Hồ Chí Minh đúc kết mang tính chân lý về vai trò của đại đoàn kết toàn dân tộc, được coi là kết luận tối cao của Người?","o":[["A","\"Đoàn kết là khởi đầu của mọi thành công\"."],["B","\"Đoàn kết. đoàn kết, đại đoàn kết Thành công, thành công, đại thành công\"."],["C","\"Đoàn kết là cơ sở để phát triển\"."],["D","\"Đoàn kết là nền tảng của tự do\"."],["E","\"Đoàn kết là con đường duy nhất dẫn đến thắng lợi\"."]],"a":"B","g":"Tài liệu kết luận: “Đoàn kết. đoàn kết, đại đoàn kết Thành công, thành công, đại thành công”7. Các phương án khác không phải là nguyên văn hoặc đúc kết trực tiếp từ tài liệu."},{"id":"vn11-9","cd":"11","l":"D1","q":"Từ \"ta\" trong câu nói của Hồ Chí Minh: \"ai có tài, có đức, có sức, có lòng phụng sự Tổ quốc và phục vụ nhân dân thì ta đoàn kết với họ\" được hiểu theo nghĩa rộng nhất là:","o":[["A","Chỉ Đảng Cộng sản Việt Nam."],["B","Chỉ các tầng lớp lao động."],["C","Chỉ những người Việt Nam ở trong nước."],["D","Đảng Cộng sản Việt Nam nói riêng và mọi người dân Việt Nam nói chung."],["E","Chỉ những người có vai trò lãnh đạo."]],"a":"D","g":"Tài liệu giải thích: \"Từ “ta” ở đây là chủ thể, vừa là Đảng Cộng sản Việt Nam nói riêng, vừa là mọi người dân Việt Nam nói chung.\""},{"id":"vn11-10","cd":"11","l":"D1","q":"Nhiệm vụ cốt lõi của Đảng Cộng sản Việt Nam trong việc xây dựng khối đại đoàn kết toàn dân tộc, xuất phát từ yêu cầu khách quan của quần chúng, là gì?","o":[["A","Đơn thuần ban hành các chủ trương, chính sách đoàn kết."],["B","Đợi chờ quần chúng tự giác tập hợp thành khối thống nhất."],["C","Thức tỉnh, tập hợp, hướng dẫn quần chúng, chuyển những đòi hỏi tự giác thành hiện thực có tổ chức."],["D","Tách rời các nhu cầu cá nhân của quần chúng khỏi mục tiêu chung của cách mạng."],["E","Chỉ tập trung vào việc củng cố sự đoàn kết nội bộ Đảng."]],"a":"C","g":"Tài liệu chỉ rõ: \"Đảng Cộng sản phải có sứ mệnh thức tỉnh, tập hợp, hướng dẫn quần chúng, chuyển những nhu cầu, những đòi hỏi tự giác, thành hiện thực có tổ chức trong khối đại đoàn kết, tạo thành sức mạnh tổng hợp trong cuộc đấu tranh\"."},{"id":"vn11-11","cd":"11","l":"D1","q":"Bài học lịch sử nào được Hồ Chí Minh rút ra để khẳng định vai trò sống còn của đại đoàn kết toàn dân tộc đối với độc lập, tự do của đất nước?","o":[["A","\"Dân ta anh hùng, bất khuất thì nước ta hùng cường.\""],["B","\"Lúc nào dân ta đoàn kết muôn đời như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn.\""],["C","\"Ý chí của dân là sức mạnh của nước.\""],["D","\"Độc lập, tự do là mục tiêu tối thượng của đoàn kết.\""],["E","\"Lịch sử chứng minh rằng không có đoàn kết, không có cách mạng.\""]],"a":"B","g":"Tài liệu trích lời Hồ Chí Minh: “Sử dạy cho ta bài học này: Lúc nào dân ta đoàn kết muôn đời như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn”."},{"id":"vn11-12","cd":"11","l":"D1","q":"Mối quan hệ giữa sự đoàn kết trong Đảng và sự đoàn kết toàn dân tộc được Hồ Chí Minh lý giải như thế nào?","o":[["A","Sự đoàn kết trong Đảng là điều kiện cần nhưng không đủ cho sự đoàn kết toàn dân tộc."],["B","Sự đoàn kết trong Đảng chỉ là một trong nhiều yếu tố thúc đẩy đoàn kết toàn dân tộc."],["C","Sự đoàn kết trong Đảng là yếu tố \"hạt nhân\", là điều kiện cho sự đoàn kết ngoài xã hội."],["D","Sự đoàn kết toàn dân tộc sẽ tự hình thành nếu có sự lãnh đạo đúng đắn của Đảng, không phụ thuộc vào sự đoàn kết nội bộ."],["E","Hai yếu tố này song song tồn tại mà không có mối liên hệ nhân quả trực tiếp."]],"a":"C","g":"Tài liệu khẳng định: \"Trong khối đại đoàn kết toàn dân tộc, phải đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong Đảng vì đó là điều kiện cho sự đoàn kết ngoài xã hội.\""},{"id":"vn11-13","cd":"11","l":"SAI","q":"Phát biểu nào sau đây không đúng về chiến lược đại đoàn kết toàn dân tộc trong tư tưởng Hồ Chí Minh?","o":[["A","Là chiến lược lâu dài, nhất quán của cách mạng Việt Nam."],["B","Mang tính sống còn của dân tộc Việt Nam."],["C","Chỉ được duy trì trong cách mạng dân tộc dân chủ nhân dân, không áp dụng cho cách mạng xã hội chủ nghĩa."],["D","Nhân tố quyết định sự thành bại của cách mạng."],["E","Chính sách và phương pháp có thể điều chỉnh phù hợp với từng đối tượng và giai đoạn."]],"a":"C","g":"Tài liệu khẳng định: \"chiến lược này được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\" Do đó, nhận định chỉ duy trì trong một giai đoạn là sai."},{"id":"vn11-14","cd":"11","l":"SAI","q":"Theo tư tưởng Hồ Chí Minh, chủ thể của khối đại đoàn kết toàn dân tộc không bao gồm nhóm đối tượng nào sau đây?","o":[["A","Tất cả những người Việt Nam yêu nước ở các giai cấp, các tầng lớp trong xã hội."],["B","Đồng bào các tôn giáo, các đảng phái."],["C","Những người Việt Nam có lòng trung thành với Tổ quốc nhưng không sẵn sàng phục vụ nhân dân."],["D","Mọi người dân vào một khối thống nhất, không phân biệt dân tộc, giai cấp, tầng lớp, giới tính, nghề nghiệp."],["E","Cả những người Việt Nam ở trong nước hay ở ngoài nước cùng hướng vào mục tiêu chung."]],"a":"C","g":"Tài liệu nêu tiêu chí \"ai có tài, có đức, có sức, có lòng phụng sự Tổ quốc và phục vụ nhân dân thì ta đoàn kết với họ\". Tài liệu bổ sung \"miễn là họ có lòng trung thành và sẵn sàng phục vụ Tổ quốc, không phản bội lại quyền lợi của nhân dân\". Do đó, \"không sẵn sàng phục vụ nhân dân\" là không phù hợp với tiêu chí đoàn kết."},{"id":"vn11-15","cd":"11","l":"SAI","q":"Nhận định nào sau đây không đúng khi nói về đại đoàn kết toàn dân tộc là một mục tiêu, nhiệm vụ hàng đầu của cách mạng Việt Nam?","o":[["A","Đại đoàn kết không chỉ là khẩu hiệu chiến lược mà còn là mục tiêu lâu dài của cách mạng."],["B","Là nhiệm vụ hàng đầu của Đảng, quán triệt trong đường lối, chủ trương, chính sách và hoạt động thực tiễn."],["C","Mục đích của Đảng Lao động Việt Nam được tóm gọn trong 8 chữ: \"ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC\"."],["D","Đại đoàn kết là yêu cầu tự phát từ quần chúng mà không cần vai trò thức tỉnh, tập hợp của Đảng."],["E","Đại đoàn kết là đòi hỏi khách quan của quần chúng nhân dân trong cuộc đấu tranh tự giải phóng."]],"a":"D","g":"Tài liệu nêu rõ: \"Đại đoàn kết là yêu cầu khách quan của sự nghiệp cách mạng và là đòi hỏi khách quan của quần chúng nhân dân trong cuộc đấu tranh tự giải phóng... Đảng Cộng sản phải có sứ mệnh thức tỉnh, tập hợp, hướng dẫn quần chúng\". Điều này bác bỏ ý \"không cần vai trò thức tỉnh, tập hợp của Đảng\"."},{"id":"vn11-16","cd":"11","l":"SAI","q":"Câu nói nào dưới đây không phải là luận điểm mang tính chân lý của Hồ Chí Minh về vai trò và sức mạnh của khối đại đoàn kết toàn dân tộc được trích dẫn trong tài liệu?","o":[["A","\"Đoàn kết là sức mạnh của chúng ta\"."],["B","\"Đoàn kết là một lực lượng vô địch của chúng ta để khắc phục khó khăn, giành lấy thắng lợi\"."],["C","\"Đoàn kết là sức mạnh, đoàn kết là thắng lợi\"."],["D","\"Đoàn kết là then chốt của thành công, là ngọn cờ dẫn lối thắng lợi.\""],["E","\"Bây giờ còn một điểm rất quan trọng, cũng là điểm mẹ... Đó là đoàn kết\"."]],"a":"D","g":"Tài liệu liệt kê các câu: \"Đoàn kết là sức mạnh của chúng ta\", \"Đoàn kết là một lực lượng vô địch của chúng ta để khắc phục khó khăn, giành lấy thắng lợi\", \"Đoàn kết là sức mạnh, đoàn kết là thắng lợi\", \"Đoàn kết là sức mạnh, là then chốt của thành công\", \"Bây giờ còn một điểm rất quan trọng, cũng là điểm mẹ... Đó là đoàn kết\". Phương án D có thêm cụm \"là ngọn cờ dẫn lối thắng lợi\" không có trong tài liệu."},{"id":"vn11-17","cd":"11","l":"SAI","q":"Để xây dựng khối đại đoàn kết toàn dân tộc vững chắc, cần phải thực hiện điều nào sau đây là không phù hợp với tư tưởng Hồ Chí Minh?","o":[["A","Xác định rõ nền tảng của khối đoàn kết là công nhân, nông dân và trí thức."],["B","Trước hết phải đoàn kết đại đa số nhân dân."],["C","Củng cố vững chắc nền tảng là công nhân, nông dân và trí thức để mở rộng khối đại đoàn kết."],["D","Ưu tiên đoàn kết các tầng lớp trí thức và đảng phái trước khi tập hợp quần chúng lao động."],["E","Xem công nhân, nông dân và các tầng lớp nhân dân lao động khác là nền gốc của đại đoàn kết."]],"a":"D","g":"Tài liệu nhấn mạnh: \"Đại đoàn kết tức là trước hết phải đoàn kết đại đa số nhân dân, mà đại đa số nhân dân là công nhân, nông dân và các tầng lớp nhân dân lao động khác. Đó là nền gốc của đại đoàn kết\". Việc \"ưu tiên đoàn kết các tầng lớp trí thức và đảng phái trước\" là đi ngược lại nguyên tắc \"trước hết phải đoàn kết đại đa số nhân dân\"."},{"id":"vn11-18","cd":"11","l":"SAI","q":"Khi xây dựng khối đại đoàn kết toàn dân tộc, Hồ Chí Minh chỉ rõ Đảng Cộng sản Việt Nam cần đứng vững trên lập trường nào để tập hợp lực lượng một cách toàn diện?","o":[["A","Lập trường dân tộc thuần túy, ưu tiên lợi ích dân tộc trên hết."],["B","Lập trường giai cấp công nhân, giải quyết hài hòa mối quan hệ giữa giai cấp và dân tộc."],["C","Lập trường quốc tế vô sản, bỏ qua các yếu tố giai cấp trong nước."],["D","Lập trường tôn giáo, nhằm thu hút sự ủng hộ của các tín đồ."],["E","Lập trường trung lập, không đứng về bất kỳ giai cấp nào."]],"a":"B","g":"Tài liệu ghi rõ: \"Hồ Chí Minh còn chỉ rõ, trong quá trình xây dựng khối đại đoàn kết toàn dân tộc, phải đứng vững trên lập trường giai cấp công nhân, giải quyết hài hòa mối quan hệ giữa giai cấp, dân tộc để tập hợp lực lượng\"."},{"id":"vn11-19","cd":"11","l":"NH","q":"Theo tư tưởng Hồ Chí Minh, những nhận định nào sau đây là đúng về đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược?","o":[["A","Là chiến lược lâu dài, nhất quán của cách mạng Việt Nam."],["B","Quyết định sự thành bại của cách mạng."],["C","Được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa."],["D","Chính sách và phương pháp tập hợp không bao giờ được điều chỉnh."],["E","Chỉ có ý nghĩa chiến lược trong giai đoạn đấu tranh giành độc lập dân tộc."]],"a":"ABC","g":"Tài liệu khẳng định A, B. Tài liệu khẳng định C và phủ nhận D (\"có thể và cần thiết phải điều chỉnh\"). E bị phủ nhận bởi \"được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa\"."},{"id":"vn11-20","cd":"11","l":"NH","q":"Theo Hồ Chí Minh, những điều nào sau đây là kết quả trực tiếp của khối đại đoàn kết toàn dân tộc?","o":[["A","Là sức mạnh vô địch để khắc phục khó khăn."],["B","Quyết định sự độc lập, tự do của đất nước."],["C","Là then chốt của thành công."],["D","Luôn dẫn đến sự phát triển kinh tế nhanh chóng."],["E","Luôn loại trừ mọi mâu thuẫn xã hội."]],"a":"ABC","g":"Tài liệu nêu A, C. Tài liệu nêu B: \"Lúc nào dân ta đoàn kết muôn đời như một thì nước ta độc lập, tự do.\" Các phương án D và E không được nhắc đến trong tài liệu và có tính tuyệt đối không phù hợp với thực tiễn."},{"id":"vn11-21","cd":"11","l":"NH","q":"Theo tư tưởng Hồ Chí Minh, \"Nhân dân\" trong chủ thể của khối đại đoàn kết toàn dân tộc bao gồm những đối tượng nào?","o":[["A","Toàn thể nhân dân, tất cả những người Việt Nam yêu nước."],["B","Các giai cấp, các tầng lớp trong xã hội, các ngành, các giới, các lứa tuổi, các dân tộc, đồng bào các tôn giáo, các đảng phái."],["C","Con người Việt Nam cụ thể."],["D","Tập hợp đông đảo quần chúng nhân dân."],["E","Chỉ những người có trình độ văn hóa cao và có địa vị trong xã hội."]],"a":"ABCD","g":"Tài liệu giải thích: \"Chủ thể của khối đại đoàn kết toàn dân tộc, theo Hồ Chí Minh, bao gồm toàn thể nhân dân, tất cả những người Việt Nam yêu nước ở các giai cấp, các tầng lớp trong xã hội, các ngành, các giới, các lứa tuổi, các dân tộc, đồng bào các tôn giáo, các đảng phái, v.v… “Nhân dân” trong tư tưởng Hồ Chí Minh được hiểu với nghĩa vừa là con người Việt Nam cụ thể, vừa là một tập hợp đông đảo quần chúng nhân dân\". Phương án E là một hạn chế không có trong tư tưởng bao trùm của Hồ Chí Minh."},{"id":"vn11-22","cd":"11","l":"NH","q":"Việc xác định đại đoàn kết toàn dân tộc là mục tiêu, nhiệm vụ hàng đầu của cách mạng Việt Nam theo Hồ Chí Minh có ý nghĩa và yêu cầu gì?","o":[["A","Phải được quán triệt trong tất cả mọi lĩnh vực của Đảng."],["B","Quán triệt từ đường lối, chủ trương, chính sách."],["C","Quán triệt tới hoạt động thực tiễn của Đảng."],["D","Là yêu cầu khách quan của sự nghiệp cách mạng."],["E","Chỉ là khẩu hiệu chiến lược mà không phải mục tiêu lâu dài."]],"a":"ABCD","g":"Tài liệu khẳng định A, B, C. Tài liệu khẳng định D. Tài liệu cũng nói \"đại đoàn kết không chỉ là khẩu hiệu chiến lược mà còn là mục tiêu lâu dài của cách mạng\", vậy E là sai."},{"id":"vn11-23","cd":"11","l":"NH","q":"Theo Hồ Chí Minh, sứ mệnh của Đảng Cộng sản trong việc xây dựng khối đại đoàn kết là gì?","o":[["A","Thức tỉnh quần chúng."],["B","Tập hợp quần chúng."],["C","Hướng dẫn quần chúng."],["D","Chuyển những nhu cầu, đòi hỏi tự giác của quần chúng thành hiện thực có tổ chức."],["E","Loại bỏ những tầng lớp không thuộc khối công nông."]],"a":"ABCD","g":"Tài liệu nêu rõ: \"Đảng Cộng sản phải có sứ mệnh thức tỉnh, tập hợp, hướng dẫn quần chúng, chuyển những nhu cầu, những đòi hỏi tự giác, thành hiện thực có tổ chức trong khối đại đoàn kết\". Phương án E đi ngược lại nguyên tắc tập hợp rộng rãi \"không bỏ sót một lực lượng nào\"."},{"id":"vn11-24","cd":"11","l":"NH","q":"Trong quá trình xây dựng khối đại đoàn kết toàn dân tộc, những tiêu chí nào sau đây cần được Đảng Cộng sản Việt Nam tuân thủ để tập hợp lực lượng một cách hiệu quả?","o":[["A","Đứng vững trên lập trường giai cấp công nhân."],["B","Giải quyết hài hòa mối quan hệ giữa giai cấp và dân tộc."],["C","Không bỏ sót một lực lượng nào miễn là họ có lòng trung thành và sẵn sàng phục vụ Tổ quốc."],["D","Chấp nhận những lực lượng phản bội quyền lợi của nhân dân nếu họ có tài năng đặc biệt."],["E","Chỉ tập trung vào các tầng lớp ưu tú của xã hội."]],"a":"ABC","g":"Tài liệu nêu A, B, C. Phương án D bị phủ nhận bởi yêu cầu \"không phản bội lại quyền lợi của nhân dân\". Phương án E đi ngược lại tinh thần tập hợp \"toàn thể nhân dân\"."},{"id":"vn11-25","cd":"11","l":"DK","q":"Hồ Chí Minh khẳng định: \"Sử dạy cho ta bài học này: Lúc nào dân ta _______ muôn người như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn\".","o":[["A","thương yêu"],["B","tin tưởng"],["C","đoàn kết"],["D","giúp đỡ"],["E","đồng lòng"]],"a":"C","g":"Tài liệu ghi rõ: “Sử dạy cho ta bài học này: Lúc nào dân ta đoàn kết muôn người như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn”."},{"id":"vn11-26","cd":"11","l":"DK","q":"\"Đại đoàn kết toàn dân tộc là vấn đề mang tính _______ của dân tộc Việt Nam nên chiến lược này được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\"","o":[["A","chiến lược"],["B","cốt lõi"],["C","sống còn"],["D","cấp thiết"],["E","cơ bản"]],"a":"C","g":"Tài liệu nêu: \"Đại đoàn kết toàn dân tộc là vấn đề mang tính sống còn của dân tộc Việt Nam nên chiến lược này được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\""},{"id":"vn11-27","cd":"11","l":"DK","q":"Mục đích của Đảng Lao động Việt Nam, theo tuyên bố của Hồ Chí Minh vào ngày 3/3/1951, có thể gồm trong 8 chữ là: \"ĐOÀN KẾT TOÀN DÂN, _______ TỔ QUỐC\".","o":[["A","XÂY DỰNG"],["B","PHỤNG SỰ"],["C","BẢO VỆ"],["D","KIẾN THIẾT"],["E","CỨU NƯỚC"]],"a":"B","g":"Tài liệu trích lời Hồ Chí Minh: “Mục đích của Đảng Lao động Việt Nam có thể gồm trong 8 chữ là: ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC”."},{"id":"vn11-28","cd":"11","l":"DK","q":"\"Đại đoàn kết tức là trước hết phải đoàn kết đại đa số nhân dân, mà đại đa số nhân dân là công nhân, nông dân và các tầng lớp nhân dân lao động khác. Đó là _______ của đại đoàn kết.\"","o":[["A","mục tiêu"],["B","phương hướng"],["C","nguyên tắc"],["D","nền gốc"],["E","then chốt"]],"a":"D","g":"Tài liệu khẳng định: \"Đó là nền gốc của đại đoàn kết. Nó cũng như cái nền của nhà, gốc của cây.\""},{"id":"vn11-29","cd":"11","l":"DK","q":"Lực lượng làm nền tảng cho khối đại đoàn kết dân tộc theo quan điểm của Hồ Chí Minh bao gồm công nhân, nông dân và _______.","o":[["A","tiểu thương"],["B","trí thức"],["C","binh lính"],["D","phú nông"],["E","địa chủ"]],"a":"B","g":"Tài liệu nêu: \"lực lượng làm nền tảng cho khối đại đoàn kết dân tộc theo quan điểm của Hồ Chí Minh là công nhân, nông dân và trí thức.\""},{"id":"vn11-30","cd":"11","l":"DK","q":"Trong khối đại đoàn kết toàn dân tộc, cần đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong _______ vì đó là điều kiện cho sự đoàn kết ngoài xã hội.","o":[["A","Chính phủ"],["B","Mặt trận"],["C","Quân đội"],["D","Đảng"],["E","Quốc hội"]],"a":"D","g":"Tài liệu khẳng định: \"Trong khối đại đoàn kết toàn dân tộc, phải đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong Đảng vì đó là điều kiện cho sự đoàn kết ngoài xã hội.\""},{"id":"vn12-1","cd":"12","l":"DS","q":"Nguyên tắc \"Đoàn kết thực sự nghĩa là vừa đoàn kết, vừa đấu tranh, học những cái tốt của nhau, phê bình những cái sai của nhau\" được Hồ Chí Minh nhấn mạnh chỉ áp dụng trong phạm vi các tổ chức có lợi ích tương đồng cao, không dành cho những thành phần còn tồn tại sự khác biệt lớn về quan điểm hoặc lợi ích.","o":[],"a":"S","g":"Theo Hồ Chí Minh, đoàn kết thực sự không chỉ là sự đồng thuận mà còn bao hàm cả \"đấu tranh, học những cái tốt của nhau, phê bình những cái sai của nhau\" và \"phê bình trên lập trường thân ái, vì nước, vì dân\". Nguyên tắc \"cầu đồng tồn dị\" cũng khẳng định sự cần thiết phải tìm điểm chung để hạn chế cái riêng, cái khác biệt, cho thấy sự đoàn kết này áp dụng rộng rãi ngay cả khi có những điểm khác biệt, chứ không chỉ giới hạn ở các tổ chức có lợi ích tương đồng cao. Mục đích là để \"tạo nên sự đoàn kết gắn bó chặt chẽ, lâu dài tạo tiền đề mở rộng khối đại đoàn kết trong mặt trận dân tộc thống nhất\"."},{"id":"vn12-2","cd":"12","l":"DS","q":"Theo tư tưởng Hồ Chí Minh, niềm tin vào nhân dân là một điều kiện độc lập để xây dựng khối đại đoàn kết, không liên quan trực tiếp đến truyền thống dân tộc \"Nước lấy dân làm gốc\" hay nguyên lý Mácxít \"Cách mạng là sự nghiệp của quần chúng\".","o":[],"a":"S","g":"Văn bản chỉ rõ: \"Nguyên tắc này [niềm tin vào nhân dân] vừa là sự tiếp nối truyền thống dân tộc “Nước lấy dân làm gốc”. “Chở thuyền và lật thuyền cũng là dân”, đồng thời là sự quán triệt sâu sắc nguyên lý mácxít \"Cách mạng là sự nghiệp của quần chúng”\". Như vậy, niềm tin vào nhân dân được coi là sự kết hợp và tiếp nối của cả truyền thống dân tộc và nguyên lý Mácxít, chứ không phải là một nguyên tắc độc lập hoàn toàn."},{"id":"vn12-3","cd":"12","l":"DS","q":"Mục đích chung của Mặt trận dân tộc thống nhất, dù tên gọi có khác nhau qua các thời kỳ, luôn chỉ tập trung vào độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân, không bao gồm mục tiêu giải phóng giai cấp.","o":[],"a":"S","g":"Mặc dù mục tiêu chung được xác định là \"độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân\", nhưng văn bản cũng khẳng định Đảng lãnh đạo Mặt trận hoàn thành nhiệm vụ \"đấu tranh giải phóng dân tộc và giải phóng giai cấp, kết hợp độc lập dân tộc với chủ nghĩa xã hội\". Điều này cho thấy mục tiêu giải phóng giai cấp là một phần không thể tách rời trong sứ mệnh của Mặt trận dưới sự lãnh đạo của Đảng, chứ không phải bị loại trừ."},{"id":"vn12-4","cd":"12","l":"DS","q":"Mặc dù liên minh công nhân - nông dân được xác định là nền tảng cốt lõi của Mặt trận dân tộc thống nhất, Hồ Chí Minh chủ trương chỉ nên nhấn mạnh vai trò của hai giai cấp này để đảm bảo tính tiên phong tuyệt đối của khối đại đoàn kết.","o":[],"a":"S","g":"Hồ Chí Minh chỉ rõ: \"Người căn dặn, không nên chỉ nhấn mạnh vai trò của công nông, mà còn phải thấy vai trò và sự cần thiết phải liên minh với các giai cấp khác, nhất là với đội ngũ trí thức\". Điều này thể hiện quan điểm rộng mở của Người về việc xây dựng khối đại đoàn kết, không chỉ giới hạn ở công nông mà cần liên minh với nhiều tầng lớp khác để Mặt trận thực sự quy tụ được cả dân tộc."},{"id":"vn12-5","cd":"12","l":"D1","q":"Trong các điều kiện để xây dựng khối đại đoàn kết toàn dân tộc, điều kiện nào được Hồ Chí Minh xác định là \"nguyên tắc bất di bất dịch, là ngọn cờ đoàn kết và là mẫu số chung để quy tụ các tầng lớp, giai cấp, đảng phái, dân tộc và tôn giáo vào trong Mặt trận\"?","o":[["A","Kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc."],["B","Có lòng khoan dung, độ lượng với con người."],["C","Có niềm tin vào nhân dân."],["D","Lấy lợi ích tối cao của dân tộc, lợi ích căn bản của nhân dân lao động làm mục tiêu phấn đấu."],["E","Xử lý tốt các mối quan hệ lợi ích rất đa dạng, phong phú trong xã hội."]],"a":"D","g":"Văn bản nêu rõ: \"Vì vậy đoàn kết phải lấy lợi ích tối cao của dân tộc, lợi ích căn bản của nhân dân lao động làm mục tiêu phấn đấu; đây là nguyên tắc bất di bất dịch, là ngọn cờ đoàn kết và là mẫu số chung để quy tụ các tầng lớp, giai cấp, đảng phái, dân tộc và tôn giáo vào trong Mặt trận\". Các lựa chọn khác là những điều kiện quan trọng nhưng không được mô tả bằng cụm từ khóa này."},{"id":"vn12-6","cd":"12","l":"D1","q":"Luận điểm \"Chở thuyền và lật thuyền cũng là dân\" trong tư tưởng Hồ Chí Minh về đại đoàn kết toàn dân tộc chủ yếu khẳng định điều gì?","o":[["A","Sự cần thiết của lòng khoan dung, độ lượng."],["B","Vai trò tối cao của liên minh công nhân - nông dân."],["C","Niềm tin vững chắc vào sức mạnh quyết định của nhân dân."],["D","Tầm quan trọng của việc kế thừa truyền thống dân tộc."],["E","Nguyên tắc hiệp thương dân chủ trong mọi hoạt động."]],"a":"C","g":"Luận điểm \"Chở thuyền và lật thuyền cũng là dân\" được nêu trong bối cảnh giải thích điều kiện \"niềm tin vào nhân dân\". Văn bản khẳng định: \"Dân là chỗ dựa vững chắc đồng thời cũng là tài liệu sức mạnh vô địch của khối đại đoàn kết toàn dân tộc, quyết định thắng lợi của cách mạng. Vì vậy, muốn thực hiện đại đoàn kết toàn dân tộc, phải có niềm tin vào nhân dân\". Do đó, luận điểm này chủ yếu khẳng định niềm tin vào sức mạnh quyết định của nhân dân."},{"id":"vn12-7","cd":"12","l":"D1","q":"Nguyên tắc \"cầu đồng tồn dị\" trong xây dựng Mặt trận dân tộc thống nhất có ý nghĩa then chốt nào sau đây?","o":[["A","Đòi hỏi mọi thành viên phải hoàn toàn đồng nhất về lợi ích và quan điểm để tạo sự thống nhất."],["B","Nhấn mạnh việc loại bỏ mọi sự khác biệt cá nhân để xây dựng một khối thống nhất tuyệt đối về tư tưởng."],["C","Tập trung vào việc tìm điểm chung để hạn chế, giải quyết các khác biệt riêng biệt, đồng thời tôn trọng chúng."],["D","Đề cao sự áp đặt ý chí từ một số thành viên chủ chốt để duy trì kỷ luật và định hướng chung."],["E","Chỉ áp dụng cho các tổ chức thành viên lớn, không áp dụng cho cá nhân trong Mặt trận."]],"a":"C","g":"Hồ Chí Minh nhấn mạnh phương châm \"cầu đồng tồn dị\", \"lấy cái chung để hạn chế cái riêng, cái khác biệt\". Điều này có nghĩa là Mặt trận chấp nhận sự tồn tại của những điểm khác biệt chính đáng, nhưng đồng thời tìm kiếm và phát huy những điểm tương đồng, lợi ích chung để tạo nên sự đoàn kết. Các lựa chọn A, B, D đều đi ngược lại tinh thần tôn trọng sự khác biệt và hiệp thương dân chủ, còn lựa chọn E không được đề cập trong văn bản."},{"id":"vn12-8","cd":"12","l":"D1","q":"Theo Hồ Chí Minh, lý do cốt yếu nào khiến liên minh công nhân - nông dân được xem là nền tảng của Mặt trận dân tộc thống nhất?","o":[["A","Vì họ là lực lượng duy nhất có khả năng lãnh đạo cách mạng và dẫn dắt các giai cấp khác."],["B","Vì họ đông đảo nhất, trực tiếp sản xuất tất cả mọi tài phú làm cho xã hội sống, và bị áp bức bóc lột nặng nề nhất."],["C","Vì họ đại diện cho tầng lớp trí thức có trình độ cao và tầm nhìn chiến lược."],["D","Vì họ có truyền thống yêu nước lâu đời và triệt để hơn bất kỳ tầng lớp nào khác trong xã hội."],["E","Vì họ là những người có tài sản và ảnh hưởng xã hội lớn nhất, dễ tập hợp hơn các giai cấp khác."]],"a":"B","g":"Hồ Chí Minh chỉ rõ rằng, sở dĩ phải lấy liên minh công nông làm nền tảng \"vì họ là người trực tiếp sản xuất tất cả mọi tài phú làm cho xã hội sống. Vì họ đông hơn hết, mà cũng bị áp bức bóc lột nặng nề hơn hết. Vì chí khí cách mạng của họ chắc chắn, bền bỉ hơn của mọi tầng lớp khác\". Lựa chọn B tổng hợp đầy đủ các lý do cốt yếu này."},{"id":"vn12-9","cd":"12","l":"SAI","q":"Nhận định nào sau đây KHÔNG ĐÚNG khi nói về vai trò của Đảng Cộng sản Việt Nam trong Mặt trận dân tộc thống nhất?","o":[["A","Đảng là một thành viên của Mặt trận."],["B","Đảng là lực lượng lãnh đạo của Mặt trận."],["C","Đảng có lợi ích riêng, tách biệt với lợi ích toàn xã hội để đảm bảo vai trò tiên phong của mình."],["D","Đảng lãnh đạo Mặt trận thông qua việc vạch đường lối và phương pháp cách mạng phù hợp."],["E","Đảng có nhiệm vụ dẫn dắt Mặt trận đấu tranh giải phóng dân tộc và giải phóng giai cấp."]],"a":"C","g":"Văn bản khẳng định rõ: \"Đảng Cộng sản Việt Nam vừa là thành viên, vừa là lực lượng lãnh đạo, Đảng không có lợi ích riêng, mà gắn liền với lợi ích toàn xã hội, toàn dân tộc\". Do đó, nhận định Đảng có lợi ích riêng, tách biệt với lợi ích toàn xã hội là không đúng."},{"id":"vn12-10","cd":"12","l":"SAI","q":"Điều kiện nào dưới đây KHÔNG PHẢI là một trong những điều kiện quan trọng để xây dựng khối đại đoàn kết toàn dân tộc theo văn bản?","o":[["A","Lấy lợi ích chung làm điểm quy tụ, đồng thời tôn trọng các lợi ích khác biệt chính đáng."],["B","Kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc."],["C","Có lòng khoan dung, độ lượng với con người."],["D","Xây dựng nền kinh tế độc lập, tự chủ hoàn toàn, không phụ thuộc vào bên ngoài."],["E","Có niềm tin vào nhân dân."]],"a":"D","g":"Các điều kiện được nêu trong văn bản bao gồm: \"Một là, phải lấy lợi ích chung làm điểm quy tụ, đồng thời tôn trọng các lợi ích khác biệt chính đáng\"; \"Hai là, phải kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc\"; \"Ba là, phải có lòng khoan dung, độ lượng với con người\"; và \"Bốn là, phải có niềm tin vào nhân dân\". Điều kiện \"Xây dựng nền kinh tế độc lập, tự chủ hoàn toàn\" không được đề cập trực tiếp như một điều kiện để xây dựng khối đại đoàn kết toàn dân tộc trong các tài liệu đã cho."},{"id":"vn12-11","cd":"12","l":"SAI","q":"Phương thức nào sau đây KHÔNG được đề cập là một trong những phương thức xây dựng khối đại đoàn kết dân tộc theo Hồ Chí Minh?","o":[["A","Làm tốt công tác vận động quần chúng (dân vận)."],["B","Thành lập đoàn thể, tổ chức quần chúng phù hợp với từng đối tượng để tập hợp quần chúng."],["C","Các đoàn thể, tổ chức quần chúng được tập hợp và đoàn kết trong Mặt trận dân tộc thống nhất."],["D","Cưỡng chế các tổ chức không tự nguyện tham gia Mặt trận để đảm bảo tính thống nhất và sức mạnh."],["E","Giáo dục, tuyên truyền, hướng dẫn, giúp đỡ và vận động quần chúng nhân dân thực hiện chủ trương, đường lối của Đảng."]],"a":"D","g":"Ba phương thức xây dựng khối đại đoàn kết dân tộc được nêu là: \"Một là, làm tốt công tác vận động quần chúng (dân vận)\"; \"Hai là, thành lập đoàn thể, tổ chức quần chúng phù hợp với từng đối tượng để tập hợp quần chúng\"; và \"Ba là, các đoàn thể, tổ chức quần chúng được tập hợp và đoàn kết trong mặt trận dân tộc thống nhất\". Phương thức \"Cưỡng chế các tổ chức không tự nguyện tham gia Mặt trận\" đi ngược lại với nguyên tắc hiệp thương dân chủ và không được đề cập trong văn bản. Lựa chọn E là một phần của công tác vận động quần chúng."},{"id":"vn12-12","cd":"12","l":"SAI","q":"Nhận định nào sau đây KHÔNG chính xác về nguyên tắc hoạt động hiệp thương dân chủ của Mặt trận dân tộc thống nhất?","o":[["A","Mọi vấn đề của Mặt trận đều phải được đem ra để tất cả các thành viên cùng nhau bàn bạc công khai."],["B","Loại trừ mọi sự áp đặt hoặc dân chủ hình thức trong quá trình ra quyết định."],["C","Những lợi ích riêng chính đáng, phù hợp với lợi ích chung của đất nước, của dân tộc cần được tôn trọng."],["D","Các lợi ích riêng biệt, không phù hợp với lợi ích chung sẽ được giải quyết bằng sự áp chế và loại bỏ của lợi ích chung tối cao."],["E","Hoạt động theo nguyên tắc này giúp quy tụ được các tầng lớp, giai cấp, đảng phái, dân tộc, tôn giáo vào Mặt trận."]],"a":"D","g":"Văn bản nêu rõ rằng những lợi ích riêng biệt, không phù hợp \"sẽ dần được giải quyết bằng lợi ích chung của dân tộc, bằng sự nhận thức ngày càng đúng đắn hơn của mỗi người, mỗi bộ phận về mối quan hệ giữa lợi ích chung và lợi ích riêng\". Cách giải quyết này dựa trên sự nhận thức và cảm hóa, không phải bằng sự \"áp chế và loại bỏ\". Các lựa chọn A, B, C, E đều đúng theo văn bản."},{"id":"vn12-13","cd":"12","l":"NH","q":"Theo văn bản, những tên gọi nào sau đây đã từng được sử dụng để chỉ Mặt trận dân tộc thống nhất trong các giai đoạn lịch sử khác nhau?","o":[["A","Hội Phản đế đồng minh"],["B","Mặt trận Dân chủ Đông Dương"],["C","Mặt trận Đại đoàn kết Việt Nam"],["D","Mặt trận Việt Minh"],["E","Mặt trận Tổ quốc Việt Nam"]],"a":"ABDE","g":"Văn bản liệt kê các tên gọi đã được sử dụng như: \"Hội Phản đế đồng minh (năm 1930), Mặt trận Dân chủ Đông Dương (năm 1936),... Mặt trận Việt Minh (năm 1941)... Mặt trận Tổ quốc Việt Nam (các năm 1955, 1976)...\". \"Mặt trận Đại đoàn kết Việt Nam\" không phải là một tên gọi cụ thể được đề cập trong danh sách này."},{"id":"vn12-14","cd":"12","l":"NH","q":"Những yếu tố nào sau đây góp phần tạo nên \"sức mạnh vô địch\" và \"giá trị bền vững\" của truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc Việt Nam theo văn bản?","o":[["A","Được hình thành, củng cố và phát triển trong suốt quá trình dựng nước và giữ nước hàng ngàn năm của dân tộc."],["B","Thấm sâu vào tư tưởng, tình cảm, tâm hồn của mỗi con người Việt Nam."],["C","Là cội tài liệu sức mạnh để cả dân tộc chiến đấu và chiến thắng thiên tai địch họa."],["D","Được lưu truyền qua nhiều thế hệ, trở thành giá trị bền vững."],["E","Chỉ thể hiện rõ nhất và phát huy tác dụng trong các cuộc kháng chiến chống ngoại xâm quy mô lớn."]],"a":"ABCD","g":"Văn bản chỉ rõ: \"Truyền thống này được hình thành, củng cố và phát triển trong suốt quá trình dựng nước và giữ nước hàng ngàn năm của dân tộc và đã trở thành giá trị bền vững, thấm sâu vào tư tưởng, tình cảm, tâm hồn của mỗi con người Việt Nam, được lưu truyền qua nhiều thế hệ. Truyền thống đó là cội tài liệu sức mạnh vô địch để cả dân tộc chiến đấu và chiến thắng thiên tai địch họa\". Lựa chọn E không chính xác vì truyền thống này có giá trị bền vững trong suốt quá trình, không chỉ trong các cuộc kháng chiến quy mô lớn."},{"id":"vn12-15","cd":"12","l":"NH","q":"Theo Hồ Chí Minh, những khía cạnh nào sau đây cần được chú trọng khi thực hiện công tác vận động quần chúng để xây dựng khối đại đoàn kết dân tộc?","o":[["A","Giải thích cho quần chúng hiểu rằng những việc phải làm là vì ích lợi của chính họ."],["B","Phương pháp tiếp cận và vận động phải phù hợp với tâm tư, nguyện vọng của quần chúng."],["C","Phải xuất phát từ thực tế trình độ dân trí và văn hóa, bao gồm cả phong tục, tập quán cụ thể của từng đối tượng."],["D","Giúp nhân dân hiểu đầy đủ, sâu sắc về quyền lợi, trách nhiệm và nghĩa vụ của người công dân đối với Đảng và Tổ quốc."],["E","Tập trung ưu tiên vận động các tầng lớp có trình độ học vấn cao để dẫn dắt các tầng lớp khác."]],"a":"ABCD","g":"Văn bản nêu rõ: \"cần phải chịu khó tìm đủ cách giải thích cho họ hiểu rằng: những việc đó là vì ích lợi của họ mà phải làm\"; \"mọi phương pháp tiếp cận và vận động quần chúng đều phải phù hợp với tâm tư, nguyện vọng của quần chúng; phải xuất phát từ thực tế trình độ dân trí và văn hoá, theo cả nghĩa rộng và nghĩa hẹp, bao gồm cả phong tục, tập quán và cụ thể đối với từng địa phương, từng đối tượng của nhân dân\"; và \"phải giúp nhân dân hiểu đầy đủ, sâu sắc về quyền lợi, trách nhiệm và nghĩa vụ của người công dân đối với Đảng, với Tổ quốc và với dân tộc\". Lựa chọn E không được đề cập và đi ngược lại tinh thần vận động toàn dân."},{"id":"vn12-16","cd":"12","l":"NH","q":"Để Mặt trận dân tộc thống nhất thực sự quy tụ được cả dân tộc thành một khối vững chắc dưới sự lãnh đạo của Đảng, cần phải đảm bảo những nguyên tắc cốt lõi nào trong xây dựng và hoạt động?","o":[["A","Phải được xây dựng trên nền tảng liên minh công nhân - nông dân - trí thức và đặt dưới sự lãnh đạo của Đảng."],["B","Phải hoạt động theo nguyên tắc hiệp thương dân chủ, loại trừ mọi sự áp đặt."],["C","Phải đoàn kết lâu dài, chặt chẽ, đoàn kết thật sự, chân thành, thân ái giúp đỡ nhau cùng tiến bộ."],["D","Phải tuân thủ phương châm \"cầu đồng tồn dị\" để giải quyết các khác biệt."],["E","Phải tập trung quyền lực vào một số thành viên chủ chốt để ra quyết định nhanh chóng và hiệu quả."]],"a":"ABCD","g":"Các nguyên tắc xây dựng và hoạt động của Mặt trận dân tộc thống nhất bao gồm: \"Một là, phải được xây dựng trên nền tảng liên minh công nhân - nông dân - trí thức và đặt dưới sự lãnh đạo của Đảng\"; \"Hai là, phải hoạt động theo nguyên tắc hiệp thương dân chủ\"; và \"Ba là, phải đoàn kết lâu dài, chặt chẽ, đoàn kết thật sự, chân thành, thân ái giúp đỡ nhau cùng tiến bộ\". Phương châm \"cầu đồng tồn dị\" cũng là một phần của nguyên tắc đoàn kết này. Lựa chọn E mâu thuẫn với nguyên tắc hiệp thương dân chủ."},{"id":"vn12-17","cd":"12","l":"DK","q":"Theo Hồ Chí Minh, nếu nước được độc lập mà dân không được hưởng hạnh phúc, tự do thì độc lập cũng chẳng có ý nghĩa gì. Vì vậy, đoàn kết phải lấy _______ của dân tộc, lợi ích căn bản của nhân dân lao động làm mục tiêu phấn đấu.","o":[["A","lợi ích riêng"],["B","lợi ích tối cao"],["C","lợi ích kinh tế"],["D","lợi ích chính đáng"],["E","lợi ích ban đầu"]],"a":"B","g":"Văn bản nêu rõ: \"Vì vậy đoàn kết phải lấy lợi ích tối cao của dân tộc, lợi ích căn bản của nhân dân lao động làm mục tiêu phấn đấu\"."},{"id":"vn12-18","cd":"12","l":"DK","q":"Hồ Chí Minh căn dặn đồng bào: “Năm ngón tay cũng có ngón vắn ngón dài. Nhưng vắn dài đều họp nhau lại nơi bàn tay. Trong mấy triệu người cũng có người thế này thế khác, nhưng thế này hay thế khác đều dòng dõi của tổ tiên ta. Vậy nên ta phải khoan hồng đại độ.” Người dùng hình ảnh này để minh họa cho sự cần thiết phải có _______ với con người trong xây dựng đại đoàn kết.","o":[["A","lòng trung thành"],["B","lòng kiên nhẫn"],["C","lòng dũng cảm"],["D","lòng khoan dung, độ lượng"],["E","lòng quyết tâm"]],"a":"D","g":"Đoạn văn trên được trích dẫn trong phần \"Hai là, phải có lòng khoan dung, độ lượng với con người\". Cụm từ \"khoan hồng đại độ\" đồng nghĩa với lòng khoan dung, độ lượng."},{"id":"vn12-19","cd":"12","l":"DK","q":"Đảng Cộng sản Việt Nam vừa là thành viên, vừa là lực lượng lãnh đạo của Mặt trận. Đảng không có lợi ích riêng, mà gắn liền với _______, toàn dân tộc.","o":[["A","một giai cấp"],["B","toàn xã hội"],["C","một nhóm người"],["D","một đảng phái"],["E","một tầng lớp"]],"a":"B","g":"Văn bản khẳng định: \"Đảng không có lợi ích riêng, mà gắn liền với lợi ích toàn xã hội, toàn dân tộc\"."},{"id":"vn12-20","cd":"12","l":"DK","q":"Các đoàn thể, tổ chức quần chúng ra đời, dưới sự lãnh đạo của Đảng, có nhiệm vụ tuyên truyền, giáo dục, giác ngộ, vận động, tập hợp các tầng lớp nhân dân tham gia cách mạng, đấu tranh bảo vệ _______ của mình.","o":[["A","danh dự"],["B","truyền thống"],["C","phong tục"],["D","quyền và lợi ích"],["E","văn hóa"]],"a":"D","g":"Văn bản nêu rõ rằng các đoàn thể, tổ chức quần chúng có nhiệm vụ \"đấu tranh bảo vệ quyền và lợi ích của mình\" và \"bênh vực quyền của dân\"."},{"id":"vn12-21","cd":"12","l":"DS","q":"Theo Hồ Chí Minh, các đoàn thể, tổ chức quần chúng và Mặt trận dân tộc thống nhất là sợi dây gắn kết Đảng với nhân dân.","o":[],"a":"D","g":"Tài liệu môn học ghi: “Các đoàn thể, tổ chức quần chúng và Mặt trận dân tộc thống nhất là sợi dây gắn kết Đảng với nhân dân.” Nhận định trong câu hỏi trùng với nội dung này."},{"id":"vn12-22","cd":"12","l":"DS","q":"Mặt trận dân tộc thống nhất là nơi quy tụ mọi tổ chức và cá nhân yêu nước sinh sống trong nước; kiều bào sinh sống ở nước ngoài không thuộc phạm vi tập hợp của Mặt trận.","o":[],"a":"S","g":"Tài liệu môn học ghi: “Mặt trận dân tộc thống nhất là nơi quy tụ mọi tổ chức và cá nhân yêu nước, tập hợp mọi người dân nước Việt, cả trong nước và kiều bào sinh sống ở nước ngoài.” Vì vậy, nói kiều bào không thuộc phạm vi tập hợp của Mặt trận là sai."},{"id":"vn12-23","cd":"12","l":"D1","q":"Theo Hồ Chí Minh, vì lợi ích của cách mạng, lòng khoan dung, độ lượng với con người được thể hiện ở việc làm nào sau đây?","o":[["A","Chỉ tập hợp những người đã hoàn toàn giác ngộ cách mạng, không có khuyết điểm."],["B","Trân trọng phần thiện dù nhỏ nhất ở mỗi người để tập hợp, quy tụ rộng rãi mọi lực lượng."],["C","Chỉ khoan dung với những người cùng giai cấp, cùng tôn giáo với mình."],["D","Loại ra khỏi khối đoàn kết những ai từng có mặt xấu, mặt hạn chế."],["E","Chỉ trân trọng những người đã có công lớn với cách mạng."]],"a":"B","g":"Tài liệu môn học ghi: “Cho nên, vì lợi ích của cách mạng, cần phải có lòng khoan dung, độ lượng, trân trọng phần thiện dù nhỏ nhất ở mỗi người, có vậy mới tập hợp, quy tụ rộng rãi mọi lực lượng.” Các phương án còn lại đều thu hẹp hoặc loại trừ lực lượng, trái với điều kiện này."},{"id":"vn12-24","cd":"12","l":"D1","q":"Hồ Chí Minh xác định mục đích chung của Mặt trận dân tộc thống nhất là gì?","o":[["A","Thay thế Nhà nước trong việc quản lý mọi mặt đời sống xã hội."],["B","Bảo vệ lợi ích riêng của từng đảng phái, tôn giáo trong Mặt trận."],["C","Chỉ tập hợp giai cấp công nhân và giai cấp nông dân."],["D","Tập hợp tới mức cao nhất lực lượng dân tộc vào khối đại đoàn kết toàn dân tộc."],["E","Thay thế vai trò lãnh đạo của Đảng đối với cách mạng."]],"a":"D","g":"Tài liệu môn học ghi: “Hồ Chí Minh xác định mục đích chung của Mặt trận dân tộc thống nhất là nhằm tập hợp tới mức cao nhất lực lượng dân tộc vào khối đại đoàn kết toàn dân tộc.”"},{"id":"vn12-25","cd":"12","l":"SAI","q":"Theo giáo trình, nhận định nào sau đây KHÔNG đúng về Mặt trận dân tộc thống nhất qua các thời kỳ?","o":[["A","Do yêu cầu và nhiệm vụ của từng chặng đường lịch sử, Mặt trận đã có những tên gọi khác nhau."],["B","Mặt trận phấn đấu vì mục tiêu chung là độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân."],["C","Mỗi tên gọi là một tổ chức riêng biệt, có mục tiêu khác hẳn tổ chức trước đó."],["D","Mặt trận tập hợp đông đảo các giai cấp, tầng lớp, dân tộc, tôn giáo, đảng phái, các tổ chức, cá nhân yêu nước."],["E","Từ năm 1977 đến nay, Mặt trận mang tên Mặt trận Tổ quốc Việt Nam."]],"a":"C","g":"Tài liệu môn học ghi: “Mặc dù có nhiều tên gọi khác nhau nhưng thực chất chỉ là một tổ chức chính trị - xã hội nhằm tập hợp đông đảo các giai cấp, tầng lớp, dân tộc, tôn giáo, đảng phái, các tổ chức, cá nhân yêu nước ở trong và ngoài nước, phấn đấu vì mục tiêu chung là độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân.” Giáo trình cũng ghi: “từ năm 1977 đến nay là Mặt trận Tổ quốc Việt Nam”. Vì vậy, coi mỗi tên gọi là một tổ chức riêng biệt, có mục tiêu khác hẳn là sai."},{"id":"vn12-26","cd":"12","l":"SAI","q":"Nhận định nào sau đây KHÔNG đúng về các đoàn thể, tổ chức quần chúng theo tư tưởng Hồ Chí Minh?","o":[["A","Là những tổ chức để tập hợp, giáo dục, rèn luyện quần chúng."],["B","Bản chất của đoàn thể nhân dân, các tổ chức quần chúng là tổ chức của dân."],["C","Có nhiệm vụ giáo dục, động viên và phát huy tính tích cực của các tầng lớp nhân dân."],["D","Là hạt nhân của khối đại đoàn kết toàn dân."],["E","Được tổ chức theo một khuôn mẫu chung cho mọi người, không cần phù hợp với từng giai cấp, lứa tuổi, giới tính hay vùng miền."]],"a":"E","g":"Tài liệu môn học ghi: “Đây là những tổ chức để tập hợp, giáo dục, rèn luyện quần chúng cho phù hợp từng giai cấp, dân tộc, tôn giáo, lứa tuổi, giới tính, vùng miền”. Giáo trình gọi phương thức này là: “thành lập đoàn thể, tổ chức quần chúng phù hợp với từng đối tượng để tập hợp quần chúng”. Vì vậy, phương án E là sai."},{"id":"vn12-27","cd":"12","l":"NH","q":"Theo lời Hồ Chí Minh được dẫn trong giáo trình, cần phải đoàn kết những lực lượng nào sau đây?","o":[["A","Chỉ những người đã là đảng viên Đảng Cộng sản Việt Nam."],["B","Các đảng phái, các đoàn thể, các nhân sĩ trong Mặt trận Tổ quốc Việt Nam."],["C","Các dân tộc anh em, cùng nhau xây dựng Tổ quốc."],["D","Chỉ đồng bào không theo tôn giáo, vì đồng bào các tôn giáo có lợi ích khác biệt."],["E","Đồng bào lương và đồng bào các tôn giáo, cùng nhau xây dựng đời sống hòa thuận ấm no."]],"a":"BCE","g":"Tài liệu môn học ghi: “Phải đoàn kết tốt các đảng phái, các đoàn thể, các nhân sĩ trong Mặt trận Tổ quốc Việt Nam, thực hiện hợp tác lâu dài, giúp đỡ lẫn nhau, cùng nhau tiến bộ. Phải đoàn kết các dân tộc anh em, cùng nhau xây dựng Tổ quốc... Phải đoàn kết chặt chẽ giữa đồng bào lương và đồng bào các tôn giáo, cùng nhau xây dựng đời sống hòa thuận ấm no, xây dựng Tổ quốc”. Các phương án A và D thu hẹp khối đoàn kết, trái với lời Người."},{"id":"vn12-28","cd":"12","l":"NH","q":"Theo Hồ Chí Minh, “đoàn kết thực sự” trong Mặt trận dân tộc thống nhất đòi hỏi những điều nào sau đây?","o":[["A","Mục đích phải nhất trí và lập trường cũng phải nhất trí."],["B","Chỉ đoàn kết, tránh mọi đấu tranh, phê bình để giữ hòa khí."],["C","Vừa đoàn kết, vừa đấu tranh, học những cái tốt của nhau, phê bình những cái sai của nhau."],["D","Phê bình trên lập trường thân ái, vì nước, vì dân."],["E","Các thành viên phải từ bỏ mọi lợi ích riêng, kể cả lợi ích riêng chính đáng."]],"a":"ACD","g":"Tài liệu môn học ghi: “Đoàn kết thực sự nghĩa là mục đích phải nhất trí và lập trường cũng phải nhất trí. Đoàn kết thực sự nghĩa là vừa đoàn kết, vừa đấu tranh, học những cái tốt của nhau, phê bình những cái sai của nhau và phê bình trên lập trường thân ái, vì nước, vì dân”. Phương án E sai vì giáo trình cũng ghi: “Những lợi ích riêng chính đáng, phù hợp với lợi ích chung của đất nước, của dân tộc cần được tôn trọng”."},{"id":"vn12-29","cd":"12","l":"DK","q":"Theo Hồ Chí Minh, Mặt trận dân tộc thống nhất càng rộng rãi, càng chặt chẽ, thống nhất bao nhiêu thì khối đại đoàn kết toàn dân tộc càng _______ bấy nhiêu.","o":[["A","phức tạp, khó lãnh đạo"],["B","phân tán, lỏng lẻo"],["C","mạnh mẽ, bền vững"],["D","khép kín, biệt lập"],["E","hình thức, đối phó"]],"a":"C","g":"Tài liệu môn học ghi: “Mặt trận dân tộc thống nhất càng rộng rãi, càng chặt chẽ, thống nhất bao nhiêu thì khối đại đoàn kết toàn dân tộc càng mạnh mẽ, bền vững bấy nhiêu.”"},{"id":"vn12-30","cd":"12","l":"DK","q":"Theo Hồ Chí Minh, vận động quần chúng để thu hút quần chúng chính là để _______ mọi người, tạo ra động lực phát triển kinh tế - xã hội và văn hóa.","o":[["A","phân loại"],["B","kiểm soát"],["C","quản lý"],["D","thay thế"],["E","đoàn kết"]],"a":"E","g":"Tài liệu môn học ghi: “Vận động quần chúng để thu hút quần chúng chính là để đoàn kết mọi người, tạo ra động lực phát triển kinh tế - xã hội và văn hóa.”"},{"id":"vn13-1","cd":"13","l":"DS","q":"Theo quan điểm của Hồ Chí Minh, việc cán bộ thực hiện “cần, kiệm, liêm, chính” không chỉ là gương mẫu cho nhân dân mà còn là biện pháp duy nhất để chống lại sự hủ bại và biến chất trong bộ máy nhà nước.","o":[],"a":"S","g":"Tài liệu chỉ ra rằng cán bộ, đảng viên phải là người thực hành \"cần, kiệm, liêm, chính\" trước để làm kiểu mẫu cho dân và nếu không giữ đúng thì \"dễ trở nên hủ bại, biến thành sâu mọt của dân\". Tuy nhiên, tài liệu không khẳng định đây là \"biện pháp duy nhất\" để chống hủ bại, mà là một điều kiện tiên quyết. Có thể có nhiều biện pháp khác không được đề cập trong đoạn văn này."},{"id":"vn13-2","cd":"13","l":"DS","q":"Tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh, mặc dù kế thừa giá trị yêu nước truyền thống, nhưng hoàn toàn loại bỏ mọi yếu tố đạo đức truyền thống trong quan niệm về nước và dân để tạo nên một cuộc cách mạng sâu sắc.","o":[],"a":"S","g":"Tài liệu và chỉ rõ tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh \"kế thừa giá trị yêu nước truyền thống của dân tộc, mà còn vượt qua những hạn chế của truyền thống đó\", đồng thời đưa ra \"những nội dung mới, rộng lớn\" và \"tạo nên một cuộc cách mạng sâu sắc\". Việc sử dụng từ \"kế thừa\" cho thấy Người không \"hoàn toàn loại bỏ mọi yếu tố đạo đức truyền thống\" mà là chọn lọc, phát triển và làm mới nội dung trên nền tảng truyền thống."},{"id":"vn13-3","cd":"13","l":"DS","q":"Theo Hồ Chí Minh, tình yêu thương con người phải được xây dựng trên lập trường của giai cấp công nhân và chỉ được thể hiện thông qua các hành động cụ thể, thiết thực trong các mối quan hệ hằng ngày.","o":[],"a":"S","g":"Tài liệu nêu rõ \"Tình yêu thương con người theo Hồ Chí Minh phải được xây dựng trên lập trường của giai cấp công nhân, thể hiện trong các mối quan hệ hằng ngày với bạn bè, đồng chí, anh em, phải được thể hiện ở hành động cụ thể thiết thực\". Tuy nhiên, tài liệu cũng đề cập đến các khía cạnh khác như \"thật chặt chẽ và nghiêm khắc với mình; rộng rãi, độ lượng và giàu lòng vị tha đối với người khác; phải có thái độ tôn trọng những quyền của con người, tạo điều kiện cho con người phát huy tài năng; nâng con người lên...\". Từ \"chỉ\" trong câu hỏi làm cho mệnh đề trở nên sai vì nó thu hẹp phạm vi biểu hiện của tình yêu thương con người."},{"id":"vn13-4","cd":"13","l":"DS","q":"Chủ nghĩa quốc tế theo Hồ Chí Minh đòi hỏi sự tôn trọng và đoàn kết với giai cấp vô sản và các dân tộc bị áp bức trên toàn thế giới, đồng thời loại bỏ hoàn toàn chủ nghĩa dân tộc hẹp hòi để đạt được hòa bình vĩnh cửu.","o":[],"a":"S","g":"Tài liệu khẳng định Hồ Chí Minh là biểu tượng của \"chủ nghĩa yêu nước chân chính kết hợp nhuần nhuyễn với chủ nghĩa quốc tế vô sản\". Tài liệu có nói đến việc \"chống lại chủ nghĩa dân tộc hẹp hòi, sôvanh, biệt lập và chủ nghĩa bành trướng bá quyền\". Tuy nhiên, việc \"kết hợp nhuần nhuyễn\" chủ nghĩa yêu nước chân chính không có nghĩa là \"loại bỏ hoàn toàn\" chủ nghĩa dân tộc (mà là loại bỏ phần \"hẹp hòi\"). Hơn nữa, việc loại bỏ này cũng không được khẳng định là sẽ trực tiếp \"đạt được hòa bình vĩnh cửu\" trong văn bản tài liệu."},{"id":"vn13-5","cd":"13","l":"D1","q":"Luận điểm \"Bao nhiêu lợi ích đều vì dân. Bao nhiêu quyền hạn đều của dân… Quyền hành và lực lượng đều ở nơi dân\" (Tài liệu) thể hiện rõ nhất khía cạnh nào trong quan niệm đạo đức Hồ Chí Minh về \"Trung với nước, hiếu với dân\"?","o":[["A","Sự kế thừa triệt để quan niệm \"trung với vua\" truyền thống."],["B","Vai trò tối cao của Đảng và Chính phủ trong việc định đoạt mọi lợi ích và quyền hạn."],["C","Cuộc cách mạng sâu sắc trong quan niệm về nước và dân, đặt dân lên vị trí chủ thể."],["D","Mục tiêu duy nhất là làm cho dân giàu, nước mạnh bằng mọi giá."],["E","Sự phân chia rõ ràng giữa lợi ích của nước và lợi ích của dân."]],"a":"C","g":"Tài liệu khẳng định khi Hồ Chí Minh đặt vấn đề \"Bao nhiêu lợi ích đều vì dân. Bao nhiêu quyền hạn đều của dân… Quyền hành và lực lượng đều ở nơi dân\", và Đảng, Chính phủ là \"đầy tớ nhân dân\", thì \"quan niệm về nước và dân đã hoàn toàn đảo lộn so với trước; rất ít lãnh tụ cách mạng đã nói về dân như vậy, điều này càng làm cho tư tưởng đạo đức Hồ Chí Minh vượt xa lên phía trước\". Điều này trực tiếp chỉ ra rằng đây là một cuộc cách mạng sâu sắc, đặt dân vào vị trí trung tâm, là chủ thể của quyền lực và lợi ích. Các phương án khác không phản ánh đúng hoặc không đầy đủ ý nghĩa của luận điểm này."},{"id":"vn13-6","cd":"13","l":"D1","q":"Theo Hồ Chí Minh, phẩm chất \"Chí công vô tư\" được hiểu một cách sâu sắc nhất là:","o":[["A","Hoàn toàn không nghĩ đến lợi ích cá nhân dưới bất kỳ hình thức nào."],["B","Luôn đặt lợi ích của Đảng, nhân dân và dân tộc lên trên hết, trước hết, đồng thời đối lập hoàn toàn với chủ nghĩa cá nhân."],["C","Là đức tính cơ bản độc lập, không liên quan đến \"cần, kiệm, liêm, chính\"."],["D","Việc hưởng thụ phải luôn đi sau người khác, không có ngoại lệ."],["E","Chỉ áp dụng cho cán bộ cấp cao có quyền lực lớn."]],"a":"B","g":"Tài liệu định nghĩa \"Chí công vô tư là hoàn toàn vì lợi ích chung, không vì tư lợi; Là hết sức công bằng, không chút thiên tư, thiên vị, công tâm, luôn đặt lợi ích của Đảng, của nhân dân, của dân tộc lên trên hết, trước hết; chỉ biết vì Đảng, vì dân tộc, 'lo trước thiên hạ, vui sau thiên hạ'\". Tài liệu còn nói rõ \"Chí công vô tư là chống chủ nghĩa cá nhân\". Phương án A quá tuyệt đối (\"hoàn toàn không nghĩ đến lợi ích cá nhân dưới bất kỳ hình thức nào\") trong khi tài liệu chỉ nói \"đừng nghĩ đến mình trước... khi hưởng thụ thì mình nên đi sau\". Phương án C sai vì tài liệu nói \"Chí công vô tư về thực chất là sự tiếp nối cần, kiệm, liêm, chính\". Phương án D quá tuyệt đối (\"không có ngoại lệ\") và"},{"id":"vn13-7","cd":"13","l":"D1","q":"Trong các nhận định sau về phẩm chất \"Liêm\" theo Hồ Chí Minh, nhận định nào thể hiện sự tinh túy nhất, vượt trội so với quan niệm truyền thống?","o":[["A","\"Liêm là trong sạch, không tham lam.\""],["B","\"Chữ LIÊM phải đi đôi với chữ KIỆM. Cũng như chữ KIỆM phải đi với chữ CẦN.\""],["C","\"Liêm là không tham địa vị. Không tham tiền tài. Không tham sung sướng.\""],["D","\"Không ham người tâng bốc mình. Vì vậy mà quang minh chính đại, không bao giờ hủ hóa.\""],["E","\"Chỉ có một thứ ham là ham học, ham làm, ham tiến bộ.\""]],"a":"E","g":"Các phương án A, B, C, D đều là các khía cạnh quan trọng của \"Liêm\" theo Hồ Chí Minh. Tuy nhiên, phương án E \"Chỉ có một thứ ham là ham học, ham làm, ham tiến bộ\" là một điểm nhấn đặc biệt, thể hiện một quan niệm tích cực, tiến bộ về \"Liêm\". Thay vì chỉ tập trung vào việc không tham lam (điều đã có trong truyền thống), Người đã bổ sung một nội dung mới, định hướng cho con người phải có những ham muốn lành mạnh, tích cực, vì sự phát triển bản thân và xã hội. Điều này nâng tầm ý nghĩa của \"Liêm\" lên một cấp độ mới, vượt trội so với việc chỉ giữ mình trong sạch, không tham nhũng."},{"id":"vn13-8","cd":"13","l":"D1","q":"Luận điểm \"Đem lòng chí công vô tư mà đối với người, đối với việc\" và \"Khi làm bất cứ việc gì cũng đừng nghĩ đến mình trước... khi hưởng thụ thì mình nên đi sau\" (Tài liệu) thể hiện mối liên hệ sâu sắc nhất với phẩm chất đạo đức nào khác của Hồ Chí Minh?","o":[["A","Tinh thần quốc tế trong sáng."],["B","Thương yêu con người, sống có tình có nghĩa."],["C","Cần, kiệm, liêm, chính."],["D","Trung với nước, hiếu với dân."],["E","Tính tự lực cánh sinh trong lao động."]],"a":"C","g":"Tài liệu rõ ràng giải thích: \"Chí công vô tư về thực chất là sự tiếp nối cần, kiệm, liêm, chính.\" Điều này trực tiếp chỉ ra mối liên hệ sâu sắc nhất giữa chí công vô tư và cần, kiệm, liêm, chính. Việc đem lòng chí công vô tư đối với người, đối với việc, không nghĩ đến mình trước khi làm việc và hưởng thụ sau là những biểu hiện cụ thể của sự liêm chính và không tham lam, đồng thời thể hiện tinh thần không tư lợi, là cốt lõi của \"cần, kiệm, liêm, chính, chí công vô tư\"."},{"id":"vn13-9","cd":"13","l":"SAI","q":"Nhận định nào sau đây không phản ánh đúng ý nghĩa của \"Kiệm\" theo tư tưởng Hồ Chí Minh?","o":[["A","Tiết kiệm không có nghĩa là bủn xỉn, mà là chi tiêu có kế hoạch và mục đích rõ ràng."],["B","Tiết kiệm sức lao động, thời gian và tiền của không chỉ của cá nhân mà còn của tập thể và quốc gia."],["C","Khi có việc đáng làm, lợi ích cho đồng bào, cho Tổ quốc thì không cần tiết kiệm bao nhiêu công, của."],["D","Việc phô trương hình thức, liên hoan chè chén lu bù là những hành vi trái với tinh thần \"Kiệm\"."],["E","Tiết kiệm đòi hỏi sự kiên quyết không xa xỉ trong mọi hoàn cảnh, bao gồm cả các hoạt động vì lợi ích chung."]],"a":"E","g":"Tài liệu và định nghĩa \"Kiệm là tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi... Tiết kiệm không phải là bủn xỉn. Khi không nên tiêu xài thì một đồng xu cũng không nên tiêu. Khi có việc đáng làm, việc lợi ích cho đồng bào, cho Tổ quốc, thì dù bao nhiêu công, tốn bao nhiêu của, cũng vui lòng. Như thế mới đúng là kiệm.\" Phương án E khẳng định \"Tiết kiệm đòi hỏi sự kiên quyết không xa xỉ trong mọi hoàn cảnh, bao gồm cả các hoạt động vì lợi ích chung\" là sai, vì tài liệu rõ ràng cho phép (thậm chí khuyến khích) chi tiêu \"bao nhiêu công, tốn bao nhiêu của\" cho \"việc lợi ích cho đồng bào, cho Tổ quốc\"."},{"id":"vn13-10","cd":"13","l":"SAI","q":"Phát biểu nào sau đây không phản ánh đúng về tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh?","o":[["A","Là phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác."],["B","Đánh dấu sự thay đổi cơ bản từ quan niệm \"trung với vua, hiếu với cha mẹ\" truyền thống sang nội dung mới."],["C","Không những kế thừa giá trị yêu nước truyền thống mà còn vượt qua những hạn chế của nó."],["D","Được cụ thể hóa bằng việc làm cho \"dân giàu, nước mạnh\" và \"hết lòng hết sức phục vụ nhân dân\"."],["E","Yêu cầu tuyệt đối trung thành với Tổ quốc nhưng không bao gồm việc tin dân, học hỏi dân."]],"a":"E","g":"Phương án E sai vì tài liệu nêu rõ \"Hiếu với dân là phải thương dân, tin dân, thân dân, học hỏi dân, lấy trí tuệ ở dân, kính trọng dân, lấy dân làm gốc, 'hết lòng hết sức phục vụ nhân dân. Phải yêu kính nhân dân. Phải thật sự tôn trọng quyền làm chủ của nhân dân'\". Như vậy, \"tin dân, học hỏi dân\" là những nội dung cốt lõi của \"hiếu với dân\"."},{"id":"vn13-11","cd":"13","l":"SAI","q":"Phát biểu nào sau đây là không đúng về sự vận dụng và phát triển khái niệm đạo đức truyền thống của Hồ Chí Minh?","o":[["A","Người đã sử dụng các khái niệm cũ như \"trung\", \"hiếu\" nhưng gán cho chúng những nội dung mới, rộng lớn và mang tính cách mạng."],["B","Các khái niệm \"cần, kiệm, liêm, chính, chí công vô tư\" được Người lọc bỏ những nội dung không phù hợp và đưa vào nội dung mới để đáp ứng yêu cầu cách mạng."],["C","Sự kế thừa và phát triển này chỉ mang tính hình thức, cốt lõi vẫn giữ nguyên các giá trị truyền thống để dễ tiếp thu hơn."],["D","Quan điểm \"Đạo đức mới như người hai chân đứng vững được dưới đất, đầu ngửng lên trời\" minh chứng cho sự đảo lộn sâu sắc so với đạo đức cũ."],["E","Người khẳng định cán bộ phải thực hiện \"cần, kiệm, liêm, chính\" trước làm gương cho dân, khác với việc phong kiến bắt dân tuân theo."]],"a":"C","g":"Tài liệu chỉ ra rằng Hồ Chí Minh đã sử dụng các khái niệm cũ như \"Trung với vua, hiếu với cha mẹ\" nhưng với \"những nội dung mới, rộng lớn: “Trung với nước, hiếu với dân”, đã tạo nên một cuộc cách mạng sâu sắc trong lĩnh vực đạo đức\". Người cũng ví \"Đạo
