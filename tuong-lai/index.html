vements were unified with one another in their forces, methods and slogans of struggle."],["E","The movements shared the common goal of winning independence and freedom for the nation."]],"a":"D","g":"The course textbook states: “Although those movements differed in forces, methods and slogans of struggle, they shared the common goal of winning independence and freedom for the nation.” The movements differed (rather than being unified) in forces, methods and slogans of struggle, so option D is incorrect."},{"id":"en07-27","cd":"07","l":"NH","q":"According to Ho Chi Minh's words in The Revolutionary Path as quoted in the course textbook, which of the following are tasks of the revolutionary party?","o":[["A","At home, to mobilise and organise the masses."],["B","Abroad, to liaise with the governments of colonial powers to negotiate the handing back of independence."],["C","Abroad, to liaise with oppressed nations everywhere."],["D","Abroad, to liaise with the proletariat everywhere."],["E","To stay outside the mass movement in order to preserve the party's independence."]],"a":"ACD","g":"The course textbook states: “First of all there must be a revolutionary party, to mobilise and organise the masses at home, and abroad to liaise with oppressed nations and the proletariat everywhere.” Options B and E do not appear in Ho Chi Minh's words; option E also contradicts the task of mobilising and organising the masses."},{"id":"en07-28","cd":"07","l":"NH","q":"According to the course textbook, which of the following statements about the relationship between the Communist Party of Vietnam and V.I. Lenin's theory of the new-type party of the proletariat are correct?","o":[["A","The theory of the new-type party suits only developed capitalist countries, so Ho Chi Minh did not apply it to Vietnam."],["B","The Communist Party of Vietnam exists and develops according to V.I. Lenin's views on the new-type party of the proletariat."],["C","Ho Chi Minh was loyal to Marxist–Leninist doctrine, including V.I. Lenin's theory of the new-type party."],["D","The Communist Party of Vietnam is organised on the model of a party of the national bourgeoisie."],["E","Ho Chi Minh creatively applied and developed the theory of the new-type party in the specific conditions of Vietnam."]],"a":"BCE","g":"The course textbook states: “The Communist Party of Vietnam, founded and trained by Ho Chi Minh, is a political party that exists and develops according to V.I. Lenin's views on the new-type party of the proletariat.” and “Ho Chi Minh was loyal to Marxist–Leninist doctrine, including V.I. Lenin's theory of the new-type party of the proletariat, while creatively applying and developing that theory in the specific conditions of Vietnam.” Options A and D contradict these points."},{"id":"en07-29","cd":"07","l":"DK","q":"In The Revolutionary Path, Ho Chi Minh wrote: “Only when the Party is firm can the revolution _______, just as only when the helmsman is steady can the boat move”.","o":[["A","endure"],["B","spread"],["C","be strong"],["D","succeed"],["E","be peaceful"]],"a":"D","g":"The course textbook states: “Only when the Party is firm can the revolution succeed, just as only when the helmsman is steady can the boat move”. The saying affirms that a firm Party is the condition for the revolution to succeed."},{"id":"en07-30","cd":"07","l":"DK","q":"According to the course textbook, the Communist Party of Vietnam was born, exists and develops precisely because of the _______ of Vietnamese society from the beginning of 1930 onwards.","o":[["A","inevitable need"],["B","imposition from outside"],["C","subjective wish"],["D","historical accident"],["E","pressure of the colonial authorities"]],"a":"A","g":"The course textbook states: “The Communist Party of Vietnam was born, exists and develops precisely because of the inevitable need of Vietnamese society from the beginning of 1930 onwards.”"},{"id":"en08-1","cd":"08","l":"DS","q":"Ho Chi Minh Thought affirms that the birth of the Communist Party of Vietnam was a historical inevitability, consistent with the law of civilised and progressive development of the nation and of humanity, but not all of the Party's activities necessarily have to stem from the development requirements of the nation.","o":[],"a":"S","g":"According to the course textbook, \"The birth of the Party was an inevitability, consistent with the law of civilised and progressive development of the nation and of humanity. All activities of the Party stem from the development requirements of the nation, taking the supreme interests of the nation as paramount; all class interests must be subordinated to the development of the nation; all activities of the Party must be consistent with the laws of motion of Vietnamese society\". Therefore, saying that \"not all of the Party's activities necessarily have to stem from the development requirements of the nation\" is incorrect."},{"id":"en08-2","cd":"08","l":"DS","q":"Ho Chi Minh regarded self-criticism and criticism as the best \"medicine\" for consolidating solidarity and unity within the Party, but they need not always be honest and resolute, since this might affect comradeship.","o":[],"a":"S","g":"The course textbook states clearly: \"self-criticism and criticism must be honest and resolute, aimed at the right person and the right matter, and must be cultured…\". At the same time, he also emphasised: \"Within the Party, practising broad democracy and regular and serious self-criticism and criticism is the best way to consolidate the solidarity and unity of the Party. There must be comradely love for one another\". That is, honesty and resoluteness are not in contradiction with this but are in fact a condition for consolidating solidarity and unity on the foundation of comradeship."},{"id":"en08-3","cd":"08","l":"DS","q":"According to Ho Chi Minh, the Communist Party of Vietnam is the vanguard of the working class and the working people, but it need not necessarily be the embodiment of national culture.","o":[],"a":"S","g":"The course textbook affirms: \"Ho Chi Minh was aware that the Communist Party of Vietnam must necessarily be the embodiment of national culture, because the Party is the vanguard not only of the working class but also of the working people and of the nation\". Therefore, the assessment that the Party need not necessarily be the embodiment of national culture is incorrect."},{"id":"en08-4","cd":"08","l":"DS","q":"According to Ho Chi Minh Thought, Party discipline is truly strict and lasting only when it is built on Party members' conscious awareness of their duties towards the Party, rather than merely being imposed from the top down.","o":[],"a":"D","g":"The course textbook states clearly: \"This discipline comes from Party members' conscious awareness of their duties towards the Party; only when it is conscious is Party discipline strict and lasting, truly creating strength for the Party\". Although discipline is also strict from the top down, the element of conscious awareness is the foundation for the durability and real strength of discipline."},{"id":"en08-5","cd":"08","l":"DS","q":"According to Ho Chi Minh, when the common interests of the Party conflict with the private interests of an individual, Party members and cadres are allowed to weigh the matter and negotiate a compromise in order to safeguard their own legitimate interests.","o":[],"a":"S","g":"The course textbook emphasises: \"If the common interests of the Party conflict with the private interests of an individual, then the interests of the individual must be resolutely sacrificed for the interests of the Party. When one's own life is required, one must also gladly sacrifice it for the Party\". There is no weighing or negotiating of personal interests when they conflict with the interests of the Party."},{"id":"en08-6","cd":"08","l":"DS","q":"Ho Chi Minh warned that \"internal invaders\" (embezzlement, waste, bureaucracy) are more to be feared than \"the enemy outside\" because they can destroy from within, but the role of cadres and Party members in preventing and combating these negative phenomena stops at setting an example and does not require directly confronting and dealing with such behaviour.","o":[],"a":"S","g":"The course textbook affirms: \"In preventing and combating negative phenomena, cadres and Party members must especially prevent and combat embezzlement, waste and bureaucracy, because Ho Chi Minh regarded them as internal invaders, as enemies within; “each enemy within is an ally of the enemy outside. The enemy outside is not to be feared. The enemy within is more to be feared, because it destroys from the inside out”\". The course textbook also states clearly that cadres and Party members must be \"responsible, dynamic and creative\" and \"dare to take responsibility before the Party and before the people\". This implies that their responsibility is not only to set an example but also to directly"},{"id":"en08-7","cd":"08","l":"D1","q":"According to Ho Chi Minh, which factor is regarded as the \"root\" of all work, deciding success or failure?","o":[["A","The correct line and policies of the Party."],["B","The skilful leadership of Party committees at all levels."],["C","The quality of the contingent of cadres."],["D","The spirit of solidarity and unity throughout the Party."],["E","The absolute support and trust of the masses."]],"a":"C","g":"The course textbook states clearly: \"cadres are the root of all work; “the success or failure of every task is due to cadres being good or poor”\". This affirms that the quality of the contingent of cadres is the key factor deciding the success or failure of all work."},{"id":"en08-8","cd":"08","l":"D1","q":"According to Ho Chi Minh Thought, what is the purpose of the activities of the Communist Party of Vietnam, such that the Party has no purpose of its own?","o":[["A","To build a just and civilised society based on the nation's traditional values."],["B","To lead the struggle for national liberation and social liberation, making the nation independent and the people truly well-fed, free and happy."],["C","To consolidate the power of the working class and the labouring strata in society."],["D","To establish lasting friendly relations with all countries in the world."],["E","To ensure rapid economic development in order to raise the country's standing in the international arena."]],"a":"B","g":"The course textbook states clearly: \"First, the purpose of the Party's activities is to lead the struggle for national liberation, social liberation, class liberation and human liberation. That is the revolutionary cause in accordance with Marxism–Leninism, making the nation independent and giving the people a truly well-fed, free and happy life, in solidarity and friendship with the peoples of the world.\" and \"The Party has no purpose of its own; the birth and development of the Party have only one purpose, which is to make the country mighty, advance to socialism and bring benefits to the people\". Option B sums up this main idea."},{"id":"en08-9","cd":"08","l":"D1","q":"Among the principles of Party building, what did Ho Chi Minh emphasise as the prerequisite for effectively implementing the principle of democratic centralism?","o":[["A","There must be absolute centralised leadership by the Party Central Committee."],["B","All Party members must absolutely submit to the truth and to the resolutions of the Party."],["C","The Party organisation must be clean and strong."],["D","There must be close supervision by the masses."],["E","An independent power-control mechanism needs to be established within the Party."]],"a":"C","g":"The course textbook states clearly: \"The prerequisite for implementing this principle [democratic centralism] is that the Party organisation must be clean and strong\". The other options may be supplementary factors but are not the \"prerequisite\" that he directly emphasised."},{"id":"en08-10","cd":"08","l":"D1","q":"Ho Chi Minh's view that \"A party without a doctrine is like a person without intelligence, or a ship without a compass\" is meant to express the core importance of which principle in the Party's activities?","o":[["A","Democratic centralism."],["B","Self-criticism and criticism."],["C","Strict and conscious discipline."],["D","Taking Marxism–Leninism as the ideological foundation and the guide for action."],["E","Solidarity and unity within the Party."]],"a":"D","g":"The course textbook affirms: \"The Party takes Marxism–Leninism as its ideological foundation and guide for action: In the work “The Revolutionary Path”, Ho Chi Minh affirmed: “For the Party to be firm, it must have a doctrine at its core; in the party everyone must understand it, everyone must follow that doctrine. A party without a doctrine is like a person without intelligence, or a ship without a compass. Nowadays there are many theories and many doctrines, but the most genuine, the most reliable and the most revolutionary doctrine is Leninism”\". The statement above speaks directly of the importance of Marxism–Leninism."},{"id":"en08-11","cd":"08","l":"D1","q":"Ho Chi Minh pointed out that for a Party, \"losing trust means losing everything\". What core requirement for the Communist Party of Vietnam can be inferred from this assessment?","o":[["A","Absolute compliance with the Constitution and the law."],["B","Always keeping itself clean and strong and maintaining close ties with the people."],["C","Constantly renewing its methods of leadership."],["D","Ensuring lasting international solidarity."],["E","Achieving outstanding economic development to improve the people's lives."]],"a":"B","g":"The course textbook emphasises: \"Losing trust means losing everything\". Just before that, the course textbook also says \"being far from the masses and having no close ties with the masses is like standing suspended in mid-air; it is bound to fail\". And the course textbook also speaks of the Party having to \"learn from the people and make the people trust it, that is, value TRUST – the people trust the Party and the Party trusts the people\". Taken together, this shows that keeping the Party clean and strong and, in particular, maintaining close ties with the people is the core of maintaining trust."},{"id":"en08-12","cd":"08","l":"D1","q":"According to Ho Chi Minh, \"the Party is not an organisation for becoming officials and getting rich\" but must fulfil the task of liberating the nation, making the Fatherland rich and strong and our compatriots well-off. Which principle of Party building does this show most clearly?","o":[["A","The Party takes Marxism–Leninism as its ideological foundation."],["B","The Party must regularly rectify itself."],["C","Democratic centralism."],["D","Solidarity and unity within the Party."],["E","Strict and conscious discipline."]],"a":"B","g":"The course textbook states clearly: \"The Party has no purpose in itself; the Party is not an organisation for becoming officials and getting rich, but the Party emerges from society and works for a rich and strong Fatherland and well-off compatriots. Therefore, regular self-rectification becomes an extremely important task in Party building\". This question leads directly to the principle of self-rectification. ------------------------------------------------------------------------"},{"id":"en08-13","cd":"08","l":"SAI","q":"According to Ho Chi Minh's thought on the Party as ethics and civilisation, which of the following is not an expression of the Party's ethics?","o":[["A","Its purpose of activity is to lead the struggle for national liberation and social liberation."],["B","Its platform and line are always loyal to the interests of the whole nation."],["C","The Party has its own purpose, which is to build a mighty state under the absolute leadership of the Party."],["D","Its contingent of Party members is imbued with revolutionary ethics and strives throughout their lives for the interests of the people and of the country."],["E","The Party belongs to the working class and the working people, the most resolute and most enthusiastic people."]],"a":"C","g":"The course textbook affirms: \"The Party has no purpose of its own; the birth and development of the Party have only one purpose, which is to make the country mighty, advance to socialism and bring benefits to the people\". Therefore, the assessment that the Party has its own purpose is wrong. Options A, B, D and E are all points that express the Party's ethics according to Ho Chi Minh."},{"id":"en08-14","cd":"08","l":"SAI","q":"Among the requirements for cadres and Party members mentioned by Ho Chi Minh, which of the following is not correct?","o":[["A","They must be absolutely loyal to the Party, ready to sacrifice personal interests for the Party."],["B","They must always study to raise their level in all respects, but need not pay too much attention to revolutionary ethics because the Party already educates them."],["C","They must have close ties with the people and be loyal servants of the people."],["D","They must always be responsible, dynamic and creative, and dare to take responsibility before the Party and the people."],["E","They must always prevent and combat negative phenomena, especially embezzlement, waste and bureaucracy."]],"a":"B","g":"The course textbook states clearly the requirement to build a contingent of cadres and Party members \"with both virtue and talent\". The course textbook specifies: \"They must always cultivate, train and improve their revolutionary ethics\" and \"They must always study to raise their level in all respects\". Saying that they \"need not pay too much attention to revolutionary ethics because the Party already educates them\" is wrong, because ethical cultivation is a regular and proactive requirement for every Party member."},{"id":"en08-15","cd":"08","l":"SAI","q":"Ho Chi Minh warned about the degeneration and moral decay of cadres and Party members. Which of the manifestations below did he not regard as a sign of degeneration and moral decay?","o":[["A","Being heavily individualistic, thinking first of personal interests in everything."],["B","Being fond of position and power, disregarding the collective and looking down on the masses."],["C","Being dynamic and creative at work, daring to take responsibility in the face of new difficulties."],["D","Shrinking from hardship, falling into embezzlement, depravity, waste and extravagance."],["E","Suffering from bureaucratism and commandism, not properly implementing the lines and policies of the Party and the State."]],"a":"C","g":"The course textbook lists the manifestations of degeneration and moral decay, such as: \"being heavily individualistic\", \"shrinking from hardship, falling into embezzlement, depravity, waste and extravagance; craving fame and seeking profit, being fond of position and power; disregarding the collective, looking down on the masses; being autocratic and despotic; suffering from bureaucratism and commandism; not being willing to study in order to progress; disunity, lack of organisation and discipline; a poor sense of responsibility; not properly implementing the lines and policies of the Party and the State\". By contrast, \"Being dynamic and creative at work, daring to take responsibility in the"},{"id":"en08-16","cd":"08","l":"SAI","q":"For the Party to be truly a civilised Party, Ho Chi Minh set out many main points. Which of the following does not fit his thought on a civilised Party?","o":[["A","The Party is a Party that embodies the conscience, intellect and honour of the nation."],["B","The Party operates within the framework of the Constitution and the law and does not stand above the nation."],["C","The Party must always be clean and strong, fulfilling the historic mission entrusted to it by the people and the nation."],["D","All class interests must be placed above the supreme interests of the nation to ensure social progress."],["E","The Party has pure international relations, protecting the interests of the Vietnamese nation while respecting the independence of other countries."]],"a":"D","g":"The course textbook states clearly: \"All activities of the Party stem from the development requirements of the nation, taking the supreme interests of the nation as paramount; all class interests must be subordinated to the development of the nation\". Therefore, the assessment that \"All class interests must be placed above the supreme interests of the nation\" is completely wrong in relation to Ho Chi Minh Thought."},{"id":"en08-17","cd":"08","l":"SAI","q":"In the principle of \"democratic centralism\", Ho Chi Minh emphasised two things to be avoided in the Party's activities for effective implementation. Which of the following is not one of those two things to be avoided?","o":[["A","Being autocratic and despotic, disregarding the collective."],["B","Relying on the collective and not daring to be decisive."],["C","Delaying and being slow in making decisions because of prolonged discussion."],["D","Lacking a harmonious combination of collective leadership and individual responsibility."],["E","An individual being in charge without the leadership of the collective."]],"a":"C","g":"The course textbook points out two things to be avoided: \"first, autocracy and despotism, disregarding the collective; second, relying on the collective and not daring to be decisive\". Option C (\"Delaying and being slow in making decisions because of prolonged discussion\") is not directly mentioned as one of those two specific things to be avoided, although it may be a negative consequence of implementing the principle. Options D and E are both different ways of expressing a failure to properly implement the two aspects of \"collective leadership, individual responsibility\", which is a concrete manifestation of avoiding autocracy or dependence."},{"id":"en08-18","cd":"08","l":"SAI","q":"Ho Chi Minh pointed out the signs of degeneration and moral decay among cadres and Party members. According to him, which of the following is not regarded as a manifestation of \"individualism\" in cadres and Party members?","o":[["A","Disregarding the collective, looking down on the masses."],["B","Being autocratic and despotic."],["C","Always placing the interests of the Party above personal interests."],["D","Shrinking from hardship, falling into embezzlement and depravity."],["E","Lacking a sense of responsibility, not properly implementing the lines and policies."]],"a":"C","g":"The course textbook lists the manifestations of individualism. The course textbook affirms: \"Party members and cadres must put the interests of the Party first and personal interests second... If the common interests of the Party conflict with the private interests of an individual, then the interests of the individual must be resolutely sacrificed for the interests of the Party\". \"Always placing the interests of the Party above personal interests\" is a positive quality, completely opposite to individualism. ------------------------------------------------------------------------"},{"id":"en08-19","cd":"08","l":"NH","q":"According to Ho Chi Minh Thought, to build the Communist Party of Vietnam into a civilised Party, which main points must be ensured? (Choose ALL correct answers)","o":[["A","The Party embodies the conscience, intellect and honour of the nation."],["B","The Party operates within the framework of the Constitution and the law and does not stand above the nation."],["C","All class interests must be subordinated to the development of the nation."],["D","The contingent of Party members, especially key cadres, must be exemplary vanguard fighters."],["E","The Party has its own purpose, which is to maintain its leadership power in all circumstances."]],"a":"ABCD","g":"The course textbook lists the main points of a civilised Party: - \"First, a civilised Party is a Party that embodies the conscience, intellect and honour of the nation\". - \"Second... all class interests must be subordinated to the development of the nation\". - \"Fourth, building a civilised Party is also shown in the Party operating within the framework of the Constitution and the law; the Party is not an organisation standing above the nation\". - \"Fifth, a civilised Party is also shown in the fact that its contingent of Party members... especially Party members holding key leadership and management positions... must all be exemplary vanguard fighters in their work and daily life\". Option E i"},{"id":"en08-20","cd":"08","l":"NH","q":"Which qualities of revolutionary ethics did Ho Chi Minh pay special attention to \"forging\" in cadres and Party members so that the Party is ethics and civilisation? (Choose ALL correct answers)","o":[["A","Industry, thrift, integrity, righteousness, and selfless impartiality."],["B","Humanity, and comradely love for one another."],["C","Loyalty to the Party, loyalty to the country, devotion to the people."],["D","A pure internationalist spirit."],["E","Excellent leadership, management and executive ability."]],"a":"ABCD","g":"The course textbook states clearly: \"He emphasised that Party members must all the more be people of humanity, “there must be comradely love for one another “; loyal to the Party, loyal to the country, devoted to the people; having the four virtues of industry, thrift, integrity and righteousness, and always selfless impartiality; having a pure internationalist spirit\". Option E is a quality of ability and talent, not an ethical quality that Ho Chi Minh focused on \"forging\" like the specific virtues of revolutionary ethics."},{"id":"en08-21","cd":"08","l":"NH","q":"According to Ho Chi Minh, which factors make up the strength of a communist party, enabling the Party, \"though numerous, to advance into battle as one person\"? (Choose ALL correct answers)","o":[["A","Strict and conscious discipline."],["B","Unanimity in thought and action."],["C","Close solidarity, being of one heart and one mind."],["D","The foundation of Marxism–Leninism."],["E","Maximum promotion of Party members' individual freedom."]],"a":"ABCD","g":"The course textbook says about discipline: \"The strength of a communist party originates from discipline, from ten thousand people acting as one, with the same will and action. Ho Chi Minh held that although our Party is numerous, when it advances into battle it is as one person. That is thanks to the discipline within the Party... This discipline means that thought must be unanimous and action must be unanimous. This discipline comes from Party members' conscious awareness...\". The course textbook adds on solidarity: \"Thanks to close solidarity, with one heart and one mind serving the class, serving the people and serving the Fatherland, since its founding our Party has united, organised an"},{"id":"en08-22","cd":"08","l":"NH","q":"In cadre work, which things did Ho Chi Minh require to be done to ensure that the contingent is effective and clean? (Choose ALL correct answers)","o":[["A","Understand and assess cadres correctly."],["B","Pay attention to training cadres in a practical and effective way."],["C","Combine young cadres with veteran cadres to bring into play both experience and youthful energy."],["D","Prevent and combat negative phenomena in cadre work."],["E","Place absolute trust in cadres' capacity for self-improvement, with no need for regular checks."]],"a":"ABCD","g":"The course textbook lists the requirements in cadre work: \"one must understand and assess cadres correctly; must pay attention to training cadres, training them in a practical and effective way; must promote cadres correctly; must arrange and use cadres correctly; must combine cadres sent from higher levels with local cadres; must combat the disease of parochial localism; must combine young cadres with veteran cadres; must prevent and combat negative phenomena in cadre work; must regularly check and help cadres\". Option E is wrong, because he required that one \"must regularly check and help cadres\"."},{"id":"en08-23","cd":"08","l":"NH","q":"According to Ho Chi Minh, when speaking of the relationship between the Communist Party of Vietnam and the people, which of the following points did he especially emphasise? (Choose ALL correct answers)","o":[["A","The Party must be the leader and the truly loyal servant of the people."],["B","The Party has no interests other than those of the nation and of the Fatherland."],["C","The people only truly know the value of freedom and independence when they have enough to eat and to wear."],["D","The Party must learn from the masses but not tail behind the masses, and at the same time must pay attention to raising the level of the masses."],["E","The Party should keep a certain distance from the masses in order to maintain respect and its leadership prestige."]],"a":"ABCD","g":"- The course textbook states: \"The Party must be worthy of being the leader and the truly loyal servant of the people\". - The course textbook emphasises: \"Apart from the interests of the nation and of the Fatherland, the Party has no other interests\". - The course textbook states clearly: \"The people only truly know the value of freedom and of independence when they have enough to eat and to wear.\" - The course textbook affirms: \"The Party “learns from the masses but does not tail behind the masses”, and must pay attention to raising the level of the masses\". Option E is completely wrong, because Ho Chi Minh warned that \"being far from the masses and having no close ties with the masses is l"},{"id":"en08-24","cd":"08","l":"NH","q":"Which of the manifestations below did Ho Chi Minh identify as signs of individualism among some cadres and Party members of \"poor ethics and qualities\"? (Choose ALL correct answers)","o":[["A","Craving fame and seeking profit, being fond of position and power."],["B","Lacking organisation and discipline, disunity."],["C","Always showing the spirit of \"not arrogant in victory, not discouraged in defeat\" in all circumstances."],["D","Disregarding the collective, looking down on the masses."],["E","A poor sense of responsibility, not properly implementing the lines and policies of the Party and the State."]],"a":"ABDE","g":"The course textbook lists the manifestations of individualism: \"craving fame and seeking profit, being fond of position and power\"; \"disregarding the collective, looking down on the masses\"; \"disunity, lack of organisation and discipline\"; \"a poor sense of responsibility; not properly implementing the lines and policies of the Party and the State\". Option C (\"not arrogant in victory, not discouraged in defeat\") is a positive quality of cadres and Party members, showing resilience and a desire to progress, which is the opposite of individualism. ------------------------------------------------------------------------"},{"id":"en08-25","cd":"08","l":"DK","q":"Ho Chi Minh affirmed: \"Our Party is ethics, is _______\". This is one of his core ideas on building a clean and strong Party.","o":[["A","revolution"],["B","civilisation"],["C","justice"],["D","intellect"],["E","the people"]],"a":"B","g":"The course textbook records: \"In his speech at the ceremony marking the 30th anniversary of the founding of the Party (in 1960), Ho Chi Minh affirmed: “Our Party is ethics, is civilisation”\"."},{"id":"en08-26","cd":"08","l":"DK","q":"According to Ho Chi Minh, the Party \"must keep our Party truly clean, must be worthy of being the leader, the truly loyal _______ of the people\".","o":[["A","chief"],["B","representative"],["C","servant"],["D","fighter"],["E","public servant"]],"a":"C","g":"The course textbook writes: \"We must keep our Party truly clean, must be worthy of being the leader, the truly loyal servant of the people\"."},{"id":"en08-27","cd":"08","l":"DK","q":"In his Testament, Ho Chi Minh emphasised: \"There must be comradely _______ for one another\" to consolidate the solidarity and unity of the Party, especially in the process of self-criticism and criticism.","o":[["A","respect"],["B","support"],["C","trust"],["D","love"],["E","understanding"]],"a":"D","g":"The course textbook cites Ho Chi Minh's words in his Testament: \"Within the Party, practising broad democracy and regular and serious self-criticism and criticism is the best way to consolidate the solidarity and unity of the Party. There must be comradely love for one another”."},{"id":"en08-28","cd":"08","l":"DK","q":"Ho Chi Minh held that \"The Party has no purpose in itself; the Party is not an organisation for becoming officials and getting rich, but the Party emerges from society and works for a rich and strong Fatherland and _______ compatriots\".","o":[["A","progressive"],["B","happy"],["C","well-off"],["D","civilised"],["E","independent"]],"a":"C","g":"The course textbook states: \"The Party has no purpose in itself; the Party is not an organisation for becoming officials and getting rich, but the Party emerges from society and works for a rich and strong Fatherland and well-off compatriots\"."},{"id":"en08-29","cd":"08","l":"DK","q":"In \"Reforming the Way of Working\", Ho Chi Minh set out 12 points on the character of a genuinely revolutionary party, including Point 10: \"The Party must always _______ depraved elements out\".","o":[["A","eliminate"],["B","filter"],["C","purge"],["D","educate"],["E","isolate"]],"a":"C","g":"The course textbook cites Point 10 of the work \"Reforming the Way of Working\": \"The Party must always purge depraved elements out\"."},{"id":"en08-30","cd":"08","l":"DK","q":"Ho Chi Minh warned: \"being far from the masses and having no close ties with the masses is like standing suspended in mid-air; it is bound to _______\". Losing trust means losing everything.","o":[["A","weaken"],["B","become backward"],["C","become isolated"],["D","fail"],["E","degenerate"]],"a":"D","g":"The course textbook affirms: “‘being far from the masses and having no close ties with the masses is like standing suspended in mid-air; it is bound to fail”\"."},{"id":"en09-1","cd":"09","l":"DS","q":"According to Ho Chi Minh Thought, the newly established Vietnamese State has the nature of a \"classless\" state in order to unite the whole nation.","o":[],"a":"S","g":"The course textbook affirms: \"The Vietnamese State is a democratic state, but it is by no means a “state of the whole people”, understood in the sense of a classless state. A state, everywhere and at all times, bears the nature of a particular class. The new Vietnamese State... is a state bearing the nature of the working class.\""},{"id":"en09-2","cd":"09","l":"DS","q":"According to Ho Chi Minh Thought, the principle of \"democratic centralism\" in the organisation and operation of the Vietnamese State only emphasises the need to promote the concentration of power to the highest degree in order to ensure unity.","o":[],"a":"S","g":"The course textbook states clearly: \"Ho Chi Minh paid great attention to both aspects, democracy and centralism, in the organisation and operation of the whole apparatus and all state bodies. He emphasised the need to promote democracy to the highest degree, while also emphasising the need to promote centralism to the highest degree\". Therefore, emphasising only centralism while ignoring democracy is not consistent with his thought."},{"id":"en09-3","cd":"09","l":"DS","q":"Ho Chi Minh held that indirect democracy is the most complete form for the people to exercise power, because it allows them to choose the most outstanding representatives.","o":[],"a":"S","g":"The course textbook points out: \"Ho Chi Minh always valued the form of direct democracy and created every favourable condition for practising direct democracy, because this is the most complete form of democracy.\" Thus it is direct democracy, not indirect democracy, that is the most complete form."},{"id":"en09-4","cd":"09","l":"DS","q":"In Ho Chi Minh's thought on a State of the people, the law only has the role of reflecting the aspirations of the people and is not a tool for controlling state power.","o":[],"a":"S","g":"The course textbook affirms: \"That law belongs to the people, is a tool for exercising the power of the people, and is a means of controlling state power.\" Therefore, the law both reflects the aspirations and protects the interests of the people, and is a means of controlling state power."},{"id":"en09-5","cd":"09","l":"DS","q":"The view \"the people are the masters\" in Ho Chi Minh Thought defines the position of the people as the supreme subject in relation to state power, while \"the people act as masters\" emphasises the rights and obligations of the people in their capacity as masters.","o":[],"a":"D","g":"The course textbook states clearly: \"The principle “the people are the masters” affirms that the position of supreme subject of all power belongs to the people.\" The course textbook also states: \"“The people are the masters” defines the position of the people in relation to state power, while “the people act as masters emphasises the rights and obligations of the people in their capacity as masters.\""},{"id":"en09-6","cd":"09","l":"DS","q":"For a state official to be truly \"for the people\", Ho Chi Minh only required them to have a spirit of selfless impartiality and dedication, making no demands regarding intellectual capacity or far-sighted vision.","o":[],"a":"S","g":"The course textbook describes the qualities of officials \"for the people\" as including both \"being servants\" (loyalty, dedication, industry, thrift, integrity, righteousness, selfless impartiality, being the first to worry and the last to enjoy) and \"being leaders\" (superior intellect, clear-mindedness, wisdom, far-sightedness, closeness to the people, making good use of talented and virtuous people). This shows the requirement of both virtue and talent."},{"id":"en09-7","cd":"09","l":"D1","q":"According to Ho Chi Minh, the working-class nature of the State of the Democratic Republic of Vietnam is shown not only in the leading role of the Communist Party but also in which of the following basic aspects?","o":[["A","A clear separation of powers among the legislative, executive and judicial branches."],["B","Guaranteeing absolute self-determination for every class in society."],["C","The socialist orientation in the country's development."],["D","Completely excluding the influence of other classes from the state apparatus."],["E","Concentrating power in the hands of the Government to the maximum degree."]],"a":"C","g":"The course textbook states clearly: \"Second, the class nature of the Vietnamese State is shown in its socialist orientation in the country's development. Taking the country to socialism and communism was Ho Chi Minh's consistent revolutionary goal.\" Options A, B, D and E do not correctly reflect his thought."},{"id":"en09-8","cd":"09","l":"D1","q":"In his thought on the new State, how did Ho Chi Minh resolve the relationship between the national question and the class question in the Vietnamese revolution?","o":[["A","Placing the class question above the national question, valuing the interests of the working class over those of the whole people."],["B","Completely separating the national question from the class question and considering them independently."],["C","Regarding the working-class nature of the State as unified with its popular character and national character."],["D","Focusing mainly on consolidating the working-class nature and paying little attention to the national character."],["E","Defining national interests as merely auxiliary to the interests of the working class."]],"a":"C","g":"The course textbook affirms: \"In the Vietnamese State, the working-class nature is unified with the popular character and the national character. Ho Chi Minh very successfully resolved the relationship between the national question and the class question in the Vietnamese revolution.\""},{"id":"en09-9","cd":"09","l":"D1","q":"According to Ho Chi Minh Thought, regarding the form of indirect democracy, how are the position of the people and their relationship with state officials defined?","o":[["A","State officials are the supreme representatives, holding power in their own right."],["B","The people are the subject holding all power; officials are public servants of the people."],["C","State officials and the people have an equal relationship in terms of power."],["D","The people only have the right to vote, not the right to control the activities of officials."],["E","State power is completely independent of the people's entrustment."]],"a":"B","g":"The course textbook states: \"State power is “held by delegation” from the people. The State has no power in itself. The power of the State is entrusted by the people. Therefore, the bodies of state power together with the contingent of officials “are all public servants of the people...\" and emphasises: \"Here, Ho Chi Minh clearly defined the position of and the relationship between the people and state officials on the basis that the people are the subject holding all power.\""},{"id":"en09-10","cd":"09","l":"D1","q":"In the view of a \"State by the people\", what did Ho Chi Minh emphasise as necessary for the people to perform their role as masters well?","o":[["A","The people need to obey all orders of the State without needing to understand them clearly."],["B","The State must proclaim all the people's rights as masters without needing to prepare their capacity."],["C","The State needs to attach importance to educating the people, and the people must consciously strive to have sufficient capacity to act as masters."],["D","Only people with a high level of education can take part in state affairs."],["E","The State needs to concentrate all power in order to make decisions on behalf of the people."]],"a":"C","g":"The course textbook states clearly: \"A State by the people needs to attach importance to educating the people, while the people must also consciously strive to have sufficient capacity to exercise their democratic rights. Ho Chi Minh said: \"We are working people who are masters of the country. To be good masters, we must have the capacity to be masters”.\""},{"id":"en09-11","cd":"09","l":"D1","q":"According to Ho Chi Minh, what is the most basic yardstick for assessing whether a State is truly \"for the people\"?","o":[["A","The level of economic wealth and strength of the country."],["B","The number of laws enacted to manage society."],["C","The support and trust of the people (winning the people's hearts)."],["D","The ability to control and limit the personal power of officials."],["E","The full performance of democratic rituals in management."]],"a":"C","g":"The course textbook states clearly: \"According to Ho Chi Minh, the yardstick of a State for the people is that it must win the people's hearts. Ho Chi Minh put it to state officials that they must strive to win the people's hearts, so that the people trust them, like them and love them.\""},{"id":"en09-12","cd":"09","l":"D1","q":"Which state officials did Ho Chi Minh sharply criticise?","o":[["A","Officials who are too devoted to their work, forgetting personal interests."],["B","Officials who dare not make bold decisions for fear of making mistakes."],["C","Officials who have degenerated and morally decayed, turning from public servants of the people into \"revolutionary mandarins\" standing above the people."],["D","Officials who focus only on doing things that directly benefit the people."],["E","Officials of outstanding intellect who are not close to the people."]],"a":"C","g":"The course textbook states: \"That is why Ho Chi Minh fiercely criticised state officials who had degenerated and morally decayed, turning from public servants of the people into “revolutionary mandarins”, standing above the people, looking down on the people, “throwing their weight around” with the people, “forgetting that the people elected them to work for the people”.\""},{"id":"en09-13","cd":"09","l":"SAI","q":"Among the following assessments of the class nature of the Vietnamese State according to Ho Chi Minh Thought, which one is WRONG?","o":[["A","The State of the Democratic Republic of Vietnam is not a state of the whole people in the sense of a classless state."],["B","The Communist Party of Vietnam holding the position and role of the ruling party is an expression of the working-class nature."],["C","The socialist orientation in the country's development is the consistent goal of the State."],["D","The working-class nature of the State is completely separate from its popular character and national character."],["E","The principle of democratic centralism is the principle of organisation and operation of the State."]],"a":"D","g":"The course textbook affirms: \"In the Vietnamese State, the working-class nature is unified with the popular character and the national character.\" This directly refutes assessment D."},{"id":"en09-14","cd":"09","l":"SAI","q":"Which of the following assessments does NOT correctly reflect the ways in which the Communist Party of Vietnam rules, according to Ho Chi Minh Thought?","o":[["A","By institutionalising the Party's line, views and policies into law."],["B","Through the activities of Party organisations and Party members in the state apparatus."],["C","Through inspection and supervision work."],["D","By directly appointing all senior state officials."],["E","By leading the core of the people, namely the worker–peasant–intellectual alliance."]],"a":"D","g":"The course textbook lists three methods by which the Party rules: \"(1) Through its line, views and policies, for the State to institutionalise into laws, policies and plans; (2) Through the activities of its Party organisations and Party members in the state apparatus and bodies; (3) Through inspection work.\" \"Directly appointing all senior state officials\" is not mentioned as one of the official or overarching methods of rule, and it contradicts the principle of democracy."},{"id":"en09-15","cd":"09","l":"SAI","q":"According to Ho Chi Minh's thought on a State of the people, which of the following assessments about state power is NOT accurate?","o":[["A","State power is entrusted by the people, not held in its own right."],["B","The people are the supreme subject holding all power."],["C","State officials are public servants of the people, shouldering common affairs for the people."],["D","The State has the right to dissolve power institutions if the people lose confidence in them."],["E","Democratic law is a tool for the people to control state power."]],"a":"D","g":"The course textbook states clearly: \"The people have the right to control and criticise the State, the right to recall the deputies whom they have chosen and elected, and the right to dissolve the power institutions they have established.\" Thus the right to dissolve power institutions belongs to the people, not to the State."},{"id":"en09-16","cd":"09","l":"SAI","q":"When discussing a State by the people, Ho Chi Minh affirmed a number of obligations of the people in their capacity as masters, EXCEPT which of the following?","o":[["A","Obeying the laws of the State."],["B","Observing labour discipline and public order."],["C","Enthusiastically taking part in common affairs and protecting public property."],["D","Prioritising personal interests over the common interests of the State."],["E","Making contributions (paying taxes) on time and in full to build the common interest."]],"a":"D","g":"The course textbook lists the obligations of the people, such as obeying the law, observing labour discipline, maintaining public order, making contributions (paying taxes), taking part in common affairs, and protecting public property and the Fatherland. \"Prioritising personal interests over the common interests of the State\" clearly contradicts the general spirit of a citizen acting as master and is not mentioned."},{"id":"en09-17","cd":"09","l":"SAI","q":"According to Ho Chi Minh's view on a State for the people, which of the following assessments about state officials is WRONG?","o":[["A","Officials are both servants and leaders of the people."],["B","Officials must have both virtue and talent, being both virtuous and wise."],["C","Officials only need to do things that directly benefit the people and avoid things that cause initial difficulties."],["D","Officials must have loyalty, dedication, industry, thrift, integrity, righteousness, and selfless impartiality."],["E","Officials must have superior intellect, clear-mindedness and wisdom, and be far-sighted."]],"a":"C","g":"The course textbook contains the passage: \"Only in this way can they “not only do things that directly benefit the people, but sometimes also do things that at first sight seem to harm the people”13, but that in essence serve the overall interest and the long-term interests of the people.\" This shows that officials are not limited to doing only what brings direct benefit."},{"id":"en09-18","cd":"09","l":"SAI","q":"Which of the following assessments is NOT a feature of the new Vietnamese State set out in Ho Chi Minh Thought?","o":[["A","The State was born as the result of the long struggle of the whole nation."],["B","The State always perseveres consistently with the goal of serving the interests of the people, taking the interests of the nation as its foundation."],["C","The State takes on the task of organising the people to wage resistance wars to protect independence."],["D","The State was established on the basis of prioritising the interests of a specific class without regard for the whole people."],["E","The path of transition to socialism is the cause of the State itself."]],"a":"D","g":"The course textbook affirms that \"the working-class nature of the State is unified with the popular character and the national character\" and that \"The new Vietnamese State, therefore, does not belong to any particular class or stratum alone, but belongs to the people.\" Assessment D directly contradicts this."},{"id":"en09-19","cd":"09","l":"NH","q":"According to Ho Chi Minh Thought, which of the following points show the unity of the working-class nature with the popular character and the national character of the Vietnamese State?","o":[["A","The State was born as the result of the long struggle of the entire nation."],["B","The State perseveres consistently with the goal of serving the interests of the people, taking the interests of the nation as its foundation."],["C","The fundamental interests of the working class are unified with the interests of the people and of the whole nation."],["D","The State takes on the task of organising the people to wage resistance and build the country."],["E","The State focuses only on serving the interests of the working class."]],"a":"ABCD","g":"Points A, B, C and D are all clearly stated in the course textbook,,. Specifically, the course textbook speaks of the result of the struggle of the whole nation. The course textbook speaks of the goal of serving the interests of the people and of the unity of interests. The course textbook speaks of the task that the State takes on. Answer E is wrong because it contradicts Ho Chi Minh's thought on this unity."},{"id":"en09-20","cd":"09","l":"NH","q":"Which of the following statements by Ho Chi Minh clearly express his thought that state officials are \"public servants of the people\"?","o":[["A","\"The President, ministers, deputy ministers and members of this or that body serve as servants of the people.\""],["B","\"Our country is a democratic country; the highest position belongs to the people, because the people are the masters.\""],["C","\"From the person who sweeps the house and cooks the meals to the President of a country, all are assigned to serve as servants of the people.\""],["D","\"State power is “held by delegation” from the people.\""],["E","\"The people have the right to recall deputies of the National Assembly if they are unworthy.\""]],"a":"AC","g":"Statements A and C are quoted directly in the course textbook to illustrate the idea that officials are \"servants\" of the people. Statement B states the position of the people, statement D states the origin of state power, and statement E states the people's right of control; all are related, but A and C directly express the role of \"public servants of the people\"."},{"id":"en09-21","cd":"09","l":"NH","q":"According to Ho Chi Minh Thought, which behaviours of state officials would be fiercely criticised for going against the principle of \"public servants of the people\"?","o":[["A","Standing above the people, looking down on the people."],["B","\"Throwing their weight around\" with the people, abusing their position to act high-handedly."],["C","Forgetting that the people elected them to work for the people."],["D","Degenerating and morally decaying, turning into \"revolutionary mandarins\"."],["E","Always trying to do things that directly benefit the people while ignoring long-term interests."]],"a":"ABCD","g":"The course textbook lists the behaviours that were criticised: \"degenerating and morally decaying, turning from public servants of the people into “revolutionary mandarins”, standing above the people, looking down on the people, “throwing their weight around” with the people, “forgetting that the people elected them to work for the people”.\" Answer E is not a behaviour that is fiercely criticised, but part of an official's work that may require consideration in order to balance immediate and long-term interests."},{"id":"en09-22","cd":"09","l":"NH","q":"Which of the following points express \"Ho Chi Minh's thoroughgoing democratic thought when speaking of a State by the people\"?","o":[["A","Only proclaiming the people's right to be masters."],["B","Bringing the people into state affairs."],["C","Preparing the people's capacity to act as masters."],["D","Encouraging the people to prepare their capacity to act as masters well."],["E","The people's right to be masters is innate and requires no education."]],"a":"BCD","g":"The course textbook states: \"A State by the people not only proclaims the people's right to be masters, nor only brings the people into state affairs, but also prepares the people and encourages them to prepare well their capacity to act as masters; that view expresses Ho Chi Minh's thoroughgoing democratic thought when speaking of a State by the people.\" Therefore, A is insufficient and E is wrong."},{"id":"en09-23","cd":"09","l":"NH","q":"According to Ho Chi Minh Thought, for a state official to be truly \"for the people\", which of the following qualities must they have?","o":[["A","Loyalty, dedication, industry, thrift, integrity, righteousness, and selfless impartiality."],["B","Being the first to worry and the last to enjoy."],["C","Superior intellect, clear-mindedness, wisdom and far-sightedness."],["D","Closeness to the people and making good use of talented and virtuous people."],["E","Complete independence from the will of the people in order to make objective decisions."]],"a":"ABCD","g":"The course textbook lists the qualities officials need to have, including loyalty, dedication, industry, thrift, integrity, righteousness, selfless impartiality, being the first to worry and the last to enjoy (the \"servant\" aspect) and intellect, clear-mindedness, wisdom, far-sightedness, closeness to the people and making good use of talented and virtuous people (the \"leader\" aspect). Answer E contradicts the principle that state power is \"held by delegation\" from the people."},{"id":"en09-24","cd":"09","l":"NH","q":"According to Ho Chi Minh, what are the basic features of the law in the new Vietnamese State?","o":[["A","It reflects the aspirations of the people."],["B","It protects the interests of the people."],["C","It belongs to the people."],["D","It is a tool for exercising the power of the people."],["E","It is a means of controlling state power."]],"a":"ABCDE","g":"The course textbook states clearly: \"the fundamental difference between the law in the new Vietnamese State and the law of states under bourgeois and feudal regimes lies in the fact that it reflects the aspirations and protects the interests of the people. That law belongs to the people, is a tool for exercising the power of the people, and is a means of controlling state power.\" All 5 options are correct."},{"id":"en09-25","cd":"09","l":"DK","q":"In Ho Chi Minh's view, the new Vietnamese State – the State of the Democratic Republic of Vietnam – is a state bearing the nature of the (1) _______ class, but it is by no means a “state of the (2) _______”, understood in the sense of a (3) _______ state.","o":[["A","(1) people's; (2) whole people; (3) classless"],["B","(1) working; (2) people; (3) classless"],["C","(1) people's; (2) workers; (3) classless"],["D","(1) working; (2) whole people; (3) classless"],["E","(1) working; (2) whole people; (3) socialist-oriented"]],"a":"D","g":"The course textbook records: \"The Vietnamese State is a democratic state, but it is by no means a “state of the whole people”, understood in the sense of a classless state. A state, everywhere and at all times, bears the nature of a particular class. The new Vietnamese State... is a state bearing the nature of the working class.\""},{"id":"en09-26","cd":"09","l":"DK","q":"One of the aspects showing the working-class nature of the Vietnamese State is its _______ in the country's development, with the consistent goal of taking the country to socialism and communism.","o":[["A","socialist orientation"],["B","direct democracy"],["C","classlessness"],["D","capacity for mastery"],["E","indirect democracy"]],"a":"A","g":"The course textbook states: \"Second, the class nature of the Vietnamese State is shown in its socialist orientation in the country's development. Taking the country to socialism and communism was Ho Chi Minh's consistent revolutionary goal.\""},{"id":"en09-27","cd":"09","l":"DK","q":"In the form of indirect democracy, state power is “held by (1) _______” from the people; therefore the bodies of state power together with the contingent of officials “are all public servants of the people, that is, to shoulder common affairs for the people, not to oppress the people” and act as (2) _______.","o":[["A","(1) entrustment; (2) revolutionary mandarins"],["B","(1) delegation; (2) revolutionary mandarins"],["C","(1) delegation; (2) servants"],["D","(1) control; (2) servants"],["E","(1) control; (2) revolutionary mandarins"]],"a":"C","g":"The course textbook states: “State power is ‘held by delegation’ from the people. The State has no power in itself. The power of the State is entrusted by the people.” The course textbook quotes Ho Chi Minh: “If the people are the masters, then what are the President, ministers, deputy ministers and this or that member there to do? To be servants. To be servants of the people, not revolutionary mandarins”. So blank (1) is “delegation” (the phrase “held by delegation”) and blank (2) is “servants”."},{"id":"en09-28","cd":"09","l":"DK","q":"To ensure that all power always remains in the hands of the people, Ho Chi Minh affirmed that the people have the right to (1) _______ and criticise the State, the right to (2) _______ the deputies whom they have chosen and elected, and the right to dissolve the power institutions they have established.","o":[["A","(1) inspect; (2) recall"],["B","(1) control; (2) inspect"],["C","(1) recall; (2) control"],["D","(1) inspect; (2) control"],["E","(1) control; (2) recall"]],"a":"E","g":"The course textbook records: \"The people have the right to control and criticise the State, the right to recall the deputies whom they have chosen and elected, and the right to dissolve the power institutions they have established.\""},{"id":"en09-29","cd":"09","l":"DK","q":"In the view of a \"State by the people\", Ho Chi Minh pointed out that \"the people are the masters\" defines the position of the people in relation to state power, while \"the people act as masters\" emphasises the (1) _______ and (2) _______ of the people in their capacity as masters.","o":[["A","(1) rights; (2) capacity for mastery"],["B","(1) rights; (2) obligations"],["C","(1) capacity for mastery; (2) intellect"],["D","(1) obligations; (2) intellect"],["E","(1) intellect; (2) capacity for mastery"]],"a":"B","g":"The course textbook states: \"“The people are the masters” defines the position of the people in relation to state power, while “the people act as masters emphasises the rights and obligations of the people in their capacity as masters.\""},{"id":"en09-30","cd":"09","l":"DK","q":"According to Ho Chi Minh, the yardstick of a State for the people is that it must (1) _______, and he required officials to strive to win the people's hearts, so that the people trust them, like them and love them. To achieve this, one must first love the people, place the interests of the people above everything, and have a spirit of (2) _______.","o":[["A","(1) seek freedom and happiness; (2) selfless impartiality"],["B","(1) win the people's hearts; (2) intellect"],["C","(1) seek freedom and happiness; (2) capacity for mastery"],["D","(1) win the people's hearts; (2) selfless impartiality"],["E","(1) be selflessly impartial; (2) intellect"]],"a":"D","g":"The course textbook records: \"According to Ho Chi Minh, the yardstick of a State for the people is that it must win the people's hearts.\" The course textbook adds: \"to be loved by the people and to win the people's hearts, one must first love the people, place the interests of the people above everything, and have a spirit of selfless impartiality.\""},{"id":"en10-1","cd":"10","l":"DS","q":"Ho Chi Minh identified \"individualism\" as the \"root disease\" that gives rise to the diseases of embezzlement and waste in the state apparatus.","o":[],"a":"S","g":"The course textbook affirms that the disease of bureaucratism is \"the root disease that gives rise to the diseases of embezzlement and waste\". Meanwhile, the course textbook identifies \"individualism\" as the \"mother disease\" that leads to negative phenomena. There is a clear distinction between the \"mother disease\" and the \"root disease\" in his thought on the underlying causes of negative phenomena."},{"id":"en10-2","cd":"10","l":"DS","q":"One of the prerequisites for the Communist Party of Vietnam's control of state power to achieve good results is that those who carry out the control must hold high positions in order to ensure deterrence.","o":[],"a":"S","g":"According to the course textbook, Ho Chi Minh pointed out that the two conditions for control to achieve good results are that \"control must be systematic and those who carry out the control must be people of great prestige\"; there is no mention of such people having to hold high positions. Prestige is a personal quality and is not the same as rank or position."},{"id":"en10-3","cd":"10","l":"DS","q":"Ho Chi Minh Thought on the rule-of-law state showed at a very early stage an emphasis on replacing government by decree with government by law, as clearly stated in the Demands of the Annamese People of 1919.","o":[],"a":"D","g":"The course textbook clearly records that, in the Demands of the Annamese People of 1919, one of the demands was \"To replace government by decree with government by law\". This shows the consistency of Ho Chi Minh Thought on building a constitutional and lawful State with a solid legal foundation from a very early stage."},{"id":"en10-4","cd":"10","l":"DS","q":"Ho Chi Minh held that legal education should focus mainly on the younger generation in order to build a firm awareness of the rule of law for the future.","o":[],"a":"S","g":"The course textbook points out that \"legal education for everyone, especially for the younger generation, becomes extremely important\". This means that legal education must be carried out for everyone, not only for the younger generation, even though he emphasised the special importance of educating the younger generation in order to build the rule-of-law state."},{"id":"en10-5","cd":"10","l":"D1","q":"According to Ho Chi Minh Thought, which factor did he regard as the most important in the State's management of its apparatus and administration of society?","o":[["A","Management through a cumbersome administrative apparatus."],["B","Management through economic and social measures."],["C","Management by the Constitution and by law in general."],["D","Management through decrees issued as emergency measures."],["E","Management through the personal influence and prestige of the leader."]],"a":"C","g":"The course textbook clearly states: \"In Ho Chi Minh Thought, the State manages through its apparatus and through many different measures, but the most important is management by the Constitution and by law in general.\" This is a core principle of the rule-of-law state."},{"id":"en10-6","cd":"10","l":"D1","q":"According to Ho Chi Minh's view of a \"humane rule of law\", what is the highest goal towards which the revolutionary cause of the Vietnamese nation is directed?","o":[["A","Fighting to win complete independence and national sovereignty."],["B","Building a State with strict discipline and an effective apparatus."],["C","Liberating human beings, enabling everyone to have a happy and free life worthy of their dignity."],["D","Abolishing all the harsh laws of the old regime and establishing a new order."],["E","Raising the educational level of the whole people and their awareness of observing the law."]],"a":"C","g":"The course textbook affirms: \"the goal of liberating human beings, enabling everyone to have a happy and free life worthy of human dignity and to enjoy human rights in the fullest way, has become organically fused with and turned into the highest goal of the revolutionary cause of the Vietnamese nation.\" The other options are all important aspects but are not the supreme goal that is clearly stated."},{"id":"en10-7","cd":"10","l":"D1","q":"The General Election of 6 January 1946, a momentous historic event, was conducted with which features to ensure democracy and express the supreme power of the people?","o":[["A","Open, direct voting under the supervision of the Allied forces."],["B","Universal suffrage, indirect voting and open ballots."],["C","Universal suffrage, direct voting and secret ballots."],["D","Voting by representatives of the major classes and religions."],["E","Voting as designated by the Provisional Government."]],"a":"C","g":"The course textbook clearly describes: \"The General Election was successfully held on 6 January 1946 under universal suffrage, with direct voting and secret ballots.\" These are the basic features that made this election democratic and progressive, the first of its kind in the history of Vietnam and of Southeast Asia."},{"id":"en10-8","cd":"10","l":"D1","q":"According to Ho Chi Minh, what is the \"root disease\" from which the diseases of embezzlement and waste in the state apparatus arise?","o":[["A","Individualism."],["B","Privileges and perks."],["C","Bureaucratism."],["D","Favouritism, divisiveness and arrogance."],["E","The still low educational level of the people."]],"a":"C","g":"The course textbook points out: \"Thus the disease of bureaucratism has nurtured, tolerated and sheltered embezzlement and waste. Therefore, this is the root disease that gives rise to the diseases of embezzlement and waste; to eradicate embezzlement and waste completely, we must first cleanse away the disease of bureaucratism.\" This emphasises the central role of bureaucratism in creating the conditions for other negative phenomena to develop."},{"id":"en10-9","cd":"10","l":"SAI","q":"Which of the following statements is NOT CORRECT about Ho Chi Minh's view on the humanistic character of law in the humane rule-of-law state?","o":[["A","Law encourages goodness, taking the education, moral persuasion and awakening of people as its basic purpose."],["B","Law must fully recognise and thoroughly protect human rights."],["C","Law must be strict but at the same time objective and fair, opposing the barbaric treatment of human beings."],["D","Law is based on the moral foundation of society, and moral values must permeate every provision."],["E","Law permits the penalty of massacre to be applied to traitors to the Fatherland as a deterrent."]],"a":"E","g":"The course textbook clearly states that the humanistic character of the legal system is shown in \"absolutely opposing the barbaric treatment of human beings.\" Even with regard to traitors to the Fatherland, Ho Chi Minh clearly declared: \"The Government of Vietnam will pardon or punish them according to the law, depending on their attitude now and in the future. But no one will be massacred\". Therefore, option E is completely contrary to Ho Chi Minh Thought."},{"id":"en10-10","cd":"10","l":"SAI","q":"Among the measures to prevent and combat negative phenomena in the state apparatus according to Ho Chi Minh Thought, which of the following is NOT regarded as a fundamental and long-term solution?","o":[["A","Raising the level of democracy in society and practising democracy widely."],["B","Promoting the people's right to mastery thoroughly."],["C","Focusing only on punishing all negative acts very severely and strictly, without any need to pay attention to education."],["D","The State's laws and the Party's discipline must be extremely strict."],["E","Moral education, building a system of ethical standards for those in power and awakening conscience."]],"a":"C","g":"The course textbook affirms that \"raising the level of democracy in society, practising democracy widely and promoting the people's right to mastery is the fundamental and long-term solution.\" The course textbook also points out: \"strict, stern punishment of the right person for the right offence is necessary, but punishing in every case is not right. Education must be valued, taking education and moral persuasion as the main approach.\" Therefore, option C, with its emphasis on severe punishment alone without attention to education, is inconsistent with his thought."},{"id":"en10-11","cd":"10","l":"SAI","q":"Which of the following is NOT a manifestation of the disease of bureaucratism according to Ho Chi Minh?","o":[["A","Leading cadres are out of touch with actual work and do not monitor or educate lower-level cadres."],["B","Leading bodies value formality, do not examine all aspects and do not go deeply into each issue."],["C","Only holding meetings, writing directives and reading reports on paper without checking things through to the end."],["D","Deliberately grabbing public funds and abusing one's position and power for personal gain."],["E","Cadres are not close to the masses and do not grasp the thoughts and aspirations of the people."]],"a":"D","g":"The course textbook describes the manifestations of the disease of bureaucratism as including points A, B, C and E. Option D, \"Deliberately grabbing public funds and abusing one's position and power for personal gain\", is a manifestation of \"privileges and perks\" or \"embezzlement\" mentioned in the course textbook, not a direct manifestation of the disease of bureaucratism, although bureaucratism can create conditions for embezzlement and waste to develop."},{"id":"en10-12","cd":"10","l":"SAI","q":"Which of the following does NOT correctly reflect one of Ho Chi Minh's contributions to the legislative work of the State of the Democratic Republic of Vietnam?","o":[["A","Twice taking part in leading the drafting of the Constitution (the 1946 Constitution and the 1959 Constitution)."],["B","Signing orders to promulgate 16 laws while the country was simultaneously waging the resistance war and building the nation."],["C","Signing orders to promulgate 613 decrees, of which 243 regulated the organisation of the State and the law."],["D","Immediately issuing a Decree setting the death penalty for embezzlement and theft only a few days after the Declaration of Independence (2 September 1945)."],["E","Paying attention to building a democratic, modern legal system from the very first days of the nation's founding."]],"a":"D","g":"The course textbook confirms Ho Chi Minh's legislative activities such as A, B, C and E. However, the Decree setting the penalties for giving and taking bribes was signed on 27 November 1946, and the Order stating that embezzlement and theft could be punished up to the maximum penalty of death was signed on 26 January 1946. These came a considerable time after the Declaration of Independence, not \"only a few days after\"."},{"id":"en10-13","cd":"10","l":"NH","q":"According to Ho Chi Minh Thought, which of the following rights are regarded as falling within the scope of \"human rights\" that the humane rule-of-law state must respect and guarantee comprehensively?","o":[["A","The natural rights of human beings, including the right to life."],["B","Political and civil rights."],["C","Economic, cultural and social rights."],["D","The rights of specific groups such as women, children and ethnic minority people."],["E","The right to enjoy special benefits and immunity from legal liability when serving the State."]],"a":"ABCD","g":"The course textbook clearly states that Ho Chi Minh approached human rights comprehensively, including \"the natural rights of human beings, of which the highest is the right to life, as well as the political and civil rights and the economic, cultural and social rights of human beings. He paid attention to the rights of citizens in general, and at the same time also paid attention to the rights of specific groups such as women, children and ethnic minority people\". Option E runs contrary to the spirit of the rule of law and of preventing and combating negative phenomena."},{"id":"en10-14","cd":"10","l":"NH","q":"To prevent and overcome negative phenomena in the state apparatus, which of the following basic measures of a strategic and long-term nature did Ho Chi Minh propose?","o":[["A","Raising the level of democracy in society and practising democracy widely."],["B","Ensuring that the State's laws and the Party's discipline are extremely strict, with no forbidden zones."],["C","Valuing education, moral persuasion and the awakening of people as the main approach, alongside strict punishment."],["D","Cadres, especially those holding higher positions, must take the lead in setting an example of moral self-cultivation."],["E","Relying solely on the strength of the internal inspection and supervision apparatus of the Party and the State."]],"a":"ABCD","g":"The course textbook lists the measures: \"raising the level of democracy in society, practising democracy widely and promoting the people's right to mastery is the fundamental and long-term solution\"; \"the State's laws and the Party's discipline must be strict\", \"punish without mercy\", \"there are no forbidden zones whatsoever\"; \"Education must be valued, taking education and moral persuasion as the main approach\"; and \"cadres must take the lead in setting an example; the higher the position a cadre holds, the greater the responsibility to set an example\". Option E is insufficient, because the course textbook also emphasises the controlling role of the people."},{"id":"en10-15","cd":"10","l":"NH","q":"In Ho Chi Minh Thought on the control of state power, which of the following actors are identified as having a role and responsibility in controlling state power?","o":[["A","The Communist Party of Vietnam, as the ruling Party."],["B","The people, as the supreme subject of power."],["C","The People's Parliament, with the right to \"control and criticise the Government\" under the 1946 Constitution."],["D","The executive bodies of the State, controlling one another."],["E","International and diplomatic organisations."]],"a":"ABC","g":"The course textbook clearly states the controlling role of the Communist Party of Vietnam. The course textbook affirms that the people are the supreme subject of state power and have the right of control. The course textbook also mentions the People's Parliament's control over the Government, such as the right to \"control and criticise the Government\". Executive bodies are mainly objects of power control rather than actors controlling power as a whole, and international organisations are not mentioned in the course textbook."},{"id":"en10-16","cd":"10","l":"NH","q":"According to Ho Chi Minh, which of the following objective causes may lead to the emergence and growth of negative phenomena in the state apparatus?","o":[["A","Cadres' own lack of moral self-cultivation and training."],["B","The cadre work of the Party and the State has not yet been done well."],["C","The remnants of the reactionary policies of the colonial and feudal regimes still exist."],["D","Plots of sabotage and subversive activities by hostile forces."],["E","The way the Party and the State are organised and operate is not yet truly scientific and effective."]],"a":"BCDE","g":"The course textbook lists the objective causes as including \"the cadre work of the Party and the State is not yet good; the way the Party and the State are organised and operate, and the coordination between the Party and the State, are not yet truly scientific and effective; the still low level of development of social life; the remnants of the reactionary policies of the colonial and feudal regimes; the sabotage plots of reactionary forces\". Option A, \"Cadres' own lack of self-cultivation and training\", is identified as a subjective cause, stemming from the \"mother disease\" of individualism."},{"id":"en10-17","cd":"10","l":"DK","q":"Ho Chi Minh always upheld the strictness of the law. He declared: \"Although Vietnamese law is lenient towards those who turn from evil to good, it will punish without mercy the ringleading Vietnamese traitors who have _______.\"","o":[["A","abused power and caused disunity"],["B","sold out the country and traded away the people"],["C","committed serious embezzlement and waste"],["D","relied on their position and power to be overbearing"],["E","been arrogant, acting as revolutionary mandarins"]],"a":"B","g":"The course textbook quotes Ho Chi Minh: \"Although Vietnamese law is lenient towards those who turn from evil to good, it will punish without mercy the ringleading Vietnamese traitors who have sold out the country and traded away the people\"."},{"id":"en10-18","cd":"10","l":"DK","q":"To ensure that all power belongs to the people, Ho Chi Minh pointed out: \"the people hate the chairmen and the committee members because of their habit of being arrogant and relying on their position and power. These gentlemen do not understand the tasks and policies of the Viet Minh, so when they get a little power in their hands they still often _______.\"","o":[["A","violate the Party's discipline"],["B","work ineffectively"],["C","waste public funds"],["D","abuse it"],["E","practise favouritism and factionalism"]],"a":"D","g":"The course textbook quotes Ho Chi Minh: \"the people hate the chairmen and the committee members because of their habit of being arrogant and relying on their position and power. These gentlemen do not understand the tasks and policies of the Viet Minh, so when they get a little power in their hands they still often abuse it\"."},{"id":"en10-19","cd":"10","l":"DK","q":"Ho Chi Minh affirmed that the State is the servant of the people: \"all work must rely entirely on the masses, welcoming the masses' _______.\"","o":[["A","contributions to building policies"],["B","mastery of all levels of government"],["C","urging and inspection"],["D","criticism and voting"],["E","participation in state management"]],"a":"C","g":"The course textbook quotes Ho
