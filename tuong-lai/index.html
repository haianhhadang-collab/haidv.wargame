d the right to (2) _______... These are truths that no one can deny\".","o":[["A","(1) united; (2) freedom"],["B","(1) equal; (2) development"],["C","(1) equal; (2) freedom"],["D","(1) autonomous; (2) development"],["E","(1) equal; (2) autonomy"]],"a":"C","g":"The course textbook quotes Ho Chi Minh: \"All nations in the world are born equal; every nation has the right to life, the right to happiness and the right to freedom... These are truths that no one can deny\"."},{"id":"en04-29","cd":"04","l":"DK","q":"To defend the genuine independence newly won after the August Revolution, especially in the situation of \"enemies within and invaders without\", Ho Chi Minh and the Government of the Democratic Republic of Vietnam used many measures, including (1) _______ measures, to defend the country's (2) _______ independence.","o":[["A","(1) military; (2) genuine"],["B","(1) economic; (2) genuine"],["C","(1) diplomatic; (2) sham"],["D","(1) military; (2) sham"],["E","(1) diplomatic; (2) genuine"]],"a":"E","g":"The course textbook states clearly: \"to defend the genuine independence newly won, he and the Government of the Democratic Republic of Vietnam used many measures, including diplomatic measures, to defend the country's genuine independence\"."},{"id":"en04-30","cd":"04","l":"DK","q":"In his Testament, Ho Chi Minh expressed absolute faith that the revolution would win and that the country would be (1) _______: \"However difficult and arduous it may be, our people will certainly win complete victory. The US imperialists will certainly have to get out of our country. Our Fatherland will certainly be (2) _______. Our compatriots in the South and the North will certainly be reunited under one roof\".","o":[["A","(1) independent; (2) reunified"],["B","(1) reunified; (2) reunified"],["C","(1) reunified; (2) independent"],["D","(1) developed; (2) prosperous"],["E","(1) autonomous; (2) independent"]],"a":"B","g":"The course textbook quotes Ho Chi Minh's Testament: \"However difficult and arduous it may be, our people will certainly win complete victory. The US imperialists will certainly have to get out of our country. Our Fatherland will certainly be reunified. Our compatriots in the South and the North will certainly be reunited under one roof\"."},{"id":"en05-1","cd":"05","l":"DS","q":"According to Ho Chi Minh, bourgeois revolution cannot liberate the nation completely because its nature is to dispossess the workers and peasants at home and oppress the colonies abroad, while bringing the people only false freedom and equality.","o":[],"a":"D","g":"The course textbook clearly records: \"He decided not to choose the path of bourgeois revolution because he held that: 'The French revolution, like the American revolution, that is, capitalist revolution, is a revolution that did not go all the way; it is republican and democratic in name, but in reality it plunders the workers and peasants at home and oppresses the colonies abroad.'\" The course textbook adds \"not the false freedom and equality that French imperialism boasts of in Annam...\". This fully matches the statement in the question."},{"id":"en05-2","cd":"05","l":"DS","q":"In Ho Chi Minh's view of the relationship between national liberation and class liberation, class liberation must be put first and carried out first, to create the precondition for national liberation in the colonies.","o":[],"a":"S","g":"The course textbook states clearly: \"According to Ho Chi Minh, in Vietnam and the colonial countries, because the historical and political circumstances differ from those of Europe, the order must be: national liberation – social liberation – class liberation – human liberation.\" Thus national liberation comes first and above all, not class liberation."},{"id":"en05-3","cd":"05","l":"DS","q":"Ho Chi Minh's thesis that colonial revolution could win victory before proletarian revolution in the mother country was completely contrary to all the views of the Communist International (Comintern) at that time.","o":[],"a":"S","g":"The course textbook points out that the Sixth Congress of the Comintern (1928) held the view that colonial revolution depended on proletarian revolution in the mother country, which reduced the initiative of colonial revolution. However, the course textbook also says that Ho Chi Minh \"thoroughly grasped V.I. Lenin's idea of the close relationship between proletarian revolution in the mother countries and the national liberation movement in the colonies\", and he pointed out a relationship of equality, not of dependence. Therefore, he was not completely contrary to all views; rather, he developed them creatively on Lenin's foundation, while overcoming the limitations of the Comintern at certai"},{"id":"en05-4","cd":"05","l":"DS","q":"According to Ho Chi Minh, in the conditions of Vietnam as a colonial and feudal country, the Communist Party is only the vanguard of the working class, enabling it to fulfil its historical mission, just as in the theory of Marxism–Leninism.","o":[],"a":"S","g":"The course textbook states clearly: \"In the circumstances of Vietnam as a colonial and feudal country, Ho Chi Minh held that the Communist Party is both the vanguard of the working class and the vanguard of the labouring people... It is also the Party of the whole Vietnamese nation.\" This is a thesis that supplements and develops Marxist theory on the communist party. Therefore, the statement that the Party is only the vanguard of the working class is incomplete and false."},{"id":"en05-5","cd":"05","l":"DS","q":"Ho Chi Minh held that overthrowing the imperialists and the feudalists and making Vietnam completely independent must be carried out simultaneously, closely bound up with and relying on each other, in full accordance with the view of the Communist International (Comintern).","o":[],"a":"S","g":"The course textbook points out: \"Also according to the Comintern, the two tasks of fighting imperialism and fighting feudalism must be carried out simultaneously, closely bound up with and relying on each other.\" However, \"starting from a colonial country, Ho Chi Minh did not regard the two tasks as having to be carried out uniformly and equally, but put first the task of fighting imperialism and liberating the nation, while the task of fighting feudalism... would be carried out step by step.\" Therefore, the statement in the question is false, because Ho Chi Minh did not hold that they were \"to be carried out uniformly and equally\" but set a priority."},{"id":"en05-6","cd":"05","l":"DS","q":"Ho Chi Minh's thesis that \"capitalism is a leech with one sucker attached to the proletariat in the mother country and another sucker attached to the proletariat in the colonies\" implies that revolution in the mother country and revolution in the colonies must be coordinated and simultaneous in order to destroy imperialism thoroughly.","o":[],"a":"D","g":"The course textbook uses the image of the leech to illustrate the link between the mother country and the colonies in sustaining capitalism. He wrote: \"If one wants to kill the creature, one must cut off both suckers at the same time.\" This clearly shows the need for coordinated, simultaneous action by the two revolutions to achieve a thorough result."},{"id":"en05-7","cd":"05","l":"D1","q":"According to Ho Chi Minh Thought, which of the following was the core factor leading to the failure of the Vietnamese patriotic movements before he found the new path of national salvation?","o":[["A","Lack of support from international movements."],["B","Failure to recognise the oppressive nature of capitalism."],["C","A crisis and deadlock over the leading class and the revolutionary line."],["D","Excessive dependence on help from neighbouring countries."],["E","Insufficient military strength to fight the French colonialists."]],"a":"C","g":"The course textbook states clearly: \"the failure of the patriotic movements in this period reflected the crisis and deadlock over the leading class and the revolutionary line.\" The other options may be secondary factors, but they are not the \"core factor\" directly mentioned in the course textbook."},{"id":"en05-8","cd":"05","l":"D1","q":"Which of the following points best shows Ho Chi Minh's originality and creativity in handling the relationship between the tasks of fighting imperialism and fighting feudalism in the \"Party's Brief Political Platform\"?","o":[["A","Pushing the two tasks forward in parallel, regarding them as having equal roles."],["B","Temporarily setting aside the task of fighting imperialism in order to concentrate on land reform."],["C","Putting the task of fighting imperialism and liberating the nation first, while fighting feudalism would be carried out step by step."],["D","Raising only the policy \"land to the tillers\" without mentioning the confiscation of the imperialists' land."],["E","Giving priority to settling the feudal question first to consolidate internal strength, and only then fighting imperialism."]],"a":"C","g":"The course textbook affirms: \"starting from a colonial country, Ho Chi Minh did not regard the two tasks as having to be carried out uniformly and equally, but put first the task of fighting imperialism and liberating the nation, while the task of fighting feudalism and bringing land to the peasants would be carried out step by step.\" This is precisely his originality and creativity. Option A is the view of the Comintern, which Ho Chi Minh did not follow entirely. Option D is wrong because Ho Chi Minh set out \"confiscate all the land of the imperialists...\" but did not yet raise \"land to the tillers\"."},{"id":"en05-9","cd":"05","l":"D1","q":"According to Ho Chi Minh, why does revolution in the colonies play a very great role, together with proletarian revolution in the mother countries, in destroying imperialism?","o":[["A","Because the colonies are where most of the imperialists' military forces are concentrated."],["B","Because the venom and vitality of the capitalist viper are concentrated in the colonies more than in the mother countries."],["C","Because struggle movements in the colonies are usually less harshly repressed than those in the mother countries."],["D","Because colonial revolution can develop faster thanks to outside support."],["E","Because only colonial revolution can completely cut off the supply of resources to the mother country."]],"a":"B","g":"The course textbook explains: \"He held that 'the venom and vitality of the capitalist viper are concentrated in the colonies more than in the mother countries'; if one is indifferent to the question of revolution in the colonies, it is like 'trying to kill a snake by striking its tail'. Therefore, revolution in the colonies plays a very great role, together with proletarian revolution in the mother countries, in destroying imperialism.\""},{"id":"en05-10","cd":"05","l":"D1","q":"Which of the following statements does not correctly reflect the importance of the Communist Party, according to Ho Chi Minh Thought, in the national liberation revolution in Vietnam?","o":[["A","The Party is the subjective factor enabling the working class to fulfil its historical mission."],["B","The Party must mobilise and organise the masses at home."],["C","The Party must liaise with oppressed nations and the proletariat everywhere."],["D","The Party need only be militarily strong for the revolution to succeed."],["E","The Party is the vanguard of the labouring people and of the whole Vietnamese nation."]],"a":"D","g":"The course textbook emphasises the role of the Communist Party in \"persuading, enlightening and rallying the broad masses, training the masses and leading the masses into struggle\", and in \"mobilising and organising the masses, and abroad liaising with oppressed nations and the proletariat everywhere. Only when the Party is firm can the revolution succeed\". The course textbook also says that the Party is the vanguard of the labouring people and of the whole Vietnamese nation. The statement \"The Party need only be militarily strong\" is deficient and does not fully reflect the role of the Party as stated. \"Firm\" here encompasses many factors, not only military ones."},{"id":"en05-11","cd":"05","l":"D1","q":"When calling for nationwide resistance (December 1946), which factor did Ho Chi Minh emphasise as the core foundation for rallying forces to fight the common enemy of the nation?","o":[["A","A clear division of classes to bring into play the vanguard role of the workers and peasants."],["B","Concentrating on building professional and modern armed forces."],["C","Uniting all Vietnamese regardless of class or social stratum, ethnicity, religion or political party."],["D","Calling for help from the fraternal socialist countries."],["E","Temporarily setting aside internal contradictions to maintain stability."]],"a":"C","g":"The course textbook quotes the Appeal for Nationwide Resistance: \"All men and women, all old and young, regardless of religion, political party or ethnicity. Whoever is Vietnamese must stand up and fight the French colonialists to save the Fatherland\". This clearly expresses the thought of great national unity, without distinction on any other grounds."},{"id":"en05-12","cd":"05","l":"D1","q":"According to Ho Chi Minh, why are the working class and the peasantry regarded as \"the root of the revolution\", with \"a revolutionary heart all the more steadfast and a revolutionary will all the more resolute\"?","o":[["A","Because they have the highest level of education and absorb revolutionary theory easily."],["B","Because they are the two most numerous classes and the most heavily exploited, with nothing to lose but their chains."],["C","Because they are able to organise and lead the revolution themselves without outside intervention."],["D","Because they represent the most advanced production of colonial society."],["E","Because they have close links with the mother country and can win international support."]],"a":"B","g":"The course textbook explains: \"the working class and the peasantry are the two most numerous and most revolutionary classes, the most heavily exploited; therefore 'their revolutionary heart is all the more steadfast, their revolutionary will all the more resolute... the workers and peasants are already empty-handed; if they lose, they lose only a life of misery; if they win, they gain the whole world; that is why they are bold'\"."},{"id":"en05-13","cd":"05","l":"SAI","q":"According to Ho Chi Minh Thought, the path of national liberation revolution in Vietnam must follow the following basic principles, except:","o":[["A","Following the path of proletarian revolution."],["B","Linking national liberation with class liberation, with national liberation coming first."],["C","National independence must be tied to socialism."],["D","It must be carried out by the method of revolutionary violence and armed force."],["E","Being entirely dependent on the victory of proletarian revolution in the mother country."]],"a":"E","g":"Options A, B, C and D are all core principles in Ho Chi Minh's thought on national liberation revolution. As for option E, Ho Chi Minh affirmed that colonial revolution does not depend on proletarian revolution in the mother country and can win victory first. Therefore, \"entirely dependent\" is wrong."},{"id":"en05-14","cd":"05","l":"SAI","q":"Ho Chi Minh's creative thesis that colonial revolution could win victory before proletarian revolution in the mother country was built on the following grounds, except:","o":[["A","The colonies have a special position, role and importance for imperialism."],["B","The extremely resolute revolutionary fighting spirit of the colonial nations."],["C","Emphasising the need for the colonies to wait for support from the mother country."],["D","K. Marx's thesis on the working class's capacity for self-liberation."],["E","The practical victory of the August Revolution of 1945 in Vietnam and of the national liberation movement in the world."]],"a":"C","g":"The course textbook lists the grounds of Ho Chi Minh's creative thesis. Options A, B and D are all clearly stated there. Option E is practical evidence that later further proved the thesis correct. Option C (\"emphasising the need for the colonies to wait for support from the mother country\") runs counter to the spirit of initiative and self-liberation, and to the capacity of colonial revolution to win first, according to Ho Chi Minh."},{"id":"en05-15","cd":"05","l":"SAI","q":"Which of the following statements is not core content of Ho Chi Minh's thought on revolutionary violence?","o":[["A","Using revolutionary violence against counter-revolutionary violence."],["B","Revolutionary violence must be the violence of the masses."],["C","Always giving absolute priority to armed struggle, regarding political struggle as secondary."],["D","It is necessary to skilfully use and combine the forms of armed struggle and political struggle."],["E","Revolutionary violence is carried out with two forces, political and military."]],"a":"C","g":"The course textbook affirms the need for revolutionary violence against counter-revolutionary violence. It says that revolutionary violence is the violence of the masses, with two forces, political and military, and two forms of struggle, political and armed. In particular, \"the political struggle of the masses is the basis and foundation for building the armed forces and for armed struggle; armed struggle is of decisive significance for destroying the military forces...\". At the same time, it is necessary to \"use correctly and skilfully combine the forms of armed struggle and political struggle\". Therefore, the statement \"always giving absolute priority to armed struggle, regarding politica"},{"id":"en05-16","cd":"05","l":"SAI","q":"In the Party's Brief Strategy, Ho Chi Minh defined the revolutionary forces as the whole people, with the following components regarded as targets to be won over or made use of, except:","o":[["A","The majority of the working class."],["B","The majority of the peasantry and the poor peasants."],["C","The petty bourgeoisie, intellectuals and middle peasants."],["D","Rich peasants, middle and small landlords and the Vietnamese bourgeoisie who have clearly revealed themselves as counter-revolutionary."],["E","Rich peasants, middle and small landlords and the Vietnamese bourgeoisie who have not yet clearly revealed themselves as counter-revolutionary."]],"a":"D","g":"The course textbook affirms that \"revolution is the common cause of all the people\". It states clearly that the Party must win over the workers, rally the majority of the peasantry, rely on the poor peasants, and liaise with the petty bourgeoisie, intellectuals and middle peasants. As for \"rich peasants, middle and small landlords and the Vietnamese bourgeoisie who have not yet clearly revealed themselves as counter-revolutionary, they must be made use of, or at least neutralised\". As for those who have clearly revealed themselves as counter-revolutionary, Ho Chi Minh did not advocate making use of them or neutralising them, but fighting them. Therefore, option D is the component not regarde"},{"id":"en05-17","cd":"05","l":"SAI","q":"Which of the following statements by Ho Chi Minh expresses a consistent view on national independence tied to socialism?","o":[["A","\"To save the country and liberate the nation, there is no path other than the path of proletarian revolution\"."],["B","\"In the world today, only the Russian revolution has succeeded, and succeeded all the way...\"."],["C","In the Party's Brief Political Platform (1930), affirming the strategic direction \"to carry out the bourgeois democratic revolution and the agrarian revolution in order to advance to communist society\"."],["D","Regarding national liberation as the sole goal, with no need to link it to the socialist goal, so as to avoid complicating the revolution."],["E","\"From then on I completely believed in Lenin and in the Third International\"."]],"a":"D","g":"Options A, B, C and E all express, directly or indirectly, the link between the path of proletarian revolution, Marxism–Leninism and the goal of communist society after national independence is won. Specifically, C is the clearest statement of national independence tied to socialism. Option D (\"Regarding national liberation as the sole goal, with no need to link it to the socialist goal\") is completely contrary to the thought of Ho Chi Minh, who always placed national independence in a dialectical relationship with socialism."},{"id":"en05-18","cd":"05","l":"SAI","q":"Which of the following reasons was not used by Ho Chi Minh to explain why bourgeois revolution is not the path to thorough national liberation?","o":[["A","Bourgeois revolution dispossesses the workers and peasants at home."],["B","Bourgeois revolution oppresses the colonies abroad."],["C","Bourgeois revolution brings only false freedom and equality."],["D","Bourgeois revolution is usually harshly suppressed by feudal forces."],["E","Bourgeois revolution \"did not go all the way\", so another revolution must follow."]],"a":"D","g":"The course textbook states clearly the reasons for which Ho Chi Minh rejected bourgeois revolution: \"a revolution that did not go all the way; it is republican and democratic in name, but in reality it plunders the workers and peasants at home and oppresses the colonies abroad.\" He also spoke of \"the false freedom and equality that French imperialism boasts of in Annam\". Option D (\"Bourgeois revolution is usually harshly suppressed by feudal forces\") is not mentioned in the course textbook as a reason for which Ho Chi Minh rejected this path."},{"id":"en05-19","cd":"05","l":"NH","q":"Which of the following statements by Ho Chi Minh show a thorough grasp and creative development of Marxist–Leninist theory on the Communist Party in the conditions of Vietnam?","o":[["A","The Communist Party is the subjective factor enabling the working class to fulfil its historical mission."],["B","The Communist Party is both the vanguard of the working class and the vanguard of the labouring people."],["C","The Communist Party must be the most resolute, the most enthusiastic and the purest, devoted heart and soul to serving the Fatherland."],["D","The Communist Party must be the Party of the whole Vietnamese nation."],["E","Only when the Party is firm can the revolution succeed."]],"a":"BCD","g":"A is a general view of Marxism–Leninism. B, C and D are Ho Chi Minh's creative developments on the nature of the Communist Party of Vietnam in concrete circumstances. The course textbook states clearly: \"the Communist Party is both the vanguard of the working class and the vanguard of the labouring people, the most resolute, the most enthusiastic, the purest, devoted heart and soul to serving the Fatherland. It is also the Party of the whole Vietnamese nation.\" The course textbook affirms that this is \"an important thesis of Ho Chi Minh that supplements and develops Marxist theory on the communist party.\" E is a general principle on the role of the Party recognised by both Marxism–Leninism a"},{"id":"en05-20","cd":"05","l":"NH","q":"Which of the following points show Ho Chi Minh's originality and creativity in his thought on national liberation revolution, compared with the traditional view of the Communist International (Comintern) or Marxist–Leninist theory at that time?","o":[["A","Putting national liberation first and above all, and only then class liberation."],["B","Putting the task of fighting imperialism first, while fighting feudalism would be carried out step by step."],["C","Affirming that colonial revolution can win victory before proletarian revolution in the mother country."],["D","Regarding the Communist Party as the vanguard of the whole Vietnamese nation, not only of the working class."],["E","Emphasising the importance of revolutionary violence in seizing and holding power."]],"a":"ABCD","g":"A: \"According to Ho Chi Minh... the order must be: national liberation – social liberation – class liberation – human liberation.\" This differs from the order of Marx and Engels. B: \"Ho Chi Minh did not regard the two tasks as having to be carried out uniformly and equally, but put first the task of fighting imperialism and liberating the nation, while the task of fighting feudalism... would be carried out step by step. Therefore, in the Party's Brief Political Platform, he raised only 'confiscate all the land of the imperialists, turn it into public property and distribute it to poor peasants'... This is Ho Chi Minh's originality and creativity.\" C: \"Ho Chi Minh held that colonial revolutio"},{"id":"en05-21","cd":"05","l":"NH","q":"According to Ho Chi Minh, which of the following forms of struggle must be \"used correctly and skilfully combined\" to win victory for the national liberation revolution?","o":[["A","The political struggle of the masses."],["B","Armed struggle."],["C","Diplomatic struggle."],["D","Economic struggle."],["E","Cultural struggle."]],"a":"AB","g":"The course textbook states clearly that \"revolutionary violence here is the violence of the masses, carried out with two forces, political and military, and two forms of struggle: political struggle and armed struggle\". The course textbook affirms \"use correctly and skilfully combine the forms of armed struggle and political struggle to win victory for the revolution\". Options C, D and E are not directly mentioned in the context of revolutionary violence in this passage."},{"id":"en05-22","cd":"05","l":"NH","q":"Which of the following show the core difference between the view of Ho Chi Minh and that of the Communist International (Comintern) on the revolutionary movement in the colonies?","o":[["A","Ho Chi Minh emphasised that the role of colonial revolution in relation to imperialism is \"killing a snake by striking its tail\"."],["B","The Comintern at times underestimated the role of colonial revolution, holding that it must depend on proletarian revolution in the mother country."],["C","Ho Chi Minh affirmed that colonial revolution can win victory before proletarian revolution in the mother country."],["D","The Comintern held that the liberation of the colonies could be achieved only when the proletariat won victory in the mother country."],["E","Ho Chi Minh held that \"the venom and vitality of the capitalist viper are concentrated in the colonies more than in the mother countries\"."]],"a":"BCD","g":"A and E are statements by Ho Chi Minh showing a deep understanding of the role of the colonies, but they are not points of difference from the view of the Comintern; rather, they are the way he explained that role. B and D are views of the Comintern that Ho Chi Minh went beyond. The course textbook points out clearly: \"The Comintern at times underestimated the role of colonial revolution, holding that colonial revolution must depend on proletarian revolution in the mother country. The Sixth Congress of the Comintern (1928) adopted the Theses..., which include a passage stating: the liberation of the colonies can be fully achieved only when the proletariat has won victory in the advanced capi"},{"id":"en05-23","cd":"05","l":"NH","q":"According to Ho Chi Minh, which forces are regarded as \"the root of the revolution\" and \"the masters of the revolution\" in the national liberation revolution?","o":[["A","The working class."],["B","The peasantry."],["C","The intelligentsia."],["D","The petty bourgeoisie."],["E","The national bourgeoisie."]],"a":"AB","g":"The course textbook states clearly: \"While defining the revolutionary forces as the whole people, Ho Chi Minh noted that one must not forget that 'the workers and peasants are the masters of the revolution... the root of the revolution'. In the work 'The Revolutionary Path', he explained: the working class and the peasantry are the two most numerous and most revolutionary classes, the most heavily exploited...\"."},{"id":"en05-24","cd":"05","l":"NH","q":"Which of the following are characteristics of proletarian revolution according to Ho Chi Minh, distinguishing it from bourgeois revolution?","o":[["A","Thoroughly liberating the masses from oppression and exploitation."],["B","Bringing genuine freedom and equality to the people."],["C","Still continuing to dispossess the workers and peasants at home."],["D","Still continuing to oppress the colonies abroad."],["E","Leading to communist society."]],"a":"ABE","g":"The course textbook affirms of the Russian October Revolution: \"the people enjoy the happiness of genuine freedom and equality, not the false freedom and equality that French imperialism boasts of in Annam\". This shows that A and B are characteristics of proletarian revolution. The course textbook also states the ultimate goal of \"advancing to communist society\", linked to the path of proletarian revolution. Options C and D are characteristics of bourgeois revolution, not of proletarian revolution."},{"id":"en05-25","cd":"05","l":"DK","q":"According to Ho Chi Minh, \"To save the country and liberate the nation, there is no path other than the path of _______\".","o":[["A","democratic revolution"],["B","bourgeois revolution"],["C","proletarian revolution"],["D","national liberation revolution"],["E","agrarian revolution"]],"a":"C","g":"The course textbook affirms: \"To save the country and liberate the nation, there is no path other than the path of proletarian revolution\"."},{"id":"en05-26","cd":"05","l":"DK","q":"In Ho Chi Minh's thought, \"National revolution _______, that is, scholars, peasants, workers and merchants all unite against tyranny\".","o":[["A","must distinguish between classes"],["B","does not yet distinguish between classes"],["C","has already unified the classes"],["D","has nothing to do with classes"],["E","relies on only one class"]],"a":"B","g":"The course textbook clearly records that he explained: \"national revolution does not yet distinguish between classes, that is, scholars, peasants, workers and merchants all unite against tyranny\"."},{"id":"en05-27","cd":"05","l":"DK","q":"Ho Chi Minh observed: \"Capitalism is a leech with one sucker attached to the proletariat in the mother country and another sucker attached to the proletariat in _______\".","o":[["A","the socialist countries"],["B","the neighbouring countries"],["C","the colonies"],["D","the independent states"],["E","the developed countries"]],"a":"C","g":"The course textbook writes: \"Capitalism is a leech with one sucker attached to the proletariat in the mother country and another sucker attached to the proletariat in the colonies.\""},{"id":"en05-28","cd":"05","l":"DK","q":"According to V.I. Lenin, \"_______ cannot be carried out\" without the sympathy and support of the great majority of the working people for their vanguard.","o":[["A","democratic revolution"],["B","bourgeois revolution"],["C","industrial revolution"],["D","proletarian revolution"],["E","scientific and technological revolution"]],"a":"D","g":"The course textbook quotes Lenin: \"Without the sympathy and support of the great majority of the working people for their vanguard, that is, for the proletariat, proletarian revolution cannot be carried out.\""},{"id":"en05-29","cd":"05","l":"DK","q":"Ho Chi Minh held that \"In the arduous struggle against the enemies of the class and the nation, it is necessary to use revolutionary violence against _______, to seize power and to defend power\".","o":[["A","the violence of the mother country"],["B","feudal violence"],["C","imperialist violence"],["D","counter-revolutionary violence"],["E","colonial violence"]],"a":"D","g":"The course textbook writes: \"In the arduous struggle against the enemies of the class and the nation, it is necessary to use revolutionary violence against counter-revolutionary violence, to seize power and to defend power\"."},{"id":"en05-30","cd":"05","l":"DK","q":"Ho Chi Minh pointed out clearly: \"Depending on the concrete situation, decide on the appropriate forms of revolutionary struggle, use correctly and skilfully combine the forms of _______ struggle and political struggle to win victory for the revolution\".","o":[["A","foreign-relations"],["B","economic"],["C","armed"],["D","cultural"],["E","ideological"]],"a":"C","g":"The course textbook writes: \"Depending on the concrete situation, decide on the appropriate forms of revolutionary struggle, use correctly and skilfully combine the forms of armed struggle and political struggle to win victory for the revolution\"."},{"id":"en06-1","cd":"06","l":"DS","q":"According to Ho Chi Minh Thought, the economic goal of socialism in Vietnam emphasises the development of modern industry and agriculture and of advanced science and technology, and at the same time requires the economy to be based entirely on ownership by the whole people in order to ensure its homogeneity.","o":[],"a":"S","g":"Although Ho Chi Minh determined that the economy must be highly developed, with modern industry and agriculture and advanced science and technology, he made clear that it is \"a homogeneous economy, based on the system of ownership by the whole people and collective ownership\". Thus it is not based entirely on ownership by the whole people; there is also collective ownership (the cooperative economy)."},{"id":"en06-2","cd":"06","l":"DS","q":"Ho Chi Minh affirmed that the relationship of culture with politics and the economy is a one-way relationship, in which politics and the economy entirely determine the character of culture, with no reciprocal influence of culture on politics and the economy.","o":[],"a":"S","g":"Ho Chi Minh held that the relationship of culture with politics and the economy is \"a dialectical relationship\". The political and economic regime determines the character of culture, but \"culture contributes to achieving the goals of politics and the economy\". He also affirmed that \"Raising the people's cultural level will help us push forward the restoration of the economy and the development of democracy\", which shows that there is a reciprocal influence."},{"id":"en06-3","cd":"06","l":"DS","q":"In Ho Chi Minh's thought on the driving forces of building socialism, he considered the driving forces separately and independently, with no mutual relationship between them.","o":[],"a":"S","g":"Ho Chi Minh held that \"All the driving forces are very important and have a dialectical relationship with one another\". In particular, the three foremost driving forces – the interests of the people, the democracy of the people and the unity of the whole people – \"are organically bound up with one another, are the basis and precondition for one another, and create the most powerful driving forces\". This shows that they are interlinked, not separate."},{"id":"en06-4","cd":"06","l":"DS","q":"According to Ho Chi Minh, the interests of the people and the democracy of the people are two independent driving forces that can be brought into play separately in the process of socialist revolution.","o":[],"a":"S","g":"As driving forces that propel the process of socialist revolution, \"the interests of the people and the democracy of the people cannot be separated from each other\". They are organically bound up with each other."},{"id":"en06-5","cd":"06","l":"DS","q":"The view that \"building\" goes hand in hand with \"combating\" in Ho Chi Minh Thought applies only to dealing with external enemies and has nothing to do with preventing internal obstacles.","o":[],"a":"S","g":"Ho Chi Minh always reminded that \"we must constantly heighten our vigilance; we must combat both the external enemies who seek to sabotage the achievements of the revolution and the internal enemy, which is individualism; combat the mindset of 'being a revolutionary mandarin'\". The view that \"building\" goes hand in hand with \"combating\" is \"one of the views running throughout Ho Chi Minh Thought\" and includes preventing and eliminating internal obstacles."},{"id":"en06-6","cd":"06","l":"DS","q":"In the goal of building a socialist culture, Ho Chi Minh placed special emphasis on thoroughly eradicating all the enslaving influences of imperialist culture, without allowing any element of the progressive culture of the world to be absorbed.","o":[],"a":"S","g":"Ho Chi Minh required: \"We must thoroughly eradicate all colonial vestiges and the enslaving influence of imperialist culture. At the same time, develop the fine traditions of national culture and absorb what is new in the progressive culture of the world, in order to build a Vietnamese culture that is national, scientific and popular in character\". This shows that he advocated selectively absorbing the best of the world's progressive culture, not rejecting it entirely."},{"id":"en06-7","cd":"06","l":"D1","q":"Which of the following points best expresses the goal concerning the political regime of socialism in Vietnam according to Ho Chi Minh Thought?","o":[["A","Building a regime that concentrates power solely in the State to ensure stability."],["B","Building a democratic regime, in which all power and strength lie with the people."],["C","Building a political regime based on the absolute leadership of one single class."],["D","Building a political system that puts economic development before all other goals."],["E","Building a political regime in which the people are the masters but have no rights tied to responsibilities."]],"a":"B","g":"Ho Chi Minh affirmed that the goal concerning the political regime is \"We must build a democratic regime\". He explained: \"Our regime is a democratic regime. That is, the people are the masters\", \"Ours is a democratic country; the highest position belongs to the people, because the people are the masters\". He made clear: \"all power and strength lie with the people\". The other options do not reflect this spirit correctly or fully."},{"id":"en06-8","cd":"06","l":"D1","q":"When discussing the relationship between the economy and culture in building socialism, which of the following inferential points did Ho Chi Minh make?","o":[["A","Culture must always go ahead of the economy to create the precondition for material development."],["B","Economic development is the prerequisite for promoting culture, as reflected in the proverb \"Only with enough to eat can one uphold morality\"."],["C","The economy and culture are two completely independent fields, with no dialectical relationship."],["D","Culture determines the character of the economy, while the economy plays only a secondary role."],["E","Developing culture is unnecessary in the early stage of building the economy."]],"a":"B","g":"Ho Chi Minh held that the relationship of culture with politics and the economy is \"a dialectical relationship\". He explained the order of priority clearly: \"To advance to socialism, we must develop the economy and culture. Why do we not say develop culture and the economy? Our proverb says: Only with enough to eat can one uphold morality; therefore the economy must go first\". This affirms that the economy is the foundation."},{"id":"en06-9","cd":"06","l":"D1","q":"According to Ho Chi Minh, what is the basic difference in terms of interests between socialism and the social regimes before it?","o":[["A","Socialism cares only about the interests of the community and ignores individual interests."],["B","Socialism attends only to the interests of one single ruling class."],["C","Socialism cares about both the interests of the whole community and the interests of concrete individuals."],["D","Socialism emphasises economic interests over spiritual interests for the individual."],["E","Socialism completely denies the notion of individual interest."]],"a":"C","g":"Ho Chi Minh cared about \"the interests of the whole human community and the interests of concrete individuals\" because he held that \"this is one of the basic differences between socialism and the social regimes before it\". This shows a balance between collective and individual interests."},{"id":"en06-10","cd":"06","l":"D1","q":"Which driving force did Ho Chi Minh regard as playing the decisive role in the system of driving forces that propel the process of socialist revolution?","o":[["A","External strength and help from fraternal countries."],["B","The power of advanced science and education."],["C","The internal strength of the nation, the core of which is the people."],["D","The outstanding development of modern industry."],["E","The leading role of the Communist Party, which is unique and independent of all other factors."]],"a":"C","g":"In his thought, \"All the driving forces are very important and have a dialectical relationship with one another, but the decisive role belongs to the internal strength of the nation, that is, the people\". Although the leadership of the Party plays a decisive role in the activity of the organisations, for the system of driving forces as a whole it is the internal strength of the nation, the people, that is decisive."},{"id":"en06-11","cd":"06","l":"D1","q":"According to Ho Chi Minh, how should the quality of \"having the consciousness of being masters of the State\" of the socialist person be understood?","o":[["A","The right to take part directly in all State decisions without going through representatives."],["B","The spirit of responsibility and duty of citizens towards the cause of building and defending the country."],["C","The ability to self-manage all economic activities without State intervention."],["D","Individual power placed above the power of the State and the collective."],["E","Merely voting and standing for election periodically."]],"a":"B","g":"\"The consciousness of being masters of the State\" is one of the new ideas and styles of work that every person needs to cultivate. He affirmed that \"the people are the masters\" is not only a right but also \"the responsibility of the people; the cause of defending and building the country is the work of the people\". Therefore, \"having the consciousness of being masters\" implies responsibility and the duty to take part in the common cause, not merely rights or taking part directly in every decision."},{"id":"en06-12","cd":"06","l":"D1","q":"Ho Chi Minh emphasised that the socialist State must guarantee democratic freedoms for citizens, but at the same time it strictly prohibits what?","o":[["A","Expressing wrong personal views recklessly."],["B","Abusing democratic freedoms to infringe on the interests of the State and of the people."],["C","Joining socio-political organisations that are harmful to the nation."],["D","Always criticising the authorities at all levels regardless of right or wrong."],["E","Exercising the right to vote and to stand for election without meeting the conditions of citizenship."]],"a":"B","g":"Although the State \"guarantees democratic freedoms for citizens\", he also made clear that it \"strictly prohibits abusing democratic freedoms to infringe on the interests of the State and of the people\"."},{"id":"en06-13","cd":"06","l":"SAI","q":"The economic goal of socialism in Vietnam according to Ho Chi Minh Thought has many features. Which of the following is NOT a feature of that economic goal?","o":[["A","A highly developed economy with modern industry and agriculture."],["B","Advanced science and technology."],["C","A homogeneous economy, based on the system of ownership by the whole people and collective ownership."],["D","Completely separate from the political goal and operating independently."],["E","The state-owned economy leads the national economy and is guaranteed priority development by the State."]],"a":"D","g":"The economic goal must be \"closely bound up with the political goal\". He affirmed: \"Our economic and social system aims to fully realise the democratic rights of the people, on the basis of an ever-developing socialist economy\". Therefore, separating the economic goal from the political goal is wrong."},{"id":"en06-14","cd":"06","l":"SAI","q":"According to Ho Chi Minh, building a Vietnamese culture that is national, scientific and popular in character requires many tasks. Which of the following tasks is NOT consistent with his thought?","o":[["A","All colonial vestiges and the enslaving influence of imperialist culture must be thoroughly eradicated."],["B","Developing the fine traditions of national culture."],["C","Absorbing what is new in the progressive culture of the world."],["D","Creating an entirely new culture, not based on any foundation from the past."],["E","Culture must be socialist in content and national in form."]],"a":"D","g":"He clearly advocated \"developing the fine traditions of national culture\", which contradicts \"creating an entirely new culture, not based on any foundation from the past\"."},{"id":"en06-15","cd":"06","l":"SAI","q":"The basic democratic freedoms of the people guaranteed by the State under socialism, according to Ho Chi Minh Thought, include many aspects. Which of the following aspects is NOT directly mentioned by him in the course textbook?","o":[["A","The right to work, to rest and to study."],["B","The right to personal freedom and to freedom of speech and of the press."],["C","The right to freedom of assembly, of association and of demonstration."],["D","The right to freedom of belief, to follow or not to follow any religion."],["E","The right to receive minimum social welfare without having to work."]],"a":"E","g":"The course textbook states clearly that the people \"have the right to work; the right to rest; the right to study; the right to personal freedom; the right to freedom of speech, of the press, of assembly, of association and of demonstration; the right to freedom of belief, to follow or not to follow any religion; the right to vote and to stand for election\". There is no mention of a right to receive minimum social welfare without work; instead, the right to work and the responsibility to build the country are emphasised."},{"id":"en06-16","cd":"06","l":"SAI","q":"To propel the process of socialist revolution, Ho Chi Minh identified many important driving forces. Which of the following driving forces did he NOT place among the foremost driving forces of socialism?","o":[["A","The interests of the people."],["B","The democracy of the people."],["C","The strength of the unity of the whole people."],["D","Economic support from friendly countries in the world."],["E","A, B and C are all foremost driving forces."]],"a":"D","g":"Ho Chi Minh affirmed that \"to propel the process of socialist revolution, we must ensure the interests of the people, the democracy of the people and the strength of the unity of the whole people. In Ho Chi Minh Thought, these are the foremost driving forces of socialism\". External economic support may belong to \"external strength\", but he did not place it among the \"foremost driving forces\"."},{"id":"en06-17","cd":"06","l":"SAI","q":"According to Ho Chi Minh Thought, organisations such as the Communist Party, the State and the socio-political organisations have certain roles and features in the system of driving forces of socialism. Which of the following features is NOT consistent with his thought?","o":[["A","The Communist Party plays the decisive role in leadership."],["B","The State performs the function of managing society, turning the line of the Party into reality."],["C","The socio-political organisations operate completely independently of the leadership of the Party and the management of the State."],["D","The socio-political organisations are consistent in politics and ideology under the leadership of the Party and the management of the State."],["E","These organisations work for the interests of their members, but these interests must be consistent with the interests of the nation."]],"a":"C","g":"The socio-political organisations, \"although they differ in content and methods of operation, are all consistent in politics and ideology under the leadership of the Party and the management of the State\". Therefore, operating completely independently is wrong."},{"id":"en06-18","cd":"06","l":"SAI","q":"According to Ho Chi Minh, the bad ideas and styles of work that must be combated in the socialist person have many manifestations. Which of the following manifestations is NOT directly mentioned by him in the course textbook?","o":[["A","Individualism."],["B","Bureaucratism and commandism."],["C","Embezzlement and waste."],["D","Conservatism and timidity."],["E","Individual creativity that exceeds the framework of the collective."]],"a":"E","g":"Ho Chi Minh listed the bad ideas and styles of work to be combated as: \"Individualism; bureaucratism and commandism; embezzlement and waste; conservatism and timidity\". He did not mention combating \"individual creativity that exceeds the framework of the collective\"; on the contrary, he emphasised the creative labour of the masses."},{"id":"en06-19","cd":"06","l":"NH","q":"Which of the following does the goal concerning the political regime of socialism in Vietnam, according to Ho Chi Minh Thought, include?","o":[["A","Building a democratic regime."],["B","Affirming that the people exercise mastery and are the masters."],["C","All benefits are for the people; all powers belong to the people."],["D","The authorities at all levels are elected by the people; the mass organisations are organised by the people."],["E","All power and strength lie with the people."]],"a":"ABCDE","g":"The course textbook states clearly: \"We must build a democratic regime\". \"Our regime is a democratic regime. That is, the people are the masters\", \"Ours is a democratic country; the highest position belongs to the people, because the people are the masters\". \"All interests are for the people, all powers belong to the people; the work of renewal is the responsibility of the people; the cause of defending and building the country is the work of the people; the authorities at all levels are elected by the people, and the mass organisations are organised by the people. In short, all power and strength lie with the people\"."},{"id":"en06-20","cd":"06","l":"NH","q":"According to Ho Chi Minh, which aspects need attention in order to build a Vietnamese culture that is national, scientific and popular in character?","o":[["A","It must be socialist in content."],["B","It must be national in form."],["C","All colonial vestiges and the enslaving influence of imperialist culture must be thoroughly eradicated."],["D","Developing the fine traditions of national culture."],["E","Absorbing what is new in the progressive culture of the world."]],"a":"ABCDE","g":"He stated clearly: \"to serve the cause of socialist revolution, culture must be socialist in content and national in form\". \"We must thoroughly eradicate all colonial vestiges and the enslaving influence of imperialist culture. At the same time, develop the fine traditions of national culture and absorb what is new in the progressive culture of the world, in order to build a Vietnamese culture that is national, scientific and popular in character\"."},{"id":"en06-21","cd":"06","l":"NH","q":"According to Ho Chi Minh Thought, what features in terms of social relations does the socialist society that our people are building have?","o":[["A","A democratic, just and civilised society."],["B","Respect for human beings."],["C","Paying attention to legitimate individual interests and ensuring that they are satisfied."],["D","Each person has the conditions to improve his or her own life and to develop his or her own personality and strengths."],["E","Harmony with the common life and the common interests of the collective."]],"a":"ABCDE","g":"\"Thus, the socialist society that our people are building is a democratic, just and civilised society that respects human beings, pays attention to legitimate individual interests and ensures that they are satisfied, so that each person has the conditions to improve his or her own life and to develop his or her own personality and strengths in harmony with the common life and the common interests of the collective\"."},{"id":"en06-22","cd":"06","l":"NH","q":"According to Ho Chi Minh, what socialist ideas and styles of work does every Vietnamese person need to cultivate in order to build socialism?","o":[["A","Having the consciousness of being masters of the State."],["B","Having a socialist collective spirit and the idea of \"one for all, all for one\"."],["C","Having the viewpoint \"everything for production\"."],["D","Having the consciousness of building the country with industry and thrift."],["E","Having the spirit of advancing rapidly, vigorously and steadily to socialism."]],"a":"ABCDE","g":"Ho Chi Minh summed up: \"The new ideas and styles of work that every person needs to cultivate in himself or herself are: having the consciousness of being masters of the State; having a socialist collective spirit and the idea of 'one for all, all for one'; having the viewpoint 'everything for production'; having the consciousness of building the country with industry and thrift; having the spirit of advancing rapidly, vigorously and steadily to socialism\"."},{"id":"en06-23","cd":"06","l":"NH","q":"In the system of driving forces for building socialism, which factors, according to Ho Chi Minh Thought, are organically bound up with one another, creating a combined strength?","o":[["A","The interests of the people."],["B","The democracy of the people."],["C","The unity of the whole people."],["D","The leadership of the Party."],["E","The management activity of the State."]],"a":"ABC","g":"\"In Ho Chi Minh Thought, the interests of the people, the democracy of the people and the unity of the whole people are organically bound up with one another, are the basis and precondition for one another, and create the most powerful driving forces in the system of driving forces of socialism\". The leadership of the Party and the management of the State work through the activity of organisations to bring these driving forces into play."},{"id":"en06-24","cd":"06","l":"NH","q":"Ho Chi Minh held that, for socialism to be built, the active participation of the people is needed. In which of the following is this participation manifested?","o":[["A","The people's full awareness of their interests and powers."],["B","Awareness of their responsibilities and their democratic status."],["C","The creative labour of tens of millions of the masses."],["D","The right to demonstrate and to form associations without any limits."],["E","Complete dependence on the leadership of the Party, with no need for individual creativity."]],"a":"ABC","g":"Ho Chi Minh held that \"socialism can be built only with the people's full awareness of their interests and powers, their responsibilities and their democratic status; and with the creative labour of tens of millions of the masses\". The right to demonstrate exists, but it comes with a strict prohibition on its abuse. Option E contradicts \"creative labour\"."},{"id":"en06-25","cd":"06","l":"DK","q":"Ho Chi Minh affirmed that the goal concerning the political regime of socialism in Vietnam is \"Our regime is a democratic regime. That is, the people _______\".","o":[["A","are the masters"],["B","act as masters"],["C","manage"],["D","decide for themselves"],["E","lead"]],"a":"B","g":"Direct quotation from the course textbook: \"Our regime is a democratic regime. That is, the people act as masters\"."},{"id":"en06-26","cd":"06","l":"DK","q":"The economic goal of socialism in Vietnam was defined by Ho Chi Minh as \"a homogeneous economy, based on the system of ownership by the whole people and _______ ownership\".","o":[["A","individual"],["B","collective"],["C","mixed"],["D","State"],["E","private"]],"a":"B","g":"Direct quotation from the course textbook: \"a homogeneous economy, based on the system of ownership by the whole people and collective ownership\"."},{"id":"en06-27","cd":"06","l":"DK","q":"On the role of culture, Ho Chi Minh affirmed: \"Raising the people's cultural level will help us push forward the restoration of the economy and the development of _______. Raising the people's cultural level is also a necessary task in building our country into a peaceful, unified, independent, democratic and prosperous country\".","o":[["A","science"],["B","technology"],["C","democracy"],["D","society"],["E","production"]],"a":"C","g":"Direct quotation from the course textbook: \"Raising the people's cultural level will help us push forward the restoration of the economy and the development of democracy\"."},{"id":"en06-28","cd":"06","l":"DK","q":"According to Ho Chi Minh, to propel the process of socialist revolution, \"we must ensure the interests of the people, the democracy of the people and the strength of the _______ of the whole people\".","o":[["A","cooperation"],["B","unification"],["C","unity"],["D","development"],["E","creativity"]],"a":"C","g":"Direct quotation from the course textbook: \"we must ensure the interests of the people, the democracy of the people and the strength of the unity of the whole people\"."},{"id":"en06-29","cd":"06","l":"DK","q":"Ho Chi Minh recognised that in socialist society each person holds a certain position and makes a certain contribution, because the working people have escaped destitution and have jobs and a life of sufficiency and happiness; therefore, from the very first days of building the new social regime, he taught: \"whatever is beneficial to the people, we must do our utmost to do; whatever is harmful to the people, we must do our utmost to _______\".","o":[["A","eliminate"],["B","prevent"],["C","avoid"],["D","criticise"],["E","limit"]],"a":"C","g":"Direct quotation from the course textbook: \"whatever is beneficial to the people, we must do our utmost to do; whatever is harmful to the people, we must do our utmost to avoid\"."},{"id":"en06-30","cd":"06","l":"DK","q":"In Ho Chi Minh Thought, the view that \"building\" goes hand in hand with \"combating\" is also one of the views _______ Ho Chi Minh Thought, and one of the distinctive features of Ho Chi Minh Thought.","o":[["A","fundamental to"],["B","at the core of"],["C","running throughout"],["D","new to"],["E","principal in"]],"a":"C","g":"Direct quotation from the course textbook: \"the view that 'building' goes hand in hand with 'combating' is also one of the views running throughout Ho Chi Minh Thought\"."},{"id":"en07-1","cd":"07","l":"DS","q":"According to Ho Chi Minh Thought, the leadership role of the Communist Party of Vietnam is merely a supporting factor and is not decisive for the success of the Vietnamese revolution.","o":[],"a":"S","g":"The course textbook affirms that Ho Chi Minh likened the communist party to \"a helmsman\" and emphasised that \"only when the Party is firm can the revolution succeed\", which shows its decisive role. The course textbook also affirms that the leadership of the Communist Party of Vietnam is an inevitability. Therefore, the claim that this role is merely a supporting factor is incorrect."},{"id":"en07-2","cd":"07","l":"DS","q":"In forming the Communist Party of Vietnam, V.I. Lenin's theory on the emergence of the new-type communist party was simply applied in its original form, with no need for creative application to the specific conditions of Vietnam.","o":[],"a":"S","g":"The course textbook states clearly that Ho Chi Minh \"was loyal to the doctrine of Marxism–Leninism... while creatively applying and developing that theory in the specific conditions of Vietnam\". This rules out the view that it was simply applied in its original form without creative application."},{"id":"en07-3","cd":"07","l":"DS","q":"The most fundamental contradiction in colonial and feudal Vietnamese society, which created the preconditions for the birth of the Communist Party of Vietnam, was mainly the contradiction between the proletariat and the bourgeoisie.","o":[],"a":"S","g":"The course textbook clearly identifies \"the basic contradiction between the entire Vietnamese people and the imperialist forces and their lackeys\". Although there was class struggle, the national contradiction was the overarching and most fundamental one in the context of colonial and feudal Vietnamese society."},{"id":"en07-4","cd":"07","l":"DS","q":"The Vietnam Revolutionary Youth League, an organisation founded by Ho Chi Minh, contributed to the shift of some patriots from the bourgeois-democratic tendency to the communist tendency, most clearly from 1925 onwards.","o":[],"a":"D","g":"The course textbook states clearly: \"Some Vietnamese patriots initially followed the bourgeois-democratic tendency, but through practical experience and under the influence of Marxism–Leninism, they gradually shifted to the communist tendency, most clearly from 1925 onwards. A series of patriotic organisations emerged, the most typical of which was the Vietnam Revolutionary Youth League founded by Ho Chi Minh.\" This affirms the role of this organisation in the shift of tendencies."},{"id":"en07-5","cd":"07","l":"D1","q":"According to the course materials, what is the most essential factor explaining the inevitability of the Communist Party of Vietnam's leadership in the country's development towards the goal of socialism?","o":[["A","Ho Chi Minh's ability to rally the masses."],["B","The vanguard role of the working class."],["C","The internal development requirements of the Vietnamese nation."],["D","Intervention and support from other socialist countries."],["E","The superiority of the new-type party model according to V.I. Lenin."]],"a":"C","g":"The course textbook states clearly that \"the leadership of the Communist Party of Vietnam is an inevitability, and the leadership role of the Party is also an inevitability – this stems from the development requirements of the Vietnamese nation\". The other options may be contributing factors or consequences, but \"the development requirements of the Vietnamese nation\" is the most essential reason directly mentioned."},{"id":"en07-6","cd":"07","l":"D1","q":"What basic difference in the birth of the Communist Party of Vietnam, compared with the general Marxist–Leninist theory of the communist party, is emphasised in the course materials?","o":[["A","The combination of Marxism–Leninism with the workers' movement."],["B","The leadership of an outstanding revolutionary such as Ho Chi Minh."],["C","The additional combination with the element of the patriotic movement."],["D","The application of the principles of the new-type party."],["E","The goal of struggling for national independence."]],"a":"C","g":"The course textbook points out that Marxist–Leninist doctrine regards the communist party as the product of \"scientific socialism with the workers' movement\". By contrast, the birth of the Communist Party of Vietnam was \"the result of combining Marxism–Leninism with the workers' movement and the patriotic movement\". The \"patriotic movement\" element is the difference emphasised in the Vietnamese context."},{"id":"en07-7","cd":"07","l":"D1","q":"Which of the following most accurately reflects Ho Chi Minh's assessment of the Party's role in the revolution in his work \"The Revolutionary Path\"?","o":[["A","The Party is the organiser of international negotiations."],["B","The Party is the training centre for senior political cadres."],["C","The Party is the steady \"helmsman\" of the boat of the revolution."],["D","The Party plays the role of the supreme legislative body."],["E","The Party focuses mainly on economic development."]],"a":"C","g":"The course textbook quotes Ho Chi Minh as affirming that the communist party is \"like a helmsman\" for the boat of the revolution, and affirms that this was his consistent view. The other options do not reflect this characteristic phrase and its core meaning."},{"id":"en07-8","cd":"07","l":"D1","q":"According to the course materials, the ideological shift from the bourgeois-democratic tendency to the communist tendency in the patriotic movements in Vietnam from 1925 was mainly influenced by which factor?","o":[["A","The failure of the peasant movements."],["B","Direct influence from Western bourgeois revolutions."],["C","The emergence of independent workers' movements."],["D","The impact of Marxism–Leninism and the practice of struggle."],["E","Military support from the Soviet Union."]],"a":"D","g":"The course textbook states: \"Some Vietnamese patriots initially followed the bourgeois-democratic tendency, but through practical experience and under the influence of Marxism–Leninism, they gradually shifted to the communist tendency, most clearly from 1925 onwards.\" This emphasises the role of Marxism–Leninism combined with the practice of struggle."},{"id":"en07-9","cd":"07","l":"SAI","q":"Which of the following statements is not correct about the Vietnamese social context that created the preconditions for the birth of the Communist Party of Vietnam?","o":[["A","It was a colonial and feudal society."],["B","There existed a basic contradiction between the entire Vietnamese people and the imperialist forces and their lackeys."],["C","The comprador bourgeoisie and the big landlords also took part in the national struggle movement."],["D","The workers' struggle movements had combined seamlessly with the patriotic movement."],["E","Patriotic organisations had emerged and developed strongly."]],"a":"C","g":"The course textbook affirms that in colonial and feudal Vietnamese society, \"every class and stratum, except the comprador bourgeoisie and the big landlords, had a national contradiction\". This implies that the comprador bourgeoisie and the big landlords had no national contradiction and therefore did not take part in the national struggle movement, which makes statement C incorrect."},{"id":"en07-10","cd":"07","l":"SAI","q":"Which of the following does not reflect Ho Chi Minh's view of the Communist Party of Vietnam, based on the given materials?","o":[["A","The Party was founded and trained by Ho Chi Minh."],["B","The Party exists and develops in accordance with V.I. Lenin's views on the new-type party."],["C","The Party focuses only on class struggle, separated from national struggle."],["D","The Party plays the role of \"helmsman\" for the boat of the revolution."],["E","The Party ensures and promotes its leadership role in accordance with the goal of socialism."]],"a":"C","g":"The course textbook states clearly: \"Class struggle was fused with national struggle.\" This view shows that the Party did not separate these two kinds of struggle but, on the contrary, combined them. Therefore, statement C does not correctly reflect Ho Chi Minh's view."},{"id":"en07-11","cd":"07","l":"SAI","q":"According to the course materials, the birth of the Communist Party of Vietnam was not a direct consequence of which of the following factors?","o":[["A","The inevitable need of Vietnamese society from early 1930."],["B","The combination of Marxism–Leninism with the workers' movement."],["C","The whole nation entrusting it with the mission of leading the country."],["D","The combination of Marxism–Leninism with the patriotic movement."],["E","The emergence of a national bourgeois force strong enough to lead the revolution."]],"a":"E","g":"The course textbook shows that the comprador bourgeoisie and the big landlords had no national contradiction, and that the patriotic movements which initially followed the bourgeois-democratic tendency gradually shifted to communism because they lacked a correct path. The course textbook makes no mention at all of the emergence of a national bourgeois force strong enough to lead the revolution; on the contrary, the shift to communism demonstrates the opposite. Options A, B, C and D are all mentioned as constituent factors or consequences of the Party's birth."},{"id":"en07-12","cd":"07","l":"SAI","q":"Which of the statements below is not correct about the process of applying and developing Ho Chi Minh Thought on the leadership role of the Communist Party of Vietnam?","o":[["A","This process of application has shown that the Party's leadership is an operating principle of Vietnamese society."],["B","The Party's leadership role has only been affirmed in the socialist revolution."],["C","The view of the Party as \"helmsman\" has been consistent throughout the revolutionary process."],["D","The goal of developing the country towards socialism is central."],["E","Ensuring and promoting the Party's leadership role is an inevitability."]],"a":"B","g":"The course textbook affirms that the view on the Party's leadership role was \"consistently held by Ho Chi Minh... throughout the revolutionary process, in both the people's national democratic revolution and the socialist revolution.\" This contradicts statement B that this role has only been affirmed in the socialist revolution."},{"id":"en07-13","cd":"07","l":"NH","q":"According to the course materials, which of the following factors contributed to the birth of the Communist Party of Vietnam?","o":[["A","Marxism–Leninism."],["B","The workers' movement."],["C","The patriotic movement."],["D","Support from the big landlord class."],["E","The inevitable need of Vietnamese society."]],"a":"ABC","g":"The course textbook states clearly: \"The birth of the Communist Party of Vietnam was the result of combining Marxism–Leninism with the workers' movement and the patriotic movement.\"."},{"id":"en07-14","cd":"07","l":"NH","q":"Which of the following statements correctly express the role of the Communist Party of Vietnam according to Ho Chi Minh Thought and the practice mentioned in the course materials?","o":[["A","The Party is the \"helmsman\" of the boat of the revolution."],["B","The Party's leadership is an operating principle of Vietnamese society."],["C","The Party has the mission of leading the country in the cause of national liberation."],["D","The Party only mobilises and organises the masses within the country."],["E","The Party represents the interests of a section of the bourgeoisie."]],"a":"ABC","g":"The course textbook affirms that the Party is the \"helmsman\". The course textbook states that the Party's leadership is \"an operating principle of Vietnamese society\". The course textbook says that the Party was entrusted with \"the mission of leading the country in the cause of national liberation and advancing to socialism\". The course textbook also points out that the Party liaises \"with oppressed nations and the proletariat everywhere\", not only within the country, which makes D wrong. E is clearly inconsistent with the nature of a communist party."},{"id":"en07-15","cd":"07","l":"NH","q":"According to the course materials, which of the following are correct features of the formation of communist ideology in Vietnam before 1930?","o":[["A","Some patriots initially followed the bourgeois-democratic tendency."],["B","The patriotic movements gradually shifted to the communist tendency under the influence of Marxism–Leninism."],["C","The Vietnam Revolutionary Youth League was a typical organisation that contributed to this shift."],["D","The national contradiction was the main driving force of the patriotic movements."],["E","Only the working class had a national contradiction."]],"a":"ABCD","g":"The course textbook describes: \"Some Vietnamese patriots initially followed the bourgeois-democratic tendency, but through practical experience and under the influence of Marxism–Leninism, they gradually shifted to the communist tendency, most clearly from 1925 onwards. A series of patriotic organisations emerged, the most typical of which was the Vietnam Revolutionary Youth League founded by Ho Chi Minh.\" The course textbook affirms that \"every class and stratum, except the comprador bourgeoisie and the big landlords, had a national contradiction\", so D is correct and E is wrong."},{"id":"en07-16","cd":"07","l":"NH","q":"Which of the following assessments are correct about the relationship between class struggle and national struggle in the context of the birth of the Communist Party of Vietnam?","o":[["A","Class struggle and national struggle took place independently and were unrelated to each other."],["B","Class struggle was fused with national struggle."],["C","Although the movements differed in forces, methods and slogans of struggle, they shared the common goal of winning independence and freedom for the nation."],["D","The national contradiction was the basic contradiction, governing the social context."],["E","Class struggle was mainly led by the comprador bourgeoisie."]],"a":"BCD","g":"The course textbook affirms that \"Class struggle was fused with national struggle\" and that \"Although those movements differed in forces, methods and slogans of struggle, they shared the common goal of winning independence and freedom for the nation.\" The course textbook identifies \"the basic contradiction between the entire Vietnamese people and the imperialist forces and their lackeys\" as the national contradiction. Therefore, A and E are wrong."},{"id":"en07-17","cd":"07","l":"DK","q":"Ho Chi Minh affirmed that the revolution requires: \"First of all, there must be a revolutionary party, to mobilise and organise the masses at home, and to liaise with oppressed nations and the proletariat everywhere abroad. Only when the Party is firm can the revolution succeed, just as only when the _______ is firm can the boat sail”.","o":[["A","architect"],["B","commander"],["C","helmsman"],["D","pioneer"],["E","guide"]],"a":"C","g":"The course textbook directly quotes Ho Chi Minh: \"Only when the Party is firm can the revolution succeed, just as only when the helmsman is firm can the boat sail”."},{"id":"en07-18","cd":"07","l":"DK","q":"The leadership of the Communist Party of Vietnam is an inevitability, and the leadership role of the Party is also an inevitability – this stems from the _______ of the Vietnamese nation.","o":[["A","historical traditions"],["B","political will"],["C","development requirements"],["D","aspiration for prosperity and power"],["E","cultural foundation"]],"a":"C","g":"The course textbook states clearly: \"the leadership of the Communist Party of Vietnam is an inevitability... this stems from the development requirements of the Vietnamese nation.\""},{"id":"en07-19","cd":"07","l":"DK","q":"Ho Chi Minh's view on the birth of the Party was entirely suited to a _______ and feudal society such as Vietnam, where every class and stratum, except the comprador bourgeoisie and the big landlords, had a national contradiction.","o":[["A","feudal"],["B","colonial"],["C","industrial"],["D","democratic"],["E","capitalist"]],"a":"B","g":"The course textbook affirms: \"Ho Chi Minh's view was entirely suited to a colonial and feudal society such as Vietnam\"."},{"id":"en07-20","cd":"07","l":"DK","q":"The Communist Party of Vietnam, founded and trained by Ho Chi Minh, is a political party that exists and develops in accordance with V.I. Lenin's views on the _______ party of the proletariat.","o":[["A","model"],["B","new-type"],["C","vanguard"],["D","central"],["E","revolutionary"]],"a":"B","g":"The course textbook states clearly that the Communist Party of Vietnam \"exists and develops in accordance with V.I. Lenin's views on the new-type party of the proletariat.\""},{"id":"en07-21","cd":"07","l":"DS","q":"According to the course textbook, Ho Chi Minh affirmed that the revolution “first of all must have a revolutionary party” in his work The Revolutionary Path (Đường cách mệnh, 1927).","o":[],"a":"D","g":"The course textbook states: “In the work The Revolutionary Path (1927), Ho Chi Minh affirmed that the revolution ‘first of all must have a revolutionary party’.” The statement is correct about both the work and the date."},{"id":"en07-22","cd":"07","l":"DS","q":"According to the course textbook, in Vietnam before the Party was founded, the workers' struggle movement in practice developed separately and did not combine with the patriotic movement.","o":[],"a":"S","g":"The course textbook states: “In practice, the workers' struggle movements combined very smoothly with the patriotic movement.” The statement that the two movements developed separately is therefore false."},{"id":"en07-23","cd":"07","l":"D1","q":"According to the course textbook, Marxist–Leninist doctrine holds that the birth of a communist party is the product of the combination of which elements?","o":[["A","Marxism–Leninism with the patriotic movement."],["B","Scientific socialism with the workers' movement."],["C","Scientific socialism with the workers' movement and the patriotic movement."],["D","The workers' movement with the peasants' movement."],["E","Patriotism with proletarian internationalism."]],"a":"B","g":"The course textbook states: “Marxist–Leninist doctrine holds that the birth of a communist party is the product of the combination of scientific socialism with the workers' movement.” The patriotic movement belongs to Ho Chi Minh's assessment specific to Vietnam, not to the general formula of Marxist–Leninist doctrine, so option C is wrong."},{"id":"en07-24","cd":"07","l":"D1","q":"According to the course textbook, what mission did the whole nation entrust to the Communist Party of Vietnam?","o":[["A","To lead the country only in the cause of national liberation."],["B","To lead the country only in building socialism after independence had been won."],["C","To represent solely the interests of the working class in the class struggle."],["D","To direct the revolutionary movement in colonial countries on behalf of the Communist International."],["E","To lead the country in the cause of national liberation and advancing to socialism."]],"a":"E","g":"The course textbook states: “The Party was entrusted by the whole nation with the mission of leading the country in the cause of national liberation and advancing to socialism.” The mission covers both national liberation and advancing to socialism, so options A and B (only one stage), as well as C and D, are wrong."},{"id":"en07-25","cd":"07","l":"SAI","q":"According to the course textbook, which of the following statements about the Communist Party of Vietnam is incorrect?","o":[["A","The Communist Party of Vietnam was directly founded and trained by the Communist International."],["B","The Party's leadership is a necessity arising from the development needs of the Vietnamese nation."],["C","Affirming that the Party is “like the helmsman” is Ho Chi Minh's consistent view in both the national people's democratic revolution and the socialist revolution."],["D","Ho Chi Minh's view on the birth of the Party fully suits a colonial and feudal society such as Vietnam."],["E","The birth of the Party is the result of combining Marxism–Leninism with the workers' movement and the patriotic movement."]],"a":"A","g":"The course textbook states: “The Communist Party of Vietnam, founded and trained by Ho Chi Minh, is a political party that exists and develops according to V.I. Lenin's views on the new-type party of the proletariat.” The Party's founder and trainer is Ho Chi Minh, so option A is incorrect; statements B, C, D and E are all affirmed in the course textbook."},{"id":"en07-26","cd":"07","l":"SAI","q":"According to the course textbook, which of the following statements about the struggle movements in Vietnam before the Communist Party of Vietnam was founded is incorrect?","o":[["A","Class struggle was interwoven with national struggle."],["B","Some Vietnamese patriots at first followed the bourgeois-democratic trend, then gradually moved to the communist trend."],["C","A series of patriotic organisations was born, the most typical being the Vietnamese Revolutionary Youth League founded by Ho Chi Minh."],["D","The mo
