 Chi Minh: \"all work must rely entirely on the masses, welcoming the masses' urging and inspection\"."},{"id":"en10-20","cd":"10","l":"DK","q":"According to Ho Chi Minh, cadres of agencies and mass organisations at high levels have great power, and those at low levels have little power. Whether great or small, having power while lacking _______ means having the chance to embezzle, the chance to take bribes, the chance to \"use the public for the private\" (to take public property as private property).","o":[["A","work experience"],["B","professional competence"],["C","conscience"],["D","close supervision"],["E","absolute loyalty"]],"a":"C","g":"The course textbook quotes Ho Chi Minh: \"cadres of agencies and mass organisations at high levels have great power, and those at low levels have little power. Whether great or small, having power while lacking conscience means having the chance to embezzle, the chance to take bribes, the chance to 'use the public for the private'\"."},{"id":"en10-21","cd":"10","l":"DS","q":"According to the course textbook, Ho Chi Minh defined waste only as the waste of money and property contributed by the people for the operation of the state apparatus.","o":[],"a":"S","g":"The course textbook states: “Waste here is defined by Ho Chi Minh as the waste of labour, the waste of time and the waste of money and property.” Waste includes labour and time, not only money and property, so the statement is false."},{"id":"en10-22","cd":"10","l":"DS","q":"Ho Chi Minh regarded embezzlement, waste and bureaucratism as “internal invaders” and “the enemy within”, a kind of enemy more dangerous than foreign invaders.","o":[],"a":"D","g":"The course textbook states: “Ho Chi Minh regarded embezzlement, waste and bureaucratism as ‘internal invaders’, ‘the enemy within’, a kind of enemy more dangerous than foreign invaders.” The statement matches the course textbook."},{"id":"en10-23","cd":"10","l":"D1","q":"According to the course textbook, which two ways of control did Ho Chi Minh clearly set out?","o":[["A","From the top down and from the bottom up."],["B","Periodic control and unannounced control."],["C","Control within the Party and control outside the Party."],["D","Control through documents and on-the-spot control."],["E","Internal control and control by international organisations."]],"a":"A","g":"The course textbook states: “He also clearly set out two ways of control: from the top down and from the bottom up. He stressed that one must ‘control skilfully’.” The other options are not given in the course textbook as the two ways of control."},{"id":"en10-24","cd":"10","l":"D1","q":"According to the course textbook, what penalty did the Decree signed by Ho Chi Minh on 27/11/1946 set for the offence of giving and taking bribes?","o":[["A","The death penalty and confiscation of all property."],["B","One to five years' imprisonment and repayment of the bribe."],["C","Non-custodial reform and compensation to the State."],["D","Ten to thirty years' imprisonment and a fine of three times the bribe."],["E","Five to twenty years' imprisonment with hard labour and a fine of twice the amount of the bribe."]],"a":"E","g":"The course textbook states: “On 27/11/1946, Ho Chi Minh signed a Decree setting the penalty for giving and taking bribes at five to twenty years' imprisonment with hard labour and a fine of twice the amount of the bribe.” The maximum penalty of death belongs to the order of 26/1/1946 on embezzlement and theft, not to the Decree on bribery."},{"id":"en10-25","cd":"10","l":"SAI","q":"According to the course textbook, which of the following statements about the process of building a constitutional and legitimate State under Ho Chi Minh's leadership is INCORRECT?","o":[["A","On 3/9/1945, at the first meeting of the Provisional Government, Ho Chi Minh proposed holding a General Election with universal suffrage as soon as possible."],["B","At the first session of the First National Assembly (2/3/1946), Ho Chi Minh was elected Chairman of the National Assembly."],["C","Setting up the National Assembly, the Government and constitutional bodies and apparatus gave the country a firm legal basis for dealing with the Allied forces and for equal international relations."],["D","In the General Election, every citizen aged 18 or over, regardless of sex, wealth, ethnicity, party or religion, had the right to vote."],["E","The first coalition government had full legal standing to deal effectively with domestic and foreign affairs."]],"a":"B","g":"The course textbook states: “On 2/3/1946, the First National Assembly of the Democratic Republic of Vietnam held its first session, setting up the official organisations, apparatus and posts of the State. Ho Chi Minh was elected President of the first coalition government.” Ho Chi Minh was elected President of the coalition government, not Chairman of the National Assembly, so option B is incorrect."},{"id":"en10-26","cd":"10","l":"SAI","q":"According to Ho Chi Minh's views on the control of state power as presented in the course textbook, which of the following statements is INCORRECT?","o":[["A","Only officials in high positions can abuse power, so control of power is needed only at the top level."],["B","Control of state power is a necessity."],["C","The power held by state bodies and state officials is entrusted to them by the people."],["D","The ruling Party must pay attention to promoting the people's role in controlling power, because compared with the population the number of Party members is minimal."],["E","The 1946 Constitution stipulates: “Any minister who does not win the confidence of Parliament must resign”."]],"a":"A","g":"The course textbook states: “State bodies and state officials, to a greater or lesser degree, all hold power in their hands. This power is entrusted to them by the people. However, once they hold power, state bodies or state officials may all become abusive of power.” Control therefore cannot be limited to high-level officials; option A is incorrect."},{"id":"en10-27","cd":"10","l":"NH","q":"According to the course textbook, which of the following does the strictness of the law, which Ho Chi Minh always upheld, require?","o":[["A","The law must be correct and sufficient."],["B","Rewards should be generous and punishments lenient in order to keep the peace."],["C","Strengthening propaganda and legal education for all citizens."],["D","Replacing the system of issuing laws with the system of issuing decrees."],["E","Those who enforce the law must be truly fair-minded and strict."]],"a":"ACE","g":"The course textbook states: “This requires that the law be correct and sufficient; that propaganda and legal education for all citizens be strengthened; and that those who enforce the law be truly fair-minded and strict”. Option B runs against Ho Chi Minh's criticism that “rewards are sometimes too generous, while punishments are not strict”; option D reverses the demand “Replace the system of issuing decrees with the system of issuing laws” in the 1919 Claims of the Annamite People."},{"id":"en10-28","cd":"10","l":"NH","q":"According to the course textbook, in leading the building of the Vietnamese State, which of the following negative phenomena did Ho Chi Minh often mention to remind everyone to guard against and overcome?","o":[["A","Broadly practising democracy in society."],["B","Privileges and perks."],["C","Encouraging the people to criticise and supervise the work of the State."],["D","Embezzlement, waste and bureaucratism."],["E","Favouritism, divisiveness and arrogance."]],"a":"BDE","g":"The course textbook states: “Firstly, privileges and perks.”, “Secondly, embezzlement, waste and bureaucratism.” and “‘Favouritism’, ‘divisiveness’ and ‘arrogance’ are diseases that cause disunity and disrupt work.” Options A and C are things Ho Chi Minh encouraged — they are measures, not negative phenomena."},{"id":"en10-29","cd":"10","l":"DK","q":"In his letter to the National Judicial Conference, Ho Chi Minh wrote: “You are the people in charge of enforcing the law. Naturally you must hold high the example of _______ for the people to follow”.","o":[["A","diligence, thrift, integrity and uprightness"],["B","loyalty to the country and devotion to the people"],["C","daring to speak and daring to act"],["D","matching words with deeds"],["E","serving the public, upholding the law, being utterly impartial and selfless"]],"a":"E","g":"The course textbook states: “You are the people in charge of enforcing the law. Naturally you must hold high the example of ‘serving the public, upholding the law, being utterly impartial and selfless’ for the people to follow”."},{"id":"en10-30","cd":"10","l":"DK","q":"According to the course textbook, one of the basic measures in Ho Chi Minh Thought for preventing and combating negative phenomena in the State is to mobilise the strength of _______ in the fight against negative phenomena in people, in society and in the state apparatus.","o":[["A","patriotism"],["B","the armed forces"],["C","international public opinion"],["D","proletarian internationalism"],["E","a specialised inspection system"]],"a":"A","g":"The course textbook states: “Fifthly, the strength of patriotism must be mobilised in the fight against negative phenomena in people, in society and in the state apparatus.”"},{"id":"en11-1","cd":"11","l":"DS","q":"The policies and methods of rallying great unity must always be kept unchanged in every stage of the revolution in order to ensure the consistency of the strategy of great national unity.","o":[],"a":"S","g":"The course textbook points out: \"In each stage of the revolution, faced with different requirements and tasks, the policies and methods of rallying great unity can and must be adjusted to suit each different group, but the guideline of great national unity must never be changed\". This affirms that policies and methods can be adjusted, contrary to the statement in the question."},{"id":"en11-2","cd":"11","l":"DS","q":"The concept of \"the people\" in Ho Chi Minh Thought refers only to the large collective of the popular masses and does not include specific Vietnamese individuals.","o":[],"a":"S","g":"The course textbook clearly records: \"'The people' in Ho Chi Minh Thought is understood both as specific Vietnamese individuals and as a large collective of the popular masses; both are the subjects of the bloc of great national unity\"."},{"id":"en11-3","cd":"11","l":"DS","q":"According to Ho Chi Minh, the foundation of the bloc of great national unity consists only of workers and peasants, because they are the overwhelming majority and the root of the revolution.","o":[],"a":"S","g":"The course textbook points out: \"the forces forming the foundation of the bloc of great national unity, in Ho Chi Minh's view, are workers, peasants and intellectuals.\""},{"id":"en11-4","cd":"11","l":"DS","q":"Identifying great national unity as the foremost task of the Party needs to be thoroughly implemented only in the Party's lines and strategic guidelines, and not necessarily in its practical activities.","o":[],"a":"S","g":"The course textbook affirms: \"Great national unity must be identified as the foremost task of the Party, and this task must be thoroughly implemented in all fields, from lines, guidelines and policies to the practical activities of the Party.\""},{"id":"en11-5","cd":"11","l":"DS","q":"Ho Chi Minh's propositions such as \"Unity is our strength\" are mainly calls for a spirit of unity and are not truths generalised from practice.","o":[],"a":"S","g":"The course textbook states: \"From the practice of building the bloc of great national unity, Ho Chi Minh generalised many propositions that are truths about the role and strength of the bloc of great national unity\"."},{"id":"en11-6","cd":"11","l":"DS","q":"Unity and unanimity within the Party is an important factor but not a prerequisite for unity in society at large.","o":[],"a":"S","g":"The course textbook emphasises: \"In the bloc of great national unity, special attention must be paid to the 'core' factor, namely unity and unanimity within the Party, because that is the condition for unity in society at large.\""},{"id":"en11-7","cd":"11","l":"D1","q":"Which of the following most clearly shows the flexible yet steadfast character of Ho Chi Minh's strategy of great national unity?","o":[["A","The policies and methods of rallying always remain unchanged to ensure consistency."],["B","The guideline of great unity can be adjusted according to each group and each stage."],["C","Policies and methods are adjusted only when there is a major change in the goals of the revolution."],["D","Policies and methods can be adjusted to suit each group and each stage, but the guideline of great unity does not change."],["E","Flexibility is not a core feature of the strategy of great unity."]],"a":"D","g":"The course textbook points out: \"In each stage of the revolution, faced with different requirements and tasks, the policies and methods of rallying great unity can and must be adjusted to suit each different group, but the guideline of great national unity must never be changed\"."},{"id":"en11-8","cd":"11","l":"D1","q":"Which of the following propositions, summed up by Ho Chi Minh as a truth about the role of great national unity, is regarded as his supreme conclusion?","o":[["A","\"Unity is the beginning of all success\"."],["B","\"Unity, unity, great unity. Success, success, great success\"."],["C","\"Unity is the basis for development\"."],["D","\"Unity is the foundation of freedom\"."],["E","\"Unity is the only road to victory\"."]],"a":"B","g":"The course textbook concludes: \"Unity, unity, great unity. Success, success, great success\". The other options are not verbatim quotations or conclusions drawn directly from the course textbook."},{"id":"en11-9","cd":"11","l":"D1","q":"The word \"we\" in Ho Chi Minh's saying \"whoever has talent, virtue, strength and the heart to serve the Fatherland and serve the people, we unite with them\" is understood in its broadest sense as:","o":[["A","Only the Communist Party of Vietnam."],["B","Only the labouring strata."],["C","Only Vietnamese people living in the country."],["D","The Communist Party of Vietnam in particular and all Vietnamese people in general."],["E","Only those who have a leading role."]],"a":"D","g":"The course textbook explains: \"The word 'we' here is the subject, being both the Communist Party of Vietnam in particular and all Vietnamese people in general.\""},{"id":"en11-10","cd":"11","l":"D1","q":"What is the core task of the Communist Party of Vietnam in building the bloc of great national unity, arising from the objective requirements of the masses?","o":[["A","Merely issuing guidelines and policies on unity."],["B","Waiting for the masses to gather of their own accord into a unified bloc."],["C","Awakening, rallying and guiding the masses, turning their conscious demands into organised reality."],["D","Separating the individual needs of the masses from the common goal of the revolution."],["E","Focusing only on consolidating unity within the Party."]],"a":"C","g":"The course textbook points out: \"The Communist Party must have the mission of awakening, rallying and guiding the masses, turning their needs and conscious demands into organised reality in the bloc of great unity, creating combined strength in the struggle\"."},{"id":"en11-11","cd":"11","l":"D1","q":"Which historical lesson did Ho Chi Minh draw to affirm the vital role of great national unity for the independence and freedom of the country?","o":[["A","\"Our people are heroic and indomitable, so our country is strong and powerful.\""],["B","\"Whenever our people are united as one through all ages, our country is independent and free. Conversely, whenever our people are not united, we are invaded by foreign countries.\""],["C","\"The will of the people is the strength of the country.\""],["D","\"Independence and freedom are the supreme goal of unity.\""],["E","\"History proves that without unity there is no revolution.\""]],"a":"B","g":"The course textbook quotes Ho Chi Minh: \"History teaches us this lesson: Whenever our people are united as one through all ages, our country is independent and free. Conversely, whenever our people are not united, we are invaded by foreign countries\"."},{"id":"en11-12","cd":"11","l":"D1","q":"How did Ho Chi Minh explain the relationship between unity within the Party and the unity of the whole nation?","o":[["A","Unity within the Party is a necessary but not sufficient condition for the unity of the whole nation."],["B","Unity within the Party is only one of many factors promoting the unity of the whole nation."],["C","Unity within the Party is the \"core\" factor, the condition for unity in society at large."],["D","The unity of the whole nation will form by itself if the Party's leadership is correct, regardless of internal unity."],["E","These two factors exist in parallel without any direct causal relationship."]],"a":"C","g":"The course textbook affirms: \"In the bloc of great national unity, special attention must be paid to the 'core' factor, namely unity and unanimity within the Party, because that is the condition for unity in society at large.\""},{"id":"en11-13","cd":"11","l":"SAI","q":"Which of the following statements about the strategy of great national unity in Ho Chi Minh Thought is not correct?","o":[["A","It is a long-term, consistent strategy of the Vietnamese revolution."],["B","It is a matter of life and death for the Vietnamese nation."],["C","It is maintained only in the people's national democratic revolution and does not apply to the socialist revolution."],["D","It is the factor that determines the success or failure of the revolution."],["E","Its policies and methods can be adjusted to suit each group and each stage."]],"a":"C","g":"The course textbook affirms: \"this strategy is maintained in both the people's national democratic revolution and the socialist revolution.\" Therefore, the statement that it is maintained in only one stage is wrong."},{"id":"en11-14","cd":"11","l":"SAI","q":"According to Ho Chi Minh Thought, the subjects of the bloc of great national unity do not include which of the following groups?","o":[["A","All patriotic Vietnamese people of all classes and strata in society."],["B","Compatriots of all religions and all political parties."],["C","Vietnamese people who are loyal to the Fatherland but are not ready to serve the people."],["D","All people in a single unified bloc, regardless of ethnicity, class, stratum, gender or occupation."],["E","Vietnamese people, whether in the country or abroad, who are all oriented towards the common goal."]],"a":"C","g":"The course textbook states the criterion \"whoever has talent, virtue, strength and the heart to serve the Fatherland and serve the people, we unite with them\". The course textbook adds \"as long as they are loyal and ready to serve the Fatherland and do not betray the interests of the people\". Therefore, \"not ready to serve the people\" does not fit the criteria for unity."},{"id":"en11-15","cd":"11","l":"SAI","q":"Which of the following statements is not correct about great national unity as a foremost goal and task of the Vietnamese revolution?","o":[["A","Great unity is not only a strategic slogan but also a long-term goal of the revolution."],["B","It is the foremost task of the Party, thoroughly implemented in its lines, guidelines, policies and practical activities."],["C","The aim of the Vietnam Workers' Party is summed up in eight words: \"UNITE THE WHOLE PEOPLE, SERVE THE FATHERLAND\"."],["D","Great unity is a spontaneous demand of the masses that does not need the Party's role of awakening and rallying."],["E","Great unity is an objective demand of the popular masses in their struggle for self-liberation."]],"a":"D","g":"The course textbook clearly states: \"Great unity is an objective requirement of the revolutionary cause and an objective demand of the popular masses in their struggle for self-liberation... The Communist Party must have the mission of awakening, rallying and guiding the masses\". This refutes the idea that \"the Party's role of awakening and rallying is not needed\"."},{"id":"en11-16","cd":"11","l":"SAI","q":"Which of the following sayings is not one of Ho Chi Minh's propositions that are truths about the role and strength of the bloc of great national unity quoted in the course textbook?","o":[["A","\"Unity is our strength\"."],["B","\"Unity is an invincible force of ours for overcoming difficulties and winning victory\"."],["C","\"Unity is strength, unity is victory\"."],["D","\"Unity is the key to success, the banner that leads the way to victory.\""],["E","\"There is now one more very important point, which is also the mother point... That is unity\"."]],"a":"D","g":"The course textbook lists the sayings: \"Unity is our strength\", \"Unity is an invincible force of ours for overcoming difficulties and winning victory\", \"Unity is strength, unity is victory\", \"Unity is strength, it is the key to success\", \"There is now one more very important point, which is also the mother point... That is unity\". Option D adds the phrase \"the banner that leads the way to victory\", which is not in the course textbook."},{"id":"en11-17","cd":"11","l":"SAI","q":"To build a solid bloc of great national unity, which of the following actions is inconsistent with Ho Chi Minh Thought?","o":[["A","Clearly identifying the foundation of the bloc of unity as workers, peasants and intellectuals."],["B","First of all, uniting the great majority of the people."],["C","Firmly consolidating the foundation of workers, peasants and intellectuals in order to expand the bloc of great unity."],["D","Giving priority to uniting the intellectual strata and political parties before rallying the labouring masses."],["E","Regarding workers, peasants and the other labouring strata of the people as the foundation and root of great unity."]],"a":"D","g":"The course textbook emphasises: \"Great unity means that first of all we must unite the great majority of the people, and the great majority of the people are workers, peasants and the other labouring strata of the people. That is the foundation and root of great unity\". \"Giving priority to uniting the intellectual strata and political parties first\" goes against the principle of \"first of all uniting the great majority of the people\"."},{"id":"en11-18","cd":"11","l":"SAI","q":"In building the bloc of great national unity, Ho Chi Minh pointed out that the Communist Party of Vietnam must stand firmly on which standpoint in order to rally forces comprehensively?","o":[["A","A purely national standpoint, putting national interests above all else."],["B","The standpoint of the working class, harmoniously resolving the relationship between class and nation."],["C","A proletarian internationalist standpoint, disregarding class factors within the country."],["D","A religious standpoint, aimed at attracting the support of believers."],["E","A neutral standpoint, siding with no class."]],"a":"B","g":"The course textbook clearly records: \"Ho Chi Minh also pointed out that, in the process of building the bloc of great national unity, one must stand firmly on the standpoint of the working class and harmoniously resolve the relationship between class and nation in order to rally forces\"."},{"id":"en11-19","cd":"11","l":"NH","q":"According to Ho Chi Minh Thought, which of the following statements about great national unity as an issue of strategic significance are correct?","o":[["A","It is a long-term, consistent strategy of the Vietnamese revolution."],["B","It determines the success or failure of the revolution."],["C","It is maintained in both the people's national democratic revolution and the socialist revolution."],["D","The policies and methods of rallying may never be adjusted."],["E","It has strategic significance only in the stage of the struggle for national independence."]],"a":"ABC","g":"The course textbook affirms A and B. The course textbook affirms C and rejects D (\"can and must be adjusted\"). E is rejected by \"is maintained in both the people's national democratic revolution and the socialist revolution\"."},{"id":"en11-20","cd":"11","l":"NH","q":"According to Ho Chi Minh, which of the following are direct results of the bloc of great national unity?","o":[["A","It is an invincible strength for overcoming difficulties."],["B","It determines the independence and freedom of the country."],["C","It is the key to success."],["D","It always leads to rapid economic development."],["E","It always eliminates all social contradictions."]],"a":"ABC","g":"The course textbook states A and C. The course textbook states B: \"Whenever our people are united as one through all ages, our country is independent and free.\" Options D and E are not mentioned in the course textbook and, being absolute, do not fit reality."},{"id":"en11-21","cd":"11","l":"NH","q":"According to Ho Chi Minh Thought, which groups are included in \"the people\" as the subject of the bloc of great national unity?","o":[["A","The whole people, all patriotic Vietnamese."],["B","All classes and strata in society, all sectors, all social circles, all age groups, all ethnic groups, compatriots of all religions and all political parties."],["C","Specific Vietnamese individuals."],["D","The large collective of the popular masses."],["E","Only those with a high level of education and a position in society."]],"a":"ABCD","g":"The course textbook explains: \"The subject of the bloc of great national unity, according to Ho Chi Minh, includes the whole people, all patriotic Vietnamese of all classes and strata in society, all sectors, all social circles, all age groups, all ethnic groups, compatriots of all religions, all political parties, etc. 'The people' in Ho Chi Minh Thought is understood both as specific Vietnamese individuals and as a large collective of the popular masses\". Option E is a restriction that does not exist in Ho Chi Minh's all-embracing thought."},{"id":"en11-22","cd":"11","l":"NH","q":"According to Ho Chi Minh, what significance and requirements does identifying great national unity as a foremost goal and task of the Vietnamese revolution have?","o":[["A","It must be thoroughly implemented in all fields of the Party's work."],["B","Thoroughly implemented from the lines, guidelines and policies."],["C","Thoroughly implemented through to the practical activities of the Party."],["D","It is an objective requirement of the revolutionary cause."],["E","It is merely a strategic slogan and not a long-term goal."]],"a":"ABCD","g":"The course textbook affirms A, B and C. The course textbook affirms D. The course textbook also says \"great unity is not only a strategic slogan but also a long-term goal of the revolution\", so E is wrong."},{"id":"en11-23","cd":"11","l":"NH","q":"According to Ho Chi Minh, what is the mission of the Communist Party in building the bloc of great unity?","o":[["A","Awakening the masses."],["B","Rallying the masses."],["C","Guiding the masses."],["D","Turning the needs and conscious demands of the masses into organised reality."],["E","Eliminating the strata that do not belong to the worker–peasant bloc."]],"a":"ABCD","g":"The course textbook clearly states: \"The Communist Party must have the mission of awakening, rallying and guiding the masses, turning their needs and conscious demands into organised reality in the bloc of great unity\". Option E goes against the principle of broad rallying, \"leaving out no force\"."},{"id":"en11-24","cd":"11","l":"NH","q":"In the process of building the bloc of great national unity, which of the following criteria should the Communist Party of Vietnam observe in order to rally forces effectively?","o":[["A","Standing firmly on the standpoint of the working class."],["B","Harmoniously resolving the relationship between class and nation."],["C","Leaving out no force, as long as they are loyal and ready to serve the Fatherland."],["D","Accepting forces that betray the interests of the people if they have exceptional talent."],["E","Focusing only on the elite strata of society."]],"a":"ABC","g":"The course textbook states A, B and C. Option D is rejected by the requirement \"not to betray the interests of the people\". Option E goes against the spirit of rallying \"the whole people\"."},{"id":"en11-25","cd":"11","l":"DK","q":"Ho Chi Minh affirmed: \"History teaches us this lesson: Whenever our people are _______ as one, our country is independent and free. Conversely, whenever our people are not united, we are invaded by foreign countries\".","o":[["A","loving"],["B","trusting"],["C","united"],["D","supportive"],["E","of one heart"]],"a":"C","g":"The course textbook clearly records: \"History teaches us this lesson: Whenever our people are united as one, our country is independent and free. Conversely, whenever our people are not united, we are invaded by foreign countries\"."},{"id":"en11-26","cd":"11","l":"DK","q":"\"Great national unity is a matter of _______ for the Vietnamese nation, so this strategy is maintained in both the people's national democratic revolution and the socialist revolution.\"","o":[["A","strategic importance"],["B","core importance"],["C","life and death"],["D","urgency"],["E","fundamental importance"]],"a":"C","g":"The course textbook states: \"Great national unity is a matter of life and death for the Vietnamese nation, so this strategy is maintained in both the people's national democratic revolution and the socialist revolution.\""},{"id":"en11-27","cd":"11","l":"DK","q":"The aim of the Vietnam Workers' Party, according to Ho Chi Minh's statement on 3 March 1951, can be summed up in eight words: \"UNITE THE WHOLE PEOPLE, _______ THE FATHERLAND\".","o":[["A","BUILD"],["B","SERVE"],["C","DEFEND"],["D","CONSTRUCT"],["E","SAVE"]],"a":"B","g":"The course textbook quotes Ho Chi Minh: \"The aim of the Vietnam Workers' Party can be summed up in eight words: UNITE THE WHOLE PEOPLE, SERVE THE FATHERLAND\"."},{"id":"en11-28","cd":"11","l":"DK","q":"\"Great unity means that first of all we must unite the great majority of the people, and the great majority of the people are workers, peasants and the other labouring strata of the people. That is the _______ of great unity.\"","o":[["A","aim"],["B","direction"],["C","principle"],["D","foundation and root"],["E","key"]],"a":"D","g":"The course textbook affirms: \"That is the foundation and root of great unity. It is like the foundation of a house, the root of a tree.\""},{"id":"en11-29","cd":"11","l":"DK","q":"The forces forming the foundation of the bloc of great national unity, in Ho Chi Minh's view, include workers, peasants and _______.","o":[["A","small traders"],["B","intellectuals"],["C","soldiers"],["D","rich peasants"],["E","landlords"]],"a":"B","g":"The course textbook states: \"the forces forming the foundation of the bloc of great national unity, in Ho Chi Minh's view, are workers, peasants and intellectuals.\""},{"id":"en11-30","cd":"11","l":"DK","q":"In the bloc of great national unity, special attention must be paid to the \"core\" factor, namely unity and unanimity within _______, because that is the condition for unity in society at large.","o":[["A","the Government"],["B","the Front"],["C","the Army"],["D","the Party"],["E","the National Assembly"]],"a":"D","g":"The course textbook affirms: \"In the bloc of great national unity, special attention must be paid to the 'core' factor, namely unity and unanimity within the Party, because that is the condition for unity in society at large.\""},{"id":"en12-1","cd":"12","l":"DS","q":"The principle \"Genuine unity means both uniting and struggling, learning from each other's good points and criticising each other's mistakes\", emphasised by Ho Chi Minh, applies only within organisations with highly similar interests and not to groups that still have major differences in views or interests.","o":[],"a":"S","g":"According to Ho Chi Minh, genuine unity is not only agreement but also includes \"struggling, learning from each other's good points and criticising each other's mistakes\" and \"criticising from a standpoint of affection, for the sake of the country and the people\". The principle of \"seeking common ground while preserving differences\" also affirms the need to find common ground in order to limit what is particular and different, showing that this unity applies broadly even where there are differences, and is not limited to organisations with highly similar interests. The aim is \"to create close-knit, long-lasting unity, laying the groundwork for expanding the bloc of great unity within the Nat"},{"id":"en12-2","cd":"12","l":"DS","q":"According to Ho Chi Minh Thought, trust in the people is an independent condition for building the bloc of great unity, not directly related to the national tradition \"The country takes the people as its root\" or to the Marxist principle \"Revolution is the cause of the masses\".","o":[],"a":"S","g":"The course textbook clearly states: \"This principle [trust in the people] is both a continuation of the national tradition 'The country takes the people as its root', 'It is the people who carry the boat and the people who overturn it', and at the same time a profound embodiment of the Marxist principle 'Revolution is the cause of the masses'\". Thus, trust in the people is regarded as a combination and continuation of both the national tradition and the Marxist principle, not a completely independent principle."},{"id":"en12-3","cd":"12","l":"DS","q":"The common aim of the National United Front, despite its different names over the periods, has always focused only on the independence and unification of the Fatherland and the freedom and happiness of the people, and does not include the goal of class liberation.","o":[],"a":"S","g":"Although the common goal is defined as \"the independence and unification of the Fatherland and the freedom and happiness of the people\", the course textbook also affirms that the Party leads the Front to fulfil the task of \"struggling for national liberation and class liberation, combining national independence with socialism\". This shows that the goal of class liberation is an inseparable part of the Front's mission under the leadership of the Party, rather than being excluded."},{"id":"en12-4","cd":"12","l":"DS","q":"Although the worker–peasant alliance is identified as the core foundation of the National United Front, Ho Chi Minh held that only the role of these two classes should be emphasised in order to ensure the absolute vanguard character of the bloc of great unity.","o":[],"a":"S","g":"Ho Chi Minh pointed out: \"He advised that one should not emphasise only the role of the workers and peasants, but must also see the role of, and the need for, alliance with other classes, especially with the intelligentsia\". This reflects his open view on building the bloc of great unity: it is not limited to workers and peasants but requires alliance with many other strata so that the Front truly unites the whole nation."},{"id":"en12-5","cd":"12","l":"D1","q":"Among the conditions for building the bloc of great national unity, which condition did Ho Chi Minh identify as \"an immutable principle, the banner of unity and the common denominator for gathering all strata, classes, political parties, ethnic groups and religions into the Front\"?","o":[["A","Inheriting the nation's tradition of patriotism, humanity and unity."],["B","Having tolerance and generosity towards people."],["C","Having trust in the people."],["D","Taking the supreme interests of the nation and the fundamental interests of the working people as the goal to strive for."],["E","Handling well the very diverse and rich relationships of interests in society."]],"a":"D","g":"The course textbook clearly states: \"Therefore unity must take the supreme interests of the nation and the fundamental interests of the working people as the goal to strive for; this is an immutable principle, the banner of unity and the common denominator for gathering all strata, classes, political parties, ethnic groups and religions into the Front\". The other options are important conditions but are not described with this key phrase."},{"id":"en12-6","cd":"12","l":"D1","q":"What does the proposition \"It is the people who carry the boat and the people who overturn it\" in Ho Chi Minh Thought on great national unity mainly affirm?","o":[["A","The necessity of tolerance and generosity."],["B","The supreme role of the worker–peasant alliance."],["C","Firm trust in the decisive strength of the people."],["D","The importance of inheriting national traditions."],["E","The principle of democratic consultation in all activities."]],"a":"C","g":"The proposition \"It is the people who carry the boat and the people who overturn it\" is raised in the context of explaining the condition of \"trust in the people\". The course textbook affirms: \"The people are the solid support and also the source of the invincible strength of the bloc of great national unity, deciding the victory of the revolution. Therefore, to achieve great national unity, one must have trust in the people\". Therefore, this proposition mainly affirms trust in the decisive strength of the people."},{"id":"en12-7","cd":"12","l":"D1","q":"What is the key significance of the principle of \"seeking common ground while preserving differences\" in building the National United Front?","o":[["A","It requires all members to be completely identical in interests and views in order to create unanimity."],["B","It emphasises eliminating all individual differences in order to build a bloc of absolute ideological unanimity."],["C","It focuses on finding common ground in order to limit and resolve particular differences, while at the same time respecting them."],["D","It promotes the imposition of will by a few key members in order to maintain discipline and a common direction."],["E","It applies only to large member organisations, not to individuals in the Front."]],"a":"C","g":"Ho Chi Minh emphasised the motto \"seeking common ground while preserving differences\", \"using what is common to limit what is particular and different\". This means that the Front accepts the existence of legitimate differences, but at the same time seeks and promotes similarities and common interests in order to create unity. Options A, B and D all go against the spirit of respecting differences and democratic consultation, while option E is not mentioned in the course textbook."},{"id":"en12-8","cd":"12","l":"D1","q":"According to Ho Chi Minh, what is the essential reason why the worker–peasant alliance is regarded as the foundation of the National United Front?","o":[["A","Because they are the only force capable of leading the revolution and guiding the other classes."],["B","Because they are the most numerous, directly produce all the wealth that keeps society alive, and are the most heavily oppressed and exploited."],["C","Because they represent the highly educated intelligentsia with strategic vision."],["D","Because they have a patriotic tradition that is longer-standing and more thoroughgoing than that of any other stratum in society."],["E","Because they have the greatest property and social influence and are easier to rally than the other classes."]],"a":"B","g":"Ho Chi Minh pointed out that the worker–peasant alliance must be taken as the foundation \"because they are the ones who directly produce all the wealth that keeps society alive. Because they are the most numerous, and also the most heavily oppressed and exploited. Because their revolutionary spirit is firmer and more enduring than that of all other strata\". Option B fully sums up these essential reasons."},{"id":"en12-9","cd":"12","l":"SAI","q":"Which of the following statements is NOT CORRECT about the role of the Communist Party of Vietnam in the National United Front?","o":[["A","The Party is a member of the Front."],["B","The Party is the leading force of the Front."],["C","The Party has its own interests, separate from the interests of the whole of society, in order to ensure its vanguard role."],["D","The Party leads the Front by setting out an appropriate revolutionary line and methods."],["E","The Party has the task of guiding the Front in the struggle for national liberation and class liberation."]],"a":"C","g":"The course textbook clearly affirms: \"The Communist Party of Vietnam is both a member and the leading force; the Party has no interests of its own, but is closely bound up with the interests of the whole of society and the whole nation\". Therefore, the statement that the Party has its own interests, separate from the interests of the whole of society, is not correct."},{"id":"en12-10","cd":"12","l":"SAI","q":"Which of the following is NOT one of the important conditions for building the bloc of great national unity according to the course textbook?","o":[["A","Taking common interests as the rallying point, while respecting legitimate differing interests."],["B","Inheriting the nation's tradition of patriotism, humanity and unity."],["C","Having tolerance and generosity towards people."],["D","Building a completely independent and self-reliant economy that does not depend on outside forces."],["E","Having trust in the people."]],"a":"D","g":"The conditions stated in the course textbook include: \"First, common interests must be taken as the rallying point, while respecting legitimate differing interests\"; \"Second, the nation's tradition of patriotism, humanity and unity must be inherited\"; \"Third, there must be tolerance and generosity towards people\"; and \"Fourth, there must be trust in the people\". The condition \"Building a completely independent and self-reliant economy\" is not directly mentioned as a condition for building the bloc of great national unity in the course textbook."},{"id":"en12-11","cd":"12","l":"SAI","q":"Which of the following methods is NOT mentioned as one of the methods of building the bloc of great national unity according to Ho Chi Minh?","o":[["A","Doing mass mobilisation work well."],["B","Establishing mass associations and organisations suited to each group in order to rally the masses."],["C","Mass associations and organisations are rallied and united in the National United Front."],["D","Coercing organisations that do not voluntarily join the Front in order to ensure unity and strength."],["E","Educating, propagandising, guiding, helping and mobilising the people to carry out the guidelines and lines of the Party."]],"a":"D","g":"The three methods of building the bloc of great national unity stated are: \"First, doing mass mobilisation work well\"; \"Second, establishing mass associations and organisations suited to each group in order to rally the masses\"; and \"Third, mass associations and organisations are rallied and united in the National United Front\". The method \"Coercing organisations that do not voluntarily join the Front\" goes against the principle of democratic consultation and is not mentioned in the course textbook. Option E is part of mass mobilisation work."},{"id":"en12-12","cd":"12","l":"SAI","q":"Which of the following statements is NOT accurate about the principle of democratic consultation in the activities of the National United Front?","o":[["A","All issues of the Front must be brought out for all members to discuss openly together."],["B","Ruling out all imposition or formalistic democracy in the decision-making process."],["C","Legitimate particular interests that are consistent with the common interests of the country and the nation need to be respected."],["D","Particular interests that are inconsistent with the common interests will be resolved through their suppression and elimination by the supreme common interest."],["E","Operating according to this principle helps to gather all strata, classes, political parties, ethnic groups and religions into the Front."]],"a":"D","g":"The course textbook clearly states that particular, inconsistent interests \"will gradually be resolved by the common interest of the nation, by the increasingly correct understanding of each person and each section of the relationship between the common interest and particular interests\". This way of resolving them is based on understanding and persuasion, not on \"suppression and elimination\". Options A, B, C and E are all correct according to the course textbook."},{"id":"en12-13","cd":"12","l":"NH","q":"According to the course textbook, which of the following names have been used for the National United Front in different historical periods?","o":[["A","Anti-Imperialist Alliance League"],["B","Indochinese Democratic Front"],["C","Vietnam Great Unity Front"],["D","Viet Minh Front"],["E","Vietnam Fatherland Front"]],"a":"ABDE","g":"The course textbook lists the names that have been used, such as: \"the Anti-Imperialist Alliance League (1930), the Indochinese Democratic Front (1936),... the Viet Minh Front (1941)... the Vietnam Fatherland Front (1955, 1976)...\". The \"Vietnam Great Unity Front\" is not a specific name mentioned in this list."},{"id":"en12-14","cd":"12","l":"NH","q":"According to the course textbook, which of the following factors contribute to the \"invincible strength\" and \"enduring value\" of the Vietnamese nation's tradition of patriotism, humanity and unity?","o":[["A","It was formed, consolidated and developed throughout the nation's thousands of years of building and defending the country."],["B","It has deeply permeated the thoughts, feelings and soul of every Vietnamese person."],["C","It is the wellspring of strength for the whole nation to fight and defeat natural disasters and enemy aggression."],["D","It has been handed down through many generations and has become an enduring value."],["E","It is shown most clearly and takes effect only in large-scale resistance wars against foreign invaders."]],"a":"ABCD","g":"The course textbook points out: \"This tradition was formed, consolidated and developed throughout the nation's thousands of years of building and defending the country and has become an enduring value, deeply permeating the thoughts, feelings and soul of every Vietnamese person, handed down through many generations. That tradition is the wellspring of invincible strength for the whole nation to fight and defeat natural disasters and enemy aggression\". Option E is not accurate, because this tradition has enduring value throughout the whole process, not only in large-scale resistance wars."},{"id":"en12-15","cd":"12","l":"NH","q":"According to Ho Chi Minh, which of the following aspects need attention when carrying out mass mobilisation work to build the bloc of great national unity?","o":[["A","Explaining to the masses so that they understand that the things to be done are for their own benefit."],["B","The methods of approaching and mobilising must suit the thoughts and aspirations of the masses."],["C","Starting from the actual level of the people's education and culture, including the specific customs and practices of each group."],["D","Helping the people to understand fully and deeply the rights, responsibilities and obligations of citizens towards the Party and the Fatherland."],["E","Giving priority to mobilising the highly educated strata to lead the other strata."]],"a":"ABCD","g":"The course textbook clearly states: \"one must patiently find every way to explain to them so that they understand that those things must be done for their own benefit\"; \"all methods of approaching and mobilising the masses must suit the thoughts and aspirations of the masses; they must start from the actual level of the people's education and culture, in both the broad and the narrow sense, including customs and practices, and be specific to each locality and each group of the people\"; and \"the people must be helped to understand fully and deeply the rights, responsibilities and obligations of citizens towards the Party, towards the Fatherland and towards the nation\". Option E is not mention"},{"id":"en12-16","cd":"12","l":"NH","q":"For the National United Front to truly gather the whole nation into a solid bloc under the leadership of the Party, which core principles of building and operation must be ensured?","o":[["A","It must be built on the foundation of the worker–peasant–intellectual alliance and placed under the leadership of the Party."],["B","It must operate according to the principle of democratic consultation, ruling out all imposition."],["C","Its unity must be long-term, close, genuine and sincere, with members helping one another affectionately to progress together."],["D","It must follow the motto of \"seeking common ground while preserving differences\" to resolve differences."],["E","It must concentrate power in a few key members in order to make decisions quickly and effectively."]],"a":"ABCD","g":"The principles of building and operation of the National United Front include: \"First, it must be built on the foundation of the worker–peasant–intellectual alliance and placed under the leadership of the Party\"; \"Second, it must operate according to the principle of democratic consultation\"; and \"Third, its unity must be long-term, close, genuine and sincere, with members helping one another affectionately to progress together\". The motto of \"seeking common ground while preserving differences\" is also part of this principle of unity. Option E contradicts the principle of democratic consultation."},{"id":"en12-17","cd":"12","l":"DK","q":"According to Ho Chi Minh, if the country is independent but the people do not enjoy happiness and freedom, then independence means nothing. Therefore, unity must take the _______ of the nation and the fundamental interests of the working people as the goal to strive for.","o":[["A","private interests"],["B","supreme interests"],["C","economic interests"],["D","legitimate interests"],["E","initial interests"]],"a":"B","g":"The course textbook clearly states: \"Therefore unity must take the supreme interests of the nation and the fundamental interests of the working people as the goal to strive for\"."},{"id":"en12-18","cd":"12","l":"DK","q":"Ho Chi Minh advised his compatriots: \"The five fingers are of different lengths, some short, some long. But short and long, they all come together in the hand. Among several million people there are people of this sort or that sort, but whether of this sort or that sort, they are all descendants of our ancestors. So we must be lenient and magnanimous.\" He used this image to illustrate the need for _______ towards people in building great unity.","o":[["A","loyalty"],["B","patience"],["C","courage"],["D","tolerance and generosity"],["E","determination"]],"a":"D","g":"The passage above is quoted in the section \"Second, there must be tolerance and generosity towards people\". The phrase \"lenient and magnanimous\" is synonymous with tolerance and generosity."},{"id":"en12-19","cd":"12","l":"DK","q":"The Communist Party of Vietnam is both a member and the leading force of the Front. The Party has no interests of its own, but is closely bound up with _______, the whole nation.","o":[["A","a single class"],["B","the whole of society"],["C","a group of people"],["D","a political party"],["E","a single social stratum"]],"a":"B","g":"The course textbook affirms: \"The Party has no interests of its own, but is closely bound up with the interests of the whole of society and the whole nation\"."},{"id":"en12-20","cd":"12","l":"DK","q":"Mass associations and organisations, formed under the leadership of the Party, have the task of propagandising, educating, enlightening, mobilising and rallying all strata of the people to take part in the revolution and to struggle to protect their _______.","o":[["A","honour"],["B","traditions"],["C","customs"],["D","rights and interests"],["E","culture"]],"a":"D","g":"The course textbook clearly states that mass associations and organisations have the task of \"struggling to protect their rights and interests\" and \"defending the rights of the people\"."},{"id":"en12-21","cd":"12","l":"DS","q":"According to Ho Chi Minh, mass associations and organisations and the National United Front are the bond linking the Party with the people.","o":[],"a":"D","g":"The course textbook states: “Mass associations and organisations and the National United Front are the bond linking the Party with the people.” The statement matches this content."},{"id":"en12-22","cd":"12","l":"DS","q":"The National United Front brings together all patriotic organisations and individuals living in the country; overseas Vietnamese living abroad are outside the scope of the Front.","o":[],"a":"S","g":"The course textbook states: “The National United Front is where all patriotic organisations and individuals converge, gathering all Vietnamese people, both in the country and overseas Vietnamese living abroad.” Therefore, saying that overseas Vietnamese are outside the scope of the Front is incorrect."},{"id":"en12-23","cd":"12","l":"D1","q":"According to Ho Chi Minh, for the sake of the revolution, how is tolerance and generosity towards people expressed?","o":[["A","Gathering only those who are fully revolutionary-minded and have no shortcomings."],["B","Valuing even the smallest good in each person, so as to gather and unite all forces widely."],["C","Being tolerant only towards people of the same class or the same religion as oneself."],["D","Excluding from the bloc of unity anyone who has ever shown bad sides or limitations."],["E","Valuing only those who have made great contributions to the revolution."]],"a":"B","g":"The course textbook states: “Therefore, for the sake of the revolution, it is necessary to have tolerance and generosity, valuing even the smallest good in each person; only then can all forces be gathered and united widely.” The other options narrow or exclude forces, contrary to this condition."},{"id":"en12-24","cd":"12","l":"D1","q":"What did Ho Chi Minh define as the common purpose of the National United Front?","o":[["A","To replace the State in managing all aspects of social life."],["B","To protect the separate interests of each party and religion in the Front."],["C","To gather only the working class and the peasantry."],["D","To gather the nation's forces to the highest possible degree into the bloc of great national unity."],["E","To replace the Party's leading role in the revolution."]],"a":"D","g":"The course textbook states: “Ho Chi Minh defined the common purpose of the National United Front as gathering the nation's forces to the highest possible degree into the bloc of great national unity.”"},{"id":"en12-25","cd":"12","l":"SAI","q":"According to the textbook, which of the following statements about the National United Front across different periods is NOT correct?","o":[["A","Because of the requirements and tasks of each historical stage, the Front has had different names."],["B","The Front strives for the common goal of the independence and unification of the Fatherland and the freedom and happiness of the people."],["C","Each name refers to a separate organisation whose goals are entirely different from those of the previous one."],["D","The Front gathers large numbers of classes, strata, ethnic groups, religions, parties, organisations and patriotic individuals."],["E","From 1977 to the present, the Front has been called the Vietnam Fatherland Front."]],"a":"C","g":"The course textbook states: “Although it has had many different names, in essence it is only one socio-political organisation that gathers large numbers of classes, strata, ethnic groups, religions, parties, organisations and patriotic individuals at home and abroad, striving for the common goal of the independence and unification of the Fatherland and the freedom and happiness of the people.” It also states: “from 1977 to the present it has been the Vietnam Fatherland Front”. Therefore, regarding each name as a separate organisation with entirely different goals is incorrect."},{"id":"en12-26","cd":"12","l":"SAI","q":"According to Ho Chi Minh Thought, which of the following statements about mass associations and organisations is NOT correct?","o":[["A","They are organisations for gathering, educating and training the masses."],["B","The nature of people's associations and mass organisations is that they are organisations of the people."],["C","They have the task of educating, motivating and promoting the activeness of all strata of the people."],["D","They are the core of the bloc of great unity of the whole people."],["E","They are organised on one common model for everyone, with no need to suit each class, age group, gender or region."]],"a":"E","g":"The course textbook states: “These are organisations for gathering, educating and training the masses in a way suited to each class, ethnic group, religion, age group, gender and region”. The textbook names this method: “establishing mass associations and organisations suited to each target group in order to gather the masses”. Therefore, option E is incorrect."},{"id":"en12-27","cd":"12","l":"NH","q":"According to Ho Chi Minh's words quoted in the textbook, which of the following forces must be united?","o":[["A","Only members of the Communist Party of Vietnam."],["B","The parties, associations and notable personalities in the Vietnam Fatherland Front."],["C","The fraternal ethnic groups, together building the Fatherland."],["D","Only non-religious compatriots, because religious compatriots have different interests."],["E","Non-religious compatriots and compatriots of all religions, together building a harmonious, well-fed and warm life."]],"a":"BCE","g":"The course textbook states: “We must unite well the parties, associations and notable personalities in the Vietnam Fatherland Front, carrying out long-term cooperation, helping one another and progressing together. We must unite the fraternal ethnic groups, together building the Fatherland... We must unite closely non-religious compatriots and compatriots of all religions, together building a harmonious, well-fed and warm life and building the Fatherland”. Options A and D narrow the bloc of unity, contrary to his words."},{"id":"en12-28","cd":"12","l":"NH","q":"According to Ho Chi Minh, what does “genuine unity” within the National United Front require?","o":[["A","The purpose must be unanimous and the standpoint must also be unanimous."],["B","Only uniting, avoiding all struggle and criticism in order to keep the peace."],["C","Both uniting and struggling, learning each other's good points and criticising each other's mistakes."],["D","Criticising from an affectionate standpoint, for the country and for the people."],["E","Members must give up all their own interests, including legitimate ones."]],"a":"ACD","g":"The course textbook states: “Genuine unity means that the purpose must be unanimous and the standpoint must also be unanimous. Genuine unity means both uniting and struggling, learning each other's good points, criticising each other's mistakes, and criticising from an affectionate standpoint, for the country and for the people”. Option E is wrong because the textbook also states: “Legitimate individual interests that are consistent with the common interests of the country and the nation should be respected”."},{"id":"en12-29","cd":"12","l":"DK","q":"According to Ho Chi Minh, the broader, closer and more unified the National United Front is, the more _______ the bloc of great national unity becomes.","o":[["A","complicated and hard to lead"],["B","scattered and loose"],["C","powerful and lasting"],["D","closed and isolated"],["E","formal and perfunctory"]],"a":"C","g":"The course textbook states: “The broader, closer and more unified the National United Front is, the more powerful and lasting the bloc of great national unity becomes.”"},{"id":"en12-30","cd":"12","l":"DK","q":"According to Ho Chi Minh, mobilising the masses in order to attract them is precisely in order to _______ everyone, creating a driving force for socio-economic and cultural development.","o":[["A","classify"],["B","control"],["C","manage"],["D","replace"],["E","unite"]],"a":"E","g":"The course textbook states: “Mobilising the masses in order to attract them is precisely in order to unite everyone, creating a driving force for socio-economic and cultural development.”"},{"id":"en13-1","cd":"13","l":"DS","q":"In Ho Chi Minh's view, cadres' practice of “industry, thrift, integrity, righteousness” is not only an example for the people but also the only means of combating decadence and degeneration in the state apparatus.","o":[],"a":"S","g":"The course textbook points out that cadres and Party members must be the first to practise \"industry, thrift, integrity, righteousness\" in order to set an example for the people, and that if they fail to uphold them they \"easily become decadent and turn into parasites on the people\". However, the textbook does not assert that this is the \"only means\" of combating decadence; rather, it is a prerequisite. There may be many other measures not mentioned in this passage."},{"id":"en13-2","cd":"13","l":"DS","q":"Ho Chi Minh's idea of \"loyalty to the country, devotion to the people\", although it inherits traditional patriotic values, completely discards every element of traditional ethics in the conception of country and people in order to bring about a profound revolution.","o":[],"a":"S","g":"The course textbook clearly states that Ho Chi Minh's idea of \"loyalty to the country, devotion to the people\" \"not only inherits the traditional patriotic values of the nation but also overcomes the limitations of that tradition\", while giving it \"new and broad contents\" and \"bringing about a profound revolution\". The use of the word \"inherits\" shows that he did not \"completely discard every element of traditional ethics\" but selected, developed and renewed the content on the foundation of tradition."},{"id":"en13-3","cd":"13","l":"DS","q":"According to Ho Chi Minh, love for people must be built on the standpoint of the working class and is expressed only through concrete, practical actions in everyday relationships.","o":[],"a":"S","g":"The course textbook clearly states: \"Love for people, according to Ho Chi Minh, must be built on the standpoint of the working class, expressed in everyday relationships with friends, comrades and brothers, and must be shown in concrete, practical actions\". However, the textbook also mentions other aspects such as \"being very strict and demanding with oneself; broad-minded, tolerant and generous towards others; having an attitude of respect for human rights, creating conditions for people to develop their talents; raising people up...\". The word \"only\" in the statement makes it false because it narrows the scope of how love for people is expressed."},{"id":"en13-4","cd":"13","l":"DS","q":"Internationalism according to Ho Chi Minh requires respect for and solidarity with the proletariat and the oppressed nations throughout the world, while completely eliminating narrow nationalism in order to achieve eternal peace.","o":[],"a":"S","g":"The course textbook affirms that Ho Chi Minh is a symbol of \"genuine patriotism harmoniously combined with proletarian internationalism\". The textbook does mention \"opposing narrow, chauvinistic and isolationist nationalism and hegemonic expansionism\". However, \"harmoniously combining\" genuine patriotism does not mean \"completely eliminating\" nationalism (rather, eliminating its \"narrow\" part). Moreover, the text of the textbook does not assert that such elimination will directly \"achieve eternal peace\"."},{"id":"en13-5","cd":"13","l":"D1","q":"The statement \"Every benefit is for the people. Every power belongs to the people… Authority and strength all rest with the people\" (the course textbook) most clearly expresses which aspect of Ho Chi Minh's ethical conception of \"loyalty to the country, devotion to the people\"?","o":[["A","A thorough inheritance of the traditional conception of \"loyalty to the king\"."],["B","The supreme role of the Party and the Government in deciding all benefits and powers."],["C","A profound revolution in the conception of country and people, placing the people in the position of the principal actor."],["D","The sole goal of making the people rich and the country strong at any cost."],["E","A clear separation between the interests of the country and the interests of the people."]],"a":"C","g":"The course textbook affirms that when Ho Chi Minh stated \"Every benefit is for the people. Every power belongs to the people… Authority and strength all rest with the people\", and that the Party and the Government are \"servants of the people\", then \"the conception of country and people was completely overturned compared with before; very few revolutionary leaders have spoken about the people in this way, and this put Ho Chi Minh's ethical thought far ahead\". This directly shows that it is a profound revolution, placing the people at the centre as the principal actor holding power and interests. The other options do not reflect the meaning of this statement correctly or fully."},{"id":"en13-6","cd":"13","l":"D1","q":"According to Ho Chi Minh, the quality of \"selfless impartiality\" is most deeply understood as:","o":[["A","Not thinking of personal interests in any form whatsoever."],["B","Always putting the interests of the Party, the people and the nation first and above all, while standing in complete opposition to individualism."],["C","A basic, independent virtue unrelated to \"industry, thrift, integrity, righteousness\"."],["D","One's enjoyment must always come after that of others, without exception."],["E","Applying only to senior cadres with great power."]],"a":"B","g":"The course textbook defines: \"Selfless impartiality means acting wholly for the common interest, not for private gain; it means being utterly fair, without the slightest partiality or favouritism, being fair-minded, always putting the interests of the Party, the people and the nation first and above all; caring only for the Party and the nation, 'worrying before everyone else and rejoicing after everyone else'\". The textbook also states clearly that \"selfless impartiality means combating individualism\". Option A is too absolute (\"not thinking of personal interests in any form whatsoever\"), whereas the textbook only says \"do not think of yourself first... when it comes to enjoyment, you shoul"},{"id":"en13-7","cd":"13","l":"D1","q":"Among the following statements on the quality of \"integrity\" according to Ho Chi Minh, which one expresses its very quintessence, surpassing the traditional conception?","o":[["A","\"Integrity means being clean, not greedy.\""],["B","\"The word INTEGRITY must go hand in hand with the word THRIFT. Just as the word THRIFT must go with the word INDUSTRY.\""],["C","\"Integrity means not coveting position. Not coveting money. Not coveting comfort.\""],["D","\"Not craving flattery. Therefore being open and upright, never becoming corrupt.\""],["E","\"There is only one craving: the craving to learn, to work, to make progress.\""]],"a":"E","g":"Options A, B, C and D are all important aspects of \"integrity\" according to Ho Chi Minh. However, option E, \"There is only one craving: the craving to learn, to work, to make progress\", is a particular highlight, expressing a positive, progressive conception of \"integrity\". Instead of focusing only on not being greedy (which already existed in tradition), he added new content, directing people to have healthy, positive aspirations for the development of themselves and of society. This raises the meaning of \"integrity\" to a new level, far beyond merely keeping oneself clean and free of corruption."},{"id":"en13-8","cd":"13","l":"D1","q":"The statements \"Bring a selflessly impartial heart to dealing with people and with work\" and \"Whatever you do, do not think of yourself first... when it comes to enjoyment, you should come after others\" (the course textbook) show the deepest connection with which other moral quality set out by Ho Chi Minh?","o":[["A","Pure internationalism."],["B","Love for people, living with affection and righteousness."],["C","Industry, thrift, integrity, righteousness."],["D","Loyalty to the country, devotion to the people."],["E","Self-reliance in labour."]],"a":"C","g":"The course textbook explains clearly: \"Selfless impartiality is in essence a continuation of industry, thrift, integrity, righteousness.\" This directly indicates the deepest connection between selfless impartiality and industry, thrift, integrity, righteousness. Bringing selfless impartiality to people and to work, not thinking of oneself first when working, and taking one's enjoyment after others are concrete expressions of integrity, righteousness and freedom from greed, and they also show a spirit free of self-interest, which is the core of \"industry, thrift, integrity, righteousness, and selfless impartiality\"."},{"id":"en13-9","cd":"13","l":"SAI","q":"Which of the following statements does not correctly reflect the meaning of \"thrift\" in Ho Chi Minh Thought?","o":[["A","Thrift does not mean stinginess but spending according to a plan and with a clear purpose."],["B","Saving labour, time and money, not only of the individual but also of the collective and the nation."],["C","When there is a worthwhile task that benefits compatriots and the Fatherland, there is no need to economise on however much labour and money it takes."],["D","Ostentatious formalities and endless feasting and drinking are behaviours contrary to the spirit of \"thrift\"."],["E","Thrift requires resolutely avoiding extravagance in all circumstances, including activities for the common good."]],"a":"E","g":"The course textbook defines: \"Thrift means saving, not being extravagant, not being wasteful, not being careless... Thrift is not stinginess. When one should not spend, not even a single coin should be spent. When there is a worthwhile task, a task that benefits compatriots and the Fatherland, then however much labour it takes and however much money it costs, one does it gladly. Only that is true thrift.\" Option E, which asserts that \"thrift requires resolutely avoiding extravagance in all circumstances, including activities for the common good\", is wrong because the textbook clearly allows (even encourages) spending \"however much labour and money\" on \"a task that benefits compatriots and th"},{"id":"en13-10","cd":"13","l":"SAI","q":"Which of the following statements does not correctly reflect Ho Chi Minh's idea of \"loyalty to the country, devotion to the people\"?","o":[["A","It is the most important overarching moral quality, governing the other qualities."],["B","It marks a fundamental change from the traditional conception of \"loyalty to the king, filial piety to one's parents\" to new content."],["C","It not only inherits traditional patriotic values but also overcomes their limitations."],["D","It is made concrete by making \"the people rich and the country strong\" and \"serving the people wholeheartedly and with all one's strength\"."],["E","It requires absolute loyalty to the Fatherland but does not include trusting the people and learning from the people."]],"a":"E","g":"Option E is wrong because the course textbook clearly states: \"Devotion to the people means loving the people, trusting the people, being close to the people, learning from the people, drawing on the wisdom of the people, respecting the people, taking the people as the root, 'serving the people wholeheartedly and with all one's strength. One must love and respect the people. One must truly respect the people's right to mastery'\". Thus \"trusting the people and learning from the people\" are core contents of \"devotion to the people\"."},{"id":"en13-11","cd":"13","l":"SAI","q":"Which of the following statements is incorrect about Ho Chi Minh's application and development of traditional moral concepts?","o":[["A","He used old concepts such as \"loyalty\" and \"filial piety\" but gave them new, broad and revolutionary content."],["B","He filtered out unsuitable content from the concepts of \"industry, thrift, integrity, righteousness, and selfless impartiality\" and introduced new content to meet the requirements of the revolution."],["C","This inheritance and development was merely formal; at its core the traditional values were kept unchanged so that they would be more easily absorbed."],["D","The view that \"New morality is like a person standing firmly with both feet on the ground and the head raised towards the sky\" illustrates a profound reversal compared with the old morality."],["E","He affirmed that cadres must practise \"industry, thrift, integrity, righteousness\" first to set an example for the people, unlike feudalism, which forced the people to obey."]],"a":"C","g":"The course textbook points out that Ho Chi Minh used old concepts such as \"loyalty to the king, filial piety to one's parents\" but with \"new and broad contents: “loyalty to the country, devotion to the people”, which brought about a profound revolution in the field of ethics\". He also made the comparison: \"Old morality is like a person standing upside down, head on the ground and feet in the air. New morality is like a person standing firmly with both feet on the ground and the head raised towards the sky\". As for \"industry, thrift, integrity, righteousness, and selfless impartiality\", he also \"filtered out unsuitable content and introduced new content meeting the requirements of the revolut"},{"id":"en13-12","cd":"13","l":"SAI","q":"Which of the following statements does not correctly express Ho Chi Minh's spirit of \"righteousness\" in the relationship \"towards work\"?","o":[["A","One must put the work of the nation above and before all private and family matters."],["B","A good deed, however small, must be done by every effort."],["C","An evil deed, however small, must be absolutely avoided."],["D","One must always comply with all regulations and laws, with no flexibility in any case."],["E","It shows straightforwardness, propriety and freedom from crookedness in all actions and decisions related to work."]],"a":"D","g":"The course textbook defines: \"Righteousness means not being crooked; it means being straightforward and proper. Whatever is not proper and straightforward is crooked\". In the relationship \"towards work\", he made it clear that one \"must put the work of the nation above and before private and family matters… a good deed, however small, must be done; an evil deed, however small, must be avoided\". The textbook does not mention \"always complying with all regulations and laws, with no flexibility in any case\" at all. This is an inference not found in the text and may depart from the spirit of \"righteousness\", which emphasises straightforwardness, propriety, doing good and avoiding evil rather than"},{"id":"en13-13","cd":"13","l":"NH","q":"Which of the following features did Ho Chi Minh emphasise in practising the quality of \"industry\"?","o":[["A","Working according to a plan and with high productivity."],["B","A spirit of self-reliance, not depending on others."],["C","Regarding labour as a sacred duty and a source of happiness."],["D","Always searching and being creative in one's work."],["E","Being diligent, hard-working, persevering and resilient."]],"a":"ABCDE","g":"The course textbook lists the features of \"industry\" in full: \"Industry means being diligent, hard-working, making resilient efforts… For the word Industry to bring more results, there must be a plan for every task… Industry means working industriously and diligently: working according to a plan, creatively and with high productivity; working in a spirit of self-reliance, not being lazy. It must be clearly seen that 'Labour is a sacred duty, the source of our life and the source of our happiness'\". All the options are mentioned directly or indirectly in this passage."},{"id":"en13-14","cd":"13","l":"NH","q":"According to Ho Chi Minh, which of the following aspects does \"love for people\" express?","o":[["A","It is a deep and broad humane sentiment for the poor, the oppressed and the exploited."],["B","Making no distinction of skin colour, nationality or gender in one's love for people."],["C","It drives revolutionaries to accept hardship and sacrifice for national independence and human happiness."],["D","It requires an attitude of respect for human rights, creating conditions for people to develop their talents, and helping up those who have gone astray."],["E","It requires every person to be very strict and demanding with themselves."]],"a":"ACDE","g":"A: The course textbook states: \"Love for people is a deep and broad humane sentiment, first of all for the poor, those deprived of their rights, the oppressed and the exploited\". (Correct) B: The textbook states \"...regardless of skin colour or nationality.\" Adding \"gender\" makes this option not entirely accurate according to the textbook. C: The textbook says: \"Out of love for the people and love for human beings, Ho Chi Minh was ready to accept every hardship and sacrifice to bring independence to the nation and freedom and happiness to human beings\". (Correct) D: The textbook says: \"It requires every person to be very strict and demanding with themselves; broad-minded, tolerant and genero"},{"id":"en13-15","cd":"13","l":"NH","q":"Which of the following qualities did Ho Chi Minh regard as the foundation of the new life and of the patriotic emulation movements, and as the basic virtues of a human being, such that \"if one virtue is lacking, one is not a complete person\"?","o":[["A","Loyalty."],["B","Industry."],["C","Thrift."],["D","Integrity."],["E","Righteousness."]],"a":"BCDE","g":"The course textbook records: \"Industry, thrift, integrity, righteousness are also the foundation of the new life and of the patriotic emulation movements. To become a person of good moral character, one must have all the elements of industry, thrift, integrity, righteousness. Ho Chi Minh regarded industry, thrift, integrity, righteousness as the four basic virtues of a human being, like the four seasons of heaven and the four directions of the earth; 'If one virtue is lacking, one is not a complete person'\". Thus the qualities referred to are Industry, Thrift, Integrity and Righteousness. Loyalty is an overarching quality, but it is not one of the qualities referred to in the context of \"the"},{"id":"en13-16","cd":"13","l":"NH","q":"According to Ho Chi Minh, which of the following aspects does the content of pure internationalism include?","o":[["A","Respect, understanding, love and solidarity with the proletariat of the whole world."],["B","Supporting and assisting the struggles of the peoples of all countries for peace and national independence."],["C","Opposing all division, hatred, inequality and racial discrimination."],["D","Opposing narrow, chauvinistic nationalism and hegemonic expansionism."],["E","Giving national interests priority over all international interests in case of conflict."]],"a":"ABCD","g":"The course textbook clearly sets out the content of internationalism in Ho Chi Minh's thought: \"It is respect, understanding, love and solidarity with the proletariat of the whole world, with the oppressed nations, with all nations and the peoples of all countries, with progressive people across the globe; opposing all division, hatred, inequality and racial discrim
