xét những lợi ích cá nhân đúng đắn và bảo đảm cho nó được thỏa mãn để mỗi người có điều kiện cải thiện đời sống riêng của mình, phát huy tính cách riêng và sở trường riêng trong sự hài hòa với đời sống chung, lợi ích chung của tập thể\"."},{"id":"vn06-22","cd":"06","l":"NH","q":"Các tư tưởng và tác phong xã hội chủ nghĩa mà mỗi con người Việt Nam cần bồi dưỡng để xây dựng chủ nghĩa xã hội, theo Hồ Chí Minh, bao gồm những gì?","o":[["A","Có ý thức làm chủ nhà nước."],["B","Có tinh thần tập thể xã hội chủ nghĩa và tư tưởng “mình vì mọi người, mọi người vì mình”."],["C","Có quan điểm “tất cả phục vụ sản xuất”."],["D","Có ý thức cần kiệm xây dựng nước nhà."],["E","Có tinh thần tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội."]],"a":"ABCDE","g":"Hồ Chí Minh khái quát: \"Những tư tưởng và tác phong mới mà mỗi người cần bồi dưỡng cho mình là: Có ý thức làm chủ nhà nước, có tỉnh thần tập thể xã hội chủ nghĩa và tư tưởng “mình vì mọi người, mọi người vì mình\"; có quan điểm “tất cả phục vụ sản xuất”; có ý thức cần kiệm xây dựng nước nhà; có tinh thần tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội\"."},{"id":"vn06-23","cd":"06","l":"NH","q":"Trong hệ thống động lực xây dựng chủ nghĩa xã hội, những yếu tố nào gắn bó hữu cơ với nhau, tạo nên sức mạnh tổng hợp theo tư tưởng Hồ Chí Minh?","o":[["A","Lợi ích của dân."],["B","Dân chủ của dân."],["C","Đoàn kết toàn dân."],["D","Sự lãnh đạo của Đảng."],["E","Hoạt động quản lý của Nhà nước."]],"a":"ABC","g":"\"Trong tư tưởng Hồ Chí Minh, lợi ích của dân, dân chủ của dân, đoàn kết toàn dân gắn bó hữu cơ với nhau, là cơ sở, tiền đề của nhau, tạo nên những động lực mạnh mẽ nhất trong hệ thống những động lực của chủ nghĩa xã hội\". Sự lãnh đạo của Đảng và quản lý của Nhà nước là thông qua hoạt động của các tổ chức để phát huy các động lực này."},{"id":"vn06-24","cd":"06","l":"NH","q":"Để chủ nghĩa xã hội có thể xây dựng được, Hồ Chí Minh cho rằng cần có sự tham gia tích cực của nhân dân thông qua những biểu hiện nào?","o":[["A","Sự giác ngộ đầy đủ của nhân dân về quyền lợi và quyền hạn."],["B","Sự giác ngộ về trách nhiệm và địa vị dân chủ của mình."],["C","Sự lao động sáng tạo của hàng chục triệu quần chúng nhân dân."],["D","Quyền được biểu tình và lập hội mà không có bất kỳ giới hạn nào."],["E","Hoàn toàn phụ thuộc vào sự lãnh đạo của Đảng mà không cần sáng tạo cá nhân."]],"a":"ABC","g":"Hồ Chí Minh cho rằng \"chủ nghĩa xã hội chỉ có thể xây dựng được với sự giác ngộ đầy đủ của nhân dân về quyền lợi và quyền hạn, trách nhiệm và địa vị dân chủ của mình; với sự lao động sáng tạo của hàng chục triệu quần chúng nhân dân\". Quyền biểu tình có nhưng đi kèm với nghiêm cấm lợi dụng. Phương án E mâu thuẫn với \"lao động sáng tạo\"."},{"id":"vn06-25","cd":"06","l":"DK","q":"Hồ Chí Minh khẳng định mục tiêu về chế độ chính trị của chủ nghĩa xã hội ở Việt Nam là \"Chế độ ta là chế độ dân chủ. Tức là nhân dân _______\".","o":[["A","là chủ"],["B","làm chủ"],["C","quản lý"],["D","tự quyết"],["E","lãnh đạo"]],"a":"B","g":"Trích dẫn trực tiếp từ tài liệu: \"Chế độ ta là chế độ dân chủ. Tức là nhân dân làm chủ”1\"."},{"id":"vn06-26","cd":"06","l":"DK","q":"Mục tiêu về kinh tế của chủ nghĩa xã hội ở Việt Nam được Hồ Chí Minh xác định là \"một nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu _______\".","o":[["A","cá nhân"],["B","tập thể"],["C","hỗn hợp"],["D","Nhà nước"],["E","tư nhân"]],"a":"B","g":"Trích dẫn trực tiếp từ tài liệu: \"một nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu tập thể”."},{"id":"vn06-27","cd":"06","l":"DK","q":"Về vai trò của văn hóa, Hồ Chí Minh khẳng định: \"Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển _______. Nâng cao trình độ văn hóa của nhân dân cũng là một việc làm cần thiết để xây dựng nước ta thành một nước hòa bình, thống nhất độc lập, dân chủ và giàu mạnh”.","o":[["A","khoa học"],["B","công nghệ"],["C","dân chủ"],["D","xã hội"],["E","sản xuất"]],"a":"C","g":"Trích dẫn trực tiếp từ tài liệu: \"Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển dân chủ\"."},{"id":"vn06-28","cd":"06","l":"DK","q":"Theo Hồ Chí Minh, để thúc đẩy tiến trình cách mạng xã hội chủ nghĩa, \"phải bảo đảm lợi ích của dân, dân chủ của dân, sức mạnh _______ toàn dân\".","o":[["A","hợp tác"],["B","thống nhất"],["C","đoàn kết"],["D","phát triển"],["E","sáng tạo"]],"a":"C","g":"Trích dẫn trực tiếp từ tài liệu: \"phải bảo đảm lợi ích của dân, dân chủ của dân, sức mạnh đoàn kết toàn dân\"."},{"id":"vn06-29","cd":"06","l":"DK","q":"Hồ Chí Minh nhận thấy trong xã hội xã hội chủ nghĩa mỗi người giữ một vị trí nhất định, đóng góp một phần công lao nhất định vì nhân dân lao động đã thoát khỏi bần cùng, có công ăn việc làm, có cuộc sống ấm no, hạnh phúc, nên ngay từ những ngày đầu xây dựng chế độ xã hội mới, Người đã dạy: “việc gì có lợi cho dân phải hết sức làm, việc gì có hại cho dân phải hết sức _______”.","o":[["A","loại bỏ"],["B","ngăn cản"],["C","tránh"],["D","phê phán"],["E","hạn chế"]],"a":"C","g":"Trích dẫn trực tiếp từ tài liệu: “việc gì có lợi cho dân phải hết sức làm, việc gì có hại cho dân phải hết sức tránh”."},{"id":"vn06-30","cd":"06","l":"DK","q":"Trong tư tưởng Hồ Chí Minh, quan điểm “xây” đi đôi với “chống” cũng là một trong những quan điểm _______ tư tưởng Hồ Chí Minh, là một trong những nét đặc sắc của tư tưởng Hồ Chí Minh.","o":[["A","cơ bản"],["B","cốt lõi"],["C","xuyên suốt"],["D","mới mẻ"],["E","chủ yếu"]],"a":"C","g":"Trích dẫn trực tiếp từ tài liệu: \"quan điểm “xây” đi đôi với “chống” cũng là một trong những quan điểm xuyên suốt tư tưởng Hồ Chí Minh\"."},{"id":"vn07-1","cd":"07","l":"DS","q":"Theo tư tưởng Hồ Chí Minh, vai trò lãnh đạo của Đảng Cộng sản Việt Nam chỉ là một yếu tố hỗ trợ, không mang tính quyết định đến thành công của cách mạng Việt Nam.","o":[],"a":"S","g":"Tài liệu khẳng định Hồ Chí Minh ví Đảng cộng sản \"như người cầm lái\" và nhấn mạnh \"Đảng có vững, cách mệnh mới thành công\", thể hiện vai trò quyết định. Tài liệu cũng khẳng định sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu. Do đó, việc cho rằng vai trò này chỉ là yếu tố hỗ trợ là không chính xác."},{"id":"vn07-2","cd":"07","l":"DS","q":"Lý luận về sự ra đời của đảng cộng sản kiểu mới theo V.I. Lênin chỉ áp dụng nguyên bản, không cần vận dụng sáng tạo vào điều kiện cụ thể của Việt Nam để hình thành Đảng Cộng sản Việt Nam.","o":[],"a":"S","g":"Tài liệu nêu rõ Hồ Chí Minh \"trung thành với học thuyết Mác - Lênin... đồng thời vận dụng sáng tạo và phát triển lý luận đó vào điều kiện cụ thể của Việt Nam\". Điều này phủ nhận quan điểm chỉ áp dụng nguyên bản mà không có sự vận dụng sáng tạo."},{"id":"vn07-3","cd":"07","l":"DS","q":"Mâu thuẫn cơ bản nhất trong xã hội thuộc địa và phong kiến Việt Nam, tạo tiền đề cho sự ra đời của Đảng Cộng sản Việt Nam, chủ yếu là mâu thuẫn giữa giai cấp vô sản và giai cấp tư sản.","o":[],"a":"S","g":"Tài liệu chỉ rõ \"mâu thuẫn cơ bản giữa toàn thể nhân dân Việt Nam với các thế lực đế quốc và tay sai\". Mặc dù có đấu tranh giai cấp, nhưng mâu thuẫn dân tộc là bao trùm và cơ bản nhất trong bối cảnh xã hội thuộc địa và phong kiến Việt Nam."},{"id":"vn07-4","cd":"07","l":"DS","q":"Tổ chức Hội Việt Nam Cách mệnh Thanh niên do Hồ Chí Minh lập ra đã góp phần vào sự chuyển biến xu hướng của một số người yêu nước từ dân chủ tư sản sang cộng sản rõ nhất từ năm 1925.","o":[],"a":"D","g":"Tài liệu chỉ rõ \"Một số người Việt Nam yêu nước lúc đầu đi theo xu hướng dân chủ tư sản, nhưng qua thực tế, dưới sự ảnh hưởng của chủ nghĩa Mác – Lênin, đã dần dần chuyển sang xu hướng cộng sản, rõ nhất là từ năm 1925 trở đi. Hàng loạt tổ chức yêu nước ra đời, trong đó tiêu biểu nhất là tổ chức Hội Việt Nam Cách mệnh Thanh niên do Hồ Chí Minh lập ra.\" Điều này khẳng định vai trò của tổ chức này trong sự chuyển biến xu hướng."},{"id":"vn07-5","cd":"07","l":"D1","q":"Theo các tài liệu, đâu là yếu tố cốt lõi nhất giải thích tính tất yếu của sự lãnh đạo Đảng Cộng sản Việt Nam trong quá trình phát triển của đất nước theo mục tiêu chủ nghĩa xã hội?","o":[["A","Khả năng tập hợp quần chúng của Hồ Chí Minh."],["B","Sự tiên phong của giai cấp công nhân."],["C","Yêu cầu phát triển nội tại của dân tộc Việt Nam."],["D","Sự can thiệp và hỗ trợ từ các nước xã hội chủ nghĩa khác."],["E","Tính ưu việt của mô hình đảng kiểu mới theo V.I. Lênin."]],"a":"C","g":"Tài liệu nêu rõ \"sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu, vai trò lãnh đạo của Đảng cũng là một tất yếu – điều đó xuất phát từ yêu cầu phát triển của dân tộc Việt Nam\". Các lựa chọn khác có thể là yếu tố góp phần hoặc hệ quả, nhưng \"yêu cầu phát triển của dân tộc Việt Nam\" là lý do cốt lõi nhất được đề cập trực tiếp."},{"id":"vn07-6","cd":"07","l":"D1","q":"Điểm khác biệt cơ bản trong sự ra đời của Đảng Cộng sản Việt Nam so với lý luận chung của Mác - Lênin về đảng cộng sản được các tài liệu nhấn mạnh là gì?","o":[["A","Sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân."],["B","Sự lãnh đạo của một nhà cách mạng kiệt xuất như Hồ Chí Minh."],["C","Sự kết hợp thêm yếu tố phong trào yêu nước."],["D","Việc vận dụng các nguyên tắc của đảng kiểu mới."],["E","Mục tiêu đấu tranh giành độc lập dân tộc."]],"a":"C","g":"Tài liệu chỉ ra: học thuyết Mác - Lênin cho rằng đảng cộng sản là sản phẩm của \"chủ nghĩa xã hội khoa học với phong trào công nhân\". Trong khi đó, sự ra đời của Đảng Cộng sản Việt Nam là \"kết quả của sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước\". Yếu tố \"phong trào yêu nước\" là điểm khác biệt được nhấn mạnh trong bối cảnh Việt Nam."},{"id":"vn07-7","cd":"07","l":"D1","q":"Điều nào sau đây phản ánh chính xác nhất nhận định của Hồ Chí Minh về vai trò của Đảng đối với cách mạng trong tác phẩm Đường cách mệnh?","o":[["A","Đảng là người tổ chức các cuộc đàm phán quốc tế."],["B","Đảng là trung tâm đào tạo cán bộ chính trị cấp cao."],["C","Đảng là \"người cầm lái\" vững chắc cho con thuyền cách mạng."],["D","Đảng đóng vai trò là cơ quan lập pháp tối cao."],["E","Đảng chủ yếu tập trung vào việc phát triển kinh tế."]],"a":"C","g":"Tài liệu trích dẫn Hồ Chí Minh khẳng định đảng cộng sản \"như người cầm lái\" cho con thuyền cách mạng và khẳng định đây là quan điểm nhất quán của Người. Các lựa chọn khác không phản ánh cụm từ đặc trưng và ý nghĩa cốt lõi này."},{"id":"vn07-8","cd":"07","l":"D1","q":"Theo các tài liệu, sự chuyển biến tư tưởng từ xu hướng dân chủ tư sản sang xu hướng cộng sản trong các phong trào yêu nước ở Việt Nam từ năm 1925 chủ yếu chịu ảnh hưởng bởi yếu tố nào?","o":[["A","Sự thất bại của các phong trào nông dân."],["B","Ảnh hưởng trực tiếp từ các cuộc cách mạng tư sản phương Tây."],["C","Sự ra đời của các phong trào công nhân độc lập."],["D","Tác động của chủ nghĩa Mác – Lênin và thực tiễn đấu tranh."],["E","Sự hỗ trợ quân sự từ Liên Xô."]],"a":"D","g":"Tài liệu cho biết \"Một số người Việt Nam yêu nước lúc đầu đi theo xu hướng dân chủ tư sản, nhưng qua thực tế, dưới sự ảnh hưởng của chủ nghĩa Mác – Lênin, đã dần dần chuyển sang xu hướng cộng sản, rõ nhất là từ năm 1925 trở đi.\" Điều này nhấn mạnh vai trò của chủ nghĩa Mác – Lênin kết hợp với thực tiễn đấu tranh."},{"id":"vn07-9","cd":"07","l":"SAI","q":"Phát biểu nào sau đây không đúng về bối cảnh xã hội Việt Nam tạo tiền đề cho sự ra đời của Đảng Cộng sản Việt Nam?","o":[["A","Là một xã hội thuộc địa và phong kiến."],["B","Tồn tại mâu thuẫn cơ bản giữa toàn thể nhân dân Việt Nam với các thế lực đế quốc và tay sai."],["C","Giai cấp tư sản mại bản và đại địa chủ cũng tham gia vào phong trào đấu tranh dân tộc."],["D","Các phong trào đấu tranh của công nhân đã kết hợp nhuần nhuyễn với phong trào yêu nước."],["E","Các tổ chức yêu nước đã ra đời và phát triển mạnh mẽ."]],"a":"C","g":"Tài liệu khẳng định trong xã hội thuộc địa và phong kiến Việt Nam, \"mọi giai cấp, tầng lớp, trừ tư sản mại bản và đại địa chủ, đều có mâu thuẫn dân tộc\". Điều này ngụ ý rằng tư sản mại bản và đại địa chủ không có mâu thuẫn dân tộc và do đó không tham gia vào phong trào đấu tranh dân tộc, làm cho phát biểu C không đúng."},{"id":"vn07-10","cd":"07","l":"SAI","q":"Điều nào sau đây không phản ánh quan điểm của Hồ Chí Minh về Đảng Cộng sản Việt Nam dựa trên các tài liệu đã cho?","o":[["A","Đảng được sáng lập và rèn luyện bởi Hồ Chí Minh."],["B","Đảng tồn tại và phát triển theo quan điểm của V.I. Lênin về đảng kiểu mới."],["C","Đảng chỉ tập trung vào đấu tranh giai cấp, tách rời đấu tranh dân tộc."],["D","Đảng có vai trò \"người cầm lái\" cho con thuyền cách mạng."],["E","Đảng đảm bảo, phát huy vai trò lãnh đạo theo mục tiêu chủ nghĩa xã hội."]],"a":"C","g":"Tài liệu chỉ rõ \"Đấu tranh giai cấp hòa quyện với đấu tranh dân tộc.\" Quan điểm này cho thấy Đảng không tách rời hai loại đấu tranh này, mà ngược lại, kết hợp chúng. Do đó, phát biểu C không phản ánh đúng quan điểm của Hồ Chí Minh."},{"id":"vn07-11","cd":"07","l":"SAI","q":"Theo các tài liệu, sự ra đời của Đảng Cộng sản Việt Nam không phải là hệ quả trực tiếp từ yếu tố nào sau đây?","o":[["A","Nhu cầu tất yếu của xã hội Việt Nam từ đầu năm 1930."],["B","Sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân."],["C","Việc toàn dân tộc trao cho sứ mệnh lãnh đạo đất nước."],["D","Sự kết hợp chủ nghĩa Mác - Lênin với phong trào yêu nước."],["E","Sự xuất hiện của một lực lượng tư sản dân tộc đủ mạnh để lãnh đạo cách mạng."]],"a":"E","g":"Tài liệu và cho thấy giai cấp tư sản mại bản và đại địa chủ không có mâu thuẫn dân tộc, và các phong trào yêu nước ban đầu theo xu hướng dân chủ tư sản đã dần chuyển sang cộng sản vì thiếu một con đường đúng đắn. Tài liệu không hề đề cập đến việc xuất hiện một lực lượng tư sản dân tộc đủ mạnh để lãnh đạo cách mạng, mà ngược lại, sự chuyển hướng sang cộng sản chứng tỏ điều ngược lại. Các lựa chọn A, B, C, D đều được đề cập là yếu tố cấu thành hoặc hệ quả của sự ra đời của Đảng."},{"id":"vn07-12","cd":"07","l":"SAI","q":"Phát biểu nào dưới đây không đúng khi nói về quá trình vận dụng và phát triển tư tưởng Hồ Chí Minh về vai trò lãnh đạo của Đảng Cộng sản Việt Nam?","o":[["A","Quá trình vận dụng này đã chỉ ra sự lãnh đạo của Đảng là một nguyên tắc vận hành của xã hội Việt Nam."],["B","Vai trò lãnh đạo của Đảng chỉ mới được khẳng định trong cách mạng xã hội chủ nghĩa."],["C","Quan điểm về \"người cầm lái\" là nhất quán trong suốt quá trình cách mạng."],["D","Mục tiêu phát triển đất nước theo chủ nghĩa xã hội là trọng tâm."],["E","Đảm bảo và phát huy vai trò lãnh đạo của Đảng là một điều tất yếu."]],"a":"B","g":"Tài liệu khẳng định quan điểm về vai trò lãnh đạo của Đảng là \"nhất quán của Hồ Chí Minh... trong suốt quá trình cách mạng, cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\" Điều này mâu thuẫn với phát biểu B rằng vai trò này chỉ mới được khẳng định trong cách mạng xã hội chủ nghĩa."},{"id":"vn07-13","cd":"07","l":"NH","q":"Theo các tài liệu, những yếu tố nào sau đây đã góp phần vào sự ra đời của Đảng Cộng sản Việt Nam?","o":[["A","Chủ nghĩa Mác - Lênin."],["B","Phong trào công nhân."],["C","Phong trào yêu nước."],["D","Sự ủng hộ của giai cấp đại địa chủ."],["E","Nhu cầu tất yếu của xã hội Việt Nam."]],"a":"ABC","g":"Tài liệu nêu rõ \"Sự ra đời của Đảng Cộng sản Việt Nam là kết quả của sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước.\"."},{"id":"vn07-14","cd":"07","l":"NH","q":"Phát biểu nào sau đây thể hiện đúng vai trò của Đảng Cộng sản Việt Nam theo tư tưởng Hồ Chí Minh và thực tiễn được các tài liệu đề cập?","o":[["A","Đảng là \"người cầm lái\" cho con thuyền cách mạng."],["B","Sự lãnh đạo của Đảng là một nguyên tắc vận hành của xã hội Việt Nam."],["C","Đảng có sứ mệnh lãnh đạo đất nước trong sự nghiệp giải phóng dân tộc."],["D","Đảng chỉ vận động và tổ chức dân chúng trong nước."],["E","Đảng đại diện cho lợi ích của một bộ phận giai cấp tư sản."]],"a":"ABC","g":"Tài liệu khẳng định Đảng là \"người cầm lái\". Tài liệu cho biết sự lãnh đạo của Đảng là \"một nguyên tắc vận hành của xã hội Việt Nam\". Tài liệu nói Đảng được trao \"sứ mệnh lãnh đạo đất nước trong sự nghiệp giải phóng dân tộc và đi lên chủ nghĩa xã hội\". Tài liệu cũng chỉ ra Đảng liên lạc \"với dân tộc bị áp bức và vô sản giai cấp mọi nơi\" chứ không chỉ trong nước, làm cho D sai. E rõ ràng không đúng với bản chất của đảng cộng sản."},{"id":"vn07-15","cd":"07","l":"NH","q":"Theo các tài liệu, đâu là những đặc điểm đúng về quá trình hình thành tư tưởng cộng sản ở Việt Nam trước năm 1930?","o":[["A","Một số người yêu nước lúc đầu đi theo xu hướng dân chủ tư sản."],["B","Các phong trào yêu nước chuyển dần sang xu hướng cộng sản dưới ảnh hưởng của chủ nghĩa Mác – Lênin."],["C","Hội Việt Nam Cách mệnh Thanh niên là tổ chức tiêu biểu góp phần vào sự chuyển biến này."],["D","Mâu thuẫn dân tộc là động lực chính của các phong trào yêu nước."],["E","Chỉ có giai cấp công nhân mới có mâu thuẫn dân tộc."]],"a":"ABCD","g":"Tài liệu mô tả \"Một số người Việt Nam yêu nước lúc đầu đi theo xu hướng dân chủ tư sản, nhưng qua thực tế, dưới sự ảnh hưởng của chủ nghĩa Mác – Lênin, đã dần dần chuyển sang xu hướng cộng sản, rõ nhất là từ năm 1925 trở đi. Hàng loạt tổ chức yêu nước ra đời, trong đó tiêu biểu nhất là tổ chức Hội Việt Nam Cách mệnh Thanh niên do Hồ Chí Minh lập ra.\" Tài liệu khẳng định \"mọi giai cấp, tầng lớp, trừ tư sản mại bản và đại địa chủ, đều có mâu thuẫn dân tộc\", nên D đúng và E sai."},{"id":"vn07-16","cd":"07","l":"NH","q":"Những nhận định nào sau đây là đúng về mối quan hệ giữa đấu tranh giai cấp và đấu tranh dân tộc trong bối cảnh ra đời của Đảng Cộng sản Việt Nam?","o":[["A","Đấu tranh giai cấp và đấu tranh dân tộc diễn ra độc lập, không liên quan đến nhau."],["B","Đấu tranh giai cấp hòa quyện với đấu tranh dân tộc."],["C","Các phong trào tuy khác nhau về lực lượng, phương thức, khẩu hiệu đấu tranh nhưng cùng chung mục tiêu giành độc lập, tự do cho dân tộc."],["D","Mâu thuẫn dân tộc là mâu thuẫn cơ bản, chi phối bối cảnh xã hội."],["E","Đấu tranh giai cấp chủ yếu do tư sản mại bản lãnh đạo."]],"a":"BCD","g":"Tài liệu khẳng định \"Đấu tranh giai cấp hòa quyện với đấu tranh dân tộc\" và \"Các phong trào đó tuy khác nhau về lực lượng, phương thức, khẩu hiệu đấu tranh nhưng cùng chung mục tiêu giành độc lập, tự do cho dân tộc.\" Tài liệu xác định \"mâu thuẫn cơ bản giữa toàn thể nhân dân Việt Nam với các thế lực đế quốc và tay sai\" là mâu thuẫn dân tộc. Do đó, A và E là sai."},{"id":"vn07-17","cd":"07","l":"DK","q":"Hồ Chí Minh khẳng định: Cách mạng \"Trước hết phải có đảng cách mệnh, để trong thì vận động và tổ chức dân chúng, ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp mọi nơi. Đảng có vững, cách mệnh mới thành công, cũng như người _______ có vững thuyền mới chạy”.","o":[["A","kiến trúc sư"],["B","chỉ huy"],["C","cầm lái"],["D","tiên phong"],["E","dẫn đường"]],"a":"C","g":"Tài liệu trực tiếp trích dẫn Hồ Chí Minh: \"Đảng có vững, cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy”."},{"id":"vn07-18","cd":"07","l":"DK","q":"Sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu, vai trò lãnh đạo của Đảng cũng là một tất yếu – điều đó xuất phát từ _______ của dân tộc Việt Nam.","o":[["A","truyền thống lịch sử"],["B","ý chí chính trị"],["C","yêu cầu phát triển"],["D","khát vọng cường thịnh"],["E","nền tảng văn hóa"]],"a":"C","g":"Tài liệu nêu rõ \"sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu... điều đó xuất phát từ yêu cầu phát triển của dân tộc Việt Nam.\""},{"id":"vn07-19","cd":"07","l":"DK","q":"Quan điểm của Hồ Chí Minh về sự ra đời của Đảng hoàn toàn phù hợp với xã hội _______ và phong kiến như Việt Nam, khi mọi giai cấp, tầng lớp, trừ tư sản mại bản và đại địa chủ, đều có mâu thuẫn dân tộc.","o":[["A","phong kiến"],["B","thuộc địa"],["C","công nghiệp"],["D","dân chủ"],["E","tư bản"]],"a":"B","g":"Tài liệu khẳng định \"Quan điểm của Hồ Chí Minh hoàn toàn phù hợp với xã hội thuộc địa và phong kiến như Việt Nam\"."},{"id":"vn07-20","cd":"07","l":"DK","q":"Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập và rèn luyện là một đảng chính trị tồn tại và phát triển theo những quan điểm của V.I. Lênin về đảng _______ của giai cấp vô sản.","o":[["A","kiểu mẫu"],["B","kiểu mới"],["C","tiền phong"],["D","trung tâm"],["E","cách mạng"]],"a":"B","g":"Tài liệu nêu rõ Đảng Cộng sản Việt Nam \"tồn tại và phát triển theo những quan điểm của V.I.Lênin về đảng kiểu mới của giai cấp vô sản.\""},{"id":"vn07-21","cd":"07","l":"DS","q":"Theo Tài liệu môn học, Hồ Chí Minh khẳng định cách mạng “Trước hết phải có đảng cách mệnh” trong tác phẩm Đường cách mệnh (năm 1927).","o":[],"a":"D","g":"Tài liệu môn học ghi: “Trong tác phẩm Đường cách mệnh (năm 1927), Hồ Chí Minh khẳng định: Cách mạng ‘Trước hết phải có đảng cách mệnh’.” Nhận định trên đúng cả về tác phẩm lẫn thời điểm."},{"id":"vn07-22","cd":"07","l":"DS","q":"Theo Tài liệu môn học, trong thực tế ở Việt Nam trước khi Đảng ra đời, phong trào đấu tranh của công nhân phát triển tách biệt, không kết hợp với phong trào yêu nước.","o":[],"a":"S","g":"Tài liệu môn học ghi: “Trong thực tế, những phong trào đấu tranh của công nhân đã kết hợp được rất nhuần nhuyễn với phong trào yêu nước.” Vì vậy, nhận định cho rằng hai phong trào phát triển tách biệt là sai."},{"id":"vn07-23","cd":"07","l":"D1","q":"Theo Tài liệu môn học, học thuyết Mác - Lênin cho rằng sự ra đời của đảng cộng sản là sản phẩm của sự kết hợp giữa những yếu tố nào?","o":[["A","Chủ nghĩa Mác - Lênin với phong trào yêu nước."],["B","Chủ nghĩa xã hội khoa học với phong trào công nhân."],["C","Chủ nghĩa xã hội khoa học với phong trào công nhân và phong trào yêu nước."],["D","Phong trào công nhân với phong trào nông dân."],["E","Chủ nghĩa yêu nước với chủ nghĩa quốc tế vô sản."]],"a":"B","g":"Tài liệu môn học ghi: “Học thuyết Mác - Lênin cho rằng, sự ra đời của đảng cộng sản là sản phẩm của sự kết hợp của chủ nghĩa xã hội khoa học với phong trào công nhân.” Yếu tố phong trào yêu nước thuộc nhận định của Hồ Chí Minh đối với riêng Việt Nam, không nằm trong công thức chung của học thuyết Mác - Lênin, nên phương án C không đúng."},{"id":"vn07-24","cd":"07","l":"D1","q":"Theo Tài liệu môn học, toàn dân tộc đã trao cho Đảng Cộng sản Việt Nam sứ mệnh gì?","o":[["A","Lãnh đạo đất nước chỉ trong sự nghiệp giải phóng dân tộc."],["B","Lãnh đạo đất nước chỉ trong công cuộc xây dựng chủ nghĩa xã hội sau khi đã giành được độc lập."],["C","Đại diện riêng cho lợi ích của giai cấp công nhân trong cuộc đấu tranh giai cấp."],["D","Thay mặt Quốc tế Cộng sản chỉ đạo phong trào cách mạng ở các nước thuộc địa."],["E","Lãnh đạo đất nước trong sự nghiệp giải phóng dân tộc và đi lên chủ nghĩa xã hội."]],"a":"E","g":"Tài liệu môn học ghi: “Đảng đã được toàn dân tộc trao cho sứ mệnh lãnh đạo đất nước trong sự nghiệp giải phóng dân tộc và đi lên chủ nghĩa xã hội.” Sứ mệnh bao gồm cả giải phóng dân tộc và đi lên chủ nghĩa xã hội, nên phương án A, B (chỉ một chặng) cũng như C, D đều không đúng."},{"id":"vn07-25","cd":"07","l":"SAI","q":"Theo Tài liệu môn học, nhận định nào sau đây không đúng về Đảng Cộng sản Việt Nam?","o":[["A","Đảng Cộng sản Việt Nam do Quốc tế Cộng sản trực tiếp sáng lập và rèn luyện."],["B","Sự lãnh đạo của Đảng là một tất yếu, xuất phát từ yêu cầu phát triển của dân tộc Việt Nam."],["C","Khẳng định Đảng “như người cầm lái” là quan điểm nhất quán của Hồ Chí Minh cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa."],["D","Quan điểm của Hồ Chí Minh về sự ra đời của Đảng hoàn toàn phù hợp với xã hội thuộc địa và phong kiến như Việt Nam."],["E","Sự ra đời của Đảng là kết quả của sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước."]],"a":"A","g":"Tài liệu môn học ghi: “Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập và rèn luyện là một đảng chính trị tồn tại và phát triển theo những quan điểm của V.I. Lênin về đảng kiểu mới của giai cấp vô sản.” Người sáng lập và rèn luyện Đảng là Hồ Chí Minh, nên phương án A không đúng; các nhận định B, C, D, E đều được Tài liệu môn học khẳng định."},{"id":"vn07-26","cd":"07","l":"SAI","q":"Theo Tài liệu môn học, nhận định nào sau đây không đúng về các phong trào đấu tranh ở Việt Nam trước khi Đảng Cộng sản Việt Nam ra đời?","o":[["A","Đấu tranh giai cấp hòa quyện với đấu tranh dân tộc."],["B","Một số người Việt Nam yêu nước lúc đầu đi theo xu hướng dân chủ tư sản, sau đó dần dần chuyển sang xu hướng cộng sản."],["C","Hàng loạt tổ chức yêu nước ra đời, trong đó tiêu biểu nhất là Hội Việt Nam Cách mạng Thanh niên do Hồ Chí Minh lập ra."],["D","Các phong trào đã thống nhất với nhau về lực lượng, phương thức và khẩu hiệu đấu tranh."],["E","Các phong trào cùng chung mục tiêu giành độc lập, tự do cho dân tộc."]],"a":"D","g":"Tài liệu môn học ghi: “Các phong trào đó tuy khác nhau về lực lượng, phương thức, khẩu hiệu đấu tranh nhưng cùng chung mục tiêu giành độc lập, tự do cho dân tộc.” Các phong trào khác nhau (chứ không thống nhất) về lực lượng, phương thức, khẩu hiệu đấu tranh, nên phương án D không đúng."},{"id":"vn07-27","cd":"07","l":"NH","q":"Theo lời Hồ Chí Minh trong tác phẩm Đường cách mệnh được Tài liệu môn học trích dẫn, đảng cách mệnh có những nhiệm vụ nào sau đây?","o":[["A","Ở trong thì vận động và tổ chức dân chúng."],["B","Ở ngoài thì liên lạc với chính phủ các nước thực dân để thương lượng trao trả độc lập."],["C","Ở ngoài thì liên lạc với dân tộc bị áp bức mọi nơi."],["D","Ở ngoài thì liên lạc với vô sản giai cấp mọi nơi."],["E","Đứng ngoài phong trào quần chúng để giữ tính độc lập của đảng."]],"a":"ACD","g":"Tài liệu môn học ghi: “Trước hết phải có đảng cách mệnh, để trong thì vận động và tổ chức dân chúng, ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp mọi nơi.” Phương án B và E không có trong lời Hồ Chí Minh; phương án E còn trái với nhiệm vụ vận động và tổ chức dân chúng."},{"id":"vn07-28","cd":"07","l":"NH","q":"Theo Tài liệu môn học, những nhận định nào sau đây đúng về mối quan hệ giữa Đảng Cộng sản Việt Nam và lý luận của V.I. Lênin về đảng kiểu mới của giai cấp vô sản?","o":[["A","Lý luận về đảng kiểu mới chỉ phù hợp với các nước tư bản phát triển nên Hồ Chí Minh không vận dụng vào Việt Nam."],["B","Đảng Cộng sản Việt Nam tồn tại và phát triển theo những quan điểm của V.I. Lênin về đảng kiểu mới của giai cấp vô sản."],["C","Hồ Chí Minh trung thành với học thuyết Mác - Lênin, trong đó có lý luận của V.I. Lênin về đảng kiểu mới."],["D","Đảng Cộng sản Việt Nam được tổ chức theo mô hình đảng của giai cấp tư sản dân tộc."],["E","Hồ Chí Minh vận dụng sáng tạo và phát triển lý luận về đảng kiểu mới vào điều kiện cụ thể của Việt Nam."]],"a":"BCE","g":"Tài liệu môn học ghi: “Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập và rèn luyện là một đảng chính trị tồn tại và phát triển theo những quan điểm của V.I. Lênin về đảng kiểu mới của giai cấp vô sản.” và “Hồ Chí Minh là người trung thành với học thuyết Mác - Lênin, trong đó có lý luận của V.I. Lênin về đảng kiểu mới của giai cấp vô sản, đồng thời vận dụng sáng tạo và phát triển lý luận đó vào điều kiện cụ thể của Việt Nam.” Phương án A và D trái với những nội dung này."},{"id":"vn07-29","cd":"07","l":"DK","q":"Trong tác phẩm Đường cách mệnh, Hồ Chí Minh viết: “Đảng có vững, cách mệnh mới _______, cũng như người cầm lái có vững thuyền mới chạy”.","o":[["A","bền lâu"],["B","lan rộng"],["C","mạnh mẽ"],["D","thành công"],["E","hòa bình"]],"a":"D","g":"Tài liệu môn học ghi: “Đảng có vững, cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy”. Câu nói khẳng định Đảng vững mạnh là điều kiện để cách mạng thành công."},{"id":"vn07-30","cd":"07","l":"DK","q":"Theo Tài liệu môn học, Đảng Cộng sản Việt Nam ra đời, tồn tại và phát triển chính là do _______ của xã hội Việt Nam từ đầu năm 1930 trở đi.","o":[["A","nhu cầu tất yếu"],["B","sự áp đặt từ bên ngoài"],["C","ý muốn chủ quan"],["D","sự ngẫu nhiên lịch sử"],["E","sức ép của chính quyền thực dân"]],"a":"A","g":"Tài liệu môn học ghi: “Đảng Cộng sản Việt Nam ra đời, tồn tại và phát triển chính là do nhu cầu tất yếu của xã hội Việt Nam từ đầu năm 1930 trở đi.”"},{"id":"vn08-1","cd":"08","l":"DS","q":"Tư tưởng Hồ Chí Minh khẳng định Đảng Cộng sản Việt Nam ra đời là một tất yếu lịch sử, phù hợp với quy luật phát triển văn minh, tiến bộ của dân tộc và nhân loại, nhưng không nhất thiết mọi hoạt động của Đảng đều phải xuất phát từ yêu cầu phát triển của dân tộc.","o":[],"a":"S","g":"Theo Tài liệu môn học, \"Đảng ra đời là một tất yếu, phù hợp với quy luật phát triển văn minh, tiến bộ của dân tộc và của nhân loại. Mọi hoạt động của Đảng đều xuất phát từ yêu cầu phát triển của dân tộc, lấy lợi ích tối cao của dân tộc làm trọng, mọi lợi ích giai cấp đều phải đặt dưới sự phát triển của dân tộc; mọi hoạt động của Đảng đều phải phù hợp với quy luật vận động của xã hội Việt Nam\". Do đó, việc nói rằng \"không nhất thiết mọi hoạt động của Đảng đều phải xuất phát từ yêu cầu phát triển của dân tộc\" là không chính xác."},{"id":"vn08-2","cd":"08","l":"DS","q":"Hồ Chí Minh xem tự phê bình và phê bình là \"thang thuốc\" tốt nhất để củng cố sự đoàn kết và thống nhất trong Đảng, nhưng không phải lúc nào cũng cần phải trung thực, kiên quyết vì có thể ảnh hưởng đến tình đồng chí.","o":[],"a":"S","g":"Tài liệu môn học nêu rõ: \"tự phê bình và phê bình phải trung thực, kiên quyết, đúng người, đúng việc, phải có văn hoá…\". Đồng thời, Người cũng nhấn mạnh: \"Trong Đảng thực hành dân chủ rộng rãi, thường xuyên và nghiêm chỉnh tự phê bình và phê bình là cách tốt nhất để củng cố sự đoàn kết và thống nhất trong Đảng. Phải có tình đồng chí thương yêu lẫn nhau\". Tức là, tính trung thực, kiên quyết không mâu thuẫn mà còn là điều kiện để củng cố đoàn kết, thống nhất trên nền tảng tình đồng chí."},{"id":"vn08-3","cd":"08","l":"DS","q":"Theo Hồ Chí Minh, Đảng Cộng sản Việt Nam là đội tiên phong của giai cấp công nhân và nhân dân lao động, nhưng không nhất thiết phải là hiện thân của văn hóa dân tộc.","o":[],"a":"S","g":"Tài liệu môn học khẳng định: \"Hồ Chí Minh ý thức được rằng, Đảng Cộng sản Việt Nam nhất thiết phải là hiện thân của văn hóa dân tộc vì Đảng là đội tiên phong không những của giai cấp công nhân mà còn là đội tiên phong của nhân dân lao động và của dân tộc\". Do đó, nhận định rằng Đảng không nhất thiết phải là hiện thân của văn hóa dân tộc là không chính xác."},{"id":"vn08-4","cd":"08","l":"DS","q":"Kỷ luật của Đảng theo tư tưởng Hồ Chí Minh chỉ thực sự nghiêm minh và bền vững khi nó được xây dựng trên lòng tự giác của đảng viên về nhiệm vụ của họ đối với Đảng, chứ không đơn thuần là sự áp đặt từ trên xuống dưới.","o":[],"a":"D","g":"Tài liệu môn học chỉ rõ: \"Kỷ luật này là do lòng tự giác của đảng viên về nhiệm vụ của họ đối với Đảng; khi đã tự giác thì kỷ luật của Đảng mới nghiêm và mới bền lâu, thực sự tạo sức mạnh cho Đảng\". Mặc dù kỷ luật cũng nghiêm từ trên xuống dưới, nhưng yếu tố tự giác là nền tảng cho sự bền vững và sức mạnh thực sự của kỷ luật."},{"id":"vn08-5","cd":"08","l":"DS","q":"Khi lợi ích chung của Đảng mâu thuẫn với lợi ích riêng của cá nhân, đảng viên và cán bộ theo Hồ Chí Minh được phép cân nhắc, đàm phán để dung hòa nhằm đảm bảo quyền lợi chính đáng của bản thân.","o":[],"a":"S","g":"Tài liệu môn học nhấn mạnh: \"Nếu gặp khi lợi ích chung của Đảng mâu thuẫn với lợi ích riêng của cá nhân, thì phải kiên quyết hy sinh lợi ích của cá nhân cho lợi ích của Đảng. Khi cần đến tính mệnh của mình cũng phải vui lòng hy sinh cho Đảng\". Không có sự cân nhắc hay đàm phán lợi ích cá nhân khi mâu thuẫn với lợi ích của Đảng."},{"id":"vn08-6","cd":"08","l":"DS","q":"Hồ Chí Minh cảnh báo rằng \"giặc nội xâm\" (tham ô, lãng phí, quan liêu) đáng sợ hơn \"địch bên ngoài\" vì chúng có khả năng phá hoại từ bên trong, nhưng vai trò của cán bộ, đảng viên trong việc phòng, chống các tiêu cực này chỉ dừng lại ở việc gương mẫu, không cần trực tiếp đối mặt và xử lý các hành vi đó.","o":[],"a":"S","g":"Tài liệu môn học khẳng định: \"Trong việc phòng, chống tiêu cực, cán bộ, đảng viên phải đặc biệt phòng, chống tham ô, lãng phí, quan liêu bởi Hồ Chí Minh cho đó là giặc nội xâm, là những kẻ địch bên trong, “mỗi kẻ địch bên trong là một bạn đồng minh của kẻ địch bên ngoài. Địch bên ngoài không đáng sợ. Địch bên trong đáng sợ hơn, vì nó phá hoại từ trong phá ra”\". Tài liệu môn học cũng nêu rõ cán bộ, đảng viên phải \"chịu trách nhiệm, năng động, sáng tạo\", \"dám chịu trách nhiệm trước Đảng, trước nhân dân\". Điều này ngụ ý trách nhiệm không chỉ là gương mẫu mà còn là trực tiếp đối mặt và xử lý các tiêu cực, thể hiện tinh thần chịu trách nhiệm chứ không phải chỉ dừng lại ở việc gương mẫu. ---------"},{"id":"vn08-7","cd":"08","l":"D1","q":"Theo Hồ Chí Minh, yếu tố nào được coi là \"cái gốc\" của mọi công việc, quyết định sự thành công hay thất bại?","o":[["A","Đường lối, chủ trương đúng đắn của Đảng."],["B","Sự lãnh đạo tài tình của cấp ủy các cấp."],["C","Chất lượng của đội ngũ cán bộ."],["D","Tinh thần đoàn kết, thống nhất trong toàn Đảng."],["E","Sự ủng hộ, tin tưởng tuyệt đối của quần chúng nhân dân."]],"a":"C","g":"Tài liệu môn học nêu rõ: \"cán bộ là gốc của mọi công việc, “muôn việc thành công hoặc thất bại, đều do cán bộ tốt hoặc kém”\". Điều này khẳng định chất lượng của đội ngũ cán bộ là yếu tố then chốt quyết định thành bại của mọi công việc."},{"id":"vn08-8","cd":"08","l":"D1","q":"Mục đích hoạt động của Đảng Cộng sản Việt Nam, theo tư tưởng Hồ Chí Minh, là gì để Đảng không có mục đích riêng?","o":[["A","Xây dựng một xã hội công bằng, văn minh dựa trên các giá trị truyền thống dân tộc."],["B","Lãnh đạo đấu tranh giải phóng dân tộc, giải phóng xã hội, làm cho dân tộc độc lập, nhân dân ấm no, tự do, hạnh phúc thực sự."],["C","Củng cố quyền lực của giai cấp công nhân và tầng lớp lao động trong xã hội."],["D","Thiết lập mối quan hệ hữu nghị bền vững với tất cả các quốc gia trên thế giới."],["E","Đảm bảo sự phát triển kinh tế nhanh chóng để nâng cao vị thế quốc gia trên trường quốc tế."]],"a":"B","g":"Tài liệu môn học và chỉ rõ: \"Thứ nhất, mục đích hoạt động của Đảng là lãnh đạo đấu tranh giải phóng dân tộc, giải phóng xã hội, giải phóng giai cấp, giải phóng con người. Đó là sự nghiệp cách mạng theo chủ nghĩa Mác - Lênin, làm cho dân tộc được độc lập, nhân dân có cuộc sống ấm no, tự do, hạnh phúc thực sự, đoàn kết hữu nghị với các dân tộc trên thế giới.\" và \"Đảng không có mục đích riêng; sự ra đời và phát triển của Đảng chỉ có mục đích duy nhất là làm cho đất nước hùng cường, đi lên chủ nghĩa xã hội, đưa lại quyền lợi cho dân\". Phương án B tổng hợp được ý chính này."},{"id":"vn08-9","cd":"08","l":"D1","q":"Trong các nguyên tắc xây dựng Đảng, Hồ Chí Minh nhấn mạnh điều kiện tiên quyết để thực hiện nguyên tắc tập trung dân chủ hiệu quả là gì?","o":[["A","Phải có sự lãnh đạo tập trung tuyệt đối của Trung ương Đảng."],["B","Toàn thể đảng viên phải tuyệt đối phục tùng chân lý và nghị quyết của Đảng."],["C","Tổ chức Đảng phải trong sạch, vững mạnh."],["D","Phải có sự giám sát chặt chẽ từ quần chúng nhân dân."],["E","Cần thiết lập cơ chế kiểm soát quyền lực độc lập trong Đảng."]],"a":"C","g":"Tài liệu môn học nêu rõ: \"Điều kiện tiên quyết khi thực hiện nguyên tắc này [tập trung dân chủ] là tổ chức Đảng phải trong sạch, vững mạnh\". Các phương án khác có thể là yếu tố bổ trợ nhưng không phải là \"điều kiện tiên quyết\" được Người trực tiếp nhấn mạnh."},{"id":"vn08-10","cd":"08","l":"D1","q":"Quan điểm \"Đảng mà không có chủ nghĩa cũng như người không có trí khôn, tàu không có bàn chỉ nam\" của Hồ Chí Minh muốn nói lên tầm quan trọng cốt lõi của nguyên tắc nào trong hoạt động của Đảng?","o":[["A","Tập trung dân chủ."],["B","Tự phê bình và phê bình."],["C","Kỷ luật nghiêm minh, tự giác."],["D","Lấy chủ nghĩa Mác - Lênin làm nền tảng tư tưởng và kim chỉ nam cho hành động."],["E","Đoàn kết, thống nhất trong Đảng."]],"a":"D","g":"Tài liệu môn học và khẳng định: \"Đảng lấy chủ nghĩa Mác - Lênin làm nền tảng tư tưởng và kim chỉ nam cho hành động: Trong tác phẩm Đường cách mệnh, Hồ Chí Minh khẳng định: “Đảng muốn vững thì phải có chủ nghĩa làm cốt, trong đảng ai cũng phải hiểu, ai cũng phải theo chủ nghĩa ấy. Đảng mà không có chủ nghĩa cũng như người không có trí khôn, tàu không có bàn chỉ nam. Tay giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mạng nhất là chủ nghĩa Lênin”\". Câu nói trên trực tiếp nói về tầm quan trọng của chủ nghĩa Mác-Lênin."},{"id":"vn08-11","cd":"08","l":"D1","q":"Hồ Chí Minh chỉ ra rằng một Đảng \"mất lòng tin là mất tất cả\". Yêu cầu cốt lõi nào đối với Đảng Cộng sản Việt Nam được suy ra từ nhận định này?","o":[["A","Tuyệt đối tuân thủ Hiến pháp và pháp luật."],["B","Luôn giữ gìn sự trong sạch, vững mạnh và liên hệ mật thiết với nhân dân."],["C","Không ngừng đổi mới phương thức lãnh đạo."],["D","Đảm bảo sự đoàn kết quốc tế bền vững."],["E","Phát triển kinh tế vượt bậc để nâng cao đời sống nhân dân."]],"a":"B","g":"Tài liệu môn học nhấn mạnh: \"Mất lòng tin là mất tất cả\". Ngay trước đó, Tài liệu môn học cũng nói \"cách xa dân chúng, không liên hệ chặt chẽ với dân chúng, cũng như đứng lơ lửng giữa trời, nhất định thất bại\". Và Tài liệu môn học cũng nói về việc Đảng phải \"học dân, làm cho dân tin, tức coi trọng chữ TÍN – dân tin Đảng và Đảng tin dân\". Điều này tổng hợp lại, cho thấy việc giữ gìn Đảng trong sạch, vững mạnh và đặc biệt là liên hệ mật thiết với nhân dân là cốt lõi để duy trì lòng tin."},{"id":"vn08-12","cd":"08","l":"D1","q":"Theo Hồ Chí Minh, \"Đảng không phải là một tổ chức để làm quan phát tài\" mà phải làm tròn nhiệm vụ giải phóng dân tộc, làm cho Tổ quốc giàu mạnh, đồng bào sung sướng. Điều này thể hiện rõ nhất nguyên tắc nào trong xây dựng Đảng?","o":[["A","Đảng lấy chủ nghĩa Mác - Lênin làm nền tảng tư tưởng."],["B","Đảng phải thường xuyên tự chỉnh đốn."],["C","Tập trung dân chủ."],["D","Đoàn kết, thống nhất trong Đảng."],["E","Kỷ luật nghiêm minh, tự giác."]],"a":"B","g":"Tài liệu môn học nêu rõ: \"Đảng không có mục đích tự thân, Đảng không phải là tổ chức để làm quan phát tài mà Đảng từ trong xã hội mà ra, hoạt động vì Tổ quốc giàu mạnh, đồng bào sung sướng. Do đó, thường xuyên tự chỉnh đốn trở thành một nhiệm vụ cực kỳ quan trọng trong xây dựng Đảng\". Câu hỏi này trực tiếp dẫn đến nguyên tắc tự chỉnh đốn. ------------------------------------------------------------------------"},{"id":"vn08-13","cd":"08","l":"SAI","q":"Theo tư tưởng Hồ Chí Minh về Đảng là đạo đức, là văn minh, điểm nào dưới đây không phải là biểu hiện của đạo đức Đảng?","o":[["A","Mục đích hoạt động là lãnh đạo đấu tranh giải phóng dân tộc, giải phóng xã hội."],["B","Cương lĩnh, đường lối luôn trung thành với lợi ích toàn dân tộc."],["C","Đảng có mục đích riêng là xây dựng một nhà nước hùng cường dưới sự lãnh đạo tuyệt đối của Đảng."],["D","Đội ngũ đảng viên thấm nhuần đạo đức cách mạng, suốt đời phấn đấu cho lợi ích của dân, của nước."],["E","Đảng là của giai cấp công nhân và nhân dân lao động, những người kiên quyết nhất, hăng hái nhất."]],"a":"C","g":"Tài liệu môn học khẳng định: \"Đảng không có mục đích riêng; sự ra đời và phát triển của Đảng chỉ có mục đích duy nhất là làm cho đất nước hùng cường, đi lên chủ nghĩa xã hội, đưa lại quyền lợi cho dân\". Do đó, nhận định Đảng có mục đích riêng là sai. Các phương án A, B, D, E đều là những điểm thể hiện đạo đức của Đảng theo Hồ Chí Minh."},{"id":"vn08-14","cd":"08","l":"SAI","q":"Trong các yêu cầu đối với đội ngũ cán bộ, đảng viên được Hồ Chí Minh đề cập, yêu cầu nào dưới đây không đúng?","o":[["A","Phải tuyệt đối trung thành với Đảng, sẵn sàng hy sinh lợi ích cá nhân cho Đảng."],["B","Phải luôn luôn học tập nâng cao trình độ về mọi mặt, nhưng không cần quá chú trọng vào đạo đức cách mạng vì đã có Đảng giáo dục."],["C","Phải có mối liên hệ mật thiết với nhân dân, là người đầy tớ trung thành của nhân dân."],["D","Phải luôn luôn chịu trách nhiệm, năng động, sáng tạo, dám chịu trách nhiệm trước Đảng và nhân dân."],["E","Phải luôn luôn phòng và chống các tiêu cực, đặc biệt là tham ô, lãng phí, quan liêu."]],"a":"B","g":"Tài liệu môn học nêu rõ yêu cầu xây dựng đội ngũ cán bộ, đảng viên \"vừa có đức vừa có tài\". Tài liệu môn học cụ thể hóa: \"Phải luôn luôn tu dưỡng, rèn luyện, trau dồi đạo đức cách mạng\" và \"Phải luôn luôn học tập nâng cao trình độ về mọi mặt\". Việc nói rằng \"không cần quá chú trọng vào đạo đức cách mạng vì đã có Đảng giáo dục\" là sai, vì tu dưỡng đạo đức là một yêu cầu thường xuyên và chủ động của mỗi đảng viên."},{"id":"vn08-15","cd":"08","l":"SAI","q":"Hồ Chí Minh cảnh báo về sự thoái hóa, biến chất của cán bộ, đảng viên. Trong các biểu hiện dưới đây, biểu hiện nào không được Người xem là dấu hiệu của thoái hóa, biến chất?","o":[["A","Mang nặng chủ nghĩa cá nhân, việc gì cũng nghĩ đến lợi ích riêng trước hết."],["B","Thích địa vị, quyền hành, coi thường tập thể và xem khinh quần chúng."],["C","Năng động, sáng tạo trong công việc, dám chịu trách nhiệm trước những khó khăn mới."],["D","Ngại gian khổ, sa vào tham ô, hủ hóa, lãng phí, xa hoa."],["E","Mắc bệnh quan liêu, mệnh lệnh, không chấp hành đúng đường lối, chính sách của Đảng và Nhà nước."]],"a":"C","g":"Tài liệu môn học liệt kê các biểu hiện thoái hóa, biến chất như: \"mang nặng chủ nghĩa cá nhân\", \"ngại gian khổ, sa vào tham ô, hủ hoá, lãng phí, xa hoa; tham danh, trục lợi, thích địa vị, quyền hành; coi thường tập thể, xem khinh quần chúng; độc đoán, chuyên quyền; mắc bệnh quan liêu, mệnh lệnh; không chịu học tập để tiến bộ; mất đoàn kết, thiếu tính tổ chức, kỷ luật; kém tinh thần trách nhiệm; không chấp hành đúng đường lối, chính sách của Đảng và Nhà nước\". Ngược lại, \"Năng động, sáng tạo trong công việc, dám chịu trách nhiệm trước những khó khăn mới\" là một phẩm chất tích cực mà Hồ Chí Minh yêu cầu ở cán bộ, đảng viên."},{"id":"vn08-16","cd":"08","l":"SAI","q":"Để Đảng thực sự là một Đảng văn minh, Hồ Chí Minh đã nêu ra nhiều nội dung chủ yếu. Nội dung nào sau đây không phù hợp với tư tưởng của Người về Đảng văn minh?","o":[["A","Đảng là một Đảng tiêu biểu cho lương tâm, trí tuệ và danh dự của dân tộc."],["B","Đảng hoạt động trong khuôn khổ Hiến pháp và pháp luật, không đứng trên dân tộc."],["C","Đảng phải luôn luôn trong sạch, vững mạnh, làm tròn sứ mệnh lịch sử do nhân dân, dân tộc giao phó."],["D","Mọi lợi ích giai cấp phải đặt lên trên lợi ích tối cao của dân tộc để đảm bảo sự tiến bộ xã hội."],["E","Đảng có quan hệ quốc tế trong sáng, bảo vệ lợi ích của dân tộc Việt Nam đồng thời tôn trọng độc lập của các quốc gia khác."]],"a":"D","g":"Tài liệu môn học nêu rõ: \"Mọi hoạt động của Đảng đều xuất phát từ yêu cầu phát triển của dân tộc, lấy lợi ích tối cao của dân tộc làm trọng, mọi lợi ích giai cấp đều phải đặt dưới sự phát triển của dân tộc\". Do đó, nhận định \"Mọi lợi ích giai cấp phải đặt lên trên lợi ích tối cao của dân tộc\" là hoàn toàn sai so với tư tưởng Hồ Chí Minh."},{"id":"vn08-17","cd":"08","l":"SAI","q":"Nguyên tắc \"Tập trung dân chủ\" được Hồ Chí Minh nhấn mạnh hai điều cần tránh trong hoạt động của Đảng để thực hiện hiệu quả. Điều nào dưới đây không thuộc hai điều cần tránh đó?","o":[["A","Độc đoán, chuyên quyền, coi thường tập thể."],["B","Dựa dẫm tập thể, không dám quyết đoán."],["C","Trì hoãn, chậm trễ trong việc ra quyết định do quá trình thảo luận kéo dài."],["D","Thiếu sự kết hợp hài hòa giữa tập thể lãnh đạo và cá nhân phụ trách."],["E","Cá nhân phụ trách mà không có sự lãnh đạo của tập thể."]],"a":"C","g":"Tài liệu môn học chỉ ra hai điều cần tránh: \"một là, độc oán, chuyên quyền, coi thường tập thể; hai là, dựa dẫm tập thể, không dám quyết đoán\". Phương án C (\"Trì hoãn, chậm trễ trong việc ra quyết định do quá trình thảo luận kéo dài\") không được đề cập trực tiếp như một trong hai điều cần tránh cụ thể đó, mặc dù nó có thể là một hệ quả tiêu cực của việc thực hiện nguyên tắc. Phương án D và E đều là những cách diễn đạt khác của việc không thực hiện đúng hai vế \"tập thể lãnh đạo, cá nhân phụ trách\", vốn là biểu hiện cụ thể của việc tránh độc đoán hoặc dựa dẫm."},{"id":"vn08-18","cd":"08","l":"SAI","q":"Hồ Chí Minh chỉ rõ những điểm thoái hóa, biến chất của cán bộ, đảng viên. Theo Người, điều nào sau đây không được coi là biểu hiện của \"chủ nghĩa cá nhân\" trong cán bộ, đảng viên?","o":[["A","Coi thường tập thể, xem khinh quần chúng."],["B","Độc đoán, chuyên quyền."],["C","Luôn đặt lợi ích của Đảng lên trên lợi ích cá nhân."],["D","Ngại gian khổ, sa vào tham ô, hủ hóa."],["E","Thiếu tinh thần trách nhiệm, không chấp hành đúng đường lối, chính sách."]],"a":"C","g":"Tài liệu môn học liệt kê các biểu hiện của chủ nghĩa cá nhân. Tài liệu môn học khẳng định: \"đảng viên và cán bộ phải đặt lợi ích của Đảng ra trước, lợi ích của cá nhân lại sau... Nếu gặp khi lợi ích chung của Đảng mâu thuẫn với lợi ích riêng của cá nhân, thì phải kiên quyết hy sinh lợi ích của cá nhân cho lợi ích của Đảng\". Việc \"luôn đặt lợi ích của Đảng lên trên lợi ích cá nhân\" là một phẩm chất tích cực, đối lập hoàn toàn với chủ nghĩa cá nhân. ------------------------------------------------------------------------"},{"id":"vn08-19","cd":"08","l":"NH","q":"Theo tư tưởng Hồ Chí Minh, để xây dựng Đảng Cộng sản Việt Nam thành một Đảng văn minh, cần phải đảm bảo những nội dung chủ yếu nào? (Chọn TẤT CẢ các đáp án đúng)","o":[["A","Đảng tiêu biểu cho lương tâm, trí tuệ và danh dự của dân tộc."],["B","Đảng hoạt động trong khuôn khổ Hiến pháp và pháp luật, không đứng trên dân tộc."],["C","Mọi lợi ích giai cấp phải đặt dưới sự phát triển của dân tộc."],["D","Đội ngũ đảng viên, nhất là cán bộ chủ chốt, phải là những chiến sĩ tiên phong, gương mẫu."],["E","Đảng có mục đích riêng là duy trì quyền lực lãnh đạo của mình trong mọi tình huống."]],"a":"ABCD","g":"Tài liệu môn học đến liệt kê các nội dung chủ yếu của Đảng văn minh: - \"Một là, Đảng văn minh là một Đảng tiêu biểu cho lương tâm, trí tuệ và danh dự của dân tộc\". - \"Hai là... mọi lợi ích giai cấp đều phải đặt dưới sự phát triển của dân tộc\". - \"Bốn là, xây dựng Đảng văn minh còn thể hiện ở việc Đảng hoạt động trong khuôn khổ Hiến pháp và pháp luật, Đảng không phải là tổ chức đứng trên dân tộc\". - \"Năm là, Đảng văn minh còn thể hiện ở chỗ đội ngũ đảng viên... nhất là những đảng viên giữ vị trí lãnh đạo, quản lý chủ chốt... đều phải là những chiến sĩ tiên phong, gương mẫu trong công tác và cuộc sống hằng ngày\". Phương án E là sai vì Tài liệu môn học khẳng định \"Đảng không có mục đích riêng\"."},{"id":"vn08-20","cd":"08","l":"NH","q":"Những phẩm chất đạo đức cách mạng nào mà Hồ Chí Minh đặc biệt chú trọng \"rèn\" cho cán bộ, đảng viên để Đảng là đạo đức, là văn minh? (Chọn TẤT CẢ các đáp án đúng)","o":[["A","Cần, kiệm, liêm, chính, chí công vô tư."],["B","Có lòng nhân ái, tình đồng chí thương yêu lẫn nhau."],["C","Trung với Đảng, trung với nước, hiếu với dân."],["D","Tinh thần quốc tế trong sáng."],["E","Khả năng lãnh đạo, quản lý và điều hành xuất sắc."]],"a":"ABCD","g":"Tài liệu môn học nêu rõ: \"Người nhấn mạnh, đảng viên càng phải là những người có lòng nhân ái, “phải có tình đồng chí thương yêu lẫn nhau “; trung với Đảng, trung với nước, hiếu với dân; có bốn đức: cần, kiệm, liêm, chính và luôn luôn chí công vô tư; có tinh thần quốc tế trong sáng\". Phương án E là một phẩm chất về năng lực, tài năng, không phải phẩm chất đạo đức mà Hồ Chí Minh tập trung \"rèn\" như những đức tính đạo đức cách mạng cụ thể."},{"id":"vn08-21","cd":"08","l":"NH","q":"Theo Hồ Chí Minh, những yếu tố nào tạo nên sức mạnh của một đảng cộng sản, giúp Đảng \"tuy đông người, nhưng khi tiến đánh chỉ như một người\"? (Chọn TẤT CẢ các đáp án đúng)","o":[["A","Kỷ luật nghiêm minh, tự giác."],["B","Tư tưởng và hành động nhất trí."],["C","Sự đoàn kết chặt chẽ, một lòng một dạ."],["D","Nền tảng chủ nghĩa Mác - Lênin."],["E","Quyền tự do cá nhân của đảng viên được phát huy tối đa."]],"a":"ABCD","g":"Tài liệu môn học nêu về kỷ luật: \"Sức mạnh của một đảng cộng sản bắt nguồn từ kỷ luật, muôn người như một, cùng một ý chí và hành động. Hồ Chí Minh cho rằng, Đảng ta tuy đông người, nhưng khi tiến đánh chỉ như một người. Điều đó là nhờ trong Đảng có kỷ luật... Kỷ luật này là tư tưởng phải nhất trí, hành động phải nhất trí. Kỷ luật này là do lòng tự giác của đảng viên...\". Tài liệu môn học bổ sung về đoàn kết: \"Nhờ đoàn kết chặt chẽ, một lòng một dạ phục vụ giai cấp, phục vụ nhân dân, phục vụ Tổ quốc, cho nên từ ngày thành lập đến nay, Đảng ta đã đoàn kết, tổ chức và lãnh đạo nhân dân ta hăng hái đấu tranh tiến từ thắng lợi này đến thắng lợi khác\". Nền tảng chủ nghĩa Mác-Lênin cũng là yếu tố "},{"id":"vn08-22","cd":"08","l":"NH","q":"Trong công tác cán bộ, Hồ Chí Minh yêu cầu phải thực hiện những nội dung nào để đảm bảo hiệu quả và sự trong sạch của đội ngũ? (Chọn TẤT CẢ các đáp án đúng)","o":[["A","Phải hiểu và đánh giá đúng cán bộ."],["B","Phải chú trọng huấn luyện cán bộ một cách thiết thực, có hiệu quả."],["C","Phải kết hợp cán bộ trẻ với cán bộ cũ để phát huy kinh nghiệm và sức trẻ."],["D","Phải phòng và chống các tiêu cực trong công tác cán bộ."],["E","Phải tuyệt đối tin tưởng vào năng lực tự hoàn thiện của cán bộ, không cần kiểm tra thường xuyên."]],"a":"ABCD","g":"Tài liệu môn học liệt kê các yêu cầu trong công tác cán bộ: \"phải hiểu và đánh giá đúng cán bộ; phải chú trọng huấn luyện cán bộ, huấn luyện một cách thiết thực, có hiệu quả; phải đề bạt đúng cán bộ; phải sắp xếp, sử dụng cán bộ cho đúng; phải kết hợp cán bộ cấp trên phái đến và cán bộ địa phương; phải chống bệnh địa phương cục bộ; phải kết hợp cán bộ trẻ với cán bộ cũ; phải phòng và chống các tiêu cực trong công tác cán bộ; phải thường xuyên kiểm tra, giúp đỡ cán bộ\". Phương án E là sai, vì Người yêu cầu \"phải thường xuyên kiểm tra, giúp đỡ cán bộ\"."},{"id":"vn08-23","cd":"08","l":"NH","q":"Theo Hồ Chí Minh, khi nói về mối quan hệ giữa Đảng Cộng sản Việt Nam và nhân dân, những điểm nào sau đây được Người đặc biệt nhấn mạnh? (Chọn TẤT CẢ các đáp án đúng)","o":[["A","Đảng phải là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân."],["B","Đảng không có lợi ích gì khác ngoài lợi ích của dân tộc, của Tổ quốc."],["C","Dân chỉ biết rõ giá trị của tự do, độc lập khi dân được ăn no, mặc đủ."],["D","Đảng phải học hỏi quần chúng nhưng không theo đuôi quần chúng, đồng thời phải chú ý nâng cao dân chúng."],["E","Đảng nên giữ khoảng cách nhất định với dân chúng để duy trì sự tôn trọng và uy tín lãnh đạo."]],"a":"ABCD","g":"- Tài liệu môn học nêu: \"Đảng phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân\". - Tài liệu môn học nhấn mạnh: \"Ngoài lợi ích của dân tộc, của Tổ quốc, thì Đảng không có lợi ích gì khác\". - Tài liệu môn học chỉ rõ: \"Dân chỉ biết rõ giá trị của tự do, của độc lập khi mà dân được ăn no, mặc đủ.\" - Tài liệu môn học khẳng định: \"Đảng “học hỏi quần chúng nhưng không theo đuôi quần chúng”, phải chú ý nâng cao dân chúng\". Phương án E là sai hoàn toàn, vì Hồ Chí Minh cảnh báo \"cách xa dân chúng, không liên hệ chặt chẽ với dân chúng, cũng như đứng lơ lửng giữa trời, nhất định thất bại”."},{"id":"vn08-24","cd":"08","l":"NH","q":"Những biểu hiện nào dưới đây được Hồ Chí Minh nhận diện là dấu hiệu của chủ nghĩa cá nhân trong một số cán bộ, đảng viên có \"đạo đức, phẩm chất thấp kém\"? (Chọn TẤT CẢ các đáp án đúng)","o":[["A","Tham danh, trục lợi, thích địa vị, quyền hành."],["B","Thiếu tính tổ chức, kỷ luật, mất đoàn kết."],["C","Luôn thể hiện tinh thần \"thắng không kiêu bại không nản\" trong mọi hoàn cảnh."],["D","Coi thường tập thể, xem khinh quần chúng."],["E","Kém tinh thần trách nhiệm, không chấp hành đúng đường lối, chính sách của Đảng và Nhà nước."]],"a":"ABDE","g":"Tài liệu môn học liệt kê các biểu hiện của chủ nghĩa cá nhân: \"tham danh, trục lợi, thích địa vị, quyền hành\"; \"coi thường tập thể, xem khinh quần chúng\"; \"mất đoàn kết, thiếu tính tổ chức, kỷ luật\"; \"kém tinh thần trách nhiệm; không chấp hành đúng đường lối, chính sách của Đảng và Nhà nước\". Phương án C (\"thắng không kiêu bại không nản\") là một phẩm chất tích cực của cán bộ, đảng viên, thể hiện sự kiên cường và cầu tiến, trái ngược với chủ nghĩa cá nhân. ------------------------------------------------------------------------"},{"id":"vn08-25","cd":"08","l":"DK","q":"Hồ Chí Minh khẳng định: \"Đảng ta là đạo đức, là _______\". Đây là một trong những tư tưởng cốt lõi của Người về xây dựng Đảng trong sạch, vững mạnh.","o":[["A","cách mạng"],["B","văn minh"],["C","công lý"],["D","trí tuệ"],["E","nhân dân"]],"a":"B","g":"Tài liệu môn học ghi rõ: \"Trong bài nói tại Lễ kỷ niệm 30 năm Ngày thành lập Đảng (năm 1960), Hồ Chí Minh khẳng định: “Đảng ta là đạo đức, là văn minh”\"."},{"id":"vn08-26","cd":"08","l":"DK","q":"Theo Hồ Chí Minh, Đảng \"phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người _______ thật trung thành của nhân dân\".","o":[["A","thủ lĩnh"],["B","đại diện"],["C","đầy tớ"],["D","chiến sĩ"],["E","công bộc"]],"a":"C","g":"Tài liệu môn học viết: \"Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân\"."},{"id":"vn08-27","cd":"08","l":"DK","q":"Trong Di chúc, Hồ Chí Minh nhấn mạnh: \"Phải có tình đồng chí _______ lẫn nhau\" để củng cố sự đoàn kết và thống nhất trong Đảng, đặc biệt trong quá trình tự phê bình và phê bình.","o":[["A","tôn trọng"],["B","hỗ trợ"],["C","tin cậy"],["D","thương yêu"],["E","thấu hiểu"]],"a":"D","g":"Tài liệu môn học dẫn lời Hồ Chí Minh trong Di chúc: \"Trong Đảng thực hành dân chủ rộng rãi, thường xuyên và nghiêm chỉnh tự phê bình và phê bình là cách tốt nhất để củng cố sự đoàn kết và thống nhất trong Đảng. Phải có tình đồng chí thương yêu lẫn nhau”."},{"id":"vn08-28","cd":"08","l":"DK","q":"Hồ Chí Minh cho rằng, \"Đảng không có mục đích tự thân, Đảng không phải là tổ chức để làm quan phát tài mà Đảng từ trong xã hội mà ra, hoạt động vì Tổ quốc giàu mạnh, đồng bào _______\".","o":[["A","tiến bộ"],["B","hạnh phúc"],["C","sung sướng"],["D","văn minh"],["E","độc lập"]],"a":"C","g":"Tài liệu môn học nêu: \"Đảng không có mục đích tự thân, Đảng không phải là tổ chức để làm quan phát tài mà Đảng từ trong xã hội mà ra, hoạt động vì Tổ quốc giàu mạnh, đồng bào sung sướng\"."},{"id":"vn08-29","cd":"08","l":"DK","q":"Trong \"Sửa đổi lối làm việc\", Hồ Chí Minh nêu lên 12 điều về tư cách của đảng chân chính cách mạng, trong đó có Điều số 10: \"Đảng phải luôn luôn _______ những phần tử hủ hóa ra ngoài\".","o":[["A","loại trừ"],["B","thanh lọc"],["C","tẩy bỏ"],["D","giáo dục"],["E","cô lập"]],"a":"C","g":"Tài liệu môn học dẫn Điều số 10 trong tác phẩm \"Sửa đổi lối làm việc\": \"Đảng phải luôn luôn tẩy bỏ những phần tử hủ hóa ra ngoài\"."},{"id":"vn08-30","cd":"08","l":"DK","q":"Hồ Chí Minh cảnh báo: \"cách xa dân chúng, không liên hệ chặt chẽ với dân chúng, cũng như đứng lơ lửng giữa trời, nhất định _______\". Mất lòng tin là mất tất cả.","o":[["A","suy yếu"],["B","lạc hậu"],["C","cô lập"],["D","thất bại"],["E","thoái hóa"]],"a":"D","g":"Tài liệu môn học khẳng định: “‘cách xa dân chúng, không liên hệ chặt chẽ với dân chúng, cũng như đứng lơ lửng giữa trời, nhất định thất bại”\"."},{"id":"vn09-1","cd":"09","l":"DS","q":"Theo tư tưởng Hồ Chí Minh, Nhà nước Việt Nam mới được thành lập mang bản chất của một nhà nước \"phi giai cấp\" để đoàn kết toàn dân tộc.","o":[],"a":"S","g":"Tài liệu khẳng định: \"Nhà nước Việt Nam là nhà nước dân chủ, nhưng tuyệt nhiên nó không phải là “nhà nước toàn dân”, hiểu theo nghĩa là nhà nước phi giai cấp. Nhà nước ở đâu và bao giờ cũng mang bản chất của một giai cấp nhất định. Nhà nước Việt Nam mới... là một nhà nước mang bản chất giai cấp công nhân.\""},{"id":"vn09-2","cd":"09","l":"DS","q":"Nguyên tắc \"tập trung dân chủ\" trong tổ chức và hoạt động của Nhà nước Việt Nam theo tư tưởng Hồ Chí Minh chỉ nhấn mạnh sự cần thiết của việc phát huy cao độ tập trung quyền lực để đảm bảo tính thống nhất.","o":[],"a":"S","g":"Tài liệu nêu rõ: \"Hồ Chí Minh rất chú ý đến cả hai mặt dân chủ và tập trung trong tổ chức và hoạt động của tất cả bộ máy, cơ quan nhà nước. Người nhấn mạnh đến sự cần thiết phải phát huy cao độ dân chủ, đồng thời cũng nhấn mạnh phải phát huy cao độ tập trung\". Do đó, việc chỉ nhấn mạnh tập trung mà bỏ qua dân chủ là không đúng với tư tưởng của Người."},{"id":"vn09-3","cd":"09","l":"DS","q":"Hồ Chí Minh cho rằng, hình thức dân chủ gián tiếp là hình thức hoàn bị nhất để nhân dân thực thi quyền lực, vì nó cho phép lựa chọn những đại diện ưu tú nhất.","o":[],"a":"S","g":"Tài liệu chỉ rõ: \"Hồ Chí Minh luôn coi trọng hình thức dân chủ trực tiếp và tạo mọi điều kiện thuận lợi để thực hành dân chủ trực tiếp, bởi đây là hình thức dân chủ hoàn bị nhất.\" Như vậy, dân chủ trực tiếp mới là hình thức hoàn bị nhất, không phải dân chủ gián tiếp."},{"id":"vn09-4","cd":"09","l":"DS","q":"Trong tư tưởng Hồ Chí Minh về nhà nước của nhân dân, luật pháp chỉ có vai trò phản ánh ý nguyện của dân chúng mà không phải là công cụ để kiểm soát quyền lực nhà nước.","o":[],"a":"S","g":"Tài liệu khẳng định: \"Luật pháp đó là của nhân dân, là công cụ thực thi quyền lực của nhân dân, là phương tiện để kiểm soát quyền lực nhà nước.\" Do đó, luật pháp vừa phản ánh ý nguyện, bảo vệ quyền lợi, vừa là phương tiện kiểm soát quyền lực nhà nước."},{"id":"vn09-5","cd":"09","l":"DS","q":"Quan điểm \"Dân là chủ\" trong tư tưởng Hồ Chí Minh xác định vị thế chủ thể tối cao của nhân dân đối với quyền lực nhà nước, trong khi \"Dân làm chủ\" nhấn mạnh quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ.","o":[],"a":"D","g":"Tài liệu ghi rõ: \"Nguyên lý “dân là chủ” khẳng định địa vị chủ thể tối cao của mọi quyền lực là nhân dân.\" Tài liệu cũng nêu: \"“Dân là chủ” xác định vị thế của nhân dân đối với quyền lực nhà nước, còn “dân làm chủ nhấn mạnh quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ.\""},{"id":"vn09-6","cd":"09","l":"DS","q":"Để một cán bộ nhà nước thật sự \"vì dân\", Hồ Chí Minh chỉ yêu cầu họ có tinh thần chí công vô tư và tận tụy, không đòi hỏi về năng lực trí tuệ hay tầm nhìn xa trông rộng.","o":[],"a":"S","g":"Tài liệu và mô tả phẩm chất của cán bộ \"vì dân\" bao gồm cả \"là người đầy tớ\" (trung thành, tận tụy, cần, kiệm, liêm, chính, chí công vô tư, lo trước thiên hạ, vui sau thiên hạ) và \"là người lãnh đạo\" (trí tuệ hơn người, minh mẫn, sáng suốt, nhìn xa trông rộng, gần gũi nhân dân, trọng dụng hiền tài). Điều này cho thấy yêu cầu về cả đức và tài."},{"id":"vn09-7","cd":"09","l":"D1","q":"Theo Hồ Chí Minh, bản chất giai cấp công nhân của Nhà nước Việt Nam Dân chủ Cộng hòa không chỉ thể hiện ở vai trò lãnh đạo của Đảng Cộng sản, mà còn ở một khía cạnh cơ bản nào sau đây?","o":[["A","Sự phân chia quyền lực rõ ràng giữa các nhánh lập pháp, hành pháp, tư pháp."],["B","Việc đảm bảo quyền tự quyết tuyệt đối cho mọi giai cấp trong xã hội."],["C","Tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước."],["D","Sự loại trừ hoàn toàn ảnh hưởng của các giai cấp khác khỏi bộ máy nhà nước."],["E","Việc tập trung tối đa quyền lực vào tay Chính phủ."]],"a":"C","g":"Tài liệu nêu rõ: \"Hai là, bản chất giai cấp của Nhà nước Việt Nam thể hiện ở tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước. Đưa đất nước đi lên chủ nghĩa xã hội và chủ nghĩa cộng sản là mục tiêu cách mạng nhất quán của Hồ Chí Minh.\" Các phương án A, B, D, E không phản ánh đúng tư tưởng của Người."},{"id":"vn09-8","cd":"09","l":"D1","q":"Hồ Chí Minh đã giải quyết mối quan hệ giữa vấn đề dân tộc và vấn đề giai cấp trong cách mạng Việt Nam như thế nào trong tư tưởng về Nhà nước mới?","o":[["A","Đặt vấn đề giai cấp lên trên vấn đề dân tộc, coi trọng lợi ích giai cấp công nhân hơn lợi ích toàn dân."],["B","Tách biệt hoàn toàn vấn đề dân tộc khỏi vấn đề giai cấp, xem xét chúng độc lập."],["C","Coi bản chất giai cấp công nhân của Nhà nước thống nhất với tính nhân dân và tính dân tộc."],["D","Chủ yếu tập trung vào việc củng cố bản chất giai cấp công nhân, ít chú trọng đến tính dân tộc."],["E","Xác định lợi ích dân tộc chỉ là phụ trợ cho lợi ích giai cấp công nhân."]],"a":"C","g":"Tài liệu khẳng định: \"Trong Nhà nước Việt Nam, bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc. Hồ Chí Minh là người giải quyết rất thành công mối quan hệ giữa vấn đề dân tộc với vấn đề giai cấp trong cách mạng Việt Nam.\""},{"id":"vn09-9","cd":"09","l":"D1","q":"Theo tư tưởng Hồ Chí Minh, khi nói về hình thức dân chủ gián tiếp, vị thế và mối quan hệ giữa nhân dân với cán bộ nhà nước được xác định như thế nào?","o":[["A","Cán bộ nhà nước là người đại diện tối cao, có quyền lực tự thân."],["B","Nhân dân là người chủ thể nắm giữ mọi quyền lực, cán bộ là công bộc của dân."],["C","Cán bộ nhà nước và nhân dân có mối quan hệ bình đẳng về quyền lực."],["D","Nhân dân chỉ có quyền bầu cử, không có quyền kiểm soát hoạt động của cán bộ."],["E","Quyền lực nhà nước độc lập hoàn toàn với sự ủy thác của nhân dân."]],"a":"B","g":"Tài liệu nêu: \"Quyền lực nhà nước là “thừa ủy quyền” của nhân dân. Tự bản thân nhà nước không có quyền lực. Quyền lực của nhà nước là do nhân dân ủy thác. Do vậy, các cơ quan quyền lực nhà nước cùng với đội ngũ cán bộ “đều là công bộc của dân...\" nhấn mạnh: \"Ở đây, Hồ Chí Minh đã xác định rõ vị thế và mối quan hệ giữa nhân dân với cán bộ nhà nước trên cơ sở nhân dân là chủ thể nắm giữ mọi quyền lực.\""},{"id":"vn09-10","cd":"09","l":"D1","q":"Trong quan điểm về \"nhà nước do nhân dân\", Hồ Chí Minh nhấn mạnh điều gì là cần thiết để nhân dân có thể thực hiện tốt vai trò làm chủ của mình?","o":[["A","Nhân dân cần tuân thủ mọi mệnh lệnh của nhà nước mà không cần hiểu rõ."],["B","Nhà nước phải tuyên bố mọi quyền làm chủ của nhân dân mà không cần chuẩn bị năng lực."],["C","Nhà nước cần coi trọng việc giáo dục nhân dân và nhân dân phải tự giác phấn đấu có đủ năng lực làm chủ."],["D","Chỉ những người có trình độ học vấn cao mới có thể tham gia vào công việc nhà nước."],["E","Nhà nước cần tập trung mọi quyền lực để thay mặt nhân dân đưa ra quyết định."]],"a":"C","g":"Tài liệu và nêu rõ: \"Nhà nước do nhân dân cần coi trọng việc giáo dục nhân dân, đồng thời nhân dân cũng phải tự giác phấn đấu để có đủ năng lực thực hiện quyền dân chủ của mình. Hồ Chí Minh nói: \"Chúng ta là những người lao động làm chủ nước nhà. Muốn làm chủ được tốt, phải có năng lực làm chủ”.\""},{"id":"vn09-11","cd":"09","l":"D1","q":"Thước đo cơ bản nhất để đánh giá một Nhà nước thật sự \"vì dân\" theo Hồ Chí Minh là gì?","o":[["A","Mức độ giàu mạnh về kinh tế của đất nước."],["B","Số lượng luật pháp được ban hành để quản lý xã hội."],["C","Sự ủng hộ và tin tưởng của nhân dân (được lòng dân)."],["D","Khả năng kiểm soát và hạn chế quyền lực cá nhân của cán bộ."],["E","Việc thực hiện đầy đủ các nghi thức dân chủ trong quản lý."]],"a":"C","g":"Tài liệu chỉ rõ: \"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải được lòng dân. Hồ Chí Minh đặt vấn đề với cán bộ Nhà nước phải làm sao cho được lòng dân, dân tin, dân mến, dân yêu.\""},{"id":"vn09-12","cd":"09","l":"D1","q":"Hồ Chí Minh phê phán gay gắt những cán bộ nhà nước nào?","o":[["A","Cán bộ quá tận tụy với công việc, quên đi lợi ích cá nhân."],["B","Cán bộ không dám đưa ra quyết định táo bạo vì sợ sai lầm."],["C","Cán bộ thoái hóa, biến chất, từ công bộc của dân trở thành \"quan cách mạng\", đứng trên nhân dân."],["D","Cán bộ chỉ tập trung làm những việc trực tiếp mang lại lợi ích cho dân."],["E","Cán bộ có trí tuệ vượt trội nhưng ít gần gũi nhân dân."]],"a":"C","g":"Tài liệu và nêu: \"Chính vì vậy, Hồ Chí Minh kịch liệt phê phán những cán bộ nhà nước thoái hóa, biến chất, từ chỗ là công bộc của dân đã trở thành “quan cách mạng”, đứng trên nhân dân, coi khinh nhân dân, “cậy thế” với dân, “quên rằng dân bầu mình ra là để làm việc cho dân”.\""},{"id":"vn09-13","cd":"09","l":"SAI","q":"Trong các nhận định sau về bản chất giai cấp của Nhà nước Việt Nam theo tư tưởng Hồ Chí Minh, nhận định nào là SAI?","o":[["A","Nhà nước Việt Nam Dân chủ Cộng hòa không phải là nhà nước toàn dân theo nghĩa phi giai cấp."],["B","Đảng Cộng sản Việt Nam giữ vị trí và vai trò cầm quyền là một biểu hiện của bản chất giai cấp công nhân."],["C","Tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước là mục tiêu nhất quán của Nhà nước."],["D","Bản chất giai cấp công nhân của Nhà nước hoàn toàn tách rời với tính nhân dân và tính dân tộc."],["E","Nguyên tắc tập trung dân chủ là nguyên tắc tổ chức và hoạt động của Nhà nước."]],"a":"D","g":"Tài liệu khẳng định: \"Trong Nhà nước Việt Nam, bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc.\" Điều này trực tiếp phủ nhận nhận định D."},{"id":"vn09-14","cd":"09","l":"SAI","q":"Nhận định nào sau đây KHÔNG phản ánh đúng cách thức mà Đảng Cộng sản Việt Nam cầm quyền theo tư tưởng Hồ Chí Minh?","o":[["A","Bằng việc thể chế hóa đường lối, quan điểm, chủ trương của Đảng thành pháp luật."],["B","Bằng hoạt động của các tổ chức đảng và đảng viên trong bộ máy nhà nước."],["C","Bằng công tác kiểm tra, giám sát."],["D","Bằng việc chỉ định trực tiếp mọi cán bộ cấp cao của nhà nước."],["E","Bằng việc lãnh đạo nòng cốt của nhân dân là liên minh công - nông - trí."]],"a":"D","g":"Tài liệu liệt kê ba phương thức Đảng cầm quyền: \"(1) Bằng đường lối, quan điểm, chủ trương để Nhà nước thể chế hóa thành pháp luật, chính sách, kế hoạch; (2) Bằng hoạt động của các tổ chức đảng và đảng viên của mình trong bộ máy, cơ quan nhà nước; (3) Bằng công tác kiểm tra.\" Việc \"chỉ định trực tiếp mọi cán bộ cấp cao của nhà nước\" không được đề cập là một trong các phương thức cầm quyền chính thức hay bao quát, và mâu thuẫn với nguyên tắc dân chủ."},{"id":"vn09-15","cd":"09","l":"SAI","q":"Theo tư tưởng Hồ Chí Minh về nhà nước của nhân dân, nhận định nào sau đây là KHÔNG chính xác về quyền lực nhà nước?","o":[["A","Quyền lực nhà nước là do nhân dân ủy thác, không phải tự thân có."],["B","Nhân dân là chủ thể tối cao nắm giữ mọi quyền lực."],["C","Cán bộ nhà nước là công bộc của dân, gánh vác việc chung cho dân."],["D","Nhà nước có quyền giải tán các thiết chế quyền lực nếu nhân dân không tín nhiệm."],["E","Luật pháp dân chủ là công cụ để nhân dân kiểm soát quyền lực nhà nước."]],"a":"D","g":"Tài liệu và nêu rõ: \"Nhân dân có quyền kiểm soát, phê bình nhà nước, có quyền bãi miễn những đại biểu mà họ đã lựa chọn, bầu ra và có quyền giải tán những thiết chế quyền lực mà họ đã lập nên.\" Như vậy, quyền giải tán thiết chế quyền lực thuộc về nhân dân, không phải nhà nước."},{"id":"vn09-16","cd":"09","l":"SAI","q":"Khi bàn về nhà nước do nhân dân, Hồ Chí Minh đã khẳng định những nghĩa vụ nào của nhân dân với tư cách người chủ, NGOẠI TRỪ nghĩa vụ nào sau đây?","o":[["A","Tuân theo pháp luật của Nhà nước."],["B","Giữ đúng kỷ luật lao động và trật tự chung."],["C","Hăng hái tham gia công việc chung và bảo vệ tài sản công cộng."],["D","Ưu tiên lợi ích cá nhân hơn lợi ích chung của Nhà nước."],["E","Đóng góp (nộp thuế) đúng kỳ, đúng số để xây dựng lợi ích chung."]],"a":"D","g":"Tài liệu liệt kê các nghĩa vụ của nhân dân như tuân theo pháp luật, kỷ luật lao động, giữ trật tự chung, đóng góp (nộp thuế), tham gia công việc chung, bảo vệ tài sản công cộng và Tổ quốc. Việc \"ưu tiên lợi ích cá nhân hơn lợi ích chung của Nhà nước\" rõ ràng mâu thuẫn với tinh thần chung của một công dân làm chủ và không được nhắc đến."},{"id":"vn09-17","cd":"09","l":"SAI","q":"Theo quan điểm Hồ Chí Minh về nhà nước vì nhân dân, nhận định nào sau đây về cán bộ nhà nước là SAI?","o":[["A","Cán bộ vừa là đày tớ, vừa là người lãnh đạo nhân dân."],["B","Cán bộ phải có đủ cả đức và tài, vừa hiền lại vừa minh."],["C","Cán bộ chỉ cần làm những việc trực tiếp lợi cho dân, tránh những việc gây khó khăn ban đầu."],["D","Cán bộ phải trung thành, tận tụy, cần, kiệm, liêm, chính, chí công vô tư."],["E","Cán bộ phải có trí tuệ hơn người, minh mẫn, sáng suốt, nhìn xa trông rộng."]],"a":"C","g":"Tài liệu có đoạn: \"Phải như thế thì mới có thể “chẳng những làm những việc trực tiếp lợi cho dân, mà cũng có khi làm những việc mới xem qua như là hại đến dân”13, nhưng thực chất là vì lợi ích toàn cục, vì lợi ích lâu dài của nhân dân.\" Điều này cho thấy cán bộ không chỉ giới hạn ở việc làm những gì trực tiếp có lợi."},{"id":"vn09-18","cd":"09","l":"SAI","q":"Nhận định nào sau đây KHÔNG phải là một đặc điểm của Nhà nước Việt Nam mới được nêu trong tư tưởng Hồ Chí Minh?","o":[["A","Nhà nước ra đời là kết quả của cuộc đấu tranh lâu dài của toàn dân tộc."],["B","Nhà nước luôn kiên trì, nhất quán mục tiêu vì quyền lợi của nhân dân, lấy quyền lợi dân tộc làm nền tảng."],["C","Nhà nước đảm đương nhiệm vụ tổ chức nhân dân tiến hành các cuộc kháng chiến bảo vệ độc lập."],["D","Nhà nước được thành lập dựa trên việc ưu tiên quyền lợi của một giai cấp cụ thể mà không xét đến toàn dân."],["E","Con đường quá độ lên chủ nghĩa xã hội là sự nghiệp của chính Nhà nước."]],"a":"D","g":"Tài liệu khẳng định \"bản chất giai cấp công nhân của Nhà nước thống nhất với tính nhân dân và tính dân tộc\" và \"Nhà nước Việt Nam mới, do vậy, không phải của riêng giai cấp, tầng lớp nào, mà là thuộc về nhân dân.\" Nhận định D mâu thuẫn trực tiếp với điều này."},{"id":"vn09-19","cd":"09","l":"NH","q":"Theo tư tưởng Hồ Chí Minh, những điểm nào sau đây thể hiện sự thống nhất giữa bản chất giai cấp công nhân với tính nhân dân và tính dân tộc của Nhà nước Việt Nam?","o":[["A","Nhà nước ra đời là kết quả của cuộc đấu tranh lâu dài của toàn thể dân tộc."],["B","Nhà nước kiên trì, nhất quán mục tiêu vì quyền lợi của nhân dân, lấy quyền lợi dân tộc làm nền tảng."],["C","Lợi ích cơ bản của giai cấp công nhân thống nhất với lợi ích của nhân dân và toàn dân tộc."],["D","Nhà nước đảm đương nhiệm vụ tổ chức nhân dân tiến hành kháng chiến và xây dựng đất nước."],["E","Nhà nước chỉ tập trung phục vụ lợi ích của giai cấp công nhân."]],"a":"ABCD","g":"Các điểm A, B, C, D đều được nêu rõ trong tài liệu,,. Cụ thể, tài liệu nói về kết quả đấu tranh của toàn dân tộc. Tài liệu nói về mục tiêu vì quyền lợi nhân dân và sự thống nhất lợi ích. Tài liệu nói về nhiệm vụ đảm đương. Đáp án E là sai vì nó mâu thuẫn với tư tưởng Hồ Chí Minh về sự thống nhất."},{"id":"vn09-20","cd":"09","l":"NH","q":"Những phát biểu nào sau đây của Hồ Chí Minh thể hiện rõ nét tư tưởng về cán bộ nhà nước là \"công bộc của dân\"?","o":[["A","\"Chủ tịch, bộ trưởng, thứ trưởng, ủy viên này ủy viên khác là làm đày tớ cho nhân dân.\""],["B","\"Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ.\""],["C","\"Từ người quét nhà, nấu ăn cho đến Chủ tịch một nước đều là phân công làm đày tớ cho dân.\""],["D","\"Quyền lực nhà nước là “thừa ủy quyền” của nhân dân.\""],["E","\"Nhân dân có quyền bãi miễn đại biểu Quốc hội nếu họ không xứng đáng.\""]],"a":"AC","g":"Các câu A và C được trích dẫn trực tiếp trong tài liệu để minh họa cho tư tưởng cán bộ là \"đày tớ\" của dân. Câu B nêu địa vị của dân, câu D nêu tài liệu gốc quyền lực nhà nước, câu E nêu quyền kiểm soát của dân, tất cả đều liên quan nhưng A và C trực tiếp thể hiện vai trò \"công bộc của dân\"."},{"id":"vn09-21","cd":"09","l":"NH","q":"Theo tư tưởng Hồ Chí Minh, những hành vi nào của cán bộ nhà nước sẽ bị kịch liệt phê phán vì đi ngược lại nguyên tắc \"công bộc của dân\"?","o":[["A","Đứng trên nhân dân, coi khinh nhân dân."],["B","\"Cậy thế\" với dân, lợi dụng chức vụ để hách dịch."],["C","Quên rằng dân bầu mình ra là để làm việc cho dân."],["D","Thoái hóa, biến chất, biến thành \"quan cách mạng\"."],["E","Luôn cố gắng làm những việc trực tiếp có lợi cho dân mà bỏ qua lợi ích lâu dài."]],"a":"ABCD","g":"Tài liệu và liệt kê các hành vi bị phê phán: \"thoái hóa, biến chất, từ chỗ là công bộc của dân đã trở thành “quan cách mạng”, đứng trên nhân dân, coi khinh nhân dân, “cậy thế” với dân, “quên rằng dân bầu mình ra là để làm việc cho dân”.\" Đáp án E không phải là hành vi bị kịch liệt phê phán mà là một phần của việc làm cán bộ có thể cần suy xét để cân bằng giữa lợi ích trước mắt và lâu dài."},{"id":"vn09-22","cd":"09","l":"NH","q":"Những điểm nào sau đây thể hiện \"tư tưởng dân chủ triệt để của Hồ Chí Minh khi nói về nhà nước do nhân dân\"?","o":[["A","Chỉ tuyên bố quyền làm chủ của nhân dân."],["B","Đưa nhân dân tham gia công việc nhà nước."],["C","Chuẩn bị năng lực làm chủ cho nhân dân."],["D","Động viên nhân dân chuẩn bị tốt năng lực làm chủ."],["E","Quyền làm chủ của nhân dân là bẩm sinh, không cần giáo dục."]],"a":"BCD","g":"Tài liệu nêu: \"Nhà nước do nhân dân không chỉ tuyên bố quyền làm chủ của nhân dân, cũng không chỉ đưa nhân dân tham gia công việc nhà nước, mà còn chuẩn bị và động viên nhân dân chuẩn bị tốt năng lực làm chủ, quan điểm đó thể hiện tư tưởng dân chủ triệt để của Hồ Chí Minh khi nói về nhà nước do nhân dân.\" Do đó, A không đủ, E là sai."},{"id":"vn09-23","cd":"09","l":"NH","q":"Theo tư tưởng Hồ Chí Minh, để một cán bộ nhà nước thực sự \"vì dân\", họ cần phải có những phẩm chất nào sau đây?","o":[["A","Trung thành, tận tụy, cần, kiệm, liêm, chính, chí công vô tư."],["B","Lo trước thiên hạ, vui sau thiên hạ."],["C","Trí tuệ hơn người, minh mẫn, sáng suốt, nhìn xa trông rộng."],["D","Gần gũi nhân dân, trọng dụng hiền tài."],["E","Độc lập hoàn toàn với ý chí của nhân dân để đưa ra quyết định khách quan."]],"a":"ABCD","g":"Tài liệu và liệt kê các phẩm chất cần có của cán bộ, bao gồm trung thành, tận tụy, cần, kiệm, liêm, chính, chí công vô tư, lo trước thiên hạ, vui sau thiên hạ (tính \"đày tớ\") và trí tuệ, minh mẫn, sáng suốt, nhìn xa trông rộng, gần gũi nhân dân, trọng dụng hiền tài (tính \"lãnh đạo\"). Đáp án E mâu thuẫn với nguyên tắc quyền lực nhà nước là \"thừa ủy quyền\" của nhân dân."},{"id":"vn09-24","cd":"09","l":"NH","q":"Luật pháp trong Nhà nước Việt Nam mới theo Hồ Chí Minh có những đặc điểm cơ bản nào?","o":[["A","Phản ánh được ý nguyện của dân chúng."],["B","Bảo vệ quyền lợi của dân chúng."],["C","Là của nhân dân."],["D","Là công cụ thực thi quyền lực của nhân dân."],["E","Là phương tiện để kiểm soát quyền lực nhà nước."]],"a":"ABCDE","g":"Tài liệu nêu rõ: \"sự khác biệt căn bản của luật pháp trong Nhà nước Việt Nam mới với luật pháp của nhà nước theo các chế độ tư sản, phong kiến là ở chỗ nó phản ánh được ý nguyện và bảo vệ quyền lợi của dân chúng. Luật pháp đó là của nhân dân, là công cụ thực thi quyền lực của nhân dân, là phương tiện để kiểm soát quyền lực nhà nước.\" Tất cả 5 phương án đều đúng."},{"id":"vn09-25","cd":"09","l":"DK","q":"Nhà nước Việt Nam mới – Nhà nước Việt Nam Dân chủ Cộng hòa, theo quan điểm của Hồ Chí Minh, là một nhà nước mang bản chất giai cấp (1) _______, nhưng tuyệt nhiên không phải là “nhà nước (2) _______”, hiểu theo nghĩa là nhà nước (3) _______.","o":[["A","(1) nhân dân; (2) toàn dân; (3) phi giai cấp"],["B","(1) công nhân; (2) nhân dân; (3) phi giai cấp"],["C","(1) nhân dân; (2) công nhân; (3) phi giai cấp"],["D","(1) công nhân; (2) toàn dân; (3) phi giai cấp"],["E","(1) công nhân; (2) toàn dân; (3) định hướng xã hội chủ nghĩa"]],"a":"D","g":"Tài liệu ghi: \"Nhà nước Việt Nam là nhà nước dân chủ, nhưng tuyệt nhiên nó không phải là “nhà nước toàn dân”, hiểu theo nghĩa là nhà nước phi giai cấp. Nhà nước ở đâu và bao giờ cũng mang bản chất của một giai cấp nhất định. Nhà nước Việt Nam mới... là một nhà nước mang bản chất giai cấp công nhân.\""},{"id":"vn09-26","cd":"09","l":"DK","q":"Một trong những phương diện thể hiện bản chất giai cấp công nhân của Nhà nước Việt Nam là tính _______ trong sự phát triển đất nước, với mục tiêu nhất quán là đưa đất nước đi lên chủ nghĩa xã hội và chủ nghĩa cộng sản.","o":[["A","định hướng xã hội chủ nghĩa"],["B","dân chủ trực tiếp"],["C","phi giai cấp"],["D","năng lực làm chủ"],["E","dân chủ gián tiếp"]],"a":"A","g":"Tài liệu nêu: \"Hai là, bản chất giai cấp của Nhà nước Việt Nam thể hiện ở tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước. Đưa đất nước đi lên chủ nghĩa xã hội và chủ nghĩa cộng sản là mục tiêu cách mạng nhất quán của Hồ Chí Minh.\""},{"id":"vn09-27","cd":"09","l":"DK","q":"Trong hình thức dân chủ gián tiếp, quyền lực nhà nước là “thừa (1) _______” của nhân dân, do đó các cơ quan quyền lực nhà nước cùng với đội ngũ cán bộ “đều là công bộc của dân, nghĩa là để gánh vác việc chung cho dân, chứ không phải để đè đầu dân” và làm (2) _______.","o":[["A","(1) ủy thác; (2) quan cách mạng"],["B","(1) ủy quyền; (2) quan cách mạng"],["C","(1) ủy quyền; (2) đầy tớ"],["D","(1) kiểm soát; (2) đầy tớ"],["E","(1) kiểm soát; (2) quan cách mạng"]],"a":"C","g":"Tài liệu môn học ghi: “Quyền lực nhà nước là ‘thừa ủy quyền’ của nhân dân. Tự bản thân nhà nước không có quyền lực. Quyền lực của nhà nước là do nhân dân ủy thác.” Tài liệu môn học dẫn lời Hồ Chí Minh: “Dân làm chủ thì Chủ tịch, bộ trưởng, thứ trưởng, ủy viên này khác là làm gì? Làm đầy tớ. Làm đầy tớ cho nhân dân, chứ không phải là làm quan cách mạng”. Vì vậy chỗ (1) là “ủy quyền” (cụm “thừa ủy quyền”), chỗ (2) là “đầy tớ”."},{"id":"vn09-28","cd":"09","l":"DK","q":"Để bảo đảm mọi quyền lực luôn nằm trong tay dân chúng, Hồ Chí Minh khẳng định nhân dân có quyền (1) _______, phê bình nhà nước, có quyền (2) _______ những đại biểu mà họ đã lựa chọn, bầu ra và có quyền giải tán những thiết chế quyền lực mà họ đã lập nên.","o":[["A","(1) kiểm tra; (2) bãi miễn"],["B","(1) kiểm soát; (2) kiểm tra"],["C","(1) bãi miễn; (2) kiểm soát"],["D","(1) kiểm tra; (2) kiểm soát"],["E","(1) kiểm soát; (2) bãi miễn"]],"a":"E","g":"Tài liệu ghi: \"Nhân dân có quyền kiểm soát, phê bình nhà nước, có quyền bãi miễn những đại biểu mà họ đã lựa chọn, bầu ra và có quyền giải tán những thiết chế quyền lực mà họ đã lập nên.\""},{"id":"vn09-29","cd":"09","l":"DK","q":"Trong quan điểm về \"nhà nước do nhân dân\", Hồ Chí Minh đã chỉ rõ \"Dân là chủ\" xác định vị thế của nhân dân đối với quyền lực nhà nước, còn \"Dân làm chủ\" nhấn mạnh (1) _______ và (2) _______ của nhân dân với tư cách là người chủ.","o":[["A","(1) quyền lợi; (2) năng lực làm chủ"],["B","(1) quyền lợi; (2) nghĩa vụ"],["C","(1) năng lực làm chủ; (2) trí tuệ"],["D","(1) nghĩa vụ; (2) trí tuệ"],["E","(1) trí tuệ; (2) năng lực làm chủ"]],"a":"B","g":"Tài liệu nêu: \"“Dân là chủ” xác định vị thế của nhân dân đối với quyền lực nhà nước, còn “dân làm chủ nhấn mạnh quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ.\""},{"id":"vn09-30","cd":"09","l":"DK","q":"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải (1) _______, và Người yêu cầu cán bộ phải làm sao cho được lòng dân, dân tin, dân mến, dân yêu. Để đạt được điều đó, trước hết phải yêu dân, phải đặt quyền lợi của dân trên hết thảy, phải có một tinh thần (2) _______.","o":[["A","(1) mưu tự do hạnh phúc; (2) chí công vô tư"],["B","(1) được lòng dân; (2) trí tuệ"],["C","(1) mưu tự do hạnh phúc; (2) năng lực làm chủ"],["D","(1) được lòng dân; (2) chí công vô tư"],["E","(1) chí công vô tư; (2) trí tuệ"]],"a":"D","g":"Tài liệu ghi: \"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải được lòng dân.\" Tài liệu bổ sung: \"muốn được dân yêu, muốn được lòng dân, trước hết phải yêu dân, phải đặt quyền lợi của dân trên hết thảy, phải có một tinh thần chí công vô tư.\""},{"id":"vn10-1","cd":"10","l":"DS","q":"Hồ Chí Minh nhận định \"chủ nghĩa cá nhân\" là \"bệnh gốc\" sinh ra các bệnh tham ô, lãng phí trong bộ máy nhà nước.","o":[],"a":"S","g":"Tài liệu khẳng định bệnh quan liêu là \"bệnh gốc sinh ra các bệnh tham ô, lãng phí\". Trong khi đó, tài liệu chỉ ra \"chủ nghĩa cá nhân\" là \"bệnh mẹ\" dẫn đến các tiêu cực. Có sự phân biệt rõ ràng giữa \"bệnh mẹ\" và \"bệnh gốc\" trong tư tưởng của Người về các nguyên nhân sâu xa của tiêu cực."},{"id":"vn10-2","cd":"10","l":"DS","q":"Một trong những điều kiện tiên quyết để công tác kiểm soát quyền lực nhà nước của Đảng Cộng sản Việt Nam đạt kết quả tốt là người đi kiểm soát phải có chức vụ cao để đảm bảo sự răn đe.","o":[],"a":"S","g":"Theo tài liệu, Hồ Chí Minh chỉ rõ hai điều kiện để kiểm soát có kết quả tốt là \"việc kiểm soát phải có hệ thống và người đi kiểm soát phải là những người rất có uy tín\", không đề cập đến việc người đó phải có chức vụ cao. Uy tín là một phẩm chất cá nhân, không đồng nhất với cấp bậc chức vụ."},{"id":"vn10-3","cd":"10","l":"DS","q":"Tư tưởng Hồ Chí Minh về Nhà nước pháp quyền đã sớm thể hiện sự chú trọng việc thay thế chế độ ra các sắc lệnh bằng chế độ ra các đạo luật, được nêu rõ trong bản Yêu sách của nhân dân An Nam năm 1919.","o":[],"a":"D","g":"Tài liệu ghi rõ trong bản Yêu sách của nhân dân An Nam năm 1919, một trong những yêu cầu là \"Thay thế chế độ ra các sắc lệnh bằng chế độ ra các đạo luật\". Điều
