ination; opposing narrow, chauvinistic and isolationist nationalism and hegemonic expansionism.\" The textbook also says \"always calling for strengthening international solidarity and cooperation, while making every effort to support and assist the struggles of the peoples of all countries for peace, national independence, democrac"},{"id":"en13-17","cd":"13","l":"DK","q":"Ho Chi Minh affirmed that the Party and the Government are \"(1) _______\", not \"(2) _______\" who lord it over the people; this shows that the conception of country and people was completely overturned compared with before.","o":[["A","(1) masters; (2) mandarins over the people"],["B","(1) servants of the people; (2) masters"],["C","(1) servants of the people; (2) mandarins over the people"],["D","(1) mandarins over the people; (2) servants of the people"],["E","(1) masters; (2) servants of the people"]],"a":"C","g":"The course textbook records: \"The Party and the Government are 'servants of the people', not 'mandarins over the people who lord it over the people', so the conception of country and people was completely overturned compared with before\". Ho Chi Minh uses the phrase \"revolutionary mandarin\" elsewhere, when criticising cadres who \"put on the airs of a 'revolutionary mandarin', giving orders and throwing their weight around\"; this sentence uses \"mandarins over the people\"."},{"id":"en13-18","cd":"13","l":"DK","q":"Ho Chi Minh emphasised that \"Understanding Marxism–Leninism means _______. However many books one knows by heart, if one lives without affection and righteousness, how can one be said to understand Marxism–Leninism?\".","o":[["A","being selflessly impartial"],["B","loving the country"],["C","being thrifty"],["D","knowing many books by heart"],["E","living with one another with affection and righteousness"]],"a":"E","g":"The course textbook records: \"According to Ho Chi Minh, understanding Marxism–Leninism means living with one another with affection and righteousness. However many books one knows by heart, if one lives without affection and righteousness, how can one be said to understand Marxism–Leninism?\"."},{"id":"en13-19","cd":"13","l":"DK","q":"Ho Chi Minh clearly distinguished between \"thrift\" and \"_______\". He held that not spending on what deserves spending, for the common interest, is not thrift but the conduct of a person given to \"_______\".","o":[["A","extravagance"],["B","stinginess"],["C","saving"],["D","wastefulness"],["E","ostentation"]],"a":"B","g":"The course textbook explains: \"Thrift is not stinginess. When one should not spend, not even a single coin should be spent. When there is a worthwhile task, a task that benefits compatriots and the Fatherland, then however much labour it takes and however much money it costs, one does it gladly. Only that is true thrift. Not spending on what deserves spending is stinginess, not thrift.\""},{"id":"en13-20","cd":"13","l":"DK","q":"Ho Chi Minh's idea of \"loyalty to the country, devotion to the people\" not only _______ the traditional patriotic values of the nation but also overcomes the limitations of that tradition, bringing about a profound revolution.","o":[["A","denies"],["B","replaces"],["C","mechanically copies"],["D","inherits"],["E","absolutises"]],"a":"D","g":"The course textbook writes: \"Ho Chi Minh's idea of “loyalty to the country, devotion to the people” not only inherits the traditional patriotic values of the nation but also overcomes the limitations of that tradition. Loyalty to the country means being loyal to the cause of building and defending the country.\""},{"id":"en13-21","cd":"13","l":"DS","q":"According to the textbook, industry, thrift, integrity, righteousness, and selfless impartiality are also a concrete expression of the quality of “loyalty to the country, devotion to the people”.","o":[],"a":"D","g":"The course textbook states: “In this sense, industry, thrift, integrity, righteousness, and selfless impartiality are also a concrete expression of the quality of ‘loyalty to the country, devotion to the people’.” This is consistent with the view that loyalty to the country, devotion to the people is the overarching quality that governs the others."},{"id":"en13-22","cd":"13","l":"DS","q":"According to Ho Chi Minh, without love for people one can still speak of revolution; one simply cannot speak of socialism and communism.","o":[],"a":"S","g":"The course textbook states: “He held that without such love, one cannot speak of revolution, let alone socialism and communism.” Thus, without love for people one cannot even speak of revolution."},{"id":"en13-23","cd":"13","l":"D1","q":"According to the textbook, what is the significance of Ho Chi Minh's point “loyalty to the country, devotion to the people; complete every task, overcome every difficulty, defeat every enemy” in his Letter to the Youth (1965)?","o":[["A","It is both a call to action and a political and ethical orientation for every Vietnamese, not only in the past and today but also long into the future."],["B","It is only a motivational slogan reserved for the armed forces in wartime."],["C","It restores the notion of “loyalty to the king” in traditional ethics."],["D","It was valid only for the revolutionary struggle in the past and is no longer relevant."],["E","It sets requirements only for Party members, not for every Vietnamese."]],"a":"A","g":"The course textbook states: “That point of Ho Chi Minh is both a call to action and a political and ethical orientation for every Vietnamese, not only in the revolutionary struggle of the past and today, but also long into the future.”"},{"id":"en13-24","cd":"13","l":"D1","q":"According to Ho Chi Minh, why must cadres practise INTEGRITY first, to set an example for the people?","o":[["A","Because INTEGRITY is required only of senior cadres, not of junior ones."],["B","Because practising INTEGRITY helps cadres get promoted faster."],["C","Because INTEGRITY has nothing to do with THRIFT and INDUSTRY."],["D","Because cadres earn more than the people, so it is easy for them to stay clean."],["E","Because cadres, senior or junior, all hold power; having power without a conscience gives opportunities to embezzle, take bribes and “use public office for private gain”."]],"a":"E","g":"The course textbook states: “First of all, cadres of agencies and organisations: senior ones have great power, junior ones have little power. Whether great or small, having power without a conscience gives opportunities to embezzle, to take bribes, to ‘use public office for private gain’. Therefore, cadres must practise INTEGRITY first, to set an example for the people”."},{"id":"en13-25","cd":"13","l":"SAI","q":"Which of the following statements about industry, thrift, integrity, righteousness, and selfless impartiality in Ho Chi Minh Thought is NOT correct?","o":[["A","They are the core content of revolutionary ethics, bound up with everyone's daily activities."],["B","Ho Chi Minh mentioned them most often and most regularly, from the book The Revolutionary Path to his Testament."],["C","The virtues of industry, thrift, integrity and righteousness are closely related to one another."],["D","Only cadres and Party members must practise them; the people are not required to."],["E","A nation that knows industry and thrift, and knows integrity, is a nation rich in material terms, strong in spirit, civilised and progressive."]],"a":"D","g":"The course textbook states: “Ho Chi Minh held that the virtues of industry, thrift, integrity and righteousness are closely related to one another; everyone must practise them, but cadres and Party members must be the first to practise them in order to set an example for the people.” Therefore, saying that only cadres and Party members must practise them is incorrect."},{"id":"en13-26","cd":"13","l":"SAI","q":"Which of the following statements about pure internationalism in Ho Chi Minh Thought is NOT correct?","o":[["A","Internationalism is one of the most important qualities of communist ethics."],["B","Because he upheld independence, self-reliance and self-strengthening, Ho Chi Minh advocated limiting international unity and cooperation."],["C","Internationalism addresses broad relations that go beyond the limits of the nation-state."],["D","Ho Chi Minh is a fine symbol of genuine patriotism harmoniously combined with proletarian internationalism."],["E","The verse “Mountains and passes ten thousand miles apart, yet one home; proletarians of the four directions are all brothers!” expresses pure internationalism."]],"a":"B","g":"The course textbook states: “Ho Chi Minh upheld the spirit of independence, self-reliance and self-strengthening, but always called for strengthening international unity and cooperation, while vigorously supporting and assisting the struggles of the peoples of other countries for peace, national independence, democracy and social progress.” Therefore, option B is incorrect."},{"id":"en13-27","cd":"13","l":"NH","q":"According to Ho Chi Minh, what does RIGHTEOUSNESS require in relation to oneself and to others?","o":[["A","Towards oneself: do not be conceited or arrogant."],["B","Towards others: do not flatter superiors."],["C","Towards others: one may look down on subordinates if one holds a higher position."],["D","Towards others: one's attitude must be sincere and modest; one must practise universal love."],["E","Towards oneself: one may extol oneself once one has made great achievements."]],"a":"ABD","g":"The course textbook states: “Righteousness means not being crooked, that is, being straightforward and upright.” Righteousness is clearly expressed in three relationships: “TOWARDS ONESELF - Do not be conceited or arrogant... TOWARDS OTHERS... Do not flatter superiors. Do not look down on subordinates. One's attitude must be sincere and modest... One must practise universal love”. Options C and E contradict these requirements."},{"id":"en13-28","cd":"13","l":"NH","q":"According to the textbook, on what basis did Ho Chi Minh identify love for people as one of the finest ethical qualities?","o":[["A","Adopting wholesale the feudal notion of “loyalty to the king, filial piety to parents”."],["B","Inheriting the nation's tradition of humanity and righteousness."],["C","Combining it with communist humanism."],["D","The attitude of “peace at any price” in dealings between people."],["E","Testing it through his own experience in practical activities."]],"a":"BCE","g":"The course textbook states: “Inheriting the nation's tradition of humanity and righteousness, combining it with communist humanism, absorbing the humanist spirit of humankind over many decades, together with testing it through his own experience in practical activities, Ho Chi Minh identified love for people as one of the finest ethical qualities.” The textbook also makes clear that love for people “is not an attitude of ‘peace at any price’”."},{"id":"en13-29","cd":"13","l":"DK","q":"Ho Chi Minh wrote: “What is thrift? It is saving, not being extravagant, not being wasteful, not being careless. INDUSTRY and THRIFT must go hand in hand, like the _______ of a person”.","o":[["A","two hands"],["B","two eyes"],["C","two legs"],["D","heart and mind"],["E","breath"]],"a":"C","g":"The course textbook states: “What is thrift? It is saving, not being extravagant, not being wasteful, not being careless. INDUSTRY and THRIFT must go hand in hand, like the two legs of a person”."},{"id":"en13-30","cd":"13","l":"DK","q":"Throughout his revolutionary life, Ho Chi Minh painstakingly built friendship and solidarity between the Vietnamese people and the peoples of the world, creating a new type of international relations: _______, aimed at building a culture of peace for humankind.","o":[["A","dialogue instead of confrontation"],["B","military alliance instead of cooperation"],["C","isolation instead of integration"],["D","competition instead of friendship"],["E","dependence instead of self-reliance"]],"a":"A","g":"The course textbook states: “Throughout his revolutionary life, Ho Chi Minh painstakingly built friendship and solidarity between the Vietnamese people and the peoples of the world, creating a new type of international relations: dialogue instead of confrontation, aimed at building a culture of peace for humankind”."},{"id":"en14-1","cd":"14","l":"DS","q":"According to Ho Chi Minh, morality is the sole and absolute criterion for judging the success of a revolutionary, because \"without morality, however talented one may be, one cannot lead the people\".","o":[],"a":"S","g":"The course textbook affirms that morality is the \"foremost criterion\", the \"root\", the \"foundation\" and \"very important\" for a revolutionary, and even that \"without morality, however talented one may be, one cannot lead the people\". However, he also emphasised that \"Virtue and talent must be unified qualities of a human being\" and that \"without talent, everything one does is difficult\". Therefore, saying that morality is \"sole and absolute\" is wrong, because it ignores the important role of talent when it is bound up with morality."},{"id":"en14-2","cd":"14","l":"DS","q":"The principle of \"words matched by deeds\" was regarded by Ho Chi Minh as the essential characteristic of ethical thought and applies mainly to cadres and Party members so that they set an example for the masses; it is not a universal requirement for everyone.","o":[],"a":"S","g":"The course textbook affirms that \"words matched by deeds\" is \"the essential characteristic of Ho Chi Minh's ethical thought\". He \"educated everyone, and he himself carried it out most seriously and fully\". Although he did emphasise that \"Party members lead the way, the village and the country follow\" and that cadres and Party members must \"set an example\", regarding it as \"applying mainly\" to cadres and Party members is not accurate, because it is an overall characteristic, a general principle for \"everyone\"."},{"id":"en14-3","cd":"14","l":"DS","q":"In the principle of \"building goes hand in hand with combating\", Ho Chi Minh advocated concentrating first on completely eliminating immoral behaviour and only then proceeding to build new moral values, so as to ensure purity.","o":[],"a":"S","g":"The course textbook states clearly: \"Building must go hand in hand with combating; to build one must combat, combating aims at building, taking building as the main thing\". This means that building new moral values is the primary goal, and combating the bad serves the goal of building. Concentrating on eliminating \"completely first\" and \"only then proceeding to build\" does not correctly reflect Ho Chi Minh's spirit of \"building goes hand in hand with combating\" and the principle of \"taking building as the main thing\"."},{"id":"en14-4","cd":"14","l":"DS","q":"Although moral self-cultivation is a continuous process, Ho Chi Minh particularly emphasised the importance of self-cultivation in youth, regarding it as the decisive stage that deserves top priority, while later stages may be less strict.","o":[],"a":"S","g":"The course textbook clearly states that one \"must persevere in continuous training and lifelong self-cultivation, in which youth is especially important\". However, he also warned: \"If one does not persevere in training, one may be a person of merit in an earlier period but a person of guilt in a later one; one may keep one's morality when young but degenerate, become corrupt and depraved when old\". This affirms that self-cultivation must be continuous, with no stage in which strictness may be relaxed; it is a \"long and arduous\" process."},{"id":"en14-5","cd":"14","l":"D1","q":"Ho Chi Minh's statement \"Without revolutionary ethics, talent is useless\" most deeply implies what about the relationship between the morality and the talent of a revolutionary?","o":[["A","Morality is more important than talent and can replace talent in every case."],["B","A person who has talent but lacks morality can only accomplish small tasks."],["C","A revolutionary should give priority to training talent first and only then cultivate morality."],["D","Morality and talent are two completely separate factors that do not affect each other."],["E","Talent only truly realises its value, and does not become harmful, when morality serves as its foundation and guide."]],"a":"E","g":"The course textbook affirms that \"Without revolutionary ethics, talent is useless\" and that \"lacking morality one is useless, even harmful\". At the same time, \"morality is the root, the foundation of a revolutionary\" and \"talent must be closely tied to and firmly placed on the foundation of morality\". This shows that talent needs morality in order to have the right purpose and direction, to realise its positive value and to avoid causing harm; it is not a matter of separation or replacement."},{"id":"en14-6","cd":"14","l":"D1","q":"When Ho Chi Minh likened \"morality is the root\" to the root of a tree, what is the deepest meaning of this for a revolutionary?","o":[["A","Morality is the only factor that helps a revolutionary achieve success."],["B","Morality needs attention only in the early stage of the revolutionary cause."],["C","Morality is the solid foundation that determines the existence, development and ability of a revolutionary to lead the masses."],["D","A revolutionary needs only morality, not outstanding talent."],["E","Morality forms naturally and needs no training."]],"a":"C","g":"The course textbook uses the comparison: \"A tree must have roots; without roots the tree withers. A revolutionary must have morality; without morality, however talented one may be, one cannot lead the people\". This shows that morality is not only the foundation for existence (\"without roots the tree withers\") but also determines the ability to lead, that is, the development and influence of the revolutionary. The other options do not reflect this meaning correctly or distort it."},{"id":"en14-7","cd":"14","l":"D1","q":"What does Ho Chi Minh's statement \"Fighting individualism is not “trampling on individual interests”\" imply?","o":[["A","Individualism has no interests at all that deserve protection."],["B","Fighting individualism aims only at denying all interests of the individual."],["C","Individualism is harmful only when it grows excessively beyond control, and it needs to be controlled gently."],["D","Individual interests are unrelated to revolutionary ethics and need not be considered in the struggle."],["E","Fighting individualism aims to eliminate self-seeking, selfish behaviour that harms the collective, while still respecting the lawful and legitimate interests of the individual."]],"a":"E","g":"The course textbook affirms that \"The root of all kinds of ills is individualism\" and that \"Individualism must be resolutely swept away and revolutionary ethics raised\". However, he also noted: \"Fighting individualism is not 'trampling on individual interests'\". This shows that the purpose of fighting individualism is to eliminate negative, selfish, self-seeking behaviour that harms the collective, not to deny or reject the lawful and legitimate interests of the individual."},{"id":"en14-8","cd":"14","l":"D1","q":"According to Ho Chi Minh, what is the deepest meaning of cadres and Party members \"setting an example\" in morality?","o":[["A","Merely complying with the regulations of the Party and the State on morality in order to avoid disciplinary action."],["B","Demonstrating the power and prestige of the Party before the masses through an imposing manner."],["C","Setting an example is needed only at major events or in especially important circumstances."],["D","The main purpose is to preserve the personal honour of cadres and Party members."],["E","It is the most effective method of moral education for the masses and at the same time a way of educating oneself, because \"a living example is worth more than a hundred propaganda speeches\"."]],"a":"E","g":"The course textbook emphasises: \"The exemplary conduct of cadres and Party members in word and deed is not only a way of giving moral education to the masses but also a method of educating oneself\". In particular, he said: \"For them, a living example is worth more than a hundred propaganda speeches\". This shows that setting an example is a powerful method of education, both for others and for oneself, more effective than mere words, and not merely a formality or a way of going through the motions."},{"id":"en14-9","cd":"14","l":"SAI","q":"Which of the following statements does not correctly reflect Ho Chi Minh's view on the nature of revolutionary ethics and the process of training in it?","o":[["A","Revolutionary ethics is a mainstay that helps people stand firm through every trial, whether in difficulty or in success."],["B","Revolutionary ethics expresses a militant humanism for the goals of the revolutionary cause."],["C","Revolutionary ethics is not something ready-made but must come through struggle and persistent daily training."],["D","Revolutionary ethics requires revolutionaries to eliminate completely all \"good\" and \"evil\" thoughts from their hearts in order to achieve absolute purity."],["E","Revolutionary ethics is ethics in action, taking practical effectiveness as its measure."]],"a":"D","g":"The course textbook clearly states: \"Every person has both good and evil in their heart. We must know how to make the good part in each person blossom like flowers in spring and the bad part gradually disappear; that is the attitude of a revolutionary\". This shows that Ho Chi Minh did not demand eliminating \"completely all good and evil thoughts\" but an inner struggle to develop the good and remove the bad. Therefore statement D is wrong. Options A, B, C and E are all mentioned directly or indirectly in the textbook."},{"id":"en14-10","cd":"14","l":"SAI","q":"Which of the following statements does not correctly reflect Ho Chi Minh's view on educating \"virtue\" and \"talent\" in the revolutionary cause?","o":[["A","Comprehensive education in \"Virtue, Intellect, Physique, Aesthetics\" is needed, in which virtue is the root."],["B","Virtue and talent, \"red\" and \"expert\", qualities and competence must be unified as one."],["C","Without revolutionary ethics, talent is useless."],["D","Educating talent must take top priority in every period, because talent is the most important means of achieving every revolutionary goal."],["E","Without talent, everything is difficult to do, but without morality one is useless, even harmful."]],"a":"D","g":"The course textbook affirms that \"morality is the root, the foundation of a revolutionary\", \"virtue is the root, it comes first\", and \"That is the root, very important. Without revolutionary ethics, talent is useless\". This shows that \"virtue\" is given priority as the foremost \"root\" and \"foundation\". Although \"talent is the means of achieving that purpose\" and \"without talent the country cannot be built and developed\", saying that \"educating talent must take top priority in every period\" is wrong, because it runs counter to the view that \"virtue is the root, it comes first\"."},{"id":"en14-11","cd":"14","l":"SAI","q":"According to Ho Chi Minh, which of the following behaviours is not an expression of \"the vice of hypocrisy\", \"the disease of bureaucratism\" or negative \"individualism\"?","o":[["A","\"Saying one thing and doing another\", \"saying much and doing little\", \"saying without doing\"."],["B","\"Putting on the airs of a revolutionary mandarin\", \"talking democracy with their mouths but working in the “mandarin”-cracy way\"."],["C","Acts that \"run counter to the interests of the masses, counter to the guidelines and policies of the Party and the Government\"."],["D","Resolutely fighting individualism in all circumstances, even to the point of denying the lawful and legitimate interests of the individual."],["E","The behaviours of \"bureaucratism, embezzlement and waste\"."]],"a":"D","g":"The course textbook clearly states: \"Words matched by deeds stand in complete opposition to the vice of hypocrisy, saying one thing and doing another, saying much and doing little, even saying without doing\". The behaviours of \"putting on the airs of a revolutionary mandarin\", \"talking democracy with their mouths but working in the “mandarin”-cracy way\" and \"bureaucratism, embezzlement and waste\" are also pointed out by him as negative manifestations. However, he noted: \"Fighting individualism is not 'trampling on individual interests'\". Therefore, \"denying the lawful and legitimate interests of the individual\" in the struggle against individualism is an improper behaviour according to his t"},{"id":"en14-12","cd":"14","l":"SAI","q":"To build a new morality, Ho Chi Minh pointed out which of the following requirements, except for one that is incorrect?","o":[["A","Moral standards must become the daily moral behaviour of each person and of the whole society."],["B","\"Building\" and \"combating\" must be closely combined, \"taking building as the main thing\"."],["C","Awakening a healthy moral consciousness in each person, encouraging self-education and moral self-improvement."],["D","Moral education must be carried out in a way suited to each revolutionary stage, age group and occupation."],["E","Concentrating first on educating cadres and Party members in new moral qualities, and only then spreading them widely to the whole people once the people have reached a sufficient level to absorb them."]],"a":"E","g":"Although Ho Chi Minh laid great emphasis on cadres and Party members \"setting an example\" and being \"imbued with revolutionary ethics\", building a new morality is not reserved for one group of people before being spread. The course textbook clearly states that \"to build a new morality for cadres, Party members and millions upon millions of people, one must first of all take care to cultivate new moral qualities and standards right from the family, then in school and in society\". This shows that it is a comprehensive process taking place simultaneously at many levels, not a \"before–after\" sequence with the condition of \"a sufficient level to absorb them\" as option E states."},{"id":"en14-13","cd":"14","l":"NH","q":"According to Ho Chi Minh, which of the following basic principles must be implemented to build a new revolutionary ethics?","o":[["A","Words matched by deeds, setting a moral example."],["B","Putting individual interests above collective interests to encourage dynamism."],["C","Building goes hand in hand with combating, taking building as the main thing."],["D","Lifelong moral self-cultivation."],["E","Placing talent above morality in every case, because talent is the main driving force."]],"a":"ACD","g":"The course textbook clearly divides the principles of building revolutionary ethics into three: \"a) Words matched by deeds, setting a moral example\"; \"b) Building goes hand in hand with combating\" (in the spirit of \"taking building as the main thing\"); and \"c) Lifelong moral self-cultivation\". Option B runs counter to \"combating individualism\", and option E runs counter to the view that \"morality is the root\"."},{"id":"en14-14","cd":"14","l":"NH","q":"According to Ho Chi Minh, if a revolutionary lacks morality, which of the following negative consequences may result?","o":[["A","However talented they may be, they cannot lead the people."],["B","They become corrupt and base themselves, incapable of accomplishing great things."],["C","The masses do not hold them dear, do not trust them and do not follow them."],["D","They can still fulfil the revolutionary task fully, but not gloriously."],["E","They become useless, even harmful to the revolutionary cause."]],"a":"ABCE","g":"A: The course textbook says: \"without morality, however talented one may be, one cannot lead the people\". (Correct) B: The textbook says: \"if one has no morality oneself, no foundation, if one has already become corrupt and base, what could one possibly accomplish?\". (Correct) C: The textbook says: \"The masses only hold dear those who have good character and morality\", implying that without it one is not held dear, trusted or followed. (Correct) D: The textbook affirms: \"A revolutionary must have revolutionary ethics as a foundation; only then can they fulfil the revolutionary task gloriously\", implying that without it the task cannot be fulfilled \"gloriously\", not that one \"can still fulfil"},{"id":"en14-15","cd":"14","l":"NH","q":"Which of the following behaviours did Ho Chi Minh condemn as harmful expressions of \"the vice of hypocrisy\", \"the disease of bureaucratism\" or negative \"individualism\"?","o":[["A","The disease of empty talk, the vice of ostentatious formalism, and ways of working not aimed at raising production."],["B","Saying one thing and doing another, saying much and doing little, saying without doing."],["C","The behaviours of \"putting on the airs of a revolutionary mandarin\", \"working in the “mandarin”-cracy way\", \"running counter to the interests of the masses\"."],["D","Practising industry, thrift, integrity, righteousness, and selfless impartiality."],["E","The behaviours of \"bureaucratism, embezzlement and waste\", which he called \"crimes\"."]],"a":"ABCE","g":"A: The course textbook says: \"Resolutely combat the disease of empty talk, the vice of ostentatious formalism, and ways of working not aimed at raising production\". (Correct) B: The textbook says: \"Words matched by deeds stand in complete opposition to the vice of hypocrisy, saying one thing and doing another, saying much and doing little, even saying without doing\". (Correct) C: The textbook mentions: \"putting on the airs of a revolutionary mandarin\", \"working in the “mandarin”-cracy way\", \"running counter to the interests of the masses\". (Correct) D: \"Industry, thrift, integrity, righteousness, and selfless impartiality\" are positive moral qualities that he required people to practise. E: "},{"id":"en14-16","cd":"14","l":"NH","q":"According to Ho Chi Minh, what does lifelong moral self-cultivation require so that a revolutionary can preserve their qualities?","o":[["A","Persistent, regular and continuous training in all circumstances."],["B","Reforming oneself and nurturing new thinking in order to break with the old self."],["C","Training through practical activities, at work and in everyday relationships."],["D","Looking squarely at oneself, clearly seeing one's strengths and good points in order to develop them, and one's weaknesses and bad points in order to overcome them."],["E","Morality is a quality \"fixed once and for all\"; training well in one's youth is enough."]],"a":"ABCD","g":"A: The course textbook says: \"one must be persistent, regular and continuous\", \"persevere in continuous training and lifelong self-cultivation\". (Correct) B: The textbook says: \"Reform ourselves\", \"Nurture new thinking to overthrow old thinking, break with the old self to become a new person\". (Correct) C: The textbook says: \"training through practical activities, at work, in one's relationships\". (Correct) D: The textbook says: \"one must look squarely at oneself... must clearly see one's strengths and good points... in order to develop them, and clearly see one's weaknesses and bad points... in order to overcome them\". (Correct) E: The textbook states clearly: \"Morality is not something 'fi"},{"id":"en14-17","cd":"14","l":"DK","q":"Ho Chi Minh made the comparison: \"Just as a river has water only when it has a source, and without a source (1) _______. A tree must have roots; without roots the tree withers. A revolutionary must have (2) _______; without morality, however talented one may be, one cannot lead the people.\"","o":[["A","(1) the river dries up; (2) talent"],["B","(1) the tree withers; (2) morality"],["C","(1) the river dries up; (2) roots"],["D","(1) the tree withers; (2) talent"],["E","(1) the river dries up; (2) morality"]],"a":"E","g":"The course textbook writes: \"Just as a river has water only when it has a source, and without a source the river dries up. A tree must have roots; without roots the tree withers. A revolutionary must have morality; without morality, however talented one may be, one cannot lead the people\"."},{"id":"en14-18","cd":"14","l":"DK","q":"In his Testament, Ho Chi Minh advised: \"Our Party is a ruling party. Every Party member and cadre must be truly imbued with revolutionary ethics and truly practise industry, thrift, integrity, righteousness, and selfless impartiality. We must keep our Party truly clean and be worthy of being the (1) _______, the truly loyal (2) _______ of the people.\"","o":[["A","(1) servant; (2) leader"],["B","(1) leader; (2) role model"],["C","(1) role model; (2) servant"],["D","(1) leader; (2) servant"],["E","(1) role model; (2) leader"]],"a":"D","g":"The course textbook writes: \"Our Party is a ruling party. Every Party member and cadre must be truly imbued with revolutionary ethics and truly practise industry, thrift, integrity, righteousness, and selfless impartiality. We must keep our Party truly clean and be worthy of being the leader, the truly loyal servant of the people\"."},{"id":"en14-19","cd":"14","l":"DK","q":"Ho Chi Minh held that \"Receiving moral education is absolutely indispensable, but _______ and moral self-improvement by each person are even more important. Because \"Revolutionary ethics does not fall from the sky. It is developed and consolidated through persistent daily struggle and training. Just as jade grows brighter the more it is polished, and gold grows purer the more it is refined\".\"","o":[["A","self-education"],["B","setting an example"],["C","leadership"],["D","education by the organisation"],["E","supervision by the collective"]],"a":"A","g":"The course textbook states clearly: \"Receiving moral education is absolutely indispensable, but self-education and moral self-improvement by each person are even more important\"."},{"id":"en14-20","cd":"14","l":"DK","q":"Ho Chi Minh pointed out clearly: \"The root of all kinds of ills is (1) _______\". To win this fight, what is important is to detect them early, to carry out propaganda and mobilisation to build a broad mass movement, and at the same time to pay attention to combining moral education with strengthening the rigour of (2) _______.","o":[["A","(1) individualism; (2) morality"],["B","(1) bureaucratism; (2) the law"],["C","(1) individualism; (2) the law"],["D","(1) embezzlement; (2) morality"],["E","(1) waste; (2) the law"]],"a":"C","g":"The course textbook states: \"The root of all kinds of ills is individualism\". At the same time, he also required: \"To win this fight, what is important is to... pay attention to combining moral education with strengthening the rigour of the law\"."},{"id":"en14-21","cd":"14","l":"DS","q":"In the article The Revolutionary Cadre (1955), Ho Chi Minh affirmed that whether any work succeeds or fails depends mainly on whether cadres are imbued with revolutionary ethics.","o":[],"a":"D","g":"The course textbook states: “Ethics becomes the decisive factor in the success or failure of all work and in each person's qualities.” In The Revolutionary Cadre (1955), Ho Chi Minh required: “A revolutionary cadre must have revolutionary ethics... Whether any work succeeds or fails depends mainly on whether cadres are imbued with revolutionary ethics or not”."},{"id":"en14-22","cd":"14","l":"DS","q":"Ho Chi Minh required cadres and Party members to set an example among their comrades and for the people, but only in spiritual terms.","o":[],"a":"S","g":"The course textbook states: “First of all, we must set an example, try to set an example among our comrades, and when on assignment, try to set an example for the people. Set an example in all three respects: spiritual, material and cultural”. Therefore, saying that an example is needed only in spiritual terms is incorrect."},{"id":"en14-23","cd":"14","l":"D1","q":"According to Ho Chi Minh, although people differ in ability and work, some doing big jobs and some small ones, what makes a person noble?","o":[["A","Doing great things."],["B","Having outstanding ability compared with others."],["C","Preserving one's ethics."],["D","Holding a high position in the apparatus."],["E","Having many degrees and academic titles."]],"a":"C","g":"The course textbook states: “The role of ethics is also shown as the measure of a person's nobility.” Ho Chi Minh wrote: “Although each person's ability and work differ, some do big jobs, some do small jobs, whoever preserves their ethics is a noble person”."},{"id":"en14-24","cd":"14","l":"D1","q":"According to the textbook, what place did Ho Chi Minh give to the principle of “words matched by deeds” in building the new ethics?","o":[["A","A secondary principle, applied only when propagandising and mobilising the masses."],["B","A purely Western requirement that he adopted, absent from the national tradition."],["C","A formal slogan, unconnected with practice."],["D","The most important principle, embodying the unity of theory and practice."],["E","A temporary principle, needed only during the resistance war."]],"a":"D","g":"The course textbook states: “Words matched by deeds is a fine feature of the nation's traditional ethics which Ho Chi Minh raised to a new level.” and “He regarded this as the most important principle in building the new ethics. This basic principle is the unity of theory and practice”."},{"id":"en14-25","cd":"14","l":"SAI","q":"Which of the following statements about the principle “building goes hand in hand with combating” in Ho Chi Minh Thought is NOT correct?","o":[["A","It is a requirement of the new ethics, showing the fighting humanism for the goals of the revolutionary cause."],["B","Building means building new ethical values and standards; combating means combating immoral expressions and behaviour and ethical degradation."],["C","Because good and bad are always clearly separate and never intertwined within each person, building and combating are simple."],["D","The new ethics can only be built successfully by persistently combating imperialism, combating backward habits and customs, and eliminating individualism."],["E","Self-awareness itself is also a noble ethical quality for every person and every organisation."]],"a":"C","g":"The course textbook states: “In daily life, good and bad, right and wrong, the ethical and the unethical are often intertwined and opposed to each other through the behaviour of different people, even within each person.” and “Therefore, building and combating in the field of ethics is clearly not simple.” Therefore, option C is incorrect."},{"id":"en14-26","cd":"14","l":"SAI","q":"Which of the following statements about the principle of “lifelong moral self-cultivation” according to Ho Chi Minh is NOT correct?","o":[["A","Ho Chi Minh completely rejected Confucius's maxim “rectify the mind, cultivate the self”, considering it worthless for revolutionaries."],["B","Moral self-cultivation is like a long and arduous revolution."],["C","A new ethics can only be built on the basis of each person's conscious moral self-cultivation."],["D","Only in action does revolutionary ethics clearly reveal its values."],["E","Revolutionary ethics is shown in the actions of patriotic Vietnamese for the independence and freedom of the nation and the happiness of the people."]],"a":"A","g":"The course textbook states: “He restated Confucius's maxims ‘rectify the mind, cultivate the self’; ‘regulate the family, govern the state, bring peace to the world’, and made clear” that: “Rectifying the mind and cultivating the self means transformation. Transformation must also be long and arduous, because it is a revolution within each person.” Therefore, saying that he completely rejected this maxim is incorrect."},{"id":"en14-27","cd":"14","l":"NH","q":"According to Ho Chi Minh, how does a person with revolutionary ethics behave?","o":[["A","When facing difficulty, hardship or failure, they are not afraid, timid or retreating."],["B","When things go well and they succeed, they may relax and enjoy benefits before others."],["C","When things go well and they succeed, they still maintain a spirit of hardship, simplicity and modesty."],["D","They need to keep their ethics only in difficult times, not in favourable ones."],["E","They devote their whole life wholeheartedly to serving the people and set an example in daily life."]],"a":"ACE","g":"The course textbook states: “According to Ho Chi Minh, revolutionary ethics is a support that keeps people steadfast through every trial.” and “With revolutionary ethics, when facing difficulty, hardship or failure, one is not afraid, timid or retreating... when things go well and one succeeds, one still maintains a spirit of hardship, simplicity and modesty”. He also wrote: “The great majority of revolutionary fighters are people with ethics: their whole life devoted wholeheartedly to serving the people, setting an example in daily life”."},{"id":"en14-28","cd":"14","l":"NH","q":"According to Ho Chi Minh, what should be done to promote “the way of setting an example” in building the new ethics?","o":[["A","Praise only examples at the highest level of leadership."],["B","Use examples of good people and good deeds to educate one another every day."],["C","Discover and build models of “good people, good deeds” that are very close to everyday life."],["D","Look for models in the fields of labour, production, combat, study and research."],["E","Regard good people and good deeds as rare, found only in certain sectors and groups."]],"a":"BCD","g":"The course textbook states: “Using examples of good people and good deeds to educate one another every day is one of the best ways to build the Party, build revolutionary organisations, build the new person and the new life” and “To do so, attention must be paid to discovering and building models of ‘good people, good deeds’ very close to everyday life, in the fields of labour, production, combat, study, research...” He affirmed: “Good people and good deeds are plentiful. They are everywhere. Every sector, every group, every locality, every age group has them”."},{"id":"en14-29","cd":"14","l":"DK","q":"According to the textbook, virtue and talent must be unified qualities of a person: if ethics is the standard for the purpose of action, then talent is _______.","o":[["A","the ultimate purpose of action"],["B","the means of achieving that purpose"],["C","the foremost standard of a revolutionary"],["D","an unnecessary factor"],["E","the root of a revolutionary"]],"a":"B","g":"The course textbook states: “Virtue and talent must be unified qualities of a person. If ethics is the standard for the purpose of action, then talent is the means of achieving that purpose.”"},{"id":"en14-30","cd":"14","l":"DK","q":"The key issue in moral education is to awaken a healthy ethical awareness in each person, so that everyone deeply feels that cultivating revolutionary ethics is “the most _______ thing in life”.","o":[["A","ordinary and simple"],["B","compulsory and constraining"],["C","costly and time-consuming"],["D","private and discreet"],["E","joyful and glorious"]],"a":"E","g":"The course textbook states: “The key issue in moral education is to awaken a healthy ethical awareness in each person, so that everyone consciously recognises their ethical responsibility and, as Ho Chi Minh said, deeply feels that cultivating revolutionary ethics is ‘the most joyful and glorious thing in life’.”"}],"cdBuoi":{"01":2,"02":3,"03":5,"04":6,"05":7,"06":8,"07":9,"08":9,"09":9,"10":10,"11":10,"12":10,"13":11,"14":11},"moc":{"xuatBen":{"nam":"5/6/1911","ten":"Ra đi tìm đường cứu nước","loi":"Ngày 5/6/1911, Hồ Chí Minh đi ra nước ngoài tìm con đường cứu nước, cứu dân."},"dung1":{"nam":"1917","ten":"Trở lại Pháp","loi":"Năm 1917, trở lại Pháp, Hồ Chí Minh tham gia phong trào công nhân Pháp đấu tranh chống chủ nghĩa thực dân; năm 1919, Người gia nhập Đảng Xã hội Pháp."},"dung2":[{"nam":"18/6/1919","ten":"Yêu sách của nhân dân An Nam","loi":"Lấy tên Nguyễn Ái Quốc, Người gửi Yêu sách của nhân dân An Nam tới Hội nghị Vécxây — tiếng nói chính nghĩa đầu tiên của đại biểu phong trào giải phóng dân tộc Việt Nam trên diễn đàn quốc tế."},{"nam":"7/1920","ten":"Luận cương của Lênin","loi":"Qua Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của V.I. Lênin, Hồ Chí Minh tìm thấy phương hướng giải phóng dân tộc theo con đường cách mạng vô sản."},{"nam":"12/1920","ten":"Đại hội Tua","loi":"Tại Đại hội ở thành phố Tua (25–30/12/1920), Người bỏ phiếu tán thành Quốc tế Cộng sản, tham gia sáng lập Đảng Cộng sản Pháp, trở thành người cộng sản Việt Nam đầu tiên."},{"nam":"6/1925","ten":"Hội Việt Nam Cách mạng Thanh niên","loi":"Hồ Chí Minh sáng lập Hội Việt Nam Cách mạng Thanh niên — tổ chức tiền thân của Đảng Cộng sản, ra báo Thanh niên bằng tiếng Việt."},{"nam":"1927","ten":"Đường cách mệnh","loi":"Tác phẩm Đường cách mệnh xuất bản năm 1927 ở Quảng Châu, Trung Quốc — sự chuẩn bị về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam."},{"nam":"Đầu 1930","ten":"Thành lập Đảng","loi":"Hồ Chí Minh chủ trì Hội nghị hợp nhất các tổ chức cộng sản thành Đảng Cộng sản Việt Nam; Chánh cương vắn tắt, Sách lược vắn tắt được coi là Cương lĩnh chính trị đầu tiên của Đảng."}],"pacBo":{"nam":"5/1941","ten":"Hội nghị Trung ương","loi":"Tại Pác Bó (Hà Quảng, Cao Bằng), Người chủ trì Hội nghị Ban Chấp hành Trung ương Đảng, đặt nhiệm vụ giải phóng dân tộc lên hàng đầu."},"baDinh":{"nam":"2/9/1945","ten":"Tuyên ngôn độc lập","loi":"Tại Quảng trường Ba Đình, Hà Nội, Hồ Chí Minh đọc bản Tuyên ngôn độc lập khai sinh ra nước Việt Nam Dân chủ Cộng hòa."}}};

const Mang = {
  kieu: null, ma: null, cl: null, kenh: null, ketNoi: false,
  async mo(kieu, ma, vai, nghe, mc) {
    this.dong();
    this.kieu = kieu; this.ma = ma;
    const nhan = vai === 'mc' ? 'a' : 's';
    if (kieu === 'bc') {
      this.kenh = new BroadcastChannel('dttl2-' + ma);
      this.kenh.onmessage = e => { if (e.data && e.data.k === nhan) nghe(e.data.d); };
      this.ketNoi = true; return true;
    }
    try { await napThuVien('https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js', 'mqtt'); } catch (e) { return false; }
    return new Promise(ok => {
      let xong = false;
      const cl = window.mqtt.connect(MAY_CHU[mc || 0], {clientId: 'dttl_' + Math.random().toString(16).slice(2, 10), clean: true, keepalive: 30, reconnectPeriod: 2000, connectTimeout: 8000});
      this.cl = cl;
      cl.on('connect', () => { this.ketNoi = true; cl.subscribe(`${GOC_KENH}/${ma}/${nhan}`); if (!xong) { xong = true; ok(true); } });
      cl.on('close', () => { this.ketNoi = false; });
      cl.on('message', (tp, buf) => { try { const s = new TextDecoder().decode(buf); if (s) nghe(JSON.parse(s)); else nghe(null); } catch (e) { /* bỏ qua tin hỏng */ } });
      setTimeout(() => { if (!xong) { xong = true; ok(false); } }, 9000);
    });
  },
  gui(kenh, d, giu) {
    if (this.kieu === 'bc' && this.kenh) this.kenh.postMessage({k: kenh, d});
    else if (this.cl) this.cl.publish(`${GOC_KENH}/${this.ma}/${kenh}`, d == null ? '' : JSON.stringify(d), {qos: 0, retain: !!giu});
  },
  dong() { try { if (this.kenh) this.kenh.close(); if (this.cl) this.cl.end(true); } catch (e) { /* bỏ qua */ } this.kenh = null; this.cl = null; this.kieu = null; this.ketNoi = false; }
};
function napThuVien(src, bien) {
  if (window[bien]) return Promise.resolve();

}

  return id;
}
function docVao() { try { return JSON.parse(localStorage.getItem('dttl-vao-' + idMay()) || '{}'); } catch (e) { return {}; } }
function luuVao() { try { localStorage.setItem('dttl-vao-' + MAY.id, JSON.stringify({ma: MAY.ma, doi: MAY.doi, ten: MAY.ten, luc: now()})); } catch (e) { /* bỏ qua */ } }
async function vaoPhong() {
  const ma = ($('#oMa').value || '').trim(), ten = ($('#oTen').value || '').trim();
  if (!/^\d{4}$/.test(ma)) { alert('Nhập mã phòng 4 chữ số.'); return; }
  MAY.id = idMay(); MAY.ma = ma; MAY.ten = ten;
  const cu = docVao(); MAY.doi = cu.ma === ma && now() - (cu.luc || 0) < 3 * 3600e3 ? cu.doi : null;
  luuVao();
  MAN = 'may'; goc.innerHTML = `<div class="dau"><div class="tb">Đang nối vào phòng ${esc(ma)}…</div></div>`;
  const kieu = QS.get('noi') === 'bc' ? 'bc' : 'mqtt';
  for (const mc of kieu === 'bc' ? [0] : [+(QS.get('mc') || 0), 1 - +(QS.get('mc') || 0)]) {
    if (!(await Mang.mo(kieu, ma, 'may', nhanTrangThai, mc))) continue;
    MAY.mc = mc;
    if (MAY.doi != null) Mang.gui('a', {t: 'vao', id: MAY.id, doi: MAY.doi, ten: MAY.ten});
    const t0 = now(); while (!MAY.st && now() - t0 < 6000) await new Promise(r => setTimeout(r, 200));
    if (MAY.st) break;
  }
  if (!MAY.st) { goc.innerHTML = `<div class="dau"><div class="tb xau">Chưa thấy phòng ${esc(ma)}. Kiểm tra mã phòng và mạng, rồi thử lại.</div><button data-act="veDau">← Trang đầu</button></div>`; return; }
  if (!HOST.nhipMay) HOST.nhipMay = setInterval(nhipMay, 400);
}
function nhanTrangThai(st) {
  if (!st || st.ma !== MAY.ma) { if (st === null && MAY.st) { MAY.st = null; goc.innerHTML = '<div class="dau"><div class="tb vang">Phòng đã đóng.</div><button data-act="veDau">← Trang đầu</button></div>'; } return; }
  MAY.st = st; MAY.nhan = now();
  if (MAY.cho && khoaXacNhan(st) !== MAY.cho.khoa) MAY.cho = null;

}
function nhipMay() {
  if (!MAY.ma || MAN !== 'may') return;
  if (++MAY.dem % 20 === 0 && MAY.doi != null) Mang.gui('a', {t: 'o', id: MAY.id, doi: MAY.doi, ten: MAY.ten});
  if (MAY.cho && now() - MAY.cho.luc > 1500) { if (MAY.cho.lan++ > 8) MAY.cho = null; else { MAY.cho.luc = now(); Mang.gui('a', MAY.cho.msg); } }
  capNhatDongHo();
}
function khoaXacNhan(st) {
  const t = st && st.doi[MAY.doi]; if (!t) return '';
  return JSON.stringify([t.cau && t.cau.khoa, t.cau && t.cau.daTraLoi, t.cho && t.cho.seq, st.thachDau && st.thachDau.da, st.thietBi[MAY.id] && st.thietBi[MAY.id].doi]);
}
function veMay() {
  const st = MAY.st; if (!st) return;
  if (MAY.doi == null || !st.thietBi[MAY.id]) return veChonDoi(st);
  let khung = goc.querySelector('[data-khung]');
  if (!khung) { goc.innerHTML = '<div data-khung="1"></div>'; khung = goc.querySelector('[data-khung]'); }

function veChonDoi(st) {
  const loi = st.tuChoi && st.tuChoi[MAY.id];
  goc.innerHTML = `<div class="dau"><h2>Phòng ${esc(st.ma)} — chọn đội</h2>
    ${loi ? `<div class="tb xau">${esc(loi)}</div>` : ''}
    ${st.pha !== 'sanh' ? '<div class="tb vang">Trận đang diễn ra: chỉ vào lại được đội của mình (nếu còn chỗ).</div>' : ''}
    <div class="cot">${st.doi.filter(t => st.pha === 'sanh' || !t.vang).map(t => `<button data-act="chonDoi" data-i="${t.i}" style="text-align:left;display:flex;gap:10px;align-items:center" ${t.may.length >= 5 ? 'disabled' : ''}><span class="bieu em" style="border-color:${t.mau}">${t.bt}</span><b>${esc(t.ten)}</b> <span class="mo">· ${esc(t.ben)} · ${t.may.length}/5 máy</span></button>`).join('')}</div>
    <p><button data-act="veDau">← Trang đầu</button></p></div>`;
}

/* Màn của một máy (điện thoại, hoặc bảng điều khiển trên máy chiếu khi chơi một màn hình). */
function veThietBi(khung, st, toi, coBanDo) {
  const t = st.doi[toi.doi];
  if (!khung._pn || khung._coBd !== coBanDo) {
    khung.innerHTML = coBanDo
      ? `<div class="dt"><div class="dt-dau"></div><div class="dt-than"><div class="dt-bd"></div><div class="dt-pn"><div class="pn-xx"></div><div class="pn-nd"></div></div></div></div>`
      : `<div class="dt-pn" style="padding:0"><div class="pn-xx"></div><div class="pn-nd"></div></div>`;
    khung._coBd = coBanDo; khung._pn = khung.querySelector('.pn-nd'); khung._xx = khung.querySelector('.pn-xx');
    khung._dau = khung.querySelector('.dt-dau'); khung._bd = coBanDo ? taoBanDo(khung.querySelector('.dt-bd'), false) : null;
  }
  if (!t) { khung._pn.innerHTML = '<div class="tb">Chưa vào đội.</div>'; return; }
  const T = now(), hetMs = ms => ms > 0 ? `<span data-het="${T + ms}"></span>` : '';
  const c = t.cau, dh = st.thachDau && st.thachDau.doi.includes(t.i) && !st.thachDau.ketQua ? st.thachDau.conLai
    : (t.buoc === 'hoi' || t.buoc === 'loat') && c && !c.daTraLoi ? c.conLai : t.cho ? t.cho.conLai : 0;
  if (coBanDo) {
    const tb = st.thietBi[toi.id] || {}, thu = t.may.indexOf(toi.id) + 1;
    khung._dau.style.background = t.mau;
    khung._dau.innerHTML = `<span class="bieu em" style="border-color:#fff;width:30px;height:30px;font-size:17px">${t.bt}</span><span class="t">${esc(t.ten)}</span>`
      + `<span style="font-size:13px">máy ${thu}/${t.may.length}${tb.ten ? ' · ' + esc(tb.ten) : ''}${t.kc != null ? ` · ${GD_TEN[t.gd]} · còn ${t.kc} bước` : ''}</span>`
      + `<span class="dh">${hetMs(dh)}</span>`
      + [['gan', '🔍 Gần tôi'], ['gd', '🗺️ Chặng'], ['toan', '🌐 Toàn cảnh']].map(([k, n]) => `<button class="${MAY.xem === k ? 'bat' : ''}" data-act="xem" data-v="${k}">${n}</button>`).join('')
      + `<button data-act="toanMH">⛶</button>`;
    const cho = t.cho && (t.cho.loai === 'o' || t.cho.loai === 'mu') ? t.cho : null;
    const B = khung._bd;
    let view = MAY.xem === 'toan' ? 'toan' : t.gd === 'pb' ? 'ben' : t.gd, vb = null;
    if (cho && MAY.xem !== 'toan' && cho.lua.length < 80) { vb = vbQuanh(cho.lua.concat([t.pos]), B, 260); view = 'toan'; }
    else if (MAY.xem === 'gan' && t.pos) { vb = vbQuanh([t.pos], B, 460); view = 'toan'; }
    veBanDo(B, st, {view, vb, sang: cho ? cho.lua : null, mauSang: cho && cho.loai === 'mu' ? '#6c3fb5' : t.mau, mu: t.muDat});
  }
  const hienXx = t.xx && !t.xong && (t.buoc === 'tung' || t.buoc === 'chon' || t.buoc === 'di' || (t.buoc === 'xong' && t.xx.moi));
  if (hienXx) { if (!khung._xx.firstChild) khung._xx.innerHTML = '<span class="xx" style="--c:96px"></span>'; capNhatXx(khung._xx.firstChild, t.xx); }
  else khung._xx.innerHTML = '';
  khung._pn.innerHTML = noiDungMay(st, t, toi, coBanDo, hetMs(dh));
  capNhatDongHo();
}
function noiDungMay(st, t, toi, coBanDo, dhHtml) {
  const tenMay = id => { const x = st.thietBi[id]; const k = t.may.indexOf(id) + 1; return (x && x.ten) ? `${x.ten} (máy ${k})` : `máy ${k}`; };
  let h = coBanDo ? '' : `<div class="hang" style="margin:6px 0"><span class="bieu em" style="border-color:${t.mau}">${t.bt}</span><b>${esc(t.ten)}</b><span class="mo">${t.kc != null ? `· ${GD_TEN[t.gd]} · còn ${t.kc} bước` : ''}</span><b style="margin-left:auto">${dhHtml}</b></div>`;
  if (st.pha === 'sanh') {
    return h + `<div class="tb">Đã vào đội <b>${t.bt} ${esc(t.ten)}</b>. Chờ giảng viên bắt đầu trận.</div>
      <p><b>Các máy của đội (${t.may.length}/5):</b> ${t.may.map(id => esc(tenMay(id))).join(' · ')}</p>
      <p class="mo">Các máy lần lượt trả lời; trả lời đúng là xúc xắc tự lăn và tàu đi ngay.</p>
      <button data-act="roi">← Rời phòng</button>`;
  }
  if (st.pha === 'ket') {
    const kq = st.ketQua || [], toiKq = kq.find(x => x.i === t.i);
    return h + `<div class="tb tot" style="font-size:19px">Trận kết thúc${toiKq ? ` — đội ${esc(t.ten)} xếp thứ <b>${toiKq.thu}</b>` : ''}</div>`
      + kq.map(x => `<div>${x.thu}. ${x.bt} ${esc(x.ten)} — ${x.xong ? 'về Ba Đình' : 'còn ' + x.kc + ' bước'}</div>`).join('');
  }
  if (t.vang) return h + '<div class="tb vang">Đội không tham gia trận này.</div>';
  if (t.xong) return h + `<div class="tb tot" style="font-size:19px">🏁 Đã về Ba Đình — thứ ${t.hang}. Chờ các đội khác.</div>`;
  const nhan = nhanDoi(t); if (nhan) h += `<div style="margin-bottom:4px">${nhan}</div>`;
  const td = st.thachDau;
  if (td && td.doi.includes(t.i)) return h + veThachDauMay(st, t, toi, td, tenMay);
  const tbMoi = (st.tb || []).filter(x => x.chu.startsWith(`${t.bt} ${t.ten}:`)).slice(-2);
  const lsHtml = t.ls.map((x, k) => `<div class="tb ${k === t.ls.length - 1 ? '' : 'mo'}" style="${k === t.ls.length - 1 ? 'font-weight:700' : 'padding:4px 12px'}">${esc(x)}</div>`).join('');
  const thongBaoHtml = tbMoi.map(x => `<div class="tb vang"><span class="em">${x.icon}</span> ${esc(x.chu.slice(x.chu.indexOf(':') + 2))}</div>`).join('');

  if (t.buoc === 'nghi') return h + '<div class="tb vang" style="font-size:18px">⛓️ Tàu đang mắc cạn — nghỉ lượt này.</div>' + thongBaoHtml;
  if ((t.buoc === 'hoi' || t.buoc === 'loat') && t.cau) {
    const c = t.cau, laToi = st.local || c.may === toi.id || c.mayRoi;
    const tieuDe = c.loai === 'chinh' ? `Câu hỏi lượt ${st.luot}` : c.loai === 'phat' ? `⚖️ Câu phạt — cần đúng thêm ${t.phat} câu` : `🔤 Thử thách tiếng Anh — cần đúng thêm ${t.en} câu`;
    h += `<h3 style="margin:4px 0">${tieuDe}</h3>`;
    if (t.loat) h += `<div class="mo" style="font-size:13px">Câu ${t.loat.daLam}/${t.loat.max} của lượt này</div>`;
    if (t.choGio && c.loai === 'chinh') h += `<div class="tb vang">🌬️ Chờ gió: trả lời đúng rồi phải tung ra ${t.choGio.so.join(', ')} mới đi tiếp.</div>`;
    if (!c.daTraLoi) h += laToi ? '<div class="tb tot"><b>Đến lượt máy này trả lời.</b> Đúng là xúc xắc lăn ngay.</div>' : `<div class="tb">${esc(tenMay(c.may))} đang trả lời — cả đội cùng bàn.</div>`;
    return h + veCauHoi(c.x, c.khoa, 'tl', laToi && !c.daTraLoi, c);
  }
  if (t.buoc === 'chon' && t.cho) {
    const cho = t.cho, laToi = st.local || cho.may === toi.id || cho.mayRoi;
    if (!laToi) return h + lsHtml + `<div class="tb">${esc(tenMay(cho.may))} đang chọn…</div>`;
    if (cho.loai === 'buoc') return h + lsHtml + `<div class="hang">${[1, 2, 3].map(n => `<button class="to" style="width:auto;flex:1" data-act="chon" data-seq="${cho.seq}" data-gt="${n}">${n}</button>`).join('')}</div>`;
    if (cho.loai === 'o') return h + lsHtml + `<div class="tb tot"><b>Chạm vào ô đang sáng trên bản đồ</b> để chọn nơi đến (${cho.lua.length} lựa chọn). Hết giờ thì máy chọn ô gần Ba Đình nhất.</div>`;
    return h + lsHtml + `<div class="tb" style="background:#efe7fb"><b>Chạm vào ô sáng tím</b> để giấu cạm bẫy. Bẫy nằm đó đến khi có tàu dừng đúng ô — kể cả tàu đội mình.${coBanDo ? '' : ''}</div>`;
  }
  return h + lsHtml + thongBaoHtml + (t.buoc === 'tung' ? '<div class="tb" style="text-align:center">🎲 Xúc xắc đang lăn…</div>' : t.buoc === 'di' ? '<div class="tb">⛵ Tàu đang đi…</div>' : t.buoc === 'xong' || st.pha === 'nghi' ? '<div class="tb mo">Chờ lượt mới…</div>' : '');
}
function veCauHoi(x, khoa, act, choBam, c) {
  if (!x) return '';
  const nhieu = x.l === 'NH', pa = x.l === 'DS' ? [['D', x.en ? 'True' : 'Đúng'], ['S', x.en ? 'False' : 'Sai']] : x.o;
  const chon = MAY.chon[khoa] || '', daTL = c && c.daTraLoi, a = c && c.a, tl = c && c.traLoi;
  let h = `<div class="cau">${esc(x.q)}</div>`;
  if (nhieu && choBam) h += '<div class="mo" style="font-size:13px;margin-bottom:6px">Chọn tất cả phương án đúng rồi bấm <b>Chốt</b>.</div>';
  h += '<div class="pa">' + pa.map(([m, noi]) => {
    let cls = '';
    if (daTL && a) cls = a.includes(m) ? 'dung' : (tl && tl.includes(m) ? 'sai' : '');
    else if (chon.includes(m)) cls = 'chon';
    return `<button class="${cls}" ${choBam ? '' : 'disabled'} data-act="${nhieu ? act + 'Chon' : act}" data-khoa="${esc(khoa)}" data-chon="${m}"><b>${x.l === 'DS' ? '' : m + '.'}</b> ${esc(noi)}</button>`;
  }).join('') + '</div>';
  if (nhieu && choBam) h += `<p><button class="chinh to" data-act="${act}Chot" data-khoa="${esc(khoa)}" ${chon ? '' : 'disabled'}>Chốt đáp án</button></p>`;
  if (daTL && c.dung != null) {
    h += `<div class="tb ${c.dung ? 'tot' : 'xau'}" style="font-size:18px">${c.dung ? '✔ Đúng!' : (tl === '-' ? '⏱ Hết giờ' : '✘ Chưa đúng')}</div>`;
    if (!c.dung) h += `<div class="gt">Đáp án: <b>${esc(c.dapAn)}</b></div>`;
    if (c.g) h += `<details class="gt"><summary>Giải thích</summary>${esc(c.g)}</details>`;
  }
  return h;
}
function veThachDauMay(st, t, toi, td, tenMay) {
  const doiKia = st.doi[td.doi.find(i => i !== t.i)];
  let h = `<div class="tb xau" style="font-size:18px">⚔️ Thách đấu với ${doiKia.bt} ${esc(doiKia.ten)} — đúng nhanh hơn thì thắng, đội thua lùi 2 ô.</div>`;
  if (!td.x) return h + '<div class="tb">Chuẩn bị…</div>';
  const laToi = st.local || td.may[t.i] === toi.id || !st.thietBi[td.may[t.i]] || !st.thietBi[td.may[t.i]].song, da = td.da.includes(t.i);
  if (!laToi) h += `<div class="tb">${esc(tenMay(td.may[t.i]))} đang trả lời.</div>`;
  const c = td.ketQua ? {daTraLoi: true, a: td.a, traLoi: td.tl && td.tl[t.i], dung: td.dung && td.dung[t.i], dapAn: td.dapAn} : null;
  h += veCauHoi(td.x, td.khoa, 'td', laToi && !da && !td.ketQua, c);
  if (da && !td.ketQua) h += '<div class="tb">Đã gửi — chờ đội bạn…</div>';
  if (td.ketQua) h += `<div class="tb ${td.thang === t.i ? 'tot' : td.thang == null ? '' : 'xau'}" style="font-size:19px">${td.thang === t.i ? 'Thắng thách đấu!' : td.thang == null ? 'Hòa — không ai lùi' : 'Thua — lùi 2 ô'}</div>`;
  return h;
}
function hanhDongMay(act, d, khung) {
  const toi = {id: khung.dataset.id, doi: +khung.dataset.doi};
  const st = S && S.local ? congKhai() : MAY.st; if (!st) return;
  const t = st.doi[toi.doi];
  const lamMoi = () => (S && S.local ? veLaiMC() : veMay());
  const gui = m => {
    m.id = toi.id; m.doi = toi.doi;
    if (S && S.local) { xuLyHanhDong(m); veLaiMC(); return; }
    Mang.gui('a', m); MAY.cho = {msg: m, khoa: khoaXacNhan(MAY.st), luc: now(), lan: 0};
  };
  if (act === 'tl' || act === 'td') return gui({t: act, khoa: d.khoa, chon: d.chon});
  if (act === 'tlChon' || act === 'tdChon') {
    const cu = MAY.chon[d.khoa] || '';
    MAY.chon[d.khoa] = (cu.includes(d.chon) ? cu.replace(d.chon, '') : cu + d.chon).split('').sort().join('');
    return lamMoi();
  }
  if (act === 'tlChot' || act === 'tdChot') { const c = MAY.chon[d.khoa]; if (c) gui({t: act === 'tlChot' ? 'tl' : 'td', khoa: d.khoa, chon: c}); return; }
  if (act === 'chon') return gui({t: 'chon', seq: +d.seq, gt: d.gt});
  if (act === 'o') { if (t && t.cho) gui({t: 'chon', seq: t.cho.seq, gt: d.o}); return; }
  if (act === 'xem') { MAY.xem = d.v; return lamMoi(); }
  if (act === 'toanMH') return toanManHinh();
  if (act === 'roi') { Mang.gui('a', {t: 'roi', id: toi.id, doi: toi.doi}); MAY.doi = null; luuVao(); return veMay(); }
}
document.addEventListener('click', e => {           // chọn đội (ngoài khung máy)
  const b = e.target.closest('[data-act="chonDoi"]'); if (!b) return;
  MAY.doi = +b.dataset.i; luuVao();
  const m = {t: 'vao', id: MAY.id, doi: MAY.doi, ten: MAY.ten};
  Mang.gui('a', m);
  goc.innerHTML = '<div class="dau"><div class="tb">Đang vào đội…</div></div>';
  MAY.cho = {msg: m, khoa: khoaXacNhan(MAY.st), luc: now(), lan: 0};
}, true);
window.addEventListener('resize', () => { if (MAN === 'may') veMay(); });

/* ===================== KHỞI ĐỘNG ===================== */
veTrangDau();
if (TU_CHOI && QS.has('mot')) { veCaiDat('mot'); if (QS.get('doi')) $('#cdSoDoi').value = QS.get('doi'); moPhong('mot'); }
