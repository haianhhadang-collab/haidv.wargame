<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đường tới tương lai</title>
<style>
:root{
  --nen:#f3efe4; --the:#fff; --chu:#1d2330; --mo:#5d6474; --vien:#d8d1c1;
  --xanh:#1f5fa8; --xanh2:#e5eef9; --do:#b3261e; --do2:#fbe9e7; --luc:#2e7d4f; --luc2:#e6f3ea; --vang:#9a5a00; --vang2:#fff3dc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji";background:var(--nen);color:var(--chu);font-size:16px}
.em{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--vien);background:var(--the);color:var(--chu);border-radius:10px;padding:10px 16px}
button:hover:not(:disabled){border-color:var(--xanh)}
button.chinh{background:var(--xanh);border-color:var(--xanh);color:#fff}
button.nho{padding:5px 10px;font-size:14px}
button.bat{background:var(--chu);color:#fff;border-color:var(--chu)}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--vien);border-radius:8px;background:#fff;color:var(--chu)}
h1,h2,h3{margin:.2em 0 .5em}
.mo{color:var(--mo)}
.the{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:16px}
.dau{max-width:920px;margin:0 auto;padding:28px 18px}
.dau h1{font-size:40px;color:var(--xanh);margin-bottom:4px}
.luoi2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.luoi2{grid-template-columns:1fr}.dau h1{font-size:30px}}
.cot{display:flex;flex-direction:column;gap:10px}
.hang{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.o{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--vien)}
table.bg{border-collapse:collapse;width:100%}
table.bg td,table.bg th{border-bottom:1px solid #e7e2d6;padding:7px 8px;text-align:left;vertical-align:top}
.canh{background:var(--vang2);border:1px solid #f0d49c;border-radius:10px;padding:10px 12px}
.bieu{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid;font-size:19px;flex:none}
/* xúc xắc */
.xx{--c:64px;width:var(--c);height:var(--c);display:inline-block;vertical-align:middle;flex:none}
.xx>div{width:100%;height:100%;border-radius:18%;box-shadow:inset 0 -4px 0 #0002,0 3px 8px #0003}
.xx-so{background:#fff;border:2px solid #333;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%}
.xx-so i{display:block;margin:auto;width:72%;height:72%;border-radius:50%}
.xx-so i.c{background:#1d2330}
.xx-hu{color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #0003}
.xx-hu span{font-size:calc(var(--c)*.46);line-height:1}
.xx-hu small{font-size:calc(var(--c)*.15);font-weight:800;margin-top:2px;white-space:nowrap}
.xx.lan{animation:lac .16s infinite}
.xx.dung{animation:bat .5s}
@keyframes lac{0%,100%{transform:rotate(-12deg) scale(1.05)}50%{transform:rotate(12deg) scale(.95)}}
@keyframes bat{0%{transform:scale(1.5)}100%{transform:scale(1)}}
/* bản đồ */
svg.bd{display:block;width:100%;height:100%;background:#bcdcf2;user-select:none}
svg.bd[data-view="bien"] .gd-ben, svg.bd[data-view="bien"] .gd-di, svg.bd[data-view="bien"] .gd-pb,
svg.bd[data-view="ben"] .gd-bien, svg.bd[data-view="ben"] .gd-di,
svg.bd[data-view="di"] .gd-bien, svg.bd[data-view="di"] .gd-ben{display:none}
svg.bd:not([data-view="toan"]) .chi-toan{display:none}
.tau{transition:transform .25s ease}
.tau-in{transform-box:fill-box;transform-origin:center}
.tau-in.hu-rung{animation:rung .1s 10}
.tau-in.hu-xoay{animation:xoayv .9s 2}
.tau-in.hu-nhay{animation:nhay .35s 4}
.tau-in.hu-sang{animation:sangv .6s 3}
@keyframes rung{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,0)}75%{transform:translate(5px,0)}}
@keyframes xoayv{to{transform:rotate(360deg)}}
@keyframes nhay{50%{transform:translateY(-12px)}}
@keyframes sangv{50%{transform:scale(1.35)}}
.bung{animation:bung 1.9s forwards;transform-box:fill-box;transform-origin:center}
@keyframes bung{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(1.8) translateY(-14px)}}
@keyframes nhip{0%,100%{stroke-width:3}50%{stroke-width:7}}
.sang{animation:nhip 1s infinite}
/* máy chiếu */
.mc{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);height:100vh}
.mc-dau{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--the);border-bottom:1px solid var(--vien);flex-wrap:wrap}
.mc-dau .ten{font-weight:800;color:var(--xanh);font-size:19px}
.mc-dau .pha{font-size:17px}
.mc-dau .gian{flex:1}
.mc-bd{position:relative;overflow:hidden;min-height:0}
.mc-bd>svg{position:absolute;inset:0}
.mc-ben{border-left:1px solid var(--vien);background:var(--the);overflow:auto;min-height:0}
.doi-hang{display:grid;grid-template-columns:36px 1fr auto auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #eee}
.doi-hang .t1{font-weight:700}
.doi-hang .t2{font-size:13px;color:var(--mo)}
.doi-hang .kc{font-weight:800;font-size:19px;text-align:right;line-height:1;min-width:40px}
.doi-hang .kc small{display:block;font-size:11px;font-weight:400;color:var(--mo)}
.nhan{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:#f0ede6;margin:3px 3px 0 0}
.nhan.xau{background:var(--do2);color:var(--do)} .nhan.tot{background:var(--luc2);color:var(--luc)} .nhan.vang{background:var(--vang2);color:var(--vang)}
.nhatky{padding:8px 12px;font-size:13px;line-height:1.45;color:var(--mo)}
.nhatky .l{font-weight:700;color:var(--xanh)}
.tbao{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;max-width:min(46%,520px);pointer-events:none}
.tbao div{background:rgba(255,255,255,.93);border-left:5px solid;border-radius:8px;padding:4px 10px;font-size:15px;line-height:1.3;box-shadow:0 3px 10px #0002;animation:vao .3s}
@keyframes vao{from{opacity:0;transform:translateX(-20px)}}
.bang{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(255,255,255,.97);border:4px solid var(--xanh);border-radius:18px;padding:16px 28px;max-width:78%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);pointer-events:none}
.bang .b1{font-size:36px;font-weight:800}
.bang .b2{font-size:21px;margin-top:6px;line-height:1.35}
.bang.xau{border-color:var(--do)} .bang.xau .b1{color:var(--do)}
.bang.tot{border-color:var(--luc)} .bang.tot .b1{color:var(--luc)}
.bang.moc{border-color:#8a6d2b} .bang.moc .b1{color:#8a6d2b;font-size:28px} .bang.moc .b2{font-style:italic}
.ma-lon{font-size:64px;font-weight:800;letter-spacing:6px;color:var(--xanh)}
.nut-xem button{padding:5px 10px;font-size:14px}
/* điện thoại */
.dt{display:flex;flex-direction:column;height:100vh;height:100dvh}
.dt-dau{display:flex;align-items:center;gap:8px;padding:6px 10px;color:#fff;flex-wrap:wrap}
.dt-dau .t{font-weight:800}
.dt-dau .dh{font-weight:800;font-size:20px;margin-left:auto}
.dt-dau button{background:#fff3;border-color:#fff6;color:#fff;padding:4px 8px;font-size:13px}
.dt-dau button.bat{background:#fff;color:var(--chu)}
.dt-than{flex:1;display:flex;flex-direction:column;min-height:0}
.dt-bd{height:40vh;flex:none;position:relative}
.dt-pn{flex:1;overflow:auto;padding:10px 12px 30px}
@media(orientation:landscape){.dt-than{flex-direction:row}.dt-bd{height:auto;flex:1.25}.dt-pn{flex:1}}
.pn-xx{display:flex;justify-content:center;padding:4px 0}
.pn-xx:empty{display:none}
.cau{font-size:17px;line-height:1.45;margin:6px 0 10px}
.pa{display:flex;flex-direction:column;gap:7px}
.pa button{text-align:left;padding:10px 12px;line-height:1.35}
.pa button b{display:inline-block;min-width:24px}
.pa button.chon{border-color:var(--xanh);background:var(--xanh2);box-shadow:0 0 0 1px var(--xanh) inset}
.pa button.dung{border-color:var(--luc);background:var(--luc2)}
.pa button.sai{border-color:var(--do);background:var(--do2)}
.to{font-size:22px;padding:14px 20px;width:100%;font-weight:800}
.tb{padding:9px 12px;border-radius:10px;background:var(--xanh2);margin:7px 0;line-height:1.4}
.tb.xau{background:var(--do2)} .tb.tot{background:var(--luc2)} .tb.vang{background:var(--vang2)}
.gt{font-size:14px;color:var(--mo);margin-top:6px}
/* bảng điều khiển một màn hình */
.dk-tab{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-top:3px solid var(--vien);align-items:center}
.dk-tab button{padding:3px 7px;font-size:15px;border:3px solid transparent;background:#fff}
.dk-tab button.chon{border-color:#1d2330}
.dk-tab button.can{box-shadow:0 0 0 3px #e53935 inset}
.dk-than{padding:0 10px 12px}
</style>
</head>
<body>
<div id="goc"></div>
<script>
'use strict';
/* =====================================================================
   ĐƯỜNG TỚI TƯƠNG LAI — game cờ đi theo lượt, 2–8 đội, ô tổ ong, 3 chặng.
   Đặc tả: README.md cùng thư mục. Dữ liệu câu hỏi do
   cong-cu/tao-game-tuong-lai.py chèn vào chỗ DL bên dưới.
   ===================================================================== */
const DL = {"taoLuc":"2026-09-18","vn":[{"id":"vn01-1","cd":"01","l":"D1","q":"Khái niệm Tư tưởng Hồ Chí Minh được Đại hội XI của Đảng đưa ra nhấn mạnh điều gì là giá trị cơ bản nhất của tư tưởng này?","o":[["A","Là sự kế thừa các giá trị truyền thống tốt đẹp của dân tộc."],["B","Là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta."],["C","Là kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của Việt Nam."],["D","Là hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam."],["E","Là kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam."]],"a":"C","g":"Theo định nghĩa của Đại hội XI, Tư tưởng Hồ Chí Minh \"là một hệ thống quan điểm toàn diện và sâu sắc... kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta\". Mặc dù các phương án khác đều đúng về tư tưởng Hồ Chí Minh, nhưng yếu tố \"vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin\" thể hiện bản chất khoa học, cách mạng, sự độc đáo và đóng góp nền tảng của Người cho cách mạng Việt Nam, là cốt lõi nhất khi xét về tài liệu gốc và phương pháp luận."},{"id":"vn01-2","cd":"01","l":"D1","q":"Yếu tố nào sau đây thể hiện rõ nhất tính \"toàn diện và sâu sắc\" của Tư tưởng Hồ Chí Minh trong việc định hướng cách mạng Việt Nam?","o":[["A","Mục tiêu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh."],["B","Con đường phát triển độc lập dân tộc gắn liền với chủ nghĩa xã hội."],["C","Khẳng định vai trò lãnh đạo của Đảng Cộng sản Việt Nam và sự quản lý của Nhà nước cách mạng."],["D","Xác định lực lượng cách mạng là toàn thể nhân dân Việt Nam yêu nước."],["E","Bao gồm tất cả các yếu tố trên, cùng với việc xây dựng con người, kết hợp sức mạnh dân tộc và thời đại, và phương pháp cách mạng phù hợp."]],"a":"E","g":"Tài liệu mô tả tính \"toàn diện và sâu sắc\" của Tư tưởng Hồ Chí Minh bằng cách liệt kê nhiều khía cạnh khác nhau: mục tiêu quốc gia, con đường phát triển, vai trò của Đảng và Nhà nước, lực lượng cách mạng, xây dựng con người, kết hợp sức mạnh dân tộc và thời đại, cùng phương pháp cách mạng phù hợp. Do đó, phương án E tổng hợp đầy đủ và chính xác nhất, thể hiện tính toàn diện hơn các phương án chỉ nêu một phần."},{"id":"vn01-3","cd":"01","l":"D1","q":"Mục đích cuối cùng mà Hồ Chí Minh và nhân dân Việt Nam hướng tới khi xây dựng đất nước là gì, theo tài liệu?","o":[["A","Xây dựng một nước Việt Nam độc lập, dân chủ và giàu mạnh."],["B","Góp phần xứng đáng vào sự nghiệp cách mạng thế giới."],["C","Xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh."],["D","Xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh, đồng thời góp phần xứng đáng vào sự nghiệp cách mạng thế giới."],["E","Thực hiện thành công chủ nghĩa xã hội."]],"a":"D","g":"Tài liệu dẫn lời Hồ Chí Minh nêu rõ mong muốn cuối cùng: “Toàn Đảng toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh, và góp phần xứng đáng vào sự nghiệp cách mạng thế giới”. Phương án D bao quát đầy đủ cả hai khía cạnh này, làm cho nó trở thành câu trả lời đúng nhất."},{"id":"vn01-4","cd":"01","l":"D1","q":"Sự kiện nào đánh dấu bước ngoặt quan trọng nhất trong nhận thức của Đảng Cộng sản Việt Nam về vai trò nền tảng tư tưởng của Tư tưởng Hồ Chí Minh, đặt ngang hàng với chủ nghĩa Mác - Lênin?","o":[["A","Đại hội II của Đảng (tháng 2/1951) khẳng định \"Đường lối chính trị... của Đảng ta hiện nay là đường lối... Hồ Chủ tịch\"."],["B","Đại hội IV của Đảng (tháng 12/1976) đánh giá Hồ Chí Minh là \"người sáng lập và rèn luyện Đảng ta\"."],["C","Đại hội VI của Đảng (tháng 12/1986) nhấn mạnh \"kế thừa di sản quý báu về tư tưởng và lý luận cách mạng của Chủ tịch Hồ Chí Minh\"."],["D","Đại hội VII của Đảng (năm 1991) khẳng định \"Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động\"."],["E","Đại hội IX của Đảng (tháng 4/2001) đưa ra khái niệm đầy đủ về Tư tưởng Hồ Chí Minh."]],"a":"D","g":"Theo tài liệu môn học: \"Chính vì thế, một trong những điểm mới của Đại hội VII là Đảng đã đánh giá đúng tầm vóc tư tưởng Hồ Chí Minh. Đại hội VII của Đảng khẳng định: “Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động”\". Các đại hội trước đó đã đề cập đến vai trò của Hồ Chí Minh hoặc sự cần thiết học tập tư tưởng của Người, nhưng Đại hội VII là lần đầu tiên chính thức đặt Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng và kim chỉ nam cùng với chủ nghĩa Mác - Lênin."},{"id":"vn01-5","cd":"01","l":"D1","q":"Ý nghĩa toàn diện nhất của việc học tập môn học Tư tưởng Hồ Chí Minh đối với sinh viên, theo tài liệu, là gì?","o":[["A","Nâng cao năng lực tư duy lý luận để giải quyết các vấn đề trong cuộc sống."],["B","Giáo dục và định hướng thực hành đạo đức cách mạng, củng cố niềm tin khoa học và bồi dưỡng lòng yêu nước."],["C","Xây dựng, rèn luyện phương pháp và phong cách công tác, học tập phù hợp với bản thân."],["D","Góp phần trang bị tri thức, hình thành năng lực, niềm tin, tình cảm cách mạng và kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội."],["E","Toàn diện bao gồm nâng cao năng lực tư duy lý luận, giáo dục đạo đức cách mạng, củng cố niềm tin, bồi dưỡng lòng yêu nước, và xây dựng phương pháp, phong cách công tác để trở thành công dân có ích."]],"a":"E","g":"Các mục 1, 2, 3 trong phần II \"Ý NGHĨA CỦA VIỆC HỌC TẬP MÔN HỌC TƯ TƯỞNG HỒ CHÍ MINH\" đều nêu rõ các ý nghĩa khác nhau: nâng cao năng lực tư duy lý luận, giáo dục đạo đức, củng cố niềm tin, bồi dưỡng lòng yêu nước, và xây dựng phương pháp/phong cách công tác. Phương án E tổng hợp và bao quát tất cả các ý nghĩa này, làm cho nó trở thành câu trả lời toàn diện nhất."},{"id":"vn01-6","cd":"01","l":"D1","q":"Tư tưởng Hồ Chí Minh được xác định là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc Việt Nam, mãi mãi soi đường cho sự nghiệp cách mạng. Nhận định này được nêu lên lần đầu tiên trong khái niệm Tư tưởng Hồ Chí Minh tại Đại hội nào của Đảng?","o":[["A","Đại hội VII (1991)"],["B","Đại hội IX (2001)"],["C","Đại hội X (2006)"],["D","Đại hội XI (2011)"],["E","Đại hội XIII (2021)"]],"a":"D","g":"Theo tài liệu môn học: \"Đại hội đại biểu toàn quốc lần thứ XI của Đảng Cộng sản Việt Nam (năm 2011) nêu khái niệm “Tư tưởng Hồ Chí Minh\" như sau: “Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc... là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta, mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi”\"."},{"id":"vn01-7","cd":"01","l":"D1","q":"Một trong những cơ sở hình thành Tư tưởng Hồ Chí Minh, mà tài liệu nhấn mạnh là \"giá trị cơ bản nhất trong quá trình hình thành và phát triển\", là gì?","o":[["A","Tiếp thu tinh hoa văn hóa nhân loại."],["B","Kế thừa các giá trị truyền thống tốt đẹp của dân tộc."],["C","Chủ nghĩa Mác - Lênin."],["D","Thực tiễn cách mạng Việt Nam."],["E","Kinh nghiệm từ các phong trào giải phóng dân tộc trên thế giới."]],"a":"C","g":"Theo tài liệu môn học: \"Hai là, đã nêu lên cơ sở hình thành tư tưởng Hồ Chí Minh là chủ nghĩa Mác - Lênin - giá trị cơ bản nhất trong quá trình hình thành và phát triển của tư tưởng Hồ Chí Minh\"."},{"id":"vn01-8","cd":"01","l":"D1","q":"Theo khái niệm của Đại hội XI, mục tiêu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh được đặt ra nhằm góp phần xứng đáng vào sự nghiệp nào?","o":[["A","Phát triển kinh tế khu vực Đông Nam Á."],["B","Liên minh các nước xã hội chủ nghĩa."],["C","Cách mạng thế giới."],["D","Bảo vệ hòa bình thế giới."],["E","Xóa đói giảm nghèo toàn cầu."]],"a":"C","g":"Tài liệu chỉ rõ: \"Tư tưởng Hồ Chí Minh là hệ thống quan điểm toàn diện và sâu sắc về mục tiêu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh, góp phần xứng đáng vào sự nghiệp cách mạng thế giới.\""},{"id":"vn01-9","cd":"01","l":"D1","q":"UNESCO đã ra Nghị quyết kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh vào năm nào?","o":[["A","1987"],["B","1990"],["C","2001"],["D","2011"],["E","2021"]],"a":"A","g":"Theo tài liệu môn học: \"Tổ chức Giáo dục, Khoa học và Văn hóa của Liên hợp quốc (UNESCO), tại khóa họp Đại Hội đồng lần thứ 24 ở Pari, từ ngày 20/10 đến ngày 20/11/1987, đã ra Nghị quyết số 240/18.6.5 về kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh\"."},{"id":"vn01-10","cd":"01","l":"D1","q":"\"Dĩ bất biến, ứng vạn biến\" là phương châm công tác nào của Hồ Chí Minh mà người học có thể vận dụng sau khi nghiên cứu môn học Tư tưởng Hồ Chí Minh?","o":[["A","Phong cách tư duy."],["B","Phong cách diễn đạt."],["C","Phong cách làm việc."],["D","Phong cách ứng xử."],["E","Tất cả các phong cách được nêu trên, và cả phong cách sinh hoạt."]],"a":"E","g":"Tài liệu cho biết người học \"có thể vận dụng xây dựng phong cách tư duy, phong cách diễn đạt, phong cách làm việc, phong cách ứng xử, phong cách sinh hoạt, v.v. phù hợp với hoàn cảnh như phương châm của Hồ Chí Minh: Dĩ bất biến, ứng vạn biến.\" Điều này ngụ ý rằng phương châm này có thể áp dụng cho nhiều khía cạnh của phong cách công tác và sinh hoạt."},{"id":"vn01-11","cd":"01","l":"SAI","q":"Phát biểu nào sau đây không phản ánh đúng ý nghĩa của Tư tưởng Hồ Chí Minh theo tài liệu?","o":[["A","Cùng với chủ nghĩa Mác - Lênin làm nền tảng tư tưởng cho Đảng."],["B","Là kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam."],["C","Là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta."],["D","Là hệ thống quan điểm chỉ đạo trực tiếp cho việc phát triển kinh tế thị trường định hướng xã hội chủ nghĩa trong giai đoạn hiện nay."],["E","Mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi."]],"a":"D","g":"Các phương án A, B, C, E đều được khẳng định rõ ràng trong các tài liệu về ý nghĩa của Tư tưởng Hồ Chí Minh. Phương án D \"là hệ thống quan điểm chỉ đạo trực tiếp cho việc phát triển kinh tế thị trường định hướng xã hội chủ nghĩa trong giai đoạn hiện nay\" không được đề cập trực tiếp hoặc là ý nghĩa được định nghĩa trong các đoạn trích."},{"id":"vn01-12","cd":"01","l":"SAI","q":"Theo tài liệu, khi nghiên cứu môn học Tư tưởng Hồ Chí Minh, sinh viên sẽ không đạt được mục tiêu nào sau đây?","o":[["A","Nâng cao năng lực tư duy lý luận."],["B","Củng cố lập trường, quan điểm cách mạng trên nền tảng chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh."],["C","Vận dụng tư tưởng Hồ Chí Minh vào giải quyết các vấn đề đặt ra trong cuộc sống."],["D","Phát triển trực tiếp các kỹ năng chuyên môn sâu trong lĩnh vực khoa học tự nhiên."],["E","Hình thành năng lực, phương pháp làm việc, niềm tin, tình cảm cách mạng."]],"a":"D","g":"Các phương án A, B, C, E đều là những mục tiêu và ý nghĩa được nêu trong phần \"II- Ý NGHĨA CỦA VIỆC HỌC TẬP MÔN HỌC TƯ TƯỞNG HỒ CHÍ MINH\". Tuy nhiên, mục tiêu \"phát triển trực tiếp các kỹ năng chuyên môn sâu trong lĩnh vực khoa học tự nhiên\" không được đề cập, vì môn học này tập trung vào tư duy lý luận, đạo đức, và phong cách làm việc cách mạng."},{"id":"vn01-13","cd":"01","l":"SAI","q":"Phát biểu nào dưới đây về quá trình nhận thức của Đảng Cộng sản Việt Nam về Tư tưởng Hồ Chí Minh là không chính xác?","o":[["A","Ngay từ khi ra đời, Cương lĩnh chính trị đầu tiên của Đảng đã thể hiện những nội dung cơ bản của tư tưởng Hồ Chí Minh."],["B","Việc nhận thức về tư tưởng Hồ Chí Minh sau khi Đảng ra đời là một quá trình đơn giản và thuận lợi."],["C","Đại hội II của Đảng (1951) đã nêu rõ đường lối chính trị, nếp làm việc và đạo đức cách mạng của Đảng ta hiện nay là của Hồ Chủ tịch."],["D","Đại hội VII của Đảng (1991) là một mốc lớn khi nêu cao tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động."],["E","Đại hội IX (2001) đã nhận thức về tư tưởng Hồ Chí Minh một cách đầy đủ hơn với định nghĩa chi tiết."]],"a":"B","g":"Tài liệu và chỉ ra rằng \"việc nhận thức về tư tưởng Hồ Chí Minh... là một quá trình không đơn giản. Đã có sự hiểu không đúng từ Quốc tế Cộng sản và từ một số người trong Đảng Cộng sản Đông Dương\". Do đó, phát biểu B nói rằng quá trình này là \"đơn giản và thuận lợi\" là không chính xác."},{"id":"vn01-14","cd":"01","l":"SAI","q":"Yếu tố nào sau đây không được liệt kê là một trong những giá trị mà Hồ Chí Minh đã vun trồng hoặc xây dựng theo đánh giá của Đại hội IV của Đảng (1976)?","o":[["A","Sáng lập và rèn luyện Đảng ta."],["B","Khai sinh nền Cộng hòa Dân chủ Việt Nam."],["C","Xây dựng lực lượng vũ trang cách mạng."],["D","Vun trồng khối đại đoàn kết dân tộc."],["E","Dẫn dắt công cuộc đổi mới đất nước từ năm 1986."]],"a":"E","g":"Tài liệu liệt kê các công lao của Hồ Chí Minh theo đánh giá của Đại hội IV: \"người sáng lập và rèn luyện Đảng ta, người khai sinh nền Cộng hòa Dân chủ Việt Nam, người vun trồng khối đại đoàn kết dân tộc và xây dựng lực lượng vũ trang cách mạng\". Công cuộc đổi mới đất nước từ năm 1986 diễn ra sau khi Người qua đời (1969), do đó phương án E là không đúng."},{"id":"vn01-15","cd":"01","l":"SAI","q":"Theo khái niệm Tư tưởng Hồ Chí Minh của Đại hội XI, cơ sở hình thành tư tưởng của Người không bao gồm yếu tố nào sau đây?","o":[["A","Vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin."],["B","Kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc."],["C","Tiếp thu tinh hoa văn hóa nhân loại."],["D","Sự kế thừa trực tiếp từ tư tưởng phong kiến Việt Nam."],["E","Điều kiện cụ thể của nước ta."]],"a":"D","g":"Định nghĩa trong tài liệu chỉ rõ Tư tưởng Hồ Chí Minh là \"kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta, kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hoá nhân loại\". Không có yếu tố \"kế thừa trực tiếp từ tư tưởng phong kiến Việt Nam\" được đề cập như một cơ sở hình thành trong định nghĩa này."},{"id":"vn01-16","cd":"01","l":"NH","q":"Theo khái niệm của Đại hội XI, Tư tưởng Hồ Chí Minh là kết quả của sự tổng hòa những yếu tố nào dưới đây? (Chọn nhiều đáp án đúng)","o":[["A","Vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin."],["B","Kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc."],["C","Tiếp thu tinh hoa văn hóa nhân loại."],["D","Điều kiện cụ thể của nước ta."],["E","Kinh nghiệm từ các cuộc cách mạng tư sản phương Tây."]],"a":"ABCD","g":"Theo tài liệu môn học: \"Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc... kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta, kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hoá nhân loại\". Do đó, A, B, C, D đều là các thành phần cấu thành kết quả này."},{"id":"vn01-17","cd":"01","l":"NH","q":"Theo tài liệu, việc nghiên cứu môn học Tư tưởng Hồ Chí Minh giúp sinh viên hình thành và củng cố những gì? (Chọn nhiều đáp án đúng)","o":[["A","Tri thức khoa học về hệ thống quan điểm cách mạng Việt Nam."],["B","Năng lực, phương pháp làm việc, niềm tin, tình cảm cách mạng."],["C","Lập trường, quan điểm cách mạng trên nền tảng chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh."],["D","Khả năng đấu tranh phê phán những quan điểm sai trái để bảo vệ sự trong sáng của chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh."],["E","Bản lĩnh chính trị, kiên định ý thức và trách nhiệm công dân."]],"a":"ABCDE","g":"Tất cả các phương án đều được đề cập trong phần \"II- Ý NGHĨA CỦA VIỆC HỌC TẬP MÔN HỌC TƯ TƯỞNG HỒ CHÍ MINH\". Cụ thể: A, B, C được nêu trong; D trong; và E trong."},{"id":"vn01-18","cd":"01","l":"NH","q":"Theo khái niệm của Đại hội XI, Tư tưởng Hồ Chí Minh là \"hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam\". Các vấn đề cơ bản đó bao gồm những khía cạnh nào? (Chọn nhiều đáp án đúng)","o":[["A","Mục tiêu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh."],["B","Con đường phát triển của dân tộc Việt Nam là độc lập dân tộc gắn liền với chủ nghĩa xã hội."],["C","Vai trò lãnh đạo của Đảng Cộng sản Việt Nam và sự quản lý của Nhà nước cách mạng."],["D","Xác định lực lượng cách mạng là toàn thể nhân dân Việt Nam yêu nước."],["E","Xây dựng con người Việt Nam có năng lực và phẩm chất đạo đức cách mạng."]],"a":"ABCDE","g":"Tài liệu và liệt kê chi tiết những vấn đề cơ bản của cách mạng Việt Nam mà Tư tưởng Hồ Chí Minh bao quát, bao gồm tất cả các phương án A, B, C, D, E. Cụ thể: mục tiêu quốc gia, con đường phát triển, vai trò của Đảng và Nhà nước, lực lượng cách mạng, xây dựng con người Việt Nam."},{"id":"vn01-19","cd":"01","l":"NH","q":"Việc nhận thức về Tư tưởng Hồ Chí Minh của Đảng Cộng sản Việt Nam đã trải qua những giai đoạn phát triển nào được tài liệu đề cập? (Chọn nhiều đáp án đúng)","o":[["A","Thể hiện ngay từ Cương lĩnh chính trị đầu tiên của Đảng."],["B","Gặp phải sự hiểu không đúng từ Quốc tế Cộng sản và một số người trong Đảng Cộng sản Đông Dương."],["C","Khẳng định đường lối chính trị, nếp làm việc và đạo đức cách mạng của Đảng là của Hồ Chủ tịch tại Đại hội II."],["D","Đánh giá Hồ Chí Minh là người sáng lập và rèn luyện Đảng tại Đại hội IV."],["E","Chính thức lấy chủ nghĩa Mác - Lênin và Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động tại Đại hội VII."]],"a":"ABCDE","g":"Các phương án này đều được trình bày trong phần \"Khái niệm trên là sự ghi nhận quá trình nhận thức của Đảng Cộng sản Việt Nam về tư tưởng Hồ Chí Minh\". Cụ thể: A trong, B và C trong, D trong, và E trong."},{"id":"vn01-20","cd":"01","l":"NH","q":"Theo tài liệu, các sinh viên nghiên cứu môn học Tư tưởng Hồ Chí Minh có thể vận dụng phương châm \"Dĩ bất biến, ứng vạn biến\" của Hồ Chí Minh vào việc xây dựng những phong cách nào? (Chọn nhiều đáp án đúng)","o":[["A","Phong cách tư duy."],["B","Phong cách diễn đạt."],["C","Phong cách làm việc."],["D","Phong cách ứng xử."],["E","Phong cách sinh hoạt."]],"a":"ABCDE","g":"Tài liệu liệt kê rõ ràng: \"Người học có thể vận dụng xây dựng phong cách tư duy, phong cách diễn đạt, phong cách làm việc, phong cách ứng xử, phong cách sinh hoạt, v.v. phù hợp với hoàn cảnh như phương châm của Hồ Chí Minh: Dĩ bất biến, ứng vạn biến.\" Tất cả các phương án đều được đề cập."},{"id":"vn01-21","cd":"01","l":"DK","q":"“Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam, kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta, kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hoá nhân loại; là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta, mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi” là khái niệm được nêu ra tại Đại hội đại biểu toàn quốc lần thứ _______ của Đảng Cộng sản Việt Nam (năm 2011).","o":[["A","IX"],["B","X"],["C","XI"],["D","XII"],["E","XIII"]],"a":"C","g":"Theo tài liệu môn học: \"Đại hội đại biểu toàn quốc lần thứ XI của Đảng Cộng sản Việt Nam (năm 2011) nêu khái niệm “Tư tưởng Hồ Chí Minh\" như sau...\"."},{"id":"vn01-22","cd":"01","l":"DK","q":"Tư tưởng Hồ Chí Minh được xác định là nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam cùng với _______.","o":[["A","chủ nghĩa yêu nước"],["B","chủ nghĩa xã hội khoa học"],["C","chủ nghĩa Mác - Lênin"],["D","chủ nghĩa nhân văn"],["E","chủ nghĩa tập thể"]],"a":"C","g":"Tài liệu đều khẳng định: \"Cùng với chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh là một bộ phận cấu thành làm nên nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam.\""},{"id":"vn01-23","cd":"01","l":"DK","q":"Con đường phát triển của dân tộc Việt Nam theo Tư tưởng Hồ Chí Minh là độc lập dân tộc gắn liền với _______.","o":[["A","dân chủ"],["B","phát triển bền vững"],["C","chủ nghĩa xã hội"],["D","đổi mới"],["E","công nghiệp hóa"]],"a":"C","g":"Theo tài liệu môn học: \"Để đạt mục tiêu đó, con đường phát triển của dân tộc Việt Nam là độc lập dân tộc gắn liền với chủ nghĩa xã hội.\""},{"id":"vn01-24","cd":"01","l":"DK","q":"Tổ chức quốc tế nào đã ra Nghị quyết về kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh, tôn vinh Người là \"Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam\"?","o":[["A","Liên hợp quốc"],["B","UNESCO"],["C","WHO"],["D","UNICEF"],["E","IMF"]],"a":"B","g":"Tài liệu và ghi rõ: \"Tổ chức Giáo dục, Khoa học và Văn hóa của Liên hợp quốc (UNESCO)... đã ra Nghị quyết số 24C/18.6.5 về kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh, trong đó xác nhận... “Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam”\"."},{"id":"vn01-25","cd":"01","l":"DK","q":"Theo tài liệu, việc nghiên cứu môn học Tư tưởng Hồ Chí Minh giúp sinh viên tích cực, chủ động đấu tranh phê phán những quan điểm sai trái để bảo vệ sự trong sáng của chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, đường lối, chủ trương của Đảng, chính sách, pháp luật của _______.","o":[["A","Chính phủ"],["B","Nhà nước"],["C","Quốc hội"],["D","Mặt trận Tổ quốc"],["E","Đoàn Thanh niên"]],"a":"B","g":"Theo tài liệu môn học: \"tích cực, chủ động đấu tranh phê phán những quan điểm sai trái để bảo vệ sự trong sáng của chủ nghĩa Mác Lênin, tư tưởng Hồ Chí Minh, đường lối, chủ trương của Đảng, chính sách, pháp luật của Nhà nước\"."},{"id":"vn01-26","cd":"01","l":"DS","q":"Theo Tài liệu môn học, đối tượng nghiên cứu của môn học Tư tưởng Hồ Chí Minh không chỉ là toàn bộ những quan điểm của Hồ Chí Minh thể hiện trong di sản của Người, mà còn là quá trình hệ thống quan điểm đó vận động trong thực tiễn.","o":[],"a":"D","g":"Tài liệu môn học ghi: “Đối tượng nghiên cứu của môn học Tư tưởng Hồ Chí Minh là toàn bộ những quan điểm của Hồ Chí Minh thể hiện trong di sản của Người.” và “Đối tượng nghiên cứu của môn học Tư tưởng Hồ Chí Minh còn là quá trình hệ thống quan điểm của Hồ Chí Minh vận động trong thực tiễn.” Vì vậy, nhận định trên là đúng."},{"id":"vn01-27","cd":"01","l":"DS","q":"Theo Tài liệu môn học, khi nghiên cứu tư tưởng Hồ Chí Minh, người nghiên cứu chỉ cần đứng trên lập trường giai cấp công nhân (tính đảng), còn việc bảo đảm tính khách quan, khoa học của các luận đề là yêu cầu không bắt buộc.","o":[],"a":"S","g":"Tài liệu môn học ghi: “Đồng thời, phải bảo đảm tính khách quan, khoa học của các luận đề nêu ra. Sự thống nhất chặt chẽ giữa tính đảng và tính khoa học là một nguyên tắc rất cơ bản trong phương pháp luận nghiên cứu tư tưởng Hồ Chí Minh.” Tính khoa học là yêu cầu bắt buộc, gắn chặt với tính đảng, nên nhận định trên là sai."},{"id":"vn01-28","cd":"01","l":"DS","q":"Theo quan điểm toàn diện và hệ thống trong nghiên cứu tư tưởng Hồ Chí Minh, các bộ phận của hệ thống tư tưởng Hồ Chí Minh gắn kết với nhau xung quanh hạt nhân cốt lõi là tư tưởng về đạo đức cách mạng.","o":[],"a":"S","g":"Tài liệu môn học ghi: “Khi nghiên cứu tư tưởng Hồ Chí Minh trên bình diện tổng thể hay từng bộ phận phải luôn luôn quán triệt mối liên hệ qua lại của các yếu tố, các bộ phận khác nhau trong sự gắn kết tất yếu của hệ thống tư tưởng đó xung quanh hạt nhân cốt lõi là tư tưởng độc lập, tự do, dân chủ và chủ nghĩa xã hội.” Hạt nhân cốt lõi là tư tưởng độc lập, tự do, dân chủ và chủ nghĩa xã hội, không phải tư tưởng về đạo đức cách mạng, nên nhận định trên là sai."},{"id":"vn01-29","cd":"01","l":"DS","q":"Theo Tài liệu môn học, có nhiều nội dung phản ánh tư tưởng Hồ Chí Minh không nằm trong văn bản mà ở trong chỉ đạo thực tiễn của chính Hồ Chí Minh; vì vậy, nghiên cứu tư tưởng Hồ Chí Minh cần kết hợp phân tích văn bản với nghiên cứu hoạt động thực tiễn của Người.","o":[],"a":"D","g":"Tài liệu môn học ghi: “Có nhiều nội dung phản ánh tư tưởng Hồ Chí Minh không ở trong văn bản mà là ở trong chỉ đạo thực tiễn của chính bản thân Hồ Chí Minh” — đây là lý do Tài liệu môn học nêu “Phương pháp phân tích văn bản kết hợp với nghiên cứu hoạt động thực tiễn của Hồ Chí Minh.” Nhận định trên là đúng."},{"id":"vn01-30","cd":"01","l":"DS","q":"Theo Tài liệu môn học, phương pháp lôgíc là phương pháp nghiên cứu sự vật và hiện tượng theo trình tự thời gian, quá trình diễn biến đi từ phát sinh, phát triển đến hệ quả của nó.","o":[],"a":"S","g":"Tài liệu môn học ghi: “Phương pháp lôgíc nghiên cứu một cách tổng quát nhằm tìm ra được bản chất vốn có của sự vật, hiện tượng và khái quát thành lý luận.” và “Phương pháp lịch sử nghiên cứu sự vật và hiện tượng theo trình tự thời gian, quá trình diễn biến đi từ phát sinh, phát triển đến hệ quả của nó.” Nhận định trên đã gán đặc điểm của phương pháp lịch sử cho phương pháp lôgíc nên là sai."},{"id":"vn02-1","cd":"02","l":"DS","q":"Phong trào Cần Vương cuối thế kỷ XIX thất bại chứng tỏ rằng tư tưởng phong kiến đã lỗi thời và không thể đáp ứng được các nhiệm vụ lịch sử của dân tộc.","o":[],"a":"D","g":"Tài liệu môn học nêu rõ: \"Các cuộc khởi nghĩa vũ trang dưới ngọn cờ “Cần Vương” do các sĩ phu, văn thần lãnh đạo cuối cùng đều thất bại. Điều đó chứng tỏ tư tưởng phong kiến tỏ ra lỗi thời trước các nhiệm vụ lịch sử.\""},{"id":"vn02-2","cd":"02","l":"DS","q":"Mặc dù chịu ba tầng áp bức bóc lột là thực dân, tư bản và phong kiến, nhưng giai cấp công nhân Việt Nam cuối thế kỷ XIX đầu thế kỷ XX vẫn chưa thể vươn lên thành lực lượng lãnh đạo cách mạng do số lượng còn ít ỏi và sự thiếu ổn định.","o":[],"a":"S","g":"Mặc dù lúc đầu công nhân là lực lượng ít ỏi, không ổn định, nhưng đến đầu thế kỷ XX, họ đã phát triển và trở thành một giai cấp ngay trước Chiến tranh thế giới thứ nhất (1914 - 1918). Tài liệu môn học khẳng định: \"Chỉ có giai cấp công nhân là dũng cảm nhất, cách mạng nhất, luôn luôn gan góc đương đầu với bọn đế quốc thực dân\" và chính phong trào công nhân đã tạo điều kiện thuận lợi để chủ nghĩa Mác - Lênin xâm nhập, truyền bá vào Việt Nam, chấm dứt sự khủng hoảng về đường lối cách mạng. Điều này ngụ ý vai trò lãnh đạo tiềm năng của họ, dù chưa được chính thức khẳng định ở đây."},{"id":"vn02-3","cd":"02","l":"DS","q":"Cách mạng Tháng Mười Nga năm 1917 chỉ có ý nghĩa cục bộ đối với nước Nga mà không tạo ra bước ngoặt quyết định cho phong trào giải phóng dân tộc trên thế giới.","o":[],"a":"S","g":"Tài liệu môn học khẳng định Cách mạng Tháng Mười Nga \"là thắng lợi đầu tiên của chủ nghĩa Mác - Lênin ở một nước lớn\" và \"mở ra một thời đại mới trong lịch sử loài người – thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới, mở ra con đường giải phóng cho các dân tộc bị áp bức trên thế giới\". Rõ ràng, nó có ý nghĩa toàn cầu, không chỉ cục bộ."},{"id":"vn02-4","cd":"02","l":"DS","q":"Chủ nghĩa yêu nước là giá trị truyền thống tốt đẹp của dân tộc Việt Nam, nhưng nó chỉ là một trong nhiều động lực để Hồ Chí Minh ra đi tìm đường cứu nước, không phải là yếu tố khởi phát then chốt.","o":[],"a":"S","g":"Tài liệu môn học khẳng định: \"Chính chủ nghĩa yêu nước là nền tảng tư tưởng, điểm xuất phát và động lực thúc đẩy Hồ Chí Minh ra đi tìm đường cứu nước, và tìm thấy ở chủ nghĩa Mác - Lênin con đường cứu nước, cứu dân.\" Điều này cho thấy chủ nghĩa yêu nước là yếu tố khởi phát then chốt, không phải chỉ \"một trong nhiều động lực\"."},{"id":"vn02-5","cd":"02","l":"DS","q":"Hồ Chí Minh là người kế thừa một cách máy móc tư tưởng \"nhân trị, đức trị\" của Nho giáo trong quản lý xã hội, không có sự đổi mới sáng tạo nào.","o":[],"a":"S","g":"Tài liệu môn học và chỉ ra rằng Hồ Chí Minh \"chú ý kế thừa và đổi mới tư tưởng dùng nhân trị, đức trị để quản lý xã hội\" và \"chú ý kế thừa, đổi mới, phát triển tinh thần trọng đạo đức của Nho giáo\". Điều này bác bỏ nhận định Người kế thừa một cách máy móc."},{"id":"vn02-6","cd":"02","l":"DS","q":"Tài năng hoạt động và tổng kết thực tiễn của Hồ Chí Minh chủ yếu được hình thành qua việc nghiên cứu sách vở và tài liệu lý luận, chứ không phải từ vốn sống và hoạt động thực tiễn phong phú ở nhiều quốc gia.","o":[],"a":"S","g":"Tài liệu môn học nhấn mạnh: \"Hồ Chí Minh là người có vốn sống và thực tiễn cách mạng phong phú, phi thường. Trước khi trở thành Chủ tịch nước, Hồ Chí Minh đã sống, học tập và hoạt động cách mạng ở gần 30 nước trên thế giới.\" Người hiểu sâu sắc chủ nghĩa đế quốc, thực dân không chỉ qua tài liệu mà \"qua cuộc sống và hoạt động thực tiễn\", và thấu hiểu phong trào giải phóng dân tộc, xây dựng CNXH qua việc \"tham gia sáng lập Đảng Cộng sản Pháp, qua hoạt động ở Trung Quốc, qua tham gia phong trào cộng sản quốc tế ở nhiều nước, qua nghiên cứu đời sống xã hội ở Liên Xô\". Điều này cho thấy vai trò vượt trội của thực tiễn so với chỉ nghiên cứu sách vở."},{"id":"vn02-7","cd":"02","l":"D1","q":"Đâu là nguyên nhân sâu xa nhất dẫn đến sự thất bại của các phong trào yêu nước theo khuynh hướng dân chủ tư sản ở Việt Nam đầu thế kỷ XX?","o":[["A","Thiếu vũ khí hiện đại và sự đoàn kết trong nhân dân."],["B","Sự đàn áp tàn bạo của thực dân Pháp."],["C","Giai cấp tư sản Việt Nam còn non yếu về lực lượng và tổ chức."],["D","Sự thiếu vắng một nhà lãnh đạo tài ba và kiệt xuất."],["E","Sự lỗi thời của tư tưởng phong kiến."]],"a":"C","g":"Tài liệu môn học chỉ rõ: \"Các phong trào yêu nước theo khuynh hướng dân chủ tư sản nói trên đều thất bại. Nguyên nhân sâu xa là giai cấp tư sản Việt Nam còn non yếu. Nguyên nhân trực tiếp là các tổ chức và người lãnh đạo của các phong trào chưa có đường lối và phương pháp cách mạng đúng đắn.\""},{"id":"vn02-8","cd":"02","l":"D1","q":"Nhận định nào sau đây của Hồ Chí Minh về giai cấp công nhân Việt Nam thể hiện rõ nhất vai trò tiên phong của họ trong cuộc đấu tranh giải phóng dân tộc?","o":[["A","\"Công nhân Việt Nam chịu ba tầng áp bức bóc lột.\""],["B","\"Họ đã nhanh chóng tiến tới đình công, bãi công.\""],["C","\"Chỉ có giai cấp công nhân là dũng cảm nhất, cách mạng nhất, luôn luôn gan góc đương đầu với bọn đế quốc thực dân.\""],["D","\"Lực lượng công nhân lúc đó mới chỉ là một lực lượng ít ỏi, không ổn định.\""],["E","\"Công nhân phát triển hơn và trở thành một giai cấp ngay trước Chiến tranh thế giới thứ nhất.\""]],"a":"C","g":"Tài liệu môn học trích lời Hồ Chí Minh: \"“Chỉ có giai cấp công nhân là dũng cảm nhất, cách mạng nhất, luôn luôn gan góc đương đầu với bọn đế quốc thực dân”\". Nhận định này trực tiếp khẳng định vai trò tiên phong và tính cách mạng của giai cấp công nhân, vượt trội so với các lựa chọn khác vốn chỉ miêu tả tình cảnh hoặc quá trình phát triển."},{"id":"vn02-9","cd":"02","l":"D1","q":"Theo Tài liệu môn học tài liệu, yếu tố lý luận nào được xem là tiền đề quan trọng nhất, có vai trò quyết định trong việc hình thành tư tưởng Hồ Chí Minh?","o":[["A","Giá trị truyền thống tốt đẹp của dân tộc Việt Nam."],["B","Tinh hoa văn hóa phương Đông."],["C","Tinh hoa văn hóa phương Tây."],["D","Chủ nghĩa Mác – Lênin."],["E","Toàn bộ cơ sở thực tiễn Việt Nam và thế giới."]],"a":"D","g":"Tài liệu môn học khẳng định: \"Chủ nghĩa Mác – Lênin là tiền đề lý luận quan trọng nhất, có vai trò quyết định trong việc hình thành tư tưởng Hồ Chí Minh.\" Các yếu tố khác cũng quan trọng nhưng không được đánh giá là \"quan trọng nhất\" và \"quyết định\"."},{"id":"vn02-10","cd":"02","l":"D1","q":"Hồ Chí Minh đã tiếp thu và phát triển sáng tạo quan điểm nào của Tôn Trung Sơn theo con đường cách mạng vô sản?","o":[["A","Tư tưởng về \"Tự do - Bình đẳng - Bác ái\" của Cách mạng Pháp."],["B","Các quan điểm về nhân quyền và dân quyền trong Tuyên ngôn độc lập Mỹ."],["C","Các quan điểm về dân tộc, dân quyền, dân sinh trong chủ nghĩa Tam dân."],["D","Tư tưởng \"dùng nhân trị, đức trị để quản lý xã hội\" của Nho giáo."],["E","Triết lý \"từ bi, vị tha, yêu thương con người\" của Phật giáo."]],"a":"C","g":"Tài liệu môn học nêu rõ: \"Hồ Chí Minh đã phát triển sáng tạo các quan điểm về dân tộc, dân quyền, dân sinh của Tôn Trung Sơn trong cách mạng dân chủ tư sản thành tư tưởng đấu tranh cho Độc lập - Tự do - Hạnh phúc của con người và dân tộc Việt Nam theo con đường cách mạng vô sản.\""},{"id":"vn02-11","cd":"02","l":"D1","q":"Theo Hồ Chí Minh, điểm chung giữa Khổng Tử, Giêsu, Mác và Tôn Dật Tiên là gì, thể hiện tầm nhìn tổng hợp của Người về các hệ tư tưởng?","o":[["A","Đều ủng hộ chủ nghĩa cộng sản."],["B","Đều muốn \"mưu hạnh phúc cho loài người, mưu phúc lợi cho xã hội\"."],["C","Đều đề cao vai trò của giai cấp vô sản."],["D","Đều khuyến khích con người sống gắn bó với thiên nhiên."],["E","Đều là những người cách mạng chân chính."]],"a":"B","g":"Tài liệu môn học trích lời Hồ Chí Minh nhận định: \"Học thuyết Khổng Tử có ưu điểm là sự tu dưỡng đạo đức cá nhân. Tôn giáo Giêsu có ưu điểm là lòng nhân ái cao cả. Chủ nghĩa Mác có ưu điểm là phương pháp làm việc biện chứng. Chủ nghĩa Tôn Dật Tiên có ưu điểm là chính sách của nó phù hợp với điều kiện nước ta. Khổng Tử, Giêsu, Mác, Tôn Dật Tiên chẳng phải đã có những ưu điểm chung đó sao? Họ đều muốn “mưu hạnh phúc cho loài người, mưu phúc lợi cho xã hội”.\""},{"id":"vn02-12","cd":"02","l":"D1","q":"Điều nào sau đây thể hiện rõ nhất năng lực tư duy độc lập, tự chủ, sáng tạo của Hồ Chí Minh trong quá trình hình thành tư tưởng của Người?","o":[["A","Khả năng biết rất nhiều ngoại ngữ và làm nhiều nghề khác nhau để kiếm sống."],["B","Sự tận trung với nước, tận hiếu với dân trong suốt cuộc đời."],["C","Vận dụng đúng quy luật chung của xã hội loài người vào hoàn cảnh riêng của Việt Nam để đề xuất đường lối mới."],["D","Việc tham gia sáng lập Đảng Cộng sản Pháp và Quốc tế Cộng sản."],["E","Khả năng đọc sách văn học của các nhà văn lớn trên thế giới."]],"a":"C","g":"Tài liệu môn học và mô tả phẩm chất của Người: \"Hồ Chí Minh còn là người có bản lĩnh tư duy độc lập, tự chủ, sáng tạo, giàu tính phê phán, đổi mới và cách mạng; đã vận dụng đúng quy luật chung của xã hội loài người, của cách mạng thế giới vào hoàn cảnh riêng, cụ thể của Việt Nam, đề xuất tư tưởng, đường lối cách mạng mới áp ứng đúng đòi hỏi thực tiễn\". Đây là biểu hiện rõ ràng nhất của tư duy độc lập, tự chủ, sáng tạo."},{"id":"vn02-13","cd":"02","l":"SAI","q":"Nhận định nào sau đây KHÔNG phản ánh đúng tình hình xã hội Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX dưới tác động của thực dân Pháp?","o":[["A","Nền kinh tế nông nghiệp lạc hậu vẫn được duy trì."],["B","Cơ cấu giai cấp, tầng lớp trong xã hội có sự biến đổi sâu sắc."],["C","Giai cấp địa chủ bị suy yếu trầm trọng do chính sách của Pháp."],["D","Xuất hiện các tầng lớp mới như công nhân, tư sản, tiểu tư sản."],["E","Phát sinh mâu thuẫn mới giữa toàn thể nhân dân Việt Nam với thực dân Pháp."]],"a":"C","g":"Tài liệu môn học cho biết: \"Thực dân Pháp vẫn duy trì nền kinh tế nông nghiệp lạc hậu... giai cấp địa chủ được bổ sung, củng cố, tăng cường thêm các điền chủ người Pháp và người nước ngoài.\" Như vậy, giai cấp địa chủ không bị suy yếu mà ngược lại, còn được củng cố. Các đáp án A, B, D, E đều đúng theo và."},{"id":"vn02-14","cd":"02","l":"SAI","q":"Điều nào sau đây KHÔNG phải là một trong những mâu thuẫn cơ bản của xã hội Việt Nam được hình thành hoặc phát triển gay gắt vào đầu thế kỷ XX?","o":[["A","Mâu thuẫn giữa giai cấp nông dân với giai cấp địa chủ phong kiến."],["B","Mâu thuẫn giữa giai cấp công nhân Việt Nam với giai cấp tư sản."],["C","Mâu thuẫn giữa toàn thể nhân dân Việt Nam với thực dân Pháp."],["D","Mâu thuẫn giữa giai cấp vô sản với giai cấp tư sản ở các nước tư bản."],["E","Mâu thuẫn giữa các dân tộc thuộc địa với chủ nghĩa đế quốc."]],"a":"D","g":"Các mâu thuẫn A, B, C được nêu rõ là mâu thuẫn trong xã hội Việt Nam. Mâu thuẫn D và E là các mâu thuẫn trên phạm vi thế giới (trong lòng chủ nghĩa tư bản và giữa các dân tộc thuộc địa với chủ nghĩa đế quốc), không phải là mâu thuẫn của xã hội Việt Nam theo nghĩa trực tiếp như A, B, C. Câu hỏi yêu cầu mâu thuẫn của xã hội Việt Nam."},{"id":"vn02-15","cd":"02","l":"SAI","q":"Yếu tố nào sau đây KHÔNG được xem là một trong những giá trị truyền thống tốt đẹp của dân tộc Việt Nam được Hồ Chí Minh kế thừa và phát triển?","o":[["A","Chủ nghĩa yêu nước gắn liền với yêu dân."],["B","Tinh thần đoàn kết, nhân ái, khoan dung."],["C","Tinh thần cần cù, dũng cảm, sáng tạo, lạc quan."],["D","Việc đặt lợi ích cá nhân lên trên lợi ích tập thể để phát huy tối đa năng lực cá nhân."],["E","Niềm tự hào về lịch sử, trân trọng văn hóa, ngôn ngữ dân tộc."]],"a":"D","g":"Các lựa chọn A, B, C, E đều được nêu rõ trong Tài liệu môn học và là những giá trị truyền thống tốt đẹp của dân tộc Việt Nam mà Hồ Chí Minh kế thừa và phát triển. Lựa chọn D, \"đặt lợi ích cá nhân lên trên lợi ích tập thể\", hoàn toàn trái ngược với tinh thần yêu nước, đoàn kết và \"vì nghĩa, thương người\" của dân tộc Việt Nam mà Hồ Chí Minh đề cao."},{"id":"vn02-16","cd":"02","l":"SAI","q":"Đặc điểm nào sau đây KHÔNG phản ánh đúng sự kế thừa và phát triển tinh hoa văn hóa phương Tây của Hồ Chí Minh?","o":[["A","Người quan tâm tới khẩu hiệu \"Tự do - Bình đẳng - Bác ái\" của Đại Cách mạng Pháp."],["B","Người kế thừa và phát triển các quan điểm nhân quyền, dân quyền."],["C","Người trực tiếp nghiên cứu tư tưởng nhân văn, dân chủ của các nhà khai sáng phương Tây."],["D","Người chỉ đọc các tác phẩm văn học của các tác giả phương Tây bằng bản dịch tiếng Việt."],["E","Người đề xuất quan điểm về quyền mưu cầu độc lập, tự do, hạnh phúc của các dân tộc."]],"a":"D","g":"Tài liệu môn học nêu rõ: \"Người trực tiếp nghiên cứu tư tưởng nhân văn, dân chủ và nhà nước pháp quyền của các nhà khai sáng phương Tây như Vonte, Rútxô, Môngtétxkiơ... thích đọc sách văn học của William Shakespeare bằng tiếng Anh, Lỗ Tấn bằng tiếng Trung Hoa, Hugo, Zola bằng tiếng Pháp\". Điều này cho thấy Người đọc bằng ngôn ngữ gốc, không chỉ bản dịch tiếng Việt. Các lựa chọn A, B, C, E đều đúng theo và."},{"id":"vn02-17","cd":"02","l":"SAI","q":"Điều nào sau đây KHÔNG phải là một trong những đóng góp sáng tạo của Hồ Chí Minh vào chủ nghĩa Mác - Lênin trong thời đại mới?","o":[["A","Phát triển các vấn đề về dân tộc và cách mạng giải phóng dân tộc."],["B","Bổ sung các luận điểm về chủ nghĩa xã hội và xây dựng chủ nghĩa xã hội ở Việt Nam."],["C","Đưa ra các quan điểm mới về xây dựng Đảng, Nhà nước, văn hóa và con người."],["D","Khẳng định chủ nghĩa Mác - Lênin là vũ khí không gì thay thế được cho cách mạng Việt Nam."],["E","Phát triển các vấn đề về đạo đức cách mạng."]],"a":"D","g":"Tài liệu môn học khẳng định Hồ Chí Minh đã \"vận dụng sáng tạo, mà còn bổ sung, phát triển và làm phong phú chủ nghĩa Mác – Lênin trong thời đại mới\" trên các vấn đề dân tộc, cách mạng giải phóng dân tộc, chủ nghĩa xã hội, xây dựng Đảng, Nhà nước, văn hóa, con người, đạo đức. Việc khẳng định \"chủ nghĩa Mác - Lênin là vũ khí không gì thay thế được\" là một sự thừa nhận giá trị và tầm quan trọng của chủ nghĩa Mác - Lênin, nhưng bản thân nó không phải là sự bổ sung hay phát triển về mặt lý luận, mà là kết quả của việc vận dụng thành công."},{"id":"vn02-18","cd":"02","l":"SAI","q":"Nhận định nào sau đây KHÔNG thuộc về những phẩm chất cá nhân đã góp phần quyết định thành công của Hồ Chí Minh trong hoạt động lý luận và thực tiễn?","o":[["A","Có lý tưởng cao cả và hoài bão lớn cứu dân, cứu nước."],["B","Có bản lĩnh tư duy độc lập, tự chủ, sáng tạo, giàu tính phê phán."],["C","Suốt đời tận trung với nước, tận hiếu với dân."],["D","Năng lực tập trung vào một lĩnh vực chuyên môn sâu, tránh đa dạng hóa kiến thức."],["E","Tầm nhìn chiến lược, bao quát thời đại, năng lực tổng kết thực tiễn và dự báo tương lai chính xác."]],"a":"D","g":"Các lựa chọn A, B, C, E đều là những phẩm chất của Hồ Chí Minh được nêu trong Tài liệu môn học,,,. Lựa chọn D, \"Năng lực tập trung vào một lĩnh vực chuyên môn sâu, tránh đa dạng hóa kiến thức\", trái ngược với việc Hồ Chí Minh có \"vốn học thức văn hoá sâu rộng Đông Tây kim cổ\" và hiểu biết sâu sắc nhiều lĩnh vực, từ đó tổng hợp để giải quyết vấn đề cách mạng."},{"id":"vn02-19","cd":"02","l":"NH","q":"Các phong trào yêu nước ở Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX (trước khi Hồ Chí Minh tìm thấy con đường cứu nước) đều thất bại do những nguyên nhân nào sau đây?","o":[["A","Tư tưởng phong kiến đã lỗi thời trước các nhiệm vụ lịch sử."],["B","Giai cấp tư sản Việt Nam còn non yếu."],["C","Các tổ chức và người lãnh đạo chưa có đường lối và phương pháp cách mạng đúng đắn."],["D","Sự thiếu tinh thần yêu nước của nhân dân."],["E","Thiếu sự hợp tác quốc tế."]],"a":"ABC","g":"A. Đúng: Tài liệu môn học chỉ rõ: \"Các cuộc khởi nghĩa vũ trang dưới ngọn cờ “Cần Vương”... cuối cùng đều thất bại. Điều đó chứng tỏ tư tưởng phong kiến tỏ ra lỗi thời trước các nhiệm vụ lịch sử.\" B. Đúng: Tài liệu môn học nêu: \"Các phong trào yêu nước theo khuynh hướng dân chủ tư sản nói trên đều thất bại. Nguyên nhân sâu xa là giai cấp tư sản Việt Nam còn non yếu.\" C. Đúng: Tài liệu môn học nêu: \"Nguyên nhân trực tiếp là các tổ chức và người lãnh đạo của các phong trào chưa có đường lối và phương pháp cách mạng đúng đắn.\" D. Sai: Tài liệu môn học khẳng định: \"Tinh thần yêu nước vẫn sục sôi trong lòng nhân dân.\" E. Sai: Tài liệu môn học tài liệu không đề cập đây là nguyên nhân chính của sự "},{"id":"vn02-20","cd":"02","l":"NH","q":"Các mâu thuẫn chính nào đã trở nên sâu sắc và gay gắt trong lòng chủ nghĩa tư bản thế giới cuối thế kỷ XIX - đầu thế kỷ XX khi chuyển sang giai đoạn đế quốc chủ nghĩa?","o":[["A","Mâu thuẫn giữa giai cấp tư sản với giai cấp vô sản ở các nước tư bản."],["B","Mâu thuẫn giữa các nước đế quốc với nhau."],["C","Mâu thuẫn giữa các dân tộc thuộc địa và phụ thuộc với chủ nghĩa đế quốc."],["D","Mâu thuẫn giữa tư sản Việt Nam với thực dân Pháp."],["E","Mâu thuẫn giữa nông dân Việt Nam với địa chủ phong kiến."]],"a":"ABC","g":"Tài liệu môn học và nêu rõ: \"Tình hình đó đã làm sâu sắc thêm mâu thuẫn vốn có trong lòng chủ nghĩa tư bản, đó là mâu thuẫn giữa giai cấp tư sản với giai cấp vô sản ở các nước tư bản; mâu thuẫn giữa các nước đế quốc với nhau; mâu thuẫn giữa các dân tộc thuộc địa và phụ thuộc với chủ nghĩa đế quốc.\" Các đáp án D và E là mâu thuẫn riêng của xã hội Việt Nam, không phải mâu thuẫn chung \"trong lòng chủ nghĩa tư bản thế giới\" theo bối cảnh này."},{"id":"vn02-21","cd":"02","l":"NH","q":"Những đặc điểm nào của Hồ Chí Minh đã cho phép Người tiếp thu sâu sắc \"kho tàng tri thức mà nhân loại đã tạo ra\" và trở thành người cộng sản với tầm vóc trí tuệ lớn?","o":[["A","Có ý chí, nghị lực to lớn, một mình đi ra nước ngoài khảo sát thực tế."],["B","Làm nhiều nghề khác nhau để kiếm sống và biết rất nhiều ngoại ngữ."],["C","Vốn học thức văn hoá sâu rộng Đông Tây kim cổ, học hỏi ở nhà trường, sách vở, thực tế và nhân dân."],["D","Chỉ tập trung nghiên cứu sâu vào Chủ nghĩa Mác - Lênin."],["E","Có khả năng dự báo tương lai chính xác."]],"a":"ABCE","g":"A. Đúng: Tài liệu môn học nêu \"Người có ý chí, nghị lực to lớn, một mình dám đi ra nước ngoài khảo sát thực tế các nước đế quốc giàu có\". Điều này tạo điều kiện để tiếp cận tri thức. B. Đúng: Tài liệu môn học nêu \"Người đã làm nhiều nghề khác nhau để kiếm sống, biết rất nhiều ngoại ngữ, tự học hỏi và hoạt động cách mạng.\" Ngoại ngữ là chìa khóa để tiếp cận tri thức nhân loại. C. Đúng: Tài liệu môn học nêu \"Kết hợp học ở nhà trường, học trong sách vở, học trong thực tế hoạt động cách mạng, học ở nhân dân khắp những nơi Người đã đến, và đã có vốn học thức văn hoá sâu rộng Đông Tây kim cổ để vận dụng vào hoạt động cách mạng.\" D. Sai: Tài liệu môn học cho thấy Người không chỉ tập trung vào MLN m"},{"id":"vn02-22","cd":"02","l":"NH","q":"Trong hành trình tìm đường cứu nước, Hồ Chí Minh đã tiếp thu những tư tưởng tiến bộ nào từ phương Tây?","o":[["A","Khẩu hiệu \"Tự do - Bình đẳng - Bác ái\" của Đại Cách mạng Pháp 1789."],["B","Quan điểm về nhân quyền, dân quyền trong Tuyên ngôn độc lập Mỹ 1776 và Tuyên ngôn nhân quyền và dân quyền Pháp 1791."],["C","Tư tưởng nhân văn, dân chủ và nhà nước pháp quyền của các nhà khai sáng như Vonte, Rútxô, Môngtétxkiơ."],["D","Chủ nghĩa Găng-đi ở Ấn Độ."],["E","Chủ nghĩa Tam dân của Tôn Trung Sơn."]],"a":"ABC","g":"A. Đúng: Tài liệu môn học nêu: \"Hồ Chí Minh đã quan tâm tới khẩu hiệu nổi tiếng của Đại Cách mạng Pháp năm 1789: Tự do - Bình đẳng - Bác ái.\" B. Đúng: Tài liệu môn học và nêu: \"Người đã kế thừa, phát triển những quan điểm nhân quyền, dân quyền trong bản Tuyên ngôn độc lập năm 1776 của Mỹ, bản Tuyên ngôn nhân quyền và dân quyền năm 1791 của Pháp\". C. Đúng: Tài liệu môn học nêu: \"Người trực tiếp nghiên cứu tư tưởng nhân văn, dân chủ và nhà nước pháp quyền của các nhà khai sáng phương Tây như Vonte, Rútxô, Môngtétxkiơ\". D. Sai: Chủ nghĩa Găng-đi thuộc về phương Đông (Ấn Độ). E. Sai: Chủ nghĩa Tam dân của Tôn Trung Sơn thuộc về phương Đông (Trung Quốc)."},{"id":"vn02-23","cd":"02","l":"NH","q":"Những giá trị tích cực nào của Phật giáo đã được Hồ Chí Minh chú ý kế thừa và phát triển để phục vụ sự nghiệp cách mạng Việt Nam?","o":[["A","Tư tưởng từ bi, vị tha, yêu thương con người, khuyến khích làm việc thiện."],["B","Quan điểm chống lại điều ác và đề cao quyền bình đẳng của con người."],["C","Triết lý khuyên con người sống hòa đồng, gắn bó với đất nước."],["D","Tư tưởng thoát mọi ràng buộc của vòng danh lợi."],["E","Chủ trương văn hóa là mục tiêu, động lực của cách mạng."]],"a":"ABC","g":"A. Đúng: Tài liệu môn học nêu: \"Đối với Phật giáo, Hồ Chí Minh chú ý kế thừa, phát triển tư tưởng từ bi, vị tha, yêu thương con người, khuyến khích làm việc thiện, chống lại điều ác\". B. Đúng: Tài liệu môn học nêu: \"đề cao quyền bình đẳng của con người và chân lý\". C. Đúng: Tài liệu môn học nêu: \"khuyên con người sống hòa đồng, gắn bó với đất nước của đạo Phật.\" D. Sai: Tư tưởng thoát mọi ràng buộc của vòng danh lợi là của Lão giáo. E. Sai: Chủ trương văn hóa là mục tiêu, động lực của cách mạng là một luận điểm chung của Hồ Chí Minh về văn hóa, không riêng từ Phật giáo."},{"id":"vn02-24","cd":"02","l":"NH","q":"Thực tiễn Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX đã tạo ra những tiền đề quan trọng nào cho sự hình thành tư tưởng Hồ Chí Minh về cách mạng Việt Nam?","o":[["A","Sự thất bại liên tục của các phong trào yêu nước, dẫn đến khủng hoảng về đường lối cứu nước."],["B","Sự ra đời và phát triển của giai cấp công nhân Việt Nam, cùng với phong trào đấu tranh mạnh mẽ."],["C","Việc thực dân Pháp biến Việt Nam thành nước \"thuộc địa và phong kiến\" làm sâu sắc thêm các mâu thuẫn xã hội."],["D","Sự thành công của các cuộc vận động cải cách theo khuynh hướng dân chủ tư sản."],["E","Việt Nam trở thành một quốc gia độc lập hoàn toàn."]],"a":"ABC","g":"A. Đúng: Tài liệu môn học nêu rõ: \"Các phong trào yêu nước theo khuynh hướng dân chủ tư sản nói trên đều thất bại... Song, cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc.\" B. Đúng: Tài liệu môn học và nêu: \"Sự ra đời của giai cấp công nhân và phong trào đấu tranh của giai cấp công nhân Việt Nam đã làm cho cuộc đấu tranh giải phóng dân tộc ở Việt Nam xuất hiện dấu hiệu mới của một thời đại mới sắp ra đời.\" C. Đúng: Tài liệu môn học và nêu: \"thực dân Pháp bắt tay vào khai thác thuộc địa... biến nước ta từ một nước phong kiến thành nước “thuộc địa và phong kiến” dẫn tới sự biến đổi về cơ cấu giai cấp... bên cạnh mâu thuẫn cơ bản... xuất hiện các mâu thuẫn mới.\" D. Sai: Tài liệu môn học "},{"id":"vn02-25","cd":"02","l":"DK","q":"Theo tư tưởng Hồ Chí Minh, con người là vốn quý nhất là nhân tố quyết định thành công của cách mạng, dân là gốc của nước; nước lấy dân làm gốc; gốc có vững cây mới bền; xây lầu thắng lợi trên nền _______.","o":[["A","chủ nghĩa Mác - Lênin"],["B","nhân dân"],["C","Đảng Cộng sản"],["D","văn hóa"],["E","lý luận"]],"a":"B","g":"Tài liệu môn học nêu: \"Trong tư tưởng Hồ Chí Minh, con người là vốn quý nhất là nhân tố quyết định thành công của cách mạng, dân là gốc của nước; nước lấy dân làm gốc; gốc có vững cây mới bền; xây lầu thắng lợi trên nền nhân dân\"."},{"id":"vn02-26","cd":"02","l":"DK","q":"Cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc ở Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX đã đặt ra câu hỏi thực tiễn là: Cứu nước bằng con đường nào để có thể đi đến _______?","o":[["A","độc lập"],["B","văn minh"],["C","phát triển"],["D","thắng lợi"],["E","hội nhập"]],"a":"D","g":"Tài liệu môn học nêu: \"Song, cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc. Xuất hiện câu hỏi từ thực tiễn đặt ra là: Cứu nước bằng con đường nào để có thể đi đến thắng lợi?\"."},{"id":"vn02-27","cd":"02","l":"DK","q":"Cách mạng Tháng Mười Nga năm 1917 thành công đã mở ra một _______ mới trong lịch sử loài người – thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới.","o":[["A","thời đại"],["B","kỷ nguyên"],["C","chân lý"],["D","tư tưởng"],["E","lý luận"]],"a":"A","g":"Tài liệu môn học nêu: \"Cách mạng Tháng Mười Nga mở ra một thời đại mới trong lịch sử loài người – thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới\"."},{"id":"vn02-28","cd":"02","l":"DK","q":"Hồ Chí Minh là một biểu tượng cao đẹp của sự tích hợp tinh hoa văn hóa phương Đông và phương Tây, với chủ trương văn hóa là mục tiêu, động lực của cách mạng; cần giữ gìn cốt cách văn hóa dân tộc, đồng thời tiếp thu tinh hoa văn hóa _______, xây dựng nền văn hóa mới của Việt Nam.","o":[["A","thế giới"],["B","tiến bộ"],["C","nhân loại"],["D","hiện đại"],["E","truyền thống"]],"a":"C","g":"Tài liệu môn học nêu: \"Hồ Chí Minh chính là một biểu tượng cao đẹp của sự tích hợp tinh hoa văn hóa phương Đông và phương Tây... cần giữ gìn cốt cách văn hóa dân tộc, đồng thời tiếp thu tinh hoa văn hóa nhân loại, xây dựng nền văn hóa mới của Việt Nam.\""},{"id":"vn02-29","cd":"02","l":"DK","q":"Hồ Chí Minh khẳng định: “Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mạng nhất là chủ nghĩa _______”.","o":[["A","yêu nước"],["B","dân tộc"],["C","Khổng Tử"],["D","Lênin"],["E","xã hội"]],"a":"D","g":"Tài liệu môn học trích lời Hồ Chí Minh: \"Ngay từ cuối những năm 20 của thế kỷ XX, Hồ Chí Minh đã khẳng định rằng: “Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mạng nhất là chủ nghĩa Lênin”\"."},{"id":"vn02-30","cd":"02","l":"DK","q":"Hồ Chí Minh là nhà tổ chức vĩ đại của cách mạng Việt Nam, Người đã hiện thực hóa tư tưởng, lý luận cách mạng thành hiện thực sinh động; đồng thời tổng kết thực tiễn cách mạng, bổ sung, phát triển _______ cách mạng.","o":[["A","phong trào"],["B","mục tiêu"],["C","lý luận"],["D","đường lối"],["E","chiến lược"]],"a":"C","g":"Tài liệu môn học nêu: \"Hồ Chí Minh là nhà tổ chức vĩ đại của cách mạng Việt Nam. Người đã hiện thực hóa tư tưởng, lý luận cách mạng thành hiện thực sinh động; đồng thời tổng kết thực tiễn cách mạng, bổ sung, phát triển lý luận, tư tưởng cách mạng.\""},{"id":"vn03-1","cd":"03","l":"DS","q":"Việc Hồ Chí Minh tham gia phong trào chống thuế ở Trung Kỳ năm 1908 đã cho thấy Người đã hoàn toàn đoạn tuyệt với mọi tư tưởng cải cách và chấp nhận con đường bạo động cách mạng ngay từ thời điểm đó.","o":[],"a":"S","g":"Trong thời kỳ trước năm 1911, Hồ Chí Minh hình thành tư tưởng yêu nước và chí hướng tìm đường cứu nước mới. Mặc dù Người đã tham gia phong trào chống thuế ở Trung Kỳ năm 1908, thể hiện rõ tư tưởng yêu nước trong hành động, nhưng Người vẫn đang trong quá trình \"suy ngẫm sâu sắc về Tổ quốc và thời cuộc\" và \"phê phán, không tán thành, không đi theo các phương pháp, khuynh hướng cứu nước của các vị khi đó\". Hành động này chưa phải là sự đoạn tuyệt hoàn toàn với mọi tư tưởng cải cách hay việc chấp nhận con đường bạo động cách mạng một cách dứt khoát, mà là một bước trong quá trình tìm tòi, khám phá con đường riêng."},{"id":"vn03-2","cd":"03","l":"DS","q":"Quan điểm \"Nhân dân lao động các nước, trong đó có giai cấp công nhân, đều bị bóc lột có thể là bạn của nhau; còn chủ nghĩa đế quốc, bọn thực dân ở đâu cũng là kẻ bóc lột, là kẻ thù của nhân dân lao động\" của Hồ Chí Minh hình thành ngay lập tức sau khi Người đặt chân đến Pháp vào năm 1911.","o":[],"a":"S","g":"Nhận thức này không hình thành ngay lập tức khi Người đến Pháp năm 1911. Các Tài liệu môn học nêu rõ rằng \"Từ năm 1911 đến năm 1917, từ Pháp, Hồ Chí Minh đến nhiều nước trên thế giới. Qua cuộc hành trình này, ở Người hình thành một nhận thức mới\". Điều này cho thấy đây là kết quả của một quá trình trải nghiệm, quan sát và suy ngẫm lâu dài trong nhiều năm, qua nhiều quốc gia, chứ không phải một sự hình thành tức thời."},{"id":"vn03-3","cd":"03","l":"DS","q":"Việc Hồ Chí Minh gia nhập Đảng Xã hội Pháp vào năm 1919 chủ yếu vì Người đã nhận thức sâu sắc về chủ nghĩa Mác – Lênin và quyết tâm đi theo con đường cách mạng vô sản.","o":[],"a":"S","g":"Tài liệu môn học cho biết năm 1919, Người gia nhập Đảng Xã hội giai cấp công dân Pháp \"bởi theo Người, đây là tổ chức theo đuổi lý tưởng cao quý Đại Cách mạng Pháp: Tự do, bình đẳng, bác ái\". Việc Hồ Chí Minh tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc theo con đường cách mạng vô sản qua nghiên cứu Luận cương của Lênin diễn ra sau đó, vào tháng 7/1920. Do đó, việc gia nhập Đảng Xã hội Pháp ban đầu không phải vì nhận thức sâu sắc về chủ nghĩa Mác – Lênin, mà vì lý tưởng tự do, bình đẳng, bác ái."},{"id":"vn03-4","cd":"03","l":"DS","q":"Tác phẩm \"Bản án chế độ thực dân Pháp\" và báo \"Le Paria\" của Hồ Chí Minh chỉ tập trung tố cáo tội ác của thực dân Pháp mà không có mục đích nào khác đối với nhân dân các nước thuộc địa.","o":[],"a":"S","g":"Mặc dù các tác phẩm như \"Bản án chế độ thực dân Pháp\" và báo \"Le Paria\" có mục đích lên án chủ nghĩa thực dân Pháp, nhưng mục tiêu sâu xa hơn của Hồ Chí Minh là \"thức tỉnh lương tri nhân dân Pháp và nhân loại tiến bộ, khơi dậy lòng yêu nước của nhân dân các dân tộc thuộc địa và của dân tộc Việt Nam\", cũng như \"thức tỉnh tinh thần giải phóng dân tộc của nhân dân các nước thuộc địa\". Như vậy, không chỉ tố cáo tội ác mà còn có mục đích thức tỉnh và khơi dậy tinh thần cách mạng."},{"id":"vn03-5","cd":"03","l":"DS","q":"Hội nghị Trung ương Đảng tháng 10/1930 đã khẳng định và phát triển thêm Cương lĩnh chính trị đầu tiên do Nguyễn Ái Quốc khởi thảo, đặc biệt là trong việc đặt nặng vấn đề dân tộc hơn vấn đề giai cấp.","o":[],"a":"S","g":"Ngược lại, Hội nghị Trung ương Đảng tháng 10/1930 đã ra nghị quyết cho rằng \"Hội nghị hợp nhất Đảng do Nguyễn Ái Quốc chủ trì có nhiều sai lầm, “chỉ lo đến việc phản đế, mà quên mất lợi ích giai cấp tranh đấu ấy là một sự rất nguy hiểm”\" và \"thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\". Điều này cho thấy hội nghị đã phê phán, không chấp nhận, và phủ nhận những quan điểm của Cương lĩnh chính trị đầu tiên, chứ không phải khẳng định hay phát triển."},{"id":"vn03-6","cd":"03","l":"DS","q":"Khẩu hiệu \"Không có gì quý hơn độc lập, tự do\" của Hồ Chí Minh chỉ được nêu ra trong bối cảnh cuộc kháng chiến chống Mỹ cứu nước và không có giá trị xuyên suốt cho toàn bộ sự nghiệp cách mạng Việt Nam.","o":[],"a":"S","g":"Mặc dù câu nói \"Không có gì quý hơn độc lập, tự do\" được Hồ Chí Minh nêu ra trong Lời kêu gọi đồng bào và chiến sĩ cả nước vào ngày 17/7/1966, trong bối cảnh cuộc kháng chiến chống Mỹ, cứu nước, nhưng nó được mô tả là \"một chân lý của thời đại\". Tinh thần độc lập, tự do là mục tiêu xuyên suốt trong toàn bộ quá trình tìm đường cứu nước, giải phóng dân tộc và xây dựng đất nước của Hồ Chí Minh. Do đó, khẳng định rằng nó \"chỉ được nêu ra\" và \"không có giá trị xuyên suốt\" là sai."},{"id":"vn03-7","cd":"03","l":"D1","q":"Đâu là nguyên nhân sâu xa nhất khiến Hồ Chí Minh, dù khâm phục tinh thần yêu nước của các vị tiền bối như Phan Bội Châu, Phan Châu Trinh, Hoàng Hoa Thám, nhưng lại \"sáng suốt phê phán, không tán thành, không đi theo\" các phương pháp cứu nước của họ?","o":[["A","Người muốn chứng tỏ bản thân có con đường riêng độc đáo hơn hẳn."],["B","Người nhận thấy các phương pháp đó chưa đủ khả năng giải quyết tận gốc vấn đề độc lập dân tộc và vận mệnh nước nhà."],["C","Người không tin tưởng vào khả năng lãnh đạo của các vị tiền bối."],["D","Người cho rằng các phong trào đó đã hoàn toàn thất bại và không còn giá trị tham khảo."],["E","Người muốn tìm kiếm sự hỗ trợ từ các cường quốc phương Tây mà không thông qua các phong trào trong nước."]],"a":"B","g":"Tài liệu môn học nêu rõ Hồ Chí Minh \"suy ngẫm sâu sắc về Tổ quốc và thời cuộc\" và \"không tán thành, không đi theo các phương pháp, khuynh hướng cứu nước của các vị khi đó\". Điều này ngụ ý rằng Người đã nhận ra những hạn chế cố hữu của các con đường đó, không đáp ứng được yêu cầu về một sự nghiệp giải phóng dân tộc triệt để, nên Người \"muốn tìm hiểu những gì ẩn giấu sau sức mạnh của kẻ thù và học hỏi kinh nghiệm cách mạng thế giới\" để tìm một con đường mới. Các phương án khác đưa ra những lý do không được Tài liệu môn học hỗ trợ hoặc là sự suy diễn không chính xác về động cơ của Người."},{"id":"vn03-8","cd":"03","l":"D1","q":"Đâu là dấu mốc quan trọng nhất đánh dấu sự \"kết hợp chặt chẽ chủ nghĩa yêu nước với lập trường cách mạng vô sản\" trong tư tưởng Hồ Chí Minh?","o":[["A","Gửi Yêu sách của nhân dân An Nam tới Hội nghị Vécxây (1919)."],["B","Gia nhập Đảng Xã hội Pháp (1919)."],["C","Nghiên cứu Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của V.I.Lênin (7/1920)."],["D","Tham gia sáng lập Đảng Cộng sản Pháp tại Đại hội ở thành phố Tua (12/1920)."],["E","Sáng lập báo Le Paria (1922)."]],"a":"D","g":"Tài liệu môn học khẳng định rõ ràng: \"Với những nhận thức cách mạng mới, Hồ Chí Minh cùng những người phái tả trong Đảng Xã hội Pháp tại Đại hội ở thành phố Tua (từ ngày 25 đến ngày 30/12/1920), bỏ phiếu tán thành Quốc tế Cộng sản, tham gia sáng lập Đảng Cộng sản Pháp, trở thành người cộng sản Việt Nam đầu tiên. Đây là bước ngoặt quan trọng trong cuộc đời của Hồ Chí Minh, bước ngoặt chủ nghĩa yêu nước kết hợp chặt chẽ với lập trường cách mạng vô sản\". Mặc dù việc nghiên cứu Luận cương của Lênin (phương án C) là tiền đề, nhưng hành động bỏ phiếu và tham gia sáng lập Đảng Cộng sản Pháp mới là sự cụ thể hóa, là dấu mốc chính thức của sự kết hợp này."},{"id":"vn03-9","cd":"03","l":"D1","q":"Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam do Hồ Chí Minh khởi thảo đã giải quyết triệt để cuộc khủng hoảng đường lối cứu nước bằng cách đề ra mục tiêu chiến lược nào?","o":[["A","Chỉ tập trung đánh đổ đế quốc Pháp để giành độc lập dân tộc."],["B","Thực hiện tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản."],["C","Thành lập ngay một chính phủ dân chủ cộng hòa và bỏ qua giai đoạn cách mạng dân tộc."],["D","Ưu tiên đấu tranh giai cấp hơn vấn đề giải phóng dân tộc."],["E","Kêu gọi sự giúp đỡ từ các nước tư bản phương Tây để thoát khỏi ách đô hộ."]],"a":"B","g":"Tài liệu môn học nêu rõ Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam nêu mục tiêu và con đường cách mạng là \"làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản\". Chính đường lối này đã chấm dứt cuộc khủng hoảng về đường lối cứu nước. Các phương án khác không phản ánh đúng hoặc sai lệch so với nội dung cốt lõi của Cương lĩnh."},{"id":"vn03-10","cd":"03","l":"D1","q":"Điều gì đã thể hiện rõ nhất sự vận dụng sáng tạo và phát triển chủ nghĩa Mác – Lênin trong Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam do Hồ Chí Minh khởi thảo?","o":[["A","Hoàn toàn tuân thủ các chỉ thị của Quốc tế Cộng sản mà không điều chỉnh."],["B","Phủ nhận vai trò của giai cấp công nhân trong lãnh đạo cách mạng."],["C","Giải quyết mối quan hệ giai cấp - dân tộc - quốc tế trong đường lối cách mạng Việt Nam."],["D","Ưu tiên nhiệm vụ cách mạng xã hội chủ nghĩa trước nhiệm vụ dân tộc dân chủ."],["E","Đề cao vai trò của địa chủ và tư sản dân tộc trong liên minh cách mạng."]],"a":"C","g":"Tài liệu môn học khẳng định: \"Bản Cương lĩnh chính trị đầu tiên này đã thể hiện rõ sự vận dụng sáng tạo và phát triển chủ nghĩa Mác- Lênin trong việc giải quyết mối quan hệ giai cấp - dân tộc - quốc tế trong đường lối cách mạng Việt Nam\". Đây chính là điểm sáng tạo cốt lõi của Cương lĩnh, khác biệt với cách tiếp cận giáo điều."},{"id":"vn03-11","cd":"03","l":"D1","q":"Hội nghị Trung ương Đảng tháng 5/1941 tại Pác Bó đã đưa ra quyết sách mang tính đột phá, phù hợp với tư tưởng Hồ Chí Minh, đó là:","o":[["A","Tiếp tục duy trì khẩu hiệu cách mạng điền địa như trọng tâm."],["B","Đặt nhiệm vụ đấu tranh giai cấp lên hàng đầu, cao hơn quyền lợi dân tộc."],["C","Tạm gác khẩu hiệu cách mạng điền địa và đặt nhiệm vụ giải phóng dân tộc lên hàng đầu."],["D","Quyết định thành lập Chính phủ Liên bang Cộng hòa dân chủ Đông Dương."],["E","Phê phán và bác bỏ việc thành lập Mặt trận Việt Minh."]],"a":"C","g":"Hội nghị Trung ương Đảng tháng 5/1941 do Hồ Chí Minh chủ trì đã \"đặt nhiệm vụ giải phóng dân tộc lên hàng đầu\" và \"tạm thời gác lại khẩu hiệu cách mạng điền địa\". Đồng thời, Nghị quyết cũng khẳng định \"Trong lúc này quyền lợi dân tộc giải phóng cao hơn hết thảy\" và \"quyền lợi của bộ phận, của giai cấp phải đặt dưới sự sinh tử, tồn vong của quốc gia, của dân tộc\". Điều này thể hiện sự chuyển hướng chiến lược quan trọng."},{"id":"vn03-12","cd":"03","l":"D1","q":"Chiến lược \"Dĩ bất biến, ứng vạn biến\" mà Hồ Chí Minh chỉ đạo trong giai đoạn 1945-1946 nhằm mục tiêu cốt lõi nào?","o":[["A","Kéo dài thời gian để chờ đợi sự hỗ trợ từ các nước đồng minh."],["B","Giữ vững mục tiêu đấu tranh cho chủ quyền độc lập dân tộc, tự do, ấm no, hạnh phúc cho nhân dân."],["C","Chỉ tập trung vào việc gây chia rẽ giữa các thế lực đế quốc mà không quan tâm đến xây dựng lực lượng nội bộ."],["D","Từ bỏ hoàn toàn nguyên tắc để đạt được hòa bình bằng mọi giá."],["E","Tránh mọi xung đột vũ trang dù phải hy sinh một phần chủ quyền quốc gia."]],"a":"B","g":"Tài liệu môn học nêu rõ, với phương châm \"Dĩ bất biến, ứng vạn biến\", Hồ Chí Minh đã \"giữ vững mục tiêu đấu tranh cho chủ quyền độc lập dân tộc, tự do, ấm no, hạnh phúc cho nhân dân bằng các sách lược cách mạng linh hoạt mềm dẻo\". Các phương án khác không phản ánh đúng bản chất hoặc làm sai lệch mục tiêu cốt lõi của chiến lược này."},{"id":"vn03-13","cd":"03","l":"SAI","q":"Phát biểu nào sau đây KHÔNG đúng về ảnh hưởng của gia đình và quê hương đến Hồ Chí Minh trong thời kỳ trước năm 1911?","o":[["A","Cụ Nguyễn Sinh Sắc, thân sinh của Người, đã đỗ Phó bảng và có tinh thần yêu nước, thương dân sâu sắc."],["B","Mẹ Người, Cụ Hoàng Thị Loan, là người phụ nữ Việt Nam điển hình với đức tính nhân hậu, tần tảo, đảm đang."],["C","Quê hương Nghệ An là vùng đất giàu truyền thống yêu nước, có nhiều anh hùng dân tộc."],["D","Gia đình Hồ Chí Minh thuộc tầng lớp địa chủ phong kiến giàu có."],["E","Cụ Nguyễn Sinh Sắc thường dạy các con không lấy phong cách nhà quan làm phong cách nhà ta."]],"a":"D","g":"Tài liệu môn học nêu rõ Hồ Chí Minh sinh ra trong một gia đình \"khoa bảng\". Cụ Nguyễn Sinh Sắc đỗ Phó bảng và tinh thần yêu nước, thương dân của cụ có ảnh hưởng lớn đến Hồ Chí Minh. Cụ Hoàng Thị Loan được mô tả là \"người mẹ Việt Nam điển hình với đức tính nhân hậu, tần tảo, đảm đang\". Nghệ An là vùng đất \"địa linh nhân kiệt, giàu truyền thống yêu nước\". Việc cụ Nguyễn Sinh Sắc tâm sự \"Quan trường là nô lệ trong những người nô lệ, lại càng nô lệ hơn\" và dạy các con \"Đừng lấy phong cách nhà quan làm phong cách nhà ta\" càng khẳng định gia đình Người không hề thuộc tầng lớp địa chủ phong kiến giàu có, mà là một gia đình khoa bảng với nhân cách thanh liêm, yêu nước. Do đó, phương án D là sai."},{"id":"vn03-14","cd":"03","l":"SAI","q":"Đặc điểm nào dưới đây KHÔNG thuộc quá trình Hồ Chí Minh hình thành tư tưởng cứu nước, giải phóng dân tộc theo con đường cách mạng vô sản trong giai đoạn 1911 – 1920?","o":[["A","Đi nhiều nước trên thế giới để tìm hiểu bản chất của chủ nghĩa thực dân."],["B","Hình thành nhận thức về sự đoàn kết giữa nhân dân lao động các nước."],["C","Trở thành người cộng sản Việt Nam đầu tiên."],["D","Chủ trương thành lập ngay một đảng cộng sản để lãnh đạo bạo động vũ trang ở Việt Nam."],["E","Đưa ra Yêu sách của nhân dân An Nam tại Hội nghị Vécxây."]],"a":"D","g":"Trong giai đoạn 1911-1920, Hồ Chí Minh đã đi nhiều nước để tìm hiểu bản chất của chủ nghĩa thực dân và hình thành nhận thức về sự đoàn kết của nhân dân lao động. Người đã trở thành người cộng sản Việt Nam đầu tiên vào cuối năm 1920 và gửi Yêu sách của nhân dân An Nam tại Hội nghị Vécxây vào năm 1919. Tuy nhiên, các Tài liệu môn học không hề đề cập đến việc Người chủ trương thành lập ngay một đảng cộng sản để lãnh đạo bạo động vũ trang ở Việt Nam trong giai đoạn này. Việc thành lập Đảng Cộng sản Việt Nam diễn ra sau đó (1930), và đó là quá trình chuẩn bị lâu dài, không phải là một chủ trương \"ngay lập tức\" trong giai đoạn này."},{"id":"vn03-15","cd":"03","l":"SAI","q":"Hoạt động nào sau đây KHÔNG thuộc giai đoạn 1920 – 1930, thời kỳ hình thành những nội dung cơ bản tư tưởng về cách mạng Việt Nam?","o":[["A","Sáng lập báo Le Paria bằng tiếng Pháp."],["B","Xuất bản tác phẩm \"Bản án chế độ thực dân Pháp\"."],["C","Sáng lập Hội Việt Nam Cách mạng Thanh niên."],["D","Chủ trì Hội nghị hợp nhất các tổ chức cộng sản Việt Nam."],["E","Sáng lập Đội Việt Nam Tuyên truyền Giải phóng quân."]],"a":"E","g":"Sáng lập báo Le Paria (1922), xuất bản tác phẩm \"Bản án chế độ thực dân Pháp\" (1925), sáng lập Hội Việt Nam Cách mạng Thanh niên (tháng 6/1925), và chủ trì Hội nghị hợp nhất các tổ chức cộng sản Việt Nam (đầu năm 1930) đều thuộc giai đoạn 1920-1930. Tuy nhiên, Đội Việt Nam Tuyên truyền Giải phóng quân được thành lập vào ngày 22/12/1944, thuộc giai đoạn 1941-1969. Do đó, phương án E là sai."},{"id":"vn03-16","cd":"03","l":"SAI","q":"Tuyên bố nào dưới đây KHÔNG phản ánh đúng những thách thức mà tư tưởng Hồ Chí Minh phải đối mặt trong giai đoạn 1920 – 1941?","o":[["A","Bị kẻ thù đàn áp, bắt bớ."],["B","Bị một số người trong Quốc tế Cộng sản và Đảng Cộng sản Đông Dương hiểu lầm và phê phán."],["C","Cương lĩnh chính trị đầu tiên bị coi là \"hữu khuynh\", \"dân tộc chủ nghĩa\"."],["D","Hội nghị Trung ương Đảng tháng 10/1930 ra nghị quyết \"thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\"."],["E","Toàn bộ đường lối cách mạng của Người đã bị Quốc tế Cộng sản bác bỏ hoàn toàn và không bao giờ được chấp nhận trở lại."]],"a":"E","g":"Tài liệu môn học cho thấy Hồ Chí Minh đã phải đối mặt với nhiều thách thức, bao gồm việc bị kẻ thù đàn áp (thoát khỏi nhà tù thực dân Anh), bị hiểu lầm và phê phán từ nội bộ Quốc tế Cộng sản và Đảng Cộng sản Đông Dương, Cương lĩnh bị coi là \"hữu khuynh\", \"dân tộc chủ nghĩa\", và Hội nghị Trung ương Đảng tháng 10/1930 đã \"thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\". Tuy nhiên, đường lối của Người đã được Đảng Cộng sản Đông Dương khẳng định và trở thành yếu tố chỉ đạo cách mạng Việt Nam từ Hội nghị Trung ương Đảng tháng 5/1941. Thực chất, sự chuyển hướng chiến lược từ Hội nghị tháng 11/1939 và tháng 5/1941 là \"sự trở về với quan điểm của Hồ Chí Minh đã nêu ra từ trong Cương lĩnh chính trị "},{"id":"vn03-17","cd":"03","l":"SAI","q":"Mục tiêu nào sau đây KHÔNG phải là một trong hai nhiệm vụ chiến lược được Hồ Chí Minh xác định và lãnh đạo thực hiện trong giai đoạn 1954 – 1969?","o":[["A","Xây dựng chủ nghĩa xã hội ở miền Bắc."],["B","Tiếp tục cách mạng dân tộc dân chủ nhân dân ở miền Nam."],["C","Độc lập, thống nhất nước nhà cho tất cả nhân sinh."],["D","Tăng cường hợp tác quân sự với Pháp để bảo vệ miền Nam."],["E","Bổ sung hoàn thiện hệ thống quan điểm cơ bản của Cách mạng Việt Nam trên nhiều lĩnh vực."]],"a":"D","g":"Trong giai đoạn 1954-1969, Hồ Chí Minh đã xác định và lãnh đạo thực hiện đường lối \"cùng một lúc thi hành hai nhiệm vụ chiến lược của Cách mạng Việt Nam: Xây dựng chủ nghĩa xã hội ở miền Bắc, tiếp tục cách mạng dân tộc dân chủ nhân dân ở miền Nam\". Mục tiêu cuối cùng là \"độc lập, thống nhất nước nhà\". Đồng thời, Người cũng \"bổ sung hoàn thiện hệ thống quan điểm cơ bản của Cách mạng Việt Nam trên tất cả các lĩnh vực\". Việc \"tăng cường hợp tác quân sự với Pháp\" là hoàn toàn trái ngược với đường lối và mục tiêu của cách mạng Việt Nam trong thời kỳ này, khi Pháp đã rút khỏi Việt Nam sau chiến thắng Điện Biên Phủ năm 1954."},{"id":"vn03-18","cd":"03","l":"SAI","q":"Luận điểm nào dưới đây KHÔNG phản ánh đúng nội dung cốt lõi của Lời kêu gọi toàn quốc kháng chiến (19/12/1946) do Hồ Chí Minh đề ra?","o":[["A","Thể hiện ý chí quyết tâm \"thà hi sinh tất cả chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ\"."],["B","Vạch rõ đường lối kháng chiến lâu dài toàn dân, toàn diện, tự lực cánh sinh."],["C","Kêu gọi quân đội Pháp quay trở lại Đông Dương để hỗ trợ chính quyền cách mạng."],["D","Là lời thề thiêng liêng bảo vệ Tổ quốc của dân tộc Việt Nam."],["E","Là sự tổng kết khái quát đường lối kháng chiến chống thực dân Pháp."]],"a":"C","g":"Tài liệu môn học nêu rõ Lời kêu gọi toàn quốc kháng chiến (19/12/1946) đã \"thể hiện khái quát đường lối kháng chiến chống thực dân Pháp\" và là \"lời thề thiêng liêng bảo vệ Tổ quốc của dân tộc Việt Nam, với ý chí, quyết tâm thà hi sinh tất cả chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ\". Đường lối kháng chiến là \"lâu dài toàn dân, toàn diện, tự lực cánh sinh\". Việc \"kêu gọi quân đội Pháp quay trở lại Đông Dương\" là hoàn toàn phi lý và trái ngược với tinh thần kháng chiến chống thực dân Pháp."},{"id":"vn03-19","cd":"03","l":"NH","q":"Những yếu tố nào sau đây đã góp phần hình thành nên tư tưởng yêu nước và chí hướng tìm đường cứu nước mới của Hồ Chí Minh trong thời kỳ trước năm 1911?","o":[["A","Truyền thống yêu nước của quê hương Nghệ An."],["B","Tinh thần yêu nước và nhân cách của Cụ Nguyễn Sinh Sắc."],["C","Tiếp xúc với sách báo tiến bộ và theo học các vị túc nho."],["D","Ảnh hưởng từ việc tham gia Đảng Xã hội Pháp."],["E","Việc tìm hiểu Luận cương của Lênin về vấn đề dân tộc và thuộc địa."]],"a":"ABC","g":"Các Tài liệu môn học cho biết trong thời kỳ trước năm 1911, Hồ Chí Minh tiếp thu \"truyền thống tốt đẹp của quê hương, gia đình và dân tộc\", trong đó có \"truyền thống yêu nước\" của Nghệ An và \"tinh thần yêu nước, thương dân và nhân cách của cụ Nguyễn Sinh Sắc\", \"tình cảm của người mẹ là Cụ Hoàng Thị Loan\". Ngoài ra, Người cũng \"được theo học các vị túc nho và tiếp xúc với nhiều loại sách, báo tiến bộ\". Phương án D và E thuộc giai đoạn sau năm 1911."},{"id":"vn03-20","cd":"03","l":"NH","q":"Trong giai đoạn 1911 – 1920, những hoạt động nào của Hồ Chí Minh đã thể hiện sự trưởng thành về nhận thức và sự kiên định trong việc tìm con đường cứu nước theo hướng cách mạng vô sản?","o":[["A","Gửi Yêu sách của nhân dân An Nam tới Hội nghị Vécxây."],["B","Tham gia phong trào công nhân Pháp."],["C","Nghiên cứu sâu sắc Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của V.I.Lênin."],["D","Sáng lập Hội Việt Nam Cách mạng Thanh niên."],["E","Chủ trì Hội nghị Trung ương Đảng tháng 5/1941."]],"a":
