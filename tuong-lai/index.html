e bourgeois-democratic revolution into the idea of struggling for Independence – Freedom – Happiness for the people and the nation of Vietnam along the path of proletarian revolution.”"},{"id":"en02-11","cd":"02","l":"D1","q":"According to Ho Chi Minh, what did Confucius, Jesus, Marx and Sun Yat-sen have in common, showing his synthesising vision of ideological systems?","o":[["A","They all supported communism."],["B","They all wanted “to seek happiness for humankind and welfare for society”."],["C","They all upheld the role of the proletariat."],["D","They all encouraged people to live close to nature."],["E","They were all genuine revolutionaries."]],"a":"B","g":"The course textbook quotes Ho Chi Minh's assessment: “The doctrine of Confucius has the merit of personal moral cultivation. The religion of Jesus has the merit of lofty benevolence. Marxism has the merit of the dialectical method of working. Sun Yat-sen's doctrine has the merit that its policy suits the conditions of our country. Do Confucius, Jesus, Marx and Sun Yat-sen not share these common merits? They all wanted ‘to seek happiness for humankind and welfare for society’.”"},{"id":"en02-12","cd":"02","l":"D1","q":"Which of the following most clearly shows Ho Chi Minh's capacity for independent, self-reliant and creative thinking in the process of forming his thought?","o":[["A","Knowing many foreign languages and doing many different jobs to earn a living."],["B","Utmost loyalty to the country and utmost devotion to the people throughout his life."],["C","Correctly applying the general laws of human society to Vietnam's particular circumstances to propose a new line."],["D","Taking part in founding the French Communist Party and the Communist International (Comintern)."],["E","The ability to read literary works by great writers of the world."]],"a":"C","g":"The course textbook describes his qualities: “Ho Chi Minh was also a person with the mettle of independent, self-reliant and creative thinking, highly critical, innovative and revolutionary; he correctly applied the general laws of human society and of the world revolution to the particular, specific circumstances of Vietnam, proposing new revolutionary ideas and lines that correctly met the demands of practice”. This is the clearest expression of independent, self-reliant and creative thinking."},{"id":"en02-13","cd":"02","l":"SAI","q":"Which of the following statements does NOT correctly reflect the social situation of Vietnam at the end of the 19th and the beginning of the 20th century under the impact of the French colonialists?","o":[["A","The backward agricultural economy was still maintained."],["B","The structure of classes and social strata underwent profound change."],["C","The landlord class was seriously weakened by French policies."],["D","New strata such as workers, the bourgeoisie and the petty bourgeoisie emerged."],["E","A new contradiction arose between the entire Vietnamese people and the French colonialists."]],"a":"C","g":"The course textbook states: “The French colonialists still maintained the backward agricultural economy... the landlord class was supplemented, consolidated and further strengthened with French and other foreign landowners.” Thus the landlord class was not weakened but, on the contrary, was consolidated. Options A, B, D and E are all correct."},{"id":"en02-14","cd":"02","l":"SAI","q":"Which of the following is NOT one of the basic contradictions of Vietnamese society that formed or became acute in the early 20th century?","o":[["A","The contradiction between the peasantry and the feudal landlord class."],["B","The contradiction between the Vietnamese working class and the bourgeoisie."],["C","The contradiction between the entire Vietnamese people and the French colonialists."],["D","The contradiction between the proletariat and the bourgeoisie in capitalist countries."],["E","The contradiction between the colonial peoples and imperialism."]],"a":"D","g":"Contradictions A, B and C are clearly stated as contradictions within Vietnamese society. Contradictions D and E are contradictions on a world scale (within capitalism, and between the colonial peoples and imperialism), not contradictions of Vietnamese society in the direct sense like A, B and C. The question asks for contradictions of Vietnamese society."},{"id":"en02-15","cd":"02","l":"SAI","q":"Which of the following is NOT considered one of the fine traditional values of the Vietnamese nation that Ho Chi Minh inherited and developed?","o":[["A","Patriotism closely linked with love for the people."],["B","The spirit of solidarity, humanity and tolerance."],["C","The spirit of industriousness, courage, creativity and optimism."],["D","Placing individual interests above collective interests in order to maximise individual capacity."],["E","Pride in history, and respect for the nation's culture and language."]],"a":"D","g":"Options A, B, C and E are all clearly stated in the course textbook and are fine traditional values of the Vietnamese nation that Ho Chi Minh inherited and developed. Option D, “placing individual interests above collective interests”, is completely contrary to the Vietnamese nation's spirit of patriotism, solidarity and “devotion to righteousness and compassion for others”, which Ho Chi Minh upheld."},{"id":"en02-16","cd":"02","l":"SAI","q":"Which of the following characteristics does NOT correctly reflect Ho Chi Minh's inheritance and development of the quintessence of Western culture?","o":[["A","He took an interest in the slogan “Liberty – Equality – Fraternity” of the Great French Revolution."],["B","He inherited and developed the views on human rights and civil rights."],["C","He directly studied the humanist and democratic thought of the Western Enlightenment thinkers."],["D","He read literary works by Western authors only in Vietnamese translation."],["E","He put forward the view on the right of nations to pursue independence, freedom and happiness."]],"a":"D","g":"The course textbook states clearly: “He directly studied the humanist and democratic thought and the rule-of-law state ideas of Western Enlightenment thinkers such as Voltaire, Rousseau and Montesquieu... he liked reading the literary works of William Shakespeare in English, Lu Xun in Chinese, and Hugo and Zola in French”. This shows that he read in the original languages, not only in Vietnamese translation. Options A, B, C and E are all correct."},{"id":"en02-17","cd":"02","l":"SAI","q":"Which of the following is NOT one of Ho Chi Minh's creative contributions to Marxism–Leninism in the new era?","o":[["A","Developing the issues of the nation and the national liberation revolution."],["B","Supplementing the theses on socialism and on building socialism in Vietnam."],["C","Putting forward new views on building the Party, the State, culture and the human being."],["D","Affirming that Marxism–Leninism is an irreplaceable weapon for the Vietnamese revolution."],["E","Developing the issues of revolutionary ethics."]],"a":"D","g":"The course textbook affirms that Ho Chi Minh “not only creatively applied, but also supplemented, developed and enriched Marxism–Leninism in the new era” on the issues of the nation, the national liberation revolution, socialism, building the Party, the State, culture, the human being and ethics. Affirming that “Marxism–Leninism is an irreplaceable weapon” is a recognition of the value and importance of Marxism–Leninism, but in itself it is not a theoretical supplement or development; rather, it is the result of successful application."},{"id":"en02-18","cd":"02","l":"SAI","q":"Which of the following statements does NOT belong among the personal qualities that contributed decisively to Ho Chi Minh's success in theoretical and practical activity?","o":[["A","Having lofty ideals and a great aspiration to save the people and the country."],["B","Having the mettle of independent, self-reliant, creative and highly critical thinking."],["C","Utmost loyalty to the country and utmost devotion to the people throughout his life."],["D","The capacity to concentrate on one in-depth specialist field, avoiding diversification of knowledge."],["E","A strategic vision encompassing the era, and the capacity to summarise practice and forecast the future accurately."]],"a":"D","g":"Options A, B, C and E are all qualities of Ho Chi Minh stated in the course textbook. Option D, “the capacity to concentrate on one in-depth specialist field, avoiding diversification of knowledge”, is contrary to Ho Chi Minh having “a broad and deep cultural learning of East and West, ancient and modern” and a profound understanding of many fields, which he synthesised to solve the problems of the revolution."},{"id":"en02-19","cd":"02","l":"NH","q":"The patriotic movements in Vietnam at the end of the 19th and the beginning of the 20th century (before Ho Chi Minh found the path to national salvation) all failed because of which of the following causes?","o":[["A","Feudal ideology had become outdated in the face of the historical tasks."],["B","The Vietnamese bourgeoisie was still weak."],["C","The organisations and leaders did not yet have a correct revolutionary line and method."],["D","A lack of patriotism among the people."],["E","A lack of international cooperation."]],"a":"ABC","g":"A. Correct: The course textbook states clearly: “The armed uprisings under the ‘Can Vuong’ banner... all ultimately failed. This proved that feudal ideology had become outdated in the face of the historical tasks.” B. Correct: The course textbook states: “The patriotic movements following the bourgeois-democratic tendency mentioned above all failed. The underlying cause was that the Vietnamese bourgeoisie was still weak.” C. Correct: The course textbook states: “The direct cause was that the organisations and leaders of the movements did not yet have a correct revolutionary line and method.” D. Incorrect: The course textbook affirms: “Patriotism was still seething in the hearts of the people"},{"id":"en02-20","cd":"02","l":"NH","q":"Which main contradictions became deep and acute within world capitalism at the end of the 19th and the beginning of the 20th century, when it moved into the imperialist stage?","o":[["A","The contradiction between the bourgeoisie and the proletariat in capitalist countries."],["B","The contradiction among the imperialist countries themselves."],["C","The contradiction between the colonial and dependent peoples and imperialism."],["D","The contradiction between the Vietnamese bourgeoisie and the French colonialists."],["E","The contradiction between Vietnamese peasants and feudal landlords."]],"a":"ABC","g":"The course textbook states clearly: “That situation deepened the inherent contradictions within capitalism, namely the contradiction between the bourgeoisie and the proletariat in capitalist countries; the contradiction among the imperialist countries themselves; and the contradiction between the colonial and dependent peoples and imperialism.” Options D and E are contradictions specific to Vietnamese society, not general contradictions “within world capitalism” in this context."},{"id":"en02-21","cd":"02","l":"NH","q":"Which characteristics of Ho Chi Minh enabled him to absorb deeply “the treasury of knowledge created by humankind” and become a communist of great intellectual stature?","o":[["A","Having great will and energy, going abroad alone to survey the reality."],["B","Doing many different jobs to earn a living and knowing many foreign languages."],["C","A broad and deep cultural learning of East and West, ancient and modern, learning from school, books, practice and the people."],["D","Concentrating only on in-depth study of Marxism–Leninism."],["E","Having the capacity to forecast the future accurately."]],"a":"ABCE","g":"A. Correct: The course textbook states: “He had great will and energy, daring to go abroad alone to survey the reality of the rich imperialist countries”. This created the conditions for access to knowledge. B. Correct: The course textbook states: “He did many different jobs to earn a living, knew many foreign languages, taught himself and carried out revolutionary activity.” Foreign languages are the key to accessing the knowledge of humankind. C. Correct: The course textbook states: “He combined learning at school, learning from books, learning in the practice of revolutionary activity and learning from the people everywhere he went, and acquired a broad and deep cultural learning of East "},{"id":"en02-22","cd":"02","l":"NH","q":"On his journey to seek a path to national salvation, which progressive ideas did Ho Chi Minh absorb from the West?","o":[["A","The slogan “Liberty – Equality – Fraternity” of the Great French Revolution of 1789."],["B","The views on human rights and civil rights in the American Declaration of Independence of 1776 and the French Declaration of the Rights of Man and of the Citizen of 1791."],["C","The humanist and democratic thought and the rule-of-law state ideas of Enlightenment thinkers such as Voltaire, Rousseau and Montesquieu."],["D","Gandhism in India."],["E","Sun Yat-sen's Three Principles of the People."]],"a":"ABC","g":"A. Correct: The course textbook states: “Ho Chi Minh took an interest in the famous slogan of the Great French Revolution of 1789: Liberty – Equality – Fraternity.” B. Correct: The course textbook states: “He inherited and developed the views on human rights and civil rights in the American Declaration of Independence of 1776 and the French Declaration of the Rights of Man and of the Citizen of 1791”. C. Correct: The course textbook states: “He directly studied the humanist and democratic thought and the rule-of-law state ideas of Western Enlightenment thinkers such as Voltaire, Rousseau and Montesquieu”. D. Incorrect: Gandhism belongs to the East (India). E. Incorrect: Sun Yat-sen's Three P"},{"id":"en02-23","cd":"02","l":"NH","q":"Which positive values of Buddhism did Ho Chi Minh pay attention to inheriting and developing to serve the Vietnamese revolutionary cause?","o":[["A","The ideas of compassion, altruism and love for human beings, encouraging good deeds."],["B","The view of opposing evil and upholding human equality."],["C","The philosophy advising people to live in harmony and remain attached to the country."],["D","The idea of escaping all the bonds of fame and fortune."],["E","The view that culture is the goal and driving force of the revolution."]],"a":"ABC","g":"A. Correct: The course textbook states: “As for Buddhism, Ho Chi Minh paid attention to inheriting and developing the ideas of compassion, altruism and love for human beings, encouraging good deeds and opposing evil”. B. Correct: The course textbook states: “upholding human equality and truth”. C. Correct: The course textbook states: “Buddhism's advice to live in harmony and remain attached to the country.” D. Incorrect: The idea of escaping all the bonds of fame and fortune belongs to Taoism. E. Incorrect: The view that culture is the goal and driving force of the revolution is a general thesis of Ho Chi Minh on culture, not derived specifically from Buddhism."},{"id":"en02-24","cd":"02","l":"NH","q":"What important premises did Vietnamese practice at the end of the 19th and the beginning of the 20th century create for the formation of Ho Chi Minh's thought on the Vietnamese revolution?","o":[["A","The continuous failure of the patriotic movements, leading to a crisis of the line for national salvation."],["B","The birth and development of the Vietnamese working class, together with its strong movement of struggle."],["C","The French colonialists turning Vietnam into a “colonial and feudal” country, deepening social contradictions."],["D","The success of reform campaigns following the bourgeois-democratic tendency."],["E","Vietnam becoming a completely independent country."]],"a":"ABC","g":"A. Correct: The course textbook states clearly: “The patriotic movements following the bourgeois-democratic tendency mentioned above all failed... However, the crisis of the line for national salvation was profound.” B. Correct: The course textbook states: “The birth of the working class and the struggle movement of the Vietnamese working class gave the national liberation struggle in Vietnam new signs of a new era about to be born.” C. Correct: The course textbook states: “the French colonialists set about exploiting the colony... turning our country from a feudal country into a ‘colonial and feudal’ country, leading to changes in the class structure... alongside the basic contradiction... "},{"id":"en02-25","cd":"02","l":"DK","q":"According to Ho Chi Minh Thought, the human being is the most precious asset and the decisive factor in the success of the revolution; the people are the root of the country; the country takes the people as its root; only when the root is firm will the tree endure; the tower of victory is built on the foundation of _______.","o":[["A","Marxism–Leninism"],["B","the people"],["C","the Communist Party"],["D","culture"],["E","theory"]],"a":"B","g":"The course textbook states: “In Ho Chi Minh Thought, the human being is the most precious asset and the decisive factor in the success of the revolution; the people are the root of the country; the country takes the people as its root; only when the root is firm will the tree endure; the tower of victory is built on the foundation of the people”."},{"id":"en02-26","cd":"02","l":"DK","q":"The profound crisis of the line for national salvation in Vietnam at the end of the 19th and the beginning of the 20th century posed a practical question: by which path should the country be saved in order to achieve _______?","o":[["A","independence"],["B","civilisation"],["C","development"],["D","victory"],["E","integration"]],"a":"D","g":"The course textbook states: “However, the crisis of the line for national salvation was profound. A question arose from practice: by which path should the country be saved in order to achieve victory?”."},{"id":"en02-27","cd":"02","l":"DK","q":"The success of the Russian October Revolution of 1917 opened a new _______ in the history of humankind – the era of transition from capitalism to socialism on a world scale.","o":[["A","era"],["B","epoch"],["C","truth"],["D","thought"],["E","theory"]],"a":"A","g":"The course textbook states: “The Russian October Revolution opened a new era in the history of humankind – the era of transition from capitalism to socialism on a world scale”."},{"id":"en02-28","cd":"02","l":"DK","q":"Ho Chi Minh is a noble symbol of the integration of the cultural quintessence of East and West, with the view that culture is the goal and driving force of the revolution; it is necessary to preserve the nation's cultural character while absorbing the cultural quintessence of _______, in order to build a new culture for Vietnam.","o":[["A","the world"],["B","progress"],["C","humankind"],["D","modernity"],["E","tradition"]],"a":"C","g":"The course textbook states: “Ho Chi Minh is a noble symbol of the integration of the cultural quintessence of East and West... it is necessary to preserve the nation's cultural character while absorbing the cultural quintessence of humankind, in order to build a new culture for Vietnam.”"},{"id":"en02-29","cd":"02","l":"DK","q":"Ho Chi Minh affirmed: “Now there are many doctrines and many isms, but the most genuine, the most certain and the most revolutionary ism is _______”.","o":[["A","patriotism"],["B","nationalism"],["C","Confucianism"],["D","Leninism"],["E","socialism"]],"a":"D","g":"The course textbook quotes Ho Chi Minh: “As early as the late 1920s, Ho Chi Minh affirmed: ‘Now there are many doctrines and many isms, but the most genuine, the most certain and the most revolutionary ism is Leninism’”."},{"id":"en02-30","cd":"02","l":"DK","q":"Ho Chi Minh was the great organiser of the Vietnamese revolution; he turned revolutionary ideas and theory into vivid reality, while summarising revolutionary practice and supplementing and developing revolutionary _______.","o":[["A","movements"],["B","goals"],["C","theory"],["D","lines"],["E","strategy"]],"a":"C","g":"The course textbook states: “Ho Chi Minh was the great organiser of the Vietnamese revolution. He turned revolutionary ideas and theory into vivid reality, while summarising revolutionary practice and supplementing and developing revolutionary theory and ideas.”"},{"id":"en03-1","cd":"03","l":"DS","q":"Ho Chi Minh's participation in the anti-tax movement in Central Vietnam in 1908 showed that he had completely broken with all reformist ideas and accepted the path of revolutionary violence from that moment on.","o":[],"a":"S","g":"In the period before 1911, Ho Chi Minh formed his patriotic thought and his aspiration to seek a new path to national salvation. Although he took part in the anti-tax movement in Central Vietnam in 1908, clearly showing his patriotic thought in action, he was still in the process of “reflecting deeply on the Fatherland and the times” and “criticising, not approving of and not following the methods and tendencies of national salvation of those figures at the time”. This action was not yet a complete break with all reformist ideas or a decisive acceptance of the path of revolutionary violence, but one step in the process of searching for and discovering his own path."},{"id":"en03-2","cd":"03","l":"DS","q":"Ho Chi Minh's view that “the working people of all countries, including the working class, are all exploited and can be friends of one another; whereas imperialism and the colonialists everywhere are exploiters and enemies of the working people” formed immediately after he set foot in France in 1911.","o":[],"a":"S","g":"This awareness did not form immediately when he arrived in France in 1911. The course textbook states clearly that “From 1911 to 1917, starting from France, Ho Chi Minh went to many countries around the world. Through this journey, a new awareness formed in him”. This shows that it was the result of a long process of experience, observation and reflection over many years and across many countries, not an instant formation."},{"id":"en03-3","cd":"03","l":"DS","q":"Ho Chi Minh joined the French Socialist Party in 1919 mainly because he had a deep understanding of Marxism–Leninism and was determined to follow the path of proletarian revolution.","o":[],"a":"S","g":"The course textbook states that in 1919 he joined the Socialist Party of the French citizen class “because, in his view, it was the organisation pursuing the noble ideals of the Great French Revolution: Liberty, Equality, Fraternity”. Ho Chi Minh's finding and clearly defining the direction of the national liberation struggle along the path of proletarian revolution, through studying Lenin's Theses on the National and Colonial Questions, came later, in July 1920. Therefore, his initial joining of the French Socialist Party was not due to a deep understanding of Marxism–Leninism, but to the ideals of liberty, equality and fraternity."},{"id":"en03-4","cd":"03","l":"DS","q":"Ho Chi Minh's work “French Colonialism on Trial” and the newspaper “Le Paria” focused only on denouncing the crimes of the French colonialists, with no other purpose regarding the peoples of the colonies.","o":[],"a":"S","g":"Although works such as “French Colonialism on Trial” and the newspaper “Le Paria” aimed to condemn French colonialism, Ho Chi Minh's deeper aim was “to awaken the conscience of the French people and of progressive humankind, and to arouse the patriotism of the peoples of the colonial nations and of the Vietnamese nation”, as well as “to awaken the spirit of national liberation of the peoples of the colonies”. Thus they not only denounced crimes but also aimed to awaken and arouse the revolutionary spirit."},{"id":"en03-5","cd":"03","l":"DS","q":"The Party Central Committee Conference of October 1930 affirmed and further developed the first Political Platform drafted by Nguyen Ai Quoc, especially in giving greater weight to the national question than to the class question.","o":[],"a":"S","g":"On the contrary, the Party Central Committee Conference of October 1930 adopted a resolution holding that “the Party unification conference chaired by Nguyen Ai Quoc made many mistakes, ‘caring only about anti-imperialism and forgetting the interests of class struggle, which is a very dangerous thing’” and decided to “annul the Party's Political Programme, Strategy and Statute”. This shows that the conference criticised, did not accept and rejected the views of the first Political Platform, rather than affirming or developing them."},{"id":"en03-6","cd":"03","l":"DS","q":"Ho Chi Minh's slogan “Nothing is more precious than independence and freedom” was put forward only in the context of the resistance war against the US for national salvation and has no overarching value for the whole Vietnamese revolutionary cause.","o":[],"a":"S","g":"Although the saying “Nothing is more precious than independence and freedom” was put forward by Ho Chi Minh in the Appeal to compatriots and combatants throughout the country on 17 July 1966, in the context of the resistance war against the US for national salvation, it is described as “a truth of the era”. The spirit of independence and freedom is an overarching goal throughout Ho Chi Minh's entire process of seeking a path to national salvation, liberating the nation and building the country. Therefore, the claim that it was “put forward only” and “has no overarching value” is false."},{"id":"en03-7","cd":"03","l":"D1","q":"What was the deepest underlying reason why Ho Chi Minh, although admiring the patriotism of predecessors such as Phan Boi Chau, Phan Chau Trinh and Hoang Hoa Tham, nevertheless “wisely criticised, did not approve of and did not follow” their methods of national salvation?","o":[["A","He wanted to prove that he had his own path, far more original."],["B","He saw that those methods were not capable of solving at the root the issue of national independence and the destiny of the country."],["C","He did not trust the leadership capacity of his predecessors."],["D","He believed those movements had completely failed and had no value as a reference."],["E","He wanted to seek support from Western powers without going through domestic movements."]],"a":"B","g":"The course textbook states clearly that Ho Chi Minh “reflected deeply on the Fatherland and the times” and “did not approve of and did not follow the methods and tendencies of national salvation of those figures at the time”. This implies that he recognised the inherent limitations of those paths, which could not meet the demands of a thorough national liberation, so he “wanted to find out what lay hidden behind the strength of the enemy and to learn from the experience of world revolution” in order to find a new path. The other options give reasons not supported by the course textbook or are inaccurate inferences about his motives."},{"id":"en03-8","cd":"03","l":"D1","q":"What was the most important milestone marking the “close combination of patriotism with the proletarian revolutionary stance” in Ho Chi Minh's thought?","o":[["A","Sending the Demands of the Annamese People to the Versailles Conference (1919)."],["B","Joining the French Socialist Party (1919)."],["C","Studying V.I. Lenin's First Draft of Theses on the National and Colonial Questions (July 1920)."],["D","Taking part in founding the French Communist Party at the Congress in Tours (December 1920)."],["E","Founding the newspaper Le Paria (1922)."]],"a":"D","g":"The course textbook clearly affirms: “With new revolutionary awareness, Ho Chi Minh, together with the left wing of the French Socialist Party at the Congress in Tours (25–30 December 1920), voted in favour of the Communist International (Comintern), took part in founding the French Communist Party and became the first Vietnamese communist. This was an important turning point in Ho Chi Minh's life, the turning point at which patriotism was closely combined with the proletarian revolutionary stance”. Although studying Lenin's Theses (option C) was a prerequisite, the act of voting and taking part in founding the French Communist Party was the concrete realisation, the official milestone of th"},{"id":"en03-9","cd":"03","l":"D1","q":"The first Political Platform of the Communist Party of Vietnam, drafted by Ho Chi Minh, thoroughly resolved the crisis of the line for national salvation by setting out which strategic goal?","o":[["A","Focusing only on overthrowing French imperialism to win national independence."],["B","Carrying out the bourgeois-democratic revolution and the land revolution in order to advance to communist society."],["C","Immediately establishing a democratic republican government and skipping the stage of national revolution."],["D","Prioritising class struggle over the issue of national liberation."],["E","Calling for help from Western capitalist countries to escape foreign domination."]],"a":"B","g":"The course textbook states clearly that the first Political Platform of the Communist Party of Vietnam set out the goal and path of the revolution as “to carry out the bourgeois-democratic revolution and the land revolution in order to advance to communist society”. It was this line that ended the crisis of the line for national salvation. The other options do not correctly reflect, or distort, the core content of the Platform."},{"id":"en03-10","cd":"03","l":"D1","q":"What most clearly showed the creative application and development of Marxism–Leninism in the first Political Platform of the Communist Party of Vietnam drafted by Ho Chi Minh?","o":[["A","Following the directives of the Communist International (Comintern) completely, without adjustment."],["B","Denying the role of the working class in leading the revolution."],["C","Resolving the class–nation–international relationship in the line of the Vietnamese revolution."],["D","Prioritising the task of socialist revolution over the national democratic task."],["E","Upholding the role of landlords and the national bourgeoisie in the revolutionary alliance."]],"a":"C","g":"The course textbook affirms: “This first Political Platform clearly showed the creative application and development of Marxism–Leninism in resolving the class–nation–international relationship in the line of the Vietnamese revolution”. This is the core creative point of the Platform, differing from a dogmatic approach."},{"id":"en03-11","cd":"03","l":"D1","q":"The Party Central Committee Conference of May 1941 at Pac Bo made a breakthrough decision in line with Ho Chi Minh Thought, namely:","o":[["A","Continuing to keep the agrarian revolution slogan as the focus."],["B","Placing the task of class struggle first, above national interests."],["C","Temporarily setting aside the agrarian revolution slogan and placing the task of national liberation first."],["D","Deciding to establish the Government of the Federation of Indochinese Democratic Republics."],["E","Criticising and rejecting the establishment of the Viet Minh Front."]],"a":"C","g":"The Party Central Committee Conference of May 1941, chaired by Ho Chi Minh, “placed the task of national liberation first” and “temporarily set aside the agrarian revolution slogan”. At the same time, the Resolution also affirmed: “At this moment, the interest of national liberation is above everything” and “the interests of a section or of a class must be subordinated to the life and death, the survival of the country and of the nation”. This shows an important strategic shift."},{"id":"en03-12","cd":"03","l":"D1","q":"What was the core aim of the strategy “Remain constant, respond to myriad changes” (dĩ bất biến, ứng vạn biến) that Ho Chi Minh directed in the period 1945–1946?","o":[["A","Prolonging time to wait for support from allied countries."],["B","Holding firm to the goal of struggling for national independence and sovereignty, and for freedom, a life of plenty and happiness for the people."],["C","Focusing only on sowing division among the imperialist forces without attending to building internal strength."],["D","Completely abandoning principles to achieve peace at any cost."],["E","Avoiding all armed conflict even at the cost of sacrificing part of national sovereignty."]],"a":"B","g":"The course textbook states clearly that, with the motto “Remain constant, respond to myriad changes” (dĩ bất biến, ứng vạn biến), Ho Chi Minh “held firm to the goal of struggling for national independence and sovereignty, and for freedom, a life of plenty and happiness for the people, by means of flexible and supple revolutionary tactics”. The other options do not correctly reflect the essence of this strategy or distort its core aim."},{"id":"en03-13","cd":"03","l":"SAI","q":"Which of the following statements is NOT correct about the influence of family and homeland on Ho Chi Minh in the period before 1911?","o":[["A","Nguyen Sinh Sac, his father, obtained the Pho bang degree and had a deep patriotism and love for the people."],["B","His mother, Hoang Thi Loan, was a typical Vietnamese woman with the virtues of kindness, diligence and capability."],["C","His homeland, Nghe An, is a land rich in patriotic tradition, with many national heroes."],["D","Ho Chi Minh's family belonged to the wealthy feudal landlord class."],["E","Nguyen Sinh Sac often taught his children not to take the manners of a mandarin's household as the manners of their own household."]],"a":"D","g":"The course textbook states clearly that Ho Chi Minh was born into a “scholar-laureate” family. Nguyen Sinh Sac obtained the Pho bang degree, and his patriotism and love for the people had a great influence on Ho Chi Minh. Hoang Thi Loan is described as “a typical Vietnamese mother with the virtues of kindness, diligence and capability”. Nghe An is a land of “sacred soil and outstanding people, rich in patriotic tradition”. Nguyen Sinh Sac's confiding that “Officialdom is slavery among slaves, and even more slavish” and his teaching his children “Do not take the manners of a mandarin's household as the manners of our household” further confirm that the family did not belong at all to the weal"},{"id":"en03-14","cd":"03","l":"SAI","q":"Which of the characteristics below does NOT belong to the process by which Ho Chi Minh formed his thought on national salvation and national liberation along the path of proletarian revolution in the period 1911–1920?","o":[["A","Going to many countries around the world to understand the nature of colonialism."],["B","Forming an awareness of the solidarity among the working people of all countries."],["C","Becoming the first Vietnamese communist."],["D","Advocating the immediate founding of a communist party to lead armed violence in Vietnam."],["E","Presenting the Demands of the Annamese People at the Versailles Conference."]],"a":"D","g":"In the period 1911–1920, Ho Chi Minh went to many countries to understand the nature of colonialism and formed an awareness of the solidarity of the working people. He became the first Vietnamese communist at the end of 1920 and sent the Demands of the Annamese People to the Versailles Conference in 1919. However, the course textbook makes no mention of his advocating the immediate founding of a communist party to lead armed violence in Vietnam in this period. The founding of the Communist Party of Vietnam took place later (1930), and it was a long process of preparation, not an “immediate” policy in this period."},{"id":"en03-15","cd":"03","l":"SAI","q":"Which of the following activities does NOT belong to the period 1920–1930, the period in which the basic contents of his thought on the Vietnamese revolution were formed?","o":[["A","Founding the French-language newspaper Le Paria."],["B","Publishing the work “French Colonialism on Trial”."],["C","Founding the Vietnam Revolutionary Youth League."],["D","Chairing the Conference to unify the Vietnamese communist organisations."],["E","Founding the Vietnam Propaganda Liberation Army Unit."]],"a":"E","g":"Founding the newspaper Le Paria (1922), publishing the work “French Colonialism on Trial” (1925), founding the Vietnam Revolutionary Youth League (June 1925) and chairing the Conference to unify the Vietnamese communist organisations (early 1930) all belong to the period 1920–1930. However, the Vietnam Propaganda Liberation Army Unit was founded on 22 December 1944, in the period 1941–1969. Therefore, option E is incorrect."},{"id":"en03-16","cd":"03","l":"SAI","q":"Which statement below does NOT correctly reflect the challenges that Ho Chi Minh Thought faced in the period 1920–1941?","o":[["A","Being repressed and arrested by the enemy."],["B","Being misunderstood and criticised by some people in the Communist International (Comintern) and the Indochinese Communist Party."],["C","The first Political Platform being regarded as “rightist” and “nationalist”."],["D","The Party Central Committee Conference of October 1930 adopting a resolution to “annul the Party's Political Programme, Strategy and Statute”."],["E","His entire revolutionary line was completely rejected by the Communist International and never accepted again."]],"a":"E","g":"The course textbook shows that Ho Chi Minh faced many challenges, including repression by the enemy (escaping from a British colonial prison), misunderstanding and criticism from within the Communist International (Comintern) and the Indochinese Communist Party, the Platform being regarded as “rightist” and “nationalist”, and the Party Central Committee Conference of October 1930 deciding to “annul the Party's Political Programme, Strategy and Statute”. However, his line was affirmed by the Indochinese Communist Party and became the guiding factor of the Vietnamese revolution from the Party Central Committee Conference of May 1941. In fact, the strategic shift at the Conferences of November "},{"id":"en03-17","cd":"03","l":"SAI","q":"Which of the following goals is NOT one of the two strategic tasks that Ho Chi Minh identified and led the implementation of in the period 1954–1969?","o":[["A","Building socialism in the North."],["B","Continuing the people's national democratic revolution in the South."],["C","Independence and reunification of the country for all human life."],["D","Strengthening military cooperation with France to defend the South."],["E","Supplementing and perfecting the system of basic views of the Vietnamese revolution in many fields."]],"a":"D","g":"In the period 1954–1969, Ho Chi Minh identified and led the implementation of the line of “simultaneously carrying out the two strategic tasks of the Vietnamese revolution: building socialism in the North and continuing the people's national democratic revolution in the South”. The ultimate goal was “independence and reunification of the country”. At the same time, he also “supplemented and perfected the system of basic views of the Vietnamese revolution in all fields”. “Strengthening military cooperation with France” was completely contrary to the line and goals of the Vietnamese revolution in this period, when France had withdrawn from Vietnam after the Dien Bien Phu victory in 1954."},{"id":"en03-18","cd":"03","l":"SAI","q":"Which thesis below does NOT correctly reflect the core content of the Appeal for National Resistance (19 December 1946) issued by Ho Chi Minh?","o":[["A","Expressing the will and determination “to sacrifice everything, absolutely refusing to lose the country, absolutely refusing to be enslaved”."],["B","Clearly setting out the line of a protracted, all-people, all-round and self-reliant resistance."],["C","Calling on the French army to return to Indochina to support the revolutionary government."],["D","Being the sacred oath of the Vietnamese nation to defend the Fatherland."],["E","Being a generalised summary of the line of resistance against the French colonialists."]],"a":"C","g":"The course textbook states clearly that the Appeal for National Resistance (19 December 1946) “expressed in general terms the line of resistance against the French colonialists” and was “the sacred oath of the Vietnamese nation to defend the Fatherland, with the will and determination to sacrifice everything, absolutely refusing to lose the country, absolutely refusing to be enslaved”. The line of resistance was “protracted, all-people, all-round and self-reliant”. “Calling on the French army to return to Indochina” is completely absurd and contrary to the spirit of resistance against the French colonialists."},{"id":"en03-19","cd":"03","l":"NH","q":"Which of the following factors contributed to forming Ho Chi Minh's patriotic thought and his aspiration to seek a new path to national salvation in the period before 1911?","o":[["A","The patriotic tradition of his homeland, Nghe An."],["B","The patriotism and personality of Nguyen Sinh Sac."],["C","Contact with progressive books and newspapers, and studying under learned Confucian scholars."],["D","The influence of joining the French Socialist Party."],["E","Studying Lenin's Theses on the National and Colonial Questions."]],"a":"ABC","g":"The course textbook states that in the period before 1911, Ho Chi Minh absorbed “the fine traditions of his homeland, family and nation”, including Nghe An's “patriotic tradition”, “the patriotism, love for the people and personality of Nguyen Sinh Sac” and “the love of his mother, Hoang Thi Loan”. In addition, he also “studied under learned Confucian scholars and came into contact with many kinds of progressive books and newspapers”. Options D and E belong to the period after 1911."},{"id":"en03-20","cd":"03","l":"NH","q":"In the period 1911–1920, which of Ho Chi Minh's activities showed the maturing of his awareness and his steadfastness in seeking a path to national salvation in the direction of proletarian revolution?","o":[["A","Sending the Demands of the Annamese People to the Versailles Conference."],["B","Taking part in the French workers' movement."],["C","Studying in depth V.I. Lenin's First Draft of Theses on the National and Colonial Questions."],["D","Founding the Vietnam Revolutionary Youth League."],["E","Chairing the Party Central Committee Conference of May 1941."]],"a":"ABC","g":"In the period 1911–1920, Ho Chi Minh took part in the French workers' movement, sent the Demands of the Annamese People to the Versailles Conference, and found the direction of the national liberation struggle along the path of proletarian revolution through studying Lenin's Theses on the National and Colonial Questions. Option D (founding the Vietnam Revolutionary Youth League) belongs to 1925, and option E (the Party Central Committee Conference of May 1941) belongs to 1941."},{"id":"en03-21","cd":"03","l":"NH","q":"What significance did Ho Chi Minh's work “The Revolutionary Path” (1927) have for the preparation for the founding of the Communist Party of Vietnam?","o":[["A","It summarised the experience of the English, French and American bourgeois revolutions."],["B","It made clear that the Vietnamese revolution must have a Communist Party with Marxism–Leninism as its core to lead it."],["C","It identified the force of the national liberation revolution as the entire Vietnamese people, with the worker–peasant alliance as the core."],["D","It prepared in every respect – politically, ideologically and organisationally – for the founding of the Communist Party of Vietnam."],["E","It was the first Political Platform of the Communist Party of Vietnam."]],"a":"ABCD","g":"The course textbook states clearly that the work “The Revolutionary Path” is “a summary of the experience of the English, French and American bourgeois revolutions, and above all of the experience of the Russian October Revolution”. He made clear that “the Vietnamese revolution must have a Communist Party with Marxism–Leninism as its core to lead it; the force of the national liberation revolution is the entire Vietnamese people, in which the worker–peasant alliance is the core”. The work is regarded as “preparation in every respect – political, ideological and organisational – for the founding of the Communist Party of Vietnam”. However, the first Political Platform of the Communist Party o"},{"id":"en03-22","cd":"03","l":"NH","q":"Which contents were affirmed in the first Political Platform of the Communist Party of Vietnam (early 1930)?","o":[["A","The goal “to carry out the bourgeois-democratic revolution and the land revolution in order to advance to communist society”."],["B","Affirming the leadership of the Communist Party of Vietnam."],["C","The worker–peasant alliance is the core force."],["D","The Vietnamese revolution is a part of the world revolution."],["E","Temporarily setting aside the agrarian revolution slogan."]],"a":"ABCD","g":"The course textbook states that the first Political Platform of the Communist Party of Vietnam set out the goal “to carry out the bourgeois-democratic revolution and the land revolution in order to advance to communist society”, “to overthrow French imperialism, Annamese feudalism and the counter-revolutionary bourgeoisie”, raising high the banner of national independence and socialism; it affirmed the leadership of the Communist Party of Vietnam; the worker–peasant alliance is the core force; and the Vietnamese revolution is a part of the world revolution. “Temporarily setting aside the agrarian revolution slogan” was a decision of the Party Central Committee Conference of May 1941, not par"},{"id":"en03-23","cd":"03","l":"NH","q":"Which important strategic and tactical adjustments of the Vietnamese revolution were further completed at the Party Central Committee Conference of May 1941 at Pac Bo?","o":[["A","Placing the task of national liberation first."],["B","Temporarily setting aside the agrarian revolution slogan."],["C","Dropping the issue of establishing the Government of the Federation of Indochinese Democratic Republics."],["D","Advocating the establishment of a People's Government of the Democratic Republic of Vietnam."],["E","Identifying the worker–peasant alliance as the only force of the revolution."]],"a":"ABCD","g":"The Party Central Committee Conference of May 1941 “placed the task of national liberation first”. The Conference's Resolution “temporarily set aside the agrarian revolution slogan, abolished the issue of establishing the Government of the Federation of Indochinese Democratic Republics, and replaced it with the policy of establishing a People's Government of the Democratic Republic of Vietnam”. At the same time, the Conference also “put forward the policy of establishing the Viet Minh Front, realising great national unity on the basis of the worker–peasant alliance as the core”. Option E is incorrect because the worker–peasant alliance is the core, but the aim is “realising great national un"},{"id":"en03-24","cd":"03","l":"NH","q":"Which successes of the Vietnamese revolution in the period 1941–1969 are regarded as the first great victory of Marxism–Leninism and Ho Chi Minh Thought in Vietnam?","o":[["A","The birth of the Viet Minh Front."],["B","The founding of the Vietnam Propaganda Liberation Army Unit."],["C","The victory of the August Revolution of 1945."],["D","Ho Chi Minh reading the Declaration of Independence, giving birth to the Democratic Republic of Vietnam."],["E","The Party Central Committee Conference of May 1941 placing the task of national liberation first."]],"a":"CD","g":"The course textbook states clearly: “The success of the August Revolution of 1945 overthrew the feudal regime of more than a thousand years, overthrew the domination of the French colonialists of more than 80 years, and regained national independence directly from the hands of the Japanese fascists. This was the first great victory of Marxism–Leninism and Ho Chi Minh Thought in Vietnam”. Following that, “On 2 September 1945, at Ba Dinh Square, Hanoi, on behalf of the Provisional Government, Ho Chi Minh read the Declaration of Independence, giving birth to the Democratic Republic of Vietnam”, a direct consequence of the August Revolution. Options A, B and E are important events, but they are "},{"id":"en03-25","cd":"03","l":"DK","q":"After studying V.I. Lenin's “First Draft of Theses on the National and Colonial Questions” in July 1920, Ho Chi Minh found and clearly defined the direction of the Vietnamese national liberation struggle along the path of _______.","o":[["A","bourgeois revolution"],["B","peaceful reform"],["C","proletarian revolution"],["D","pure nationalism"],["E","imperialism"]],"a":"C","g":"The course textbook states: “Ho Chi Minh found and clearly defined the direction of the Vietnamese national liberation struggle along the path of proletarian revolution through studying V.I. Lenin's First Draft of Theses on the National and Colonial Questions (for presentation at the Second Congress of the Communist International)... in July 1920”."},{"id":"en03-26","cd":"03","l":"DK","q":"To prepare in every respect – politically, ideologically and organisationally – for the founding of the Communist Party of Vietnam, Ho Chi Minh compiled and published the work _______ in 1927 in Guangzhou, China.","o":[["A","“French Colonialism on Trial”"],["B","“The Path to Liberation”"],["C","“Declaration of Independence”"],["D","“The Revolutionary Path”"],["E","“Appeal for Nationwide Resistance”"]],"a":"D","g":"The course textbook states clearly: “These core contents and many issues of the line and methods of the Vietnamese revolution were expressed in his work ‘The Revolutionary Path’, published in 1927 in Guangzhou, China. The work was preparation in every respect – political, ideological and organisational – for the founding of the Communist Party of Vietnam”."},{"id":"en03-27","cd":"03","l":"DK","q":"The Party Central Committee Conference of October 1930 adopted the Resolution to “annul the Party's Political Programme, Strategy and Statute” and renamed the Communist Party of Vietnam the _______.","o":[["A","Vietnam Workers' Party"],["B","Indochinese Communist Party"],["C","Vietnam Democratic Party"],["D","Vietnam Socialist Party"],["E","Viet Minh Front"]],"a":"B","g":"The course textbook states that the Party Central Committee Conference held in October 1930 “dropped the name Communist Party of Vietnam determined by Ho Chi Minh and the participants in the Party founding conference, and adopted the name Indochinese Communist Party”."},{"id":"en03-28","cd":"03","l":"DK","q":"Ho Chi Minh Thought became the guiding factor of the Vietnamese revolution from the Party Central Committee Conference of May 1941, where he affirmed: “At this moment, the interest of _______ is above everything.”","o":[["A","the working class"],["B","the worker–peasant alliance"],["C","national liberation"],["D","the international proletariat"],["E","the Party"]],"a":"C","g":"At the Conference of the Party Central Committee in May 1941, Ho Chi Minh “affirmed clearly: ‘At this moment, the interest of national liberation is above everything. We must unite to overthrow the imperialists and the Vietnamese traitors in order to save our race from boiling water and burning fire’”."},{"id":"en03-29","cd":"03","l":"DK","q":"To cope with the situation “hanging by a thread” after the August Revolution, Ho Chi Minh successfully directed flexible and supple revolutionary tactics with the famous motto _______.","o":[["A","“Independence, freedom”"],["B","“Remain constant, respond to myriad changes”"],["C","“More friends, fewer enemies”"],["D","“Self-reliance”"],["E","“Nothing is more precious than independence and freedom”"]],"a":"B","g":"The course textbook states clearly: “With the motto ‘Remain constant, respond to myriad changes’ (dĩ bất biến, ứng vạn biến), holding firm to the goal of struggling for national independence and sovereignty, and for freedom, a life of plenty and happiness for the people, by means of flexible and supple revolutionary tactics, he successfully directed the tactics...”."},{"id":"en03-30","cd":"03","l":"DK","q":"Ho Chi Minh's final wish before he passed away was: “Our whole Party and whole people unite and strive to build a peaceful, unified, independent, democratic and prosperous Vietnam, and to make a worthy contribution to the cause of world _______”.","o":[["A","industrialisation"],["B","modernisation"],["C","revolution"],["D","integration"],["E","economic development"]],"a":"C","g":"In his Testament, Ho Chi Minh expressed the wish: “Our whole Party and whole people unite and strive to build a peaceful, unified, independent, democratic and prosperous Vietnam, and to make a worthy contribution to the cause of world revolution”."},{"id":"en04-1","cd":"04","l":"DS","q":"Ho Chi Minh's thought on the right of nations to self-determination took clear shape only after the August Revolution of 1945.","o":[],"a":"S","g":"Ho Chi Minh's thought on the rights of colonial nations, first and foremost the rights to equality and freedom, first took shape with his sending of the Claims of the Annamese People to the Versailles Conference in 1919. This shows that the thought existed very early, before the August Revolution of 1945."},{"id":"en04-2","cd":"04","l":"DS","q":"In asserting that \"If the country is independent but the people do not enjoy happiness and freedom, then independence has no meaning whatsoever\", Ho Chi Minh completely rejected Sun Yat-sen's doctrine of the \"Three Principles of the People\".","o":[],"a":"S","g":"The course textbook states that Ho Chi Minh \"highly appreciated Sun Yat-sen's doctrine of the 'Three Principles of the People' on independence and freedom: an independent nation, free civil rights and a happy livelihood for the people\". The statement above only emphasises that independence must go hand in hand with the freedom and happiness of the people; it does not reject the doctrine of the Three Principles, which he held in high regard."},{"id":"en04-3","cd":"04","l":"DS","q":"The idea that national independence is tied to the unity of the Fatherland and territorial integrity appeared clearly in Ho Chi Minh's thought only after the signing of the Geneva Accords in 1954.","o":[],"a":"S","g":"Although he continued to struggle persistently for the reunification of the Fatherland after the Geneva Accords of 1954, this idea was expressed very early. Specifically, in the Letter to Compatriots in the South (Nam Bo) of 1946, Ho Chi Minh affirmed: \"The compatriots of Nam Bo are citizens of Vietnam. Rivers may dry up, mountains may wear away, but that truth will never change\", in order to oppose the French colonialists' scheme of dividing the country through an \"autonomous Cochinchina\". This proves that the idea existed before 1954 and runs consistently through his thought."},{"id":"en04-4","cd":"04","l":"DS","q":"The goal \"Make Vietnam completely independent\" in the Party's Brief Political Platform (1930) expressed Ho Chi Minh's thought that national independence must be genuine, complete and thorough.","o":[],"a":"D","g":"The goal \"Make Vietnam completely independent\" laid the foundation for building an independence that is not merely nominal but extends to all fields (foreign affairs, military matters, finance), as he emphasised when speaking of a genuine, complete and thorough independence. This was an important first step towards achieving comprehensive independence."},{"id":"en04-5","cd":"04","l":"DS","q":"The slogan \"Nothing is more precious than independence and freedom\" (17 July 1966) was put forward by Ho Chi Minh in the context of the US imperialists expanding their war of destruction against the North and carrying out the \"Local War\" strategy in the South.","o":[],"a":"D","g":"The course textbook states clearly: \"In 1965, the US imperialists stepped up and expanded the war in Vietnam: they poured American expeditionary troops and the troops of their satellites into the South to carry out the 'Local War' strategy and waged a war of destruction against the North. In those difficult circumstances and that fierce war, Ho Chi Minh stated a truth of the era... 'Nothing is more precious than independence and freedom'\". The year 1965 is the context of the US expansion of the war; the statement was made by Ho Chi Minh on 17 July 1966, in the Appeal to Compatriots and Fighters Nationwide."},{"id":"en04-6","cd":"04","l":"DS","q":"In his 1946 appeal to the United Nations, Ho Chi Minh emphasised only the Vietnamese people's desire for peace, without mentioning their determination to defend independence.","o":[],"a":"S","g":"The course textbook clearly records: \"In his appeal to the United Nations in 1946, Ho Chi Minh once again affirmed: 'Our people sincerely desire peace. But our people are also determined to fight to the end to defend the most sacred rights: territorial integrity for the Fatherland and independence for the country'\". This shows that he emphasised both the desire for peace and the determination to fight to defend independence."},{"id":"en04-7","cd":"04","l":"D1","q":"Which of the following events shows most clearly the first formation of Ho Chi Minh's thought on the rights of colonial nations, especially the rights to equality and freedom?","o":[["A","His taking part in founding the French Communist Party in 1920."],["B","His sending of the Claims of the Annamese People to the Versailles Conference in 1919."],["C","The birth of the Party's Brief Political Platform in 1930."],["D","The declaration of independence of the Democratic Republic of Vietnam in 1945."],["E","His going to the Soviet Union to learn about Marxism–Leninism."]],"a":"B","g":"The course textbook states clearly: \"In 1919... on behalf of Vietnamese patriots, Ho Chi Minh sent the Conference the Claims of the Annamese People... The Claims were not accepted by the Conference, but this event shows that, for the first time, Ho Chi Minh's thought on the rights of colonial nations, first and foremost the rights to equality and freedom, had taken shape\"."},{"id":"en04-8","cd":"04","l":"D1","q":"Through which goals in the Party's Brief Political Platform (1930) is Ho Chi Minh's thought on the link between national independence and the freedom and happiness of the people consistently expressed?","o":[["A","Focusing only on overthrowing the imperialists and colonialists."],["B","Including political goals and specific social goals aimed at improving the people's lives."],["C","Stopping at declaring independence in legal terms."],["D","Giving priority to the right of self-determination in foreign affairs and military matters."],["E","Focusing on building an independent capitalist economy."]],"a":"B","g":"In the Party's Brief Political Platform (1930), Ho Chi Minh not only set the political goals \"Overthrow French imperialism and the feudalists. Make Vietnam completely independent\", but also put forward social goals such as \"Abolish all kinds of public debts… Confiscate all the land of the imperialists, turn it into public property and distribute it to poor peasants. Abolish corvee and taxes for poor peasants… Enforce the law on the 8-hour working day\". This shows the close link between national independence and the freedom, happiness and interests of the people from the very beginning."},{"id":"en04-9","cd":"04","l":"D1","q":"What does Ho Chi Minh's statement after the August Revolution of 1945, \"If the country is independent but the people do not enjoy happiness and freedom, then independence has no meaning whatsoever\", mainly affirm?","o":[["A","National independence must be tied to support from the socialist countries."],["B","The importance of building a strong army."],["C","National independence must be tied to the people's genuine freedom and happiness."],["D","National independence is meaningful only with territorial integrity."],["E","The need to carry out the socialist revolution quickly."]],"a":"C","g":"This statement is quoted in the section \"National independence must be tied to the freedom and happiness of the people\". He emphasised that the ultimate purpose of independence is to bring a good life to the people, not merely to be a political title."},{"id":"en04-10","cd":"04","l":"D1","q":"When Ho Chi Minh affirmed, in the 1946 Letter to Compatriots in the South (Nam Bo), that \"Rivers may dry up, mountains may wear away, but that truth will never change\", what did he want to emphasise?","o":[["A","The eternal beauty of Vietnam's nature."],["B","The spirit of unity of the whole nation in all circumstances."],["C","The immutability of the truth that Nam Bo is an inseparable part of Vietnam."],["D","The determination to fight to the end to defend national independence."],["E","The leading role of the Communist Party of Vietnam."]],"a":"C","g":"This letter was written in the context of the French colonialists setting up the so-called \"autonomous Cochinchina\" in order to divide our country. Ho Chi Minh affirmed \"The compatriots of Nam Bo are citizens of Vietnam. Rivers may dry up, mountains may wear away, but that truth will never change\" to reject the scheme of division and to affirm the unity and territorial integrity of Vietnam."},{"id":"en04-11","cd":"04","l":"D1","q":"According to Ho Chi Minh Thought, which of the following is the most important criterion for distinguishing a \"genuine independence\" from a \"sham independence\"?","o":[["A","The ability to establish diplomatic relations with the great powers."],["B","Having a native government elected by the people."],["C","The nation's thorough right of self-determination in foreign affairs, military matters and finance."],["D","Recognition by the international community."],["E","The banning of all activities of the imperialist forces on the national territory."]],"a":"C","g":"The course textbook emphasises: \"if, under independence, the people of the nation have no right of self-determination in foreign affairs, no army of their own and no finances of their own…, then such independence has no meaning whatsoever\". These are precisely the core elements that distinguish genuine independence from the sham independence with which the colonialists and imperialists deceived the people."},{"id":"en04-12","cd":"04","l":"D1","q":"Besides solemnly proclaiming independence, through which content does Ho Chi Minh's 1945 Declaration of Independence also express the strong will and determination of the Vietnamese nation?","o":[["A","Calling for support from the Allied great powers."],["B","Presenting a detailed plan for economic development after independence."],["C","Affirming the right to enjoy freedom and independence, and at the same time the determination to defend that right at all costs."],["D","Setting out the terms for ending French colonial rule."],["E","Analysing the international context favourable to Vietnam."]],"a":"C","g":"The course textbook clearly records that in the 1945 Declaration of Independence, Ho Chi Minh declared: \"Vietnam has the right to enjoy freedom and independence, and has in fact become a free and independent country. The entire Vietnamese people are determined to devote all their spirit and strength, their lives and property to firmly safeguarding that right to freedom and independence\". This expresses the will and determination to defend independence."},{"id":"en04-13","cd":"04","l":"SAI","q":"Among Ho Chi Minh's statements and actions, which of the following does NOT reflect the thought that national independence must be tied to the freedom and happiness of the people?","o":[["A","Sending the Claims of the Annamese People, demanding freedoms and democratic rights for the people of Indochina."],["B","Setting out in the Party's Brief Political Platform goals such as abolishing corvee and taxes for poor peasants and enforcing the law on the 8-hour working day."],["C","Affirming \"If the country is independent but the people do not enjoy happiness and freedom, then independence has no meaning whatsoever\"."],["D","Calling on the great powers for aid to develop the economy and secure the people's livelihood."],["E","Setting the requirements \"Make sure the people have food. Make sure the people have clothing. Make sure the people have housing. Make sure the people have education\" after the August Revolution."]],"a":"D","g":"Options A, B, C and E all reflect, directly or indirectly, the link between national independence and the freedom and happiness of the people. Option D, \"Calling on the great powers for aid\", is not mentioned in the course textbook as part of this thought; the main thing was that he himself took the initiative in putting forward self-reliant solutions to secure the people's livelihood."},{"id":"en04-14","cd":"04","l":"SAI","q":"Which of the following is NOT among the arguments and grounds used by Ho Chi Minh to affirm the sacred and immutable right of nations to independence and freedom?","o":[["A","The history of building and defending the country of the Vietnamese nation, with its patriotic tradition."],["B","The rights to freedom and equality and the human rights recorded in the 1776 Declaration of Independence of the American revolution."],["C","The 1791 Declaration of the Rights of Man and of the Citizen of the French Revolution."],["D","The international human rights treaties later promulgated by the United Nations."],["E","The great aspiration of the Vietnamese nation for independence for the nation and freedom for the people."]],"a":"D","g":"Ho Chi Minh based himself on Vietnam's historical tradition, the 1776 Declaration of Independence of the American revolution and the 1791 Declaration of the Rights of Man and of the Citizen of the French Revolution to affirm the rights of nations. The international treaties of the United Nations (founded after the Second World War) are not mentioned in the course textbook as grounds he used in forming this thought."},{"id":"en04-15","cd":"04","l":"SAI","q":"Which of the following historical events does NOT directly express the determination of Ho Chi Minh and the Vietnamese people to defend national independence after 1945?","o":[["A","The 1946 appeal to the United Nations on defending territorial integrity and independence."],["B","The Appeal for Nationwide Resistance of 19 December 1946, with the resolve \"we would rather sacrifice everything; we will never accept losing our country\"."],["C","The declaration \"Vietnam is one, the Vietnamese nation is one\" in February 1958."],["D","Ho Chi Minh's sending of the Claims of the Annamese People to the Versailles Conference in 1919."],["E","The slogan \"Nothing is more precious than independence and freedom\" of 17 July 1966."]],"a":"D","g":"Options A, B, C and E are all events and statements after 1945 that express the determination to defend national independence and the unity of the country. Option D is an event of 1919, before Vietnam won independence in 1945; it belongs to the period in which the thought was formed, not to the defence of an independence already won."},{"id":"en04-16","cd":"04","l":"SAI","q":"According to Ho Chi Minh's thought on genuine, complete and thorough independence, which of the following is NOT a sign of a country with sham independence?","o":[["A","Having no right of self-determination in foreign affairs."],["B","Having a native puppet government set up by the colonialists."],["C","Having no army of its own."],["D","Having no finances of its own."],["E","Having equal diplomatic relations with the great powers."]],"a":"E","g":"The course textbook describes sham independence as the situation in which \"the colonialists and imperialists often resort to demagogic ploys, setting up native puppet governments and propagandising a so-called sham 'independence and freedom'\". He also emphasised that genuine independence must include the right of self-determination in foreign affairs, an army of its own and finances of its own. Therefore, lacking these rights is a sign of sham independence (A, C, D). Having a puppet government (B) is also a sign. By contrast, \"having equal diplomatic relations with the great powers\" is an expression of the right of self-determination in foreign affairs; it belongs to genuine independence, no"},{"id":"en04-17","cd":"04","l":"SAI","q":"According to Ho Chi Minh, the following measures all contribute to achieving the goal \"Make sure the people have food, clothing, housing and education\" after the August Revolution of 1945, EXCEPT:","o":[["A","Abolishing all kinds of public debts."],["B","Confiscating all the land of the imperialists, turning it into public property and distributing it to poor peasants."],["C","Enforcing the law on the 8-hour working day."],["D","Overthrowing French imperialism and the feudalists."],["E","Abolishing corvee and taxes for poor peasants."]],"a":"D","g":"Options A, B, C and E are all concrete measures concerning the people's livelihood put forward by Ho Chi Minh in the Party's Brief Political Platform of 1930 to improve the people's lives directly, thereby contributing to the goal of \"food, clothing, housing and education\" after the August Revolution. Option D, \"Overthrowing French imperialism and the feudalists\", is the basic political goal for winning national independence; it is a precondition, but not a direct measure to \"make sure the people have food, clothing...\" like the other options."},{"id":"en04-18","cd":"04","l":"SAI","q":"Which of the following statements does NOT correctly reflect the content of Ho Chi Minh's thought on national independence as presented in the course textbook?","o":[["A","National independence is a sacred and inviolable right of all nations."],["B","National independence must be tied to the freedom and happiness of the people."],["C","National independence must be a genuine, complete and thorough independence."],["D","National independence is tied to the unity and territorial integrity of the country."],["E","National independence is the sole goal, with absolute priority, standing above all other interests of the people."]],"a":"E","g":"The course textbook presents four main points in Ho Chi Minh's thought on national independence: a) Independence and freedom are sacred rights; b) National independence must be tied to the freedom and happiness of the people; c) National independence must be a genuine, complete and thorough independence; d) National independence is tied to the unity and territorial integrity of the country. Option E is wrong because he always emphasised the link between independence and the freedom and happiness of the people, even affirming \"If the country is independent but the people do not enjoy happiness and freedom, then independence has no meaning whatsoever\", which shows that independence is not a so"},{"id":"en04-19","cd":"04","l":"NH","q":"In the Claims of the Annamese People (1919), which basic rights did Ho Chi Minh demand for the people of Indochina?","o":[["A","Legal equality."],["B","Freedoms and democratic rights."],["C","The right to take part in the French government."],["D","The right to establish an independent state immediately."],["E","The right to economic self-determination."]],"a":"AB","g":"The course textbook states clearly that the Claims of the Annamese People comprised 8 points with \"two main contents: demanding legal equality and demanding the freedoms and democratic rights of the people of Indochina\". Options C, D and E are not mentioned as contents of the Claims."},{"id":"en04-20","cd":"04","l":"NH","q":"Which declarations did Ho Chi Minh cite to affirm the sacred and immutable values of the rights of nations, that they \"are born equal and have the right to life, the right to happiness and the right to freedom\"?","o":[["A","The 1776 Declaration of Independence of the American revolution."],["B","The 1791 Declaration of the Rights of Man and of the Citizen of the French Revolution."],["C","The Charter of the United Nations."],["D","The 1848 Manifesto of the Communist Party."],["E","Sun Yat-sen's doctrine of the \"Three Principles of the People\"."]],"a":"AB","g":"The course textbook clearly records: \"Based on the rights to freedom and equality and the human rights – 'rights that no one can violate' – recorded in the 1776 Declaration of Independence of the American revolution and the 1791 Declaration of the Rights of Man and of the Citizen of the French Revolution, Ho Chi Minh went on to affirm the sacred and immutable values of the rights of nations\". He held the \"Three Principles of the People\" in high regard, but it is not a declaration he cited to affirm these values in the quoted passage."},{"id":"en04-21","cd":"04","l":"NH","q":"After the victory of the August Revolution of 1945, which urgent tasks did Ho Chi Minh require to be carried out immediately to ensure the freedom and happiness of the people?","o":[["A","Make sure the people have food."],["B","Make sure the people have clothing."],["C","Make sure the people have housing."],["D","Make sure the people have education."],["E","Build a modern regular army."]],"a":"ABCD","g":"The course textbook states clearly that after the August Revolution of 1945, when the people were suffering from hunger, cold, illiteracy…, Ho Chi Minh required: \"1. Make sure the people have food. 2. Make sure the people have clothing. 3. Make sure the people have housing. 4. Make sure the people have education\". Building a modern regular army is another important task, but it is not among these 4 urgent requirements listed in the course textbook."},{"id":"en04-22","cd":"04","l":"NH","q":"Through which statements and actions is Ho Chi Minh's thought that national independence is tied to unity and territorial integrity clearly expressed?","o":[["A","Affirming \"The compatriots of Nam Bo are citizens of Vietnam\" in the 1946 Letter to Compatriots in the South (Nam Bo)."],["B","Declaring \"Vietnam is one, the Vietnamese nation is one\" in February 1958."],["C","His absolute faith in the reunification of the country in his Testament."],["D","Appealing to the United Nations in 1946 for the defence of \"territorial integrity for the Fatherland\"."],["E","Signing the 1973 Paris Agreement, which forced the US to withdraw its troops."]],"a":"ABCD","g":"Options A, B and C directly express the thought that independence is tied to unity and territorial integrity. Option D also clearly states \"to defend the most sacred rights: territorial integrity for the Fatherland and independence for the country\" in the 1946 appeal to the United Nations. Option E is an important historical event and a result of the struggle that Ho Chi Minh led, but he passed away in 1969, before the Paris Agreement was signed in 1973. Therefore, it is not a direct statement or action of Ho Chi Minh expressing this thought."},{"id":"en04-23","cd":"04","l":"NH","q":"Which of the following statements by Ho Chi Minh emphasise an iron will and determination to defend national independence after it had been won?","o":[["A","\"What I need most in life is for my compatriots to be free and my Fatherland to be independent\" (1919)."],["B","\"The entire Vietnamese people are determined to devote all their spirit and strength, their lives and property to firmly safeguarding that right to freedom and independence\" (Declaration of Independence, 1945)."],["C","\"Our people are also determined to fight to the end to defend the most sacred rights: territorial integrity for the Fatherland and independence for the country\" (Appeal to the United Nations, 1946)."],["D","\"No! We would rather sacrifice everything; we will never accept losing our country, never accept being slaves\" (Appeal for Nationwide Resistance, 1946)."],["E","\"Nothing is more precious than independence and freedom\" (17 July 1966)."]],"a":"BCDE","g":"Option A is a statement from 1919, expressing a personal aspiration before independence was won. The remaining options are all strong statements made after 1945, expressing the determination to firmly safeguard and defend the independence that had been won, especially in the context of the second invasion and fierce war."},{"id":"en04-24","cd":"04","l":"NH","q":"According to Ho Chi Minh, what characteristics must a national independence have to be regarded as \"genuine, complete and thorough\" (section c)?","o":[["A","The right of self-determination in foreign affairs."],["B","Having an army of its own."],["C","Having finances of its own."],["D","Having a government elected by the people, free from outside interference."],["E","Being recognised by the world's great powers."]],"a":"ABC","g":"The course textbook emphasises: \"if, under independence, the people of the nation have no right of self-determination in foreign affairs, no army of their own and no finances of their own…, then such independence has no meaning whatsoever\". This directly lists the three characteristics A, B and C. Option D is part of national sovereignty and democracy, but it is not specifically listed, as the other three elements are, in the definition of genuine independence in the course textbook. Option E is an external factor, not an intrinsic characteristic of genuine independence according to him."},{"id":"en04-25","cd":"04","l":"DK","q":"In 1919, on the occasion of the victorious Allied countries meeting at the Versailles Conference, Ho Chi Minh sent the Conference the (1) _______ of the Annamese People, comprising 8 points with two main contents: demanding legal (2) _______ and demanding the freedoms and democratic rights of the people of Indochina.","o":[["A","(1) Declaration; (2) equality"],["B","(1) Claims; (2) equality"],["C","(1) Claims; (2) self-determination"],["D","(1) Constitution; (2) unity"],["E","(1) Declaration; (2) self-determination"]],"a":"B","g":"The course textbook records: \"In 1919... Ho Chi Minh sent the Conference the Claims of the Annamese People, comprising 8 points with two main contents: demanding legal equality and demanding the freedoms and democratic rights of the people of Indochina\"."},{"id":"en04-26","cd":"04","l":"DK","q":"In the Party's Brief Political Platform (1930), Ho Chi Minh set out the political goals of the Party: \"a) Overthrow French imperialism and the feudalists. b) Make Vietnam completely (1) _______\", and at the same time put forward social goals such as \"Confiscate all the land of the imperialists, turn it into public property and distribute it to poor peasants. Abolish corvee and taxes for poor peasants… Enforce the law on the (2) _______-hour working day\".","o":[["A","(1) free; (2) 8"],["B","(1) independent; (2) 10"],["C","(1) unified; (2) 6"],["D","(1) independent; (2) 8"],["E","(1) free; (2) 10"]],"a":"D","g":"The course textbook states clearly that the political goal is \"Make Vietnam completely independent\" and the social policy is \"Enforce the law on the 8-hour working day\"."},{"id":"en04-27","cd":"04","l":"DK","q":"On 17 July 1966, amid difficulties and fierce war, Ho Chi Minh stated a truth of the era, an immortal declaration of the nations of the world that aspire to independence and freedom: \"Nothing is more precious than (1) _______ and (2) _______\".","o":[["A","(1) independence; (2) freedom"],["B","(1) peace; (2) freedom"],["C","(1) independence; (2) happiness"],["D","(1) freedom; (2) democracy"],["E","(1) peace; (2) happiness"]],"a":"A","g":"The course textbook quotes this statement by Ho Chi Minh verbatim (Appeal to Compatriots and Fighters Nationwide, 17 July 1966): \"Nothing is more precious than independence and freedom\"."},{"id":"en04-28","cd":"04","l":"DK","q":"Carrying on the values of the Declaration of Independence of the American revolution and the Declaration of the Rights of Man and of the Citizen of the French Revolution, Ho Chi Minh affirmed: \"All nations in the world are born (1) _______; every nation has the right to life, the right to happiness an
