đức cũ như người đầu ngược xuống đất chân chổng lên trời. Đạo đức mới như người hai chân đứng vững được dưới đất, đầu ngửng lên trời\". Đối với \"cần, kiệm, liêm, chính, chí công vô tư\", Người cũng \"lọc bỏ những nội dung không phù hợp và đưa vào những nội dung mới đáp ứng yêu cầu của cách mạng\". Rõ ràng, đây không phải là sự kế thừa mang tính hình thức mà là một sự thay đổi sâu sắc về nội dung và bản chất, tạo ra một nền đạo đức mới."},{"id":"vn13-12","cd":"13","l":"SAI","q":"Nhận định nào sau đây không thể hiện đúng tinh thần \"Chính\" của Hồ Chí Minh trong mối quan hệ \"đối với việc\"?","o":[["A","Phải đặt công việc của nước lên trên, trước mọi việc tư, việc nhà."],["B","Việc thiện dù nhỏ mấy cũng phải cố gắng làm bằng được."],["C","Việc ác dù nhỏ mấy cũng phải tránh tuyệt đối."],["D","Luôn phải tuân thủ mọi quy định và luật pháp, không được linh hoạt trong mọi trường hợp."],["E","Thể hiện sự thẳng thắn, đứng đắn, không tà vạy trong mọi hành động và quyết định liên quan đến công việc."]],"a":"D","g":"Tài liệu định nghĩa \"Chính nghĩa là không tà, nghĩa là thẳng thắn, đứng đắn. Điều gì không đứng đắn, thẳng thắn, tức là tà\". Trong mối quan hệ \"đối với việc\", Người chỉ rõ \"phải để công việc nước lên trên, trước việt tư, việc nhà… việc thiện thì dù nhỏ mấy cũng làm. việc ác thì dù nhỏ mấy cũng tránh\". Tài liệu không hề đề cập đến việc \"Luôn phải tuân thủ mọi quy định và luật pháp, không được linh hoạt trong mọi trường hợp\". Đây là một suy diễn không có trong văn bản và có thể sai lệch so với tinh thần \"Chính\" vốn nhấn mạnh sự thẳng thắn, đứng đắn, làm điều thiện, tránh điều ác hơn là sự cứng nhắc trong tuân thủ luật pháp một cách vô điều kiện."},{"id":"vn13-13","cd":"13","l":"NH","q":"Các đặc điểm nào sau đây được Hồ Chí Minh nhấn mạnh trong việc thực hành phẩm chất \"Cần\"?","o":[["A","Lao động có kế hoạch và năng suất cao."],["B","Tinh thần tự lực cánh sinh, không ỷ lại."],["C","Coi lao động là nghĩa vụ thiêng liêng và tài liệu hạnh phúc."],["D","Luôn tìm tòi, sáng tạo trong công việc."],["E","Siêng năng, chăm chỉ, bền bỉ, dẻo dai."]],"a":"ABCDE","g":"Tài liệu liệt kê đầy đủ các đặc điểm của \"Cần\": \"Cần tức là siêng năng, chăm chỉ, cố gắng dẻo dai… Muốn cho chữ Cần có nhiều kết quả hơn, thì phải có kế hoạch cho mọi công việc… Cần tức là lao động cần cù, siêng năng: lao động có kế hoạch, sáng tạo, có năng suất cao; lao động với tinh thần tự lực cánh sinh, không lười biếng. Phải thấy rõ, 'Lao động là nghĩa vụ thiêng liêng, là tài liệu sống, tài liệu hạnh phúc của chúng ta'\". Tất cả các phương án đều được đề cập trực tiếp hoặc gián tiếp trong đoạn này."},{"id":"vn13-14","cd":"13","l":"NH","q":"Theo Hồ Chí Minh, \"Thương yêu con người\" thể hiện những khía cạnh nào sau đây?","o":[["A","Là tình cảm nhân ái sâu sắc, rộng lớn dành cho những người nghèo khổ, bị áp bức, bóc lột."],["B","Không phân biệt màu da, dân tộc, giới tính trong tình yêu thương."],["C","Thúc đẩy người cách mạng chấp nhận gian khổ, hy sinh vì độc lập dân tộc và hạnh phúc con người."],["D","Phải có thái độ tôn trọng quyền con người, tạo điều kiện phát huy tài năng, và nâng đỡ những người lầm lạc."],["E","Đòi hỏi mỗi người phải thật chặt chẽ và nghiêm khắc với bản thân mình."]],"a":"ACDE","g":"A: Tài liệu nêu \"Tình yêu thương con người là tình cảm nhân ái sâu sắc, rộng lớn, trước hết dành cho những người nghèo khổ, những người bị mất quyền, những người bị áp bức, những người bị bóc lột\". (Đúng) B: Tài liệu nêu \"...không phân biệt màu da, dân tộc.\" Việc thêm \"giới tính\" vào khiến phương án này không hoàn toàn chính xác theo tài liệu. C: Tài liệu nói \"Vì yêu thương nhân dân, yêu thương con người mà Hồ Chí Minh sẵn sàng chấp nhận mọi gian khổ, hy sinh để đem lại độc lập cho dân tộc, tự do hạnh phúc cho con người\". (Đúng) D: Tài liệu nói \"Nó đòi hỏi mỗi người phải thật chặt chẽ và nghiêm khắc với mình; rộng rãi, độ lượng và giàu lòng vị tha đối với người khác; phải có thái độ tôn trọn"},{"id":"vn13-15","cd":"13","l":"NH","q":"Các phẩm chất nào sau đây được Hồ Chí Minh coi là nền tảng của đời sống mới, của các phong trào thi đua yêu nước và là những đức tính cơ bản của con người, mà \"thiếu một đức, thì không thành người\"?","o":[["A","Trung."],["B","Cần."],["C","Kiệm."],["D","Liêm."],["E","Chính."]],"a":"BCDE","g":"Tài liệu môn học ghi: “Cần, kiệm, liêm, chính còn là nền tảng của đời sống mới, của các phong trào thi đua yêu nước. Để trở thành người có phẩm chất đạo đức tốt, phải hội đủ các yếu tố cần, kiệm, liêm, chính. Hồ Chí Minh coi cần, kiệm, liêm, chính là bốn đức tính cơ bản của con người, giống như bốn mùa của trời, bốn phương của đất; ‘Thiếu một đức, thì không thành người’”. Như vậy, các phẩm chất được nói đến là Cần, Kiệm, Liêm, Chính. Trung là phẩm chất bao trùm nhưng không phải là phẩm chất được nói đến trong ngữ cảnh \"nền tảng của đời sống mới\" và \"thiếu một đức thì không thành người\" trong đoạn văn."},{"id":"vn13-16","cd":"13","l":"NH","q":"Theo Hồ Chí Minh, nội dung của chủ nghĩa quốc tế trong sáng bao gồm những khía cạnh nào sau đây?","o":[["A","Tôn trọng, hiểu biết, thương yêu và đoàn kết với giai cấp vô sản toàn thế giới."],["B","Ủng hộ và giúp đỡ các cuộc đấu tranh của nhân dân các nước vì hòa bình, độc lập dân tộc."],["C","Chống lại mọi sự chia rẽ, hằn thù, bất bình đẳng và phân biệt chủng tộc."],["D","Phản đối chủ nghĩa dân tộc hẹp hòi, sôvanh và chủ nghĩa bành trướng bá quyền."],["E","Ưu tiên lợi ích quốc gia lên trên mọi lợi ích quốc tế khi có xung đột."]],"a":"ABCD","g":"Tài liệu nêu rõ nội dung chủ nghĩa quốc tế trong tư tưởng Hồ Chí Minh: \"Đó là sự tôn trọng, hiểu biết, thương yêu và đoàn kết với giai cấp vô sản toàn thế giới, với các dân tộc bị áp bức, với tất cả các dân tộc và nhân dân các nước, với những người tiến bộ trên toàn cầu, chống lại mọi sự chia rẽ, hằn thù, bất bình đẳng và phân biệt chủng tộc; chống lại chủ nghĩa dân tộc hẹp hòi, sôvanh, biệt lập và chủ nghĩa bành trướng bá quyền.\" Tài liệu cũng nói \"luôn luôn kêu gọi phải tăng cường đoàn kết và hợp tác quốc tế, đồng thời phải ra sức ủng hộ và giúp đỡ đối với các cuộc đấu tranh của nhân dân các nước vì hòa bình, độc lập dân tộc, dân chủ và tiến bộ xã hội.\" Phương án E không đúng vì Hồ Chí Min"},{"id":"vn13-17","cd":"13","l":"DK","q":"Hồ Chí Minh khẳng định Đảng và Chính phủ là \"(1) _______\", chứ không phải \"(2) _______\" để đè đầu cưỡi cổ nhân dân, điều này thể hiện sự đảo lộn hoàn toàn quan niệm về nước và dân so với trước.","o":[["A","(1) chủ nhân; (2) quan nhân dân"],["B","(1) đầy tớ nhân dân; (2) chủ nhân"],["C","(1) đầy tớ nhân dân; (2) quan nhân dân"],["D","(1) quan nhân dân; (2) đầy tớ nhân dân"],["E","(1) chủ nhân; (2) đầy tớ nhân dân"]],"a":"C","g":"Tài liệu môn học ghi: “Đảng và Chính phủ là ‘đầy tớ nhân dân’ chứ không phải ‘quan nhân dân để đè đầu cưỡi cổ nhân dân’, thì quan niệm về nước và dân đã hoàn toàn đảo lộn so với trước”. Cụm từ “quan cách mạng” Người dùng ở chỗ khác, khi phê phán cán bộ “lên mặt ‘quan cách mạng’ ra lệnh ra oai”; câu này dùng “quan nhân dân”."},{"id":"vn13-18","cd":"13","l":"DK","q":"Hồ Chí Minh nhấn mạnh rằng, \"Hiểu chủ nghĩa Mác - Lênin là phải _______. Nếu thuộc bao nhiêu sách mà sống không có tình có nghĩa thì sao gọi là hiểu chủ nghĩa Mác - Lênin được\".","o":[["A","chí công vô tư"],["B","yêu nước"],["C","tiết kiệm"],["D","thuộc nhiều sách"],["E","sống với nhau có tình có nghĩa"]],"a":"E","g":"Tài liệu môn học ghi: “Theo Hồ Chí Minh, hiểu chủ nghĩa Mác - Lênin là phải sống với nhau có tình có nghĩa. Nếu thuộc bao nhiêu sách mà sống không có tình có nghĩa thì sao gọi là hiểu chủ nghĩa Mác - Lênin được”."},{"id":"vn13-19","cd":"13","l":"DK","q":"Hồ Chí Minh phân biệt rõ ràng giữa \"Kiệm\" và \"_______\". Người cho rằng, việc đáng tiêu mà không tiêu, vì lợi ích chung, thì không phải là kiệm mà là hành động của một người \"_______\".","o":[["A","xa xỉ"],["B","bủn xỉn"],["C","tiết kiệm"],["D","lãng phí"],["E","phô trương"]],"a":"B","g":"Tài liệu giải thích: \"Tiết kiệm không phải là bủn xỉn. Khi không nên tiêu xài thì một đồng xu cũng không nên tiêu. Khi có việc đáng làm, việc ích lợi cho đồng bào, cho Tổ quốc, thì dù bao nhiêu công, tốn bao nhiêu của, cũng vui lòng. Như thế mới đúng là kiệm. Việc đáng tiêu mà không tiêu, là bủn xỉn, chứ không phải là kiệm.\""},{"id":"vn13-20","cd":"13","l":"DK","q":"Tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh không những _______ giá trị yêu nước truyền thống của dân tộc, mà còn vượt qua những hạn chế của truyền thống đó, tạo nên một cuộc cách mạng sâu sắc.","o":[["A","phủ nhận"],["B","thay thế"],["C","rập khuôn"],["D","kế thừa"],["E","tuyệt đối hóa"]],"a":"D","g":"Tài liệu viết: \"Tư tưởng “trung với nước, hiếu với dân” của Hồ Chí Minh không những kế thừa giá trị yêu nước truyền thống của dân tộc, mà còn vượt qua những hạn chế của truyền thống đó. Trung với nước là trung thành với sự nghiệp dựng nước và giữ nước.\""},{"id":"vn13-21","cd":"13","l":"DS","q":"Theo giáo trình, cần, kiệm, liêm, chính, chí công vô tư cũng là một biểu hiện cụ thể của phẩm chất “trung với nước, hiếu với dân”.","o":[],"a":"D","g":"Tài liệu môn học ghi: “Với ý nghĩa như vậy, cần, kiệm, liêm, chính, chí công vô tư cũng là một biểu hiện cụ thể của phẩm chất ‘trung với nước, hiếu với dân’.” Điều này phù hợp với nhận định trung với nước, hiếu với dân là phẩm chất bao trùm, chi phối các phẩm chất khác."},{"id":"vn13-22","cd":"13","l":"DS","q":"Theo Hồ Chí Minh, nếu không có tình yêu thương con người thì vẫn có thể nói đến cách mạng, chỉ là không thể nói đến chủ nghĩa xã hội và chủ nghĩa cộng sản.","o":[],"a":"S","g":"Tài liệu môn học ghi: “Người cho rằng, nếu không có tình yêu thương như vậy thì không thể nói đến cách mạng, càng không thể nói đến chủ nghĩa xã hội và chủ nghĩa cộng sản.” Như vậy, thiếu tình yêu thương con người thì ngay cả cách mạng cũng không thể nói đến."},{"id":"vn13-23","cd":"13","l":"D1","q":"Theo giáo trình, luận điểm “trung với nước, hiếu với dân, nhiệm vụ nào cũng hoàn thành, khó khăn nào cũng vượt qua, kẻ thù nào cũng đánh thắng” trong Thư gửi thanh niên (1965) của Hồ Chí Minh có ý nghĩa gì?","o":[["A","Vừa là lời kêu gọi hành động, vừa là định hướng chính trị - đạo đức cho mỗi người Việt Nam, không chỉ trước đây, hôm nay mà còn lâu dài về sau."],["B","Chỉ là khẩu hiệu động viên dành riêng cho lực lượng vũ trang trong chiến tranh."],["C","Là sự khôi phục quan niệm “trung với vua” trong đạo đức truyền thống."],["D","Chỉ có giá trị trong cuộc đấu tranh cách mạng trước đây, nay không còn phù hợp."],["E","Chỉ đặt ra yêu cầu đối với đảng viên, không áp dụng cho mọi người Việt Nam."]],"a":"A","g":"Tài liệu môn học ghi: “Luận điểm đó của Hồ Chí Minh vừa là lời kêu gọi hành động, vừa là định hướng chính trị - đạo đức cho mỗi người Việt Nam không chỉ trong cuộc đấu tranh cách mạng trước đây, hôm nay, mà còn lâu dài về sau nữa.”"},{"id":"vn13-24","cd":"13","l":"D1","q":"Theo Hồ Chí Minh, vì sao cán bộ phải thực hành chữ LIÊM trước, để làm kiểu mẫu cho dân?","o":[["A","Vì chữ LIÊM chỉ đặt ra cho cán bộ cấp cao, còn cán bộ cấp thấp thì không cần."],["B","Vì thực hành chữ LIÊM giúp cán bộ được thăng chức nhanh hơn."],["C","Vì chữ LIÊM không liên quan gì đến chữ KIỆM và chữ CẦN."],["D","Vì cán bộ có thu nhập cao hơn nhân dân nên dễ giữ mình trong sạch."],["E","Vì cán bộ dù cấp cao hay cấp thấp đều có quyền; có quyền mà thiếu lương tâm là có dịp đục khoét, ăn của đút, “dĩ công vi tư”."]],"a":"E","g":"Tài liệu môn học ghi: “Trước nhất là cán bộ các cơ quan, các đoàn thể, cấp cao thì quyền to, cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu lương tâm là có dịp đục khoét, có dịp ăn của đút, có dịp ‘dĩ công vi tư’. Vì vậy, cán bộ phải thực hành chữ LIÊM trước, để làm kiểu mẫu cho dân”."},{"id":"vn13-25","cd":"13","l":"SAI","q":"Nhận định nào sau đây KHÔNG đúng về cần, kiệm, liêm, chính, chí công vô tư theo tư tưởng Hồ Chí Minh?","o":[["A","Là nội dung cốt lõi của đạo đức cách mạng, gắn liền với hoạt động hằng ngày của mỗi người."],["B","Được Hồ Chí Minh đề cập nhiều nhất, thường xuyên nhất, từ cuốn sách Đường cách mệnh cho đến bản Di chúc."],["C","Các đức tính cần, kiệm, liêm, chính có quan hệ chặt chẽ với nhau."],["D","Chỉ cán bộ, đảng viên mới phải thực hiện, còn nhân dân thì không đặt ra yêu cầu này."],["E","Một dân tộc biết cần, kiệm, biết liêm là một dân tộc giàu về vật chất, mạnh về tinh thần, văn minh tiến bộ."]],"a":"D","g":"Tài liệu môn học ghi: “Hồ Chí Minh cho rằng, các đức tính cần, kiệm, liêm, chính có quan hệ chặt chẽ với nhau, ai cũng phải thực hiện, song cán bộ, đảng viên phải là người thực hành trước để làm kiểu mẫu cho dân.” Vì vậy, nói chỉ cán bộ, đảng viên mới phải thực hiện là sai."},{"id":"vn13-26","cd":"13","l":"SAI","q":"Nhận định nào sau đây KHÔNG đúng về tinh thần quốc tế trong sáng theo tư tưởng Hồ Chí Minh?","o":[["A","Chủ nghĩa quốc tế là một trong những phẩm chất quan trọng nhất của đạo đức cộng sản chủ nghĩa."],["B","Vì nêu cao tinh thần độc lập, tự chủ, tự lực, tự cường nên Hồ Chí Minh chủ trương hạn chế đoàn kết và hợp tác quốc tế."],["C","Chủ nghĩa quốc tế nhằm vào mối quan hệ rộng lớn vượt ra khỏi giới hạn quốc gia - dân tộc."],["D","Hồ Chí Minh là biểu tượng cao đẹp của chủ nghĩa yêu nước chân chính kết hợp nhuần nhuyễn với chủ nghĩa quốc tế vô sản."],["E","Câu thơ “Quan sơn muôn dặm một nhà, Bốn phương vô sản đều là anh em!” thể hiện tinh thần quốc tế trong sáng."]],"a":"B","g":"Tài liệu môn học ghi: “Hồ Chí Minh nêu cao tinh thần độc lập, tự chủ, tự lực, tự cường, nhưng luôn luôn kêu gọi phải tăng cường đoàn kết và hợp tác quốc tế, đồng thời phải ra sức ủng hộ và giúp đỡ đối với các cuộc đấu tranh của nhân dân các nước vì hòa bình, độc lập dân tộc, dân chủ và tiến bộ xã hội.” Vì vậy, phương án B là sai."},{"id":"vn13-27","cd":"13","l":"NH","q":"Theo Hồ Chí Minh, chữ “Chính” trong quan hệ đối với mình và đối với người đòi hỏi những điều nào sau đây?","o":[["A","Đối với mình: chớ tự kiêu, tự đại."],["B","Đối với người: chớ nịnh hót người trên."],["C","Đối với người: được phép xem nhẹ người dưới nếu mình giữ chức vụ cao hơn."],["D","Đối với người: thái độ phải chân thành, khiêm tốn; phải thực hành chữ Bác - Ái."],["E","Đối với mình: được tự đề cao mình khi đã lập được công lớn."]],"a":"ABD","g":"Tài liệu môn học ghi: “Chính nghĩa là không tà, nghĩa là thẳng thắn, đứng đắn.” Chính được thể hiện rõ trong ba mối quan hệ: “ĐỐI VỚI MÌNH - Chớ tự kiêu, tự đại... ĐỐI VỚI NGƯỜI... Chớ nịnh hót người trên. Chớ xem khinh người dưới. Thái độ phải chân thành, khiêm tốn... Phải thực hành chữ Bác - Ái”. Các phương án C và E trái với những yêu cầu này."},{"id":"vn13-28","cd":"13","l":"NH","q":"Theo giáo trình, Hồ Chí Minh xác định tình thương yêu con người là một trong những phẩm chất đạo đức cao đẹp nhất trên cơ sở nào sau đây?","o":[["A","Tiếp thu nguyên vẹn quan niệm “trung với vua, hiếu với cha mẹ” của đạo đức phong kiến."],["B","Kế thừa truyền thống nhân nghĩa của dân tộc."],["C","Kết hợp với chủ nghĩa nhân đạo cộng sản."],["D","Thái độ “dĩ hòa vi quý” trong ứng xử giữa người với người."],["E","Thể nghiệm chính bản thân mình qua hoạt động thực tiễn."]],"a":"BCE","g":"Tài liệu môn học ghi: “Kế thừa truyền thống nhân nghĩa của dân tộc, kết hợp với chủ nghĩa nhân đạo cộng sản, tiếp thu tinh thần nhân văn của nhân loại qua nhiều thập niên, cùng với việc thể nghiệm chính bản thân mình qua hoạt động thực tiễn, Hồ Chí Minh đã xác định tình thương yêu con người là một trong những phẩm chất đạo đức cao đẹp nhất.” Giáo trình cũng nói rõ tình thương yêu con người “không phải là thái độ ‘dĩ hòa vi quý’”."},{"id":"vn13-29","cd":"13","l":"DK","q":"Hồ Chí Minh viết: “Kiệm là thế nào? Là tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi. CẦN với KIỆM phải đi đôi với nhau, như _______ của con người”.","o":[["A","hai tay"],["B","hai mắt"],["C","hai chân"],["D","trái tim và khối óc"],["E","hơi thở"]],"a":"C","g":"Tài liệu môn học ghi: “Kiệm là thế nào? Là tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi. CẦN với KIỆM phải đi đôi với nhau, như hai chân của con người”."},{"id":"vn13-30","cd":"13","l":"DK","q":"Trong suốt cuộc đời hoạt động cách mạng, Hồ Chí Minh đã dày công xây đắp tình đoàn kết hữu nghị giữa nhân dân Việt Nam và nhân dân thế giới, đã tạo ra một kiểu quan hệ quốc tế mới: _______, nhằm kiến tạo một nền văn hóa hòa bình cho nhân loại.","o":[["A","đối thoại thay cho đối đầu"],["B","liên minh quân sự thay cho hợp tác"],["C","biệt lập thay cho hội nhập"],["D","cạnh tranh thay cho hữu nghị"],["E","phụ thuộc thay cho tự chủ"]],"a":"A","g":"Tài liệu môn học ghi: “Trong suốt cuộc đời hoạt động cách mạng, Hồ Chí Minh đã dày công xây đắp tình đoàn kết hữu nghị giữa nhân dân Việt Nam và nhân dân thế giới, đã tạo ra một kiểu quan hệ quốc tế mới: đối thoại thay cho đối đầu, nhằm kiến tạo một nền văn hóa hòa bình cho nhân loại”."},{"id":"vn14-1","cd":"14","l":"DS","q":"Theo Hồ Chí Minh, đạo đức là tiêu chuẩn duy nhất và tuyệt đối để đánh giá sự thành công của một người cách mạng, vì \"không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\".","o":[],"a":"S","g":"Tài liệu khẳng định đạo đức là \"tiêu chuẩn hàng đầu\", \"gốc\", \"nền tảng\" và \"rất quan trọng\" của người cách mạng, thậm chí \"không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\". Tuy nhiên, Người cũng nhấn mạnh rằng \"Đức và tài phải là những phẩm chất thống nhất của con người\" và \"nếu thiếu tài thì làm việc gì cũng khó\". Do đó, việc nói đạo đức là \"duy nhất và tuyệt đối\" là sai, vì bỏ qua vai trò quan trọng của tài năng khi gắn liền với đạo đức."},{"id":"vn14-2","cd":"14","l":"DS","q":"Nguyên tắc \"nói đi đôi với làm\" được Hồ Chí Minh coi là đặc trưng bản chất của tư tưởng đạo đức và chủ yếu áp dụng cho cán bộ, đảng viên để làm gương cho quần chúng, không phải là yêu cầu phổ quát cho mọi người.","o":[],"a":"S","g":"Tài liệu khẳng định \"Nói đi đôi với làm\" là \"đặc trưng bản chất của tư tưởng đạo đức Hồ Chí Minh\". Người đã \"giáo dục mọi người và chính Người đã thực hiện điều đó một cách nghiêm túc và đầy đủ nhất\". Mặc dù Người có nhấn mạnh \"đảng viên đi trước, làng nước theo sau\" và cán bộ, đảng viên cần \"làm gương\", nhưng việc coi nó \"chủ yếu áp dụng\" cho cán bộ, đảng viên là chưa chính xác vì nó là một đặc trưng tổng thể, một nguyên tắc chung cho \"mọi người\"."},{"id":"vn14-3","cd":"14","l":"DS","q":"Trong nguyên tắc \"xây đi đôi với chống\", Hồ Chí Minh chủ trương phải tập trung loại bỏ hoàn toàn các hành vi vô đạo đức trước, sau đó mới tiến hành xây dựng các giá trị đạo đức mới để đảm bảo sự trong sạch.","o":[],"a":"S","g":"Tài liệu chỉ rõ: \"Xây phải đi đôi với chống, muốn xây phải chống, chống nhằm mục đích xây, lấy xây làm chính\". Điều này có nghĩa là xây dựng các giá trị đạo đức mới là mục tiêu hàng đầu, và việc chống lại cái xấu là để phục vụ cho mục tiêu xây. Việc tập trung loại bỏ \"hoàn toàn trước\" và \"sau đó mới tiến hành xây dựng\" là không phản ánh đúng tinh thần \"xây đi đôi với chống\" và nguyên tắc \"lấy xây làm chính\" của Hồ Chí Minh."},{"id":"vn14-4","cd":"14","l":"DS","q":"Mặc dù tu dưỡng đạo đức là một quá trình liên tục, nhưng Hồ Chí Minh đặc biệt nhấn mạnh tầm quan trọng của việc tu dưỡng trong tuổi trẻ, coi đó là giai đoạn quyết định và cần ưu tiên hàng đầu, trong khi các giai đoạn sau có thể giảm bớt sự khắt khe.","o":[],"a":"S","g":"Tài liệu nêu rõ \"phải kiên trì rèn luyện liên tục, tu dưỡng suốt đời, trong đó, thời tuổi trẻ đặc biệt quan trọng\". Tuy nhiên, Người cũng cảnh báo \"Nếu không kiên trì rèn luyện, thì ở thời kỳ trước là người có công, nhưng thời kỳ sau có thể lại là người có tội, lúc trẻ giữ được đạo đức, nhưng lúc già lại thoái hóa biến chất, hư hỏng\". Điều này khẳng định sự tu dưỡng phải liên tục, không có giai đoạn nào có thể giảm bớt sự khắt khe, mà là một quá trình \"trường kỳ, gian khổ\"."},{"id":"vn14-5","cd":"14","l":"D1","q":"Luận điểm \"Nếu không có đạo đức cách mạng thì có tài cũng vô dụng\" của Hồ Chí Minh hàm ý sâu sắc nhất điều gì về mối quan hệ giữa đạo đức và tài năng của người cách mạng?","o":[["A","Đạo đức quan trọng hơn tài năng và có thể thay thế tài năng trong mọi trường hợp."],["B","Người có tài nhưng thiếu đạo đức thì chỉ có thể hoàn thành những công việc nhỏ."],["C","Người cách mạng cần ưu tiên rèn luyện tài năng trước, sau đó mới trau dồi đạo đức."],["D","Đạo đức và tài năng là hai yếu tố hoàn toàn tách biệt, không ảnh hưởng lẫn nhau."],["E","Tài năng chỉ thực sự phát huy giá trị và không trở nên có hại khi có đạo đức làm nền tảng, định hướng."]],"a":"E","g":"Tài liệu khẳng định \"Nếu không có đạo đức cách mạng thì có tài cũng vô dụng\" và \"thiếu đạo đức thì vô dụng, thậm chí có hại\". Đồng thời, \"đạo đức là gốc, là nền tảng của người cách mạng\", \"tài năng phải gắn chặt và đặt vững trên nền tảng đạo đức\". Điều này cho thấy tài năng cần đạo đức để có mục đích, định hướng đúng đắn và phát huy giá trị tích cực, tránh gây hại, chứ không phải tách biệt hay thay thế."},{"id":"vn14-6","cd":"14","l":"D1","q":"Khi Hồ Chí Minh ví \"Đạo đức là gốc\" của cây, điều này có ý nghĩa sâu xa nhất là gì đối với người cách mạng?","o":[["A","Đạo đức là yếu tố duy nhất giúp người cách mạng đạt được thành công."],["B","Đạo đức chỉ cần được quan tâm trong giai đoạn đầu của sự nghiệp cách mạng."],["C","Đạo đức là nền tảng vững chắc, quyết định sự tồn tại, phát triển và khả năng lãnh đạo quần chúng của người cách mạng."],["D","Người cách mạng chỉ cần có đạo đức, không cần tài năng xuất chúng."],["E","Đạo đức là yếu tố hình thành một cách tự nhiên, không cần rèn luyện."]],"a":"C","g":"Tài liệu ví \"Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\". Điều này cho thấy đạo đức không chỉ là nền tảng cho sự tồn tại (\"không có gốc thì cây héo\") mà còn quyết định khả năng lãnh đạo, tức là sự phát triển và ảnh hưởng của người cách mạng. Các phương án khác không phản ánh đúng hoặc làm sai lệch ý nghĩa này."},{"id":"vn14-7","cd":"14","l":"D1","q":"Luận điểm \"Đấu tranh chống chủ nghĩa cá nhân không phải là “giày xéo lên lợi ích cá nhân”\" của Hồ Chí Minh hàm ý điều gì?","o":[["A","Chủ nghĩa cá nhân hoàn toàn không có lợi ích nào đáng được bảo vệ."],["B","Việc chống chủ nghĩa cá nhân chỉ nhằm mục đích phủ nhận mọi lợi ích của cá nhân."],["C","Chủ nghĩa cá nhân chỉ gây hại khi nó phát triển quá mức, vượt ra ngoài tầm kiểm soát và cần được kiểm soát nhẹ nhàng."],["D","Lợi ích cá nhân không liên quan đến đạo đức cách mạng và không cần phải cân nhắc khi đấu tranh."],["E","Việc chống chủ nghĩa cá nhân là nhằm loại bỏ những hành vi tư lợi, ích kỷ, gây hại cho tập thể, nhưng vẫn tôn trọng những lợi ích hợp pháp, chính đáng của cá nhân."]],"a":"E","g":"Tài liệu khẳng định \"Tài liệu gốc của mọi thứ tệ nạn là chủ nghĩa cá nhân\" và \"Phải kiên quyết quét sạch chủ nghĩa cá nhân, nâng cao đạo đức cách mạng\". Tuy nhiên, Người cũng lưu ý: \"Đấu tranh chống chủ nghĩa cá nhân không phải là 'giày xéo lên lợi ích cá nhân'\". Điều này cho thấy mục đích của việc chống chủ nghĩa cá nhân là loại bỏ những hành vi tiêu cực, ích kỷ, tư lợi gây hại cho tập thể, chứ không phải phủ nhận hay bác bỏ những lợi ích hợp pháp, chính đáng của cá nhân."},{"id":"vn14-8","cd":"14","l":"D1","q":"Theo Hồ Chí Minh, ý nghĩa sâu sắc nhất của việc cán bộ, đảng viên \"làm gương\" về đạo đức là gì?","o":[["A","Đơn thuần là tuân thủ quy định của Đảng và Nhà nước về đạo đức để tránh bị kỷ luật."],["B","Chứng minh quyền lực và uy tín của Đảng trước quần chúng nhân dân bằng sự uy nghi."],["C","Chỉ cần làm gương trong những sự kiện lớn hoặc những hoàn cảnh đặc biệt quan trọng."],["D","Mục đích chính là để giữ gìn danh dự cá nhân của cán bộ, đảng viên."],["E","Là phương pháp giáo dục đạo đức hiệu quả nhất cho quần chúng và đồng thời là cách thức tự giáo dục bản thân, vì \"một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền\"."]],"a":"E","g":"Tài liệu nhấn mạnh \"Sự gương mẫu của cán bộ, đảng viên trong lời nói và việc làm không chỉ là cách thức để giáo dục đạo đức cho quần chúng, mà còn là một phương pháp để tự giáo dục bản thân mình\". Đặc biệt, Người nói \"Đối với họ một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền\". Điều này cho thấy nêu gương là một phương pháp giáo dục mạnh mẽ, cả cho người khác và cho chính mình, hiệu quả hơn cả lời nói suông, không chỉ mang tính hình thức hay đối phó."},{"id":"vn14-9","cd":"14","l":"SAI","q":"Nhận định nào sau đây không phản ánh đúng quan điểm của Hồ Chí Minh về bản chất và quá trình rèn luyện đạo đức cách mạng?","o":[["A","Đạo đức cách mạng là chỗ dựa giúp con người vững vàng trong mọi thử thách, khi gặp khó khăn hay thành công."],["B","Đạo đức cách mạng thể hiện tính nhân đạo chiến đấu vì mục tiêu sự nghiệp cách mạng."],["C","Đạo đức cách mạng không phải là thứ có sẵn mà phải thông qua đấu tranh, rèn luyện bền bỉ hằng ngày."],["D","Đạo đức cách mạng đòi hỏi người cách mạng phải loại bỏ hoàn toàn mọi ý nghĩ \"thiện\" và \"ác\" trong lòng để đạt được sự trong sạch tuyệt đối."],["E","Đạo đức cách mạng là đạo đức trong hành động, lấy hiệu quả thực tế làm thước đo."]],"a":"D","g":"Tài liệu rõ ràng nêu: \"Mỗi con người đều có thiện và ác ở trong lòng. Ta phải biết làm cho phần tốt ở trong mỗi con người nảy nở như hoa mùa Xuân và phần xấu bị mất dần đi, đó là thái độ của người cách mạng\". Điều này chứng tỏ Hồ Chí Minh không đòi hỏi sự loại bỏ \"hoàn toàn mọi ý nghĩ thiện và ác\" mà là quá trình đấu tranh nội tâm để phát huy cái tốt, loại bỏ cái xấu. Do đó, nhận định D là sai. Các phương án A, B, C, E đều được đề cập trực tiếp hoặc gián tiếp trong tài liệu."},{"id":"vn14-10","cd":"14","l":"SAI","q":"Phát biểu nào sau đây không phản ánh đúng quan điểm của Hồ Chí Minh về việc giáo dục \"đức\" và \"tài\" trong sự nghiệp cách mạng?","o":[["A","Cần chú trọng giáo dục toàn diện cả \"Đức, Trí, Thể, Mỹ\", trong đó đức là gốc."],["B","Đức và tài, hồng và chuyên, phẩm chất và năng lực phải thống nhất làm một."],["C","Nếu không có đạo đức cách mạng thì có tài cũng vô dụng."],["D","Giáo dục tài năng cần ưu tiên hàng đầu trong mọi giai đoạn, vì tài là phương tiện quan trọng nhất để thực hiện mọi mục đích cách mạng."],["E","Thiếu tài thì làm việc gì cũng khó, nhưng thiếu đạo đức thì vô dụng, thậm chí có hại."]],"a":"D","g":"Tài liệu khẳng định \"đạo đức là gốc, là nền tảng của người cách mạng\", \"đức là gốc, là trước hết\", và \"Đó là cái gốc, rất quan trọng. Nếu không có đạo đức cách mạng thì có tài cũng vô dụng\". Điều này cho thấy \"đức\" được ưu tiên là \"gốc\", \"nền tảng\" hàng đầu. Mặc dù \"tài là phương tiện thực hiện mục đích đó\" và \"không có tài thì không xây dựng, phát triển được đất nước\", nhưng việc nói \"giáo dục tài năng cần ưu tiên hàng đầu trong mọi giai đoạn\" là sai vì nó đi ngược lại quan điểm \"đức là gốc, là trước hết\"."},{"id":"vn14-11","cd":"14","l":"SAI","q":"Theo Hồ Chí Minh, những hành vi nào sau đây không phải là biểu hiện của \"thói đạo đức giả\", \"bệnh quan liêu\" hoặc \"chủ nghĩa cá nhân\" tiêu cực?","o":[["A","\"Nói một đằng làm một nẻo\", \"nói nhiều làm ít\", \"nói mà không làm\"."],["B","\"Vác mặt làm quan cách mạng\", \"miệng thì nói dân chủ, nhưng làm việc thì họ theo lối “quan” chủ\"."],["C","Hành động \"làm trái ngược với lợi ích của quần chúng, trái ngược với phương châm, chính sách của Đảng và Chính phủ\"."],["D","Kiên quyết đấu tranh chống chủ nghĩa cá nhân trong mọi hoàn cảnh, kể cả việc phủ nhận những lợi ích hợp pháp, chính đáng của cá nhân."],["E","Các hành vi \"quan liêu, tham ô, lãng phí\"."]],"a":"D","g":"Tài liệu nêu rõ \"Nói đi đôi với làm đối lập hoàn toàn với thói đạo đức giả, nói một đằng làm một nẻo, nói nhiều làm ít, thậm chí nói mà không làm\". Các hành vi \"vác mặt làm quan cách mạng\", \"miệng thì nói dân chủ, nhưng làm việc thì họ theo lối “quan” chủ\" và \"quan liêu, tham ô, lãng phí\" cũng được Người chỉ ra là biểu hiện tiêu cực. Tuy nhiên, Người lưu ý: \"Đấu tranh chống chủ nghĩa cá nhân không phải là 'giày xéo lên lợi ích cá nhân'\". Do đó, việc \"phủ nhận những lợi ích hợp pháp, chính đáng của cá nhân\" trong đấu tranh chống chủ nghĩa cá nhân là một hành vi không đúng đắn theo tư tưởng của Người, chứ không phải là biểu hiện của \"thói đạo đức giả\" hay \"bệnh quan liêu\" theo định nghĩa trong"},{"id":"vn14-12","cd":"14","l":"SAI","q":"Để xây dựng một nền đạo đức mới, Hồ Chí Minh đã chỉ ra những yêu cầu nào sau đây, ngoại trừ một điều không đúng?","o":[["A","Chuẩn mực đạo đức phải trở thành hành vi đạo đức hằng ngày của mỗi người và toàn xã hội."],["B","Phải kết hợp chặt chẽ giữa \"xây\" và \"chống\", trong đó \"lấy xây làm chính\"."],["C","Khơi dậy ý thức đạo đức lành mạnh ở mỗi người, khuyến khích sự tự giáo dục, tự trau dồi đạo đức."],["D","Phải tiến hành giáo dục đạo đức phù hợp với từng giai đoạn cách mạng, lứa tuổi, ngành nghề."],["E","Tập trung giáo dục các phẩm chất đạo đức mới cho cán bộ, đảng viên trước tiên, sau đó mới phổ biến rộng rãi cho toàn thể nhân dân khi họ đã đủ trình độ tiếp thu."]],"a":"E","g":"Mặc dù Hồ Chí Minh rất chú trọng việc cán bộ, đảng viên phải \"làm gương\" và \"thấm nhuần đạo đức cách mạng\", nhưng việc xây dựng đạo đức mới không chỉ dành riêng cho một nhóm người rồi mới phổ biến. Tài liệu chỉ rõ \"xây dựng đạo đức mới cho cán bộ, đảng viên và hàng triệu, hàng triệu con người, trước tiên phải chăm lo bồi dưỡng những phẩm chất, chuẩn mực đạo đức mới ngay từ trong gia đình, đến nhà trường và xã hội\". Điều này cho thấy đây là một quá trình toàn diện, diễn ra đồng thời ở nhiều cấp độ, không phải theo trình tự \"trước-sau\" và điều kiện \"đủ trình độ tiếp thu\" như phương án E nêu."},{"id":"vn14-13","cd":"14","l":"NH","q":"Theo Hồ Chí Minh, những nguyên tắc cơ bản nào sau đây phải được thực hiện để xây dựng một nền đạo đức cách mạng mới?","o":[["A","Nói đi đôi với làm, nêu gương về đạo đức."],["B","Ưu tiên lợi ích cá nhân lên trên lợi ích tập thể để khuyến khích sự năng động."],["C","Xây đi đôi với chống, lấy xây làm chính."],["D","Tu dưỡng đạo đức suốt đời."],["E","Đặt tài năng lên trên đạo đức trong mọi trường hợp, vì tài là động lực chính."]],"a":"ACD","g":"Tài liệu chia rõ ba nguyên tắc xây dựng đạo đức cách mạng: \"a) Nói đi đôi với làm, nêu gương về đạo đức\"; \"b) Xây đi đôi với chống\" (với tinh thần \"lấy xây làm chính\"); và \"c) Tu dưỡng đạo đức suốt đời\". Phương án B đi ngược lại với việc \"chống chủ nghĩa cá nhân\", và phương án E đi ngược lại quan điểm \"đạo đức là gốc\"."},{"id":"vn14-14","cd":"14","l":"NH","q":"Theo Hồ Chí Minh, nếu người cách mạng không có đạo đức, có thể dẫn đến những hệ quả tiêu cực nào sau đây?","o":[["A","Dù tài giỏi mấy cũng không lãnh đạo được nhân dân."],["B","Tự mình hủ hóa, xấu xa, không có khả năng làm nổi những việc to tát."],["C","Quần chúng không yêu mến, không tin phục và không làm theo."],["D","Vẫn có thể hoàn thành nhiệm vụ cách mạng một cách đầy đủ nhưng không vẻ vang."],["E","Trở nên vô dụng, thậm chí có hại cho sự nghiệp cách mạng."]],"a":"ABCE","g":"A: Tài liệu nói \"không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\". (Đúng) B: Tài liệu nói \"tự mình không có đạo đức, không có căn bản, tự mình đã hủ hóa, xấu xa thì còn làm nổi việc gì?\". (Đúng) C: Tài liệu nói \"Quần chúng chỉ quý mến những người có tư cách, đạo đức\", hàm ý nếu thiếu thì không được quý mến, tin phục và làm theo. (Đúng) D: Tài liệu khẳng định \"Người cách mạng phải có đạo đức cách mạng làm nền tảng, mới hoàn thành được nhiệm vụ cách mạng vẻ vang\", hàm ý nếu thiếu thì không thể \"vẻ vang\", chứ không phải \"vẫn có thể hoàn thành nhiệm vụ cách mạng một cách đầy đủ\". E: Tài liệu nói \"thiếu đạo đức thì vô dụng, thậm chí có hại\". (Đúng)"},{"id":"vn14-15","cd":"14","l":"NH","q":"Những hành vi nào sau đây được Hồ Chí Minh lên án là biểu hiện của \"thói đạo đức giả\", \"bệnh quan liêu\" hoặc \"chủ nghĩa cá nhân\" tiêu cực gây tổn hại?","o":[["A","Bệnh nói suông, thói phô trương hình thức, lối làm việc không nhằm mục đích nâng cao sản xuất."],["B","Nói một đằng làm một nẻo, nói nhiều làm ít, nói mà không làm."],["C","Hành vi \"vác mặt làm quan cách mạng\", \"theo lối “quan” chủ\", \"làm trái ngược với lợi ích của quần chúng\"."],["D","Thực hiện cần kiệm liêm chính, chí công vô tư."],["E","Các hành vi \"quan liêu, tham ô, lãng phí\" được Người gọi là \"tội ác\"."]],"a":"ABCE","g":"A: Tài liệu nói: \"Hãy kiên quyết chống bệnh nói suông, thói phô trương hình thức, lối làm việc không nhằm mục đích nâng cao sản xuất\". (Đúng) B: Tài liệu nói: \"Nói đi đôi với làm đối lập hoàn toàn với thói đạo đức giả, nói một đằng làm một nẻo, nói nhiều làm ít, thậm chí nói mà không làm\". (Đúng) C: Tài liệu đề cập: \"vác mặt làm quan cách mạng\", \"theo lối “quan” chủ\", \"làm trái ngược với lợi ích của quần chúng\". (Đúng) D: \"Cần kiệm liêm chính, chí công vô tư\" là những phẩm chất đạo đức tích cực được Người yêu cầu thực hiện. E: Tài liệu chỉ rõ: \"Quan liêu, tham ô, lãng phí là tội ác. Phải tẩy sạch nó để thực hiện cần kiệm liêm chính\". (Đúng)"},{"id":"vn14-16","cd":"14","l":"NH","q":"Theo Hồ Chí Minh, việc tu dưỡng đạo đức suốt đời đòi hỏi những điều gì để người cách mạng có thể giữ vững phẩm chất của mình?","o":[["A","Kiên trì, thường xuyên, liên tục rèn luyện trong mọi hoàn cảnh."],["B","Tự cải tạo bản thân, bồi dưỡng tư tưởng mới để đoạn tuyệt với con người cũ."],["C","Rèn luyện thông qua các hoạt động thực tiễn, trong công việc và trong các mối quan hệ hằng ngày."],["D","Nhìn thẳng vào bản thân, thấy rõ cái hay, cái tốt để phát huy và cái dở, cái xấu để khắc phục."],["E","Đạo đức là một phẩm chất \"nhất thành bất biến\", chỉ cần rèn luyện tốt khi còn trẻ là đủ."]],"a":"ABCD","g":"A: Tài liệu nói: \"phải kiên trì, thường xuyên, liên tục\", \"kiên trì rèn luyện liên tục, tu dưỡng suốt đời\". (Đúng) B: Tài liệu nói: \"Tự cải tạo bản thân chúng ta\", \"Bồi dưỡng tư tưởng mới để đánh đổ tư tưởng cũ, đoạn tuyệt với con người cũ để trở thành con người mới\". (Đúng) C: Tài liệu nói: \"rèn luyện thông qua các hoạt động thực tiễn, trong công việc, trong các mối quan hệ của mình\". (Đúng) D: Tài liệu nói: \"phải nhìn thẳng vào mình... phải thấy rõ cái hay, cái tốt... để phát huy và thấy rõ cái dở, cái xấu... để khắc phục\". (Đúng) E: Tài liệu nói rõ: \"Đạo đức không phải là cái gì đó có tính 'nhất thành bất biến'\" và cảnh báo về việc \"lúc trẻ giữ được đạo đức, nhưng lúc già lại thoái hóa bi"},{"id":"vn14-17","cd":"14","l":"DK","q":"Hồ Chí Minh ví \"Cũng như sông thì có nguồn mới có nước, không có nguồn thì (1) _______. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có (2) _______, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân.\"","o":[["A","(1) sông cạn; (2) tài năng"],["B","(1) cây héo; (2) đạo đức"],["C","(1) sông cạn; (2) gốc"],["D","(1) cây héo; (2) tài năng"],["E","(1) sông cạn; (2) đạo đức"]],"a":"E","g":"Tài liệu viết: \"Cũng như sông thì có nguồn mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\"."},{"id":"vn14-18","cd":"14","l":"DK","q":"Trong Di chúc, Hồ Chí Minh căn dặn: \"Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người (1) _______, là người (2) _______ thật trung thành của nhân dân.\"","o":[["A","(1) đầy tớ; (2) lãnh đạo"],["B","(1) lãnh đạo; (2) nêu gương"],["C","(1) nêu gương; (2) đầy tớ"],["D","(1) lãnh đạo; (2) đầy tớ"],["E","(1) nêu gương; (2) lãnh đạo"]],"a":"D","g":"Tài liệu viết: \"Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân\"."},{"id":"vn14-19","cd":"14","l":"DK","q":"Hồ Chí Minh cho rằng, \"Tiếp nhận sự giáo dục đạo đức là vấn đề nhất thiết không thể thiếu được, nhưng sự _______, tự trau dồi đạo đức ở mỗi người còn quan trọng hơn. Bởi vì \"Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong\".\"","o":[["A","tự giáo dục"],["B","nêu gương"],["C","lãnh đạo"],["D","giáo dục của tổ chức"],["E","giám sát của tập thể"]],"a":"A","g":"Tài liệu ghi rõ: \"Tiếp nhận sự giáo dục đạo đức là vấn đề nhất thiết không thể thiếu được, nhưng sự tự giáo dục, tự trau dồi đạo đức ở mỗi người còn quan trọng hơn\"."},{"id":"vn14-20","cd":"14","l":"DK","q":"Hồ Chí Minh chỉ rõ: \"Nguồn gốc của mọi thứ tệ nạn là (1) _______\". Để giành được thắng lợi trong cuộc chiến đấu này, điều quan trọng là phải phát hiện sớm, tuyên truyền, vận động hình thành phong trào quần chúng rộng rãi, đồng thời chú trọng kết hợp giáo dục đạo đức với tăng cường tính nghiêm minh của (2) _______.","o":[["A","(1) chủ nghĩa cá nhân; (2) đạo đức"],["B","(1) quan liêu; (2) pháp luật"],["C","(1) chủ nghĩa cá nhân; (2) pháp luật"],["D","(1) tham ô; (2) đạo đức"],["E","(1) lãng phí; (2) pháp luật"]],"a":"C","g":"Tài liệu nêu: \"Nguồn gốc của mọi thứ tệ nạn là chủ nghĩa cá nhân\". Đồng thời, Người cũng yêu cầu: \"Muốn giành được thắng lợi trong cuộc chiến đấu này, điều quan trọng là phải... chú trọng kết hợp giáo dục đạo đức với tăng cường tính nghiêm minh của pháp luật\"."},{"id":"vn14-21","cd":"14","l":"DS","q":"Trong bài Người cán bộ cách mạng (1955), Hồ Chí Minh khẳng định: mọi việc thành hay là bại, chủ chốt là do cán bộ có thấm nhuần đạo đức cách mạng hay là không.","o":[],"a":"D","g":"Tài liệu môn học ghi: “Đạo đức trở thành nhân tố quyết định của sự thành bại của mọi công việc, phẩm chất mỗi con người.” Trong bài Người cán bộ cách mạng (1955), Hồ Chí Minh yêu cầu: “Người cán bộ cách mạng phải có đạo đức cách mạng... Mọi việc thành hay là bại, chủ chốt là do cán bộ có thấm nhuần đạo đức cách mạng, hay là không”."},{"id":"vn14-22","cd":"14","l":"DS","q":"Hồ Chí Minh đòi hỏi cán bộ, đảng viên phải làm gương trong anh em và làm gương cho dân, nhưng chỉ cần làm gương về mặt tinh thần.","o":[],"a":"S","g":"Tài liệu môn học ghi: “Trước hết, mình phải làm gương, gắng làm gương trong anh em, và khi đi công tác, gắng làm gương cho dân. Làm gương về cả ba mặt: Tinh thần, vật chất và văn hóa”. Vì vậy, nói chỉ cần làm gương về mặt tinh thần là sai."},{"id":"vn14-23","cd":"14","l":"D1","q":"Theo Hồ Chí Minh, dù năng lực và công việc của mỗi người khác nhau, người làm việc to, người làm việc nhỏ, thì điều gì làm cho một người trở thành người cao thượng?","o":[["A","Làm được những việc to lớn."],["B","Có năng lực vượt trội so với người khác."],["C","Giữ được đạo đức."],["D","Giữ chức vụ cao trong bộ máy."],["E","Có nhiều bằng cấp, học vị."]],"a":"C","g":"Tài liệu môn học ghi: “Vai trò của đạo đức còn thể hiện là thước đo lòng cao thượng của con người.” Hồ Chí Minh viết: “Tuy năng lực và công việc của mỗi người khác nhau, người làm việc to, người làm việc nhỏ; nhưng ai giữ được đạo đức đều là người cao thượng”."},{"id":"vn14-24","cd":"14","l":"D1","q":"Theo giáo trình, Hồ Chí Minh coi nguyên tắc “nói đi đôi với làm” có vị trí như thế nào trong xây dựng nền đạo đức mới?","o":[["A","Là nguyên tắc thứ yếu, chỉ áp dụng khi tuyên truyền, vận động quần chúng."],["B","Là yêu cầu riêng của phương Tây mà Người tiếp thu, không có trong truyền thống dân tộc."],["C","Là một khẩu hiệu mang tính hình thức, không gắn với thực tiễn."],["D","Là nguyên tắc quan trọng bậc nhất, thể hiện sự thống nhất giữa lý luận và thực tiễn."],["E","Là nguyên tắc tạm thời, chỉ cần thiết trong thời kỳ kháng chiến."]],"a":"D","g":"Tài liệu môn học ghi: “Nói đi đôi với làm là nét đẹp trong đạo đức truyền thống của dân tộc được Hồ Chí Minh nâng lên một tầm cao mới.” và “Người coi đây là nguyên tắc quan trọng bậc nhất trong xây dựng nền đạo đức mới. Nguyên tắc cơ bản này là sự thống nhất giữa lý luận và thực tiễn”."},{"id":"vn14-25","cd":"14","l":"SAI","q":"Nhận định nào sau đây KHÔNG đúng về nguyên tắc “xây đi đôi với chống” trong tư tưởng Hồ Chí Minh?","o":[["A","Là đòi hỏi của nền đạo đức mới, thể hiện tính nhân đạo chiến đấu vì mục tiêu của sự nghiệp cách mạng."],["B","Xây là xây dựng các giá trị, các chuẩn mực đạo đức mới; chống là chống các biểu hiện, các hành vi vô đạo đức, suy thoái đạo đức."],["C","Vì cái tốt và cái xấu luôn tách bạch rõ ràng, không đan xen trong mỗi con người, nên việc xây và chống là đơn giản."],["D","Đạo đức mới chỉ có thể được xây dựng thành công trên cơ sở kiên trì chống chủ nghĩa đế quốc, chống những thói quen và tập tục lạc hậu, loại trừ chủ nghĩa cá nhân."],["E","Bản thân sự tự giác cũng là một phẩm chất đạo đức cao quý đối với mỗi người và mỗi tổ chức."]],"a":"C","g":"Tài liệu môn học ghi: “Trong đời sống hằng ngày, những hiện tượng tốt - xấu, đúng - sai, cái đạo đức và cái vô đạo đức thường đan xen nhau, đối chọi nhau thông qua hành vi của những con người khác nhau, thậm chí trong mỗi con người.” và “Chính vì vậy, việc xây và chống trong lĩnh vực đạo đức rõ ràng không đơn giản.” Vì vậy, phương án C là sai."},{"id":"vn14-26","cd":"14","l":"SAI","q":"Nhận định nào sau đây KHÔNG đúng về nguyên tắc “tu dưỡng đạo đức suốt đời” theo Hồ Chí Minh?","o":[["A","Hồ Chí Minh bác bỏ hoàn toàn luận điểm “chính tâm, tu thân” của Khổng Tử vì cho rằng không có giá trị đối với người cách mạng."],["B","Tu dưỡng đạo đức như một cuộc cách mạng trường kỳ, gian khổ."],["C","Một nền đạo đức mới chỉ có thể được xây dựng trên cơ sở tự giác tu dưỡng đạo đức của mỗi người."],["D","Chỉ có trong hành động, đạo đức cách mạng mới bộc lộ rõ những giá trị của nó."],["E","Đạo đức cách mạng thể hiện trong hành động của người Việt Nam yêu nước vì độc lập, tự do của dân tộc, hạnh phúc của nhân dân."]],"a":"A","g":"Tài liệu môn học ghi: “Người nhắc lại luận điểm của Khổng Tử ‘chính tâm, tu thân’; ‘tề gia, trị quốc, bình thiên hạ’, và nêu rõ” rằng: “Chính tâm tu thân tức là cải tạo. Cải tạo cũng phải trường kỳ gian khổ, vì đó là một cuộc cách mạng trong bản thân của mỗi người.” Vì vậy, nói Người bác bỏ hoàn toàn luận điểm này là sai."},{"id":"vn14-27","cd":"14","l":"NH","q":"Theo Hồ Chí Minh, người có đạo đức cách mạng thể hiện như thế nào?","o":[["A","Khi gặp khó khăn, gian khổ, thất bại cũng không sợ sệt, rụt rè, lùi bước."],["B","Khi gặp thuận lợi và thành công thì có thể buông lỏng, hưởng thụ trước người khác."],["C","Khi gặp thuận lợi và thành công vẫn giữ vững tinh thần gian khổ, chất phác, khiêm tốn."],["D","Chỉ cần giữ đạo đức trong lúc khó khăn, còn lúc thuận lợi thì không cần."],["E","Cả đời hết lòng hết sức phục vụ nhân dân; sinh hoạt ngày thường thì làm gương mẫu."]],"a":"ACE","g":"Tài liệu môn học ghi: “Theo Hồ Chí Minh, đạo đức cách mạng là chỗ dựa giúp cho con người vững vàng trong mọi thử thách.” và “Có đạo đức cách mạng thì khi gặp khó khăn, gian khổ, thất bại, cũng không sợ sệt, rụt rè, lùi bước... khi gặp thuận lợi và thành công vẫn giữ vững tinh thần gian khổ, chất phác, khiêm tốn”. Người cũng viết: “Đại đa số chiến sĩ cách mạng là người có đạo đức: Cả đời hết lòng hết sức phục vụ nhân dân, sinh hoạt ngày thường thì làm gương mẫu”."},{"id":"vn14-28","cd":"14","l":"NH","q":"Theo Hồ Chí Minh, để phát huy “đạo làm gương” trong xây dựng nền đạo đức mới, cần làm những việc nào sau đây?","o":[["A","Chỉ tuyên dương những tấm gương ở cấp lãnh đạo cao nhất."],["B","Lấy gương người tốt, việc tốt để hằng ngày giáo dục lẫn nhau."],["C","Phát hiện, xây dựng những điển hình “người tốt, việc tốt” rất gần gũi trong đời thường."],["D","Tìm điển hình trong các lĩnh vực lao động, sản xuất, chiến đấu, học tập, nghiên cứu."],["E","Coi người tốt, việc tốt là hiện tượng hiếm, chỉ có ở một số ngành, giới nhất định."]],"a":"BCD","g":"Tài liệu môn học ghi: “Lấy gương người tốt, việc tốt để hằng ngày giáo dục lẫn nhau là một trong những cách tốt nhất để xây dựng Đảng, xây dựng các tổ chức cách mạng, xây dựng con người mới, cuộc sống mới” và “Muốn làm được như vậy, phải chú ý phát hiện, xây dựng những điển hình ‘người tốt, việc tốt’ rất gần gũi trong đời thường, trong các lĩnh vực lao động, sản xuất, chiến đấu, học tập, nghiên cứu...” Người khẳng định: “Người tốt, việc tốt nhiều lắm. Ở đâu cũng có. Ngành, giới nào, địa phương nào, lứa tuổi nào cũng có”."},{"id":"vn14-29","cd":"14","l":"DK","q":"Theo giáo trình, đức và tài phải là những phẩm chất thống nhất của con người: nếu đạo đức là tiêu chuẩn cho mục đích hành động thì tài là _______.","o":[["A","mục đích cuối cùng của hành động"],["B","phương tiện thực hiện mục đích đó"],["C","tiêu chuẩn hàng đầu của người cách mạng"],["D","yếu tố không cần thiết"],["E","cái gốc của người cách mạng"]],"a":"B","g":"Tài liệu môn học ghi: “Đức và tài phải là những phẩm chất thống nhất của con người. Nếu đạo đức là tiêu chuẩn cho mục đích hành động thì tài là phương tiện thực hiện mục đích đó.”"},{"id":"vn14-30","cd":"14","l":"DK","q":"Vấn đề quan trọng trong việc giáo dục đạo đức là phải khơi dậy ý thức đạo đức lành mạnh ở mỗi người, để mọi người cảm nhận thấy sâu sắc sự trau dồi đạo đức cách mạng là việc làm “_______ nhất trên đời”.","o":[["A","bình thường và đơn giản"],["B","bắt buộc và gò bó"],["C","tốn kém và mất thời gian"],["D","riêng tư và kín đáo"],["E","sung sướng và vẻ vang"]],"a":"E","g":"Tài liệu môn học ghi: “Vấn đề quan trọng trong việc giáo dục đạo đức là phải khơi dậy ý thức đạo đức lành mạnh ở mỗi người, để mọi người tự giác nhận thức được trách nhiệm đạo đức của mình, như Hồ Chí Minh đã nói, cảm nhận thấy sâu sắc sự trau dồi đạo đức cách mạng là việc làm ‘sung sướng và vẻ vang nhất trên đời’.”"}],"en":[{"id":"en01-1","cd":"01","l":"D1","q":"In the concept of Ho Chi Minh Thought put forward by the 11th National Party Congress, what is emphasised as the most fundamental value of this thought?","o":[["A","It is the inheritance of the fine traditional values of the nation."],["B","It is an immensely great and precious spiritual asset of our Party and our nation."],["C","It is the result of the creative application and development of Marxism–Leninism in the specific conditions of Vietnam."],["D","It is a comprehensive and profound system of views on the fundamental issues of the Vietnamese revolution."],["E","It is the guideline for action of the Party and the Vietnamese revolution."]],"a":"C","g":"According to the definition of the 11th National Party Congress, Ho Chi Minh Thought “is a comprehensive and profound system of views... the result of the creative application and development of Marxism–Leninism in the specific conditions of our country”. Although the other options are all correct about Ho Chi Minh Thought, the element “creative application and development of Marxism–Leninism” expresses the scientific and revolutionary nature, the originality and the foundational contribution of Ho Chi Minh to the Vietnamese revolution, and is the most essential when considered in terms of origins and methodology."},{"id":"en01-2","cd":"01","l":"D1","q":"Which of the following elements most clearly shows the “comprehensive and profound” character of Ho Chi Minh Thought in orienting the Vietnamese revolution?","o":[["A","The goal of building a peaceful, unified, independent, democratic and prosperous Vietnam."],["B","The path of development: national independence closely linked with socialism."],["C","Affirming the leadership role of the Communist Party of Vietnam and the management of the revolutionary State."],["D","Identifying the revolutionary force as the entire patriotic Vietnamese people."],["E","It includes all of the above elements, together with building the human being, combining the strength of the nation with the strength of the times, and appropriate revolutionary methods."]],"a":"E","g":"The course textbook describes the “comprehensive and profound” character of Ho Chi Minh Thought by listing many different aspects: national goals, the path of development, the role of the Party and the State, revolutionary forces, building the human being, combining the strength of the nation with the strength of the times, and appropriate revolutionary methods. Therefore, option E is the most complete and accurate synthesis, showing comprehensiveness better than the options that state only a part."},{"id":"en01-3","cd":"01","l":"D1","q":"According to the course textbook, what is the ultimate aim that Ho Chi Minh and the Vietnamese people pursue in building the country?","o":[["A","Building an independent, democratic and prosperous Vietnam."],["B","Making a worthy contribution to the world revolutionary cause."],["C","Building a peaceful, unified, independent, democratic and prosperous Vietnam."],["D","Building a peaceful, unified, independent, democratic and prosperous Vietnam, while making a worthy contribution to the world revolutionary cause."],["E","Successfully realising socialism."]],"a":"D","g":"The course textbook quotes Ho Chi Minh stating clearly his ultimate wish: “Our whole Party and whole people unite and strive to build a peaceful, unified, independent, democratic and prosperous Vietnam, and to make a worthy contribution to the world revolutionary cause”. Option D fully covers both of these aspects, making it the most correct answer."},{"id":"en01-4","cd":"01","l":"D1","q":"Which event marks the most important turning point in the Communist Party of Vietnam's awareness of the role of Ho Chi Minh Thought as an ideological foundation, placing it on a par with Marxism–Leninism?","o":[["A","The 2nd National Party Congress (February 1951) affirmed: “The political line... of our Party today is the line... of President Ho”."],["B","The 4th National Party Congress (December 1976) assessed Ho Chi Minh as “the founder and trainer of our Party”."],["C","The 6th National Party Congress (December 1986) emphasised “inheriting the precious legacy of President Ho Chi Minh's revolutionary thought and theory”."],["D","The 7th National Party Congress (1991) affirmed: “The Party takes Marxism–Leninism and Ho Chi Minh Thought as its ideological foundation and guideline for action”."],["E","The 9th National Party Congress (April 2001) put forward a full concept of Ho Chi Minh Thought."]],"a":"D","g":"According to the course textbook: “For that reason, one of the new points of the 7th Congress is that the Party correctly assessed the stature of Ho Chi Minh Thought. The 7th National Party Congress affirmed: ‘The Party takes Marxism–Leninism and Ho Chi Minh Thought as its ideological foundation and guideline for action’”. Earlier congresses had referred to Ho Chi Minh's role or to the need to study his thought, but the 7th Congress was the first to officially take Ho Chi Minh Thought as the ideological foundation and guideline for action, together with Marxism–Leninism."},{"id":"en01-5","cd":"01","l":"D1","q":"According to the course textbook, what is the most comprehensive significance of studying the subject Ho Chi Minh Thought for students?","o":[["A","Raising the capacity for theoretical thinking in order to solve problems in life."],["B","Educating in and orienting the practice of revolutionary ethics, strengthening scientific belief and fostering patriotism."],["C","Building and cultivating working and learning methods and styles suited to oneself."],["D","Helping to equip knowledge, form capacities, belief and revolutionary sentiment, and stand firm on the goal of national independence closely linked with socialism."],["E","Comprehensively, it includes raising the capacity for theoretical thinking, educating in revolutionary ethics, strengthening belief, fostering patriotism, and building working methods and styles in order to become useful citizens."]],"a":"E","g":"Items 1, 2 and 3 in Section II “THE SIGNIFICANCE OF STUDYING THE SUBJECT HO CHI MINH THOUGHT” each state a different aspect of significance: raising the capacity for theoretical thinking, moral education, strengthening belief, fostering patriotism, and building working methods/styles. Option E synthesises and covers all these aspects, making it the most comprehensive answer."},{"id":"en01-6","cd":"01","l":"D1","q":"Ho Chi Minh Thought is identified as an immensely great and precious spiritual asset of the Party and the Vietnamese nation, forever lighting the way for the revolutionary cause. At which Party Congress was this statement first put forward in the concept of Ho Chi Minh Thought?","o":[["A","The 7th National Party Congress (1991)"],["B","The 9th National Party Congress (2001)"],["C","The 10th National Party Congress (2006)"],["D","The 11th National Party Congress (2011)"],["E","The 13th National Party Congress (2021)"]],"a":"D","g":"According to the course textbook: “The 11th National Congress of the Communist Party of Vietnam (2011) set out the concept of ‘Ho Chi Minh Thought’ as follows: ‘Ho Chi Minh Thought is a comprehensive and profound system of views... an immensely great and precious spiritual asset of our Party and our nation, forever lighting the way for our people's revolutionary cause to victory’”."},{"id":"en01-7","cd":"01","l":"D1","q":"Which of the bases for the formation of Ho Chi Minh Thought does the course textbook emphasise as “the most fundamental value in the process of formation and development”?","o":[["A","Absorbing the cultural quintessence of humankind."],["B","Inheriting the fine traditional values of the nation."],["C","Marxism–Leninism."],["D","The practice of the Vietnamese revolution."],["E","Experience from national liberation movements around the world."]],"a":"C","g":"According to the course textbook: “Second, it stated that the basis for the formation of Ho Chi Minh Thought is Marxism–Leninism – the most fundamental value in the process of formation and development of Ho Chi Minh Thought”."},{"id":"en01-8","cd":"01","l":"D1","q":"According to the concept adopted by the 11th National Party Congress, the goal of building a peaceful, unified, independent, democratic and prosperous Vietnam is set in order to make a worthy contribution to which cause?","o":[["A","The economic development of Southeast Asia."],["B","The alliance of socialist countries."],["C","The world revolution."],["D","The protection of world peace."],["E","Global hunger eradication and poverty reduction."]],"a":"C","g":"The course textbook states clearly: “Ho Chi Minh Thought is a comprehensive and profound system of views on the goal of building a peaceful, unified, independent, democratic and prosperous Vietnam, making a worthy contribution to the world revolutionary cause.”"},{"id":"en01-9","cd":"01","l":"D1","q":"In which year did UNESCO adopt the Resolution commemorating the 100th anniversary of President Ho Chi Minh's birth?","o":[["A","1987"],["B","1990"],["C","2001"],["D","2011"],["E","2021"]],"a":"A","g":"According to the course textbook: “The United Nations Educational, Scientific and Cultural Organization (UNESCO), at the 24th session of its General Conference in Paris, from 20 October to 20 November 1987, adopted Resolution No. 240/18.6.5 on commemorating the 100th anniversary of the birth of President Ho Chi Minh”."},{"id":"en01-10","cd":"01","l":"D1","q":"“Remain constant, respond to myriad changes” (dĩ bất biến, ứng vạn biến) is a working motto of Ho Chi Minh. To which style can learners apply it after studying the subject Ho Chi Minh Thought?","o":[["A","Style of thinking."],["B","Style of expression."],["C","Style of working."],["D","Style of conduct."],["E","All of the styles above, and also style of living."]],"a":"E","g":"The course textbook states that learners “can apply it to build a style of thinking, a style of expression, a style of working, a style of conduct, a style of living, etc., suited to circumstances, in line with Ho Chi Minh's motto: ‘Remain constant, respond to myriad changes’ (dĩ bất biến, ứng vạn biến).” This implies that the motto can be applied to many aspects of working and living style."},{"id":"en01-11","cd":"01","l":"SAI","q":"Which of the following statements does not correctly reflect the significance of Ho Chi Minh Thought according to the course textbook?","o":[["A","Together with Marxism–Leninism, it forms the ideological foundation of the Party."],["B","It is the guideline for action of the Party and the Vietnamese revolution."],["C","It is an immensely great and precious spiritual asset of our Party and our nation."],["D","It is a system of views giving direct guidance for developing the socialist-oriented market economy in the current period."],["E","It forever lights the way for our people's revolutionary cause to victory."]],"a":"D","g":"Options A, B, C and E are all clearly affirmed in the course textbook on the significance of Ho Chi Minh Thought. Option D, “a system of views giving direct guidance for developing the socialist-oriented market economy in the current period”, is not directly mentioned, nor is it a significance defined in the excerpts."},{"id":"en01-12","cd":"01","l":"SAI","q":"According to the course textbook, which of the following objectives will students not achieve by studying the subject Ho Chi Minh Thought?","o":[["A","Raising the capacity for theoretical thinking."],["B","Strengthening their revolutionary stance and viewpoint on the foundation of Marxism–Leninism and Ho Chi Minh Thought."],["C","Applying Ho Chi Minh Thought to solving problems arising in life."],["D","Directly developing in-depth specialist skills in the natural sciences."],["E","Forming capacities, working methods, belief and revolutionary sentiment."]],"a":"D","g":"Options A, B, C and E are all objectives and aspects of significance stated in Section “II – THE SIGNIFICANCE OF STUDYING THE SUBJECT HO CHI MINH THOUGHT”. However, the objective of “directly developing in-depth specialist skills in the natural sciences” is not mentioned, because this subject focuses on theoretical thinking, ethics and revolutionary working style."},{"id":"en01-13","cd":"01","l":"SAI","q":"Which of the statements below about the Communist Party of Vietnam's process of perceiving Ho Chi Minh Thought is not accurate?","o":[["A","Right from the Party's founding, the Party's first Political Platform expressed the basic contents of Ho Chi Minh Thought."],["B","Perceiving Ho Chi Minh Thought after the Party was founded was a simple and smooth process."],["C","The 2nd National Party Congress (1951) stated clearly that our Party's current political line, working habits and revolutionary ethics are those of President Ho."],["D","The 7th National Party Congress (1991) was a major milestone in upholding Ho Chi Minh Thought as the ideological foundation and guideline for action."],["E","The 9th National Party Congress (2001) perceived Ho Chi Minh Thought more fully, with a detailed definition."]],"a":"B","g":"The course textbook points out that “perceiving Ho Chi Minh Thought... was not a simple process. There were misunderstandings from the Communist International (Comintern) and from some people in the Indochinese Communist Party”. Therefore, statement B, saying that this process was “simple and smooth”, is not accurate."},{"id":"en01-14","cd":"01","l":"SAI","q":"Which of the following is not listed among the things Ho Chi Minh nurtured or built, according to the assessment of the 4th National Party Congress (1976)?","o":[["A","Founding and training our Party."],["B","Giving birth to the Democratic Republic of Vietnam."],["C","Building the revolutionary armed forces."],["D","Nurturing the bloc of great national unity."],["E","Leading the country's renewal process from 1986."]],"a":"E","g":"The course textbook lists Ho Chi Minh's contributions as assessed by the 4th Congress: “the founder and trainer of our Party, the one who gave birth to the Democratic Republic of Vietnam, the one who nurtured the bloc of great national unity and built the revolutionary armed forces”. The country's renewal process from 1986 took place after his death (1969); therefore option E is incorrect."},{"id":"en01-15","cd":"01","l":"SAI","q":"According to the concept of Ho Chi Minh Thought adopted by the 11th National Party Congress, the bases for the formation of his thought do not include which of the following elements?","o":[["A","The creative application and development of Marxism–Leninism."],["B","Inheriting and developing the fine traditional values of the nation."],["C","Absorbing the cultural quintessence of humankind."],["D","Direct inheritance from Vietnamese feudal thought."],["E","The specific conditions of our country."]],"a":"D","g":"The definition in the course textbook states that Ho Chi Minh Thought is “the result of the creative application and development of Marxism–Leninism in the specific conditions of our country, inheriting and developing the fine traditional values of the nation, and absorbing the cultural quintessence of humankind”. No element of “direct inheritance from Vietnamese feudal thought” is mentioned as a basis for formation in this definition."},{"id":"en01-16","cd":"01","l":"NH","q":"According to the concept adopted by the 11th National Party Congress, Ho Chi Minh Thought is the result of the synthesis of which of the elements below? (Choose all correct answers)","o":[["A","The creative application and development of Marxism–Leninism."],["B","Inheriting and developing the fine traditional values of the nation."],["C","Absorbing the cultural quintessence of humankind."],["D","The specific conditions of our country."],["E","Experience from Western bourgeois revolutions."]],"a":"ABCD","g":"According to the course textbook: “Ho Chi Minh Thought is a comprehensive and profound system of views... the result of the creative application and development of Marxism–Leninism in the specific conditions of our country, inheriting and developing the fine traditional values of the nation, and absorbing the cultural quintessence of humankind”. Therefore, A, B, C and D are all components of this result."},{"id":"en01-17","cd":"01","l":"NH","q":"According to the course textbook, what does studying the subject Ho Chi Minh Thought help students form and strengthen? (Choose all correct answers)","o":[["A","Scientific knowledge of the system of views on the Vietnamese revolution."],["B","Capacities, working methods, belief and revolutionary sentiment."],["C","A revolutionary stance and viewpoint on the foundation of Marxism–Leninism and Ho Chi Minh Thought."],["D","The ability to struggle against and criticise wrong views in order to protect the purity of Marxism–Leninism and Ho Chi Minh Thought."],["E","Political mettle, steadfast awareness and civic responsibility."]],"a":"ABCDE","g":"All the options are mentioned in Section “II – THE SIGNIFICANCE OF STUDYING THE SUBJECT HO CHI MINH THOUGHT”. Specifically: A, B and C are stated in; D in; and E in."},{"id":"en01-18","cd":"01","l":"NH","q":"According to the concept adopted by the 11th National Party Congress, Ho Chi Minh Thought is “a comprehensive and profound system of views on the fundamental issues of the Vietnamese revolution”. Which aspects do these fundamental issues include? (Choose all correct answers)","o":[["A","The goal of building a peaceful, unified, independent, democratic and prosperous Vietnam."],["B","The path of development of the Vietnamese nation is national independence closely linked with socialism."],["C","The leadership role of the Communist Party of Vietnam and the management of the revolutionary State."],["D","Identifying the revolutionary force as the entire patriotic Vietnamese people."],["E","Building Vietnamese people with capacity and revolutionary moral qualities."]],"a":"ABCDE","g":"The course textbook lists in detail the fundamental issues of the Vietnamese revolution covered by Ho Chi Minh Thought, which include all of options A, B, C, D and E. Specifically: the national goal, the path of development, the role of the Party and the State, the revolutionary forces, and building the Vietnamese people."},{"id":"en01-19","cd":"01","l":"NH","q":"Which stages of development in the Communist Party of Vietnam's perception of Ho Chi Minh Thought are mentioned in the course textbook? (Choose all correct answers)","o":[["A","Being expressed right from the Party's first Political Platform."],["B","Encountering misunderstanding from the Communist International (Comintern) and some people in the Indochinese Communist Party."],["C","Affirming at the 2nd Congress that the Party's political line, working habits and revolutionary ethics are those of President Ho."],["D","Assessing Ho Chi Minh as the founder and trainer of the Party at the 4th Congress."],["E","Officially taking Marxism–Leninism and Ho Chi Minh Thought as the ideological foundation and guideline for action at the 7th Congress."]],"a":"ABCDE","g":"These options are all presented in the section “The above concept records the process of the Communist Party of Vietnam's perception of Ho Chi Minh Thought”. Specifically: A in, B and C in, D in, and E in."},{"id":"en01-20","cd":"01","l":"NH","q":"According to the course textbook, students of the subject Ho Chi Minh Thought can apply Ho Chi Minh's motto “Remain constant, respond to myriad changes” (dĩ bất biến, ứng vạn biến) to building which styles? (Choose all correct answers)","o":[["A","Style of thinking."],["B","Style of expression."],["C","Style of working."],["D","Style of conduct."],["E","Style of living."]],"a":"ABCDE","g":"The course textbook lists clearly: “Learners can apply it to build a style of thinking, a style of expression, a style of working, a style of conduct, a style of living, etc., suited to circumstances, in line with Ho Chi Minh's motto: ‘Remain constant, respond to myriad changes’ (dĩ bất biến, ứng vạn biến).” All the options are mentioned."},{"id":"en01-21","cd":"01","l":"DK","q":"“Ho Chi Minh Thought is a comprehensive and profound system of views on the fundamental issues of the Vietnamese revolution, the result of the creative application and development of Marxism–Leninism in the specific conditions of our country, inheriting and developing the fine traditional values of the nation, and absorbing the cultural quintessence of humankind; it is an immensely great and precious spiritual asset of our Party and our nation, forever lighting the way for our people's revolutionary cause to victory” is the concept put forward at the _______ National Congress of the Communist Party of Vietnam (2011).","o":[["A","9th"],["B","10th"],["C","11th"],["D","12th"],["E","13th"]],"a":"C","g":"According to the course textbook: “The 11th National Congress of the Communist Party of Vietnam (2011) set out the concept of ‘Ho Chi Minh Thought’ as follows...”."},{"id":"en01-22","cd":"01","l":"DK","q":"Ho Chi Minh Thought is identified as the ideological foundation and guideline for action of the Party and the Vietnamese revolution, together with _______.","o":[["A","patriotism"],["B","scientific socialism"],["C","Marxism–Leninism"],["D","humanism"],["E","collectivism"]],"a":"C","g":"The course textbook affirms: “Together with Marxism–Leninism, Ho Chi Minh Thought is a constituent part forming the ideological foundation and guideline for action of the Party and the Vietnamese revolution.”"},{"id":"en01-23","cd":"01","l":"DK","q":"According to Ho Chi Minh Thought, the path of development of the Vietnamese nation is national independence closely linked with _______.","o":[["A","democracy"],["B","sustainable development"],["C","socialism"],["D","renovation"],["E","industrialisation"]],"a":"C","g":"According to the course textbook: “To achieve that goal, the path of development of the Vietnamese nation is national independence closely linked with socialism.”"},{"id":"en01-24","cd":"01","l":"DK","q":"Which international organisation adopted the Resolution commemorating the 100th anniversary of President Ho Chi Minh's birth, honouring him as “Hero of National Liberation and Outstanding Man of Culture of Vietnam”?","o":[["A","the United Nations"],["B","UNESCO"],["C","WHO"],["D","UNICEF"],["E","IMF"]],"a":"B","g":"The course textbook states clearly: “The United Nations Educational, Scientific and Cultural Organization (UNESCO)... adopted Resolution No. 24C/18.6.5 on commemorating the 100th anniversary of the birth of President Ho Chi Minh, in which it recognised... ‘Hero of National Liberation and Outstanding Man of Culture of Vietnam’”."},{"id":"en01-25","cd":"01","l":"DK","q":"According to the course textbook, studying the subject Ho Chi Minh Thought helps students actively and proactively struggle against and criticise wrong views in order to protect the purity of Marxism–Leninism, Ho Chi Minh Thought, the Party's line and guidelines, and the policies and laws of the _______.","o":[["A","Government"],["B","State"],["C","National Assembly"],["D","Vietnam Fatherland Front"],["E","Youth Union"]],"a":"B","g":"According to the course textbook: “actively and proactively struggle against and criticise wrong views in order to protect the purity of Marxism–Leninism, Ho Chi Minh Thought, the Party's line and guidelines, and the policies and laws of the State”."},{"id":"en01-26","cd":"01","l":"DS","q":"According to the course textbook, the object of study of the Ho Chi Minh Thought course is not only all of Ho Chi Minh's views expressed in his legacy, but also the process by which that system of views operates in practice.","o":[],"a":"D","g":"The course textbook states: “The object of study of the Ho Chi Minh Thought course is all of Ho Chi Minh's views expressed in his legacy.” and “The object of study of the Ho Chi Minh Thought course is also the process by which Ho Chi Minh's system of views operates in practice.” The statement is therefore true."},{"id":"en01-27","cd":"01","l":"DS","q":"According to the course textbook, when studying Ho Chi Minh Thought, a researcher only needs to stand on the standpoint of the working class (Party spirit), while ensuring the objectivity and scientific character of the propositions put forward is optional.","o":[],"a":"S","g":"The course textbook states: “At the same time, the objectivity and scientific character of the propositions put forward must be ensured. The close unity between Party spirit and scientific character is a very fundamental principle in the methodology of studying Ho Chi Minh Thought.” Scientific character is a mandatory requirement closely bound to Party spirit, so the statement is false."},{"id":"en01-28","cd":"01","l":"DS","q":"According to the comprehensive and systematic approach to studying Ho Chi Minh Thought, the parts of Ho Chi Minh's system of thought are bound together around a core nucleus, which is his thought on revolutionary ethics.","o":[],"a":"S","g":"The course textbook states: “When studying Ho Chi Minh Thought as a whole or part by part, one must always grasp the interrelations between its different elements and parts, which are necessarily bound together in that system of thought around its core nucleus: the thought of independence, freedom, democracy and socialism.” The core nucleus is the thought of independence, freedom, democracy and socialism, not the thought on revolutionary ethics, so the statement is false."},{"id":"en01-29","cd":"01","l":"DS","q":"According to the course textbook, many contents reflecting Ho Chi Minh Thought are found not in written texts but in Ho Chi Minh's own practical leadership; therefore, studying Ho Chi Minh Thought requires combining text analysis with research into his practical activities.","o":[],"a":"D","g":"The course textbook states: “Many contents reflecting Ho Chi Minh Thought are found not in written texts but in the practical leadership of Ho Chi Minh himself” — this is why the course textbook sets out the “method of text analysis combined with research into Ho Chi Minh's practical activities.” The statement is true."},{"id":"en01-30","cd":"01","l":"DS","q":"According to the course textbook, the logical method studies things and phenomena in chronological order, following their course from emergence and development to their consequences.","o":[],"a":"S","g":"The course textbook states: “The logical method studies things in general terms in order to find the inherent essence of things and phenomena and generalise it into theory.” and “The historical method studies things and phenomena in chronological order, following their course from emergence and development to their consequences.” The statement attributes a feature of the historical method to the logical method, so it is false."},{"id":"en02-1","cd":"02","l":"DS","q":"The failure of the Can Vuong movement at the end of the 19th century showed that feudal ideology had become outdated and could not meet the historical tasks of the nation.","o":[],"a":"D","g":"The course textbook states clearly: “The armed uprisings under the ‘Can Vuong’ banner led by scholar-gentry and civil mandarins all ultimately failed. This proved that feudal ideology had become outdated in the face of the historical tasks.”"},{"id":"en02-2","cd":"02","l":"DS","q":"Although subjected to three layers of oppression and exploitation – by the colonialists, the capitalists and the feudalists – the Vietnamese working class at the end of the 19th and the beginning of the 20th century could not yet rise to become the leading force of the revolution because of its small numbers and instability.","o":[],"a":"S","g":"Although at first the workers were a small and unstable force, by the early 20th century they had developed and become a class just before the First World War (1914–1918). The course textbook affirms: “Only the working class is the most courageous, the most revolutionary, always boldly confronting the imperialists and colonialists”, and it was the workers' movement that created favourable conditions for Marxism–Leninism to penetrate and spread into Vietnam, ending the crisis of revolutionary line. This implies their potential leading role, although it is not officially affirmed here."},{"id":"en02-3","cd":"02","l":"DS","q":"The Russian October Revolution of 1917 had only local significance for Russia and did not create a decisive turning point for the national liberation movement in the world.","o":[],"a":"S","g":"The course textbook affirms that the Russian October Revolution “was the first victory of Marxism–Leninism in a large country” and “opened a new era in the history of humankind – the era of transition from capitalism to socialism on a world scale, opening the path of liberation for the oppressed nations of the world”. Clearly, it had global significance, not merely local significance."},{"id":"en02-4","cd":"02","l":"DS","q":"Patriotism is a fine traditional value of the Vietnamese nation, but it was only one of many motives for Ho Chi Minh to leave the country to seek a path to national salvation, not the key triggering factor.","o":[],"a":"S","g":"The course textbook affirms: “It was patriotism that was the ideological foundation, the starting point and the driving force that impelled Ho Chi Minh to leave the country to seek a path to national salvation, and to find in Marxism–Leninism the path to save the country and the people.” This shows that patriotism was the key triggering factor, not merely “one of many motives”."},{"id":"en02-5","cd":"02","l":"DS","q":"Ho Chi Minh mechanically inherited the Confucian idea of “rule by benevolence, rule by virtue” in managing society, without any innovation or creativity.","o":[],"a":"S","g":"The course textbook points out that Ho Chi Minh “paid attention to inheriting and renewing the idea of using rule by benevolence and rule by virtue to manage society” and “paid attention to inheriting, renewing and developing the Confucian spirit of valuing morality”. This refutes the claim that he inherited mechanically."},{"id":"en02-6","cd":"02","l":"DS","q":"Ho Chi Minh's talent for activity and for summarising practice was formed mainly through studying books and theoretical materials, not through his life experience and rich practical activity in many countries.","o":[],"a":"S","g":"The course textbook emphasises: “Ho Chi Minh had a rich and extraordinary life experience and revolutionary practice. Before becoming President, Ho Chi Minh had lived, studied and carried out revolutionary activity in nearly 30 countries around the world.” He understood imperialism and colonialism deeply not only through documents but “through life and practical activity”, and thoroughly understood the national liberation movement and the building of socialism through “taking part in founding the French Communist Party, through activity in China, through participating in the international communist movement in many countries, and through studying social life in the Soviet Union”. This shows "},{"id":"en02-7","cd":"02","l":"D1","q":"What was the deepest underlying cause of the failure of the patriotic movements following the bourgeois-democratic tendency in Vietnam in the early 20th century?","o":[["A","A lack of modern weapons and of unity among the people."],["B","The brutal repression by the French colonialists."],["C","The Vietnamese bourgeoisie was still weak in strength and organisation."],["D","The absence of a talented and outstanding leader."],["E","The outdatedness of feudal ideology."]],"a":"C","g":"The course textbook states clearly: “The patriotic movements following the bourgeois-democratic tendency mentioned above all failed. The underlying cause was that the Vietnamese bourgeoisie was still weak. The direct cause was that the organisations and leaders of the movements did not yet have a correct revolutionary line and method.”"},{"id":"en02-8","cd":"02","l":"D1","q":"Which of the following statements by Ho Chi Minh about the Vietnamese working class most clearly shows its vanguard role in the struggle for national liberation?","o":[["A","“Vietnamese workers suffer three layers of oppression and exploitation.”"],["B","“They quickly moved on to strikes and work stoppages.”"],["C","“Only the working class is the most courageous, the most revolutionary, always boldly confronting the imperialists and colonialists.”"],["D","“The workers' force at that time was still only a small, unstable force.”"],["E","“The workers developed further and became a class just before the First World War.”"]],"a":"C","g":"The course textbook quotes Ho Chi Minh: “Only the working class is the most courageous, the most revolutionary, always boldly confronting the imperialists and colonialists”. This statement directly affirms the vanguard role and revolutionary character of the working class, surpassing the other options, which only describe its situation or process of development."},{"id":"en02-9","cd":"02","l":"D1","q":"According to the course textbook, which theoretical element is considered the most important premise, playing the decisive role in the formation of Ho Chi Minh Thought?","o":[["A","The fine traditional values of the Vietnamese nation."],["B","The cultural quintessence of the East."],["C","The cultural quintessence of the West."],["D","Marxism–Leninism."],["E","The whole practical basis of Vietnam and the world."]],"a":"D","g":"The course textbook affirms: “Marxism–Leninism is the most important theoretical premise, playing the decisive role in the formation of Ho Chi Minh Thought.” The other elements are also important but are not assessed as “the most important” and “decisive”."},{"id":"en02-10","cd":"02","l":"D1","q":"Which views of Sun Yat-sen did Ho Chi Minh absorb and creatively develop along the path of proletarian revolution?","o":[["A","The idea of “Liberty – Equality – Fraternity” of the French Revolution."],["B","The views on human rights and civil rights in the American Declaration of Independence."],["C","The views on nationalism, people's rights and people's livelihood in the Three Principles of the People."],["D","The Confucian idea of “using rule by benevolence and rule by virtue to manage society”."],["E","The Buddhist philosophy of “compassion, altruism and love for human beings”."]],"a":"C","g":"The course textbook states clearly: “Ho Chi Minh creatively developed Sun Yat-sen's views on nationalism, people's rights and people's livelihood in th
