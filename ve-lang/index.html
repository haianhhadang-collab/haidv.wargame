ác sĩ phu, văn thân lãnh đạo cuối cùng đều thất bại."],["B","Phong trào dân chủ tư sản thất bại, nguyên nhân trực tiếp là chưa có đường lối và phương pháp cách mạng đúng đắn."],["C","Công nhân Việt Nam chịu ba tầng áp bức bóc lột và nhanh chóng phát triển từ TỰ GIÁC tiến tới TỰ PHÁT."],["D","Phong trào công nhân và phong trào yêu nước đầu thế kỷ XX tạo điều kiện thuận lợi để chủ nghĩa Mác – Lênin xâm nhập, truyền bá vào nước ta."],["E","Thực dân Pháp vẫn duy trì nền kinh tế nông nghiệp lạc hậu với khoảng 95% dân số là nông dân."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":61,"q":"Về giai cấp công nhân Việt Nam cuối thế kỷ XIX – đầu thế kỷ XX, nhận định nào sau đây SAI?","g":"Phân biệt “tạo điều kiện thuận lợi” với “trực tiếp chấm dứt”.","x":"Giáo trình chỉ viết phong trào công nhân và phong trào yêu nước “tạo điều kiện thuận lợi để chủ nghĩa Mác – Lênin xâm nhập, truyền bá vào đất nước ta”. Khủng hoảng đường lối được giải quyết qua việc Hồ Chí Minh truyền bá chủ nghĩa Mác – Lênin và sáng lập Đảng — chặng sau của mạch bài.","p":[["A","Từ hình thức đấu tranh thô sơ, phong trào công nhân đã nhanh chóng tiến tới đình công, bãi công."],["B","Công nhân chịu ba tầng áp bức bóc lột của thực dân, tư bản và phong kiến nên sớm vùng dậy đấu tranh chống giới chủ."],["C","Sự phát triển của giai cấp công nhân đã TRỰC TIẾP chấm dứt cuộc khủng hoảng về đường lối cứu nước."],["D","Công nhân xuất hiện cuối thế kỷ XIX và phát triển thành một giai cấp vào đầu thế kỷ XX."],["E","Cuối thế kỷ XIX, công nhân mới chỉ là một lực lượng ít ỏi, không ổn định."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":63,"q":"Theo giáo trình, sau khi các phong trào yêu nước đều thất bại, câu hỏi nào được thực tiễn Việt Nam đặt ra?","g":"Câu hỏi này nằm ngay sau câu “cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc”.","x":"Nguyên văn: “Xuất hiện câu hỏi từ thực tiễn đặt ra là: Cứu nước bằng con đường nào để có thể đi đến thắng lợi?” Đây là câu bắc cầu sang phần Hồ Chí Minh ra đi tìm đường cứu nước.","p":[["A","Làm thế nào để cải cách nền kinh tế nông nghiệp lạc hậu?"],["B","Cứu nước bằng con đường nào để có thể đi đến thắng lợi?"],["C","Xây dựng chính thể dân chủ cộng hòa theo mô hình nào?"],["D","Làm thế nào để giai cấp công nhân trở thành lực lượng lãnh đạo?"],["E","Dựa vào nước nào để đánh đuổi thực dân Pháp?"]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"}]},"03":{"ten":"Quá trình hình thành","ds":[{"s":1,"q":"Việc Hồ Chí Minh tham gia phong trào chống thuế ở Trung Kỳ năm 1908 đã cho thấy Người đã hoàn toàn đoạn tuyệt với mọi tư tưởng cải cách và chấp nhận con đường bạo động cách mạng ngay từ thời điểm đó.","g":"Xem xét bối cảnh \"thời kỳ trước năm 1911\" và chí hướng chính của Hồ Chí Minh trong giai đoạn này, cũng như cách Người nhìn nhận các phương pháp cứu nước của tiền bối.","x":"Trong thời kỳ trước năm 1911, Hồ Chí Minh hình thành tư tưởng yêu nước và chí hướng tìm đường cứu nước mới. Mặc dù Người đã tham gia phong trào chống thuế ở Trung Kỳ năm 1908, thể hiện rõ tư tưởng yêu nước trong hành động, nhưng Người vẫn đang trong quá trình \"suy ngẫm sâu sắc về Tổ quốc và thời cuộc\" và \"phê phán, không tán thành, không đi theo các phương pháp, khuynh hướng cứu nước của các vị khi đó\". Hành động này chưa phải là sự đoạn tuyệt hoàn toàn với mọi tư tưởng cải cách hay việc chấp nhận con đường bạo động cách mạng một cách dứt khoát, mà là một bước trong quá trình tìm tòi, khám phá con đường riêng.","d":0},{"s":2,"q":"Quan điểm \"Nhân dân lao động các nước, trong đó có giai cấp công nhân, đều bị bóc lột có thể là bạn của nhau; còn chủ nghĩa đế quốc, bọn thực dân ở đâu cũng là kẻ bóc lột, là kẻ thù của nhân dân lao động\" của Hồ Chí Minh hình thành ngay lập tức sau khi Người đặt chân đến Pháp vào năm 1911.","g":"Chú ý đến khoảng thời gian và quá trình Người đi nhiều nước trước khi hình thành nhận thức này.","x":"Nhận thức này không hình thành ngay lập tức khi Người đến Pháp năm 1911. Các Tài liệu môn học nêu rõ rằng \"Từ năm 1911 đến năm 1917, từ Pháp, Hồ Chí Minh đến nhiều nước trên thế giới. Qua cuộc hành trình này, ở Người hình thành một nhận thức mới\". Điều này cho thấy đây là kết quả của một quá trình trải nghiệm, quan sát và suy ngẫm lâu dài trong nhiều năm, qua nhiều quốc gia, chứ không phải một sự hình thành tức thời.","d":0},{"s":3,"q":"Việc Hồ Chí Minh gia nhập Đảng Xã hội Pháp vào năm 1919 chủ yếu vì Người đã nhận thức sâu sắc về chủ nghĩa Mác – Lênin và quyết tâm đi theo con đường cách mạng vô sản.","g":"Xem xét lý do ban đầu Người gia nhập Đảng Xã hội Pháp được nêu trong Tài liệu môn học.","x":"Tài liệu môn học cho biết năm 1919, Người gia nhập Đảng Xã hội giai cấp công dân Pháp \"bởi theo Người, đây là tổ chức theo đuổi lý tưởng cao quý Đại Cách mạng Pháp: Tự do, bình đẳng, bác ái\". Việc Hồ Chí Minh tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc theo con đường cách mạng vô sản qua nghiên cứu Luận cương của Lênin diễn ra sau đó, vào tháng 7/1920. Do đó, việc gia nhập Đảng Xã hội Pháp ban đầu không phải vì nhận thức sâu sắc về chủ nghĩa Mác – Lênin, mà vì lý tưởng tự do, bình đẳng, bác ái.","d":0},{"s":4,"q":"Tác phẩm \"Bản án chế độ thực dân Pháp\" và báo \"Le Paria\" của Hồ Chí Minh chỉ tập trung tố cáo tội ác của thực dân Pháp mà không có mục đích nào khác đối với nhân dân các nước thuộc địa.","g":"Suy luận về mục đích sâu xa hơn của các hoạt động báo chí và lý luận chính trị của Hồ Chí Minh trong giai đoạn 1920-1930.","x":"Mặc dù các tác phẩm như \"Bản án chế độ thực dân Pháp\" và báo \"Le Paria\" có mục đích lên án chủ nghĩa thực dân Pháp, nhưng mục tiêu sâu xa hơn của Hồ Chí Minh là \"thức tỉnh lương tri nhân dân Pháp và nhân loại tiến bộ, khơi dậy lòng yêu nước của nhân dân các dân tộc thuộc địa và của dân tộc Việt Nam\", cũng như \"thức tỉnh tinh thần giải phóng dân tộc của nhân dân các nước thuộc địa\". Như vậy, không chỉ tố cáo tội ác mà còn có mục đích thức tỉnh và khơi dậy tinh thần cách mạng.","d":0},{"s":5,"q":"Hội nghị Trung ương Đảng tháng 10/1930 đã khẳng định và phát triển thêm Cương lĩnh chính trị đầu tiên do Nguyễn Ái Quốc khởi thảo, đặc biệt là trong việc đặt nặng vấn đề dân tộc hơn vấn đề giai cấp.","g":"Nhớ lại những thách thức và sự hiểu lầm mà tư tưởng Hồ Chí Minh phải đối mặt trong giai đoạn 1920-1941, đặc biệt là nội dung của Nghị quyết Hội nghị Trung ương Đảng tháng 10/1930.","x":"Ngược lại, Hội nghị Trung ương Đảng tháng 10/1930 đã ra nghị quyết cho rằng \"Hội nghị hợp nhất Đảng do Nguyễn Ái Quốc chủ trì có nhiều sai lầm, “chỉ lo đến việc phản đế, mà quên mất lợi ích giai cấp tranh đấu ấy là một sự rất nguy hiểm”\" và \"thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\". Điều này cho thấy hội nghị đã phê phán, không chấp nhận, và phủ nhận những quan điểm của Cương lĩnh chính trị đầu tiên, chứ không phải khẳng định hay phát triển.","d":0},{"s":6,"q":"Khẩu hiệu \"Không có gì quý hơn độc lập, tự do\" của Hồ Chí Minh chỉ được nêu ra trong bối cảnh cuộc kháng chiến chống Mỹ cứu nước và không có giá trị xuyên suốt cho toàn bộ sự nghiệp cách mạng Việt Nam.","g":"Xem xét ý nghĩa của câu nói và bối cảnh được nhắc đến trong Tài liệu môn học, nhưng cũng suy luận về tinh thần chung trong tư tưởng của Người.","x":"Mặc dù câu nói \"Không có gì quý hơn độc lập, tự do\" được Hồ Chí Minh nêu ra trong Lời kêu gọi đồng bào và chiến sĩ cả nước vào ngày 17/7/1966, trong bối cảnh cuộc kháng chiến chống Mỹ, cứu nước, nhưng nó được mô tả là \"một chân lý của thời đại\". Tinh thần độc lập, tự do là mục tiêu xuyên suốt trong toàn bộ quá trình tìm đường cứu nước, giải phóng dân tộc và xây dựng đất nước của Hồ Chí Minh. Do đó, khẳng định rằng nó \"chỉ được nêu ra\" và \"không có giá trị xuyên suốt\" là sai.","d":0}],"tn":[{"s":7,"q":"Đâu là nguyên nhân sâu xa nhất khiến Hồ Chí Minh, dù khâm phục tinh thần yêu nước của các vị tiền bối như Phan Bội Châu, Phan Châu Trinh, Hoàng Hoa Thám, nhưng lại \"sáng suốt phê phán, không tán thành, không đi theo\" các phương pháp cứu nước của họ?","g":"Tập trung vào động lực và mục tiêu cao nhất của Hồ Chí Minh là tìm ra \"con đường cứu nước, cứu dân\" hiệu quả nhất, không chỉ là sự khác biệt cá nhân.","x":"Tài liệu môn học nêu rõ Hồ Chí Minh \"suy ngẫm sâu sắc về Tổ quốc và thời cuộc\" và \"không tán thành, không đi theo các phương pháp, khuynh hướng cứu nước của các vị khi đó\". Điều này ngụ ý rằng Người đã nhận ra những hạn chế cố hữu của các con đường đó, không đáp ứng được yêu cầu về một sự nghiệp giải phóng dân tộc triệt để, nên Người \"muốn tìm hiểu những gì ẩn giấu sau sức mạnh của kẻ thù và học hỏi kinh nghiệm cách mạng thế giới\" để tìm một con đường mới. Các phương án khác đưa ra những lý do không được Tài liệu môn học hỗ trợ hoặc là sự suy diễn không chính xác về động cơ của Người.","p":[["A","Người muốn chứng tỏ bản thân có con đường riêng độc đáo hơn hẳn."],["B","Người nhận thấy các phương pháp đó chưa đủ khả năng giải quyết tận gốc vấn đề độc lập dân tộc và vận mệnh nước nhà."],["C","Người không tin tưởng vào khả năng lãnh đạo của các vị tiền bối."],["D","Người cho rằng các phong trào đó đã hoàn toàn thất bại và không còn giá trị tham khảo."],["E","Người muốn tìm kiếm sự hỗ trợ từ các cường quốc phương Tây mà không thông qua các phong trào trong nước."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Đâu là dấu mốc quan trọng nhất đánh dấu sự \"kết hợp chặt chẽ chủ nghĩa yêu nước với lập trường cách mạng vô sản\" trong tư tưởng Hồ Chí Minh?","g":"Chú ý đến \"bước ngoặt quan trọng\" được Tài liệu môn học trực tiếp nhắc đến và ý nghĩa của nó.","x":"Tài liệu môn học khẳng định rõ ràng: \"Với những nhận thức cách mạng mới, Hồ Chí Minh cùng những người phái tả trong Đảng Xã hội Pháp tại Đại hội ở thành phố Tua (từ ngày 25 đến ngày 30/12/1920), bỏ phiếu tán thành Quốc tế Cộng sản, tham gia sáng lập Đảng Cộng sản Pháp, trở thành người cộng sản Việt Nam đầu tiên. Đây là bước ngoặt quan trọng trong cuộc đời của Hồ Chí Minh, bước ngoặt chủ nghĩa yêu nước kết hợp chặt chẽ với lập trường cách mạng vô sản\". Mặc dù việc nghiên cứu Luận cương của Lênin (phương án C) là tiền đề, nhưng hành động bỏ phiếu và tham gia sáng lập Đảng Cộng sản Pháp mới là sự cụ thể hóa, là dấu mốc chính thức của sự kết hợp này.","p":[["A","Gửi Yêu sách của nhân dân An Nam tới Hội nghị Vécxây (1919)."],["B","Gia nhập Đảng Xã hội Pháp (1919)."],["C","Nghiên cứu Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của V.I.Lênin (7/1920)."],["D","Tham gia sáng lập Đảng Cộng sản Pháp tại Đại hội ở thành phố Tua (12/1920)."],["E","Sáng lập báo Le Paria (1922)."]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam do Hồ Chí Minh khởi thảo đã giải quyết triệt để cuộc khủng hoảng đường lối cứu nước bằng cách đề ra mục tiêu chiến lược nào?","g":"Nhớ lại mục tiêu cụ thể được nêu trong Cương lĩnh chính trị đầu tiên và tác động của nó.","x":"Tài liệu môn học nêu rõ Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam nêu mục tiêu và con đường cách mạng là \"làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản\". Chính đường lối này đã chấm dứt cuộc khủng hoảng về đường lối cứu nước. Các phương án khác không phản ánh đúng hoặc sai lệch so với nội dung cốt lõi của Cương lĩnh.","p":[["A","Chỉ tập trung đánh đổ đế quốc Pháp để giành độc lập dân tộc."],["B","Thực hiện tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản."],["C","Thành lập ngay một chính phủ dân chủ cộng hòa và bỏ qua giai đoạn cách mạng dân tộc."],["D","Ưu tiên đấu tranh giai cấp hơn vấn đề giải phóng dân tộc."],["E","Kêu gọi sự giúp đỡ từ các nước tư bản phương Tây để thoát khỏi ách đô hộ."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":10,"q":"Điều gì đã thể hiện rõ nhất sự vận dụng sáng tạo và phát triển chủ nghĩa Mác – Lênin trong Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam do Hồ Chí Minh khởi thảo?","g":"Tập trung vào điểm nổi bật nhất của Cương lĩnh được Tài liệu môn học nhấn mạnh về sự \"vận dụng sáng tạo\".","x":"Tài liệu môn học khẳng định: \"Bản Cương lĩnh chính trị đầu tiên này đã thể hiện rõ sự vận dụng sáng tạo và phát triển chủ nghĩa Mác- Lênin trong việc giải quyết mối quan hệ giai cấp - dân tộc - quốc tế trong đường lối cách mạng Việt Nam\". Đây chính là điểm sáng tạo cốt lõi của Cương lĩnh, khác biệt với cách tiếp cận giáo điều.","p":[["A","Hoàn toàn tuân thủ các chỉ thị của Quốc tế Cộng sản mà không điều chỉnh."],["B","Phủ nhận vai trò của giai cấp công nhân trong lãnh đạo cách mạng."],["C","Giải quyết mối quan hệ giai cấp - dân tộc - quốc tế trong đường lối cách mạng Việt Nam."],["D","Ưu tiên nhiệm vụ cách mạng xã hội chủ nghĩa trước nhiệm vụ dân tộc dân chủ."],["E","Đề cao vai trò của địa chủ và tư sản dân tộc trong liên minh cách mạng."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":11,"q":"Hội nghị Trung ương Đảng tháng 5/1941 tại Pác Bó đã đưa ra quyết sách mang tính đột phá, phù hợp với tư tưởng Hồ Chí Minh, đó là:","g":"Nhớ lại những điều chỉnh chiến lược quan trọng của Đảng trong bối cảnh mới và vai trò của Hồ Chí Minh trong Hội nghị này.","x":"Hội nghị Trung ương Đảng tháng 5/1941 do Hồ Chí Minh chủ trì đã \"đặt nhiệm vụ giải phóng dân tộc lên hàng đầu\" và \"tạm thời gác lại khẩu hiệu cách mạng điền địa\". Đồng thời, Nghị quyết cũng khẳng định \"Trong lúc này quyền lợi dân tộc giải phóng cao hơn hết thảy\" và \"quyền lợi của bộ phận, của giai cấp phải đặt dưới sự sinh tử, tồn vong của quốc gia, của dân tộc\". Điều này thể hiện sự chuyển hướng chiến lược quan trọng.","p":[["A","Tiếp tục duy trì khẩu hiệu cách mạng điền địa như trọng tâm."],["B","Đặt nhiệm vụ đấu tranh giai cấp lên hàng đầu, cao hơn quyền lợi dân tộc."],["C","Tạm gác khẩu hiệu cách mạng điền địa và đặt nhiệm vụ giải phóng dân tộc lên hàng đầu."],["D","Quyết định thành lập Chính phủ Liên bang Cộng hòa dân chủ Đông Dương."],["E","Phê phán và bác bỏ việc thành lập Mặt trận Việt Minh."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":12,"q":"Chiến lược \"Dĩ bất biến, ứng vạn biến\" mà Hồ Chí Minh chỉ đạo trong giai đoạn 1945-1946 nhằm mục tiêu cốt lõi nào?","g":"Suy luận về ý nghĩa của cụm từ \"bất biến\" và \"vạn biến\" trong bối cảnh tình hình \"ngàn cân treo sợi tóc\" của chính quyền cách mạng non trẻ.","x":"Tài liệu môn học nêu rõ, với phương châm \"Dĩ bất biến, ứng vạn biến\", Hồ Chí Minh đã \"giữ vững mục tiêu đấu tranh cho chủ quyền độc lập dân tộc, tự do, ấm no, hạnh phúc cho nhân dân bằng các sách lược cách mạng linh hoạt mềm dẻo\". Các phương án khác không phản ánh đúng bản chất hoặc làm sai lệch mục tiêu cốt lõi của chiến lược này.","p":[["A","Kéo dài thời gian để chờ đợi sự hỗ trợ từ các nước đồng minh."],["B","Giữ vững mục tiêu đấu tranh cho chủ quyền độc lập dân tộc, tự do, ấm no, hạnh phúc cho nhân dân."],["C","Chỉ tập trung vào việc gây chia rẽ giữa các thế lực đế quốc mà không quan tâm đến xây dựng lực lượng nội bộ."],["D","Từ bỏ hoàn toàn nguyên tắc để đạt được hòa bình bằng mọi giá."],["E","Tránh mọi xung đột vũ trang dù phải hy sinh một phần chủ quyền quốc gia."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":13,"q":"Phát biểu nào sau đây KHÔNG đúng về ảnh hưởng của gia đình và quê hương đến Hồ Chí Minh trong thời kỳ trước năm 1911?","g":"Tập trung vào thông tin về Tài liệu môn học gốc gia đình và tầng lớp xã hội được nhắc đến.","x":"Tài liệu môn học nêu rõ Hồ Chí Minh sinh ra trong một gia đình \"khoa bảng\". Cụ Nguyễn Sinh Sắc đỗ Phó bảng và tinh thần yêu nước, thương dân của cụ có ảnh hưởng lớn đến Hồ Chí Minh. Cụ Hoàng Thị Loan được mô tả là \"người mẹ Việt Nam điển hình với đức tính nhân hậu, tần tảo, đảm đang\". Nghệ An là vùng đất \"địa linh nhân kiệt, giàu truyền thống yêu nước\". Việc cụ Nguyễn Sinh Sắc tâm sự \"Quan trường là nô lệ trong những người nô lệ, lại càng nô lệ hơn\" và dạy các con \"Đừng lấy phong cách nhà quan làm phong cách nhà ta\" càng khẳng định gia đình Người không hề thuộc tầng lớp địa chủ phong kiến giàu có, mà là một gia đình khoa bảng với nhân cách thanh liêm, yêu nước. Do đó, phương án D là sai.","p":[["A","Cụ Nguyễn Sinh Sắc, thân sinh của Người, đã đỗ Phó bảng và có tinh thần yêu nước, thương dân sâu sắc."],["B","Mẹ Người, Cụ Hoàng Thị Loan, là người phụ nữ Việt Nam điển hình với đức tính nhân hậu, tần tảo, đảm đang."],["C","Quê hương Nghệ An là vùng đất giàu truyền thống yêu nước, có nhiều anh hùng dân tộc."],["D","Gia đình Hồ Chí Minh thuộc tầng lớp địa chủ phong kiến giàu có."],["E","Cụ Nguyễn Sinh Sắc thường dạy các con không lấy phong cách nhà quan làm phong cách nhà ta."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":14,"q":"Đặc điểm nào dưới đây KHÔNG thuộc quá trình Hồ Chí Minh hình thành tư tưởng cứu nước, giải phóng dân tộc theo con đường cách mạng vô sản trong giai đoạn 1911 – 1920?","g":"Xem xét cẩn thận các hoạt động và nhận thức của Hồ Chí Minh trong khoảng thời gian này, đặc biệt là sự khác biệt giữa \"hình thành tư tưởng\" và \"thực hiện/triển khai\".","x":"Trong giai đoạn 1911-1920, Hồ Chí Minh đã đi nhiều nước để tìm hiểu bản chất của chủ nghĩa thực dân và hình thành nhận thức về sự đoàn kết của nhân dân lao động. Người đã trở thành người cộng sản Việt Nam đầu tiên vào cuối năm 1920 và gửi Yêu sách của nhân dân An Nam tại Hội nghị Vécxây vào năm 1919. Tuy nhiên, các Tài liệu môn học không hề đề cập đến việc Người chủ trương thành lập ngay một đảng cộng sản để lãnh đạo bạo động vũ trang ở Việt Nam trong giai đoạn này. Việc thành lập Đảng Cộng sản Việt Nam diễn ra sau đó (1930), và đó là quá trình chuẩn bị lâu dài, không phải là một chủ trương \"ngay lập tức\" trong giai đoạn này.","p":[["A","Đi nhiều nước trên thế giới để tìm hiểu bản chất của chủ nghĩa thực dân."],["B","Hình thành nhận thức về sự đoàn kết giữa nhân dân lao động các nước."],["C","Trở thành người cộng sản Việt Nam đầu tiên."],["D","Chủ trương thành lập ngay một đảng cộng sản để lãnh đạo bạo động vũ trang ở Việt Nam."],["E","Đưa ra Yêu sách của nhân dân An Nam tại Hội nghị Vécxây."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":15,"q":"Hoạt động nào sau đây KHÔNG thuộc giai đoạn 1920 – 1930, thời kỳ hình thành những nội dung cơ bản tư tưởng về cách mạng Việt Nam?","g":"Chú ý kỹ mốc thời gian của từng sự kiện được nhắc đến trong Tài liệu môn học.","x":"Sáng lập báo Le Paria (1922), xuất bản tác phẩm \"Bản án chế độ thực dân Pháp\" (1925), sáng lập Hội Việt Nam Cách mạng Thanh niên (tháng 6/1925), và chủ trì Hội nghị hợp nhất các tổ chức cộng sản Việt Nam (đầu năm 1930) đều thuộc giai đoạn 1920-1930. Tuy nhiên, Đội Việt Nam Tuyên truyền Giải phóng quân được thành lập vào ngày 22/12/1944, thuộc giai đoạn 1941-1969. Do đó, phương án E là sai.","p":[["A","Sáng lập báo Le Paria bằng tiếng Pháp."],["B","Xuất bản tác phẩm \"Bản án chế độ thực dân Pháp\"."],["C","Sáng lập Hội Việt Nam Cách mạng Thanh niên."],["D","Chủ trì Hội nghị hợp nhất các tổ chức cộng sản Việt Nam."],["E","Sáng lập Đội Việt Nam Tuyên truyền Giải phóng quân."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":16,"q":"Tuyên bố nào dưới đây KHÔNG phản ánh đúng những thách thức mà tư tưởng Hồ Chí Minh phải đối mặt trong giai đoạn 1920 – 1941?","g":"Nhớ lại quá trình Hồ Chí Minh vượt qua thử thách và sự trở lại của đường lối của Người.","x":"Tài liệu môn học cho thấy Hồ Chí Minh đã phải đối mặt với nhiều thách thức, bao gồm việc bị kẻ thù đàn áp (thoát khỏi nhà tù thực dân Anh), bị hiểu lầm và phê phán từ nội bộ Quốc tế Cộng sản và Đảng Cộng sản Đông Dương, Cương lĩnh bị coi là \"hữu khuynh\", \"dân tộc chủ nghĩa\", và Hội nghị Trung ương Đảng tháng 10/1930 đã \"thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\". Tuy nhiên, đường lối của Người đã được Đảng Cộng sản Đông Dương khẳng định và trở thành yếu tố chỉ đạo cách mạng Việt Nam từ Hội nghị Trung ương Đảng tháng 5/1941. Thực chất, sự chuyển hướng chiến lược từ Hội nghị tháng 11/1939 và tháng 5/1941 là \"sự trở về với quan điểm của Hồ Chí Minh đã nêu ra từ trong Cương lĩnh chính trị đầu tiên của Đảng\". Do đó, khẳng định \"không bao giờ được chấp nhận trở lại\" là sai.","p":[["A","Bị kẻ thù đàn áp, bắt bớ."],["B","Bị một số người trong Quốc tế Cộng sản và Đảng Cộng sản Đông Dương hiểu lầm và phê phán."],["C","Cương lĩnh chính trị đầu tiên bị coi là \"hữu khuynh\", \"dân tộc chủ nghĩa\"."],["D","Hội nghị Trung ương Đảng tháng 10/1930 ra nghị quyết \"thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\"."],["E","Toàn bộ đường lối cách mạng của Người đã bị Quốc tế Cộng sản bác bỏ hoàn toàn và không bao giờ được chấp nhận trở lại."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Mục tiêu nào sau đây KHÔNG phải là một trong hai nhiệm vụ chiến lược được Hồ Chí Minh xác định và lãnh đạo thực hiện trong giai đoạn 1954 – 1969?","g":"Tập trung vào những nhiệm vụ chiến lược cụ thể được Người đề ra cho hai miền trong giai đoạn này và bản chất của cuộc đấu tranh.","x":"Trong giai đoạn 1954-1969, Hồ Chí Minh đã xác định và lãnh đạo thực hiện đường lối \"cùng một lúc thi hành hai nhiệm vụ chiến lược của Cách mạng Việt Nam: Xây dựng chủ nghĩa xã hội ở miền Bắc, tiếp tục cách mạng dân tộc dân chủ nhân dân ở miền Nam\". Mục tiêu cuối cùng là \"độc lập, thống nhất nước nhà\". Đồng thời, Người cũng \"bổ sung hoàn thiện hệ thống quan điểm cơ bản của Cách mạng Việt Nam trên tất cả các lĩnh vực\". Việc \"tăng cường hợp tác quân sự với Pháp\" là hoàn toàn trái ngược với đường lối và mục tiêu của cách mạng Việt Nam trong thời kỳ này, khi Pháp đã rút khỏi Việt Nam sau chiến thắng Điện Biên Phủ năm 1954.","p":[["A","Xây dựng chủ nghĩa xã hội ở miền Bắc."],["B","Tiếp tục cách mạng dân tộc dân chủ nhân dân ở miền Nam."],["C","Độc lập, thống nhất nước nhà cho tất cả nhân sinh."],["D","Tăng cường hợp tác quân sự với Pháp để bảo vệ miền Nam."],["E","Bổ sung hoàn thiện hệ thống quan điểm cơ bản của Cách mạng Việt Nam trên nhiều lĩnh vực."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":18,"q":"Luận điểm nào dưới đây KHÔNG phản ánh đúng nội dung cốt lõi của Lời kêu gọi toàn quốc kháng chiến (19/12/1946) do Hồ Chí Minh đề ra?","g":"Nhớ lại bản chất của Lời kêu gọi và đối tượng được kêu gọi.","x":"Tài liệu môn học nêu rõ Lời kêu gọi toàn quốc kháng chiến (19/12/1946) đã \"thể hiện khái quát đường lối kháng chiến chống thực dân Pháp\" và là \"lời thề thiêng liêng bảo vệ Tổ quốc của dân tộc Việt Nam, với ý chí, quyết tâm thà hi sinh tất cả chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ\". Đường lối kháng chiến là \"lâu dài toàn dân, toàn diện, tự lực cánh sinh\". Việc \"kêu gọi quân đội Pháp quay trở lại Đông Dương\" là hoàn toàn phi lý và trái ngược với tinh thần kháng chiến chống thực dân Pháp.","p":[["A","Thể hiện ý chí quyết tâm \"thà hi sinh tất cả chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ\"."],["B","Vạch rõ đường lối kháng chiến lâu dài toàn dân, toàn diện, tự lực cánh sinh."],["C","Kêu gọi quân đội Pháp quay trở lại Đông Dương để hỗ trợ chính quyền cách mạng."],["D","Là lời thề thiêng liêng bảo vệ Tổ quốc của dân tộc Việt Nam."],["E","Là sự tổng kết khái quát đường lối kháng chiến chống thực dân Pháp."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":25,"q":"Sau khi Hồ Chí Minh nghiên cứu \"Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa\" của V.I.Lênin vào tháng 7/1920, Người đã tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc Việt Nam theo con đường _______.","g":"Nhớ lại tầm quan trọng của Luận cương Lênin đối với quá trình hình thành tư tưởng của Hồ Chí Minh.","x":"Tài liệu môn học cho biết: \"Hồ Chí Minh đã tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc Việt Nam theo con đường cách mạng vô sản qua nghiên cứu Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa (để trình bày tại Đại hội II Quốc tế Cộng sản) của V.I.Lênin... vào tháng 7/1920\".","p":[["A","cách mạng tư sản"],["B","cải cách ôn hòa"],["C","cách mạng vô sản"],["D","chủ nghĩa dân tộc thuần túy"],["E","chủ nghĩa đế quốc"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":26,"q":"Để chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam, Hồ Chí Minh đã biên soạn và xuất bản tác phẩm _______ vào năm 1927 tại Quảng Châu, Trung Quốc.","g":"Nhớ lại tên tác phẩm quan trọng được xuất bản trong giai đoạn chuẩn bị thành lập Đảng.","x":"Tài liệu môn học nêu rõ: \"Những nội dung cốt lõi đó và nhiều vấn đề trong đường lối, phương pháp cách mạng Việt Nam được thể hiện trong tác phẩm Đường cách mệnh của Người xuất bản năm 1927 ở Quảng Châu, Trung Quốc. Tác phẩm là sự chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam\".","p":[["A","Bản án chế độ thực dân Pháp"],["B","Con đường giải phóng"],["C","Tuyên ngôn độc lập"],["D","Đường cách mệnh"],["E","Lời kêu gọi toàn quốc kháng chiến"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":27,"q":"Hội nghị Trung ương Đảng tháng 10/1930 đã ra Án nghị quyết \"Thủ tiêu Chánh cương, Sách lược và Điều lệ Đảng\" và đổi tên Đảng Cộng sản Việt Nam thành _______.","g":"Nhớ lại sự thay đổi tên Đảng trong bối cảnh những hiểu lầm về Cương lĩnh chính trị đầu tiên.","x":"Tài liệu môn học cho biết Hội nghị Trung ương Đảng họp tháng 10/1930 đã \"bỏ tên Đảng Cộng sản Việt Nam do Hồ Chí Minh và những người tham gia Hội nghị thành lập Đảng xác định, lấy tên là Đảng Cộng sản Đông Dương\".","p":[["A","Đảng Lao động Việt Nam"],["B","Đảng Cộng sản Đông Dương"],["C","Đảng Dân chủ Việt Nam"],["D","Đảng Xã hội Việt Nam"],["E","Mặt trận Việt Minh"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":28,"q":"Tư tưởng Hồ Chí Minh đã trở thành yếu tố chỉ đạo cách mạng Việt Nam từ Hội nghị Trung ương Đảng tháng 5/1941, tại đây, Người đã khẳng định: \"Trong lúc này quyền lợi _______ cao hơn hết thảy.\"","g":"Nhớ lại lời khẳng định trọng tâm của Hồ Chí Minh tại Hội nghị Pác Bó, nhấn mạnh nhiệm vụ hàng đầu.","x":"Tại Hội nghị Ban Chấp hành Trung ương Đảng tháng 5/1941, Hồ Chí Minh đã \"khẳng định rõ: “Trong lúc này quyền lợi dân tộc giải phóng cao hơn hết thảy. Chúng ta phải đoàn kết lại đánh đổ bọn đế quốc và bọn Việt gian đặng cứu giống nòi ra khỏi nước sôi lửa nóng”\".","p":[["A","giai cấp công nhân"],["B","liên minh công nông"],["C","dân tộc giải phóng"],["D","quốc tế vô sản"],["E","của Đảng"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":29,"q":"Để đối phó với tình thế \"ngàn cân treo sợi tóc\" sau Cách mạng Tháng Tám, Hồ Chí Minh đã chỉ đạo thành công sách lược cách mạng linh hoạt, mềm dẻo với phương châm nổi tiếng: \"_______\".","g":"Nhớ lại triết lý chỉ đạo sách lược của Hồ Chí Minh trong giai đoạn chính quyền non trẻ phải đối phó với nhiều thế lực thù địch.","x":"Tài liệu môn học nêu rõ: \"Với phương châm “Dĩ bất biến, ứng vạn biến”, giữ vững mục tiêu đấu tranh cho chủ quyền độc lập dân tộc, tự do, ấm no, hạnh phúc cho nhân dân bằng các sách lược cách mạng linh hoạt mềm dẻo, Người đã chỉ đạo thành công sách lược...\".","p":[["A","Độc lập, tự do"],["B","Dĩ bất biến, ứng vạn biến"],["C","Thêm bạn, bớt thù"],["D","Tự lực cánh sinh"],["E","Không có gì quý hơn độc lập, tự do"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Điều mong muốn cuối cùng của Hồ Chí Minh trước khi đi xa là \"Toàn Đảng, toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh và góp phần xứng đáng và sự nghiệp _______ thế giới\".","g":"Nhớ lại nội dung Di chúc và tầm nhìn của Hồ Chí Minh về tương lai của Việt Nam và vai trò của Việt Nam trong bối cảnh rộng lớn hơn.","x":"Trong Di chúc của mình, Hồ Chí Minh đã mong muốn: \"Toàn Đảng, toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh và góp phần xứng đáng và sự nghiệp cách mạng thế giới\".","p":[["A","công nghiệp hóa"],["B","hiện đại hóa"],["C","cách mạng"],["D","hội nhập"],["E","phát triển kinh tế"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"}]},"04":{"ten":"Độc lập dân tộc","ds":[{"s":1,"q":"Tư tưởng Hồ Chí Minh về quyền dân tộc tự quyết chỉ hình thành rõ nét sau Cách mạng Tháng Tám năm 1945.","g":"Xem xét sự kiện nào đánh dấu sự hình thành tư tưởng này lần đầu tiên theo Tài liệu môn học.","x":"Tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa, trước hết là quyền bình đẳng và tự do, đã hình thành lần đầu tiên từ sự kiện Người gửi bản Yêu sách của nhân dân An Nam tới Hội nghị Vécxây năm 1919. Điều này cho thấy tư tưởng đã có từ rất sớm, trước Cách mạng Tháng Tám 1945.","d":0},{"s":2,"q":"Khi khẳng định \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\", Hồ Chí Minh đã bác bỏ hoàn toàn học thuyết \"Tam dân\" của Tôn Trung Sơn.","g":"Kiểm tra thái độ của Hồ Chí Minh đối với học thuyết \"Tam dân\" trong Tài liệu môn học.","x":"Tài liệu môn học cho biết Hồ Chí Minh đã \"đánh giá cao học thuyết “Tam dân” của Tôn Trung Sơn về độc lập và tự do: dân tộc độc lập, dân quyền tự do và dân sinh hạnh phúc\". Câu nói trên chỉ nhấn mạnh rằng độc lập phải đi đôi với tự do, hạnh phúc của nhân dân, chứ không phải bác bỏ học thuyết Tam dân mà Người đánh giá cao.","d":0},{"s":3,"q":"Tư tưởng độc lập dân tộc gắn liền với thống nhất Tổ quốc, toàn vẹn lãnh thổ chỉ xuất hiện rõ nét trong tư tưởng Hồ Chí Minh sau khi Hiệp định Giơnevơ năm 1954 được ký kết.","g":"Tìm hiểu bối cảnh lịch sử và các tuyên bố của Hồ Chí Minh về thống nhất lãnh thổ trước và sau năm 1954 được đề cập trong Tài liệu môn học.","x":"Mặc dù Người tiếp tục kiên trì đấu tranh để thống nhất Tổ quốc sau Hiệp định Giơnevơ năm 1954, tư tưởng này đã được thể hiện từ rất sớm. Cụ thể, trong Thư gửi đồng bào Nam Bộ (năm 1946), Hồ Chí Minh đã khẳng định: \"Đồng bào Nam Bộ là dân nước Việt Nam. Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\", nhằm chống lại âm mưu chia cắt của thực dân Pháp với \"Nam Kỳ tự trị\". Điều này chứng tỏ tư tưởng đã có trước năm 1954 và là tư tưởng xuyên suốt.","d":0},{"s":4,"q":"Mục tiêu \"Làm cho nước Nam được hoàn toàn độc lập\" trong Chánh cương vắn tắt của Đảng (năm 1930) đã thể hiện tư tưởng Hồ Chí Minh về một nền độc lập dân tộc phải thật sự, hoàn toàn và triệt để.","g":"Xem xét mục tiêu này dưới góc độ toàn diện của độc lập dân tộc theo tư tưởng Hồ Chí Minh được phát triển sau này trong Tài liệu môn học.","x":"Mục tiêu \"Làm cho nước Nam được hoàn toàn độc lập\" là nền tảng cho việc xây dựng một nền độc lập không chỉ về danh nghĩa mà còn trên tất cả các lĩnh vực (ngoại giao, quân sự, tài chính), như Người đã nhấn mạnh về một nền độc lập thật sự, hoàn toàn và triệt để. Đây là bước đầu quan trọng để đạt được nền độc lập toàn diện.","d":1},{"s":5,"q":"Khẩu hiệu \"Không có gì quý hơn độc lập, tự do\" (17/7/1966) được Hồ Chí Minh đưa ra trong bối cảnh đế quốc Mỹ mở rộng chiến tranh phá hoại miền Bắc và tiến hành chiến lược \"Chiến tranh cục bộ\" ở miền Nam.","g":"Xác định bối cảnh lịch sử cụ thể khi Hồ Chí Minh nêu lên chân lý này được đề cập trong Tài liệu môn học.","x":"Tài liệu môn học nêu rõ: \"Năm 1965, đế quốc Mỹ tăng cường mở rộng chiến tranh ở Việt Nam: Ồ ạt đưa quân viễn chinh Mỹ, chư hầu vào miền Nam tiến hành chiến lược “Chiến tranh cục bộ” và gây chiến tranh phá hoại miền Bắc. Trong hoàn cảnh khó khăn, chiến tranh ác liệt đó, Hồ Chí Minh đã nêu lên một chân lý thời đại... “Không có gì quý hơn độc lập, tự do”\". Năm 1965 là bối cảnh Mỹ mở rộng chiến tranh; câu nói được Hồ Chí Minh nêu ngày 17/7/1966, trong Lời kêu gọi đồng bào và chiến sĩ cả nước.","d":1},{"s":6,"q":"Trong lời kêu gọi Liên hợp quốc năm 1946, Hồ Chí Minh chỉ nhấn mạnh đến mong muốn hòa bình của nhân dân Việt Nam mà không đề cập đến quyết tâm bảo vệ độc lập.","g":"Đọc kỹ nội dung lời kêu gọi Liên hợp quốc năm 1946 trong Tài liệu môn học.","x":"Tài liệu môn học ghi rõ: \"Trong lời kêu gọi Liên hợp quốc năm 1946, một lần nữa Hồ Chí Minh khẳng định: “Nhân dân chúng tôi thành thật mong muốn hòa bình. Nhưng nhân dân chúng tôi cũng kiên quyết chiến đấu đến cùng để bảo vệ những quyền thiêng liêng nhất: Toàn vẹn lãnh thổ cho Tổ quốc và độc lập cho đất nước”\". Điều này cho thấy Người nhấn mạnh cả mong muốn hòa bình và quyết tâm chiến đấu bảo vệ độc lập.","d":0}],"tn":[{"s":7,"q":"Sự kiện nào sau đây thể hiện rõ nhất lần đầu tiên tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa, đặc biệt là quyền bình đẳng và tự do, đã hình thành?","g":"Tìm đoạn văn đề cập đến sự hình thành lần đầu tiên của tư tưởng này trong Tài liệu môn học.","x":"Tài liệu môn học chỉ rõ: \"Năm 1919... thay mặt những người Việt Nam yêu nước, Hồ Chí Minh đã gửi tới Hội nghị bản Yêu sách của nhân dân An Nam... Bản yêu sách không được Hội nghị chấp nhận nhưng qua sự kiện trên cho thấy lần đầu tiên, tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa mà trước hết là quyền bình đẳng và tự do đã hình thành\".","p":[["A","Việc Người tham gia sáng lập Đảng Cộng sản Pháp năm 1920."],["B","Việc Người gửi bản Yêu sách của nhân dân An Nam tới Hội nghị Vécxây năm 1919."],["C","Sự ra đời của Chánh cương vắn tắt của Đảng năm 1930."],["D","Tuyên bố độc lập của Việt Nam Dân chủ Cộng hòa năm 1945."],["E","Sự kiện Người sang Liên Xô tìm hiểu về chủ nghĩa Mác - Lênin."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Tư tưởng Hồ Chí Minh về sự gắn liền giữa độc lập dân tộc với tự do, hạnh phúc của nhân dân được thể hiện xuyên suốt qua các mục tiêu nào trong Chánh cương vắn tắt của Đảng (năm 1930)?","g":"Đọc kỹ các mục tiêu được nêu trong Chánh cương vắn tắt trong Tài liệu môn học.","x":"Trong Chánh cương vắn tắt của Đảng (1930), Hồ Chí Minh không chỉ xác định mục tiêu chính trị là \"Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến. Làm cho nước Nam được hoàn toàn độc lập\", mà còn đề ra các mục tiêu xã hội như \"Thủ tiêu hết các thứ quốc trái… Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo. Bỏ sưu thuế cho dân cày nghèo… Thi hành luật ngày làm 8 giờ\". Điều này cho thấy sự gắn kết chặt chẽ giữa độc lập dân tộc với tự do, hạnh phúc và quyền lợi của nhân dân ngay từ đầu.","p":[["A","Chỉ tập trung vào việc đánh đổ đế quốc thực dân."],["B","Bao gồm các mục tiêu chính trị và mục tiêu xã hội cụ thể nhằm cải thiện đời sống nhân dân."],["C","Chỉ dừng lại ở việc tuyên bố quyền độc lập về mặt pháp lý."],["D","Ưu tiên quyền tự quyết về ngoại giao và quân sự."],["E","Tập trung vào việc xây dựng nền kinh tế tư bản độc lập."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Câu nói \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\" của Hồ Chí Minh sau Cách mạng Tháng Tám năm 1945 chủ yếu khẳng định điều gì?","g":"Liên hệ câu nói với chủ đề chính của phần b) trong Tài liệu môn học.","x":"Câu nói này được trích dẫn trong phần \"Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân\". Người nhấn mạnh rằng mục đích cuối cùng của độc lập là mang lại cuộc sống tốt đẹp cho nhân dân, chứ không phải chỉ là một danh xưng chính trị.","p":[["A","Độc lập dân tộc phải gắn liền với sự hỗ trợ từ các nước xã hội chủ nghĩa."],["B","Sự quan trọng của việc xây dựng một quân đội mạnh."],["C","Độc lập dân tộc phải gắn liền với quyền tự do và hạnh phúc thực sự của nhân dân."],["D","Độc lập dân tộc chỉ có ý nghĩa khi có toàn vẹn lãnh thổ."],["E","Sự cần thiết của việc nhanh chóng tiến hành cách mạng xã hội chủ nghĩa."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":10,"q":"Khi Hồ Chí Minh khẳng định \"Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\" trong Thư gửi đồng bào Nam Bộ năm 1946, Người muốn nhấn mạnh điều gì?","g":"Đọc bối cảnh của bức thư này trong Tài liệu môn học và âm mưu của thực dân Pháp.","x":"Bức thư này được viết trong bối cảnh thực dân Pháp bày ra cái gọi là \"Nam Kỳ tự trị\" nhằm chia cắt nước ta. Hồ Chí Minh đã khẳng định \"Đồng bào Nam Bộ là dân nước Việt Nam. Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\" để bác bỏ âm mưu chia cắt và khẳng định tính thống nhất, toàn vẹn lãnh thổ của Việt Nam.","p":[["A","Vẻ đẹp vĩnh cửu của thiên nhiên Việt Nam."],["B","Tinh thần đoàn kết của toàn dân tộc trong mọi hoàn cảnh."],["C","Sự bất biến của chân lý Nam Bộ là một phần không thể tách rời của Việt Nam."],["D","Quyết tâm chiến đấu đến cùng để bảo vệ độc lập dân tộc."],["E","Vai trò lãnh đạo của Đảng Cộng sản Việt Nam."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":11,"q":"Yếu tố nào sau đây là tiêu chí quan trọng nhất để phân biệt một \"nền độc lập thật sự\" với một \"nền độc lập giả hiệu\" theo tư tưởng Hồ Chí Minh?","g":"Xem xét nội dung phần c) về độc lập thật sự, hoàn toàn và triệt để trong Tài liệu môn học.","x":"Tài liệu môn học nhấn mạnh: \"độc lập mà người dân tộc không có quyền tự quyết về ngoại giao, không có quân đội riêng, không có nền tài chính riêng…, thì độc lập đó chẳng có ý nghĩa gì\". Đây chính là những yếu tố cốt lõi để phân biệt độc lập thật sự với độc lập giả hiệu do bọn thực dân, đế quốc mị dân.","p":[["A","Khả năng thiết lập quan hệ ngoại giao với các nước lớn."],["B","Việc có một chính phủ bản xứ do người dân bầu ra."],["C","Quyền tự quyết triệt để về ngoại giao, quân sự và tài chính của dân tộc."],["D","Sự công nhận của cộng đồng quốc tế."],["E","Việc cấm chỉ mọi hoạt động của các thế lực đế quốc trên lãnh thổ."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":12,"q":"Tuyên ngôn độc lập năm 1945 của Hồ Chí Minh, bên cạnh việc trịnh trọng tuyên bố nền độc lập, còn thể hiện ý chí và quyết tâm mạnh mẽ của dân tộc Việt Nam thông qua nội dung nào?","g":"Đọc kỹ đoạn trích Tuyên ngôn độc lập năm 1945 trong Tài liệu môn học.","x":"Tài liệu môn học ghi rõ, trong Tuyên ngôn độc lập năm 1945, Hồ Chí Minh tuyên bố \"Nước Việt Nam có quyền hưởng tự do và độc lập, và sự thực đã thành một nước tự do và độc lập. Toàn thể dân Việt Nam quyết đem tất cả tinh thần và lực lượng, tính mệnh và của cải để giữ vững quyền tự do và độc lập ấy\". Điều này thể hiện ý chí và quyết tâm bảo vệ độc lập.","p":[["A","Kêu gọi sự hỗ trợ từ các cường quốc đồng minh."],["B","Trình bày chi tiết kế hoạch phát triển kinh tế sau độc lập."],["C","Khẳng định quyền hưởng tự do và độc lập, đồng thời quyết tâm bảo vệ quyền ấy bằng mọi giá."],["D","Nêu rõ các điều khoản chấm dứt sự cai trị của thực dân Pháp."],["E","Phân tích bối cảnh quốc tế thuận lợi cho Việt Nam."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":13,"q":"Trong các tuyên bố và hành động của Hồ Chí Minh, điều nào sau đây KHÔNG phản ánh tư tưởng độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân?","g":"So sánh các phương án với nội dung phần b) của tư tưởng Hồ Chí Minh trong Tài liệu môn học.","x":"Các phương án A, B, C, E đều trực tiếp hoặc gián tiếp phản ánh sự gắn kết giữa độc lập dân tộc với tự do, hạnh phúc của nhân dân. Phương án D - \"Kêu gọi các cường quốc viện trợ\" - không được đề cập trong Tài liệu môn học như một phần của tư tưởng này, và việc Người chủ động đưa ra các giải pháp tự lực để đảm bảo quyền dân sinh là chính.","p":[["A","Gửi bản Yêu sách của nhân dân An Nam đòi các quyền tự do, dân chủ cho người dân Đông Dương."],["B","Xác định trong Chánh cương vắn tắt của Đảng các mục tiêu như bỏ sưu thuế cho dân cày nghèo, thi hành luật ngày làm 8 giờ."],["C","Khẳng định \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\"."],["D","Kêu gọi các cường quốc viện trợ để phát triển kinh tế và đảm bảo cuộc sống cho người dân."],["E","Đặt ra yêu cầu \"Làm cho dân có ăn. Làm cho dân có mặc. Làm cho dân có chỗ ở. Làm cho dân có học hành\" sau Cách mạng Tháng Tám."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":14,"q":"Những lý lẽ và căn cứ mà Hồ Chí Minh sử dụng để khẳng định quyền thiêng liêng, bất biến về độc lập, tự do của các dân tộc KHÔNG bao gồm yếu tố nào sau đây?","g":"Xem xét các căn cứ mà Hồ Chí Minh viện dẫn trong phần a) của Tài liệu môn học.","x":"Hồ Chí Minh đã căn cứ vào truyền thống lịch sử của Việt Nam, Tuyên ngôn độc lập của cách mạng Mỹ năm 1776, Tuyên ngôn nhân quyền và dân quyền của Cách mạng Pháp năm 1791 để khẳng định quyền dân tộc. Các điều ước quốc tế của Liên hợp quốc (được thành lập sau Thế chiến II) không được nhắc đến trong Tài liệu môn học là căn cứ Người sử dụng để hình thành tư tưởng này.","p":[["A","Lịch sử dựng nước và giữ nước của dân tộc Việt Nam với truyền thống yêu nước."],["B","Những quyền tự do, bình đẳng và quyền con người được ghi trong Tuyên ngôn độc lập của cách mạng Mỹ năm 1776."],["C","Tuyên ngôn nhân quyền và dân quyền của Cách mạng Pháp năm 1791."],["D","Các điều ước quốc tế về quyền con người được Liên hợp quốc công bố sau này."],["E","Khát khao to lớn của dân tộc Việt Nam về một nền độc lập cho dân tộc, tự do cho nhân dân."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":15,"q":"Trong các sự kiện lịch sử sau, sự kiện nào KHÔNG thể hiện trực tiếp quyết tâm bảo vệ độc lập dân tộc của Hồ Chí Minh và nhân dân Việt Nam sau năm 1945?","g":"Chú ý đến mốc thời gian \"sau năm 1945\" trong câu hỏi.","x":"Phương án A, B, C, E đều là các sự kiện và tuyên bố diễn ra sau năm 1945, thể hiện quyết tâm bảo vệ độc lập dân tộc và thống nhất đất nước. Phương án D là sự kiện năm 1919, trước khi Việt Nam giành được độc lập năm 1945, thuộc giai đoạn hình thành tư tưởng chứ không phải bảo vệ độc lập đã giành được.","p":[["A","Lời kêu gọi Liên hợp quốc năm 1946 về việc bảo vệ toàn vẹn lãnh thổ và độc lập."],["B","Lời kêu gọi toàn quốc kháng chiến ngày 19/12/1946 với quyết tâm \"thà hy sinh tất cả, chứ nhất định không chịu mất nước\"."],["C","Tuyên bố \"Nước Việt Nam là một, dân tộc Việt Nam là một\" vào tháng 2 năm 1958."],["D","Việc Hồ Chí Minh gửi bản Yêu sách của nhân dân An Nam tới Hội nghị Vécxây năm 1919."],["E","Khẩu hiệu \"Không có gì quý hơn độc lập, tự do\" ngày 17/7/1966."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":16,"q":"Theo tư tưởng Hồ Chí Minh về nền độc lập thật sự, hoàn toàn và triệt để, yếu tố nào sau đây KHÔNG phải là dấu hiệu của một quốc gia độc lập giả hiệu?","g":"Đọc kỹ định nghĩa về độc lập thật sự và độc lập giả hiệu trong Tài liệu môn học.","x":"Tài liệu môn học mô tả độc lập giả hiệu là tình trạng mà \"bọn thực dân, đế quốc hay dùng chiêu bài mị dân, thành lập các chính phủ bù nhìn bản xứ, tuyên truyền cái gọi là 'độc lập tự do' giả hiệu\". Người cũng nhấn mạnh rằng độc lập thật sự phải có quyền tự quyết về ngoại giao, quân đội riêng, nền tài chính riêng. Do đó, việc không có các quyền này là dấu hiệu của độc lập giả hiệu (A, C, D). Có chính phủ bù nhìn (B) cũng là một dấu hiệu. Ngược lại, \"có quan hệ ngoại giao bình đẳng với các nước lớn\" là một biểu hiện của quyền tự quyết về ngoại giao, thuộc về độc lập thật sự, không phải độc lập giả hiệu.","p":[["A","Không có quyền tự quyết về ngoại giao."],["B","Có chính phủ bù nhìn bản xứ do thực dân thành lập."],["C","Không có quân đội riêng."],["D","Không có nền tài chính riêng."],["E","Có quan hệ ngoại giao bình đẳng với các nước lớn."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Các biện pháp sau đây, theo Hồ Chí Minh, đều góp phần thực hiện mục tiêu \"Làm cho dân có ăn, có mặc, có chỗ ở, có học hành\" sau Cách mạng Tháng Tám năm 1945, NGOẠI TRỪ:","g":"Phân biệt các mục tiêu chính trị với các mục tiêu xã hội trực tiếp cải thiện đời sống được nêu trong Tài liệu môn học.","x":"Các phương án A, B, C, E đều là các biện pháp cụ thể liên quan đến dân sinh được Hồ Chí Minh đề ra trong Chánh cương vắn tắt của Đảng năm 1930, nhằm cải thiện trực tiếp đời sống của nhân dân, qua đó góp phần thực hiện mục tiêu \"có ăn, có mặc, có chỗ ở, có học hành\" sau Cách mạng Tháng Tám. Phương án D \"Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến\" là mục tiêu chính trị cơ bản để giành độc lập dân tộc, là tiền đề, nhưng không phải là biện pháp trực tiếp để \"làm cho dân có ăn, có mặc...\" như các phương án còn lại.","p":[["A","Thủ tiêu hết các thứ quốc trái."],["B","Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo."],["C","Thi hành luật ngày làm 8 giờ."],["D","Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến."],["E","Bỏ sưu thuế cho dân cày nghèo."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":18,"q":"Nhận định nào sau đây KHÔNG phản ánh đúng nội dung tư tưởng Hồ Chí Minh về độc lập dân tộc như được trình bày trong Tài liệu môn học?","g":"Đọc tổng thể bốn luận điểm chính về tư tưởng Hồ Chí Minh trong Tài liệu môn học.","x":"Tài liệu môn học trình bày bốn luận điểm chính trong tư tưởng Hồ Chí Minh về vấn đề độc lập dân tộc: a) Độc lập, tự do là quyền thiêng liêng, b) Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân, c) Độc lập dân tộc phải là nền độc lập thật sự, hoàn toàn và triệt để, d) Độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ. Phương án E sai vì Người luôn nhấn mạnh sự gắn liền của độc lập với tự do, hạnh phúc của nhân dân, thậm chí khẳng định \"Nước độc lập mà dân không hưởng hạnh phúc tự do. Thì độc lập cũng chẳng có nghĩa lý gì\", cho thấy độc lập không phải là mục tiêu duy nhất, tuyệt đối tách rời khỏi quyền lợi của nhân dân.","p":[["A","Độc lập dân tộc là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc."],["B","Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân."],["C","Độc lập dân tộc phải là nền độc lập thật sự, hoàn toàn và triệt để."],["D","Độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ."],["E","Độc lập dân tộc là mục tiêu duy nhất, tuyệt đối ưu tiên, vượt lên mọi quyền lợi khác của nhân dân."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":25,"q":"Năm 1919, nhân dịp các nước Đồng minh thắng trận họp Hội nghị Vécxây, Hồ Chí Minh đã gửi tới Hội nghị bản (1) _______ của nhân dân An Nam, bao gồm 8 điểm với hai nội dung chính là đòi quyền (2) _______ về mặt pháp lý và đòi các quyền tự do, dân chủ của người dân Đông Dương.","g":"Nhớ tên văn kiện lịch sử và quyền cơ bản được đòi hỏi trong Tài liệu môn học.","x":"Tài liệu môn học ghi: \"Năm 1919... Hồ Chí Minh đã gửi tới Hội nghị bản Yêu sách của nhân dân An Nam, bao gồm 8 điểm với hai nội dung chính là đòi quyền bình đẳng về mặt pháp lý và đòi các quyền tự do, dân chủ của người dân Đông Dương\".","p":[["A","(1) Tuyên ngôn; (2) bình đẳng"],["B","(1) Yêu sách; (2) bình đẳng"],["C","(1) Yêu sách; (2) tự quyết"],["D","(1) Hiến pháp; (2) thống nhất"],["E","(1) Tuyên ngôn; (2) tự quyết"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":26,"q":"Trong Chánh cương vắn tắt của Đảng (năm 1930), Hồ Chí Minh đã xác định mục tiêu chính trị của Đảng là: \"a) Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến. b) Làm cho nước Nam được hoàn toàn (1) _______\", đồng thời đề ra các mục tiêu xã hội như \"Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo. Bỏ sưu thuế cho dân cày nghèo… Thi hành luật ngày làm (2) _______ giờ\".","g":"Nhớ mục tiêu chính trị và chính sách xã hội cụ thể trong Chánh cương được nêu trong Tài liệu môn học.","x":"Tài liệu môn học nêu rõ mục tiêu chính trị là \"Làm cho nước Nam được hoàn toàn độc lập\" và chính sách xã hội là \"Thi hành luật ngày làm 8 giờ\".","p":[["A","(1) tự do; (2) 8"],["B","(1) độc lập; (2) 10"],["C","(1) thống nhất; (2) 6"],["D","(1) độc lập; (2) 8"],["E","(1) tự do; (2) 10"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":27,"q":"Ngày 17/7/1966, trong bối cảnh khó khăn, chiến tranh ác liệt, Hồ Chí Minh đã nêu lên một chân lý thời đại, một tuyên ngôn bất hủ của các dân tộc khao khát nền độc lập, tự do trên thế giới: \"Không có gì quý hơn (1) _______, (2) _______\".","g":"Đây là câu nói nổi tiếng của Người, thường được trích dẫn trong giai đoạn kháng chiến chống Mỹ trong Tài liệu môn học.","x":"Tài liệu môn học trích dẫn nguyên văn câu nói này của Hồ Chí Minh (Lời kêu gọi đồng bào và chiến sĩ cả nước, ngày 17/7/1966) là: “Không có gì quý hơn độc lập, tự do”.","p":[["A","(1) độc lập; (2) tự do"],["B","(1) hòa bình; (2) tự do"],["C","(1) độc lập; (2) hạnh phúc"],["D","(1) tự do; (2) dân chủ"],["E","(1) hòa bình; (2) hạnh phúc"]],"d":"A","k":"Chọn cụm từ điền vào chỗ trống"},{"s":28,"q":"Nối tiếp các giá trị của Tuyên ngôn độc lập cách mạng Mỹ và Tuyên ngôn nhân quyền và dân quyền cách mạng Pháp, Hồ Chí Minh khẳng định: \"Tất cả các dân tộc trên thế giới đều sinh ra (1) _______; dân tộc nào cũng có quyền sống, quyền sung sướng và quyền (2) _______... Đó là những lẽ phải không ai chối cãi được\".","g":"Nhớ các quyền cơ bản mà Người đã khẳng định dựa trên các tuyên ngôn quốc tế trong Tài liệu môn học.","x":"Tài liệu môn học trích lời Hồ Chí Minh: \"Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng; dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do... Đó là những lẽ phải không ai chối cãi được\".","p":[["A","(1) thống nhất; (2) tự do"],["B","(1) bình đẳng; (2) phát triển"],["C","(1) bình đẳng; (2) tự do"],["D","(1) tự chủ; (2) phát triển"],["E","(1) bình đẳng; (2) tự chủ"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":29,"q":"Để bảo vệ nền độc lập thật sự mới giành được sau Cách mạng Tháng Tám, đặc biệt trong hoàn cảnh \"thù trong giặc ngoài\", Hồ Chí Minh và Chính phủ Việt Nam Dân chủ Cộng hòa đã sử dụng nhiều biện pháp, trong đó có biện pháp (1) _______, nhằm bảo vệ nền độc lập (2) _______ của đất nước.","g":"Tìm hiểu các biện pháp bảo vệ độc lập được nêu và tính chất của nền độc lập cần bảo vệ trong Tài liệu môn học.","x":"Tài liệu môn học nêu rõ: \"để bảo vệ nền độc lập thật sự mới giành được, Người đã cùng Chính phủ Việt Nam Dân chủ Cộng hòa sử dụng nhiều biện pháp, trong đó có biện pháp ngoại giao, để bảo vệ nền độc lập thật sự của đất nước\".","p":[["A","(1) quân sự; (2) thật sự"],["B","(1) kinh tế; (2) thật sự"],["C","(1) ngoại giao; (2) giả hiệu"],["D","(1) quân sự; (2) giả hiệu"],["E","(1) ngoại giao; (2) thật sự"]],"d":"E","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Trong Di chúc, Hồ Chí Minh đã thể hiện niềm tin tuyệt đối vào sự thắng lợi của cách mạng, vào sự (1) _______ nước nhà: \"Dù khó khăn gian khổ đến mấy, nhân dân ta nhất định sẽ hoàn toàn thắng lợi. Đế quốc Mỹ nhất định phải cút khỏi nước ta. Tổ quốc ta nhất định sẽ (2) _______. Đồng bào Nam, Bắc nhất định sẽ sum họp một nhà”.","g":"Nhớ nội dung chính của Di chúc liên quan đến tương lai đất nước trong Tài liệu môn học.","x":"Tài liệu môn học trích Di chúc của Hồ Chí Minh: \"Dù khó khăn gian khổ đến mấy, nhân dân ta nhất định sẽ hoàn toàn thắng lợi. Đế quốc Mỹ nhất định phải cút khỏi nước ta. Tổ quốc ta nhất định sẽ thống nhất. Đồng bào Nam, Bắc nhất định sẽ sum họp một nhà\".","p":[["A","(1) độc lập; (2) thống nhất"],["B","(1) thống nhất; (2) thống nhất"],["C","(1) thống nhất; (2) độc lập"],["D","(1) phát triển; (2) phồn vinh"],["E","(1) tự chủ; (2) độc lập"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"}]},"05":{"ten":"Cách mạng giải phóng dân tộc","ds":[{"s":1,"q":"Theo Hồ Chí Minh, cách mạng tư sản không thể giải phóng dân tộc đến nơi vì bản chất của nó là tước đoạt công nông ở trong nước và áp bức thuộc địa ở bên ngoài, đồng thời chỉ mang lại tự do, bình đẳng giả dối cho nhân dân.","g":"Xem xét nhận định của Hồ Chí Minh về các cuộc cách mạng tư sản Pháp và Mỹ trong Tài liệu môn học.","x":"Tài liệu môn học ghi rõ: \"Người quyết định không chọn con đường cách mạng tư sản vì cho rằng: “Cách mệnh Pháp cũng như cách mệnh Mỹ, nghĩa là cách mệnh tư bản, cách mệnh không đến nơi, tiếng là cộng hòa và dân chủ, kỳ thực trong thì nó tước lục công nông, ngoài thì nó áp bức thuộc địa.”. Tài liệu môn học bổ sung \"không phải tự do và bình đẳng giả dối như đế quốc chủ nghĩa Pháp khoe khoang bên An Nam...\". Điều này hoàn toàn phù hợp với câu hỏi.","d":1},{"s":2,"q":"Trong quan điểm của Hồ Chí Minh về mối quan hệ giữa giải phóng dân tộc và giải phóng giai cấp, giải phóng giai cấp phải được đặt lên hàng đầu và thực hiện trước để tạo tiền đề cho giải phóng dân tộc ở các nước thuộc địa.","g":"So sánh thứ tự các bước giải phóng theo Hồ Chí Minh với C. Mác và Ph. Ăngghen trong Tài liệu môn học.","x":"Tài liệu môn học nêu rõ: \"Còn theo Hồ Chí Minh, ở Việt Nam và các nước thuộc địa do hoàn cảnh lịch sử - chính trị khác với châu Âu nên phải là: giải phóng dân tộc - giải phóng xã hội - giải phóng giai cấp giải phóng con người.\". Như vậy, giải phóng dân tộc là trước hết, trên hết, không phải giải phóng giai cấp.","d":0},{"s":3,"q":"Luận điểm của Hồ Chí Minh về khả năng giành thắng lợi của cách mạng thuộc địa trước cách mạng vô sản ở chính quốc hoàn toàn trái ngược với mọi quan điểm của Quốc tế Cộng sản vào thời điểm đó.","g":"Đánh giá mức độ đối lập giữa quan điểm của Hồ Chí Minh và Quốc tế Cộng sản, đặc biệt là sự quán triệt tư tưởng V.I. Lênin của Người trong Tài liệu môn học.","x":"Tài liệu môn học chỉ ra rằng Đại hội VI Quốc tế Cộng sản (1928) có quan điểm cho rằng cách mạng thuộc địa phụ thuộc vào cách mạng vô sản ở chính quốc, làm giảm tính chủ động của cách mạng thuộc địa. Tuy nhiên, Tài liệu môn học cũng nói Hồ Chí Minh \"Quán triệt tư tưởng của V.I. Lênin về mối quan hệ chặt chẽ giữa cách mạng vô sản ở chính quốc với phong trào giải phóng dân tộc thuộc địa\" và Người chỉ rõ mối quan hệ bình đẳng, không lệ thuộc. Do đó, Người không hoàn toàn trái ngược với mọi quan điểm, mà có sự phát triển sáng tạo dựa trên nền tảng Lênin, nhưng vượt qua hạn chế của Quốc tế Cộng sản ở một số thời điểm. Từ khóa \"hoàn toàn trái ngược với mọi quan điểm\" làm câu này sai.","d":0},{"s":4,"q":"Theo Hồ Chí Minh, trong điều kiện Việt Nam là một nước thuộc địa – phong kiến, Đảng Cộng sản chỉ là đội tiên phong của giai cấp công nhân để hoàn thành sứ mệnh lịch sử của mình, giống như lý luận của chủ nghĩa Mác – Lênin.","g":"Xem xét định nghĩa về Đảng Cộng sản Việt Nam của Hồ Chí Minh trong Tài liệu môn học và so sánh với lý luận Mác - Lênin.","x":"Tài liệu môn học nêu rõ: \"Trong hoàn cảnh Việt Nam là một nước thuộc địa – phong kiến, Hồ Chí Minh cho rằng, Đảng Cộng sản vừa là đội tiên phong của giai cấp công nhân vừa là đội tiên phong của nhân dân lao động... Đó còn là Đảng của cả dân tộc Việt Nam.\". Đây là luận điểm bổ sung, phát triển lý luận mác xít về đảng cộng sản. Do đó, nhận định rằng Đảng chỉ là đội tiên phong của giai cấp công nhân là không đầy đủ và sai.","d":0},{"s":5,"q":"Hồ Chí Minh chủ trương rằng việc đánh đổ đế quốc và bọn phong kiến, làm cho nước Nam được hoàn toàn độc lập phải được thực hiện đồng thời, khăng khít với nhau, nương tựa vào nhau, theo đúng quan điểm của Quốc tế Cộng sản.","g":"So sánh quan điểm của Hồ Chí Minh và Quốc tế Cộng sản về hai nhiệm vụ chống đế quốc và chống phong kiến trong Tài liệu môn học.","x":"Tài liệu môn học chỉ ra rằng \"Cũng theo Quốc tế Cộng sản, hai nhiệm vụ chống đế quốc và chống phong kiến phải được thực hiện đồng thời, khăng khít với nhau, nương tựa vào nhau.\". Tuy nhiên, \"Nhưng xuất phát từ một nước thuộc địa, Hồ Chí Minh không coi hai nhiệm vụ đó nhất loại phải thực hiện ngang nhau, mà đặt lên hàng đầu nhiệm vụ chống đế quốc, giải phóng dân tộc, còn nhiệm vụ chống phong kiến... thì sẽ từng bước thực hiện.\". Do đó, câu hỏi này là sai vì Hồ Chí Minh không cho là \"nhất loại phải thực hiện ngang nhau\" mà có sự ưu tiên.","d":0},{"s":6,"q":"Luận điểm của Hồ Chí Minh về \"chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở thuộc địa\" hàm ý rằng cách mạng ở chính quốc và cách mạng ở thuộc địa cần phải phối hợp đồng bộ, cùng lúc để tiêu diệt chủ nghĩa đế quốc một cách triệt để.","g":"Đọc kỹ ví von \"con đỉa\" và ý nghĩa của việc \"cắt cả hai vòi\" trong Tài liệu môn học.","x":"Tài liệu môn học dùng hình ảnh con đỉa để minh họa sự liên kết giữa chính quốc và thuộc địa trong việc duy trì chủ nghĩa tư bản. Người viết: \"Nếu muốn giết con vật ấy, người ta phải đồng thời cắt cả hai vòi.\". Điều này rõ ràng thể hiện sự cần thiết của sự phối hợp đồng bộ, cùng lúc giữa hai cách mạng để đạt hiệu quả triệt để.","d":1}],"tn":[{"s":7,"q":"Theo tư tưởng Hồ Chí Minh, đặc điểm nào sau đây là yếu tố cốt lõi dẫn đến thất bại của các phong trào yêu nước Việt Nam trước khi Người tìm thấy con đường cứu nước mới?","g":"Tìm kiếm nguyên nhân thất bại của các phong trào yêu nước đầu thế kỷ XX trong Tài liệu môn học.","x":"Tài liệu môn học chỉ rõ: \"sự thất bại của những phong trào yêu nước trong thời kỳ này thể hiện sự khủng hoảng bế tắc về giai cấp lãnh đạo và đường lối cách mạng.\". Các phương án khác có thể là yếu tố phụ nhưng không phải là \"yếu tố cốt lõi\" được Tài liệu môn học trực tiếp nhắc đến.","p":[["A","Thiếu sự hỗ trợ từ các phong trào quốc tế."],["B","Chưa nhận diện được bản chất áp bức của chủ nghĩa tư bản."],["C","Khủng hoảng, bế tắc về giai cấp lãnh đạo và đường lối cách mạng."],["D","Quá phụ thuộc vào sự giúp đỡ từ các nước láng giềng."],["E","Không đủ sức mạnh quân sự để chống lại thực dân Pháp."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Luận điểm nào sau đây thể hiện rõ nhất nét độc đáo, sáng tạo của Hồ Chí Minh khi giải quyết mối quan hệ giữa nhiệm vụ chống đế quốc và chống phong kiến trong \"Chánh cương vắn tắt của Đảng\"?","g":"So sánh cách Hồ Chí Minh xử lý hai nhiệm vụ này với quan điểm của Quốc tế Cộng sản trong Tài liệu môn học.","x":"Tài liệu môn học khẳng định: \"xuất phát từ một nước thuộc địa, Hồ Chí Minh không coi hai nhiệm vụ đó nhất loại phải thực hiện ngang nhau, mà đặt lên hàng đầu nhiệm vụ chống đế quốc, giải phóng dân tộc, còn nhiệm vụ chống phong kiến, mang lại ruộng đất cho nông dân thì sẽ từng bước thực hiện.\". Đây chính là nét độc đáo, sáng tạo của Người. Phương án A là quan điểm của Quốc tế Cộng sản mà Hồ Chí Minh không theo hoàn toàn. Phương án D sai vì Hồ Chí Minh nêu \"thâu hết ruộng đất của đế quốc chủ nghĩa...\" nhưng chưa nêu \"người cày có ruộng\".","p":[["A","Thúc đẩy song song hai nhiệm vụ, coi chúng có vai trò ngang nhau."],["B","Tạm gác nhiệm vụ chống đế quốc để tập trung vào cải cách ruộng đất."],["C","Đặt nhiệm vụ chống đế quốc, giải phóng dân tộc lên hàng đầu, còn chống phong kiến sẽ thực hiện từng bước."],["D","Chỉ nêu chủ trương \"người cày có ruộng\" mà không đề cập đến việc thâu hồi ruộng đất của đế quốc."],["E","Ưu tiên giải quyết vấn đề phong kiến trước để củng cố nội lực, sau đó mới chống đế quốc."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Theo Hồ Chí Minh, tại sao cách mạng ở thuộc địa có vai trò rất lớn trong việc cùng với cách mạng vô sản ở chính quốc tiêu diệt chủ nghĩa đế quốc?","g":"Xem xét lý do Hồ Chí Minh nhấn mạnh vai trò của thuộc địa đối với chủ nghĩa đế quốc và cách mạng trong Tài liệu môn học.","x":"Tài liệu môn học giải thích: \"Người cho rằng: “nọc độc và sức sống của con rắn độc tư bản chủ nghĩa đang tập trung ở các thuộc địa hơn là ở chính quốc”18; nếu thờ ơ về vấn đề cách mạng ở thuộc địa thì như “đánh chết rắn đằng đuôi”19. Cho nên, cách mạng ở thuộc địa có vai trò rất lớn trong việc cùng với cách mạng vô sản ở chính quốc tiêu diệt chủ nghĩa đế quốc.\".","p":[["A","Vì thuộc địa là nơi tập trung phần lớn lực lượng quân sự của đế quốc."],["B","Vì nọc độc và sức sống của con rắn độc tư bản chủ nghĩa đang tập trung ở các thuộc địa hơn là ở chính quốc."],["C","Vì phong trào đấu tranh ở thuộc địa thường ít bị đàn áp hơn ở chính quốc."],["D","Vì cách mạng thuộc địa có khả năng phát triển nhanh hơn do sự hỗ trợ từ bên ngoài."],["E","Vì chỉ có cách mạng thuộc địa mới có thể cắt đứt hoàn toàn Tài liệu môn học tài nguyên cho chính quốc."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":10,"q":"Nhận định nào sau đây không phản ánh đúng tầm quan trọng của Đảng Cộng sản theo tư tưởng Hồ Chí Minh trong cách mạng giải phóng dân tộc ở Việt Nam?","g":"Tìm hiểu vai trò của Đảng theo Mác-Lênin và sự phát triển trong tư tưởng Hồ Chí Minh trong Tài liệu môn học.","x":"Tài liệu môn học và nhấn mạnh vai trò của Đảng Cộng sản trong việc \"thuyết phục, giác ngộ và tập hợp đông đảo quần chúng, huấn luyện quần chúng và đưa quần chúng ra đấu tranh\", \"vận động và tổ chức dân chúng, ngoài thì liên lạc với các dân tộc bị áp bức và vô sản giai cấp mọi nơi. Đảng có vững cách mệnh mới thành công\". Tài liệu môn học cũng nói Đảng là đội tiên phong của nhân dân lao động và của cả dân tộc Việt Nam. Nhận định \"Đảng chỉ cần vững mạnh về quân sự\" là thiếu sót, không phản ánh đầy đủ vai trò của Đảng như đã nêu. \"Vững\" ở đây bao hàm nhiều yếu tố, không chỉ quân sự.","p":[["A","Đảng là nhân tố chủ quan để giai cấp công nhân hoàn thành sứ mệnh lịch sử của mình."],["B","Đảng phải vận động và tổ chức dân chúng trong nước."],["C","Đảng phải liên lạc với các dân tộc bị áp bức và vô sản giai cấp mọi nơi."],["D","Đảng chỉ cần vững mạnh về quân sự là cách mạng có thể thành công."],["E","Đảng là đội tiên phong của nhân dân lao động và của cả dân tộc Việt Nam."]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":11,"q":"Khi kêu gọi toàn quốc kháng chiến (tháng 12/1946), Hồ Chí Minh đã nhấn mạnh yếu tố nào là nền tảng cốt lõi để tập hợp lực lượng đấu tranh chống kẻ thù chung của dân tộc?","g":"Xem xét Lời kêu gọi toàn quốc kháng chiến trong Tài liệu môn học.","x":"Tài liệu môn học trích dẫn Lời kêu gọi toàn quốc kháng chiến: “Bất kỳ đàn ông, đàn bà, bất kỳ người già, người trẻ, không chia tôn giáo, đảng phái, dân tộc. Hễ là người Việt Nam thì phải đứng lên ánh thực dân Pháp để cứu Tổ quốc”. Điều này thể hiện rõ tư tưởng đại đoàn kết toàn dân tộc, không phân biệt các yếu tố khác.","p":[["A","Phân chia rõ ràng giai cấp để phát huy vai trò tiên phong của công nhân và nông dân."],["B","Tập trung vào việc xây dựng lực lượng vũ trang chuyên nghiệp và hiện đại."],["C","Đoàn kết mọi người Việt Nam không phân biệt giai tầng, dân tộc, tôn giáo, đảng phái."],["D","Kêu gọi sự giúp đỡ từ các nước xã hội chủ nghĩa anh em."],["E","Tạm gác lại các mâu thuẫn nội bộ để duy trì ổn định."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":12,"q":"Theo Hồ Chí Minh, vì sao giai cấp công nhân và nông dân được xem là \"gốc cách mệnh\" và \"lòng cách mệnh càng bền, chí cách mệnh càng quyết\"?","g":"Tìm hiểu lý do Hồ Chí Minh nhấn mạnh vai trò của công nông trong Tài liệu môn học.","x":"Tài liệu môn học giải thích: \"giai cấp công nhân và nông dân là hai giai cấp đông đảo và cách mạng nhất, bị bóc lột nặng nề nhất, vì thế “lòng cách mệnh càng bền, chí cách mệnh càng quyết... công nông là tay không chân rồi, nếu thua thì chỉ mất một cái kiếp khổ, nếu được thì được cả thế giới, cho nên họ gan góc”\".","p":[["A","Vì họ là những người có trình độ học vấn cao nhất, dễ tiếp thu lý luận cách mạng."],["B","Vì họ là hai giai cấp đông đảo nhất và bị bóc lột nặng nề nhất, không còn gì để mất ngoài xiềng xích."],["C","Vì họ có khả năng tự tổ chức và lãnh đạo cách mạng mà không cần sự can thiệp từ bên ngoài."],["D","Vì họ đại diện cho nền sản xuất tiên tiến nhất của xã hội thuộc địa."],["E","Vì họ có mối liên hệ mật thiết với chính quốc và có thể tranh thủ sự ủng hộ quốc tế."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":13,"q":"Theo tư tưởng Hồ Chí Minh, con đường cách mạng giải phóng dân tộc ở Việt Nam cần tuân thủ những nguyên tắc cơ bản nào sau đây, ngoại trừ:","g":"Tổng hợp các nguyên tắc cách mạng giải phóng dân tộc theo Hồ Chí Minh và đối chiếu với quan điểm về mối quan hệ giữa cách mạng thuộc địa và chính quốc trong Tài liệu môn học.","x":"Các lựa chọn A, B, C, D đều là những nguyên tắc cốt lõi trong tư tưởng Hồ Chí Minh về cách mạng giải phóng dân tộc. Riêng lựa chọn E, Hồ Chí Minh khẳng định cách mạng thuộc địa không phụ thuộc vào cách mạng vô sản ở chính quốc và có thể giành thắng lợi trước. Do đó, \"hoàn toàn phụ thuộc\" là sai.","p":[["A","Đi theo con đường cách mạng vô sản."],["B","Gắn giải phóng dân tộc với giải phóng giai cấp, trong đó giải phóng dân tộc là trước hết."],["C","Độc lập dân tộc phải gắn liền với chủ nghĩa xã hội."],["D","Phải được tiến hành bằng phương pháp bạo lực cách mạng và vũ trang."],["E","Hoàn toàn phụ thuộc vào thắng lợi của cách mạng vô sản ở chính quốc."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":14,"q":"Luận điểm sáng tạo của Hồ Chí Minh về khả năng giành thắng lợi của cách mạng thuộc địa trước cách mạng vô sản ở chính quốc được xây dựng dựa trên các cơ sở nào sau đây, ngoại trừ:","g":"Xem xét các cơ sở của luận điểm sáng tạo này trong Tài liệu môn học.","x":"Tài liệu môn học liệt kê các cơ sở cho luận điểm sáng tạo của Hồ Chí Minh. Các lựa chọn A, B, D đều được nêu rõ trong. Lựa chọn E là bằng chứng thực tiễn sau này càng chứng minh luận điểm đúng. Lựa chọn C (\"nhấn mạnh sự cần thiết của việc các nước thuộc địa phải chờ đợi sự hỗ trợ từ chính quốc\") lại đi ngược lại tinh thần chủ động, tự giải phóng và có khả năng thắng lợi trước của cách mạng thuộc địa theo Hồ Chí Minh.","p":[["A","Thuộc địa có vị trí, vai trò, tầm quan trọng đặc biệt đối với chủ nghĩa đế quốc."],["B","Tinh thần đấu tranh cách mạng hết sức quyết liệt của các dân tộc thuộc địa."],["C","Nhấn mạnh sự cần thiết của việc các nước thuộc địa phải chờ đợi sự hỗ trợ từ chính quốc."],["D","Luận điểm của C. Mác về khả năng tự giải phóng của giai cấp công nhân."],["E","Thực tiễn thắng lợi của Cách mạng tháng Tám 1945 ở Việt Nam và phong trào giải phóng dân tộc trên thế giới."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":15,"q":"Nhận định nào sau đây không phải là nội dung cốt lõi của tư tưởng Hồ Chí Minh về bạo lực cách mạng?","g":"Xem xét các khía cạnh của bạo lực cách mạng trong tư tưởng Hồ Chí Minh trong Tài liệu môn học.","x":"Tài liệu môn học khẳng định sự cần thiết của bạo lực cách mạng chống bạo lực phản cách mạng. Tài liệu môn học nói bạo lực cách mạng là bạo lực của quần chúng, với hai lực lượng chính trị và quân sự, hai hình thức đấu tranh chính trị và vũ trang. Đặc biệt, \"đấu tranh chính trị của quần chúng là cơ sở, nền tảng cho việc xây dựng lực lượng vũ trang và đấu tranh vũ trang; đấu tranh vũ trang có ý nghĩa quyết định đối với việc tiêu diệt lực lượng quân sự...\". Đồng thời, cần \"sử dụng đúng và khéo kết hợp các hình thức đấu tranh vũ trang và đấu tranh chính trị\". Do đó, nhận định \"luôn ưu tiên đấu tranh vũ trang tuyệt đối, coi đấu tranh chính trị là thứ yếu\" là sai, vì đấu tranh chính trị là cơ sở, và cần kết hợp khéo léo.","p":[["A","Dùng bạo lực cách mạng để chống lại bạo lực phản cách mạng."],["B","Bạo lực cách mạng phải là bạo lực của quần chúng."],["C","Luôn ưu tiên đấu tranh vũ trang tuyệt đối, coi đấu tranh chính trị là thứ yếu."],["D","Cần sử dụng khéo léo kết hợp các hình thức đấu tranh vũ trang và đấu tranh chính trị."],["E","Bạo lực cách mạng được thực hiện với hai lực lượng chính trị và quân sự."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":16,"q":"Trong Sách lược vắn tắt của Đảng, Hồ Chí Minh đã xác định lực lượng cách mạng bao gồm toàn dân, với các thành phần nào sau đây được coi là mục tiêu thu phục hoặc lợi dụng, ngoại trừ:","g":"Xem xét thành phần lực lượng cách mạng và cách đối xử với từng nhóm trong Sách lược vắn tắt của Đảng trong Tài liệu môn học.","x":"Tài liệu môn học khẳng định \"cách mệnh là việc chung cả dân chúng\". Tài liệu môn học nêu rõ Đảng phải thu phục công nhân, tập hợp đại bộ phận dân cày, dựa vào dân cày nghèo, liên lạc với tiểu tư sản, trí thức, trung nông. Đối với \"phú nông, trung, tiểu địa chủ và tư sản Việt Nam mà chưa rõ mặt phản cách mạng thì phải lợi dụng, ít ra cũng làm cho họ trung lập\". Đối với những người đã rõ mặt phản cách mạng, Hồ Chí Minh không chủ trương lợi dụng hay trung lập hóa mà phải đấu tranh. Do đó, lựa chọn D là thành phần không được coi là mục tiêu thu phục hoặc lợi dụng.","p":[["A","Đại bộ phận giai cấp công nhân."],["B","Đại bộ phận dân cày và dân cày nghèo."],["C","Tiểu tư sản, trí thức, trung nông."],["D","Phú nông, trung, tiểu địa chủ và tư sản Việt Nam đã rõ mặt phản cách mạng."],["E","Phú nông, trung, tiểu địa chủ và tư sản Việt Nam mà chưa rõ mặt phản cách mạng."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Phát biểu nào sau đây của Hồ Chí Minh thể hiện quan điểm nhất quán về độc lập dân tộc gắn liền với chủ nghĩa xã hội?","g":"Tìm các phát biểu thể hiện sự liên kết giữa độc lập dân tộc và chủ nghĩa xã hội hoặc con đường tiến lên chủ nghĩa xã hội trong Tài liệu môn học.","x":"Các lựa chọn A, B, C, E đều trực tiếp hoặc gián tiếp thể hiện sự gắn kết giữa con đường cách mạng vô sản, Chủ nghĩa Mác-Lênin, và mục tiêu xã hội cộng sản sau khi giành độc lập dân tộc. Cụ thể, C là phát biểu rõ ràng nhất về độc lập dân tộc gắn liền với chủ nghĩa xã hội. Lựa chọn D (\"Coi giải phóng dân tộc là mục tiêu duy nhất, không cần gắn với mục tiêu xã hội chủ nghĩa\") là hoàn toàn sai với tư tưởng Hồ Chí Minh, người luôn đặt độc lập dân tộc trong mối quan hệ biện chứng với chủ nghĩa xã hội.","p":[["A","\"Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường cách mạng vô sản\"."],["B","\"Trong thế giới bây giờ chỉ có cách mệnh Nga là đã thành công, và thành công đến nơi...\"."],["C","Trong Chánh cương vắn tắt của Đảng (1930), khẳng định phương hướng chiến lược \"làm từ sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản\"."],["D","Coi giải phóng dân tộc là mục tiêu duy nhất, không cần gắn với mục tiêu xã hội chủ nghĩa để tránh phức tạp hóa cách mạng."],["E","\"Từ đó tôi hoàn toàn tin theo Lênin, tin theo Quốc tế thứ ba\"."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":18,"q":"Lý do nào sau đây không được Hồ Chí Minh sử dụng để giải thích vì sao cách mạng tư sản không phải là con đường giải phóng dân tộc triệt để?","g":"Xem xét các lý do Hồ Chí Minh từ chối con đường cách mạng tư sản trong Tài liệu môn học.","x":"Tài liệu môn học nêu rõ các lý do Hồ Chí Minh từ chối cách mạng tư sản: \"cách mạng không đến nơi, tiếng là cộng hòa và dân chủ, kỳ thực trong thì nó tước lục công nông, ngoài thì nó áp bức thuộc địa.\". Người cũng nói \"tự do và bình đẳng giả dối như đế quốc chủ nghĩa Pháp khoe khoang bên An Nam\". Lựa chọn D (\"Cách mạng tư sản thường bị các thế lực phong kiến đàn áp mạnh mẽ\") không được đề cập trong Tài liệu môn học như một lý do Hồ Chí Minh từ chối con đường này.","p":[["A","Cách mạng tư sản tước đoạt công nông ở trong nước."],["B","Cách mạng tư sản áp bức thuộc địa ở bên ngoài."],["C","Cách mạng tư sản chỉ mang lại tự do và bình đẳng giả dối."],["D","Cách mạng tư sản thường bị các thế lực phong kiến đàn áp mạnh mẽ."],["E","Cách mạng tư sản \"không đến nơi\", đòi hỏi phải có cách mạng khác tiếp theo."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":25,"q":"Theo Hồ Chí Minh, \"Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường _______\".","g":"Nhớ lại con đường cứu nước mà Hồ Chí Minh đã lựa chọn sau khi đọc Luận cương của Lênin.","x":"Tài liệu môn học khẳng định: “Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường cách mạng vô sản\".","p":[["A","cách mạng dân chủ"],["B","cách mạng tư sản"],["C","cách mạng vô sản"],["D","cách mạng giải phóng dân tộc"],["E","cách mạng ruộng đất"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":26,"q":"Trong tư tưởng Hồ Chí Minh, \"Dân tộc cách mệnh thì _______, nghĩa là sĩ, nông, công, thương đều nhất trí chống lại cường quyền\".","g":"Câu này nói về bản chất của cách mạng dân tộc, đặc biệt là về vấn đề giai cấp.","x":"Tài liệu môn học ghi rõ: Người lý giải rằng, “dân tộc cách mệnh thì chưa phân giai cấp, nghĩa là sĩ, nông, công, thương đều nhất trí chống lại cường quyền”.","p":[["A","cần phân biệt giai cấp"],["B","chưa phân giai cấp"],["C","đã thống nhất giai cấp"],["D","không liên quan đến giai cấp"],["E","chỉ dựa vào một giai cấp"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":27,"q":"Hồ Chí Minh nhận định: \"Chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở _______\".","g":"Đây là hình ảnh so sánh về sự liên kết giữa hai phần của chủ nghĩa tư bản.","x":"Tài liệu môn học viết: “Chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở thuộc địa.”.","p":[["A","các nước xã hội chủ nghĩa"],["B","các nước láng giềng"],["C","các thuộc địa"],["D","các quốc gia độc lập"],["E","các nước phát triển"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":28,"q":"Theo V.I. Lênin, \"_______ không thể thực hiện được\" nếu không có sự đồng tình ủng hộ của đại đa số nhân dân lao động đối với đội tiên phong của mình.","g":"Lênin nói về điều kiện để một loại cách mạng cụ thể thành công.","x":"Tài liệu môn học trích lời Lênin: “Không có sự đồng tình ủng hộ của đại đa số nhân dân lao động đối với đội tiên phong của mình, tức đối với giai cấp vô sản, thì cách mạng vô sản không thể thực hiện được.”.","p":[["A","cách mạng dân chủ"],["B","cách mạng tư sản"],["C","cách mạng công nghiệp"],["D","cách mạng vô sản"],["E","cách mạng khoa học kỹ thuật"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":29,"q":"Hồ Chí Minh cho rằng, \"Trong cuộc đấu tranh gian khổ chống kẻ thù của giai cấp và dân tộc, cần dùng bạo lực cách mạng chống lại _______, giành lấy chính quyền và bảo vệ chính quyền\".","g":"Khía cạnh đối kháng của bạo lực cách mạng.","x":"Tài liệu môn học viết: “Trong cuộc đấu tranh gian khổ chống kẻ thù của giai cấp và dân tộc, cần dùng bạo lực cách mạng chống lại bạo lực phản cách mạng, giành lấy chính quyền và bảo vệ chính quyền”.","p":[["A","bạo lực chính quốc"],["B","bạo lực phong kiến"],["C","bạo lực đế quốc"],["D","bạo lực phản cách mạng"],["E","bạo lực thực dân"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Hồ Chí Minh đã chỉ rõ: \"Tuỳ tình hình cụ thể mà quyết định những hình thức đấu tranh cách mạng thích hợp, sử dụng đúng và khéo kết hợp các hình thức _______ và đấu tranh chính trị để giành thắng lợi cho cách mạng\".","g":"Hai hình thức đấu tranh cơ bản được Người nhấn mạnh.","x":"Tài liệu môn học viết: “Tùy tình hình cụ thể mà quyết định những hình thức đấu tranh cách mạng thích hợp, sử dụng đúng và khéo kết hợp các hình thức đấu tranh vũ trang và đấu tranh chính trị để giành thắng lợi cho cách mạng”.","p":[["A","đối ngoại"],["B","kinh tế"],["C","vũ trang"],["D","văn hóa"],["E","tư tưởng"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"}]},"06":{"ten":"Xây dựng chủ nghĩa xã hội","ds":[{"s":1,"q":"Theo tư tưởng Hồ Chí Minh, mục tiêu về kinh tế của chủ nghĩa xã hội ở Việt Nam nhấn mạnh sự phát triển công nghiệp và nông nghiệp hiện đại, khoa học kỹ thuật tiên tiến, đồng thời yêu cầu nền kinh tế phải hoàn toàn dựa trên chế độ sở hữu toàn dân để đảm bảo tính thuần nhất.","g":"Xem xét khái niệm \"nền kinh tế thuần nhất\" và các hình thức sở hữu được Hồ Chí Minh đề cập trong mục tiêu kinh tế.","x":"Mặc dù Hồ Chí Minh xác định nền kinh tế phải phát triển cao với công nghiệp, nông nghiệp hiện đại, khoa học kỹ thuật tiên tiến, nhưng Người chỉ rõ đó là \"một nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu tập thể\". Như vậy, không phải chỉ hoàn toàn dựa trên sở hữu toàn dân mà còn có sở hữu tập thể (kinh tế hợp tác xã).","d":0},{"s":2,"q":"Hồ Chí Minh khẳng định mối quan hệ giữa văn hóa với chính trị và kinh tế là mối quan hệ một chiều, trong đó chính trị và kinh tế quyết định hoàn toàn tính chất của văn hóa mà không có sự tác động ngược lại của văn hóa đối với chính trị và kinh tế.","g":"Chú ý đến từ khóa \"mối quan hệ biện chứng\" và vai trò của văn hóa được Người nhấn mạnh.","x":"Hồ Chí Minh cho rằng mối quan hệ giữa văn hóa với chính trị và kinh tế là \"mối quan hệ biện chứng\". Chế độ chính trị và kinh tế quyết định tính chất của văn hóa, nhưng \"văn hóa góp phần thực hiện mục tiêu của chính trị và kinh tế\". Người còn khẳng định \"Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển dân chủ\", chứng tỏ có sự tác động ngược lại.","d":0},{"s":3,"q":"Trong tư tưởng Hồ Chí Minh về động lực xây dựng chủ nghĩa xã hội, Người xem xét các động lực một cách riêng lẻ, độc lập, không có mối quan hệ qua lại giữa chúng.","g":"Tập trung vào cách Hồ Chí Minh mô tả \"hệ thống động lực\" và mối liên hệ giữa chúng.","x":"Hồ Chí Minh cho rằng \"Tất cả các động lực đều rất quan trọng và có mối quan hệ biện chứng với nhau\". Đặc biệt, ba động lực hàng đầu là lợi ích của dân, dân chủ của dân, đoàn kết toàn dân \"gắn bó hữu cơ với nhau, là cơ sở, tiền đề của nhau, tạo nên những động lực mạnh mẽ nhất\". Điều này cho thấy sự gắn kết, không riêng lẻ.","d":0},{"s":4,"q":"Theo Hồ Chí Minh, lợi ích của dân và dân chủ của dân là hai động lực độc lập, có thể phát huy riêng rẽ trong tiến trình cách mạng xã hội chủ nghĩa.","g":"Tìm hiểu mối quan hệ giữa lợi ích của dân và dân chủ của dân trong hệ thống động lực.","x":"Với tư cách là những động lực thúc đẩy tiến trình cách mạng xã hội chủ nghĩa, \"lợi ích của dân và dân chủ của dân không thể tách rời nhau\". Chúng gắn bó hữu cơ với nhau.","d":0},{"s":5,"q":"Quan điểm \"xây\" đi đôi với \"chống\" trong tư tưởng Hồ Chí Minh chỉ áp dụng cho việc đối phó với kẻ địch bên ngoài, không liên quan đến việc ngăn chặn những lực cản bên trong.","g":"Xem xét phạm vi áp dụng của quan điểm \"xây\" đi đôi với \"chống\" và các loại \"kẻ địch\" được Người nhắc đến.","x":"Hồ Chí Minh luôn nhắc nhở \"phải không ngừng nêu cao cảnh giác, phải chống cả kẻ địch bên ngoài tìm cách phá hoại thành quả của cách mạng và phải chống cả kẻ địch bên trong là chủ nghĩa cá nhân; chống Tư tưởng “làm quan cách mạng”\". Quan điểm \"xây\" đi đôi với \"chống\" là \"một trong những quan điểm xuyên suốt tư tưởng Hồ Chí Minh\" và bao hàm việc ngăn chặn, loại trừ những lực cản bên trong.","d":0},{"s":6,"q":"Trong mục tiêu xây dựng nền văn hóa xã hội chủ nghĩa, Hồ Chí Minh đặc biệt nhấn mạnh việc triệt để tẩy trừ mọi ảnh hưởng nô dịch của văn hóa đế quốc mà không cho phép hấp thụ bất kỳ yếu tố nào từ văn hóa tiến bộ thế giới.","g":"Đọc kỹ định hướng xây dựng nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng.","x":"Hồ Chí Minh yêu cầu \"Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc. Đồng thời, phát triển những truyền thống tốt đẹp của văn hóa dân tộc và hấp thụ những cái mới của văn hóa tiến bộ thế giới, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng\". Điều này cho thấy Người chủ trương chọn lọc hấp thụ tinh hoa văn hóa tiến bộ thế giới chứ không phải phủ nhận hoàn toàn.","d":0}],"tn":[{"s":7,"q":"Luận điểm nào sau đây thể hiện rõ nhất mục tiêu về chế độ chính trị của chủ nghĩa xã hội ở Việt Nam theo tư tưởng Hồ Chí Minh?","g":"Nhớ lại định nghĩa \"chế độ dân chủ\" và vai trò của nhân dân trong tư tưởng Hồ Chí Minh.","x":"Hồ Chí Minh khẳng định mục tiêu về chế độ chính trị là \"Phải xây dựng được chế độ dân chủ\". Người giải thích: “Chế độ ta là chế độ dân chủ. Tức là nhân dân làm chủ”, “Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ”. Người chỉ rõ: \"quyền hành và lực lượng đều ở nơi dân\". Các phương án khác đều không phản ánh đúng hoặc không đầy đủ tinh thần này.","p":[["A","Xây dựng một chế độ chỉ tập trung quyền lực vào Nhà nước để đảm bảo sự ổn định."],["B","Xây dựng chế độ dân chủ, nơi quyền hành và lực lượng đều ở nơi dân."],["C","Xây dựng chế độ chính trị dựa trên sự lãnh đạo tuyệt đối của một giai cấp duy nhất."],["D","Xây dựng một hệ thống chính trị ưu tiên phát triển kinh tế trước mọi mục tiêu khác."],["E","Xây dựng một chế độ chính trị mà trong đó nhân dân là chủ nhưng không có quyền lợi gắn liền với trách nhiệm."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Khi bàn về mối quan hệ giữa kinh tế và văn hóa trong xây dựng chủ nghĩa xã hội, Hồ Chí Minh có luận điểm mang tính suy luận nào sau đây?","g":"Xem xét mối quan hệ biện chứng giữa văn hóa, chính trị và kinh tế, đặc biệt là thứ tự ưu tiên được Người đề cập.","x":"Hồ Chí Minh cho rằng mối quan hệ giữa văn hóa với chính trị và kinh tế là \"mối quan hệ biện chứng\". Người đã giải thích rõ thứ tự ưu tiên: \"Muốn tiến lên chủ nghĩa xã hội phải phát triển kinh tế và văn hóa. Vì sao không nói phát triển văn hóa và kinh tế? Tục ngữ ta có câu: Có thực mới vực được đạo; vì thế kinh tế phải đi trước\". Điều này khẳng định kinh tế là nền tảng.","p":[["A","Văn hóa phải luôn đi trước kinh tế để tạo tiền đề cho sự phát triển vật chất."],["B","Kinh tế phát triển là điều kiện tiên quyết để thúc đẩy văn hóa, phản ánh qua câu tục ngữ \"Có thực mới vực được đạo\"."],
