ì quan niệm về nước và dân đã hoàn toàn đảo lộn so với trước”. Cụm từ “quan cách mạng” Người dùng ở chỗ khác, khi phê phán cán bộ “lên mặt ‘quan cách mạng’ ra lệnh ra oai”; câu này dùng “quan nhân dân”.","p":[["A","(1) chủ nhân; (2) quan nhân dân"],["B","(1) đầy tớ nhân dân; (2) chủ nhân"],["C","(1) đầy tớ nhân dân; (2) quan nhân dân"],["D","(1) quan nhân dân; (2) đầy tớ nhân dân"],["E","(1) chủ nhân; (2) đầy tớ nhân dân"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":18,"q":"Hồ Chí Minh nhấn mạnh rằng, \"Hiểu chủ nghĩa Mác - Lênin là phải _______. Nếu thuộc bao nhiêu sách mà sống không có tình có nghĩa thì sao gọi là hiểu chủ nghĩa Mác - Lênin được\".","g":"Đoạn nói về mối liên hệ giữa việc hiểu chủ nghĩa Mác-Lênin và đạo lý làm người.","x":"Tài liệu môn học ghi: “Theo Hồ Chí Minh, hiểu chủ nghĩa Mác - Lênin là phải sống với nhau có tình có nghĩa. Nếu thuộc bao nhiêu sách mà sống không có tình có nghĩa thì sao gọi là hiểu chủ nghĩa Mác - Lênin được”.","p":[["A","chí công vô tư"],["B","yêu nước"],["C","tiết kiệm"],["D","thuộc nhiều sách"],["E","sống với nhau có tình có nghĩa"]],"d":"E","k":"Chọn cụm từ điền vào chỗ trống"},{"s":19,"q":"Hồ Chí Minh phân biệt rõ ràng giữa \"Kiệm\" và \"_______\". Người cho rằng, việc đáng tiêu mà không tiêu, vì lợi ích chung, thì không phải là kiệm mà là hành động của một người \"_______\".","g":"Đoạn văn làm rõ sự khác biệt giữa tiết kiệm và một thái độ tiêu cực tương tự. Hai chỗ trống điền cùng một từ.","x":"Tài liệu giải thích: \"Tiết kiệm không phải là bủn xỉn. Khi không nên tiêu xài thì một đồng xu cũng không nên tiêu. Khi có việc đáng làm, việc ích lợi cho đồng bào, cho Tổ quốc, thì dù bao nhiêu công, tốn bao nhiêu của, cũng vui lòng. Như thế mới đúng là kiệm. Việc đáng tiêu mà không tiêu, là bủn xỉn, chứ không phải là kiệm.\"","p":[["A","xa xỉ"],["B","bủn xỉn"],["C","tiết kiệm"],["D","lãng phí"],["E","phô trương"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":20,"q":"Tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh không những _______ giá trị yêu nước truyền thống của dân tộc, mà còn vượt qua những hạn chế của truyền thống đó, tạo nên một cuộc cách mạng sâu sắc.","g":"Đoạn văn nói về cách Hồ Chí Minh xử lý các giá trị truyền thống.","x":"Tài liệu viết: \"Tư tưởng “trung với nước, hiếu với dân” của Hồ Chí Minh không những kế thừa giá trị yêu nước truyền thống của dân tộc, mà còn vượt qua những hạn chế của truyền thống đó. Trung với nước là trung thành với sự nghiệp dựng nước và giữ nước.\"","p":[["A","phủ nhận"],["B","thay thế"],["C","rập khuôn"],["D","kế thừa"],["E","tuyệt đối hóa"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":23,"q":"Theo giáo trình, luận điểm “trung với nước, hiếu với dân, nhiệm vụ nào cũng hoàn thành, khó khăn nào cũng vượt qua, kẻ thù nào cũng đánh thắng” trong Thư gửi thanh niên (1965) của Hồ Chí Minh có ý nghĩa gì?","g":"Chú ý giáo trình nói luận điểm này hướng tới ai và có giá trị trong khoảng thời gian nào.","x":"Tài liệu môn học ghi: “Luận điểm đó của Hồ Chí Minh vừa là lời kêu gọi hành động, vừa là định hướng chính trị - đạo đức cho mỗi người Việt Nam không chỉ trong cuộc đấu tranh cách mạng trước đây, hôm nay, mà còn lâu dài về sau nữa.”","p":[["A","Vừa là lời kêu gọi hành động, vừa là định hướng chính trị - đạo đức cho mỗi người Việt Nam, không chỉ trước đây, hôm nay mà còn lâu dài về sau."],["B","Chỉ là khẩu hiệu động viên dành riêng cho lực lượng vũ trang trong chiến tranh."],["C","Là sự khôi phục quan niệm “trung với vua” trong đạo đức truyền thống."],["D","Chỉ có giá trị trong cuộc đấu tranh cách mạng trước đây, nay không còn phù hợp."],["E","Chỉ đặt ra yêu cầu đối với đảng viên, không áp dụng cho mọi người Việt Nam."]],"d":"A","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":24,"q":"Theo Hồ Chí Minh, vì sao cán bộ phải thực hành chữ LIÊM trước, để làm kiểu mẫu cho dân?","g":"Liên hệ chữ LIÊM với quyền hạn mà cán bộ các cơ quan, các đoàn thể nắm giữ.","x":"Tài liệu môn học ghi: “Trước nhất là cán bộ các cơ quan, các đoàn thể, cấp cao thì quyền to, cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu lương tâm là có dịp đục khoét, có dịp ăn của đút, có dịp ‘dĩ công vi tư’. Vì vậy, cán bộ phải thực hành chữ LIÊM trước, để làm kiểu mẫu cho dân”.","p":[["A","Vì chữ LIÊM chỉ đặt ra cho cán bộ cấp cao, còn cán bộ cấp thấp thì không cần."],["B","Vì thực hành chữ LIÊM giúp cán bộ được thăng chức nhanh hơn."],["C","Vì chữ LIÊM không liên quan gì đến chữ KIỆM và chữ CẦN."],["D","Vì cán bộ có thu nhập cao hơn nhân dân nên dễ giữ mình trong sạch."],["E","Vì cán bộ dù cấp cao hay cấp thấp đều có quyền; có quyền mà thiếu lương tâm là có dịp đục khoét, ăn của đút, “dĩ công vi tư”."]],"d":"E","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":25,"q":"Nhận định nào sau đây KHÔNG đúng về cần, kiệm, liêm, chính, chí công vô tư theo tư tưởng Hồ Chí Minh?","g":"Chú ý giáo trình phân biệt ai phải thực hiện và ai phải thực hiện trước.","x":"Tài liệu môn học ghi: “Hồ Chí Minh cho rằng, các đức tính cần, kiệm, liêm, chính có quan hệ chặt chẽ với nhau, ai cũng phải thực hiện, song cán bộ, đảng viên phải là người thực hành trước để làm kiểu mẫu cho dân.” Vì vậy, nói chỉ cán bộ, đảng viên mới phải thực hiện là sai.","p":[["A","Là nội dung cốt lõi của đạo đức cách mạng, gắn liền với hoạt động hằng ngày của mỗi người."],["B","Được Hồ Chí Minh đề cập nhiều nhất, thường xuyên nhất, từ cuốn sách Đường cách mệnh cho đến bản Di chúc."],["C","Các đức tính cần, kiệm, liêm, chính có quan hệ chặt chẽ với nhau."],["D","Chỉ cán bộ, đảng viên mới phải thực hiện, còn nhân dân thì không đặt ra yêu cầu này."],["E","Một dân tộc biết cần, kiệm, biết liêm là một dân tộc giàu về vật chất, mạnh về tinh thần, văn minh tiến bộ."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":26,"q":"Nhận định nào sau đây KHÔNG đúng về tinh thần quốc tế trong sáng theo tư tưởng Hồ Chí Minh?","g":"Đọc lại cách Hồ Chí Minh kết hợp tinh thần độc lập, tự chủ với đoàn kết quốc tế.","x":"Tài liệu môn học ghi: “Hồ Chí Minh nêu cao tinh thần độc lập, tự chủ, tự lực, tự cường, nhưng luôn luôn kêu gọi phải tăng cường đoàn kết và hợp tác quốc tế, đồng thời phải ra sức ủng hộ và giúp đỡ đối với các cuộc đấu tranh của nhân dân các nước vì hòa bình, độc lập dân tộc, dân chủ và tiến bộ xã hội.” Vì vậy, phương án B là sai.","p":[["A","Chủ nghĩa quốc tế là một trong những phẩm chất quan trọng nhất của đạo đức cộng sản chủ nghĩa."],["B","Vì nêu cao tinh thần độc lập, tự chủ, tự lực, tự cường nên Hồ Chí Minh chủ trương hạn chế đoàn kết và hợp tác quốc tế."],["C","Chủ nghĩa quốc tế nhằm vào mối quan hệ rộng lớn vượt ra khỏi giới hạn quốc gia - dân tộc."],["D","Hồ Chí Minh là biểu tượng cao đẹp của chủ nghĩa yêu nước chân chính kết hợp nhuần nhuyễn với chủ nghĩa quốc tế vô sản."],["E","Câu thơ “Quan sơn muôn dặm một nhà, Bốn phương vô sản đều là anh em!” thể hiện tinh thần quốc tế trong sáng."]],"d":"B","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":29,"q":"Hồ Chí Minh viết: “Kiệm là thế nào? Là tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi. CẦN với KIỆM phải đi đôi với nhau, như _______ của con người”.","g":"Hình ảnh so sánh gợi đến hai bộ phận của cơ thể phải phối hợp nhịp nhàng với nhau.","x":"Tài liệu môn học ghi: “Kiệm là thế nào? Là tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi. CẦN với KIỆM phải đi đôi với nhau, như hai chân của con người”.","p":[["A","hai tay"],["B","hai mắt"],["C","hai chân"],["D","trái tim và khối óc"],["E","hơi thở"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Trong suốt cuộc đời hoạt động cách mạng, Hồ Chí Minh đã dày công xây đắp tình đoàn kết hữu nghị giữa nhân dân Việt Nam và nhân dân thế giới, đã tạo ra một kiểu quan hệ quốc tế mới: _______, nhằm kiến tạo một nền văn hóa hòa bình cho nhân loại.","g":"Kiểu quan hệ mới này hướng tới một nền văn hóa hòa bình cho nhân loại.","x":"Tài liệu môn học ghi: “Trong suốt cuộc đời hoạt động cách mạng, Hồ Chí Minh đã dày công xây đắp tình đoàn kết hữu nghị giữa nhân dân Việt Nam và nhân dân thế giới, đã tạo ra một kiểu quan hệ quốc tế mới: đối thoại thay cho đối đầu, nhằm kiến tạo một nền văn hóa hòa bình cho nhân loại”.","p":[["A","đối thoại thay cho đối đầu"],["B","liên minh quân sự thay cho hợp tác"],["C","biệt lập thay cho hội nhập"],["D","cạnh tranh thay cho hữu nghị"],["E","phụ thuộc thay cho tự chủ"]],"d":"A","k":"Chọn cụm từ điền vào chỗ trống"}]},"14":{"ten":"Đạo đức: vai trò, nguyên tắc","ds":[{"s":1,"q":"Theo Hồ Chí Minh, đạo đức là tiêu chuẩn duy nhất và tuyệt đối để đánh giá sự thành công của một người cách mạng, vì \"không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\".","g":"Tập trung vào cách Hồ Chí Minh đặt mối quan hệ giữa đạo đức và tài năng. Có phải đạo đức là yếu tố \"duy nhất\" và \"tuyệt đối\" không, hay còn có sự kết hợp nào khác được Người nhắc đến?","x":"Tài liệu khẳng định đạo đức là \"tiêu chuẩn hàng đầu\", \"gốc\", \"nền tảng\" và \"rất quan trọng\" của người cách mạng, thậm chí \"không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\". Tuy nhiên, Người cũng nhấn mạnh rằng \"Đức và tài phải là những phẩm chất thống nhất của con người\" và \"nếu thiếu tài thì làm việc gì cũng khó\". Do đó, việc nói đạo đức là \"duy nhất và tuyệt đối\" là sai, vì bỏ qua vai trò quan trọng của tài năng khi gắn liền với đạo đức.","d":0},{"s":2,"q":"Nguyên tắc \"nói đi đôi với làm\" được Hồ Chí Minh coi là đặc trưng bản chất của tư tưởng đạo đức và chủ yếu áp dụng cho cán bộ, đảng viên để làm gương cho quần chúng, không phải là yêu cầu phổ quát cho mọi người.","g":"Đọc kỹ phần giải thích về \"Nói đi đôi với làm\" và đối tượng mà Hồ Chí Minh hướng tới khi đề cập nguyên tắc này. Có sự giới hạn đối tượng chính yếu nào không?","x":"Tài liệu khẳng định \"Nói đi đôi với làm\" là \"đặc trưng bản chất của tư tưởng đạo đức Hồ Chí Minh\". Người đã \"giáo dục mọi người và chính Người đã thực hiện điều đó một cách nghiêm túc và đầy đủ nhất\". Mặc dù Người có nhấn mạnh \"đảng viên đi trước, làng nước theo sau\" và cán bộ, đảng viên cần \"làm gương\", nhưng việc coi nó \"chủ yếu áp dụng\" cho cán bộ, đảng viên là chưa chính xác vì nó là một đặc trưng tổng thể, một nguyên tắc chung cho \"mọi người\".","d":0},{"s":3,"q":"Trong nguyên tắc \"xây đi đôi với chống\", Hồ Chí Minh chủ trương phải tập trung loại bỏ hoàn toàn các hành vi vô đạo đức trước, sau đó mới tiến hành xây dựng các giá trị đạo đức mới để đảm bảo sự trong sạch.","g":"Phân tích mối quan hệ giữa \"xây\" và \"chống\" được Hồ Chí Minh đề cập, đặc biệt là mục đích và tính ưu tiên của từng vế.","x":"Tài liệu chỉ rõ: \"Xây phải đi đôi với chống, muốn xây phải chống, chống nhằm mục đích xây, lấy xây làm chính\". Điều này có nghĩa là xây dựng các giá trị đạo đức mới là mục tiêu hàng đầu, và việc chống lại cái xấu là để phục vụ cho mục tiêu xây. Việc tập trung loại bỏ \"hoàn toàn trước\" và \"sau đó mới tiến hành xây dựng\" là không phản ánh đúng tinh thần \"xây đi đôi với chống\" và nguyên tắc \"lấy xây làm chính\" của Hồ Chí Minh.","d":0},{"s":4,"q":"Mặc dù tu dưỡng đạo đức là một quá trình liên tục, nhưng Hồ Chí Minh đặc biệt nhấn mạnh tầm quan trọng của việc tu dưỡng trong tuổi trẻ, coi đó là giai đoạn quyết định và cần ưu tiên hàng đầu, trong khi các giai đoạn sau có thể giảm bớt sự khắt khe.","g":"Đọc kỹ phần \"Tu dưỡng đạo đức suốt đời\", đặc biệt là những cảnh báo của Người về sự thoái hóa nếu không kiên trì.","x":"Tài liệu nêu rõ \"phải kiên trì rèn luyện liên tục, tu dưỡng suốt đời, trong đó, thời tuổi trẻ đặc biệt quan trọng\". Tuy nhiên, Người cũng cảnh báo \"Nếu không kiên trì rèn luyện, thì ở thời kỳ trước là người có công, nhưng thời kỳ sau có thể lại là người có tội, lúc trẻ giữ được đạo đức, nhưng lúc già lại thoái hóa biến chất, hư hỏng\". Điều này khẳng định sự tu dưỡng phải liên tục, không có giai đoạn nào có thể giảm bớt sự khắt khe, mà là một quá trình \"trường kỳ, gian khổ\".","d":0},{"s":21,"q":"Trong bài Người cán bộ cách mạng (1955), Hồ Chí Minh khẳng định: mọi việc thành hay là bại, chủ chốt là do cán bộ có thấm nhuần đạo đức cách mạng hay là không.","g":"Xem lại các luận điểm về vai trò của đạo đức đối với công việc của người cán bộ.","x":"Tài liệu môn học ghi: “Đạo đức trở thành nhân tố quyết định của sự thành bại của mọi công việc, phẩm chất mỗi con người.” Trong bài Người cán bộ cách mạng (1955), Hồ Chí Minh yêu cầu: “Người cán bộ cách mạng phải có đạo đức cách mạng... Mọi việc thành hay là bại, chủ chốt là do cán bộ có thấm nhuần đạo đức cách mạng, hay là không”.","d":1},{"s":22,"q":"Hồ Chí Minh đòi hỏi cán bộ, đảng viên phải làm gương trong anh em và làm gương cho dân, nhưng chỉ cần làm gương về mặt tinh thần.","g":"Xem lại lời Người nói về phạm vi của việc làm gương.","x":"Tài liệu môn học ghi: “Trước hết, mình phải làm gương, gắng làm gương trong anh em, và khi đi công tác, gắng làm gương cho dân. Làm gương về cả ba mặt: Tinh thần, vật chất và văn hóa”. Vì vậy, nói chỉ cần làm gương về mặt tinh thần là sai.","d":0}],"tn":[{"s":5,"q":"Luận điểm \"Nếu không có đạo đức cách mạng thì có tài cũng vô dụng\" của Hồ Chí Minh hàm ý sâu sắc nhất điều gì về mối quan hệ giữa đạo đức và tài năng của người cách mạng?","g":"Tập trung vào ý nghĩa của từ \"vô dụng\" và \"có hại\" khi thiếu đạo đức, và sự cần thiết của sự thống nhất giữa đức và tài được Hồ Chí Minh nhấn mạnh.","x":"Tài liệu khẳng định \"Nếu không có đạo đức cách mạng thì có tài cũng vô dụng\" và \"thiếu đạo đức thì vô dụng, thậm chí có hại\". Đồng thời, \"đạo đức là gốc, là nền tảng của người cách mạng\", \"tài năng phải gắn chặt và đặt vững trên nền tảng đạo đức\". Điều này cho thấy tài năng cần đạo đức để có mục đích, định hướng đúng đắn và phát huy giá trị tích cực, tránh gây hại, chứ không phải tách biệt hay thay thế.","p":[["A","Đạo đức quan trọng hơn tài năng và có thể thay thế tài năng trong mọi trường hợp."],["B","Người có tài nhưng thiếu đạo đức thì chỉ có thể hoàn thành những công việc nhỏ."],["C","Người cách mạng cần ưu tiên rèn luyện tài năng trước, sau đó mới trau dồi đạo đức."],["D","Đạo đức và tài năng là hai yếu tố hoàn toàn tách biệt, không ảnh hưởng lẫn nhau."],["E","Tài năng chỉ thực sự phát huy giá trị và không trở nên có hại khi có đạo đức làm nền tảng, định hướng."]],"d":"E","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":6,"q":"Khi Hồ Chí Minh ví \"Đạo đức là gốc\" của cây, điều này có ý nghĩa sâu xa nhất là gì đối với người cách mạng?","g":"Liên hệ hình ảnh \"gốc của cây\" với những hệ quả được mô tả khi người cách mạng có hoặc không có đạo đức trong các tác phẩm của Người.","x":"Tài liệu ví \"Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\". Điều này cho thấy đạo đức không chỉ là nền tảng cho sự tồn tại (\"không có gốc thì cây héo\") mà còn quyết định khả năng lãnh đạo, tức là sự phát triển và ảnh hưởng của người cách mạng. Các phương án khác không phản ánh đúng hoặc làm sai lệch ý nghĩa này.","p":[["A","Đạo đức là yếu tố duy nhất giúp người cách mạng đạt được thành công."],["B","Đạo đức chỉ cần được quan tâm trong giai đoạn đầu của sự nghiệp cách mạng."],["C","Đạo đức là nền tảng vững chắc, quyết định sự tồn tại, phát triển và khả năng lãnh đạo quần chúng của người cách mạng."],["D","Người cách mạng chỉ cần có đạo đức, không cần tài năng xuất chúng."],["E","Đạo đức là yếu tố hình thành một cách tự nhiên, không cần rèn luyện."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":7,"q":"Luận điểm \"Đấu tranh chống chủ nghĩa cá nhân không phải là “giày xéo lên lợi ích cá nhân”\" của Hồ Chí Minh hàm ý điều gì?","g":"Phân tích ý nghĩa của \"không phải là giày xéo lên lợi ích cá nhân\" trong ngữ cảnh đấu tranh chống chủ nghĩa cá nhân và nguyên nhân của tệ nạn được Người chỉ ra.","x":"Tài liệu khẳng định \"Tài liệu gốc của mọi thứ tệ nạn là chủ nghĩa cá nhân\" và \"Phải kiên quyết quét sạch chủ nghĩa cá nhân, nâng cao đạo đức cách mạng\". Tuy nhiên, Người cũng lưu ý: \"Đấu tranh chống chủ nghĩa cá nhân không phải là 'giày xéo lên lợi ích cá nhân'\". Điều này cho thấy mục đích của việc chống chủ nghĩa cá nhân là loại bỏ những hành vi tiêu cực, ích kỷ, tư lợi gây hại cho tập thể, chứ không phải phủ nhận hay bác bỏ những lợi ích hợp pháp, chính đáng của cá nhân.","p":[["A","Chủ nghĩa cá nhân hoàn toàn không có lợi ích nào đáng được bảo vệ."],["B","Việc chống chủ nghĩa cá nhân chỉ nhằm mục đích phủ nhận mọi lợi ích của cá nhân."],["C","Chủ nghĩa cá nhân chỉ gây hại khi nó phát triển quá mức, vượt ra ngoài tầm kiểm soát và cần được kiểm soát nhẹ nhàng."],["D","Lợi ích cá nhân không liên quan đến đạo đức cách mạng và không cần phải cân nhắc khi đấu tranh."],["E","Việc chống chủ nghĩa cá nhân là nhằm loại bỏ những hành vi tư lợi, ích kỷ, gây hại cho tập thể, nhưng vẫn tôn trọng những lợi ích hợp pháp, chính đáng của cá nhân."]],"d":"E","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Theo Hồ Chí Minh, ý nghĩa sâu sắc nhất của việc cán bộ, đảng viên \"làm gương\" về đạo đức là gì?","g":"Tập trung vào câu \"một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền\" và các mục đích của việc nêu gương được Hồ Chí Minh chỉ ra.","x":"Tài liệu nhấn mạnh \"Sự gương mẫu của cán bộ, đảng viên trong lời nói và việc làm không chỉ là cách thức để giáo dục đạo đức cho quần chúng, mà còn là một phương pháp để tự giáo dục bản thân mình\". Đặc biệt, Người nói \"Đối với họ một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền\". Điều này cho thấy nêu gương là một phương pháp giáo dục mạnh mẽ, cả cho người khác và cho chính mình, hiệu quả hơn cả lời nói suông, không chỉ mang tính hình thức hay đối phó.","p":[["A","Đơn thuần là tuân thủ quy định của Đảng và Nhà nước về đạo đức để tránh bị kỷ luật."],["B","Chứng minh quyền lực và uy tín của Đảng trước quần chúng nhân dân bằng sự uy nghi."],["C","Chỉ cần làm gương trong những sự kiện lớn hoặc những hoàn cảnh đặc biệt quan trọng."],["D","Mục đích chính là để giữ gìn danh dự cá nhân của cán bộ, đảng viên."],["E","Là phương pháp giáo dục đạo đức hiệu quả nhất cho quần chúng và đồng thời là cách thức tự giáo dục bản thân, vì \"một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền\"."]],"d":"E","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Nhận định nào sau đây không phản ánh đúng quan điểm của Hồ Chí Minh về bản chất và quá trình rèn luyện đạo đức cách mạng?","g":"Đọc kỹ quan điểm của Hồ Chí Minh về sự tồn tại của \"thiện và ác\" trong lòng mỗi con người và quá trình rèn luyện đạo đức.","x":"Tài liệu rõ ràng nêu: \"Mỗi con người đều có thiện và ác ở trong lòng. Ta phải biết làm cho phần tốt ở trong mỗi con người nảy nở như hoa mùa Xuân và phần xấu bị mất dần đi, đó là thái độ của người cách mạng\". Điều này chứng tỏ Hồ Chí Minh không đòi hỏi sự loại bỏ \"hoàn toàn mọi ý nghĩ thiện và ác\" mà là quá trình đấu tranh nội tâm để phát huy cái tốt, loại bỏ cái xấu. Do đó, nhận định D là sai. Các phương án A, B, C, E đều được đề cập trực tiếp hoặc gián tiếp trong tài liệu.","p":[["A","Đạo đức cách mạng là chỗ dựa giúp con người vững vàng trong mọi thử thách, khi gặp khó khăn hay thành công."],["B","Đạo đức cách mạng thể hiện tính nhân đạo chiến đấu vì mục tiêu sự nghiệp cách mạng."],["C","Đạo đức cách mạng không phải là thứ có sẵn mà phải thông qua đấu tranh, rèn luyện bền bỉ hằng ngày."],["D","Đạo đức cách mạng đòi hỏi người cách mạng phải loại bỏ hoàn toàn mọi ý nghĩ \"thiện\" và \"ác\" trong lòng để đạt được sự trong sạch tuyệt đối."],["E","Đạo đức cách mạng là đạo đức trong hành động, lấy hiệu quả thực tế làm thước đo."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":10,"q":"Phát biểu nào sau đây không phản ánh đúng quan điểm của Hồ Chí Minh về việc giáo dục \"đức\" và \"tài\" trong sự nghiệp cách mạng?","g":"So sánh mức độ ưu tiên giữa \"đức\" và \"tài\" được Hồ Chí Minh nhấn mạnh trong việc giáo dục và thực hành.","x":"Tài liệu khẳng định \"đạo đức là gốc, là nền tảng của người cách mạng\", \"đức là gốc, là trước hết\", và \"Đó là cái gốc, rất quan trọng. Nếu không có đạo đức cách mạng thì có tài cũng vô dụng\". Điều này cho thấy \"đức\" được ưu tiên là \"gốc\", \"nền tảng\" hàng đầu. Mặc dù \"tài là phương tiện thực hiện mục đích đó\" và \"không có tài thì không xây dựng, phát triển được đất nước\", nhưng việc nói \"giáo dục tài năng cần ưu tiên hàng đầu trong mọi giai đoạn\" là sai vì nó đi ngược lại quan điểm \"đức là gốc, là trước hết\".","p":[["A","Cần chú trọng giáo dục toàn diện cả \"Đức, Trí, Thể, Mỹ\", trong đó đức là gốc."],["B","Đức và tài, hồng và chuyên, phẩm chất và năng lực phải thống nhất làm một."],["C","Nếu không có đạo đức cách mạng thì có tài cũng vô dụng."],["D","Giáo dục tài năng cần ưu tiên hàng đầu trong mọi giai đoạn, vì tài là phương tiện quan trọng nhất để thực hiện mọi mục đích cách mạng."],["E","Thiếu tài thì làm việc gì cũng khó, nhưng thiếu đạo đức thì vô dụng, thậm chí có hại."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":11,"q":"Theo Hồ Chí Minh, những hành vi nào sau đây không phải là biểu hiện của \"thói đạo đức giả\", \"bệnh quan liêu\" hoặc \"chủ nghĩa cá nhân\" tiêu cực?","g":"Tập trung vào định nghĩa \"thói đạo đức giả\" và các ví dụ cụ thể của nó, cũng như điều mà Người lưu ý về ranh giới trong đấu tranh chống chủ nghĩa cá nhân.","x":"Tài liệu nêu rõ \"Nói đi đôi với làm đối lập hoàn toàn với thói đạo đức giả, nói một đằng làm một nẻo, nói nhiều làm ít, thậm chí nói mà không làm\". Các hành vi \"vác mặt làm quan cách mạng\", \"miệng thì nói dân chủ, nhưng làm việc thì họ theo lối “quan” chủ\" và \"quan liêu, tham ô, lãng phí\" cũng được Người chỉ ra là biểu hiện tiêu cực. Tuy nhiên, Người lưu ý: \"Đấu tranh chống chủ nghĩa cá nhân không phải là 'giày xéo lên lợi ích cá nhân'\". Do đó, việc \"phủ nhận những lợi ích hợp pháp, chính đáng của cá nhân\" trong đấu tranh chống chủ nghĩa cá nhân là một hành vi không đúng đắn theo tư tưởng của Người, chứ không phải là biểu hiện của \"thói đạo đức giả\" hay \"bệnh quan liêu\" theo định nghĩa trong tài liệu.","p":[["A","\"Nói một đằng làm một nẻo\", \"nói nhiều làm ít\", \"nói mà không làm\"."],["B","\"Vác mặt làm quan cách mạng\", \"miệng thì nói dân chủ, nhưng làm việc thì họ theo lối “quan” chủ\"."],["C","Hành động \"làm trái ngược với lợi ích của quần chúng, trái ngược với phương châm, chính sách của Đảng và Chính phủ\"."],["D","Kiên quyết đấu tranh chống chủ nghĩa cá nhân trong mọi hoàn cảnh, kể cả việc phủ nhận những lợi ích hợp pháp, chính đáng của cá nhân."],["E","Các hành vi \"quan liêu, tham ô, lãng phí\"."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":12,"q":"Để xây dựng một nền đạo đức mới, Hồ Chí Minh đã chỉ ra những yêu cầu nào sau đây, ngoại trừ một điều không đúng?","g":"Xem xét phạm vi và cách thức giáo dục đạo đức được Hồ Chí Minh đề cập. Có sự phân chia theo trình tự như vậy không, hay là một quá trình đồng thời, toàn diện?","x":"Mặc dù Hồ Chí Minh rất chú trọng việc cán bộ, đảng viên phải \"làm gương\" và \"thấm nhuần đạo đức cách mạng\", nhưng việc xây dựng đạo đức mới không chỉ dành riêng cho một nhóm người rồi mới phổ biến. Tài liệu chỉ rõ \"xây dựng đạo đức mới cho cán bộ, đảng viên và hàng triệu, hàng triệu con người, trước tiên phải chăm lo bồi dưỡng những phẩm chất, chuẩn mực đạo đức mới ngay từ trong gia đình, đến nhà trường và xã hội\". Điều này cho thấy đây là một quá trình toàn diện, diễn ra đồng thời ở nhiều cấp độ, không phải theo trình tự \"trước-sau\" và điều kiện \"đủ trình độ tiếp thu\" như phương án E nêu.","p":[["A","Chuẩn mực đạo đức phải trở thành hành vi đạo đức hằng ngày của mỗi người và toàn xã hội."],["B","Phải kết hợp chặt chẽ giữa \"xây\" và \"chống\", trong đó \"lấy xây làm chính\"."],["C","Khơi dậy ý thức đạo đức lành mạnh ở mỗi người, khuyến khích sự tự giáo dục, tự trau dồi đạo đức."],["D","Phải tiến hành giáo dục đạo đức phù hợp với từng giai đoạn cách mạng, lứa tuổi, ngành nghề."],["E","Tập trung giáo dục các phẩm chất đạo đức mới cho cán bộ, đảng viên trước tiên, sau đó mới phổ biến rộng rãi cho toàn thể nhân dân khi họ đã đủ trình độ tiếp thu."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Hồ Chí Minh ví \"Cũng như sông thì có nguồn mới có nước, không có nguồn thì (1) _______. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có (2) _______, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân.\"","g":"Đoạn văn sử dụng các hình ảnh ẩn dụ quen thuộc để nhấn mạnh tầm quan trọng thiết yếu của đạo đức đối với người cách mạng.","x":"Tài liệu viết: \"Cũng như sông thì có nguồn mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\".","p":[["A","(1) sông cạn; (2) tài năng"],["B","(1) cây héo; (2) đạo đức"],["C","(1) sông cạn; (2) gốc"],["D","(1) cây héo; (2) tài năng"],["E","(1) sông cạn; (2) đạo đức"]],"d":"E","k":"Chọn cụm từ điền vào chỗ trống"},{"s":18,"q":"Trong Di chúc, Hồ Chí Minh căn dặn: \"Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người (1) _______, là người (2) _______ thật trung thành của nhân dân.\"","g":"Hồ Chí Minh luôn đề cao vai trò và trách nhiệm kép của Đảng và cán bộ đối với nhân dân.","x":"Tài liệu viết: \"Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân\".","p":[["A","(1) đầy tớ; (2) lãnh đạo"],["B","(1) lãnh đạo; (2) nêu gương"],["C","(1) nêu gương; (2) đầy tớ"],["D","(1) lãnh đạo; (2) đầy tớ"],["E","(1) nêu gương; (2) lãnh đạo"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":19,"q":"Hồ Chí Minh cho rằng, \"Tiếp nhận sự giáo dục đạo đức là vấn đề nhất thiết không thể thiếu được, nhưng sự _______, tự trau dồi đạo đức ở mỗi người còn quan trọng hơn. Bởi vì \"Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong\".\"","g":"Đoạn văn nhấn mạnh vai trò chủ động của mỗi cá nhân trong việc rèn luyện đạo đức.","x":"Tài liệu ghi rõ: \"Tiếp nhận sự giáo dục đạo đức là vấn đề nhất thiết không thể thiếu được, nhưng sự tự giáo dục, tự trau dồi đạo đức ở mỗi người còn quan trọng hơn\".","p":[["A","tự giáo dục"],["B","nêu gương"],["C","lãnh đạo"],["D","giáo dục của tổ chức"],["E","giám sát của tập thể"]],"d":"A","k":"Chọn cụm từ điền vào chỗ trống"},{"s":20,"q":"Hồ Chí Minh chỉ rõ: \"Nguồn gốc của mọi thứ tệ nạn là (1) _______\". Để giành được thắng lợi trong cuộc chiến đấu này, điều quan trọng là phải phát hiện sớm, tuyên truyền, vận động hình thành phong trào quần chúng rộng rãi, đồng thời chú trọng kết hợp giáo dục đạo đức với tăng cường tính nghiêm minh của (2) _______.","g":"Tìm nguyên nhân gốc rễ của mọi tệ nạn và hai biện pháp chính được Người đề xuất để đấu tranh chống lại chúng.","x":"Tài liệu nêu: \"Nguồn gốc của mọi thứ tệ nạn là chủ nghĩa cá nhân\". Đồng thời, Người cũng yêu cầu: \"Muốn giành được thắng lợi trong cuộc chiến đấu này, điều quan trọng là phải... chú trọng kết hợp giáo dục đạo đức với tăng cường tính nghiêm minh của pháp luật\".","p":[["A","(1) chủ nghĩa cá nhân; (2) đạo đức"],["B","(1) quan liêu; (2) pháp luật"],["C","(1) chủ nghĩa cá nhân; (2) pháp luật"],["D","(1) tham ô; (2) đạo đức"],["E","(1) lãng phí; (2) pháp luật"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":23,"q":"Theo Hồ Chí Minh, dù năng lực và công việc của mỗi người khác nhau, người làm việc to, người làm việc nhỏ, thì điều gì làm cho một người trở thành người cao thượng?","g":"Nhớ lại câu Người viết trong bài Đạo đức cách mạng (1955).","x":"Tài liệu môn học ghi: “Vai trò của đạo đức còn thể hiện là thước đo lòng cao thượng của con người.” Hồ Chí Minh viết: “Tuy năng lực và công việc của mỗi người khác nhau, người làm việc to, người làm việc nhỏ; nhưng ai giữ được đạo đức đều là người cao thượng”.","p":[["A","Làm được những việc to lớn."],["B","Có năng lực vượt trội so với người khác."],["C","Giữ được đạo đức."],["D","Giữ chức vụ cao trong bộ máy."],["E","Có nhiều bằng cấp, học vị."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":24,"q":"Theo giáo trình, Hồ Chí Minh coi nguyên tắc “nói đi đôi với làm” có vị trí như thế nào trong xây dựng nền đạo đức mới?","g":"Chú ý nguồn gốc truyền thống và mức độ quan trọng mà Người dành cho nguyên tắc này.","x":"Tài liệu môn học ghi: “Nói đi đôi với làm là nét đẹp trong đạo đức truyền thống của dân tộc được Hồ Chí Minh nâng lên một tầm cao mới.” và “Người coi đây là nguyên tắc quan trọng bậc nhất trong xây dựng nền đạo đức mới. Nguyên tắc cơ bản này là sự thống nhất giữa lý luận và thực tiễn”.","p":[["A","Là nguyên tắc thứ yếu, chỉ áp dụng khi tuyên truyền, vận động quần chúng."],["B","Là yêu cầu riêng của phương Tây mà Người tiếp thu, không có trong truyền thống dân tộc."],["C","Là một khẩu hiệu mang tính hình thức, không gắn với thực tiễn."],["D","Là nguyên tắc quan trọng bậc nhất, thể hiện sự thống nhất giữa lý luận và thực tiễn."],["E","Là nguyên tắc tạm thời, chỉ cần thiết trong thời kỳ kháng chiến."]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":25,"q":"Nhận định nào sau đây KHÔNG đúng về nguyên tắc “xây đi đôi với chống” trong tư tưởng Hồ Chí Minh?","g":"Nhớ lại nhận xét của Người: “Không có ai cái gì cũng tốt, cái gì cũng hay”.","x":"Tài liệu môn học ghi: “Trong đời sống hằng ngày, những hiện tượng tốt - xấu, đúng - sai, cái đạo đức và cái vô đạo đức thường đan xen nhau, đối chọi nhau thông qua hành vi của những con người khác nhau, thậm chí trong mỗi con người.” và “Chính vì vậy, việc xây và chống trong lĩnh vực đạo đức rõ ràng không đơn giản.” Vì vậy, phương án C là sai.","p":[["A","Là đòi hỏi của nền đạo đức mới, thể hiện tính nhân đạo chiến đấu vì mục tiêu của sự nghiệp cách mạng."],["B","Xây là xây dựng các giá trị, các chuẩn mực đạo đức mới; chống là chống các biểu hiện, các hành vi vô đạo đức, suy thoái đạo đức."],["C","Vì cái tốt và cái xấu luôn tách bạch rõ ràng, không đan xen trong mỗi con người, nên việc xây và chống là đơn giản."],["D","Đạo đức mới chỉ có thể được xây dựng thành công trên cơ sở kiên trì chống chủ nghĩa đế quốc, chống những thói quen và tập tục lạc hậu, loại trừ chủ nghĩa cá nhân."],["E","Bản thân sự tự giác cũng là một phẩm chất đạo đức cao quý đối với mỗi người và mỗi tổ chức."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":26,"q":"Nhận định nào sau đây KHÔNG đúng về nguyên tắc “tu dưỡng đạo đức suốt đời” theo Hồ Chí Minh?","g":"Nhớ lại cách Hồ Chí Minh nhắc lại và giải thích luận điểm “chính tâm, tu thân”.","x":"Tài liệu môn học ghi: “Người nhắc lại luận điểm của Khổng Tử ‘chính tâm, tu thân’; ‘tề gia, trị quốc, bình thiên hạ’, và nêu rõ” rằng: “Chính tâm tu thân tức là cải tạo. Cải tạo cũng phải trường kỳ gian khổ, vì đó là một cuộc cách mạng trong bản thân của mỗi người.” Vì vậy, nói Người bác bỏ hoàn toàn luận điểm này là sai.","p":[["A","Hồ Chí Minh bác bỏ hoàn toàn luận điểm “chính tâm, tu thân” của Khổng Tử vì cho rằng không có giá trị đối với người cách mạng."],["B","Tu dưỡng đạo đức như một cuộc cách mạng trường kỳ, gian khổ."],["C","Một nền đạo đức mới chỉ có thể được xây dựng trên cơ sở tự giác tu dưỡng đạo đức của mỗi người."],["D","Chỉ có trong hành động, đạo đức cách mạng mới bộc lộ rõ những giá trị của nó."],["E","Đạo đức cách mạng thể hiện trong hành động của người Việt Nam yêu nước vì độc lập, tự do của dân tộc, hạnh phúc của nhân dân."]],"d":"A","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":29,"q":"Theo giáo trình, đức và tài phải là những phẩm chất thống nhất của con người: nếu đạo đức là tiêu chuẩn cho mục đích hành động thì tài là _______.","g":"Câu này phân biệt vai trò của đức (định hướng mục đích) với vai trò của tài.","x":"Tài liệu môn học ghi: “Đức và tài phải là những phẩm chất thống nhất của con người. Nếu đạo đức là tiêu chuẩn cho mục đích hành động thì tài là phương tiện thực hiện mục đích đó.”","p":[["A","mục đích cuối cùng của hành động"],["B","phương tiện thực hiện mục đích đó"],["C","tiêu chuẩn hàng đầu của người cách mạng"],["D","yếu tố không cần thiết"],["E","cái gốc của người cách mạng"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Vấn đề quan trọng trong việc giáo dục đạo đức là phải khơi dậy ý thức đạo đức lành mạnh ở mỗi người, để mọi người cảm nhận thấy sâu sắc sự trau dồi đạo đức cách mạng là việc làm “_______ nhất trên đời”.","g":"Cụm từ cần điền diễn tả cảm xúc tích cực của người tự giác trau dồi đạo đức.","x":"Tài liệu môn học ghi: “Vấn đề quan trọng trong việc giáo dục đạo đức là phải khơi dậy ý thức đạo đức lành mạnh ở mỗi người, để mọi người tự giác nhận thức được trách nhiệm đạo đức của mình, như Hồ Chí Minh đã nói, cảm nhận thấy sâu sắc sự trau dồi đạo đức cách mạng là việc làm ‘sung sướng và vẻ vang nhất trên đời’.”","p":[["A","bình thường và đơn giản"],["B","bắt buộc và gò bó"],["C","tốn kém và mất thời gian"],["D","riêng tư và kín đáo"],["E","sung sướng và vẻ vang"]],"d":"E","k":"Chọn cụm từ điền vào chỗ trống"}]}}};

function canh(){
  const c = $("#canh"), l = c && c.querySelector(".lop"); if(!l) return;
  const W = c.clientWidth, H = c.clientHeight; if(!W || !H) return;
  const vua = c.dataset.vua === "vua" || (c.dataset.vua === "tuy" && W / H < 1.1);
  const s = vua ? Math.min(W / 1440, H / 810) : Math.max(W / 1440, H / 810);
  l.style.transform = `translate(${(W - 1440 * s) / 2}px, ${(H - 810 * s) / 2}px) scale(${s})`;
}

function taoMQTT(cfg, onMsg, onState){

    ws.onopen = () => { let co = 0x02; let pl = chu("vl" + Math.random().toString(36).slice(2, 12));

    do{ if(i >= buf.length) return; b = buf[i++]; len += (b & 127) * m; m *= 128; }while(b & 128);
    if(buf.length < i + len) return; const h = buf[0], p = buf.slice(i, i + len); buf = buf.slice(i + len); try{ xuLy(h, p); }catch(e){} } }
  function xuLy(h, p){ const t = h >> 4;

    sub(f){ if(subs.has(f)) return Promise.resolve(true); subs.add(f); if(!ok) return Promise.resolve(false); return new Promise(r => doi(dangKy(f), r, 4000)); },

const SYNC = (() => {
  const kho = new Map(), nghe = new Set(), may = []; let bc = null, batDauLuc = 0, baoDoi = () => {};
  const dc = p => KHONG_GIAN + p;
  const khop = (f, t) => { if(f.endsWith("/+")){ const g = f.slice(0, -1); return t.startsWith(g) && t.length > g.length && !t.slice(g.length).includes("/"); } return f === t; };
  function nhan(t, text){ if(!t.startsWith(KHONG_GIAN) || !text) return; let r; try{ r = JSON.parse(text); }catch(e){ return; }
    if(!r || typeof r.t !== "number" || typeof r.v !== "object") return; const cu = kho.get(t); if(cu && cu.t >= r.t) return;
    kho.set(t, r); nghe.forEach(l => { if(khop(l.f, t)) try{ l.cb(); }catch(e){ console.error(e); } }); }
  const coMay = () => CHI_BC || may.some(m => m.ok);
  const cho = (dk, ms) => new Promise(r => { if(dk()) return r(true); const t0 = Date.now(), iv = setInterval(() => { if(dk()){ clearInterval(iv); r(true); } else if(Date.now() - t0 > ms){ clearInterval(iv); r(false); } }, 100); });
  async function sub(f){ if(bc) bc.postMessage({k: "hoi", f}); await Promise.all(may.map(m => m.sub(f))); }
  function snap(p){ const t = dc(p), r = kho.get(t); return {exists: !!r, data: () => r ? r.v : undefined}; }
  let tCuoi = 0;
  async function ghi(p, v){ const t = dc(p), cu = kho.get(t); tCuoi = Math.max(Date.now(), tCuoi + 1, cu ? cu.t + 1 : 0); const moc = tCuoi, tx = JSON.stringify({t: moc, v});
    nhan(t, tx); if(bc) bc.postMessage({k: "pub", t, tx}); if(CHI_BC) return;
    for(let lan = 0; lan < 10; lan++){
      if(!coMay()) await cho(coMay, 8000);
      const kq = await Promise.all(may.map(m => m.pub(t, tx))); if(kq.some(Boolean)) return;
      await new Promise(r => setTimeout(r, 1500)); const nay = kho.get(t); if(nay && nay.t !== moc) return; }
    throw new Error("không gửi được"); }
  function ngheDoc(p, cb){ const t = dc(p), l = {f: t, cb: () => cb(snap(p))}; nghe.add(l); sub(t); if(kho.has(t)) setTimeout(() => { if(nghe.has(l)) l.cb(); }, 0); return () => nghe.delete(l); }
  function ngheBo(p, cb){ const f = dc(p) + "/+", g = f.slice(0, -1);
    const l = {f, cb: () => { const docs = []; kho.forEach((r, t) => { if(khop(f, t)) docs.push({id: t.slice(g.length), data: () => r.v}); }); cb({docs}); }};
    nghe.add(l); sub(f); setTimeout(() => { if(nghe.has(l)) l.cb(); }, 0); return () => nghe.delete(l); }
  return { coMay, dangThu: () => !coMay() && Date.now() - batDauLuc < 9000,
    batDau(onDoi){ baoDoi = onDoi || baoDoi; batDauLuc = Date.now();
      if("BroadcastChannel" in window){ bc = new BroadcastChannel("ve-lang");
        bc.onmessage = e => { const d = e.data || {}; if(d.k === "pub") nhan(d.t, d.tx); else if(d.k === "hoi") kho.forEach((r, t) => { if(khop(d.f, t)) bc.postMessage({k: "pub", t, tx: JSON.stringify(r)}); }); }; }
      if(!CHI_BC) MAY_CHU.forEach(c => { const m = taoMQTT(c, nhan, () => baoDoi()); may.push(m); m.batDau(); });
      setTimeout(() => baoDoi(), 9500); baoDoi(); },
    doc: p => ({ set: v => ghi(p, v), onSnapshot: cb => ngheDoc(p, cb) }),
    collection: p => ({ onSnapshot: cb => ngheBo(p, cb) }) };
})();

function bocCau(b){
  let cds = (DB.buoi[b] || DB.buoi["12"]).slice();
  if(cds.length > SO) cds = tron(cds).slice(0, SO).sort();
  const daDung = new Set();

    for(const m of [uuTien].concat(tron(cds.slice()))){
      const con = DB.cd[m][loai].filter(x => !daDung.has(loai + m + "-" + x.s));
      if(con.length){ const x = con[Math.random() * con.length | 0]; daDung.add(loai + m + "-" + x.s); return {cd: m, s: x.s}; }
    }
    const m = cds[0], ds = DB.cd[m][loai]; return {cd: m, s: ds[Math.random() * ds.length | 0].s};
  };
  const ds = [], tn = [];
  for(let i = 0; i < SO; i++){ const m = cds[Math.floor(i * cds.length / SO)]; ds.push(lay1("ds", m)); tn.push(lay1("tn", m)); }
  return {cds, ds, tn};
}

function gioiHanKq(){
  const kq = $(".bang-kq"), tren = $(".bang-tren"); if(!kq || !tren || matchMedia("(max-aspect-ratio:1/1)").matches) return;

}
addEventListener("resize", () => { if(MAN === "ngare") gioiHanKq(); if(MAN === "chieu") veBangChieu(); });

/* ---------- 4. Trạm (câu một đáp án) ---------- */
MANH.tram = () => {

      <div class="o4"><div><b style="color:#B4566A">${G.sen}<span style="font-size:1.2rem;color:#4A5B52">/${SO * 2}</span></b><span>hoa sen</span></div>
        <div><b>${G.buoc}</b><span>số bước (ngắn nhất ${SO * 6})</span></div><div><b>${G.ngoCut}</b><span>lần vào ngõ cụt</span></div>

        <span>${G.ma ? `Kết quả của nhóm đã gửi lên màn hình máy chiếu (phòng ${esc(G.ma)}). Thứ hạng cả lớp xem trên màn hình giảng viên. <span class="dot mang" aria-hidden="true"></span>` : "Máy này chơi không nối máy chiếu: báo kết quả cho giảng viên."}</span></div>
      <div style="flex:1"></div>
      <div style="display:flex;gap:.6rem"><button type="button" class="nut2" style="flex:1" data-k="veDau">Về màn chính</button><button type="button" class="nut" style="flex:1" data-k="xemBanDo">Xem lại bản đồ</button></div>
    </section>`};
};

/* ---------- 6. Máy chiếu ---------- */
const MA_CHU = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
MANH.chieuMo = () => {
  const opts = Object.keys(DB.buoi).map(b => `<option value="${b}"${b === (lay("vls-buoi") || "6") ? " selected" : ""}>${esc(b === "12" ? "Buổi 12 · Tổng ôn 14 chủ đề" : nhanBuoi(b))}</option>`).join("");
  return {khoa: "chieu", tinh: veChieuNen(), ui: `<form class="bang" id="f-chieu" style="left:50%;top:50%;transform:translate(-50%,-50%);width:min(26rem,94vw)" novalidate>
    <h2 class="tay" style="font-size:2.2rem;color:#163A30">Mở màn hình máy chiếu</h2>
    <p class="mo" style="font-size:.95rem">Máy chiếu giữ phòng và bảng tổng hợp. Mỗi nhóm nhập mã phòng trên máy của mình; máy nhóm chỉ thấy kết quả của nhóm đó.</p>
    ${H ? `<button type="button" class="nut toi" data-k="moLaiPhong">Mở lại phòng ${esc(H.ma)} (${esc(nhanBuoi(H.buoi))})</button>` : ""}
    <div class="truong"><label for="c-buoi">Buổi học</label><select id="c-buoi">${opts}</select></div>
    <div class="truong"><label for="c-phut">Thời gian (phút)</label><input id="c-phut" type="number" min="5" max="90" value="${H ? H.phut : 20}"></div>
    <button type="submit" class="nut">Mở phòng mới</button>
    <button type="button" class="lienket" data-k="veDau" style="align-self:center">Quay lại</button></form>`,
    sau(){ $("#f-chieu").onsubmit = e => { e.preventDefault();
      const buoi = $("#c-buoi").value, phut = Math.max(5, Math.min(90, parseInt($("#c-phut").value, 10) || 20));
      let ma = ""; for(let k = 0; k < 4; k++) ma += MA_CHU[Math.random() * MA_CHU.length | 0];
      H = {ma, buoi, phut, tBD: null, mo: Date.now()}; luu(KH, H); luu("vls-buoi", buoi); moPhong(); }; }};
};
let NHOM = [], NGHE_PHONG = "";
function moPhong(){
  batMang(); ghiMang(`p/${H.ma}/cfg`, {buoi: H.buoi, mo: H.mo});
  if(NGHE_PHONG !== H.ma){ NGHE_PHONG = H.ma;
    SYNC.collection(`p/${H.ma}/n`).onSnapshot(s => { NHOM = s.docs.map(d => d.data()).filter(x => x && x.nhom); if(MAN === "chieu") veBangChieu(); }); }
  ve("chieu");
}
const linkPhong = () => diaChiGame() + "?phong=" + H.ma;
MANH.chieu = () => ({khoa: "chieu", tinh: veChieuNen(),
  ui: `<header class="dau-chieu"><h1>Về Làng</h1><span class="chip">${esc(H.buoi === "12" ? "Buổi 12 · Tổng ôn" : nhanBuoi(H.buoi))}</span><div style="flex:1"></div>
    <span class="pill sang" id="so-ve"></span><button type="button" class="pill" id="dong-ho-chieu" data-k="tinhGio"></button>
    <button type="button" class="pill sang" data-k="hienQR">Phòng ${esc(H.ma)} <span class="dot mang" aria-hidden="true"></span></button></header>
    <section class="bang bang-chieu" id="bang-chieu" aria-label="Bảng tổng hợp các nhóm"></section>`,
  sau(){ veBangChieu(); veDongHoChieu(); }});
function xepNhom(){
  return NHOM.slice().sort((a, b) => {
    const va = !!a.xong, vb = !!b.xong; if(va !== vb) return va ? -1 : 1;
    if(va) return (b.sen - a.sen) || (a.buoc - b.buoc) || ((a.tXong - a.t0) - (b.tXong - b.t0));
    return (b.c - a.c) || (b.sen - a.sen) || (a.buoc - b.buoc);
  });
}
function veBangChieu(){
  const el = $("#bang-chieu"); if(!el) return;
  const ds = xepNhom(), n = ds.length, ve_ = ds.filter(x => x.xong).length;
  const soVe = $("#so-ve"); if(soVe) soVe.textContent = `${ve_}/${n} nhóm đã về`;
  if(!n){
    el.innerHTML = `<div class="cho-vao"><div style="display:flex;flex-direction:column;gap:.6rem;align-items:center">
      <span class="mo" style="font-size:1.2rem">Mã phòng</span><div class="ma-phong">${esc(H.ma)}</div>
      <p style="font-size:1.1rem;max-width:26rem">Mỗi nhóm mở game trên máy của mình, nhập <b>mã phòng</b> và <b>số nhóm</b> — hoặc quét mã QR.</p>
      <p class="mo" style="font-size:.9rem;word-break:break-all">${esc(linkPhong())}</p></div>
      <div class="qr" id="qr-lon" style="width:15rem;height:15rem"></div></div>`;
    veQR($("#qr-lon"), linkPhong()); return;
  }
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 19;
  const h = Math.max(1.6, Math.min(3.1, (el.clientHeight - 7 * rem) / n / rem)), fs = h >= 2.6 ? 1.25 : h >= 2.1 ? 1.1 : 1, dot = Math.round(h * 0.38 * rem);
  let hang = 0;
  const dong = ds.map(g => {
    const ve2 = !!g.xong; if(ve2) hang++;
    const cham = Array.from({length: SO}, (_, k) => { const c = k + 1, qua = c < g.c, dang = c === g.c && !ve2;
      return `<i style="width:${dot}px;height:${dot}px;background:${qua || ve2 ? "#1F4A3A" : dang ? "#E7B940" : "#F4ECD6"};border-color:${qua || ve2 ? "#1F4A3A" : dang ? "#B98A1E" : "#C9BB95"}"></i>`; }).join("");
    return `<div class="dong" style="min-height:${h}rem;font-size:${fs}rem;${ve2 && hang === 1 ? "background:#F7E3A8;" : ""}color:${ve2 ? "#1E2B24" : "#4A5B52"}">
      <span class="tay" style="font-size:${fs * 1.35}rem;padding-left:.4rem">${ve2 ? hang : "–"}</span><b>Nhóm ${esc(g.nhom)}</b>
      <span class="cham">${cham}<span class="nhan" style="background:${ve2 ? "#2F8F6B" : "#E9DFC2"};color:${ve2 ? "#FFFBF0" : "#2D4A40"}">${ve2 ? "Đã về" : "Chặng " + Math.min(g.c, SO)}</span></span>
      <span class="so tay sen" style="font-size:${fs * 1.35}rem">${g.sen}</span><span class="so tay" style="font-size:${fs * 1.35}rem">${g.buoc}</span><span class="so tay" style="font-size:${fs * 1.35}rem;padding-right:.4rem">${g.ngoCut}</span></div>`;
  }).join("");
  el.innerHTML = `<div class="dong dau"><span style="padding-left:.4rem">Hạng</span><span>Nhóm</span><span>Hành trình</span><span class="so" style="font-family:inherit">Hoa sen</span><span class="so" style="font-family:inherit">Số bước</span><span class="so" style="font-family:inherit;padding-right:.4rem">Ngõ cụt</span></div>
    ${dong}<div style="flex:1"></div>
    <p class="mo" style="font-size:.9rem;margin-top:.6rem">Xếp hạng: nhóm đã về đích đứng trước; nhiều hoa sen hơn đứng trên, bằng nhau thì ít bước hơn đứng trên. Nhóm còn trên đường xếp theo chặng đang đi. Mã phòng <b>${esc(H.ma)}</b>.</p>`;
}
function veDongHoChieu(){
  const el = $("#dong-ho-chieu"); if(!el || !H) return;
  if(!H.tBD){ el.textContent = `Bắt đầu tính giờ (${H.phut} phút)`; el.classList.add("sang"); return; }
  el.classList.remove("sang");

setInterval(() => {
  if(MAN === "chieu") veDongHoChieu();
  const d = $("#dong-ho"); if(d && G) d.textContent = mmss((G.tXong || Date.now()) - G.t0);
}, 1000);

/* ============================================================
   LỚP PHỦ: cách chơi, xem lại câu sai, mã QR

const LUAT = `<h2 class="tay" style="font-size:2.2rem;color:#163A30">Cách chơi</h2><ul>

/* ============================================================
   NÚT BẤM
   ============================================================ */
const HANH = {
  luat: () => moPhu(LUAT),
  dongPhu,
  moChieu: () => ve("chieuMo"),
  moLaiPhong: () => moPhong(),
  veDau: () => { ve("dau"); },
  tiepTuc: () => ve(xong() ? "dich" : (G.man && G.man !== "dau" ? G.man : "bando")),
  diTiep: () => { if(xong()) return ve("dich"); ve(G.phan); },
  xemBanDo: () => ve("bando"),
  chonLoi: b => {
    const X = b.dataset.v, i = G.chang, q = cauDs(i), nr = G.nr;
    if(nr.chon !== null || nr.thu === X) return;
    nr.chon = X;
    if((X === "d") === (q.d === 1)){ if(!nr.thu && !nr.goiY){ G.sen++; nr.sen = true; G.senO = G.senO || []; G.senO[i] = (G.senO[i] || 0) + 1; } }
    else { nr.thu = X; G.ngoCut++; G.buoc += 3; G.ngoCutO.push(i); G.sai.push({cd: q.cd, s: q.s, l: "ds"}); }
    luuG(); ve();
  },
  quayLai: () => { G.nr.chon = null; luuG(); ve(); },
  diTram: () => { G.phan = "tram"; G.tr = trMoi(); luuG(); ve("tram"); },
  goiY: () => { const t = MAN === "ngare" ? G.nr : G.tr; if(t.goiY) return; t.goiY = true; G.buoc++; G.goiY++; luuG(); ve(); },
  chonPa: b => { if(G.tr.chot) return; G.tr.chon = b.dataset.v; luu(KG, G); ve(); },
  chot: () => {
    const i = G.chang, q = cauTn(i), tr = G.tr; if(!tr.chon || tr.chot) return;
    tr.chot = true;
    if(tr.chon === q.d){ if(!tr.goiY){ G.sen++; tr.sen = true; G.senO = G.senO || []; G.senO[i] = (G.senO[i] || 0) + 1; } }
    else G.sai.push({cd: q.cd, s: q.s, l: "tn"});
    luuG(); ve();
  },
  tiepTram: () => {
    G.buoc += 6;
    if(G.chang < SO - 1){ G.chang++; G.phan = "ngare"; G.nr = nrMoi(); G.tr = trMoi(); luuG(); ve("bando"); }
    else { G.chang = SO; G.tXong = Date.now(); luuG(); ve("dich"); }
  },
  xemLai: b => {
    const x = G.sai[+b.dataset.v]; if(!x) return;
    const q = DB.cd[x.cd][x.l].find(c => c.s === x.s); if(!q) return;
    moPhu(`<span class="chip">Chủ đề ${x.cd} · câu ${x.s} · ${esc(tenCd(x.cd))}</span><p style="font-size:1.15rem;font-weight:500">${esc(q.q)}</p>
      ${x.l === "ds" ? `<p><b>Đáp án: ${q.d === 1 ? "Đúng" : "Sai"}.</b></p>`
        : `<div class="pa">${q.p.map(([ma, nd]) => `<button type="button" class="${ma === q.d ? "dung" : ""}" disabled><span class="ma">${esc(ma)}</span><span style="flex:1">${esc(nd)}</span></button>`).join("")}</div>`}
      <p class="hop-giai">${esc(q.x)}</p>`);
  },
  tinhGio: () => {
    if(H.tBD && !confirm("Tính giờ lại từ đầu?")) return;
    H.tBD = Date.now(); luu(KH, H); veDongHoChieu();
  },
  hienQR: () => { moPhu(`<h2 class="tay" style="font-size:2rem;color:#163A30">Phòng ${esc(H.ma)}</h2><p>Nhóm quét mã hoặc mở địa chỉ dưới đây, nhập số nhóm.</p>
    <div class="qr" id="qr-phu" style="width:16rem;height:16rem;align-self:center"></div><p class="mo" style="font-size:.9rem;word-break:break-all;text-align:center">${esc(linkPhong())}</p>
    <button type="button" class="lienket" data-k="phongMoi" style="align-self:center">Mở phòng mới</button>`); veQR($("#qr-phu"), linkPhong()); },
  phongMoi: () => { if(!confirm(`Đóng phòng ${H.ma} trên máy chiếu và mở phòng mới?`)) return; dongPhu(); ve("chieuMo"); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if(!b || b.disabled) return;
  const f = HANH[b.dataset.k]; if(f){ e.preventDefault(); f(b); }
});

/* ============================================================
   VÀO GAME
   ============================================================ */
(function(){
  if(QS.get("may") === "chieu" && H){ moPhong(); return; }
  if(QS.get("may") === "chieu"){ ve("chieuMo"); return; }
  if(G && G.ds && G.ma) batMang();
  ve("dau");
})();
</script>
