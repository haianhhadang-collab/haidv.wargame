n lý bằng các biện pháp kinh tế và xã hội."],["C","Quản lý bằng Hiến pháp và pháp luật nói chung."],["D","Quản lý bằng các sắc lệnh ban hành khẩn cấp."],["E","Quản lý bằng sự ảnh hưởng và uy tín cá nhân của người lãnh đạo."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":6,"q":"Theo quan điểm \"Pháp quyền nhân nghĩa\" của Hồ Chí Minh, mục tiêu cao nhất mà sự nghiệp cách mạng của dân tộc Việt Nam hướng tới là gì?","g":"Tài liệu trực tiếp đề cập đến mục tiêu cao nhất của sự nghiệp cách mạng.","x":"Tài liệu khẳng định: \"mục tiêu giải phóng con người, làm cho mọi người có được cuộc sống hạnh phúc, tự do, xứng với phẩm giá con người, được hưởng dụng các quyền con người một cách đầy đủ nhất đã hòa quyện một cách hữu cơ và trở thành mục tiêu cao nhất của sự nghiệp cách mạng của dân tộc Việt Nam.\" Các phương án khác đều là những khía cạnh quan trọng nhưng không phải là mục tiêu tối thượng được nêu rõ.","p":[["A","Đấu tranh giành độc lập hoàn toàn và chủ quyền quốc gia."],["B","Xây dựng một Nhà nước có kỷ luật chặt chẽ và bộ máy hiệu quả."],["C","Giải phóng con người, làm cho mọi người có cuộc sống hạnh phúc, tự do, xứng với phẩm giá."],["D","Xóa bỏ mọi luật pháp hà khắc của chế độ cũ và thiết lập trật tự mới."],["E","Nâng cao dân trí và ý thức chấp hành pháp luật của toàn thể nhân dân."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":7,"q":"Cuộc Tổng tuyển cử ngày 6-1-1946, một sự kiện lịch sử trọng đại, đã được tiến hành với các đặc điểm nào để đảm bảo tính dân chủ và thể hiện quyền lực tối cao của nhân dân?","g":"Tài liệu cung cấp thông tin chi tiết về thể thức của cuộc Tổng tuyển cử.","x":"Tài liệu mô tả rõ: \"Cuộc Tổng tuyển cử được tiến hành thắng lợi ngày 6-1-1946 với chế độ phổ thông đầu phiếu, trực tiếp và bỏ phiếu kín.\" Đây là những đặc điểm cơ bản làm nên tính dân chủ, tiến bộ của cuộc bầu cử này, lần đầu tiên trong lịch sử Việt Nam và Đông Nam châu Á.","p":[["A","Bỏ phiếu công khai, trực tiếp, có sự giám sát của quân Đồng minh."],["B","Phổ thông đầu phiếu, gián tiếp và bỏ phiếu công khai."],["C","Phổ thông đầu phiếu, trực tiếp và bỏ phiếu kín."],["D","Bỏ phiếu theo đại diện của các giai cấp và tôn giáo lớn."],["E","Bỏ phiếu theo sự chỉ định của Chính phủ lâm thời."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Theo Hồ Chí Minh, \"bệnh gốc\" mà từ đó sinh ra các bệnh tham ô, lãng phí trong bộ máy nhà nước là gì?","g":"Tài liệu phân tích mối quan hệ giữa các loại tiêu cực trong bộ máy nhà nước.","x":"Tài liệu chỉ rõ: \"Thế là bệnh quan liêu đã ấp ủ, dung túng, che chở cho nạn tham ô, lãng phí. Vì vậy, đây là bệnh gốc sinh ra các bệnh tham ô lãng phí; muốn trừ sạch bệnh tham ô, lãng phí thì trước hết phải tẩy sạch bệnh quan liêu.\" Điều này nhấn mạnh vai trò trung tâm của bệnh quan liêu trong việc tạo điều kiện cho các tiêu cực khác phát triển.","p":[["A","Chủ nghĩa cá nhân."],["B","Đặc quyền, đặc lợi."],["C","Quan liêu."],["D","Tư túng, chia rẽ, kiêu ngạo."],["E","Trình độ dân trí chưa cao của người dân."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Nhận định nào sau đây KHÔNG ĐÚNG với quan điểm của Hồ Chí Minh về tính nhân văn của pháp luật trong Nhà nước pháp quyền nhân nghĩa?","g":"Tài liệu mô tả sâu sắc các đặc điểm của pháp luật nhân văn và khuyến thiện.","x":"Tài liệu nêu rõ rằng tính nhân văn của hệ thống luật pháp thể hiện ở việc \"tuyệt đối chống đối xử với con người một cách dã man.\" Thậm chí đối với những kẻ phản bội Tổ quốc, Hồ Chí Minh tuyên bố rõ: \"Chính phủ Việt Nam sẽ tha thứ hay trừng trị họ theo luật pháp tùy theo thái độ của họ hiện nay và về sau. Nhưng sẽ không có ai bị tàn sát\". Do đó, phương án E là sai hoàn toàn với tư tưởng Hồ Chí Minh.","p":[["A","Pháp luật có tính khuyến thiện, lấy mục đích giáo dục, cảm hóa, thức tỉnh con người làm căn bản."],["B","Pháp luật phải ghi nhận đầy đủ và bảo vệ các quyền con người một cách triệt để."],["C","Pháp luật phải có tính nghiêm minh nhưng đồng thời khách quan và công bằng, chống đối xử dã man với con người."],["D","Pháp luật dựa trên nền tảng đạo đức của xã hội và các giá trị đạo đức phải thấm sâu vào mọi quy định."],["E","Pháp luật cho phép áp dụng hình phạt tàn sát đối với những kẻ phản bội Tổ quốc để răn đe."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":10,"q":"Trong các biện pháp phòng, chống tiêu cực trong bộ máy nhà nước theo tư tưởng Hồ Chí Minh, biện pháp nào sau đây KHÔNG được coi là giải pháp căn bản và có ý nghĩa lâu dài?","g":"Tài liệu liệt kê và nhấn mạnh tầm quan trọng của các biện pháp phòng chống tiêu cực.","x":"Tài liệu khẳng định \"nâng cao trình độ dân chủ trong xã hội, thực hành dân chủ rộng rãi, phát huy quyền làm chủ của nhân dân là giải pháp căn bản và có ý nghĩa lâu dài.\" Tài liệu cũng chỉ rõ: \"phạt nghiêm minh, nghiêm khắc, đúng người đúng tội là cần thiết, song việc gì cũng xử phạt thì lại không đúng. Cần coi trọng giáo dục, lấy giáo dục, cảm hóa làm chủ yếu.\" Do đó, phương án C với sự nhấn mạnh chỉ xử phạt nặng mà không chú trọng giáo dục là không phù hợp với tư tưởng của Người.","p":[["A","Nâng cao trình độ dân chủ trong xã hội và thực hành dân chủ rộng rãi."],["B","Phát huy quyền làm chủ của nhân dân một cách triệt để."],["C","Chỉ tập trung xử phạt thật nặng, nghiêm minh mọi hành vi tiêu cực mà không cần chú trọng giáo dục."],["D","Pháp luật của Nhà nước và kỷ luật của Đảng phải hết sức nghiêm minh."],["E","Giáo dục đạo đức, xây dựng hệ chuẩn mực đạo đức cho người cầm quyền và khơi dậy lương tâm."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":11,"q":"Điều nào sau đây KHÔNG phải là một biểu hiện của bệnh quan liêu theo nhận định của Hồ Chí Minh?","g":"Tài liệu mô tả các biểu hiện của bệnh quan liêu.","x":"Tài liệu mô tả các biểu hiện của bệnh quan liêu bao gồm các ý A, B, C, E. Phương án D \"Cố ý vơ vét tiền của công, lợi dụng chức quyền để làm lợi riêng cho cá nhân\" là biểu hiện của \"đặc quyền, đặc lợi\" hoặc \"tham ô\" được đề cập ở tài liệu, không phải là biểu hiện trực tiếp của bệnh quan liêu, mặc dù bệnh quan liêu có thể tạo điều kiện cho tham ô, lãng phí phát triển.","p":[["A","Cán bộ lãnh đạo không sát công việc thực tế, không theo dõi và giáo dục cán bộ cấp dưới."],["B","Cơ quan lãnh đạo trọng hình thức, không xem xét khắp mọi mặt, không đi sâu từng vấn đề."],["C","Chỉ biết khai hội, viết chỉ thị, xem báo cáo trên giấy mà không kiểm tra đến nơi đến chốn."],["D","Cố ý vơ vét tiền của công, lợi dụng chức quyền để làm lợi riêng cho cá nhân."],["E","Cán bộ không gần gũi quần chúng, không nắm bắt được tâm tư, nguyện vọng của dân."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":12,"q":"Nội dung nào sau đây KHÔNG phản ánh đúng một trong những đóng góp của Hồ Chí Minh trong công tác lập pháp của Nhà nước Việt Nam Dân chủ Cộng hòa?","g":"Tài liệu liệt kê các hoạt động lập pháp và các sắc lệnh hình sự của Hồ Chí Minh.","x":"Tài liệu xác nhận các hoạt động lập pháp của Hồ Chí Minh như A, B, C, E. Tuy nhiên, Sắc lệnh ấn định hình phạt tội đưa và nhận hối lộ được ký vào ngày 27/11/1946, và Lệnh nói rõ tội tham ô, trộm cắp đến mức cao nhất là tử hình được ký vào ngày 26/1/1946. Việc này diễn ra sau Tuyên ngôn Độc lập một khoảng thời gian đáng kể, không phải \"chỉ vài ngày sau\".","p":[["A","Hai lần tham gia lãnh đạo soạn thảo Hiến pháp (Hiến pháp năm 1946 và Hiến pháp năm 1959)."],["B","Ký lệnh công bố 16 đạo luật trong bối cảnh đất nước vừa kháng chiến vừa kiến quốc."],["C","Ký lệnh công bố 613 sắc lệnh, trong đó có 243 sắc lệnh quy định về tổ chức Nhà nước và pháp luật."],["D","Ban hành ngay Sắc lệnh ấn định mức án tử hình cho tội tham ô, trộm cắp chỉ vài ngày sau Tuyên ngôn độc lập (2-9-1945)."],["E","Chú trọng xây dựng hệ thống luật pháp dân chủ, hiện đại từ những ngày đầu lập nước."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Hồ Chí Minh luôn nêu cao tính nghiêm minh của pháp luật. Người tuyên bố: “Pháp luật Việt Nam tuy khoan hồng với những người biết cải tà quy chính, nhưng sẽ thẳng tay trừng trị những tên Việt gian đầu sỏ đã ______.”","g":"Tài liệu là đoạn trích dẫn trực tiếp từ lời của Hồ Chí Minh.","x":"Tài liệu trích lời Hồ Chí Minh: \"Pháp luật Việt Nam tuy khoan hồng với những người biết cải tà quy chính, nhưng sẽ thẳng tay trừng trị những tên Việt gian đầu sỏ đã bán nước buôn dân\".","p":[["A","lạm quyền gây mất đoàn kết"],["B","bán nước buôn dân"],["C","tham ô lãng phí nghiêm trọng"],["D","cậy thế cậy quyền hách dịch"],["E","kiêu ngạo, quan cách mạng"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":18,"q":"Để đảm bảo tất cả mọi quyền lực thuộc về nhân dân, Hồ Chí Minh chỉ rõ: “dân ghét các ông chủ tịch, các ông ủy viên vì cái tật ngông nghênh, cậy thế, cậy quyền. Những ông này không hiểu nhiệm vụ và chính sách của Việt Minh, nên khi nắm được chút quyền trong tay vẫn hay ______.”","g":"Tài liệu là đoạn trích dẫn trực tiếp từ lời của Hồ Chí Minh.","x":"Tài liệu trích lời Hồ Chí Minh: \"dân ghét các ông chủ tịch, các ông ủy viên vì cái tật ngông nghênh, cậy thế, cậy quyền. Những ông này không hiểu nhiệm vụ và chính sách của Việt Minh, nên khi nắm được chút quyền trong tay vẫn hay lạm dụng\".","p":[["A","vi phạm kỷ luật của Đảng"],["B","làm việc kém hiệu quả"],["C","lãng phí công quỹ"],["D","lạm dụng"],["E","tư túng bè phái"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":19,"q":"Hồ Chí Minh khẳng định, Nhà nước là công bộc của dân, “mọi công tác phải dựa hẳn vào quần chúng, hoan nghênh quần chúng _______.”","g":"Tài liệu là đoạn trích dẫn trực tiếp từ lời của Hồ Chí Minh.","x":"Tài liệu trích lời Hồ Chí Minh: \"mọi công tác phải dựa hẳn vào quần chúng, hoan nghênh quần chúng đôn đốc và kiểm tra\".","p":[["A","góp ý xây dựng chính sách"],["B","làm chủ các cấp chính quyền"],["C","đôn đốc và kiểm tra"],["D","phê bình và biểu quyết"],["E","tham gia vào quản lý nhà nước"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":20,"q":"Theo Hồ Chí Minh, cán bộ các cơ quan, các đoàn thể, cấp cao thì quyền to, cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu ______ là có dịp đục khoét, có dịp ăn của đút, có dịp “dĩ công vi tư’’ (lấy của công làm của tư).","g":"Tài liệu là đoạn trích dẫn trực tiếp từ lời của Hồ Chí Minh.","x":"Tài liệu trích lời Hồ Chí Minh: \"cán bộ các cơ quan, các oàn thế, cấp cao thì quyền to, cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu lương tâm là có dịp đục khoét, có dịp ăn của đút, có dịp “dĩ công vi tư’’\".","p":[["A","kinh nghiệm công tác"],["B","trình độ chuyên môn"],["C","lương tâm"],["D","sự giám sát chặt chẽ"],["E","lòng trung thành tuyệt đối"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":23,"q":"Theo Tài liệu môn học, Hồ Chí Minh nêu rõ hai cách kiểm soát nào?","g":"Hai cách kiểm soát được Tài liệu môn học nêu ngay sau hai điều kiện để việc kiểm soát có kết quả tốt.","x":"Tài liệu môn học ghi: “Người còn nêu rõ hai cách kiểm soát là từ trên xuống và từ dưới lên. Người nhấn mạnh, phải ‘khéo kiểm soát’.” Các phương án còn lại không được Tài liệu môn học nêu là hai cách kiểm soát.","p":[["A","Từ trên xuống và từ dưới lên."],["B","Kiểm soát định kỳ và kiểm soát đột xuất."],["C","Kiểm soát trong Đảng và kiểm soát ngoài Đảng."],["D","Kiểm soát bằng văn bản và kiểm soát tại chỗ."],["E","Kiểm soát nội bộ và kiểm soát của các tổ chức quốc tế."]],"d":"A","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":24,"q":"Theo Tài liệu môn học, Sắc lệnh do Hồ Chí Minh ký ngày 27/11/1946 ấn định hình phạt đối với tội đưa và nhận hối lộ như thế nào?","g":"Hãy nhớ lại hai con số trong Sắc lệnh này: thời hạn tù và mức nộp phạt.","x":"Tài liệu môn học ghi: “Ngày 27/11/1946, Hồ Chí Minh đã ký Sắc lệnh ấn định hình phạt tội đưa và nhận hối lộ với mức từ 5 năm đến 20 năm tù khổ sai và phải nộp phạt gấp đôi số tiền nhận hối lộ.” Mức cao nhất là tử hình thuộc lệnh ngày 26/1/1946 về tội tham ô, trộm cắp, không phải Sắc lệnh về tội hối lộ.","p":[["A","Tử hình và tịch thu toàn bộ tài sản."],["B","Từ 1 năm đến 5 năm tù và hoàn trả số tiền nhận hối lộ."],["C","Cải tạo không giam giữ và bồi thường thiệt hại cho Nhà nước."],["D","Từ 10 năm đến 30 năm tù và nộp phạt gấp ba số tiền nhận hối lộ."],["E","Từ 5 năm đến 20 năm tù khổ sai và phải nộp phạt gấp đôi số tiền nhận hối lộ."]],"d":"E","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":25,"q":"Nhận định nào sau đây KHÔNG ĐÚNG với Tài liệu môn học về quá trình xây dựng Nhà nước hợp hiến, hợp pháp dưới sự lãnh đạo của Hồ Chí Minh?","g":"Hãy đối chiếu từng mốc thời gian và chức danh với đoạn Tài liệu môn học viết về Tổng tuyển cử và Quốc hội khóa I.","x":"Tài liệu môn học ghi: “Ngày 2/3/1946, Quốc hội khóa I nước Việt Nam Dân chủ Cộng hòa đã họp phiên đầu tiên, lập ra các tổ chức, bộ máy và các chức vụ chính thức của Nhà nước. Hồ Chí Minh được bầu làm Chủ tịch Chính phủ liên hiệp đầu tiên.” Hồ Chí Minh được bầu làm Chủ tịch Chính phủ liên hiệp, không phải Chủ tịch Quốc hội, nên phương án B không đúng.","p":[["A","Ngày 3/9/1945, trong phiên họp đầu tiên của Chính phủ lâm thời, Hồ Chí Minh đề nghị tổ chức càng sớm càng hay cuộc Tổng tuyển cử với chế độ phổ thông đầu phiếu."],["B","Tại phiên họp đầu tiên của Quốc hội khóa I (ngày 2/3/1946), Hồ Chí Minh được bầu làm Chủ tịch Quốc hội."],["C","Việc lập nên Quốc hội, Chính phủ và các cơ quan, bộ máy hợp hiến giúp nước ta có cơ sở pháp lý vững chắc để làm việc với quân Đồng minh và có quan hệ quốc tế bình đẳng."],["D","Trong cuộc Tổng tuyển cử, mọi người dân từ 18 tuổi trở lên, không phân biệt nam nữ, giàu nghèo, dân tộc, đảng phái, tôn giáo đều có quyền bỏ phiếu."],["E","Chính phủ liên hiệp đầu tiên có đầy đủ tư cách pháp lý để giải quyết một cách có hiệu quả những vấn đề đối nội và đối ngoại."]],"d":"B","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":26,"q":"Nhận định nào sau đây KHÔNG ĐÚNG với quan điểm của Hồ Chí Minh về kiểm soát quyền lực nhà nước được trình bày trong Tài liệu môn học?","g":"Hãy nhớ lại Tài liệu môn học nói những ai nắm giữ quyền lực và ai có thể trở nên lạm quyền.","x":"Tài liệu môn học ghi: “Các cơ quan nhà nước, cán bộ nhà nước, dù ít hay nhiều đều nắm giữ quyền lực trong tay. Quyền lực này là do nhân dân ủy thác cho. Tuy nhiên, một khi đã nắm giữ quyền lực, cơ quan nhà nước hay cán bộ nhà nước đều có thể trở nên lạm quyền.” Vì vậy, không thể chỉ kiểm soát cán bộ cấp cao; phương án A không đúng.","p":[["A","Chỉ cán bộ giữ chức vụ cao mới có thể lạm quyền, vì vậy chỉ cần kiểm soát quyền lực ở cấp cao."],["B","Kiểm soát quyền lực nhà nước là tất yếu."],["C","Quyền lực mà cơ quan nhà nước, cán bộ nhà nước nắm giữ là do nhân dân ủy thác cho."],["D","Đảng cầm quyền cần chú ý phát huy vai trò kiểm soát quyền lực của nhân dân, bởi so với số nhân dân thì số đảng viên chỉ là tối thiểu."],["E","Hiến pháp năm 1946 quy định: “Bộ trưởng nào không được Nghị viện tín nhiệm thì phải từ chức”."]],"d":"A","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":29,"q":"Trong thư gửi Hội nghị Tư pháp toàn quốc, Hồ Chí Minh viết: “Các bạn là những người phụ trách thi hành pháp luật. Lẽ tất nhiên các bạn cần phải nêu cao cái gương _______ cho nhân dân noi theo”.","g":"Hãy chú ý: bức thư gửi những người phụ trách thi hành pháp luật, nên tấm gương cần nêu gắn trực tiếp với việc công và pháp luật.","x":"Tài liệu môn học ghi: “Các bạn là những người phụ trách thi hành pháp luật. Lẽ tất nhiên các bạn cần phải nêu cao cái gương ‘phụng công, thủ pháp, chí công vô tư’ cho nhân dân noi theo”.","p":[["A","cần, kiệm, liêm, chính"],["B","trung với nước, hiếu với dân"],["C","dám nói, dám làm"],["D","nói đi đôi với làm"],["E","phụng công, thủ pháp, chí công vô tư"]],"d":"E","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Theo Tài liệu môn học, một trong những biện pháp cơ bản phòng, chống tiêu cực trong Nhà nước theo tư tưởng Hồ Chí Minh là phải huy động sức mạnh của _______ vào cuộc chiến chống lại tiêu cực trong con người, trong xã hội và trong bộ máy nhà nước.","g":"Hãy nhớ lại biện pháp thứ năm mà Tài liệu môn học nêu, gắn với trách nhiệm tu dưỡng và thực hành đạo đức cách mạng của mọi người Việt Nam.","x":"Tài liệu môn học ghi: “Năm là, phải huy động sức mạnh của chủ nghĩa yêu nước vào cuộc chiến chống lại tiêu cực trong con người, trong xã hội và trong bộ máy nhà nước.”","p":[["A","chủ nghĩa yêu nước"],["B","các lực lượng vũ trang"],["C","dư luận quốc tế"],["D","chủ nghĩa quốc tế vô sản"],["E","hệ thống thanh tra chuyên trách"]],"d":"A","k":"Chọn cụm từ điền vào chỗ trống"}]},"11":{"ten":"Đại đoàn kết: vai trò, lực lượng","ds":[{"s":1,"q":"Chính sách và phương pháp tập hợp đại đoàn kết luôn phải được giữ nguyên không thay đổi trong mọi giai đoạn cách mạng để đảm bảo tính nhất quán của chiến lược đại đoàn kết toàn dân tộc.","g":"Xem xét sự linh hoạt của chính sách và phương pháp trong các giai đoạn cách mạng khác nhau được đề cập trong tài liệu.","x":"Tài liệu chỉ rõ: \"Trong mỗi giai đoạn cách mạng, trước những yêu cầu và nhiệm vụ khác nhau, chính sách và phương pháp tập hợp đại đoàn kết có thể và cần thiết phải điều chỉnh cho phù hợp với từng đối tượng khác nhau song không bao giờ được thay đổi chủ trương đại đoàn kết toàn dân tộc\". Điều này khẳng định chính sách và phương pháp có thể điều chỉnh, trái ngược với nhận định trong câu hỏi.","d":0},{"s":2,"q":"Khái niệm \"Nhân dân\" trong tư tưởng Hồ Chí Minh chỉ đề cập đến tập hợp đông đảo quần chúng nhân dân mà không bao gồm những con người Việt Nam cụ thể.","g":"Tài liệu định nghĩa \"Nhân dân\" trong tư tưởng Hồ Chí Minh.","x":"Tài liệu ghi rõ: \"“Nhân dân” trong tư tưởng Hồ Chí Minh được hiểu với nghĩa vừa là con người Việt Nam cụ thể, vừa là một tập hợp đông đảo quần chúng nhân dân, cả hai đều là chủ thể của khối đại đoàn kết toàn dân tộc\".","d":0},{"s":3,"q":"Theo Hồ Chí Minh, nền tảng của khối đại đoàn kết toàn dân tộc chỉ bao gồm công nhân và nông dân, bởi đây là lực lượng đại đa số và là gốc rễ của cách mạng.","g":"Tài liệu liệt kê cụ thể các lực lượng cấu thành nền tảng của đại đoàn kết.","x":"Tài liệu chỉ rõ: \"lực lượng làm nền tảng cho khối đại đoàn kết dân tộc theo quan điểm của Hồ Chí Minh là công nhân, nông dân và trí thức.\"","d":0},{"s":4,"q":"Việc xác định đại đoàn kết toàn dân tộc là nhiệm vụ hàng đầu của Đảng chỉ cần quán triệt trong các đường lối, chủ trương chiến lược mà không nhất thiết phải trong hoạt động thực tiễn của Đảng.","g":"Tài liệu nói về sự quán triệt nhiệm vụ hàng đầu trong các lĩnh vực của Đảng.","x":"Tài liệu khẳng định: \"Đại đoàn kết toàn dân tộc phải được xác định là nhiệm vụ hàng đầu của Đảng và nhiệm vụ này phải được quán triệt trong tất cả mọi lĩnh vực, từ đường lối, chủ trương, chính sách, tới hoạt động thực tiễn của Đảng.\"","d":0},{"s":5,"q":"Các luận điểm của Hồ Chí Minh như \"Đoàn kết là sức mạnh của chúng ta\" chủ yếu nhằm kêu gọi tinh thần đoàn kết mà không mang tính chân lý khái quát từ thực tiễn.","g":"Tài liệu mô tả bản chất của các luận điểm về đại đoàn kết của Hồ Chí Minh.","x":"Tài liệu nêu: \"Từ thực tiễn xây dựng khối đại đoàn kết toàn dân tộc, Hồ Chí Minh đã khái quát thành nhiều luận điểm mang tính chân lý về vai trò và sức mạnh của khối đại đoàn kết toàn dân tộc\".","d":0},{"s":6,"q":"Sự đoàn kết và thống nhất trong Đảng là yếu tố quan trọng nhưng không phải là điều kiện tiên quyết cho sự đoàn kết ngoài xã hội.","g":"Tài liệu nhấn mạnh vai trò của sự đoàn kết trong Đảng đối với đại đoàn kết toàn dân tộc.","x":"Tài liệu nhấn mạnh: \"Trong khối đại đoàn kết toàn dân tộc, phải đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong Đảng vì đó là điều kiện cho sự đoàn kết ngoài xã hội.\"","d":0},{"s":31,"q":"Theo Hồ Chí Minh, lịch sử dân tộc cho thấy việc nhân dân đoàn kết hay không đoàn kết gắn trực tiếp với vận mệnh đất nước: hoặc được độc lập, tự do, hoặc bị nước ngoài xâm lấn.","g":"Tài liệu môn học dẫn một bài học lịch sử của Hồ Chí Minh khi luận giải ý nghĩa chiến lược của đại đoàn kết.","x":"Tài liệu môn học dẫn lời Hồ Chí Minh: “Sử dạy cho ta bài học này: Lúc nào dân ta đoàn kết muôn người như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn”. Vì vậy, đại đoàn kết là “vấn đề mang tính sống còn của dân tộc Việt Nam”.","d":1},{"s":32,"q":"Khi gọi đoàn kết là “điểm mẹ”, Hồ Chí Minh nhấn mạnh rằng đoàn kết là điểm gốc: thực hiện tốt đoàn kết thì sẽ sinh ra những kết quả tốt đẹp khác.","g":"Xem các luận điểm Hồ Chí Minh khái quát về vai trò và sức mạnh của khối đại đoàn kết trong Tài liệu môn học.","x":"Tài liệu môn học dẫn lời Hồ Chí Minh: “Bây giờ còn một điểm rất quan trọng, cũng là điểm mẹ. Điểm này mà thực hiện tốt thì đẻ ra con cháu đều tốt: Đó là đoàn kết”.","d":1},{"s":33,"q":"Đại đoàn kết không chỉ là yêu cầu của sự nghiệp cách mạng mà còn là đòi hỏi của chính quần chúng nhân dân, vì thiếu đoàn kết thì họ sẽ thất bại trong cuộc đấu tranh vì lợi ích của mình.","g":"Tài liệu môn học lý giải vì sao đại đoàn kết là đòi hỏi khách quan khi bàn về mục tiêu, nhiệm vụ hàng đầu của cách mạng.","x":"Tài liệu môn học viết: “Đại đoàn kết là yêu cầu khách quan của sự nghiệp cách mạng và là đòi hỏi khách quan của quần chúng nhân dân trong cuộc đấu tranh tự giải phóng bởi nếu không đoàn kết thì chính họ sẽ thất bại trong cuộc đấu tranh vì lợi ích của chính mình”.","d":1},{"s":34,"q":"Theo Hồ Chí Minh, khối đại đoàn kết toàn dân tộc tập hợp mọi người dân Việt Nam, kể cả người ở ngoài nước, miễn là cùng hướng vào mục tiêu chung và có lòng phụng sự Tổ quốc, phục vụ nhân dân.","g":"Đối chiếu với phần Tài liệu môn học bàn về chủ thể của khối đại đoàn kết toàn dân tộc.","x":"Tài liệu môn học nêu: đại đoàn kết toàn dân tộc là “tập hợp, đoàn kết được tất cả mọi người dân vào một khối thống nhất, không phân biệt dân tộc, giai cấp, tầng lớp, đảng phái, tôn giáo, lứa tuổi, giới tính, nghề nghiệp, ở trong nước hay ở ngoài nước cùng hướng vào mục tiêu chung”; Hồ Chí Minh chỉ rõ: “ai có tài, có đức, có sức, có lòng phụng sự Tổ quốc và phục vụ nhân dân thì ta đoàn kết với họ”.","d":1},{"s":35,"q":"Theo Hồ Chí Minh, tập hợp lực lượng rộng rãi, không bỏ sót lực lượng nào, phải đi đôi với việc đứng vững trên lập trường giai cấp công nhân và giải quyết hài hòa quan hệ giữa giai cấp với dân tộc.","g":"Tài liệu môn học nêu yêu cầu về lập trường khi xây dựng khối đại đoàn kết toàn dân tộc.","x":"Tài liệu môn học viết: “Hồ Chí Minh còn chỉ rõ, trong quá trình xây dựng khối đại đoàn kết toàn dân tộc, phải đứng vững trên lập trường giai cấp công nhân, giải quyết hài hòa mối quan hệ giữa giai cấp, dân tộc để tập hợp lực lượng, không bỏ sót một lực lượng nào miễn là họ có lòng trung thành và sẵn sàng phục vụ Tổ quốc, không phản bội lại quyền lợi của nhân dân”.","d":1},{"s":36,"q":"Theo Hồ Chí Minh, đoàn kết công nhân, nông dân và các tầng lớp nhân dân lao động khác là xây dựng “nền gốc”; có nền gốc rồi, khối đại đoàn kết còn phải mở rộng tới các tầng lớp nhân dân khác.","g":"Xem hình ảnh so sánh mà Hồ Chí Minh dùng khi bàn về nền tảng của khối đại đoàn kết trong Tài liệu môn học.","x":"Tài liệu môn học dẫn lời Hồ Chí Minh: đại đa số nhân dân là “công nhân, nông dân và các tầng lớp nhân dân lao động khác. Đó là nền gốc của đại đoàn kết. Nó cũng như cái nền của nhà, gốc của cây. Nhưng đã có nền vững, gốc tốt, còn phải đoàn kết các tầng lớp nhân dân khác”.","d":1}],"tn":[{"s":7,"q":"Điểm nào sau đây thể hiện rõ nhất tính linh hoạt nhưng kiên định trong chiến lược đại đoàn kết toàn dân tộc của Hồ Chí Minh?","g":"Tài liệu phân tích về sự điều chỉnh và bất biến trong chiến lược đại đoàn kết toàn dân tộc.","x":"Tài liệu chỉ rõ: \"Trong mỗi giai đoạn cách mạng, trước những yêu cầu và nhiệm vụ khác nhau, chính sách và phương pháp tập hợp đại đoàn kết có thể và cần thiết phải điều chỉnh cho phù hợp với từng đối tượng khác nhau song không bao giờ được thay đổi chủ trương đại đoàn kết toàn dân tộc\".","p":[["A","Chính sách và phương pháp tập hợp luôn giữ nguyên để đảm bảo tính nhất quán."],["B","Chủ trương đại đoàn kết có thể điều chỉnh theo từng đối tượng và giai đoạn."],["C","Chỉ điều chỉnh chính sách và phương pháp khi có sự thay đổi lớn về mục tiêu cách mạng."],["D","Chính sách và phương pháp có thể điều chỉnh phù hợp với từng đối tượng và giai đoạn, nhưng chủ trương đại đoàn kết không thay đổi."],["E","Tính linh hoạt không phải là đặc điểm cốt lõi của chiến lược đại đoàn kết."]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Luận điểm nào sau đây được Hồ Chí Minh đúc kết mang tính chân lý về vai trò của đại đoàn kết toàn dân tộc, được coi là kết luận tối cao của Người?","g":"Tài liệu liệt kê các luận điểm mang tính chân lý và kết luận cuối cùng của Hồ Chí Minh.","x":"Tài liệu kết luận: “Đoàn kết. đoàn kết, đại đoàn kết Thành công, thành công, đại thành công”7. Các phương án khác không phải là nguyên văn hoặc đúc kết trực tiếp từ tài liệu.","p":[["A","\"Đoàn kết là khởi đầu của mọi thành công\"."],["B","\"Đoàn kết. đoàn kết, đại đoàn kết Thành công, thành công, đại thành công\"."],["C","\"Đoàn kết là cơ sở để phát triển\"."],["D","\"Đoàn kết là nền tảng của tự do\"."],["E","\"Đoàn kết là con đường duy nhất dẫn đến thắng lợi\"."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Từ \"ta\" trong câu nói của Hồ Chí Minh: \"ai có tài, có đức, có sức, có lòng phụng sự Tổ quốc và phục vụ nhân dân thì ta đoàn kết với họ\" được hiểu theo nghĩa rộng nhất là:","g":"Tài liệu giải thích về chủ thể của \"ta\" trong tư tưởng Hồ Chí Minh.","x":"Tài liệu giải thích: \"Từ “ta” ở đây là chủ thể, vừa là Đảng Cộng sản Việt Nam nói riêng, vừa là mọi người dân Việt Nam nói chung.\"","p":[["A","Chỉ Đảng Cộng sản Việt Nam."],["B","Chỉ các tầng lớp lao động."],["C","Chỉ những người Việt Nam ở trong nước."],["D","Đảng Cộng sản Việt Nam nói riêng và mọi người dân Việt Nam nói chung."],["E","Chỉ những người có vai trò lãnh đạo."]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":10,"q":"Nhiệm vụ cốt lõi của Đảng Cộng sản Việt Nam trong việc xây dựng khối đại đoàn kết toàn dân tộc, xuất phát từ yêu cầu khách quan của quần chúng, là gì?","g":"Tài liệu nói về sứ mệnh của Đảng trong mối quan hệ với quần chúng và đại đoàn kết.","x":"Tài liệu chỉ rõ: \"Đảng Cộng sản phải có sứ mệnh thức tỉnh, tập hợp, hướng dẫn quần chúng, chuyển những nhu cầu, những đòi hỏi tự giác, thành hiện thực có tổ chức trong khối đại đoàn kết, tạo thành sức mạnh tổng hợp trong cuộc đấu tranh\".","p":[["A","Đơn thuần ban hành các chủ trương, chính sách đoàn kết."],["B","Đợi chờ quần chúng tự giác tập hợp thành khối thống nhất."],["C","Thức tỉnh, tập hợp, hướng dẫn quần chúng, chuyển những đòi hỏi tự giác thành hiện thực có tổ chức."],["D","Tách rời các nhu cầu cá nhân của quần chúng khỏi mục tiêu chung của cách mạng."],["E","Chỉ tập trung vào việc củng cố sự đoàn kết nội bộ Đảng."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":11,"q":"Bài học lịch sử nào được Hồ Chí Minh rút ra để khẳng định vai trò sống còn của đại đoàn kết toàn dân tộc đối với độc lập, tự do của đất nước?","g":"Tài liệu trích dẫn nguyên văn lời của Hồ Chí Minh về bài học lịch sử.","x":"Tài liệu trích lời Hồ Chí Minh: “Sử dạy cho ta bài học này: Lúc nào dân ta đoàn kết muôn đời như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn”.","p":[["A","\"Dân ta anh hùng, bất khuất thì nước ta hùng cường.\""],["B","\"Lúc nào dân ta đoàn kết muôn đời như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn.\""],["C","\"Ý chí của dân là sức mạnh của nước.\""],["D","\"Độc lập, tự do là mục tiêu tối thượng của đoàn kết.\""],["E","\"Lịch sử chứng minh rằng không có đoàn kết, không có cách mạng.\""]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":12,"q":"Mối quan hệ giữa sự đoàn kết trong Đảng và sự đoàn kết toàn dân tộc được Hồ Chí Minh lý giải như thế nào?","g":"Tài liệu nói về yếu tố \"hạt nhân\" và điều kiện của đại đoàn kết.","x":"Tài liệu khẳng định: \"Trong khối đại đoàn kết toàn dân tộc, phải đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong Đảng vì đó là điều kiện cho sự đoàn kết ngoài xã hội.\"","p":[["A","Sự đoàn kết trong Đảng là điều kiện cần nhưng không đủ cho sự đoàn kết toàn dân tộc."],["B","Sự đoàn kết trong Đảng chỉ là một trong nhiều yếu tố thúc đẩy đoàn kết toàn dân tộc."],["C","Sự đoàn kết trong Đảng là yếu tố \"hạt nhân\", là điều kiện cho sự đoàn kết ngoài xã hội."],["D","Sự đoàn kết toàn dân tộc sẽ tự hình thành nếu có sự lãnh đạo đúng đắn của Đảng, không phụ thuộc vào sự đoàn kết nội bộ."],["E","Hai yếu tố này song song tồn tại mà không có mối liên hệ nhân quả trực tiếp."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":13,"q":"Phát biểu nào sau đây không đúng về chiến lược đại đoàn kết toàn dân tộc trong tư tưởng Hồ Chí Minh?","g":"Tài liệu mô tả các đặc điểm của chiến lược đại đoàn kết.","x":"Tài liệu khẳng định: \"chiến lược này được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\" Do đó, nhận định chỉ duy trì trong một giai đoạn là sai.","p":[["A","Là chiến lược lâu dài, nhất quán của cách mạng Việt Nam."],["B","Mang tính sống còn của dân tộc Việt Nam."],["C","Chỉ được duy trì trong cách mạng dân tộc dân chủ nhân dân, không áp dụng cho cách mạng xã hội chủ nghĩa."],["D","Nhân tố quyết định sự thành bại của cách mạng."],["E","Chính sách và phương pháp có thể điều chỉnh phù hợp với từng đối tượng và giai đoạn."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":14,"q":"Theo tư tưởng Hồ Chí Minh, chủ thể của khối đại đoàn kết toàn dân tộc không bao gồm nhóm đối tượng nào sau đây?","g":"Tài liệu mô tả tiêu chí tập hợp lực lượng của khối đại đoàn kết.","x":"Tài liệu nêu tiêu chí \"ai có tài, có đức, có sức, có lòng phụng sự Tổ quốc và phục vụ nhân dân thì ta đoàn kết với họ\". Tài liệu bổ sung \"miễn là họ có lòng trung thành và sẵn sàng phục vụ Tổ quốc, không phản bội lại quyền lợi của nhân dân\". Do đó, \"không sẵn sàng phục vụ nhân dân\" là không phù hợp với tiêu chí đoàn kết.","p":[["A","Tất cả những người Việt Nam yêu nước ở các giai cấp, các tầng lớp trong xã hội."],["B","Đồng bào các tôn giáo, các đảng phái."],["C","Những người Việt Nam có lòng trung thành với Tổ quốc nhưng không sẵn sàng phục vụ nhân dân."],["D","Mọi người dân vào một khối thống nhất, không phân biệt dân tộc, giai cấp, tầng lớp, giới tính, nghề nghiệp."],["E","Cả những người Việt Nam ở trong nước hay ở ngoài nước cùng hướng vào mục tiêu chung."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":15,"q":"Nhận định nào sau đây không đúng khi nói về đại đoàn kết toàn dân tộc là một mục tiêu, nhiệm vụ hàng đầu của cách mạng Việt Nam?","g":"Tài liệu nói về đại đoàn kết là mục tiêu, nhiệm vụ và vai trò của Đảng.","x":"Tài liệu nêu rõ: \"Đại đoàn kết là yêu cầu khách quan của sự nghiệp cách mạng và là đòi hỏi khách quan của quần chúng nhân dân trong cuộc đấu tranh tự giải phóng... Đảng Cộng sản phải có sứ mệnh thức tỉnh, tập hợp, hướng dẫn quần chúng\". Điều này bác bỏ ý \"không cần vai trò thức tỉnh, tập hợp của Đảng\".","p":[["A","Đại đoàn kết không chỉ là khẩu hiệu chiến lược mà còn là mục tiêu lâu dài của cách mạng."],["B","Là nhiệm vụ hàng đầu của Đảng, quán triệt trong đường lối, chủ trương, chính sách và hoạt động thực tiễn."],["C","Mục đích của Đảng Lao động Việt Nam được tóm gọn trong 8 chữ: \"ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC\"."],["D","Đại đoàn kết là yêu cầu tự phát từ quần chúng mà không cần vai trò thức tỉnh, tập hợp của Đảng."],["E","Đại đoàn kết là đòi hỏi khách quan của quần chúng nhân dân trong cuộc đấu tranh tự giải phóng."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":16,"q":"Câu nói nào dưới đây không phải là luận điểm mang tính chân lý của Hồ Chí Minh về vai trò và sức mạnh của khối đại đoàn kết toàn dân tộc được trích dẫn trong tài liệu?","g":"Tài liệu liệt kê chính xác các câu nói của Hồ Chí Minh.","x":"Tài liệu liệt kê các câu: \"Đoàn kết là sức mạnh của chúng ta\", \"Đoàn kết là một lực lượng vô địch của chúng ta để khắc phục khó khăn, giành lấy thắng lợi\", \"Đoàn kết là sức mạnh, đoàn kết là thắng lợi\", \"Đoàn kết là sức mạnh, là then chốt của thành công\", \"Bây giờ còn một điểm rất quan trọng, cũng là điểm mẹ... Đó là đoàn kết\". Phương án D có thêm cụm \"là ngọn cờ dẫn lối thắng lợi\" không có trong tài liệu.","p":[["A","\"Đoàn kết là sức mạnh của chúng ta\"."],["B","\"Đoàn kết là một lực lượng vô địch của chúng ta để khắc phục khó khăn, giành lấy thắng lợi\"."],["C","\"Đoàn kết là sức mạnh, đoàn kết là thắng lợi\"."],["D","\"Đoàn kết là then chốt của thành công, là ngọn cờ dẫn lối thắng lợi.\""],["E","\"Bây giờ còn một điểm rất quan trọng, cũng là điểm mẹ... Đó là đoàn kết\"."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Để xây dựng khối đại đoàn kết toàn dân tộc vững chắc, cần phải thực hiện điều nào sau đây là không phù hợp với tư tưởng Hồ Chí Minh?","g":"Tài liệu nói về nền tảng và cách thức xây dựng nền tảng của đại đoàn kết.","x":"Tài liệu nhấn mạnh: \"Đại đoàn kết tức là trước hết phải đoàn kết đại đa số nhân dân, mà đại đa số nhân dân là công nhân, nông dân và các tầng lớp nhân dân lao động khác. Đó là nền gốc của đại đoàn kết\". Việc \"ưu tiên đoàn kết các tầng lớp trí thức và đảng phái trước\" là đi ngược lại nguyên tắc \"trước hết phải đoàn kết đại đa số nhân dân\".","p":[["A","Xác định rõ nền tảng của khối đoàn kết là công nhân, nông dân và trí thức."],["B","Trước hết phải đoàn kết đại đa số nhân dân."],["C","Củng cố vững chắc nền tảng là công nhân, nông dân và trí thức để mở rộng khối đại đoàn kết."],["D","Ưu tiên đoàn kết các tầng lớp trí thức và đảng phái trước khi tập hợp quần chúng lao động."],["E","Xem công nhân, nông dân và các tầng lớp nhân dân lao động khác là nền gốc của đại đoàn kết."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":18,"q":"Khi xây dựng khối đại đoàn kết toàn dân tộc, Hồ Chí Minh chỉ rõ Đảng Cộng sản Việt Nam cần đứng vững trên lập trường nào để tập hợp lực lượng một cách toàn diện?","g":"Tài liệu nói về lập trường cần đứng vững khi xây dựng đại đoàn kết.","x":"Tài liệu ghi rõ: \"Hồ Chí Minh còn chỉ rõ, trong quá trình xây dựng khối đại đoàn kết toàn dân tộc, phải đứng vững trên lập trường giai cấp công nhân, giải quyết hài hòa mối quan hệ giữa giai cấp, dân tộc để tập hợp lực lượng\".","p":[["A","Lập trường dân tộc thuần túy, ưu tiên lợi ích dân tộc trên hết."],["B","Lập trường giai cấp công nhân, giải quyết hài hòa mối quan hệ giữa giai cấp và dân tộc."],["C","Lập trường quốc tế vô sản, bỏ qua các yếu tố giai cấp trong nước."],["D","Lập trường tôn giáo, nhằm thu hút sự ủng hộ của các tín đồ."],["E","Lập trường trung lập, không đứng về bất kỳ giai cấp nào."]],"d":"B","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":25,"q":"Hồ Chí Minh khẳng định: \"Sử dạy cho ta bài học này: Lúc nào dân ta _______ muôn người như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn\".","g":"Tài liệu trích dẫn bài học lịch sử của Hồ Chí Minh.","x":"Tài liệu ghi rõ: “Sử dạy cho ta bài học này: Lúc nào dân ta đoàn kết muôn người như một thì nước ta độc lập, tự do. Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn”.","p":[["A","thương yêu"],["B","tin tưởng"],["C","đoàn kết"],["D","giúp đỡ"],["E","đồng lòng"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":26,"q":"\"Đại đoàn kết toàn dân tộc là vấn đề mang tính _______ của dân tộc Việt Nam nên chiến lược này được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\"","g":"Tài liệu nói về tầm quan trọng của chiến lược đại đoàn kết.","x":"Tài liệu nêu: \"Đại đoàn kết toàn dân tộc là vấn đề mang tính sống còn của dân tộc Việt Nam nên chiến lược này được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\"","p":[["A","chiến lược"],["B","cốt lõi"],["C","sống còn"],["D","cấp thiết"],["E","cơ bản"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":27,"q":"Mục đích của Đảng Lao động Việt Nam, theo tuyên bố của Hồ Chí Minh vào ngày 3/3/1951, có thể gồm trong 8 chữ là: \"ĐOÀN KẾT TOÀN DÂN, _______ TỔ QUỐC\".","g":"Tài liệu trích dẫn tuyên bố của Hồ Chí Minh về mục đích của Đảng.","x":"Tài liệu trích lời Hồ Chí Minh: “Mục đích của Đảng Lao động Việt Nam có thể gồm trong 8 chữ là: ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC”.","p":[["A","XÂY DỰNG"],["B","PHỤNG SỰ"],["C","BẢO VỆ"],["D","KIẾN THIẾT"],["E","CỨU NƯỚC"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":28,"q":"\"Đại đoàn kết tức là trước hết phải đoàn kết đại đa số nhân dân, mà đại đa số nhân dân là công nhân, nông dân và các tầng lớp nhân dân lao động khác. Đó là _______ của đại đoàn kết.\"","g":"Tài liệu xác định nền tảng của khối đại đoàn kết.","x":"Tài liệu khẳng định: \"Đó là nền gốc của đại đoàn kết. Nó cũng như cái nền của nhà, gốc của cây.\"","p":[["A","mục tiêu"],["B","phương hướng"],["C","nguyên tắc"],["D","nền gốc"],["E","then chốt"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":29,"q":"Lực lượng làm nền tảng cho khối đại đoàn kết dân tộc theo quan điểm của Hồ Chí Minh bao gồm công nhân, nông dân và _______.","g":"Tài liệu liệt kê các thành phần của nền tảng đại đoàn kết.","x":"Tài liệu nêu: \"lực lượng làm nền tảng cho khối đại đoàn kết dân tộc theo quan điểm của Hồ Chí Minh là công nhân, nông dân và trí thức.\"","p":[["A","tiểu thương"],["B","trí thức"],["C","binh lính"],["D","phú nông"],["E","địa chủ"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Trong khối đại đoàn kết toàn dân tộc, cần đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong _______ vì đó là điều kiện cho sự đoàn kết ngoài xã hội.","g":"Tài liệu nhấn mạnh yếu tố hạt nhân của đại đoàn kết.","x":"Tài liệu khẳng định: \"Trong khối đại đoàn kết toàn dân tộc, phải đặc biệt chú trọng yếu tố “hạt nhân” là sự đoàn kết và thống nhất trong Đảng vì đó là điều kiện cho sự đoàn kết ngoài xã hội.\"","p":[["A","Chính phủ"],["B","Mặt trận"],["C","Quân đội"],["D","Đảng"],["E","Quốc hội"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"}]},"12":{"ten":"Đại đoàn kết: điều kiện, hình thức","ds":[{"s":1,"q":"Nguyên tắc \"Đoàn kết thực sự nghĩa là vừa đoàn kết, vừa đấu tranh, học những cái tốt của nhau, phê bình những cái sai của nhau\" được Hồ Chí Minh nhấn mạnh chỉ áp dụng trong phạm vi các tổ chức có lợi ích tương đồng cao, không dành cho những thành phần còn tồn tại sự khác biệt lớn về quan điểm hoặc lợi ích.","g":"Xem xét toàn diện ý nghĩa của \"đoàn kết thực sự\" và nguyên tắc \"cầu đồng tồn dị\" trong bối cảnh xây dựng Mặt trận dân tộc thống nhất.","x":"Theo Hồ Chí Minh, đoàn kết thực sự không chỉ là sự đồng thuận mà còn bao hàm cả \"đấu tranh, học những cái tốt của nhau, phê bình những cái sai của nhau\" và \"phê bình trên lập trường thân ái, vì nước, vì dân\". Nguyên tắc \"cầu đồng tồn dị\" cũng khẳng định sự cần thiết phải tìm điểm chung để hạn chế cái riêng, cái khác biệt, cho thấy sự đoàn kết này áp dụng rộng rãi ngay cả khi có những điểm khác biệt, chứ không chỉ giới hạn ở các tổ chức có lợi ích tương đồng cao. Mục đích là để \"tạo nên sự đoàn kết gắn bó chặt chẽ, lâu dài tạo tiền đề mở rộng khối đại đoàn kết trong mặt trận dân tộc thống nhất\".","d":0},{"s":2,"q":"Theo tư tưởng Hồ Chí Minh, niềm tin vào nhân dân là một điều kiện độc lập để xây dựng khối đại đoàn kết, không liên quan trực tiếp đến truyền thống dân tộc \"Nước lấy dân làm gốc\" hay nguyên lý Mácxít \"Cách mạng là sự nghiệp của quần chúng\".","g":"Đọc kỹ phần trình bày về điều kiện \"niềm tin vào nhân dân\" để hiểu rõ nguồn gốc và ý nghĩa của nguyên tắc này.","x":"Văn bản chỉ rõ: \"Nguyên tắc này [niềm tin vào nhân dân] vừa là sự tiếp nối truyền thống dân tộc “Nước lấy dân làm gốc”. “Chở thuyền và lật thuyền cũng là dân”, đồng thời là sự quán triệt sâu sắc nguyên lý mácxít \"Cách mạng là sự nghiệp của quần chúng”\". Như vậy, niềm tin vào nhân dân được coi là sự kết hợp và tiếp nối của cả truyền thống dân tộc và nguyên lý Mácxít, chứ không phải là một nguyên tắc độc lập hoàn toàn.","d":0},{"s":3,"q":"Mục đích chung của Mặt trận dân tộc thống nhất, dù tên gọi có khác nhau qua các thời kỳ, luôn chỉ tập trung vào độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân, không bao gồm mục tiêu giải phóng giai cấp.","g":"Xem xét mục tiêu chung của Mặt trận dưới sự lãnh đạo của Đảng và sự phát triển của mục tiêu cách mạng.","x":"Mặc dù mục tiêu chung được xác định là \"độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân\", nhưng văn bản cũng khẳng định Đảng lãnh đạo Mặt trận hoàn thành nhiệm vụ \"đấu tranh giải phóng dân tộc và giải phóng giai cấp, kết hợp độc lập dân tộc với chủ nghĩa xã hội\". Điều này cho thấy mục tiêu giải phóng giai cấp là một phần không thể tách rời trong sứ mệnh của Mặt trận dưới sự lãnh đạo của Đảng, chứ không phải bị loại trừ.","d":0},{"s":4,"q":"Mặc dù liên minh công nhân - nông dân được xác định là nền tảng cốt lõi của Mặt trận dân tộc thống nhất, Hồ Chí Minh chủ trương chỉ nên nhấn mạnh vai trò của hai giai cấp này để đảm bảo tính tiên phong tuyệt đối của khối đại đoàn kết.","g":"Chú ý đến lời căn dặn của Hồ Chí Minh về việc mở rộng khối đại đoàn kết.","x":"Hồ Chí Minh chỉ rõ: \"Người căn dặn, không nên chỉ nhấn mạnh vai trò của công nông, mà còn phải thấy vai trò và sự cần thiết phải liên minh với các giai cấp khác, nhất là với đội ngũ trí thức\". Điều này thể hiện quan điểm rộng mở của Người về việc xây dựng khối đại đoàn kết, không chỉ giới hạn ở công nông mà cần liên minh với nhiều tầng lớp khác để Mặt trận thực sự quy tụ được cả dân tộc.","d":0},{"s":21,"q":"Theo Hồ Chí Minh, các đoàn thể, tổ chức quần chúng và Mặt trận dân tộc thống nhất là sợi dây gắn kết Đảng với nhân dân.","g":"Nhớ lại vai trò cầu nối của các đoàn thể và Mặt trận trong phương thức thứ ba xây dựng khối đại đoàn kết.","x":"Tài liệu môn học ghi: “Các đoàn thể, tổ chức quần chúng và Mặt trận dân tộc thống nhất là sợi dây gắn kết Đảng với nhân dân.” Nhận định trong câu hỏi trùng với nội dung này.","d":1},{"s":22,"q":"Mặt trận dân tộc thống nhất là nơi quy tụ mọi tổ chức và cá nhân yêu nước sinh sống trong nước; kiều bào sinh sống ở nước ngoài không thuộc phạm vi tập hợp của Mặt trận.","g":"Xem lại giáo trình nói Mặt trận tập hợp những ai và họ sinh sống ở đâu.","x":"Tài liệu môn học ghi: “Mặt trận dân tộc thống nhất là nơi quy tụ mọi tổ chức và cá nhân yêu nước, tập hợp mọi người dân nước Việt, cả trong nước và kiều bào sinh sống ở nước ngoài.” Vì vậy, nói kiều bào không thuộc phạm vi tập hợp của Mặt trận là sai.","d":0},{"s":31,"q":"Theo Hồ Chí Minh, lòng khoan dung, độ lượng xuất phát từ nhận thức rằng ai cũng có mặt tốt, mặt xấu; vì vậy, muốn quy tụ rộng rãi mọi lực lượng thì phải trân trọng cả phần thiện nhỏ nhất ở mỗi người.","g":"Đọc lại điều kiện về lòng khoan dung, độ lượng với con người trong Tài liệu môn học và chú ý lý do Hồ Chí Minh nêu ra.","x":"Tài liệu môn học ghi: “Theo Hồ Chí Minh, mỗi cá nhân cũng như mỗi cộng đồng đều có những ưu điểm, khuyết điểm, mặt tốt, mặt xấu... Cho nên, vì lợi ích của cách mạng, cần phải có lòng khoan dung, độ lượng, trân trọng phần thiện dù nhỏ nhất ở mỗi người, có vậy mới tập hợp, quy tụ rộng rãi mọi lực lượng.” Nhận định diễn đạt đúng lập luận này.","d":1},{"s":32,"q":"Theo tư tưởng Hồ Chí Minh, khối đại đoàn kết toàn dân tộc chỉ có sức mạnh to lớn khi được tổ chức thành Mặt trận dân tộc thống nhất – tổ chức bao trùm các tổ chức yêu nước như công hội, nông hội, đoàn thanh niên.","g":"Xem lại phần mở đầu mục Mặt trận dân tộc thống nhất trong Tài liệu môn học: khối đại đoàn kết cần gì để trở thành lực lượng to lớn.","x":"Tài liệu môn học ghi: “Khối đại đoàn kết toàn dân tộc chỉ trở thành lực lượng to lớn, có sức mạnh khi được tập hợp, tổ chức lại thành một khối vững chắc, đó là mặt trận dân tộc thống nhất.” Khi kể các tổ chức yêu nước như công hội, nông hội, đoàn thanh niên, hội phụ nữ…, giáo trình kết luận: “trong đó, bao trùm là Mặt trận dân tộc thống nhất”.","d":1},{"s":33,"q":"Việc Mặt trận dân tộc thống nhất phải hoạt động theo nguyên tắc hiệp thương dân chủ bắt nguồn từ chỗ Mặt trận quy tụ nhiều giai cấp, tầng lớp, đảng phái, dân tộc, tôn giáo với những lợi ích khác nhau.","g":"Đọc lại nguyên tắc thứ hai xây dựng và hoạt động của Mặt trận trong Tài liệu môn học và lý do được nêu cho nguyên tắc ấy.","x":"Tài liệu môn học ghi: “Mặt trận dân tộc thống nhất là tổ chức chính trị - xã hội rộng lớn của cả dân tộc, bao gồm nhiều giai cấp, tầng lớp, đảng phái, dân tộc, tôn giáo khác nhau, với nhiều lợi ích khác nhau. Do vậy, hoạt động của Mặt trận phải dựa trên nguyên tắc hiệp thương dân chủ.”","d":1},{"s":34,"q":"Để giữ vững vai trò lãnh đạo, Đảng Cộng sản Việt Nam đứng ngoài Mặt trận dân tộc thống nhất: Đảng vạch đường lối cho Mặt trận nhưng không tham gia Mặt trận với tư cách thành viên.","g":"Xem lại Tài liệu môn học nói về vị trí của Đảng đối với Mặt trận trong nguyên tắc thứ nhất xây dựng Mặt trận.","x":"Tài liệu môn học ghi: “Đảng Cộng sản Việt Nam vừa là thành viên, vừa là lực lượng lãnh đạo, Đảng không có lợi ích riêng, mà gắn liền với lợi ích toàn xã hội, toàn dân tộc.” Như vậy, Đảng vừa là thành viên của Mặt trận vừa lãnh đạo Mặt trận; nói Đảng đứng ngoài, không tham gia Mặt trận với tư cách thành viên là sai.","d":0},{"s":35,"q":"Theo Hồ Chí Minh, mọi phương pháp vận động quần chúng phải phù hợp với tâm tư, nguyện vọng của quần chúng, xuất phát từ trình độ dân trí, phong tục, tập quán, cụ thể đối với từng địa phương, từng đối tượng.","g":"Đọc lại phương thức thứ nhất (dân vận) trong Tài liệu môn học, chú ý yêu cầu đối với phương pháp tiếp cận quần chúng.","x":"Tài liệu môn học ghi: “Theo Hồ Chí Minh, mọi phương pháp tiếp cận và vận động quần chúng đều phải phù hợp với tâm tư, nguyện vọng của quần chúng; phải xuất phát từ thực tế trình độ dân trí và văn hóa, theo cả nghĩa rộng và nghĩa hẹp, bao gồm cả phong tục, tập quán và cụ thể đối với từng địa phương, từng đối tượng của nhân dân.”","d":1},{"s":36,"q":"Vì đoàn thể nhân dân, tổ chức quần chúng mang bản chất là tổ chức của dân, nên vai trò của Mặt trận và các đoàn thể là vận động các giai cấp, tầng lớp trong xã hội tham gia vào tổ chức của mình.","g":"Đọc lại phương thức thứ ba trong Tài liệu môn học, chú ý kết luận rút ra từ lời Hồ Chí Minh về “những đoàn thể ấy”.","x":"Hồ Chí Minh khẳng định: “Những đoàn thể ấy là tổ chức của dân, phấn đấu cho dân, bênh vực quyền của dân, liên lạc mật thiết nhân dân với Chính phủ”. Từ đó giáo trình kết luận: “bản chất của đoàn thể nhân dân, các tổ chức quần chúng là tổ chức của dân, do đó vai trò của Mặt trận và các đoàn thể nhân dân là phải vận động quần chúng bao gồm các giai cấp, các tầng lớp trong xã hội tham gia vào các tổ chức của mình.”","d":1}],"tn":[{"s":5,"q":"Theo giáo trình, quan điểm của Hồ Chí Minh coi “yêu dân, tin dân, dựa vào dân, sống, phấn đấu vì hạnh phúc của nhân dân là nguyên tắc tối cao trong cuộc sống” gắn với điều kiện nào để xây dựng khối đại đoàn kết toàn dân tộc?","g":"Đọc lại ba điều kiện xây dựng khối đại đoàn kết toàn dân tộc và phân biệt điều kiện với các nguyên tắc hoạt động của Mặt trận.","x":"Tài liệu môn học ghi ở điều kiện “Ba là, phải có niềm tin vào nhân dân”: “Với Hồ Chí Minh, yêu dân, tin dân, dựa vào dân, sống, phấn đấu vì hạnh phúc của nhân dân là nguyên tắc tối cao trong cuộc sống.” Phương án A, B là hai điều kiện còn lại; D, E là nguyên tắc xây dựng và hoạt động của Mặt trận dân tộc thống nhất, không phải điều kiện.","p":[["A","Kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc."],["B","Có lòng khoan dung, độ lượng với con người."],["C","Có niềm tin vào nhân dân."],["D","Hoạt động theo nguyên tắc hiệp thương dân chủ."],["E","Đoàn kết lâu dài, chặt chẽ, đoàn kết thật sự, chân thành, thân ái giúp đỡ nhau cùng tiến bộ."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":6,"q":"Luận điểm \"Chở thuyền và lật thuyền cũng là dân\" trong tư tưởng Hồ Chí Minh về đại đoàn kết toàn dân tộc chủ yếu khẳng định điều gì?","g":"Liên hệ luận điểm này với điều kiện xây dựng khối đại đoàn kết mà nó minh họa.","x":"Luận điểm \"Chở thuyền và lật thuyền cũng là dân\" được nêu trong bối cảnh giải thích điều kiện \"niềm tin vào nhân dân\". Văn bản khẳng định: \"Dân là chỗ dựa vững chắc đồng thời cũng là nguồn sức mạnh vô địch của khối đại đoàn kết toàn dân tộc, quyết định thắng lợi của cách mạng. Vì vậy, muốn thực hiện đại đoàn kết toàn dân tộc, phải có niềm tin vào nhân dân\". Do đó, luận điểm này chủ yếu khẳng định niềm tin vào sức mạnh quyết định của nhân dân.","p":[["A","Sự cần thiết của lòng khoan dung, độ lượng."],["B","Vai trò tối cao của liên minh công nhân - nông dân."],["C","Niềm tin vững chắc vào sức mạnh quyết định của nhân dân."],["D","Tầm quan trọng của việc kế thừa truyền thống dân tộc."],["E","Nguyên tắc hiệp thương dân chủ trong mọi hoạt động."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":7,"q":"Nguyên tắc \"cầu đồng tồn dị\" trong xây dựng Mặt trận dân tộc thống nhất có ý nghĩa then chốt nào sau đây?","g":"Phân tích ý nghĩa của \"cầu đồng tồn dị\" trong bối cảnh có nhiều điểm tương đồng và khác biệt giữa các thành viên.","x":"Hồ Chí Minh nhấn mạnh phương châm \"cầu đồng tồn dị\", \"lấy cái chung để hạn chế cái riêng, cái khác biệt\". Điều này có nghĩa là Mặt trận chấp nhận sự tồn tại của những điểm khác biệt chính đáng, nhưng đồng thời tìm kiếm và phát huy những điểm tương đồng, lợi ích chung để tạo nên sự đoàn kết. Các lựa chọn A, B, D đều đi ngược lại tinh thần tôn trọng sự khác biệt và hiệp thương dân chủ, còn lựa chọn E không được đề cập trong văn bản.","p":[["A","Đòi hỏi mọi thành viên phải hoàn toàn đồng nhất về lợi ích và quan điểm để tạo sự thống nhất."],["B","Nhấn mạnh việc loại bỏ mọi sự khác biệt cá nhân để xây dựng một khối thống nhất tuyệt đối về tư tưởng."],["C","Tập trung vào việc tìm điểm chung để hạn chế, giải quyết các khác biệt riêng biệt, đồng thời tôn trọng chúng."],["D","Đề cao sự áp đặt ý chí từ một số thành viên chủ chốt để duy trì kỷ luật và định hướng chung."],["E","Chỉ áp dụng cho các tổ chức thành viên lớn, không áp dụng cho cá nhân trong Mặt trận."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Theo Hồ Chí Minh, lý do cốt yếu nào khiến liên minh công nhân - nông dân được xem là nền tảng của Mặt trận dân tộc thống nhất?","g":"Đọc kỹ phần giải thích của Hồ Chí Minh về tầm quan trọng của liên minh công nông.","x":"Hồ Chí Minh chỉ rõ rằng, sở dĩ phải lấy liên minh công nông làm nền tảng \"vì họ là người trực tiếp sản xuất tất cả mọi tài phú làm cho xã hội sống. Vì họ đông hơn hết, mà cũng bị áp bức bóc lột nặng nề hơn hết. Vì chí khí cách mạng của họ chắc chắn, bền bỉ hơn của mọi tầng lớp khác\". Lựa chọn B tổng hợp đầy đủ các lý do cốt yếu này.","p":[["A","Vì họ là lực lượng duy nhất có khả năng lãnh đạo cách mạng và dẫn dắt các giai cấp khác."],["B","Vì họ đông đảo nhất, trực tiếp sản xuất tất cả mọi tài phú làm cho xã hội sống, và bị áp bức bóc lột nặng nề nhất."],["C","Vì họ đại diện cho tầng lớp trí thức có trình độ cao và tầm nhìn chiến lược."],["D","Vì họ có truyền thống yêu nước lâu đời và triệt để hơn bất kỳ tầng lớp nào khác trong xã hội."],["E","Vì họ là những người có tài sản và ảnh hưởng xã hội lớn nhất, dễ tập hợp hơn các giai cấp khác."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Nhận định nào sau đây KHÔNG ĐÚNG khi nói về vai trò của Đảng Cộng sản Việt Nam trong Mặt trận dân tộc thống nhất?","g":"Chú ý đến mối quan hệ giữa Đảng và lợi ích chung của xã hội, dân tộc.","x":"Văn bản khẳng định rõ: \"Đảng Cộng sản Việt Nam vừa là thành viên, vừa là lực lượng lãnh đạo, Đảng không có lợi ích riêng, mà gắn liền với lợi ích toàn xã hội, toàn dân tộc\". Do đó, nhận định Đảng có lợi ích riêng, tách biệt với lợi ích toàn xã hội là không đúng.","p":[["A","Đảng là một thành viên của Mặt trận."],["B","Đảng là lực lượng lãnh đạo của Mặt trận."],["C","Đảng có lợi ích riêng, tách biệt với lợi ích toàn xã hội để đảm bảo vai trò tiên phong của mình."],["D","Đảng lãnh đạo Mặt trận thông qua việc vạch đường lối và phương pháp cách mạng phù hợp."],["E","Đảng có nhiệm vụ dẫn dắt Mặt trận đấu tranh giải phóng dân tộc và giải phóng giai cấp."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":10,"q":"Theo giáo trình, nhận định nào sau đây KHÔNG đúng về các điều kiện để xây dựng khối đại đoàn kết toàn dân tộc?","g":"Rà soát lại mục “Điều kiện để xây dựng khối đại đoàn kết toàn dân tộc” để xác định những điều kiện được nêu.","x":"Tài liệu môn học nêu ba điều kiện: “Một là, phải kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc”; “Hai là, phải có lòng khoan dung, độ lượng với con người”; “Ba là, phải có niềm tin vào nhân dân”. Các phương án A, B, C đúng với nội dung từng điều kiện. Xây dựng nền kinh tế độc lập, tự chủ không được nêu là điều kiện xây dựng khối đại đoàn kết, nên D là nhận định không đúng.","p":[["A","Truyền thống yêu nước, nhân nghĩa, đoàn kết là cội nguồn sức mạnh vô địch để cả dân tộc chiến đấu và chiến thắng thiên tai, địch họa."],["B","Khoan dung, độ lượng là trân trọng phần thiện dù nhỏ nhất ở mỗi người để tập hợp, quy tụ rộng rãi mọi lực lượng."],["C","Niềm tin vào nhân dân là sự quán triệt sâu sắc nguyên lý mácxít “Cách mạng là sự nghiệp của quần chúng”."],["D","Xây dựng nền kinh tế độc lập, tự chủ hoàn toàn, không phụ thuộc vào bên ngoài là một điều kiện để xây dựng khối đại đoàn kết toàn dân tộc."],["E","Giáo trình nêu ba điều kiện: kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết; có lòng khoan dung, độ lượng với con người; có niềm tin vào nhân dân."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":11,"q":"Phương thức nào sau đây KHÔNG được đề cập là một trong những phương thức xây dựng khối đại đoàn kết dân tộc theo Hồ Chí Minh?","g":"Kiểm tra ba phương thức chính được trình bày trong mục \"Phương thức xây dựng khối đại đoàn kết dân tộc\".","x":"Ba phương thức xây dựng khối đại đoàn kết dân tộc được nêu là: \"Một là, làm tốt công tác vận động quần chúng (dân vận)\"; \"Hai là, thành lập đoàn thể, tổ chức quần chúng phù hợp với từng đối tượng để tập hợp quần chúng\"; và \"Ba là, các đoàn thể, tổ chức quần chúng được tập hợp và đoàn kết trong mặt trận dân tộc thống nhất\". Phương thức \"Cưỡng chế các tổ chức không tự nguyện tham gia Mặt trận\" đi ngược lại với nguyên tắc hiệp thương dân chủ và không được đề cập trong văn bản. Lựa chọn E là một phần của công tác vận động quần chúng.","p":[["A","Làm tốt công tác vận động quần chúng (dân vận)."],["B","Thành lập đoàn thể, tổ chức quần chúng phù hợp với từng đối tượng để tập hợp quần chúng."],["C","Các đoàn thể, tổ chức quần chúng được tập hợp và đoàn kết trong Mặt trận dân tộc thống nhất."],["D","Cưỡng chế các tổ chức không tự nguyện tham gia Mặt trận để đảm bảo tính thống nhất và sức mạnh."],["E","Giáo dục, tuyên truyền, hướng dẫn, giúp đỡ và vận động quần chúng nhân dân thực hiện chủ trương, đường lối của Đảng."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":12,"q":"Nhận định nào sau đây KHÔNG chính xác về nguyên tắc hoạt động hiệp thương dân chủ của Mặt trận dân tộc thống nhất?","g":"Đọc kỹ cách thức giải quyết các lợi ích riêng biệt trong nguyên tắc hiệp thương dân chủ.","x":"Văn bản nêu rõ rằng những lợi ích riêng biệt, không phù hợp \"sẽ dần được giải quyết bằng lợi ích chung của dân tộc, bằng sự nhận thức ngày càng đúng đắn hơn của mỗi người, mỗi bộ phận về mối quan hệ giữa lợi ích chung và lợi ích riêng\". Cách giải quyết này dựa trên sự nhận thức và cảm hóa, không phải bằng sự \"áp chế và loại bỏ\". Các lựa chọn A, B, C, E đều đúng theo văn bản.","p":[["A","Mọi vấn đề của Mặt trận đều phải được đem ra để tất cả các thành viên cùng nhau bàn bạc công khai."],["B","Loại trừ mọi sự áp đặt hoặc dân chủ hình thức trong quá trình ra quyết định."],["C","Những lợi ích riêng chính đáng, phù hợp với lợi ích chung của đất nước, của dân tộc cần được tôn trọng."],["D","Các lợi ích riêng biệt, không phù hợp với lợi ích chung sẽ được giải quyết bằng sự áp chế và loại bỏ của lợi ích chung tối cao."],["E","Hoạt động theo nguyên tắc này giúp quy tụ được các tầng lớp, giai cấp, đảng phái, dân tộc, tôn giáo vào Mặt trận."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Hồ Chí Minh viết: “Lực lượng chủ yếu trong khối đoàn kết dân tộc là công nông, cho nên _______ là nền tảng của Mặt trận dân tộc thống nhất”.","g":"Nhớ lại nguyên tắc thứ nhất xây dựng Mặt trận dân tộc thống nhất: Mặt trận được xây dựng trên nền tảng nào.","x":"Tài liệu môn học dẫn lời Hồ Chí Minh: “Lực lượng chủ yếu trong khối đoàn kết dân tộc là công nông, cho nên liên minh công nông là nền tảng của Mặt trận dân tộc thống nhất”.","p":[["A","giai cấp công nhân"],["B","liên minh công nông"],["C","đội ngũ trí thức"],["D","Đảng Cộng sản"],["E","khối đoàn kết quốc tế"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":18,"q":"Hồ Chí Minh căn dặn đồng bào: “Năm ngón tay cũng có ngón vắn ngón dài. Nhưng vắn dài đều họp nhau lại nơi bàn tay. Trong mấy triệu người cũng có người thế này thế khác, nhưng thế này hay thế khác đều dòng dõi của tổ tiên ta. Vậy nên ta phải khoan hồng đại độ.” Người dùng hình ảnh này để minh họa cho sự cần thiết phải có _______ với con người trong xây dựng đại đoàn kết.","g":"Liên hệ câu nói của Hồ Chí Minh với điều kiện về thái độ đối với con người.","x":"Đoạn văn trên được trích dẫn trong phần \"Hai là, phải có lòng khoan dung, độ lượng với con người\". Cụm từ \"khoan hồng đại độ\" đồng nghĩa với lòng khoan dung, độ lượng.","p":[["A","lòng trung thành"],["B","lòng kiên nhẫn"],["C","lòng dũng cảm"],["D","lòng khoan dung, độ lượng"],["E","lòng quyết tâm"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":19,"q":"Đảng Cộng sản Việt Nam vừa là thành viên, vừa là lực lượng lãnh đạo của Mặt trận. Đảng không có lợi ích riêng, mà gắn liền với _______, toàn dân tộc.","g":"Xem xét mối quan hệ hữu cơ giữa Đảng và xã hội được trình bày trong văn bản.","x":"Văn bản khẳng định: \"Đảng không có lợi ích riêng, mà gắn liền với lợi ích toàn xã hội, toàn dân tộc\".","p":[["A","một giai cấp"],["B","toàn xã hội"],["C","một nhóm người"],["D","một đảng phái"],["E","một tầng lớp"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":20,"q":"Các đoàn thể, tổ chức quần chúng ra đời, dưới sự lãnh đạo của Đảng, có nhiệm vụ tuyên truyền, giáo dục, giác ngộ, vận động, tập hợp các tầng lớp nhân dân tham gia cách mạng, đấu tranh bảo vệ _______ của mình.","g":"Nhớ lại chức năng cơ bản của các đoàn thể quần chúng đối với hội viên của mình.","x":"Văn bản nêu rõ rằng các đoàn thể, tổ chức quần chúng có nhiệm vụ \"đấu tranh bảo vệ quyền và lợi ích của mình\" và \"bênh vực quyền của dân\".","p":[["A","danh dự"],["B","truyền thống"],["C","phong tục"],["D","quyền và lợi ích"],["E","văn hóa"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":23,"q":"Theo Hồ Chí Minh, vì lợi ích của cách mạng, lòng khoan dung, độ lượng với con người được thể hiện ở việc làm nào sau đây?","g":"Nhớ lại nhận định của Hồ Chí Minh rằng mỗi cá nhân, mỗi cộng đồng đều có mặt tốt, mặt xấu.","x":"Tài liệu môn học ghi: “Cho nên, vì lợi ích của cách mạng, cần phải có lòng khoan dung, độ lượng, trân trọng phần thiện dù nhỏ nhất ở mỗi người, có vậy mới tập hợp, quy tụ rộng rãi mọi lực lượng.” Các phương án còn lại đều thu hẹp hoặc loại trừ lực lượng, trái với điều kiện này.","p":[["A","Chỉ tập hợp những người đã hoàn toàn giác ngộ cách mạng, không có khuyết điểm."],["B","Trân trọng phần thiện dù nhỏ nhất ở mỗi người để tập hợp, quy tụ rộng rãi mọi lực lượng."],["C","Chỉ khoan dung với những người cùng giai cấp, cùng tôn giáo với mình."],["D","Loại ra khỏi khối đoàn kết những ai từng có mặt xấu, mặt hạn chế."],["E","Chỉ trân trọng những người đã có công lớn với cách mạng."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":24,"q":"Hồ Chí Minh xác định mục đích chung của Mặt trận dân tộc thống nhất là gì?","g":"Tìm cụm từ chỉ mức độ tập hợp lực lượng trong nguyên tắc thứ nhất xây dựng Mặt trận.","x":"Tài liệu môn học ghi: “Hồ Chí Minh xác định mục đích chung của Mặt trận dân tộc thống nhất là nhằm tập hợp tới mức cao nhất lực lượng dân tộc vào khối đại đoàn kết toàn dân tộc.”","p":[["A","Thay thế Nhà nước trong việc quản lý mọi mặt đời sống xã hội."],["B","Bảo vệ lợi ích riêng của từng đảng phái, tôn giáo trong Mặt trận."],["C","Chỉ tập hợp giai cấp công nhân và giai cấp nông dân."],["D","Tập hợp tới mức cao nhất lực lượng dân tộc vào khối đại đoàn kết toàn dân tộc."],["E","Thay thế vai trò lãnh đạo của Đảng đối với cách mạng."]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":25,"q":"Theo giáo trình, nhận định nào sau đây KHÔNG đúng về Mặt trận dân tộc thống nhất qua các thời kỳ?","g":"Chú ý giáo trình nói gì về “thực chất” của Mặt trận dù tên gọi thay đổi.","x":"Tài liệu môn học ghi: “Mặc dù có nhiều tên gọi khác nhau nhưng thực chất chỉ là một tổ chức chính trị - xã hội nhằm tập hợp đông đảo các giai cấp, tầng lớp, dân tộc, tôn giáo, đảng phái, các tổ chức, cá nhân yêu nước ở trong và ngoài nước, phấn đấu vì mục tiêu chung là độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân.” Giáo trình cũng ghi: “từ năm 1977 đến nay là Mặt trận Tổ quốc Việt Nam”. Vì vậy, coi mỗi tên gọi là một tổ chức riêng biệt, có mục tiêu khác hẳn là sai.","p":[["A","Do yêu cầu và nhiệm vụ của từng chặng đường lịch sử, Mặt trận đã có những tên gọi khác nhau."],["B","Mặt trận phấn đấu vì mục tiêu chung là độc lập, thống nhất của Tổ quốc và tự do, hạnh phúc của nhân dân."],["C","Mỗi tên gọi là một tổ chức riêng biệt, có mục tiêu khác hẳn tổ chức trước đó."],["D","Mặt trận tập hợp đông đảo các giai cấp, tầng lớp, dân tộc, tôn giáo, đảng phái, các tổ chức, cá nhân yêu nước."],["E","Từ năm 1977 đến nay, Mặt trận mang tên Mặt trận Tổ quốc Việt Nam."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":26,"q":"Nhận định nào sau đây KHÔNG đúng về các đoàn thể, tổ chức quần chúng theo tư tưởng Hồ Chí Minh?","g":"Đọc lại tên gọi của phương thức thứ hai xây dựng khối đại đoàn kết dân tộc.","x":"Tài liệu môn học ghi: “Đây là những tổ chức để tập hợp, giáo dục, rèn luyện quần chúng cho phù hợp từng giai cấp, dân tộc, tôn giáo, lứa tuổi, giới tính, vùng miền”. Giáo trình gọi phương thức này là: “thành lập đoàn thể, tổ chức quần chúng phù hợp với từng đối tượng để tập hợp quần chúng”. Vì vậy, phương án E là sai.","p":[["A","Là những tổ chức để tập hợp, giáo dục, rèn luyện quần chúng."],["B","Bản chất của đoàn thể nhân dân, các tổ chức quần chúng là tổ chức của dân."],["C","Có nhiệm vụ giáo dục, động viên và phát huy tính tích cực của các tầng lớp nhân dân."],["D","Là hạt nhân của khối đại đoàn kết toàn dân."],["E","Được tổ chức theo một khuôn mẫu chung cho mọi người, không cần phù hợp với từng giai cấp, lứa tuổi, giới tính hay vùng miền."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":29,"q":"Theo Hồ Chí Minh, Mặt trận dân tộc thống nhất càng rộng rãi, càng chặt chẽ, thống nhất bao nhiêu thì khối đại đoàn kết toàn dân tộc càng _______ bấy nhiêu.","g":"Câu này nêu mối quan hệ thuận chiều giữa Mặt trận và khối đại đoàn kết toàn dân tộc.","x":"Tài liệu môn học ghi: “Mặt trận dân tộc thống nhất càng rộng rãi, càng chặt chẽ, thống nhất bao nhiêu thì khối đại đoàn kết toàn dân tộc càng mạnh mẽ, bền vững bấy nhiêu.”","p":[["A","phức tạp, khó lãnh đạo"],["B","phân tán, lỏng lẻo"],["C","mạnh mẽ, bền vững"],["D","khép kín, biệt lập"],["E","hình thức, đối phó"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Theo Hồ Chí Minh, vận động quần chúng để thu hút quần chúng chính là để _______ mọi người, tạo ra động lực phát triển kinh tế - xã hội và văn hóa.","g":"Nghĩ tới mục tiêu, nhiệm vụ hàng đầu của Đảng mà công tác dân vận phục vụ.","x":"Tài liệu môn học ghi: “Vận động quần chúng để thu hút quần chúng chính là để đoàn kết mọi người, tạo ra động lực phát triển kinh tế - xã hội và văn hóa.”","p":[["A","phân loại"],["B","kiểm soát"],["C","quản lý"],["D","thay thế"],["E","đoàn kết"]],"d":"E","k":"Chọn cụm từ điền vào chỗ trống"}]},"13":{"ten":"Chuẩn mực đạo đức","ds":[{"s":1,"q":"Theo quan điểm của Hồ Chí Minh, việc cán bộ thực hiện “cần, kiệm, liêm, chính” không chỉ là gương mẫu cho nhân dân mà còn là biện pháp duy nhất để chống lại sự hủ bại và biến chất trong bộ máy nhà nước.","g":"Tập trung vào vai trò của \"cần, kiệm, liêm, chính\" đối với cán bộ và những hậu quả nếu thiếu chúng. Có phải là \"biện pháp duy nhất\" được đề cập trong tài liệu không?","x":"Tài liệu chỉ ra rằng cán bộ, đảng viên phải là người thực hành \"cần, kiệm, liêm, chính\" trước để làm kiểu mẫu cho dân và nếu không giữ đúng thì \"dễ trở nên hủ bại, biến thành sâu mọt của dân\". Tuy nhiên, tài liệu không khẳng định đây là \"biện pháp duy nhất\" để chống hủ bại, mà là một điều kiện tiên quyết. Có thể có nhiều biện pháp khác không được đề cập trong đoạn văn này.","d":0},{"s":2,"q":"Tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh, mặc dù kế thừa giá trị yêu nước truyền thống, nhưng hoàn toàn loại bỏ mọi yếu tố đạo đức truyền thống trong quan niệm về nước và dân để tạo nên một cuộc cách mạng sâu sắc.","g":"Chú ý cụm từ \"hoàn toàn loại bỏ mọi yếu tố\" và sự \"kế thừa\" được nhắc đến. Có sự kế thừa và phát triển hay chỉ là loại bỏ tuyệt đối?","x":"Tài liệu và chỉ rõ tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh \"kế thừa giá trị yêu nước truyền thống của dân tộc, mà còn vượt qua những hạn chế của truyền thống đó\", đồng thời đưa ra \"những nội dung mới, rộng lớn\" và \"tạo nên một cuộc cách mạng sâu sắc\". Việc sử dụng từ \"kế thừa\" cho thấy Người không \"hoàn toàn loại bỏ mọi yếu tố đạo đức truyền thống\" mà là chọn lọc, phát triển và làm mới nội dung trên nền tảng truyền thống.","d":0},{"s":3,"q":"Theo Hồ Chí Minh, tình yêu thương con người phải được xây dựng trên lập trường của giai cấp công nhân và chỉ được thể hiện thông qua các hành động cụ thể, thiết thực trong các mối quan hệ hằng ngày.","g":"Xem xét các yếu tố cấu thành tình yêu thương con người theo Hồ Chí Minh. Có phải chỉ \"thông qua\" hành động cụ thể hay còn có các yếu tố khác như thái độ, sự tôn trọng?","x":"Tài liệu nêu rõ \"Tình yêu thương con người theo Hồ Chí Minh phải được xây dựng trên lập trường của giai cấp công nhân, thể hiện trong các mối quan hệ hằng ngày với bạn bè, đồng chí, anh em, phải được thể hiện ở hành động cụ thể thiết thực\". Tuy nhiên, tài liệu cũng đề cập đến các khía cạnh khác như \"thật chặt chẽ và nghiêm khắc với mình; rộng rãi, độ lượng và giàu lòng vị tha đối với người khác; phải có thái độ tôn trọng những quyền của con người, tạo điều kiện cho con người phát huy tài năng; nâng con người lên...\". Từ \"chỉ\" trong câu hỏi làm cho mệnh đề trở nên sai vì nó thu hẹp phạm vi biểu hiện của tình yêu thương con người.","d":0},{"s":4,"q":"Chủ nghĩa quốc tế theo Hồ Chí Minh đòi hỏi sự tôn trọng và đoàn kết với giai cấp vô sản và các dân tộc bị áp bức trên toàn thế giới, đồng thời loại bỏ hoàn toàn chủ nghĩa dân tộc hẹp hòi để đạt được hòa bình vĩnh cửu.","g":"Phân tích nội dung chủ nghĩa quốc tế và mối quan hệ với chủ nghĩa dân tộc. Có sự loại bỏ \"hoàn toàn\" không?","x":"Tài liệu khẳng định Hồ Chí Minh là biểu tượng của \"chủ nghĩa yêu nước chân chính kết hợp nhuần nhuyễn với chủ nghĩa quốc tế vô sản\". Tài liệu có nói đến việc \"chống lại chủ nghĩa dân tộc hẹp hòi, sôvanh, biệt lập và chủ nghĩa bành trướng bá quyền\". Tuy nhiên, việc \"kết hợp nhuần nhuyễn\" chủ nghĩa yêu nước chân chính không có nghĩa là \"loại bỏ hoàn toàn\" chủ nghĩa dân tộc (mà là loại bỏ phần \"hẹp hòi\"). Hơn nữa, việc loại bỏ này cũng không được khẳng định là sẽ trực tiếp \"đạt được hòa bình vĩnh cửu\" trong văn bản tài liệu.","d":0},{"s":21,"q":"Theo giáo trình, cần, kiệm, liêm, chính, chí công vô tư cũng là một biểu hiện cụ thể của phẩm chất “trung với nước, hiếu với dân”.","g":"Xem lại mối liên hệ giữa phẩm chất bao trùm nhất và các phẩm chất khác trong hệ chuẩn mực đạo đức cách mạng.","x":"Tài liệu môn học ghi: “Với ý nghĩa như vậy, cần, kiệm, liêm, chính, chí công vô tư cũng là một biểu hiện cụ thể của phẩm chất ‘trung với nước, hiếu với dân’.” Điều này phù hợp với nhận định trung với nước, hiếu với dân là phẩm chất bao trùm, chi phối các phẩm chất khác.","d":1},{"s":22,"q":"Theo Hồ Chí Minh, nếu không có tình yêu thương con người thì vẫn có thể nói đến cách mạng, chỉ là không thể nói đến chủ nghĩa xã hội và chủ nghĩa cộng sản.","g":"Đọc lại nhận định của Người về vị trí của tình yêu thương con người đối với cách mạng.","x":"Tài liệu môn học ghi: “Người cho rằng, nếu không có tình yêu thương như vậy thì không thể nói đến cách mạng, càng không thể nói đến chủ nghĩa xã hội và chủ nghĩa cộng sản.” Như vậy, thiếu tình yêu thương con người thì ngay cả cách mạng cũng không thể nói đến.","d":0}],"tn":[{"s":5,"q":"Luận điểm \"Bao nhiêu lợi ích đều vì dân. Bao nhiêu quyền hạn đều của dân… Quyền hành và lực lượng đều ở nơi dân\" (Tài liệu) thể hiện rõ nhất khía cạnh nào trong quan niệm đạo đức Hồ Chí Minh về \"Trung với nước, hiếu với dân\"?","g":"Đọc kỹ đoạn văn chứa luận điểm đó và phân tích ngữ cảnh, đặc biệt là sự so sánh với quan niệm cũ và vai trò của \"dân\" được nhấn mạnh.","x":"Tài liệu khẳng định khi Hồ Chí Minh đặt vấn đề \"Bao nhiêu lợi ích đều vì dân. Bao nhiêu quyền hạn đều của dân… Quyền hành và lực lượng đều ở nơi dân\", và Đảng, Chính phủ là \"đầy tớ nhân dân\", thì \"quan niệm về nước và dân đã hoàn toàn đảo lộn so với trước; rất ít lãnh tụ cách mạng đã nói về dân như vậy, điều này càng làm cho tư tưởng đạo đức Hồ Chí Minh vượt xa lên phía trước\". Điều này trực tiếp chỉ ra rằng đây là một cuộc cách mạng sâu sắc, đặt dân vào vị trí trung tâm, là chủ thể của quyền lực và lợi ích. Các phương án khác không phản ánh đúng hoặc không đầy đủ ý nghĩa của luận điểm này.","p":[["A","Sự kế thừa triệt để quan niệm \"trung với vua\" truyền thống."],["B","Vai trò tối cao của Đảng và Chính phủ trong việc định đoạt mọi lợi ích và quyền hạn."],["C","Cuộc cách mạng sâu sắc trong quan niệm về nước và dân, đặt dân lên vị trí chủ thể."],["D","Mục tiêu duy nhất là làm cho dân giàu, nước mạnh bằng mọi giá."],["E","Sự phân chia rõ ràng giữa lợi ích của nước và lợi ích của dân."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":6,"q":"Theo Hồ Chí Minh, phẩm chất \"Chí công vô tư\" được hiểu một cách sâu sắc nhất là:","g":"Xem xét định nghĩa và mối quan hệ của \"chí công vô tư\" với các phẩm chất khác, cũng như đối tượng áp dụng và ý nghĩa của nó trong việc chống lại một tư tưởng cụ thể.","x":"Tài liệu định nghĩa \"Chí công vô tư là hoàn toàn vì lợi ích chung, không vì tư lợi; Là hết sức công bằng, không chút thiên tư, thiên vị, công tâm, luôn đặt lợi ích của Đảng, của nhân dân, của dân tộc lên trên hết, trước hết; chỉ biết vì Đảng, vì dân tộc, 'lo trước thiên hạ, vui sau thiên hạ'\". Tài liệu còn nói rõ \"Chí công vô tư là chống chủ nghĩa cá nhân\". Phương án A quá tuyệt đối (\"hoàn toàn không nghĩ đến lợi ích cá nhân dưới bất kỳ hình thức nào\") trong khi tài liệu chỉ nói \"đừng nghĩ đến mình trước... khi hưởng thụ thì mình nên đi sau\". Phương án C sai vì tài liệu nói \"Chí công vô tư về thực chất là sự tiếp nối cần, kiệm, liêm, chính\". Phương án D quá tuyệt đối (\"không có ngoại lệ\") và không phải là định nghĩa sâu sắc nhất. Phương án E sai vì tài liệu không giới hạn đối tượng áp dụng.","p":[["A","Hoàn toàn không nghĩ đến lợi ích cá nhân dưới bất kỳ hình thức nào."],["B","Luôn đặt lợi ích của Đảng, nhân dân và dân tộc lên trên hết, trước hết, đồng thời đối lập hoàn toàn với chủ nghĩa cá nhân."],["C","Là đức tính cơ bản độc lập, không liên quan đến \"cần, kiệm, liêm, chính\"."],["D","Việc hưởng thụ phải luôn đi sau người khác, không có ngoại lệ."],["E","Chỉ áp dụng cho cán bộ cấp cao có quyền lực lớn."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":7,"q":"Trong các nhận định sau về phẩm chất \"Liêm\" theo Hồ Chí Minh, nhận định nào thể hiện sự tinh túy nhất, vượt trội so với quan niệm truyền thống?","g":"Đọc kỹ định nghĩa về \"Liêm\" và tìm điểm khác biệt so với quan niệm thông thường hoặc truyền thống, đặc biệt chú ý đến điều mà Người cho là \"chỉ có một thứ ham\".","x":"Các phương án A, B, C, D đều là các khía cạnh quan trọng của \"Liêm\" theo Hồ Chí Minh. Tuy nhiên, phương án E \"Chỉ có một thứ ham là ham học, ham làm, ham tiến bộ\" là một điểm nhấn đặc biệt, thể hiện một quan niệm tích cực, tiến bộ về \"Liêm\". Thay vì chỉ tập trung vào việc không tham lam (điều đã có trong truyền thống), Người đã bổ sung một nội dung mới, định hướng cho con người phải có những ham muốn lành mạnh, tích cực, vì sự phát triển bản thân và xã hội. Điều này nâng tầm ý nghĩa của \"Liêm\" lên một cấp độ mới, vượt trội so với việc chỉ giữ mình trong sạch, không tham nhũng.","p":[["A","\"Liêm là trong sạch, không tham lam.\""],["B","\"Chữ LIÊM phải đi đôi với chữ KIỆM. Cũng như chữ KIỆM phải đi với chữ CẦN.\""],["C","\"Liêm là không tham địa vị. Không tham tiền tài. Không tham sung sướng.\""],["D","\"Không ham người tâng bốc mình. Vì vậy mà quang minh chính đại, không bao giờ hủ hóa.\""],["E","\"Chỉ có một thứ ham là ham học, ham làm, ham tiến bộ.\""]],"d":"E","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Luận điểm \"Đem lòng chí công vô tư mà đối với người, đối với việc\" và \"Khi làm bất cứ việc gì cũng đừng nghĩ đến mình trước... khi hưởng thụ thì mình nên đi sau\" (Tài liệu) thể hiện mối liên hệ sâu sắc nhất với phẩm chất đạo đức nào khác của Hồ Chí Minh?","g":"Luận điểm này nói về \"chí công vô tư\". Tài liệu có chỉ ra mối liên hệ của \"chí công vô tư\" với các phẩm chất khác không?","x":"Tài liệu rõ ràng giải thích: \"Chí công vô tư về thực chất là sự tiếp nối cần, kiệm, liêm, chính.\" Điều này trực tiếp chỉ ra mối liên hệ sâu sắc nhất giữa chí công vô tư và cần, kiệm, liêm, chính. Việc đem lòng chí công vô tư đối với người, đối với việc, không nghĩ đến mình trước khi làm việc và hưởng thụ sau là những biểu hiện cụ thể của sự liêm chính và không tham lam, đồng thời thể hiện tinh thần không tư lợi, là cốt lõi của \"cần, kiệm, liêm, chính, chí công vô tư\".","p":[["A","Tinh thần quốc tế trong sáng."],["B","Thương yêu con người, sống có tình có nghĩa."],["C","Cần, kiệm, liêm, chính."],["D","Trung với nước, hiếu với dân."],["E","Tính tự lực cánh sinh trong lao động."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Nhận định nào sau đây không phản ánh đúng ý nghĩa của \"Kiệm\" theo tư tưởng Hồ Chí Minh?","g":"Đọc kỹ định nghĩa và các ví dụ về \"Kiệm\", đặc biệt là sự phân biệt giữa \"kiệm\" và \"bủn xỉn\", và các trường hợp ngoại lệ liên quan đến lợi ích chung.","x":"Tài liệu và định nghĩa \"Kiệm là tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi... Tiết kiệm không phải là bủn xỉn. Khi không nên tiêu xài thì một đồng xu cũng không nên tiêu. Khi có việc đáng làm, việc lợi ích cho đồng bào, cho Tổ quốc, thì dù bao nhiêu công, tốn bao nhiêu của, cũng vui lòng. Như thế mới đúng là kiệm.\" Phương án E khẳng định \"Tiết kiệm đòi hỏi sự kiên quyết không xa xỉ trong mọi hoàn cảnh, bao gồm cả các hoạt động vì lợi ích chung\" là sai, vì tài liệu rõ ràng cho phép (thậm chí khuyến khích) chi tiêu \"bao nhiêu công, tốn bao nhiêu của\" cho \"việc lợi ích cho đồng bào, cho Tổ quốc\".","p":[["A","Tiết kiệm không có nghĩa là bủn xỉn, mà là chi tiêu có kế hoạch và mục đích rõ ràng."],["B","Tiết kiệm sức lao động, thời gian và tiền của không chỉ của cá nhân mà còn của tập thể và quốc gia."],["C","Khi có việc đáng làm, lợi ích cho đồng bào, cho Tổ quốc thì không cần tiết kiệm bao nhiêu công, của."],["D","Việc phô trương hình thức, liên hoan chè chén lu bù là những hành vi trái với tinh thần \"Kiệm\"."],["E","Tiết kiệm đòi hỏi sự kiên quyết không xa xỉ trong mọi hoàn cảnh, bao gồm cả các hoạt động vì lợi ích chung."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":10,"q":"Phát biểu nào sau đây không phản ánh đúng về tư tưởng \"trung với nước, hiếu với dân\" của Hồ Chí Minh?","g":"Kiểm tra từng yếu tố của \"trung với nước, hiếu với dân\" trong tài liệu, đặc biệt là các khía cạnh liên quan đến \"dân\".","x":"Phương án E sai vì tài liệu nêu rõ \"Hiếu với dân là phải thương dân, tin dân, thân dân, học hỏi dân, lấy trí tuệ ở dân, kính trọng dân, lấy dân làm gốc, 'hết lòng hết sức phục vụ nhân dân. Phải yêu kính nhân dân. Phải thật sự tôn trọng quyền làm chủ của nhân dân'\". Như vậy, \"tin dân, học hỏi dân\" là những nội dung cốt lõi của \"hiếu với dân\".","p":[["A","Là phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác."],["B","Đánh dấu sự thay đổi cơ bản từ quan niệm \"trung với vua, hiếu với cha mẹ\" truyền thống sang nội dung mới."],["C","Không những kế thừa giá trị yêu nước truyền thống mà còn vượt qua những hạn chế của nó."],["D","Được cụ thể hóa bằng việc làm cho \"dân giàu, nước mạnh\" và \"hết lòng hết sức phục vụ nhân dân\"."],["E","Yêu cầu tuyệt đối trung thành với Tổ quốc nhưng không bao gồm việc tin dân, học hỏi dân."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":11,"q":"Phát biểu nào sau đây là không đúng về sự vận dụng và phát triển khái niệm đạo đức truyền thống của Hồ Chí Minh?","g":"Tập trung vào cách Hồ Chí Minh xử lý các khái niệm đạo đức truyền thống. Có phải chỉ là \"hình thức\" hay có sự thay đổi \"cốt lõi\" và \"cách mạng sâu sắc\"?","x":"Tài liệu chỉ ra rằng Hồ Chí Minh đã sử dụng các khái niệm cũ như \"Trung với vua, hiếu với cha mẹ\" nhưng với \"những nội dung mới, rộng lớn: “Trung với nước, hiếu với dân”, đã tạo nên một cuộc cách mạng sâu sắc trong lĩnh vực đạo đức\". Người cũng ví \"Đạo đức cũ như người đầu ngược xuống đất chân chổng lên trời. Đạo đức mới như người hai chân đứng vững được dưới đất, đầu ngửng lên trời\". Đối với \"cần, kiệm, liêm, chính, chí công vô tư\", Người cũng \"lọc bỏ những nội dung không phù hợp và đưa vào những nội dung mới đáp ứng yêu cầu của cách mạng\". Rõ ràng, đây không phải là sự kế thừa mang tính hình thức mà là một sự thay đổi sâu sắc về nội dung và bản chất, tạo ra một nền đạo đức mới.","p":[["A","Người đã sử dụng các khái niệm cũ như \"trung\", \"hiếu\" nhưng gán cho chúng những nội dung mới, rộng lớn và mang tính cách mạng."],["B","Các khái niệm \"cần, kiệm, liêm, chính, chí công vô tư\" được Người lọc bỏ những nội dung không phù hợp và đưa vào nội dung mới để đáp ứng yêu cầu cách mạng."],["C","Sự kế thừa và phát triển này chỉ mang tính hình thức, cốt lõi vẫn giữ nguyên các giá trị truyền thống để dễ tiếp thu hơn."],["D","Quan điểm \"Đạo đức mới như người hai chân đứng vững được dưới đất, đầu ngửng lên trời\" minh chứng cho sự đảo lộn sâu sắc so với đạo đức cũ."],["E","Người khẳng định cán bộ phải thực hiện \"cần, kiệm, liêm, chính\" trước làm gương cho dân, khác với việc phong kiến bắt dân tuân theo."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":12,"q":"Nhận định nào sau đây không thể hiện đúng tinh thần \"Chính\" của Hồ Chí Minh trong mối quan hệ \"đối với việc\"?","g":"Đọc kỹ phần định nghĩa \"Chính\" và các mối quan hệ được liệt kê, đặc biệt là \"đối với việc\".","x":"Tài liệu định nghĩa \"Chính nghĩa là không tà, nghĩa là thẳng thắn, đứng đắn. Điều gì không đứng đắn, thẳng thắn, tức là tà\". Trong mối quan hệ \"đối với việc\", Người chỉ rõ \"phải để công việc nước lên trên, trước việt tư, việc nhà… việc thiện thì dù nhỏ mấy cũng làm. việc ác thì dù nhỏ mấy cũng tránh\". Tài liệu không hề đề cập đến việc \"Luôn phải tuân thủ mọi quy định và luật pháp, không được linh hoạt trong mọi trường hợp\". Đây là một suy diễn không có trong văn bản và có thể sai lệch so với tinh thần \"Chính\" vốn nhấn mạnh sự thẳng thắn, đứng đắn, làm điều thiện, tránh điều ác hơn là sự cứng nhắc trong tuân thủ luật pháp một cách vô điều kiện.","p":[["A","Phải đặt công việc của nước lên trên, trước mọi việc tư, việc nhà."],["B","Việc thiện dù nhỏ mấy cũng phải cố gắng làm bằng được."],["C","Việc ác dù nhỏ mấy cũng phải tránh tuyệt đối."],["D","Luôn phải tuân thủ mọi quy định và luật pháp, không được linh hoạt trong mọi trường hợp."],["E","Thể hiện sự thẳng thắn, đứng đắn, không tà vạy trong mọi hành động và quyết định liên quan đến công việc."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Hồ Chí Minh khẳng định Đảng và Chính phủ là \"(1) _______\", chứ không phải \"(2) _______\" để đè đầu cưỡi cổ nhân dân, điều này thể hiện sự đảo lộn hoàn toàn quan niệm về nước và dân so với trước.","g":"Đoạn văn mô tả rõ vai trò của Đảng và Chính phủ. Chọn phương án phù hợp nhất cho hai chỗ trống.","x":"Tài liệu môn học ghi: “Đảng và Chính phủ là ‘đầy tớ nhân dân’ chứ không phải ‘quan nhân dân để đè đầu cưỡi cổ nhân dân’, th
