["C","Kinh tế và văn hóa là hai lĩnh vực hoàn toàn độc lập, không có mối quan hệ biện chứng."],["D","Văn hóa quyết định tính chất của kinh tế, trong khi kinh tế chỉ có vai trò thứ yếu."],["E","Việc phát triển văn hóa là không cần thiết trong giai đoạn đầu xây dựng kinh tế."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Điểm khác biệt cơ bản về lợi ích giữa chủ nghĩa xã hội với những chế độ xã hội trước đó, theo Hồ Chí Minh, là gì?","g":"Tập trung vào cách Hồ Chí Minh định nghĩa \"lợi ích của dân\" và sự khác biệt mà Người chỉ ra.","x":"Hồ Chí Minh quan tâm đến \"lợi ích của cả cộng đồng người và lợi ích của những con người cụ thể\" vì Người cho rằng \"đây là một trong những điểm khác nhau cơ bản giữa chủ nghĩa xã hội với những chế độ xã hội trước nó\". Điều này cho thấy sự cân bằng giữa lợi ích tập thể và cá nhân.","p":[["A","Chủ nghĩa xã hội chỉ quan tâm đến lợi ích của cộng đồng, bỏ qua lợi ích cá nhân."],["B","Chủ nghĩa xã hội chỉ chú trọng đến lợi ích của một giai cấp cầm quyền duy nhất."],["C","Chủ nghĩa xã hội quan tâm đến lợi ích của cả cộng đồng và lợi ích của những con người cụ thể."],["D","Chủ nghĩa xã hội nhấn mạnh lợi ích kinh tế hơn lợi ích tinh thần cho cá nhân."],["E","Chủ nghĩa xã hội phủ nhận hoàn toàn khái niệm lợi ích cá nhân."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":10,"q":"Động lực nào được Hồ Chí Minh đánh giá là có vai trò quyết định trong hệ thống động lực thúc đẩy tiến trình cách mạng xã hội chủ nghĩa?","g":"Xem xét phần động lực và yếu tố nào được Người nhấn mạnh là \"quyết định\".","x":"Trong tư tưởng của Người, \"Tất cả các động lực đều rất quan trọng và có mối quan hệ biện chứng với nhau nhưng giữ vai trò quyết định là nội lực dân tộc, là nhân dân\". Mặc dù Đảng lãnh đạo đóng vai trò quyết định trong hoạt động của tổ chức, nhưng đối với hệ thống động lực nói chung thì nội lực dân tộc, nhân dân là quyết định.","p":[["A","Ngoại lực và sự giúp đỡ từ các nước anh em."],["B","Sức mạnh của khoa học và giáo dục tiên tiến."],["C","Nội lực dân tộc, mà hạt nhân là nhân dân."],["D","Sự phát triển vượt trội của công nghiệp hiện đại."],["E","Vai trò lãnh đạo của Đảng Cộng sản là duy nhất và không phụ thuộc vào các yếu tố khác."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":11,"q":"Theo Hồ Chí Minh, phẩm chất \"có ý thức làm chủ nhà nước\" của con người xã hội chủ nghĩa được hiểu như thế nào?","g":"Liên hệ \"ý thức làm chủ nhà nước\" với \"dân làm chủ\" và \"trách nhiệm của dân\" trong mục tiêu chính trị, cũng như các tư tưởng và tác phong cần bồi dưỡng.","x":"\"Ý thức làm chủ nhà nước\" là một trong những tư tưởng và tác phong mới mà mỗi người cần bồi dưỡng. Người đã khẳng định \"dân làm chủ\" không chỉ là quyền lợi mà còn là \"trách nhiệm của dân, sự nghiệp bảo vệ và xây dựng đất nước là công việc của dân\". Do đó, \"có ý thức làm chủ\" mang hàm ý về trách nhiệm và nghĩa vụ tham gia vào công cuộc chung, không chỉ là quyền lợi đơn thuần hay việc tham gia trực tiếp vào mọi quyết định.","p":[["A","Quyền được tham gia trực tiếp vào mọi quyết định của Nhà nước mà không cần thông qua đại diện."],["B","Tinh thần trách nhiệm và nghĩa vụ của người dân đối với sự nghiệp xây dựng và bảo vệ đất nước."],["C","Khả năng tự quản lý mọi hoạt động kinh tế mà không cần sự can thiệp của Nhà nước."],["D","Quyền lực cá nhân được đặt cao hơn quyền lực của Nhà nước và tập thể."],["E","Chỉ đơn thuần là việc bầu cử và ứng cử định kỳ."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":12,"q":"Hồ Chí Minh nhấn mạnh rằng Nhà nước xã hội chủ nghĩa phải đảm bảo quyền tự do dân chủ cho công dân, nhưng đồng thời cũng nghiêm cấm điều gì?","g":"Đọc kỹ phần mục tiêu về quan hệ xã hội và giới hạn của quyền tự do dân chủ.","x":"Mặc dù Nhà nước \"đảm bảo quyền tự do dân chủ cho công dân\", nhưng Người cũng chỉ rõ \"nghiêm cấm lợi dụng các quyền tự do dân chủ để xâm phạm đến lợi ích của Nhà nước, của nhân dân\".","p":[["A","Việc bày tỏ quan điểm cá nhân sai trái, bừa bãi."],["B","Lợi dụng các quyền tự do dân chủ để xâm phạm đến lợi ích của Nhà nước, của nhân dân."],["C","Việc tham gia vào các tổ chức chính trị - xã hội có hại cho quốc gia."],["D","Luôn phê bình đối với các cấp chính quyền bất kể đúng sai."],["E","Thực hiện quyền bầu cử và ứng cử nếu không đủ điều kiện công dân."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":13,"q":"Mục tiêu về kinh tế của chủ nghĩa xã hội ở Việt Nam theo tư tưởng Hồ Chí Minh bao gồm nhiều đặc điểm. Phương án nào sau đây KHÔNG phải là một đặc điểm của mục tiêu kinh tế đó?","g":"Xem xét mối quan hệ giữa mục tiêu kinh tế và chính trị.","x":"Mục tiêu kinh tế phải \"gắn bó mật thiết với mục tiêu về chính trị\". Người khẳng định: “Chế độ kinh tế và xã hội của chúng ta nhằm thực hiện đầy đủ quyền dân chủ của nhân dân, trên cơ sở kinh tế xã hội chủ nghĩa ngày càng phát triển\". Do đó, việc tách rời mục tiêu kinh tế khỏi chính trị là sai.","p":[["A","Nền kinh tế phát triển cao với công nghiệp và nông nghiệp hiện đại."],["B","Khoa học và kỹ thuật tiên tiến."],["C","Nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu tập thể."],["D","Hoàn toàn tách rời mục tiêu về chính trị, hoạt động độc lập."],["E","Kinh tế quốc doanh lãnh đạo nền kinh tế quốc dân và được Nhà nước bảo đảm phát triển ưu tiên."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":14,"q":"Theo Hồ Chí Minh, để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng, cần thực hiện nhiều nhiệm vụ. Nhiệm vụ nào sau đây KHÔNG phù hợp với tư tưởng của Người?","g":"Đọc kỹ các yêu cầu để xây dựng nền văn hóa Việt Nam được nêu trong tài liệu.","x":"Người rõ ràng chủ trương \"phát triển những truyền thống tốt đẹp của văn hóa dân tộc\", điều này mâu thuẫn với việc \"tạo ra một nền văn hóa hoàn toàn mới, không dựa trên bất kỳ nền tảng nào của quá khứ\".","p":[["A","Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc."],["B","Phát triển những truyền thống tốt đẹp của văn hóa dân tộc."],["C","Hấp thụ những cái mới của văn hóa tiến bộ thế giới."],["D","Tạo ra một nền văn hóa hoàn toàn mới, không dựa trên bất kỳ nền tảng nào của quá khứ."],["E","Văn hóa phải xã hội chủ nghĩa về nội dung và dân tộc về hình thức."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":15,"q":"Các quyền tự do dân chủ cơ bản của nhân dân được Nhà nước bảo đảm trong chủ nghĩa xã hội, theo tư tưởng Hồ Chí Minh, bao gồm nhiều khía cạnh. Khía cạnh nào sau đây KHÔNG được Người trực tiếp đề cập trong tài liệu?","g":"Xem xét các quyền của nhân dân được liệt kê trong mục tiêu về quan hệ xã hội.","x":"Tài liệu chỉ rõ nhân dân \"có quyền làm việc; có quyền nghỉ ngơi; có quyền học tập; có quyền tự do thân thể; có quyền tự do ngôn luận, báo chí, hội họp, lập hội, biểu tình; có quyền tự do tín ngưỡng, theo hoặc không theo một tôn giáo nào; có quyền bầu cử, ứng cử\". Không có đề cập đến quyền được hưởng phúc lợi xã hội tối thiểu không cần lao động, mà nhấn mạnh quyền làm việc và trách nhiệm xây dựng đất nước.","p":[["A","Có quyền làm việc, nghỉ ngơi, học tập."],["B","Có quyền tự do thân thể, tự do ngôn luận, báo chí."],["C","Có quyền tự do hội họp, lập hội, biểu tình."],["D","Có quyền tự do tín ngưỡng, theo hoặc không theo một tôn giáo nào."],["E","Có quyền được hưởng phúc lợi xã hội tối thiểu không cần phải lao động."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":16,"q":"Để thúc đẩy tiến trình cách mạng xã hội chủ nghĩa, Hồ Chí Minh đã chỉ ra nhiều động lực quan trọng. Động lực nào sau đây KHÔNG được Người xếp vào nhóm những động lực hàng đầu của chủ nghĩa xã hội?","g":"Nhớ lại các động lực hàng đầu được Người nhấn mạnh.","x":"Hồ Chí Minh khẳng định \"để thúc đẩy tiến trình cách mạng xã hội chủ nghĩa phải bảo đảm lợi ích của dân, dân chủ của dân, sức mạnh đoàn kết toàn dân. Trong tư tưởng Hồ Chí Minh, đây là những động lực hàng đầu của chủ nghĩa xã hội\". Sự hỗ trợ kinh tế từ bên ngoài có thể thuộc \"ngoại lực\" nhưng không được Người xếp vào nhóm \"động lực hàng đầu\".","p":[["A","Lợi ích của dân."],["B","Dân chủ của dân."],["C","Sức mạnh đoàn kết toàn dân."],["D","Sự hỗ trợ kinh tế từ các nước bạn bè quốc tế."],["E","Cả A, B, C đều là động lực hàng đầu."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Theo tư tưởng Hồ Chí Minh, các tổ chức như Đảng Cộng sản, Nhà nước, và các tổ chức chính trị - xã hội trong hệ thống động lực của chủ nghĩa xã hội có những vai trò và đặc điểm nhất định. Đặc điểm nào sau đây KHÔNG đúng với tư tưởng của Người?","g":"Xem xét mối quan hệ giữa Đảng, Nhà nước và các tổ chức quần chúng.","x":"Các tổ chức chính trị - xã hội \"tuy có những nội dung và phương thức hoạt động khác nhau nhưng đều nhất quán về chính trị và tư tưởng dưới sự lãnh đạo của Đảng, quản lý của Nhà nước\". Do đó, việc hoạt động hoàn toàn độc lập là sai.","p":[["A","Đảng Cộng sản giữ vai trò quyết định trong sự lãnh đạo."],["B","Nhà nước thực hiện chức năng quản lý xã hội, biến đường lối của Đảng thành hiện thực."],["C","Các tổ chức chính trị - xã hội hoạt động hoàn toàn độc lập với sự lãnh đạo của Đảng và quản lý của Nhà nước."],["D","Các tổ chức chính trị - xã hội nhất quán về chính trị và tư tưởng dưới sự lãnh đạo của Đảng, quản lý của Nhà nước."],["E","Các tổ chức này hoạt động vì lợi ích của các thành viên nhưng phải thống nhất với lợi ích của dân tộc."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":18,"q":"Tư tưởng và tác phong xấu cần phải chống lại ở con người xã hội chủ nghĩa, theo Hồ Chí Minh, bao gồm nhiều biểu hiện. Biểu hiện nào sau đây KHÔNG được Người trực tiếp đề cập trong tài liệu?","g":"Nhớ lại danh sách các tư tưởng và tác phong xấu cần chống.","x":"Hồ Chí Minh đã liệt kê các tư tưởng và tác phong xấu cần chống lại là: \"Chủ nghĩa cá nhân; quan liêu, mệnh lệnh; tham ô, lãng phí; bảo thủ, rụt rè\". Người không đề cập đến việc chống lại \"tính sáng tạo cá nhân vượt quá khuôn khổ tập thể\"; ngược lại, Người nhấn mạnh sự lao động sáng tạo của quần chúng.","p":[["A","Chủ nghĩa cá nhân."],["B","Quan liêu, mệnh lệnh."],["C","Tham ô, lãng phí."],["D","Bảo thủ, rụt rè."],["E","Tính sáng tạo cá nhân vượt quá khuôn khổ tập thể."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":25,"q":"Hồ Chí Minh khẳng định mục tiêu về chế độ chính trị của chủ nghĩa xã hội ở Việt Nam là \"Chế độ ta là chế độ dân chủ. Tức là nhân dân _______\".","g":"Nhớ lại câu nói trực tiếp của Hồ Chí Minh về bản chất của chế độ dân chủ.","x":"Trích dẫn trực tiếp từ tài liệu: \"Chế độ ta là chế độ dân chủ. Tức là nhân dân làm chủ”1\".","p":[["A","là chủ"],["B","làm chủ"],["C","quản lý"],["D","tự quyết"],["E","lãnh đạo"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":26,"q":"Mục tiêu về kinh tế của chủ nghĩa xã hội ở Việt Nam được Hồ Chí Minh xác định là \"một nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu _______\".","g":"Nhớ lại các hình thức sở hữu được đề cập trong mục tiêu kinh tế XHCN.","x":"Trích dẫn trực tiếp từ tài liệu: \"một nền kinh tế thuần nhất, dựa trên chế độ sở hữu toàn dân và sở hữu tập thể”.","p":[["A","cá nhân"],["B","tập thể"],["C","hỗn hợp"],["D","Nhà nước"],["E","tư nhân"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":27,"q":"Về vai trò của văn hóa, Hồ Chí Minh khẳng định: \"Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển _______. Nâng cao trình độ văn hóa của nhân dân cũng là một việc làm cần thiết để xây dựng nước ta thành một nước hòa bình, thống nhất độc lập, dân chủ và giàu mạnh”.","g":"Chú ý đến mục tiêu chính trị và các mặt phát triển đồng bộ.","x":"Trích dẫn trực tiếp từ tài liệu: \"Trình độ văn hóa của nhân dân nâng cao sẽ giúp chúng ta đẩy mạnh công cuộc khôi phục kinh tế, phát triển dân chủ\".","p":[["A","khoa học"],["B","công nghệ"],["C","dân chủ"],["D","xã hội"],["E","sản xuất"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":28,"q":"Theo Hồ Chí Minh, để thúc đẩy tiến trình cách mạng xã hội chủ nghĩa, \"phải bảo đảm lợi ích của dân, dân chủ của dân, sức mạnh _______ toàn dân\".","g":"Nhớ lại ba động lực hàng đầu của chủ nghĩa xã hội.","x":"Trích dẫn trực tiếp từ tài liệu: \"phải bảo đảm lợi ích của dân, dân chủ của dân, sức mạnh đoàn kết toàn dân\".","p":[["A","hợp tác"],["B","thống nhất"],["C","đoàn kết"],["D","phát triển"],["E","sáng tạo"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":29,"q":"Hồ Chí Minh nhận thấy trong xã hội xã hội chủ nghĩa mỗi người giữ một vị trí nhất định, đóng góp một phần công lao nhất định vì nhân dân lao động đã thoát khỏi bần cùng, có công ăn việc làm, có cuộc sống ấm no, hạnh phúc, nên ngay từ những ngày đầu xây dựng chế độ xã hội mới, Người đã dạy: “việc gì có lợi cho dân phải hết sức làm, việc gì có hại cho dân phải hết sức _______”.","g":"Nhớ lại lời dặn của Bác về việc làm và tránh cho dân.","x":"Trích dẫn trực tiếp từ tài liệu: “việc gì có lợi cho dân phải hết sức làm, việc gì có hại cho dân phải hết sức tránh”.","p":[["A","loại bỏ"],["B","ngăn cản"],["C","tránh"],["D","phê phán"],["E","hạn chế"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Trong tư tưởng Hồ Chí Minh, quan điểm “xây” đi đôi với “chống” cũng là một trong những quan điểm _______ tư tưởng Hồ Chí Minh, là một trong những nét đặc sắc của tư tưởng Hồ Chí Minh.","g":"Chú ý đến tính chất lâu dài và bao trùm của quan điểm này.","x":"Trích dẫn trực tiếp từ tài liệu: \"quan điểm “xây” đi đôi với “chống” cũng là một trong những quan điểm xuyên suốt tư tưởng Hồ Chí Minh\".","p":[["A","cơ bản"],["B","cốt lõi"],["C","xuyên suốt"],["D","mới mẻ"],["E","chủ yếu"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"}]},"07":{"ten":"Tính tất yếu, vai trò của Đảng","ds":[{"s":1,"q":"Theo tư tưởng Hồ Chí Minh, vai trò lãnh đạo của Đảng Cộng sản Việt Nam chỉ là một yếu tố hỗ trợ, không mang tính quyết định đến thành công của cách mạng Việt Nam.","g":"Hãy xem xét hình ảnh \"người cầm lái\" và tính \"tất yếu\" của sự lãnh đạo Đảng được Hồ Chí Minh khẳng định trong các tài liệu.","x":"Tài liệu khẳng định Hồ Chí Minh ví Đảng cộng sản \"như người cầm lái\" và nhấn mạnh \"Đảng có vững, cách mệnh mới thành công\", thể hiện vai trò quyết định. Tài liệu cũng khẳng định sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu. Do đó, việc cho rằng vai trò này chỉ là yếu tố hỗ trợ là không chính xác.","d":0},{"s":2,"q":"Lý luận về sự ra đời của đảng cộng sản kiểu mới theo V.I. Lênin chỉ áp dụng nguyên bản, không cần vận dụng sáng tạo vào điều kiện cụ thể của Việt Nam để hình thành Đảng Cộng sản Việt Nam.","g":"Hãy chú ý đến cách Hồ Chí Minh tiếp thu và phát triển học thuyết Mác - Lênin trong bối cảnh Việt Nam.","x":"Tài liệu nêu rõ Hồ Chí Minh \"trung thành với học thuyết Mác - Lênin... đồng thời vận dụng sáng tạo và phát triển lý luận đó vào điều kiện cụ thể của Việt Nam\". Điều này phủ nhận quan điểm chỉ áp dụng nguyên bản mà không có sự vận dụng sáng tạo.","d":0},{"s":3,"q":"Mâu thuẫn cơ bản nhất trong xã hội thuộc địa và phong kiến Việt Nam, tạo tiền đề cho sự ra đời của Đảng Cộng sản Việt Nam, chủ yếu là mâu thuẫn giữa giai cấp vô sản và giai cấp tư sản.","g":"Xem xét bản chất xã hội Việt Nam thời kỳ đó và đối tượng mà nhân dân Việt Nam phải đấu tranh được các tài liệu đề cập.","x":"Tài liệu chỉ rõ \"mâu thuẫn cơ bản giữa toàn thể nhân dân Việt Nam với các thế lực đế quốc và tay sai\". Mặc dù có đấu tranh giai cấp, nhưng mâu thuẫn dân tộc là bao trùm và cơ bản nhất trong bối cảnh xã hội thuộc địa và phong kiến Việt Nam.","d":0},{"s":4,"q":"Tổ chức Hội Việt Nam Cách mệnh Thanh niên do Hồ Chí Minh lập ra đã góp phần vào sự chuyển biến xu hướng của một số người yêu nước từ dân chủ tư sản sang cộng sản rõ nhất từ năm 1925.","g":"Xem xét vai trò của Hội Việt Nam Cách mệnh Thanh niên và thời điểm chuyển biến các xu hướng yêu nước được nhắc đến trong tài liệu.","x":"Tài liệu chỉ rõ \"Một số người Việt Nam yêu nước lúc đầu đi theo xu hướng dân chủ tư sản, nhưng qua thực tế, dưới sự ảnh hưởng của chủ nghĩa Mác – Lênin, đã dần dần chuyển sang xu hướng cộng sản, rõ nhất là từ năm 1925 trở đi. Hàng loạt tổ chức yêu nước ra đời, trong đó tiêu biểu nhất là tổ chức Hội Việt Nam Cách mệnh Thanh niên do Hồ Chí Minh lập ra.\" Điều này khẳng định vai trò của tổ chức này trong sự chuyển biến xu hướng.","d":1},{"s":21,"q":"Theo Tài liệu môn học, Hồ Chí Minh khẳng định cách mạng “Trước hết phải có đảng cách mệnh” trong tác phẩm Đường cách mệnh (năm 1927).","g":"Hãy nhớ lại tên tác phẩm và mốc thời gian được nêu ở câu mở đầu mục “Tính tất yếu và vai trò lãnh đạo của Đảng Cộng sản Việt Nam”.","x":"Tài liệu môn học ghi: “Trong tác phẩm Đường cách mệnh (năm 1927), Hồ Chí Minh khẳng định: Cách mạng ‘Trước hết phải có đảng cách mệnh’.” Nhận định trên đúng cả về tác phẩm lẫn thời điểm.","d":1},{"s":22,"q":"Theo Tài liệu môn học, trong thực tế ở Việt Nam trước khi Đảng ra đời, phong trào đấu tranh của công nhân phát triển tách biệt, không kết hợp với phong trào yêu nước.","g":"Hãy nhớ lại Tài liệu môn học mô tả mối quan hệ giữa phong trào công nhân và phong trào yêu nước ở Việt Nam như thế nào.","x":"Tài liệu môn học ghi: “Trong thực tế, những phong trào đấu tranh của công nhân đã kết hợp được rất nhuần nhuyễn với phong trào yêu nước.” Vì vậy, nhận định cho rằng hai phong trào phát triển tách biệt là sai.","d":0}],"tn":[{"s":5,"q":"Theo các tài liệu, đâu là yếu tố cốt lõi nhất giải thích tính tất yếu của sự lãnh đạo Đảng Cộng sản Việt Nam trong quá trình phát triển của đất nước theo mục tiêu chủ nghĩa xã hội?","g":"Tìm lý do sâu xa nhất, mang tính bản chất được tài liệu đề cập cho \"tính tất yếu\" này.","x":"Tài liệu nêu rõ \"sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu, vai trò lãnh đạo của Đảng cũng là một tất yếu – điều đó xuất phát từ yêu cầu phát triển của dân tộc Việt Nam\". Các lựa chọn khác có thể là yếu tố góp phần hoặc hệ quả, nhưng \"yêu cầu phát triển của dân tộc Việt Nam\" là lý do cốt lõi nhất được đề cập trực tiếp.","p":[["A","Khả năng tập hợp quần chúng của Hồ Chí Minh."],["B","Sự tiên phong của giai cấp công nhân."],["C","Yêu cầu phát triển nội tại của dân tộc Việt Nam."],["D","Sự can thiệp và hỗ trợ từ các nước xã hội chủ nghĩa khác."],["E","Tính ưu việt của mô hình đảng kiểu mới theo V.I. Lênin."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":6,"q":"Điểm khác biệt cơ bản trong sự ra đời của Đảng Cộng sản Việt Nam so với lý luận chung của Mác - Lênin về đảng cộng sản được các tài liệu nhấn mạnh là gì?","g":"So sánh công thức chung của Mác - Lênin với công thức đặc thù của Việt Nam được trình bày trong các tài liệu.","x":"Tài liệu chỉ ra: học thuyết Mác - Lênin cho rằng đảng cộng sản là sản phẩm của \"chủ nghĩa xã hội khoa học với phong trào công nhân\". Trong khi đó, sự ra đời của Đảng Cộng sản Việt Nam là \"kết quả của sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước\". Yếu tố \"phong trào yêu nước\" là điểm khác biệt được nhấn mạnh trong bối cảnh Việt Nam.","p":[["A","Sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân."],["B","Sự lãnh đạo của một nhà cách mạng kiệt xuất như Hồ Chí Minh."],["C","Sự kết hợp thêm yếu tố phong trào yêu nước."],["D","Việc vận dụng các nguyên tắc của đảng kiểu mới."],["E","Mục tiêu đấu tranh giành độc lập dân tộc."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":7,"q":"Điều nào sau đây phản ánh chính xác nhất nhận định của Hồ Chí Minh về vai trò của Đảng đối với cách mạng trong tác phẩm Đường cách mệnh?","g":"Hãy tìm cụm từ ví von đặc trưng mà Hồ Chí Minh dùng để mô tả vai trò của Đảng được trích dẫn trong tài liệu.","x":"Tài liệu trích dẫn Hồ Chí Minh khẳng định đảng cộng sản \"như người cầm lái\" cho con thuyền cách mạng và khẳng định đây là quan điểm nhất quán của Người. Các lựa chọn khác không phản ánh cụm từ đặc trưng và ý nghĩa cốt lõi này.","p":[["A","Đảng là người tổ chức các cuộc đàm phán quốc tế."],["B","Đảng là trung tâm đào tạo cán bộ chính trị cấp cao."],["C","Đảng là \"người cầm lái\" vững chắc cho con thuyền cách mạng."],["D","Đảng đóng vai trò là cơ quan lập pháp tối cao."],["E","Đảng chủ yếu tập trung vào việc phát triển kinh tế."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Theo các tài liệu, sự chuyển biến tư tưởng từ xu hướng dân chủ tư sản sang xu hướng cộng sản trong các phong trào yêu nước ở Việt Nam từ năm 1925 chủ yếu chịu ảnh hưởng bởi yếu tố nào?","g":"Tìm nguyên nhân trực tiếp dẫn đến sự thay đổi xu hướng tư tưởng trong các phong trào yêu nước được đề cập trong tài liệu.","x":"Tài liệu cho biết \"Một số người Việt Nam yêu nước lúc đầu đi theo xu hướng dân chủ tư sản, nhưng qua thực tế, dưới sự ảnh hưởng của chủ nghĩa Mác – Lênin, đã dần dần chuyển sang xu hướng cộng sản, rõ nhất là từ năm 1925 trở đi.\" Điều này nhấn mạnh vai trò của chủ nghĩa Mác – Lênin kết hợp với thực tiễn đấu tranh.","p":[["A","Sự thất bại của các phong trào nông dân."],["B","Ảnh hưởng trực tiếp từ các cuộc cách mạng tư sản phương Tây."],["C","Sự ra đời của các phong trào công nhân độc lập."],["D","Tác động của chủ nghĩa Mác – Lênin và thực tiễn đấu tranh."],["E","Sự hỗ trợ quân sự từ Liên Xô."]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Phát biểu nào sau đây không đúng về bối cảnh xã hội Việt Nam tạo tiền đề cho sự ra đời của Đảng Cộng sản Việt Nam?","g":"Hãy đọc kỹ phần mô tả về các giai cấp và mâu thuẫn dân tộc trong xã hội Việt Nam thời bấy giờ.","x":"Tài liệu khẳng định trong xã hội thuộc địa và phong kiến Việt Nam, \"mọi giai cấp, tầng lớp, trừ tư sản mại bản và đại địa chủ, đều có mâu thuẫn dân tộc\". Điều này ngụ ý rằng tư sản mại bản và đại địa chủ không có mâu thuẫn dân tộc và do đó không tham gia vào phong trào đấu tranh dân tộc, làm cho phát biểu C không đúng.","p":[["A","Là một xã hội thuộc địa và phong kiến."],["B","Tồn tại mâu thuẫn cơ bản giữa toàn thể nhân dân Việt Nam với các thế lực đế quốc và tay sai."],["C","Giai cấp tư sản mại bản và đại địa chủ cũng tham gia vào phong trào đấu tranh dân tộc."],["D","Các phong trào đấu tranh của công nhân đã kết hợp nhuần nhuyễn với phong trào yêu nước."],["E","Các tổ chức yêu nước đã ra đời và phát triển mạnh mẽ."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":10,"q":"Điều nào sau đây không phản ánh quan điểm của Hồ Chí Minh về Đảng Cộng sản Việt Nam dựa trên các tài liệu đã cho?","g":"Đọc kỹ về sự hòa quyện giữa đấu tranh giai cấp và dân tộc trong bối cảnh Việt Nam được tài liệu đề cập.","x":"Tài liệu chỉ rõ \"Đấu tranh giai cấp hòa quyện với đấu tranh dân tộc.\" Quan điểm này cho thấy Đảng không tách rời hai loại đấu tranh này, mà ngược lại, kết hợp chúng. Do đó, phát biểu C không phản ánh đúng quan điểm của Hồ Chí Minh.","p":[["A","Đảng được sáng lập và rèn luyện bởi Hồ Chí Minh."],["B","Đảng tồn tại và phát triển theo quan điểm của V.I. Lênin về đảng kiểu mới."],["C","Đảng chỉ tập trung vào đấu tranh giai cấp, tách rời đấu tranh dân tộc."],["D","Đảng có vai trò \"người cầm lái\" cho con thuyền cách mạng."],["E","Đảng đảm bảo, phát huy vai trò lãnh đạo theo mục tiêu chủ nghĩa xã hội."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":11,"q":"Theo các tài liệu, sự ra đời của Đảng Cộng sản Việt Nam không phải là hệ quả trực tiếp từ yếu tố nào sau đây?","g":"Xem xét các yếu tố được liệt kê là nguyên nhân trực tiếp dẫn đến sự ra đời của Đảng và những giai cấp được đề cập trong tài liệu.","x":"Tài liệu và cho thấy giai cấp tư sản mại bản và đại địa chủ không có mâu thuẫn dân tộc, và các phong trào yêu nước ban đầu theo xu hướng dân chủ tư sản đã dần chuyển sang cộng sản vì thiếu một con đường đúng đắn. Tài liệu không hề đề cập đến việc xuất hiện một lực lượng tư sản dân tộc đủ mạnh để lãnh đạo cách mạng, mà ngược lại, sự chuyển hướng sang cộng sản chứng tỏ điều ngược lại. Các lựa chọn A, B, C, D đều được đề cập là yếu tố cấu thành hoặc hệ quả của sự ra đời của Đảng.","p":[["A","Nhu cầu tất yếu của xã hội Việt Nam từ đầu năm 1930."],["B","Sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân."],["C","Việc toàn dân tộc trao cho sứ mệnh lãnh đạo đất nước."],["D","Sự kết hợp chủ nghĩa Mác - Lênin với phong trào yêu nước."],["E","Sự xuất hiện của một lực lượng tư sản dân tộc đủ mạnh để lãnh đạo cách mạng."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":12,"q":"Phát biểu nào dưới đây không đúng khi nói về quá trình vận dụng và phát triển tư tưởng Hồ Chí Minh về vai trò lãnh đạo của Đảng Cộng sản Việt Nam?","g":"Chú ý đến phạm vi áp dụng của vai trò lãnh đạo Đảng theo Hồ Chí Minh được các tài liệu diễn giải.","x":"Tài liệu khẳng định quan điểm về vai trò lãnh đạo của Đảng là \"nhất quán của Hồ Chí Minh... trong suốt quá trình cách mạng, cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa.\" Điều này mâu thuẫn với phát biểu B rằng vai trò này chỉ mới được khẳng định trong cách mạng xã hội chủ nghĩa.","p":[["A","Quá trình vận dụng này đã chỉ ra sự lãnh đạo của Đảng là một nguyên tắc vận hành của xã hội Việt Nam."],["B","Vai trò lãnh đạo của Đảng chỉ mới được khẳng định trong cách mạng xã hội chủ nghĩa."],["C","Quan điểm về \"người cầm lái\" là nhất quán trong suốt quá trình cách mạng."],["D","Mục tiêu phát triển đất nước theo chủ nghĩa xã hội là trọng tâm."],["E","Đảm bảo và phát huy vai trò lãnh đạo của Đảng là một điều tất yếu."]],"d":"B","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Hồ Chí Minh khẳng định: Cách mạng \"Trước hết phải có đảng cách mệnh, để trong thì vận động và tổ chức dân chúng, ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp mọi nơi. Đảng có vững, cách mệnh mới thành công, cũng như người _______ có vững thuyền mới chạy”.","g":"Hãy tìm từ ngữ so sánh trực tiếp mà Hồ Chí Minh sử dụng trong câu gốc được trích dẫn.","x":"Tài liệu trực tiếp trích dẫn Hồ Chí Minh: \"Đảng có vững, cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy”.","p":[["A","kiến trúc sư"],["B","chỉ huy"],["C","cầm lái"],["D","tiên phong"],["E","dẫn đường"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":18,"q":"Sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu, vai trò lãnh đạo của Đảng cũng là một tất yếu – điều đó xuất phát từ _______ của dân tộc Việt Nam.","g":"Tìm cụm từ chính xác được dùng để mô tả nguồn gốc của tính tất yếu này trong tài liệu.","x":"Tài liệu nêu rõ \"sự lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu... điều đó xuất phát từ yêu cầu phát triển của dân tộc Việt Nam.\"","p":[["A","truyền thống lịch sử"],["B","ý chí chính trị"],["C","yêu cầu phát triển"],["D","khát vọng cường thịnh"],["E","nền tảng văn hóa"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":19,"q":"Quan điểm của Hồ Chí Minh về sự ra đời của Đảng hoàn toàn phù hợp với xã hội _______ và phong kiến như Việt Nam, khi mọi giai cấp, tầng lớp, trừ tư sản mại bản và đại địa chủ, đều có mâu thuẫn dân tộc.","g":"Nhớ lại đặc điểm chính của xã hội Việt Nam dưới ách thống trị thời điểm đó được tài liệu mô tả.","x":"Tài liệu khẳng định \"Quan điểm của Hồ Chí Minh hoàn toàn phù hợp với xã hội thuộc địa và phong kiến như Việt Nam\".","p":[["A","phong kiến"],["B","thuộc địa"],["C","công nghiệp"],["D","dân chủ"],["E","tư bản"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":20,"q":"Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập và rèn luyện là một đảng chính trị tồn tại và phát triển theo những quan điểm của V.I. Lênin về đảng _______ của giai cấp vô sản.","g":"Ghi nhớ cụm từ đặc trưng mà V.I. Lênin sử dụng để mô tả đảng của giai cấp vô sản được đề cập trong tài liệu.","x":"Tài liệu nêu rõ Đảng Cộng sản Việt Nam \"tồn tại và phát triển theo những quan điểm của V.I.Lênin về đảng kiểu mới của giai cấp vô sản.\"","p":[["A","kiểu mẫu"],["B","kiểu mới"],["C","tiền phong"],["D","trung tâm"],["E","cách mạng"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":23,"q":"Theo Tài liệu môn học, học thuyết Mác - Lênin cho rằng sự ra đời của đảng cộng sản là sản phẩm của sự kết hợp giữa những yếu tố nào?","g":"Hãy phân biệt công thức chung của học thuyết Mác - Lênin với nhận định riêng của Hồ Chí Minh đối với Việt Nam.","x":"Tài liệu môn học ghi: “Học thuyết Mác - Lênin cho rằng, sự ra đời của đảng cộng sản là sản phẩm của sự kết hợp của chủ nghĩa xã hội khoa học với phong trào công nhân.” Yếu tố phong trào yêu nước thuộc nhận định của Hồ Chí Minh đối với riêng Việt Nam, không nằm trong công thức chung của học thuyết Mác - Lênin, nên phương án C không đúng.","p":[["A","Chủ nghĩa Mác - Lênin với phong trào yêu nước."],["B","Chủ nghĩa xã hội khoa học với phong trào công nhân."],["C","Chủ nghĩa xã hội khoa học với phong trào công nhân và phong trào yêu nước."],["D","Phong trào công nhân với phong trào nông dân."],["E","Chủ nghĩa yêu nước với chủ nghĩa quốc tế vô sản."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":24,"q":"Theo Tài liệu môn học, toàn dân tộc đã trao cho Đảng Cộng sản Việt Nam sứ mệnh gì?","g":"Hãy chú ý đến câu kết của mục “Tính tất yếu và vai trò lãnh đạo của Đảng Cộng sản Việt Nam” và phạm vi của sứ mệnh được nêu ở đó.","x":"Tài liệu môn học ghi: “Đảng đã được toàn dân tộc trao cho sứ mệnh lãnh đạo đất nước trong sự nghiệp giải phóng dân tộc và đi lên chủ nghĩa xã hội.” Sứ mệnh bao gồm cả giải phóng dân tộc và đi lên chủ nghĩa xã hội, nên phương án A, B (chỉ một chặng) cũng như C, D đều không đúng.","p":[["A","Lãnh đạo đất nước chỉ trong sự nghiệp giải phóng dân tộc."],["B","Lãnh đạo đất nước chỉ trong công cuộc xây dựng chủ nghĩa xã hội sau khi đã giành được độc lập."],["C","Đại diện riêng cho lợi ích của giai cấp công nhân trong cuộc đấu tranh giai cấp."],["D","Thay mặt Quốc tế Cộng sản chỉ đạo phong trào cách mạng ở các nước thuộc địa."],["E","Lãnh đạo đất nước trong sự nghiệp giải phóng dân tộc và đi lên chủ nghĩa xã hội."]],"d":"E","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":25,"q":"Theo Tài liệu môn học, nhận định nào sau đây không đúng về Đảng Cộng sản Việt Nam?","g":"Hãy đối chiếu từng nhận định với đoạn Tài liệu môn học nói về người sáng lập và nền tảng lý luận của Đảng.","x":"Tài liệu môn học ghi: “Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập và rèn luyện là một đảng chính trị tồn tại và phát triển theo những quan điểm của V.I. Lênin về đảng kiểu mới của giai cấp vô sản.” Người sáng lập và rèn luyện Đảng là Hồ Chí Minh, nên phương án A không đúng; các nhận định B, C, D, E đều được Tài liệu môn học khẳng định.","p":[["A","Đảng Cộng sản Việt Nam do Quốc tế Cộng sản trực tiếp sáng lập và rèn luyện."],["B","Sự lãnh đạo của Đảng là một tất yếu, xuất phát từ yêu cầu phát triển của dân tộc Việt Nam."],["C","Khẳng định Đảng “như người cầm lái” là quan điểm nhất quán của Hồ Chí Minh cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa."],["D","Quan điểm của Hồ Chí Minh về sự ra đời của Đảng hoàn toàn phù hợp với xã hội thuộc địa và phong kiến như Việt Nam."],["E","Sự ra đời của Đảng là kết quả của sự kết hợp chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước."]],"d":"A","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":26,"q":"Theo Tài liệu môn học, nhận định nào sau đây không đúng về các phong trào đấu tranh ở Việt Nam trước khi Đảng Cộng sản Việt Nam ra đời?","g":"Hãy đọc kỹ câu Tài liệu môn học so sánh các phong trào: chúng giống nhau ở điểm nào, khác nhau ở điểm nào.","x":"Tài liệu môn học ghi: “Các phong trào đó tuy khác nhau về lực lượng, phương thức, khẩu hiệu đấu tranh nhưng cùng chung mục tiêu giành độc lập, tự do cho dân tộc.” Các phong trào khác nhau (chứ không thống nhất) về lực lượng, phương thức, khẩu hiệu đấu tranh, nên phương án D không đúng.","p":[["A","Đấu tranh giai cấp hòa quyện với đấu tranh dân tộc."],["B","Một số người Việt Nam yêu nước lúc đầu đi theo xu hướng dân chủ tư sản, sau đó dần dần chuyển sang xu hướng cộng sản."],["C","Hàng loạt tổ chức yêu nước ra đời, trong đó tiêu biểu nhất là Hội Việt Nam Cách mạng Thanh niên do Hồ Chí Minh lập ra."],["D","Các phong trào đã thống nhất với nhau về lực lượng, phương thức và khẩu hiệu đấu tranh."],["E","Các phong trào cùng chung mục tiêu giành độc lập, tự do cho dân tộc."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":29,"q":"Trong tác phẩm Đường cách mệnh, Hồ Chí Minh viết: “Đảng có vững, cách mệnh mới _______, cũng như người cầm lái có vững thuyền mới chạy”.","g":"Hãy nghĩ đến kết quả cuối cùng của cách mạng mà Hồ Chí Minh đặt điều kiện “Đảng có vững”.","x":"Tài liệu môn học ghi: “Đảng có vững, cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy”. Câu nói khẳng định Đảng vững mạnh là điều kiện để cách mạng thành công.","p":[["A","bền lâu"],["B","lan rộng"],["C","mạnh mẽ"],["D","thành công"],["E","hòa bình"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Theo Tài liệu môn học, Đảng Cộng sản Việt Nam ra đời, tồn tại và phát triển chính là do _______ của xã hội Việt Nam từ đầu năm 1930 trở đi.","g":"Hãy nhớ lại câu Tài liệu môn học dùng để kết luận về nguồn gốc xã hội của sự ra đời Đảng, ngay trước câu nói về sứ mệnh của Đảng.","x":"Tài liệu môn học ghi: “Đảng Cộng sản Việt Nam ra đời, tồn tại và phát triển chính là do nhu cầu tất yếu của xã hội Việt Nam từ đầu năm 1930 trở đi.”","p":[["A","nhu cầu tất yếu"],["B","sự áp đặt từ bên ngoài"],["C","ý muốn chủ quan"],["D","sự ngẫu nhiên lịch sử"],["E","sức ép của chính quyền thực dân"]],"d":"A","k":"Chọn cụm từ điền vào chỗ trống"}]},"08":{"ten":"Đảng trong sạch, vững mạnh","ds":[{"s":1,"q":"Tư tưởng Hồ Chí Minh khẳng định Đảng Cộng sản Việt Nam ra đời là một tất yếu lịch sử, phù hợp với quy luật phát triển văn minh, tiến bộ của dân tộc và nhân loại, nhưng không nhất thiết mọi hoạt động của Đảng đều phải xuất phát từ yêu cầu phát triển của dân tộc.","g":"Xem xét quan điểm của Hồ Chí Minh về sự ra đời và mục đích hoạt động của Đảng văn minh, đặc biệt là mối quan hệ giữa lợi ích Đảng và lợi ích dân tộc.","x":"Theo Tài liệu môn học, \"Đảng ra đời là một tất yếu, phù hợp với quy luật phát triển văn minh, tiến bộ của dân tộc và của nhân loại. Mọi hoạt động của Đảng đều xuất phát từ yêu cầu phát triển của dân tộc, lấy lợi ích tối cao của dân tộc làm trọng, mọi lợi ích giai cấp đều phải đặt dưới sự phát triển của dân tộc; mọi hoạt động của Đảng đều phải phù hợp với quy luật vận động của xã hội Việt Nam\". Do đó, việc nói rằng \"không nhất thiết mọi hoạt động của Đảng đều phải xuất phát từ yêu cầu phát triển của dân tộc\" là không chính xác.","d":0},{"s":2,"q":"Hồ Chí Minh xem tự phê bình và phê bình là \"thang thuốc\" tốt nhất để củng cố sự đoàn kết và thống nhất trong Đảng, nhưng không phải lúc nào cũng cần phải trung thực, kiên quyết vì có thể ảnh hưởng đến tình đồng chí.","g":"Đọc kỹ quan điểm của Hồ Chí Minh về phương pháp và mục đích của tự phê bình và phê bình, đặc biệt là các yêu cầu về tính chất của hoạt động này.","x":"Tài liệu môn học nêu rõ: \"tự phê bình và phê bình phải trung thực, kiên quyết, đúng người, đúng việc, phải có văn hoá…\". Đồng thời, Người cũng nhấn mạnh: \"Trong Đảng thực hành dân chủ rộng rãi, thường xuyên và nghiêm chỉnh tự phê bình và phê bình là cách tốt nhất để củng cố sự đoàn kết và thống nhất trong Đảng. Phải có tình đồng chí thương yêu lẫn nhau\". Tức là, tính trung thực, kiên quyết không mâu thuẫn mà còn là điều kiện để củng cố đoàn kết, thống nhất trên nền tảng tình đồng chí.","d":0},{"s":3,"q":"Theo Hồ Chí Minh, Đảng Cộng sản Việt Nam là đội tiên phong của giai cấp công nhân và nhân dân lao động, nhưng không nhất thiết phải là hiện thân của văn hóa dân tộc.","g":"Xem xét vai trò và sứ mệnh toàn diện của Đảng trong tư tưởng Hồ Chí Minh, đặc biệt là mối liên hệ với văn hóa dân tộc.","x":"Tài liệu môn học khẳng định: \"Hồ Chí Minh ý thức được rằng, Đảng Cộng sản Việt Nam nhất thiết phải là hiện thân của văn hóa dân tộc vì Đảng là đội tiên phong không những của giai cấp công nhân mà còn là đội tiên phong của nhân dân lao động và của dân tộc\". Do đó, nhận định rằng Đảng không nhất thiết phải là hiện thân của văn hóa dân tộc là không chính xác.","d":0},{"s":4,"q":"Kỷ luật của Đảng theo tư tưởng Hồ Chí Minh chỉ thực sự nghiêm minh và bền vững khi nó được xây dựng trên lòng tự giác của đảng viên về nhiệm vụ của họ đối với Đảng, chứ không đơn thuần là sự áp đặt từ trên xuống dưới.","g":"Tập trung vào bản chất và Tài liệu môn học gốc sức mạnh của kỷ luật Đảng theo Hồ Chí Minh.","x":"Tài liệu môn học chỉ rõ: \"Kỷ luật này là do lòng tự giác của đảng viên về nhiệm vụ của họ đối với Đảng; khi đã tự giác thì kỷ luật của Đảng mới nghiêm và mới bền lâu, thực sự tạo sức mạnh cho Đảng\". Mặc dù kỷ luật cũng nghiêm từ trên xuống dưới, nhưng yếu tố tự giác là nền tảng cho sự bền vững và sức mạnh thực sự của kỷ luật.","d":1},{"s":5,"q":"Khi lợi ích chung của Đảng mâu thuẫn với lợi ích riêng của cá nhân, đảng viên và cán bộ theo Hồ Chí Minh được phép cân nhắc, đàm phán để dung hòa nhằm đảm bảo quyền lợi chính đáng của bản thân.","g":"Nhớ lại nguyên tắc về sự trung thành tuyệt đối và việc đặt lợi ích của Đảng lên trên hết.","x":"Tài liệu môn học nhấn mạnh: \"Nếu gặp khi lợi ích chung của Đảng mâu thuẫn với lợi ích riêng của cá nhân, thì phải kiên quyết hy sinh lợi ích của cá nhân cho lợi ích của Đảng. Khi cần đến tính mệnh của mình cũng phải vui lòng hy sinh cho Đảng\". Không có sự cân nhắc hay đàm phán lợi ích cá nhân khi mâu thuẫn với lợi ích của Đảng.","d":0},{"s":6,"q":"Hồ Chí Minh cảnh báo rằng \"giặc nội xâm\" (tham ô, lãng phí, quan liêu) đáng sợ hơn \"địch bên ngoài\" vì chúng có khả năng phá hoại từ bên trong, nhưng vai trò của cán bộ, đảng viên trong việc phòng, chống các tiêu cực này chỉ dừng lại ở việc gương mẫu, không cần trực tiếp đối mặt và xử lý các hành vi đó.","g":"Xem xét quan điểm của Hồ Chí Minh về \"giặc nội xâm\" và trách nhiệm của cán bộ, đảng viên trong phòng chống tiêu cực.","x":"Tài liệu môn học khẳng định: \"Trong việc phòng, chống tiêu cực, cán bộ, đảng viên phải đặc biệt phòng, chống tham ô, lãng phí, quan liêu bởi Hồ Chí Minh cho đó là giặc nội xâm, là những kẻ địch bên trong, “mỗi kẻ địch bên trong là một bạn đồng minh của kẻ địch bên ngoài. Địch bên ngoài không đáng sợ. Địch bên trong đáng sợ hơn, vì nó phá hoại từ trong phá ra”\". Tài liệu môn học cũng nêu rõ cán bộ, đảng viên phải \"chịu trách nhiệm, năng động, sáng tạo\", \"dám chịu trách nhiệm trước Đảng, trước nhân dân\". Điều này ngụ ý trách nhiệm không chỉ là gương mẫu mà còn là trực tiếp đối mặt và xử lý các tiêu cực, thể hiện tinh thần chịu trách nhiệm chứ không phải chỉ dừng lại ở việc gương mẫu. ------------------------------------------------------------------------","d":0}],"tn":[{"s":7,"q":"Theo Hồ Chí Minh, yếu tố nào được coi là \"cái gốc\" của mọi công việc, quyết định sự thành công hay thất bại?","g":"Đọc kỹ phần nói về công tác cán bộ trong tư tưởng Hồ Chí Minh.","x":"Tài liệu môn học nêu rõ: \"cán bộ là gốc của mọi công việc, “muôn việc thành công hoặc thất bại, đều do cán bộ tốt hoặc kém”\". Điều này khẳng định chất lượng của đội ngũ cán bộ là yếu tố then chốt quyết định thành bại của mọi công việc.","p":[["A","Đường lối, chủ trương đúng đắn của Đảng."],["B","Sự lãnh đạo tài tình của cấp ủy các cấp."],["C","Chất lượng của đội ngũ cán bộ."],["D","Tinh thần đoàn kết, thống nhất trong toàn Đảng."],["E","Sự ủng hộ, tin tưởng tuyệt đối của quần chúng nhân dân."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Mục đích hoạt động của Đảng Cộng sản Việt Nam, theo tư tưởng Hồ Chí Minh, là gì để Đảng không có mục đích riêng?","g":"Xem xét kỹ mục đích hoạt động cốt lõi của Đảng được Hồ Chí Minh nêu ra trong bối cảnh Đảng là đạo đức, là văn minh, không có mục đích riêng.","x":"Tài liệu môn học và chỉ rõ: \"Thứ nhất, mục đích hoạt động của Đảng là lãnh đạo đấu tranh giải phóng dân tộc, giải phóng xã hội, giải phóng giai cấp, giải phóng con người. Đó là sự nghiệp cách mạng theo chủ nghĩa Mác - Lênin, làm cho dân tộc được độc lập, nhân dân có cuộc sống ấm no, tự do, hạnh phúc thực sự, đoàn kết hữu nghị với các dân tộc trên thế giới.\" và \"Đảng không có mục đích riêng; sự ra đời và phát triển của Đảng chỉ có mục đích duy nhất là làm cho đất nước hùng cường, đi lên chủ nghĩa xã hội, đưa lại quyền lợi cho dân\". Phương án B tổng hợp được ý chính này.","p":[["A","Xây dựng một xã hội công bằng, văn minh dựa trên các giá trị truyền thống dân tộc."],["B","Lãnh đạo đấu tranh giải phóng dân tộc, giải phóng xã hội, làm cho dân tộc độc lập, nhân dân ấm no, tự do, hạnh phúc thực sự."],["C","Củng cố quyền lực của giai cấp công nhân và tầng lớp lao động trong xã hội."],["D","Thiết lập mối quan hệ hữu nghị bền vững với tất cả các quốc gia trên thế giới."],["E","Đảm bảo sự phát triển kinh tế nhanh chóng để nâng cao vị thế quốc gia trên trường quốc tế."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Trong các nguyên tắc xây dựng Đảng, Hồ Chí Minh nhấn mạnh điều kiện tiên quyết để thực hiện nguyên tắc tập trung dân chủ hiệu quả là gì?","g":"Đọc lại phần về nguyên tắc tập trung dân chủ và điều kiện để thực hiện nó.","x":"Tài liệu môn học nêu rõ: \"Điều kiện tiên quyết khi thực hiện nguyên tắc này [tập trung dân chủ] là tổ chức Đảng phải trong sạch, vững mạnh\". Các phương án khác có thể là yếu tố bổ trợ nhưng không phải là \"điều kiện tiên quyết\" được Người trực tiếp nhấn mạnh.","p":[["A","Phải có sự lãnh đạo tập trung tuyệt đối của Trung ương Đảng."],["B","Toàn thể đảng viên phải tuyệt đối phục tùng chân lý và nghị quyết của Đảng."],["C","Tổ chức Đảng phải trong sạch, vững mạnh."],["D","Phải có sự giám sát chặt chẽ từ quần chúng nhân dân."],["E","Cần thiết lập cơ chế kiểm soát quyền lực độc lập trong Đảng."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":10,"q":"Quan điểm \"Đảng mà không có chủ nghĩa cũng như người không có trí khôn, tàu không có bàn chỉ nam\" của Hồ Chí Minh muốn nói lên tầm quan trọng cốt lõi của nguyên tắc nào trong hoạt động của Đảng?","g":"Từ khóa \"chủ nghĩa làm cốt\", \"trí khôn\", \"bàn chỉ nam\" gợi nhắc đến vai trò của một học thuyết định hướng.","x":"Tài liệu môn học và khẳng định: \"Đảng lấy chủ nghĩa Mác - Lênin làm nền tảng tư tưởng và kim chỉ nam cho hành động: Trong tác phẩm Đường cách mệnh, Hồ Chí Minh khẳng định: “Đảng muốn vững thì phải có chủ nghĩa làm cốt, trong đảng ai cũng phải hiểu, ai cũng phải theo chủ nghĩa ấy. Đảng mà không có chủ nghĩa cũng như người không có trí khôn, tàu không có bàn chỉ nam. Tay giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mạng nhất là chủ nghĩa Lênin”\". Câu nói trên trực tiếp nói về tầm quan trọng của chủ nghĩa Mác-Lênin.","p":[["A","Tập trung dân chủ."],["B","Tự phê bình và phê bình."],["C","Kỷ luật nghiêm minh, tự giác."],["D","Lấy chủ nghĩa Mác - Lênin làm nền tảng tư tưởng và kim chỉ nam cho hành động."],["E","Đoàn kết, thống nhất trong Đảng."]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":11,"q":"Hồ Chí Minh chỉ ra rằng một Đảng \"mất lòng tin là mất tất cả\". Yêu cầu cốt lõi nào đối với Đảng Cộng sản Việt Nam được suy ra từ nhận định này?","g":"\"Mất lòng tin\" trực tiếp liên quan đến mối quan hệ giữa Đảng và quần chúng nhân dân.","x":"Tài liệu môn học nhấn mạnh: \"Mất lòng tin là mất tất cả\". Ngay trước đó, Tài liệu môn học cũng nói \"cách xa dân chúng, không liên hệ chặt chẽ với dân chúng, cũng như đứng lơ lửng giữa trời, nhất định thất bại\". Và Tài liệu môn học cũng nói về việc Đảng phải \"học dân, làm cho dân tin, tức coi trọng chữ TÍN – dân tin Đảng và Đảng tin dân\". Điều này tổng hợp lại, cho thấy việc giữ gìn Đảng trong sạch, vững mạnh và đặc biệt là liên hệ mật thiết với nhân dân là cốt lõi để duy trì lòng tin.","p":[["A","Tuyệt đối tuân thủ Hiến pháp và pháp luật."],["B","Luôn giữ gìn sự trong sạch, vững mạnh và liên hệ mật thiết với nhân dân."],["C","Không ngừng đổi mới phương thức lãnh đạo."],["D","Đảm bảo sự đoàn kết quốc tế bền vững."],["E","Phát triển kinh tế vượt bậc để nâng cao đời sống nhân dân."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":12,"q":"Theo Hồ Chí Minh, \"Đảng không phải là một tổ chức để làm quan phát tài\" mà phải làm tròn nhiệm vụ giải phóng dân tộc, làm cho Tổ quốc giàu mạnh, đồng bào sung sướng. Điều này thể hiện rõ nhất nguyên tắc nào trong xây dựng Đảng?","g":"Quan điểm về mục đích không tự thân và trách nhiệm của Đảng gợi nhắc đến việc liên tục hoàn thiện bản thân để xứng đáng với sứ mệnh.","x":"Tài liệu môn học nêu rõ: \"Đảng không có mục đích tự thân, Đảng không phải là tổ chức để làm quan phát tài mà Đảng từ trong xã hội mà ra, hoạt động vì Tổ quốc giàu mạnh, đồng bào sung sướng. Do đó, thường xuyên tự chỉnh đốn trở thành một nhiệm vụ cực kỳ quan trọng trong xây dựng Đảng\". Câu hỏi này trực tiếp dẫn đến nguyên tắc tự chỉnh đốn. ------------------------------------------------------------------------","p":[["A","Đảng lấy chủ nghĩa Mác - Lênin làm nền tảng tư tưởng."],["B","Đảng phải thường xuyên tự chỉnh đốn."],["C","Tập trung dân chủ."],["D","Đoàn kết, thống nhất trong Đảng."],["E","Kỷ luật nghiêm minh, tự giác."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":13,"q":"Theo tư tưởng Hồ Chí Minh về Đảng là đạo đức, là văn minh, điểm nào dưới đây không phải là biểu hiện của đạo đức Đảng?","g":"Nhớ lại định nghĩa về đạo đức của Đảng, đặc biệt là quan điểm về \"mục đích riêng\".","x":"Tài liệu môn học khẳng định: \"Đảng không có mục đích riêng; sự ra đời và phát triển của Đảng chỉ có mục đích duy nhất là làm cho đất nước hùng cường, đi lên chủ nghĩa xã hội, đưa lại quyền lợi cho dân\". Do đó, nhận định Đảng có mục đích riêng là sai. Các phương án A, B, D, E đều là những điểm thể hiện đạo đức của Đảng theo Hồ Chí Minh.","p":[["A","Mục đích hoạt động là lãnh đạo đấu tranh giải phóng dân tộc, giải phóng xã hội."],["B","Cương lĩnh, đường lối luôn trung thành với lợi ích toàn dân tộc."],["C","Đảng có mục đích riêng là xây dựng một nhà nước hùng cường dưới sự lãnh đạo tuyệt đối của Đảng."],["D","Đội ngũ đảng viên thấm nhuần đạo đức cách mạng, suốt đời phấn đấu cho lợi ích của dân, của nước."],["E","Đảng là của giai cấp công nhân và nhân dân lao động, những người kiên quyết nhất, hăng hái nhất."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":14,"q":"Trong các yêu cầu đối với đội ngũ cán bộ, đảng viên được Hồ Chí Minh đề cập, yêu cầu nào dưới đây không đúng?","g":"Xem xét các yêu cầu về phẩm chất \"đức\" và \"tài\" đối với cán bộ, đảng viên.","x":"Tài liệu môn học nêu rõ yêu cầu xây dựng đội ngũ cán bộ, đảng viên \"vừa có đức vừa có tài\". Tài liệu môn học cụ thể hóa: \"Phải luôn luôn tu dưỡng, rèn luyện, trau dồi đạo đức cách mạng\" và \"Phải luôn luôn học tập nâng cao trình độ về mọi mặt\". Việc nói rằng \"không cần quá chú trọng vào đạo đức cách mạng vì đã có Đảng giáo dục\" là sai, vì tu dưỡng đạo đức là một yêu cầu thường xuyên và chủ động của mỗi đảng viên.","p":[["A","Phải tuyệt đối trung thành với Đảng, sẵn sàng hy sinh lợi ích cá nhân cho Đảng."],["B","Phải luôn luôn học tập nâng cao trình độ về mọi mặt, nhưng không cần quá chú trọng vào đạo đức cách mạng vì đã có Đảng giáo dục."],["C","Phải có mối liên hệ mật thiết với nhân dân, là người đầy tớ trung thành của nhân dân."],["D","Phải luôn luôn chịu trách nhiệm, năng động, sáng tạo, dám chịu trách nhiệm trước Đảng và nhân dân."],["E","Phải luôn luôn phòng và chống các tiêu cực, đặc biệt là tham ô, lãng phí, quan liêu."]],"d":"B","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":15,"q":"Hồ Chí Minh cảnh báo về sự thoái hóa, biến chất của cán bộ, đảng viên. Trong các biểu hiện dưới đây, biểu hiện nào không được Người xem là dấu hiệu của thoái hóa, biến chất?","g":"Tập trung vào các biểu hiện tiêu cực mà Hồ Chí Minh đã liệt kê.","x":"Tài liệu môn học liệt kê các biểu hiện thoái hóa, biến chất như: \"mang nặng chủ nghĩa cá nhân\", \"ngại gian khổ, sa vào tham ô, hủ hoá, lãng phí, xa hoa; tham danh, trục lợi, thích địa vị, quyền hành; coi thường tập thể, xem khinh quần chúng; độc đoán, chuyên quyền; mắc bệnh quan liêu, mệnh lệnh; không chịu học tập để tiến bộ; mất đoàn kết, thiếu tính tổ chức, kỷ luật; kém tinh thần trách nhiệm; không chấp hành đúng đường lối, chính sách của Đảng và Nhà nước\". Ngược lại, \"Năng động, sáng tạo trong công việc, dám chịu trách nhiệm trước những khó khăn mới\" là một phẩm chất tích cực mà Hồ Chí Minh yêu cầu ở cán bộ, đảng viên.","p":[["A","Mang nặng chủ nghĩa cá nhân, việc gì cũng nghĩ đến lợi ích riêng trước hết."],["B","Thích địa vị, quyền hành, coi thường tập thể và xem khinh quần chúng."],["C","Năng động, sáng tạo trong công việc, dám chịu trách nhiệm trước những khó khăn mới."],["D","Ngại gian khổ, sa vào tham ô, hủ hóa, lãng phí, xa hoa."],["E","Mắc bệnh quan liêu, mệnh lệnh, không chấp hành đúng đường lối, chính sách của Đảng và Nhà nước."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":16,"q":"Để Đảng thực sự là một Đảng văn minh, Hồ Chí Minh đã nêu ra nhiều nội dung chủ yếu. Nội dung nào sau đây không phù hợp với tư tưởng của Người về Đảng văn minh?","g":"Xem xét mối quan hệ giữa lợi ích giai cấp và lợi ích dân tộc trong tư tưởng Hồ Chí Minh.","x":"Tài liệu môn học nêu rõ: \"Mọi hoạt động của Đảng đều xuất phát từ yêu cầu phát triển của dân tộc, lấy lợi ích tối cao của dân tộc làm trọng, mọi lợi ích giai cấp đều phải đặt dưới sự phát triển của dân tộc\". Do đó, nhận định \"Mọi lợi ích giai cấp phải đặt lên trên lợi ích tối cao của dân tộc\" là hoàn toàn sai so với tư tưởng Hồ Chí Minh.","p":[["A","Đảng là một Đảng tiêu biểu cho lương tâm, trí tuệ và danh dự của dân tộc."],["B","Đảng hoạt động trong khuôn khổ Hiến pháp và pháp luật, không đứng trên dân tộc."],["C","Đảng phải luôn luôn trong sạch, vững mạnh, làm tròn sứ mệnh lịch sử do nhân dân, dân tộc giao phó."],["D","Mọi lợi ích giai cấp phải đặt lên trên lợi ích tối cao của dân tộc để đảm bảo sự tiến bộ xã hội."],["E","Đảng có quan hệ quốc tế trong sáng, bảo vệ lợi ích của dân tộc Việt Nam đồng thời tôn trọng độc lập của các quốc gia khác."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Nguyên tắc \"Tập trung dân chủ\" được Hồ Chí Minh nhấn mạnh hai điều cần tránh trong hoạt động của Đảng để thực hiện hiệu quả. Điều nào dưới đây không thuộc hai điều cần tránh đó?","g":"Đọc kỹ hai điều cần tránh được nêu trực tiếp trong phần giải thích về tập trung dân chủ.","x":"Tài liệu môn học chỉ ra hai điều cần tránh: \"một là, độc oán, chuyên quyền, coi thường tập thể; hai là, dựa dẫm tập thể, không dám quyết đoán\". Phương án C (\"Trì hoãn, chậm trễ trong việc ra quyết định do quá trình thảo luận kéo dài\") không được đề cập trực tiếp như một trong hai điều cần tránh cụ thể đó, mặc dù nó có thể là một hệ quả tiêu cực của việc thực hiện nguyên tắc. Phương án D và E đều là những cách diễn đạt khác của việc không thực hiện đúng hai vế \"tập thể lãnh đạo, cá nhân phụ trách\", vốn là biểu hiện cụ thể của việc tránh độc đoán hoặc dựa dẫm.","p":[["A","Độc đoán, chuyên quyền, coi thường tập thể."],["B","Dựa dẫm tập thể, không dám quyết đoán."],["C","Trì hoãn, chậm trễ trong việc ra quyết định do quá trình thảo luận kéo dài."],["D","Thiếu sự kết hợp hài hòa giữa tập thể lãnh đạo và cá nhân phụ trách."],["E","Cá nhân phụ trách mà không có sự lãnh đạo của tập thể."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":18,"q":"Hồ Chí Minh chỉ rõ những điểm thoái hóa, biến chất của cán bộ, đảng viên. Theo Người, điều nào sau đây không được coi là biểu hiện của \"chủ nghĩa cá nhân\" trong cán bộ, đảng viên?","g":"Nhớ lại định nghĩa và các biểu hiện của chủ nghĩa cá nhân mà Hồ Chí Minh đã chỉ ra.","x":"Tài liệu môn học liệt kê các biểu hiện của chủ nghĩa cá nhân. Tài liệu môn học khẳng định: \"đảng viên và cán bộ phải đặt lợi ích của Đảng ra trước, lợi ích của cá nhân lại sau... Nếu gặp khi lợi ích chung của Đảng mâu thuẫn với lợi ích riêng của cá nhân, thì phải kiên quyết hy sinh lợi ích của cá nhân cho lợi ích của Đảng\". Việc \"luôn đặt lợi ích của Đảng lên trên lợi ích cá nhân\" là một phẩm chất tích cực, đối lập hoàn toàn với chủ nghĩa cá nhân. ------------------------------------------------------------------------","p":[["A","Coi thường tập thể, xem khinh quần chúng."],["B","Độc đoán, chuyên quyền."],["C","Luôn đặt lợi ích của Đảng lên trên lợi ích cá nhân."],["D","Ngại gian khổ, sa vào tham ô, hủ hóa."],["E","Thiếu tinh thần trách nhiệm, không chấp hành đúng đường lối, chính sách."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":25,"q":"Hồ Chí Minh khẳng định: \"Đảng ta là đạo đức, là _______\". Đây là một trong những tư tưởng cốt lõi của Người về xây dựng Đảng trong sạch, vững mạnh.","g":"Nhớ lại câu nói nổi tiếng của Hồ Chí Minh về bản chất của Đảng.","x":"Tài liệu môn học ghi rõ: \"Trong bài nói tại Lễ kỷ niệm 30 năm Ngày thành lập Đảng (năm 1960), Hồ Chí Minh khẳng định: “Đảng ta là đạo đức, là văn minh”\".","p":[["A","cách mạng"],["B","văn minh"],["C","công lý"],["D","trí tuệ"],["E","nhân dân"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":26,"q":"Theo Hồ Chí Minh, Đảng \"phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người _______ thật trung thành của nhân dân\".","g":"Nhớ lại vai trò mà Hồ Chí Minh đặt ra cho Đảng trong mối quan hệ với nhân dân, không phải là \"quan cách mạng\".","x":"Tài liệu môn học viết: \"Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân\".","p":[["A","thủ lĩnh"],["B","đại diện"],["C","đầy tớ"],["D","chiến sĩ"],["E","công bộc"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":27,"q":"Trong Di chúc, Hồ Chí Minh nhấn mạnh: \"Phải có tình đồng chí _______ lẫn nhau\" để củng cố sự đoàn kết và thống nhất trong Đảng, đặc biệt trong quá trình tự phê bình và phê bình.","g":"Cụm từ nói về tình cảm giữa các đảng viên.","x":"Tài liệu môn học dẫn lời Hồ Chí Minh trong Di chúc: \"Trong Đảng thực hành dân chủ rộng rãi, thường xuyên và nghiêm chỉnh tự phê bình và phê bình là cách tốt nhất để củng cố sự đoàn kết và thống nhất trong Đảng. Phải có tình đồng chí thương yêu lẫn nhau”.","p":[["A","tôn trọng"],["B","hỗ trợ"],["C","tin cậy"],["D","thương yêu"],["E","thấu hiểu"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":28,"q":"Hồ Chí Minh cho rằng, \"Đảng không có mục đích tự thân, Đảng không phải là tổ chức để làm quan phát tài mà Đảng từ trong xã hội mà ra, hoạt động vì Tổ quốc giàu mạnh, đồng bào _______\".","g":"Từ ngữ diễn tả mong muốn của Hồ Chí Minh về cuộc sống của đồng bào.","x":"Tài liệu môn học nêu: \"Đảng không có mục đích tự thân, Đảng không phải là tổ chức để làm quan phát tài mà Đảng từ trong xã hội mà ra, hoạt động vì Tổ quốc giàu mạnh, đồng bào sung sướng\".","p":[["A","tiến bộ"],["B","hạnh phúc"],["C","sung sướng"],["D","văn minh"],["E","độc lập"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":29,"q":"Trong \"Sửa đổi lối làm việc\", Hồ Chí Minh nêu lên 12 điều về tư cách của đảng chân chính cách mạng, trong đó có Điều số 10: \"Đảng phải luôn luôn _______ những phần tử hủ hóa ra ngoài\".","g":"Hành động mạnh mẽ để loại bỏ những yếu tố tiêu cực.","x":"Tài liệu môn học dẫn Điều số 10 trong tác phẩm \"Sửa đổi lối làm việc\": \"Đảng phải luôn luôn tẩy bỏ những phần tử hủ hóa ra ngoài\".","p":[["A","loại trừ"],["B","thanh lọc"],["C","tẩy bỏ"],["D","giáo dục"],["E","cô lập"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Hồ Chí Minh cảnh báo: \"cách xa dân chúng, không liên hệ chặt chẽ với dân chúng, cũng như đứng lơ lửng giữa trời, nhất định _______\". Mất lòng tin là mất tất cả.","g":"Từ ngữ diễn tả hậu quả của việc mất liên hệ với dân.","x":"Tài liệu môn học khẳng định: “‘cách xa dân chúng, không liên hệ chặt chẽ với dân chúng, cũng như đứng lơ lửng giữa trời, nhất định thất bại”\".","p":[["A","suy yếu"],["B","lạc hậu"],["C","cô lập"],["D","thất bại"],["E","thoái hóa"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"}]},"09":{"ten":"Nhà nước dân chủ","ds":[{"s":1,"q":"Theo tư tưởng Hồ Chí Minh, Nhà nước Việt Nam mới được thành lập mang bản chất của một nhà nước \"phi giai cấp\" để đoàn kết toàn dân tộc.","g":"Xem lại phần \"Bản chất giai cấp của Nhà nước\", đặc biệt đoạn mở đầu.","x":"Tài liệu khẳng định: \"Nhà nước Việt Nam là nhà nước dân chủ, nhưng tuyệt nhiên nó không phải là “nhà nước toàn dân”, hiểu theo nghĩa là nhà nước phi giai cấp. Nhà nước ở đâu và bao giờ cũng mang bản chất của một giai cấp nhất định. Nhà nước Việt Nam mới... là một nhà nước mang bản chất giai cấp công nhân.\"","d":0},{"s":2,"q":"Nguyên tắc \"tập trung dân chủ\" trong tổ chức và hoạt động của Nhà nước Việt Nam theo tư tưởng Hồ Chí Minh chỉ nhấn mạnh sự cần thiết của việc phát huy cao độ tập trung quyền lực để đảm bảo tính thống nhất.","g":"Đọc kỹ phần giải thích về nguyên tắc tập trung dân chủ.","x":"Tài liệu nêu rõ: \"Hồ Chí Minh rất chú ý đến cả hai mặt dân chủ và tập trung trong tổ chức và hoạt động của tất cả bộ máy, cơ quan nhà nước. Người nhấn mạnh đến sự cần thiết phải phát huy cao độ dân chủ, đồng thời cũng nhấn mạnh phải phát huy cao độ tập trung\". Do đó, việc chỉ nhấn mạnh tập trung mà bỏ qua dân chủ là không đúng với tư tưởng của Người.","d":0},{"s":3,"q":"Hồ Chí Minh cho rằng, hình thức dân chủ gián tiếp là hình thức hoàn bị nhất để nhân dân thực thi quyền lực, vì nó cho phép lựa chọn những đại diện ưu tú nhất.","g":"So sánh quan điểm của Hồ Chí Minh về dân chủ trực tiếp và gián tiếp.","x":"Tài liệu chỉ rõ: \"Hồ Chí Minh luôn coi trọng hình thức dân chủ trực tiếp và tạo mọi điều kiện thuận lợi để thực hành dân chủ trực tiếp, bởi đây là hình thức dân chủ hoàn bị nhất.\" Như vậy, dân chủ trực tiếp mới là hình thức hoàn bị nhất, không phải dân chủ gián tiếp.","d":0},{"s":4,"q":"Trong tư tưởng Hồ Chí Minh về nhà nước của nhân dân, luật pháp chỉ có vai trò phản ánh ý nguyện của dân chúng mà không phải là công cụ để kiểm soát quyền lực nhà nước.","g":"Đọc phần vai trò của luật pháp trong nhà nước của nhân dân.","x":"Tài liệu khẳng định: \"Luật pháp đó là của nhân dân, là công cụ thực thi quyền lực của nhân dân, là phương tiện để kiểm soát quyền lực nhà nước.\" Do đó, luật pháp vừa phản ánh ý nguyện, bảo vệ quyền lợi, vừa là phương tiện kiểm soát quyền lực nhà nước.","d":0},{"s":5,"q":"Quan điểm \"Dân là chủ\" trong tư tưởng Hồ Chí Minh xác định vị thế chủ thể tối cao của nhân dân đối với quyền lực nhà nước, trong khi \"Dân làm chủ\" nhấn mạnh quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ.","g":"Phân biệt ý nghĩa của hai cụm từ \"Dân là chủ\" và \"Dân làm chủ\".","x":"Tài liệu ghi rõ: \"Nguyên lý “dân là chủ” khẳng định địa vị chủ thể tối cao của mọi quyền lực là nhân dân.\" Tài liệu cũng nêu: \"“Dân là chủ” xác định vị thế của nhân dân đối với quyền lực nhà nước, còn “dân làm chủ nhấn mạnh quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ.\"","d":1},{"s":6,"q":"Để một cán bộ nhà nước thật sự \"vì dân\", Hồ Chí Minh chỉ yêu cầu họ có tinh thần chí công vô tư và tận tụy, không đòi hỏi về năng lực trí tuệ hay tầm nhìn xa trông rộng.","g":"Xem xét các phẩm chất cần có của cán bộ trong nhà nước \"vì nhân dân\".","x":"Tài liệu và mô tả phẩm chất của cán bộ \"vì dân\" bao gồm cả \"là người đầy tớ\" (trung thành, tận tụy, cần, kiệm, liêm, chính, chí công vô tư, lo trước thiên hạ, vui sau thiên hạ) và \"là người lãnh đạo\" (trí tuệ hơn người, minh mẫn, sáng suốt, nhìn xa trông rộng, gần gũi nhân dân, trọng dụng hiền tài). Điều này cho thấy yêu cầu về cả đức và tài.","d":0}],"tn":[{"s":7,"q":"Theo Hồ Chí Minh, bản chất giai cấp công nhân của Nhà nước Việt Nam Dân chủ Cộng hòa không chỉ thể hiện ở vai trò lãnh đạo của Đảng Cộng sản, mà còn ở một khía cạnh cơ bản nào sau đây?","g":"Nhớ lại các phương diện thể hiện bản chất giai cấp công nhân của Nhà nước.","x":"Tài liệu nêu rõ: \"Hai là, bản chất giai cấp của Nhà nước Việt Nam thể hiện ở tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước. Đưa đất nước đi lên chủ nghĩa xã hội và chủ nghĩa cộng sản là mục tiêu cách mạng nhất quán của Hồ Chí Minh.\" Các phương án A, B, D, E không phản ánh đúng tư tưởng của Người.","p":[["A","Sự phân chia quyền lực rõ ràng giữa các nhánh lập pháp, hành pháp, tư pháp."],["B","Việc đảm bảo quyền tự quyết tuyệt đối cho mọi giai cấp trong xã hội."],["C","Tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước."],["D","Sự loại trừ hoàn toàn ảnh hưởng của các giai cấp khác khỏi bộ máy nhà nước."],["E","Việc tập trung tối đa quyền lực vào tay Chính phủ."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Hồ Chí Minh đã giải quyết mối quan hệ giữa vấn đề dân tộc và vấn đề giai cấp trong cách mạng Việt Nam như thế nào trong tư tưởng về Nhà nước mới?","g":"Xem phần \"Trong Nhà nước Việt Nam, bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc\".","x":"Tài liệu khẳng định: \"Trong Nhà nước Việt Nam, bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc. Hồ Chí Minh là người giải quyết rất thành công mối quan hệ giữa vấn đề dân tộc với vấn đề giai cấp trong cách mạng Việt Nam.\"","p":[["A","Đặt vấn đề giai cấp lên trên vấn đề dân tộc, coi trọng lợi ích giai cấp công nhân hơn lợi ích toàn dân."],["B","Tách biệt hoàn toàn vấn đề dân tộc khỏi vấn đề giai cấp, xem xét chúng độc lập."],["C","Coi bản chất giai cấp công nhân của Nhà nước thống nhất với tính nhân dân và tính dân tộc."],["D","Chủ yếu tập trung vào việc củng cố bản chất giai cấp công nhân, ít chú trọng đến tính dân tộc."],["E","Xác định lợi ích dân tộc chỉ là phụ trợ cho lợi ích giai cấp công nhân."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Theo tư tưởng Hồ Chí Minh, khi nói về hình thức dân chủ gián tiếp, vị thế và mối quan hệ giữa nhân dân với cán bộ nhà nước được xác định như thế nào?","g":"Đọc kỹ các đoạn văn mô tả mối quan hệ giữa nhân dân và cán bộ nhà nước trong hình thức dân chủ gián tiếp.","x":"Tài liệu nêu: \"Quyền lực nhà nước là “thừa ủy quyền” của nhân dân. Tự bản thân nhà nước không có quyền lực. Quyền lực của nhà nước là do nhân dân ủy thác. Do vậy, các cơ quan quyền lực nhà nước cùng với đội ngũ cán bộ “đều là công bộc của dân...\" nhấn mạnh: \"Ở đây, Hồ Chí Minh đã xác định rõ vị thế và mối quan hệ giữa nhân dân với cán bộ nhà nước trên cơ sở nhân dân là chủ thể nắm giữ mọi quyền lực.\"","p":[["A","Cán bộ nhà nước là người đại diện tối cao, có quyền lực tự thân."],["B","Nhân dân là người chủ thể nắm giữ mọi quyền lực, cán bộ là công bộc của dân."],["C","Cán bộ nhà nước và nhân dân có mối quan hệ bình đẳng về quyền lực."],["D","Nhân dân chỉ có quyền bầu cử, không có quyền kiểm soát hoạt động của cán bộ."],["E","Quyền lực nhà nước độc lập hoàn toàn với sự ủy thác của nhân dân."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":10,"q":"Trong quan điểm về \"nhà nước do nhân dân\", Hồ Chí Minh nhấn mạnh điều gì là cần thiết để nhân dân có thể thực hiện tốt vai trò làm chủ của mình?","g":"Tìm đoạn nói về năng lực làm chủ của nhân dân.","x":"Tài liệu và nêu rõ: \"Nhà nước do nhân dân cần coi trọng việc giáo dục nhân dân, đồng thời nhân dân cũng phải tự giác phấn đấu để có đủ năng lực thực hiện quyền dân chủ của mình. Hồ Chí Minh nói: \"Chúng ta là những người lao động làm chủ nước nhà. Muốn làm chủ được tốt, phải có năng lực làm chủ”.\"","p":[["A","Nhân dân cần tuân thủ mọi mệnh lệnh của nhà nước mà không cần hiểu rõ."],["B","Nhà nước phải tuyên bố mọi quyền làm chủ của nhân dân mà không cần chuẩn bị năng lực."],["C","Nhà nước cần coi trọng việc giáo dục nhân dân và nhân dân phải tự giác phấn đấu có đủ năng lực làm chủ."],["D","Chỉ những người có trình độ học vấn cao mới có thể tham gia vào công việc nhà nước."],["E","Nhà nước cần tập trung mọi quyền lực để thay mặt nhân dân đưa ra quyết định."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":11,"q":"Thước đo cơ bản nhất để đánh giá một Nhà nước thật sự \"vì dân\" theo Hồ Chí Minh là gì?","g":"Xem phần \"Nhà nước vì nhân dân\", đặc biệt là cách Hồ Chí Minh đặt vấn đề với cán bộ.","x":"Tài liệu chỉ rõ: \"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải được lòng dân. Hồ Chí Minh đặt vấn đề với cán bộ Nhà nước phải làm sao cho được lòng dân, dân tin, dân mến, dân yêu.\"","p":[["A","Mức độ giàu mạnh về kinh tế của đất nước."],["B","Số lượng luật pháp được ban hành để quản lý xã hội."],["C","Sự ủng hộ và tin tưởng của nhân dân (được lòng dân)."],["D","Khả năng kiểm soát và hạn chế quyền lực cá nhân của cán bộ."],["E","Việc thực hiện đầy đủ các nghi thức dân chủ trong quản lý."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":12,"q":"Hồ Chí Minh phê phán gay gắt những cán bộ nhà nước nào?","g":"Xem đoạn Hồ Chí Minh phê phán cán bộ trong nhà nước của nhân dân.","x":"Tài liệu và nêu: \"Chính vì vậy, Hồ Chí Minh kịch liệt phê phán những cán bộ nhà nước thoái hóa, biến chất, từ chỗ là công bộc của dân đã trở thành “quan cách mạng”, đứng trên nhân dân, coi khinh nhân dân, “cậy thế” với dân, “quên rằng dân bầu mình ra là để làm việc cho dân”.\"","p":[["A","Cán bộ quá tận tụy với công việc, quên đi lợi ích cá nhân."],["B","Cán bộ không dám đưa ra quyết định táo bạo vì sợ sai lầm."],["C","Cán bộ thoái hóa, biến chất, từ công bộc của dân trở thành \"quan cách mạng\", đứng trên nhân dân."],["D","Cán bộ chỉ tập trung làm những việc trực tiếp mang lại lợi ích cho dân."],["E","Cán bộ có trí tuệ vượt trội nhưng ít gần gũi nhân dân."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":13,"q":"Trong các nhận định sau về bản chất giai cấp của Nhà nước Việt Nam theo tư tưởng Hồ Chí Minh, nhận định nào là SAI?","g":"Đọc kỹ các đặc điểm của bản chất giai cấp công nhân và mối quan hệ với tính nhân dân, tính dân tộc.","x":"Tài liệu khẳng định: \"Trong Nhà nước Việt Nam, bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc.\" Điều này trực tiếp phủ nhận nhận định D.","p":[["A","Nhà nước Việt Nam Dân chủ Cộng hòa không phải là nhà nước toàn dân theo nghĩa phi giai cấp."],["B","Đảng Cộng sản Việt Nam giữ vị trí và vai trò cầm quyền là một biểu hiện của bản chất giai cấp công nhân."],["C","Tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước là mục tiêu nhất quán của Nhà nước."],["D","Bản chất giai cấp công nhân của Nhà nước hoàn toàn tách rời với tính nhân dân và tính dân tộc."],["E","Nguyên tắc tập trung dân chủ là nguyên tắc tổ chức và hoạt động của Nhà nước."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":14,"q":"Nhận định nào sau đây KHÔNG phản ánh đúng cách thức mà Đảng Cộng sản Việt Nam cầm quyền theo tư tưởng Hồ Chí Minh?","g":"Xem các phương thức cầm quyền của Đảng được liệt kê.","x":"Tài liệu liệt kê ba phương thức Đảng cầm quyền: \"(1) Bằng đường lối, quan điểm, chủ trương để Nhà nước thể chế hóa thành pháp luật, chính sách, kế hoạch; (2) Bằng hoạt động của các tổ chức đảng và đảng viên của mình trong bộ máy, cơ quan nhà nước; (3) Bằng công tác kiểm tra.\" Việc \"chỉ định trực tiếp mọi cán bộ cấp cao của nhà nước\" không được đề cập là một trong các phương thức cầm quyền chính thức hay bao quát, và mâu thuẫn với nguyên tắc dân chủ.","p":[["A","Bằng việc thể chế hóa đường lối, quan điểm, chủ trương của Đảng thành pháp luật."],["B","Bằng hoạt động của các tổ chức đảng và đảng viên trong bộ máy nhà nước."],["C","Bằng công tác kiểm tra, giám sát."],["D","Bằng việc chỉ định trực tiếp mọi cán bộ cấp cao của nhà nước."],["E","Bằng việc lãnh đạo nòng cốt của nhân dân là liên minh công - nông - trí."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":15,"q":"Theo tư tưởng Hồ Chí Minh về nhà nước của nhân dân, nhận định nào sau đây là KHÔNG chính xác về quyền lực nhà nước?","g":"Xem lại các đặc điểm của nhà nước của nhân dân, đặc biệt là quyền lực và mối quan hệ giữa dân và nhà nước.","x":"Tài liệu và nêu rõ: \"Nhân dân có quyền kiểm soát, phê bình nhà nước, có quyền bãi miễn những đại biểu mà họ đã lựa chọn, bầu ra và có quyền giải tán những thiết chế quyền lực mà họ đã lập nên.\" Như vậy, quyền giải tán thiết chế quyền lực thuộc về nhân dân, không phải nhà nước.","p":[["A","Quyền lực nhà nước là do nhân dân ủy thác, không phải tự thân có."],["B","Nhân dân là chủ thể tối cao nắm giữ mọi quyền lực."],["C","Cán bộ nhà nước là công bộc của dân, gánh vác việc chung cho dân."],["D","Nhà nước có quyền giải tán các thiết chế quyền lực nếu nhân dân không tín nhiệm."],["E","Luật pháp dân chủ là công cụ để nhân dân kiểm soát quyền lực nhà nước."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":16,"q":"Khi bàn về nhà nước do nhân dân, Hồ Chí Minh đã khẳng định những nghĩa vụ nào của nhân dân với tư cách người chủ, NGOẠI TRỪ nghĩa vụ nào sau đây?","g":"Đọc kỹ các nghĩa vụ của nhân dân trong phần \"dân làm chủ\".","x":"Tài liệu liệt kê các nghĩa vụ của nhân dân như tuân theo pháp luật, kỷ luật lao động, giữ trật tự chung, đóng góp (nộp thuế), tham gia công việc chung, bảo vệ tài sản công cộng và Tổ quốc. Việc \"ưu tiên lợi ích cá nhân hơn lợi ích chung của Nhà nước\" rõ ràng mâu thuẫn với tinh thần chung của một công dân làm chủ và không được nhắc đến.","p":[["A","Tuân theo pháp luật của Nhà nước."],["B","Giữ đúng kỷ luật lao động và trật tự chung."],["C","Hăng hái tham gia công việc chung và bảo vệ tài sản công cộng."],["D","Ưu tiên lợi ích cá nhân hơn lợi ích chung của Nhà nước."],["E","Đóng góp (nộp thuế) đúng kỳ, đúng số để xây dựng lợi ích chung."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Theo quan điểm Hồ Chí Minh về nhà nước vì nhân dân, nhận định nào sau đây về cán bộ nhà nước là SAI?","g":"Xem xét các yêu cầu đối với cán bộ trong nhà nước \"vì nhân dân\", đặc biệt là đoạn cuối về việc \"chẳng những làm những việc trực tiếp lợi cho dân\".","x":"Tài liệu có đoạn: \"Phải như thế thì mới có thể “chẳng những làm những việc trực tiếp lợi cho dân, mà cũng có khi làm những việc mới xem qua như là hại đến dân”13, nhưng thực chất là vì lợi ích toàn cục, vì lợi ích lâu dài của nhân dân.\" Điều này cho thấy cán bộ không chỉ giới hạn ở việc làm những gì trực tiếp có lợi.","p":[["A","Cán bộ vừa là đày tớ, vừa là người lãnh đạo nhân dân."],["B","Cán bộ phải có đủ cả đức và tài, vừa hiền lại vừa minh."],["C","Cán bộ chỉ cần làm những việc trực tiếp lợi cho dân, tránh những việc gây khó khăn ban đầu."],["D","Cán bộ phải trung thành, tận tụy, cần, kiệm, liêm, chính, chí công vô tư."],["E","Cán bộ phải có trí tuệ hơn người, minh mẫn, sáng suốt, nhìn xa trông rộng."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":18,"q":"Nhận định nào sau đây KHÔNG phải là một đặc điểm của Nhà nước Việt Nam mới được nêu trong tư tưởng Hồ Chí Minh?","g":"Nhớ lại các đặc điểm khi bản chất giai cấp công nhân thống nhất với tính nhân dân và tính dân tộc.","x":"Tài liệu khẳng định \"bản chất giai cấp công nhân của Nhà nước thống nhất với tính nhân dân và tính dân tộc\" và \"Nhà nước Việt Nam mới, do vậy, không phải của riêng giai cấp, tầng lớp nào, mà là thuộc về nhân dân.\" Nhận định D mâu thuẫn trực tiếp với điều này.","p":[["A","Nhà nước ra đời là kết quả của cuộc đấu tranh lâu dài của toàn dân tộc."],["B","Nhà nước luôn kiên trì, nhất quán mục tiêu vì quyền lợi của nhân dân, lấy quyền lợi dân tộc làm nền tảng."],["C","Nhà nước đảm đương nhiệm vụ tổ chức nhân dân tiến hành các cuộc kháng chiến bảo vệ độc lập."],["D","Nhà nước được thành lập dựa trên việc ưu tiên quyền lợi của một giai cấp cụ thể mà không xét đến toàn dân."],["E","Con đường quá độ lên chủ nghĩa xã hội là sự nghiệp của chính Nhà nước."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":25,"q":"Nhà nước Việt Nam mới – Nhà nước Việt Nam Dân chủ Cộng hòa, theo quan điểm của Hồ Chí Minh, là một nhà nước mang bản chất giai cấp (1) _______, nhưng tuyệt nhiên không phải là “nhà nước (2) _______”, hiểu theo nghĩa là nhà nước (3) _______.","g":"Đọc lại đoạn mở đầu của phần \"Bản chất giai cấp của Nhà nước\".","x":"Tài liệu ghi: \"Nhà nước Việt Nam là nhà nước dân chủ, nhưng tuyệt nhiên nó không phải là “nhà nước toàn dân”, hiểu theo nghĩa là nhà nước phi giai cấp. Nhà nước ở đâu và bao giờ cũng mang bản chất của một giai cấp nhất định. Nhà nước Việt Nam mới... là một nhà nước mang bản chất giai cấp công nhân.\"","p":[["A","(1) nhân dân; (2) toàn dân; (3) phi giai cấp"],["B","(1) công nhân; (2) nhân dân; (3) phi giai cấp"],["C","(1) nhân dân; (2) công nhân; (3) phi giai cấp"],["D","(1) công nhân; (2) toàn dân; (3) phi giai cấp"],["E","(1) công nhân; (2) toàn dân; (3) định hướng xã hội chủ nghĩa"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":26,"q":"Một trong những phương diện thể hiện bản chất giai cấp công nhân của Nhà nước Việt Nam là tính _______ trong sự phát triển đất nước, với mục tiêu nhất quán là đưa đất nước đi lên chủ nghĩa xã hội và chủ nghĩa cộng sản.","g":"Tìm ý về mục tiêu phát triển đất nước trong phần bản chất giai cấp.","x":"Tài liệu nêu: \"Hai là, bản chất giai cấp của Nhà nước Việt Nam thể hiện ở tính định hướng xã hội chủ nghĩa trong sự phát triển đất nước. Đưa đất nước đi lên chủ nghĩa xã hội và chủ nghĩa cộng sản là mục tiêu cách mạng nhất quán của Hồ Chí Minh.\"","p":[["A","định hướng xã hội chủ nghĩa"],["B","dân chủ trực tiếp"],["C","phi giai cấp"],["D","năng lực làm chủ"],["E","dân chủ gián tiếp"]],"d":"A","k":"Chọn cụm từ điền vào chỗ trống"},{"s":27,"q":"Trong hình thức dân chủ gián tiếp, quyền lực nhà nước là “thừa (1) _______” của nhân dân, do đó các cơ quan quyền lực nhà nước cùng với đội ngũ cán bộ “đều là công bộc của dân, nghĩa là để gánh vác việc chung cho dân, chứ không phải để đè đầu dân” và làm (2) _______.","g":"Xem xét mối quan hệ giữa nhân dân và quyền lực nhà nước trong dân chủ gián tiếp.","x":"Tài liệu môn học ghi: “Quyền lực nhà nước là ‘thừa ủy quyền’ của nhân dân. Tự bản thân nhà nước không có quyền lực. Quyền lực của nhà nước là do nhân dân ủy thác.” Tài liệu môn học dẫn lời Hồ Chí Minh: “Dân làm chủ thì Chủ tịch, bộ trưởng, thứ trưởng, ủy viên này khác là làm gì? Làm đầy tớ. Làm đầy tớ cho nhân dân, chứ không phải là làm quan cách mạng”. Vì vậy chỗ (1) là “ủy quyền” (cụm “thừa ủy quyền”), chỗ (2) là “đầy tớ”.","p":[["A","(1) ủy thác; (2) quan cách mạng"],["B","(1) ủy quyền; (2) quan cách mạng"],["C","(1) ủy quyền; (2) đầy tớ"],["D","(1) kiểm soát; (2) đầy tớ"],["E","(1) kiểm soát; (2) quan cách mạng"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":28,"q":"Để bảo đảm mọi quyền lực luôn nằm trong tay dân chúng, Hồ Chí Minh khẳng định nhân dân có quyền (1) _______, phê bình nhà nước, có quyền (2) _______ những đại biểu mà họ đã lựa chọn, bầu ra và có quyền giải tán những thiết chế quyền lực mà họ đã lập nên.","g":"Nhớ lại các quyền của nhân dân đối với nhà nước trong phần \"nhà nước của nhân dân\".","x":"Tài liệu ghi: \"Nhân dân có quyền kiểm soát, phê bình nhà nước, có quyền bãi miễn những đại biểu mà họ đã lựa chọn, bầu ra và có quyền giải tán những thiết chế quyền lực mà họ đã lập nên.\"","p":[["A","(1) kiểm tra; (2) bãi miễn"],["B","(1) kiểm soát; (2) kiểm tra"],["C","(1) bãi miễn; (2) kiểm soát"],["D","(1) kiểm tra; (2) kiểm soát"],["E","(1) kiểm soát; (2) bãi miễn"]],"d":"E","k":"Chọn cụm từ điền vào chỗ trống"},{"s":29,"q":"Trong quan điểm về \"nhà nước do nhân dân\", Hồ Chí Minh đã chỉ rõ \"Dân là chủ\" xác định vị thế của nhân dân đối với quyền lực nhà nước, còn \"Dân làm chủ\" nhấn mạnh (1) _______ và (2) _______ của nhân dân với tư cách là người chủ.","g":"Phân biệt ý nghĩa của \"Dân là chủ\" và \"Dân làm chủ\".","x":"Tài liệu nêu: \"“Dân là chủ” xác định vị thế của nhân dân đối với quyền lực nhà nước, còn “dân làm chủ nhấn mạnh quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ.\"","p":[["A","(1) quyền lợi; (2) năng lực làm chủ"],["B","(1) quyền lợi; (2) nghĩa vụ"],["C","(1) năng lực làm chủ; (2) trí tuệ"],["D","(1) nghĩa vụ; (2) trí tuệ"],["E","(1) trí tuệ; (2) năng lực làm chủ"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải (1) _______, và Người yêu cầu cán bộ phải làm sao cho được lòng dân, dân tin, dân mến, dân yêu. Để đạt được điều đó, trước hết phải yêu dân, phải đặt quyền lợi của dân trên hết thảy, phải có một tinh thần (2) _______.","g":"Tìm hiểu về thước đo của nhà nước \"vì dân\" và phẩm chất cần có của cán bộ.","x":"Tài liệu ghi: \"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải được lòng dân.\" Tài liệu bổ sung: \"muốn được dân yêu, muốn được lòng dân, trước hết phải yêu dân, phải đặt quyền lợi của dân trên hết thảy, phải có một tinh thần chí công vô tư.\"","p":[["A","(1) mưu tự do hạnh phúc; (2) chí công vô tư"],["B","(1) được lòng dân; (2) trí tuệ"],["C","(1) mưu tự do hạnh phúc; (2) năng lực làm chủ"],["D","(1) được lòng dân; (2) chí công vô tư"],["E","(1) chí công vô tư; (2) trí tuệ"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"}]},"10":{"ten":"Nhà nước pháp quyền","ds":[{"s":1,"q":"Hồ Chí Minh nhận định \"chủ nghĩa cá nhân\" là \"bệnh gốc\" sinh ra các bệnh tham ô, lãng phí trong bộ máy nhà nước.","g":"Xem xét các nguyên nhân tiêu cực và mối quan hệ giữa chúng trong tư tưởng Hồ Chí Minh, đặc biệt là phân tích về các \"bệnh\" liên quan trong tài liệu và.","x":"Tài liệu khẳng định bệnh quan liêu là \"bệnh gốc sinh ra các bệnh tham ô, lãng phí\". Trong khi đó, tài liệu chỉ ra \"chủ nghĩa cá nhân\" là \"bệnh mẹ\" dẫn đến các tiêu cực. Có sự phân biệt rõ ràng giữa \"bệnh mẹ\" và \"bệnh gốc\" trong tư tưởng của Người về các nguyên nhân sâu xa của tiêu cực.","d":0},{"s":2,"q":"Một trong những điều kiện tiên quyết để công tác kiểm soát quyền lực nhà nước của Đảng Cộng sản Việt Nam đạt kết quả tốt là người đi kiểm soát phải có chức vụ cao để đảm bảo sự răn đe.","g":"Tài liệu nêu rõ hai điều kiện để công tác kiểm soát đạt kết quả tốt.","x":"Theo tài liệu, Hồ Chí Minh chỉ rõ hai điều kiện để kiểm soát có kết quả tốt là \"việc kiểm soát phải có hệ thống và người đi kiểm soát phải là những người rất có uy tín\", không đề cập đến việc người đó phải có chức vụ cao. Uy tín là một phẩm chất cá nhân, không đồng nhất với cấp bậc chức vụ.","d":0},{"s":3,"q":"Tư tưởng Hồ Chí Minh về Nhà nước pháp quyền đã sớm thể hiện sự chú trọng việc thay thế chế độ ra các sắc lệnh bằng chế độ ra các đạo luật, được nêu rõ trong bản Yêu sách của nhân dân An Nam năm 1919.","g":"Tài liệu mô tả nội dung bản Yêu sách của nhân dân An Nam năm 1919 và ý nghĩa của nó trong tư tưởng Hồ Chí Minh.","x":"Tài liệu ghi rõ trong bản Yêu sách của nhân dân An Nam năm 1919, một trong những yêu cầu là \"Thay thế chế độ ra các sắc lệnh bằng chế độ ra các đạo luật\". Điều này thể hiện sự nhất quán trong tư tưởng Hồ Chí Minh về việc xây dựng một Nhà nước hợp hiến, hợp pháp với nền tảng pháp lý vững chắc ngay từ rất sớm.","d":1},{"s":4,"q":"Hồ Chí Minh cho rằng, việc giáo dục pháp luật cần tập trung chủ yếu vào thế hệ trẻ để xây dựng ý thức pháp quyền vững chắc cho tương lai.","g":"Tài liệu đề cập đến đối tượng và tầm quan trọng của công tác giáo dục pháp luật.","x":"Tài liệu chỉ rõ \"công tác giáo dục pháp luật cho mọi người, đặc biệt cho thế hệ trẻ trở nên cực kỳ quan trọng\". Điều này có nghĩa là công tác giáo dục pháp luật phải được thực hiện cho tất cả mọi người, không chỉ riêng thế hệ trẻ, mặc dù Người nhấn mạnh tầm quan trọng đặc biệt của việc giáo dục cho thế hệ trẻ để xây dựng Nhà nước pháp quyền.","d":0},{"s":21,"q":"Theo Tài liệu môn học, Hồ Chí Minh xác định lãng phí chỉ là lãng phí tiền của do nhân dân đóng góp cho hoạt động của bộ máy nhà nước.","g":"Hãy nhớ lại Tài liệu môn học liệt kê những dạng lãng phí nào mà Hồ Chí Minh đã xác định.","x":"Tài liệu môn học ghi: “Lãng phí ở đây được Hồ Chí Minh xác định là lãng phí sức lao động, lãng phí thời gian, lãng phí tiền của.” Lãng phí bao gồm cả sức lao động và thời gian chứ không chỉ tiền của, nên nhận định trên là sai.","d":0},{"s":22,"q":"Hồ Chí Minh coi tham ô, lãng phí, quan liêu là “giặc nội xâm”, “giặc ở trong lòng”, thứ giặc nguy hiểm hơn giặc ngoại xâm.","g":"Hãy nhớ lại cách Hồ Chí Minh so sánh các tiêu cực trong bộ máy nhà nước với kẻ thù từ bên ngoài.","x":"Tài liệu môn học ghi: “Hồ Chí Minh coi tham ô, lãng phí, quan liêu là ‘giặc nội xâm’, ‘giặc ở trong lòng’, thứ giặc nguy hiểm hơn giặc ngoại xâm.” Nhận định trên đúng với Tài liệu môn học.","d":1}],"tn":[{"s":5,"q":"Theo tư tưởng Hồ Chí Minh, yếu tố nào được Người xem là quan trọng nhất trong việc Nhà nước quản lý bộ máy và điều hành xã hội?","g":"Tài liệu chỉ ra biện pháp quản lý được Hồ Chí Minh đánh giá cao nhất.","x":"Tài liệu nêu rõ: \"Trong tư tưởng Hồ Chí Minh, Nhà nước quản lý bằng bộ máy và bằng nhiều biện pháp khác nhau, nhưng quan trọng nhất là quản lý bằng Hiến pháp và bằng pháp luật nói chung.\" Đây là nguyên tắc cốt lõi của Nhà nước pháp quyền.","p":[["A","Quản lý bằng bộ máy hành chính cồng kềnh."],["B","Quả
