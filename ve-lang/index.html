<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Về Làng Sen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
:root{
  --giay:#F4ECD6; --giay2:#FBF5E6; --giay3:#E9DFC2; --vien:#E2D6B4; --vien2:#B9A67B;
  --chu:#1E2B24; --mo:#4A5B52; --dam:#1F4A3A; --dam2:#163A30; --toi:#10261F;
  --vang:#E7B940; --sen:#E7A0AE; --sen-dam:#B4566A; --dung:#2F8F6B; --sai:#C8643F; --nen:#D3EAE0;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --sans:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(19px,1.32vw,30px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#2F6B47;color:var(--chu);font-family:var(--sans);line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #1B5FA8;outline-offset:2px}
h1,h2,h3,p{margin:0}
.tay{font-family:var(--hand);font-weight:400}
.mo{color:var(--mo)}

/* cảnh vẽ: một lớp 1440×810 co giãn theo khung (phủ kín hoặc vừa khung) */
.canh{position:fixed;inset:0;overflow:hidden;background:var(--nen)}
.lop{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0}
.lop svg.ve{position:absolute;left:0;top:0;width:1440px;height:810px;display:block}
#lop-dong{position:absolute;inset:0}

/* bảng chữ (giấy dó) */
.bang{position:fixed;z-index:2;background:var(--giay);border-radius:1.2rem;box-shadow:0 18px 40px rgba(16,38,31,.35);
  padding:1.3rem 1.4rem;display:flex;flex-direction:column;gap:.8rem;max-height:calc(100vh - 2rem);overflow:auto}
.nut{min-height:3rem;border:0;border-radius:.85rem;background:var(--vang);color:#1B2A22;font-family:var(--hand);font-size:1.55rem;
  line-height:1.1;padding:.35rem 1.1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;text-align:center}
.nut:disabled{opacity:.5}
.nut.toi{background:var(--dam);color:var(--giay)}
.nut2{min-height:2.6rem;border:2px solid var(--vien2);border-radius:.85rem;background:transparent;color:var(--dam);font-weight:600;font-size:1rem;padding:.3rem 1rem}
.nut2:disabled{opacity:.55}
.lienket{min-height:2.4rem;border:0;background:transparent;color:var(--dam);font-weight:600;text-decoration:underline;padding:.2rem .6rem;font-size:1rem}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .7rem;border-radius:.7rem;background:var(--dam);color:var(--giay);font-size:.9rem;font-weight:600}
.truong{display:flex;flex-direction:column;gap:.35rem}
.truong label{font-weight:600;font-size:1rem}
.truong input,.truong select{height:2.8rem;padding:0 .8rem;border:2px solid var(--vien2);border-radius:.75rem;background:#FFFBF0;font-size:1.05rem;width:100%}
.loi{color:#8E3E22;font-weight:600;font-size:.95rem}
.hud{position:fixed;right:1.3rem;top:1.1rem;z-index:3;display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.pill{min-height:2.4rem;padding:0 .95rem;border-radius:1.2rem;background:rgba(16,38,31,.84);color:var(--giay);display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:1rem;border:0}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:#C8643F;display:inline-block}
.dot.on{background:#7FD19B}.dot.dang{background:#E7B940}

/* màn mở đầu */
.tieu-de{position:absolute;left:0;right:0;top:52px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:#163A30}
.tieu-de .ve1{font-family:var(--hand);font-size:46px;line-height:1;color:#2D5E50;letter-spacing:1px}
.tieu-de h1{font-family:var(--hand);font-weight:400;font-size:136px;line-height:.9;letter-spacing:2px}
.tieu-de p{margin-top:10px;font-size:22px;font-weight:500;color:#24493F}
.ky{position:absolute;left:116px;bottom:34px;font-family:var(--hand);font-size:24px;color:var(--giay);line-height:1.1}
.bang-dau{right:4.4vw;bottom:6vh;width:21rem}
.tiep{display:flex;flex-direction:column;gap:.5rem;padding-bottom:.8rem;border-bottom:2px solid var(--vien)}
.hang-nut{display:flex;flex-wrap:wrap;gap:.2rem .6rem;justify-content:center}

/* bản đồ */
.bang-trai{left:1.4rem;top:1.4rem;bottom:1.4rem;width:18.5rem}
.bang-trai h2{font-family:var(--hand);font-weight:400;font-size:2.8rem;line-height:1;color:var(--dam2)}
.so3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;padding:.7rem 0;border-top:2px solid var(--vien);border-bottom:2px solid var(--vien)}
.so3 b{display:block;font-family:var(--hand);font-weight:400;font-size:1.8rem;line-height:1;color:var(--dam)}
.so3 span{font-size:.85rem;color:var(--mo)}
.thanh{height:.65rem;border-radius:.33rem;background:var(--vien);overflow:hidden}
.thanh i{display:block;height:100%;background:#3F7F55;border-radius:.33rem}
.chu-giai{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem .6rem;font-size:.85rem;color:#2D4A40}
.chu-giai div{display:flex;align-items:center;gap:.45rem}
.chu-giai i{flex:none;width:1.05rem;height:1.05rem;border-radius:50%;display:inline-block}
.nut-tron{position:fixed;right:2rem;bottom:1.6rem;z-index:2;width:4rem;height:4rem;border-radius:50%;background:rgba(244,236,214,.9);display:flex;align-items:center;justify-content:center}
.nut-tron span{position:absolute;top:-.25rem;font-family:var(--hand);font-size:1.05rem;color:var(--dam);background:var(--giay);border-radius:.4rem;padding:0 .3rem}
.diem{position:absolute;width:0;height:0}
.diem .o{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--hand)}

/* ngã rẽ */
.bang-tren{left:50%;top:1.7rem;transform:translateX(-50%);width:min(52.6rem,94vw);gap:.6rem}
.bang-tren .cau{font-size:1.45rem;line-height:1.4;font-weight:500}
.hang-chip{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.95rem;font-weight:600;color:#2D4A40}
.bien{position:absolute;width:236px;height:72px;border:0;font-family:var(--hand);font-size:38px;letter-spacing:2px;
  box-shadow:0 8px 16px rgba(16,38,31,.35);color:#FFF4DC;background:#8A5A3C}
.bien:disabled{background:#6E4A3A;color:#E9D9C2;opacity:.75}
.bien.mo-loi{background:var(--dung);color:#FFFBF0;opacity:1}
.bien-trai{left:482px;top:446px;padding-left:34px;clip-path:polygon(16% 0,100% 0,100% 100%,16% 100%,0 50%)}
.bien-phai{left:722px;top:528px;padding-right:34px;clip-path:polygon(0 0,84% 0,100% 50%,84% 100%,0 100%)}
.nut-ds{display:none;gap:.6rem}
.nut-ds .nut{flex:1}
.bang-kq{left:2.1rem;bottom:2.1rem;width:23rem;max-height:62vh;gap:.6rem}
.kq-dau{display:flex;align-items:center;gap:.6rem}
.kq-dau h2{font-family:var(--hand);font-weight:400;font-size:2.1rem;line-height:1}
.giai{font-size:1rem;line-height:1.5}
.goc-phai{position:fixed;z-index:2;right:2.1rem;bottom:2.1rem;width:22rem;display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
.hop-goi-y{width:100%;padding:.9rem 1rem;background:rgba(16,38,31,.9);color:var(--giay);border-radius:.95rem;font-size:1rem;line-height:1.5}
.nut-goi-y{min-height:2.6rem;padding:0 1rem;border:2px solid var(--giay);border-radius:1.3rem;background:rgba(244,236,214,.92);color:var(--dam);font-weight:600;font-size:1rem}

/* trạm */
.ten-tram{position:absolute;left:132px;top:40px;display:flex;flex-direction:column;gap:2px}
.ten-tram .nho{font-family:var(--hand);font-size:26px;color:#2D5E50}
.ten-tram .lon{font-family:var(--hand);font-size:64px;line-height:1;color:var(--dam2)}
.bang-phai{right:1.7rem;top:1.7rem;bottom:1.7rem;width:39rem}
.bang-phai .cau{font-size:1.3rem;line-height:1.45;font-weight:500}
.pa{display:flex;flex-direction:column;gap:.45rem}
.pa button{display:flex;align-items:center;gap:.75rem;min-height:2.9rem;padding:.4rem .75rem;border-radius:.75rem;border:2px solid var(--vien);
  background:var(--giay2);font-size:1rem;line-height:1.35;text-align:left}
.pa .ma{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--vien);color:var(--dam);display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:1.25rem}
.pa .chon{border-color:var(--dam);background:#FFFBF0}.pa .chon .ma{background:var(--dam);color:#FFFBF0}
.pa .dung{border-color:var(--dung);background:#D9EBDD}.pa .dung .ma{background:var(--dung);color:#FFFBF0}
.pa .sai{border-color:var(--sai);background:#F3D9CC}.pa .sai .ma{background:var(--sai);color:#FFFBF0}
.pa button:disabled{color:var(--chu);opacity:1}
.hop-giai{padding:.75rem .85rem;border-radius:.75rem;background:var(--giay3);font-size:.95rem;line-height:1.5}
.hop-sen{position:absolute;left:132px;top:150px;display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:28px;background:rgba(16,38,31,.86);color:var(--giay);font-size:22px;font-weight:600}
.hang-cuoi{display:flex;gap:.6rem;align-items:stretch}

/* về đích */
.ten-dich{position:absolute;left:170px;top:44px;display:flex;flex-direction:column;gap:4px}
.ten-dich .nho{font-family:var(--hand);font-size:30px;color:#2D5E50}
.ten-dich h1{font-family:var(--hand);font-weight:400;font-size:92px;line-height:.95;color:var(--dam2)}
.bang-dich{right:1.9rem;top:1.9rem;bottom:1.9rem;width:26.3rem}
.o4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.o4 div{padding:.6rem .8rem;border-radius:.75rem;background:var(--giay2);display:flex;flex-direction:column}
.o4 b{font-family:var(--hand);font-weight:400;font-size:2.1rem;line-height:1;color:var(--dam)}
.o4 span{font-size:.85rem;color:var(--mo)}
.the-sai{padding:.3rem .65rem;border-radius:.65rem;background:#F3D9CC;color:#6E2E18;font-size:.88rem;border:0;min-height:2.2rem}
.ghi-chu{display:flex;align-items:center;gap:.6rem;padding:.75rem .85rem;border-radius:.75rem;background:#D9EBDD;font-size:.95rem;line-height:1.45}

/* máy chiếu */
.dau-chieu{position:fixed;left:3.8vw;right:3.8vw;top:1.4rem;z-index:2;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.dau-chieu h1{font-family:var(--hand);font-weight:400;font-size:3rem;line-height:1;color:var(--dam2)}
.dau-chieu .chip{font-size:1.1rem}
.dau-chieu .pill{font-size:1.2rem;min-height:2.7rem}
.dau-chieu .sang{background:var(--giay);color:var(--dam)}
.bang-chieu{left:3.8vw;right:3.8vw;top:6.2rem;bottom:1.4rem;padding:.9rem 1.4rem 1rem;gap:0}
.dong{display:grid;grid-template-columns:4.5rem 9.5rem minmax(0,1fr) 7.5rem 7.5rem 7.5rem;align-items:center;border-bottom:1px solid #E8DDBF}
.dong.dau{border-bottom:3px solid var(--vien);font-weight:700;color:var(--mo);min-height:2.4rem;font-size:1rem}
.dong .so{font-family:var(--hand);text-align:right}
.dong .sen{color:var(--sen-dam)}
.cham{display:flex;align-items:center;gap:.5rem}
.cham i{border-radius:50%;display:inline-block;box-sizing:border-box;border:3px solid}
.nhan{margin-left:.3rem;padding:.1rem .6rem;border-radius:.6rem;font-size:.95rem;font-weight:600}
.cho-vao{flex:1;display:flex;align-items:center;justify-content:center;gap:3rem;flex-wrap:wrap;text-align:center}
.cho-vao .ma-phong{font-family:var(--hand);font-size:6rem;line-height:1;letter-spacing:.15em;color:var(--dam2)}
.qr svg{display:block;width:100%;height:100%}
.qr{background:#fff;padding:.5rem;border-radius:.6rem}

/* lớp phủ */
.phu{position:fixed;inset:0;z-index:9;background:rgba(16,38,31,.6);display:flex;align-items:center;justify-content:center;padding:1rem}
.phu .bang{position:relative;max-width:44rem;width:100%;max-height:calc(100vh - 2rem)}
.phu ul{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.4rem}
.dong-lai{align-self:flex-end}
.bao{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:10;background:var(--toi);color:var(--giay);padding:.7rem 1.1rem;border-radius:.8rem;font-weight:600;max-width:90vw}
.an{display:none!important}

/* màn dọc (điện thoại): cảnh ở trên, bảng ở dưới */
@media (max-aspect-ratio:1/1){
  .canh{position:relative;height:46vh}
  .bang{position:relative;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;
    width:auto!important;max-height:none;margin:-1.4rem .7rem 1rem;overflow:visible}
  .goc-phai{position:relative;right:auto;bottom:auto;width:auto;margin:0 .7rem 1rem;align-items:stretch}
  .canh[data-vua=tuy]{height:56.25vw}
  .hud{position:relative;right:auto;top:auto;justify-content:center;padding:.6rem .7rem 0}
  .hud ~ .bang,.hud ~ .goc-phai{margin-top:.7rem}
  .pill{min-height:2.2rem;font-size:.9rem}
  .bang-tren .cau{font-size:1.15rem}
  .bang-phai .cau{font-size:1.1rem}
  .tieu-de h1{font-size:120px}
  .nut-tron{display:none}
  .bien{display:none}
  .nut-ds{display:flex}
  .dau-chieu{position:relative;left:auto;right:auto;margin:1rem}
  .bang-chieu .dong{grid-template-columns:3rem 6rem minmax(0,1fr) 4rem 4rem 4rem}
}
</style>
</head>

const DB = {"ten":"Về Làng Sen","capNhat":"2026-10-10","soChang":6,"buoi":{"2":["01"],"3":["02"],"4":["02"],"5":["02","03"],"6":["04"],"7":["05"],"8":["06"],"9":["07","08","09"],"10":["10","11"],"11":["13","14"],"12":["01","02","03","04","05","06","07","08","09","10","11","12","13","14"]},"cd":{"01":{"ten":"Khái niệm, ý nghĩa","ds":[{"s":26,"q":"Theo Tài liệu môn học, đối tượng nghiên cứu của môn học Tư tưởng Hồ Chí Minh không chỉ là toàn bộ những quan điểm của Hồ Chí Minh thể hiện trong di sản của Người, mà còn là quá trình hệ thống quan điểm đó vận động trong thực tiễn.","g":"Hãy nhớ lại mục II “Đối tượng nghiên cứu” của Chương 1: đối tượng nghiên cứu được xác định ở mấy phương diện?","x":"Tài liệu môn học ghi: “Đối tượng nghiên cứu của môn học Tư tưởng Hồ Chí Minh là toàn bộ những quan điểm của Hồ Chí Minh thể hiện trong di sản của Người.” và “Đối tượng nghiên cứu của môn học Tư tưởng Hồ Chí Minh còn là quá trình hệ thống quan điểm của Hồ Chí Minh vận động trong thực tiễn.” Vì vậy, nhận định trên là đúng.","d":1},{"s":27,"q":"Theo Tài liệu môn học, khi nghiên cứu tư tưởng Hồ Chí Minh, người nghiên cứu chỉ cần đứng trên lập trường giai cấp công nhân (tính đảng), còn việc bảo đảm tính khách quan, khoa học của các luận đề là yêu cầu không bắt buộc.","g":"Hãy nhớ lại tên gọi của nguyên tắc phương pháp luận đầu tiên trong nghiên cứu tư tưởng Hồ Chí Minh.","x":"Tài liệu môn học ghi: “Đồng thời, phải bảo đảm tính khách quan, khoa học của các luận đề nêu ra. Sự thống nhất chặt chẽ giữa tính đảng và tính khoa học là một nguyên tắc rất cơ bản trong phương pháp luận nghiên cứu tư tưởng Hồ Chí Minh.” Tính khoa học là yêu cầu bắt buộc, gắn chặt với tính đảng, nên nhận định trên là sai.","d":0},{"s":28,"q":"Theo quan điểm toàn diện và hệ thống trong nghiên cứu tư tưởng Hồ Chí Minh, các bộ phận của hệ thống tư tưởng Hồ Chí Minh gắn kết với nhau xung quanh hạt nhân cốt lõi là tư tưởng về đạo đức cách mạng.","g":"Hãy nhớ lại những giá trị mà Tài liệu môn học xác định là “hạt nhân cốt lõi” của hệ thống tư tưởng Hồ Chí Minh.","x":"Tài liệu môn học ghi: “Khi nghiên cứu tư tưởng Hồ Chí Minh trên bình diện tổng thể hay từng bộ phận phải luôn luôn quán triệt mối liên hệ qua lại của các yếu tố, các bộ phận khác nhau trong sự gắn kết tất yếu của hệ thống tư tưởng đó xung quanh hạt nhân cốt lõi là tư tưởng độc lập, tự do, dân chủ và chủ nghĩa xã hội.” Hạt nhân cốt lõi là tư tưởng độc lập, tự do, dân chủ và chủ nghĩa xã hội, không phải tư tưởng về đạo đức cách mạng, nên nhận định trên là sai.","d":0},{"s":29,"q":"Theo Tài liệu môn học, có nhiều nội dung phản ánh tư tưởng Hồ Chí Minh không nằm trong văn bản mà ở trong chỉ đạo thực tiễn của chính Hồ Chí Minh; vì vậy, nghiên cứu tư tưởng Hồ Chí Minh cần kết hợp phân tích văn bản với nghiên cứu hoạt động thực tiễn của Người.","g":"Hãy nghĩ xem di sản Hồ Chí Minh để lại chỉ gồm các tác phẩm hay còn gồm cả toàn bộ cuộc đời hoạt động của Người.","x":"Tài liệu môn học ghi: “Có nhiều nội dung phản ánh tư tưởng Hồ Chí Minh không ở trong văn bản mà là ở trong chỉ đạo thực tiễn của chính bản thân Hồ Chí Minh” — đây là lý do Tài liệu môn học nêu “Phương pháp phân tích văn bản kết hợp với nghiên cứu hoạt động thực tiễn của Hồ Chí Minh.” Nhận định trên là đúng.","d":1},{"s":30,"q":"Theo Tài liệu môn học, phương pháp lôgíc là phương pháp nghiên cứu sự vật và hiện tượng theo trình tự thời gian, quá trình diễn biến đi từ phát sinh, phát triển đến hệ quả của nó.","g":"Hãy so sánh định nghĩa của phương pháp lôgíc và phương pháp lịch sử trong Tài liệu môn học.","x":"Tài liệu môn học ghi: “Phương pháp lôgíc nghiên cứu một cách tổng quát nhằm tìm ra được bản chất vốn có của sự vật, hiện tượng và khái quát thành lý luận.” và “Phương pháp lịch sử nghiên cứu sự vật và hiện tượng theo trình tự thời gian, quá trình diễn biến đi từ phát sinh, phát triển đến hệ quả của nó.” Nhận định trên đã gán đặc điểm của phương pháp lịch sử cho phương pháp lôgíc nên là sai.","d":0},{"s":31,"q":"Theo Tài liệu môn học, khái niệm tư tưởng Hồ Chí Minh do Đại hội XI của Đảng nêu ra đã chỉ rõ nội hàm cơ bản, cơ sở hình thành cũng như ý nghĩa của tư tưởng Hồ Chí Minh.","g":"Hãy nhớ lại câu dẫn trước ba ý “Một là”, “Hai là”, “Ba là” phân tích khái niệm tư tưởng Hồ Chí Minh trong Tài liệu môn học.","x":"Tài liệu môn học ghi: “Khái niệm trên đây chỉ rõ nội hàm cơ bản của tư tưởng Hồ Chí Minh, cơ sở hình thành cũng như ý nghĩa của tư tưởng Hồ Chí Minh.” Ba ý “Một là”, “Hai là”, “Ba là” lần lượt làm rõ ba phương diện đó. Nhận định trên là đúng.","d":1},{"s":32,"q":"Theo Tài liệu môn học, phải đến Đại hội XI (năm 2011), Đảng mới lần đầu xác định tư tưởng Hồ Chí Minh là “một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam”.","g":"Hãy đối chiếu các mốc đại hội trong phần trình bày quá trình nhận thức của Đảng về tư tưởng Hồ Chí Minh trong Tài liệu môn học.","x":"Tài liệu môn học ghi: “Tại Đại hội đại biểu toàn quốc lần thứ IX (tháng 4/2001), Đảng ta đã nhận thức về tư tưởng Hồ Chí Minh một cách đầy đủ hơn”, với nội dung: “Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam”. Nội dung này đã có từ Đại hội IX, trước Đại hội XI, nên nhận định trên là sai.","d":0},{"s":33,"q":"Theo Tài liệu môn học, môn học Tư tưởng Hồ Chí Minh là một nội dung của chuyên ngành Hồ Chí Minh học, nằm trong ngành Khoa học chính trị.","g":"Hãy nhớ lại câu mở đầu mục II “Đối tượng nghiên cứu” của Chương 1 trong Tài liệu môn học.","x":"Tài liệu môn học ghi: “Môn học Tư tưởng Hồ Chí Minh là một nội dung của chuyên ngành Hồ Chí Minh học (nằm trong ngành Khoa học chính trị).” Nhận định trên là đúng.","d":1},{"s":34,"q":"Theo nguyên tắc thống nhất lý luận và thực tiễn, trong nghiên cứu, học tập tư tưởng Hồ Chí Minh, thực tiễn được đặt lên trên, còn lý luận chỉ giữ vai trò thứ yếu.","g":"Hãy nhớ lại cách Tài liệu môn học trình bày quan hệ giữa hai mặt trong nguyên tắc phương pháp luận thứ hai khi nghiên cứu tư tưởng Hồ Chí Minh.","x":"Tài liệu môn học ghi: Hồ Chí Minh “vừa coi trọng lý luận, vừa coi trọng thực tiễn, vì thực tiễn khái quát nên lý luận và chính lý luận lại chỉ đạo thực tiễn” và “Trong nghiên cứu, học tập tư tưởng Hồ Chí Minh, không có sự tuyệt đối hóa mặt nào giữa lý luận và thực tiễn.” Vì vậy, nhận định trên là sai.","d":0},{"s":35,"q":"Theo Tài liệu môn học, quan điểm kế thừa và phát triển chỉ đòi hỏi người học kế thừa, vận dụng nguyên vẹn tư tưởng Hồ Chí Minh, không đặt ra yêu cầu phát triển sáng tạo tư tưởng của Người.","g":"Hãy nhớ lại yêu cầu mà Tài liệu môn học nêu ở mục đ) “Quan điểm kế thừa và phát triển” trong phần phương pháp luận.","x":"Tài liệu môn học ghi: “Nghiên cứu, học tập tư tưởng Hồ Chí Minh đòi hỏi không chỉ biết kế thừa, vận dụng mà còn phải biết phát triển sáng tạo tư tưởng của Người trong điều kiện lịch sử mới, trong bối cảnh cụ thể của đất nước và quốc tế.” Vì vậy, nhận định trên là sai.","d":0},{"s":36,"q":"Theo Tài liệu môn học, vì Hồ Chí Minh thể hiện tư tưởng của mình qua nhiều lĩnh vực như chính trị, triết học, kinh tế, quân sự, nên nghiên cứu tư tưởng của Người cần sử dụng các phương pháp chuyên ngành và liên ngành.","g":"Hãy nhớ lại lý do Tài liệu môn học nêu khi trình bày phương pháp cụ thể thứ ba trong nghiên cứu tư tưởng Hồ Chí Minh.","x":"Tài liệu môn học ghi: “Hồ Chí Minh thể hiện tư tưởng của mình thông qua nhiều lĩnh vực như chính trị, triết học, kinh tế, quân sự, tư tưởng văn hóa, v.v.. Vì vậy, trong nghiên cứu tư tưởng Hồ Chí Minh, các phương pháp chuyên ngành và liên ngành cần được sử dụng”. Nhận định trên là đúng.","d":1},{"s":37,"q":"Theo Tài liệu môn học, năng lực tư duy lý luận được hình thành và phát triển từ nhiều nguồn, qua nhiều giai đoạn, trong đó giai đoạn nghiên cứu ở trường đại học rất quan trọng, gắn với tuổi trẻ của con người.","g":"Hãy nhớ lại mục IV.1 “Góp phần nâng cao năng lực tư duy lý luận” trong Tài liệu môn học.","x":"Tài liệu môn học ghi: “Năng lực đó được hình thành và phát triển từ nhiều nguồn, trải qua nhiều giai đoạn, trong đó giai đoạn nghiên cứu ở trường đại học rất quan trọng, nó gắn với tuổi trẻ của con người.” Nhận định trên là đúng.","d":1}],"tn":[{"s":1,"q":"Khái niệm Tư tưởng Hồ Chí Minh được Đại hội XI của Đảng đưa ra nhấn mạnh điều gì là giá trị cơ bản nhất của tư tưởng này?","g":"Hãy xem xét yếu tố nào tạo nên tính độc đáo và đóng góp nền tảng, cốt lõi nhất của Hồ Chí Minh trong bối cảnh cách mạng Việt Nam theo định nghĩa.","x":"Theo định nghĩa của Đại hội XI, Tư tưởng Hồ Chí Minh \"là một hệ thống quan điểm toàn diện và sâu sắc... kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta\". Mặc dù các phương án khác đều đúng về tư tưởng Hồ Chí Minh, nhưng yếu tố \"vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin\" thể hiện bản chất khoa học, cách mạng, sự độc đáo và đóng góp nền tảng của Người cho cách mạng Việt Nam, là cốt lõi nhất khi xét về nguồn gốc và phương pháp luận.","p":[["A","Là sự kế thừa các giá trị truyền thống tốt đẹp của dân tộc."],["B","Là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta."],["C","Là kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của Việt Nam."],["D","Là hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam."],["E","Là kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam."]],"d":"C","k":"Chọn 1 đáp án đúng nhất"},{"s":2,"q":"Yếu tố nào sau đây thể hiện rõ nhất tính \"toàn diện và sâu sắc\" của Tư tưởng Hồ Chí Minh trong việc định hướng cách mạng Việt Nam?","g":"Tính \"toàn diện\" hàm ý bao quát nhiều khía cạnh, không chỉ một hay hai vấn đề riêng lẻ.","x":"Tài liệu mô tả tính \"toàn diện và sâu sắc\" của Tư tưởng Hồ Chí Minh bằng cách liệt kê nhiều khía cạnh khác nhau: mục tiêu quốc gia, con đường phát triển, vai trò của Đảng và Nhà nước, lực lượng cách mạng, xây dựng con người, kết hợp sức mạnh dân tộc và thời đại, cùng phương pháp cách mạng phù hợp. Do đó, phương án E tổng hợp đầy đủ và chính xác nhất, thể hiện tính toàn diện hơn các phương án chỉ nêu một phần.","p":[["A","Mục tiêu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh."],["B","Con đường phát triển độc lập dân tộc gắn liền với chủ nghĩa xã hội."],["C","Khẳng định vai trò lãnh đạo của Đảng Cộng sản Việt Nam và sự quản lý của Nhà nước cách mạng."],["D","Xác định lực lượng cách mạng là toàn thể nhân dân Việt Nam yêu nước."],["E","Bao gồm tất cả các yếu tố trên, cùng với việc xây dựng con người, kết hợp sức mạnh dân tộc và thời đại, và phương pháp cách mạng phù hợp."]],"d":"E","k":"Chọn 1 đáp án đúng nhất"},{"s":3,"q":"Mục đích cuối cùng mà Hồ Chí Minh và nhân dân Việt Nam hướng tới khi xây dựng đất nước là gì, theo tài liệu?","g":"Hãy tìm cụm từ đầy đủ nhất thể hiện cả mục tiêu nội tại của đất nước và đóng góp quốc tế.","x":"Tài liệu dẫn lời Hồ Chí Minh nêu rõ mong muốn cuối cùng: “Toàn Đảng toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh, và góp phần xứng đáng vào sự nghiệp cách mạng thế giới”. Phương án D bao quát đầy đủ cả hai khía cạnh này, làm cho nó trở thành câu trả lời đúng nhất.","p":[["A","Xây dựng một nước Việt Nam độc lập, dân chủ và giàu mạnh."],["B","Góp phần xứng đáng vào sự nghiệp cách mạng thế giới."],["C","Xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh."],["D","Xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh, đồng thời góp phần xứng đáng vào sự nghiệp cách mạng thế giới."],["E","Thực hiện thành công chủ nghĩa xã hội."]],"d":"D","k":"Chọn 1 đáp án đúng nhất"},{"s":4,"q":"Sự kiện nào đánh dấu bước ngoặt quan trọng nhất trong nhận thức của Đảng Cộng sản Việt Nam về vai trò nền tảng tư tưởng của Tư tưởng Hồ Chí Minh, đặt ngang hàng với chủ nghĩa Mác - Lênin?","g":"Câu hỏi tìm kiếm \"bước ngoặt quan trọng nhất\" trong việc đặt Tư tưởng Hồ Chí Minh làm \"nền tảng tư tưởng, kim chỉ nam cho hành động\" cùng với chủ nghĩa Mác - Lênin.","x":"Theo tài liệu môn học: \"Chính vì thế, một trong những điểm mới của Đại hội VII là Đảng đã đánh giá đúng tầm vóc tư tưởng Hồ Chí Minh. Đại hội VII của Đảng khẳng định: “Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động”\". Các đại hội trước đó đã đề cập đến vai trò của Hồ Chí Minh hoặc sự cần thiết học tập tư tưởng của Người, nhưng Đại hội VII là lần đầu tiên chính thức đặt Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng và kim chỉ nam cùng với chủ nghĩa Mác - Lênin.","p":[["A","Đại hội II của Đảng (tháng 2/1951) khẳng định \"Đường lối chính trị... của Đảng ta hiện nay là đường lối... Hồ Chủ tịch\"."],["B","Đại hội IV của Đảng (tháng 12/1976) đánh giá Hồ Chí Minh là \"người sáng lập và rèn luyện Đảng ta\"."],["C","Đại hội VI của Đảng (tháng 12/1986) nhấn mạnh \"kế thừa di sản quý báu về tư tưởng và lý luận cách mạng của Chủ tịch Hồ Chí Minh\"."],["D","Đại hội VII của Đảng (năm 1991) khẳng định \"Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động\"."],["E","Đại hội IX của Đảng (tháng 4/2001) đưa ra khái niệm đầy đủ về Tư tưởng Hồ Chí Minh."]],"d":"D","k":"Chọn 1 đáp án đúng nhất"},{"s":5,"q":"Ý nghĩa toàn diện nhất của việc học tập môn học Tư tưởng Hồ Chí Minh đối với sinh viên, theo tài liệu, là gì?","g":"Hãy tìm câu trả lời bao quát đầy đủ các khía cạnh đã được trình bày trong phần \"Ý NGHĨA CỦA VIỆC HỌC TẬP MÔN HỌC TƯ TƯỞNG HỒ CHÍ MINH\".","x":"Các mục 1, 2, 3 trong phần II \"Ý NGHĨA CỦA VIỆC HỌC TẬP MÔN HỌC TƯ TƯỞNG HỒ CHÍ MINH\" đều nêu rõ các ý nghĩa khác nhau: nâng cao năng lực tư duy lý luận, giáo dục đạo đức, củng cố niềm tin, bồi dưỡng lòng yêu nước, và xây dựng phương pháp/phong cách công tác. Phương án E tổng hợp và bao quát tất cả các ý nghĩa này, làm cho nó trở thành câu trả lời toàn diện nhất.","p":[["A","Nâng cao năng lực tư duy lý luận để giải quyết các vấn đề trong cuộc sống."],["B","Giáo dục và định hướng thực hành đạo đức cách mạng, củng cố niềm tin khoa học và bồi dưỡng lòng yêu nước."],["C","Xây dựng, rèn luyện phương pháp và phong cách công tác, học tập phù hợp với bản thân."],["D","Góp phần trang bị tri thức, hình thành năng lực, niềm tin, tình cảm cách mạng và kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội."],["E","Toàn diện bao gồm nâng cao năng lực tư duy lý luận, giáo dục đạo đức cách mạng, củng cố niềm tin, bồi dưỡng lòng yêu nước, và xây dựng phương pháp, phong cách công tác để trở thành công dân có ích."]],"d":"E","k":"Chọn 1 đáp án đúng nhất"},{"s":6,"q":"Tư tưởng Hồ Chí Minh được xác định là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc Việt Nam, mãi mãi soi đường cho sự nghiệp cách mạng. Nhận định này được nêu lên lần đầu tiên trong khái niệm Tư tưởng Hồ Chí Minh tại Đại hội nào của Đảng?","g":"Hãy nhớ số thứ tự của Đại hội Đảng đã định nghĩa khái niệm này vào năm 2011.","x":"Theo tài liệu môn học: \"Đại hội đại biểu toàn quốc lần thứ XI của Đảng Cộng sản Việt Nam (năm 2011) nêu khái niệm “Tư tưởng Hồ Chí Minh\" như sau: “Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc... là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta, mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi”\".","p":[["A","Đại hội VII (1991)"],["B","Đại hội IX (2001)"],["C","Đại hội X (2006)"],["D","Đại hội XI (2011)"],["E","Đại hội XIII (2021)"]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":7,"q":"Một trong những cơ sở hình thành Tư tưởng Hồ Chí Minh, mà tài liệu nhấn mạnh là \"giá trị cơ bản nhất trong quá trình hình thành và phát triển\", là gì?","g":"Tìm yếu tố được xác định là \"cơ bản nhất\" trong tài liệu.","x":"Theo tài liệu môn học: \"Hai là, đã nêu lên cơ sở hình thành tư tưởng Hồ Chí Minh là chủ nghĩa Mác - Lênin - giá trị cơ bản nhất trong quá trình hình thành và phát triển của tư tưởng Hồ Chí Minh\".","p":[["A","Tiếp thu tinh hoa văn hóa nhân loại."],["B","Kế thừa các giá trị truyền thống tốt đẹp của dân tộc."],["C","Chủ nghĩa Mác - Lênin."],["D","Thực tiễn cách mạng Việt Nam."],["E","Kinh nghiệm từ các phong trào giải phóng dân tộc trên thế giới."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Theo khái niệm của Đại hội XI, mục tiêu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh được đặt ra nhằm góp phần xứng đáng vào sự nghiệp nào?","g":"Tài liệu đề cập đến một mục tiêu lớn hơn, liên quan đến tầm vóc quốc tế.","x":"Tài liệu chỉ rõ: \"Tư tưởng Hồ Chí Minh là hệ thống quan điểm toàn diện và sâu sắc về mục tiêu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh, góp phần xứng đáng vào sự nghiệp cách mạng thế giới.\"","p":[["A","Phát triển kinh tế khu vực Đông Nam Á."],["B","Liên minh các nước xã hội chủ nghĩa."],["C","Cách mạng thế giới."],["D","Bảo vệ hòa bình thế giới."],["E","Xóa đói giảm nghèo toàn cầu."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"UNESCO đã ra Nghị quyết kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh vào năm nào?","g":"Hãy chú ý đến năm Nghị quyết được ban hành, không phải năm kỷ niệm.","x":"Theo tài liệu môn học: \"Tổ chức Giáo dục, Khoa học và Văn hóa của Liên hợp quốc (UNESCO), tại khóa họp Đại Hội đồng lần thứ 24 ở Pari, từ ngày 20/10 đến ngày 20/11/1987, đã ra Nghị quyết số 240/18.6.5 về kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh\".","p":[["A","1987"],["B","1990"],["C","2001"],["D","2011"],["E","2021"]],"d":"A","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":10,"q":"\"Dĩ bất biến, ứng vạn biến\" là phương châm công tác nào của Hồ Chí Minh mà người học có thể vận dụng sau khi nghiên cứu môn học Tư tưởng Hồ Chí Minh?","g":"Phương châm này liên quan đến khả năng thích ứng linh hoạt trong nhiều tình huống khác nhau.","x":"Tài liệu cho biết người học \"có thể vận dụng xây dựng phong cách tư duy, phong cách diễn đạt, phong cách làm việc, phong cách ứng xử, phong cách sinh hoạt, v.v. phù hợp với hoàn cảnh như phương châm của Hồ Chí Minh: Dĩ bất biến, ứng vạn biến.\" Điều này ngụ ý rằng phương châm này có thể áp dụng cho nhiều khía cạnh của phong cách công tác và sinh hoạt.","p":[["A","Phong cách tư duy."],["B","Phong cách diễn đạt."],["C","Phong cách làm việc."],["D","Phong cách ứng xử."],["E","Tất cả các phong cách được nêu trên, và cả phong cách sinh hoạt."]],"d":"E","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":11,"q":"Phát biểu nào sau đây không phản ánh đúng ý nghĩa của Tư tưởng Hồ Chí Minh theo tài liệu?","g":"Hãy tìm câu không được nhắc đến hoặc không phải là vai trò trực tiếp được định nghĩa trong các tài liệu về ý nghĩa của Tư tưởng Hồ Chí Minh.","x":"Các phương án A, B, C, E đều được khẳng định rõ ràng trong các tài liệu về ý nghĩa của Tư tưởng Hồ Chí Minh. Phương án D \"là hệ thống quan điểm chỉ đạo trực tiếp cho việc phát triển kinh tế thị trường định hướng xã hội chủ nghĩa trong giai đoạn hiện nay\" không được đề cập trực tiếp hoặc là ý nghĩa được định nghĩa trong các đoạn trích.","p":[["A","Cùng với chủ nghĩa Mác - Lênin làm nền tảng tư tưởng cho Đảng."],["B","Là kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam."],["C","Là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta."],["D","Là hệ thống quan điểm chỉ đạo trực tiếp cho việc phát triển kinh tế thị trường định hướng xã hội chủ nghĩa trong giai đoạn hiện nay."],["E","Mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":12,"q":"Theo tài liệu, khi nghiên cứu môn học Tư tưởng Hồ Chí Minh, sinh viên sẽ không đạt được mục tiêu nào sau đây?","g":"Xem xét các ý nghĩa của môn học được liệt kê trong phần II của tài liệu để xác định mục tiêu nào không liên quan.","x":"Các phương án A, B, C, E đều là những mục tiêu và ý nghĩa được nêu trong phần \"II- Ý NGHĨA CỦA VIỆC HỌC TẬP MÔN HỌC TƯ TƯỞNG HỒ CHÍ MINH\". Tuy nhiên, mục tiêu \"phát triển trực tiếp các kỹ năng chuyên môn sâu trong lĩnh vực khoa học tự nhiên\" không được đề cập, vì môn học này tập trung vào tư duy lý luận, đạo đức, và phong cách làm việc cách mạng.","p":[["A","Nâng cao năng lực tư duy lý luận."],["B","Củng cố lập trường, quan điểm cách mạng trên nền tảng chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh."],["C","Vận dụng tư tưởng Hồ Chí Minh vào giải quyết các vấn đề đặt ra trong cuộc sống."],["D","Phát triển trực tiếp các kỹ năng chuyên môn sâu trong lĩnh vực khoa học tự nhiên."],["E","Hình thành năng lực, phương pháp làm việc, niềm tin, tình cảm cách mạng."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":13,"q":"Phát biểu nào dưới đây về quá trình nhận thức của Đảng Cộng sản Việt Nam về Tư tưởng Hồ Chí Minh là không chính xác?","g":"Hãy chú ý đến từ khóa \"không đơn giản\" hoặc \"thử thách\" trong quá trình nhận thức.","x":"Tài liệu và chỉ ra rằng \"việc nhận thức về tư tưởng Hồ Chí Minh... là một quá trình không đơn giản. Đã có sự hiểu không đúng từ Quốc tế Cộng sản và từ một số người trong Đảng Cộng sản Đông Dương\". Do đó, phát biểu B nói rằng quá trình này là \"đơn giản và thuận lợi\" là không chính xác.","p":[["A","Ngay từ khi ra đời, Cương lĩnh chính trị đầu tiên của Đảng đã thể hiện những nội dung cơ bản của tư tưởng Hồ Chí Minh."],["B","Việc nhận thức về tư tưởng Hồ Chí Minh sau khi Đảng ra đời là một quá trình đơn giản và thuận lợi."],["C","Đại hội II của Đảng (1951) đã nêu rõ đường lối chính trị, nếp làm việc và đạo đức cách mạng của Đảng ta hiện nay là của Hồ Chủ tịch."],["D","Đại hội VII của Đảng (1991) là một mốc lớn khi nêu cao tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động."],["E","Đại hội IX (2001) đã nhận thức về tư tưởng Hồ Chí Minh một cách đầy đủ hơn với định nghĩa chi tiết."]],"d":"B","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":14,"q":"Yếu tố nào sau đây không được liệt kê là một trong những giá trị mà Hồ Chí Minh đã vun trồng hoặc xây dựng theo đánh giá của Đại hội IV của Đảng (1976)?","g":"Đánh giá của Đại hội IV tập trung vào các công lao của Người trước năm 1976.","x":"Tài liệu liệt kê các công lao của Hồ Chí Minh theo đánh giá của Đại hội IV: \"người sáng lập và rèn luyện Đảng ta, người khai sinh nền Cộng hòa Dân chủ Việt Nam, người vun trồng khối đại đoàn kết dân tộc và xây dựng lực lượng vũ trang cách mạng\". Công cuộc đổi mới đất nước từ năm 1986 diễn ra sau khi Người qua đời (1969), do đó phương án E là không đúng.","p":[["A","Sáng lập và rèn luyện Đảng ta."],["B","Khai sinh nền Cộng hòa Dân chủ Việt Nam."],["C","Xây dựng lực lượng vũ trang cách mạng."],["D","Vun trồng khối đại đoàn kết dân tộc."],["E","Dẫn dắt công cuộc đổi mới đất nước từ năm 1986."]],"d":"E","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":15,"q":"Theo khái niệm Tư tưởng Hồ Chí Minh của Đại hội XI, cơ sở hình thành tư tưởng của Người không bao gồm yếu tố nào sau đây?","g":"Định nghĩa nêu rõ các yếu tố cấu thành và nguồn gốc của Tư tưởng Hồ Chí Minh.","x":"Định nghĩa trong tài liệu chỉ rõ Tư tưởng Hồ Chí Minh là \"kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta, kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hoá nhân loại\". Không có yếu tố \"kế thừa trực tiếp từ tư tưởng phong kiến Việt Nam\" được đề cập như một cơ sở hình thành trong định nghĩa này.","p":[["A","Vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin."],["B","Kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc."],["C","Tiếp thu tinh hoa văn hóa nhân loại."],["D","Sự kế thừa trực tiếp từ tư tưởng phong kiến Việt Nam."],["E","Điều kiện cụ thể của nước ta."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":21,"q":"“Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam, kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta, kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hoá nhân loại; là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta, mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi” là khái niệm được nêu ra tại Đại hội đại biểu toàn quốc lần thứ _______ của Đảng Cộng sản Việt Nam (năm 2011).","g":"Hãy nhớ số thứ tự của Đại hội Đảng đã định nghĩa khái niệm này vào năm 2011.","x":"Theo tài liệu môn học: \"Đại hội đại biểu toàn quốc lần thứ XI của Đảng Cộng sản Việt Nam (năm 2011) nêu khái niệm “Tư tưởng Hồ Chí Minh\" như sau...\".","p":[["A","IX"],["B","X"],["C","XI"],["D","XII"],["E","XIII"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":22,"q":"Tư tưởng Hồ Chí Minh được xác định là nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam cùng với _______.","g":"Tài liệu thường xuyên nhắc đến hai trụ cột tạo nên nền tảng tư tưởng của Đảng.","x":"Tài liệu đều khẳng định: \"Cùng với chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh là một bộ phận cấu thành làm nên nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam.\"","p":[["A","chủ nghĩa yêu nước"],["B","chủ nghĩa xã hội khoa học"],["C","chủ nghĩa Mác - Lênin"],["D","chủ nghĩa nhân văn"],["E","chủ nghĩa tập thể"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":23,"q":"Con đường phát triển của dân tộc Việt Nam theo Tư tưởng Hồ Chí Minh là độc lập dân tộc gắn liền với _______.","g":"Hãy tìm mục tiêu cụ thể mà Người đã lựa chọn cho con đường cách mạng Việt Nam.","x":"Theo tài liệu môn học: \"Để đạt mục tiêu đó, con đường phát triển của dân tộc Việt Nam là độc lập dân tộc gắn liền với chủ nghĩa xã hội.\"","p":[["A","dân chủ"],["B","phát triển bền vững"],["C","chủ nghĩa xã hội"],["D","đổi mới"],["E","công nghiệp hóa"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":24,"q":"Tổ chức quốc tế nào đã ra Nghị quyết về kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh, tôn vinh Người là \"Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam\"?","g":"Hãy nhớ tên tổ chức văn hóa, khoa học, giáo dục của Liên Hợp Quốc đã đưa ra nghị quyết này.","x":"Tài liệu và ghi rõ: \"Tổ chức Giáo dục, Khoa học và Văn hóa của Liên hợp quốc (UNESCO)... đã ra Nghị quyết số 24C/18.6.5 về kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh, trong đó xác nhận... “Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam”\".","p":[["A","Liên hợp quốc"],["B","UNESCO"],["C","WHO"],["D","UNICEF"],["E","IMF"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":25,"q":"Theo tài liệu, việc nghiên cứu môn học Tư tưởng Hồ Chí Minh giúp sinh viên tích cực, chủ động đấu tranh phê phán những quan điểm sai trái để bảo vệ sự trong sáng của chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, đường lối, chủ trương của Đảng, chính sách, pháp luật của _______.","g":"Trong hệ thống chính trị Việt Nam, ai là chủ thể ban hành chính sách, pháp luật được nhắc đến cùng với Đảng?","x":"Theo tài liệu môn học: \"tích cực, chủ động đấu tranh phê phán những quan điểm sai trái để bảo vệ sự trong sáng của chủ nghĩa Mác Lênin, tư tưởng Hồ Chí Minh, đường lối, chủ trương của Đảng, chính sách, pháp luật của Nhà nước\".","p":[["A","Chính phủ"],["B","Nhà nước"],["C","Quốc hội"],["D","Mặt trận Tổ quốc"],["E","Đoàn Thanh niên"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"}]},"02":{"ten":"Cơ sở hình thành","ds":[{"s":1,"q":"Phong trào Cần Vương cuối thế kỷ XIX thất bại chứng tỏ rằng tư tưởng phong kiến đã lỗi thời và không thể đáp ứng được các nhiệm vụ lịch sử của dân tộc.","g":"Hãy xem xét nguyên nhân thất bại của các phong trào yêu nước dưới ngọn cờ \"Cần Vương\" được nhắc đến trong đoạn văn.","x":"Tài liệu môn học nêu rõ: \"Các cuộc khởi nghĩa vũ trang dưới ngọn cờ “Cần Vương” do các sĩ phu, văn thần lãnh đạo cuối cùng đều thất bại. Điều đó chứng tỏ tư tưởng phong kiến tỏ ra lỗi thời trước các nhiệm vụ lịch sử.\"","d":1},{"s":2,"q":"Mặc dù chịu ba tầng áp bức bóc lột là thực dân, tư bản và phong kiến, nhưng giai cấp công nhân Việt Nam cuối thế kỷ XIX đầu thế kỷ XX vẫn chưa thể vươn lên thành lực lượng lãnh đạo cách mạng do số lượng còn ít ỏi và sự thiếu ổn định.","g":"Tập trung vào vai trò và phẩm chất của giai cấp công nhân Việt Nam được miêu tả trong Tài liệu môn học tài liệu, đặc biệt là nhận định của Hồ Chí Minh.","x":"Mặc dù lúc đầu công nhân là lực lượng ít ỏi, không ổn định, nhưng đến đầu thế kỷ XX, họ đã phát triển và trở thành một giai cấp ngay trước Chiến tranh thế giới thứ nhất (1914 - 1918). Tài liệu môn học khẳng định: \"Chỉ có giai cấp công nhân là dũng cảm nhất, cách mạng nhất, luôn luôn gan góc đương đầu với bọn đế quốc thực dân\" và chính phong trào công nhân đã tạo điều kiện thuận lợi để chủ nghĩa Mác - Lênin xâm nhập, truyền bá vào Việt Nam, chấm dứt sự khủng hoảng về đường lối cách mạng. Điều này ngụ ý vai trò lãnh đạo tiềm năng của họ, dù chưa được chính thức khẳng định ở đây.","d":0},{"s":3,"q":"Cách mạng Tháng Mười Nga năm 1917 chỉ có ý nghĩa cục bộ đối với nước Nga mà không tạo ra bước ngoặt quyết định cho phong trào giải phóng dân tộc trên thế giới.","g":"Hãy đọc kỹ phần miêu tả về ý nghĩa và ảnh hưởng của Cách mạng Tháng Mười Nga đối với tình hình thế giới.","x":"Tài liệu môn học khẳng định Cách mạng Tháng Mười Nga \"là thắng lợi đầu tiên của chủ nghĩa Mác - Lênin ở một nước lớn\" và \"mở ra một thời đại mới trong lịch sử loài người – thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới, mở ra con đường giải phóng cho các dân tộc bị áp bức trên thế giới\". Rõ ràng, nó có ý nghĩa toàn cầu, không chỉ cục bộ.","d":0},{"s":4,"q":"Chủ nghĩa yêu nước là giá trị truyền thống tốt đẹp của dân tộc Việt Nam, nhưng nó chỉ là một trong nhiều động lực để Hồ Chí Minh ra đi tìm đường cứu nước, không phải là yếu tố khởi phát then chốt.","g":"Tìm hiểu vị trí và vai trò của chủ nghĩa yêu nước trong các giá trị truyền thống dân tộc đối với hành trình tìm đường cứu nước của Hồ Chí Minh.","x":"Tài liệu môn học khẳng định: \"Chính chủ nghĩa yêu nước là nền tảng tư tưởng, điểm xuất phát và động lực thúc đẩy Hồ Chí Minh ra đi tìm đường cứu nước, và tìm thấy ở chủ nghĩa Mác - Lênin con đường cứu nước, cứu dân.\" Điều này cho thấy chủ nghĩa yêu nước là yếu tố khởi phát then chốt, không phải chỉ \"một trong nhiều động lực\".","d":0},{"s":5,"q":"Hồ Chí Minh là người kế thừa một cách máy móc tư tưởng \"nhân trị, đức trị\" của Nho giáo trong quản lý xã hội, không có sự đổi mới sáng tạo nào.","g":"Đọc phần về sự kế thừa Nho giáo của Hồ Chí Minh, chú ý đến các từ khóa như \"kế thừa và đổi mới\", \"kế thừa và phát triển\".","x":"Tài liệu môn học và chỉ ra rằng Hồ Chí Minh \"chú ý kế thừa và đổi mới tư tưởng dùng nhân trị, đức trị để quản lý xã hội\" và \"chú ý kế thừa, đổi mới, phát triển tinh thần trọng đạo đức của Nho giáo\". Điều này bác bỏ nhận định Người kế thừa một cách máy móc.","d":0},{"s":6,"q":"Tài năng hoạt động và tổng kết thực tiễn của Hồ Chí Minh chủ yếu được hình thành qua việc nghiên cứu sách vở và tài liệu lý luận, chứ không phải từ vốn sống và hoạt động thực tiễn phong phú ở nhiều quốc gia.","g":"Hãy xem xét kỹ các yếu tố hình thành nhân tố chủ quan Hồ Chí Minh, đặc biệt là \"Tài năng hoạt động, tổng kết thực tiễn phát triển lý luận\".","x":"Tài liệu môn học nhấn mạnh: \"Hồ Chí Minh là người có vốn sống và thực tiễn cách mạng phong phú, phi thường. Trước khi trở thành Chủ tịch nước, Hồ Chí Minh đã sống, học tập và hoạt động cách mạng ở gần 30 nước trên thế giới.\" Người hiểu sâu sắc chủ nghĩa đế quốc, thực dân không chỉ qua tài liệu mà \"qua cuộc sống và hoạt động thực tiễn\", và thấu hiểu phong trào giải phóng dân tộc, xây dựng CNXH qua việc \"tham gia sáng lập Đảng Cộng sản Pháp, qua hoạt động ở Trung Quốc, qua tham gia phong trào cộng sản quốc tế ở nhiều nước, qua nghiên cứu đời sống xã hội ở Liên Xô\". Điều này cho thấy vai trò vượt trội của thực tiễn so với chỉ nghiên cứu sách vở.","d":0},{"s":31,"q":"Thực dân Pháp vẫn duy trì nền kinh tế nông nghiệp lạc hậu với khoảng 95% dân số là giai cấp địa chủ; nông dân được bổ sung, củng cố, tăng cường thêm các nông dân người Pháp và người nước ngoài.","g":"Để ý danh từ đứng ngay sau “95% dân số”.","x":"Nguyên văn đảo lại: “…khoảng 95% dân số là NÔNG DÂN; GIAI CẤP ĐỊA CHỦ được bổ sung, củng cố, tăng cường thêm các ĐIỀN CHỦ người Pháp và người nước ngoài.” Ba chỗ bị đổi trong một câu.","d":0},{"s":32,"q":"Sau khi hoàn thành căn bản việc bình định Việt Nam về mặt quân sự, thực dân Pháp vẫn duy trì nền kinh tế nông nghiệp lạc hậu với khoảng 95% dân số là công nhân.","g":"Giai cấp nào chiếm đại đa số dân số một nước nông nghiệp lạc hậu?","x":"Giáo trình viết “khoảng 95% dân số là NÔNG DÂN”. Chính con số này cho thấy giai cấp cũ không hề mất đi khi các giai tầng mới xuất hiện.","d":0},{"s":33,"q":"Cùng với những biến đổi trên, đến đầu thế kỷ XX, trước ảnh hưởng của các cuộc vận động cải cách, của cách mạng dân chủ tư sản ở Trung Quốc và tấm gương Tân Hợi của Nhật Bản, ở Việt Nam xuất hiện các phong trào yêu nước theo khuynh hướng dân chủ tư sản.","g":"Tân Hợi là cuộc cách mạng ở nước nào?","x":"Nguyên văn là “tấm gương DUY TÂN của Nhật Bản”. Cách mạng Tân Hợi (1911) diễn ra ở Trung Quốc — câu này tráo tên hai nước.","d":0},{"s":34,"q":"Vì đều thất bại trước yêu cầu giải phóng dân tộc, khuynh hướng phong kiến cuối thế kỷ XIX và khuynh hướng dân chủ tư sản đầu thế kỷ XX có thể được xem là tương đồng về cơ sở xã hội, hệ tư tưởng và phương pháp đấu tranh.","g":"Cùng một kết quả có đồng nghĩa với cùng một bản chất không?","x":"Hai khuynh hướng cùng thất bại nhưng khác nhau về lực lượng lãnh đạo, nền tảng tư tưởng và phương thức hoạt động: phong kiến gắn với sĩ phu, văn thân và đấu tranh vũ trang dưới ngọn cờ Cần Vương; dân chủ tư sản chịu ảnh hưởng của các cuộc vận động cải cách ở Trung Quốc và tấm gương Duy tân Nhật Bản.","d":0},{"s":35,"q":"Mâu thuẫn giữa giai cấp nông dân với địa chủ phong kiến là mâu thuẫn mới xuất hiện do tác động của chính sách khai thác thuộc địa của thực dân Pháp.","g":"Mâu thuẫn nào đã có từ trong xã hội phong kiến?","x":"Giáo trình gọi đó là “mâu thuẫn cơ bản trong xã hội phong kiến” — tức mâu thuẫn CŨ. Mâu thuẫn MỚI là giữa công nhân Việt Nam với giai cấp tư sản, và giữa toàn thể nhân dân Việt Nam với thực dân Pháp.","d":0},{"s":36,"q":"Đầu thế kỷ XX, giai cấp công nhân Việt Nam đã phát triển nhanh chóng về số lượng và trở thành lực lượng lãnh đạo duy nhất của cách mạng Việt Nam.","g":"Giáo trình dừng lại ở chữ nào khi nói về giai cấp công nhân giai đoạn này?","x":"Giáo trình chỉ viết công nhân “phát triển hơn và trở thành một giai cấp” ngay trước Chiến tranh thế giới thứ nhất (1914 – 1918). Vai trò lãnh đạo phải đến khi có Đảng Cộng sản Việt Nam (1930).","d":0},{"s":37,"q":"Do chính sách khai thác thuộc địa của thực dân Pháp, giai cấp công nhân Việt Nam đã hình thành và phát triển thành một giai cấp hoàn chỉnh ngay từ cuối thế kỷ XIX.","g":"Để ý cụm “ngay từ cuối thế kỷ XIX”.","x":"Cuối thế kỷ XIX, công nhân Việt Nam “mới chỉ là một lực lượng ít ỏi, không ổn định”. Đầu thế kỷ XX công nhân mới phát triển hơn và trở thành một giai cấp, ngay trước Chiến tranh thế giới thứ nhất.","d":0},{"s":38,"q":"Sự xuất hiện của các giai cấp, tầng lớp mới như công nhân, tư sản và tiểu tư sản trong xã hội Việt Nam đầu thế kỷ XX đã trực tiếp giải quyết được mâu thuẫn giữa toàn thể dân tộc Việt Nam với thực dân Pháp.","g":"Phân biệt sự biến đổi cơ cấu giai cấp với việc giải quyết mâu thuẫn.","x":"Cơ cấu giai cấp đổi thì LÀM XUẤT HIỆN THÊM mâu thuẫn mới chứ không giải quyết mâu thuẫn nào: “bên cạnh mâu thuẫn cơ bản trong xã hội phong kiến…, xuất hiện các mâu thuẫn mới”.","d":0},{"s":52,"q":"Phong trào Cần Vương thất bại là minh chứng rõ nét cho thấy hệ tư tưởng DÂN CHỦ TƯ SẢN đã không còn phù hợp với yêu cầu của lịch sử Việt Nam lúc bấy giờ.","g":"Nhớ lại hệ tư tưởng mà các văn thân, sĩ phu thời kỳ này đang theo đuổi.","x":"Cần Vương là phong trào theo hệ tư tưởng PHONG KIẾN; giáo trình viết sự thất bại của nó “đánh dấu sự bất lực của hệ tư tưởng phong kiến”. Hệ tư tưởng dân chủ tư sản chỉ bộc lộ bất lực qua các phong trào đầu thế kỷ XX (Đông Du, Duy Tân, Đông Kinh nghĩa thục, chống thuế Trung Kỳ).","d":0},{"s":53,"q":"Giai cấp công nhân Việt Nam phát triển và trở thành một giai cấp vào giai đoạn SAU khi Chiến tranh thế giới thứ nhất (1914 – 1918) kết thúc.","g":"Chú ý mốc thời gian: trước hay sau Chiến tranh thế giới thứ nhất.","x":"Giáo trình viết giai cấp công nhân Việt Nam đã phát triển và trở thành một giai cấp NGAY TRƯỚC thềm Chiến tranh thế giới thứ nhất. Đổi “ngay trước” thành “sau” là sai mốc.","d":0},{"s":55,"q":"Trước cuộc xâm lược của thực dân Pháp từ năm 1858, triều đình nhà Nguyễn đã kiên quyết kháng chiến đến cùng và không ký bất kỳ hiệp ước đầu hàng nào.","g":"Xem đoạn mở đầu nói về phản ứng của triều đình nhà Nguyễn.","x":"Nguyên văn: “Triều đình nhà Nguyễn lần lượt ký kết các hiệp ước đầu hàng, từng bước trở thành tay sai của thực dân Pháp.” Người kháng chiến đến cùng là nhân dân và các sĩ phu, văn thân — không phải triều đình.","d":0},{"s":60,"q":"Phong trào Đông Du do PHAN CHÂU TRINH khởi xướng (1905 – 1909), còn phong trào Duy Tân do PHAN BỘI CHÂU phát động (1906 – 1908).","g":"Hai mốc năm thì đúng — hãy soi tên người.","x":"Đảo tên hai cụ. Nguyên văn: Đông Du do PHAN BỘI CHÂU khởi xướng (1905 – 1909); Duy Tân do PHAN CHÂU TRINH phát động (1906 – 1908).","d":0},{"s":62,"q":"Dưới tác động của cuộc khai thác thuộc địa của thực dân Pháp, xã hội Việt Nam từ một xã hội phong kiến đã chuyển HOÀN TOÀN thành xã hội tư bản chủ nghĩa giống như các nước phương Tây.","g":"Các cụm từ mang tính tuyệt đối thường là chỗ sai.","x":"Nguyên văn: thực dân Pháp “từng bước biến nước ta từ một nước phong kiến thành nước ‘thuộc địa và phong kiến’”. Pháp không xóa bỏ phong kiến mà giữ lại để cai trị; địa chủ còn “được bổ sung, củng cố”.","d":0}],"tn":[{"s":7,"q":"Đâu là nguyên nhân sâu xa nhất dẫn đến sự thất bại của các phong trào yêu nước theo khuynh hướng dân chủ tư sản ở Việt Nam đầu thế kỷ XX?","g":"Tài liệu môn học tài liệu đã chỉ rõ nguyên nhân sâu xa và trực tiếp của sự thất bại này.","x":"Tài liệu môn học chỉ rõ: \"Các phong trào yêu nước theo khuynh hướng dân chủ tư sản nói trên đều thất bại. Nguyên nhân sâu xa là giai cấp tư sản Việt Nam còn non yếu. Nguyên nhân trực tiếp là các tổ chức và người lãnh đạo của các phong trào chưa có đường lối và phương pháp cách mạng đúng đắn.\"","p":[["A","Thiếu vũ khí hiện đại và sự đoàn kết trong nhân dân."],["B","Sự đàn áp tàn bạo của thực dân Pháp."],["C","Giai cấp tư sản Việt Nam còn non yếu về lực lượng và tổ chức."],["D","Sự thiếu vắng một nhà lãnh đạo tài ba và kiệt xuất."],["E","Sự lỗi thời của tư tưởng phong kiến."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":8,"q":"Nhận định nào sau đây của Hồ Chí Minh về giai cấp công nhân Việt Nam thể hiện rõ nhất vai trò tiên phong của họ trong cuộc đấu tranh giải phóng dân tộc?","g":"Tìm kiếm một trích dẫn trực tiếp của Hồ Chí Minh trong đoạn văn về phẩm chất của giai cấp công nhân.","x":"Tài liệu môn học trích lời Hồ Chí Minh: \"“Chỉ có giai cấp công nhân là dũng cảm nhất, cách mạng nhất, luôn luôn gan góc đương đầu với bọn đế quốc thực dân”\". Nhận định này trực tiếp khẳng định vai trò tiên phong và tính cách mạng của giai cấp công nhân, vượt trội so với các lựa chọn khác vốn chỉ miêu tả tình cảnh hoặc quá trình phát triển.","p":[["A","\"Công nhân Việt Nam chịu ba tầng áp bức bóc lột.\""],["B","\"Họ đã nhanh chóng tiến tới đình công, bãi công.\""],["C","\"Chỉ có giai cấp công nhân là dũng cảm nhất, cách mạng nhất, luôn luôn gan góc đương đầu với bọn đế quốc thực dân.\""],["D","\"Lực lượng công nhân lúc đó mới chỉ là một lực lượng ít ỏi, không ổn định.\""],["E","\"Công nhân phát triển hơn và trở thành một giai cấp ngay trước Chiến tranh thế giới thứ nhất.\""]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":9,"q":"Theo Tài liệu môn học tài liệu, yếu tố lý luận nào được xem là tiền đề quan trọng nhất, có vai trò quyết định trong việc hình thành tư tưởng Hồ Chí Minh?","g":"Tài liệu môn học tài liệu đã nêu rõ vai trò của từng yếu tố lý luận, và có một yếu tố được đánh giá là \"quan trọng nhất\" và \"quyết định\".","x":"Tài liệu môn học khẳng định: \"Chủ nghĩa Mác – Lênin là tiền đề lý luận quan trọng nhất, có vai trò quyết định trong việc hình thành tư tưởng Hồ Chí Minh.\" Các yếu tố khác cũng quan trọng nhưng không được đánh giá là \"quan trọng nhất\" và \"quyết định\".","p":[["A","Giá trị truyền thống tốt đẹp của dân tộc Việt Nam."],["B","Tinh hoa văn hóa phương Đông."],["C","Tinh hoa văn hóa phương Tây."],["D","Chủ nghĩa Mác – Lênin."],["E","Toàn bộ cơ sở thực tiễn Việt Nam và thế giới."]],"d":"D","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":10,"q":"Hồ Chí Minh đã tiếp thu và phát triển sáng tạo quan điểm nào của Tôn Trung Sơn theo con đường cách mạng vô sản?","g":"Tìm phần đề cập đến ảnh hưởng của Tôn Trung Sơn và cách Hồ Chí Minh vận dụng.","x":"Tài liệu môn học nêu rõ: \"Hồ Chí Minh đã phát triển sáng tạo các quan điểm về dân tộc, dân quyền, dân sinh của Tôn Trung Sơn trong cách mạng dân chủ tư sản thành tư tưởng đấu tranh cho Độc lập - Tự do - Hạnh phúc của con người và dân tộc Việt Nam theo con đường cách mạng vô sản.\"","p":[["A","Tư tưởng về \"Tự do - Bình đẳng - Bác ái\" của Cách mạng Pháp."],["B","Các quan điểm về nhân quyền và dân quyền trong Tuyên ngôn độc lập Mỹ."],["C","Các quan điểm về dân tộc, dân quyền, dân sinh trong chủ nghĩa Tam dân."],["D","Tư tưởng \"dùng nhân trị, đức trị để quản lý xã hội\" của Nho giáo."],["E","Triết lý \"từ bi, vị tha, yêu thương con người\" của Phật giáo."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":11,"q":"Theo Hồ Chí Minh, điểm chung giữa Khổng Tử, Giêsu, Mác và Tôn Dật Tiên là gì, thể hiện tầm nhìn tổng hợp của Người về các hệ tư tưởng?","g":"Xem xét nhận định của Hồ Chí Minh về các học thuyết lớn.","x":"Tài liệu môn học trích lời Hồ Chí Minh nhận định: \"Học thuyết Khổng Tử có ưu điểm là sự tu dưỡng đạo đức cá nhân. Tôn giáo Giêsu có ưu điểm là lòng nhân ái cao cả. Chủ nghĩa Mác có ưu điểm là phương pháp làm việc biện chứng. Chủ nghĩa Tôn Dật Tiên có ưu điểm là chính sách của nó phù hợp với điều kiện nước ta. Khổng Tử, Giêsu, Mác, Tôn Dật Tiên chẳng phải đã có những ưu điểm chung đó sao? Họ đều muốn “mưu hạnh phúc cho loài người, mưu phúc lợi cho xã hội”.\"","p":[["A","Đều ủng hộ chủ nghĩa cộng sản."],["B","Đều muốn \"mưu hạnh phúc cho loài người, mưu phúc lợi cho xã hội\"."],["C","Đều đề cao vai trò của giai cấp vô sản."],["D","Đều khuyến khích con người sống gắn bó với thiên nhiên."],["E","Đều là những người cách mạng chân chính."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":12,"q":"Điều nào sau đây thể hiện rõ nhất năng lực tư duy độc lập, tự chủ, sáng tạo của Hồ Chí Minh trong quá trình hình thành tư tưởng của Người?","g":"Tập trung vào các phẩm chất trí tuệ và phương pháp luận của Hồ Chí Minh được nêu trong phần \"Phẩm chất Hồ Chí Minh\".","x":"Tài liệu môn học và mô tả phẩm chất của Người: \"Hồ Chí Minh còn là người có bản lĩnh tư duy độc lập, tự chủ, sáng tạo, giàu tính phê phán, đổi mới và cách mạng; đã vận dụng đúng quy luật chung của xã hội loài người, của cách mạng thế giới vào hoàn cảnh riêng, cụ thể của Việt Nam, đề xuất tư tưởng, đường lối cách mạng mới áp ứng đúng đòi hỏi thực tiễn\". Đây là biểu hiện rõ ràng nhất của tư duy độc lập, tự chủ, sáng tạo.","p":[["A","Khả năng biết rất nhiều ngoại ngữ và làm nhiều nghề khác nhau để kiếm sống."],["B","Sự tận trung với nước, tận hiếu với dân trong suốt cuộc đời."],["C","Vận dụng đúng quy luật chung của xã hội loài người vào hoàn cảnh riêng của Việt Nam để đề xuất đường lối mới."],["D","Việc tham gia sáng lập Đảng Cộng sản Pháp và Quốc tế Cộng sản."],["E","Khả năng đọc sách văn học của các nhà văn lớn trên thế giới."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":13,"q":"Nhận định nào sau đây KHÔNG phản ánh đúng tình hình xã hội Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX dưới tác động của thực dân Pháp?","g":"Đọc kỹ phần mô tả về sự thay đổi kinh tế - xã hội và cơ cấu giai cấp Việt Nam sau khi Pháp hoàn thành bình định quân sự.","x":"Tài liệu môn học cho biết: \"Thực dân Pháp vẫn duy trì nền kinh tế nông nghiệp lạc hậu... giai cấp địa chủ được bổ sung, củng cố, tăng cường thêm các điền chủ người Pháp và người nước ngoài.\" Như vậy, giai cấp địa chủ không bị suy yếu mà ngược lại, còn được củng cố. Các đáp án A, B, D, E đều đúng theo và.","p":[["A","Nền kinh tế nông nghiệp lạc hậu vẫn được duy trì."],["B","Cơ cấu giai cấp, tầng lớp trong xã hội có sự biến đổi sâu sắc."],["C","Giai cấp địa chủ bị suy yếu trầm trọng do chính sách của Pháp."],["D","Xuất hiện các tầng lớp mới như công nhân, tư sản, tiểu tư sản."],["E","Phát sinh mâu thuẫn mới giữa toàn thể nhân dân Việt Nam với thực dân Pháp."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":14,"q":"Điều nào sau đây KHÔNG phải là một trong những mâu thuẫn cơ bản của xã hội Việt Nam được hình thành hoặc phát triển gay gắt vào đầu thế kỷ XX?","g":"Phân biệt các mâu thuẫn nội tại của xã hội Việt Nam với các mâu thuẫn trên phạm vi thế giới.","x":"Các mâu thuẫn A, B, C được nêu rõ là mâu thuẫn trong xã hội Việt Nam. Mâu thuẫn D và E là các mâu thuẫn trên phạm vi thế giới (trong lòng chủ nghĩa tư bản và giữa các dân tộc thuộc địa với chủ nghĩa đế quốc), không phải là mâu thuẫn của xã hội Việt Nam theo nghĩa trực tiếp như A, B, C. Câu hỏi yêu cầu mâu thuẫn của xã hội Việt Nam.","p":[["A","Mâu thuẫn giữa giai cấp nông dân với giai cấp địa chủ phong kiến."],["B","Mâu thuẫn giữa giai cấp công nhân Việt Nam với giai cấp tư sản."],["C","Mâu thuẫn giữa toàn thể nhân dân Việt Nam với thực dân Pháp."],["D","Mâu thuẫn giữa giai cấp vô sản với giai cấp tư sản ở các nước tư bản."],["E","Mâu thuẫn giữa các dân tộc thuộc địa với chủ nghĩa đế quốc."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":15,"q":"Yếu tố nào sau đây KHÔNG được xem là một trong những giá trị truyền thống tốt đẹp của dân tộc Việt Nam được Hồ Chí Minh kế thừa và phát triển?","g":"Đọc kỹ phần về các giá trị truyền thống dân tộc mà Hồ Chí Minh đã kế thừa.","x":"Các lựa chọn A, B, C, E đều được nêu rõ trong Tài liệu môn học và là những giá trị truyền thống tốt đẹp của dân tộc Việt Nam mà Hồ Chí Minh kế thừa và phát triển. Lựa chọn D, \"đặt lợi ích cá nhân lên trên lợi ích tập thể\", hoàn toàn trái ngược với tinh thần yêu nước, đoàn kết và \"vì nghĩa, thương người\" của dân tộc Việt Nam mà Hồ Chí Minh đề cao.","p":[["A","Chủ nghĩa yêu nước gắn liền với yêu dân."],["B","Tinh thần đoàn kết, nhân ái, khoan dung."],["C","Tinh thần cần cù, dũng cảm, sáng tạo, lạc quan."],["D","Việc đặt lợi ích cá nhân lên trên lợi ích tập thể để phát huy tối đa năng lực cá nhân."],["E","Niềm tự hào về lịch sử, trân trọng văn hóa, ngôn ngữ dân tộc."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":16,"q":"Đặc điểm nào sau đây KHÔNG phản ánh đúng sự kế thừa và phát triển tinh hoa văn hóa phương Tây của Hồ Chí Minh?","g":"Chú ý đến cách thức và phạm vi Hồ Chí Minh tiếp cận và nghiên cứu văn hóa phương Tây.","x":"Tài liệu môn học nêu rõ: \"Người trực tiếp nghiên cứu tư tưởng nhân văn, dân chủ và nhà nước pháp quyền của các nhà khai sáng phương Tây như Vonte, Rútxô, Môngtétxkiơ... thích đọc sách văn học của William Shakespeare bằng tiếng Anh, Lỗ Tấn bằng tiếng Trung Hoa, Hugo, Zola bằng tiếng Pháp\". Điều này cho thấy Người đọc bằng ngôn ngữ gốc, không chỉ bản dịch tiếng Việt. Các lựa chọn A, B, C, E đều đúng theo và.","p":[["A","Người quan tâm tới khẩu hiệu \"Tự do - Bình đẳng - Bác ái\" của Đại Cách mạng Pháp."],["B","Người kế thừa và phát triển các quan điểm nhân quyền, dân quyền."],["C","Người trực tiếp nghiên cứu tư tưởng nhân văn, dân chủ của các nhà khai sáng phương Tây."],["D","Người chỉ đọc các tác phẩm văn học của các tác giả phương Tây bằng bản dịch tiếng Việt."],["E","Người đề xuất quan điểm về quyền mưu cầu độc lập, tự do, hạnh phúc của các dân tộc."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":17,"q":"Điều nào sau đây KHÔNG phải là một trong những đóng góp sáng tạo của Hồ Chí Minh vào chủ nghĩa Mác - Lênin trong thời đại mới?","g":"Phân biệt việc vận dụng và khẳng định giá trị của chủ nghĩa Mác - Lênin với việc bổ sung, phát triển nó.","x":"Tài liệu môn học khẳng định Hồ Chí Minh đã \"vận dụng sáng tạo, mà còn bổ sung, phát triển và làm phong phú chủ nghĩa Mác – Lênin trong thời đại mới\" trên các vấn đề dân tộc, cách mạng giải phóng dân tộc, chủ nghĩa xã hội, xây dựng Đảng, Nhà nước, văn hóa, con người, đạo đức. Việc khẳng định \"chủ nghĩa Mác - Lênin là vũ khí không gì thay thế được\" là một sự thừa nhận giá trị và tầm quan trọng của chủ nghĩa Mác - Lênin, nhưng bản thân nó không phải là sự bổ sung hay phát triển về mặt lý luận, mà là kết quả của việc vận dụng thành công.","p":[["A","Phát triển các vấn đề về dân tộc và cách mạng giải phóng dân tộc."],["B","Bổ sung các luận điểm về chủ nghĩa xã hội và xây dựng chủ nghĩa xã hội ở Việt Nam."],["C","Đưa ra các quan điểm mới về xây dựng Đảng, Nhà nước, văn hóa và con người."],["D","Khẳng định chủ nghĩa Mác - Lênin là vũ khí không gì thay thế được cho cách mạng Việt Nam."],["E","Phát triển các vấn đề về đạo đức cách mạng."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":18,"q":"Nhận định nào sau đây KHÔNG thuộc về những phẩm chất cá nhân đã góp phần quyết định thành công của Hồ Chí Minh trong hoạt động lý luận và thực tiễn?","g":"Đọc kỹ phần mô tả về \"Phẩm chất Hồ Chí Minh\".","x":"Các lựa chọn A, B, C, E đều là những phẩm chất của Hồ Chí Minh được nêu trong Tài liệu môn học,,,. Lựa chọn D, \"Năng lực tập trung vào một lĩnh vực chuyên môn sâu, tránh đa dạng hóa kiến thức\", trái ngược với việc Hồ Chí Minh có \"vốn học thức văn hoá sâu rộng Đông Tây kim cổ\" và hiểu biết sâu sắc nhiều lĩnh vực, từ đó tổng hợp để giải quyết vấn đề cách mạng.","p":[["A","Có lý tưởng cao cả và hoài bão lớn cứu dân, cứu nước."],["B","Có bản lĩnh tư duy độc lập, tự chủ, sáng tạo, giàu tính phê phán."],["C","Suốt đời tận trung với nước, tận hiếu với dân."],["D","Năng lực tập trung vào một lĩnh vực chuyên môn sâu, tránh đa dạng hóa kiến thức."],["E","Tầm nhìn chiến lược, bao quát thời đại, năng lực tổng kết thực tiễn và dự báo tương lai chính xác."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":25,"q":"Theo tư tưởng Hồ Chí Minh, con người là vốn quý nhất là nhân tố quyết định thành công của cách mạng, dân là gốc của nước; nước lấy dân làm gốc; gốc có vững cây mới bền; xây lầu thắng lợi trên nền _______.","g":"Đọc phần về sự kế thừa các giá trị truyền thống dân tộc, đặc biệt là quan điểm về vai trò của nhân dân.","x":"Tài liệu môn học nêu: \"Trong tư tưởng Hồ Chí Minh, con người là vốn quý nhất là nhân tố quyết định thành công của cách mạng, dân là gốc của nước; nước lấy dân làm gốc; gốc có vững cây mới bền; xây lầu thắng lợi trên nền nhân dân\".","p":[["A","chủ nghĩa Mác - Lênin"],["B","nhân dân"],["C","Đảng Cộng sản"],["D","văn hóa"],["E","lý luận"]],"d":"B","k":"Chọn cụm từ điền vào chỗ trống"},{"s":26,"q":"Cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc ở Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX đã đặt ra câu hỏi thực tiễn là: Cứu nước bằng con đường nào để có thể đi đến _______?","g":"Xem xét kết cục của các phong trào yêu nước và câu hỏi được đặt ra từ thực tiễn.","x":"Tài liệu môn học nêu: \"Song, cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc. Xuất hiện câu hỏi từ thực tiễn đặt ra là: Cứu nước bằng con đường nào để có thể đi đến thắng lợi?\".","p":[["A","độc lập"],["B","văn minh"],["C","phát triển"],["D","thắng lợi"],["E","hội nhập"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":27,"q":"Cách mạng Tháng Mười Nga năm 1917 thành công đã mở ra một _______ mới trong lịch sử loài người – thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới.","g":"Đọc phần về ý nghĩa lịch sử của Cách mạng Tháng Mười Nga.","x":"Tài liệu môn học nêu: \"Cách mạng Tháng Mười Nga mở ra một thời đại mới trong lịch sử loài người – thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới\".","p":[["A","thời đại"],["B","kỷ nguyên"],["C","chân lý"],["D","tư tưởng"],["E","lý luận"]],"d":"A","k":"Chọn cụm từ điền vào chỗ trống"},{"s":28,"q":"Hồ Chí Minh là một biểu tượng cao đẹp của sự tích hợp tinh hoa văn hóa phương Đông và phương Tây, với chủ trương văn hóa là mục tiêu, động lực của cách mạng; cần giữ gìn cốt cách văn hóa dân tộc, đồng thời tiếp thu tinh hoa văn hóa _______, xây dựng nền văn hóa mới của Việt Nam.","g":"Tìm phần đề cập đến quan điểm của Hồ Chí Minh về việc xây dựng nền văn hóa mới.","x":"Tài liệu môn học nêu: \"Hồ Chí Minh chính là một biểu tượng cao đẹp của sự tích hợp tinh hoa văn hóa phương Đông và phương Tây... cần giữ gìn cốt cách văn hóa dân tộc, đồng thời tiếp thu tinh hoa văn hóa nhân loại, xây dựng nền văn hóa mới của Việt Nam.\"","p":[["A","thế giới"],["B","tiến bộ"],["C","nhân loại"],["D","hiện đại"],["E","truyền thống"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":29,"q":"Hồ Chí Minh khẳng định: “Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mạng nhất là chủ nghĩa _______”.","g":"Tìm trích dẫn của Hồ Chí Minh về chủ nghĩa mà Người cho là ưu việt nhất.","x":"Tài liệu môn học trích lời Hồ Chí Minh: \"Ngay từ cuối những năm 20 của thế kỷ XX, Hồ Chí Minh đã khẳng định rằng: “Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mạng nhất là chủ nghĩa Lênin”\".","p":[["A","yêu nước"],["B","dân tộc"],["C","Khổng Tử"],["D","Lênin"],["E","xã hội"]],"d":"D","k":"Chọn cụm từ điền vào chỗ trống"},{"s":30,"q":"Hồ Chí Minh là nhà tổ chức vĩ đại của cách mạng Việt Nam, Người đã hiện thực hóa tư tưởng, lý luận cách mạng thành hiện thực sinh động; đồng thời tổng kết thực tiễn cách mạng, bổ sung, phát triển _______ cách mạng.","g":"Đọc phần về tài năng hoạt động và tổng kết thực tiễn của Hồ Chí Minh.","x":"Tài liệu môn học nêu: \"Hồ Chí Minh là nhà tổ chức vĩ đại của cách mạng Việt Nam. Người đã hiện thực hóa tư tưởng, lý luận cách mạng thành hiện thực sinh động; đồng thời tổng kết thực tiễn cách mạng, bổ sung, phát triển lý luận, tư tưởng cách mạng.\"","p":[["A","phong trào"],["B","mục tiêu"],["C","lý luận"],["D","đường lối"],["E","chiến lược"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":39,"q":"Theo giáo trình, nguyên nhân trực tiếp dẫn đến sự thất bại của các phong trào yêu nước theo khuynh hướng dân chủ tư sản ở Việt Nam đầu thế kỷ XX là gì?","g":"Phân biệt rõ “nguyên nhân sâu xa” và “nguyên nhân trực tiếp”.","x":"A là nguyên nhân SÂU XA; D là đánh giá dành cho khuynh hướng PHONG KIẾN; C và E không có trong giáo trình. Nguyên nhân trực tiếp là “các tổ chức và người lãnh đạo của các phong trào chưa có đường lối và phương pháp cách mạng đúng đắn”.","p":[["A","Giai cấp tư sản Việt Nam còn non yếu."],["B","Các tổ chức và người lãnh đạo của các phong trào chưa có đường lối và phương pháp cách mạng đúng đắn."],["C","Thực dân Pháp tăng cường đàn áp quân sự và mua chuộc các sĩ phu yêu nước."],["D","Tư tưởng phong kiến đã tỏ ra hoàn toàn lỗi thời trước các nhiệm vụ lịch sử."],["E","Giai cấp công nhân chưa ra đời nên chưa có lực lượng lãnh đạo phong trào."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":40,"q":"Sự thất bại của các phong trào yêu nước ở Việt Nam cuối thế kỷ XIX, đầu thế kỷ XX phản ánh rõ nhất hạn chế nào?","g":"Chữ nào trong giáo trình được nhắc lại ở cả hai khuynh hướng?","x":"Bốn phương án nhiễu đều “nghe có lý” nhưng không phải chữ giáo trình. Giáo trình chỉ nêu: các tổ chức và người lãnh đạo chưa có đường lối và phương pháp cách mạng đúng đắn, dẫn tới khủng hoảng về đường lối cứu nước.","p":[["A","Chưa huy động được đông đảo các tầng lớp nhân dân tham gia đấu tranh."],["B","Chưa kết hợp được nhiệm vụ chống thực dân với chống phong kiến."],["C","Chưa xác lập được đường lối và phương pháp cách mạng phù hợp với thực tiễn Việt Nam."],["D","Chưa nhận được sự hỗ trợ cần thiết từ các phong trào cách mạng thế giới."],["E","Chưa có sự tham gia của giai cấp công nhân vào phong trào."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":41,"q":"Nhận định nào sau đây SAI khi nói về tình hình Việt Nam cuối thế kỷ XIX – đầu thế kỷ XX? (Bẫy nằm ở phần chú thích cuối trang)","g":"Đọc kỹ phần chú thích cuối trang của giáo trình.","x":"“Thuộc địa và phong kiến” là thuật ngữ HỒ CHÍ MINH dùng trong tác phẩm Thường thức chính trị (Hồ Chí Minh Toàn tập, t.8, tr.254), được giáo trình dẫn ở chú thích cuối trang — không phải khái niệm của V.I.Lênin.","p":[["A","Cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc sau khi các phong trào Đông Du, Duy Tân, Đông Kinh nghĩa thục đều thất bại."],["B","Xã hội chuyển từ phong kiến thành “thuộc địa và phong kiến” làm xuất hiện mâu thuẫn mới giữa công nhân với tư sản và giữa toàn thể nhân dân Việt Nam với thực dân Pháp."],["C","Thuật ngữ “thuộc địa và phong kiến” là khái niệm do V.I.Lênin đề xuất trong Luận cương về vấn đề dân tộc và thuộc địa."],["D","Sự thất bại của các cuộc khởi nghĩa dưới ngọn cờ Cần Vương chứng tỏ hệ tư tưởng phong kiến đã suy tàn, bất lực trước nhiệm vụ bảo vệ độc lập dân tộc."],["E","Năm 1858 thực dân Pháp bắt đầu xâm lược, triều đình nhà Nguyễn lần lượt ký các hiệp ước đầu hàng."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":42,"q":"Trong các phong trào yêu nước theo khuynh hướng dân chủ tư sản đầu thế kỷ XX, thông tin về phong trào nào dưới đây bị SAI lệch thời gian?","g":"Đối chiếu cẩn thận mốc năm của phong trào Đông Kinh nghĩa thục.","x":"Đông Kinh nghĩa thục diễn ra từ tháng 3 đến tháng 11 năm 1907. Bốn mốc có năm trong mục I.1a là: Đông Du 1905–1909, Duy Tân 1906–1908, Đông Kinh nghĩa thục 3–11/1907, chống sưu thuế Trung Kỳ 1908.","p":[["A","Phong trào Đông Du do Phan Bội Châu khởi xướng (1905 – 1909)."],["B","Phong trào Duy Tân do Phan Châu Trinh phát động (1906 – 1908)."],["C","Phong trào Đông Kinh nghĩa thục do Lương Văn Can, Nguyễn Quyền phát động (từ tháng 3 đến tháng 11/1908)."],["D","Phong trào chống đi phu, chống sưu thuế ở Trung Kỳ nổ ra năm 1908."],["E","Các cuộc khởi nghĩa dưới ngọn cờ Cần Vương diễn ra từ năm 1858 đến cuối thế kỷ XIX."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":43,"q":"Quá trình khai thác thuộc địa của thực dân Pháp đã làm xuất hiện những giai tầng mới trong xã hội Việt Nam. Giai cấp, tầng lớp nào dưới đây KHÔNG phải là giai tầng mới?","g":"Giai cấp nào đã tồn tại từ trước và chỉ được bổ sung thêm?","x":"Giai cấp địa chủ là giai cấp CŨ, chỉ “được bổ sung, củng cố, tăng cường thêm các điền chủ người Pháp và người nước ngoài”. Ba giai tầng mới là công nhân, tư sản và tiểu tư sản ở thành thị.","p":[["A","Giai cấp công nhân."],["B","Giai cấp tư sản."],["C","Tầng lớp tiểu tư sản ở thành thị."],["D","Giai cấp địa chủ."],["E","Giai cấp công nhân ở các đồn điền và hầm mỏ."]],"d":"D","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":44,"q":"Nhận định nào sau đây SAI về sự biến đổi của xã hội Việt Nam dưới tác động của thực dân Pháp?","g":"Giai tầng mới sinh ra ở đâu — nông thôn hay thành thị?","x":"Nguyên văn: “tầng lớp tiểu tư sản ở THÀNH THỊ”. Sai đúng một chữ — và chữ đó cho biết giai tầng mới sinh ra từ đô thị, từ công cuộc khai thác thuộc địa.","p":[["A","Thực dân Pháp từng bước biến Việt Nam từ một nước phong kiến thành nước “thuộc địa và phong kiến”."],["B","Xã hội Việt Nam xuất hiện giai cấp công nhân, giai cấp tư sản và tầng lớp tiểu tư sản ở nông thôn."],["C","Xuất hiện mâu thuẫn giữa giai cấp công nhân Việt Nam với giai cấp tư sản."],["D","Xuất hiện mâu thuẫn giữa toàn thể nhân dân Việt Nam với thực dân Pháp."],["E","Bên cạnh tầng lớp thợ thủ công, tiểu thương, trong xã hội xuất hiện những giai tầng mới."]],"d":"B","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":45,"q":"Đâu KHÔNG phải là nguyên nhân dẫn tới sự thất bại của các phong trào yêu nước theo khuynh hướng dân chủ tư sản?","g":"Giáo trình mô tả các sĩ phu dẫn dắt phong trào bằng cụm từ nào?","x":"Giáo trình viết ngược lại: các phong trào ấy có “sự dẫn dắt của các sĩ phu yêu nước CÓ TINH THẦN CẢI CÁCH” — Phan Bội Châu, Phan Châu Trinh, Lương Văn Can, Nguyễn Quyền.","p":[["A","Hạn chế về cơ sở kinh tế – xã hội."],["B","Giai cấp tư sản Việt Nam còn non yếu."],["C","Các sĩ phu yêu nước dẫn dắt phong trào không có tinh thần cải cách."],["D","Các tổ chức và người lãnh đạo chưa có đường lối và phương pháp cách mạng đúng đắn."],["E","Cuộc khủng hoảng về đường lối cứu nước diễn ra sâu sắc."]],"d":"C","k":"Chọn 1 đáp án SAI trong 5 phương án"},{"s":48,"q":"Điền vào chỗ trống: “Các cuộc khởi nghĩa vũ trang dưới ngọn cờ ……… do các sĩ phu, văn thân lãnh đạo cuối cùng đều thất bại.”","g":"Đây là ngọn cờ của các cuộc khởi nghĩa vũ trang nổ ra ở cả ba miền cuối thế kỷ XIX.","x":"Nguyên văn: “Các cuộc khởi nghĩa vũ trang dưới ngọn cờ ‘Cần Vương’ do các sĩ phu, văn thân lãnh đạo cuối cùng đều thất bại.” Duy Tân và Đông Du thuộc khuynh hướng dân chủ tư sản đầu thế kỷ XX.","p":[["A","Cần Vương"],["B","Duy Tân"],["C","Đông Du"],["D","Giải phóng dân tộc"],["E","Bình Tây sát Tả"]],"d":"A","k":"Chọn cụm từ điền vào chỗ trống"},{"s":49,"q":"Điền vào chỗ trống trong câu Hồ Chí Minh được giáo trình trích: “Chỉ có giai cấp công nhân là dũng cảm nhất, ………, luôn luôn gan góc đương đầu với bọn đế quốc thực dân.”","g":"Đây là phẩm chất thứ hai trong ba phẩm chất Hồ Chí Minh nêu.","x":"Nguyên văn (Hồ Chí Minh Toàn tập, t.12, tr.407): “Chỉ có giai cấp công nhân là dũng cảm nhất, CÁCH MẠNG NHẤT, luôn luôn gan góc đương đầu với bọn đế quốc thực dân.”","p":[["A","tiên phong nhất"],["B","kiên quyết nhất"],["C","cách mạng nhất"],["D","triệt để nhất"],["E","giác ngộ nhất"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":50,"q":"Chọn cụm từ đúng: “Hồ Chí Minh là một người đã dày công truyền bá chủ nghĩa Mác – Lênin vào phong trào công nhân và phong trào yêu nước Việt Nam, chuẩn bị về ………, sáng lập Đảng Cộng sản Việt Nam, chấm dứt sự khủng hoảng về đường lối cách mạng Việt Nam.”","g":"Thuật ngữ đầy đủ, không bị rút gọn và không bị tách rời.","x":"Nguyên văn là “lý luận chính trị, tư tưởng và tổ chức”. Bốn phương án còn lại đều thiếu chữ, thêm dấu phẩy hoặc đổi “chính trị” thành “cách mạng”.","p":[["A","chính trị, tư tưởng và tổ chức"],["B","tư tưởng, chính trị và tổ chức"],["C","lý luận chính trị, tư tưởng và tổ chức"],["D","lý luận, chính trị, tư tưởng và tổ chức"],["E","lý luận cách mạng, tư tưởng và tổ chức"]],"d":"C","k":"Chọn cụm từ điền vào chỗ trống"},{"s":51,"q":"Điền hai chỗ trống: “…nguyên nhân sâu xa là giai cấp tư sản Việt Nam còn …(1)…, nguyên nhân trực tiếp là các tổ chức và người lãnh đạo của các phong trào chưa có …(2)… đúng đắn.”","g":"Cả hai vế đều là chữ nguyên văn của giáo trình.","x":"Nguyên văn: “Nguyên nhân sâu xa là giai cấp tư sản Việt Nam còn non yếu. Nguyên nhân trực tiếp là các tổ chức và người lãnh đạo của các phong trào chưa có đường lối và phương pháp cách mạng đúng đắn.” Phải đủ cụm “đường lối VÀ phương pháp cách mạng”.","p":[["A","(1) non yếu / (2) đường lối và phương pháp cách mạng"],["B","(1) trưởng thành / (2) đường lối đấu tranh chính trị"],["C","(1) non yếu / (2) phương pháp đấu tranh vũ trang"],["D","(1) non yếu / (2) đường lối cách mạng theo khuynh hướng vô sản"],["E","(1) chia rẽ / (2) tổ chức lãnh đạo thống nhất"]],"d":"A","k":"Chọn cụm từ điền vào chỗ trống"},{"s":54,"q":"Nhân tố nào sau đây là nguyên nhân TRỰC TIẾP làm phá sản các phong trào cứu nước theo khuynh hướng dân chủ tư sản ở Việt Nam?","g":"Phân biệt hạn chế nội tại của giai cấp tư sản (nguyên nhân sâu xa) với hạn chế về đường lối lãnh đạo (nguyên nhân trực tiếp).","x":"Giáo trình tách hai nguyên nhân: SÂU XA là giai cấp tư sản Việt Nam còn non yếu (phương án C), TRỰC TIẾP là các tổ chức và người lãnh đạo chưa có đường lối và phương pháp cách mạng đúng đắn (phương án B). Phương án A trái giáo trình — tinh thần yêu nước “vẫn sục sôi trong lòng nhân dân”.","p":[["A","Các phong trào không lôi kéo được quần chúng nhân dân tham gia."],["B","Đường lối và phương pháp cách mạng của những người lãnh đạo chưa đúng đắn."],["C","Sự non yếu về kinh tế và chính trị của giai cấp tư sản Việt Nam."],["D","Sự đàn áp khốc liệt của liên minh Pháp – Nhật."],["E","Chủ nghĩa Mác – Lênin chưa được truyền bá vào Việt Nam."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":57,"q":"Theo giáo trình, sự thất bại của các cuộc khởi nghĩa dưới ngọn cờ Cần Vương chứng tỏ điều gì?","g":"Giáo trình chốt bằng một câu bắt đầu bằng “Điều đó chứng tỏ…”.","x":"Nguyên văn: “Điều đó chứng tỏ tư tưởng phong kiến tỏ ra lỗi thời trước các nhiệm vụ lịch sử.” Phương án A là bẫy — sức mạnh quân sự của Pháp có thật nhưng không phải điều giáo trình rút ra. Phương án C sai vì chính các sĩ phu, văn thân phong kiến đã cầm đầu các cuộc khởi nghĩa.","p":[["A","Thực dân Pháp có vũ khí hiện đại và lực lượng quân sự vượt trội."],["B","Tư tưởng phong kiến đã tỏ ra lỗi thời trước các nhiệm vụ lịch sử."],["C","Giai cấp phong kiến đã hoàn toàn đầu hàng và làm tay sai cho Pháp."],["D","Các cuộc khởi nghĩa thiếu sự hưởng ứng của đông đảo nông dân."],["E","Giai cấp công nhân chưa ra đời nên phong trào không có người lãnh đạo."]],"d":"B","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":58,"q":"Các cuộc khởi nghĩa vũ trang dưới ngọn cờ Cần Vương do giai cấp, tầng lớp nào lãnh đạo?","g":"Câu trả lời nằm nguyên văn ngay trong câu giáo trình nói về ngọn cờ Cần Vương.","x":"Nguyên văn: “Các cuộc khởi nghĩa vũ trang dưới ngọn cờ ‘Cần Vương’ do các sĩ phu, văn thân lãnh đạo cuối cùng đều thất bại.” Công nhân và tư sản lúc này chưa xuất hiện; tiểu tư sản thành thị chỉ ra đời sau khai thác thuộc địa.","p":[["A","Tầng lớp tiểu tư sản ở thành thị."],["B","Giai cấp công nhân."],["C","Các sĩ phu, văn thân yêu nước."],["D","Giai cấp địa chủ."],["E","Giai cấp tư sản dân tộc."]],"d":"C","k":"Chọn 1 đáp án đúng trong 5 phương án"},{"s":59,"q":"Dựa vào thực tiễn Việt Nam cuối thế kỷ XIX – đầu thế kỷ XX, phát biểu nào sau đây là SAI?","g":"Đọc kỹ chiều đi của phong trào công nhân: từ thô sơ đến có tổ chức, hay ngược lại?","x":"Giáo trình viết công nhân đi “từ hình thức đấu tranh thô sơ như đốt lán trại, bỏ trốn tập thể… nhanh chóng tiến tới đình công, bãi công” — tức từ TỰ PHÁT lên TỰ GIÁC. Câu C đảo ngược hai chữ.","p":[["A","Các cuộc khởi nghĩa dưới ngọn cờ Cần Vương do c
