<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cán cân ba đỉnh – Tư tưởng Hồ Chí Minh về văn hóa, đạo đức, con người</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Cán cân ba đỉnh — game Bài 8 (Chương 6). Khuôn giao diện; nội dung ở noi-dung.json.
   Dựng index.html: python _KHO-DU-LIEU/cong-cu/tao-game-can-can.py */
:root{--muc:#121826;--muc2:#1b2336;--muc3:#283352;--muc4:#38446a;--vang:#d8b46a;--vang2:#f3dc9a;--vang3:#8f7038;--giay:#f3e8cc;--giay2:#e4d2a8;--giay3:#b99d66;--chu:#f2ead6;--chu2:#bdb39b;--mo:#8d8670;--dung:#86d0a2;--sai:#e88a74;--vh:#e9b85b;--dd:#78b2ec;--cn:#9bd67f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0d121d}
body{font-family:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;color:var(--chu);background:radial-gradient(120% 80% at 50% 0%,#24304d 0%,#141b2b 55%,#0b0f18 100%) fixed}
#app{position:relative;container-type:inline-size;min-height:100vh}
/* chữ co giãn theo bề rộng khung: gốc 16–28px; câu hỏi 1.35em (sàn 22px), phương án 1.12em (sàn 19px) */
.man{font-size:clamp(16px,1.2cqi,28px);min-height:100vh;display:flex;flex-direction:column}
.td{font-family:'Cormorant Garamond','Palatino Linotype',Constantia,serif;font-weight:700;letter-spacing:.01em}
button{font:inherit;color:inherit}
input{font:inherit}
.an{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--vang2);outline-offset:2px}
.than{flex:1;width:100%;max-width:78em;margin:0 auto;padding:1em 1em 2em}

/* khung đường mảnh, đầu hình thoi */
.khung{position:relative;background:linear-gradient(180deg,rgba(32,41,64,.94),rgba(19,25,39,.94));border:1px solid var(--vang3);box-shadow:0 10px 30px rgba(0,0,0,.45);padding:1.1em 1.2em}
.khung::before{content:'';position:absolute;inset:5px;border:1px solid rgba(216,180,106,.32);pointer-events:none}
.khung::after{content:'';position:absolute;left:50%;top:-6px;width:10px;height:10px;background:var(--vang);transform:translateX(-50%) rotate(45deg);box-shadow:0 0 10px rgba(243,220,154,.7)}
.khung.giay{background:linear-gradient(180deg,#f6ecd2,#e9d8b0);color:#2a2214;border-color:var(--giay3)}
.khung.giay::before{border-color:rgba(143,112,56,.45)}
.tieu{display:flex;align-items:center;gap:.6em;color:var(--vang2);font-size:1.35em;margin:0 0 .6em}
.tieu::before,.tieu::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--vang) 30%,var(--vang) 70%,transparent)}
.tieu span{white-space:nowrap}
.tieu.trai::before{display:none}
.hthoi{display:inline-block;width:.5em;height:.5em;background:var(--vang);transform:rotate(45deg);margin:0 .35em;vertical-align:.12em}

/* nút */
.nut{position:relative;font-family:'Cormorant Garamond','Palatino Linotype',serif;font-weight:700;font-size:1.2em;line-height:1.15;color:var(--vang2);background:linear-gradient(180deg,#3a4669,#222a41);border:1px solid var(--vang);padding:.55em 1.4em;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;text-align:center;box-shadow:0 4px 0 #0b0f18,0 0 0 3px rgba(216,180,106,.12)}
.nut::before,.nut::after{content:'';position:absolute;top:50%;width:8px;height:8px;background:var(--vang);transform:translateY(-50%) rotate(45deg)}
.nut::before{left:-5px}.nut::after{right:-5px}
.nut:hover{background:linear-gradient(180deg,#46557f,#2a3350);color:#fff3cc}
.nut:active{transform:translateY(2px);box-shadow:0 2px 0 #0b0f18}
.nut.chinh{background:linear-gradient(180deg,#f0d48d,#b98d3f);color:#1c1509;border-color:#fbe7b0}
.nut.chinh:hover{background:linear-gradient(180deg,#f7df9f,#c99b4a)}
.nut.nho{font-size:1em;padding:.4em 1em;min-height:44px}
.nut[disabled]{opacity:.45;cursor:not-allowed}
.hang-nut{display:flex;flex-wrap:wrap;gap:.8em 1.2em;align-items:center}

/* thanh đầu */
.dau{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.4em .8em;padding:.5em 1em;background:linear-gradient(180deg,rgba(13,18,29,.97),rgba(18,24,38,.92));border-bottom:1px solid var(--vang3);box-shadow:0 1px 0 rgba(216,180,106,.25)}
.dau-trai,.dau-phai{display:flex;flex-wrap:wrap;align-items:center;gap:.4em .7em}
.ve{width:44px;height:44px;display:grid;place-items:center;background:var(--muc3);border:1px solid var(--vang3);color:var(--vang2);cursor:pointer;padding:0}
.ve svg{width:20px;height:20px}
.dau-ten{font-size:1.45em;color:var(--vang2)}
.dau-phu{color:var(--chu2);font-size:.92em}
.chip{display:inline-flex;align-items:center;gap:.3em;font-size:.9em;background:rgba(40,51,82,.8);border:1px solid rgba(216,180,106,.45);padding:.25em .65em;min-height:34px;color:var(--chu)}
.chip b{color:var(--vang2)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--vang)}
.net{display:inline-flex;align-items:center;gap:.35em;font-size:.82em;color:var(--chu2)}
.net i{width:9px;height:9px;border-radius:50%;background:var(--sai)}
.net i.on{background:var(--dung)}

/* màn chào */
.chao{flex:1;display:grid;place-items:center;padding:1.5em 1em;position:relative;overflow:hidden}
.chao-nen{position:absolute;inset:0;pointer-events:none}
.chao-nen svg{width:100%;height:100%}
.chao-hop{position:relative;max-width:40em;width:100%;text-align:center}
.chao-tren{letter-spacing:.3em;color:var(--chu2);font-size:.85em}
.chao-ten{font-size:clamp(46px,6.5cqi,110px);line-height:1;color:var(--vang2);text-shadow:0 0 24px rgba(243,220,154,.35),0 3px 0 #000;margin:.15em 0 .1em}
.chao-duoi{color:var(--chu);font-size:1.1em;margin-bottom:1em}
.chao-tg{width:min(16em,70%);margin:0 auto .8em}
.chao .hang-nut{justify-content:center;flex-direction:column}
.chao .nut{min-width:15em}
.chao-ghi{margin-top:1.2em;color:var(--mo);font-size:.85em;line-height:1.5}
.cach{text-align:left;line-height:1.55;font-size:.95em}
.cach ol{margin:.3em 0 0;padding-left:1.3em}.cach li{margin:.25em 0}

/* bản đồ */
.bd{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(16em,1fr);gap:1.2em}
@container (max-width:820px){.bd{grid-template-columns:1fr}}
@media (max-width:600px){.dau{position:static}}
.bd-ban svg{width:100%;height:auto;display:block}
.bd-ds{display:grid;gap:.9em}
.ch-the{display:grid;grid-template-columns:auto 1fr auto;gap:.3em .9em;align-items:center;text-align:left;cursor:pointer;background:rgba(27,35,54,.9);border:1px solid rgba(216,180,106,.45);padding:.7em .9em;color:var(--chu);width:100%}
.ch-the:hover{border-color:var(--vang);background:rgba(40,51,82,.95)}
.ch-so{width:2.4em;height:2.4em;display:grid;place-items:center;transform:rotate(45deg);border:1px solid var(--vang);background:var(--muc3);grid-row:span 2}
.ch-so span{transform:rotate(-45deg);color:var(--vang2);font-size:1.05em}
.ch-ten{font-size:1.25em;color:var(--vang2)}
.ch-tt{font-size:.85em;color:var(--chu2);grid-column:2}
.ch-diem{grid-row:span 2;font-size:.9em;color:var(--chu2);text-align:right}
.ch-the.xong .ch-so{background:#3d5a43;border-color:var(--dung)}
.ch-the.dang .ch-so{box-shadow:0 0 12px rgba(243,220,154,.6)}
.bd-cc{display:grid;grid-template-columns:minmax(10em,15em) 1fr;gap:1em;align-items:center;margin-top:1em}
@container (max-width:560px){.bd-cc{grid-template-columns:1fr}}

/* tam giác cán cân */
.tg svg{width:100%;height:auto;display:block;overflow:visible}
.dinh-hang{display:grid;gap:.45em;font-size:.92em}
.dinh-dong{display:grid;grid-template-columns:6.5em 1fr 3.6em;gap:.5em;align-items:center}
.dinh-vach{height:10px;background:rgba(255,255,255,.08);border:1px solid rgba(216,180,106,.3)}
.dinh-vach i{display:block;height:100%}
.dinh-so{text-align:right;color:var(--chu2);font-variant-numeric:tabular-nums}

/* khám phá */
.canh{position:relative;border:1px solid var(--vang3);overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.canh svg{display:block;width:100%;height:auto}
.canh::before,.canh::after{content:'';position:absolute;left:0;right:0;height:16%;pointer-events:none;-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
.canh::before{top:0;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
.canh::after{bottom:0;-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000)}
.diem{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;z-index:2}
.diem-the{font-size:clamp(12px,1.1cqi,20px);background:rgba(18,24,38,.92);border:1px solid var(--vang);color:var(--vang2);padding:.25em .6em;white-space:nowrap;font-family:'Cormorant Garamond',serif;font-weight:700}
.diem-hthoi{width:18px;height:18px;transform:rotate(45deg);background:var(--vang);box-shadow:0 0 0 4px rgba(243,220,154,.25),0 0 16px rgba(243,220,154,.9);animation:nhip 1.6s ease-in-out infinite}
.diem.da .diem-hthoi{background:var(--dung);box-shadow:0 0 0 4px rgba(134,208,162,.25);animation:none}
.diem.da .diem-the{border-color:var(--dung);color:#d8f3e2}
@keyframes nhip{50%{box-shadow:0 0 0 9px rgba(243,220,154,.05),0 0 26px rgba(243,220,154,1)}}
.kp-duoi{display:grid;grid-template-columns:1fr auto;gap:1em;align-items:center;margin-top:1em}
@container (max-width:640px){.kp-duoi{grid-template-columns:1fr}}
.kp-ds{display:flex;flex-wrap:wrap;gap:.5em}
.kp-ds button{background:rgba(27,35,54,.9);border:1px solid rgba(216,180,106,.45);color:var(--chu);padding:.4em .8em;min-height:44px;cursor:pointer}
.kp-ds button.da{border-color:var(--dung);color:#cfeedd}

/* lớp phủ hội thoại */
.phu{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.72);display:flex;align-items:flex-end;justify-content:center;padding:1em;overflow:auto;container-type:inline-size}
.phu .khung{width:min(52em,100%);max-height:calc(100vh - 2em);overflow:auto;font-size:clamp(16px,1.2cqi,24px);margin:auto 0 0}
.hoi-thoai{display:grid;grid-template-columns:auto 1fr;gap:.9em;align-items:start}
.hoi-thoai svg{width:clamp(56px,9cqi,110px);height:auto;image-rendering:pixelated}
.ten-bang{display:inline-block;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.15em;color:#1c1509;background:linear-gradient(180deg,#f0d48d,#c99b4a);padding:.1em .7em;margin-bottom:.35em}
.loi{line-height:1.55;margin:0}
.the-ds{display:grid;gap:.7em;margin:1em 0}
.lc{position:relative;background:linear-gradient(180deg,#f7eed6,#eadbb6);color:#2a2214;border:1px solid var(--giay3);padding:.7em .9em .6em 2.3em;line-height:1.5;text-align:left}
.lc::before{content:'';position:absolute;left:.8em;top:.95em;width:.6em;height:.6em;background:#8f7038;transform:rotate(45deg)}
.lc small{display:block;color:#7b6640;font-size:.78em;margin-top:.25em}
button.lc{width:100%;cursor:pointer;font:inherit}
button.lc:hover{border-color:#8f7038;box-shadow:0 0 0 2px rgba(143,112,56,.35)}
.lc.trung{background:linear-gradient(180deg,#e3f4e6,#c9e7cf);border-color:#3d8a57}
.lc.truot{background:linear-gradient(180deg,#f7e0d8,#ecc7bb);border-color:#b2573f}
.lc.mo{opacity:.55}

/* hội đồng */
.hd-san{position:relative;background:linear-gradient(180deg,#3a2418 0%,#2a1a12 55%,#1a110c 100%);border:1px solid var(--vang3);padding:1em .6em .3em;overflow:hidden}
.hd-san::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11%,rgba(0,0,0,.25) 11% 12.5%);pointer-events:none}
.hd-hang{position:relative;display:flex;justify-content:center;gap:clamp(.5em,3cqi,3em);flex-wrap:wrap}
.hd-nguoi{background:none;border:0;padding:.3em;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--chu)}
.hd-nguoi svg{width:clamp(64px,10cqi,130px);height:auto}
.hd-nguoi .ten-bang{font-size:.95em}
.hd-nguoi.chon .ten-bang{box-shadow:0 0 0 2px #fff3cc,0 0 16px rgba(243,220,154,.9)}
.hd-nguoi .tt{font-size:.78em;color:var(--chu2);min-height:1.3em}
.hd-nguoi.ok .tt{color:var(--dung)}.hd-nguoi.khong .tt{color:var(--sai)}
.bong{position:relative;background:var(--giay);color:#2a2214;padding:.9em 1.1em;margin:1em 0;line-height:1.55;border:1px solid var(--giay3)}
.bong::before{content:'';position:absolute;left:2.2em;top:-9px;width:16px;height:16px;background:var(--giay);border-left:1px solid var(--giay3);border-top:1px solid var(--giay3);transform:rotate(45deg)}
.bong b{font-family:'Cormorant Garamond',serif;font-size:1.1em}
.bao{padding:.7em 1em;border-left:4px solid var(--vang);background:rgba(40,51,82,.6);line-height:1.5;margin:.8em 0}
.bao.tot{border-color:var(--dung);background:rgba(61,138,87,.18)}
.bao.xau{border-color:var(--sai);background:rgba(178,87,63,.18)}

/* trận luận chiến */
.tran{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(19em,1fr);gap:1em;align-items:start}
@container (max-width:900px){.tran{grid-template-columns:1fr}}
.ban{position:relative;border:1px solid var(--vang3);background:radial-gradient(90% 70% at 50% 40%,#2d3b5c,#141b2b);overflow:hidden}
.ban svg{display:block;width:100%;height:auto;touch-action:manipulation}
.ban::before,.ban::after{content:'';position:absolute;left:0;right:0;height:13%;pointer-events:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:1}
.ban::before{top:0;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
.ban::after{bottom:0;-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000)}
.ban-tt{position:absolute;left:.6em;top:.5em;z-index:2;font-size:.85em;color:var(--chu2);background:rgba(13,18,29,.75);padding:.2em .6em;border:1px solid rgba(216,180,106,.35)}
.u{transition:transform .17s linear}
.u.dich{cursor:pointer}
.u.roi{transition:opacity .5s,transform .5s;opacity:0}
.ky-ds{display:grid;gap:.4em;margin:.6em 0;font-size:.9em}
.ky-dong{display:grid;grid-template-columns:2.2em 1fr;gap:.6em;align-items:center}
.ky-bieu{width:2em;height:2em;display:grid;place-items:center;border:1px solid var(--vang);transform:rotate(45deg);background:var(--muc3)}
.ky-bieu b{transform:rotate(-45deg);font-size:.95em;color:var(--vang2)}
.hoi-dau{display:flex;flex-wrap:wrap;gap:.5em;justify-content:space-between;align-items:center;margin-bottom:.6em}
.hoi-ky{color:var(--vang2);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.15em}
.dongho{flex:1;min-width:8em;max-width:14em;height:12px;border:1px solid var(--vang3);background:rgba(255,255,255,.06);position:relative}
.dongho i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#e6c27a,#f3dc9a)}
.dongho.gap i{background:linear-gradient(90deg,#d4664d,#e88a74)}
.dongho-so{font-variant-numeric:tabular-nums;color:var(--chu2);font-size:.85em;min-width:2.5em;text-align:right}
.hoi-chu{font-size:max(22px,1.3em);line-height:1.45;margin:.2em 0 .7em}
.o-trong{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--vang);text-align:center;color:var(--vang2)}
.pa-ds{display:grid;gap:.55em}
.pa{display:grid;grid-template-columns:auto 1fr;gap:.6em;align-items:start;text-align:left;width:100%;font-size:max(19px,1.08em);line-height:1.4;background:rgba(27,35,54,.95);border:1px solid rgba(216,180,106,.45);color:var(--chu);padding:.55em .75em;cursor:pointer;min-height:48px}
.pa:hover{border-color:var(--vang)}
.pa .k{width:1.6em;height:1.6em;display:grid;place-items:center;border:1px solid var(--vang3);font-size:.8em;color:var(--vang2)}
.pa.chon{border-color:var(--vang2);background:rgba(90,76,40,.55)}
.pa.chon .k{background:var(--vang);color:#1c1509}
.pa.dung{border-color:var(--dung);background:rgba(61,138,87,.3)}
.pa.sai{border-color:var(--sai);background:rgba(178,87,63,.3)}
.pa.bo{border-style:dashed;border-color:var(--dung)}
.pa.loai{opacity:.3;pointer-events:none;text-decoration:line-through}
.pa .tag{display:block;font-size:.75em;color:var(--chu2);margin-top:.15em}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:.7em}
.tf .pa{justify-content:center;grid-template-columns:1fr;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:max(22px,1.35em)}
.tu-ds{display:flex;flex-wrap:wrap;gap:.55em}
.tu-ds .pa{width:auto;grid-template-columns:1fr;font-weight:600}
.giai{line-height:1.55;font-size:.95em;margin:.7em 0}
.kq-dau{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.4em}
.kq-dau.tot{color:var(--dung)}.kq-dau.xau{color:var(--sai)}

/* kết chương, tổng kết */
.ket{display:grid;grid-template-columns:minmax(12em,20em) 1fr;gap:1.2em;align-items:start}
@container (max-width:720px){.ket{grid-template-columns:1fr}}
.so-lieu{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:.6em;margin:.4em 0 1em}
.so-lieu div{border:1px solid rgba(216,180,106,.4);background:rgba(27,35,54,.8);padding:.5em .7em}
.so-lieu b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.6em;color:var(--vang2)}
.on-ds{display:grid;gap:.6em}
.on-ds details{background:rgba(27,35,54,.85);border:1px solid rgba(232,138,116,.45);padding:.55em .8em}
.on-ds summary{cursor:pointer;line-height:1.45}
.on-ds summary small{display:block;color:var(--chu2)}
.on-ds p{margin:.5em 0 0;line-height:1.55;color:var(--chu2)}

/* phòng */
.form{display:grid;gap:.9em;max-width:32em;margin:0 auto}
.o-nhap{width:100%;font-size:1.3em;padding:.5em .7em;background:#0f1522;color:var(--chu);border:1px solid var(--vang);min-height:52px}
.o-nhap.ma{text-transform:uppercase;letter-spacing:.35em;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.8em}
.nhom-ds{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5em,1fr));gap:.5em}
.nhom-ds button{min-height:52px;background:rgba(27,35,54,.95);border:1px solid rgba(216,180,106,.45);color:var(--chu);cursor:pointer;font-weight:600}
.nhom-ds button.chon{background:linear-gradient(180deg,#f0d48d,#b98d3f);color:#1c1509;border-color:#fbe7b0}
.chon-dong{display:flex;flex-wrap:wrap;gap:.6em;align-items:center}
.dem-nut{display:inline-flex;align-items:center;gap:.5em}
.dem-nut b{min-width:2.2em;text-align:center;font-size:1.4em;font-family:'Cormorant Garamond',serif;color:var(--vang2)}
.loi-nho{color:var(--sai);min-height:1.3em;font-size:.9em}
.ghi-nho{color:var(--chu2);font-size:.85em;line-height:1.5}

/* màn chiếu 1920×1080 */
body.chieu{overflow:hidden}
.san-ngoai{position:fixed;inset:0;display:grid;place-items:center;background:#070a11}
.san{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;transform:translate(-50%,-50%);font-size:24px;color:var(--chu);background:radial-gradient(90% 70% at 50% 20%,#26324f,#121826 60%,#0a0e17);overflow:hidden}
.s-dau{position:absolute;left:0;right:0;top:0;height:120px;display:grid;grid-template-columns:560px 1fr 560px;align-items:center;padding:0 40px;border-bottom:1px solid var(--vang3);background:linear-gradient(180deg,rgba(10,14,23,.9),rgba(18,24,38,.6))}
.s-ten{font-size:56px;color:var(--vang2);line-height:1}
.s-ten small{display:block;font-family:'Be Vietnam Pro',sans-serif;font-weight:500;font-size:19px;color:var(--chu2);margin-top:6px}
.s-gio{text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:78px;color:var(--vang2);font-variant-numeric:tabular-nums;line-height:1}
.s-gio small{display:block;font-family:'Be Vietnam Pro',sans-serif;font-size:18px;font-weight:500;color:var(--chu2);letter-spacing:.1em}
.s-gio.gap{color:#f0a08a}
.s-phong{display:flex;justify-content:flex-end;align-items:center;gap:18px;text-align:right}
.s-phong .qr svg{width:96px;height:96px;background:#fff;padding:4px;display:block}
.s-ma{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:54px;color:var(--vang2);letter-spacing:.12em;line-height:1}
.s-ma small{display:block;font-family:'Be Vietnam Pro',sans-serif;font-weight:500;font-size:17px;letter-spacing:0;color:var(--chu2)}
.s-cot{position:absolute;top:150px;bottom:112px}
.s-bang{left:40px;width:780px}
.s-giua{left:850px;width:520px}
.s-phai{left:1400px;width:480px}
.s-cot .khung{height:100%;padding:22px 26px}
.s-cot .tieu{font-size:32px}
.b-dong{display:grid;grid-template-columns:54px 1fr 120px;gap:14px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(216,180,106,.15)}
.b-hang{width:42px;height:42px;display:grid;place-items:center;transform:rotate(45deg);border:1px solid var(--vang3);background:var(--muc3);margin-left:6px}
.b-hang span{transform:rotate(-45deg);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;color:var(--vang2)}
.b-dong.h1 .b-hang{background:linear-gradient(180deg,#f0d48d,#b98d3f)}.b-dong.h1 .b-hang span{color:#1c1509}
.b-ten{font-size:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-ten small{font-weight:400;font-size:17px;color:var(--chu2);margin-left:8px}
.b-vach{height:8px;background:rgba(255,255,255,.07);margin-top:6px}
.b-vach i{display:block;height:100%;background:linear-gradient(90deg,var(--vang3),var(--vang2));transition:width .8s}
.b-diem{text-align:right;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:34px;color:var(--vang2);font-variant-numeric:tabular-nums}
.b-phu{font-size:16px;color:var(--chu2);margin-top:4px}
.len{color:var(--dung);font-size:18px;margin-left:6px}
.s-tg{width:250px;margin:0 auto}
.s-giua .khung{overflow:hidden}
.s-nham{margin-top:18px}
.s-nham .n-dong{border-left:3px solid var(--sai);padding:5px 12px;margin:8px 0;background:rgba(178,87,63,.12);font-size:18px;line-height:1.35}
.s-nham .n-dong small{display:block;color:var(--chu2);font-size:15px}
.mo-hop{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.mo-hop svg{width:150px;height:auto}
.mo-loi{position:relative;background:var(--giay);color:#2a2214;padding:16px 18px;font-size:21px;line-height:1.45;min-height:150px;border:1px solid var(--giay3)}
.mo-loi::before{content:'';position:absolute;left:-9px;top:30px;width:16px;height:16px;background:var(--giay);border-left:1px solid var(--giay3);border-bottom:1px solid var(--giay3);transform:rotate(45deg)}
.mo-loi b{font-family:'Cormorant Garamond',serif;font-size:22px;display:block;margin-bottom:4px}
.kk-ds{margin-top:22px}
.kk{display:grid;grid-template-columns:70px 1fr;gap:10px;font-size:19px;line-height:1.4;padding:8px 0;border-bottom:1px solid rgba(216,180,106,.15)}
.kk span{color:var(--vang2);font-variant-numeric:tabular-nums}
.s-chay{position:absolute;left:0;right:0;bottom:0;height:64px;border-top:1px solid var(--vang3);background:rgba(10,14,23,.92);overflow:hidden;display:flex;align-items:center}
.s-chay-nhan{flex:none;position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:0 22px;background:linear-gradient(180deg,#f0d48d,#b98d3f);color:#1c1509;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px}
.s-chay-dai{white-space:nowrap;font-size:22px;padding-left:100%;animation:chay 60s linear infinite}
@keyframes chay{to{transform:translateX(-100%)}}
.s-dk{position:absolute;right:40px;bottom:70px;z-index:3;display:flex;gap:10px;opacity:.35;transition:opacity .3s}
.s-dk:hover{opacity:1}
.s-dk button{font:600 15px 'Be Vietnam Pro',sans-serif;background:var(--muc3);color:var(--chu);border:1px solid var(--vang3);padding:6px 12px;cursor:pointer}
.s-cho{position:absolute;left:40px;right:40px;top:150px;bottom:96px;display:grid;grid-template-columns:600px 1fr;gap:40px}
.s-cho .qr-lon svg{width:520px;height:520px;background:#fff;padding:14px;display:block;margin:0 auto}
.s-cho .dia-chi{text-align:center;font-size:22px;color:var(--chu2);margin-top:14px;word-break:break-all}
.s-dem{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:16px}
.s-dem div{border:1px solid rgba(216,180,106,.4);background:rgba(27,35,54,.8);padding:12px;text-align:center;font-size:20px}
.s-dem b{display:block;font-family:'Cormorant Garamond',serif;font-size:46px;color:var(--vang2);line-height:1.1}
.s-nut-lon{margin-top:28px;display:flex;gap:22px}
.s-nut-lon .nut{font-size:34px;padding:16px 40px}
.s-xong{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,14,.78);z-index:5}
.s-xong .khung{width:1100px;padding:40px 50px;text-align:center}
.s-xong h2{font-size:64px;color:var(--vang2);margin:0 0 10px}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;margin-top:28px;align-items:end}
.podium div{border:1px solid var(--vang);background:rgba(40,51,82,.85);padding:20px;font-size:26px}
.podium div b{display:block;font-family:'Cormorant Garamond',serif;font-size:48px;color:var(--vang2)}

/* chế độ sửa (?sua=1) — chỉ giảng viên mở */
#sua-khung{position:fixed;left:.6rem;bottom:.6rem;z-index:80;max-width:min(46rem,calc(100vw - 1.2rem));font:500 15px/1.4 'Segoe UI',system-ui,sans-serif;color:#2a2214}
#sua-khung .sua-thanh,#sua-khung .sua-hop{background:#f3e8cc;border:2px solid #8f7038;box-shadow:0 6px 18px rgba(0,0,0,.45);padding:.5rem .65rem;margin-top:.4rem}
#sua-khung .sua-thanh{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;background:#1b2336;color:#f2ead6;border-color:#d8b46a}
#sua-khung .sua-thanh b{font:700 20px/1 'Cormorant Garamond',serif;color:#f3dc9a}
#sua-khung button{font:600 14px 'Segoe UI',system-ui,sans-serif;border:1px solid #8f7038;background:#e4d2a8;color:#2a2214;padding:.3rem .6rem;cursor:pointer;min-height:36px}
#sua-khung button.bat,#sua-khung button.chinh{background:#f0d48d}
#sua-khung.gon .sua-thanh > :not(#sua-gon),#sua-khung.gon .sua-hop{display:none!important}
#sua-dem{font-weight:700;color:#f3dc9a}
#sua-ds{max-height:45vh;overflow:auto}
#sua-ds ol{margin:0 0 .5rem;padding-left:1.3rem} #sua-ds li{margin:.4rem 0} #sua-ds s{color:#7b6640}
#sua-o textarea{width:100%;font:600 16px 'Segoe UI',system-ui,sans-serif;border:2px solid #8f7038;padding:.5rem;margin:.35rem 0;resize:vertical;color:#2a2214;background:#fffaf0}
#sua-o .sua-nut{display:flex;gap:.4rem;flex-wrap:wrap}
.sua-nho{color:#6b5530;font-size:13px}
body.co-sua .man{padding-bottom:76px}
#sua-ch{max-height:60vh;overflow:auto;min-width:min(42rem,calc(100vw - 1.2rem))}
#sua-ch .sua-ch-dong{display:grid;grid-template-columns:minmax(10rem,1fr) minmax(12rem,1.6fr);gap:.6rem;align-items:center;margin:.25rem 0;font-size:13px}
#sua-ch input{font:500 14px 'Segoe UI',system-ui,sans-serif;border:1px solid #8f7038;padding:.35rem .5rem;width:100%;color:#2a2214;background:#fffaf0}
#sua-ch input.da-sua{border:2px solid #b98d3f;background:#fff1c9}
@media (max-width:560px){#sua-ch .sua-ch-dong{grid-template-columns:1fr}}
body.dang-sua .sua-tro{outline:2px dashed #e9b85b;outline-offset:2px;cursor:text}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const DB = {"giayMoiCau":25,"dinh":[{"ma":"vh","ten":"Văn hóa"},{"ma":"dd","ten":"Đạo đức"},{"ma":"cn","ten":"Con người"}],"chuong":[{"ma":"I","ten":"Văn hóa","tenDai":"Chương I · Văn hóa","dinh":"vh","canh":"lang","hoiDong":["p1","p2"],"mo":"Làng đang bàn việc dựng nền văn hóa mới. Hai vị trong hội đồng còn giữ những luận điệu chưa đúng.","diaDiem":[{"thua":"I.1","ten":"Đình làng","nguoi":"Ông từ giữ đình","loi":"Muốn bàn chuyện văn hóa, trước hết phải hiểu Hồ Chí Minh quan niệm văn hóa thế nào và văn hóa đứng ở đâu giữa đời sống.","tenMuc":"Quan niệm về văn hóa","luanCu":[{"ma":"I.1-2","chu":"Chính trị, kinh tế, văn hóa, xã hội quan trọng ngang nhau và có sự tác động qua lại lẫn nhau"},{"ma":"I.1-4","chu":"Văn hóa không hoàn toàn phụ thuộc vào kinh tế mà có vai trò tác động tích cực trở lại kinh tế"},{"ma":"I.1-5","chu":"Giữ gìn bản sắc văn hóa dân tộc, lấy văn hóa dân tộc làm gốc để tiếp thu tinh hoa văn hóa nhân loại"}]},{"thua":"I.2","ten":"Chiếu chèo","nguoi":"Cô đào chèo","loi":"Văn hóa không chỉ để thưởng thức. Người đặt cho văn hóa những vai trò rất lớn đối với cách mạng.","tenMuc":"Vai trò của văn hóa","luanCu":[{"ma":"I.2-0","chu":"Văn hóa là mục tiêu của cách mạng"},{"ma":"I.2-2","chu":"Văn hóa là động lực của sự nghiệp cách mạng"},{"ma":"I.2-4","chu":"Văn hóa là một mặt trận; anh chị em văn nghệ sĩ là chiến sĩ trên mặt trận ấy"}]},{"thua":"I.3","ten":"Lớp bình dân học vụ","nguoi":"Cô giáo bình dân","loi":"Nền văn hóa mới được xây dựng ra sao qua từng thời kỳ cách mạng?","tenMuc":"Xây dựng nền văn hóa mới","luanCu":[{"ma":"I.3-1","chu":"Nền văn hóa Hồ Chí Minh chủ trương kết hợp truyền thống tốt đẹp của văn hóa dân tộc với tinh hoa văn hóa nhân loại, thấm nhuần chủ nghĩa yêu nước và chủ nghĩa quốc tế chân chính"},{"ma":"I.3-3","chu":"Trong kháng chiến chống thực dân Pháp, nền văn hóa mới có tính chất dân tộc, khoa học, đại chúng"},{"ma":"I.3-5","chu":"Nền văn hóa mới là nền văn hóa toàn diện, giữ gìn cốt cách văn hóa dân tộc, bảo đảm tính khoa học, tiến bộ và nhân văn"}]}]},{"ma":"II","ten":"Đạo đức","tenDai":"Chương II · Đạo đức","dinh":"dd","canh":"gieng","hoiDong":["p3"],"mo":"Hội đồng chọn người gánh việc chung. Có người cho rằng chỉ cần tài là đủ.","diaDiem":[{"thua":"II.1","ten":"Giếng làng","nguoi":"Bác cán bộ xã","loi":"Người cách mạng cần điều gì trước nhất? Ở giếng làng, ai cũng bàn chuyện đức và tài.","tenMuc":"Đạo đức là gốc, là nền tảng","luanCu":[{"ma":"II.1-0","chu":"Đạo đức là gốc, là nền tảng, là sức mạnh, là tiêu chuẩn hàng đầu của người cách mạng"},{"ma":"II.1-1","chu":"Như sông có nguồn, cây có gốc; người cách mạng không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân"},{"ma":"II.1-3","chu":"Đức và tài thống nhất, đức là gốc; nếu không có đạo đức cách mạng thì có tài cũng vô dụng"}]},{"thua":"II.2","ten":"Sân hợp tác xã","nguoi":"Chị xã viên","loi":"Bốn chuẩn mực đạo đức cách mạng là những chuẩn mực nào, chuẩn mực nào bao trùm?","tenMuc":"Bốn chuẩn mực đạo đức cách mạng","luanCu":[{"ma":"II.2-0","chu":"Trung với nước, hiếu với dân là phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác"},{"ma":"II.2-2","chu":"Cần, kiệm, liêm, chính, chí công vô tư là nội dung cốt lõi của đạo đức cách mạng"},{"ma":"II.2-4","chu":"Thương yêu con người, sống có tình có nghĩa"}]},{"thua":"II.3","ten":"Nhà văn hóa xã","nguoi":"Anh đoàn viên","loi":"Nền đạo đức mới được xây dựng theo những nguyên tắc nào?","tenMuc":"Ba nguyên tắc xây dựng đạo đức","luanCu":[{"ma":"II.3-0","chu":"Nói đi đôi với làm, nêu gương về đạo đức là nguyên tắc quan trọng bậc nhất trong xây dựng nền đạo đức mới"},{"ma":"II.3-1","chu":"Xây đi đôi với chống, muốn xây phải chống, chống nhằm mục đích xây, lấy xây làm chính"},{"ma":"II.3-3","chu":"Tu dưỡng đạo đức như một cuộc cách mạng trường kỳ, gian khổ; nền đạo đức mới chỉ có thể được xây dựng trên cơ sở tự giác tu dưỡng đạo đức của mỗi người"}]}]},{"ma":"III","ten":"Con người","tenDai":"Chương III · Con người","dinh":"cn","canh":"song","hoiDong":["p4"],"mo":"Làng mở trường mới. Có người nghĩ việc “trồng người” chỉ là chuyện một sớm một chiều.","diaDiem":[{"thua":"III.1","ten":"Bến đò","nguoi":"Ông lái đò","loi":"Con người trong tư tưởng Hồ Chí Minh là con người như thế nào?","tenMuc":"Quan niệm về con người","luanCu":[{"ma":"III.1-0","chu":"Con người là một chỉnh thể, thống nhất về trí lực, tâm lực, thể lực"},{"ma":"III.1-2","chu":"Trong mỗi con người đều có tính tốt và tính xấu"},{"ma":"III.1-5","chu":"Hồ Chí Minh nhìn nhận con người lịch sử - cụ thể, xa lạ với con người trừu tượng"}]},{"thua":"III.2","ten":"Cánh đồng","nguoi":"Bà con xã viên","loi":"Con người có vai trò gì đối với sự nghiệp cách mạng?","tenMuc":"Vai trò của con người","luanCu":[{"ma":"III.2-0","chu":"Con người là mục tiêu của cách mạng"},{"ma":"III.2-3","chu":"Con người là động lực của cách mạng"},{"ma":"III.2-4","chu":"Con người là vốn quý nhất, nhân tố quyết định thành công của sự nghiệp cách mạng"}]},{"thua":"III.3","ten":"Trường làng","nguoi":"Thầy hiệu trưởng","loi":"Xây dựng con người là việc như thế nào, cần những gì?","tenMuc":"Xây dựng con người","luanCu":[{"ma":"III.3-0","chu":"Xây dựng con người là yêu cầu khách quan của sự nghiệp cách mạng, vừa cấp bách vừa lâu dài, có ý nghĩa chiến lược"},{"ma":"III.3-1","chu":"Vì lợi ích trăm năm thì phải trồng người"},{"ma":"III.3-3","chu":"Xây dựng con người toàn diện vừa hồng vừa chuyên"}]}]},{"ma":"IV","ten":"Hôm nay","tenDai":"Chương IV · Hôm nay","dinh":"vh","canh":"pho","hoiDong":["p5"],"mo":"Làng xưa nay đã thành phố huyện. Vận dụng tư tưởng của Người hôm nay, có người muốn đóng cổng làng lại.","diaDiem":[{"thua":"IV.1","ten":"Thư viện huyện","nguoi":"Cô thủ thư","loi":"Hôm nay, Đảng ta vận dụng tư tưởng của Người về văn hóa, con người ra sao?","tenMuc":"Xây dựng và phát triển văn hóa, con người","luanCu":[{"ma":"IV.1-0","chu":"Văn hóa là nền tảng tinh thần của xã hội, vừa là mục tiêu vừa là động lực thúc đẩy sự phát triển kinh tế - xã hội"},{"ma":"IV.1-3","chu":"Con người là trung tâm của chiến lược phát triển, đồng thời là chủ thể phát triển"},{"ma":"IV.1-5","chu":"Chủ động hội nhập quốc tế về văn hóa, tiếp thu tinh hoa văn hóa nhân loại"}]},{"thua":"IV.2","ten":"Giảng đường","nguoi":"Bạn sinh viên","loi":"Học tập đạo đức cách mạng Hồ Chí Minh hôm nay là học những gì?","tenMuc":"Xây dựng đạo đức cách mạng","luanCu":[{"ma":"IV.2-0","chu":"Hồ Chí Minh là tấm gương sáng, là hiện thân của nền đạo đức cách mạng Việt Nam"},{"ma":"IV.2-1","chu":"Học tập đạo đức cách mạng Hồ Chí Minh là phải trung với nước, hiếu với dân, suốt đời đấu tranh cho sự nghiệp cách mạng"},{"ma":"IV.2-5","chu":"Thế hệ trẻ là người chủ tương lai của nước nhà; cần chăm lo giáo dục lý tưởng cách mạng, đạo đức, lối sống, văn hóa cho sinh viên"}]}]}],"hoiDong":[{"ma":"p1","ten":"Ông Phú Hộ","vai":"chủ hiệu buôn","chuong":"I","dinh":"vh","hinh":"phuho","noi":"Văn hóa thuộc kiến trúc thượng tầng, nên hoàn toàn phụ thuộc vào kinh tế. Cứ lo kinh tế trước, văn hóa tính sau.","dung":["I.1-4"],"dongY":"Phải rồi. Văn hóa không đứng ngoài mà đứng trong kinh tế, còn tác động tích cực trở lại kinh tế. Tôi đặt quả cân của mình lên đỉnh Văn hóa.","giai":"Văn hóa thuộc kiến trúc thượng tầng, nhưng không thể đứng ngoài mà phải đứng trong kinh tế: văn hóa không hoàn toàn phụ thuộc vào kinh tế, mà có vai trò tác động tích cực trở lại kinh tế."},{"ma":"p2","ten":"Cụ Từ Lệ","vai":"người giữ lề lối cũ","chuong":"I","dinh":"vh","hinh":"tule","noi":"Nền văn hóa mới ư? Cứ duy trì hoàn toàn các phong tục tập quán cũ là đủ, chẳng cần học thêm của ai.","dung":["I.3-1","I.1-5"],"dongY":"Ta hiểu rồi. Giữ truyền thống tốt đẹp, phát triển và nâng cao nó, lại tiếp thu tinh hoa văn hóa nhân loại. Quả cân của ta đặt lên đỉnh Văn hóa.","giai":"Nền văn hóa mà Hồ Chí Minh chủ trương kết hợp những truyền thống tốt đẹp của văn hóa dân tộc được phát triển và nâng cao với tinh hoa văn hóa của nhân loại, thấm nhuần sâu sắc chủ nghĩa yêu nước và chủ nghĩa quốc tế chân chính."},{"ma":"p3","ten":"Cậu Tú Tài","vai":"người đỗ đạt","chuong":"II","dinh":"dd","hinh":"tutai","noi":"Cán bộ có tài là được. Có tài nhưng thiếu đạo đức cách mạng thì vẫn có thể lãnh đạo nhân dân thành công.","dung":["II.1-1","II.1-3"],"dongY":"Tôi nhận ra rồi. Đức là gốc; không có đạo đức cách mạng thì có tài cũng vô dụng. Quả cân của tôi đặt lên đỉnh Đạo đức.","giai":"Hồ Chí Minh khẳng định: “Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân” và “Nếu không có đạo đức cách mạng thì có tài cũng vô dụng”."},{"ma":"p4","ten":"Bà Chợ Phiên","vai":"người buôn bán","chuong":"III","dinh":"cn","hinh":"chophien","noi":"“Trồng người” chỉ là công việc trước mắt, dạy xong một lứa là xong, chẳng có ý nghĩa lâu dài gì.","dung":["III.3-0","III.3-1"],"dongY":"Thì ra “trồng người” là việc lâu dài, gian khổ, vừa vì lợi ích trước mắt vừa vì lợi ích lâu dài. Quả cân của tôi đặt lên đỉnh Con người.","giai":"“Vì lợi ích trăm năm thì phải “trồng người””. “Trồng người” là công việc lâu dài, gian khổ, vừa vì lợi ích trước mắt vừa vì lợi ích lâu dài, là công việc của văn hóa giáo dục."},{"ma":"p5","ten":"Ông Lũy Tre","vai":"người canh cổng làng","chuong":"IV","dinh":"vh","hinh":"luytre","noi":"Muốn giữ bản sắc thì phải hạn chế hội nhập quốc tế về văn hóa, đóng cổng làng lại cho chắc.","dung":["IV.1-5"],"dongY":"Vậy là phải chủ động hội nhập quốc tế về văn hóa, tiếp thu tinh hoa văn hóa nhân loại, mà vẫn xây dựng nền văn hóa tiên tiến, đậm đà bản sắc dân tộc. Quả cân của tôi đặt lên đỉnh Văn hóa.","giai":"Nghị quyết số 33-NQ/TW (Hội nghị Trung ương 9 khóa XI) nêu nhiệm vụ: “Chủ động hội nhập quốc tế về văn hóa, tiếp thu tinh hoa văn hóa nhân loại”."}],"cau":[{"id":"c01","goc":1,"chuong":"I","muc":"I.2","dinh":["vh"],"dang":"tf","hoi":"Theo Hồ Chí Minh, văn hóa là mục tiêu duy nhất của cách mạng Việt Nam.","pa":["Đúng","Sai"],"dung":[1],"giaiThich":"Sai. Mục tiêu của cách mạng Việt Nam là độc lập dân tộc và chủ nghĩa xã hội. Cùng với chính trị, kinh tế, xã hội, văn hóa nằm trong mục tiêu chung của toàn bộ tiến trình cách mạng; văn hóa không phải là mục tiêu duy nhất.","nho":"Văn hóa nằm trong mục tiêu chung của cách mạng, cùng với chính trị, kinh tế, xã hội; không phải mục tiêu duy nhất."},{"id":"c02","goc":2,"chuong":"I","muc":"I.3","dinh":["vh"],"dang":"tf","hoi":"UNESCO đã ghi nhận Chủ tịch Hồ Chí Minh là Anh hùng giải phóng dân tộc, Nhà văn hóa kiệt xuất Việt Nam vào năm 1987.","pa":["Đúng","Sai"],"dung":[0],"giaiThich":"Đúng. Hồ Chí Minh được UNESCO ghi nhận là Anh hùng giải phóng dân tộc, Nhà văn hóa kiệt xuất Việt Nam trong Nghị quyết 24C/18.6.5 của Khóa họp 24 Đại hội đồng UNESCO từ ngày 20/10 đến ngày 20/11/1987.","nho":"UNESCO ghi nhận Hồ Chí Minh là Anh hùng giải phóng dân tộc, Nhà văn hóa kiệt xuất Việt Nam (1987)."},{"id":"c03","goc":3,"chuong":"II","muc":"II.3","dinh":["dd"],"dang":"tf","hoi":"Câu nói của Hồ Chí Minh “Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong” thể hiện nguyên tắc tu dưỡng đạo đức suốt đời.","pa":["Đúng","Sai"],"dung":[0],"giaiThich":"Đúng. Theo Hồ Chí Minh, tu dưỡng đạo đức như một cuộc cách mạng trường kỳ, gian khổ; mỗi người phải kiên trì rèn luyện liên tục, tu dưỡng suốt đời. Đạo đức không phải là cái gì đó có tính “nhất thành bất biến”, mà được hình thành, phát triển do môi trường giáo dục, do sự rèn luyện, phấn đấu và tu dưỡng bản thân của mỗi người.","nho":"“Đạo đức cách mạng không phải trên trời sa xuống…” thể hiện nguyên tắc tu dưỡng đạo đức suốt đời."},{"id":"c04","goc":4,"chuong":"I","muc":"I.1","dinh":["vh"],"dang":"tf","hoi":"Quan niệm văn hóa theo nghĩa rộng của Hồ Chí Minh xuất hiện sau Cách mạng Tháng Tám năm 1945, khi cả nước tập trung xây dựng đất nước.","pa":["Đúng","Sai"],"dung":[1],"giaiThich":"Sai. Quan niệm văn hóa theo nghĩa rộng được Hồ Chí Minh đưa ra vào tháng 8/1943, khi còn ở trong nhà tù của Tưởng Giới Thạch. Đây là quan niệm văn hóa duy nhất theo nghĩa rộng. Từ sau Cách mạng Tháng Tám, Hồ Chí Minh có bàn đến văn hóa nhưng theo nghĩa hẹp, với ý nghĩa là kiến trúc thượng tầng, là toàn bộ đời sống tinh thần của xã hội.","nho":"Quan niệm văn hóa theo nghĩa rộng ra đời tháng 8/1943, khi Người còn ở trong nhà tù của Tưởng Giới Thạch."},{"id":"c05","goc":5,"chuong":"III","muc":"III.3","dinh":["cn"],"dang":"tf","hoi":"Trong quan điểm của Hồ Chí Minh về xây dựng con người, “trồng người” chỉ là công việc trước mắt, không mang ý nghĩa lâu dài.","pa":["Đúng","Sai"],"dung":[1],"giaiThich":"Sai. “Vì lợi ích trăm năm thì phải “trồng người””. “Trồng người” là công việc lâu dài, gian khổ, vừa vì lợi ích trước mắt vừa vì lợi ích lâu dài, là công việc của văn hóa giáo dục.","nho":"“Trồng người” là công việc lâu dài, gian khổ, vừa vì lợi ích trước mắt vừa vì lợi ích lâu dài."},{"id":"c06","goc":6,"chuong":"II","muc":"II.1","dinh":["dd"],"dang":"tf","hoi":"Theo tư tưởng Hồ Chí Minh, nếu cán bộ có tài nhưng thiếu đạo đức cách mạng thì vẫn có thể lãnh đạo nhân dân thành công.","pa":["Đúng","Sai"],"dung":[1],"giaiThich":"Sai. Hồ Chí Minh khẳng định: “Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân” và “Nếu không có đạo đức cách mạng thì có tài cũng vô dụng”.","nho":"Không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân."},{"id":"c07","goc":7,"chuong":"I","muc":"I.1","dinh":["vh"],"dang":"one","hoi":"Theo Hồ Chí Minh, trong đời sống có bốn vấn đề phải được coi là quan trọng ngang nhau và có sự tác động qua lại lẫn nhau, đó là:","pa":["Chính trị, kinh tế, giáo dục, văn hóa.","Chính trị, kinh tế, xã hội, quốc phòng.","Chính trị, kinh tế, văn hóa, xã hội.","Kinh tế, văn hóa, giáo dục, y tế.","Chính trị, quân sự, văn hóa, xã hội."],"dung":[2],"giaiThich":"Hồ Chí Minh cho rằng, trong đời sống có bốn vấn đề phải được coi là quan trọng ngang nhau và có sự tác động qua lại lẫn nhau, đó là chính trị, kinh tế, văn hóa, xã hội.","nho":"Bốn vấn đề quan trọng ngang nhau, tác động qua lại: chính trị, kinh tế, văn hóa, xã hội."},{"id":"c08","goc":8,"chuong":"II","muc":"II.2","dinh":["dd"],"dang":"one","hoi":"Theo quan điểm của Hồ Chí Minh về đạo đức cách mạng, đâu là phẩm chất bao trùm và quan trọng nhất?","pa":["Cần, kiệm, liêm, chính.","Thương yêu con người, sống có tình có nghĩa.","Trung với nước, hiếu với dân.","Tinh thần quốc tế trong sáng.","Nói đi đôi với làm, nêu gương về đạo đức."],"dung":[2],"giaiThich":"Trung với nước, hiếu với dân là phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác. Nói đi đôi với làm, nêu gương về đạo đức là một nguyên tắc xây dựng đạo đức, không phải một chuẩn mực.","nho":"Trung với nước, hiếu với dân là phẩm chất đạo đức bao trùm, quan trọng nhất."},{"id":"c09","goc":9,"chuong":"I","muc":"I.1","dinh":["vh"],"dang":"one","hoi":"Trong các cách tiếp cận văn hóa của Hồ Chí Minh, cách tiếp cận nào thường xuất hiện trong các bài nói với đồng bào miền núi?","pa":["Tiếp cận theo nghĩa rộng, tổng hợp mọi phương thức sinh hoạt của con người.","Tiếp cận theo nghĩa hẹp là đời sống tinh thần của xã hội, thuộc kiến trúc thượng tầng.","Tiếp cận theo nghĩa hẹp hơn là bàn đến các trường học, số người đi học, xóa nạn mù chữ, biết đọc, biết viết.","Tiếp cận theo “phương thức sử dụng công cụ sinh hoạt”.","Tiếp cận văn hóa như một mặt trận."],"dung":[2],"giaiThich":"Hồ Chí Minh có bốn cách tiếp cận chủ yếu về văn hóa. Trong đó, cách tiếp cận theo nghĩa hẹp hơn là bàn đến các trường học, số người đi học, xóa nạn mù chữ, biết đọc, biết viết thường xuất hiện trong các bài nói với đồng bào miền núi.","nho":"Cách tiếp cận văn hóa theo nghĩa hẹp hơn (trường học, xóa nạn mù chữ) thường gặp trong các bài nói với đồng bào miền núi."},{"id":"c10","goc":10,"chuong":"I","muc":"I.1","dinh":["vh"],"dang":"one","hoi":"“Dân ta phải biết sử ta. Cho tường gốc tích nước nhà Việt Nam” là lời nhắc nhở của Hồ Chí Minh về việc:","pa":["Học tập văn hóa các nước phương Đông.","Giữ gìn bản sắc văn hóa dân tộc.","Tiếp thu tinh hoa văn hóa nhân loại.","Xây dựng nền văn hóa mới xã hội chủ nghĩa.","Chống giặc dốt và nâng cao dân trí."],"dung":[1],"giaiThich":"Câu này nằm trong phần giữ gìn bản sắc văn hóa dân tộc: trách nhiệm của con người Việt Nam là phải trân trọng, khai thác, giữ gìn, phát huy, phát triển những giá trị của văn hóa dân tộc, đáp ứng yêu cầu, nhiệm vụ cách mạng của từng giai đoạn lịch sử.","nho":"“Dân ta phải biết sử ta…” là lời nhắc giữ gìn bản sắc văn hóa dân tộc."},{"id":"c11","goc":11,"chuong":"II","muc":"II.3","dinh":["dd"],"dang":"one","hoi":"Theo Hồ Chí Minh, nguồn gốc của mọi thứ tệ nạn như quan liêu, tham ô, lãng phí là gì?","pa":["Sự thiếu hiểu biết về pháp luật.","Chủ nghĩa cá nhân.","Thiếu kinh nghiệm lãnh đạo.","Ảnh hưởng của văn hóa ngoại lai.","Sự kém phát triển về kinh tế."],"dung":[1],"giaiThich":"Hồ Chí Minh chỉ rõ: “Quan liêu, tham ô, lãng phí là tội ác. Phải tẩy sạch nó để thực hiện cần kiệm liêm chính”. Nguồn gốc của mọi thứ tệ nạn là chủ nghĩa cá nhân: “do cá nhân chủ nghĩa mà phạm nhiều sai lầm... Phải kiên quyết quét sạch chủ nghĩa cá nhân”.","nho":"Chủ nghĩa cá nhân là nguồn gốc của mọi thứ tệ nạn như quan liêu, tham ô, lãng phí."},{"id":"c12","goc":12,"chuong":"I","muc":"I.3","dinh":["vh"],"dang":"one","hoi":"Trong thời kỳ kháng chiến chống thực dân Pháp, Hồ Chí Minh chủ trương xây dựng nền văn hóa mới với tính chất nào?","pa":["Tiên tiến, đậm đà bản sắc dân tộc.","Toàn diện, hiện đại, hội nhập.","Dân tộc, khoa học, đại chúng.","Xã hội chủ nghĩa và dân tộc.","Truyền thống và tiến bộ."],"dung":[2],"giaiThich":"Trong kháng chiến chống thực dân Pháp, Hồ Chí Minh khẳng định lại quan điểm của Đảng từ năm 1943 trong Đề cương văn hóa Việt Nam về phương châm xây dựng nền văn hóa mới: một nền văn hóa có tính chất dân tộc, khoa học, đại chúng.","nho":"Trong kháng chiến chống thực dân Pháp, nền văn hóa mới có tính chất dân tộc, khoa học, đại chúng."},{"id":"c13","goc":13,"chuong":"I","muc":"I.2","dinh":["vh"],"dang":"wrong","hoi":"Theo Hồ Chí Minh, để làm tròn nhiệm vụ của một chiến sĩ nghệ thuật trên mặt trận văn hóa, điều nào sau đây không phải là yêu cầu?","pa":["Có lập trường tư tưởng vững vàng.","Coi ngòi bút là vũ khí sắc bén trong sự nghiệp “phò chính trừ tà”.","Chỉ ca ngợi cái tốt, tránh phê bình cái xấu.","Bám sát cuộc sống thực tiễn, đi sâu vào quần chúng.","Có những tác phẩm xứng đáng với dân tộc anh hùng và thời đại vẻ vang."],"dung":[2],"giaiThich":"Để làm tròn nhiệm vụ, chiến sĩ nghệ thuật phải có lập trường tư tưởng vững vàng; ngòi bút là vũ khí sắc bén trong sự nghiệp “phò chính trừ tà”. Phải bám sát cuộc sống thực tiễn, đi sâu vào quần chúng, để phê bình nghiêm khắc những thói xấu như tham ô, lười biếng, lãng phí, quan liêu, và ca tụng chân thật những người tốt việc tốt. Vì vậy, “chỉ ca ngợi cái tốt, tránh phê bình cái xấu” là sai.","nho":"Chiến sĩ nghệ thuật phê bình nghiêm khắc những thói xấu và ca tụng chân thật những người tốt việc tốt."},{"id":"c14","goc":14,"chuong":"I","muc":"I.1","dinh":["vh"],"dang":"wrong","hoi":"Trong tư tưởng Hồ Chí Minh về quan hệ giữa văn hóa với các lĩnh vực khác, nhận định nào sau đây là không đúng?","pa":["Văn hóa phải phục vụ nhiệm vụ chính trị.","Văn hóa thuộc kiến trúc thượng tầng và hoàn toàn phụ thuộc vào kinh tế.","Giải phóng chính trị để mở đường cho văn hóa phát triển.","Văn hóa có vai trò tác động tích cực trở lại kinh tế.","Xã hội thế nào văn hóa thế ấy, nên phải giải phóng xã hội để văn hóa phát triển."],"dung":[1],"giaiThich":"Hồ Chí Minh giải thích rằng văn hóa thuộc kiến trúc thượng tầng. Tuy nhiên, văn hóa cũng không thể đứng ngoài mà phải đứng trong kinh tế, nghĩa là văn hóa không hoàn toàn phụ thuộc vào kinh tế, mà có vai trò tác động tích cực trở lại kinh tế. Vì vậy, nhận định “hoàn toàn phụ thuộc vào kinh tế” là sai.","nho":"Văn hóa không hoàn toàn phụ thuộc vào kinh tế mà có vai trò tác động tích cực trở lại kinh tế."},{"id":"c15","goc":15,"chuong":"II","muc":"II.3","dinh":["dd"],"dang":"wrong","hoi":"Theo Hồ Chí Minh, để xây dựng nền đạo đức mới, đạo đức cách mạng, điều nào sau đây không phải là đối tượng cần chống?","pa":["Chủ nghĩa đế quốc.","Những thói quen và tập tục lạc hậu.","Chủ nghĩa cá nhân.","Lợi ích cá nhân chính đáng của con người.","Những biểu hiện, hành vi vô đạo đức, suy thoái đạo đức."],"dung":[3],"giaiThich":"Trên con đường đi tới tiến bộ và cách mạng, đạo đức mới chỉ có thể được xây dựng thành công trên cơ sở kiên trì mục tiêu chống chủ nghĩa đế quốc, chống những thói quen và tập tục lạc hậu, phải loại trừ chủ nghĩa cá nhân; chống là chống các biểu hiện, các hành vi vô đạo đức, suy thoái đạo đức. Tuy nhiên, Người lưu ý: “Đấu tranh chống chủ nghĩa cá nhân không phải là “giày xéo lên lợi ích cá nhân””.","nho":"Đấu tranh chống chủ nghĩa cá nhân không phải là “giày xéo lên lợi ích cá nhân”."},{"id":"c16","goc":16,"chuong":"III","muc":"III.3","dinh":["cn"],"dang":"wrong","hoi":"Đâu không phải là nội dung xây dựng con người toàn diện “vừa hồng vừa chuyên” theo quan điểm của Hồ Chí Minh?","pa":["Có ý thức làm chủ, tinh thần tập thể xã hội chủ nghĩa.","Chỉ chú trọng phát triển trí tuệ, không cần đạo đức.","Cần kiệm xây dựng đất nước, hăng hái bảo vệ Tổ quốc.","Có lòng yêu nước nồng nàn, tinh thần quốc tế trong sáng.","Có phương pháp làm việc khoa học, phong cách quần chúng, dân chủ, nêu gương."],"dung":[1],"giaiThich":"Hồ Chí Minh quan tâm xây dựng con người toàn diện vừa “hồng” vừa “chuyên”, đặc biệt quan tâm đến việc nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân, đồng thời bồi dưỡng năng lực trí tuệ. Người khuyên: “Đức là đạo đức cách mạng. Đó là cái gốc, rất quan trọng. Nếu không có đạo đức cách mạng thì có tài cũng vô dụng”. Vì vậy, “chỉ chú trọng phát triển trí tuệ, không cần đạo đức” là sai.","nho":"Con người toàn diện vừa “hồng” vừa “chuyên”: đức là gốc, đồng thời bồi dưỡng năng lực trí tuệ."},{"id":"c17","goc":17,"chuong":"II","muc":"II.2","dinh":["dd"],"dang":"wrong","hoi":"Theo Hồ Chí Minh, nhận định nào sau đây về chữ “Liêm” là không đúng?","pa":["Liêm là trong sạch, không tham lam.","Liêm là không tham địa vị, không tham tiền tài, không tham sung sướng.","Người liêm vẫn có thể ham người tâng bốc mình.","Người liêm chỉ có một thứ ham là ham học, ham làm, ham tiến bộ.","Chữ Liêm phải đi đôi với chữ Kiệm."],"dung":[2],"giaiThich":"Liêm “là trong sạch, không tham lam... Chữ LIÊM phải đi đôi với chữ KIỆM”; “Liêm là không tham địa vị. Không tham tiền tài. Không tham sung sướng. Không ham người tâng bốc mình... Chỉ có một thứ ham là ham học, ham làm, ham tiến bộ”. Vì vậy, nhận định “người liêm vẫn có thể ham người tâng bốc mình” là sai.","nho":"Liêm là không tham địa vị, tiền tài, sung sướng, không ham người tâng bốc mình; chỉ ham học, ham làm, ham tiến bộ."},{"id":"c18","goc":18,"chuong":"I","muc":"I.1","dinh":["vh"],"dang":"wrong","hoi":"Phát biểu nào sau đây không phản ánh quan điểm của Hồ Chí Minh về việc tiếp thu tinh hoa văn hóa nhân loại?","pa":["Tiếp thu cái gì tốt của văn hóa xưa và nay.","Tránh nguy cơ trở thành kẻ bắt chước.","Chỉ nên học hỏi văn hóa phương Đông.","Mục đích là làm giàu cho văn hóa Việt Nam.","Phải lấy văn hóa dân tộc làm gốc khi tiếp thu."],"dung":[2],"giaiThich":"Hồ Chí Minh chỉ rõ: “Tây phương hay Đông phương có cái gì tốt ta học lấy để tạo ra một nền văn hóa Việt Nam”. Nội dung tiếp thu là toàn diện, bao gồm Đông, Tây, kim, cổ; tiêu chí tiếp thu là có cái gì hay, cái gì tốt là ta học lấy; đồng thời tránh nguy cơ trở thành kẻ bắt chước. Vì vậy, “chỉ nên học hỏi văn hóa phương Đông” là sai.","nho":"Tây phương hay Đông phương có cái gì tốt ta học lấy để tạo ra một nền văn hóa Việt Nam."},{"id":"c19","goc":19,"chuong":"I","muc":"I.3","dinh":["vh"],"dang":"multi","hoi":"Theo Hồ Chí Minh, nền văn hóa mới Việt Nam được xây dựng trên cơ sở kết hợp những yếu tố nào? (Chọn tất cả phương án đúng)","pa":["Những truyền thống tốt đẹp của văn hóa dân tộc được phát triển và nâng cao.","Tinh hoa văn hóa của nhân loại.","Thấm nhuần sâu sắc chủ nghĩa yêu nước.","Thấm nhuần sâu sắc chủ nghĩa quốc tế chân chính.","Duy trì hoàn toàn các phong tục tập quán cũ."],"dung":[0,1,2,3],"giaiThich":"Nền văn hóa mà Hồ Chí Minh chủ trương kết hợp những truyền thống tốt đẹp của văn hóa dân tộc được phát triển và nâng cao với tinh hoa văn hóa của nhân loại, thấm nhuần sâu sắc chủ nghĩa yêu nước và chủ nghĩa quốc tế chân chính. Giáo trình nói đến những truyền thống tốt đẹp “được phát triển và nâng cao”, và văn hóa phải sửa đổi tham nhũng, lười biếng, phù hoa, xa xỉ. Vì vậy, “duy trì hoàn toàn các phong tục tập quán cũ” là sai.","nho":"Nền văn hóa mới kết hợp truyền thống tốt đẹp của dân tộc với tinh hoa văn hóa nhân loại, không duy trì hoàn toàn phong tục cũ."},{"id":"c20","goc":20,"chuong":"I","muc":"I.1","dinh":["vh"],"dang":"multi","hoi":"Theo quan điểm Hồ Chí Minh, những nhận định nào sau đây đúng về bản sắc văn hóa dân tộc? (Chọn tất cả phương án đúng)","pa":["Phản ánh những nét độc đáo, đặc tính dân tộc.","Là ngọn nguồn đi tới chủ nghĩa Mác - Lênin.","Có ý nghĩa quan trọng đối với sự nghiệp xây dựng và bảo vệ Tổ quốc.","Là những giá trị văn hóa nhất thời, dễ mất đi trong quá trình giao lưu với bên ngoài.","Về hình thức, biểu hiện ở ngôn ngữ, phong tục, tập quán, lễ hội, truyền thống, cách cảm và nghĩ."],"dung":[0,1,2,4],"giaiThich":"Bản sắc văn hóa dân tộc là những giá trị văn hóa bền vững của cộng đồng các dân tộc Việt Nam, chứa đựng giá trị lớn và có một ý nghĩa quan trọng đối với sự nghiệp xây dựng và bảo vệ Tổ quốc. Nó phản ánh những nét độc đáo, đặc tính dân tộc; nó là ngọn nguồn đi tới chủ nghĩa Mác - Lênin. Về hình thức, cốt cách văn hóa dân tộc biểu hiện ở ngôn ngữ, phong tục, tập quán, lễ hội, truyền thống, cách cảm và nghĩ. Vì vậy, coi bản sắc là “những giá trị nhất thời” là sai.","nho":"Bản sắc văn hóa dân tộc là những giá trị văn hóa bền vững, không phải những giá trị nhất thời."},{"id":"c21","goc":21,"chuong":"II","muc":"II.1","dinh":["dd"],"dang":"multi","hoi":"Theo tư tưởng Hồ Chí Minh, những biểu hiện nào sau đây thuộc về đạo đức cách mạng của người chiến sĩ cách mạng? (Chọn tất cả phương án đúng)","pa":["Cả đời hết lòng hết sức phục vụ nhân dân.","Sinh hoạt ngày thường thì làm gương mẫu: gian khổ, chất phác, kính trọng của công.","Gặp khó khăn, gian khổ, thất bại cũng không sợ sệt, rụt rè, lùi bước.","Khi gặp thuận lợi và thành công vẫn giữ vững tinh thần gian khổ, chất phác, khiêm tốn.","Ưu tiên lợi ích cá nhân trước lợi ích tập thể."],"dung":[0,1,2,3],"giaiThich":"Theo Hồ Chí Minh, “Đại đa số chiến sĩ cách mạng là người có đạo đức: Cả đời hết lòng hết sức phục vụ nhân dân, sinh hoạt ngày thường thì làm gương mẫu; gian khổ, chất phác, kính trọng của công...”. “Có đạo đức cách mạng thì khi gặp khó khăn, gian khổ, thất bại, cũng không sợ sệt, rụt rè, lùi bước... khi gặp thuận lợi và thành công vẫn giữ vững tinh thần gian khổ, chất phác, khiêm tốn”. Chí công vô tư là luôn đặt lợi ích của Đảng, của nhân dân, của dân tộc lên trên hết, trước hết; chí công vô tư là chống chủ nghĩa cá nhân. Vì vậy, “ưu tiên lợi ích cá nhân trước lợi ích tập thể” là trái với đạo đức cách mạng.","nho":"Chiến sĩ cách mạng có đạo đức cả đời hết lòng hết sức phục vụ nhân dân, khó khăn không lùi bước, thành công vẫn khiêm tốn."},{"id":"c22","goc":22,"chuong":"IV","muc":"IV.2","dinh":["dd"],"dang":"multi","hoi":"Học tập đạo đức cách mạng Hồ Chí Minh là học tập và làm theo những phẩm chất nào sau đây? (Chọn tất cả phương án đúng)","pa":["Trung với nước, hiếu với dân, suốt đời đấu tranh cho sự nghiệp cách mạng.","Cần, kiệm, liêm, chính, chí công vô tư; đức khiêm tốn, trung thực.","Đức tin tuyệt đối vào sức mạnh của nhân dân; nhân ái, vị tha, khoan dung và nhân hậu với con người.","Ý chí và nghị lực tinh thần to lớn, quyết tâm vượt qua mọi thử thách, gian nguy.","Đề cao chủ nghĩa yêu nước, tách rời tinh thần quốc tế để giữ vững độc lập dân tộc."],"dung":[0,1,2,3],"giaiThich":"Học tập đạo đức cách mạng Hồ Chí Minh là phải trung với nước, hiếu với dân, suốt đời đấu tranh cho sự nghiệp cách mạng; tu dưỡng, rèn luyện theo tấm gương cần, kiệm, liêm, chính, chí công vô tư, đức khiêm tốn, trung thực; có đức tin tuyệt đối vào sức mạnh của nhân dân, luôn nhân ái, vị tha, khoan dung và nhân hậu với con người; học tấm gương về ý chí và nghị lực tinh thần to lớn. Đồng thời, đó là học tấm gương về chủ nghĩa yêu nước kết hợp với chủ nghĩa quốc tế vô sản trong sáng, không tách rời hai mặt ấy.","nho":"Học tập đạo đức Hồ Chí Minh là học chủ nghĩa yêu nước kết hợp với chủ nghĩa quốc tế vô sản trong sáng, không tách rời."},{"id":"c23","goc":23,"chuong":"III","muc":"III.2","dinh":["cn"],"dang":"multi","hoi":"Theo Hồ Chí Minh, những nội dung nào sau đây thuộc về “giải phóng con người”? (Chọn tất cả phương án đúng)","pa":["Xóa bỏ tình trạng áp bức, bóc lột, nô dịch con người.","Xóa bỏ các điều kiện xã hội làm tha hóa con người.","Làm cho mọi người được hưởng tự do, hạnh phúc, có điều kiện phát huy khả năng sáng tạo, làm chủ xã hội, làm chủ tự nhiên và làm chủ bản thân.","Phát triển toàn diện theo đúng bản chất tốt đẹp của con người.","Xóa bỏ ách thống trị của chủ nghĩa đế quốc, giành lại độc lập cho dân tộc."],"dung":[0,1,2,3],"giaiThich":"Giải phóng con người là xóa bỏ tình trạng áp bức, bóc lột, nô dịch con người; xóa bỏ các điều kiện xã hội làm tha hóa con người, làm cho mọi người được hưởng tự do, hạnh phúc, có điều kiện phát huy khả năng sáng tạo, làm chủ xã hội, làm chủ tự nhiên và làm chủ bản thân, phát triển toàn diện theo đúng bản chất tốt đẹp của con người. “Xóa bỏ ách thống trị của chủ nghĩa đế quốc, giành lại độc lập cho dân tộc” là nội dung của giải phóng dân tộc.","nho":"Giải phóng con người là xóa bỏ áp bức, bóc lột, nô dịch con người; giành độc lập là nội dung của giải phóng dân tộc."},{"id":"c24","goc":24,"chuong":"IV","muc":"IV.1","dinh":["vh","cn"],"dang":"multi","hoi":"Theo Nghị quyết Hội nghị Trung ương 9 khóa XI và Nghị quyết Đại hội XIII của Đảng, những định hướng nào sau đây về xây dựng văn hóa, con người Việt Nam là đúng? (Chọn tất cả phương án đúng)","pa":["Phát triển con người toàn diện và xây dựng nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc.","Văn hóa, con người Việt Nam thực sự trở thành sức mạnh nội sinh, động lực phát triển đất nước và bảo vệ Tổ quốc.","Chăm lo xây dựng con người Việt Nam phát triển toàn diện, trọng tâm là bồi dưỡng tinh thần yêu nước, lòng tự hào dân tộc, đạo đức, lối sống và nhân cách.","Xây dựng môi trường văn hóa lành mạnh, phù hợp với bối cảnh phát triển kinh tế thị trường định hướng xã hội chủ nghĩa và hội nhập quốc tế.","Hạn chế hội nhập quốc tế về văn hóa để giữ nguyên bản sắc dân tộc."],"dung":[0,1,2,3],"giaiThich":"Nghị quyết Đại hội XIII xác định: “Phát triển con người toàn diện và xây dựng nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc để văn hóa, con người Việt Nam thực sự trở thành sức mạnh nội sinh, động lực phát triển đất nước và bảo vệ Tổ quốc”. Nghị quyết số 33-NQ/TW (Hội nghị Trung ương 9 khóa XI) nêu: “Chăm lo xây dựng con người Việt Nam phát triển toàn diện, trọng tâm là bồi dưỡng tinh thần yêu nước, lòng tự hào dân tộc, đạo đức, lối sống và nhân cách”, cùng các nhiệm vụ như xây dựng môi trường văn hóa lành mạnh và chủ động hội nhập quốc tế về văn hóa, tiếp thu tinh hoa văn hóa nhân loại. Vì vậy, “hạn chế hội nhập quốc tế về văn hóa” là sai.","nho":"Văn hóa, con người hôm nay: chủ động hội nhập quốc tế về văn hóa, tiếp thu tinh hoa văn hóa nhân loại."},{"id":"c25","goc":25,"chuong":"II","muc":"II.1","dinh":["dd"],"dang":"fill","hoi":"Trong Di chúc, Hồ Chí Minh viết: “Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người ____ thật trung thành của nhân dân”.","pa":["đồng chí","đầy tớ","chiến sĩ","bạn bè","đại diện"],"dung":[1],"giaiThich":"Trong Di chúc, Hồ Chí Minh viết: “Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân”.","nho":"Đảng phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân."},{"id":"c26","goc":26,"chuong":"II","muc":"II.2","dinh":["dd"],"dang":"fill","hoi":"Theo Hồ Chí Minh: “Cần tức là siêng năng, chăm chỉ, cố gắng dẻo dai... Muốn cho chữ Cần có nhiều kết quả hơn, thì phải có ____ cho mọi công việc”.","pa":["mục tiêu","kế hoạch","sáng kiến","kinh nghiệm","quy trình"],"dung":[1],"giaiThich":"“Cần tức là siêng năng, chăm chỉ, cố gắng dẻo dai... Muốn cho chữ Cần có nhiều kết quả hơn, thì phải có kế hoạch cho mọi công việc”. Cần tức là lao động cần cù, siêng năng; lao động có kế hoạch, sáng tạo, có năng suất cao.","nho":"Muốn cho chữ Cần có nhiều kết quả hơn thì phải có kế hoạch cho mọi công việc."},{"id":"c27","goc":27,"chuong":"I","muc":"I.2","dinh":["vh"],"dang":"fill","hoi":"Hồ Chí Minh đã đặt cơ sở cho một xã hội phát triển bền vững với ba trụ cột là bền vững về kinh tế, xã hội và ____.","pa":["chính trị","văn hóa","môi trường","quốc phòng","giáo dục"],"dung":[2],"giaiThich":"Hồ Chí Minh đã đặt cơ sở cho một xã hội phát triển bền vững với ba trụ cột là bền vững về kinh tế, xã hội và môi trường.","nho":"Ba trụ cột của xã hội phát triển bền vững: kinh tế, xã hội và môi trường."},{"id":"c28","goc":28,"chuong":"III","muc":"III.3","dinh":["cn"],"dang":"fill","hoi":"Về phương pháp xây dựng con người, Hồ Chí Minh nhắc nhở rằng: “Hiền, dữ phải đâu là tính sẵn. Phần nhiều do ____ mà nên”.","pa":["di truyền","giáo dục","hoàn cảnh","tài năng","rèn luyện"],"dung":[1],"giaiThich":"Biện pháp giáo dục có một vị trí quan trọng. Hồ Chí Minh nhắc nhở rằng: “Hiền, dữ phải đâu là tính sẵn. Phần nhiều do giáo dục mà nên”.","nho":"“Hiền, dữ phải đâu là tính sẵn. Phần nhiều do giáo dục mà nên”."},{"id":"c29","goc":29,"chuong":"IV","muc":"IV.2","dinh":["dd"],"dang":"fill","hoi":"Hồ Chí Minh đã cống hiến trọn đời mình cho sự nghiệp giải phóng dân tộc và thống nhất Tổ quốc, giải phóng giai cấp công nhân và dân tộc bị áp bức, cho sự thắng lợi của chủ nghĩa xã hội, cho sự hợp tác anh em và ____ giữa các dân tộc.","pa":["cạnh tranh","hòa bình","hội nhập","đối đầu","đấu tranh"],"dung":[1],"giaiThich":"Hồ Chí Minh đã cống hiến trọn đời mình cho sự nghiệp giải phóng dân tộc và thống nhất Tổ quốc, giải phóng giai cấp công nhân và dân tộc bị áp bức, cho sự thắng lợi của chủ nghĩa xã hội, cho sự hợp tác anh em và hòa bình giữa các dân tộc.","nho":"Người cống hiến trọn đời cho sự hợp tác anh em và hòa bình giữa các dân tộc."},{"id":"c30","goc":30,"chuong":"III","muc":"III.1","dinh":["cn"],"dang":"fill","hoi":"Theo Hồ Chí Minh, con người là một chỉnh thể, thống nhất về trí lực, tâm lực, ____, đa dạng bởi mối quan hệ giữa cá nhân và xã hội (quan hệ gia đình, dòng tộc, làng xã, quan hệ giai cấp, dân tộc...) và các mối quan hệ xã hội (quan hệ chính trị, văn hóa, đạo đức, tôn giáo...).","pa":["nghị lực","thể lực","năng lực","trí tuệ","nhân lực"],"dung":[1],"giaiThich":"Theo Hồ Chí Minh, con người là một chỉnh thể, thống nhất về trí lực, tâm lực, thể lực, đa dạng bởi mối quan hệ giữa cá nhân và xã hội (quan hệ gia đình, dòng tộc, làng xã, quan hệ giai cấp, dân tộc...) và các mối quan hệ xã hội (quan hệ chính trị, văn hóa, đạo đức, tôn giáo...).","nho":"Con người là một chỉnh thể, thống nhất về trí lực, tâm lực, thể lực."}]};

})();

function tre(x, y, s) { let o = ''; for (let i = 0; i < 5; i++) { const xx = x + (i - 2) * 7 * s; o += '<rect x="' + xx + '" y="' + (y - 90 * s + i % 2 * 8) + '" width="' + 3 * s + '" height="' + (90 * s - i % 2 * 8) + '" fill="#4f7a3a"/>'; }

function dinh(x, y) { return '<rect x="' + (x - 90) + '" y="' + (y - 60) + '" width="180" height="60" fill="#c9a676"/>' + [-70, -35, 0, 35, 70].map(d => '<rect x="' + (x + d - 4) + '" y="' + (y - 60) + '" width="8" height="60" fill="#7a3a24"/>').join('') +
  '<path d="M' + (x - 125) + ' ' + (y - 58) + ' Q ' + (x - 110) + ' ' + (y - 70) + ' ' + (x - 100) + ' ' + (y - 96) + ' L ' + (x + 100) + ' ' + (y - 96) + ' Q ' + (x + 110) + ' ' + (y - 70) + ' ' + (x + 125) + ' ' + (y - 58) + ' Z" fill="#8c3a26"/><path d="M' + (x - 128) + ' ' + (y - 104) + ' L ' + (x - 100) + ' ' + (y - 96) + ' L ' + (x + 100) + ' ' + (y - 96) + ' L ' + (x + 128) + ' ' + (y - 104) + '" stroke="#5b2416" stroke-width="7" fill="none"/>'; }
function veCanh(k, w, hh) {

    '<radialGradient id="toi' + k + '" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs>';
  o += '<rect width="' + w + '" height="' + hh + '" fill="url(#troi' + k + ')"/><rect width="' + w + '" height="' + hh + '" fill="url(#sang' + k + ')"/>';
  o += '<polygon points="0,260 120,180 230,240 360,150 500,230 640,160 780,220 900,170 1000,210 1000,320 0,320" fill="' + m.nui + '" opacity=".75"/>';
  o += '<polygon points="0,300 160,250 330,290 520,240 700,285 860,250 1000,280 1000,360 0,360" fill="' + m.nui + '" opacity=".95"/>';

  for (let i = 0; i < 9; i++) o += '<path d="M0 ' + (360 + i * 24) + ' Q 500 ' + (330 + i * 26) + ' 1000 ' + (360 + i * 24) + '" stroke="' + m.dat2 + '" stroke-width="2" fill="none" opacity=".6"/>';
  if (k === 'lang') { o += tre(80, 360, 1.3) + tre(930, 350, 1.2) + dinh(520, 345) + nha(240, 350, 90) + nha(790, 345, 80, '#7a4a2a'); }
  if (k === 'gieng') { o += cay(150, 360, 1.6, '#3f7a35') + nha(420, 350, 100) + nha(760, 345, 90, '#7a4a2a') + '<ellipse cx="560" cy="420" rx="46" ry="16" fill="#8d8a80"/><ellipse cx="560" cy="414" rx="36" ry="11" fill="#2d4f6a"/><rect x="600" y="360" width="6" height="60" fill="#6b4a2e"/>' + tre(920, 350, 1.1); }

    '<path d="M430 440 h120 l-14 18 h-92 Z" fill="#6b4a2e"/><rect x="470" y="410" width="4" height="30" fill="#4a2f1d"/>' + nha(220, 370, 110, '#9a4a32', '#e6d3a8') + nha(820, 365, 90) + cay(640, 370, 1.1); }
  if (k === 'pho') { o += '<rect x="400" y="230" width="220" height="120" fill="#e6dccb"/><polygon points="385,230 510,180 635,230" fill="#9a4a32"/>' + [420, 460, 500, 540, 580].map(x => '<rect x="' + x + '" y="250" width="14" height="100" fill="#cbbfa8"/>').join('') +
    nha(170, 355, 100, '#3f5d8a', '#ece3d0') + nha(810, 350, 110, '#7a4a2a', '#efe6d6') + cay(300, 360, 1.1) + cay(690, 365, 1, '#3f7a35') + '<rect x="0" y="440" width="1000" height="24" fill="#b9ad97" opacity=".7"/>'; }
  for (let i = 0; i < 16; i++) { const bx = (i * 137) % w, by = 60 + (i * 89) % 200; o += '<circle cx="' + bx + '" cy="' + by + '" r="' + (6 + i % 5 * 4) + '" fill="#fff4d0" opacity="' + (.05 + i % 4 * .03) + '"/>'; }
  return o + '<rect width="' + w + '" height="' + hh + '" fill="url(#toi' + k + ')"/></svg>';

      if (Date.now() - xoaLan > 4000) { xoaLan = Date.now(); bao('Bấm “Xóa hết danh sách” lần nữa để xóa mọi chỗ sửa chữ trên máy này.', 4000); return; }
      SUA.chu = []; SUA.chuGD = {}; luuSua(); location.reload(); return; }
    if (b.dataset.bok) { ghiMa(b.dataset.bok, chuGocCua(b.dataset.bok)); return; }
    if (b.dataset.bo) { SUA.chu.splice(+b.dataset.bo, 1); luuSua(); location.reload(); } };
  $('#sua-tai').onclick = () => {
    const coCh = Object.keys(SUA.chuGD).length > 0;
    if (!SUA.chu.length && !coCh) { bao('Chưa sửa chỗ nào.'); return; }
    const a = document.createElement('a');
    const chuGiaoDien = coCh ? Object.assign({}, DB.chuGiaoDien || {}, SUA.chuGD) : null;
    a.href = URL.createObjectURL(new Blob([JSON.stringify({game: 'can-can', luc: new Date().toISOString(), sua: SUA.chu, chuGiaoDien}, null, 2)], {type: 'application/json'}));
    a.download = 'sua-chu-can-can.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    bao('Đã tải sua-chu-can-can.json — gửi tệp này để đưa chữ đã sửa vào game.', 5000);
  };
  $('#sua-xong').onclick = () => xong($('#sua-chu').value);
  $('#sua-tra').onclick = () => { if (dang && dang.k) { ghiMa(dang.k, chuGocCua(dang.k)); dong(); } else if (dang) xong(dang.cu); };
  $('#sua-huy').onclick = dong;
  $('#sua-chu').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); xong(e.target.value); } else if (e.key === 'Escape') dong(); });
  veThanh();
}

napTD();
if (QS.get('ma')) { PH.nhapMa = QS.get('ma').toUpperCase().replace(/[^A-Z0-9]/g, ''); const dt = docNho('can-can-dt'); manVaoPhong(); if (dt && dt.ma === PH.nhapMa) HANH.veLaiPhong(); else timPhong(); }
else manChao();
