<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đi tìm một nửa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== Hồ sen: nước thẫm, lưới ô, lá sen, cá koi (bản vẽ "Đi tìm một nửa — Hồ sen", 9/10/2026) ===== */
:root{
  --nuoc:#1A4436; --muc:#13261F; --muc2:#4D5A52; --kem:#FBF7EA; --kem2:#E9F2DA; --ke:#D9D1BF;
  --la:#6DC043; --la-dam:#2F6B22; --vang:#F6D77A; --nghe:#F0B429; --do:#E0453B; --do-dam:#8E1E17;
  --lam:#3A8DEB; --xanh:#3E9B47; --sen:#2E7D3A; --nhat:#D8EFE0; --nhat2:#BFD9C9;
  --ban:rgba(8,26,20,.74); --vienn:#0E1F33; --r:22px;
  font-size:clamp(16px, .5vw + 12px, 22px); color-scheme:dark;
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--nuoc); color:#fff; }
body{ font-family:"Be Vietnam Pro",system-ui,sans-serif; line-height:1.5; -webkit-text-size-adjust:100%; min-height:100vh; }
main{ position:relative; z-index:1; text-shadow:0 1px 3px rgba(5,20,15,.55); }
.the,.cua button,input,select,.khoa,.nut,.chua button,.chip-nhom span,.hang-la,.o-nhom .tl,.so-hang{ text-shadow:none; }
h1,h2,h3{ font-family:"Baloo 2","Be Vietnam Pro",sans-serif; font-weight:800; line-height:1.15; margin:.2em 0 .4em; }
h1{ font-size:2.3rem; text-shadow:0 3px 0 rgba(5,20,15,.6); } h2{ font-size:1.6rem; } h3{ font-size:1.2rem; }
p{ margin:.4em 0; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid var(--vang); outline-offset:3px; }
.mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; }
.nho{ font-size:.85rem; } .mo{ color:var(--nhat); }
.man{ max-width:40rem; margin:0 auto; padding:1.1rem 1rem 3rem; }

/* ===== Nền hồ (trang trí, không bắt chạm) ===== */
.nen{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background-color:var(--nuoc);
  background-image:radial-gradient(ellipse 60% 40% at 20% 15%,rgba(120,170,140,.28),transparent 70%),
    radial-gradient(ellipse 50% 35% at 80% 55%,rgba(10,30,24,.55),transparent 70%),
    radial-gradient(ellipse 70% 40% at 35% 85%,rgba(90,140,110,.22),transparent 70%),
    radial-gradient(ellipse 40% 30% at 70% 20%,rgba(8,26,20,.5),transparent 70%); }
.nen::before{ content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(220,255,235,.09) 1px,transparent 1px),
  linear-gradient(90deg,rgba(220,255,235,.09) 1px,transparent 1px); background-size:26px 26px; }
@media (min-width:1000px){ .nen::before{ background-size:36px 36px; } }
.nen .o-toi{ position:absolute; background:rgba(5,20,15,.32); }
.nen svg{ position:absolute; }
/* đáy hồ: bóng lá sen chìm (nhòe, co giãn theo khung) + vệt nắng lăn tăn (tính theo px nên cùng cỡ trên mọi màn) */
.nen svg.bong-la{ inset:0; width:100%; height:100%; }
.nen svg.nang{ left:-80px; top:-80px; width:calc(100% + 160px); height:calc(100% + 160px); opacity:.14; }
@media (min-width:1000px) and (prefers-reduced-motion:no-preference){ .nen svg.nang{ animation:nang 48s ease-in-out infinite alternate; } }
@keyframes nang{ to{ translate:60px 40px; } }
.nen .koi{ filter:drop-shadow(0 8px 5px rgba(0,0,0,.35)); animation:boi 17s ease-in-out infinite alternate; }
.nen .koi.cham-hon{ animation-duration:23s; animation-direction:alternate-reverse; }
.nen .noi{ filter:drop-shadow(0 10px 8px rgba(0,0,0,.4)); }
.nen .canh-hoa{ position:absolute; width:9px; height:6px; border-radius:70% 30% 70% 30%; background:#F7BCD2; animation:troi 9s ease-in-out infinite alternate; }
@keyframes boi{ from{ translate:0 0; } to{ translate:var(--dx,24px) var(--dy,36px); } }
@keyframes troi{ to{ translate:10px 14px; rotate:40deg; } }
@media (prefers-reduced-motion:reduce){ .nen .koi,.nen .canh-hoa{ animation:none; } }

/* ===== Thẻ và khung ===== */
.the{ background:var(--kem); color:var(--muc); border:3px solid var(--muc); border-radius:var(--r);
  box-shadow:0 .45rem 0 rgba(5,20,15,.55); padding:1rem 1.1rem; margin:.9rem 0; }
.the .mo{ color:var(--muc2); }
.o-the{ background:var(--ban); color:#fff; border:2px solid rgba(255,255,255,.14); border-radius:var(--r); padding:.85rem 1rem; margin:.9rem 0; }
.o-the > b{ font:800 1.25rem "Baloo 2",sans-serif; display:block; }
.bang-nhap{ background:var(--ban); border:2px solid rgba(255,255,255,.14); border-radius:24px; padding:1rem; margin:.9rem 0; }
.bang-nhap > label.o:first-child{ margin-top:0; }
.cham{ display:inline-block; width:1em; height:1em; border-radius:50%; border:2px solid #fff; vertical-align:-.15em; flex:none; }
.the .cham,.chip-nhom .cham{ border-color:var(--muc); }

/* ===== Nút ===== */
.nut{ font:700 1rem "Be Vietnam Pro",sans-serif; border:3px solid var(--vienn); border-radius:16px; padding:.7rem 1.1rem; cursor:pointer;
  background:var(--xanh); color:#fff; box-shadow:0 5px 0 var(--vienn),inset 0 6px 0 rgba(255,255,255,.25);
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem; }
.nut:active{ translate:0 3px; box-shadow:0 2px 0 var(--vienn),inset 0 6px 0 rgba(255,255,255,.25); }
.nut.phu{ background:var(--ban); color:#fff; border:2px solid rgba(255,255,255,.22); box-shadow:none; border-radius:999px; font-weight:600; }
.nut.vang{ background:var(--nghe); color:var(--muc); }
.nut.lam{ background:var(--lam); } .nut.do{ background:var(--do); }
.nut:disabled{ background:#8C9A8F; color:#fff; cursor:not-allowed; translate:none; }
.nut.nho{ padding:.4rem .85rem; font-size:.85rem; }
.nut-lon{ width:100%; font-size:1.2rem; padding:.9rem; border-radius:18px; }
.hang-nut{ display:flex; flex-wrap:wrap; gap:.7rem; margin:.9rem 0; }
.nut-tron{ width:4.1rem; height:4.1rem; border-radius:50%; border:3px solid var(--vienn); padding:0; cursor:pointer; color:#fff;
  box-shadow:0 5px 0 var(--vienn),inset 0 -7px 0 rgba(0,0,0,.2),inset 0 7px 0 rgba(255,255,255,.32);
  display:flex; align-items:center; justify-content:center; }
.nut-tron svg{ width:46%; height:46%; }
.nut-tron:active{ translate:0 3px; box-shadow:0 2px 0 var(--vienn),inset 0 -7px 0 rgba(0,0,0,.2),inset 0 7px 0 rgba(255,255,255,.32); }
.nut-tron.do{ background:var(--do); } .nut-tron.xanh{ background:var(--xanh); }
.hang-tron{ display:flex; justify-content:center; gap:2.75rem; padding-top:.5rem; }
.hang-tron > div{ display:flex; flex-direction:column; align-items:center; gap:.5rem; font-size:.82rem; font-weight:600; }

/* ===== Ô nhập ===== */
label.o{ display:block; font-weight:600; margin:.8rem 0 .3rem; }
input,select{ font:inherit; color:var(--muc); background:#FFFDF4; border:3px solid var(--muc); border-radius:16px; padding:.6rem .8rem; width:100%; color-scheme:light; }
.loi{ color:#FFB4AA; font-weight:600; }
.bao{ position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:var(--muc); color:#fff; border:2px solid rgba(255,255,255,.25);
  padding:.6rem 1rem; border-radius:12px; z-index:60; max-width:90vw; font-size:.95rem; }
.mang{ font-size:.8rem; display:inline-flex; align-items:center; gap:.35rem; color:var(--nhat); }
.mang .dot{ width:.6rem; height:.6rem; border-radius:50%; background:#FF8A7E; display:inline-block; }
.mang .dot.on{ background:#6EE0A0; } .mang .dot.dang{ background:var(--vang); }
table.bd{ border-collapse:collapse; width:100%; color:var(--muc); }
table.bd th,table.bd td{ border-bottom:1.5px solid var(--ke); padding:.45rem .6rem; text-align:left; }
table.bd th{ font-size:.75em; color:var(--muc2); font-weight:600; border-bottom:3px solid var(--muc); }
table.bd td.so{ font-family:"IBM Plex Mono",monospace; font-weight:600; }
table.bd tr.hang1 td{ background:#FFF1C2; font-weight:700; }

/* ===== Trang đầu ===== */
.logo{ display:flex; gap:.9rem; align-items:center; margin:1rem 0 .4rem; }
.logo svg{ width:5rem; height:5rem; flex:none; filter:drop-shadow(0 8px 6px rgba(0,0,0,.35)); }
.logo h1{ margin:0; font-size:2.5rem; }
.logo.giua{ flex-direction:column; text-align:center; gap:.2rem; margin:.6rem 0 .2rem; }
.logo.giua svg{ width:7rem; height:7rem; }
.cua{ display:grid; gap:.8rem; margin:1rem 0; }
.cua button{ text-align:left; background:var(--kem); color:var(--muc); border:3px solid var(--muc); border-radius:var(--r);
  box-shadow:0 5px 0 rgba(5,20,15,.55); padding:.9rem 1.1rem; cursor:pointer; font:inherit; }
.cua button:hover{ background:#fff; }
.cua button .mo{ color:var(--muc2); }
.cua b{ font-family:"Baloo 2",sans-serif; font-size:1.3rem; display:block; line-height:1.2; }
.luat{ padding-left:1.2rem; } .luat li{ margin:.3rem 0; }

/* ===== Điện thoại ===== */
.thanh{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin:.1rem 0 .6rem; }
.thanh .ten{ display:flex; align-items:center; gap:.5rem; background:var(--ban); border:2px solid rgba(255,255,255,.18); border-radius:999px;
  padding:.35rem .9rem .35rem .45rem; font-weight:600; font-size:.95rem; }
.thanh .ten .cham{ width:1.25rem; height:1.25rem; }
.thanh .sp{ flex:1; }
.dongho{ display:flex; align-items:center; gap:.65rem; background:var(--ban); border-radius:16px; padding:.5rem .9rem; font-weight:600; margin:.6rem 0; }
.dongho .so{ font:600 1.4rem "IBM Plex Mono",monospace; color:var(--vang); }
.dongho .vach{ flex:1; height:.62rem; background:rgba(255,255,255,.16); border-radius:9px; overflow:hidden; }
.dongho .vach i{ display:block; height:100%; background:var(--vang); border-radius:9px; }
.dongho.cuoi .so{ color:#FF8A7E; } .dongho.cuoi .vach i{ background:#FF8A7E; }
.manh .dau{ display:flex; align-items:center; gap:.65rem; }
.manh .dau svg{ width:2.75rem; height:2.75rem; flex:none; }
.manh .dau b{ font:800 1.25rem "Baloo 2",sans-serif; display:block; line-height:1.2; }
.manh .ba{ display:block; font-size:.82rem; font-weight:700; color:#B3261E; }
.manh blockquote{ margin:.7rem 0; font:700 1.8rem/1.25 "Baloo 2",sans-serif; }
.ma-toi{ display:flex; align-items:center; justify-content:space-between; gap:.6rem; background:var(--muc); color:var(--kem); border-radius:16px; padding:.45rem 1rem; }
.ma-toi .so{ font:600 2.1rem "IBM Plex Mono",monospace; letter-spacing:.14em; color:var(--vang); }
.nhap{ display:flex; gap:.75rem; margin:.4rem 0; }
.nhap input{ flex:1; min-width:0; font:600 1.9rem "IBM Plex Mono",monospace; text-align:center; letter-spacing:.18em; padding:.55rem .25rem; }
.bang-nhap .nhan-nhap{ font-weight:600; font-size:.95rem; display:block; }
.khoa{ background:#FCE4E1; color:var(--do-dam); border:3px solid var(--muc); border-radius:var(--r); box-shadow:0 .45rem 0 rgba(5,20,15,.55);
  padding:1.3rem 1rem; margin:.9rem 0; display:flex; flex-direction:column; align-items:center; gap:.6rem; text-align:center; }
.khoa .dem-nguoc{ width:6.5rem; height:6.5rem; border-radius:50%; background:var(--do); border:4px solid var(--muc); color:#fff;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.2),inset 0 8px 0 rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font:800 3.4rem/1 "Baloo 2",sans-serif; }
.khoa b{ font:800 1.5rem "Baloo 2",sans-serif; }
.cau-du{ position:relative; margin-top:3.4rem; padding-top:3.3rem; }
.cau-du .sen{ position:absolute; left:50%; top:-3.25rem; translate:-50% 0; width:6.25rem; height:6.25rem; filter:drop-shadow(0 6px 5px rgba(0,0,0,.3)); }
.cau-du .tick{ display:block; text-align:center; font:800 1.6rem "Baloo 2",sans-serif; color:var(--sen); }
.cau-du blockquote{ margin:.6rem 0; font:600 1.3rem/1.35 "Baloo 2",sans-serif; }
.cau-du blockquote mark{ background:var(--vang); color:inherit; border-radius:5px; padding:0 .12em; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
.cau-du .nguon{ font-size:.85rem; color:var(--muc2); }
.cau-du .y{ margin-top:.6rem; background:var(--kem2); border-radius:14px; padding:.55rem .75rem; font-size:.9rem; }
.cau-du .y b{ display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:#4F6B3E; }
.cau-du.gon{ margin-top:.9rem; padding-top:1rem; }
.cau-du.gon .tick{ text-align:left; font-size:1.15rem; }
.hang-la{ position:relative; width:13.5rem; height:13.5rem; margin:.4rem auto 0; }
.hang-la svg{ position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 10px 8px rgba(0,0,0,.4)); }
.hang-la div{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muc); padding-top:1rem; line-height:1.15; font-weight:700; }
.hang-la .lon{ font:800 3.1rem/1 "Baloo 2",sans-serif; }
.cho-pill{ display:flex; align-items:center; justify-content:center; gap:.6rem; background:var(--ban); border-radius:18px; padding:.75rem 1rem; font-weight:600; margin:.9rem 0; text-align:center; }
.cho-pill::before{ content:""; width:.6rem; height:.6rem; border-radius:50%; background:var(--vang); flex:none; }
.giua-chu{ text-align:center; }

/* ===== Máy chiếu: chữ co giãn theo bề rộng màn hình ===== */
#s-chieu{ font-size:clamp(22px, 1.45vw, 44px); }
.chieu{ padding:1.1em 1.8em 2em; max-width:none; }
.chieu-dau{ display:flex; align-items:center; gap:.8em; flex-wrap:wrap; }
.chieu-dau svg{ width:2.6em; height:2.6em; flex:none; }
.chieu-dau h1{ margin:0; font-size:2em; flex:1; }
.chieu-dau .mo{ font-size:.85em; }
.chieu .nut{ font-size:1em; }
.chieu .nut.nho{ font-size:.8em; }
.cho{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2em; align-items:center; margin-top:.8em; }
.qr-la{ position:relative; width:20em; height:20em; }
.qr-la > svg{ position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 .7em .5em rgba(0,0,0,.45)); }
.qr{ position:absolute; left:22%; top:24%; width:56%; background:#fff; border:.18em solid var(--muc); border-radius:.9em; padding:.5em; }
.qr svg{ width:100%; height:auto; display:block; }
.ma-phong{ font:600 4.4em/1 "IBM Plex Mono",monospace; letter-spacing:.12em; color:var(--vang); text-shadow:0 .06em 0 rgba(5,20,15,.6); vertical-align:middle; }
.dem-o{ display:flex; align-items:center; gap:1em; background:rgba(8,26,20,.66); border-radius:1.2em; padding:.8em 1.1em; margin:.8em 0; }
.dem{ font:800 3.6em/1 "Baloo 2",sans-serif; }
.chip-nhom{ display:flex; flex-wrap:wrap; gap:.45em; margin:.4em 0 0; }
.chip-nhom span{ display:flex; align-items:center; gap:.4em; background:var(--kem); color:var(--muc); border:.14em solid var(--muc); border-radius:999px; padding:.15em .7em .15em .3em; font-weight:700; font-size:.85em; }
.canh{ background:#FFF1C2; color:var(--muc); border:.14em solid var(--muc); border-radius:.8em; padding:.6em .9em; margin:.7em 0; font-weight:600; }
.choi{ display:grid; grid-template-columns:15em minmax(0,1fr); gap:2.2em; margin-top:1em; align-items:start; }
.da{ width:13em; height:13em; margin:0 auto; border-radius:50%; background:var(--muc); border:.28em solid #0A1712;
  box-shadow:0 .45em 0 rgba(5,15,10,.6),inset 0 -.6em 0 rgba(0,0,0,.25); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15em; }
.da .vong{ font:700 1.2em "Baloo 2",sans-serif; color:var(--nhat2); }
.dh-lon{ font:600 3.4em/1 "IBM Plex Mono",monospace; color:var(--vang); }
.dh-lon.cuoi{ color:#FF8A7E; }
.tong{ height:.7em; background:rgba(255,255,255,.16); border-radius:9px; overflow:hidden; margin:1em 0 .3em; }
.tong i{ display:block; height:100%; background:var(--la); border-radius:9px; transition:width .4s; }
.tong-chu b{ font:800 1.35em "Baloo 2",sans-serif; }
.choi .hang-nut .nut{ flex:1; font-size:.85em; padding:.6em .7em; }
.luoi-nhom{ display:grid; grid-template-columns:repeat(auto-fill,minmax(7.4em,1fr)); gap:.8em; }
.o-nhom{ display:flex; flex-direction:column; align-items:center; gap:.2em; text-align:center; }
.o-nhom .la-nhom{ position:relative; width:7.4em; height:7.4em; }
.o-nhom svg{ position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 .35em .3em rgba(0,0,0,.4)); }
.o-nhom .tl{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-top:.35em; font:800 1.9em "Baloo 2",sans-serif; color:var(--muc); }
.o-nhom b{ display:flex; align-items:center; gap:.35em; font:800 1.1em "Baloo 2",sans-serif; }
.o-nhom .mo{ font-size:.8em; }
.chua-o{ background:rgba(8,26,20,.7); border-radius:1.2em; padding:.8em 1em; margin-top:1.1em; }
.chua-o h3{ margin:0 0 .2em; font-size:1.3em; }
.chua{ display:flex; flex-wrap:wrap; gap:.5em; margin:.5em 0 0; }
.chua button{ font:600 .85em "IBM Plex Mono",monospace; background:var(--kem); color:var(--muc); border:.14em solid var(--muc); border-radius:.6em;
  padding:.25em .65em; cursor:pointer; box-shadow:0 .18em 0 rgba(5,20,15,.55); }
.chua button.hoi{ background:#FCE4E1; border-color:#B3261E; color:var(--do-dam); }
.chieu .the{ padding:.6em .9em .3em; }
.chieu table.bd{ font-size:1em; }
.ket{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:2em; align-items:center; margin-top:.6em; }
.buc{ display:flex; align-items:flex-end; justify-content:center; gap:.3em; }
.bac{ display:flex; flex-direction:column; align-items:center; gap:.3em; }
.bac .la-bac{ position:relative; }
.bac .la-bac > svg{ position:absolute; left:0; bottom:0; width:100%; height:auto; filter:drop-shadow(0 .45em .4em rgba(0,0,0,.4)); }
.bac .la-bac .so-hang{ position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; font-family:"Baloo 2",sans-serif; font-weight:800; color:var(--muc); }
.bac .la-bac .sen{ position:absolute; left:50%; top:0; bottom:auto; translate:-50% 0; width:42%; height:auto; filter:drop-shadow(0 .3em .25em rgba(0,0,0,.3)); }
.bac b{ display:flex; align-items:center; gap:.35em; font:800 1.15em "Baloo 2",sans-serif; }
.chieu details{ margin:.5em 0; }
.chieu summary{ cursor:pointer; color:var(--nhat); font-weight:600; }

/* ===== Xem thử trên một máy ===== */
.thu-luoi{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px; padding:8px; }
.thu-luoi iframe{ width:100%; height:560px; border:2px solid rgba(255,255,255,.2); border-radius:12px; background:var(--nuoc); }
.thu-luoi iframe.may-chieu{ grid-column:1/-1; height:520px; }
</style>
</head>
<body>
<div class="nen" aria-hidden="true">
  <svg class="bong-la" viewBox="0 0 300 520" preserveAspectRatio="xMidYMid slice"><defs><filter id="nen-nhoe" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>
    <g filter="url(#nen-nhoe)" fill="#0b2a20" opacity=".75"><path d="M60 80 L72 30 A55 55 0 1 1 46 32 Z"/><path d="M250 260 L262 214 A50 50 0 1 1 236 216 Z" transform="rotate(40 250 260)"/><path d="M80 440 L94 388 A58 58 0 1 1 64 392 Z" transform="rotate(-30 80 440)"/><path d="M230 500 L240 466 A38 38 0 1 1 220 468 Z"/></g>
    <g filter="url(#nen-nhoe)" fill="#3f7a52" opacity=".25"><ellipse cx="200" cy="90" rx="70" ry="30" transform="rotate(-20 200 90)"/><ellipse cx="40" cy="300" rx="60" ry="24" transform="rotate(30 40 300)"/></g></svg>
  <svg class="nang"><defs><filter id="nen-nang" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.03 0.05" numOctaves="2" seed="4"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.75  0 0 0 0 0.95  0 0 0 0 0.85  0 0 0 9 -4.6"/><feGaussianBlur stdDeviation="1.4"/></filter></defs>
    <rect width="100%" height="100%" filter="url(#nen-nang)"/></svg>

const DB = {"ten":"Đi tìm một nửa","nguon":"Giáo trình Tư tưởng Hồ Chí Minh 2026","capNhat":"2026-10-10","buoi":{"2":["01"],"3":["01","02"],"4":["01","02"],"5":["01","02","03"],"6":["01","02","03","04"],"7":["01","02","03","04","05"],"8":["01","02","03","04","05","06"],"9":["01","02","03","04","05","06","07","08","09"],"10":["01","02","03","04","05","06","07","08","09","10","11"],"11":["01","02","03","04","05","06","07","08","09","10","11","12","13","14"],"12":["01","02","03","04","05","06","07","08","09","10","11","12","13","14"]},"cau":[{"id":"01-2c5ec","cd":"01","st":38,"m":["Toàn Đảng toàn dân ta đoàn kết phấn đấu,","xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh,","và góp phần xứng đáng vào sự nghiệp cách mạng thế giới"],"dt":false,"tt":"t.15, tr.614","y":"Chương 1 · mục IV.1 — Góp phần nâng cao năng lực tư duy lý luận"},{"id":"02-1e104","cd":"02","st":25,"m":["Chỉ có giai cấp công nhân là dũng cảm nhất, cách mạng nhất,","luôn luôn gan góc đương đầu với bọn đế quốc thực dân"],"dt":false,"tt":"t.12, tr.407","y":"Chương 2 · mục I.1.a — Thực tiễn Việt Nam cuối thế kỷ XIX, đầu thế kỷ XX"},{"id":"02-3a7b4","cd":"02","st":52,"m":["Nước Việt Nam có quyền hưởng tự do và độc lập, và sự thực đã thành một nước tự do và độc lập.","Toàn thể dân Việt Nam quyết đem tất cả tinh thần và lực lượng,","tính mệnh và của cải để giữ vững quyền tự do và độc lập ấy"],"dt":false,"tt":"t.4, tr.3","y":"Chương 2 · mục I.2.a — Giá trị truyền thống tốt đẹp của dân tộc Việt Nam"},{"id":"02-4be75","cd":"02","st":60,"m":["Tuy Khổng Tử là phong kiến và tuy trong học thuyết của Khổng Tử có nhiều điều không đúng","song những điều hay trong đó thì chúng ta nên học.","“Chỉ có những người cách mạng chân chính mới thu thái được những điều hiểu biết quý báu của các đời trước để lại”. Lênin dạy chúng ta như vậy"],"dt":false,"tt":"t.6, tr.356-357","y":"Chương 2 · mục I.2.b — Tinh hoa văn hóa nhân loại"},{"id":"02-65964","cd":"02","st":101,"m":["Đức Phật là đại từ đại bi, cứu khổ cứu nạn, muốn cứu chúng sinh ra khỏi khổ nạn, Người phải hy sinh tranh đấu, diệt lũ ác ma. Nay đồng bào ta đại đoàn kết,","hy sinh của cải xương máu, kháng chiến đến cùng, để đánh tan thực dân phản động, để cứu quốc dân ra khỏi khổ nạn, để giữ quyền thống nhất và độc lập của Tổ quốc.","Thế là chúng ta làm theo lòng đại từ đại bi của Đức Phật Thích Ca, kháng chiến để đưa giống nòi ra khỏi cái khổ ải nô lệ"],"dt":true,"tt":"t.5, tr.228","y":"Chương 2 · mục I.2.b — Tinh hoa văn hóa nhân loại"},{"id":"02-8f656","cd":"02","st":24,"m":["Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất,","chắc chắn nhất, cách mạng nhất là chủ nghĩa Lênin"],"dt":false,"tt":"t.2, tr.289","y":"Chương 2 · mục I.2.c — Chủ nghĩa Mác - Lênin"},{"id":"02-2dac1","cd":"02","st":60,"m":["Chúng tôi giành được thắng lợi đó là do nhiều nhân tố,","nhưng cần phải nhấn mạnh rằng - mà không phải chỉ nhân dịp kỷ niệm lần thứ 100 ngày sinh Lênin - chúng tôi giành được những thắng lợi đó trước hết","là nhờ cái vũ khí không gì thay thế được là chủ nghĩa Mác - Lênin"],"dt":false,"tt":"t.15, tr.589-590","y":"Chương 2 · mục I.2.c — Chủ nghĩa Mác - Lênin"},{"id":"03-0b4f8","cd":"03","st":19,"m":["làm tư sản dân quyền cách mạng","và thổ địa cách mạng để đi tới xã hội cộng sản"],"dt":false,"tt":"t.3, tr.1","y":"Chương 2 · mục II.3 — Thời kỳ 1920 - 1930: Hình thành những nội dung cơ bản tư tưởng về cách mạng Việt Nam"},{"id":"03-cbd3b","cd":"03","st":17,"m":["đánh đổ đế quốc Pháp, phong kiến An Nam","và giai cấp tư sản phản cách mạng"],"dt":false,"tt":"t.3, tr.22","y":"Chương 2 · mục II.3 — Thời kỳ 1920 - 1930: Hình thành những nội dung cơ bản tư tưởng về cách mạng Việt Nam"},{"id":"03-7ebb0","cd":"03","st":38,"m":["Trong lúc này quyền lợi dân tộc giải phóng cao hơn hết thảy.","Chúng ta phải đoàn kết lại đánh đổ bọn đế quốc","và bọn Việt gian đặng cứu giống nòi ra khỏi nước sôi lửa nóng"],"dt":false,"tt":"t.3, tr.230","y":"Chương 2 · mục II.4 — Thời kỳ 1930 - 1941: Vượt qua thử thách, giữ vững đường lối, phương pháp cách mạng Việt Nam đúng đắn, sáng tạo"},{"id":"03-abf15","cd":"03","st":20,"m":["Đến ngày thắng lợi,","nhân dân ta sẽ xây dựng lại đất nước ta đàng hoàng hơn, to đẹp hơn!"],"dt":false,"tt":"t.15, tr.131","y":"Chương 2 · mục II.5 — Thời kỳ 1941 - 1969: Tư tưởng Hồ Chí Minh tiếp tục phát triển, soi đường cho sự nghiệp cách mạng của Đảng và nhân dân ta"},{"id":"03-717ee","cd":"03","st":38,"m":["Toàn Đảng, toàn dân ta đoàn kết phấn đấu,","xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh,","và góp phần xứng đáng vào sự nghiệp cách mạng thế giới"],"dt":false,"tt":"t.15, tr.624","y":"Chương 2 · mục II.5 — Thời kỳ 1941 - 1969: Tư tưởng Hồ Chí Minh tiếp tục phát triển, soi đường cho sự nghiệp cách mạng của Đảng và nhân dân ta"},{"id":"04-7fd99","cd":"04","st":37,"m":["Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng;","dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do...","Đó là những lẽ phải không ai chối cãi được"],"dt":false,"tt":"t.4, tr.1","y":"Chương 3 · mục I.1.a — Độc lập, tự do là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc"},{"id":"04-191f3","cd":"04","st":22,"m":["a) Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến.","b) Làm cho nước Nam được hoàn toàn độc lập"],"dt":false,"tt":"t.3, tr.1","y":"Chương 3 · mục I.1.a — Độc lập, tự do là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc"},{"id":"04-b5c31","cd":"04","st":43,"m":["Nhân dân chúng tôi thành thật mong muốn hòa bình.","Nhưng nhân dân chúng tôi cũng kiên quyết chiến đấu đến cùng để bảo vệ những quyền thiêng liêng nhất:","Toàn vẹn lãnh thổ cho Tổ quốc và độc lập cho đất nước"],"dt":false,"tt":"t.4, tr.522","y":"Chương 3 · mục I.1.a — Độc lập, tự do là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc"},{"id":"04-ac1e2","cd":"04","st":22,"m":["Không! Chúng ta thà hy sinh tất cả,","chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ"],"dt":false,"tt":"t.4, tr.534","y":"Chương 3 · mục I.1.a — Độc lập, tự do là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc"},{"id":"04-8e399","cd":"04","st":9,"m":["Không có gì quý","hơn độc lập, tự do"],"dt":false,"tt":"t.15, tr.131","y":"Chương 3 · mục I.1.a — Độc lập, tự do là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc"},{"id":"04-301f0","cd":"04","st":25,"m":["Người ta sinh ra tự do và bình đẳng về quyền lợi,","và phải luôn luôn được tự do và bình đẳng về quyền lợi"],"dt":false,"tt":"t.4, tr.1","y":"Chương 3 · mục I.1.b — Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân"},{"id":"04-7d528","cd":"04","st":10,"m":["Đó là những lẽ phải","không ai chối cãi được"],"dt":false,"tt":"t.4, tr.64","y":"Chương 3 · mục I.1.b — Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân"},{"id":"04-66ba6","cd":"04","st":47,"m":["Làm cho nước Nam được hoàn toàn độc lập... Thâu tiêu hết các thứ quốc trái...","Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo.","Bỏ sưu thuế cho dân cày nghèo... Thi hành luật ngày làm 8 giờ"],"dt":false,"tt":"t.3, tr.1-2","y":"Chương 3 · mục I.1.b — Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân"},{"id":"04-4ad83","cd":"04","st":20,"m":["Nước độc lập mà dân không hưởng hạnh phúc tự do,","thì độc lập cũng chẳng có nghĩa lý gì"],"dt":false,"tt":"t.4, tr.175","y":"Chương 3 · mục I.1.b — Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân"},{"id":"04-23446","cd":"04","st":32,"m":["Chúng ta phải thực hiện ngay: 1. Làm cho dân có ăn.","2. Làm cho dân có mặc. 3.","Làm cho dân có chỗ ở. 4. Làm cho dân có học hành"],"dt":false,"tt":"t.4, tr.175","y":"Chương 3 · mục I.1.b — Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân"},{"id":"04-f40c1","cd":"04","st":43,"m":["Tôi chỉ có một sự ham muốn, ham muốn tột bậc,","là làm sao cho nước ta được hoàn toàn độc lập, dân ta được hoàn toàn tự do,","đồng bào ai cũng có cơm ăn áo mặc, ai cũng được học hành"],"dt":false,"tt":"t.4, tr.187","y":"Chương 3 · mục I.1.b — Độc lập dân tộc phải gắn liền với tự do, hạnh phúc của nhân dân"},{"id":"04-d88e4","cd":"04","st":26,"m":["Đồng bào Nam Bộ là dân nước Việt Nam. Sông có thể cạn,","núi có thể mòn, song chân lý đó không bao giờ thay đổi"],"dt":false,"tt":"t.4, tr.280","y":"Chương 3 · mục I.1.d — Độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ"},{"id":"04-253d4","cd":"04","st":11,"m":["Nước Việt Nam là một,","dân tộc Việt Nam là một"],"dt":false,"tt":"t.4, tr.583","y":"Chương 3 · mục I.1.d — Độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ"},{"id":"04-34fc4","cd":"04","st":46,"m":["Dù khó khăn gian khổ đến mấy, nhân dân ta nhất định sẽ hoàn toàn thắng lợi.","Đế quốc Mỹ nhất định phải cút khỏi nước ta.","Tổ quốc ta nhất định sẽ thống nhất. Đồng bào Nam, Bắc nhất định sẽ sum họp một nhà"],"dt":false,"tt":"t.15, tr.612","y":"Chương 3 · mục I.1.d — Độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ"},{"id":"05-abe89","cd":"05","st":68,"m":["Cách mệnh Pháp cũng như cách mệnh Mỹ, nghĩa là cách mệnh tư bản, cách mệnh không đến nơi, tiếng là cộng hòa và dân chủ,","kỳ thực trong thì nó tước lục công nông, ngoài thì nó áp bức thuộc địa. Cách mệnh đã 4 lần rồi,","mà nay công nông Pháp hẵng còn phải mưu cách mệnh lần nữa mới hòng thoát khỏi vòng áp bức"],"dt":true,"tt":"t.2, tr.296","y":"Chương 3 · mục I.2.a — Cách mạng giải phóng dân tộc muốn thắng lợi phải đi theo con đường cách mạng vô sản"},{"id":"05-69217","cd":"05","st":66,"m":["Trong thế giới bây giờ chỉ có cách mệnh Nga là đã thành công, và thành công đến nơi,","nghĩa là dân chúng được hưởng cái hạnh phúc tự do, bình đẳng thật, không phải tự do và bình đẳng giả dối như đế quốc chủ nghĩa Pháp khoe khoang bên An Nam...","Nói tóm lại là phải theo chủ nghĩa Mã Khắc Tư và Lênin"],"dt":true,"tt":"t.2, tr.304","y":"Chương 3 · mục I.2.a — Cách mạng giải phóng dân tộc muốn thắng lợi phải đi theo con đường cách mạng vô sản"},{"id":"05-e7b83","cd":"05","st":20,"m":["Muốn cứu nước và giải phóng dân tộc","không có con đường nào khác con đường cách mạng vô sản"],"dt":false,"tt":"t.12, tr.30","y":"Chương 3 · mục I.2.a — Cách mạng giải phóng dân tộc muốn thắng lợi phải đi theo con đường cách mạng vô sản"},{"id":"05-7bb85","cd":"05","st":81,"m":["Luận cương của Lênin làm cho tôi rất cảm động, phấn khởi, sáng tỏ, tin tưởng biết bao! Tôi vui mừng đến phát khóc lên.","Ngồi một mình trong buồng mà tôi nói to lên như đang nói trước quần chúng đông đảo: “Hỡi đồng bào bị đọa đày đau khổ!","Đây là cái cần thiết cho chúng ta, đây là con đường giải phóng chúng ta!”. Từ đó tôi hoàn toàn tin theo Lênin, tin theo Quốc tế thứ ba"],"dt":true,"tt":"t.12, tr.562","y":"Chương 3 · mục I.2.a — Cách mạng giải phóng dân tộc muốn thắng lợi phải đi theo con đường cách mạng vô sản"},{"id":"05-f8ac4","cd":"05","st":17,"m":["thâu hết ruộng đất của đế quốc chủ nghĩa làm của công,","chia cho dân cày nghèo"],"dt":false,"tt":"t.3, tr.2","y":"Chương 3 · mục I.2.a — Cách mạng giải phóng dân tộc muốn thắng lợi phải đi theo con đường cách mạng vô sản"},{"id":"05-08162","cd":"05","st":30,"m":["Chính vì Đảng Lao động Việt Nam là đảng của giai cấp công nhân và nhân dân lao động,","cho nên nó phải là đảng của dân tộc Việt Nam"],"dt":false,"tt":"t.7, tr.41","y":"Chương 3 · mục I.2.b — Cách mạng giải phóng dân tộc, trong điều kiện của Việt Nam, muốn thắng lợi phải do Đảng Cộng sản lãnh đạo"},{"id":"05-b708f","cd":"05","st":15,"m":["cách mệnh là việc chung cả dân chúng","chứ không phải việc một hai người"],"dt":false,"tt":"t.2, tr.283","y":"Chương 3 · mục I.2.c — Cách mạng giải phóng dân tộc phải dựa trên lực lượng đại đoàn kết toàn dân tộc, lấy liên minh công - nông làm nền tảng"},{"id":"05-cb2c0","cd":"05","st":22,"m":["Dân tộc cách mệnh thì chưa phân giai cấp, nghĩa là sĩ,","nông, công, thương đều nhất trí chống lại cường quyền"],"dt":false,"tt":"t.2, tr.287","y":"Chương 3 · mục I.2.c — Cách mạng giải phóng dân tộc phải dựa trên lực lượng đại đoàn kết toàn dân tộc, lấy liên minh công - nông làm nền tảng"},{"id":"05-4994c","cd":"05","st":37,"m":["Bất kỳ đàn ông, đàn bà, bất kỳ người già, người trẻ,","không chia tôn giáo, đảng phái, dân tộc.","Hễ là người Việt Nam thì phải đứng lên đánh thực dân Pháp để cứu Tổ quốc"],"dt":false,"tt":"t.4, tr.534","y":"Chương 3 · mục I.2.c — Cách mạng giải phóng dân tộc phải dựa trên lực lượng đại đoàn kết toàn dân tộc, lấy liên minh công - nông làm nền tảng"},{"id":"05-0b239","cd":"05","st":11,"m":["công nông là người chủ cách mệnh...","là gốc cách mệnh"],"dt":false,"tt":"t.2, tr.288","y":"Chương 3 · mục I.2.c — Cách mạng giải phóng dân tộc phải dựa trên lực lượng đại đoàn kết toàn dân tộc, lấy liên minh công - nông làm nền tảng"},{"id":"05-af656","cd":"05","st":38,"m":["lòng cách mệnh càng bền, chí cách mệnh càng quyết...","công nông là tay không chân rồi, nếu thua thì chỉ mất một cái kiếp khổ,","nếu được thì được cả thế giới, cho nên họ gan góc"],"dt":false,"tt":"t.2, tr.288","y":"Chương 3 · mục I.2.c — Cách mạng giải phóng dân tộc phải dựa trên lực lượng đại đoàn kết toàn dân tộc, lấy liên minh công - nông làm nền tảng"},{"id":"05-e2d35","cd":"05","st":43,"m":["Vận mệnh của giai cấp vô sản thế giới","và đặc biệt là vận mệnh của giai cấp vô sản ở các nước đi xâm lược thuộc địa","gắn chặt với vận mệnh của giai cấp bị áp bức ở các thuộc địa"],"dt":false,"tt":"t.11, tr.295","y":"Chương 3 · mục I.2.d — Cách mạng giải phóng dân tộc cần chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc"},{"id":"05-62c0b","cd":"05","st":90,"m":["Chủ nghĩa tư bản là một con đỉa có một cái vòi bám vào giai cấp vô sản ở chính quốc và một cái vòi khác bám vào giai cấp vô sản ở thuộc địa.","Nếu muốn giết con vật ấy, người ta phải đồng thời cắt cả hai vòi. Nếu người ta chỉ cắt một vòi thôi,","thì cái vòi còn lại kia vẫn tiếp tục hút máu của giai cấp vô sản, con vật vẫn tiếp tục sống và cái vòi bị cắt đứt lại sẽ mọc ra"],"dt":true,"tt":"t.2, tr.130","y":"Chương 3 · mục I.2.d — Cách mạng giải phóng dân tộc cần chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc"},{"id":"05-5c36a","cd":"05","st":85,"m":["Ngày mà hàng trăm triệu nhân dân châu Á bị tàn sát và áp bức thức tỉnh để gạt bỏ sự bóc lột đê tiện của một bọn thực dân lòng tham không đáy,","họ sẽ hình thành một lực lượng khổng lồ, và trong khi thủ tiêu một trong những điều kiện tồn tại của chủ nghĩa tư bản là chủ nghĩa đế quốc,","họ có thể giúp đỡ những người anh em mình ở phương Tây trong nhiệm vụ giải phóng hoàn toàn"],"dt":true,"tt":"t.1, tr.48","y":"Chương 3 · mục I.2.d — Cách mạng giải phóng dân tộc cần chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc"},{"id":"05-0b7d7","cd":"05","st":25,"m":["nọc độc và sức sống của con rắn độc tư bản chủ nghĩa","đang tập trung ở các thuộc địa hơn là ở chính quốc"],"dt":false,"tt":"t.1, tr.296","y":"Chương 3 · mục I.2.d — Cách mạng giải phóng dân tộc cần chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc"},{"id":"05-edeca","cd":"05","st":53,"m":["Hỡi anh em ở các thuộc địa!... Anh em phải làm thế nào để được giải phóng?","Vận dụng công thức của Các Mác, chúng tôi xin nói với anh em rằng,","công cuộc giải phóng anh em chỉ có thể thực hiện được bằng sự nỗ lực của bản thân anh em"],"dt":false,"tt":"t.2, tr.137-138","y":"Chương 3 · mục I.2.d — Cách mạng giải phóng dân tộc cần chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc"},{"id":"05-bbff3","cd":"05","st":37,"m":["Trong cuộc đấu tranh gian khổ chống kẻ thù của giai cấp và dân tộc,","cần dùng bạo lực cách mạng chống lại bạo lực phản cách mạng,","giành lấy chính quyền và bảo vệ chính quyền"],"dt":false,"tt":"t.15, tr.391","y":"Chương 3 · mục I.2.d — Cách mạng giải phóng dân tộc cần chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc"},{"id":"05-2801f","cd":"05","st":23,"m":["Chế độ thực dân, tự bản thân nó,","đã là một hành động bạo lực của kẻ mạnh đối với kẻ yếu rồi"],"dt":false,"tt":"t.1, tr.114","y":"Chương 3 · mục I.2.d — Cách mạng giải phóng dân tộc cần chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc"},{"id":"05-de0b9","cd":"05","st":43,"m":["Tùy tình hình cụ thể mà quyết định những hình thức đấu tranh cách mạng thích hợp,","sử dụng đúng và khéo kết hợp các hình thức đấu tranh vũ trang","và đấu tranh chính trị để giành thắng lợi cho cách mạng"],"dt":false,"tt":"t.15, tr.391","y":"Chương 3 · mục I.2.d — Cách mạng giải phóng dân tộc cần chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc"},{"id":"06-dbd0d","cd":"06","st":42,"m":["Nói một cách tóm tắt, mộc mạc,","chủ nghĩa xã hội trước hết nhằm làm cho nhân dân lao động thoát nạn bần cùng,","làm cho mọi người có công ăn việc làm, được ấm no và sống một đời hạnh phúc"],"dt":false,"tt":"t.12, tr.415","y":"Chương 3 · mục II.1.a — Quan niệm của Hồ Chí Minh về chủ nghĩa xã hội"},{"id":"06-584fd","cd":"06","st":141,"m":["Trong xã hội có giai cấp bóc lột thống trị, chỉ có lợi ích cá nhân của một số rất ít người thuộc giai cấp thống trị là được thỏa mãn, còn lợi ích cá nhân của quần chúng lao động thì bị giày xéo. Trái lại,","trong chế độ xã hội chủ nghĩa và cộng sản chủ nghĩa là chế độ do nhân dân lao động làm chủ, thì mỗi người là một bộ phận của tập thể, giữ một vị trí nhất định và đóng góp một phần công lao trong xã hội.","Cho nên lợi ích cá nhân là nằm trong lợi ích của tập thể, là một bộ phận của lợi ích tập thể. Lợi ích chung của tập thể được bảo đảm thì lợi ích riêng của cá nhân mới có điều kiện được thỏa mãn"],"dt":true,"tt":"t.11, tr.610","y":"Chương 3 · mục II.1.a — Quan niệm của Hồ Chí Minh về chủ nghĩa xã hội"},{"id":"06-0d2d9","cd":"06","st":128,"m":["Cách sản xuất và sức sản xuất phát triển và biến đổi mãi, do đó mà tư tưởng của người, chế độ xã hội, v.v., cũng phát triển và biến đổi. Chúng ta đều biết từ đời xưa đến đời nay,","cách sản xuất từ chỗ dùng cành cây, búa đá đã phát triển dần đến máy móc, sức điện, sức nguyên tử. Chế độ xã hội cũng phát triển từ cộng sản nguyên thủy đến chế độ nô lệ, đến chế độ phong kiến,","đến chế độ tư bản chủ nghĩa và ngày nay gần một nửa loài người đang tiến lên chế độ xã hội chủ nghĩa và chế độ cộng sản chủ nghĩa. Sự phát triển và tiến bộ đó không ai ngăn cản được"],"dt":true,"tt":"t.11, tr.600-601","y":"Chương 3 · mục II.1.b — Tiến lên chủ nghĩa xã hội là một tất yếu khách quan"},{"id":"06-ca245","cd":"06","st":35,"m":["chỉ ở trong chế độ xã hội chủ nghĩa","thì mỗi người mới có điều kiện để cải thiện đời sống riêng của mình,","phát huy tính cách riêng và sở trường riêng của mình"],"dt":false,"tt":"t.10, tr.390; t.11, tr.610","y":"Chương 3 · mục II.1.c — Một số đặc trưng cơ bản của xã hội xã hội chủ nghĩa"},{"id":"06-f96b3","cd":"06","st":74,"m":["Cần có sự lãnh đạo của một đảng cách mạng chân chính của giai cấp công nhân, toàn tâm toàn ý phục vụ nhân dân.","Chỉ có sự lãnh đạo của một đảng biết vận dụng một cách sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước mình","thì mới có thể đưa cách mạng giải phóng dân tộc và cách mạng xã hội chủ nghĩa đến thành công"],"dt":true,"tt":"t.15, tr.391","y":"Chương 3 · mục II.1.c — Một số đặc trưng cơ bản của xã hội xã hội chủ nghĩa"},{"id":"06-897e1","cd":"06","st":14,"m":["Chế độ ta là chế độ dân chủ.","Tức là nhân dân làm chủ"],"dt":false,"tt":"t.13, tr.10","y":"Chương 3 · mục II.2.a — Mục tiêu chủ nghĩa xã hội ở Việt Nam"},{"id":"06-ed990","cd":"06","st":16,"m":["Nước ta là nước dân chủ,","địa vị cao nhất là dân, vì dân là chủ"],"dt":false,"tt":"t.7, tr.434","y":"Chương 3 · mục II.2.a — Mục tiêu chủ nghĩa xã hội ở Việt Nam"},{"id":"06-091c2","cd":"06","st":64,"m":["kinh tế quốc doanh là hình thức sở hữu của toàn dân,","nó lãnh đạo nền kinh tế quốc dân và Nhà nước phải bảo đảm cho nó phát triển ưu tiên... Kinh tế hợp tác xã là hình thức sở hữu tập thể của nhân dân lao động;","Nhà nước đặc biệt khuyến khích, hướng dẫn và giúp đỡ cho nó phát triển"],"dt":true,"tt":"t.12, tr.372; t.12, tr.376; t.12, tr.373; t.12, tr.373","y":"Chương 3 · mục II.2.a — Mục tiêu chủ nghĩa xã hội ở Việt Nam"},{"id":"06-8dac8","cd":"06","st":8,"m":["Xã hội thế nào,","văn nghệ thế ấy"],"dt":false,"tt":"t.9, tr.231","y":"Chương 3 · mục II.2.a — Mục tiêu chủ nghĩa xã hội ở Việt Nam"},{"id":"06-64ff1","cd":"06","st":44,"m":["Muốn tiến lên chủ nghĩa xã hội phải phát triển kinh tế và văn hóa.","Vì sao không nói phát triển văn hóa và kinh tế? Tục ngữ ta có câu:","Có thực mới vực được đạo; vì thế kinh tế phải đi trước"],"dt":false,"tt":"t.12, tr.470","y":"Chương 3 · mục II.2.a — Mục tiêu chủ nghĩa xã hội ở Việt Nam"},{"id":"06-a2bd4","cd":"06","st":66,"m":["Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc. Đồng thời,","phát triển những truyền thống tốt đẹp của văn hóa dân tộc và hấp thụ những cái mới của văn hóa tiến bộ thế giới,","để xây dựng một nền văn hóa Việt Nam có tính chất dân tộc, khoa học và đại chúng"],"dt":true,"tt":"t.7, tr.40; t.7, tr.40","y":"Chương 3 · mục II.2.a — Mục tiêu chủ nghĩa xã hội ở Việt Nam"},{"id":"06-3ae55","cd":"06","st":9,"m":["phải đặt quyền lợi dân","lên trên hết thảy"],"dt":false,"tt":"t.4, tr.51; t.4, tr.21","y":"Chương 3 · mục II.2.b — Động lực của chủ nghĩa xã hội ở Việt Nam"},{"id":"06-bb862","cd":"06","st":10,"m":["địa vị cao nhất là dân,","vì dân là chủ"],"dt":false,"tt":"t.10, tr.457; t.11, tr.93","y":"Chương 3 · mục II.2.b — Động lực của chủ nghĩa xã hội ở Việt Nam"},{"id":"06-4e260","cd":"06","st":18,"m":["những con người của chủ nghĩa xã hội,","có tư tưởng và tác phong xã hội chủ nghĩa"],"dt":false,"tt":"t.13, tr.66; t.13, tr.66","y":"Chương 3 · mục II.2.b — Động lực của chủ nghĩa xã hội ở Việt Nam"},{"id":"06-d1942","cd":"06","st":38,"m":["đặc điểm to nhất của ta trong thời kỳ quá độ","là từ một nước nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội","không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa"],"dt":false,"tt":"t.12, tr.411","y":"Chương 3 · mục II.3.a — Tính chất, đặc điểm và nhiệm vụ của thời kỳ quá độ"},{"id":"06-7becc","cd":"06","st":15,"m":["học tập lập trường,","quan điểm và phương pháp của chủ nghĩa Mác - Lênin"],"dt":false,"tt":"t.11, tr.95","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"06-4136a","cd":"06","st":21,"m":["cụ thể hóa chủ nghĩa Mác - Lênin","cho thích hợp với điều kiện hoàn cảnh từng lúc và từng nơi"],"dt":false,"tt":"t.11, tr.95","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"06-db920","cd":"06","st":29,"m":["Toàn thể dân Việt Nam quyết đem tất cả tinh thần và lực lượng,","tính mệnh và của cải để giữ vững quyền tự do và độc lập ấy"],"dt":false,"tt":"t.4, tr.3","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"06-d00df","cd":"06","st":9,"m":["thống nhất, độc lập,","dân chủ và giàu mạnh"],"dt":false,"tt":"t.15, tr.624","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"06-7f119","cd":"06","st":22,"m":["Cách mạng Việt Nam là một bộ phận của lực lượng hòa bình dân chủ,","xã hội chủ nghĩa trên thế giới"],"dt":false,"tt":"t.12, tr.674","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"06-b6bb0","cd":"06","st":37,"m":["sự đoàn kết giữa lực lượng các nước xã hội chủ nghĩa","và sự đoàn kết nhất trí giữa các đảng cộng sản","và công nhân tất cả các nước có ý nghĩa quan trọng bậc nhất"],"dt":false,"tt":"t.12, tr.674","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"06-1dc02","cd":"06","st":35,"m":["Ta không thể giống Liên Xô, vì Liên Xô có phong tục tập quán khác,","có lịch sử địa lý khác...","ta có thể đi con đường khác để tiến lên chủ nghĩa xã hội"],"dt":false,"tt":"t.10, tr.391","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"06-b7dfe","cd":"06","st":59,"m":["Đối với kẻ địch, người cộng sản phải luôn luôn tỉnh táo, giữ vững lập trường,","quyết không được vì hoàn cảnh hòa bình mà mất cảnh giác. Phải luôn sẵn sàng đập tan mọi âm mưu độc ác của kẻ địch,","bảo vệ những thành quả của cách mạng, bảo vệ lao động hòa bình của nhân dân"],"dt":false,"tt":"t.13, tr.68","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"06-5a1fb","cd":"06","st":22,"m":["Nghe những lời bình luận không đúng, cũng làm thinh,","không biện bác... Ai nói sao, ai làm gì cũng mặc kệ"],"dt":false,"tt":"t.5, tr.298","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"06-982ab","cd":"06","st":23,"m":["phải thay đổi triệt để những nếp sống, thói quen,","ý nghĩ và thành kiến có gốc rễ sâu xa hàng ngàn năm"],"dt":false,"tt":"t.11, tr.92","y":"Chương 3 · mục II.3.b — Một số nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ"},{"id":"07-cd2e2","cd":"07","st":52,"m":["Trước hết phải có đảng cách mệnh, để trong thì vận động và tổ chức dân chúng,","ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp mọi nơi.","Đảng có vững, cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy"],"dt":false,"tt":"t.2, tr.289","y":"Chương 4 · mục I.1 — Tính tất yếu và vai trò lãnh đạo của Đảng Cộng sản Việt Nam"},{"id":"08-8eff8","cd":"08","st":8,"m":["Đảng ta là đạo đức,","là văn minh"],"dt":false,"tt":"t.12, tr.403","y":"Chương 4 · mục I.2.a — Đảng là đạo đức, là văn minh"},{"id":"08-70f7d","cd":"08","st":69,"m":["là đảng của giai cấp công nhân và nhân dân lao động, nghĩa là những người thợ thuyền,","dân cày và lao động trí óc kiên quyết nhất, hăng hái nhất, trong sạch nhất, tận tâm tận lực phụng sự Tổ quốc và nhân dân.","Những người mà: - Giàu sang không thể quyến rũ, - Nghèo khó không thể chuyển lay, - Uy lực không thể khuất phục"],"dt":true,"tt":"t.7, tr.50","y":"Chương 4 · mục I.2.a — Đảng là đạo đức, là văn minh"},{"id":"08-9ba51","cd":"08","st":50,"m":["Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng,","thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch,","phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân"],"dt":false,"tt":"t.15, tr.611-612","y":"Chương 4 · mục I.2.a — Đảng là đạo đức, là văn minh"},{"id":"08-be44c","cd":"08","st":15,"m":["sẵn sàng vui vẻ làm trâu ngựa,","làm tôi tớ trung thành của nhân dân"],"dt":false,"tt":"t.7, tr.50","y":"Chương 4 · mục I.2.a — Đảng là đạo đức, là văn minh"},{"id":"08-8ea23","cd":"08","st":51,"m":["Một dân tộc, một đảng và mỗi con người, ngày hôm qua là vĩ đại,","có sức hấp dẫn lớn, không nhất định hôm nay và ngày mai vẫn được mọi người yêu mến và ca ngợi,","nếu lòng dạ không trong sáng nữa, nếu sa vào chủ nghĩa cá nhân"],"dt":false,"tt":"t.15, tr.672","y":"Chương 4 · mục I.2.a — Đảng là đạo đức, là văn minh"},{"id":"08-83678","cd":"08","st":66,"m":["Đảng muốn vững thì phải có chủ nghĩa làm cốt, trong đảng ai cũng phải hiểu, ai cũng phải theo chủ nghĩa ấy.","Đảng mà không có chủ nghĩa cũng như người không có trí khôn, tàu không có bàn chỉ nam.","Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mệnh nhất là chủ nghĩa Lênin"],"dt":true,"tt":"t.2, tr.289","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-09753","cd":"08","st":43,"m":["Trong Đảng thực hành dân chủ rộng rãi,","thường xuyên và nghiêm chỉnh tự phê bình và phê bình là cách tốt nhất để củng cố sự đoàn kết và thống nhất trong Đảng.","Phải có tình đồng chí thương yêu lẫn nhau"],"dt":false,"tt":"t.15, tr.611","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-d4dc1","cd":"08","st":78,"m":["Đảng tổ chức rất nghiêm, khác với các đảng phái khác và các hội quần chúng. Trong Đảng chỉ kết nạp những phần tử hăng hái nhất,","cách mạng nhất. Đảng có những điều kiện kỷ luật bắt buộc mỗi đảng viên phải theo. Không có kỷ luật sắt không có Đảng.","Đã vào Đảng thì phải theo tư tưởng của Đảng. Đảng đã chỉ thị nghị quyết là phải làm. Không làm thì đuổi ra khỏi Đảng"],"dt":true,"tt":"t.6, tr.367","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-2f7d1","cd":"08","st":44,"m":["Đảng phải giữ kỷ luật rất nghiêm từ trên xuống dưới.","Kỷ luật này là tư tưởng phải nhất trí, hành động phải nhất trí.","Kỷ luật này là do lòng tự giác của đảng viên về nhiệm vụ của họ đối với Đảng"],"dt":false,"tt":"t.5, tr.290","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-cce9c","cd":"08","st":63,"m":["việc cần phải làm trước tiên là chỉnh đốn lại Đảng, làm cho mỗi đảng viên, mỗi đoàn viên,","mỗi chi bộ đều ra sức làm tròn nhiệm vụ đảng giao phó cho mình, toàn tâm toàn ý phục vụ nhân dân.","Làm được như vậy, thì dù công việc to lớn mấy, khó khăn mấy chúng ta cũng nhất định thắng lợi"],"dt":true,"tt":"t.15, tr.616","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-7a7fb","cd":"08","st":22,"m":["Đảng phải chọn lựa những người rất trung thành và rất hăng hái,","đoàn kết họ thành nhóm trung kiên lãnh đạo"],"dt":false,"tt":"t.15, tr.611","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-b76c6","cd":"08","st":13,"m":["Đảng phải luôn luôn tẩy bỏ","những phần tử hủ hóa ra ngoài"],"dt":false,"tt":"t.5, tr.290","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-8c2d0","cd":"08","st":101,"m":["Nhờ đoàn kết chặt chẽ, một lòng một dạ phục vụ giai cấp, phục vụ nhân dân, phục vụ Tổ quốc, cho nên từ ngày thành lập đến nay, Đảng ta đã đoàn kết,","tổ chức và lãnh đạo nhân dân ta hăng hái đấu tranh tiến từ thắng lợi này đến thắng lợi khác. Đoàn kết là một truyền thống cực kỳ quý báu của Đảng và của dân tộc ta.","Các đồng chí từ Trung ương đến các chi bộ cần phải giữ gìn sự đoàn kết nhất trí của Đảng như giữ gìn con ngươi của mắt mình"],"dt":true,"tt":"t.15, tr.616","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-962c0","cd":"08","st":13,"m":["không phải trên trời sa xuống.","Nó ở trong xã hội mà ra"],"dt":false,"tt":"t.5, tr.303","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-fd700","cd":"08","st":32,"m":["Đảng không phải là một tổ chức để làm quan phát tài.","Nó phải làm tròn nhiệm vụ giải phóng dân tộc,","làm cho Tổ quốc giàu mạnh, đồng bào sung sướng"],"dt":false,"tt":"t.5, tr.289","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-3454d","cd":"08","st":17,"m":["Ngoài lợi ích của dân tộc, của Tổ quốc,","thì Đảng không có lợi ích gì khác"],"dt":false,"tt":"t.5, tr.290","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-076ce","cd":"08","st":13,"m":["Đảng ta là một đảng cách mạng,","một đảng vì dân, vì nước"],"dt":false,"tt":"t.5, tr.294","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-65dbb","cd":"08","st":21,"m":["nếu nước độc lập mà dân không hưởng hạnh phúc tự do,","thì độc lập cũng chẳng có nghĩa lý gì"],"dt":false,"tt":"t.4, tr.64","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-09bdb","cd":"08","st":45,"m":["Chúng ta tranh được tự do, độc lập rồi mà dân cứ chết đói,","chết rét, thì tự do, độc lập cũng không làm gì. Dân chỉ biết rõ giá trị của tự do,","của độc lập khi mà dân được ăn no, mặc đủ"],"dt":false,"tt":"t.4, tr.175","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-d1193","cd":"08","st":30,"m":["Đảng không phải làm quan, sai khiến quần chúng mà phải làm đầy tớ cho quần chúng","và phải làm cho ra trò, nếu không quần chúng sẽ đá đít"],"dt":false,"tt":"t.6, tr.367","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-1331c","cd":"08","st":8,"m":["Tiếng dân chính","là truyền lại ý trời"],"dt":false,"tt":"t.1, tr.97","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-53564","cd":"08","st":39,"m":["vì đồng bào ủy thác thì tôi phải gắng sức làm,","cũng như một người lính vâng mệnh lệnh của quốc dân ra trước mặt trận.","Bao giờ đồng bào cho tôi lui, thì tôi rất vui lòng lui"],"dt":false,"tt":"t.4, tr.187","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-d70dd","cd":"08","st":23,"m":["cách xa dân chúng, không liên hệ chặt chẽ với dân chúng,","cũng như đứng lơ lửng giữa trời, nhất định thất bại"],"dt":false,"tt":"t.5, tr.326","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-6526c","cd":"08","st":10,"m":["học hỏi quần chúng nhưng","không theo đuôi quần chúng"],"dt":false,"tt":"t.5, tr.333","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-b4c29","cd":"08","st":41,"m":["sẽ ra sức hoạt động,","góp phần đắc lực vào việc khôi phục lại khối đoàn kết giữa các đảng anh em trên nền tảng chủ nghĩa Mác - Lênin","và chủ nghĩa quốc tế vô sản, có lý có tình"],"dt":false,"tt":"t.15, tr.613","y":"Chương 4 · mục I.2.b — Những vấn đề nguyên tắc trong hoạt động của Đảng"},{"id":"08-7bb94","cd":"08","st":102,"m":["đặt lợi ích của Đảng lên trên hết, lên trước hết. Vì lợi ích của Đảng tức là lợi ích của dân tộc, của Tổ quốc. Vô luận lúc nào, vô luận việc gì,","đảng viên và cán bộ phải đặt lợi ích của Đảng ra trước, lợi ích của cá nhân lại sau... Nếu gặp khi lợi ích chung của Đảng mâu thuẫn với lợi ích riêng của cá nhân,","thì phải kiên quyết hy sinh lợi ích của cá nhân cho lợi ích của Đảng. Khi cần đến tính mệnh của mình cũng phải vui lòng hy sinh cho Đảng"],"dt":true,"tt":"t.5, tr.290-291","y":"Chương 4 · mục I.2.c — Xây dựng đội ngũ cán bộ, đảng viên"},{"id":"08-aad36","cd":"08","st":35,"m":["mỗi kẻ địch bên trong là một bạn đồng minh của kẻ địch bên ngoài.","Địch bên ngoài không đáng sợ.","Địch bên trong đáng sợ hơn, vì nó phá hoại từ trong phá ra"],"dt":false,"tt":"t.5, tr.278","y":"Chương 4 · mục I.2.c — Xây dựng đội ngũ cán bộ, đảng viên"},{"id":"08-2f35c","cd":"08","st":64,"m":["Chúng ta không sợ sai lầm, nhưng đã nhận biết sai lầm thì phải ra sức sửa chữa. Vậy nên,","ai không phạm những lầm lỗi... thì nên chú ý tránh đi, và gắng sức cho thêm tiến bộ. Ai đã phạm những lầm lỗi...","thì phải hết sức sửa chữa... Chúng ta phải ghi sâu những chữ “công bình, chính trực” vào lòng"],"dt":true,"tt":"t.4, tr.66","y":"Chương 4 · mục I.2.c — Xây dựng đội ngũ cán bộ, đảng viên"},{"id":"08-63aa4","cd":"08","st":36,"m":["Đảng không che giấu những khuyết điểm của mình, không sợ phê bình.","Đảng phải nhận khuyết điểm của mình mà tự sửa chữa,","để tiến bộ, và để dạy bảo cán bộ và đảng viên"],"dt":false,"tt":"t.5, tr.290","y":"Chương 4 · mục I.2.c — Xây dựng đội ngũ cán bộ, đảng viên"},{"id":"08-f7eff","cd":"08","st":16,"m":["còn một số ít cán bộ,","đảng viên mà đạo đức, phẩm chất còn thấp kém"],"dt":false,"tt":"t.15, tr.546","y":"Chương 4 · mục I.2.c — Xây dựng đội ngũ cán bộ, đảng viên"},{"id":"08-9d51c","cd":"08","st":106,"m":["Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần, kiệm, liêm, chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch,","phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân. Đoàn viên và thanh niên ta nói chung là tốt, mọi việc đều hăng hái xung phong, không ngại khó khăn,","có chí tiến thủ. Đảng cần phải chăm lo giáo dục đạo đức cách mạng cho họ, đào tạo họ thành những người thừa kế xây dựng chủ nghĩa xã hội vừa “hồng” vừa “chuyên”"],"dt":true,"tt":"t.15, tr.611-612","y":"Chương 4 · mục I.2.c — Xây dựng đội ngũ cán bộ, đảng viên"},{"id":"08-a91d4","cd":"08","st":46,"m":["Cán bộ là những người đem chính sách của Đảng,","của Chính phủ giải thích cho dân chúng hiểu rõ và thi hành. Đồng thời đem tình hình của dân chúng báo cáo cho Đảng,","cho Chính phủ hiểu rõ, để đặt chính sách cho đúng"],"dt":false,"tt":"t.5, tr.309","y":"Chương 4 · mục I.2.c — Xây dựng đội ngũ cán bộ, đảng viên"},{"id":"08-21579","cd":"08","st":14,"m":["muôn việc thành công hoặc thất bại,","đều do cán bộ tốt hoặc kém"],"dt":false,"tt":"t.5, tr.280","y":"Chương 4 · mục I.2.c — Xây dựng đội ngũ cán bộ, đảng viên"},{"id":"09-fd7e6","cd":"09","st":21,"m":["Trong nước Việt Nam Dân chủ Cộng hòa của chúng ta,","tất cả mọi quyền lực đều là của nhân dân"],"dt":false,"tt":"t.8, tr.262","y":"Chương 4 · mục II.1.b — Nhà nước của nhân dân"},{"id":"09-b2615","cd":"09","st":21,"m":["đều là công bộc của dân, nghĩa là để gánh việc chung cho dân,","chứ không phải để đè đầu dân"],"dt":false,"tt":"t.4, tr.64-65","y":"Chương 4 · mục II.1.b — Nhà nước của nhân dân"},{"id":"09-07c46","cd":"09","st":34,"m":["Dân làm chủ thì Chủ tịch, bộ trưởng, thứ trưởng,","ủy viên này khác là làm gì? Làm đầy tớ.","Làm đầy tớ cho nhân dân, chứ không phải là làm quan cách mạng"],"dt":false,"tt":"t.10, tr.572","y":"Chương 4 · mục II.1.b — Nhà nước của nhân dân"},{"id":"09-f61eb","cd":"09","st":30,"m":["mong đồng bào giúp đỡ, đôn đốc, kiểm soát và phê bình để làm trọn nhiệm vụ của mình là:","người đầy tớ trung thành tận tụy của nhân dân"],"dt":false,"tt":"t.9, tr.81","y":"Chương 4 · mục II.1.b — Nhà nước của nhân dân"},{"id":"09-e6a02","cd":"09","st":34,"m":["nhân dân có quyền bãi miễn đại biểu Quốc hội","và đại biểu Hội đồng nhân dân nếu những đại biểu ấy tỏ ra","không xứng đáng với sự tín nhiệm của nhân dân"],"dt":false,"tt":"t.12, tr.375","y":"Chương 4 · mục II.1.b — Nhà nước của nhân dân"},{"id":"09-a6f7a","cd":"09","st":13,"m":["nếu Chính phủ làm hại dân","thì dân có quyền đuổi Chính phủ"],"dt":false,"tt":"t.5, tr.75","y":"Chương 4 · mục II.1.b — Nhà nước của nhân dân"},{"id":"09-40693","cd":"09","st":39,"m":["Nước ta là nước dân chủ, nghĩa là nước nhà do nhân dân làm chủ.","Nhân dân có quyền lợi làm chủ,","thì phải có nghĩa vụ làm tròn bổn phận công dân, giữ đúng đạo đức công dân"],"dt":false,"tt":"t.9, tr.258","y":"Chương 4 · mục II.1.c — Nhà nước do nhân dân"},{"id":"09-3f06d","cd":"09","st":22,"m":["Chúng ta là những người lao động làm chủ nước nhà.","Muốn làm chủ được tốt, phải có năng lực làm chủ"],"dt":false,"tt":"t.12, tr.527","y":"Chương 4 · mục II.1.c — Nhà nước do nhân dân"},{"id":"09-a4bc3","cd":"09","st":59,"m":["Các công việc của Chính phủ làm phải nhằm vào một mục đích duy nhất là mưu tự do hạnh phúc cho mọi người.","Cho nên Chính phủ nhân dân bao giờ cũng phải đặt quyền lợi dân lên trên hết thảy.","Việc gì có lợi cho dân thì làm. Việc gì có hại cho dân thì phải tránh"],"dt":false,"tt":"t.4, tr.21","y":"Chương 4 · mục II.1.d — Nhà nước vì nhân dân"},{"id":"09-d1780","cd":"09","st":31,"m":["muốn được dân yêu, muốn được lòng dân,","trước hết phải yêu dân, phải đặt quyền lợi của dân trên hết thảy,","phải có một tinh thần chí công vô tư"],"dt":false,"tt":"t.4, tr.52","y":"Chương 4 · mục II.1.d — Nhà nước vì nhân dân"},{"id":"09-4aa6a","cd":"09","st":25,"m":["chẳng những làm những việc trực tiếp lợi cho dân,","mà cũng có khi làm những việc mới xem qua như là hại đến dân"],"dt":false,"tt":"t.5, tr.285","y":"Chương 4 · mục II.1.d — Nhà nước vì nhân dân"},{"id":"10-58065","cd":"10","st":72,"m":["Cải cách nền pháp lý ở Đông Dương bằng cách cho người bản xứ cũng được quyền hưởng những đảm bảo về mặt pháp luật như người Âu châu;","xóa bỏ hoàn toàn các tòa án đặc biệt dùng làm công cụ để khủng bố và áp bức bộ phận trung thực nhất trong nhân dân An Nam...","Thay chế độ ra các sắc lệnh bằng chế độ ra các đạo luật"],"dt":true,"tt":"t.1, tr.469","y":"Chương 4 · mục II.2.a — Nhà nước hợp hiến, hợp pháp"},{"id":"10-3477b","cd":"10","st":31,"m":["Chúng ta phải có một hiến pháp dân chủ.","Tôi đề nghị Chính phủ tổ chức càng sớm càng","hay cuộc TỔNG TUYỂN CỬ với chế độ phổ thông đầu phiếu"],"dt":false,"tt":"t.4, tr.7","y":"Chương 4 · mục II.2.a — Nhà nước hợp hiến, hợp pháp"},{"id":"10-76766","cd":"10","st":21,"m":["làm sao cho nhân dân biết hưởng quyền dân chủ,","biết dùng quyền dân chủ của mình, dám nói, dám làm"],"dt":false,"tt":"t.15, tr.293","y":"Chương 4 · mục II.2.b — Nhà nước thượng tôn pháp luật"},{"id":"10-9444a","cd":"10","st":32,"m":["Pháp luật Việt Nam tuy khoan hồng với những người biết cải tà quy chính,","nhưng sẽ thẳng tay trừng trị","những tên Việt gian đầu sỏ đã bán nước buôn dân"],"dt":false,"tt":"t.6, tr.49","y":"Chương 4 · mục II.2.b — Nhà nước thượng tôn pháp luật"},{"id":"10-a962d","cd":"10","st":10,"m":["thưởng có khi quá rộng,","mà phạt thì không nghiêm"],"dt":false,"tt":"t.15, tr.225","y":"Chương 4 · mục II.2.b — Nhà nước thượng tôn pháp luật"},{"id":"10-bb3cb","cd":"10","st":35,"m":["Các bạn là những người phụ trách thi hành pháp luật.","Lẽ tất nhiên các bạn cần phải nêu cao cái gương “phụng công,","thủ pháp, chí công vô tư” cho nhân dân noi theo"],"dt":false,"tt":"t.5, tr.473","y":"Chương 4 · mục II.2.b — Nhà nước thượng tôn pháp luật"},{"id":"10-b7387","cd":"10","st":33,"m":["Chính phủ Việt Nam sẽ tha thứ","hay trừng trị họ theo luật pháp tùy theo thái độ của họ hiện nay và về sau.","Nhưng sẽ không có ai bị tàn sát"],"dt":false,"tt":"t.6, tr.437","y":"Chương 4 · mục II.2.c — Pháp quyền nhân nghĩa"},{"id":"10-19031","cd":"10","st":44,"m":["Dân ghét các ông chủ tịch, các ông ủy viên vì cái tật ngông nghênh,","cậy thế, cậy quyền. Những ông này không hiểu nhiệm vụ và chính sách của Việt Minh,","nên khi nắm được chút quyền trong tay vẫn hay lạm dụng"],"dt":false,"tt":"t.4, tr.51","y":"Chương 4 · mục II.3.a — Kiểm soát quyền lực nhà nước"},{"id":"10-56648","cd":"10","st":86,"m":["Công việc của Đảng và Nhà nước ngày càng nhiều. Muốn hoàn thành tốt mọi việc, thì toàn thể đảng viên và cán bộ phải chấp hành nghiêm chỉnh đường lối và chính sách của Đảng.","Và muốn như vậy, thì các cấp ủy đảng phải tăng cường công tác kiểm tra.","Vì kiểm tra có tác dụng thúc đẩy và giáo dục đảng viên và cán bộ làm trọn nhiệm vụ đối với Đảng, đối với Nhà nước, làm gương mẫu tốt cho nhân dân"],"dt":true,"tt":"t.14, tr.362","y":"Chương 4 · mục II.3.a — Kiểm soát quyền lực nhà nước"},{"id":"10-ef4c6","cd":"10","st":20,"m":["Phải tổ chức sự kiểm soát,","mà muốn kiểm soát đúng thì cũng phải có quần chúng giúp mới được"],"dt":false,"tt":"t.5, tr.325","y":"Chương 4 · mục II.3.a — Kiểm soát quyền lực nhà nước"},{"id":"10-b7cb9","cd":"10","st":18,"m":["mọi công tác phải dựa hẳn vào quần chúng,","hoan nghênh quần chúng đôn đốc và kiểm tra"],"dt":false,"tt":"t.8, tr.507","y":"Chương 4 · mục II.3.a — Kiểm soát quyền lực nhà nước"},{"id":"10-c9bc2","cd":"10","st":13,"m":["lấy của công dùng vào việc tư,","quên cả thanh liêm, đạo đức"],"dt":false,"tt":"t.4, tr.65","y":"Chương 4 · mục II.3.b — Phòng, chống tiêu cực trong Nhà nước"},{"id":"10-5a712","cd":"10","st":36,"m":["Tham ô, lãng phí và bệnh quan liêu, dù cố ý hay không,","cũng là bạn đồng minh của thực dân và phong kiến...","Tội lỗi ấy cũng nặng như tội lỗi Việt gian, mật thám"],"dt":false,"tt":"t.7, tr.357-358","y":"Chương 4 · mục II.3.b — Phòng, chống tiêu cực trong Nhà nước"},{"id":"10-5176d","cd":"10","st":44,"m":["Cán bộ các cơ quan, các đoàn thể, cấp cao thì quyền to,","cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu lương tâm là có dịp đục khoét,","có dịp ăn của đút, có dịp “dĩ công vi tư”"],"dt":false,"tt":"t.6, tr.127","y":"Chương 4 · mục II.3.b — Phòng, chống tiêu cực trong Nhà nước"},{"id":"11-461d6","cd":"11","st":39,"m":["Sử dạy cho ta bài học này:","Lúc nào dân ta đoàn kết muôn người như một thì nước ta độc lập, tự do.","Trái lại lúc nào dân ta không đoàn kết thì bị nước ngoài xâm lấn"],"dt":false,"tt":"t.3, tr.256","y":"Chương 5 · mục I.1.a — Đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng"},{"id":"11-52698","cd":"11","st":8,"m":["Đoàn kết là sức mạnh","của chúng ta"],"dt":false,"tt":"t.9, tr.145","y":"Chương 5 · mục I.1.a — Đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng"},{"id":"11-2fb03","cd":"11","st":20,"m":["Đoàn kết là một lực lượng vô địch của chúng ta","để khắc phục khó khăn, giành lấy thắng lợi"],"dt":false,"tt":"t.9, tr.177","y":"Chương 5 · mục I.1.a — Đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng"},{"id":"11-5f796","cd":"11","st":10,"m":["Đoàn kết là sức mạnh,","đoàn kết là thắng lợi"],"dt":false,"tt":"t.14, tr.27","y":"Chương 5 · mục I.1.a — Đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng"},{"id":"11-fe9a9","cd":"11","st":11,"m":["Đoàn kết là sức mạnh,","là then chốt của thành công"],"dt":false,"tt":"t.14, tr.186","y":"Chương 5 · mục I.1.a — Đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng"},{"id":"11-18a03","cd":"11","st":29,"m":["Bây giờ còn một điểm rất quan trọng, cũng là điểm mẹ.","Điểm này mà thực hiện tốt thì đẻ ra con cháu đều tốt: Đó là đoàn kết"],"dt":false,"tt":"t.10, tr.589","y":"Chương 5 · mục I.1.a — Đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng"},{"id":"11-8344f","cd":"11","st":14,"m":["Đoàn kết, đoàn kết, đại đoàn kết Thành công,","thành công, đại thành công"],"dt":false,"tt":"t.13, tr.119","y":"Chương 5 · mục I.1.a — Đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng"},{"id":"11-11785","cd":"11","st":23,"m":["Mục đích của Đảng Lao động Việt Nam có thể gồm trong 8 chữ là:","ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC"],"dt":false,"tt":"t.7, tr.49","y":"Chương 5 · mục I.1.b — Đại đoàn kết toàn dân tộc là một mục tiêu, nhiệm vụ hàng đầu của cách mạng Việt Nam"},{"id":"11-9cc78","cd":"11","st":24,"m":["ai có tài, có đức, có sức, có lòng phụng sự Tổ quốc","và phục vụ nhân dân thì ta đoàn kết với họ"],"dt":false,"tt":"t.9, tr.244","y":"Chương 5 · mục I.2.a — Chủ thể của khối đại đoàn kết toàn dân tộc"},{"id":"11-896ab","cd":"11","st":70,"m":["Đại đoàn kết tức là trước hết phải đoàn kết đại đa số nhân dân, mà đại đa số nhân dân là công nhân,","nông dân và các tầng lớp nhân dân lao động khác. Đó là nền gốc của đại đoàn kết. Nó cũng như cái nền của nhà,","gốc của cây. Nhưng đã có nền vững, gốc tốt, còn phải đoàn kết các tầng lớp nhân dân khác"],"dt":true,"tt":"t.9, tr.244","y":"Chương 5 · mục I.2.b — Nền tảng của khối đại đoàn kết toàn dân tộc"},{"id":"12-62c51","cd":"12","st":29,"m":["Lực lượng chủ yếu trong khối đoàn kết dân tộc là công nông,","cho nên liên minh công nông là nền tảng của Mặt trận dân tộc thống nhất"],"dt":false,"tt":"t.12, tr.417","y":"Chương 5 · mục I.4.b — Nguyên tắc xây dựng và hoạt động của Mặt trận dân tộc thống nhất"},{"id":"12-d4383","cd":"12","st":51,"m":["vì họ là người trực tiếp sản xuất tất cả mọi tài phú làm cho xã hội sống.","Vì họ đông hơn hết, mà cũng bị áp bức bóc lột nặng nề hơn hết.","Vì chí khí cách mạng của họ chắc chắn, bền bỉ hơn của mọi tầng lớp khác"],"dt":false,"tt":"t.10, tr.376","y":"Chương 5 · mục I.4.b — Nguyên tắc xây dựng và hoạt động của Mặt trận dân tộc thống nhất"},{"id":"12-44d09","cd":"12","st":55,"m":["Đoàn kết thực sự nghĩa là mục đích phải nhất trí và lập trường cũng phải nhất trí.","Đoàn kết thực sự nghĩa là vừa đoàn kết, vừa đấu tranh, học những cái tốt của nhau,","phê bình những cái sai của nhau và phê bình trên lập trường thân ái, vì nước, vì dân"],"dt":false,"tt":"t.11, tr.362","y":"Chương 5 · mục I.4.b — Nguyên tắc xây dựng và hoạt động của Mặt trận dân tộc thống nhất"},{"id":"12-66b3f","cd":"12","st":25,"m":["cán phải chịu khó tìm đủ cách giải thích cho họ hiểu rằng:","những việc đó là vì ích lợi của họ mà phải làm"],"dt":false,"tt":"t.5, tr.286","y":"Chương 5 · mục I.5 — Phương thức xây dựng khối đại đoàn kết dân tộc"},{"id":"12-ea625","cd":"12","st":27,"m":["Những đoàn thể ấy là tổ chức của dân, phấn đấu cho dân,","bênh vực quyền của dân, liên lạc mật thiết nhân dân với Chính phủ"],"dt":false,"tt":"t.6, tr.397","y":"Chương 5 · mục I.5 — Phương thức xây dựng khối đại đoàn kết dân tộc"},{"id":"12-eb8ed","cd":"12","st":14,"m":["Đoàn kết, đoàn kết, đại đoàn kết/ Thành công,","thành công, đại thành công!"],"dt":false,"tt":"t.13, tr.119","y":"Chương 5 · mục I.5 — Phương thức xây dựng khối đại đoàn kết dân tộc"},{"id":"12-148de","cd":"12","st":97,"m":["Mặt trận dân tộc thống nhất vẫn là một trong những lực lượng to lớn của cách mạng Việt Nam... Phải đoàn kết tốt các đảng phái, các đoàn thể,","các nhân sĩ trong Mặt trận Tổ quốc Việt Nam, thực hiện hợp tác lâu dài, giúp đỡ lẫn nhau, cùng nhau tiến bộ. Phải đoàn kết các dân tộc anh em,","cùng nhau xây dựng Tổ quốc... Phải đoàn kết chặt chẽ giữa đồng bào lương và đồng bào các tôn giáo, cùng nhau xây dựng đời sống hòa thuận ấm no, xây dựng Tổ quốc"],"dt":true,"tt":"t.13, tr.453-454","y":"Chương 5 · mục I.5 — Phương thức xây dựng khối đại đoàn kết dân tộc"},{"id":"14-eae65","cd":"14","st":90,"m":["Cũng như sông thì có nguồn mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức,","không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân. Vì muốn giải phóng cho dân tộc,","giải phóng cho loài người là một công việc to tát, mà tự mình không có đạo đức, không có căn bản, tự mình đã hủ hóa, xấu xa thì còn làm nổi việc gì?"],"dt":true,"tt":"t.5, tr.292-293","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"14-a3ddc","cd":"14","st":74,"m":["Làm cách mạng để cải tạo xã hội cũ thành xã hội mới là một sự nghiệp rất vẻ vang,","nhưng nó cũng là một nhiệm vụ rất nặng nề, một cuộc đấu tranh rất phức tạp, lâu dài, gian khổ. Sức có mạnh mới gánh được nặng và đi được xa.","Người cách mạng phải có đạo đức cách mạng làm nền tảng, mới hoàn thành được nhiệm vụ cách mạng vẻ vang"],"dt":true,"tt":"t.11, tr.601","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"14-15472","cd":"14","st":32,"m":["Trước mặt quần chúng,","không phải ta cứ viết lên trán chữ “cộng sản” mà ta được họ yêu mến.","Quần chúng chỉ quý mến những người có tư cách, đạo đức"],"dt":false,"tt":"t.6, tr.16","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"14-808c0","cd":"14","st":33,"m":["Người cán bộ cách mạng phải có đạo đức cách mạng...","Mọi việc thành hay là bại,","chủ chốt là do cán bộ có thấm nhuần đạo đức cách mạng, hay là không"],"dt":false,"tt":"t.9, tr.354","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"14-cdc4d","cd":"14","st":63,"m":["Đại đa số chiến sĩ cách mạng là người có đạo đức: Cả đời hết lòng hết sức phục vụ nhân dân,","sinh hoạt ngày thường thì làm gương mẫu; gian khổ, chất phác, kính trọng của công...","Đạo đức ấy có ảnh hưởng lớn đến sự nghiệp đổi xã hội cũ thành xã hội mới và xây dựng mỹ tục thuần phong"],"dt":true,"tt":"t.11, tr.602-603","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"14-ee7d0","cd":"14","st":40,"m":["Có đạo đức cách mạng thì khi gặp khó khăn, gian khổ, thất bại,","cũng không sợ sệt, rụt rè, lùi bước...","khi gặp thuận lợi và thành công vẫn giữ vững tinh thần gian khổ, chất phác, khiêm tốn"],"dt":false,"tt":"t.9, tr.354","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"14-4fb20","cd":"14","st":132,"m":["Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo,","là người đầy tớ thật trung thành của nhân dân. ĐOÀN VIÊN VÀ THANH NIÊN ta nói chung là tốt, mọi việc đều hăng hái xung phong, không ngại khó khăn, có chí tiến thủ.","Đảng cần phải chăm lo giáo dục đạo đức cách mạng cho họ, đào tạo họ thành những người thừa kế xây dựng chủ nghĩa xã hội vừa “hồng” vừa “chuyên”. Bồi dưỡng thế hệ cách mạng cho đời sau là một việc rất quan trọng và rất cần thiết"],"dt":true,"tt":"t.15, tr.622","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"14-937c5","cd":"14","st":50,"m":["Phải lấy kết quả thiết thực đã góp sức bao nhiêu cho sản xuất và lãnh đạo sản xuất","mà đo ý chí cách mạng của mình. Hãy kiên quyết chống bệnh nói suông,","thói phô trương hình thức, lối làm việc không nhằm mục đích nâng cao sản xuất"],"dt":false,"tt":"t.13, tr.68","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"14-daea4","cd":"14","st":38,"m":["Dạy cũng như học phải biết chú trọng cả tài lẫn đức.","Đức là đạo đức cách mạng. Đó là cái gốc, rất quan trọng.","Nếu không có đạo đức cách mạng thì có tài cũng vô dụng"],"dt":false,"tt":"t.14, tr.400","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"14-ea20a","cd":"14","st":30,"m":["Tuy năng lực và công việc của mỗi người khác nhau, người làm việc to,","người làm việc nhỏ; nhưng ai giữ được đạo đức đều là người cao thượng"],"dt":false,"tt":"t.9, tr.508","y":"Chương 6 · mục II.1 — Đạo đức là gốc, là nền tảng tinh thần của xã hội, của người cách mạng"},{"id":"13-134ee","cd":"13","st":29,"m":["Đạo đức cũ như người đầu ngược xuống đất chân chổng lên trời.","Đạo đức mới như người hai chân đứng vững được dưới đất, đầu ngẩng lên trời"],"dt":false,"tt":"t.7, tr.220","y":"Chương 6 · mục II.2.a — Trung với nước, hiếu với dân"},{"id":"13-40f73","cd":"13","st":35,"m":["Đạo đức, ngày trước thì chỉ trung với vua, hiếu với cha mẹ.","Ngày nay, thời đại mới, đạo đức cũng phải mới.","Phải trung với nước. Phải hiếu với toàn dân, với đồng bào"],"dt":false,"tt":"t.4, tr.170","y":"Chương 6 · mục II.2.a — Trung với nước, hiếu với dân"},{"id":"13-18bf1","cd":"13","st":26,"m":["Bao nhiêu lợi ích đều vì dân. Bao nhiêu quyền hạn đều của dân...","Nói tóm lại, quyền hành và lực lượng đều ở nơi dân"],"dt":false,"tt":"t.6, tr.232","y":"Chương 6 · mục II.2.a — Trung với nước, hiếu với dân"},{"id":"13-4d857","cd":"13","st":33,"m":["Phải luôn luôn nâng cao chí khí cách mạng “trung với nước,","hiếu với dân, nhiệm vụ nào cũng hoàn thành,","khó khăn nào cũng vượt qua, kẻ thù nào cũng đánh thắng”"],"dt":false,"tt":"t.14, tr.619","y":"Chương 6 · mục II.2.a — Trung với nước, hiếu với dân"},{"id":"13-56829","cd":"13","st":37,"m":["hết lòng hết sức phục vụ nhân dân. Phải yêu kính nhân dân.","Phải thật sự tôn trọng quyền làm chủ của nhân dân.","Tuyệt đối không được lên mặt “quan cách mạng” ra lệnh ra oai"],"dt":false,"tt":"t.13, tr.67","y":"Chương 6 · mục II.2.a — Trung với nước, hiếu với dân"},{"id":"13-7e788","cd":"13","st":57,"m":["Bọn phong kiến ngày xưa nêu ra cần, kiệm, liêm, chính,","nhưng không bao giờ làm mà lại bắt nhân dân phải tuân theo để phụng sự quyền lợi cho chúng. Ngày nay ta đề ra cần, kiệm,","liêm, chính cho cán bộ thực hiện làm gương cho nhân dân theo để lợi cho nước cho dân"],"dt":false,"tt":"t.7, tr.220","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-c6cb0","cd":"13","st":29,"m":["Cần tức là siêng năng, chăm chỉ, cố gắng dẻo dai...","Muốn cho chữ Cần có nhiều kết quả hơn, thì phải có kế hoạch cho mọi công việc"],"dt":false,"tt":"t.6, tr.118","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-92743","cd":"13","st":16,"m":["Lao động là nghĩa vụ thiêng liêng,","là nguồn sống, nguồn hạnh phúc của chúng ta"],"dt":false,"tt":"t.6, tr.122","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-a3bf1","cd":"13","st":30,"m":["Kiệm là thế nào? Là tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi.","CẦN với KIỆM phải đi đôi với nhau, như hai chân của con người"],"dt":false,"tt":"t.6, tr.123","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-eea34","cd":"13","st":74,"m":["Tiết kiệm không phải là bủn xỉn. Khi không nên tiêu xài thì một đồng xu cũng không nên tiêu. Khi có việc đáng làm,","việc ích lợi cho đồng bào, cho Tổ quốc, thì dù bao nhiêu công, tốn bao nhiêu của, cũng vui lòng. Như thế mới đúng là kiệm.","Việc đáng tiêu mà không tiêu, là bủn xỉn, chứ không phải là kiệm. Tiết kiệm phải kiên quyết không xa xỉ"],"dt":true,"tt":"t.6, tr.123","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-f589f","cd":"13","st":28,"m":["là trong sạch, không tham lam... Chữ LIÊM phải đi đôi với chữ KIỆM.","Cũng như chữ KIỆM phải đi với chữ CẦN. Có KIỆM mới LIÊM được"],"dt":false,"tt":"t.6, tr.126","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-8cd11","cd":"13","st":45,"m":["Liêm là không tham địa vị. Không tham tiền tài. Không tham sung sướng.","Không ham người tâng bốc mình. Vì vậy mà quang minh chính đại, không bao giờ hủ hóa.","Chỉ có một thứ ham là ham học, ham làm, ham tiến bộ"],"dt":false,"tt":"t.5, tr.292","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-ee688","cd":"13","st":21,"m":["Chính nghĩa là không tà, nghĩa là thẳng thắn, đứng đắn.","Điều gì không đứng đắn, thẳng thắn, tức là tà"],"dt":false,"tt":"t.6, tr.129","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-c1217","cd":"13","st":67,"m":["ĐỐI VỚI MÌNH - Chớ tự kiêu, tự đại... ĐỐI VỚI NGƯỜI... Chớ nịnh hót người trên. Chớ xem khinh người dưới.","Thái độ phải chân thành, khiêm tốn... Phải thực hành chữ Bác - Ái... ĐỐI VỚI VIỆC... Phải để công việc nước lên trên,","trước việc tư, việc nhà... việc thiện thì dù nhỏ mấy cũng làm. Việc ác thì dù nhỏ mấy cũng tránh"],"dt":true,"tt":"t.6, tr.129-131","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-c776f","cd":"13","st":20,"m":["khi làm bất cứ việc gì cũng đừng nghĩ đến mình trước...,","khi hưởng thụ thì mình nên đi sau"],"dt":false,"tt":"t.5, tr.217","y":"Chương 6 · mục II.2.b — Cần, kiệm, liêm, chính, chí công vô tư"},{"id":"13-4f67a","cd":"13","st":63,"m":["Trước nhất là cán bộ các cơ quan, các đoàn thể, cấp cao thì quyền to, cấp thấp thì quyền nhỏ.","Dù to hay nhỏ, có quyền mà thiếu lương tâm là có dịp đ /* màu nhóm nổi trên nền hồ xanh thẫm (không dùng xanh lá: chìm vào nước và lá sen) */
const MAU = ["#E2483D", "#3A8DEB", "#F0B429", "#9B6BD6", "#E86FA6", "#2BB3A6", "#F07A2A", "#8BD3F7", "#C7E36B", "#F2EEE3"];
const mauNhom = n => MAU[(Math.max(1, n) - 1) % MAU.length];

/* ============================================================
   TIỆN ÍCH
   ============================================================ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const QS = new URLSearchParams(location.search);
const CHI_BC = QS.get("noi") === "bc";
const THU = QS.has("thu");
const xao = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const luu = (k, v) => { if(THU) return; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const lay = k => { if(THU) return null; try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
const bo = k => { try{ localStorage.removeItem(k); }catch(e){} };
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const giay = ms => { if(ms == null) return "—"; const d = Math.max(0, Math.round(ms / 100)); return String(Math.floor(d / 600)).padStart(2, "0") + ":" + String(Math.floor(d / 10) % 60).padStart(2, "0") + "," + d % 10; };
let hBao = 0;
function bao(t, ms = 2600){ const e = $("#bao"); e.textContent = t; e.hidden = false; clearTimeout(hBao); hBao = setTimeout(() => e.hidden = true, ms); }

/* hình vẽ hồ sen: lá sen tách đôi (biểu tượng), lá sen có khía, hoa sen, lá chia mảnh */
