  <g fill="#FAD3E2" stroke="#D97399" stroke-width="1.2">${[22, 94, 166, 238, 310].map(g => `<ellipse cx="50" cy="34" rx="9" ry="16" transform="rotate(${g} 50 50)"/>`).join("")}</g>
  <circle cx="50" cy="50" r="9" fill="#F2C94C" stroke="#B88A12" stroke-width="1.5"/></svg>`;
/* lá sen chia n phần, phần thứ i (mảnh của mình) tô xanh */
function laManh(n, i){
  const d = a => [22 + 20 * Math.cos(a * Math.PI / 180), 22 + 20 * Math.sin(a * Math.PI / 180)].map(x => x.toFixed(2)).join(" ");
  return `<svg viewBox="0 0 44 44" aria-hidden="true">${Array.from({length: n}, (_, k) => { const a0 = -90 + 360 * k / n, a1 = a0 + 360 / n;
    return `<path d="M22 22 L${d(a0)} A20 20 0 0 1 ${d(a1)} Z" ${k === i ? 'fill="#6DC043" stroke="#2F6B22" stroke-width="2.5"' : 'fill="#FBF7EA" stroke="#5E8F4A" stroke-width="2" stroke-dasharray="4 3"'} stroke-linejoin="round"/>`; }).join("")}</svg>`;
}
/* lá sen của một nhóm trên máy chiếu: vòng màu nhóm quanh lá = tỷ lệ đã ghép */
const laNhom = (tl, mau) => `<svg viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="52" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="5"/>
  <circle cx="55" cy="55" r="52" fill="none" stroke="${mau}" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="${Math.round(tl * 100)} 100" transform="rotate(-90 55 55)"/>
  <path d="M55 55 L66.9 10.6 A46 46 0 1 1 43.1 10.6 Z" fill="#7BCB4C" stroke="#2F6B22" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const cham = n => `<span class="cham" style="background:${mauNhom(n)}"></span>`;
/* mã số sinh viên tự nhập: "nhóm_họ tên", ví dụ "3_Nguyễn Văn An" → {nhom, ten, id};
   id (không dấu, nối gạch) là khóa của người chơi trên đường nối */
function docMaSo(s){
  const m = String(s || "").normalize("NFC").trim().match(/^(\d{1,2})\s*[_\-.,\s]\s*(.+)$/u);
  if(!m) return null;
  const nhom = +m[1], ten = m[2].replace(/[_\s]+/g, " ").trim().split(" ").map(w => w.charAt(0).toLocaleUpperCase("vi") + w.slice(1).toLocaleLowerCase("vi")).join(" ");
  const goc = ten.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[đĐ]/g, "d").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  if(!(nhom > 0) || !/\p{L}/u.test(ten) || !goc) return null;
  return {nhom, ten, id: nhom + "-" + goc, ms: nhom + "_" + ten};
}

const CAU = new Map((DB ? DB.cau : []).map(c => [c.id, c]));

/* Chọn câu vừa khít số người (câu chính trước, thiếu thì thêm câu dự trữ ngắn trước),
   rồi phát mảnh sao cho các mảnh của một câu nằm ở các nhóm khác nhau. */
function phatManh(nguoi, buoi, daDung){
  const kho = khoBuoi(buoi, daDung);
  const chinh = xao(kho.filter(c => !c.dt)), du = kho.filter(c => c.dt).sort((a, b) => a.st - b.st);
  let con = nguoi.length; const chon = [], daManh = new Set();
  /* hai câu có mảnh giống nhau (giáo trình dẫn một câu ở hai chỗ, dài ngắn khác nhau) không phát chung một vòng */
  const chuan = m => m.toLowerCase().replace(/[^\p{L}\p{N} ]/gu, "").replace(/\s+/g, " ").trim();
  const nhat = (ds, chat) => { for(const c of ds){ if(con < 2) return; if(chon.includes(c) || c.m.some(m => daManh.has(chuan(m)))) continue;
    const n = c.m.length; if(n <= con && !(chat && con - n === 1)){ chon.push(c); con -= n; c.m.forEach(m => daManh.add(chuan(m))); } } };
  nhat(chinh, true); nhat(du, true); nhat(chinh, false); nhat(du, false);
  if(con === 1){   /* lẻ một người: đổi một câu hai mảnh lấy một câu ba mảnh còn trống */
    const ba = chinh.concat(du).find(c => c.m.length === 3 && !chon.includes(c)
      && !c.m.some(m => daManh.has(chuan(m)))), hai = chon.findIndex(c => c.m.length === 2);
    if(ba && hai >= 0){ chon[hai].m.forEach(m => daManh.delete(chuan(m))); chon.splice(hai, 1, ba); ba.m.forEach(m => daManh.add(chuan(m))); con = 0; }
  }

  const nhom = new Map(), nhomCua = {};
  xao(nguoi.slice()).forEach(p => { nhomCua[p.id] = p.nhom; if(!nhom.has(p.nhom)) nhom.set(p.nhom, []); nhom.get(p.nhom).push(p.id); });
  chon.sort((a, b) => b.m.length - a.m.length);
  const daMa = new Set(), maMoi = () => { let m; do{ m = String(100 + Math.floor(Math.random() * 900)); }while(daMa.has(m)); daMa.add(m); return m; };
  const manh = {}, cau = [];
  chon.forEach((c, ci) => {
    const daCo = new Set(), ai = [];
    for(let i = 0; i < c.m.length; i++){
      let tot = null;
      nhom.forEach((ds, g) => { if(!ds.length) return; const k = [daCo.has(g) ? 0 : 1, ds.length, Math.random()];
        if(!tot || k[0] > tot.k[0] || (k[0] === tot.k[0] && (k[1] > tot.k[1] || (k[1] === tot.k[1] && k[2] > tot.k[2])))) tot = {g, k}; });
      daCo.add(tot.g); ai.push(nhom.get(tot.g).pop());
    }
    ai.forEach((s, i) => manh[s] = [ci, i, maMoi(), nhomCua[s]]);
    cau.push({id: c.id, s: ai});
  });
  const trong = {}; nhom.forEach(ds => ds.forEach(s => trong[s] = nhomCua[s]));
  const ten = {}; nguoi.forEach(p => ten[p.id] = p.ten);
  return {cau, manh, trong, ten};
}

/* bảng một vòng: tỷ lệ thành viên ghép xong, bằng nhau thì nhóm hoàn tất sớm hơn xếp trên */
function bangVong(chia, ghep, batDau){
  const g = {};
  Object.entries(chia.manh).forEach(([s, [ci, , , n]]) => {
    const o = g[n] || (g[n] = {nhom: n, co: 0, xong: 0, cuoi: null}); o.co++;
    const x = ghep[ci]; if(x){ o.xong++; const t = x.luc - batDau; o.cuoi = o.cuoi == null ? t : Math.max(o.cuoi, t); }
  });
  return Object.values(g).map(o => Object.assign(o, {tl: o.co ? o.xong / o.co : 0}))
    .sort((a, b) => b.tl - a.tl || (a.cuoi ?? 1e12) - (b.cuoi ?? 1e12) || a.nhom - b.nhom);
}

    x.tl += o.tl; x.cuoi += o.cuoi ?? 1e9; x.xong += o.xong; x.co += o.co; }));

}

/* ============================================================
   ĐƯỜNG NỐI GIỮA CÁC MÁY (chép từ game Nhanh! / Thước Kẻ — MQTT công cộng,
   mỗi đường dẫn là một "tài liệu" giữ lại trên máy chủ; ?noi=bc để
   các tab/khung của một trình duyệt nói chuyện trực tiếp, không cần mạng)
   ============================================================ */
const MAY_CHU = [{url: "wss://broker.emqx.io:8084/mqtt"}, {url: "wss://broker.hivemq.com:8884/mqtt"}, {url: "wss://public.cloud.shiftr.io/mqtt", user: "public", pass: "public"}];
const KHONG_GIAN = "hanu-pol1001/mot-nua/v1/";
function taoMQTT(cfg, onMsg, onState){
  let ws = null, ok = false, buf = new Uint8Array(0), pid = 0, ping = null, lui = 1000;
  const subs = new Set(), cho = new Map(), te = new TextEncoder(), td = new TextDecoder();
  const vlen = n => { const o = []; do{ let b = n % 128; n = Math.floor(n / 128); if(n > 0) b |= 128; o.push(b); }while(n > 0); return o; };
  const chu = x => { const b = te.encode(x); return [b.length >> 8, b.length & 255].concat(Array.from(b)); };
  const goi = (h, body) => { if(!ws || ws.readyState !== 1) return false; ws.send(new Uint8Array([h].concat(vlen(body.length), body))); return true; };
  const moiId = () => { pid = pid % 65535 + 1; return pid; };
  function dangKy(f){ const id = moiId(); goi(0x82, [id >> 8, id & 255].concat(chu(f), [1])); return id; }
  function ketNoi(){
    try{ ws = new WebSocket(cfg.url, ["mqtt"]); }catch(e){ henLai(); return; }
    ws.binaryType = "arraybuffer";
    ws.onopen = () => { let co = 0x02; let pl = chu("mn" + Math.random().toString(36).slice(2, 12));
      if(cfg.user){ co |= 0x80; pl = pl.concat(chu(cfg.user)); } if(cfg.pass){ co |= 0x40; pl = pl.concat(chu(cfg.pass)); }
      goi(0x10, chu("MQTT").concat([4, co, 0, 30], pl)); };
    ws.onmessage = e => { const d = new Uint8Array(e.data), n = new Uint8Array(buf.length + d.length); n.set(buf); n.set(d, buf.length); buf = n; tach(); };
    ws.onclose = () => { const truoc = ok; ok = false; ws = null; buf = new Uint8Array(0); clearInterval(ping); cho.forEach(f => f(false)); cho.clear(); if(truoc) onState(); henLai(); };
    ws.onerror = () => { try{ ws && ws.close(); }catch(e){} };
  }
  function henLai(){ setTimeout(ketNoi, lui); lui = Math.min(lui * 2, 15000); }
  function tach(){ for(;;){ if(buf.length < 2) return; let m = 1, len = 0, i = 1, b;
    do{ if(i >= buf.length) return; b = buf[i++]; len += (b & 127) * m; m *= 128; }while(b & 128);
    if(buf.length < i + len) return; const h = buf[0], p = buf.slice(i, i + len); buf = buf.slice(i + len); try{ xuLy(h, p); }catch(e){} } }
  function xuLy(h, p){ const t = h >> 4;
    if(t === 2){ if(p[1] === 0){ ok = true; lui = 1000; subs.forEach(dangKy); clearInterval(ping); ping = setInterval(() => goi(0xC0, []), 25000); onState(); } else { try{ ws.close(); }catch(e){} } }
    else if(t === 3){ const qos = (h >> 1) & 3, tl = (p[0] << 8) | p[1]; const topic = td.decode(p.subarray(2, 2 + tl)); let o = 2 + tl;
      if(qos > 0){ const id = (p[o] << 8) | p[o + 1]; o += 2; goi(0x40, [id >> 8, id & 255]); } onMsg(topic, td.decode(p.subarray(o))); }
    else if(t === 4 || t === 9){ const id = (p[0] << 8) | p[1], f = cho.get(id); if(f){ cho.delete(id); f(true); } } }
  const doi = (id, r, ms) => { cho.set(id, r); setTimeout(() => { if(cho.delete(id)) r(false); }, ms); };
  return { get ok(){ return ok; }, batDau: ketNoi,
    sub(f){ if(subs.has(f)) return Promise.resolve(true); subs.add(f); if(!ok) return Promise.resolve(false); return new Promise(r => doi(dangKy(f), r, 4000)); },
    pub(topic, text){ return new Promise(r => { if(!ok) return r(false); const id = moiId();
      const pl = chu(topic).concat([id >> 8, id & 255], Array.from(te.encode(text))); if(!goi(0x33, pl)) return r(false); doi(id, r, 6000); }); } };
}
const SYNC = (() => {
  const kho = new Map(), nghe = new Set(), may = []; let bc = null, batDauLuc = 0, baoDoi = () => {};
  const dc = p => KHONG_GIAN + p;
  const khop = (f, t) => { if(f.endsWith("/+")){ const g = f.slice(0, -1); return t.startsWith(g) && t.length > g.length && !t.slice(g.length).includes("/"); } return f === t; };
  function nhan(t, text){ if(!t.startsWith(KHONG_GIAN) || !text) return; let r; try{ r = JSON.parse(text); }catch(e){ return; }
    if(!r || typeof r.t !== "number" || typeof r.v !== "object") return; const cu = kho.get(t); if(cu && cu.t >= r.t) return;
    kho.set(t, r); nghe.forEach(l => { if(khop(l.f, t)) try{ l.cb(); }catch(e){ console.error(e); } }); }
  const coMay = () => CHI_BC || may.some(m => m.ok);
  const cho = (dk, ms) => new Promise(r => { if(dk()) return r(true); const t0 = Date.now(), iv = setInterval(() => { if(dk()){ clearInterval(iv); r(true); } else if(Date.now() - t0 > ms){ clearInterval(iv); r(false); } }, 100); });
  async function sub(f){ if(bc) bc.postMessage({k: "hoi", f}); await Promise.all(may.map(m => m.sub(f))); }
  function snap(p){ const t = dc(p), r = kho.get(t); return {exists: !!r, data: () => r ? r.v : undefined}; }
  let tCuoi = 0;
  /* ghi ngay vào máy mình (giao diện không phải chờ mạng), rồi gửi đi; mất mạng thì thử lại */
  async function ghi(p, v){ const t = dc(p), cu = kho.get(t); tCuoi = Math.max(Date.now(), tCuoi + 1, cu ? cu.t + 1 : 0); const moc = tCuoi, tx = JSON.stringify({t: moc, v});
    nhan(t, tx); if(bc) bc.postMessage({k: "pub", t, tx}); if(CHI_BC) return;
    for(let lan = 0; lan < 10; lan++){
      if(!coMay()) await cho(coMay, 8000);
      const kq = await Promise.all(may.map(m => m.pub(t, tx))); if(kq.some(Boolean)) return;
      await new Promise(r => setTimeout(r, 1500)); const nay = kho.get(t); if(nay && nay.t !== moc) return; }
    throw new Error("không gửi được"); }
  function ngheDoc(p, cb){ const t = dc(p), l = {f: t, cb: () => cb(snap(p))}; nghe.add(l); sub(t); if(kho.has(t)) setTimeout(() => { if(nghe.has(l)) l.cb(); }, 0); return () => nghe.delete(l); }
  function ngheBo(p, cb){ const f = dc(p) + "/+", g = f.slice(0, -1);
    const l = {f, cb: () => { const docs = []; kho.forEach((r, t) => { if(khop(f, t)) docs.push({id: t.slice(g.length), data: () => r.v}); }); cb({docs}); }};
    nghe.add(l); sub(f); setTimeout(() => { if(nghe.has(l)) l.cb(); }, 0); return () => nghe.delete(l); }
  return { coMay, dangThu: () => !coMay() && Date.now() - batDauLuc < 9000,
    batDau(onDoi){ baoDoi = onDoi || baoDoi; batDauLuc = Date.now();
      if("BroadcastChannel" in window){ bc = new BroadcastChannel("mot-nua");
        bc.onmessage = e => { const d = e.data || {}; if(d.k === "pub") nhan(d.t, d.tx); else if(d.k === "hoi") kho.forEach((r, t) => { if(khop(d.f, t)) bc.postMessage({k: "pub", t, tx: JSON.stringify(r)}); }); }; }
      if(!CHI_BC) MAY_CHU.forEach(c => { const m = taoMQTT(c, nhan, () => baoDoi()); may.push(m); m.batDau(); });
      setTimeout(() => baoDoi(), 9500); baoDoi(); },
    doc: p => ({ set: v => ghi(p, v), onSnapshot: cb => ngheDoc(p, cb) }),
    collection: p => ({ onSnapshot: cb => ngheBo(p, cb) }) };
})();
let MANG = false;
function batMang(){ if(MANG) return; MANG = true; SYNC.batDau(veMang); setInterval(veMang, 1500); }
function veMang(){ const on = SYNC.coMay(), dang = !on && SYNC.dangThu();
  const html = `<span class="dot ${on ? "on" : dang ? "dang" : ""}"></span>` + (on ? (CHI_BC ? "Nối trong máy" : "Đã nối mạng") : dang ? "Đang nối…" : "Mất mạng — kiểm tra Wi-Fi");

function docMot(p, ms){ return new Promise(r => { let xong = false, huy = () => {};

const DUONG = (ma, phien) => { const g = `r/${ma}-${phien}`; return {

    than = `<h1 class="giua-chu">${ket ? "Kết thúc" : `Hết vòng ${c.vong}`}</h1>
      ${hang >= 0 ? `<div class="hang-la">${LA("#7BCB4C")}<div><span>Nhóm ${M.nhom} xếp</span><span class="lon">hạng ${hang + 1}</span><span>trên ${bang.length} nhóm</span></div></div>
        <p class="mo giua-chu">${ket ? "Kết quả chung" : `Vòng ${c.vong}`} — xem bảng trên máy chiếu.</p>` : ""}
      ${t && M.ghep[t.ci] ? cauDuHTML(t, true) : t ? `<div class="the"><b>Câu của vòng này</b><p>“${esc(t.cau.m.join(" "))}”</p><p class="mo nho">Hồ Chí Minh: <i>Toàn tập</i>, ${esc(t.cau.tt)} · ${esc(t.cau.y)}</p></div>` : ""}
      ${ket ? "" : `<div class="cho-pill">Chờ giảng viên phát mảnh vòng ${c.vong + 1}.</div>`}`;
  }
  $("#s-dt").innerHTML = `<div class="man">${thanh}${than}</div>`;
  veMang(); dongHoPhone();
  const g = $("#p-ghep"); if(g) g.onclick = ghepThu;
  const xoa = $("#p-xoa"); if(xoa) xoa.onclick = () => { M.nhapDo = []; $$(".p-ma").forEach(e => e.value = ""); const d = $(".p-ma"); if(d) d.focus(); };
  $$(".p-ma").forEach((e, j, all) => { e.oninput = () => { e.value = e.value.replace(/\D/g, "").slice(0, 3); (M.nhapDo = M.nhapDo || [])[j] = e.value;
    if(e.value.length === 3 && all[j + 1]) all[j + 1].focus(); }; e.onkeydown = ev => { if(ev.key === "Enter") ghepThu(); }; });
  const x = $("#p-xong"); if(x) x.onclick = () => { M.doc[M.cfg.phien + ":" + M.cfg.vong] = 1; luu("mn-doc", M.doc); M.docDen = 0; vePhone(); };
}
function ghepThu(){
  const t = cauCuaToi(); if(!t || M.khoa > Date.now()) return;
  const ma = $$(".p-ma").map(e => e.value.trim());
  if(ma.some(m => m.length !== 3)){ bao("Nhập đủ mã ba chữ số"); return; }
  const ai = ma.map(m => Object.keys(M.chia.manh).find(s => M.chia.manh[s][2] === m));
  const dung = ai.every(s => s && s !== M.id && M.chia.manh[s][0] === t.ci) && new Set(ai).size === ai.length;
  M.nhapDo = [];
  if(!dung){ M.khoa = Date.now() + CH.khoaSai * 1000; vePhone(); return; }
  M.docDen = Date.now() + CH.khoaDoc * 1000;
  ghi(DUONG(M.ma, M.cfg.phien).ghepMot(M.cfg.vong, t.ci), {luc: bayGio(), boi: M.id});
}

/* ============================================================
   XEM THỬ TRÊN MỘT MÁY (máy chiếu + điện thoại trong khung, ?noi=bc)
   ============================================================ */
function veThu(){
  $("#s-thu").innerHTML = `<div class="man"><button class="nut phu nho" id="x-ve">← Trang đầu</button><h2>Xem thử trên một máy</h2>
    <p>Máy chiếu và các điện thoại mở trong cùng một trang, nói chuyện với nhau ngay trong trình duyệt, không cần mạng.
      Bấm <b>Phát mảnh</b> trên khung máy chiếu, rồi đọc mảnh, nhập mã ở từng điện thoại.</p>
    <div class="bang-nhap"><label class="o" for="x-buoi">Buổi</label><select id="x-buoi">${BUOI.map(b => `<option value="${b}"${b === 8 ? " selected" : ""}>${esc(tenBuoi(b))}</option>`).join("")}</select>
    <label class="o" for="x-n">Số điện thoại (2–16)</label><input id="x-n" type="number" min="2" max="16" value="8">
    <label class="o" for="x-g">Số nhóm</label><input id="x-g" type="number" min="1" max="6" value="3"></div>
    <div class="hang-nut"><button class="nut nut-lon" id="x-mo">Mở</button></div></div>`;
  $("#x-ve").onclick = veDau;
  $("#x-mo").onclick = () => {
    const n = Math.max(2, Math.min(16, +$("#x-n").value || 8)), g = Math.max(1, Math.min(6, +$("#x-g").value || 3)), b = +$("#x-buoi").value;
    const ma = String(9000 + Math.floor(Math.random() * 999)), goc = location.href.split("?")[0].split("#")[0];
    const dt = Array.from({length: n}, (_, i) => `${goc}?noi=bc&thu=1&ma=${ma}&ms=${encodeURIComponent(`${i % g + 1}_Sinh viên ${i + 1}`)}`);
    $("#s-thu").innerHTML = `<div class="thu-luoi"><iframe class="may-chieu" src="${goc}?noi=bc&thu=1&chieu=${ma}&buoi=${b}" title="Máy chiếu"></iframe>
      ${dt.map((u, i) => `<iframe src="${u}" title="Điện thoại ${i + 1}"></iframe>`).join("")}</div>`;
  };
}
